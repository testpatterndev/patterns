name: Validate patterns

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'docs/identifiers.md'
  push:
    branches-ignore: [main]   # main is gated inside compile-and-publish.yml before publishing
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'docs/identifiers.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Unit tests (customisation + identifier-format registry)
        run: npm run test:customisation && npm run test:identifiers && npm run test:classification

      - name: Compile (validates required fields + keyword-list references)
        run: npm run compile

      - name: CI gate (double-escape / |top500 / validator-ref / test-case execution)
        run: npm run check

      - name: Verify pattern test cases
        run: node scripts/verify-pattern-testcases.mjs --all

      - name: Catalog quality gate (ratcheted, see scripts/verify-catalog-quality.mjs)
        run: npm run check:quality
