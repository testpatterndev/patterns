name: Compile patterns and publish to KV

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/compile.js'
      - 'scripts/build-dictionary-manifest.mjs'
      - '.github/workflows/compile-and-publish.yml'

jobs:
  compile-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Validate patterns (gate before publish)
        run: npm run check:source

      - name: Verify pattern test cases
        run: node scripts/verify-pattern-testcases.mjs --all

      - name: Catalog quality gate (gate before publish)
        run: npm run check:quality

      # testpattern.dev is private: TESTPATTERN_READ_TOKEN is a read-only token for it.
      - name: Check out the testpattern SIT evaluator
        uses: actions/checkout@v4
        with:
          repository: testpatterndev/testpattern.dev
          token: ${{ secrets.TESTPATTERN_READ_TOKEN }}
          path: .testpattern

      - name: SIT evaluator gate (gate before publish)
        env:
          TESTPATTERN_PATTERNS_ROOT: ${{ github.workspace }}
        run: |
          npm ci --prefix .testpattern --no-audit --no-fund
          node .testpattern/scripts/check-sit-evaluator-testcases.js --strict --report "$RUNNER_TEMP/sit-evaluator-testcases.json"

      - name: Rebuild dictionary manifest
        run: npm run build-manifest

      - name: Compile patterns
        run: npm run compile

      - name: Verify complete compiled catalog
        run: npm run check:compiled

      - name: Prepare compact KV payload
        run: |
          node -e "
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('patterns.json', 'utf8'));
          fs.writeFileSync('patterns.kv.json', JSON.stringify(catalog));
          "

      - name: Verify KV payload under 25 MiB
        run: |
          node -e "
          const fs = require('fs');
          const size = fs.statSync('patterns.kv.json').size;
          const limit = 25 * 1024 * 1024;
          console.log('patterns.kv.json bytes:', size, 'limit:', limit, 'headroom:', limit - size);
          if (size >= limit) {
            console.error('KV payload exceeds 25 MiB — cannot publish');
            process.exit(1);
          }
          "

      - name: Publish compiled patterns to KV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: kv:key put --namespace-id=${{ secrets.PATTERNS_KV_NAMESPACE_ID }} "compiled-patterns" --path=patterns.kv.json
