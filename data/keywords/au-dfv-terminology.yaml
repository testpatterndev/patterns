schema: testpattern/v1
name: Australian Domestic and Family Violence Terminology
slug: au-dfv-terminology
type: keyword_dictionary
description: >-
  Domestic and family violence (DFV) practice, legal and service vocabulary used across
  Australian jurisdictions. Intended as corroborative evidence for DFV record classifiers
  (case notes, protection orders, police referrals, risk assessments, leave records), not
  as a standalone detector: every term also appears in public awareness and policy text.
  Short acronyms are case-sensitive to avoid matching ordinary words.
jurisdictions:
  - au
data_categories:
  - pii
  - law-enforcement
keywords:
  # Core DFV terms
  - domestic violence
  - family violence
  - domestic and family violence
  - family and domestic violence
  - intimate partner violence
