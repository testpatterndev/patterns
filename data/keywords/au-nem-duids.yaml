schema: testpattern/v1
name: NEM Registered DUIDs
slug: au-nem-duids
type: keyword_dictionary
description: >-
  All Dispatchable Unit Identifiers (DUIDs) registered in the Australian National
  Electricity Market, extracted from the public AEMO NEM Registration and Exemption
  List ('PU and Scheduled Loads' and 'Wholesale Demand Response Units' tabs,
  July 2026 edition; 596 unique DUIDs). DUIDs are public identifiers - this
  dictionary exists as corroborative evidence for energy-market patterns
  (au-nem-bid-file, au-nem-duid, au-forward-curve-artefact), never as a standalone
  sensitive-term list. Regenerate from the registration list on refresh; filter a
  participant subset for customer overlays.
