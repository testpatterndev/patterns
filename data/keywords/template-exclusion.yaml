schema: testpattern/v1
name: Noise and Template Exclusion
slug: template-exclusion
type: keyword_dictionary
description: >-
  Noise exclusion and template/test-data suppression keywords for AND NOT gates.
  Multi-word and explicit fixture phrases preferred over bare tokens so legitimate
  content is not suppressed (e.g. pathology "sample", product "example", proprietary
  "training data", operational "documentation"). Includes Spanish fixture phrases
  for MX and other LATAM template prose. Used as shared exclusion evidence in
  pattern match trees.
jurisdictions:
  - global
data_categories:
  - exclusion
keywords:
  # Explicit template / fixture framing (English)
  - template
  - placeholder
  - dummy
  - mock
  - tutorial
  - demo
  - boilerplate
  - training exercise
  - test data
  - sample data
  - sample file
  - sample only
  - sample template
  - as a sample
  - training sample
  - lab sample data
  - example only
  - example data
  - worked example
  - example.com
  - training example
  - training lab
  - documentation only
  - documentation example
  - docs template
  - training documentation
  - sample training data
  - fictional
  - redacted example
  - lorem ipsum
  # Common fixture lead-ins (colon forms used in training corpora; not bare "sample"/"example")
  - 'sample:'
  - 'example:'
  - '(sample)'
  - '(example)'
  # Spanish / LATAM fixture framing (MX passport and training materials)
  - solo ejemplo
  - datos de ejemplo
  - muestra de prueba
  - plantilla
  - datos de prueba
  - documentación de ejemplo
  - ficticio
  - ficticia
  - relleno
  - de prueba
  - valor de ejemplo
created: '2026-03-16'
updated: '2026-09-24'
author: testpattern-community
license: MIT
changelog:
  - version: '2.1.0'
    date: '2026-09-24'
    description: >-
      Remove the natural-language discourse markers "for example", "por ejemplo" and bare "ejemplo".
      Because this dictionary is an AND NOT gate on every tier, any genuine record with one of these
      phrases within the proximity window was suppressed. Base rate: "for example" appears in 2.7% of
      332 random Wikipedia articles and 51% of 37 domain articles, suppressed 7-14% of primary hits on
      the protection-order classifiers, and occurs twice in the instruction text of the published Qld
      DV1 court form. It contributed nothing on the negative side: 0 of 4,352 should_not_match values
      and 0 of 2,248 harness negative documents relied on it, and verify-pattern-testcases --all has
      no new failures without these terms. Fixture phrasing stays covered by "example only",
      "example data", "example:", "solo ejemplo", "datos de ejemplo" and "valor de ejemplo".
  - version: '2.0.0'
    date: '2026-07-18'
    description: >-
      Redesign for quality bar: remove bare collision terms (sample, example, training data,
      documentation) that vetoed legitimate pathology/specimen/malware samples, product examples,
      proprietary training-data inventories, and operational documentation. Prefer multi-word fixture
      phrases; add Spanish LATAM fixture terms for mx-passport and related training prose.
