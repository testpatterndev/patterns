  description: "Quality pass (2026-09-24): rebuilt tiers - the old tiers were corroborated by the primary's own phrases and no positive reached an enforce tier. 75 now needs a populated applicant identifier and 85 needs applicant fields plus a household-finance field plus aid evidence. Primary tightened (dropped bare 'financial aid', 'student loan', 'grant application', 'education funding'). Bare-phrase tests replaced with populated records plus policy, blank-form and news decoys. Regulations: added Privacy Act 1988 (Cth), NDB Scheme (Cth), FERPA and Higher Education Support Act 2003 (Cth); frameworks added; expired HESF 2015 reference replaced."
- version: 1.2.1
