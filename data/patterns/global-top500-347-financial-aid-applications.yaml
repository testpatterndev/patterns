schema: testpattern/v1
name: Financial aid applications
slug: global-top500-347-financial-aid-applications
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies individual student financial aid applications - financial aid applications and award packages, student aid or loan applications, FAFSA, scholarship and bursary applications, fee waiver requests and hardship grant applications - when the phrase sits with populated applicant identifiers and household-finance fields. Financial and education records under applicable privacy law.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: financial aid application/award/package/form, aid application, student aid/loan application, FAFSA, scholarship or bursary application, fee waiver request/application, tuition assistance (application), need-based aid, hardship grant/fund application. 65 (discovery only): phrase alone. 75: phrase plus a populated applicant/student identifier field. 85: identifier field plus a populated finance field (household/parental/taxable income, assets, dependants, household size, EFC/SAI, Centrelink payment or CRN, concession card, TFN, award amount, amount requested) plus independent aid evidence (Pell Grant, Youth Allowance, Austudy, Health Care Card, financial hardship, cost of attendance, verification documents, tax return, award letter). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:financial\s+aid\s+(?:application|award|package|form)|aid\s+application|student\s+(?:aid|loan)\s+application|FAFSA|scholarship\s+application|bursary\s+application|fee\s+waiver\s+(?:request|application)|tuition\s+assistance(?:\s+application)?|need[\s-]+based\s+aid|hardship\s+(?:grant|fund)\s+application)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated applicant identifier; 85 also needs a household-finance field and aid evidence. Scholarship web pages, aid guides and funding announcements stay at 65.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - GDPR
  - FERPA
  - Higher Education Support Act 2003 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
    - Pell Grant
    - Youth Allowance
    - Austudy
    - financial hardship
    - cost of attendance
    - award letter
  proximity: 300
test_cases:
  should_match:
    - value: "Financial aid application - 2026/27\nStudent name: Avery Teston\nStudent ID: 40912876\nHousehold income: $48,200\nDependants: 2\nCentrelink payment: Youth Allowance\nAmount requested: $3,500\nVerification documents: tax return attached (financial hardship statement)"
      description: Populated aid application with applicant, finance fields and aid evidence (85)
      synthetic: true
    - value: "Scholarship application received\nApplicant name: Casey Rourke\nApplication number: SCH-26-04417"
      description: Scholarship application with labelled applicant fields only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "student grant"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how financial aid application files are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Bursary application form\nStudent name: ____________________\nStudent ID: ____________________\nHousehold income: ____________________\nAmount requested: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: the university doubled its hardship grant pool and says a scholarship application now takes ten minutes, with fee waiver requests reviewed weekly."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Common words and phrases related to financial aid applications appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The detector identifies financial aid, scholarship, bursary and fee-waiver application language and enforces only when populated applicant identifier fields sit nearby; phrase-only text stays at 65 discovery. Disclosure can reveal income constraints, dependency information, requested support, debt, and applicant identity, enabling targeted fraud, stigma, coercion, or unfair decisions about the student and household. The normal application creates serious financial and privacy harm but remains a bounded case rather than access to accounts or an institution-wide applicant database. Risk 8 and SENSITIVE Financial are justified; PROTECTED would require bulk applicant holdings, live banking credentials, or significant large-scale compromise.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Financial, and the Medium tier for a
    financial-aid application. PROTECTED is not met because an ordinary application does not establish bank access, bulk
    vulnerable-person exposure, or major institution-wide financial damage.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Medium classification and Medium Financial DLM reflect combined applicant, household, debt, and assistance
      information with serious but contained disclosure consequences.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_financial_aid_applications
      matches:
        - ref: Regex_global_top500_347_financial_aid_applications_applicant_fields
        - ref: Regex_global_top500_347_financial_aid_applications_finance_fields
        - ref: Keyword_global_top500_347_financial_aid_applications_aid_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_347_financial_aid_applications_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_financial_aid_applications
      matches:
        - ref: Regex_global_top500_347_financial_aid_applications_applicant_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_347_financial_aid_applications_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_financial_aid_applications
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_financial_aid_applications
      pattern: (?i)\b(?:financial\s+aid\s+(?:application|award|package|form)|aid\s+application|student\s+(?:aid|loan)\s+application|FAFSA|scholarship\s+application|bursary\s+application|fee\s+waiver\s+(?:request|application)|tuition\s+assistance(?:\s+application)?|need[\s-]+based\s+aid|hardship\s+(?:grant|fund)\s+application)\b
    - id: Regex_global_top500_347_financial_aid_applications_applicant_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|student(?:\s+name)?|pupil|child|candidate(?:\s+name)?|EQ\s*ID|LUI|USI|year\s+level|grade\s+level|parent(?:\s+name)?|guardian|carer|(?:student|candidate|enrolment|applicant|file)\s*(?:no\.?|number|ID)|home\s+group|class|applicant(?:\s+name)?|application\s*(?:no\.?|number|ID))(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_347_financial_aid_applications_finance_fields
      pattern: (?i)\b(?:household\s+income|(?:gross|annual|parental|family|taxable)\s+income|income|assets|dependants?|dependents?|household\s+size|EFC|expected\s+family\s+contribution|SAI|student\s+aid\s+index|Centrelink\s+(?:payment|CRN)|concession\s+card|TFN|tax\s+file\s+number|award\s+amount|amount\s+requested)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_347_financial_aid_applications_aid_evidence
      groups:
        - match_style: word
          terms:
            - Pell Grant
            - Youth Allowance
            - Austudy
            - Health Care Card
            - financial hardship
            - cost of attendance
            - verification documents
            - tax return
            - award letter
      strength: specific
    - id: Keyword_global_top500_347_financial_aid_applications_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
