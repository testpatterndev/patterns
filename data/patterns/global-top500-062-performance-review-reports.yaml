schema: testpattern/v1
name: Performance review reports
slug: global-top500-062-performance-review-reports
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects performance reviews, appraisals, performance and development agreements and performance improvement plans for an identified employee, with a rating, review period or review date.
operation: >-
  Primary: a performance review phrase (performance review/appraisal/evaluation, performance improvement plan, performance and development plan/agreement, positive performance management, employee rating). 75 tier requires a populated person field (employee/staff name or number, reviewee/appraisee, position number or title, work unit) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated review detail (rating value, review/appraisal period, or review date) and an independent corroborative term (reviewer, supervisor, objectives, strengths, development areas). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:performance\s+(?:review|appraisal|evaluation|improvement\s+plan|development\s+(?:plan|agreement)|and\s+development\s+(?:plan|agreement|review))|positive\s+performance\s+management|employee\s+rating)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Public Sector Act 2022 (Qld)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - reviewer
    - supervisor
    - objectives
    - strengths
    - development areas
    - self-assessment
    - capability
    - feedback
    - KPI
    - sign-off
  proximity: 300
test_cases:
  should_match:
    - value: "Performance and development agreement - annual review\nEmployee name: Avery Teston\nPosition number: 30012345\nReview period: 2025-26\nOverall rating: 2 out of 5 (partially meets)\nSupervisor: Jordan Staffson. Strengths: stakeholder work. Development areas: timeliness of reports."
      description: '85: Annual review with employee, period, rating and supervisor comments'
      synthetic: true
    - value: "Performance appraisal FY2026\nEmployee ID: E-0048213\nAppraisal period: 01/07/2025 to 30/06/2026\nRating: Exceeds\nReviewer: Casey Managerson; self-assessment attached."
      description: '85: Appraisal with employee ID, period and rating'
      synthetic: true
    - value: "Performance improvement plan\nStaff member: Morgan Teston\nThe plan sets three objectives for the next 8 weeks with fortnightly check-ins."
      description: '75: PIP naming the staff member, no rating or period'
      synthetic: true
  should_not_match:
    - value: Under the positive performance management directive, managers hold a performance review with each employee at least annually and agree development goals.
      description: Guidance text - must stay below 75
    - value: "Performance review form\nEmployee name: __________\nReview period: __________\nOverall rating: [select 1-5]"
      description: Blank review form - must stay below 75
    - value: 'Training module: how to write a performance appraisal. Participants practise giving feedback on goals and ratings.'
      description: Training material - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_062_performance_review_reports_primary
      matches:
        - ref: Regex_top500_062_performance_review_reports_person_field
        - ref: Regex_top500_062_performance_review_reports_record_detail
        - ref: Keyword_top500_062_performance_review_reports_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_062_performance_review_reports_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_062_performance_review_reports_primary
      matches:
        - ref: Regex_top500_062_performance_review_reports_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_062_performance_review_reports_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_062_performance_review_reports_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_062_performance_review_reports_primary
      pattern: >-
        (?i)\b(?:performance\s+(?:review|appraisal|evaluation|improvement\s+plan|development\s+(?:plan|agreement)|and\s+development\s+(?:plan|agreement|review))|positive\s+performance\s+management|employee\s+rating)\b
    - id: Regex_top500_062_performance_review_reports_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit|reviewee|appraisee)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_062_performance_review_reports_record_detail
      pattern: >-
        (?i)\b(?:overall\s+|performance\s+)?rating\s*[:\-]\s*(?:[1-5](?:\.\d)?(?:\s*(?:/|out\s+of)\s*[1-5])?\b|exceeds|meets|partially\s+meets|does\s+not\s+meet|below\s+expectations|outstanding|satisfactory|unsatisfactory|needs\s+improvement|highly\s+effective|effective|developing)|\b(?:review|appraisal|assessment|performance|reporting)\s+period\s*[:\-]?\s*(?:(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|(?:FY\s?)?20\d{2}\s?[/-]\s?\d{2,4})|\b(?:review\s+date|date\s+of\s+review|meeting\s+date)\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})
  keywords:
    - id: Keyword_top500_062_performance_review_reports_corroborative
      groups:
        - match_style: word
          terms:
            - reviewer
            - supervisor
            - objectives
            - strengths
            - development areas
            - self-assessment
            - capability
            - feedback
            - text: KPI
              case_sensitive: true
            - sign-off
      strength: specific
    - id: Keyword_top500_062_performance_review_reports_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a individual performance review, appraisal or performance improvement plan about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Disclosure exposes an identifiable employee's ratings, performance concerns and development needs, with consequences for workplace treatment and career. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
