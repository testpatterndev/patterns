updated: 2026-09-24
changelog:
  - version: 1.1.0
    date: 2026-09-24
    note: Add a purview block. The primary alone is discovery (65); 75 needs a populated donor or test field; 85 needs a donor field plus a test field or quantitative reading. Add template and policy exclusions. Replace the phrase positives with populated records and add blank-form and procedure decoys.
  - version: 1.0.1
    date: 2026-08-03
    note: Label-taxonomy fix - replace the list-shaped sensitivity_labels (bare SENSITIVE) with the canonical jurisdiction map; qgiscf_dlm SENSITIVE Personal-Privacy (worker health information), matching the au-qld-health family.
  - version: 1.0.0
    date: 2026-07-25
    note: Initial draft - AU workplace health coverage gap (drug and alcohol testing records).
