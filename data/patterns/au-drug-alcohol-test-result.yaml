schema: testpattern/v1
name: Australian Drug and Alcohol Test Result
slug: au-drug-alcohol-test-result
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects Australian workplace drug and alcohol testing records - screening and
  confirmatory results under AS/NZS 4308 (urine) and AS/NZS 4760 (oral fluid),
  laboratory result phrasing (non-negative, cut-off concentrations in ng/mL),
  and breath/blood alcohol readings recorded in fitness-for-work programs.
operation: >-
  Matches the Australian testing-standard anchors (AS/NZS 4308, AS/NZS 4760),
  explicit drug-and-alcohol test result phrasing, laboratory result language
  (non-negative or confirmatory results near specimen/drug-class context,
  cut-off concentrations with ng/mL units), and recorded alcohol readings
  (BAC/breath alcohol followed by a 0.0xx value). Policy and procedure
  documents use the same program vocabulary without result data, so tiers
  should corroborate with collection-chain keywords.
pattern: >-
  \bAS(?:/NZS)?\s?4308\b|\bAS(?:/NZS)?\s?4760\b|\bdrug\s+and\s+alcohol\s+(?:test|screen|screening|testing)\s+(?:result|report|record|register)s?\b|\bnon-?negative\b[\s\S]{0,120}\b(?:specimen|donor|urine|oral\s+fluid|drug\s+class|confirmatory)\b|\bcut-?off\s+(?:concentration|level)s?\b[\s\S]{0,80}\bng\s?/\s?mL\b|\b(?:BAC|breath\s+alcohol|blood\s+alcohol)\b[\s\S]{0,40}\b0\.\d{2,3}\b
confidence: medium
confidence_justification: >-
  Medium confidence: the AS/NZS standard citations and non-negative/cut-off
  laboratory phrasing are distinctive of actual testing records, but the same
  standards are cited in workplace policies, procedures and training material
  that contain no individual results. Corroborative collection-chain keywords
  separate result records from program documentation.
jurisdictions:
  - au
regulations:
  - "Privacy Act 1988 (Cth) - health information"
  - "Work Health and Safety Act 2011"
frameworks:
  - ISO 27001
data_categories:
  - health
  - phi
  - pii
corroborative_evidence:
  keywords:
    - donor
    - specimen
    - chain of custody
    - collector
    - confirmatory
    - medical review officer
    - fitness for work
    - amphetamines
    - cannabinoids
    - opiates
    - benzodiazepines
    - breathalyser
  proximity: 300
test_cases:
  should_match:
    - value: 'urine specimen screened in accordance with AS/NZS 4308:2008; all drug classes negative'
      description: Standard citation on a urine screening result
    - value: 'oral fluid collection per AS 4760 - confirmatory LC-MS/MS requested for the non-negative result'
      description: Oral fluid standard with confirmatory follow-up
    - value: 'drug and alcohol test results for the night shift crew are attached to the incident file'
      description: Explicit test-result phrasing
    - value: 'THC-COOH reported above the cut-off concentration of 15 ng/mL'
      description: Laboratory cut-off phrasing with units
    - value: 'random breath test recorded BAC 0.052 - stood down under the fitness for work procedure'
      description: Recorded alcohol reading with a BAC value
  should_not_match:
    - value: the drug and alcohol policy applies to all workers, contractors and visitors on site
      description: Policy statement without any test result
    - value: roadside drug testing was expanded by the Queensland Police Service this year
      description: News commentary about testing programs
    - value: the cut-off date for enrolments is 30 June and results are posted in July
      description: Cut-off and results in a non-laboratory sense
false_positives:
  - description: Workplace D&A policies, procedures, tender responses and training
      material cite AS/NZS 4308 / AS 4760 and describe cut-off levels without
      containing any individual's result.
    mitigation: Require corroborative collection-chain keywords (donor, specimen,
      chain of custody, medical review officer) before enforcing; keep the
      standard-citation arm at a discovery/audit tier.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  Drug and alcohol test results are health information about identifiable
  workers. Disclosure carries privacy-law consequences and serious personal
  and industrial harm, and results routinely appear in incident and
  investigation files outside controlled HR systems.
sensitivity_labels:
  - SENSITIVE
references:
  - "AS/NZS 4308:2008 Procedures for specimen collection and the detection and quantitation of drugs of abuse in urine"
  - "AS/NZS 4760:2019 Procedures for specimen collection and the detection and quantitation of drugs in oral fluid"
created: 2026-07-25
updated: 2026-07-25
changelog:
  - version: 1.0.0
    date: 2026-07-25
    note: Initial draft - AU workplace health coverage gap (drug and alcohol testing records).
