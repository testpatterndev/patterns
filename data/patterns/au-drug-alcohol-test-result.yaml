schema: testpattern/v1
name: Australian Drug and Alcohol Test Result
slug: au-drug-alcohol-test-result
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects Australian workplace drug and alcohol testing records - screening and
  confirmatory results under AS/NZS 4308 (urine) and AS/NZS 4760 (oral fluid),
  laboratory result phrasing (non-negative, cut-off concentrations in ng/mL),
  and breath/blood alcohol readings recorded in fitness-for-work programs.
operation: >-
  The primary regex matches the Australian testing-standard anchors (AS/NZS 4308, AS/NZS 4760),
  explicit drug-and-alcohol test result phrasing, laboratory result language and recorded alcohol
  readings. On its own it is discovery only (65), because policies, procedures and training cite the
  same vocabulary. Tier 75 also requires one populated record structure: a donor / worker field or a
  populated test field (specimen or chain of custody number, collection date, or a stated result).
  Tier 85 requires a populated donor / worker field plus a second, distinct structure: a populated
  test field or a quantitative reading (BAC / breath alcohol value, ng/mL concentration, or a drug
  class with its result). Enforce tiers exclude template fixtures and policy / procedure wording.
pattern: >-
  \bAS(?:/NZS)?\s?4308\b|\bAS(?:/NZS)?\s?4760\b|\bdrug\s+and\s+alcohol\s+(?:test|screen|screening|testing)\s+(?:result|report|record|register)s?\b|\bnon-?negative\b[\s\S]{0,120}\b(?:specimen|donor|urine|oral\s+fluid|drug\s+class|confirmatory)\b|\bcut-?off\s+(?:concentration|level)s?\b[\s\S]{0,80}\bng\s?/\s?mL\b|\b(?:BAC|breath\s+alcohol|blood\s+alcohol)\b[\s\S]{0,40}\b0\.\d{2,3}\b
confidence: medium
confidence_justification: >-
  Medium on the primary alone: the AS/NZS standard citations and non-negative / cut-off laboratory
  phrasing are distinctive of testing records, but the same standards are cited in workplace
  policies, procedures and training material that hold no individual result. The Purview tiers
  gate 75 on one populated record structure and 85 on a populated donor field plus a populated
  test field or quantitative reading, which separates individual results from program documents.
jurisdictions:
  - au
regulations:
  - "Privacy Act 1988 (Cth) - health information"
  - "Work Health and Safety Act 2011 (Qld)"
  - "Information Privacy Act 2009 (Qld)"
frameworks:
  - ISO 27001
data_categories:
  - health
  - phi
  - pii
corroborative_evidence:
  keywords:
    - donor
    - specimen
    - chain of custody
    - collector
    - confirmatory
    - medical review officer
    - fitness for work
    - amphetamines
    - cannabinoids
    - opiates
    - benzodiazepines
    - breathalyser
  proximity: 300
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_da_primary
      matches:
        - ref: Regex_da_donor_field
        - type: any
          min_matches: 1
          refs:
            - Regex_da_test_field
            - Regex_da_reading
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_da_policy_exclusion
    - confidence_level: 75
      id_match: Regex_da_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_da_donor_field
            - Regex_da_test_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_da_policy_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_da_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_da_primary
      pattern: >-
        (?i)\bAS(?:/NZS)?\s?4308\b|\bAS(?:/NZS)?\s?4760\b|\bdrug\s+and\s+alcohol\s+(?:test|screen|screening|testing)\s+(?:result|report|record|register)s?\b|\bnon-?negative\b[\s\S]{0,120}\b(?:specimen|donor|urine|oral\s+fluid|drug\s+class|confirmatory)\b|\bcut-?off\s+(?:concentration|level)s?\b[\s\S]{0,80}\bng\s?/\s?mL\b|\b(?:BAC|BrAC|breath\s+alcohol|blood\s+alcohol)\b[\s\S]{0,40}\b0\.\d{2,3}\b
    - id: Regex_da_donor_field
      pattern: >-
        (?i)\b(?:donor|employee|worker|contractor|staff\s+member|tested\s+person|person\s+tested)(?:\s+(?:name|no\.?|number|ID|#))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_da_test_field
      pattern: >-
        (?i)\b(?:(?:specimen|sample|collection|chain\s+of\s+custody|CoC)\s+(?:ID|no\.?|number|ref(?:erence)?)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)[A-Z0-9][A-Z0-9/-]{3,20}|(?:collection|test)\s+(?:date|time)\s*[:#]\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}[:.]\d{2})|(?:screening|screen|initial|confirmatory|laboratory|overall|test)\s+result\s*[:#]\s*(?:negative|non-?negative|positive|pass|fail|confirmed\s+positive|below\s+cut-?off|above\s+cut-?off|detected|not\s+detected))
    - id: Regex_da_reading
      pattern: >-
        (?i)\b(?:(?:BAC|BrAC|breath\s+alcohol|blood\s+alcohol)(?:\s+(?:reading|level|result|concentration))?\s*[:=]?\s*0\.\d{2,3}\b|\d{1,4}(?:\.\d{1,2})?\s?ng\s?/\s?mL\b|(?:amphetamine\s+type\s+substances|amphetamines?|methamphetamine|cannabinoids|THC(?:-COOH)?|opiates|cocaine|benzodiazepines)\s*[:-]\s*(?:negative|non-?negative|positive|detected|not\s+detected))
  keywords:
    - id: Keyword_da_policy_exclusion
      groups:
        - match_style: word
          terms:
            - this policy applies
            - this procedure applies
            - 'Supersedes:'
            - training module
            - policy statement
      strength: specific
test_cases:
  should_match:
    - value: "Fitness for work - drug and alcohol test record\nDonor name: Riley Teston\nEmployee number: 204718\nCollection date: 14/08/2026\nSpecimen ID: UR204718\nScreening result: non-negative\nConfirmatory testing requested under AS/NZS 4308:2008."
      description: Urine screen record with donor, collection and specimen fields plus result (85 tier)
      synthetic: true
    - value: "Random breath test - depot B\nWorker: Jamie Teston\nBreath alcohol reading: 0.052\nOutcome: stood down under the fitness for work procedure; repeat test at 10:40."
      description: Breath test with named worker and BAC reading (85 tier)
      synthetic: true
    - value: "Laboratory report - oral fluid (AS/NZS 4760:2019)\nDonor ID: D-44718\nCannabinoids: positive\nTHC reported at 32 ng/mL, above the cut-off concentration of 25 ng/mL."
      description: Oral fluid lab report with donor ID, drug-class result and ng/mL value (85 tier)
      synthetic: true
    - value: "Drug and alcohol test results for the night shift crew\nContractor: Morgan Teston - see attached collector notes."
      description: Result record naming a contractor with no reading or test field (75 tier)
      synthetic: true
    - value: "Chain of custody number: COC2026-0471\nCollection time: 06:15\nurine specimen screened in accordance with AS/NZS 4308:2008"
      description: Collection record with populated test fields but no donor field (75 tier)
      synthetic: true
  should_not_match:
    - value: the drug and alcohol policy applies to all workers, contractors and visitors on site
      description: Policy statement without any test result
    - value: roadside drug testing was expanded by the Queensland Police Service this year
      description: News commentary about testing programs
    - value: the cut-off date for enrolments is 30 June and results are posted in July
      description: Cut-off and results in a non-laboratory sense
    - value: "Drug and alcohol test record - blank template\nDonor name: ______________\nEmployee number: ______\nSpecimen ID: ______\nScreening result: negative / non-negative"
      description: Blank collection form (65 at most)
    - value: "Fitness for Work Procedure. This procedure applies to all council workers. Urine testing is conducted to AS/NZS 4308:2008 and oral fluid testing to AS/NZS 4760:2019; a BAC above 0.020 is a positive reading for safety-critical roles."
      description: Procedure citing standards and a BAC threshold with no individual (65 at most)
false_positives:
  - description: Workplace D&A policies, procedures, tender responses and training
      material cite AS/NZS 4308 / AS 4760 and describe cut-off levels without
      containing any individual's result.
    mitigation: The primary alone is discovery only (65). Enforce tiers need a populated donor or
      test field (75) or a donor field plus a test field or reading (85), and exclude template
      fixtures and policy / procedure wording.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  Drug and alcohol test results are health information about identifiable
  workers. Disclosure carries privacy-law consequences and serious personal
  and industrial harm, and results routinely appear in incident and
  investigation files outside controlled HR systems.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - "AS/NZS 4308:2008 Procedures for specimen collection and the detection and quantitation of drugs of abuse in urine"
  - "AS/NZS 4760:2019 Procedures for specimen collection and the detection and quantitation of drugs in oral fluid"
