schema: testpattern/v1
name: Australia Medical Account Number
slug: au-medical-account-number
version: 1.0.0
type: keyword_list
pattern_class: concept
description: >-
  Catalogue reference for the Microsoft Purview built-in Australia Medical Account Number sensitive information type, which
  detects an Australian Medicare card number (ten or eleven digits with a check digit) corroborated by Medicare keywords.
  Microsoft recommends high confidence (85) for the built-in entity. This YAML-only record lets a package recipe include the
  Microsoft entity explicitly; it does not reproduce Microsoft's built-in regular expressions, keyword dictionaries, checksums
  or XML.
operation: >-
  In Microsoft Purview, enable the built-in entity 104a99a0-3d3b-4542-a40d-ab0b9e1efe63 to use Microsoft's detection logic.
  This reference exports YAML only and must not be deployed as a custom XML clone. The custom SIT au-medicare-number (Australian
  Medicare Number) detects the same data with TestPattern's own tiers and stays the default; choose this built-in only through
  an explicit recipe include.
keywords:
- Australia Medical Account Number
- Australian Medical Account Number
confidence: medium
confidence_justification: >-
  Medium confidence for this YAML-only record: its keyword logic finds references to the built-in entity name with Microsoft
  Purview context, not populated values. Microsoft's own recommended confidence for the entity is 85. The record does not
  claim to reproduce Microsoft's proprietary detection logic.
jurisdictions:
- au
regulations:
- Information Privacy Act 2009 (Qld)
- My Health Records Act 2012 (Cth)
- NDB Scheme (Cth)
- Privacy Act 1988 (Cth)
frameworks:
- ISO 27001
- ISO 27701
- SOC 2
data_categories:
- pii
- phi
- government-id
test_cases:
  should_match:
  - value: Australia Medical Account Number built-in SIT
    description: Microsoft built-in entity name
  - value: Australian Medical Account Number catalogue reference
    description: Name variant used for registry discovery
  - value: |-
      DLP policy inventory - Microsoft Purview
      Rule: Builtin-au-medical-account-number
      Condition: Australia Medical Account Number (built-in entity 104a99a0-3d3b-4542-a40d-ab0b9e1efe63), high confidence, instance count 1 or more
      Action: notify sender
    description: DLP rule inventory row naming the built-in entity with Microsoft Purview context
    synthetic: true
  should_not_match:
  - value: 'Medicare card number: 2123 45670 1'
    description: Populated value or sibling reference without the built-in entity name
  - value: Medicare provider number register
    description: Populated value or sibling reference without the built-in entity name
  - value: Health identifier catalogue reference
    description: Populated value or sibling reference without the built-in entity name
false_positives:
- description: Documentation and policy inventories can mention the Microsoft built-in entity by name.
  mitigation: Treat this YAML-only record as catalogue discovery; enable the Microsoft entity for value detection.
- description: The custom SIT au-medicare-number detects the same data; deploying both doubles matches on the same content.
  mitigation: Pick one per package. The custom SIT is the default; include this built-in only by an explicit recipe decision.
exports:
- yaml
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
  - confidence_level: 75
    id_match: Keyword_au_medical_account_number_name
    matches:
    - ref: Evidence_microsoft_builtin_context
  keywords:
  - id: Keyword_au_medical_account_number_name
    groups:
    - match_style: word
      terms:
      - Australia Medical Account Number
      - Australian Medical Account Number
    strength: specific
  - id: Evidence_microsoft_builtin_context
    groups:
    - match_style: word
      terms:
      - Microsoft Purview
      - built-in SIT
      - built-in entity
      - catalogue reference
      - entity definition
    strength: domain
risk_rating: 7
risk_description: >-
  The referenced Microsoft entity detects the same data as the custom SIT au-medicare-number, so this record carries that
  SIT's reviewed risk (7) and sensitivity labels unchanged. The built-in changes who maintains the detection logic, not what
  the matched content is worth to an attacker.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Tier Medium is carried from the reviewed assessment of the custom SIT au-medicare-number, which detects the same data.
    This record is a YAML-only reference to the Microsoft entity.
  generic:
    classification: Medium
    dlm: Low
    rationale: >-
      Generic Medium with Low handling is carried from au-medicare-number, the custom SIT for the same data.
references:
- url: https://learn.microsoft.com/en-us/purview/sit-defn-australia-medical-account-number
  title: Australia Medical Account Number entity definition - Microsoft Learn
- url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-entity-definitions
  title: Sensitive information type entity definitions - Microsoft Learn
created: '2026-10-20'
updated: '2026-10-20'
author: testpattern-community
source: microsoft
license: MIT
changelog:
- version: 1.0.0
  date: '2026-10-20'
  description: >-
    Catalogue reference for the Microsoft built-in Australia Medical Account Number (GUID 104a99a0-3d3b-4542-a40d-ab0b9e1efe63,
    from the tenant SIT inventory and the Microsoft Learn entity definition). In no block: packages take it only by explicit
    recipe include.
