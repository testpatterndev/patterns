schema: testpattern/v1
name: Management Action Plan
slug: global-management-action-plan
version: 1.5.0
type: regex
pattern_class: concept
description: >-
  Detects populated management action plans and corrective action plans that respond to audit findings: the action-plan phrase combined with a finding reference, a named action owner, a due date or an action status. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex. Primary: management action plan, corrective action plan, remediation plan/tracking, audit action plan/items, CAP tracking/status. 65 (discovery only): primary alone. 75: primary plus one populated field - finding/issue/action reference containing a digit, named action owner or responsible officer, due/target date, or an action status (open, in progress, overdue, closed, implemented...). 85: primary plus two distinct field types (the four above or a rating/severity value) plus audit-finding classification evidence (critical/high/medium/low risk finding, priority one-three, required action, audit observation/exception, non-compliance). Template/sample and guidance framing excluded on every enforce tier.
confidence: medium
confidence_justification: >-
  Enforce tiers require populated owner, date, status or reference fields beside the action-plan phrase; governance pages, generic action plans and blank trackers stay at 65. Medium because project action logs with the same fields can match when they use corrective-action wording.
jurisdictions:
  - global
regulations:
  - IPA 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - DISP
  - ISO 27001
  - NIST CSF
data_categories:
  - audit
  - governance
test_cases:
  should_match:
    - value: "MANAGEMENT ACTION PLAN - Internal Audit Report IA-2026-09\nFinding ref: 3.2\nAgreed action: implement quarterly user access reviews for the payroll system\nAction owner: Jordan Staffson, Payroll Manager\nDue date: 31/12/2026\nStatus: In progress\nHigh risk finding; required action tracked to closure."
      description: Populated action plan - reference, owner, date, status and classification (85)
      synthetic: true
    - value: "Corrective action plan\nResponsible officer: Avery Teston\nThe revised reconciliation checklist will be issued to all branches."
      description: Plan with a single populated owner field (75)
      synthetic: true
  should_not_match:
    - value: "Policy guidance: every management action plan should name an action owner, a due date and a status, and be reported to the audit committee until closure."
      description: Guidance naming the fields without values
      synthetic: true
    - value: "MANAGEMENT ACTION PLAN\nFinding ref: __________\nAction owner: __________\nDue date: __________\nStatus: __________"
      description: Blank action-plan form - placeholder values
      synthetic: true
    - value: "The regulator said the bank's remediation plan was behind schedule, according to a news report on Monday."
      description: News item
      synthetic: true
    - value: "Action plan for the marketing campaign"
      description: Generic action plan
      synthetic: true
    - value: "Management meeting agenda"
      description: Unrelated
      synthetic: true
    - value: "The public governance page links to a management action plan."
      description: Public page reference
      synthetic: true
    - value: "Template example: management action plan for a high risk finding with required action, owner, due date, and closure."
      description: Template framing
      synthetic: true
false_positives:
  - description: Project and marketing action plans.
    mitigation: Primary requires audit/corrective/remediation action-plan wording.
  - description: Audit methodology guidance describing what an action plan must contain.
    mitigation: No populated fields and guidance framing is excluded.
exports:
  - yaml
scope: narrow
risk_rating: 4
risk_description: >-
  The keyword concept finds management action or remediation plans tied to findings, responsible officers, due dates, corrective actions, and closure status rather than any generic project action plan. Disclosure may expose delayed work, ownership, or known weaknesses, but a normal plan often records routine governance tasks and lacks exploit instructions or consequential case evidence. The usual impact is low and reversible for one organisation unless the underlying finding is severe. Risk 4 OFFICIAL fits routine remediation tracking; SENSITIVE is not met without actionable vulnerabilities, sensitive investigation facts, serious misconduct, or material non-compliance. Quality pass 2026-09-24: enforce tiers (75/85) now require populated record structure (labelled fields with real values, identifiers or data rows); phrase-only mentions in guidance, marketing, blank forms and news stay at 65 discovery.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_management_action_plan
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_management_action_plan_reference
            - Regex_global_management_action_plan_owner
            - Regex_global_management_action_plan_due_date
            - Regex_global_management_action_plan_status
            - Regex_global_management_action_plan_rating
        - ref: Keyword_audit_finding_classification
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_management_action_plan_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_management_action_plan
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_management_action_plan_reference
            - Regex_global_management_action_plan_owner
            - Regex_global_management_action_plan_due_date
            - Regex_global_management_action_plan_status
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_management_action_plan_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_management_action_plan
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_management_action_plan
      pattern: (?i)\b(?:management\s+action\s+plan|corrective\s+action\s+plan|remediation\s+(?:plan|tracking)|audit\s+action\s+(?:plan|items?)|cap\s+(?:tracking|status))\b
    - id: Regex_global_management_action_plan_reference
      pattern: (?i)\b(?:(?:audit\s+)?(?:finding|issue|observation|exception|deficiency|recommendation|action)\s*(?:no\.?|number|ID|ref(?:erence)?|#))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Z/.-]{0,12}\d)[A-Z0-9][A-Z0-9/.-]{0,24}
    - id: Regex_global_management_action_plan_owner
      pattern: (?i)\b(?:(?:action\s+|control\s+|process\s+|risk\s+)?owner|responsible\s+(?:officer|manager|executive|person|area)|accountable\s+(?:officer|executive))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?:(?:Mr|Mrs|Ms|Mx|Dr|Prof)\.?[ \t]{1,3})?[A-Z][A-Za-z'.-]{1,30}(?:[ \t]{1,3}[A-Z&][A-Za-z'.&-]{0,30}){0,5}
    - id: Regex_global_management_action_plan_due_date
      pattern: (?i)\b(?:due\s+date|target\s+(?:date|completion(?:\s+date)?)|remediation\s+date|agreed\s+(?:completion\s+)?date|revised\s+due\s+date)[ \t]{0,3}[:#][ \t]{0,3}(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}[ \t]{1,3}(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}[ \t]{1,3}\d{4})
    - id: Regex_global_management_action_plan_status
      pattern: (?i)\b(?:(?:current\s+|action\s+)?status|progress)[ \t]{0,3}[:#][ \t]{0,3}(?:open|in\s+progress|overdue|closed|completed?|not\s+started|on\s+track|delayed|behind\s+schedule|implemented|partially\s+implemented)\b
    - id: Regex_global_management_action_plan_rating
      pattern: (?i)\b(?:(?:risk\s+)?rating|severity|risk\s+level|classification|priority|deficiency\s+type)[ \t]{0,3}[:#][ \t]{0,3}(?:extreme|high|medium|moderate|low|critical|significant(?:\s+deficiency)?|material\s+weakness|major|minor|P[1-4])\b
  keywords:
    - id: Keyword_audit_finding_classification
      groups:
        - match_style: word
          terms:
            - critical finding
            - high risk finding
            - medium risk finding
            - low risk finding
            - priority one
            - priority two
            - priority three
            - required action
            - audit observation
            - audit exception
            - non-compliance
            - deviation
      strength: domain
    - id: Keyword_global_management_action_plan_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - marketing campaign
            - meeting agenda
            - governance page
      strength: noise
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were phrase-only keyword tiers (75 used generic remediation words); 75 now needs a populated finding reference, owner, due date or status and 85 needs two distinct field types plus audit-finding classification evidence; replaced the bare-phrase positive; added guidance, blank-form and news decoys; dropped SOCI Act and added a verified IIA standards reference.
  - version: 1.4.0
    date: '2026-07-19'
    description: 'Profile quality: align the regex-backed detector type; add title discovery, remediation-tracking medium, and classified-finding high tiers; add public/template adversarial probes.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 554 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.1.0
    date: '2026-07-04'
    description: Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.; Aligned recommended_confidence to 75.
