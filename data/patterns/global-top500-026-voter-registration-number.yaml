schema: testpattern/v1
name: Voter registration number
slug: global-top500-026-voter-registration-number
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to voter registration number in international contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 1 keywords within 240 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?i)\b(voter\s+registration\s+numbers?)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - voter registration number
  proximity: 240
  keyword_lists:
    - generic-data-labels
    - data-record-context
test_cases:
  should_match:
    - value: 'Voter registration number'
      description: Topic phrase present
    - value: 'voter registration number'
      description: Topic phrase, lowercase
    - value: 'this record references the voter registration number held on file'
      description: Topic phrase within surrounding text
    - value: |-
        Voter registration number: Recorded
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: generic narrative without identifier/document anchors
      description: Should not match plain mention
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
    - value: |-
        Voter registration number:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about voter registration number are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Voter registration number:
        Name: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Common words and phrases related to voter registration number appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: >-
      In English (as the primary international business language), similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute
      sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 240
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_026_voter_registration_number_populated_label
      matches:
        - ref: Regex_global_top500_026_voter_registration_number_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_026_voter_registration_number_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_voter_registration
      matches:
        - ref: Keyword_voter_registration
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_voter_registration
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_global_top500_026_voter_registration_number_populated_label
      pattern: (?i)\b((?:\b(?:voter\s+registration\s+numbers?)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Regex_global_top500_026_voter_registration_number_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Regex_voter_registration
      pattern: (?i)\b(voter\s+registration\s+numbers?)\b
    - id: Pattern_global_top500_026_voter_registration_number_label_context
      pattern: (?i)\b(voter\s+registration\s+number)\b
  keywords:
    - id: Keyword_voter_registration
      groups:
        - match_style: word
          terms:
            - voter ID
            - electoral roll
            - electoral registration
            - polling card
            - voter enrollment
            - electoral commission
            - voter number
            - registered voter
            - ballot
      strength: specific
    - id: Keyword_global_top500_026_voter_registration_number_domain_context
      groups:
        - match_style: word
          terms:
            - voter registration number
            - voter
            - registration
      strength: domain
risk_description: >-
  The global Voter registration number detector matches the field phrase and sentences that reference such a number being held on file. It does not parse an electoral identifier, associate a voter, or reveal registration address, party, or voting conduct. A populated number could help correlate an electoral record when combined with identity details, but procedural text and blank templates can produce the same hit. Risk 5 and OFFICIAL reflect the civic-record cue, while actual person-linked electoral data establishes the threshold for SENSITIVE classification.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to OFFICIAL and Low tiers because voter-registration-number wording supplies no issued identifier, named
    voter, or political preference. SENSITIVE is not met without a populated value linked to an individual and a
    substantive electoral or identity record.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      A global voter-registration label is generically Low with Low DLM because it exposes neither a voter nor an
      electoral identifier value.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-20'
    description: 'Self-corroboration fix (PR #69 shape; this pattern was missed by #69): the evidence lists held the IdMatch phrase or phrases inside it (voter registration number, voter registration; generic-data-labels, which holds number labels such as registration/file/identification number). Purview counts a supporting match that equals or sits inside the IdMatch span (dev-tenant tests 2026-10-16 and 2026-10-19), so a bare heading reached an enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_026_voter_registration_number_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (Keyword_voter_registration); 85 requires the populated field plus a populated person/client field (Regex_global_top500_026_voter_registration_number_record_structure). Phrase-only matches stay at 65 discovery. Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.3.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1588 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 90 to 85.; Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
  - version: 1.1.0
    date: '2026-03-14'
    description: Wire generic-data-labels evidence keywords at 75/85 tiers
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
