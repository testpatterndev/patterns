schema: testpattern/v1
name: Succession planning files
slug: global-top500-075-succession-planning-files
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects succession plans, succession registers and talent reviews that name incumbents, successors or employees, with readiness, flight-risk or potential ratings or target critical roles.
operation: >-
  Primary: a succession phrase (succession plan/planning/candidate/pool/register, successor identified/nominated, talent review/pipeline/pool/calibration, key person risk, nine-box grid). 75 tier requires a populated person field (employee/staff name or number, incumbent, successor, nominee, role holder, position number or title) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated talent detail (readiness, potential or flight-risk rating, or a named critical/target role) and an independent corroborative term (development plan, mentoring, retirement, leadership, capability). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:succession\s+(?:plan|planning|candidate|pool|register)|successor\s+(?:candidate|identified|nominated|pool)|talent\s+(?:review|pipeline|pool|calibration)|key\s+person\s+risk|(?:nine|9)[\s-]box(?:\s+grid)?)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - development plan
    - mentoring
    - retirement
    - leadership
    - capability
    - acting arrangement
    - higher duties
    - confidential
  proximity: 300
test_cases:
  should_match:
    - value: "Succession plan - critical roles\nCritical role: Chief Engineer\nIncumbent: Avery Teston (retirement expected 2027)\nSuccessor: Jordan Staffson\nReadiness: 1-2 years\nFlight risk: High. Development plan: acting arrangement in Q1."
      description: '85: Succession plan with incumbent, successor, readiness and flight risk'
      synthetic: true
    - value: "Succession register\nEmployee ID: 5520117\nTarget role: Operations Manager\nReadiness: Ready now\nMentoring by the General Manager continues."
      description: '85: Succession register row with target role and readiness'
      synthetic: true
    - value: "Talent review\nEmployee name: Morgan Teston\nDiscussed as a possible future lead for the depot team."
      description: '75: Talent review naming the employee, no rating'
      synthetic: true
  should_not_match:
    - value: Succession planning helps agencies prepare for key person risk. This guideline explains how to run a talent review.
      description: Guideline text - must stay below 75
    - value: "Succession plan\nIncumbent: __________\nSuccessor: __________\nReadiness: __________"
      description: Blank plan template - must stay below 75
    - value: The board confirmed its succession plan for the chief executive in a media release on Friday.
      description: News / media release - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_075_succession_planning_files_primary
      matches:
        - ref: Regex_top500_075_succession_planning_files_person_field
        - ref: Regex_top500_075_succession_planning_files_record_detail
        - ref: Keyword_top500_075_succession_planning_files_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_075_succession_planning_files_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_075_succession_planning_files_primary
      matches:
        - ref: Regex_top500_075_succession_planning_files_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_075_succession_planning_files_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_075_succession_planning_files_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_075_succession_planning_files_primary
      pattern: >-
        (?i)\b(?:succession\s+(?:plan|planning|candidate|pool|register)|successor\s+(?:candidate|identified|nominated|pool)|talent\s+(?:review|pipeline|pool|calibration)|key\s+person\s+risk|(?:nine|9)[\s-]box(?:\s+grid)?)\b
    - id: Regex_top500_075_succession_planning_files_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit|incumbent|successor|nominee|role\s+holder)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_075_succession_planning_files_record_detail
      pattern: >-
        (?i)\breadiness\s*(?:level|rating)?\s*[:\-]\s*(?:ready\s+now|ready\s+in\s+\d{1,2}|\d{1,2}\s*(?:-|to)\s*\d{1,2}\s+(?:years?|months?)|\d{1,2}\s+(?:years?|months?)|not\s+ready|emergency\s+cover)|\b(?:potential|flight\s+risk|retention\s+risk|risk\s+of\s+loss|impact\s+of\s+loss)\s*(?:rating)?\s*[:\-]\s*(?:high|medium|low|moderate|[1-5]\b)|\b(?:critical\s+role|target\s+role)\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z][A-Za-z]{2,}
  keywords:
    - id: Keyword_top500_075_succession_planning_files_corroborative
      groups:
        - match_style: word
          terms:
            - development plan
            - mentoring
            - retirement
            - leadership
            - capability
            - acting arrangement
            - higher duties
            - confidential
      strength: specific
    - id: Keyword_top500_075_succession_planning_files_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a succession plan or talent review naming employees about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Disclosure exposes confidential judgements about identifiable employees' potential, retention risk and career prospects. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
