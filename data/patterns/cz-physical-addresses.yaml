schema: testpattern/v1
name: Czech Republic Physical Addresses
slug: cz-physical-addresses
version: 1.2.3
type: keyword_list
pattern_class: concept
description: >-
  Detects Czech Republic Physical Addresses patterns. This pattern is based on a Microsoft Purview built-in
  sensitive information type that uses machine learning and function-based detection for physical
  address identification. This keyword list provides address-related terms for supplementary matching.
operation: >-
  Function-based detection in Microsoft Purview. This pattern uses keyword matching for
  country-specific address terminology to identify physical address data.
keywords:
  - ulice
  - náměstí
  - třída
  - nábřeží
  - sady
  - silnice
  - Praha
  - Brno
  - Ostrava
  - PSČ
  - č.p.
  - okres
confidence: low
confidence_justification: >-
  Low confidence: broad keyword matching on address terms requires additional context and
  corroborative evidence for accurate physical address detection. Address keywords alone
  produce high false positive rates without structural validation.
jurisdictions:
  - cz
  - eu
regulations:
  - GDPR
data_categories:
  - pii
  - contact-information
test_cases:
  should_match:
    - value: "123 ulice name, unit 4"
      description: Contains address keyword 'ulice'
    - value: "located at 45 náměstí example"
      description: Contains address keyword 'náměstí'
    - value: "deliver to 78 třída test"
      description: Contains address keyword 'třída'
  should_not_match:
    - value: "quarterly financial report for fiscal year 2024"
      description: Business text with no address keywords
    - value: "the meeting is scheduled for next Tuesday morning"
      description: Scheduling text with no address terminology
false_positives:
  - description: References to street names in non-address contexts such as business names or landmarks
    mitigation: >-
      Require structural address patterns (number + street type + name) rather than isolated keyword matches.
  - description: Navigation or mapping references that mention road types without containing actual addresses
    mitigation: >-
      Use proximity-based corroborative evidence to ensure keywords appear alongside numeric components.
exports:
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
    - confidence_level: 75
      id_match: Keyword_cz_address_primary
      matches:
        - ref: Keyword_cz_address_context
    - confidence_level: 65
      discovery_only: true
      id_match: Keyword_cz_address_primary
  keywords:
    - id: Keyword_cz_address_primary
      groups:
        - match_style: word
          terms:
            - ulice
            - náměstí
            - třída
            - nábřeží
            - sady
            - silnice
            - Praha
            - Brno
            - Ostrava
            - PSČ
            - č.p.
            - okres
      strength: domain
    - id: Keyword_cz_address_context
      groups:
        - match_style: word
          terms:
            - adresa
            - město
            - obec
            - kraj
            - poštovní směrovací číslo
            - Česká republika
            - Czech Republic
            - Plzeň
            - Olomouc
            - Liberec
            - České Budějovice
      strength: domain
risk_rating: 3
risk_description: >-
  The Czech detector uses low-confidence ulice, náměstí, and třída terms to suggest an address rather than verifying a complete postal destination. A true residential value can support targeted mail or correlation with a known person, but public squares, schools, companies, and mapped routes share the same vocabulary. Landmark and navigation references therefore cause expected false positives without private occupancy data. Risk 3 OFFICIAL reflects low contextual impact; SENSITIVE would require a concealed residence, protected or vulnerable occupant, credible threat, movement linkage, or an aggregated personal address register.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: "CUI"
  uk_gov: "OFFICIAL"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
classification:
  tier: Low
  rationale: >-
    Risk 3 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM, OFFI, and Low tier for a routine Czech address
    candidate. The next SENSITIVE level is not met because no resident identity, protected location, current safety
    concern, movement trail, or high-consequence dataset is detected.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low and Low handling fit a Czech physical address whose serious effect depends on trustworthy occupant
      attribution or a heightened location-safety circumstance.
references:
  - url: https://learn.microsoft.com/en-us/purview/sit-defn-czech-republic-physical-addresses
    title: "Czech Republic Physical Addresses entity definition - Microsoft Learn"
frameworks:
  - ISO 27001
  - ISO 27701
