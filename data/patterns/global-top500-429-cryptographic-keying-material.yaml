schema: testpattern/v1
name: Cryptographic keying material
slug: global-top500-429-cryptographic-keying-material
version: 1.5.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects cryptographic keying material records: keying-material, COMSEC or key-ceremony wording with actual key values (PEM private keys, hex key components) or populated custody details (custodians, HSM serials, KCVs, envelope numbers). Topic wording alone is discovery-only.
operation: >-
  Regex_keying_material_primary (keying material, COMSEC material/custodian, key ceremony record, key custodian log or master-key component wording) is discovery-only at 65. 75 requires the primary plus one populated structure: an actual key value (PEM private-key block or labelled hex key component/ZMK/ZPK/TMK/KEK/DEK) or a populated custody field (custodian, witness, HSM serial, key label/ID/version, KCV, ceremony date, safe/envelope number). 85 requires an actual key value (PEM private-key block or labelled hex key component/ZMK/ZPK/TMK/KEK/DEK), a populated custody field (custodian, witness, HSM serial, key label/ID/version, KCV, ceremony date, safe/envelope number), and independent key-management-control (split knowledge, dual control, tamper-evident, cryptoperiod, rekey) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_keying_material_guidance_exclusion).
pattern: >-
  (?i)\b(?:cryptographic\s+keying\s+material|keying\s+material|COMSEC\s+(?:material|account|custodian)|key\s+ceremony\s+(?:record|log|script|minutes)|key\s+custodian\s+(?:log|register|record)|(?:master|zone\s+master|terminal\s+master)\s+key\s+components?)\b
confidence: low
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (an actual key value (PEM private-key block or labelled hex key component/ZMK/ZPK/TMK/KEK/DEK) or a populated custody field (custodian, witness, HSM serial, key label/ID/version, KCV, ceremony date, safe/envelope number)), and 85 needs two distinct structures plus independent key-management-control (split knowledge, dual control, tamper-evident, cryptoperiod, rekey) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
  - Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
  - CIS Controls
  - DISP
  - ISO 27001
  - NIST CSF
  - PCI-DSS
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - split knowledge
    - dual control
    - tamper-evident
    - AES-256
    - TDES
    - zeroise
    - rekey
    - cryptoperiod
    - key loader
    - destroyed
  proximity: 300
  keyword_lists:
    - government-services
test_cases:
  should_match:
    - value: Cryptographic keying material must be returned to the COMSEC custodian at end of posting.
      description: Discovery probe (65)
      synthetic: true
    - value: |-
        Key ceremony record - payment HSM
        Key custodian: J. Staffson
        KCV: 7D2A91
      description: Medium-tier probe (75) - populated custody fields
      synthetic: true
    - value: |-
        Zone master key components - key ceremony record 2026-09-18
        Custodian A: J. Staffson; witness: R. Marsh
        HSM serial: PHSM-449102
        Component 1: 0123 4567 89AB CDEF FEDC BA98 7654 3210
        KCV: 7D2A91
        Envelope number: TE-0418 (tamper-evident), dual control and split knowledge maintained.
      description: High-tier probe (85) - key component value, custody fields and key-management controls
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match
    - value: 'Policy statement: keying material is handled under dual control and split knowledge at all times.'
      description: Policy text
      synthetic: true
    - value: |-
        Key ceremony record template
        Key custodian: ________
        Component 1: [insert]
        KCV: ________
      description: Blank template
      synthetic: true
    - value: 'Course module 3: a master key component is entered by each custodian and verified with a KCV.'
      description: Training framing
      synthetic: true
false_positives:
  - description: Key management standards (NIST SP 800-57, PCI PIN) describe key components and ceremonies.
    mitigation: Guidance/training framing is excluded; enforcement needs key values or populated custody fields.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_keying_material_primary
      matches:
        - ref: Regex_keying_material_key_value
        - ref: Regex_keying_material_custody_field
        - ref: Keyword_keying_material_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_keying_material_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_keying_material_primary
      matches:
        - type: any
          refs:
            - Regex_keying_material_key_value
            - Regex_keying_material_custody_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_keying_material_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_keying_material_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_keying_material_primary
      pattern: >-
        (?i)\b(?:cryptographic\s+keying\s+material|keying\s+material|COMSEC\s+(?:material|account|custodian)|key\s+ceremony\s+(?:record|log|script|minutes)|key\s+custodian\s+(?:log|register|record)|(?:master|zone\s+master|terminal\s+master)\s+key\s+components?)\b
    - id: Regex_keying_material_key_value
      pattern: >-
        (?i)-----BEGIN\s+(?:RSA\s+|EC\s+|ENCRYPTED\s+|OPENSSH\s+|DSA\s+)?PRIVATE\s+KEY-----|\b(?:key\s+component\s+[1-3]|component\s+[1-3]|ZMK|ZPK|TMK|KEK|DEK|key\s+value|clear\s+key)\s*[:=]\s*[0-9A-F]{4}(?:[\s-]?[0-9A-F]{4}){3,15}\b
    - id: Regex_keying_material_custody_field
      pattern: >-
        (?i)\b(?:key\s+custodian|custodian\s+[1-3AB]|witness|HSM\s+serial|HSM|key\s+(?:label|name|ID|alias|version)|KCV|key\s+check\s+value|ceremony\s+(?:date|ID)|safe|envelope\s+(?:no\.?|number)|zeroi[sz]ed\s+(?:by|on))\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  keywords:
    - id: Keyword_keying_material_context
      groups:
        - match_style: word
          terms:
            - split knowledge
            - dual control
            - tamper-evident
            - AES-256
            - text: TDES
              case_sensitive: true
            - zeroise
            - rekey
            - cryptoperiod
            - key loader
            - destroyed
      strength: specific
    - id: Keyword_keying_material_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - guidance note
            - best practice guide
            - media release
            - press release
            - news report
            - course module
            - learning objectives
            - awareness course
            - webinar
            - lesson plan
            - quiz question
      strength: domain
risk_description: >-
  The detector now requires keying-material wording plus an actual key value or populated custody details (custodian, HSM, KCV, envelope) before enforcing. A substantive record could expose key custody, generation, distribution, rotation, or recovery information that helps an attacker target cryptographic controls. The affected scale depends on the systems protected by the referenced keys, and a phrase-only hit needs real key values or procedures before direct compromise is possible. Risk 8 and SENSITIVE InfoTech fit serious but contained key-management exposure; PROTECTED requires confirmed live master keys, broad trust anchors, critical-service cryptography, or comparable significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: Top Secret
  uk_gov: TOP SECRET
  nz_gov: TOP SECRET
  ca_gov: Top Secret
classification:
  tier: Medium
  rationale: >-
    Risk 8 supports PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech and Medium because enforcement needs
    actual key values or custody details such as custodians, HSM serials and KCVs. PROTECTED is not met by the pattern
    alone; it requires confirmed live master keys, broad trust anchors or critical-service cryptography.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling covers key custody and component records. A confirmed live private or master key should
      be escalated to the credential policy immediately.
