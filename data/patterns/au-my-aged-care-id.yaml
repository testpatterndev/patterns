schema: testpattern/v1
name: "Australian My Aged Care Client Identifier"
slug: au-my-aged-care-id
version: 1.0.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects standalone Australian My Aged Care Client Identifiers (AC followed by 8 digits) in referrals, billing, and schedules; complements au-aged-care-client-record, which targets full CHSP / Support at Home care-plan documents.
operation: >-
  Matches uppercase AC followed by 8 digits on word boundaries. Enforcing tiers require My Aged Care, Aged Care Assessment, Support at Home, or residential aged-care provider keywords within 300 characters.
pattern: '(?-i)\b(AC\d{8})\b'
confidence: high
confidence_justification: >-
  High confidence when corroborated: uppercase AC + 8 digits is concise, and requiring My Aged Care / ACAT / AN-ACC / Home Care Package terminology eliminates airline flight numbers (4 digits max) and generic AC part codes.
jurisdictions:
  - au
regulations:
  - "Aged Care Act 2024 (Cth)"
  - "Privacy Act 1988 (Cth)"
  - "NDB Scheme (Cth)"
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - phi
  - government-id
corroborative_evidence:
  keywords:
    - "My Aged Care"
    - "Aged Care ID"
    - "ACAT"
    - "Support at Home"
    - "Home Care Package"
    - "AN-ACC"
    - "residential aged care"
  proximity: 300
test_cases:
  should_match:
    - value: "My Aged Care ID: AC48291736"
      description: "Labelled My Aged Care Client ID (AC + 8 digits)"
    - value: "Client AC90381726 referred for ACAT comprehensive assessment"
      description: "My Aged Care ID in ACAT referral note"
    - value: "AC27491835"
      description: "Bare 10-character My Aged Care Client ID (65 discovery)"
  should_not_match:
    - value: "AC1234"
      description: "Air Canada flight-number length (4 digits instead of 8)"
    - value: "ac48291736"
      description: "Lowercase ac rejected by case-sensitive rule"
    - value: "Register the client with My Aged Care to receive an Aged Care ID"
      description: "Prose instruction without an AC######## value"
    - value: "Sample template: placeholder example record for training only"
      description: "Template/sample fixture suppressed by shared exclusion dictionary"
false_positives:
  - description: "Hardware part numbers or air-conditioning asset tags formatted AC + 8 digits."
    mitigation: "Enforcing tiers require explicit aged-care assessment or My Aged Care keywords within 300 characters."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 7
risk_description: >-
  The detector matches an Australian My Aged Care Client Identifier (AC + 8 digits) corroborated by aged-care assessment or care-package vocabulary. A genuine AC######## identifier persistently links a vulnerable older person across cognitive/functional assessments, Support at Home budgets, residential care admissions, and Serious Incident Response Scheme (SIRS) records. Risk 7 and SENSITIVE Personal-Privacy match au-ndis-number; PROTECTED requires clinical care files or SIRS abuse investigation dossiers.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: "CUI Specified"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "CONFIDENTIAL"
  ca_gov: "Protected B"
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy, and Medium because a My Aged Care ID persistently links an identifiable older person to aged-care functional, clinical, and funding records, paralleling au-ndis-number.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling reflects a national aged-care client identifier linking a vulnerable person to health and care-support records.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_my_aged_care_id
      matches:
        - ref: Keyword_au_mac_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_my_aged_care_id
      matches:
        - ref: Keyword_au_mac_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_my_aged_care_id
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_my_aged_care_id
      pattern: '(?-i)\b(AC\d{8})\b'
  keywords:
    - id: Keyword_au_mac_specific
      groups:
        - match_style: word
          terms:
            - "My Aged Care"
            - "Aged Care ID"
            - "My Aged Care ID"
            - text: "ACAT"
              case_sensitive: true
            - "AN-ACC"
            - "Support at Home"
            - "Home Care Package"
            - "referral code"
      strength: specific
    - id: Keyword_au_mac_broad
      groups:
        - match_style: word
          terms:
            - "aged care"
            - "residential care"
            - "respite care"
            - "care recipient"
            - "older person"
            - "geriatric"
      strength: domain
references:
  - url: https://www.myagedcare.gov.au/
    title: "Australian Government - My Aged Care portal and client record identifiers"
  - url: https://www.legislation.gov.au/C2024A00104/latest/text
    title: "Aged Care Act 2024 (Cth)"
created: '2026-11-25'
updated: '2026-11-25'
changelog:
  - version: 1.0.0
    date: '2026-11-25'
    description: Initial release.
author: testpattern-community
