schema: testpattern/v1
name: Customer segmentation outputs
slug: global-top500-371-customer-segmentation-outputs
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects customer segmentation outputs: a customer segmentation / segment or cluster assignment phrase combined with populated assignment data - rows keyed by a customer identifier, labelled segment/cluster/persona values or labelled customer identifiers. Phrase-only mentions (marketing plans, strategy decks) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: customer segmentation (outputs/results/model/file/extract), segment/cluster/persona assignment(s), customer segment(s), behavioural segment(s), micro-segment(s). 65 (discovery only): primary alone. 75: primary plus one populated structure - a delimited data row keyed by a customer identifier with a numeric value, a labelled segment/cluster/persona/micro-segment/value tier/life stage value, or a labelled customer/member/account/household ID. 85: primary plus two distinct structures (the three above or a delimited column header pairing a customer ID column with segment, cluster, persona, value-tier or life-stage columns) plus targeting evidence (propensity, lifetime value, affluence, life stage, household income band, inferred, lookalike audience, targeting, campaign eligibility, sensitive attribute). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: (?i)\b(?:customer\s+segmentation(?:\s+(?:outputs?|results?|models?|files?|extracts?))?|segment\s+assignments?|cluster\s+assignments?|persona\s+assignments?|customer\s+segments?|behaviou?ral\s+segments?|micro-?segments?)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated dataset structure (a data row keyed by a customer/record identifier, a labelled value or a labelled identifier) beside the topic phrase; a column header on its own only counts toward 85, so blank extracts stay at 65. Help pages, policies, product copy and news that only name the topic stay at 65. Medium because internal analytics documentation with worked examples can still reach 75.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - propensity
    - lifetime value
    - affluence
    - life stage
    - household income band
    - inferred
    - lookalike audience
    - targeting
    - campaign eligibility
    - sensitive attribute
  proximity: 300
test_cases:
  should_match:
    - value: "Customer segmentation outputs - k-means v3 (Sept 2026)\ncustomer_id,cluster_id,segment_name,value_tier,lifestage\n10442187,4,Stretched Young Families,Low,Parents with toddlers\n10442190,1,Affluent Empty Nesters,High,Retirees\nLookalike audience and campaign eligibility files built from clusters 1 and 4."
      description: Assignment extract - header, customer rows and targeting evidence (85)
      synthetic: true
    - value: "Customer segment assignment\nCustomer ID: 10442187\nReassigned after the September refresh."
      description: Single labelled customer identifier (75)
      synthetic: true
  should_not_match:
    - value: "Marketing guidance note: our customer segments are Young Families, Empty Nesters and Students. Use them to shape creative, not to exclude people from offers."
      description: Marketing guidance naming segments
      synthetic: true
    - value: "Segment assignment file\ncustomer_id,cluster_id,segment_name,value_tier\n"
      description: Blank extract - column header only (65)
      synthetic: true
    - value: "The supermarket said behavioural segments helped it target discounts, a news report said."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing customer segments.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of customer segments.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_customer_segmentation
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_371_customer_segmentation_outputs_column_header
            - Regex_global_top500_371_customer_segmentation_outputs_data_row
            - Regex_global_top500_371_customer_segmentation_outputs_labelled_value
            - Regex_global_top500_371_customer_segmentation_outputs_identifier
        - ref: Keyword_global_top500_371_customer_segmentation_outputs_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_371_customer_segmentation_outputs_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_customer_segmentation
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_371_customer_segmentation_outputs_data_row
            - Regex_global_top500_371_customer_segmentation_outputs_labelled_value
            - Regex_global_top500_371_customer_segmentation_outputs_identifier
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_371_customer_segmentation_outputs_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_customer_segmentation
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_customer_segmentation
      pattern: (?i)\b(?:customer\s+segmentation(?:\s+(?:outputs?|results?|models?|files?|extracts?))?|segment\s+assignments?|cluster\s+assignments?|persona\s+assignments?|customer\s+segments?|behaviou?ral\s+segments?|micro-?segments?)\b
    - id: Regex_global_top500_371_customer_segmentation_outputs_column_header
      pattern: (?i)\b(?:(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:segment(?:[ _]?(?:name|id|code))?|cluster(?:[ _]?id)?|persona|micro[ _]?segment|value[ _]?tier|lifestage|affluence)|(?:segment(?:[ _]?(?:name|id|code))?|cluster(?:[ _]?id)?|persona|micro[ _]?segment|value[ _]?tier|lifestage|affluence)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash))\b
    - id: Regex_global_top500_371_customer_segmentation_outputs_data_row
      pattern: (?i)\b[A-Z]{0,5}[-_]?\d{4,12}\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,160}?(?:[,;\t]|\|[ \t]{0,2}))?\"?-?\$?\d{1,12}(?:\.\d{1,6})?%?(?![\w.])
    - id: Regex_global_top500_371_customer_segmentation_outputs_labelled_value
      pattern: (?i)\b(?:segment(?:\s+(?:name|ID|code))?|cluster(?:\s+ID)?|persona|micro-?segment|value\s+tier|life\s?stage)[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9 &'/-]{1,40}
    - id: Regex_global_top500_371_customer_segmentation_outputs_identifier
      pattern: (?i)\b(?:customer\s*(?:no\.?|number|ID)|member\s*(?:no\.?|number|ID)|account\s*(?:no\.?|number|ID)|household\s+ID)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Za-z-]{0,8}\d)[A-Za-z0-9][A-Za-z0-9._@-]{3,64}
  keywords:
    - id: Keyword_global_top500_371_customer_segmentation_outputs_domain_evidence
      groups:
        - match_style: word
          terms:
            - propensity
            - lifetime value
            - affluence
            - life stage
            - household income band
            - inferred
            - lookalike audience
            - targeting
            - campaign eligibility
            - sensitive attribute
      strength: domain
    - id: Keyword_global_top500_371_customer_segmentation_outputs_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - shape creative
      strength: noise
risk_description: >-
  The concept detector recognises customer segments, cohort analysis, target audiences, clustering, and segmentation outputs, with the intended unit being customer assignments or a detailed segment file rather than high-level market personas. An attributed output can reveal demographic, behavioural, value, vulnerability, or preference inferences and planned targeting, enabling discrimination, manipulation, competitor poaching, or reputational harm across the included customers. The medium-confidence rule may also match public marketing material, methodology, and aggregate segment descriptions without identities. Risk 8 and SENSITIVE Personal-Privacy fit serious profiling harm; PROTECTED would require protected attributes or population-scale consequential use capable of significant damage. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs a populated customer assignment row, labelled segment/cluster value or labelled customer ID and 85 needs two distinct structures (header counts only toward 85) plus targeting evidence. Removed the self-corroborating evidence group and generic primaries (cohort analysis, target audience, demographic segment, customer classification, market segment). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA, My Health Records Act and TIA Act.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 958 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
