schema: testpattern/v1
name: University or TAFE Special Consideration, Extension or Deferred Exam Application
slug: au-tertiary-special-consideration-application
version: 1.1.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Applications for special consideration, assessment extensions, deferred or supplementary examinations for a named student, usually with medical, bereavement or personal-circumstance evidence.
operation: >-
  Primary: University or TAFE Special Consideration, Extension or Deferred Exam Application anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:special\s+consideration|deferred\s+(?:examination|exam|assessment)|(?:application\s+for\s+(?:an?\s+)?)?(?:assignment|assessment)\s+extension|supplementary\s+(?:examination|assessment))\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - education
  - health
  - pii
corroborative_evidence:
  keywords:
    - medical certificate
    - professional practitioner certificate
    - illness
    - hospital
    - bereavement
    - compassionate
    - misadventure
    - carer
  proximity: 300
customisation:
  - key: tertiary-student-number
    kind: identifier-format
    identifier: tertiary-student-number
    target: purview.regexes/Regex_au_tertiary_special_consideration_application_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's University / TAFE student number format (see docs/identifiers.md#tertiary-student-number). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Application for assignment extension, deferred examination or special consideration\nStudent name: Avery Teston\nStudent number: n11234567\nUnit: PSY2104\nGrounds: hospitalised 02/10/2026 to 06/10/2026 (pneumonia). Professional practitioner certificate attached."
      description: Populated record 1
      synthetic: true
    - value: "Deferred examination request\nStudent name: Riley Teston\nStudent ID: s4471820\nReason: death of a parent on 28/10/2026; funeral during exam week."
      description: Populated record 2
      synthetic: true
    - value: "Special consideration — outcome\nStudent number: 45118273\nGranted: supplementary assessment. Medical evidence (major depressive episode) verified by Student Wellbeing."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: If illness or misadventure affects your assessment you can apply for special consideration, an extension or a deferred examination with supporting evidence.
      description: Guidance or explainer text
    - value: "Special consideration application\nStudent name: __________\nStudent number: __________\nGrounds: __________"
      description: Blank form
    - value: Special consideration requests rose 18% during the 2025 exam period, the university reported.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_tertiary_special_consideration_application_primary
      matches:
        - ref: Regex_au_tertiary_special_consideration_application_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_tertiary_special_consideration_application_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_tertiary_special_consideration_application_primary
      matches:
        - ref: Regex_au_tertiary_special_consideration_application_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_tertiary_special_consideration_application_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_tertiary_special_consideration_application_primary
      pattern: >-
        (?i)\b(?:special\s+consideration|deferred\s+(?:examination|exam|assessment)|(?:application\s+for\s+(?:an?\s+)?)?(?:assignment|assessment)\s+extension|supplementary\s+(?:examination|assessment))\b
    - id: Regex_au_tertiary_special_consideration_application_record_structure
      pattern: >-
        (?i)\b(?:student\s+name|child(?:'s)?\s+name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|principal|school|(?:student|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_tertiary_special_consideration_application_corroborative
      groups:
        - match_style: word
          terms:
            - medical certificate
            - professional practitioner certificate
            - illness
            - hospital
            - bereavement
            - compassionate
            - misadventure
            - carer
            - evidence
            - due date
            - doctor
            - Student Wellbeing
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier identifies a university or tafe special consideration, extension or deferred exam application about an identified person, gated on populated record fields. Applications for special consideration, assessment extensions, deferred or supplementary examinations for a named student, usually with medical, bereavement or personal-circumstance evidence. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 7 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because a special
    consideration, extension or deferred exam application usually carries a named student's medical, bereavement or
    personal evidence. PROTECTED is not met because the record is a single short-term request with contained personal
    harm.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling fits the medical and personal evidence attached to an assessment request. It is
      not High because the impact stays with one student.
references:
  - title: QUT — Extensions, deferred exams and special consideration (anchor confirmed from official-domain search results; page fetch blocked)
    url: https://www.qut.edu.au/student-life/study-support/assessment-and-exam-help
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.1.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.1.0
    date: '2026-09-24'
    description: Declare identifier-format customisation slots (tertiary-student-number) replacing the interim identifier_dependencies metadata; definitions and replacement steps live in data/identifiers/ and docs/identifiers.md.
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
