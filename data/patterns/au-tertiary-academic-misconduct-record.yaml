schema: testpattern/v1
name: University or TAFE Academic Misconduct Record
slug: au-tertiary-academic-misconduct-record
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Academic misconduct and academic integrity case records for a named student: allegations and findings of plagiarism, collusion, contract cheating, fabrication or recycling, notices of allegation, hearings, penalties and appeals (TEQSA Threshold Standard 5.2).
operation: >-
  Primary: University or TAFE Academic Misconduct Record anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:academic\s+(?:misconduct|dishonesty)|academic\s+integrity\s+(?:breach|case|matter|investigation|outcome|allegation|finding)|contract\s+cheating|breach\s+of\s+academic\s+integrity|allegation\s+of\s+(?:plagiarism|collusion))\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Tertiary Education Quality and Standards Agency Act 2011 (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - education
  - pii
corroborative_evidence:
  keywords:
    - plagiarism
    - collusion
    - fabrication
    - Turnitin
    - similarity report
    - penalty
    - zero mark
    - essay mill
  proximity: 300
customisation:
  - key: tertiary-student-number
    kind: identifier-format
    identifier: tertiary-student-number
    target: purview.regexes/Regex_au_tertiary_academic_misconduct_record_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's University / TAFE student number format (see docs/identifiers.md#tertiary-student-number). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_au_tertiary_academic_misconduct_record_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Agency case / file / matter number format (see docs/identifiers.md#case-reference-number). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Academic misconduct allegation\nStudent name: Riley Teston\nStudent number: 45118273\nCourse: NUR2201\nAllegation: contract cheating — assignment purchased from an essay mill; document metadata author does not match.\nOutcome: fail grade for the course."
      description: Populated record 1
      synthetic: true
    - value: "Academic integrity outcome\nStudent name: Morgan Teston\nStudent ID: s4471820\nFinding: collusion with another student in Assignment 2 (similarity report 62%). Penalty: zero mark for the assessment."
      description: Populated record 2
      synthetic: true
    - value: "Notice of allegation of academic misconduct\nStudent number: n11234567\nYou are invited to respond within 10 working days to the allegation of plagiarism in LAW3102 Assessment 1."
      description: Narrative record 3 without labelled fields (reaches 65 discovery only, by design)
      synthetic: true
  should_not_match:
    - value: Academic misconduct includes plagiarism, collusion, contract cheating and fabrication. Students found to have breached academic integrity may receive a penalty.
      description: Guidance or explainer text
    - value: "Academic misconduct report form\nStudent name: __________\nStudent number: __________\nNature of allegation: __________"
      description: Blank form
    - value: TEQSA blocked access to 400 contract cheating websites in 2025, the regulator announced.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_tertiary_academic_misconduct_record_primary
      matches:
        - ref: Regex_au_tertiary_academic_misconduct_record_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_tertiary_academic_misconduct_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_tertiary_academic_misconduct_record_primary
      matches:
        - ref: Regex_au_tertiary_academic_misconduct_record_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_tertiary_academic_misconduct_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_tertiary_academic_misconduct_record_primary
      pattern: >-
        (?i)\b(?:academic\s+(?:misconduct|dishonesty)|academic\s+integrity\s+(?:breach|case|matter|investigation|outcome|allegation|finding)|contract\s+cheating|breach\s+of\s+academic\s+integrity|allegation\s+of\s+(?:plagiarism|collusion))\b
    - id: Regex_au_tertiary_academic_misconduct_record_record_structure
      pattern: >-
        (?i)\b(?:student\s+name|child(?:'s)?\s+name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|principal|school|(?:student|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_tertiary_academic_misconduct_record_corroborative
      groups:
        - match_style: word
          terms:
            - plagiarism
            - collusion
            - fabrication
            - Turnitin
            - similarity report
            - penalty
            - zero mark
            - essay mill
            - file-sharing
            - hearing
            - appeal
            - notation
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier identifies a university or tafe academic misconduct record about an identified person, gated on populated record fields. Academic misconduct and academic integrity case records for a named student: allegations and findings of plagiarism, collusion, contract cheating, fabrication or recycling, notices of allegation, hearings, penalties and appeals (TEQSA Threshold Standard 5. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 7 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: TEQSA — Academic integrity (anchor confirmed from official-domain search results; page fetch blocked)
    url: https://www.teqsa.gov.au/guides-resources/higher-education-good-practice-hub/academic-integrity
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.1.0
    date: '2026-09-24'
    description: Declare identifier-format customisation slots (tertiary-student-number, case-reference-number) replacing the interim identifier_dependencies metadata; definitions and replacement steps live in data/identifiers/ and docs/identifiers.md.
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
