changelog:
  - version: 1.5.0
    date: '2026-11-16'
    description: 'Temporary credentials: added Pattern_aws_session_token_label (aws_session_token / AWS_SESSION_TOKEN / SessionToken, a separator, then at least 40 Base64 characters) as an alternative to the AWS identity phrase on the 75 and 85 tiers. An access key ID with a labelled session token now reaches 75, and with a labelled secret key as well reaches 85; before, a real temporary credential set stayed at 65 unless a phrase such as "AWS IAM credential" was also present. The session token is evidence only, never a primary match, and only with its label. Pattern_aws_secret_key_pair now also accepts the STS response label SecretAccessKey and quoted values. Added test cases, pattern-specific false positives and the AWS documentation references; description, operation and confidence justification rewritten.'
  - version: 1.4.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking. An existing group around part of the match became (?:...).'
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.3
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references."
  - version: 1.3.2
    date: '2026-07-19'
    description: 'Replace duplicated high tiers with an individual 65 discovery / 75 AWS-labelled / 85 access-key-and-secret-pair contract and exact-tier adversarial probes.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1214 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 90 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
