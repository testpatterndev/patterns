schema: testpattern/v1
name: AWS Access Key
slug: global-aws-access-key
version: 1.5.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects AWS access key IDs and other IAM unique identifiers by prefix, including long-term keys (AKIA) and the temporary keys AWS STS issues (ASIA). Confidence rises when the identifier sits next to
  a labelled secret access key or, for temporary credentials, a labelled session token.
operation: >-
  Reference: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html The primary regex is a known IAM prefix followed by 16 upper-case alphanumeric characters. Tiers: 65
  discovery-only for the bare identifier; 75 when an AWS identity phrase or a labelled session token is within 300 characters; 85 when, in addition, a labelled secret access key is present. The session
  token counts only with its label (aws_session_token, AWS_SESSION_TOKEN or SessionToken, then a separator and the first 40 Base64 characters of the token, so a token wrapped across lines still counts): a
  long Base64 string without the label is not evidence, and a session token never fires a tier without an access key ID. The secret-key label accepts AWS_SECRET_ACCESS_KEY and SecretAccessKey, with or without quotes. Uses explicit exclusion logic for
  template/sample/test text.
pattern: \b((?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16})\b
confidence: high
confidence_justification: >-
  High confidence: the identifier has a documented prefix and a fixed length, and the enforce tiers need independent AWS evidence beside it. The session-token and secret-key evidence is label-anchored
  on the names AWS documents for its credentials file, environment variables and STS responses, so unlabelled Base64 near an identifier stays at discovery. AWS does not fix the session token's length,
  so the evidence regex asks only for its first 40 characters.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - CIS Controls
  - ISO 27001
  - NIST CSF
  - PCI-DSS
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - api key
    - api_key
    - apikey
    - access key
    - secret key
    - private key
    - auth token
    - authorization
  proximity: 300
  keyword_lists:
    - credentials
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: AGPA7M4N2P9Q6R8T3V5X
      description: Exact 65 probe - structurally valid AWS identifier without independent IAM context
    - value: 'AWS access key ID: AKIA9Z8Y7X6W5V4U3T2S'
      description: Exact 75 probe - access key identifier with an AWS-specific field label
    - value: "AWS IAM credential\nAWS_ACCESS_KEY_ID=ASIA6R5T4Y3U2I1O9P8L\nAWS_SECRET_ACCESS_KEY=Z9pL2mN7qR4sT8vW1xY5aB3cD6eF0gH2iJ4kL7mN"
      description: Exact 85 probe - access key ID independently paired with a populated secret key
    - value: "export AWS_ACCESS_KEY_ID=ASIA6R5T4Y3U2I1O9P8L\nexport AWS_SESSION_TOKEN=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
      description: Exact 75 probe - temporary (ASIA) access key ID with a labelled session token in environment-variable form, no secret key
    - value: "[default]\naws_access_key_id = ASIA6R5T4Y3U2I1O9P8L\naws_secret_access_key = Z9pL2mN7qR4sT8vW1xY5aB3cD6eF0gH2iJ4kL7mN\naws_session_token = ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
      description: Exact 85 probe - temporary credential set in credentials-file form (key ID, secret key and labelled session token)
    - value: '{"Credentials": {"AccessKeyId": "ASIA6R5T4Y3U2I1O9P8L", "SecretAccessKey": "Z9pL2mN7qR4sT8vW1xY5aB3cD6eF0gH2iJ4kL7mN", "SessionToken": "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"}}'
      description: Exact 85 probe - temporary credential set as returned in an STS JSON response
  should_not_match:
    - value: ASIA6R5T4Y3U2I1O9P8L ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/
      description: Temporary access key ID next to a long Base64 string with no session-token label stays at discovery
    - value: ASIA6R5T4Y3U2I1O9P8L session_token=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/
      description: A generic session_token label is not the AWS label (aws_session_token / SessionToken)
    - value: 'ASIA6R5T4Y3U2I1O9P8L aws_session_token = to-be-filled-in'
      description: Session-token label with no token value after it is not evidence
    - value: XKIAIOSFODNN7EXAMPLE
      description: Invalid prefix (XKIA instead of AKIA/ASIA/etc.)
    - value: AKIA123456789012345
      description: Too few characters after prefix (15 instead of 16)
    - value: AKIAIOSFODNN7EXAMP!E
      description: Contains special character (!) not in allowed set
    - value: 'AZURE_CLIENT_ID=AKIA9Z8Y7X6W5V4U3T2S'
      description: Sibling cloud-provider assignment does not provide AWS corroboration
    - value: 'Documentation example: AWS IAM credential AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
      description: AWS documentation placeholder pair is excluded
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
false_positives:
  - description: >-
      IAM unique IDs that are not credentials. AROA (role), AIDA (user), AGPA (group) and similar prefixes share the shape and appear in policies, CloudTrail logs and STS responses.
    mitigation: >-
      On their own they stay at the 65 discovery tier. The 85 tier needs a labelled secret access key as well, which an identifier in a policy or log does not have.
  - description: Expired temporary credentials. An ASIA key with its session token in an old log or ticket is usually dead, since STS credentials last from minutes to hours.
    mitigation: The pattern cannot test validity. Treat a recent match as live; for older content, check the timestamp against the session duration before escalating.
  - description: AWS documentation values such as AKIAIOSFODNN7EXAMPLE and ASIAIOSFODNN7EXAMPLE copied into runbooks and tutorials.
    mitigation: The template-exclusion dictionary suppresses content framed as an example, but a bare copy of the documentation values with no such framing still matches.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_aws_access_key
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_aws_access_key
      matches:
        - type: any
          min_matches: 1
          refs:
            - Keyword_aws_identity_context
            - Pattern_aws_session_token_label
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 85
      id_match: Regex_aws_access_key
      matches:
        - type: any
          min_matches: 1
          refs:
            - Keyword_aws_identity_context
            - Pattern_aws_session_token_label
        - ref: Pattern_aws_secret_key_pair
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_aws_access_key
      pattern: \b((?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16})\b
    - id: Pattern_aws_secret_key_pair
      pattern: (?i)\b((?:AWS_SECRET_ACCESS_KEY|SecretAccessKey)["']?\s*[=:]\s*["']?[A-Za-z0-9/+=]{32,64})
    - id: Pattern_aws_session_token_label
      pattern: (?i)\b((?:aws_session_token|SessionToken)["']?\s*[=:>]\s*["']?[A-Za-z0-9/+]{40})
  keywords:
    - id: Keyword_aws_identity_context
      groups:
        - match_style: string
          terms:
            - AWS access key ID
            - AWS IAM credential
            - Amazon IAM access key
            - AWS security credential
      strength: specific
risk_description: >-
  This regex detects an AWS access key ID with a recognized prefix and fixed identifier length, not the paired secret access key required to sign requests. Disclosure can reveal that an AWS principal exists and can help correlate logs, repositories, or a separately leaked secret, but the identifier alone cannot authenticate. The immediate impact on the AWS account owner is therefore low and usually reversible, with material additional credential and account context needed for misuse. Risk 5 OFFICIAL recognizes the identifier's security relevance; a matched secret pair or session credential would justify a higher classification.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 remains PSPF OFFICIAL, QGISCF OFFICIAL, and OFFICIAL DLM because an AWS access key ID is an identifier and
    only one component of request-signing credentials. SENSITIVE is not met by the normal match because a secret access
    key or other authentication material is still required for direct access.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic treatment is Low with Low handling for an access-key identifier by itself, while correlation with a secret
      should immediately invoke the stronger credential policy. It is not Medium merely because the identifier belongs
      to a cloud account; direct misuse is not possible from this value alone.
references:
  - title: "Criminal Code Act 1995 (Cth)"
    url: https://www.legislation.gov.au/C2004A04868/latest/text
  - title: "IAM identifiers, unique ID prefixes - AWS IAM User Guide (AKIA is an access key; ASIA is a temporary AWS STS access key ID, unique only together with the secret access key and session token)"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
  - title: "Configuration and credential file settings - AWS CLI User Guide (aws_session_token setting; credentials-file examples pairing an ASIA key ID with aws_session_token)"
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
  - title: "Environment variables - AWS CLI User Guide (AWS_SESSION_TOKEN is required with temporary credentials from AWS STS and overrides aws_session_token)"
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-envvars.html
  - title: "Credentials data type - AWS STS API Reference (response fields AccessKeyId, SecretAccessKey and SessionToken)"
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_Credentials.html
  - title: "GetSessionToken - AWS STS API Reference (session token size is not fixed and no maximum should be assumed; sample response with a Base64 token)"
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_GetSessionToken.html
