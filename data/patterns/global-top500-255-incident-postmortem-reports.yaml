schema: testpattern/v1
name: Incident postmortem reports
slug: global-top500-255-incident-postmortem-reports
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies incident postmortems and post-incident reviews with populated incident detail: timestamped timeline entries, incident/problem references, impact metrics or affected hosts. Generic "timeline", "root cause" and "lessons learned" wording no longer matches.
operation: >-
  Regex_incident_postmortem (incident/outage/blameless postmortem, postmortem report/review for an incident/outage, post-incident review/report/analysis, PIR report, incident retrospective, root cause analysis for an incident/outage) is discovery-only at 65. 75 requires one structure: a timestamped timeline entry, a labelled incident/problem/ticket reference, an impact metric (duration, time to detect/resolve, users affected, error rate), or an internal host. 85 requires two distinct structures plus findings wording (contributing factor, corrective action, action item, detection gap, rollback, lessons learned). Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: (?i)\b(?:(?:incident|outage|blameless)\s+post[\s-]?mortems?|post[\s-]?mortem\s+(?:report|review|document|analysis)\s+(?:for|of|on)\s+(?:the\s+)?(?:incident|outage|INC)|post[\s-]incident\s+(?:review|report|analysis)|PIR\s+(?:report|document)|incident\s+retrospective|root\s+cause\s+analysis\s+(?:report\s+)?for\s+(?:the\s+)?(?:incident|outage|INC))\b
confidence: medium
confidence_justification: >-
  Medium confidence: postmortem wording is discovery-only; enforcement requires timeline, reference, metric or host structure, and 85 adds a second structure and findings context.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
data_categories:
  - security
  - technology
corroborative_evidence:
  keywords:
    - contributing factor
    - corrective action
    - action item
    - detection gap
    - lessons learned
  proximity: 300
test_cases:
  should_match:
    - value: |-
        Incident postmortem - payments outage (blameless)
        Incident ID: INC0048213   Duration: 47 minutes   Customers affected: ~1,900
        Timeline (AEST):
        09:02 - Deploy of payments-api 2.14.0 to pay-app03.example.internal
        09:06 - Error rate alert fired in the monitoring console
        09:49 - Rollback completed and service restored
        Contributing factor: connection pool limit halved in the new release.
        Corrective action: add a pool-size check to the release pipeline (owner: Platform team).
      description: High tier (85) - incident reference, impact metrics, timeline entries and host with contributing factor/corrective action
      synthetic: true
    - value: 'Post-incident review for the email outage - Incident ID: INC0051190, service restored after the relay swap.'
      description: Medium tier (75) - incident reference only
      synthetic: true
    - value: 'Outage postmortem notes: time to detect: 22 minutes because the alert was muted.'
      description: Medium tier (75) - impact metric only
      synthetic: true
    - value: The post-incident review meeting is booked for Tuesday.
      description: Discovery tier (65) - postmortem wording only
      synthetic: true
  should_not_match:
    - value: The project timeline slipped by two weeks.
      description: Generic timeline wording is no longer a primary
    - value: The coroner ordered a post-mortem examination.
      description: Medical post-mortem
    - value: 'Guidance note: a good post-incident review records a timeline, contributing factors and corrective actions.'
      description: Guidance text
    - value: |-
        Postmortem report template
        Incident ID: ______
        Duration: ______
        00:00 - ______
      description: Blank template
    - value: 'Training module: this mock incident postmortem walks through an outage at 09:00 - Alert fired, Duration: 30 minutes.'
      description: Training/mock framing must not enforce
false_positives:
  - description: SRE guidance, postmortem-writing templates and training describe timelines and corrective actions.
    mitigation: Postmortem wording is discovery-only; enforcement needs populated structure, and guidance/training/mock/template framing is excluded.
  - description: Medical/coronial post-mortem examinations.
    mitigation: Primary requires incident/outage/blameless context or an incident reference after postmortem report/review.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_incident_postmortem
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_timeline_entry
            - Evidence_incident_reference
            - Evidence_impact_metric
            - Evidence_system_host
        - ref: Keyword_postmortem_findings
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_incident_postmortem
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_timeline_entry
            - Evidence_incident_reference
            - Evidence_impact_metric
            - Evidence_system_host
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_incident_postmortem
  regexes:
    - id: Regex_incident_postmortem
      pattern: (?i)\b(?:(?:incident|outage|blameless)\s+post[\s-]?mortems?|post[\s-]?mortem\s+(?:report|review|document|analysis)\s+(?:for|of|on)\s+(?:the\s+)?(?:incident|outage|INC)|post[\s-]incident\s+(?:review|report|analysis)|PIR\s+(?:report|document)|incident\s+retrospective|root\s+cause\s+analysis\s+(?:report\s+)?for\s+(?:the\s+)?(?:incident|outage|INC))\b
    - id: Evidence_timeline_entry
      pattern: (?i)\b(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?\s?(?:UTC|AEST|AEDT|GMT|Z)?\s{0,3}[-–|]\s{0,3}[A-Za-z]
    - id: Evidence_incident_reference
      pattern: (?i)\b(?:incident\s+(?:ID|ref(?:erence)?|number|no\.?)|problem\s+(?:ID|record|number)|ticket)\s*[:#=|]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._@-]{1,60}
    - id: Evidence_impact_metric
      pattern: (?i)\b(?:duration|outage\s+duration|time\s+to\s+(?:detect|resolve|recover|mitigate)|MTT[DRA]|TT[DRM]|users?\s+affected|customers?\s+affected|error\s+rate|requests?\s+failed)\s{0,3}[:=]\s{0,3}(?:~\s{0,2}|approx\.?\s{0,2})?\d
    - id: Evidence_system_host
      pattern: (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:hostname|host|server|asset\s+ID|device\s+ID|node|instance)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._-]{2,63}
  keywords:
    - id: Keyword_postmortem_findings
      groups:
        - match_style: word
          terms:
            - contributing factor
            - corrective action
            - action item
            - detection gap
            - rollback
            - lessons learned
            - remediation owner
            - trigger event
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
risk_description: >-
  The detector identifies incident postmortems when timeline entries, incident references, impact metrics or hosts are present; postmortem wording alone is discovery-only. A genuine report can expose failure sequences, control gaps, affected components, recovery constraints, and incomplete corrective actions that facilitate repeat disruption. Process templates, retrospective guidance, and non-security project reviews can match, while one postmortem is bounded to the incident described. Risk 7 SENSITIVE reflects moderate operational harm from a substantive internal report; PROTECTED would require critical-service detail or significant damage demonstrated by the content.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 aligns with OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, SENS_IT, and Medium because an
    authentic incident postmortem can materially expose weaknesses and recovery dependencies. The detector does not
    establish incident severity, current exploitable conditions, or consequences sufficient for PROTECTED.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic Medium with Medium InfoTech fits internal operational analysis whose disclosure can enable targeted repeat
      failure. Generic High requires evidence of a critical incident, broad systemic weakness, or major consequence
      beyond the postmortem topic.
created: '2026-02-08'
updated: '2026-09-25'
changelog:
  - version: 1.4.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): narrowed the primary from bare postmortem/timeline/root cause/corrective actions/lessons learned to incident/outage postmortems, post-incident reviews, PIRs, incident retrospectives and incident RCAs (bare "post-mortem" no longer hits coronial text); 75 requires a timeline entry, incident reference, impact metric or host and 85 requires two distinct structures plus findings wording (removes same-span lessons learned/corrective action self-corroboration); guidance/news/training exclusion added; bare-phrase tests replaced with a synthetic postmortem and decoys. Replaced GDPR with Criminal Code Act 1995 (Cth); added ISO 27001/NIST CSF frameworks and verified NIST SP 800-61r3 / ISM references; data_categories credentials -> technology.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1814 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
