schema: testpattern/v1
name: Bank Account with Payment Authorisation Token
slug: bank-account-with-payment-authorisation-token
version: 1.5.0
type: regex
pattern_class: identifier
engine: universal
description: Detects government bank account details (BSB + account number) combined with payment authorisation credentials, approval tokens, or signing authorities that together enable the initiation of payments.
operation: >-
  BSB shape (65 alone, discovery) within 300 characters of a 6-10 digit account number and authorisation context. 75 = BSB + account number + either a labelled payment authorisation reference (payment token, authorisation/approval/release code or number) or both authorisation vocabulary and a payment-method term (EFT, BECS, ABA file, batch payment ...). 85 = BSB + account number + payment-method term + a PROTECTED/confidential/dual-authorisation marker or authorisation vocabulary. Template, 'pay your' and supplier-registration framing excluded.
pattern: \b\d{3}-?\d{3}\b
confidence: medium
confidence_justification: >-
  Medium confidence: BSB plus account number plus payment-authorisation context is a specific combination; authorisation references are system-specific, so the token is a documented label-anchored fallback.
jurisdictions:
  - au
regulations:
  - "Financial Accountability Act 2009 (Qld)"
frameworks:
  - QGISCF
data_categories:
  - financial
  - government
corroborative_evidence:
  keywords:
    - authorisation
    - authorised
    - approval
    - approved
    - signing authority
    - payment token
    - EFT
    - batch payment
    - BECS
    - direct entry
    - ABA file
    - payment instruction
    - bank account
    - BSB
  proximity: 300
  keyword_lists:

    - corporate-finance

    - government-services
customisation:
  - key: payment-authorisation-reference
    kind: identifier-format
    identifier: payment-authorisation-reference
    target: purview.regexes/Regex_bank_account_with_payment_authorisation_token_payment_authorisation_reference
    mode: replace
    affects_tiers: [75]
    required_for_enforcement: false
    note: Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#payment-authorisation-reference). Earlier versions used the AUTH-YYYY-NNNNN token format, which does not appear in any published source.
test_cases:
  should_match:
    - value: 'PROTECTED — Payment Authorisation File. BSB: 064-000, Account: 12345678. Payment token: PT88205531. Authorised signatory: J. Smith (Delegate Level 3). Batch payment approved for $2,450,000 via BECS direct entry. Released for processing.'
      description: Payment authorisation with BSB, account, and approval token (reaches 85)
    - value: 'EFT Payment Instruction — PROTECTED. Account BSB 084-004 Account No 98765432. Signing authority: Dual authorisation required. First approver: A. Jones (approved). Second approver: B. Williams (approved). Payment amount: $890,000. ABA file generated.'
      description: Dual-authorised payment with BSB and signing authority (reaches 85)
    - value: 'PROTECTED — Batch payment authorisation. BSB: 032-001, Account: 45678901. Authorised signatory: K. Brown (Delegate Level 4). Payment token: PT88207720. Released for processing via BECS direct entry.'
      description: Batch payment with BSB, account, and approval token (reaches 85)
    - value: 'BSB 032-001 Account 45678901; dual authorisation by K Brown and S Tran; ABA file released for processing.'
      description: Account number plus dual authorisation and release evidence satisfy the non-token enforcing branch (reaches 85)
    - value: "Payment release record\nBSB 064-000 Account 12345678\nPayment token: PT88205531"
      description: BSB + account + labelled payment token, no payment-method or marker evidence (reaches 75)
      synthetic: true
  should_not_match:
    - value: 'Please update your bank details for salary payments. BSB: ___ Account: ___. Submit to HR with a void cheque or bank statement.'
      description: Blank bank details form — no authorisation context
    - value: 'Supplier registration: Company ABC Pty Ltd. Please provide your bank details on the attached form for accounts payable setup. No banking numbers recorded yet.'
      description: Routine supplier onboarding prose with no BSB, account, or token values
    - value: 'Pay your fee to BSB 064-000 account 12345678.'
      description: Inbound payment instruction — pay-your exclusion applies and there is no authorisation evidence
    - value: 'Example: BSB 111-222 account 12345678 payment token PT00000001.'
      description: Example-prefixed training text — noise exclusion overrides credential-shaped content
    - value: 'BSB 064-000 payment BSB payment.'
      description: BSB with repeated generic payment words — no account number or authorisation path, so no enforcement
    - value: Accounts receivable reconciled yesterday's customer deposits.
      description: Routine financial operations with no BSB, account number, or authorisation content
    - value: "Policy: payments above $50,000 need dual authorisation by two financial delegates before the ABA file is released for processing via BECS direct entry."
      description: Finance policy guidance naming the controls without any account details (must stay below 75)
    - value: "Payment release form\nBSB: ______\nAccount number: ________\nPayment token: ________\nAuthorised signatory: ________"
      description: Blank payment release form (must stay below 75)
false_positives:
  - description: Routine bank detail collection forms for HR or accounts payable
    mitigation: Require authorisation/approval context (not just BSB + account) to distinguish from SENS_Fin patterns
  - description: Published banking details for government payment receipt (e.g., fine payments)
    mitigation: Exclude documents containing 'pay your', 'payment to government', 'revenue account' indicating inbound payments
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_bank_account_with_payment_authorisation_token_bsb_format_e_g_064_000_or_064000
      matches:
        - ref: Pattern_bank_account_with_payment_authorisation_token_bank_account_number_6_10_digits
        - ref: Evidence_bank_account_with_payment_authorisation_token_payment_methods
        - type: any
          min_matches: 1
          refs:
            - Evidence_bank_account_with_payment_authorisation_token_markers
            - Evidence_bank_account_with_payment_authorisation_token_authorisation
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_bank_account_with_payment_authorisation_token_exclusion
    - confidence_level: 75
      id_match: Pattern_bank_account_with_payment_authorisation_token_bsb_format_e_g_064_000_or_064000
      matches:
        - ref: Pattern_bank_account_with_payment_authorisation_token_bank_account_number_6_10_digits
        - ref: Regex_bank_account_with_payment_authorisation_token_payment_authorisation_reference
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_bank_account_with_payment_authorisation_token_exclusion
    - confidence_level: 75
      id_match: Pattern_bank_account_with_payment_authorisation_token_bsb_format_e_g_064_000_or_064000
      matches:
        - ref: Pattern_bank_account_with_payment_authorisation_token_bank_account_number_6_10_digits
        - type: any
          min_matches: 2
          refs:
            - Evidence_bank_account_with_payment_authorisation_token_authorisation
            - Evidence_bank_account_with_payment_authorisation_token_payment_methods
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_bank_account_with_payment_authorisation_token_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_bank_account_with_payment_authorisation_token_bsb_format_e_g_064_000_or_064000
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_bank_account_with_payment_authorisation_token_exclusion
  regexes:
    - id: Pattern_bank_account_with_payment_authorisation_token_bsb_format_e_g_064_000_or_064000
      pattern: \b\d{3}-?\d{3}\b
    - id: Pattern_bank_account_with_payment_authorisation_token_bank_account_number_6_10_digits
      pattern: \b\d{6,10}\b
    - id: Regex_bank_account_with_payment_authorisation_token_payment_authorisation_reference
      pattern: >-
        (?i)\b(?:payment\s+(?:token|authori[sz]ation\s+(?:code|no\.?|number|ref(?:erence)?))|(?:authori[sz]ation|approval|release)\s+(?:token|code|no\.?|number|ref(?:erence)?|ID))\s*[:#]?\s*(?:[A-Z]{1,6}[/-]?)?\d[A-Z0-9/-]{3,20}\b
  keywords:
    - id: Evidence_bank_account_with_payment_authorisation_token_authorisation
      groups:
        - match_style: word
          terms:
            - authorisation
            - authorised
            - approval
            - approved
            - signing authority
            - payment token
            - signatory
            - delegate
      strength: domain
    - id: Evidence_bank_account_with_payment_authorisation_token_payment_methods
      groups:
        - match_style: word
          terms:
            - text: EFT
              case_sensitive: true
            - batch payment
            - BECS
            - direct entry
            - ABA file
            - payment instruction
            - released for processing
      strength: specific
    - id: Evidence_bank_account_with_payment_authorisation_token_markers
      groups:
        - match_style: word
          terms:
            - PROTECTED
            - confidential
            - restricted
            - dual authorisation
      strength: domain
    - id: Filter_bank_account_with_payment_authorisation_token_exclusion
      groups:
        - match_style: word
          terms:
            - template
            - please provide
            - update your bank details
            - pay your
            - payment to government
            - supplier registration form

      strength: noise
  filters:
    - id: Guard_bank_account_with_payment_authorisation_token_same_digits
      type: AllDigitsSameFilter
risk_rating: 8
risk_description: >-
  The regex identifies a BSB and account number near approval, signing, or payment-authorisation language, distinguishing a payment-control record from ordinary bank details. A genuine record can help initiate, redirect, or fraudulently approve payments because it combines destination data with evidence of an authorising mechanism or role. Routine bank-detail collection forms and published receipt accounts can match the banking portion, so the authorisation context must be substantive before intervention. Risk 8 SENSITIVE reflects serious but transaction-bounded financial harm; PROTECTED would require broad signing authority, a critical payment platform, or significant damage beyond the matched record.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
references:
  - title: Financial Accountability Act 2009 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-009
created: '2026-02-20'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): replaced the invented AUTH-YYYY-NNNNN token regex with the new payment-authorisation-reference labelled fallback (payment token / authorisation code / release code + digit-bearing value), declared as an identifier-format customisation slot on the 75 tier; tests converted to labelled tokens; added a finance-policy guidance decoy and a blank release-form decoy; references added. The 2026-07-06 tenant verdict (ERROR) predates the 2026-07-18 change and should be re-run.'
  - version: 1.4.1
    date: '2026-07-18'
    description: >-
      Quality bar: confidence high->medium for digit/identifier shapes where structural FP risk makes 'high' dishonest without checksum/strong label evidence.
  - version: 1.4.0
    date: '2026-07-16'
    description: 'sit-alignment-validation-2026-07-16 wave1 (TP-00658): tier rebalance — every enforcing branch now requires a nearby 6-10 digit account number; 75 requires BSB+account plus one authorisation path (explicit AUTH token, or dual/signing approval AND payment instruction/release evidence — not both paths); 85 requires BSB+account plus payment method/release evidence and a protected marking or dual-approval signal (drops the old all-elements-conjunctive shape); BSB alone remains 65 discovery. AllDigitsSameFilter and inbound-payment/supplier/template exclusions retained. Adversarial test cases added.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1444 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.1.1
    date: '2026-07-06'
    description: Add AllDigitsSameFilter guard — primary regex accepted all-zeros/same-digit BSB values (e.g. 000-000); mirrors au-medicare-card-identifier protection.
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
