schema: testpattern/v1
name: Queensland Local Disaster Management Group Contact List or Activation Roster
slug: au-qld-ldmg-contact-list
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Contact lists, call-out lists and activation rosters for a Queensland council's Local Disaster Management Group (LDMG) that hold members' private after-hours mobiles, home phone numbers, home addresses or personal email addresses. Every local government must establish a Local Disaster Management Group (Disaster Management Act 2003 s 29), whose chairperson appoints a local disaster coordinator (s 35). The council gives written notice of the group's members to the police commissioner and the district group each year (s 37). The local disaster management plan must be available for inspection and on the council website (s 60), so published LDMG membership that lists roles and office numbers is public and is a decoy. Information acquired in performing a function under the Act must not be disclosed (s 139). Vulnerable persons registers are covered by au-qld-disaster-vulnerable-persons-register.
operation: >-
  Primary: Local Disaster Management Group, LDMG, [deputy] local disaster coordinator, optionally followed by contact list / details / directory / register, contacts, phone list, membership [list], member list, activation roster / list / contacts, roster, call-out list or on-call roster. 75 requires, within 300 characters, one populated private contact field: an after-hours / AH / home / private / personal / mobile / cell phone label followed by an Australian phone number, a home / residential / private address followed by a street address, a personal / private / home email followed by an email address, or an Australian mobile followed by (AH), (after hours), (home), (private) or (personal). Office, switchboard and enquiries numbers do not count. 85 requires two distinct private contact values (min_count 2, unique) plus a named member entry (name, member, chair[person], deputy chair[person], [deputy] local disaster coordinator / LDC, delegate, proxy, contact / duty / on-call / liaison officer, followed by a name of two or more capitalised words that is not a role word such as Mayor or Chief Executive Officer) plus a roster / activation evidence term (activation, activated, stood up, stand up, lean forward, on call, on-call, roster, after hours, call-out, phone tree, contact list). Values must be on the same line as their label and are placeholder-guarded. All enforce tiers AND NOT the shared template-exclusion dictionary and a guidance exclusion (available for inspection, public version, fact sheet, frequently asked questions, media release). 65 is discovery-only.
pattern: >-
  (?i)\b(?:Local\s+Disaster\s+Management\s+Group|LDMG|(?:deputy\s+)?local\s+disaster\s+coordinator)(?:\s+(?:contact\s+(?:list|details|directory|register)|contacts|phone\s+list|membership(?:\s+list)?|member\s+list|activation\s+(?:roster|list|contacts)|roster|call[- ]?out\s+list|on[- ]call\s+roster))?\b
confidence: medium
confidence_justification: >-
  Medium-low. The group and coordinator names are statutory (Disaster Management Act 2003 ss 29, 35), but they also fill public disaster plans, council web pages and news, and contact lists are usually tables where labels are sparse. Enforce tiers therefore need a private contact value (an after-hours / home / private / mobile label, a home address, a personal email, or a mobile marked AH / home). A plain "Mobile:" label counts, so a published media or duty mobile next to LDMG text can reach 75. Contact lists with no labels and no AH markers stay at 65; generic phone classifiers catch those. Roster and activation terms are council practice, not statutory, and are used only as 85 evidence. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Disaster Management Act 2003 (Qld) ss 29, 33, 35, 37
  - Disaster Management Act 2003 (Qld) ss 57, 60 (local disaster management plan, public inspection)
  - Disaster Management Act 2003 (Qld) s 139 (confidentiality)
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - contact-information
  - government
corroborative_evidence:
  keywords:
    - LDMG
    - local disaster coordinator
    - activation
    - on call
    - after hours
    - roster
    - contact list
  proximity: 300
test_cases:
  should_match:
    - value: "LDMG activation contact list - after hours\nLocal disaster coordinator: Jordan Teston\nAfter hours mobile: 0491 570 156\nHome address: 22 Banksia Drive, Mackay QLD 4740\nDeputy LDC: Casey Teston\nMobile: 0491 570 157 (AH)"
      description: LDMG activation contact list with named coordinators, after-hours mobiles and a home address (85 tier)
      synthetic: true
    - value: "Local Disaster Management Group activation roster (on call this weekend)\nChairperson - Cr Morgan Teston - 0491 570 160 (home)\nLDC - Riley Teston - 0491 570 161 (AH)\nSES liaison officer - Avery Teston - 0491 570 163 (private)"
      description: Activation roster rows with names and home / AH / private mobiles (85 tier)
      synthetic: true
    - value: "To all LDMG members: please check your after hours details before the storm season.\nPrivate mobile: 0491 570 162"
      description: LDMG member email with a private mobile (75 tier)
      synthetic: true
    - value: "Local disaster coordinator on-call arrangements for the long weekend. Home phone: 07 4999 5678"
      description: Coordinator on-call note with a home phone (75 tier)
      synthetic: true
  should_not_match:
    - value: "LDMG membership\nChair: Mayor\nDeputy chair: Deputy Mayor\nLocal Disaster Coordinator: Chief Executive Officer\nQueensland Police Service: Officer in Charge, Harbourview Station\nLDMG enquiries phone: 07 4999 1234"
      description: Published LDMG membership with roles and an office number only (65 only)
    - value: "35 Local disaster coordinator (1) The chairperson of the local group must, after consulting with the police commissioner, appoint the chief executive officer or an employee of the relevant local government as a local disaster coordinator of the group."
      description: Disaster Management Act 2003 s 35 text (legislation, 65 only)
    - value: "LDMG contact list\nName: ______________\nAfter hours mobile: ______________\nHome address: ______________\nPersonal email: ______________"
      description: Blank contact list form (65 only)
    - value: "The Local Disaster Management Group was stood up at 6pm. Residents needing help should call council on 07 4999 1234 or the SES on 132 500."
      description: News / community update (65 only)
    - value: "Local Disaster Management Plan - public version, available for inspection at the council office and online. The LDMG contact list is held by the local disaster coordinator. Council switchboard mobile: 0491 570 199"
      description: Public LDMP text (guidance exclusion)
false_positives:
  - description: Published local disaster management plans (s 60), council web pages, community updates and news that name the LDMG.
    mitigation: Enforce tiers need a private contact value; office, enquiries and switchboard phone labels do not count. Public-plan phrases are excluded.
  - description: Published media, duty or enquiries mobile numbers labelled simply "Mobile".
    mitigation: A plain "Mobile:" label counts as a private contact field, so these can reach 75. 85 still needs two private values, a named member and roster evidence.
  - description: Contact lists laid out as tables with no labels or AH markers.
    mitigation: These are missed at 75 (false negatives). Generic phone and name classifiers are the backstop.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_ldmg_contact_primary
      matches:
        - ref: Regex_au_qld_ldmg_contact_private_field
          min_count: 2
          unique_results: true
        - ref: Regex_au_qld_ldmg_contact_member_entry
        - ref: Keyword_au_qld_ldmg_contact_roster
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_ldmg_contact_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_ldmg_contact_primary
      matches:
        - ref: Regex_au_qld_ldmg_contact_private_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_ldmg_contact_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_ldmg_contact_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_ldmg_contact_primary
      pattern: >-
        (?i)\b(?:Local\s+Disaster\s+Management\s+Group|LDMG|(?:deputy\s+)?local\s+disaster\s+coordinator)(?:\s+(?:contact\s+(?:list|details|directory|register)|contacts|phone\s+list|membership(?:\s+list)?|member\s+list|activation\s+(?:roster|list|contacts)|roster|call[- ]?out\s+list|on[- ]call\s+roster))?\b
    - id: Regex_au_qld_ldmg_contact_private_field
      pattern: >-
        (?i)(?:\b(?:after[- ]hours|A/?H|home|private|personal|mobile|cell)(?:[ \t]+(?:mobile|phone|telephone|contact))?(?:[ \t]+(?:no\.?|number))?[ \t]*[:#][ \t]{0,5}(?:\+?61[ \t]?|0)[2-478](?:\d{2}[ \t]?\d{3}[ \t]?\d{3}|[ \t]?\d{4}[ \t]?\d{4})|\b(?:home|residential|private)[ \t]+address[ \t]*[:#][ \t]{0,5}(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30}|\b(?:personal|private|home)[ \t]+e-?mail(?:[ \t]+address)?[ \t]*[:#][ \t]{0,5}[A-Z0-9._%+-]{1,40}@[A-Z0-9-]{1,40}\.[A-Z.]{2,20}|(?<![\d+])(?:\+?61[ \t]?|0)4\d{2}[ \t]?\d{3}[ \t]?\d{3}[ \t]{0,3}\((?:AH|A/H|after[- ]hours|home|private|personal)\))
    - id: Regex_au_qld_ldmg_contact_member_entry
      pattern: >-
        (?i)\b(?:name|member|chair(?:person)?|deputy[ \t]+chair(?:person)?|(?:deputy[ \t]+)?local[ \t]+disaster[ \t]+coordinator|(?:deputy[ \t]+)?LDC|delegate|proxy|(?:contact|duty|on[- ]call|liaison)[ \t]+officer)[ \t]*[:#-][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|vacant|withheld|the|a|an|any|all|each|see|refer|mayor|deputy|chief|CEO|general|manager|director|executive|officer|inspector|superintendent|commander|representative|council|area|district|local|regional|senior|station)\b|_{2,}|\[|<)(?:(?:Mr|Mrs|Ms|Miss|Dr|Cr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}
  keywords:
    - id: Keyword_au_qld_ldmg_contact_roster
      groups:
        - match_style: word
          terms:
            - activation
            - activated
            - stood up
            - stand up
            - lean forward
            - on call
            - on-call
            - roster
            - after hours
            - call-out
            - phone tree
            - contact list
      strength: specific
    - id: Keyword_au_qld_ldmg_contact_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - available for inspection
            - public version
            - fact sheet
            - factsheet
            - frequently asked questions
            - media release
      strength: specific
risk_rating: 4
risk_description: >-
  The classifier identifies an LDMG contact list or activation roster that ties named disaster management officials, councillors and agency representatives to private after-hours mobiles, home phone numbers, home addresses or personal email addresses. Disclosure exposes those people to unwanted contact and harassment during and after emergencies, and to targeting of the people who coordinate a response; s 139 of the Disaster Management Act 2003 restricts disclosure of information acquired under the Act. The published plan and role-only membership lists are public and are excluded from enforce tiers. Risk 4 supports OFFICIAL with privacy handling.
sensitivity_labels:
