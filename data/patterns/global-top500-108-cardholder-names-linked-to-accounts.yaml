schema: testpattern/v1
name: Cardholder names linked to accounts
slug: global-top500-108-cardholder-names-linked-to-accounts
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: Detects references to cardholder names linked to accounts in financial and compliance documents. Commonly found in Australian regulatory filings, transaction records, and audit documentation.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters.'
pattern: (?is)\b(?:cardholder\s+name|card\s+holder|name\s+on\s+card|account\s+holder|PCI\s+DSS|cardholder\s+data|payment\s+card|primary\s+account\s+number|card\s+account|linked\s+account|card\s+member)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - cardholder names linked to accounts
    - cardholder
    - names
    - linked
    - accounts
    - financial
    - payments
  proximity: 300
  keyword_lists:
    - corporate-finance
test_cases:
  should_match:
    - value: cardholder name
      description: Primary topic phrase match
    - value: card holder
      description: Case-insensitive topic phrase match
    - value: name on card
      description: Alternative topic phrase match
    - value: account holder
      description: Additional topic phrase match
    - value: |-
        Cardholder name: Recorded
        Payee: Avery Teston
        Account number: 12345678
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: bank transfer
      description: Generic word pair from old broad template should not match
    - value: |-
        Cardholder name:
        Payee:
        Account name:
        Account number:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about cardholder name are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Cardholder name:
        Payee: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In Australian English, standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_108_cardholder_names_linked_to_accounts_populated_label
      matches:
        - ref: Regex_global_top500_108_cardholder_names_linked_to_accounts_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_108_cardholder_names_linked_to_accounts_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_cardholder_names
  regexes:
    - id: Pattern_cardholder_names
      pattern: >-
        (?is)\b(?:cardholder\s+name|card\s+holder|name\s+on\s+card|account\s+holder|PCI\s+DSS|cardholder\s+data|payment\s+card|primary\s+account\s+number|card\s+account|linked\s+account|card\s+member)\b
    - id: Regex_global_top500_108_cardholder_names_linked_to_accounts_populated_label
      pattern: (?i)\b(?:\b(?:cardholder\s+name|card\s+holder|name\s+on\s+card|account\s+holder|PCI\s+DSS|cardholder\s+data|payment\s+card|primary\s+account\s+number|card\s+account|linked\s+account|card\s+member)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_global_top500_108_cardholder_names_linked_to_accounts_record_structure
      pattern: (?i)\b(?:payee|supplier|vendor|creditor|beneficiary|account\s+name|BSB|account\s+(?:no\.?|number)|invoice\s+(?:no\.?|number)|remittance\s+(?:no\.?|number|ref(?:erence)?)|payment\s+(?:ref(?:erence)?|date)|amount\s+paid)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
risk_description: >-
  The regex recognises cardholder-name, card-holder, name-on-card, and account-holder phrases with financial context rather than extracting a person's name or linking it to an account value. A confirmed name-plus-account record can support targeted fraud or impersonation, but the normal hit supplies neither element in usable form. Impact to a cardholder is therefore low unless person and payment identifiers co-occur, while forms and customer-service guidance can contain these labels routinely. Risk 4 OFFICIAL reflects the topic marker; SENSITIVE would require a named cardholder linked to an actual account or transaction.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 is consistent with PSPF OFFICIAL, QGISCF OFFICIAL, and the OFFICIAL DLM because the detector recognizes
    relationship labels rather than a verified identity-account pair. SENSITIVE is not met until the surrounding content
    supplies a named cardholder and material account identifier.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic classification and Low DLM fit cardholder-role terminology whose direct harm depends on correlated
      personal and account data.
references:
  - title: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)"
    url: https://www.legislation.gov.au/C2006A00169/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
