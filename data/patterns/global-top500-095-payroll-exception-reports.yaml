schema: testpattern/v1
name: Payroll exception reports
slug: global-top500-095-payroll-exception-reports
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects payroll exception and variance reports that list identified employees: pay run exception reports, payroll variance/error reports and pre-pay-run validation reports with the exception reason or pay amounts.
operation: >-
  Primary: a payroll exception phrase (payroll exception/variance/error/discrepancy/audit report, log or register, pay run exceptions/errors, exception report for the pay run, pre-pay-run validation report). Generic "payroll audit", "payroll correction" and "reconciliation exception" were removed. 75 tier requires a populated person field (employee/staff name or number, payroll number, emp ID) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated exception detail (exception type/code/reason, issue, error code or flag with a value, or a net/gross pay, variance or difference amount) and an independent corroborative term (threshold, cleared, resolved, payroll officer, pay run, bank account, approved, corrected). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:payroll\s+(?:exception|variance|error|discrepancy|audit)\s+(?:reports?|logs?|registers?|listings?)|pay\s*run\s+(?:exceptions?|errors?|variance\s+reports?)|exception\s+report\s+(?:for|-)\s+(?:the\s+)?pay(?:roll|\s+run|\s+period)|pre[\s-]pay(?:roll|\s+run)\s+(?:check|validation)\s+reports?)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - employment
  - pii
corroborative_evidence:
  keywords:
    - threshold
    - cleared
    - resolved
    - payroll officer
    - pay run
    - bank account
    - approved
    - corrected
  proximity: 300
test_cases:
  should_match:
    - value: "Payroll exception report - pay run 2026-19\nEmployee ID: 4471820\nEmployee name: Avery Teston\nException: Net pay variance above threshold\nCurrent net pay: $3,912.40\nPrevious net pay: $2,104.10\nStatus: cleared by payroll officer."
      description: "85: exception report with employee, exception reason, net pay amounts and clearance"
      synthetic: true
    - value: "Pay run exceptions - fortnight ending 26/09/2026\nStaff number: 30219\nIssue: Missing bank account details\nGross pay: $2,880.00\nResolved once bank details were confirmed with the employee."
      description: "85: pay run exceptions with staff number, issue, gross pay and resolution"
      synthetic: true
    - value: "Payroll variance report\nEmployee: Jordan Staffson\nQueued for review by the payroll team next week."
      description: "75: variance report naming the employee, no exception detail"
      synthetic: true
    - value: "payroll exception report"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "This procedure explains how payroll exception reports are reviewed before each pay run is approved."
      description: "Procedure text - must stay at or below 65"
    - value: "Payroll exception report\nEmployee ID: __________\nException: __________\nVariance: $______"
      description: "Blank report template - must stay at or below 65"
    - value: "Catch pay run errors before they happen with our payroll software. Book a demo."
      description: "Vendor marketing - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Exception reports that identify employees only by an unlabelled column value."
    mitigation: "Fall to 65; extend the person-field regex with the customer employee-ID format."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_095_payroll_exception_reports_primary
      matches:
        - ref: Regex_top500_095_payroll_exception_reports_person_field
        - ref: Regex_top500_095_payroll_exception_reports_exception_detail
        - ref: Keyword_top500_095_payroll_exception_reports_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_095_payroll_exception_reports_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_095_payroll_exception_reports_primary
      matches:
        - ref: Regex_top500_095_payroll_exception_reports_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_095_payroll_exception_reports_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_095_payroll_exception_reports_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_095_payroll_exception_reports_primary
      pattern: >-
        (?i)\b(?:payroll\s+(?:exception|variance|error|discrepancy|audit)\s+(?:reports?|logs?|registers?|listings?)|pay\s*run\s+(?:exceptions?|errors?|variance\s+reports?)|exception\s+report\s+(?:for|-)\s+(?:the\s+)?pay(?:roll|\s+run|\s+period)|pre[\s-]pay(?:roll|\s+run)\s+(?:check|validation)\s+reports?)\b
    - id: Regex_top500_095_payroll_exception_reports_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?|emp\s+(?:no|ID))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_095_payroll_exception_reports_exception_detail
      pattern: >-
        (?i)\b(?:exception(?:\s+(?:type|code|reason))?|variance\s+reason|issue|error(?:\s+(?:code|type))?|flag|rule)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Za-z0-9][A-Za-z0-9 '/-]{3,60}|\b(?:(?:(?:current|previous|prior(?:\s+period)?|this\s+period|last\s+period)\s+)?(?:net|gross)\s+pay|variance|difference|overpaid|underpaid|negative\s+net\s+pay)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?
  keywords:
    - id: Keyword_top500_095_payroll_exception_reports_corroborative
      groups:
        - match_style: word
          terms:
            - threshold
            - cleared
            - resolved
            - payroll officer
            - pay run
            - bank account
            - approved
            - corrected
      strength: specific
    - id: Keyword_top500_095_payroll_exception_reports_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - this procedure
            - payroll software
            - book a demo
            - free trial
            - how to review
      strength: domain
risk_description: >-
  The classifier identifies payroll exception reports listing an identified employee (75) with the exception reason or pay amounts (85). These reveal individual pay, bank-detail issues and payroll errors. Procedures, blank templates and marketing stay at 65. Risk 4 supports OFFICIAL.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: "Fair Work Regulations 2009 (Cth) - regs 3.31-3.46 employee records and pay slips"
    url: https://www.legislation.gov.au/F2009L02356/latest/text
  - title: "Fair Work Ombudsman - Record-keeping"
    url: https://www.fairwork.gov.au/pay-and-wages/paying-wages/record-keeping
  - title: "Industrial Relations Act 2016 (Qld) - ss 339-340 time and wages records"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2016-063
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
