schema: testpattern/v1
name: Scheduled maintenance plans
slug: global-top500-318-scheduled-maintenance-plans
version: 1.3.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects scheduled maintenance plans: maintenance-window wording with dated time windows and populated affected-system, downtime and change fields. Topic wording alone is discovery-only.
operation: >-
  Regex_maintenance_plan_primary (scheduled/planned maintenance, planned outage or maintenance window/plan wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a dated time window (date plus start-end time) or a populated scope field (affected systems/services/hosts, outage duration, change reference, engineer, rollback). 85 requires a dated time window (date plus start-end time), a populated scope field (affected systems/services/hosts, outage duration, change reference, engineer, rollback), and independent maintenance-activity (patching, firmware, reboot, failover, downtime) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_maintenance_plan_guidance_exclusion).
pattern: >-
  (?i)\b(?:scheduled\s+maintenance|planned\s+(?:maintenance|outage)|maintenance\s+(?:window|plan|schedule|notification))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a dated time window (date plus start-end time) or a populated scope field (affected systems/services/hosts, outage duration, change reference, engineer, rollback)), and 85 needs two distinct structures plus independent maintenance-activity (patching, firmware, reboot, failover, downtime) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - patching
  - firmware
  - reboot
  - failover
  - backout
  - downtime
  - service unavailable
  - read-only
  - cutover
  - upgrade
  proximity: 300
test_cases:
  should_match:
  - value: Scheduled maintenance is planned for the payroll system next month.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Maintenance window
      Affected systems: payroll, rostering
    description: Medium-tier probe (75) - populated scope field
    synthetic: true
  - value: |-
      Maintenance plan - core switching
      Window: 18/10/2026 22:00-02:00
      Affected hosts: core-sw01, core-sw02 (10.20.0.1-2)
      Change ref: CHG0031611
      Firmware upgrade with reboot; failover to core-sw02 during patching; expected downtime 15 minutes.
    description: High-tier probe (85) - dated window, affected hosts, activity context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: planned maintenance must be notified to users five business days in advance.'
    description: Policy text
    synthetic: true
  - value: |-
      Maintenance notification template
      Window: ________
      Affected systems: [insert]
    description: Blank template
    synthetic: true
  - value: 'Media release: the bank will undertake scheduled maintenance on 18/10/2026 from 22:00 to 02:00; online banking will be unavailable.'
    description: Public media release
    synthetic: true
false_positives:
- description: Public customer maintenance notices.
  mitigation: News/press framing is excluded; 85 needs a window, affected systems and activity context. Public notices listing affected services can still reach 75.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The detector now requires maintenance wording plus a dated time window or populated affected-system fields before enforcing. A real maintenance plan can reveal when protections or redundancy may be reduced, which systems are changing, expected outages, and responsible teams, enabling timed attacks or operational interference. The normal scope is one maintenance event and its affected services or users, while public notices, policies, and generic planning documents can match the same phrases. Risk 8 SENSITIVE reflects serious contained timing and operational exposure; PROTECTED would require critical-service maintenance or significant likely damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because detailed maintenance plans
    reveal system scope, downtime, and potentially weakened operational periods. PROTECTED is not met without evidence
    of critical infrastructure, protected operations, privileged access, or significant consequence.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic handling is Medium with Medium InfoTech controls for internal maintenance plans, limiting detailed timing,
      target systems, and control changes. High is reserved for critical or protected maintenance whose advance
      disclosure could cause significant damage.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_maintenance_plan_primary
    matches:
    - ref: Regex_maintenance_plan_window
    - ref: Regex_maintenance_plan_affected_field
    - ref: Keyword_maintenance_plan_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_maintenance_plan_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_maintenance_plan_primary
    matches:
    - type: any
      refs:
      - Regex_maintenance_plan_window
      - Regex_maintenance_plan_affected_field
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_maintenance_plan_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_maintenance_plan_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_maintenance_plan_primary
    pattern: >-
      (?i)\b(?:scheduled\s+maintenance|planned\s+(?:maintenance|outage)|maintenance\s+(?:window|plan|schedule|notification))\b
  - id: Regex_maintenance_plan_window
    pattern: >-
      (?i)\b(?:20\d{2}-[01]\d-[0-3]\d|[0-3]?\d/[01]?\d/20\d{2}|[0-3]?\d\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+20\d{2})[\s,]{1,5}(?:from\s+)?[0-2]?\d:[0-5]\d\s*(?:-|to)\s*[0-2]?\d:[0-5]\d
  - id: Regex_maintenance_plan_affected_field
    pattern: >-
      (?i)\b(?:affected\s+(?:systems?|services?|hosts?|sites?)|servers?|hosts?|scope|outage\s+duration|expected\s+downtime|change\s+(?:no\.?|number|ref)|engineer|rollback)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  keywords:
  - id: Keyword_maintenance_plan_context
    groups:
    - match_style: word
      terms:
      - patching
      - firmware
      - reboot
      - failover
      - backout
      - downtime
      - service unavailable
      - read-only
      - cutover
      - upgrade
    strength: specific
  - id: Keyword_maintenance_plan_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
