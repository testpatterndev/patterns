updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - anchored on Telecommunications Act 1997 Part 13 s 306 / 306A record content (verified via OAIC) and TIA Act ss 178-180 authorisations; 75 gated on one populated field, 85 on two distinct fields plus independent evidence; OAIC guidance, legislation, annual reports and blank templates excluded from enforce tiers.
