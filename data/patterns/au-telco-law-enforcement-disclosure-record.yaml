schema: testpattern/v1
name: Telecommunications Act s 306 Law Enforcement Disclosure Record
slug: au-telco-law-enforcement-disclosure-record
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Records that carriers and carriage service providers must make of disclosures of protected information (Telecommunications Act 1997 (Cth) Part 13, s 276 primary offence) to law enforcement and enforcement agencies: the s 306 record (made within 5 days of the disclosure and kept for 3 years) and the s 306A record for prospective authorisations. A populated record gives the name of the person who disclosed the information, the date of disclosure, the grounds (for example s 280 authorised by law, s 313 assistance), warrant or authorisation details including authorisations under ss 178, 179 or 180 of the Telecommunications (Interception and Access) Act 1979, the authorising officer and date, the requesting agency and request date, the service disclosed and the s 187AA data-set items. The same fields appear in agency authorisation / request notices received by the provider. OAIC guidance, the Acts, ACMA and TIA Act annual report statistics and blank templates are decoys. Overlaps with lawful-interception-warrant, which covers interception and stored communications warrants (TIA Act secrecy) rather than Part 13 disclosure records; a record that cites the TIA Act next to a service number may also fire that classifier.
operation: >-
  Primary: "section 306/306A record/register/disclosure", "record of (the) disclosure", "disclosure record/register", "Part 13 disclosure/record", a s 276/280/313 Telecommunications Act reference, "Telecommunications Act 1997", "prospective authorisation", or an authorisation under TIA Act s 178/179/180 (incl. 180A/180B). 65 is discovery-only (primary alone) and surfaces OAIC guidance, legislation and annual reports. 75 requires one populated field within 300 characters: name of the person who disclosed / authorising officer / requesting (enforcement) agency, a dated disclosure / authorisation / request / first-last disclosure field, grounds for the disclosure (a section reference or populated statement), an agency / authorisation / warrant reference containing a digit, a service number / carriage service / account number value, or a populated information-disclosed / s 187AA item field. Blank lines, bracket placeholders and n/a/tbc are rejected. 85 requires two distinct populated fields plus an independent corroborative term (enforcement agency, criminal law-enforcement agency, police, AFP, QPS, ASIO, TIA Act, 187AA, subscriber details, call charge records and similar). Every tier excludes template/fixture text; enforce tiers also exclude guidance/legislation and annual report signals.
pattern: (?i)\b(?:(?:section|s\.?)\s?306A?\s+(?:record|register|disclosure)s?|record\s+of\s+(?:the\s+)?disclosure|disclosure\s+(?:record|register)|Part\s+13\s+(?:disclosure|record)s?|(?:section|s\.?)\s?(?:276|280|313)\s+(?:of\s+the\s+)?Telecommunications\s+Act|Telecommunications\s+Act\s+1997|prospective\s+(?:data\s+)?authori[sz]ation|authori[sz]ation\s+under\s+(?:section|s\.?)\s?(?:178|179|180)[AB]?|(?:section|s\.?)\s?(?:178|179|180)[AB]?\s+authori[sz]ation)\b
confidence: medium
confidence_justification: >-
  Medium: the s 306/306A record fields and TIA Act authorisation sections are specific, but OAIC guidance, carrier compliance manuals and legislation repeat them, and "record of disclosure" is also used for Privacy Act APP 6 notes. Enforce tiers require populated disclosure fields. Agency request and authorisation reference formats vary by agency and are matched only as labelled values containing a digit. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic (service numbers from the ACMA fictitious 0491 570 range).
jurisdictions:
  - au
regulations:
  - Telecommunications Act 1997 (Cth)
  - Telecommunications (Interception and Access) Act 1979 (Cth)
frameworks:
  - PSPF
  - QGISCF
data_categories:
  - law-enforcement
  - pii
  - telecom
corroborative_evidence:
  keywords:
    - enforcement agency
    - criminal law-enforcement agency
    - police
    - Australian Federal Police
    - AFP
    - QPS
    - ASIO
    - TIA Act
    - 187AA
    - subscriber details
    - call charge records
  proximity: 300
customisation:
  - key: lea-request-reference
    kind: identifier-format
    identifier: lea-request-reference
    target: purview.regexes/Regex_au_telco_law_enforcement_disclosure_record_record_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's law enforcement request / authorisation reference format (see docs/identifiers.md#lea-request-reference). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Section 306 record of disclosure\nName of person who disclosed the information: Kira Fakesmith, Law Enforcement Liaison\nDate of disclosure: 16/09/2026\nGrounds for the disclosure: s 280 - authorised by TIA Act s 178 (existing information)\nAuthorising officer: Det Sgt R. Nolander, Queensland Police Service\nDate of authorisation: 15/09/2026\nService number: 0491 570 156\nInformation disclosed: subscriber details and call charge records, 187AA items 1 and 2"
      description: 85 tier - s 306 record with discloser, dates, grounds, authoriser, service and data set plus TIA Act / QPS / 187AA
      synthetic: true
    - value: "Prospective authorisation (TIA Act s 180) - s 306A record\nDate of first disclosure: 01/09/2026\nDate of last disclosure: 14/09/2026\nRequesting agency: Australian Federal Police\nLocation data for the service was provided daily to the enforcement agency."
      description: 85 tier - s 306A record with first/last disclosure dates and requesting agency plus enforcement agency
      synthetic: true
    - value: "Part 13 disclosure register entry\nAgency reference: QPS-2026-88412\nThe account holder's name and address were provided to police under s 313 assistance."
      description: 75 tier - register entry with one populated reference field
      synthetic: true
    - value: "Authorisation under section 179 of the TIA Act\nEnforcement agency: Crime and Corruption Commission\nService number: 0491 570 110\nPeriod: 01/01/2026 to 30/06/2026. Please disclose historical subscriber details and call charge records."
      description: 85 tier - agency authorisation received by the carrier with agency and service fields plus subscriber details / call charge records
      synthetic: true
  should_not_match:
    - value: "Under section 306 of the Telecommunications Act 1997, carriers and carriage service providers must make a record of each disclosure within five days, including the name of the person who disclosed the information, the date of the disclosure and the grounds for the disclosure. Records must be retained for three years. See oaic.gov.au."
      description: OAIC guidance
    - value: "Section 306 record of disclosure\nName of person who disclosed the information: __________\nDate of disclosure: __________\nGrounds for the disclosure: __________\nService number: [service]"
      description: Blank disclosure record template
    - value: "306A Record of disclosures - prospective authorisations. (1) If a disclosure is made because of an authorisation under section 180 of the Telecommunications (Interception and Access) Act 1979, the person who made the disclosure must make a record. Compilation No. 112, Federal Register of Legislation."
      description: Legislation text
    - value: "Enforcement agencies made 312,000 authorisations for access to existing information under the Telecommunications (Interception and Access) Act 1979 in 2024-25, according to the Act's annual report."
      description: Annual report statistics
    - value: "The ACMA communications report says carriers made 1.1 million disclosures under Part 13 of the Telecommunications Act 1997, most to police for the enforcement of the criminal law."
      description: News / ACMA statistics
false_positives:
  - description: OAIC guidance, legislation and carrier compliance manuals list the s 306/306A record fields.
    mitigation: Enforce tiers require populated fields and exclude oaic.gov.au / legislation.gov.au, "must make a record", "Compilation No." and guidance signals.
  - description: Annual reports (TIA Act annual report, ACMA communications report) publish aggregate disclosure and authorisation numbers.
    mitigation: No populated fields and "annual report" / "communications report" signals are excluded, so these stay at 65 discovery.
  - description: Privacy Act APP 6.5 written notes of disclosures to enforcement bodies by non-telco organisations use "record of disclosure".
    mitigation: They reach 75 only with a populated field; they are also law-enforcement disclosures of comparable sensitivity.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_telco_law_enforcement_disclosure_record_primary
      matches:
        - ref: Regex_au_telco_law_enforcement_disclosure_record_party_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_telco_law_enforcement_disclosure_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_telco_law_enforcement_disclosure_record_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_telco_law_enforcement_disclosure_record_primary
      matches:
        - ref: Regex_au_telco_law_enforcement_disclosure_record_party_field
        - ref: Regex_au_telco_law_enforcement_disclosure_record_record_field
        - ref: Keyword_au_telco_law_enforcement_disclosure_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_telco_law_enforcement_disclosure_record_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_telco_law_enforcement_disclosure_record_primary
      matches:
        - ref: Regex_au_telco_law_enforcement_disclosure_record_record_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_telco_law_enforcement_disclosure_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_telco_law_enforcement_disclosure_record_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_telco_law_enforcement_disclosure_record_primary
      matches:
        - type: any
          refs:
            - Regex_au_telco_law_enforcement_disclosure_record_party_field
            - Regex_au_telco_law_enforcement_disclosure_record_record_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_telco_law_enforcement_disclosure_record_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_telco_law_enforcement_disclosure_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_telco_law_enforcement_disclosure_record_primary
      pattern: >-
        (?i)\b(?:(?:section|s\.?)\s?306A?\s+(?:record|register|disclosure)s?|record\s+of\s+(?:the\s+)?disclosure|disclosure\s+(?:record|register)|Part\s+13\s+(?:disclosure|record)s?|(?:section|s\.?)\s?(?:276|280|313)\s+(?:of\s+the\s+)?Telecommunications\s+Act|Telecommunications\s+Act\s+1997|prospective\s+(?:data\s+)?authori[sz]ation|authori[sz]ation\s+under\s+(?:section|s\.?)\s?(?:178|179|180)[AB]?|(?:section|s\.?)\s?(?:178|179|180)[AB]?\s+authori[sz]ation)\b
    - id: Regex_au_telco_law_enforcement_disclosure_record_party_field
      pattern: >-
        (?i)(?:\b(?:name\s+of\s+(?:the\s+)?person\s+who\s+(?:disclosed|made\s+the\s+disclosure)(?:\s+the\s+information)?|disclosed\s+by|disclosing\s+officer|authori[sz]ing\s+officer|authori[sz]ed\s+officer|authori[sz]ed\s+by|name\s+of\s+(?:the\s+)?(?:person\s+who\s+made\s+the\s+)?authori[sz]ation|requesting\s+(?:agency|officer|party)|(?:criminal\s+law[\s-]+)?enforcement\s+agency|requested\s+by|issuer|issued\s+by)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'.,-]{0,30}(?:[ \t]+[A-Za-z0-9&'.,()-]{1,30}){1,7}|\b(?:date\s+of\s+(?:the\s+)?(?:first\s+|last\s+)?disclosure|date\s+(?:first|last)?\s*disclosed|date\s+of\s+(?:the\s+)?(?:authori[sz]ation|request|warrant)|(?:authori[sz]ation|request|warrant)\s+date)\s*[:#-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+[a-z]{3,9}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2}))
    - id: Regex_au_telco_law_enforcement_disclosure_record_record_field
      pattern: >-
        (?i)(?:\b(?:(?:statement\s+of\s+(?:the\s+)?)?grounds\s+for\s+(?:the\s+)?disclosure|grounds|legal\s+basis)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|see|refer)\b|_{2,}|\[|<)(?:(?:s\.?|section)\s?\d{3}[A-Z]{0,2}\b|[A-Za-z][A-Za-z0-9,;'/().-]{1,30}(?:[ \t]+[A-Za-z0-9,;'/().-]{1,30}){2,10})|\b(?:(?:agency|request|authori[sz]ation|warrant|LEA|job|case)\s+(?:ref(?:erence)?|no\.?|number|ID))\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Za-z/._-]{0,12}\d)[A-Za-z0-9][A-Za-z0-9/._-]{2,24}|\b(?:service\s+(?:number|identifier|no\.?)|MSISDN|carriage\s+service|account\s+(?:number|no\.?))\s*[:#]\s*(?:\+?61[ \t]?|0)[2-478](?:[ \t]?\d){8}\b|\b(?:information\s+disclosed|type\s+of\s+information(?:\s+disclosed)?|data\s+set|187AA\s+items?)\s*[:#]?\s*(?!(?:n/?a|unknown|tbc|tba|see|refer)\b|_{2,}|\[|<)(?:subscriber|account|call\s+charge|CCR|IPND|location|cell|IP\s+address|billing|historical|items?\s+\d)[A-Za-z0-9,;'/().-]{0,40})
    - id: Regex_au_telco_law_enforcement_disclosure_record_guidance_exclusion
      pattern: >-
        (?i)(?:\boaic\.gov\.au|\blegislation\.gov\.au|\bFederal\s+Register\s+of\s+Legislation|\bCompilation\s+(?:No\.|date)|\bmust\s+make\s+a\s+record\b|\bcarriers\s+and\s+carriage\s+service\s+providers\s+must\b|\bannual\s+report\b|\bcommunications\s+report\b|\bthis\s+(?:guide|guideline|fact\s?sheet|guidance|manual|procedure|webinar|course)\b|\bgeneral\s+information\s+only\b)
  keywords:
    - id: Keyword_au_telco_law_enforcement_disclosure_record_corroborative
      groups:
        - match_style: word
          terms:
            - enforcement agency
            - criminal law-enforcement agency
            - police
            - Queensland Police Service
            - Australian Federal Police
            - text: AFP
              case_sensitive: true
            - text: QPS
              case_sensitive: true
            - text: ASIO
              case_sensitive: true
            - TIA Act
            - Telecommunications (Interception and Access) Act 1979
            - 187AA
            - subscriber details
            - call charge records
            - location data
            - existing information
            - prospective information
            - Crime and Corruption Commission
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a carrier's s 306/306A record of a disclosure to a law enforcement or enforcement agency, or the agency authorisation that triggered it, gated on populated fields. These records reveal that a named customer or service is of interest to police, ASIO or another enforcement agency, what metadata was handed over and when; disclosure can tip off a suspect and compromise investigations, and the underlying information is protected by Telecommunications Act s 276. Guidance, legislation, annual report statistics and blank templates are excluded from enforce tiers. Risk 9 supports SENSITIVE Law-Enforcement.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Law-Enforcement
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 9 with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Law-Enforcement and the Medium tier reflects a s
    306 record showing a named customer is of interest to police or ASIO, what metadata was released and when. SENSITIVE
    rather than PROTECTED applies to one disclosure record, but tipping off a suspect makes this the top of the
    SENSITIVE band.
  generic:
    classification: Medium
    dlm: Medium Law-Enforcement
    rationale: >-
      Medium Law-Enforcement handling protects a record that reveals an active investigation target; disclosure can
      compromise the investigation. High is not applied to one disclosure record.
references:
  - title: OAIC - Keeping records of disclosures under the Telecommunications Act 1997 (ss 306, 306A)
    url: https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/more-guidance/keeping-records-of-disclosures-under-the-telecommunications-act-1997
  - title: AustLII - Telecommunications Act 1997 (Cth) s 276
    url: https://www.austlii.edu.au/cgi-bin/viewdoc/au/legis/cth/consol_act/ta1997214/s276.html
