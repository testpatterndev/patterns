schema: testpattern/v1
name: Disaster Recovery Plans and Runbooks
slug: global-disaster-recovery-plan
version: 1.5.2
type: regex
pattern_class: concept
description: >-
  Identifies disaster recovery and IT continuity plans that contain populated recovery detail: numeric recovery objectives, system hosts/addresses, numbered recovery steps or recovery commands. Plan titles alone are discovery-only.
operation: >-
  Regex_disaster_recovery (disaster recovery / DR plan, procedure, runbook, playbook, test report; IT service continuity plan; IT/ICT/system/application recovery plan or procedure) is discovery-only at 65. 75 requires one populated structure: an RTO/RPO/MTPD value with a time unit, an internal hostname/IP/labelled host, a numbered step, or a recovery command. 85 requires two distinct structures plus failover/replication/DR-site wording. Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
confidence: medium
confidence_justification: >-
  Medium confidence: titles are discovery-only; enforcement requires populated objectives, hosts, steps or commands and 85 adds a second structure and failover context.
jurisdictions:
  - global
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
  - CIS Controls
  - DISP
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - technology
  - security
test_cases:
  should_match:
    - value: |-
        Disaster recovery plan - Payroll platform (v3.2)
        RTO: 4 hours  RPO: 15 minutes
        Primary: pay-db01.example.internal (10.20.4.11)  DR site: pay-db01-dr.example.internal (10.60.4.11)
        Step 1: Confirm replication lag on the standby is under 15 minutes.
        Step 2: Promote the standby and repoint DNS for payroll.example.internal.
      description: High tier (85) - RTO/RPO values, hosts and numbered steps with DR site/replication context
      synthetic: true
    - value: 'IT recovery procedure for the records system: RTO 8 hours, restore order agreed with the business owner.'
      description: Medium tier (75) - recovery objective value only
      synthetic: true
    - value: 'DR runbook for the GIS server: Step 1: stop the map tile cache before restoring the database.'
      description: Medium tier (75) - numbered recovery step only
      synthetic: true
    - value: The disaster recovery plan is due for its annual review in March.
      description: Discovery tier (65) - plan title only
      synthetic: true
  should_not_match:
    - value: 'Policy statement: every business unit should maintain a disaster recovery plan that sets an RTO and RPO for each critical system.'
      description: Policy text without values
    - value: |-
        Disaster recovery plan template
        System: ________
        RTO: ____ hours   RPO: ____ minutes
        DR site: ________
      description: Blank template
    - value: 'Training course exercise: participants draft a DR plan for a made-up shop with an RTO of 4 hours.'
      description: Training framing with an objective value must not enforce
    - value: 'News report: the airline said its disaster recovery plan worked as intended after the data centre fire.'
      description: News framing
false_positives:
  - description: Natural disaster, economic or health recovery plans and business continuity guidance.
    mitigation: Primary requires disaster recovery / DR / IT or system recovery wording; enforcement needs populated RTO/RPO values, hosts, steps or commands, and guidance/training/news/template framing is excluded.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  DR plans and runbooks expose recovery sequencing and infrastructure dependencies useful to an attacker. Risk 8
  OFFICIAL:Sensitive is appropriate for operational DR substance (elevated from runbook-only risk 7).
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 fits PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE InfoTech because a populated DR plan gives
    RTO/RPO values, internal hosts, numbered recovery steps and commands, exposing recovery sequencing and dependencies
    to an attacker. PROTECTED is not met: the plan covers one organisation's systems unless it governs essential
    services.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling protects recovery objectives, host details and runbook steps. It is not High because the
      exposure is one environment's recovery process.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_disaster_recovery
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_recovery_objective
            - Evidence_system_host
            - Evidence_recovery_step
            - Evidence_recovery_command
        - ref: Keyword_failover_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_disaster_recovery
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_recovery_objective
            - Evidence_system_host
            - Evidence_recovery_step
            - Evidence_recovery_command
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_disaster_recovery
  regexes:
    - id: Regex_disaster_recovery
      pattern: (?i)\b(?:disaster\s+recovery\s+(?:plan|procedures?|document|runbook|playbook|test\s+report)|DR\s+(?:plan|procedures?|runbook|playbook|test\s+report)|IT\s+(?:service\s+)?continuity\s+plan|(?:IT|ICT|system|application)\s+recovery\s+(?:plan|procedures?))\b
    - id: Evidence_recovery_objective
      pattern: (?i)\b(?:RTO|RPO|MTPD|MTD|recovery\s+time\s+objective|recovery\s+point\s+objective|maximum\s+tolerable\s+(?:period\s+of\s+)?(?:downtime|disruption))\s{0,3}(?:\((?:RTO|RPO|MTPD|MTD)\))?\s{0,3}[:=-]?\s{0,3}(?:of\s+)?(?:<|≤)?\s{0,2}\d{1,3}(?:\.\d)?\s{0,2}(?:minutes?|mins?|hours?|hrs?|h|days?)\b
    - id: Evidence_system_host
      pattern: (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:hostname|host|server|asset\s+ID|device\s+ID|node|instance)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._-]{2,63}
    - id: Evidence_recovery_step
      pattern: (?i)\bstep\s+\d{1,2}(?:\.\d{1,2})?\s*[:.)-]\s*[A-Za-z]
    - id: Evidence_recovery_command
      pattern: \b(?:sudo\s+)?(?:systemctl\s+(?:restart|stop|start|status)|kubectl\s+(?:rollout|scale|delete|get|describe|apply|drain|cordon)|docker\s+(?:restart|compose|run|exec)|az\s+[a-z]{2,20}\s+[a-z]{2,20}|aws\s+[a-z0-9]{2,20}\s+[a-z-]{2,40}|(?:Restart|Stop|Start|Get|Set)-[A-Z][A-Za-z]{2,40}|sqlcmd\s+-S|psql\s+-h|ssh\s+[\w.-]{1,60}@[\w.-]{1,120}|iisreset\b|net\s+(?:stop|start)\s+[\w\"-]{2,60}|pg_(?:dump|restore)\s+-|robocopy\s+[\w\\:$.-]{2,120})
  keywords:
    - id: Keyword_failover_context
      groups:
        - match_style: word
          terms:
            - failover
            - failback
            - switchover
            - hot site
            - warm site
            - cold site
            - DR site
            - secondary data centre
            - secondary data center
            - replication
            - restore from backup
            - standby
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
created: '2026-02-09'
updated: '2026-09-25'
changelog:
  - version: 1.5.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had no generic classification, no
      rationale, no tier).
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): 75 now requires populated recovery structure (RTO/RPO/MTPD value with unit, internal host/IP, numbered step, or recovery command) instead of bare RTO/RPO acronyms, and 85 requires two distinct structures plus failover/replication/DR-site wording; removed the phrase-only 85 path and the generic IT-operations keyword group; primary narrowed from bare "recovery plan/strategy" to IT/system recovery plans; guidance/news/training exclusion added; populated synthetic tests and decoys. Removed the irrelevant TIA Act 1979 (Cth) tag; added verified NIST SP 800-34 and ISM references.'
  - version: 1.4.1
    date: '2026-07-19'
    description: >-
      Merge global-top500-303-disaster-recovery-runbooks: expanded name/description/risk for combined coverage; absorbed
      unique test cases; companion SIT deprecated.
  - version: 1.4.0
    date: '2026-07-19'
    description: >-
      Profile quality: align the regex-backed detector type; add plan-title discovery, recovery-objective medium, and
      failover-corroborated high tiers; add public/template adversarial probes.
  - version: 1.3.1
    date: '2026-07-14'
    description: >-
      v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 538 without changing
      detector or package metadata.
  - version: 1.3.0
    date: '2026-07-09'
    description: >-
      C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored
      as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged);
      derived by scripts/derive-pattern-class.mjs + spot review
  - version: 1.2.0
    date: '2026-07-09'
    description: >-
      Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the
      NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced
      it (dead noise gate); dictionary terms verified collision-free against this pattern's should_match values and
      specific/domain vocabulary
  - version: 1.1.0
    date: '2026-07-04'
    description: Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
