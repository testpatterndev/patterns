      },
      {
        "value": "Medication administration record\nEmployee name: Jordan Staffson\nMedication: Salbutamol\nDate: 2026-09-10\nTime: 10:15\nAdministered by: Jordan Staffson",
        "description": "Synthetic public, blank, distant or unrelated counterexample 4",
        "synthetic": true
      }
    ]
  },
