        "synthetic": true
      },
      {
        "value": "Student medication log\nStudent ID: RG20451\nMedicine: Prescribed medication\nDate: 2026-09-11\nOutcome: Refused\nRecorded by: Morgan Staffson",
        "description": "Synthetic populated record variant 2",
        "synthetic": true
      },
      {
        "value": "Medication administration record\nStudent name: Avery Teston\nMedication: Salbutamol\nDate: 2026-09-10\nTime: 10:15\nAdministered by: Jordan Staffson\nForm template version 2.1. Retain the completed record.",
        "description": "Synthetic populated record variant 3",
        "synthetic": true
      },
      {
        "value": "Student medication log\nStudent ID: RG20451\nMedicine: Prescribed medication\nDate: 11/09/2026\nOutcome: Refused\nRecorded by: Morgan Staffson",
        "description": "Synthetic populated record variant 4",
        "synthetic": true
      }
    ],
    "should_not_match": [
      {
