schema: testpattern/v1
name: School-Held Student Court Order Record (Family Law and Domestic Violence Orders)
slug: au-education-student-court-orders-record
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  School records showing that a student is the subject of a current family law order or a domestic violence order: the completed "Court Orders" section of the Queensland state school Application for Student Enrolment Form (SEF-1 V8, approved under the Education (General Provisions) Act 2006) - "Family Court Orders" (orders made pursuant to the Family Law Act 1975 concerning the welfare, safety or parenting arrangements of the student) and "Other Court Orders" (such as a domestic violence order) with commencement and end dates - and school file notes recording a parenting or protection order held for a student and the person who may not collect or contact the student. The blank SEF-1 form contains every anchor phrase and is a decoy; enforce tiers need populated order dates and a named student or restricted person. Complements au-qld-student-enrolment-form (form detection) and au-education-guardian-collection-record (collection permissions), which do not tier on court-order content.
operation: >-
  Primary: a court-order phrase (Family Court Order(s), Other Court Order(s), orders made pursuant to the Family Law Act 1975, family law order, parenting order, domestic violence order, protection order, or court order(s) concerning the welfare, safety or parenting arrangements). 75 tier requires, within 300 characters, a populated order date (commencement, start, end, expiry, issue or made date followed by a dd/mm/yyyy date - the blank form's ___/___/_____ does not match) AND one of: a populated student field (student, prospective student, child or pupil name/ID/number, legal family or given name, EQ ID, OneSchool ID, or date of birth with a non-placeholder value) or a populated restriction field (restrained/restricted/named person or parent, respondent or aggrieved with a name, or "not permitted/authorised/allowed to collect/contact", "no contact with" or "do not release (the student) to" followed by a name). 85 tier requires the order date AND the student field AND the restriction field AND an independent school term (school, principal, enrolment, class teacher, office staff, deputy principal, guidance officer, year level). All enforce tiers AND NOT the shared template-exclusion dictionary and a guidance exclusion (fact sheet, information for schools, guidelines for schools, Legal Aid Queensland, frequently asked questions). 65 is discovery-only (primary alone) and will surface the blank SEF-1 form, the enrolment procedure and family-law guidance.
pattern: >-
  (?i)\b(?:(?:Family|Other)\s+Court\s+Orders?|orders?\s+made\s+pursuant\s+to\s+the\s+Family\s+Law\s+Act(?:\s+1975)?|family\s+law\s+orders?|parenting\s+orders?|domestic\s+violence\s+orders?|protection\s+orders?|court\s+orders?\s+concerning\s+the\s+welfare,?\s+safety\s+or\s+parenting\s+arrangements)\b
confidence: medium
confidence_justification: >-
  Medium: the "Family Court Orders" / "Other Court Orders" headings and the Family Law Act 1975 wording are taken from the published SEF-1 V8 form and are distinctive, but the blank form, the enrolment procedure and family-law guidance for schools contain the same words. Enforce tiers therefore need a filled order date plus a named student or restricted person, which the blank form does not carry. School-side note wording ("not permitted to collect", "do not release to") is not published as formal wording and is matched only as a generic populated-field shape. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Education (General Provisions) Act 2006 (Qld)
  - Family Law Act 1975 (Cth)
  - DFV Protection Act 2012 (Qld)
  - IPA 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - pii
  - children
  - education
  - legal
corroborative_evidence:
  keywords:
    - Family Court Orders
    - Other Court Orders
    - domestic violence order
    - parenting order
    - copy of the court order
    - commencement date
    - not permitted to collect
    - principal
  proximity: 300
  keyword_lists:
    - au-dfv-terminology
test_cases:
  should_match:
    - value: "OneSchool student record - court orders\nStudent name: Riley Teston\nEQ ID: 3141592653Q\nOther Court Orders: Yes - domestic violence order, Magistrates Court Beenleigh\nCommencement date: 12/03/2026\nEnd date: 11/03/2031\nRestrained person: Jordan Teston\nDo not release student to Jordan Teston. Principal and office staff notified; sealed copy on file."
      description: School record of a DVO naming the student, with dates and the restrained person (85 tier)
      synthetic: true
    - value: "COURT ORDERS\nFamily Court Orders: Yes\nLegal family name: Teston\nLegal given names: Casey Morgan\nDate of birth: 09/10/2015\nCommencement date: 03/02/2025\nEnd date: 09/10/2033\nNot permitted to collect: Morgan Teston\nParenting orders sighted by the deputy principal at enrolment."
      description: Completed SEF-1 court-orders section with a parenting order and a person not permitted to collect (85 tier)
      synthetic: true
    - value: "Student ID: 0048213771\nOther court orders - domestic violence order naming the child. Commencement date: 01/08/2026. End date: 31/07/2028. Copy of the court order provided by mother."
      description: DVO naming the student with order dates, no restricted person (75 tier)
      synthetic: true
    - value: "Parenting order on file.\nCommencement date: 15/06/2026\nNo contact with: Jordan Teston (father) until further order."
      description: Parenting order with a date and a named no-contact person, no student field (75 tier)
      synthetic: true
  should_not_match:
    - value: "COURT ORDERS* (continued)   Yes   No\nFamily Court Orders*\nCommencement date ___/___/_____\nAre there any current orders made pursuant to the Family Law Act 1975 concerning the welfare, safety or parenting arrangements of the prospective student?\nEnd date ___/___/_____\nOther Court Orders*\nAre there any other current court orders, such as a domestic violence order, concerning the welfare, safety or parenting arrangements of the prospective student?\nIf yes, what are the dates of the court order? Please provide a copy of the court order.\nLegal family name*\n(as per birth certificate)\nDate of birth*  /  /"
      description: Blank SEF-1 V8 court-orders section (critical decoy, 65 only)
    - value: "Parents/carers should provide a copy of any relevant current Child Protection Order, Family Court or other court orders (signed and sealed) concerning the welfare, safety or parenting arrangements of the student, and any new or updated orders."
      description: Enrolment procedure wording (65 only)
    - value: "Schools and family law orders - information for schools. A parenting order may say who a child lives with and who may collect the child. Check the commencement date and end date of any order on file."
      description: Family-law guidance for schools (65 only)
    - value: "Student name: Avery Teston\nDate of birth: 04/05/2016\nFamily Court Orders: No\nOther Court Orders: No"
      description: Completed enrolment answering No to both court-order questions (65 only)
    - value: "Magistrates Court statistics 2025-26: 38,410 domestic violence orders were made in Queensland, including 6,120 naming children, up 4% on the previous year."
      description: Aggregate court statistics (65 only)
false_positives:
  - description: The blank SEF-1 form, the enrolment procedure and family-law guidance for schools (FCFCoA, Legal Aid, other states' guidelines), which use every anchor phrase.
    mitigation: Enforce tiers need a filled dd/mm/yyyy order date plus a populated student or restricted-person field; the blank form's ___/___/_____ and label-only fields do not match. Guidance exclusion group for fact sheets and information for schools.
  - description: Protection orders and family-law documents held outside schools (courts, police, legal files) that carry a child's name and order dates.
    mitigation: Such documents can reach 75 through the student/child field. The 85 tier needs a school term. The documents themselves are covered by au-dfv-protection-order and the family-law classifiers.
  - description: Collection-permission records without any court order.
    mitigation: No court-order primary, so no match; au-education-guardian-collection-record covers them.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_edu_court_orders_primary
      matches:
        - ref: Regex_au_edu_court_orders_order_date
        - ref: Regex_au_edu_court_orders_student_field
        - ref: Regex_au_edu_court_orders_restriction
        - ref: Keyword_au_edu_court_orders_school
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_edu_court_orders_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_edu_court_orders_primary
      matches:
        - ref: Regex_au_edu_court_orders_order_date
        - type: any
          min_matches: 1
          refs:
            - Regex_au_edu_court_orders_student_field
            - Regex_au_edu_court_orders_restriction
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_edu_court_orders_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_edu_court_orders_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_edu_court_orders_primary
      pattern: >-
        (?i)\b(?:(?:Family|Other)\s+Court\s+Orders?|orders?\s+made\s+pursuant\s+to\s+the\s+Family\s+Law\s+Act(?:\s+1975)?|family\s+law\s+orders?|parenting\s+orders?|domestic\s+violence\s+orders?|protection\s+orders?|court\s+orders?\s+concerning\s+the\s+welfare,?\s+safety\s+or\s+parenting\s+arrangements)\b
    - id: Regex_au_edu_court_orders_order_date
      pattern: >-
        (?i)\b(?:commencement|start|end|expiry|issue|made)\s+date\s*\*?\s*[:#-]?\s*\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}\b
    - id: Regex_au_edu_court_orders_student_field
      pattern: >-
        (?i)\b(?:(?:prospective\s+)?(?:student|child|pupil)(?:'s)?\s+(?:full\s+|legal\s+)?(?:name|ID|number|no\.?)|legal\s+(?:family|given)\s+names?|EQ\s*ID|OneSchool\s+(?:ID|number)|date\s+of\s+birth|DOB)\s*\*?(?:\s*\([^)]{1,40}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_au_edu_court_orders_restriction
      pattern: >-
        (?i)\b(?:(?:restrained|restricted|named)\s+(?:person|parent|party)|respondent|aggrieved|(?:not\s+(?:permitted|authori[sz]ed|allowed)\s+to\s+(?:collect|contact|visit)|no\s+contact\s+with|do\s+not\s+release\s+(?:the\s+)?(?:student|child)\s+to))\s*[:#-]?\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|unlisted|anyone|other)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}
  keywords:
    - id: Keyword_au_edu_court_orders_school
      groups:
        - match_style: word
          terms:
            - school
            - principal
            - deputy principal
            - enrolment
            - enrolling staff
            - office staff
            - class teacher
            - guidance officer
            - year level
            - OneSchool
            - text: EQ ID
              case_sensitive: true
      strength: domain
    - id: Keyword_au_edu_court_orders_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - fact sheet
            - information for schools
            - guidelines for schools
            - Legal Aid Queensland
            - frequently asked questions
      strength: specific
risk_rating: 10
risk_description: >-
  The classifier identifies a school record showing that a named student is the subject of a current family law parenting order or domestic violence order, with the order dates and the person who must not collect or contact the student. Disclosure to the restrained parent or another person using violence can reveal which school the child attends, the arrangements protecting them and the other parent's circumstances, with a credible risk of abduction or serious harm to a child. This is the child-safety equivalent of the DFV confidential-address harm that the au-dfv set treats as PROTECTED. Risk 10 supports PROTECTED Personal-Privacy; organisations that keep these notes in routine enrolment files may choose SENSITIVE Personal-Privacy after their own harm assessment.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: Queensland Department of Education - Application for Student Enrolment Form (SEF-1 V8), Court Orders section
    url: https://ppr.qed.qld.gov.au/attachment/application-for-student-enrolment-form.pdf
  - title: Queensland Department of Education - Enrolment in state primary, secondary and special schools procedure (decoy source)
    url: https://ppr.qed.qld.gov.au/attachment/enrolment-in-state-primary-secondary-and-special-schools-procedure.pdf
  - title: Federal Circuit and Family Court of Australia - Schools and family law orders (decoy source, content not reviewed)
    url: https://www.fcfcoa.gov.au/fl/schools-orders
