schema: testpattern/v1
name: Grade and assessment records
slug: global-top500-342-grade-and-assessment-records
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies individual student grade and assessment records - grade records and books, assessment records and results, examination results, report cards, statements of results and mark sheets - when the phrase sits with populated student identifiers and grade/mark fields. Education records under applicable privacy law (FERPA in the US).
operation: >-
  Pattern type: regex (boost_regex engine). Primary: grade record/report/book, assessment record/results, examination or exam results, student grades, final grades, grade point average, mark sheet, report card, academic report, statement of results. 65 (discovery only): phrase alone. 75: phrase plus a populated student identifier field. 85: student field plus a populated grade field (grade, final grade, mark, score, result, GPA, achievement level, subject, unit/course code, assessment item, ATAR) plus independent assessment evidence (high distinction, distinction, moderation, teacher comment, semester, special consideration, resubmission, weighting). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:grade\s+(?:records?|reports?|book)|assessment\s+(?:records?|results?)|exam(?:ination)?\s+results|student\s+grades|final\s+grades|grade\s+point\s+average|mark\s+sheet|report\s+card|academic\s+report|statement\s+of\s+results)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated student identifier; 85 also needs a grade field and assessment evidence. Assessment policies, grading rubrics and aggregate results reporting stay at 65.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - GDPR
  - FERPA
data_categories:
- pii
corroborative_evidence:
  keywords:
    - high distinction
    - moderation
    - teacher comment
    - semester
    - special consideration
    - weighting
  proximity: 300
test_cases:
  should_match:
    - value: "Semester 1 report card\nStudent name: Riley Ashworth\nStudent ID: S4471820\nYear level: 9\nSubject: Mathematics\nAchievement level: B\nTeacher comment: consistent effort; moderation confirmed the B."
      description: Populated report card with student, grade fields and assessment evidence (85)
      synthetic: true
    - value: "Examination results enquiry\nCandidate number: 20260917\nName: Casey Rourke"
      description: Results enquiry with labelled student fields only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "student grant"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how assessment records and final grades are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Mark sheet\nStudent name: ____________________\nStudent ID: ____________________\nSubject: ____________________\nFinal grade: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: statewide examination results were released today, with 12 percent of students achieving a high distinction in at least one subject."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Common words and phrases related to grade and assessment records appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The detector recognises grade records, assessment results, examination results and report cards and enforces only when populated student identifier fields sit nearby; phrase-only text stays at 65 discovery. Disclosure can embarrass a student, distort academic or employment decisions, invite targeted coercion, or expose disputed outcomes before appeal is complete. A normal record concerns one learner or a bounded class and does not by itself enable identity takeover, but the educational consequences can be serious and difficult to reverse. Risk 8 and SENSITIVE are justified; PROTECTED would require a large institutional grade repository, widespread tampering capability, or severe safety or life-impacting consequences.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_grade_and_assessment_records
      matches:
        - ref: Regex_global_top500_342_grade_and_assessment_records_student_fields
        - ref: Regex_global_top500_342_grade_and_assessment_records_grade_fields
        - ref: Keyword_global_top500_342_grade_and_assessment_records_assessment_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_342_grade_and_assessment_records_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_grade_and_assessment_records
      matches:
        - ref: Regex_global_top500_342_grade_and_assessment_records_student_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_342_grade_and_assessment_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_grade_and_assessment_records
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_grade_and_assessment_records
      pattern: (?i)\b(?:grade\s+(?:records?|reports?|book)|assessment\s+(?:records?|results?)|exam(?:ination)?\s+results|student\s+grades|final\s+grades|grade\s+point\s+average|mark\s+sheet|report\s+card|academic\s+report|statement\s+of\s+results)\b
    - id: Regex_global_top500_342_grade_and_assessment_records_student_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|student(?:\s+name)?|pupil|child|candidate(?:\s+name)?|EQ\s*ID|LUI|USI|year\s+level|grade\s+level|parent(?:\s+name)?|guardian|carer|(?:student|candidate|enrolment|applicant|file)\s*(?:no\.?|number|ID)|home\s+group|class)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_342_grade_and_assessment_records_grade_fields
      pattern: (?i)\b(?:grade|final\s+grade|mark|score|result|GPA|overall\s+result|achievement(?:\s+level)?|subject|unit(?:\s+code)?|course(?:\s+code)?|assessment\s+item|ATAR)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_342_grade_and_assessment_records_assessment_evidence
      groups:
        - match_style: word
          terms:
            - high distinction
            - distinction
            - moderation
            - teacher comment
            - semester
            - special consideration
            - resubmission
            - academic misconduct
            - weighting
      strength: specific
    - id: Keyword_global_top500_342_grade_and_assessment_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
