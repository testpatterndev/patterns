changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: 'HR quality pass (2026-09-24): rebuilt tiers and capped at 75 (record type is aggregate/operational, not person-level) - 65 primary phrase (discovery), 75 requires two distinct populated structures; removed the self-corroborating phrase evidence; added template-exclusion and guidance/policy NOT-groups; replaced bare-phrase tests with synthetic populated records and guidance/blank-form/news decoys. Replaced the single-phrase primary with payroll access/audit-log phrases and added timestamped event-line and user-field structures; data category changed from financial to security. Regulations now cite the Privacy Act 1988 (Cth) (APP 11) and IPA 2009 (Qld); frameworks add ISM and PSPF.'
  - version: 1.3.2
    date: '2026-09-24'
    description: 'Metadata quality pass (2026-09-24): removed regulation tags that do not apply (SOCI Act 2018 (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701).'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1661 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
