schema: testpattern/v1
name: API interface specifications
slug: global-top500-244-api-interface-specifications
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies api interface specifications patterns in security and access control contexts. Detects potential exposure of sensitive security information in Australian systems.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Keyword
  lists: biometric-facial.
pattern: (?is)\b(api\s+specification|interface\s+specification|api\s+endpoint|REST\s+API|api\s+documentation|api\s+contract|api\s+schema|service\s+interface)\b
confidence: medium
confidence_justification: structural regex with domain-specific anchors and constrained context replaces phrase-only marker.
jurisdictions:
  - global
regulations:
  - NDB Scheme (Cth)
  - Security of Critical Infrastructure Act 2018 (Cth)
  - Telecommunications (Interception and Access) Act 1979 (Cth)
  - GDPR
frameworks:
  - CIS Controls
  - DISP
  - ISO 27001
  - NIST CSF
  - PCI-DSS
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - api interface specifications
    - api
    - interface
    - specifications
    - software
    - engineering
    - architecture
  proximity: 300
  keyword_lists:
    - biometric-facial
test_cases:
  should_match:
    - value: api specification
      description: Primary topic phrase match
    - value: interface specification
      description: Case-insensitive topic phrase match
    - value: api endpoint
      description: Alternative topic phrase match
    - value: REST API
      description: Additional topic phrase match
    - value: |-
        Api specification
        Hostname: app-prd-01.corp.local
        username: svc_deploy
        Source 10.20.30.40 tcp/443
      description: Populated technical artefact reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: openapi post
      description: Generic word pair from old broad template should not match
    - value: |-
        Api specification:
        Hostname:
        username:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about api specification are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Authentication-related terminology in software documentation, security training materials, or system architecture descriptions without actual credentials.
    mitigation: Require proximity to credential-specific patterns (API keys, connection strings, tokens) rather than general security terminology.
  - description: Code snippets and configuration examples containing credential-related keywords or placeholder values in developer documentation.
    mitigation: Check for common placeholder patterns (example.com, localhost, 0000) and documentation file types to reduce false positives from technical writing.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_api_interface_specs
      matches:
        - ref: Regex_global_top500_244_api_interface_specifications_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_api_interface_specs
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_api_interface_specs
            - Regex_global_top500_244_api_interface_specifications_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_api_interface_specs
  regexes:
    - id: Pattern_api_interface_specs
      pattern: (?is)\b(api\s+specification|interface\s+specification|api\s+endpoint|REST\s+API|api\s+documentation|api\s+contract|api\s+schema|service\s+interface)\b
    - id: Regex_global_top500_244_api_interface_specifications_record_structure
      pattern: (?i)(\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\bCVE-\d{4}-\d{4,7}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:tcp|udp)\s*/?\s*\d{2,5}\b|\b(?:port|dport|sport)\s*[:=]?\s*\d{2,5}\b|\b(?:hostname|host|asset\s+ID|device\s+ID|sAMAccountName|UPN|username|account\s+name)\s*:\s*(?!_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9][A-Za-z0-9._\\@-]{2,63})
  keywords:
    - id: Evidence_api_interface_specs
      groups:
        - match_style: word
          terms:
            - openapi
            - swagger
risk_description: >-
  This concept detector recognizes API specification, interface specification, and endpoint language, so it marks an interface-design topic or artifact rather than a live credential. A disclosed specification can reveal endpoint inventory, parameters, object models, authentication assumptions, and undocumented operations that accelerate probing or abuse. The API owner and consumers may face targeted service or data risk, but an attacker generally still needs network reach, credentials, or an exploitable implementation flaw. Risk 8 and SENSITIVE are defensible for a complete internal specification, while privileged administrative endpoints, critical-service interfaces, or embedded secrets would raise the context toward PROTECTED.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech and Medium because a complete internal
    specification reveals endpoint inventory, parameters, object models and authentication assumptions that speed
    probing. PROTECTED is not met because an attacker still needs network reach, credentials or an implementation flaw.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling applies to internal interface detail that lowers the cost of targeted abuse. Privileged
      admin endpoints or embedded secrets would push it higher.
created: '2026-02-08'
