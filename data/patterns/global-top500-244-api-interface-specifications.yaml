changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires an independent populated technical artefact field (Regex_global_top500_244_api_interface_specifications_record_structure), or one remaining corroborative term (openapi, swagger); 85 requires 2 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list. Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.3.3
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had a rationale written for an earlier
      risk rating). References completed: every reference has a title and a verified URL (Old cyber.gov.au ISM/Essential
      Eight paths (/resources-business-and-government/essential-cyber-security/...) now redirect; replaced with current
      canonical URLs).
  - version: 1.3.1
