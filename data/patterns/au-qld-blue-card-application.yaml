schema: testpattern/v1
name: QLD Blue Card Application
slug: au-qld-blue-card-application
version: 1.5.1
type: regex
pattern_class: concept
description: >-
  Detects Queensland blue card (working with children check) applications, renewals and screening outcomes for a named applicant - blue card application or renewal records, positive or negative notices and exemption cards - when the phrase sits with populated applicant identifiers and application fields.
operation: >-
  Primary: blue card application/renewal/number/holder, working with children check or clearance (application), positive/negative notice, exemption card (application). 65 (discovery only): phrase alone. 75: phrase plus a populated applicant identifier field (name, DOB, applicant name, card/application/registration number, client reference). 85: identifier field plus a populated application field (employer or organisation, regulated service/business, category of work, application type, issue/expiry date, suitability outcome, screening result, card type, status) plus independent screening-authority evidence (Blue Card Services, Department of Justice, Working with Children Check Act 2000, child-related work, criminal history, identity verification). Template and guidance/training framing excluded from 75/85. Converted from keyword_list to regex.
pattern: (?i)\b(?:blue\s+card\s+(?:application|renewal|number|holder)|working\s+with\s+children\s+(?:check|clearance)(?:\s+application)?|(?:positive|negative)\s+notice|exemption\s+card(?:\s+application)?)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated applicant identifier; 85 also needs an application field and screening-authority evidence. Public guidance, employer checklists and sign-up web pages carry the phrases without an applicant and stay at 65.
jurisdictions:
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Working with Children Check Act 2000 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - government
  - children
test_cases:
  should_match:
    - value: "Blue card application - renewal\nApplicant name: Avery Teston\nDate of birth: 04/02/1991\nBlue card number: 1142087/2\nEmployer: Harbourview Junior Soccer Club\nCategory of work: Sport and active recreation\nSuitability outcome: Positive notice issued\nBlue Card Services completed the criminal history check."
      description: Populated blue card renewal with applicant, application fields and screening-authority evidence (85)
      synthetic: true
    - value: "Working with children check application received\nName: Casey Rourke\nApplication number: WWC0284471"
      description: WWC application with labelled applicant identifiers only (75)
      synthetic: true
  should_not_match:
    - value: "Blue credit card offer"
      description: Non-match 1
    - value: "Card game at the club"
      description: Non-match 2
    - value: "Sample template for child-work screening fields: applicant name, birth date, reference number, suitability outcome."
      description: Adjacent template language is not a populated Blue Card record
    - value: "The public website explains the child-work screening process."
      description: Public guidance has no Blue Card primary or populated applicant fields
    - value: "Blue debit card application with rewards points."
      description: Sibling payment-card language does not satisfy the child-screening primary
    - value: "Policy guidance: this procedure explains how blue card application forms are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Blue card application\nApplicant name: ____________________\nDate of birth: ____________________\nEmployer: ____________________\nCategory of work: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: Blue Card Services says most working with children check applications are now processed online, and volunteers should apply for a blue card before starting child-related work."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: Blue card references in non-child-safety contexts.
    mitigation: Require Blue Card Services or working with children keywords.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  The detector recognises Queensland blue card / working with children check application, renewal and notice language and enforces only when populated applicant identifier fields sit nearby; phrase-only text stays at 65 discovery. A completed application can combine identity, contact details, employment or volunteering context, criminal-history screening, and a suitability decision, exposing the applicant to stigma, fraud, and loss of opportunity. The normal unit is one safeguarding application rather than a whole child-protection database, and non-child-related blue-card references are excluded by context. Risk 8 SENSITIVE Personal-Privacy reflects serious contained harm; PROTECTED is not met without an active child-safety threat, protected investigation, bulk screening register, or significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_blue_card
      matches:
        - ref: Regex_au_qld_blue_card_application_applicant_fields
        - ref: Regex_au_qld_blue_card_application_application_fields
        - ref: Evidence_blue_card_authority
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_blue_card_application_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_blue_card
      matches:
        - ref: Regex_au_qld_blue_card_application_applicant_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_blue_card_application_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_blue_card
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_blue_card
      pattern: (?i)\b(?:blue\s+card\s+(?:application|renewal|number|holder)|working\s+with\s+children\s+(?:check|clearance)(?:\s+application)?|(?:positive|negative)\s+notice|exemption\s+card(?:\s+application)?)\b
    - id: Regex_au_qld_blue_card_application_applicant_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|applicant(?:\s+name)?|card\s*holder|(?:blue\s+card|card|application|registration|client|customer)\s*(?:no\.?|number|ID)|(?:customer|client)\s+reference(?:\s+number)?)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_au_qld_blue_card_application_application_fields
      pattern: (?i)\b(?:employer|organisation|volunteer\s+organisation|regulated\s+(?:service|business|activity|employment)|category(?:\s+of\s+(?:work|employment))?|application\s+type|(?:issue|expiry|issued)\s+date|suitability\s+outcome|screening\s+result|card\s+type|status)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Evidence_blue_card_authority
      groups:
        - match_style: word
          terms:
            - Blue Card Services
            - Department of Justice
            - Working with Children Check Act 2000
            - child-related work
            - criminal history
            - identity verification
            - regulated employment
      strength: specific
    - id: Keyword_au_qld_blue_card_application_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): converted keyword_list to regex; the 75/85 tiers were gated by field-name keywords ('applicant name', 'employer') that match blank forms and prose, and 85 evidence repeated 'positive notice'. 75 now needs a populated applicant identifier and 85 needs applicant fields plus a populated application field plus screening-authority evidence. Bare-phrase tests replaced with populated records plus policy, blank-form and news decoys. Regulations: removed AML/CTF Act, HRIPA, My Health Records Act and TIA Act; added Working with Children Check Act 2000 (Qld); references added. Note: uk_gov SECRET label is out of band for risk 8 but was not flagged by the audit, so it is left for label review."
  - version: 1.4.0
    date: '2026-07-19'
    description: 'Targeted blocker remediation: add a 65 discovery application tier, require populated screening-application fields at 75 and Queensland issuing-authority evidence at 85, plus exact-tier and sibling/public/template probes.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 573 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Mapped non-canonical confidence 90 to 85.
