schema: testpattern/v1
name: WHS Health Monitoring, Audiometric or Fitness-for-Work Medical Record
slug: au-whs-health-monitoring-record
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Statutory worker health monitoring records under the Work Health and Safety Regulation 2011 (Qld) and the model WHS Regulations: health monitoring reports for hazardous chemicals listed in Schedule 14 (including crystalline silica, isocyanates, cadmium and arsenic; ss 368, 374-378), lead (ss 406-418, blood lead levels) and asbestos (ss 435-444), audiometric testing for noise (s 58), plus pre-employment medicals and fitness-for-work / periodic medical assessments. The Regulation requires these reports to name the worker and date of birth, the registered medical practitioner and registration number, test results, disease advice, remedial recommendations and counselling needs, and to be kept as confidential records (30 years for hazardous chemicals and lead, 40 years for asbestos) not disclosed without the worker's written consent. Workplace drug and alcohol testing is out of scope (see au-drug-alcohol-test-result).
operation: >-
  Primary: health monitoring report / record / results / program / assessment, audiometric test / testing / assessment / report, audiogram, pre-employment medical or health assessment, fitness for work / duty medical / assessment / examination, biological monitoring, blood lead level / test / monitoring, respiratory (health) surveillance, silica health assessment / monitoring, periodic medical / health assessment. 65 is discovery-only (primary alone) and will surface WorkSafe / Safe Work Australia guidance, codes of practice, blank forms and policies. 75 requires a populated worker field (worker / employee / name, date of birth, employer / PCBU, occupation or position, with a non-placeholder value) AND a test-result structure within 300 characters: spirometry values (FEV1, FVC, FEV1/FVC with L or %), blood lead in umol/L or ug/dL, urinary arsenic / cadmium / mercury / MOCA values, audiogram threshold values (Hz with dB, or dB HL), percentage loss of hearing, a chest X-ray finding, or a labelled fitness / result outcome (fit, unfit, fit with restrictions, normal, abnormal). 85 additionally requires a practitioner / recommendation / exposure structure (registered or examining medical practitioner by name, medical or AHPRA registration number, recommendation or remedial measures with a value, medical counselling required yes / no, hazardous chemical / substance / exposure with a value) plus an independent health-monitoring context term (Schedule 14, WHS Regulation, crystalline silica, asbestos, isocyanates, exposure standard, hearing threshold, spirometry, occupational history, remedial measures). Every tier excludes template/fixture text; enforce tiers also exclude legislation text, codes of practice, fact sheets / guides and course material.
pattern: (?i)\b(?:health\s+monitoring\s+(?:report|record|results?|program(?:me)?|assessment)s?|audiometric\s+(?:test(?:ing)?|assessment|report)s?|audiograms?|pre[\s-]?employment\s+(?:medical|health\s+assessment)s?|fitness[\s-]+for[\s-]+(?:work|duty)\s+(?:medical|assessment|examination)s?|biological\s+monitoring|blood\s+lead\s+(?:level|test|monitoring)s?|respiratory\s+(?:health\s+)?surveillance|silica\s+health\s+(?:assessment|monitoring)|periodic\s+(?:medical|health)\s+(?:assessment|examination)s?)\b
confidence: medium
confidence_justification: >-
  Medium: the report types are distinctive and test-result shapes (spirometry, blood lead, audiogram thresholds) are strong, but the same terms fill WHS guidance, codes of practice and occupational health brochures. Enforce tiers therefore need a populated worker plus a result value, and 85 needs practitioner / recommendation / exposure detail. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like a s 374 / s 440 health monitoring report and a typical audiometric report.
jurisdictions:
  - au
  - au-qld
regulations:
  - Work Health and Safety Regulation 2011 (Qld) ss 58, 368-378, 406-418, 435-444, Schedule 14
  - Work Health and Safety Act 2011 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - health
  - pii
  - employment
corroborative_evidence:
  keywords:
    - Schedule 14
    - WHS Regulation
    - crystalline silica
    - asbestos
    - isocyanates
    - exposure standard
    - hearing threshold
    - spirometry
    - occupational history
    - remedial measures
  proximity: 300
test_cases:
  should_match:
    - value: "Health monitoring report - crystalline silica (Schedule 14)\nWorker name: Jesse Teston\nDate of birth: 09/05/1979\nEmployer: Carrow Quarry Pty Ltd\nSpirometry: FEV1 3.21 L (84% predicted), FVC 4.02 L, FEV1/FVC 80%\nChest X-ray: no opacities, no abnormality detected\nRegistered medical practitioner: Dr Anna Teston\nMedical registration number: MED0001234567\nRecommendation: worker can continue silica work; repeat spirometry in 12 months\nMedical counselling required: No"
      description: 85 tier - silica health monitoring report with worker, spirometry and chest X-ray results, practitioner, registration number and recommendation
      synthetic: true
    - value: "Audiometric test report\nEmployee: Robin Teston\nOccupation: boiler operator, Unit 3\nRight ear 4000 Hz: 45 dB HL; left ear 4000 Hz: 40 dB HL\nPercentage loss of hearing: 6.2%\nExamining practitioner: Dr Lee Teston\nRecommendation: refer to audiologist, enforce Class 5 hearing protection\nAudiogram shows a notch consistent with noise exposure; hearing threshold shift since baseline."
      description: 85 tier - audiometric report with employee, audiogram thresholds, practitioner and recommendation, hearing threshold context
      synthetic: true
    - value: "Blood lead level monitoring\nWorker: Kai Teston\nBlood lead: 1.12 umol/L"
      description: 75 tier - blood lead monitoring with a named worker and a result value only
      synthetic: true
    - value: "Pre-employment medical\nCandidate name: Drew Teston\nDate of birth: 22/11/1994\nOutcome: fit with restrictions"
      description: 75 tier - pre-employment medical with populated candidate and a labelled fitness outcome
      synthetic: true
    - value: "Asbestos health monitoring record\nWorker name: Quinn Teston\nDOB: 03/03/1968\nChest X-ray: bilateral pleural plaques\nRegistered medical practitioner: Dr Sam Teston\nHazardous chemical: asbestos (licensed removal, class A)\nMedical counselling required: Yes"
      description: 85 tier - asbestos health monitoring with worker, X-ray finding, practitioner and exposure details
      synthetic: true
  should_not_match:
    - value: "The health monitoring report must include the name and date of birth of the worker, the name and registration number of the registered medical practitioner, and any test results that indicate whether the worker has been exposed to a hazardous chemical. Maximum penalty - 60 penalty units."
      description: WHS Regulation text (s 374)
    - value: "Health monitoring report\nWorker name: ______________\nDate of birth: __/__/____\nSpirometry: FEV1 ____ L\nRegistered medical practitioner: ______________"
      description: Blank health monitoring report form
    - value: "This guide explains audiometric testing for workers exposed to noise above the exposure standard. Audiograms should be done within 3 months of starting work and at least every 2 years."
      description: WorkSafe guidance / fact sheet
    - value: "Silica health assessment - training exercise. Worker name: Pat Teston. FEV1 3.4 L."
      description: Training exercise (template exclusion)
    - value: "Occupational health clinics report a rise in pre-employment medical bookings as silica rules tighten across Queensland quarries."
      description: News article
    - value: "Drug and alcohol test result\nDonor: Casey Teston\nOral fluid screened per AS/NZS 4760: non-negative for cannabinoids, confirmatory testing requested."
      description: Drug and alcohol test (belongs to au-drug-alcohol-test-result, not this classifier)
false_positives:
  - description: WHS Regulation text, codes of practice, Safe Work Australia health monitoring guides and WorkSafe fact sheets.
    mitigation: Guidance names the report fields without values and stays at 65 discovery; legislation markers, "this guide / fact sheet" and course wording are excluded from enforce tiers.
  - description: Blank health monitoring and audiometry forms.
    mitigation: Blank lines and bracket placeholders are rejected for worker fields, and result structures need a numeric value or a finding.
  - description: Occupational health provider marketing and news.
    mitigation: No populated worker field and result value, so these stay at 65.
  - description: Drug and alcohol testing records.
    mitigation: Out of scope - no drug and alcohol term is a primary; those records belong to au-drug-alcohol-test-result.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_whs_health_monitoring_record_primary
      matches:
        - ref: Regex_au_whs_health_monitoring_record_worker_field
        - ref: Regex_au_whs_health_monitoring_record_result
        - ref: Regex_au_whs_health_monitoring_record_practitioner_field
        - ref: Keyword_au_whs_health_monitoring_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_whs_health_monitoring_record_exclusion
    - confidence_level: 75
      id_match: Regex_au_whs_health_monitoring_record_primary
      matches:
        - ref: Regex_au_whs_health_monitoring_record_worker_field
        - ref: Regex_au_whs_health_monitoring_record_result
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_whs_health_monitoring_record_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_whs_health_monitoring_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_whs_health_monitoring_record_primary
      pattern: >-
        (?i)\b(?:health\s+monitoring\s+(?:report|record|results?|program(?:me)?|assessment)s?|audiometric\s+(?:test(?:ing)?|assessment|report)s?|audiograms?|pre[\s-]?employment\s+(?:medical|health\s+assessment)s?|fitness[\s-]+for[\s-]+(?:work|duty)\s+(?:medical|assessment|examination)s?|biological\s+monitoring|blood\s+lead\s+(?:level|test|monitoring)s?|respiratory\s+(?:health\s+)?surveillance|silica\s+health\s+(?:assessment|monitoring)|periodic\s+(?:medical|health)\s+(?:assessment|examination)s?)\b
    - id: Regex_au_whs_health_monitoring_record_worker_field
      pattern: >-
        (?i)\b(?:worker(?:['’]s)?(?:\s+name)?|employee(?:\s+(?:name|no\.?|number|ID))?|candidate(?:\s+name)?|applicant(?:\s+name)?|full\s+name|surname|date\s+of\s+birth|DOB|employer|PCBU|occupation|position|job\s+title)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.,-]{1,40}(?:[ \t]+[A-Za-z0-9][A-Za-z0-9/'.,-]{0,30}){0,4}
    - id: Regex_au_whs_health_monitoring_record_result
      pattern: >-
        (?i)(?:\bFEV1(?:\s*/\s*FVC)?\s*[:=]?\s*\d{1,3}(?:\.\d{1,2})?\s*(?:L\b|%)|\bFVC\s*[:=]?\s*\d{1,2}(?:\.\d{1,2})?\s*L\b|\bblood\s+lead(?:\s+level)?\s*[:=]?\s*\d{1,3}(?:\.\d{1,3})?\s*(?:[µμu]mol/L|[µμu]g/dL)|\burinary\s+(?:inorganic\s+|total\s+)?(?:arsenic|cadmium|mercury|MOCA)\s*[:=]?\s*\d{1,4}(?:\.\d{1,3})?\s*[µμun]?(?:mol|g)/|\b(?:250|500|1000|1500|2000|3000|4000|6000|8000|[1-8]\s?k)\s*Hz\s*[:=]?\s*-?\d{1,3}\s*dB|\b-?\d{1,3}\s*dB\s*HL\b|\b(?:percentage\s+loss\s+of\s+hearing|PLH)\s*[:=]?\s*\d{1,2}(?:\.\d{1,2})?\s*%|\b(?:chest\s+X-?ray|CXR)\s*[:\-]\s*(?:normal|abnormal|clear|NAD|no\s+(?:abnormalit|opacit|evidence)|bilateral|unilateral|pleural|opacit|nodul|consistent\s+with|changes)|\b(?:outcome|result|fitness(?:\s+(?:status|classification|outcome))?|medical\s+classification)\s*[:#]\s*(?:fit\s+with\s+restrictions|temporarily\s+unfit|unfit|fit|normal|abnormal)\b)
    - id: Regex_au_whs_health_monitoring_record_practitioner_field
      pattern: >-
        (?i)(?:\b(?:registered\s+medical\s+practitioner|examining\s+(?:doctor|practitioner|physician)|medical\s+practitioner|occupational\s+physician|treating\s+doctor)\s*[:#]\s*(?:Dr\.?\s+)?(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'.-]{1,30}(?:[ \t]+[A-Z][A-Za-z'.-]{1,30}){0,3}|\b(?:medical|AHPRA|practitioner)\s+registration\s+(?:no\.?|number)\s*[:#]\s*MED\d{10}\b|\b(?:recommendations?|remedial\s+measures?)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|nil|none|the|a|an|see|refer)\b|_{2,}|\[|<)[A-Za-z][A-Za-z0-9/'.,;-]{1,40}(?:[ \t]+[A-Za-z0-9/'.,;-]{1,30}){1,8}|\bmedical\s+counsell?ing\s+(?:required|recommended)\s*[:#]?\s*(?:yes|no)\b|\b(?:hazardous\s+chemicals?|substance|exposure|similar\s+exposure\s+group|SEG)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|nil|none|the|a|an|see|refer)\b|_{2,}|\[|<)[A-Za-z][A-Za-z0-9/'.,()-]{1,40}(?:[ \t]+[A-Za-z0-9/'.,()-]{1,30}){0,6})
    - id: Regex_au_whs_health_monitoring_record_exclusion
      pattern: >-
        (?i)(?:\blegislation\.qld\.gov\.au|\blegislation\.gov\.au|\bMaximum\s+penalty\b|\bcode\s+of\s+practice\b|\bthis\s+(?:fact\s?sheet|guide|guidance|article|page|webinar|course|module|brochure)\b|\bgeneral\s+information\s+only\b|\bbook\s+(?:now|online|your)\b|\bsubscribe\s+to\s+our\b)
  keywords:
    - id: Keyword_au_whs_health_monitoring_record_corroborative
      groups:
        - match_style: word
          terms:
            - Schedule 14
            - WHS Regulation
            - Work Health and Safety Regulation
            - crystalline silica
            - respirable
            - asbestos
            - isocyanates
            - cadmium
            - arsenic
            - exposure standard
            - hearing threshold
            - noise exposure
            - hearing protection
            - spirometry
            - occupational history
            - remedial measures
            - baseline
            - pleural
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies statutory health monitoring reports, audiometric results and fitness-for-work / pre-employment medicals about an identified worker, gated on a populated worker field plus test results, with 85 also requiring practitioner, recommendation or exposure detail. WHS Regulation ss 378, 418 and 444 require these reports to be kept as confidential records and not disclosed without the worker's written consent; disclosure exposes health conditions and exposure history and can drive employment discrimination. Guidance, blank forms, news and drug and alcohol records are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
