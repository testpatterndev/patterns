schema: testpattern/v1
name: Racial or Ethnic Origin
slug: global-racial-ethnic-origin
version: 1.3.0
type: regex
pattern_class: concept
engine: universal
description: >-
  Detects racial or ethnic origin information in person-linked demographic, workforce,
  intake, census, application, and case records. The detector recognises explicit
  racial/ethnic-origin phrases and structured race or ethnicity fields, then raises confidence
  only when the same span contains a data-subject record and a populated attribution. Racial
  or ethnic origin is protected under GDPR Article 9 and Australian anti-discrimination and
  privacy law. Topic-grade detector, low confidence by design.
operation: >-
  The primary regex matches explicit racial/ethnic-origin phrases and structured race or ethnicity fields. 65 (discovery only): phrase alone - policy, guidance, news and survey-design text naming the category stays here. 75: phrase plus a populated identified-person field (name, DOB, employee/member/customer/patient/participant number or ID, data subject). 85: person field plus a second populated demographic field (country of birth, ancestry, cultural background, language spoken at home, interpreter required, Indigenous status) plus independent record evidence (self-described, selected category, diversity survey response, intake interview, equal employment opportunity data). Template framing and guidance/policy/public-aggregate framing are excluded from 75/85. Converted from keyword_list to regex so the tier logic decides matches.
pattern: (?i)\b(?:racial\s+(?:or\s+ethnic\s+)?origin|ethnic\s+origin|race\s+(?:and|or)\s+ethnicity|racial/ethnic\s+(?:origin|background|group|category)|ethnic\s+background|(?:race|ethnicity)\s*(?::|(?:demographic\s+)?(?:field|category|code|response))|racial\s+identity|ethnic\s+identity)
confidence: low
confidence_justification: >-
  Low by design: the attribute has no fixed format. Enforce tiers now require the attribute to be tied to an identified person record (a populated name/DOB/ID field), and 85 also requires a second populated demographic field plus independent record evidence, so policy text, surveys-in-design and news naming the category stay at 65 discovery.
jurisdictions:
  - global
  - au
  - eu
regulations:
  - GDPR
  - Privacy Act 1988 (Cth)
  - Racial Discrimination Act 1975 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - race
    - ethnicity
    - ethnic
    - ancestry
    - heritage
    - diversity survey
  proximity: 300
test_cases:
  should_match:
    - value: "Client intake record\nClient name: Riley Ashworth\nDate of birth: 14/05/2001\nEthnicity: Vietnamese (self-described)\nCountry of birth: Vietnam\nInterpreter required: Yes - Vietnamese\nCaptured at intake interview on 12/08/2026."
      description: Person record with populated ethnicity, a second demographic field and intake evidence (85)
      synthetic: true
    - value: "Employee record\nEmployee ID: E40917\nName: Casey Rourke\nNote: ethnic background withheld at the employee's request."
      description: Person record naming ethnic background without further demographic fields (75)
      synthetic: true
  should_not_match:
    - value: "Country of origin: Australia, per the customs declaration."
      description: Near-miss ("origin" alone, "country of origin"), no racial/ethnic origin disclosure
    - value: "The original document was notarized by a public official."
      description: Unrelated root-word near-miss ("original" vs "origin")
    - value: "The restaurant offers a variety of ethnic cuisines."
      description: Topical mention ("ethnic" alone), no personal disclosure phrase
    - value: "Public aggregate report on population ancestry statistics by region."
      description: Public aggregate material is not a person-linked racial/ethnic disclosure
    - value: "Sample template: employee diversity response, ancestry category recorded as Example Category."
      description: Adjacent template language is not a populated protected-attribute record
    - value: "Data subject profile records nationality as Canadian."
      description: Sibling nationality attribute does not satisfy the racial/ethnic-origin primary
    - value: "Policy guidance: this procedure explains how racial or ethnic origin details are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Diversity survey\nName: ____________________\nEmployee ID: ____________________\nEthnicity: ____________________\nCountry of birth: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: a report on workplace diversity found that employees are more willing to disclose ethnic background when surveys explain how data is used."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: >-
      The bare word "origin" appears in unrelated contexts (country of origin on
      customs/shipping documents, "original" documents) that have nothing to do with racial
      or ethnic origin.
    mitigation: >-
      The regex targets full disclosure phrases and structured race/ethnicity labels rather
      than the bare word "origin"; enforcement requires a person-record context, and the high
      tier also requires an attribution signal.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: broad
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_global_racial_ethnic_origin
      matches:
        - ref: Regex_global_racial_ethnic_origin_person_fields
        - ref: Regex_global_racial_ethnic_origin_demographic_fields
        - ref: Evidence_origin_record_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_racial_ethnic_origin_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_global_racial_ethnic_origin
      matches:
        - ref: Regex_global_racial_ethnic_origin_person_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_racial_ethnic_origin_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_global_racial_ethnic_origin
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_global_racial_ethnic_origin
      pattern: (?i)\b(?:racial\s+(?:or\s+ethnic\s+)?origin|ethnic\s+origin|race\s+(?:and|or)\s+ethnicity|racial/ethnic\s+(?:origin|background|group|category)|ethnic\s+background|(?:race|ethnicity)\s*(?::|(?:demographic\s+)?(?:field|category|code|response))|racial\s+identity|ethnic\s+identity)
    - id: Regex_global_racial_ethnic_origin_person_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|employee(?:\s+name)?|(?:employee|staff|member|customer|client|patient|participant|respondent|person|applicant|voter|record)\s*(?:no\.?|number|ID)|staff\s+member|member(?:\s+name)?|patient(?:\s+name)?|client(?:\s+name)?|customer(?:\s+name)?|applicant(?:\s+name)?|data\s+subject|resident(?:\s+name)?)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_racial_ethnic_origin_demographic_fields
      pattern: (?i)\b(?:country\s+of\s+birth|ancestry|cultural\s+background|language\s+spoken\s+at\s+home|main\s+language|interpreter\s+required|Indigenous\s+status|citizenship)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Evidence_origin_record_evidence
      groups:
        - match_style: word
          terms:
            - self-described
            - selected category
            - survey response
            - intake interview
            - EEO data
            - equal employment opportunity
            - recorded as
      strength: specific
    - id: Keyword_global_racial_ethnic_origin_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
            - public policy document
            - public policy guidance
            - public dataset
            - aggregate statistics
            - aggregate report
            - academic paper
            - blank questionnaire
            - awareness campaign
            - census methodology
            - policy document
            - blank form
      strength: exclusion
risk_rating: 7
risk_description: >-
  A true positive attributes racial or ethnic origin to a person in a demographic, workforce,
  intake, or case record. Disclosure can enable discrimination, profiling, harassment, or
  exclusion, while the normal single-person record does not by itself establish the scale or
  severe consequence required for PROTECTED. Risk 7 and SENSITIVE Personal-Privacy are
  appropriate.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: "SENSITIVE Personal-Privacy"
  us_gov: CUI Basic
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
created: '2026-07-12'
updated: '2026-09-24'
changelog:
  - version: 1.3.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): converted keyword_list to regex; 75 was gated only by record-context keywords (employee record, patient intake, diversity survey) that appear in policy and survey-design text, and 85 evidence could repeat the primary. 75 now requires the attribute to sit with a populated identified-person field (name, DOB, member/employee/patient ID) and 85 requires person fields plus a second populated demographic field plus independent record evidence; policy text naming the category stays at 65. Bare-phrase tests replaced with populated person records; added policy, blank-form and news decoys; public-context exclusions folded into the guidance exclusion group."
  - version: 1.2.0
    date: '2026-07-19'
    description: 'Consolidate the retired Australian alias into the global detector: add Australian legal coverage and workforce/intake evidence, recognise structured race and ethnicity fields, retain 65 discovery, and require person-record plus populated attribution evidence at 75/85.'
  - version: 1.1.0
    date: '2026-07-19'
    description: 'Targeted blocker remediation: add a 65 topic-discovery tier, a 75 data-subject-record tier, and an 85 populated origin-attribution tier, with exact-tier and sibling/public/template probes.'
  - version: 1.0.0
    date: '2026-07-12'
    description: 'New pattern: replaces the deprecated au/global-top500-017-ethnicity-or-race attribute-value patterns (needs-EDM/ML) with an honest topic-classifier concept, modeled on global-political-opinion. Fills the D-wave coverage gap logged in c3-deprecation-report.md.'
