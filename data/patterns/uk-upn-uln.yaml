schema: testpattern/v1
name: "UK Unique Pupil Number (UPN) and Unique Learner Number (ULN)"
slug: uk-upn-uln
version: 1.0.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects UK Department for Education 13-character Unique Pupil Numbers (UPNs: Modulo-23 check letter excluding I, O, S + 3-digit LA code + 4-digit establishment + 2-digit year + 3-digit serial, or 11 digits + optional temporary suffix letter) and labelled 10-digit Unique Learner Numbers (ULNs).
operation: >-
  Matches 13-character alphanumeric UPNs ([A-HJ-NP-RT-Z]\d{11}[0-9A-HJ-NP-RT-Z]) or explicitly labelled 10-digit ULNs. Note: ULN uses an inhomogeneous 10 - (sum mod 11) check digit that cannot be represented as a homogeneous Purview Checksum validator without rejecting genuine ULNs, so ULN requires explicit labelling.
pattern: '(?-i)\b([A-HJ-NP-RT-Z]\d{11}[0-9A-HJ-NP-RT-Z]|(?i:ULN|Unique\s+Learner\s+Number)[\s:#-]{1,6}[1-9]\d{9})\b'
confidence: high
confidence_justification: >-
  High confidence: 13-character UPNs (letter from 23-letter DfE alphabet + 11 digits + digit/letter) are structurally distinctive, and 10-digit ULNs require an explicit ULN / Unique Learner Number label.
jurisdictions:
  - uk
regulations:
  - "UK GDPR"
  - "Data Protection Act 2018 (UK)"
  - "Education Act 1996 (UK)"
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - education
  - government-id
corroborative_evidence:
  keywords:
    - "Unique Pupil Number"
    - "UPN"
    - "Unique Learner Number"
    - "ULN"
    - "Department for Education"
    - "School Census"
    - "Personal Learning Record"
  proximity: 300
test_cases:
  should_match:
    - value: "H820200109001"
      description: "13-character UK Unique Pupil Number (check letter H + 12 digits)"
    - value: "UPN: A30140022101F"
      description: "Temporary UK Unique Pupil Number with trailing letter suffix"
    - value: "Unique Learner Number: 1048293715"
      description: "Labelled 10-digit UK Unique Learner Number (ULN)"
  should_not_match:
    - value: "I820200109001"
      description: "Leading letter I is excluded from the 23-letter DfE UPN check alphabet (I, O, S excluded)"
    - value: "S820200109001"
      description: "Leading letter S is excluded from the DfE UPN check alphabet"
    - value: "1048293715"
      description: "Bare 10-digit number without ULN label does not fire"
    - value: "Sample template: placeholder example record for training only"
      description: "Template/sample fixture suppressed by shared exclusion dictionary"
false_positives:
  - description: "13-character serial numbers starting with a letter followed by 12 digits."
    mitigation: "Enforcing tiers on UPN require school/pupil/DfE/census keywords within 300 characters."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 7
risk_description: >-
  The detector matches a UK Unique Pupil Number (UPN) or labelled Unique Learner Number (ULN). DfE guidance classifies the UPN as sensitive personal data of a minor because it accompanies a child throughout England/Wales schooling, linking safeguarding, SEN/EHCP, free-school-meals, attendance, and attainment records. Risk 7 and SENSITIVE Personal-Privacy reflect minor student-record sensitivity.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy, and Medium because UPNs and ULNs persistently link minor pupils and learners across safeguarding, SEN, and national education databases.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling reflects persistent minor student-record linkage under UK GDPR.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match:
        type: any
        ids:
          - Regex_uk_upn
          - Regex_uk_uln_labeled
      matches:
        - ref: Keyword_uk_pupil_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_uk_uln_labeled
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_uk_upn
      matches:
        - ref: Keyword_uk_pupil_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Regex_uk_upn
          - Regex_uk_uln_labeled
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_uk_upn
      pattern: '(?-i)\b([A-HJ-NP-RT-Z]\d{11}[0-9A-HJ-NP-RT-Z])\b'
    - id: Regex_uk_uln_labeled
      pattern: '(?-i)\b((?:ULN|(?i:Unique\s+Learner\s+Number))[\s:#-]{1,6}[1-9]\d{9})\b'
  keywords:
    - id: Keyword_uk_pupil_context
      groups:
        - match_style: word
          terms:
            - "Unique Pupil Number"
            - text: "UPN"
              case_sensitive: true
            - "Unique Learner Number"
            - "School Census"
            - "Department for Education"
            - "Personal Learning Record"
            - "Learning Records Service"
            - "pupil"
            - "EHCP"
      strength: specific
references:
  - url: https://www.gov.uk/government/publications/unique-pupil-numbers
    title: "GOV.UK Department for Education - Unique Pupil Numbers (UPN) Specification"
  - url: https://www.gov.uk/education/learning-records-service-lrs
    title: "GOV.UK Learning Records Service - Unique Learner Number (ULN)"
created: '2026-11-25'
updated: '2026-11-25'
changelog:
