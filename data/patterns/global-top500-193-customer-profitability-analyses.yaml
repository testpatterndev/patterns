schema: testpattern/v1
name: Customer profitability analyses
slug: global-top500-193-customer-profitability-analyses
version: 1.5.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects customer profitability analyses: a customer profitability / cost-to-serve / customer lifetime value phrase combined with populated per-customer data - rows keyed by a customer identifier, labelled margin/profit/revenue values or labelled customer identifiers. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: customer profitability, profitability analysis, customer margin, customer lifetime value, revenue per customer, cost to serve, profit contribution, account profitability. 65 (discovery only): primary alone. 75: primary plus one populated structure - a delimited data row keyed by a customer/record identifier with a numeric value, a labelled margin/profit/cost-to-serve/CLV/revenue value (dollar or percent), or a labelled customer/client/account ID. 85: primary plus two distinct structures (the three above or a delimited column header pairing a customer ID column with margin/profit/cost-to-serve/CLV/revenue columns) plus commercial evidence (cost allocation, rebate, pricing, price increase, unprofitable, reprice, wallet share, cross-sell, commercial-in-confidence, key account). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: >-
  (?i)\b(?:customer\s+profitability|profitability\s+analys[ie]s|customer\s+margins?|customer\s+lifetime\s+value|revenue\s+per\s+customer|cost\s+to\s+serve|profit\s+contribution|account\s+profitability)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated dataset structure (a data row keyed by a customer/record identifier, a labelled value or a labelled identifier) beside the topic phrase; a column header on its own only counts toward 85, so blank extracts stay at 65. Help pages, policies, product copy and news that only name the topic stay at 65. Medium because internal analytics documentation with worked examples can still reach 75.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - cost allocation
    - rebate
    - pricing
    - price increase
    - unprofitable
    - reprice
    - wallet share
    - cross-sell
    - commercial-in-confidence
    - key account
  proximity: 300
  keyword_lists:
    - data-record-context
test_cases:
  should_match:
    - value: "Customer profitability analysis FY26 - commercial-in-confidence\ncustomer_id,customer_name,revenue,cost_to_serve,gross_margin_pct\nC104421,Harbour Logistics Pty Ltd,412300.00,96200.00,23.3\nC104587,Coral Coast Freight,188450.00,121900.00,-4.1\nReprice or exit the unprofitable key account list by Q3."
      description: Profitability extract - header plus customer rows and commercial evidence (85)
      synthetic: true
    - value: "Customer profitability - Harbour Logistics Pty Ltd\nCustomer ID: C104421\nGross margin: 23.3%\nCost to serve: $96,200\nRecommend a price increase at renewal."
      description: Labelled customer ID and margin values with pricing evidence (85)
      synthetic: true
    - value: "Account profitability review\nCustomer ID: C104421\nNotes to be discussed at the regional meeting."
      description: Single labelled customer identifier (75)
      synthetic: true
  should_not_match:
    - value: "Policy guidance: customer profitability analysis compares revenue, cost to serve and gross margin for each customer. Use the approved allocation model and store outputs in the finance workspace."
      description: Finance guidance naming the measures
      synthetic: true
    - value: "Customer profitability analysis\ncustomer_id,customer_name,revenue,cost_to_serve,gross_margin_pct\n"
      description: Blank extract - column header only (65)
      synthetic: true
    - value: "Banks are using customer profitability models to reprice small business loans, analysts said in a news report on Monday."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "merger fundraising"
      description: Unrelated
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing customer profitability.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of customer profitability.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_customer_profitability
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_193_customer_profitability_analyses_column_header
            - Regex_global_top500_193_customer_profitability_analyses_data_row
            - Regex_global_top500_193_customer_profitability_analyses_labelled_value
            - Regex_global_top500_193_customer_profitability_analyses_identifier
        - ref: Keyword_global_top500_193_customer_profitability_analyses_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_193_customer_profitability_analyses_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_customer_profitability
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_193_customer_profitability_analyses_data_row
            - Regex_global_top500_193_customer_profitability_analyses_labelled_value
            - Regex_global_top500_193_customer_profitability_analyses_identifier
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_193_customer_profitability_analyses_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_customer_profitability
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_customer_profitability
      pattern: (?i)\b(?:customer\s+profitability|profitability\s+analys[ie]s|customer\s+margins?|customer\s+lifetime\s+value|revenue\s+per\s+customer|cost\s+to\s+serve|profit\s+contribution|account\s+profitability)\b
    - id: Regex_global_top500_193_customer_profitability_analyses_column_header
      pattern: (?i)\b(?:(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:gross[ _]?margin(?:[ _]?pct)?|net[ _]?margin|margin(?:[ _]?pct)?|profit(?:ability)?|contribution|cost[ _]?to[ _]?serve|cts|clv|ltv|lifetime[ _]?value|revenue)|(?:gross[ _]?margin(?:[ _]?pct)?|net[ _]?margin|margin(?:[ _]?pct)?|profit(?:ability)?|contribution|cost[ _]?to[ _]?serve|cts|clv|ltv|lifetime[ _]?value|revenue)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash))\b
    - id: Regex_global_top500_193_customer_profitability_analyses_data_row
      pattern: (?i)\b[A-Z]{0,5}[-_]?\d{4,12}\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,160}?(?:[,;\t]|\|[ \t]{0,2}))?\"?-?\$?\d{1,12}(?:\.\d{1,6})?%?(?![\w.])
    - id: Regex_global_top500_193_customer_profitability_analyses_labelled_value
      pattern: (?i)\b(?:(?:gross|net|customer|contribution)\s+margin|profit(?:\s+contribution)?|cost\s+to\s+serve|CLV|lifetime\s+value|annual\s+revenue|revenue)[ \t]{0,3}[:#][ \t]{0,3}(?:(?:AUD|USD|NZD|GBP|EUR|A\$|US\$|NZ\$|\$|£|€)[ \t]?(?:\d{1,3}(?:,\d{3}){1,4}|\d{1,12})(?:\.\d{2})?(?![\d,]\d)(?!\.\d)|-?\d{1,3}(?:\.\d{1,2})?[ \t]?%)
    - id: Regex_global_top500_193_customer_profitability_analyses_identifier
      pattern: (?i)\b(?:customer\s*(?:no\.?|number|ID)|client\s*(?:no\.?|number|ID)|account\s*(?:no\.?|number|ID))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Za-z-]{0,8}\d)[A-Za-z0-9][A-Za-z0-9._@-]{3,64}
  keywords:
    - id: Keyword_global_top500_193_customer_profitability_analyses_domain_evidence
      groups:
        - match_style: word
          terms:
            - cost allocation
            - rebate
            - pricing
            - price increase
            - unprofitable
            - reprice
            - wallet share
            - cross-sell
            - commercial-in-confidence
            - key account
      strength: domain
    - id: Keyword_global_top500_193_customer_profitability_analyses_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - allocation model
            - finance workspace
      strength: noise
risk_description: >-
  This concept regex recognises customer profitability, customer margin, lifetime value, cost-to-serve, and related analysis terms, targeting a financial assessment rather than a basic customer contact record. Disclosure can reveal which customers are most valuable or loss-making, internal margins, service costs, and retention priorities, enabling competitor targeting, customer bargaining, or discriminatory treatment concerns across the analysed portfolio. The medium-confidence rule can also match methodology documents and aggregate presentations without customer-level values. Risk 8 and SENSITIVE Financial reflect serious commercial and potentially person-linked harm; PROTECTED would require highly regulated identities or enterprise-scale exposure capable of significant damage. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Personal-Privacy because a populated
    profitability analysis can expose identifiable customer value, behavior, and commercial decisions. PROTECTED is not
    met for a normal company portfolio without systemic financial consequence, critical services, or significant broader
    damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium with Medium Personal-Privacy handling is appropriate for nonpublic customer value and retention analysis.
      High is reserved for exceptional systemic or protected-service consequences rather than ordinary account
      segmentation.
