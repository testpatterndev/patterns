schema: testpattern/v1
name: Detention custody records
slug: global-top500-414-detention-custody-records
version: 1.3.2
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies detention and custody records about an identified person (watch-house custody records, booking and intake records, prisoner and detainee records) with populated person and custody fields.
operation: 'Primary: detention/custody/inmate/booking/jail/intake/prisoner/incarceration record, custody log, detention or holding facility. 65 (discovery only) = primary alone. 75 = primary plus one populated person or custody field (name, date of birth, prisoner, detainee, offender, accused, booking/custody number, cell, charge, IOMS number, case/file/reference number ...) with a non-placeholder value. 85 = primary plus two distinct populated fields plus independent custodial evidence (watch house, cell check, observation log, medical screening, at risk, remanded in custody, bail refused, lodged in custody, property receipt, strip search). All tiers exclude template/fixture text.'
pattern: (?is)\b(?:detention\s+record|custody\s+record|inmate\s+record|booking\s+record|jail\s+record|detention\s+facility|custody\s+log|intake\s+record|prisoner\s+record|holding\s+facility|incarceration\s+record)\b
confidence: medium
confidence_justification: 'Medium: custody vocabulary appears in policy, news and oversight reports, so enforcement requires populated person/custody fields; 85 adds custodial-process evidence.'
jurisdictions:
- global
regulations:
  - Corrective Services Act 2006 (Qld)
  - Police Powers and Responsibilities Act 2000 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - QGISCF
  - ISO 27001
data_categories:
  - law-enforcement
  - pii
corroborative_evidence:
  keywords:
  - detention custody records
  proximity: 240
test_cases:
  should_match:
    - value: |-
        Watch house custody record
        Prisoner: Riley Teston
        Date of birth: 04/02/1991
        Booking number: WH26-004471
        Charge: Breach of bail
        Medical screening completed; placed on 15-minute cell check observations; remanded in custody.
      description: 85 - populated custody record with medical screening/cell check evidence
      synthetic: true
    - value: |-
        Detention record - youth detention centre
        Detainee: Morgan Teston
        Admitted following a court order; transfer to the Brisbane centre is scheduled for Friday.
      description: 75 - one populated detainee field without custodial-process evidence
      synthetic: true
    - value: Custody log extract attached to the complaint file.
      description: 65 discovery - topic phrase without populated fields
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: mugshot victim
      description: Generic word pair should not match
    - value: The custody record policy sets out how officers complete a custody record and how long it is retained.
      description: Policy guidance - no populated fields (65 at most)
    - value: |-
        Custody record
        Prisoner: ________
        Date of birth: __/__/____
        Booking number: [auto-generated]
        Charge: ________
      description: Blank custody form - placeholder fields are rejected
    - value: Two detainees escaped from the detention facility overnight, police said, and an inspector will review the custody log.
      description: News item - no populated fields
false_positives:
- description: Common words and phrases related to detention custody records appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_detention_custody
      matches:
        - ref: Regex_global_top500_414_detention_custody_records_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_custodial_process_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_detention_custody
      matches:
        - ref: Regex_global_top500_414_detention_custody_records_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_detention_custody
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_detention_custody
      pattern: (?is)\b(?:detention\s+record|custody\s+record|inmate\s+record|booking\s+record|jail\s+record|detention\s+facility|custody\s+log|intake\s+record|prisoner\s+record|holding\s+facility|incarceration\s+record)\b
    - id: Regex_global_top500_414_detention_custody_records_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|defendant|accused|offender|prisoner|inmate|detainee|respondent|applicant|witness|suspect|subject\s+(?:name|person)|person\s+of\s+interest|victim|complainant|officer|CNI|QPRIME|(?:file|case|matter|court|reference|ref|exhibit|brief|job|incident|report|investigation|occurrence)\s*(?:no\.?|number|ID|#)|booking\s+(?:no\.?|number)|custody\s+(?:no\.?|number|ref(?:erence)?)|cell(?:\s+(?:no\.?|number))?|charges?|IOMS(?:\s+(?:no\.?|number))?|correctional\s+centre|facility)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_custodial_process_evidence
      groups:
        - match_style: word
          terms:
            - watch house
            - cell check
            - observation log
            - medical screening
            - at risk
            - remanded in custody
            - bail refused
            - lodged in custody
            - property receipt
            - strip search
            - safety observations
      strength: specific
risk_description: The detector finds detention, custody, inmate, and booking records within law-enforcement or custodial context.
  An actual record may expose a person's location, legal status, movements, health or vulnerability notes, and release arrangements,
  enabling harassment, discrimination, escape assistance, or interference with lawful custody. Consequences are serious for
  the detainee and custodial authority but generally bounded to an individual record and established facility procedures.
  Risk 8 supports SENSITIVE Law-Enforcement; PROTECTED would require protected detainees, active extraction or escape plans,
  or compromise of facility-wide security.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Law-Enforcement
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Law-Enforcement because custody records
    expose liberty status, location, and operational arrangements with direct personal and institutional consequences.
    PROTECTED is not met without protected prisoners, active security plans, or broad facility compromise.
  generic:
    classification: Medium
    dlm: Medium Law-Enforcement
    rationale: >-
      Detention and custody records are generically Medium with Medium Law-Enforcement controls because they combine
      sensitive personal status with operational custodial information in a bounded case.
