schema: testpattern/v1
name: Union membership status
slug: global-top500-068-union-membership-status
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects records of an identified employee's trade union membership or delegate status: payroll deduction authorities, membership numbers, join dates and dues. Union membership is sensitive information under the Privacy Act 1988 (Cth).
operation: >-
  Primary: a union membership phrase (union membership/member/delegate/affiliation/status, trade union membership, member of the union). 75 tier requires a populated person field (employee/staff name or number, member name, position number or title, work unit) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated membership detail (membership number, dues/fees amount, or date joined) and an independent corroborative term (payroll deduction, branch, industrial officer, workplace delegate, Together Queensland). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:union\s+(?:membership|member|delegate|affiliation|status)|trade\s+union\s+member(?:ship)?|member\s+of\s+(?:the|a)\s+(?:trade\s+)?union)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - payroll deduction
    - branch
    - industrial officer
    - workplace delegate
    - Together Queensland
    - CPSU
    - ASU
    - AWU
    - ETU
    - QNMU
    - right of entry
  proximity: 300
test_cases:
  should_match:
    - value: "Union membership - payroll deduction authority\nEmployee name: Avery Teston\nMembership number: 2045117\nFortnightly dues: $24.50\nUnion: Together Queensland, Brisbane branch."
      description: '85: Deduction authority with employee, membership number and dues'
      synthetic: true
    - value: "Trade union membership record\nEmployee ID: 5520117\nDate joined: 12/03/2024\nFees paid by payroll deduction each pay; CPSU."
      description: '85: Membership record with employee ID and join date'
      synthetic: true
    - value: "Union delegate list\nStaff member: Jordan Staffson\nWork unit: Ipswich depot\nConfirmed as delegate for the depot from next month."
      description: '75: Delegate list naming the staff member, no membership detail'
      synthetic: true
  should_not_match:
    - value: Union membership is sensitive information under the Privacy Act; employers must not ask about it except where the law allows.
      description: Guidance text - must stay below 75
    - value: "Union payroll deduction authority\nEmployee name: __________\nMembership number: __________\nUnion: __________"
      description: Blank deduction form - must stay below 75
    - value: Union membership fell to 12.5% of employees, ABS figures in a media release show.
      description: News / statistics - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_068_union_membership_status_primary
      matches:
        - ref: Regex_top500_068_union_membership_status_person_field
        - ref: Regex_top500_068_union_membership_status_record_detail
        - ref: Keyword_top500_068_union_membership_status_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_068_union_membership_status_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_068_union_membership_status_primary
      matches:
        - ref: Regex_top500_068_union_membership_status_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_068_union_membership_status_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_068_union_membership_status_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_068_union_membership_status_primary
      pattern: >-
        (?i)\b(?:union\s+(?:membership|member|delegate|affiliation|status)|trade\s+union\s+member(?:ship)?|member\s+of\s+(?:the|a)\s+(?:trade\s+)?union)\b
    - id: Regex_top500_068_union_membership_status_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit|member\s+name)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_068_union_membership_status_record_detail
      pattern: >-
        (?i)\b(?:union\s+)?member(?:ship)?\s+(?:no\.?|number|ID)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Z0-9-]{3,15}\b|\b(?:dues|fees|subscription)\s*(?:deduction|amount)?\s*(?:\([^)]{1,20}\))?\s*[:\-]\s*(?:(?:AUD|USD|GBP|NZD|A\$|US\$|NZ\$|\$|£|€)\s?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?)|\b(?:date\s+joined|joined|membership\s+(?:start|commencement)\s+date)\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})
  keywords:
    - id: Keyword_top500_068_union_membership_status_corroborative
      groups:
        - match_style: word
          terms:
            - payroll deduction
            - branch
            - industrial officer
            - workplace delegate
            - Together Queensland
            - text: CPSU
              case_sensitive: true
            - text: ASU
              case_sensitive: true
            - text: AWU
              case_sensitive: true
            - text: ETU
              case_sensitive: true
            - text: QNMU
              case_sensitive: true
            - right of entry
      strength: specific
    - id: Keyword_top500_068_union_membership_status_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a individual trade union membership record about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Union membership is sensitive information; disclosure can expose an identifiable employee to discrimination or adverse action for industrial activity. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
