schema: testpattern/v1
name: Confidential University Research Invention Disclosure
slug: au-education-research-invention-disclosure
version: 1.1.0
type: regex
pattern_class: concept
description: >-
  Detects populated confidential university research invention disclosures: an invention disclosure / research commercialisation disclosure heading combined with labelled inventor, invention title or technical-description fields carrying real values. Phrase-only mentions (policy, process pages, news) stay discovery-only.
pattern: (?i)\b(?:(?:research|university|confidential)\s+invention\s+disclosure|invention\s+disclosure\s+(?:form|record)|research\s+commercialisation\s+disclosure|IP\s+disclosure\s+form)\b
operation: >-
  Pattern type: regex (boost_regex). Primary: research/university/confidential invention disclosure, invention disclosure form/record, research commercialisation disclosure, IP disclosure form. 65 (discovery only): primary alone. 75: primary plus one populated field - inventor/lead researcher/chief investigator name, invention or technology title, or novel feature/technical description/commercial application text. 85: primary plus two distinct field types (the four above plus disclosure number/date, faculty, funding source or grant number) plus confidentiality evidence (confidential invention, patent filing pending, provisional patent, prior art search, inventorship, IP ownership). Template/sample framing and guidance/news framing are excluded on every enforce tier.
confidence: medium
confidence_justification: >-
  Enforce tiers require labelled inventor, title or technical-description values beside the disclosure heading; blank forms (placeholder values) and guidance fail the placeholder guard and exclusion groups. Published patent abstracts share the field labels but lack the disclosure heading. Medium, not high, because internal research-office paperwork with the same headings can still match.
jurisdictions:
  - au
regulations:
  - Patents Act 1990 (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
frameworks:
  - ISO 27001
data_categories:
  - education
  - intellectual-property
scope: narrow
risk_rating: 7
risk_description: >-
  A populated confidential university research invention disclosure can expose confidential education information. Classification is a package mapping, not a determination of every document's risk. Quality pass 2026-09-24: enforce tiers (75/85) now require populated record structure (labelled fields with real values, identifiers or data rows); phrase-only mentions in guidance, marketing, blank forms and news stay at 65 discovery.
references:
  - title: IP Australia - Patents
    url: https://www.ipaustralia.gov.au/patents
  - title: IP Australia - What to consider before applying for a patent (public disclosure destroys novelty)
    url: https://www.ipaustralia.gov.au/patents/how-to-apply-for-a-standard-patent/what-to-consider-before-applying-for-a-patent
  - title: Patents Act 1990 (Cth)
    url: https://www.legislation.gov.au/C2004A04014/latest/text
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
package_tags:
  primary_component: business-records
  components:
    - business-records
  component_tier: large
  deployment_priority:
    - expanded
  sectors:
    - education
  addons: []
  label_domains:
    - education
    - business
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_education_research_invention_disclosure_primary
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_au_education_research_invention_disclosure_inventor
            - Regex_au_education_research_invention_disclosure_title
            - Regex_au_education_research_invention_disclosure_technical
            - Regex_au_education_research_invention_disclosure_admin
        - ref: Keyword_au_education_research_invention_disclosure_confidentiality
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_education_research_invention_disclosure_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_education_research_invention_disclosure_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_education_research_invention_disclosure_inventor
            - Regex_au_education_research_invention_disclosure_title
            - Regex_au_education_research_invention_disclosure_technical
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_education_research_invention_disclosure_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_education_research_invention_disclosure_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_education_research_invention_disclosure_primary
      pattern: (?i)\b(?:(?:research|university|confidential)\s+invention\s+disclosure|invention\s+disclosure\s+(?:form|record)|research\s+commercialisation\s+disclosure|IP\s+disclosure\s+form)\b
    - id: Regex_au_education_research_invention_disclosure_inventor
      pattern: (?i)\b(?:inventors?(?:\s+\d)?|lead\s+(?:researcher|inventor)|co-inventors?|chief\s+investigator|contributors?)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?:(?:Mr|Mrs|Ms|Mx|Dr|Prof)\.?[ \t]{1,3})?[A-Z][A-Za-z'.-]{1,30}(?:[ \t]{1,3}[A-Z&][A-Za-z'.&-]{0,30}){0,5}
    - id: Regex_au_education_research_invention_disclosure_title
      pattern: (?i)\b(?:(?:invention|technology|project)\s+title)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
    - id: Regex_au_education_research_invention_disclosure_technical
      pattern: (?i)\b(?:novel\s+features?|technical\s+description|commercial\s+applications?|description\s+of\s+(?:the\s+)?invention|advantages|prior\s+art)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
    - id: Regex_au_education_research_invention_disclosure_admin
      pattern: (?i)\b(?:disclosure\s*(?:no\.?|number|ID|date)|date\s+of\s+(?:conception|first\s+disclosure)|faculty|school|funding\s+source|grant\s*(?:no\.?|number))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
  keywords:
    - id: Keyword_au_education_research_invention_disclosure_confidentiality
      groups:
        - match_style: word
          terms:
            - confidential invention
            - not for public release
            - patent filing pending
            - unpublished invention
            - provisional patent
            - prior art search
            - first public disclosure
            - inventorship
            - IP ownership
            - commercialisation office
      strength: domain
    - id: Keyword_au_education_research_invention_disclosure_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - published patent
            - patent abstract
            - disclosure process
      strength: noise
test_cases:
  should_match:
    - value: "University invention disclosure\nConfidential invention\nInventor: Morgan Teston\nInvention title: Adaptive water sensing material\nNovel feature: A responsive coating changes conductivity in water"
      description: 'Populated disclosure: inventor, title and novel feature plus confidential-invention marker (85)'
      synthetic: true
    - value: "Research commercialisation disclosure\nPatent filing pending\nLead researcher: Jordan Teston\nTechnology title: Low energy sensing device\nCommercial application: Monitoring temperature in storage facilities"
      description: Populated commercialisation disclosure with patent-pending evidence (85)
      synthetic: true
    - value: "Invention disclosure form\nLead researcher: Jordan Teston\nSubmitted to the research office for review."
      description: Disclosure form with a single populated researcher field (75)
      synthetic: true
  should_not_match:
    - value: "Published patent abstract\nInventor: Morgan Teston\nInvention title: Adaptive water sensing material\nTechnical description: A responsive coating changes conductivity in water"
      description: Public patent abstract - fields present but no disclosure heading
      synthetic: true
    - value: "University invention disclosure\nConfidential invention\nInventor: __________\nInvention title: __________\nNovel feature: __________"
      description: Blank disclosure form - placeholder values (65 at most)
      synthetic: true
    - value: "Policy guidance: researchers should submit a university invention disclosure before any publication. The form asks for the inventor names, the invention title and a technical description of the novel features."
      description: Research office guidance naming the form and its fields without values
      synthetic: true
    - value: "The university said research commercialisation disclosure numbers rose 20% last year, in a media release on Monday."
      description: News / media release mentioning the disclosure type
      synthetic: true
exports:
  - yaml
  - purview
created: '2026-09-13'
updated: '2026-09-24'
author: Compl8
license: MIT
corroborative_evidence:
  keywords:
    - confidential invention
    - not for public release
    - patent filing pending
    - unpublished invention
    - provisional patent
    - prior art search
    - first public disclosure
    - inventorship
    - IP ownership
    - commercialisation office
  proximity: 300
false_positives:
  - description: Research-office process pages and training explaining how to complete an invention disclosure.
    mitigation: Guidance and training framing is excluded and the fields in such pages are unpopulated, so they stay at 65.
  - description: Published patent abstracts and journal papers carrying inventor and title fields.
    mitigation: They do not carry the disclosure heading, so the primary never fires.
changelog:
  - version: 1.1.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): rebuilt the malformed single-tier purview block (the 85 tier required all four regexes and there was no 75/65 path) into 65/75/85; 75 = heading + one populated inventor/title/technical field, 85 = two distinct field types + confidentiality evidence; added template and guidance exclusions, placeholder guards, guidance/news decoys; removed the positive that carried template wording; added Patents Act, Privacy Act and IPA 2009 (Qld) regulations, ISO 27001 and verified IP Australia / legislation references; proximity 1000 -> 300.
