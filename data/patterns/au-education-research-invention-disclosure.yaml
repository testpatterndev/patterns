{
  "schema": "testpattern/v1",
  "name": "Confidential University Research Invention Disclosure",
  "slug": "au-education-research-invention-disclosure",
  "version": "1.0.0",
  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated confidential university research invention disclosure using record context and corroborating fields.",
  "pattern": "(?i)(?:research invention disclosure|university invention disclosure|research commercialisation disclosure)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
  "regulations": [],
  "frameworks": [],
  "data_categories": [
    "education",
    "intellectual-property"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated confidential university research invention disclosure can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://www.ipaustralia.gov.au/patents"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE InfoTech"
  },
  "package_tags": {
    "primary_component": "business-records",
    "components": [
      "business-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "business"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          },
          {
            "ref": "Regex_4"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:research invention disclosure|university invention disclosure|research commercialisation disclosure)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:inventor|lead researcher)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{2,70}"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:invention title|technology title)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{4,100}"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)(?:novel feature|technical description|commercial application)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{8,160}"
      },
      {
        "id": "Regex_4",
        "pattern": "(?i)(?:confidential invention|not for public release|patent filing pending|unpublished invention)"
      }
    ]
  },
  "test_cases": {
    "should_match": [
      {
        "value": "University invention disclosure\nConfidential invention\nInventor: Morgan Teston\nInvention title: Adaptive water sensing material\nNovel feature: A responsive coating changes conductivity in water",
        "description": "Synthetic populated record variant 1",
        "synthetic": true
      },
      {
        "value": "Research commercialisation disclosure\nPatent filing pending\nLead researcher: Jordan Teston\nTechnology title: Low energy sensing device\nCommercial application: Monitoring temperature in storage facilities",
        "description": "Synthetic populated record variant 2",
        "synthetic": true
      },
      {
        "value": "University invention disclosure\nConfidential invention\nInventor: Morgan Teston\nInvention title: Adaptive water sensing material\nNovel feature: A responsive coating changes conductivity in water\nForm template version 2.1. Retain the completed record.",
        "description": "Synthetic populated record variant 3",
        "synthetic": true
      },
      {
        "value": "Research commercialisation disclosure\nPatent filing pending\nLead researcher: Jordan Teston\nTechnology title: Low energy sensing device\nCommercial application: Monitoring temperature in storage facilities",
        "description": "Synthetic populated record variant 4",
        "synthetic": true
      }
    ],
    "should_not_match": [
      {
        "value": "Published patent abstract\nInventor: Morgan Teston\nInvention title: Adaptive water sensing material\nTechnical description: A responsive coating changes conductivity in water",
