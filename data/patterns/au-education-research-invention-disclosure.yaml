        "synthetic": true
      },
      {
        "value": "University invention disclosure\nConfidential invention\nInventor: __________\nInvention title: __________\nNovel feature: __________",
        "description": "Synthetic public, blank, distant or unrelated counterexample 2",
        "synthetic": true
      }
    ]
  },
