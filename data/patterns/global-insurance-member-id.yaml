schema: testpattern/v1
name: Health Insurance Member / Subscriber ID (Labelled)
slug: global-insurance-member-id
version: 1.4.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects a labelled health-insurance member, subscriber, policy or group identifier:
  a member/subscriber/policy/group ID label followed by a 6-15 character alphanumeric
  value that contains at least one digit. Insurance identifiers are protected health
  information under HIPAA and are frequently exposed in breach disclosures. Australian private
  health funds call the identifier a "membership number" (Medibank, Bupa, HCF), and it sits in
  patient and customer records next to the fund name or "private health insurance"; that label
  is detected by a second regex with its own, health-specific evidence, because motoring clubs,
  gyms and loyalty programmes also issue membership numbers.
operation: >-
  Two primaries with the same value shape (up to 8 separator characters, then a 6-15 character
  value of letters, digits and hyphens that must include at least one digit, bounded with
  non-alphanumeric lookarounds). Regex_insurance_member_id: a member / subscriber / policy / group /
  enrollee / insured label with an id/identifier/number/no qualifier; 75 needs the general
  health-insurance context group and 85 adds person-coverage context. Regex_insurance_membership_number:
  a "membership number" / "membership no" label; 75 needs health-fund context only (health fund,
  private health, health cover, hospital cover, extras cover, Medibank, Bupa) and 85 adds
  person-coverage context. The general terms insurer, coverage, insurance claim, health plan and
  payer never raise a membership number above 65, so a motoring-club or general-insurer membership
  record stays discovery-only. Both primaries have a 65 discovery tier and every tier rejects the
  shared template exclusion. The top-level pattern is the first regex only. Evidence proximity is
  300 characters.
pattern: '(?-i)(?<![A-Za-z])((?i:(?:member|subscriber|policy|group|enrollee|insured)\s+(?:id|identifier|number|no\.?))[\s:#=-]{0,8}(?=[A-Z0-9-]{6,15}(?![A-Z0-9-]))(?:[A-Z-]*\d[A-Z0-9-]*))(?![A-Z0-9-])'
confidence: medium
confidence_justification: >-
  Medium confidence: the value charset is generic, but requiring an explicit
  member/subscriber/policy/group ID label adjacent to a 6-15 character value
  containing a digit substantially reduces false positives. Not high because the
  label-plus-alphanumeric structure can appear in non-health contexts.
jurisdictions:
  - global
  - au
regulations:
  - HIPAA
  - Privacy Act 1988 (Cth)
frameworks:
  - CIS Controls
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - phi
  - health
corroborative_evidence:
  keywords:
    - health insurance
    - insurance
    - member id
    - subscriber id
    - policy number
    - group number
    - health plan
    - explanation of benefits
  proximity: 300
test_cases:
  should_match:
    - value: 'Member ID: ABC123456789'
      description: Exact 65 discovery probe with a labelled value but no health-insurance context
    - value: 'subscriber number = XYZ7654321'
      description: Subscriber number label, value contains digits, lowercase label
    - value: 'Policy No. H12-3456-78'
      description: Policy number with hyphenated value containing digits
    - value: 'Health plan Member ID: ABC123456789'
      description: Exact 75 probe with health-insurance context
    - value: 'Patient claim for Health plan Member ID: ABC123456789'
      description: Exact 85 probe with health-insurance and person-linked care context
    - value: "Private health insurance: Medibank Private\nMembership number: 71820394A"
      description: Australian private health fund membership number in a patient record (75)
      synthetic: true
    - value: "Patient: Avery Teston  Date of birth: 04/02/1991\nHealth fund: Bupa  Membership no. 6044718\nHospital cover: yes"
      description: Australian health fund membership number with patient linkage (85)
      synthetic: true
  should_not_match:
    - value: 'Member ID: ABCDEFGH'
      description: Value has no digit, likely a word not an identifier
    - value: 'group photo number twelve was the best'
      description: Prose using the words group/number with no identifier value
    - value: 'Policy No. 12'
      description: Value too short (under 6 characters)
    - value: 'Club Member ID: ABC123456789'
      description: Valid non-health membership identifier must remain discovery-only
    - value: 'Frequent flyer membership number: 7182039A - points balance 48,200, Gold status until 31/12/2026'
      description: Loyalty programme membership number with no health context must remain discovery-only
    - value: 'Gym membership number 20481736 - direct debit fortnightly, 12 month term'
      description: Gym membership number with no health-insurance context must remain discovery-only
    - value: "Motoring club roadside assistance\nMembership number: 71820394\nYour insurer will contact you about coverage for the insurance claim lodged on 12/08/2026."
      description: Motoring-club membership number beside general insurance words (insurer, coverage, insurance claim) must remain discovery-only
false_positives:
  - description: Order numbers, membership IDs for non-health clubs, or group codes that share the member/policy/group labelling.
    mitigation: Require corroborative health-insurance keywords (health plan, EOB, payer) within proximity to confirm a health context.
  - description: Motoring club, general insurer and mutual memberships (roadside assistance, car or home insurance) where a "membership number" or "policy number" sits near the words insurer, coverage or insurance claim.
    mitigation: A "membership number" label is a separate primary whose 75 and 85 tiers accept health-fund context only (health fund, private health, health cover, hospital cover, extras cover, Medibank, Bupa), so these membership records stay at the 65 discovery tier. A "policy number" or "member ID" beside insurer, coverage or insurance claim still reaches 75 through the original labels, as it did before 1.3.0; that older behaviour is unchanged.
  - description: Loyalty, frequent-flyer, gym, union and library "membership number" fields, matched by the membership label.
    mitigation: They stay at the 65 discovery tier unless health-fund context is within 300 characters. A club page that prints a membership number next to a health-fund offer ("members save on hospital cover with ...") would reach 75.
  - description: Health fund membership numbers recorded with no fund name and none of the health-fund terms, for example under a bare "Health insurance" or "Insurance" heading, or for funds other than Medibank and Bupa.
    mitigation: Not detected above 65 (false negative) unless "health fund", "private health", "health cover", "hospital cover" or "extras cover" is within 300 characters. Short or ambiguous fund names (nib, HCF, HBF) are deliberately not keywords; add the funds your records name at deployment.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 8
risk_description: >-
  The regex finds a 6-15 character alphanumeric value containing a digit after a member, subscriber, policy, or group identifier label in health-insurance context. A genuine identifier can link a person to coverage, support fraudulent claims or impersonation, and help retrieve further insurance information when combined with a name and provider. Order numbers, club memberships, and unrelated group codes can share the same labels, and the identifier alone does not disclose diagnosis or treatment. Risk 8 SENSITIVE reflects serious but person-bounded privacy and entitlement harm; PROTECTED would require linked clinical information, a bulk member register, or significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy, SENS_Pvc, and Medium because a
    labelled insurance member ID can materially expose and enable misuse of one person's coverage. It does not itself
    reveal a medical dossier or meet PROTECTED scale.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium with Medium Personal-Privacy fits a health-plan identifier with serious individual fraud and
      linkage risk. Generic High would require aggregated membership or clinically detailed records.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_insurance_member_id
      matches:
        - ref: Keyword_health_insurance_context
        - ref: Keyword_person_coverage_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_insurance_member_id
      matches:
        - ref: Keyword_health_insurance_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_insurance_member_id
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 85
      id_match: Regex_insurance_membership_number
      matches:
        - ref: Keyword_health_fund_context
        - ref: Keyword_person_coverage_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_insurance_membership_number
      matches:
        - ref: Keyword_health_fund_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_insurance_membership_number
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_insurance_member_id
      pattern: '(?-i)(?<![A-Za-z])((?i:(?:member|subscriber|policy|group|enrollee|insured)\s+(?:id|identifier|number|no\.?))[\s:#=-]{0,8}(?=[A-Z0-9-]{6,15}(?![A-Z0-9-]))(?:[A-Z-]*\d[A-Z0-9-]*))(?![A-Z0-9-])'
    - id: Regex_insurance_membership_number
      pattern: '(?-i)(?<![A-Za-z])((?i:membership\s+(?:number|no\.?))[\s:#=-]{0,8}(?=[A-Z0-9-]{6,15}(?![A-Z0-9-]))(?:[A-Z-]*\d[A-Z0-9-]*))(?![A-Z0-9-])'
  keywords:
    - id: Keyword_health_insurance_context
      groups:
        - match_style: word
          terms:
            - health insurance
            - health plan
            - medical insurance
            - payer
            - insurer
            - explanation of benefits
            - insurance claim
            - coverage
      strength: domain
    - id: Keyword_health_fund_context
      groups:
        - match_style: word
          terms:
            - health fund
            - private health
            - health cover
            - hospital cover
            - extras cover
            - Medibank
            - Bupa
      strength: specific
    - id: Keyword_person_coverage_context
      groups:
        - match_style: word
          terms:
            - patient
            - beneficiary
            - dependent
            - member name
            - date of birth
            - treating provider
            - clinic
      strength: specific
created: '2026-06-13'
updated: '2026-11-25'
changelog:
  - version: 1.4.0
    date: '2026-11-25'
    description: State explicit regex case rule ((?i) or (?-i)) so local validation matches Purview Boost.RegEx default case-sensitivity.
  - version: 1.3.0
    date: '2026-11-17'
    description: 'Australian private health fund membership numbers: a GP network breach notice in 2026 listed private health insurance numbers, and "Membership number: ..." under "Private health insurance: ..." did not match because the label needed member/subscriber/policy + id/number. "Membership number/no" (the term Medibank, Bupa and HCF use on their own pages) is now a second primary, Regex_insurance_membership_number, with its own 65/75/85 tiers: 75 needs health-fund context only (health fund, private health, health cover, hospital cover, extras cover, Medibank, Bupa) and 85 adds the existing person-coverage context. It is deliberately not gated on the general terms (insurer, coverage, insurance claim, health plan, payer), so motoring-club, loyalty and gym membership numbers stay at 65. The original regex keeps its context groups and three tiers, with one change: its label words (member, subscriber, policy, group, enrollee, insured, then id, identifier, number, no.) now match in any case, through a scoped (?i:...) group. Purview regex is case-sensitive by default (dev-tenant test recorded in commit bc6255bc9e), so the all-lower-case label missed "Member ID: ..." and "Policy No. ...". The value class still needs upper-case letters, digits and hyphens. Added au jurisdiction, Privacy Act 1988 (Cth), fund-page references, Australian positives, and loyalty, gym and motoring-club decoys.'
  - version: 1.2.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.1.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.1.2
    date: '2026-07-19'
    description: 'Targeted finance/health blocker remediation: add a 65 discovery tier for labelled member-like values, require health-insurance context at 75 and additional person linkage at 85, with exact-tier and club-membership adversarial probes.'
  - version: 1.1.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1545 without changing detector or package metadata.'
  - version: 1.1.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
