schema: testpattern/v1
name: Unpublished thesis data
slug: global-top500-357-unpublished-thesis-data
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies pre-publication thesis manuscripts, drafts and thesis datasets - unpublished theses, thesis data/manuscripts/drafts/chapters, dissertation drafts and embargoed thesis research - when the phrase sits with populated candidate/thesis fields and draft or dataset fields.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: unpublished thesis, thesis data/dataset/manuscript/draft/chapter, dissertation draft/data/manuscript, masters/doctoral thesis, embargoed thesis or research, unpublished manuscript, thesis examination. 65 (discovery only): phrase alone. 75: phrase plus a populated candidate/thesis field (candidate name or ID, student ID, supervisor, thesis title, degree, school, faculty). 85: that field plus a populated draft/dataset field (chapter, draft version, dataset, embargo date, submission date or status, examiners, repository hold, word count) plus independent confidentiality evidence (not for circulation, confidential draft, examiner report, viva, oral defence, commercial-in-confidence, patent pending, restricted access, raw data). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:unpublished\s+(?:thesis|manuscript)|thesis\s+(?:data(?:set)?|manuscript|draft|chapter|examination)|dissertation\s+(?:draft|data|manuscript)|(?:masters|master's|doctoral|PhD)\s+thesis|embargoed\s+(?:thesis|research))\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated candidate or thesis field; 85 also needs a draft/dataset field and confidentiality evidence. Graduate-school guidance, repository pages and press releases stay at 65.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - GDPR
  - Patents Act 1990 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
    - not for circulation
    - confidential draft
    - examiner report
    - patent pending
    - restricted access
    - raw data
  proximity: 300
test_cases:
  should_match:
    - value: "PhD thesis - confidential draft, not for circulation\nCandidate: Avery Teston\nStudent ID: 40912876\nPrincipal supervisor: Prof. Jordan Staffson\nChapter: 4 - Field trial results\nDataset: trial-cohort-v7 (raw data)\nEmbargo until: 01/02/2027 (patent pending)"
      description: Populated thesis draft with candidate, draft/dataset fields and confidentiality evidence (85)
      synthetic: true
    - value: "Thesis manuscript lodged for examination\nCandidate ID: DC-118\nThesis title: Groundwater Recharge in Fractured Basalt"
      description: Thesis lodgement with labelled candidate/thesis fields only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "student grant"
      description: Generic word pair from old broad template should not match
    - value: "The finance dashboard reports preliminary quarterly revenue for three regions."
      description: Operational financial results contain no thesis-topic phrase
    - value: "Policy guidance: this procedure explains how unpublished thesis manuscripts and thesis data are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Thesis submission form\nCandidate name: ____________________\nStudent ID: ____________________\nThesis title: ____________________\nEmbargo until: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "A university press release summarizes preliminary results from a completed public opinion poll."
      description: Press release with university-adjacent vocabulary and no thesis record (no enforce tier)
    - value: "News: the graduate school will require every doctoral thesis to be deposited in the repository, with an embargoed thesis released after two years."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Common words and phrases related to unpublished thesis data appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_unpublished_thesis
      matches:
        - ref: Regex_global_top500_357_unpublished_thesis_data_candidate_fields
        - ref: Regex_global_top500_357_unpublished_thesis_data_draft_fields
        - ref: Keyword_global_top500_357_unpublished_thesis_data_confidentiality_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_357_unpublished_thesis_data_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_unpublished_thesis
      matches:
        - ref: Regex_global_top500_357_unpublished_thesis_data_candidate_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_357_unpublished_thesis_data_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_unpublished_thesis
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_unpublished_thesis
      pattern: (?i)\b(?:unpublished\s+(?:thesis|manuscript)|thesis\s+(?:data(?:set)?|manuscript|draft|chapter|examination)|dissertation\s+(?:draft|data|manuscript)|(?:masters|master's|doctoral|PhD)\s+thesis|embargoed\s+(?:thesis|research))\b
    - id: Regex_global_top500_357_unpublished_thesis_data_candidate_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|candidate(?:\s+name)?|(?:candidate|student)\s*(?:no\.?|number|ID)|(?:principal\s+)?supervisor|thesis\s+title|degree|school|faculty)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_357_unpublished_thesis_data_draft_fields
      pattern: (?i)\b(?:chapter|draft\s+version|version|dataset|embargo(?:\s+(?:date|period|until))?|submission\s+(?:date|status)|examiners?|repository\s+(?:hold|status)|word\s+count)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_357_unpublished_thesis_data_confidentiality_evidence
      groups:
        - match_style: word
          terms:
            - not for circulation
            - confidential draft
            - examiner report
            - viva
            - oral defence
            - commercial-in-confidence
            - patent pending
            - restricted access
            - raw data
      strength: specific
    - id: Keyword_global_top500_357_unpublished_thesis_data_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
risk_description: >-
  This regex identifies unpublished theses, thesis drafts, manuscripts and thesis datasets and enforces only when populated candidate or thesis fields sit nearby; phrase-only text stays at 65 discovery. A genuine record can contain participant responses, novel results, supervisor comments, and pre-publication intellectual work, enabling premature appropriation, loss of publication priority, or exposure of research subjects. Consequences are serious for the candidate, participants, and institution but normally confined to one project and still depend on the data's novelty or identifiability. Risk 8 supports SENSITIVE Personal-Privacy; PROTECTED would require critical security research, severe participant danger, or a large uniquely valuable dataset whose compromise causes significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
created: '2026-02-08'
updated: '2026-09-24'
changelog:
- version: 1.4.0
  date: '2026-09-24'
  description: "Quality pass (2026-09-24): rebuilt tiers - 75/85 were gated by field-name keywords ('candidate ID', 'supervisor') that appear in guidance and blank forms, and no positive reached 85. 75 now needs a populated candidate/thesis field and 85 needs that plus a populated draft/dataset field plus confidentiality evidence. Primary consolidated and tightened (dropped generic 'research findings', 'preliminary results', 'doctoral research'). Bare-phrase tests replaced with populated records; the press-release example moved to should_not_match; added policy, blank-form and news decoys. Regulations: removed AML/CTF Act, HRIPA, My Health Records Act, IPA, NDB and TIA Act; added Patents Act 1990 (Cth); frameworks added; references titled."
- version: 1.3.0
  date: '2026-07-17'
  description: 'Reduced-scope harden (TP-01265): the old 65 tier corroborated the full topic primary with the same-span Keyword_unpublished_thesis
    list, so "preliminary results" from a website survey enforced at 65. Keyword_unpublished_thesis is replaced by Keyword_unpublished_thesis_IndependentContext
    (candidate/student ID, thesis title, supervisor, degree, chapter, dataset, embargo date, draft version, viva, repository
    hold, submission status). Regex_unpublished_thesis is modified to the retained strong branch (unpublished thesis, thesis
    data, dissertation draft, thesis manuscript, masters thesis, embargoed research, unpublished manuscript) enforcing at
    75 with one thesis field; Regex_unpublished_thesis_ContextualBranch (preliminary results) enforces at 65 only with two
    unique thesis fields; the full topic vocabulary (including research findings and doctoral research) moves to Regex_unpublished_thesis_Topic
    as a 65 discovery_only inventory tier. Added embargoed-draft positive, press-release discovery case, and finance-dashboard
    negative.'
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1903 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical
    tier.
