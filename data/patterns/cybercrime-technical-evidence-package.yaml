schema: testpattern/v1
name: Cybercrime Technical Evidence Package
slug: cybercrime-technical-evidence-package
version: 1.4.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects cybercrime investigation technical evidence including digital forensics, malware analysis, cryptocurrency tracing, dark web investigations, and covert online personas. Disclosure enables cybercriminals to develop countermeasures.
operation: >-
  Primary: cybercrime investigation phrases (cybercrime investigation report, digital forensic analysis/examination, network intrusion investigation, malware reverse engineering, cryptocurrency tracing, dark web investigation, IP attribution report, covert online persona). 65 = phrase only (discovery). 75 = phrase plus a populated person/case field, a labelled case reference, a SHA-256 hash or a Bitcoin address. 85 = phrase plus two distinct populated fields plus independent evidence (QPS Cybercrime Squad, ACSC, malware sample, C2 server, cryptocurrency wallet, Tor hidden service ...). Threat reports, advisories, conferences and academic framing excluded.
pattern: (?i)\b(cybercrime\s+investigation\s+(?:report|evidence|file)|digital\s+forensic\s+(?:analysis|examination|report)|network\s+intrusion\s+investigation|malware\s+(?:reverse\s+engineering|analysis\s+report)|cryptocurrency\s+(?:tracing|investigation)|dark\s+web\s+investigation|IP\s+attribution\s+(?:report|analysis)|covert\s+online\s+persona)\b
confidence: medium
confidence_justification: >-
  Medium confidence: enforcement requires populated investigation fields or machine artefacts; case numbers are unpublished, so the reference is a documented label-anchored fallback.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1899 (Qld)
  - Criminal Code Act 1995 (Cth)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
corroborative_evidence:
  keywords:
    - PROTECTED
    - Law-Enforcement
    - QPS Cybercrime Squad
    - ACSC
    - Australian Cyber Security Centre
    - digital forensic
    - malware sample
    - SHA-256
    - MD5 hash
    - IP address
    - cryptocurrency wallet
    - Bitcoin address
    - Tor hidden service
    - command and control
    - C2 server
  proximity: 300
  keyword_lists:

    - law-enforcement
    - en-government-classification
customisation:
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_cybercrime_technical_evidence_package_case_reference
    mode: replace
    affects_tiers: [75]
    required_for_enforcement: false
    note: Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#case-reference-number). Earlier versions used the CYBER-YYYY-NNNN format, which does not appear in any published source.
test_cases:
  should_match:
    - value: 'PROTECTED Law-Enforcement. QPS Cybercrime Squad — Digital Forensic Analysis Report. Case number: CY2025-0234. Network intrusion investigation. Malware reverse engineering: custom Cobalt Strike variant. IP attribution traced C2 server to Eastern Europe. SHA-256: a3f2b8c9d1e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0.'
      description: QPS cybercrime forensic analysis with malware and IP attribution (reaches 75)
    - value: 'RESTRICTED. Dark web investigation — Operation SHADOWNET. Covert online persona on dark web marketplace. Cryptocurrency tracing: Bitcoin through three mixing services. ACSC coordination for takedown.'
      description: Dark web investigation with cryptocurrency tracing (65 discovery only - prose without populated record fields)
    - value: 'Cybercrime technical evidence package. Digital forensic examination of 6 seized devices. Malware analysis: custom ransomware. Cryptocurrency investigation: 47 BTC traced. Dark web investigation confirms subject on two forums.'
      description: Multi-device forensic with ransomware and crypto evidence (65 discovery only - prose without populated record fields)
    - value: "QPS Cybercrime Squad — digital forensic examination report\nSuspect: Avery Teston\nDate of birth: 04/02/1991\nCase number: CY2026-0417\nMalware sample recovered from the seized laptop; C2 server traced through a Tor hidden service."
      description: 'Populated forensic report: suspect, DOB and case number plus malware / C2 evidence (reaches 85)'
      synthetic: true
  should_not_match:
    - value: The ACSC published its annual threat report noting a 23% increase in ransomware. The report recommended multi-factor authentication.
      description: Published ACSC annual threat report
    - value: A cybersecurity conference discussed digital forensic techniques using anonymised case studies from published proceedings.
      description: Conference presentation on cybercrime techniques
    - value: A university thesis examined malware reverse engineering using publicly available samples from VirusTotal.
      description: Academic thesis on malware analysis
    - value: "Policy guidance: this procedure explains how records about Digital Forensic are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: "Digital forensic examination request\nSuspect: __________\nDate of birth: __________\nCase number: __________"
      description: Blank form / template with unfilled fields (must stay below 75)
    - value: "News: police said the network intrusion investigation into the council breach is continuing and no arrests have been made."
      description: News or training text naming the topic (must stay below 75)
false_positives:
  - description: Published cybersecurity threat reports
    mitigation: 'Negative keyword exclusion: ''annual threat report'', ''published'', ''advisory''. Require case identifiers.'
  - description: Conference presentations and training
    mitigation: 'Negative keyword exclusion: ''conference'', ''presentation'', ''training'', ''anonymised'''
  - description: Academic research on cybercrime
    mitigation: 'Negative keyword exclusion: ''academic'', ''university'', ''thesis'', ''VirusTotal'', ''publicly available'''
  - description: Non-law-enforcement IT security incidents
    mitigation: Require law enforcement classification markers or agency references
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_cybercrime_technical_evidence_package_cybercrime_terms
      matches:
        - ref: Regex_cybercrime_technical_evidence_package_record_structure
          min_count: 2
          unique_results: true
        - ref: Evidence_cybercrime_technical_evidence_package_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_cybercrime_technical_evidence_package_exclusion
    - confidence_level: 75
      id_match: Pattern_cybercrime_technical_evidence_package_cybercrime_terms
      matches:
        - type: any
          refs:
            - Regex_cybercrime_technical_evidence_package_record_structure
            - Regex_cybercrime_technical_evidence_package_case_reference
            - Pattern_cybercrime_technical_evidence_package_sha256_hash
            - Pattern_cybercrime_technical_evidence_package_bitcoin_address
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_cybercrime_technical_evidence_package_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_cybercrime_technical_evidence_package_cybercrime_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_cybercrime_technical_evidence_package_exclusion
  regexes:
    - id: Pattern_cybercrime_technical_evidence_package_cybercrime_terms
      pattern: (?i)\b(cybercrime\s+investigation|digital\s+forensic|network\s+intrusion\s+investigation|malware\s+reverse\s+engineering|cryptocurrency\s+tracing|dark\s+web\s+investigation|IP\s+attribution|covert\s+online\s+persona)\b
    - id: Pattern_cybercrime_technical_evidence_package_sha256_hash
      pattern: \b[a-fA-F0-9]{64}\b
    - id: Pattern_cybercrime_technical_evidence_package_bitcoin_address
      pattern: \b(?:1|3|bc1)[a-zA-HJ-NP-Z0-9]{25,62}\b
    - id: Regex_cybercrime_technical_evidence_package_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|defendant|accused|offender|prisoner|inmate|detainee|respondent|applicant|witness|informant|suspect|subject\s+(?:name|person)|person\s+of\s+interest|POI|victim|complainant|officer|CNI|QPRIME|(?:file|case|matter|court|reference|ref|exhibit|brief|job|incident|report|investigation|occurrence)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_cybercrime_technical_evidence_package_case_reference
      pattern: >-
        (?i)\b(?:case|file|matter|reference)\s+(?:no\.?|number|ID|#)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{3,20}\b
  keywords:
    - id: Evidence_cybercrime_technical_evidence_package_corroborative_terms
      groups:
        - match_style: word
          terms:
            - QPS Cybercrime Squad
            - ACSC
            - malware sample
            - SHA-256
            - MD5 hash
            - C2 server
            - cryptocurrency wallet
            - Bitcoin address
            - Tor hidden service
            - ransomware
      strength: specific
    - id: Filter_cybercrime_technical_evidence_package_exclusion
      groups:
        - match_style: word
          terms:
            - media release
            - published
            - annual report
            - threat report
            - advisory
            - conference
            - presentation
            - training
            - academic
            - university
            - thesis
            - VirusTotal
            - publicly available

      strength: noise
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
risk_rating: 8
risk_description: >-
  The detector identifies a cybercrime investigation evidence package containing digital-forensic findings, malware analysis, cryptocurrency tracing, dark-web activity, seized-device results, or covert online personas. Disclosure can show a suspect which infrastructure, wallets, tooling, and attribution evidence investigators have identified, enabling evidence destruction, asset movement, or technical countermeasures. Public threat reports, conference material, academic research, training, and ordinary corporate incident response are excluded, leaving a bounded law-enforcement package rather than an enterprise security platform. Risk 8 supports SENSITIVE Legal; PROTECTED would require active covert identities, critical-system exploit access, or compromise spanning multiple major operations.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
references:
  - title: Criminal Code Act 1899 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1899-009
  - title: Criminal Code Act 1995 (Cth)
    url: https://www.legislation.gov.au/C2004A04868/latest/text
created: '2026-02-20'
updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): rebuilt tiers - 75 needs a populated investigation field, a labelled case reference, a SHA-256 hash or a Bitcoin address; 85 needs two distinct record fields plus independent cyber-forensic evidence; removed the invented CYBER-YYYY-NNNN regex in favour of the case-reference-number labelled fallback (identifier-format slot); every tier now also carries the shared template-exclusion NOT gate; tests converted with an 85 positive and blank-form/news decoys; added Criminal Code Act 1995 (Cth) and references.'
  - version: 1.3.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires either independent justice record structure (Regex ..._record_structure) or one of the hand-authored corroborative terms (none of which the primary matches); 85 requires 2 distinct structure hits plus the existing hand-authored evidence. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1486 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove the dead template-exclusion declaration (Keyword_noise_exclusion) instead of wiring it — dictionary terms appear in the pattern''s own should_match values or positive vocabulary, so a NOT-gate would suppress genuine matches (no behavior change: no tier referenced it); remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
