schema: testpattern/v1
name: Azure Databricks Personal Access Token
slug: azure-databricks-personal-access-token
version: 1.5.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects Azure Databricks personal access token patterns. This pattern is based on a Microsoft Purview built-in sensitive information type. Users already running Purview may prefer to enable the
  built-in SIT directly, or use this version as a starting point for customisation.
operation: >-
  Matches Databricks personal access tokens which use the dapi prefix followed by a 32-character hexadecimal string. Corroborative evidence: 8 keywords within 300 characters. Keyword lists:
  credentials. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: \b(dapi[0-9a-f]{32})\b
confidence: high
confidence_justification: >-
  High confidence: the dapi prefix is unique to Databricks PATs and the 32-character hex suffix provides strong structural constraint. Added context gating and exclusion rules improve precision and
  reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - CIS Controls
  - ISO 27001
  - NIST CSF
  - PCI-DSS
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - Databricks
    - dapi
    - personal access token
    - PAT
    - workspace
    - databricks token
    - access token
    - bearer
  proximity: 300
  keyword_lists:
    - credentials
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: dapi00000000000000000000000000000000
      description: Databricks PAT with placeholder hex value
    - value: dapiaabbccdd11223344556677889900abcd
      description: Databricks PAT with mixed hex characters
    - value: dapi0123456789abcdef0123456789abcdef
      description: Databricks PAT with sequential hex
  should_not_match:
    - value: dapi0000
      description: Too short to be a valid Databricks PAT
    - value: databricks-token=some-other-format
      description: Non-dapi format token string
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
    - value: 'personal dapi00000000000000000000000000000000'
      description: 'A generic word from the detector name ("personal") next to a matching value is not 85 evidence; it reached 85 through the generated name-word tier'
false_positives:
  - description: Databricks documentation and tutorials showing example PAT formats.
    mitigation: Check for common placeholder hex values and documentation context.
  - description: Expired or revoked Databricks PATs that no longer grant access.
    mitigation: Token validation against the Databricks API would confirm active tokens, but detection should still flag for review.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_azure_databricks_pat
      matches:
        - ref: Keyword_azure_databricks
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_azure_databricks_pat
      pattern: \b(dapi[0-9a-f]{32})\b
  keywords:
    - id: Keyword_azure_databricks
      groups:
        - match_style: word
          terms:
            - Databricks
            - dapi
            - personal access token
            - text: PAT
              case_sensitive: true
            - workspace
            - databricks token
            - access token
            - bearer
            - Azure Databricks
            - notebook
            - cluster
            - spark
      strength: domain
risk_rating: 8
risk_description: >-
  The regex detects a Databricks personal access token with the dapi prefix followed by 32 hexadecimal characters. A live token can authenticate as its issuing user to workspace APIs, allowing access to notebooks, jobs, clusters, secrets, or data permitted to that identity. The blast radius is the user's scopes and one workspace or account context, and expiration, revocation, and role assignments materially limit actual reach. Risk 8 SENSITIVE covers serious contained workspace compromise; administrator scope, sensitive lakehouse data, or cross-workspace control would be needed for PROTECTED.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 is consistent with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, SENS_IT, and Medium
    because the token provides direct API access within its user's Databricks permissions. PROTECTED is not met because
    the detector does not establish administrator rights, active status, data sensitivity, or broad account-wide
    control.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic Medium with Medium InfoTech appropriately handles a user-scoped workspace token capable of material code
      and data access without assuming that every PAT belongs to an administrator.
references:
  - url: https://learn.microsoft.com/en-us/purview/sit-defn-azure-databricks-personal-access-token
    title: Azure Databricks personal access token entity definition - Microsoft Learn
created: '2026-02-09'
updated: '2026-10-30'
changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-20'
    description: 'Generated name-word tier removed: the 85 tier whose only evidence was the detector name split into words (Pattern_azure_databricks_personal_access_token_label_context + Keyword_azure_databricks_personal_access_token_domain_context). One generic word such as "personal" satisfied both lists, so a matching token next to it reached 85. The bare token stays at its current level; only the lift from a generic name word is removed. Name words that identify the service stay through the curated keyword. Definitions left unreferenced are removed. Added a should_not_match case with "personal" next to a valid value.'
  - version: 1.3.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1101 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 90 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
