schema: testpattern/v1
name: Card verification values
slug: global-top500-106-card-verification-values
version: 1.6.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects references to card verification values in financial and compliance documents. Commonly found in Australian regulatory filings, transaction records, and audit documentation. Phrase-level
  concept detection anchored on explicit card-verification vocabulary; it does not parse 3- or 4-digit CVV values.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters.'
pattern: (?is)\b(?:card\s+verification\s+value|card\s+security\s+code|card\s+validation)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - card verification values
    - card
    - verification
    - values
    - financial
    - accounts
    - payments
  proximity: 300
  keyword_lists:
    - corporate-finance
test_cases:
  should_match:
    - value: card verification value
      description: Primary topic phrase match
    - value: card security code
      description: Case-insensitive topic phrase match
    - value: card validation
      description: Additional topic phrase match
    - value: |-
        Card verification value: Recorded
        Payee: Avery Teston
        Account number: 12345678
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: payroll reimbursement
      description: Generic word pair from old broad template should not match
    - value: Email verification code expires in ten minutes.
      description: Generic verification-code wording demoted out of the primary - no card relation
    - value: PCI DSS cardholder policy update
      description: PCI and cardholder-data wording demoted out of the primary - corroborative evidence only
    - value: |-
        Card verification value:
        Payee:
        Account name:
        Account number:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about card verification value are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Card verification value:
        Payee: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In Australian English, standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_106_card_verification_values_populated_label
      matches:
        - ref: Regex_global_top500_106_card_verification_values_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_106_card_verification_values_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_card_verification_values
      matches:
        - ref: Evidence_card_verification_values
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_card_verification_values
  regexes:
    - id: Pattern_card_verification_values
      pattern: (?is)\b(?:card\s+verification\s+value|card\s+security\s+code|card\s+validation)\b
    - id: Regex_global_top500_106_card_verification_values_populated_label
      pattern: (?i)\b(?:\b(?:card\s+verification\s+value|card\s+security\s+code|card\s+validation)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_global_top500_106_card_verification_values_record_structure
      pattern: (?i)\b(?:payee|supplier|vendor|creditor|beneficiary|account\s+name|BSB|account\s+(?:no\.?|number)|invoice\s+(?:no\.?|number)|remittance\s+(?:no\.?|number|ref(?:erence)?)|payment\s+(?:ref(?:erence)?|date)|amount\s+paid)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_card_verification_values
      groups:
        - match_style: word
          terms:
            - text: CVV
              case_sensitive: true
            - text: CVC
              case_sensitive: true
            - text: CID
              case_sensitive: true
            - PCI DSS
            - cardholder data
            - card-not-present
      strength: specific
risk_description: >-
  The regex recognises card-verification-value, card-security-code, verification-code, and card-validation phrases with financial context rather than parsing a three- or four-digit CVV. A genuine document containing a CVV could enable card-not-present fraud when paired with a PAN, but the normal match supplies neither the code nor the card account. The affected cardholder therefore faces little direct harm from the phrase alone, and PCI guidance, forms, and payment documentation are expected benign sources. Risk 4 OFFICIAL reflects that topic-level correlation value; SENSITIVE would require an actual verification value linked to card data.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 aligns with OFFICIAL, OFFICIAL DLM, label OFFI, and the Low tier because the detector establishes
    card-security-code context but not a usable credential. SENSITIVE is not met without confirmed live values linked to
    a payment card or a record enabling direct fraud.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic handling is appropriate for contextual card-verification terminology that lacks a confirmed account,
      card number, or transaction-enabling value.
created: '2026-02-08'
updated: '2026-10-19'
changelog:
  - version: 1.6.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_106_card_verification_values_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (CVV, CVC, CID, PCI DSS, cardholder data, card-not-present); 85 requires the populated field plus a populated payee/account field (Regex_global_top500_106_card_verification_values_record_structure). Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (verification code, payment card, three-digit code). Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.5.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (SOCI Act 2018 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.5.0
    date: '2026-07-17'
    description: 'Reduced-scope alignment fix (TP-00233): narrow the primary IdMatch to explicit card-verification concepts (card verification value, card security code, card validation); generic verification-code, PCI DSS, cardholder-data, payment-card, and three-digit-code wording is demoted to corroborative evidence only, so OTP/email-verification prose can no longer satisfy enforceable tiers. Numeric 3/4-digit CVV parsing rejected for this concept SIT (a value detector would need its own retention-policy-reviewed identifier SIT). Bare CVV/CVC/CID acronyms deliberately kept out of the case-insensitive primary; they remain case-sensitive evidence.'
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 708 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-04'
    description: case/evidence metadata update
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
