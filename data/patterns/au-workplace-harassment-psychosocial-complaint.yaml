schema: testpattern/v1
name: Workplace Sexual Harassment, Bullying and Psychosocial Hazard Complaint
slug: au-workplace-harassment-psychosocial-complaint
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Complaints, reports and case records about sexual harassment, sex-based harassment, workplace bullying and psychosocial hazards that name the people involved: complainant and respondent details, incident date, location and alleged conduct, interim measures, investigation and outcome. Anchored on the Sex Discrimination Act 1984 (Cth) s 47C positive duty, the Work Health and Safety Regulation 2011 (Qld) psychosocial risk provisions (Part 3.2 Division 11) and the Managing the risk of psychosocial hazards at work Code of Practice 2022 (Qld). Overlaps global-top500-064-employee-grievance-reports and global-top500-079-workplace-investigation-files (generic phrase classifiers); this one requires populated party and incident fields.
operation: >-
  Primary: a harassment/psychosocial phrase (sexual harassment, sex-based harassment, bullying or bullying and harassment complaint/report/allegation/incident/matter, harassment complaint/report/allegation/incident, psychosocial hazard/risk/injury/incident with optional report/notification/complaint/assessment, repeated unreasonable behaviour). 75 tier requires, within 300 characters, a populated party field (complainant, respondent, alleged harasser/perpetrator, person making the complaint, reported by, affected worker/employee, subject employee, witness, with a non-placeholder value) OR a populated incident field (date of incident/conduct with a date, or location / alleged conduct / description or details of the incident with at least three words). 85 tier requires the party field AND the incident field AND a process field (interim or protective measures, investigation or complaint outcome/status/finding, outcome, finding, action taken, support offered, referred to, investigator, with a value) AND an independent corroborative term (investigation, investigator, EAP, victimisation, confidential, support person, Sex Discrimination Act, WHS, code of conduct). All enforce tiers AND NOT the shared template-exclusion dictionary and a guidance/training exclusion (this code of practice, this policy/procedure applies, fact sheet, frequently asked questions, positive duty guidelines, case study, hypothetical, training module, catchwords). 65 is discovery-only and will surface policies, the Code, AHRC guidance and aggregate psychosocial risk registers.
pattern: >-
  (?i)\b(?:sex(?:ual|[\s-]+based)\s+harassment|(?:workplace\s+)?bullying(?:\s+and\s+harassment)?\s+(?:complaint|report|allegation|incident|matter)s?|harassment\s+(?:complaint|report|allegation|incident)s?|psychosocial\s+(?:hazard|risk|injury|incident)s?(?:\s+(?:report|notification|complaint|assessment))?|repeated\s+unreasonable\s+behaviour)
confidence: medium
confidence_justification: >-
  Medium: the primary phrases are the statutory and Code of Practice terms, but they saturate policies, training and AHRC/WorkSafe guidance, so enforce tiers need populated complainant/respondent or incident fields, and 85 needs parties, incident particulars and a process field together. Complaint and case numbers are organisation-defined and are not shape-checked. Aggregate psychosocial risk registers (hazard, likelihood, controls) stay at 65 by design. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic complaint records.
jurisdictions:
  - au
regulations:
  - Sex Discrimination Act 1984 (Cth)
  - Work Health and Safety Regulation 2011 (Qld)
  - Managing the risk of psychosocial hazards at work Code of Practice 2022 (Qld)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - sexual harassment complaint
    - sex-based harassment
    - bullying complaint
    - psychosocial hazard
    - complainant
    - respondent
    - interim measures
    - investigation
  proximity: 300
test_cases:
  should_match:
    - value: "Sexual harassment complaint - confidential\nComplainant: Jordan Testwell\nRespondent: Casey Teston (Team Leader, Fleet)\nDate of incident: 03/09/2026\nLocation: Level 2 staff kitchen, Test Street depot\nInterim measures: respondent relocated to the Newstead office pending investigation"
      description: Complaint with parties, incident date and location, and interim measures (85 tier)
      synthetic: true
    - value: "Sex-based harassment report\nPerson making the complaint: Alex Testwell\nRespondent: Jamie Teston\nDate of alleged conduct: 21 August 2026\nDescription of conduct: sexist jokes aimed at female apprentices during pre-start meetings\nAction taken: no-contact direction issued; EAP support offered"
      description: Report with parties, conduct particulars and action taken (85 tier)
      synthetic: true
    - value: "Bullying complaint received\nReported by: Riley Testwell\nThe worker says the supervisor has shouted at them in three team meetings this month."
      description: Bullying complaint with a populated reporter field only (75 tier)
      synthetic: true
    - value: "Psychosocial hazard report\nAffected worker: Morgan Teston\nThe worker reports ongoing exposure to aggressive customers at the counter with no duress alarm."
      description: Psychosocial hazard report naming an affected worker (75 tier)
      synthetic: true
  should_not_match:
    - value: "The positive duty in section 47C of the Sex Discrimination Act requires employers to take reasonable and proportionate measures to eliminate sexual harassment, sex-based harassment and victimisation as far as possible."
      description: SDA s 47C guidance (65 only)
    - value: "Sexual harassment complaint form\nComplainant: ____________\nRespondent: [name]\nDate of incident: __/__/____\nDescription of conduct: <describe what happened>"
      description: Blank complaint form (65 only)
    - value: "Psychosocial risk assessment - Corporate Services\nHazard: high job demands\nLikelihood: likely\nControls: workload review and flexible work\nRisk rating: medium"
      description: Aggregate psychosocial risk register row with no person (65 only)
    - value: "Training module 3 case study: a sexual harassment complaint is lodged. Complainant: Jo Testcase. Respondent: Lee Testcase. Date of incident: 01/02/2026. Outcome: substantiated after investigation."
      description: Training case study with a fully populated fictional record (excluded)
    - value: "Sexual harassment complaints to the Commission rose 12% in 2025-26 as the positive duty took effect, the annual report shows."
      description: News / statistics (65 only)
false_positives:
  - description: Sexual harassment, bullying and psychosocial policies, the Code of Practice, AHRC positive-duty guidance and WorkSafe material.
    mitigation: Enforce tiers need a populated party or incident field; a guidance exclusion suppresses text naming this code, policy/procedure scope statements, fact sheets, FAQs and positive duty guidelines.
  - description: Training scenarios and case studies with fictional parties.
    mitigation: Case study, hypothetical and training module wording is excluded, as is the shared template-exclusion dictionary.
  - description: Psychosocial risk registers and hazard assessments that are aggregate (hazard, likelihood, controls).
    mitigation: No party or incident field, so these stay at 65. A register row that names an affected worker reaches 75, which is intended.
  - description: Published tribunal and court decisions about harassment.
    mitigation: Decisions carrying a CATCHWORDS header are excluded; decision extracts without it can reach 75.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_workplace_harassment_primary
      matches:
        - ref: Regex_au_workplace_harassment_party_field
        - ref: Regex_au_workplace_harassment_incident_field
        - ref: Regex_au_workplace_harassment_process_field
        - ref: Keyword_au_workplace_harassment_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_workplace_harassment_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_workplace_harassment_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_workplace_harassment_party_field
            - Regex_au_workplace_harassment_incident_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_workplace_harassment_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_workplace_harassment_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_workplace_harassment_primary
      pattern: >-
        (?i)\b(?:sex(?:ual|[\s-]+based)\s+harassment|(?:workplace\s+)?bullying(?:\s+and\s+harassment)?\s+(?:complaint|report|allegation|incident|matter)s?|harassment\s+(?:complaint|report|allegation|incident)s?|psychosocial\s+(?:hazard|risk|injury|incident)s?(?:\s+(?:report|notification|complaint|assessment))?|repeated\s+unreasonable\s+behaviour)
    - id: Regex_au_workplace_harassment_party_field
      pattern: >-
        (?i)\b(?:complainant|respondent|alleged\s+(?:harasser|perpetrator|offender|bully)|person\s+(?:making\s+the\s+complaint|reporting|subject\s+to\s+the\s+(?:complaint|allegation))|reported\s+by|affected\s+(?:worker|employee|person|staff\s+member)|subject\s+(?:employee|worker)|witness(?:es)?)(?:\s+(?:name|details))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_au_workplace_harassment_incident_field
      pattern: >-
        (?i)\b(?:(?:date\s+(?:and\s+time\s+)?of\s+(?:the\s+)?(?:alleged\s+)?(?:incident|conduct|behaviour|event)|incident\s+date|when\s+did\s+(?:it|the\s+incident)\s+(?:occur|happen))\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|(?:location(?:\s+of\s+(?:the\s+)?incident)?|where\s+did\s+(?:it|the\s+incident)\s+(?:occur|happen)|alleged\s+(?:conduct|behaviour)|(?:description|details)\s+of\s+(?:the\s+)?(?:alleged\s+)?(?:incident|conduct|behaviour))\s*[:\-]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9'-]{0,30}(?:[ \t,;]+[A-Za-z0-9'/().-]{1,30}){2,12})
    - id: Regex_au_workplace_harassment_process_field
      pattern: >-
        (?i)\b(?:(?:interim|protective)\s+(?:measures?|arrangements?|actions?)|(?:investigation|complaint)\s+(?:outcome|status|finding)s?|outcome|finding|action\s+taken|support\s+(?:offered|provided)|referred\s+to|investigator(?:\s+appointed)?)\s*[:\-]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z][A-Za-z'-]{1,30}(?:[ \t,;]+[A-Za-z0-9'/().-]{1,30}){0,12}
  keywords:
    - id: Keyword_au_workplace_harassment_corroborative
      groups:
        - match_style: word
          terms:
            - investigation
            - investigator
            - text: EAP
              case_sensitive: true
            - Employee Assistance Program
            - victimisation
            - confidential
            - support person
            - Sex Discrimination Act
            - text: WHS
              case_sensitive: true
            - code of conduct
            - no-contact direction
      strength: specific
    - id: Keyword_au_workplace_harassment_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this code of practice
            - this policy applies
            - this procedure applies
            - fact sheet
            - factsheet
            - frequently asked questions
            - positive duty guidelines
            - guidelines for complying with the positive duty
            - case study
            - hypothetical
            - training module
            - catchwords
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a sexual harassment, sex-based harassment, bullying or psychosocial hazard complaint or report that names the complainant, respondent or affected worker together with incident particulars. These records carry intimate conduct detail, the complainant's identity and often health impacts; disclosure can expose the complainant to victimisation, retaliation and further harm, and defames respondents where allegations are unproven. Policies, guidance, blank forms, training scenarios and aggregate risk registers are excluded from enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
