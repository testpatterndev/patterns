    url: https://www.austlii.edu.au/cgi-bin/viewdoc/au/legis/cth/consol_act/sda1984209/s47c.html
  - title: Australian Human Rights Commission - Positive duty under the Sex Discrimination Act
    url: https://humanrights.gov.au/know-your-rights/rights-of-individuals/workplace-rights/positive-duty-sex-discrimination-act
  - title: WorkSafe Queensland - Managing the risk of psychosocial hazards at work Code of Practice 2022
    url: https://www.worksafe.qld.gov.au/laws-and-compliance/codes-of-practice/managing-the-risk-of-psychosocial-hazards-at-work-code-of-practice-2022
