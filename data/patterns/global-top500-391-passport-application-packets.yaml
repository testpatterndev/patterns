schema: testpattern/v1
name: Passport application packets
slug: global-top500-391-passport-application-packets
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to passport application packets in Australian contexts. This information type is classified as personally identifiable information under the Privacy Act
  1988.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Keyword
  lists: pii-civic-credentials.
pattern: (?is)\b(passport\s+application\s+packets|travel\s+document|identity\s+document|photo\s+identification)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - passport application packets
    - passport
    - application
    - packets
    - government
    - citizen
    - services
  proximity: 300
  keyword_lists:
    - pii-civic-credentials
test_cases:
  should_match:
    - value: passport application packets
      description: Primary topic phrase match
    - value: travel document
      description: Case-insensitive topic phrase match
    - value: identity document
      description: Alternative topic phrase match
    - value: photo identification
      description: Additional topic phrase match
    - value: |-
        Passport application packets
        Name: Avery Teston
        Date of birth: 14/02/1988
        Client number: C4471820
      description: Populated person/client record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: immigration case
      description: Generic word pair from old broad template should not match
    - value: |-
        Passport application packets:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about passport application packets are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to passport application packets appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_passport_application
      matches:
        - ref: Regex_global_top500_391_passport_application_packets_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_passport_application
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_passport_application
            - Regex_global_top500_391_passport_application_packets_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_passport_application
  regexes:
    - id: Pattern_passport_application
      pattern: (?is)\b(passport\s+application\s+packets|travel\s+document|identity\s+document|photo\s+identification)\b
    - id: Regex_global_top500_391_passport_application_packets_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
  keywords:
    - id: Evidence_passport_application
      groups:
        - match_style: word
          terms:
            - DFAT
            - consular
risk_description: >-
  Despite its composite-sounding name, this Passport application packets regex matches broad phrases such as passport application packets, travel document, identity document, or photo identification. It does not require an application form, applicant, passport number, photograph, supporting certificate, or assembled packet, so ordinary guidance and document checklists can trigger it. A genuine completed packet would expose a rich identity bundle suitable for fraud and would be SENSITIVE, but that composite record is not established by the detector. Risk 5 and OFFICIAL therefore assess the normal concept hit while making confirmed populated packet contents the next-classification threshold.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 keeps PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM and Low because the regex fires on travel-document and
    photo-ID phrasing without requiring an applicant, passport number or assembled packet. SENSITIVE is not met by the
    normal hit; a confirmed populated packet with identity documents would be a fraud-ready bundle and warrant
    SENSITIVE.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low handling applies to passport and ID guidance language. A completed application packet with identity evidence
      should move to Medium Personal-Privacy handling.
references:
  - title: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)"
    url: https://www.legislation.gov.au/C2006A00169/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires an independent populated person/client field (Regex_global_top500_391_passport_application_packets_record_structure), or one remaining corroborative term (DFAT, consular); 85 requires 2 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (citizenship, biometric, nationality). Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had a rationale written for an earlier
      risk rating, a tier that did not follow its label).
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 3 verified legislation/regulator references."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 978 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
