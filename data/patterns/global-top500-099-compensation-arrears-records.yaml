schema: testpattern/v1
name: Compensation arrears records
slug: global-top500-099-compensation-arrears-records
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects compensation arrears and back-pay records for an identified employee: salary/wage arrears calculations, back-pay schedules, underpayment remediation calculations and retrospective pay increases, with arrears amounts or arrears periods.
operation: >-
  Primary: an arrears / back-pay phrase (compensation arrears, salary/wage/pay arrears, arrears payment/calculation, back pay (calculation/schedule/record/letter), underpayment remediation/rectification/calculation, wage underpayment, retrospective pay/salary increase). Generic "Fair Work", "enterprise agreement", "award rate" and "pay adjustment" were removed. 75 tier requires a populated person field (employee/staff name or number, payroll number, position number, payee) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated arrears detail (arrears, back pay, underpayment, amount owed/owing, super shortfall, interest or remediation total with a currency amount, or an arrears period date) and an independent corroborative term (remediation, interest, superannuation, award, enterprise agreement, classification, rectified, pay run). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:compensation\s+arrears(?:\s+records?)?|(?:salary|wages?|pay)\s+arrears|arrears\s+(?:payments?|calculations?|of\s+(?:salary|wages|pay))|back[\s-]pay(?:ments?)?(?:\s+(?:calculations?|schedules?|records?|letters?))?|underpayment\s+(?:remediation|rectification|calculations?)|wage\s+underpayments?|retrospective\s+(?:pay(?:\s+increases?)?|salary\s+increases?|payments?))\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Superannuation Guarantee (Administration) Act 1992 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - employment
  - pii
corroborative_evidence:
  keywords:
    - remediation
    - interest
    - superannuation
    - award
    - enterprise agreement
    - classification
    - rectified
    - pay run
  proximity: 300
test_cases:
  should_match:
    - value: "Back pay calculation - underpayment remediation\nEmployee name: Avery Teston\nClassification: Level 3\nArrears period: 01/07/2023 to 30/06/2026\nWage arrears: $8,412.55\nSuperannuation shortfall: $967.44\nInterest: $1,104.20\nRemediation payment to be made in the next pay run."
      description: "85: back-pay remediation calculation with employee, period, arrears, super shortfall and interest"
      synthetic: true
    - value: "Salary arrears - retrospective pay increase\nStaff number: 30219\nAmount owing: $1,236.00\nFor the period from 01/01/2026 to 30/06/2026 under the enterprise agreement."
      description: "85: salary arrears for a retrospective increase with staff number, amount owing and enterprise agreement"
      synthetic: true
    - value: "Compensation arrears record for employee: Jordan Staffson - calculation pending."
      description: "75: arrears record naming the employee, calculation pending"
      synthetic: true
    - value: "back pay"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "The Fair Work Ombudsman has secured $1.2 million in back pay for 300 workers, according to a media release."
      description: "Regulator news - must stay at or below 65"
    - value: "Back pay calculation\nEmployee name: __________\nArrears period: __/__/____\nWage arrears: $______"
      description: "Blank calculation template - must stay at or below 65"
    - value: "Employers who find a wage underpayment should fix it quickly and pay any back pay owed. This fact sheet explains the steps."
      description: "Guidance - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Enterprise agreement back-pay clauses and pay-rate schedules."
    mitigation: "No populated person field; they stay at 65."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_099_compensation_arrears_records_primary
      matches:
        - ref: Regex_top500_099_compensation_arrears_records_person_field
        - ref: Regex_top500_099_compensation_arrears_records_arrears_detail
        - ref: Keyword_top500_099_compensation_arrears_records_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_099_compensation_arrears_records_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_099_compensation_arrears_records_primary
      matches:
        - ref: Regex_top500_099_compensation_arrears_records_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_099_compensation_arrears_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_099_compensation_arrears_records_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_099_compensation_arrears_records_primary
      pattern: >-
        (?i)\b(?:compensation\s+arrears(?:\s+records?)?|(?:salary|wages?|pay)\s+arrears|arrears\s+(?:payments?|calculations?|of\s+(?:salary|wages|pay))|back[\s-]pay(?:ments?)?(?:\s+(?:calculations?|schedules?|records?|letters?))?|underpayment\s+(?:remediation|rectification|calculations?)|wage\s+underpayments?|retrospective\s+(?:pay(?:\s+increases?)?|salary\s+increases?|payments?))\b
    - id: Regex_top500_099_compensation_arrears_records_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_099_compensation_arrears_records_arrears_detail
      pattern: >-
        (?i)\b(?:(?:wage|salary|pay)?\s?arrears(?:\s+amount)?|back[\s-]pay(?:\s+amount)?|underpayment(?:\s+amount)?|amount\s+(?:owed|owing|underpaid|payable)|shortfall|interest|super(?:annuation)?\s+(?:shortfall|owing)|total\s+(?:arrears|back\s+pay|owing|remediation))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?|\b(?:(?:arrears|remediation|underpayment|back\s+pay)\s+period(?:\s+from)?|for\s+the\s+period\s+from)[ \t]{0,3}[:\-]?[ \t]{0,3}(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})
  keywords:
    - id: Keyword_top500_099_compensation_arrears_records_corroborative
      groups:
        - match_style: word
          terms:
            - remediation
            - interest
            - superannuation
            - award
            - enterprise agreement
            - classification
            - rectified
            - pay run
      strength: specific
    - id: Keyword_top500_099_compensation_arrears_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - has secured
            - was ordered
            - according to
            - in back pay for
            - workers were underpaid
      strength: domain
risk_description: >-
  The classifier identifies arrears or back-pay records for an identified employee (75) with arrears amounts or periods (85). These reveal individual pay, classification and employer underpayment liability, and can be evidence in wage-theft matters. News, guidance and blank templates stay at 65. Risk 4 supports OFFICIAL.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
