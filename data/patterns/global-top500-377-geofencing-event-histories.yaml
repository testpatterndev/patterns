  - version: 1.5.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs precise coordinates, a labelled geofence/zone value or a labelled device/advertising ID and 85 needs two distinct structures (header counts only toward 85) plus location-inference evidence. Removed the self-corroborating evidence group (with generic 'event', 'GPS', 'coordinates') and generic primaries (location data, proximity alert). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA, My Health Records Act and TIA Act.
  - version: 1.4.1
