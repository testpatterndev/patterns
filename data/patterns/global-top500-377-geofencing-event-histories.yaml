schema: testpattern/v1
name: Geofencing event histories
slug: global-top500-377-geofencing-event-histories
version: 1.5.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects geofencing event histories: a geofence event / location history log phrase combined with populated location data - precise coordinate pairs, labelled geofence/zone values or labelled device/advertising identifiers. Phrase-only mentions (developer guides, app permissions) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: geofence/geofencing events/history/logs/triggers/breaches/entries/exits/alerts, location history/tracking logs/data/export, boundary trigger(s). 65 (discovery only): primary alone. 75: primary plus one populated structure - a precise latitude/longitude pair (4+ decimal places), a labelled geofence/zone/dwell-time value, or a labelled device/user/advertising/member/customer/vehicle ID or IDFA/GAID/MAID. 85: primary plus two distinct structures (the three above or a delimited column header pairing a device/user/advertising ID column with latitude, longitude, geofence, event type or dwell columns) plus location-inference evidence (dwell time, home/work location, overnight, visit frequency, clinic, place of worship, precise location, background location, repeated visits). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: (?i)\b(?:geofenc(?:e|ing)\s+(?:events?|histor(?:y|ies)|logs?|triggers?|breach(?:es)?|entr(?:y|ies)|exits?|alerts?)|location\s+(?:history|tracking)\s+(?:logs?|data|exports?)|boundary\s+triggers?)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated location data (precise coordinates, labelled geofence values or device identifiers) beside the geofence phrase; developer documentation and app-permission notices stay at 65, as do header-only exports. 'location data' and 'proximity alert' were removed from the primary as too generic. Medium because fleet telematics logs share the structure.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - dwell time
    - home location
    - work location
    - overnight
    - visit frequency
    - clinic
    - place of worship
    - precise location
    - background location
    - repeated visits
  proximity: 300
test_cases:
  should_match:
    - value: "Geofence event log - device export\ndevice_id,geofence_id,event_type,timestamp,lat,lon,dwell_mins\nd-99f3a1c7,GF-CLINIC-014,enter,2026-09-12T08:02:11+10:00,-27.46981,153.02512,47\nd-99f3a1c7,GF-HOME-001,exit,2026-09-12T07:41:03+10:00,-27.39214,153.00188,0\nHome location and overnight dwell time inferred from repeated visits."
      description: Event log - header, coordinates and location-inference evidence (85)
      synthetic: true
    - value: "Geofence breach alert\nDevice ID: d-99f3a1c7\nForwarded to the fleet supervisor."
      description: Single labelled device identifier (75)
      synthetic: true
  should_not_match:
    - value: "Developer guide: create a geofence around each store and log geofence events when a customer enters or exits. Only request background location with consent."
      description: Developer documentation
      synthetic: true
    - value: "Geofence events\ndevice_id,geofence_id,event_type,timestamp,lat,lon\n"
      description: Blank export - column header only (65)
      synthetic: true
    - value: "Police obtained geofence logs covering phones near the protest, a news report said."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing geofencing and location tracking.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of geofencing and location tracking.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
  - description: Fleet and asset telematics logs.
    mitigation: They can reach 75/85 with coordinates and device IDs; vehicle location tied to a driver is still personal information.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_geofencing_event_histories
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_377_geofencing_event_histories_column_header
            - Regex_global_top500_377_geofencing_event_histories_labelled_value
            - Regex_global_top500_377_geofencing_event_histories_identifier
            - Regex_global_top500_377_geofencing_event_histories_coordinates
        - ref: Keyword_global_top500_377_geofencing_event_histories_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_377_geofencing_event_histories_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_geofencing_event_histories
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_377_geofencing_event_histories_labelled_value
            - Regex_global_top500_377_geofencing_event_histories_identifier
            - Regex_global_top500_377_geofencing_event_histories_coordinates
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_377_geofencing_event_histories_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_geofencing_event_histories
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_geofencing_event_histories
      pattern: (?i)\b(?:geofenc(?:e|ing)\s+(?:events?|histor(?:y|ies)|logs?|triggers?|breach(?:es)?|entr(?:y|ies)|exits?|alerts?)|location\s+(?:history|tracking)\s+(?:logs?|data|exports?)|boundary\s+triggers?)\b
    - id: Regex_global_top500_377_geofencing_event_histories_column_header
      pattern: (?i)\b(?:(?:device|user|advertising|member|customer|vehicle|asset)[ _]?(?:id|key)|maid|idfa|gaid\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:lat(?:itude)?|lon(?:gitude)?|lng|geofence[ _]?(?:id|name)|event[ _]?type|dwell(?:[ _]?(?:time|secs|mins))?|accuracy)|(?:lat(?:itude)?|lon(?:gitude)?|lng|geofence[ _]?(?:id|name)|event[ _]?type|dwell(?:[ _]?(?:time|secs|mins))?|accuracy)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:device|user|advertising|member|customer|vehicle|asset)[ _]?(?:id|key)|maid|idfa|gaid)\b
    - id: Regex_global_top500_377_geofencing_event_histories_labelled_value
      pattern: (?i)\b(?:geofence(?:\s+(?:ID|name))?|zone|dwell\s+time)[ \t]{0,3}[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9 &'/-]{2,40}
    - id: Regex_global_top500_377_geofencing_event_histories_identifier
      pattern: (?i)\b(?:(?:device|user|advertising|member|customer|vehicle)\s*ID|IDFA|GAID|MAID)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Za-z-]{0,8}\d)[A-Za-z0-9][A-Za-z0-9._@-]{3,64}
    - id: Regex_global_top500_377_geofencing_event_histories_coordinates
      pattern: -?\d{1,2}\.\d{4,8}[ \t]{0,2}[,;/][ \t]{0,2}-?\d{1,3}\.\d{4,8}\b
  keywords:
    - id: Keyword_global_top500_377_geofencing_event_histories_domain_evidence
      groups:
        - match_style: word
          terms:
            - dwell time
            - home location
            - work location
            - overnight
            - visit frequency
            - clinic
            - place of worship
            - precise location
            - background location
            - repeated visits
      strength: domain
    - id: Keyword_global_top500_377_geofencing_event_histories_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - developer guide
            - create a geofence
            - geofence warrants
      strength: noise
risk_description: >-
  This concept regex identifies geofencing event histories, location tracking, proximity alerts, and boundary-trigger records rather than an isolated place name. A populated history can reconstruct where a person or device entered or left defined areas and when, enabling surveillance, stalking, workplace monitoring abuse, or inference of sensitive routines. The affected unit is normally one subject or device over multiple events, while product documentation and generic location-policy text can also match. Risk 8 SENSITIVE Personal-Privacy reflects serious movement and safety harm; PROTECTED is not met without protected-person movements, active operations, bulk population tracking, or significant life-safety consequences. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the Personal-Privacy DLM, and Medium for a linked
    location-event history. PROTECTED is not met because the normal record does not establish high-value target
    surveillance, population scale, or significant operational and safety damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy DLM reflect serious stalking and inference risk from linked geofence events at
      bounded subject and time scale.
