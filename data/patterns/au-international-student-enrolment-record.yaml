{
  "schema": "testpattern/v1",
  "name": "International Student CoE and Enrolment Variation Record",
  "slug": "au-international-student-enrolment-record",
  "version": "1.0.3",
  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated international student coe and enrolment variation record using record context and corroborating fields.",
  "pattern": "(?i)(?:confirmation of enrolment|CoE record|PRISMS student course variation)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
  "regulations": [
    "Education Services for Overseas Students Act 2000 (Cth)",
    "Privacy Act 1988 (Cth)",
    "Information Privacy Act 2009 (Qld)"
  ],
  "frameworks": [
    "ISO 27001",
    "ISO 27701"
  ],
  "data_categories": [
    "education",
    "pii"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated international student coe and enrolment variation record can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://www.education.gov.au/esos-framework/frequently-asked-questions"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE Personal-Privacy"
  },
  "classification": {
    "tier": "Medium",
    "rationale": "Populated international student coe and enrolment variation record maps to SENSITIVE Personal-Privacy. The classifier requires record context and corroborating fields. The mapping does not determine the risk of every matched document.",
    "generic": {
      "classification": "Medium",
      "dlm": "Medium Personal-Privacy",
      "rationale": "Medium Personal-Privacy handling applies to the populated record. Synthetic checks establish local matching behavior, not tenant detection accuracy."
    }
  },
  "package_tags": {
    "primary_component": "student-child-records",
    "components": [
      "student-child-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "privacy"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          },
          {
            "ref": "Regex_4"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:confirmation of enrolment|CoE record|PRISMS student course variation)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:CoE code|confirmation code)[ \\t]*:[ \\t]*[A-Z0-9]{6,16}\\b"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:course|provider)[ \\t]*:[ \\t]*[A-Z][A-Z0-9 .'-]{3,90}"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)(?:course start date|variation date|enrolment date)[ \\t]*:[ \\t]*(?:\\d{4}-\\d{2}-\\d{2}|\\d{1,2}/\\d{1,2}/\\d{4})"
      },
      {
        "id": "Regex_4",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      }
    ]
  },
  "test_cases": {
    "should_match": [
      {
