schema: testpattern/v1
name: Browsing behavior logs
slug: global-top500-364-browsing-behavior-logs
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects browsing behaviour logs and clickstream exports: a browsing history / clickstream / web analytics log phrase combined with populated log structure - URLs carrying a user or session identifier, web access log lines, or labelled visitor/session/device identifiers. Phrase-only mentions (privacy notices, cookie banners) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: browsing behaviour/history (logs), clickstream (data/logs/export), page-view logs, web analytics export/logs/data, session replay, visitor logs, user activity logs. 65 (discovery only): primary alone. 75: primary plus one populated structure - a labelled visitor/user/session/cookie/client/device ID, a URL whose query string carries a user/session/client/email/click identifier, or a web server access-log line (IP, user, timestamp). 85: primary plus two distinct structures (the three above or a delimited column header pairing a session/visitor/user ID column with URL, referrer, user agent, event, timestamp or dwell-time columns) plus web-analytics evidence (page view, dwell time, referrer, user agent, scroll depth, bounce, add to cart, search query, utm_source, session duration, fingerprint). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: >-
  (?i)\b(?:browsing\s+(?:behaviou?r|history)(?:\s+logs?)?|clickstream(?:\s+(?:data|logs?|exports?))?|page[\s-]?view\s+logs?|web\s+analytics\s+(?:exports?|logs?|data)|session\s+replays?|visitor\s+logs?|user\s+activity\s+logs?)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated log structure (identifier-bearing URLs, access-log lines, labelled visitor/session IDs) beside the log phrase; privacy notices and cookie banners name the same data without values and stay at 65, as do header-only exports. Medium because anonymised aggregate analytics exports can still carry session IDs.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - page view
    - dwell time
    - referrer
    - user agent
    - scroll depth
    - bounce
    - add to cart
    - search query
    - utm_source
    - session duration
  proximity: 300
test_cases:
  should_match:
    - value: "Clickstream export 2026-09-01 (web analytics)\nsession_id,visitor_id,timestamp,page_url,referrer,dwell_time\ns-8841,v-2204471,2026-09-01T08:14:02Z,/health/ivf-clinic-costs,google,94\nhttps://shop.harbourretail.com.au/checkout?step=2&uid=2204471 add to cart; user agent Mozilla/5.0; session duration 11 min"
      description: Clickstream export - header, identifier-bearing URL and analytics evidence (85)
      synthetic: true
    - value: "Web analytics logs\n203.0.113.45 - avery.t [12/Aug/2026:08:14:02 +1000] \"GET /account/statements HTTP/1.1\" 200 5120"
      description: Access-log line with a user field (75)
      synthetic: true
    - value: "Browsing history log\nVisitor ID: v-2204471\nRetained for 90 days."
      description: Single labelled visitor identifier (75)
      synthetic: true
  should_not_match:
    - value: "Privacy policy: we collect browsing behaviour such as page views, referrer and user agent through first party cookies. You can clear your browsing history at any time."
      description: Privacy notice describing collection
      synthetic: true
    - value: "Clickstream export\nsession_id,visitor_id,timestamp,page_url,referrer\n"
      description: Blank export - column header only (65)
      synthetic: true
    - value: "Regulators are examining how apps share browsing history with advertisers, a news report said."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing browsing and clickstream data.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of browsing and clickstream data.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_browsing_behavior_logs
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_364_browsing_behavior_logs_column_header
            - Regex_global_top500_364_browsing_behavior_logs_identifier
            - Regex_global_top500_364_browsing_behavior_logs_tracked_url
            - Regex_global_top500_364_browsing_behavior_logs_access_log_line
        - ref: Keyword_global_top500_364_browsing_behavior_logs_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_364_browsing_behavior_logs_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_browsing_behavior_logs
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_364_browsing_behavior_logs_identifier
            - Regex_global_top500_364_browsing_behavior_logs_tracked_url
            - Regex_global_top500_364_browsing_behavior_logs_access_log_line
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_364_browsing_behavior_logs_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_browsing_behavior_logs
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_browsing_behavior_logs
      pattern: (?i)\b(?:browsing\s+(?:behaviou?r|history)(?:\s+logs?)?|clickstream(?:\s+(?:data|logs?|exports?))?|page[\s-]?view\s+logs?|web\s+analytics\s+(?:exports?|logs?|data)|session\s+replays?|visitor\s+logs?|user\s+activity\s+logs?)\b
    - id: Regex_global_top500_364_browsing_behavior_logs_column_header
      pattern: (?i)\b(?:(?:session|visitor|user|cookie|client|device|anonymous|customer)[ _]?(?:id|key|hash)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:page[ _]?url|url|referr?er|user[ _]?agent|page[ _]?title|event[ _]?(?:name|type)|timestamp|dwell[ _]?time|ip[ _]?address|utm[ _]?source)|(?:page[ _]?url|url|referr?er|user[ _]?agent|page[ _]?title|event[ _]?(?:name|type)|timestamp|dwell[ _]?time|ip[ _]?address|utm[ _]?source)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:session|visitor|user|cookie|client|device|anonymous|customer)[ _]?(?:id|key|hash))\b
    - id: Regex_global_top500_364_browsing_behavior_logs_identifier
      pattern: (?i)\b(?:(?:visitor|user|session|cookie|client|device|GA\s+client)\s*ID)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Za-z-]{0,8}\d)[A-Za-z0-9][A-Za-z0-9._@-]{3,64}
    - id: Regex_global_top500_364_browsing_behavior_logs_tracked_url
      pattern: (?i)\bhttps?://[a-z0-9.-]{3,80}/[^\s,\"<>]{0,160}[?&](?:uid|user_?id|sid|session_?id|cid|client_?id|email|visitor_?id|fbclid|gclid)=[A-Za-z0-9%._@-]{3,64}
    - id: Regex_global_top500_364_browsing_behavior_logs_access_log_line
      pattern: \b\d{1,3}(?:\.\d{1,3}){3}[ \t]{1,3}-[ \t]{1,3}[^\s\[]{1,40}[ \t]{1,3}\[\d{2}/[A-Za-z]{3}/\d{4}:\d{2}:\d{2}:\d{2}
  keywords:
    - id: Keyword_global_top500_364_browsing_behavior_logs_domain_evidence
      groups:
        - match_style: word
          terms:
            - page view
            - dwell time
            - referrer
            - user agent
            - scroll depth
            - bounce
            - add to cart
            - search query
            - utm_source
            - session duration
            - first party cookie
            - fingerprint
      strength: domain
    - id: Keyword_global_top500_364_browsing_behavior_logs_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - privacy policy
            - clear your browsing history
            - developer guide
      strength: noise
risk_description: >-
  The concept detector targets browsing behaviour, page views, sessions, clickstream, and web-activity logs, with the intended unit being a user-linked behavioural log rather than a public webpage reference. A genuine log can reveal interests, health or financial concerns, work activity, device identifiers, timing, and navigation paths, enabling surveillance, manipulation, credential-focused phishing, or discriminatory profiling of the linked customer or employee. The medium-confidence regex may also find analytics documentation and aggregate website reports without identifiable events. Risk 8 and SENSITIVE Personal-Privacy reflect serious longitudinal monitoring harm; PROTECTED would require security tokens, protected persons, or population-scale identifiable surveillance capable of significant damage. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the Personal-Privacy DLM, and Medium for a linked
    browsing history. PROTECTED is not met because a normal match does not prove bulk surveillance, highly sensitive
    target tracking, privileged access, or significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy DLM reflect the inferential and targeting value of genuine browsing history at
      bounded user and time scale.
created: '2026-02-08'
updated: '2026-09-25'
changelog:
  - version: 1.4.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs an identifier-bearing URL, an access-log line or a labelled visitor/session ID and 85 needs two distinct structures (header counts only toward 85) plus web-analytics evidence. Removed the self-corroborating evidence group and generic primaries (page views, session data, cookie data, user agent, referral URL, tracking pixel, digital fingerprint). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA, My Health Records Act and TIA Act.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 951 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
