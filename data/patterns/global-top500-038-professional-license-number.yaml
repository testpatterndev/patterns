schema: testpattern/v1
name: Professional license number
slug: global-top500-038-professional-license-number
version: 1.6.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to professional license number in Australian contexts. This information type is classified as personally identifiable information under the Privacy Act
  1988.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters. Keyword
  lists: au-vehicle-permit-terms. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?i)\b(professional\s+licen[cs]e\s+numbers?|practitioner\s+registration\s+numbers?|accreditation\s+numbers?|board\s+registration\s+numbers?|trade\s+licen[cs]e\s+numbers?|occupational\s+licen[cs]e\s+numbers?)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - professional license number
    - professional
    - license
    - number
    - government
    - ids
    - civil
    - status
  proximity: 300
  keyword_lists:
    - au-vehicle-permit-terms
    - generic-data-labels
    - data-record-context
test_cases:
  should_match:
    - value: 'Professional license number'
      description: Topic phrase present
    - value: 'professional license number'
      description: Topic phrase, lowercase
    - value: 'this record references the professional license number held on file'
      description: Topic phrase within surrounding text
    - value: AHPRA practitioner registration number is recorded.
      description: Specific regulator and practitioner label align (authored phrase variant)
    - value: Onboarding form asks for professional licence number.
      description: AU licence spelling — phrase references are valid concept hits
    - value: |-
        Professional licence number: Recorded
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match phrase marker
    - value: generic narrative without identifier/document anchors
      description: Should not match plain mention
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
    - value: Vehicle registration number is 123ABC.
      description: Unrelated registration must not classify — generic registration number is not a primary
    - value: Medical board meeting minutes.
      description: Regulator topic without number language is insufficient
    - value: |-
        Professional licence number:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about professional licence number are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Professional licence number:
        Name: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Common words and phrases related to professional license number appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_038_professional_license_number_populated_label
      matches:
        - ref: Regex_global_top500_038_professional_license_number_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_038_professional_license_number_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_professional_license
      matches:
        - ref: Evidence_professional_license
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_professional_license
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
  regexes:
    - id: Regex_global_top500_038_professional_license_number_populated_label
      pattern: (?i)\b((?:\b(?:professional\s+licen[cs]e\s+numbers?|practitioner\s+registration\s+numbers?|accreditation\s+numbers?|board\s+registration\s+numbers?|trade\s+licen[cs]e\s+numbers?|occupational\s+licen[cs]e\s+numbers?)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Regex_global_top500_038_professional_license_number_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Pattern_professional_license
      pattern: (?i)\b(professional\s+licen[cs]e\s+numbers?|practitioner\s+registration\s+numbers?|accreditation\s+numbers?|board\s+registration\s+numbers?|trade\s+licen[cs]e\s+numbers?|occupational\s+licen[cs]e\s+numbers?)\b
    - id: Pattern_au_top500_038_professional_license_number_label_context
      pattern: (?i)\b(professional\s+license\s+number)\b
  keywords:
    - id: Evidence_professional_license
      groups:
        - match_style: word
          terms:
            - AHPRA
            - licence holder
            - practitioner ID
            - professional registration
            - certified practitioner
    - id: Keyword_au_top500_038_professional_license_number_domain_context
      groups:
        - match_style: word
          terms:
            - professional license number
            - professional
            - license
risk_description: >-
  This Professional license number pattern matches the field phrase or text saying that such a number is held on file. It does not validate a registration format, identify the licensed practitioner, or disclose discipline, status, or regulator details. A real number linked to a professional could support impersonation or unauthorised profile lookup, yet templates and licensing instructions can trigger this concept detector without any value. Risk 5 and OFFICIAL capture the regulated-credential cue, while a populated person-linked licence record marks the threshold for SENSITIVE handling.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to OFFICIAL and Low tiers because professional-licence-number wording exposes no validated credential,
    practitioner, regulator, or status. SENSITIVE is not met without a populated identifier linked to a person and
    substantive professional or disciplinary information.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      A global professional-licence label is generically Low with Low DLM because it names a regulated field without
      revealing its holder or value.
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.6.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.5.0
    date: '2026-10-20'
    description: 'Self-corroboration fix (PR #69 shape; this pattern was missed by #69): the evidence lists held the IdMatch phrase or phrases inside it (professional license number, professional licence, practitioner registration, registration number, accreditation number, trade licence, occupational licence; generic-data-labels, which holds number labels such as registration/file/identification number). Purview counts a supporting match that equals or sits inside the IdMatch span (dev-tenant tests 2026-10-16 and 2026-10-19), so a bare heading reached an enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_038_professional_license_number_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (Evidence_professional_license); 85 requires the populated field plus a populated person/client field (Regex_global_top500_038_professional_license_number_record_structure). The record-structure field omits licence so it cannot match inside the populated field. Phrase-only matches stay at 65 discovery. Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.4.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 3 verified legislation/regulator references."
  - version: 1.4.0
    date: '2026-07-17'
    description: 'TP-00167 approved reduced scope: expand the primary phrase set (top-level and Pattern_professional_license) to bounded source-authored number phrases only — professional licence/license number(s), practitioner registration number(s), accreditation number(s), board registration number(s), trade licence number(s), occupational licence number(s). Generic registration number deliberately stays out of the primary (remains evidence-only in Evidence_professional_license, needing independent profession/regulator context); the universal cross-profession value parser is rejected (no per-profession syntax defined) and concept-level risk wording retained. Added AHPRA and AU-spelling positives plus vehicle-registration and board-minutes negatives.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 642 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
