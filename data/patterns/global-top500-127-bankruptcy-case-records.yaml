schema: testpattern/v1
name: Bankruptcy case records
slug: global-top500-127-bankruptcy-case-records
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: Detects references to bankruptcy case records in financial and compliance documents. Commonly found in Australian regulatory filings, transaction records, and audit documentation.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters.'
pattern: >-
  (?is)\b(?:bankruptcy\s+case|bankrupt\s+estate|official\s+trustee|debt\s+agreement|personal\s+insolvency|sequestration\s+order|National\s+Personal\s+Insolvency\s+Index|creditor\s+petition|discharge\s+from\s+bankruptcy)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - bankruptcy case records
    - bankruptcy
    - case
    - records
    - credit
    - lending
    - insurance
  proximity: 300
  keyword_lists:
    - corporate-finance
test_cases:
  should_match:
    - value: bankruptcy case
      description: Primary topic phrase match
    - value: bankrupt estate
      description: Case-insensitive topic phrase match
    - value: official trustee
      description: Alternative topic phrase match
    - value: debt agreement
      description: Additional topic phrase match
    - value: |-
        Bankruptcy case
        Name: Avery Teston
        Date of birth: 14/02/1988
        Client number: C4471820
      description: Populated person/client record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: credit premium
      description: Generic word pair from old broad template should not match
    - value: |-
        Bankruptcy case:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about bankruptcy case are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In Australian English, standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_bankruptcy_records
      matches:
        - ref: Regex_global_top500_127_bankruptcy_case_records_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_bankruptcy_records
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_bankruptcy_records
            - Regex_global_top500_127_bankruptcy_case_records_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_bankruptcy_records
  regexes:
    - id: Pattern_bankruptcy_records
      pattern: >-
        (?is)\b(?:bankruptcy\s+case|bankrupt\s+estate|official\s+trustee|debt\s+agreement|personal\s+insolvency|sequestration\s+order|National\s+Personal\s+Insolvency\s+Index|creditor\s+petition|discharge\s+from\s+bankruptcy)\b
    - id: Regex_global_top500_127_bankruptcy_case_records_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_bankruptcy_records
      groups:
        - match_style: word
          terms:
            - AFSA
risk_description: >-
  This detector finds bankruptcy case records involving a bankrupt estate, official trustee, or debt agreement. Although some case facts may be public, a working file can reveal detailed debts, assets, creditor interactions, and administration notes not available in a simple register entry. Disclosure can expose the debtor to stigma, targeting, or interference with the estate, with impact usually limited to the proceeding and its participants. Risk 7 and SENSITIVE remain defensible; a public notice alone would be lower, while a bulk insolvency archive with identity evidence would be higher.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Financial because a genuine bankruptcy
    record aggregates consequential debt and proceeding information about a debtor. PROTECTED is not met because
    ordinary case material is bounded and may include public facts rather than protected or high-impact content.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Medium generic classification and Medium Financial DLM fit a debtor case record that can cause moderate financial
      and reputational harm despite partial public availability.
references:
  - title: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)"
    url: https://www.legislation.gov.au/C2006A00169/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
