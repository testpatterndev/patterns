schema: testpattern/v1
name: Dynamic testing findings
slug: global-top500-250-dynamic-testing-findings
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies dynamic application security testing (DAST) findings and scanner reports - OWASP ZAP, Burp Suite, Acunetix/Invicti, AppScan, WebInspect - with tested endpoints, parameters/payloads and alert IDs. Penetration test reports are covered by global-top500-252-penetration-testing-reports.
operation: >-
  Regex_dynamic_testing_findings (DAST findings/report/results/scan, dynamic application security testing findings/report, dynamic application/security scan report, ZAP scan/report/alerts/baseline, Burp scan/report/issues, named DAST tool scan/report, web application (vulnerability) scan report) is discovery-only at 65. 75 requires one structure: a tested endpoint (HTTP method + path or URL on an internal host), a labelled parameter/payload/evidence value, or an alert reference (CWE, plugin/alert ID, HTTP status line). 85 requires two distinct structures plus a web weakness class. Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: (?i)\b(?:DAST\s+(?:findings?|report|results|scan)|dynamic\s+application\s+security\s+test(?:ing)?\s+(?:findings?|report|results)|dynamic\s+(?:application|security)\s+scan\s+(?:findings?|report|results)|(?:OWASP\s+)?ZAP\s+(?:scan|report|alerts?|baseline)|Burp\s+(?:Suite\s+)?(?:scan|report|issues?|findings)|(?:Acunetix|Invicti|Netsparker|AppScan|WebInspect)\s+(?:scan|report|findings)|web\s+application\s+(?:vulnerability\s+)?scan\s+(?:report|results|findings))\b
confidence: medium
confidence_justification: >-
  Medium confidence: tool/report wording is discovery-only; enforcement requires endpoint, parameter or alert structure, and 85 adds a second structure and a weakness class.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
  - CIS Controls
data_categories:
  - security
  - technology
corroborative_evidence:
  keywords:
    - cross-site scripting
    - SQL injection
    - reflected
    - open redirect
    - session fixation
  proximity: 300
test_cases:
  should_match:
    - value: |-
        OWASP ZAP scan report - permits.example.internal (authenticated scan, 18/09/2026)
        Alert: Cross Site Scripting (Reflected)  Risk: High  Plugin ID: 40012  CWE-79
        URL: https://permits.example.internal/search?q=test
        Parameter: q
        Evidence: response reflects the q value unencoded in the results heading.
      description: High tier (85) - endpoint, parameter/evidence and plugin/CWE IDs with a reflected XSS weakness
      synthetic: true
    - value: 'Burp Suite scan results for the booking portal: POST /api/v2/bookings/cancel accepted a booking number owned by another account.'
      description: Medium tier (75) - tested endpoint only
      synthetic: true
    - value: 'DAST findings for the library catalogue - Plugin ID: 10038 raised on every page.'
      description: Medium tier (75) - alert reference only
      synthetic: true
    - value: The DAST findings from last week are still being triaged.
      description: Discovery tier (65) - report wording only
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: The penetration test report is due next week.
      description: Penetration testing is handled by a separate classifier
    - value: 'Guidance note: agencies should run a DAST scan before each release and fix high-risk alerts.'
      description: Guidance text
    - value: |-
        DAST report template
        URL: ______
        Parameter: ______
        Plugin ID: ______
      description: Blank template
    - value: 'Media release: the vendor says its new dynamic application security testing report finds cross-site scripting faster.'
      description: News framing
false_positives:
  - description: Scanner documentation and training labs show example alerts, endpoints and payloads.
    mitigation: Tool wording is discovery-only; enforcement needs finding structure, and guidance/training/demo/template framing is excluded.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_dynamic_testing_findings
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_tested_endpoint
            - Evidence_parameter_payload
            - Evidence_alert_reference
        - ref: Keyword_web_weakness
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_dynamic_testing_findings
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_tested_endpoint
            - Evidence_parameter_payload
            - Evidence_alert_reference
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_dynamic_testing_findings
  regexes:
    - id: Regex_dynamic_testing_findings
      pattern: (?i)\b(?:DAST\s+(?:findings?|report|results|scan)|dynamic\s+application\s+security\s+test(?:ing)?\s+(?:findings?|report|results)|dynamic\s+(?:application|security)\s+scan\s+(?:findings?|report|results)|(?:OWASP\s+)?ZAP\s+(?:scan|report|alerts?|baseline)|Burp\s+(?:Suite\s+)?(?:scan|report|issues?|findings)|(?:Acunetix|Invicti|Netsparker|AppScan|WebInspect)\s+(?:scan|report|findings)|web\s+application\s+(?:vulnerability\s+)?scan\s+(?:report|results|findings))\b
    - id: Evidence_tested_endpoint
      pattern: \b(?:GET|POST|PUT|DELETE|PATCH)\s+/[\w./?=&%-]{0,200}|\bhttps?://[a-z0-9.-]{1,100}\.(?:internal|corp|local|lan|test)(?::\d{2,5})?/[\w./?=&%-]{0,200}
    - id: Evidence_parameter_payload
      pattern: (?i)\b(?:(?:affected\s+)?param(?:eter)?|payload|attack|evidence|input\s+vector)\s*[:#=|]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[\w'\"=()./;:%-]{1,80}
    - id: Evidence_alert_reference
      pattern: (?i)\bCWE-\d{1,4}\b|\b(?:plugin|alert|rule)\s{0,3}(?:ID)?\s{0,3}[:#]\s{0,3}\d{3,6}\b|\bHTTP/[12](?:\.[01])?\s{1,3}[1-5]\d{2}\b
  keywords:
    - id: Keyword_web_weakness
      groups:
        - match_style: word
          terms:
            - SQL injection
            - cross-site scripting
            - cross site scripting
            - text: XSS
              case_sensitive: true
            - path traversal
            - command injection
            - insecure deserialization
            - hard-coded credential
            - hardcoded credential
            - server-side request forgery
            - text: SSRF
              case_sensitive: true
            - text: IDOR
              case_sensitive: true
            - open redirect
            - broken access control
            - remote code execution
            - privilege escalation
            - account takeover
            - authentication bypass
            - reflected
            - session fixation
            - missing security header
            - clickjacking
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
risk_description: >-
  The detector identifies DAST findings when tested endpoints, parameters/payloads or alert references are present; scanner wording alone is discovery-only. A substantive finding can reveal reachable attack paths, vulnerable endpoints, reproduction conditions, and incomplete remediation that an adversary could reuse. General testing plans, vendor descriptions, and closed findings can match, and the normal unit is one application or result set. Risk 7 SENSITIVE reflects credible moderate harm from current dynamic-test findings; PROTECTED would require a critical exploit path or significant operational consequence demonstrated beyond the phrase match.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps consistently to OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, SENS_IT, and Medium because
    genuine DAST findings can provide actionable vulnerability intelligence. The detector cannot establish finding
    severity, current exploitability, target criticality, or PROTECTED-level damage.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic Medium with Medium InfoTech appropriately covers non-public runtime security findings whose disclosure can
      materially aid attackers. Generic High needs proof of a critical active weakness or broad consequential exposure,
      which the concept detector lacks.
created: '2026-02-08'
updated: '2026-09-25'
changelog:
  - version: 1.3.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): primary narrowed to DAST findings/report wording and named DAST scanners (removed penetration test, security testing, application testing, runtime analysis and fuzz testing - penetration testing is covered by global-top500-252); 75 requires a tested endpoint, parameter/payload/evidence field or alert reference and 85 requires two distinct structures plus a web weakness class (replaces self-corroborating topic keyword list and label-context regex); guidance/news/training exclusion added; bare-phrase tests replaced with synthetic scanner output and decoys. Replaced GDPR with Criminal Code Act 1995 (Cth); added ISO 27001/NIST CSF/CIS Controls frameworks and verified NIST SP 800-115 / 800-218 and ISM references; data_categories credentials -> technology.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1809 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
