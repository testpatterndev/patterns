schema: testpattern/v1
name: Queensland Contaminated Land Site Investigation or Management Record
slug: au-qld-contaminated-land-site-investigation
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Unpublished contaminated land records under the Environmental Protection Act 1994 (Qld) chapter 7 part 8: site investigation reports and validation reports (s 381), site management plans (s 383), site suitability statements, auditor reports, and working papers about land on the environmental management register (EMR, s 371 - a notifiable activity has been carried out, or the land is contaminated) or the contaminated land register (CLR, s 372). Notifiable activities include Schedule 3 item 8 (operating a coal fired power station) and item 13 (manufacturing, repairing or disposing of electrical transformers). The target is a document for a real site with filled lot on plan / site / contaminant fields and sampling or laboratory content, such as soil and groundwater results in mg/kg or ug/L. Bare EMR/CLR search extracts are fee-based public records (s 542) and are deliberately held at discovery unless they carry investigation content.
operation: >-
  Primary: environmental management register, contaminated land register, site investigation report, site suitability statement, contaminated land investigation document, contaminated land auditor, notifiable activity, or site management plan when a contamination term or s 383 follows within 80 characters. 65 is discovery-only (primary alone) and surfaces the Act, DETSI guidance, public search results and title notations. 75 requires, within 300 characters, a populated site field (lot on plan, lot/plan, real property description, title reference, site address, site, notifiable activity, contaminant or contaminant of concern, sample or borehole ID, monitoring well, depth, consultant, auditor, landowner or occupier) whose value is not blank, bracketed or a placeholder, AND either a laboratory result row or investigation-work vocabulary (sampling, borehole, groundwater, soil samples, exceedance, laboratory, NATA, remediation, investigation level, HIL, EIL, conceptual site model). 85 requires two distinct populated site fields, a laboratory result row (a named contaminant such as TRH, PAH, BTEX, PFAS, PFOS, benzo(a)pyrene, PCBs, arsenic, lead, chromium or mercury followed within 60 characters by a concentration in mg/kg, ug/L, mg/L or ng/L) and investigation-work vocabulary. Lot on plan is matched as a labelled loose value because the exact register field format is unverified. All tiers exclude template/fixture text and legislation, guidance and public-search text (maximum penalty, penalty units, fact sheet, media release, search fee).
pattern: (?i)\b(?:environmental\s+management\s+register|contaminated\s+land\s+register|site\s+investigation\s+report|site\s+suitability\s+statement|contaminated\s+land\s+investigation\s+document|contaminated\s+land\s+auditor|notifiable\s+activit(?:y|ies)|site\s+management\s+plan(?=[^\n]{0,80}(?:contaminat|s\s*383|section\s+383)))\b
confidence: medium
confidence_justification: >-
  Medium: the register and report names are statutory and appear in the Act, DETSI guidance and every public search result, so they are discovery-only alone. Enforcement needs populated site fields plus sampling or laboratory content, which guidance and bare register extracts lack. Guidance tables of investigation levels can carry contaminant-plus-concentration rows, so a guidance document that also has filled site fields could reach 75. Lot on plan is matched as a labelled loose value (format unverified), and "contaminated land auditor" is a legacy phrase whose current statutory wording is "auditor" (used only at 65). 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Environmental Protection Act 1994 (Qld) ch 7 pt 8 ss 371-383, 542, Schedule 3
frameworks:
  - QGISCF
data_categories:
  - environmental
  - location
  - legal
corroborative_evidence:
  keywords:
    - sampling
    - borehole
    - groundwater
    - soil samples
    - exceedance
    - laboratory
    - NATA
    - remediation
    - investigation level
    - conceptual site model
  proximity: 300
customisation:
  - key: qld-lot-on-plan
    kind: identifier-format
    identifier: qld-lot-on-plan
    target: purview.regexes/Regex_au_qld_contaminated_land_site_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's queensland lot on plan / real property description format (see docs/identifiers.md#qld-lot-on-plan). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Site investigation report - former Teston Power Station ash handling area\nLot on plan: Lot 7 on SP000001\nNotifiable activity: Coal fired power station (Schedule 3 item 8)\nContaminants of concern: TRH, PAH, arsenic\nBorehole BH04 at 1.5 m: arsenic 210 mg/kg, benzo(a)pyrene 3.2 mg/kg, both above the HIL D investigation level.\nGroundwater sampling from MW2 is scheduled for November."
      description: Populated SIR with lot on plan, notifiable activity and soil results above investigation levels (intended 85)
      synthetic: true
    - value: "Site management plan (s 383) - Teston Substation transformer yard\nSite: Teston Substation, Teston Road\nContaminant: PCBs from historical transformer oil leaks\nSoil samples from the bund base show PCBs 14 mg/kg; excavate and validate before the yard is resurfaced."
      description: Site management plan with populated site and contaminant and a PCB result (intended 85)
      synthetic: true
    - value: "Site suitability statement draft for auditor review\nSite address: 40 Depot Street, Teston\nConsultant: Teston Environmental Pty Ltd\nRemediation of the former fuel storage area is complete; validation sampling results are pending from the laboratory."
      description: Draft site suitability statement with populated site and consultant plus investigation vocabulary, no result row (intended 75)
      synthetic: true
    - value: "Environmental management register - due diligence for sale of Teston Depot\nReal property description: Lot 3 on RP000002\nPFAS detected in groundwater at MW1: PFOS 0.35 ug/L. Recommend a site investigation report before settlement."
      description: Pre-sale due diligence with lot on plan and PFAS groundwater result (intended 75)
      synthetic: true
  should_not_match:
    - value: "371 Grounds for including land in environmental management register. The administering authority may include land in the environmental management register if a notifiable activity is being carried out, or has been carried out, on the land."
      description: Act text (legislation decoy, stays at 65)
    - value: "Environmental management register search response\nLot on plan: Lot 12 on SP000003\nNotifiable activity: Petroleum product or oil storage\nThe land is recorded on the EMR. Search fee paid."
      description: Bare fee-based EMR search extract (public record, excluded)
    - value: "Environmental management register listing\nLot on plan: Lot 5 on SP000004\nNotifiable activity: Petroleum product or oil storage (Schedule 3 item 29)\nDate recorded: 02/05/2019"
      description: Bare register listing without exclusion wording (no investigation content, stays at 65)
    - value: "Site investigation report template\nLot on plan: __________\nSite address: [insert address]\nContaminants of concern: __________\nSampling results: attach laboratory certificates."
      description: Blank SIR template
    - value: "Fact sheet: a site suitability statement must accompany every site investigation report lodged with the department. It states whether the land is suitable for the proposed use."
      description: Guidance fact sheet
    - value: "Council media release: the old gasworks site has been removed from the contaminated land register after a site management plan was completed."
      description: News / media release
false_positives:
  - description: The EP Act, DETSI contaminated land guidelines and fact sheets, and the NEPM (Assessment of Site Contamination).
    mitigation: No populated site fields, and legislation and fact sheet markers are excluded, so these stay at 65 or below. Guidance investigation-level tables can match the result-row regex but need filled site fields as well.
  - description: Bare EMR/CLR search responses and title notations (fee-based public records under s 542).
    mitigation: 75 needs sampling or laboratory content in addition to the lot on plan and notifiable activity lines, and "search fee" / "search response" are excluded. An extract annotated with investigation findings will match.
  - description: Construction or event "site management plans" unrelated to contamination.
    mitigation: Site management plan is only a primary when a contamination term or s 383 follows within 80 characters.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_contaminated_land_primary
      matches:
        - ref: Regex_au_qld_contaminated_land_site_field
          min_count: 2
          unique_results: true
        - ref: Regex_au_qld_contaminated_land_result_row
        - ref: Keyword_au_qld_contaminated_land_investigation
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_contaminated_land_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_contaminated_land_primary
      matches:
        - ref: Regex_au_qld_contaminated_land_site_field
        - type: any
          refs:
            - Regex_au_qld_contaminated_land_result_row
            - Keyword_au_qld_contaminated_land_investigation
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_contaminated_land_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_contaminated_land_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_contaminated_land_exclusion
  regexes:
    - id: Regex_au_qld_contaminated_land_primary
      pattern: >-
        (?i)\b(?:environmental\s+management\s+register|contaminated\s+land\s+register|site\s+investigation\s+report|site\s+suitability\s+statement|contaminated\s+land\s+investigation\s+document|contaminated\s+land\s+auditor|notifiable\s+activit(?:y|ies)|site\s+management\s+plan(?=[^\n]{0,80}(?:contaminat|s\s*383|section\s+383)))\b
    - id: Regex_au_qld_contaminated_land_site_field
      pattern: >-
        (?i)\b(?:lot\s+on\s+plan|lot\s*/\s*plan|real\s+property\s+description|title\s+reference|site\s+address|site|notifiable\s+activity|contaminants?(?:\s+of\s+(?:potential\s+)?concern)?|COPC|sample\s+(?:location|ID|no\.?)|borehole(?:\s+ID)?|monitoring\s+well|depth|consultant|auditor|landowner|owner|occupier)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'.,()-]{0,40}(?:[ \t]+[A-Za-z0-9][A-Za-z0-9/'.,()-]{0,30}){0,4}
    - id: Regex_au_qld_contaminated_land_result_row
      pattern: >-
        (?i)\b(?:TRH|TPH|PAHs?|BTEX|benzene|PFAS|PFOS|PFHxS|PFOA|benzo\s*\(a\)\s*pyrene|B\(a\)P|PCBs?|arsenic|lead|chromium|cadmium|mercury|nickel|copper|zinc)\b[^\n]{0,60}?\b\d{1,6}(?:\.\d{1,4})?\s*(?:mg/kg|ug/L|µg/L|mg/L|ng/L|ug/kg|µg/kg)(?![A-Za-z])
  keywords:
    - id: Keyword_au_qld_contaminated_land_investigation
      groups:
        - match_style: word
          terms:
            - sampling
            - borehole
            - groundwater
            - soil samples
            - exceedance
            - exceeds
            - laboratory
            - NATA
            - remediation
            - validation sampling
            - investigation level
            - text: HIL
              case_sensitive: true
            - text: EIL
              case_sensitive: true
            - conceptual site model
            - monitoring well
      strength: specific
    - id: Keyword_au_qld_contaminated_land_exclusion
      groups:
        - match_style: word
          terms:
            - maximum penalty
            - penalty units
            - fact sheet
            - media release
            - search fee
            - search response
      strength: specific
risk_rating: 7
risk_description: >-
  Unpublished site investigation and validation reports, draft site management plans, sampling data and pre-sale due diligence describe contamination on identified land (lot on plan, address) with concentrations against investigation levels before the regulator or a buyer has seen them. Disclosure creates environmental liability and remediation cost exposure, affects land value and transactions, invites regulatory action and damages reputation. Register listings themselves are fee-based public records (s 542), so bare extracts are not the target. Risk 7 supports OFFICIAL: Sensitive / SENSITIVE.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Environmental Protection Act 1994 (Qld) - ch 7 pt 8 contaminated land (ss 371-383), s 542, Schedule 3 notifiable activities
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1994-062
  - title: Environmental Protection Regulation 2019 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2019-0155
