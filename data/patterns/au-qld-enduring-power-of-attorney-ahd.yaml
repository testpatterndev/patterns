schema: testpattern/v1
name: Queensland Enduring Power of Attorney or Advance Health Directive
slug: au-qld-enduring-power-of-attorney-ahd
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed enduring powers of attorney (Form 2 short form, Form 3 long form) and advance health directives (Form 4) under the Powers of Attorney Act 1998: principal and attorney details, financial and personal/health powers, life-sustaining treatment directions and capacity statements.
operation: >-
  Primary: Queensland Enduring Power of Attorney or Advance Health Directive anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:enduring\s+power\s+of\s+attorney|advance\s+health\s+directive|Powers\s+of\s+Attorney\s+Act\s+1998|statement\s+of\s+(?:the\s+)?principal|life[\s-]+sustaining\s+measures?)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Powers of Attorney Act 1998 (Qld)
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - health
  - legal
  - pii
corroborative_evidence:
  keywords:
    - principal
    - attorney
    - personal/health matters
    - financial matters
    - capacity
    - eligible witness
    - justice of the peace
    - doctor
  proximity: 300
test_cases:
  should_match:
    - value: "Enduring power of attorney — short form (Form 2)\nPrincipal: Avery Teston\nDate of birth: 12/05/1948\nAddress: 14 Wattlebird Street, Stafford QLD 4053\nAttorney: Jordan Teston for financial matters, commencing when the principal loses capacity."
      description: Populated record 1
      synthetic: true
    - value: "Advance health directive (Form 4)\nPrincipal: Morgan Teston\nDate of birth: 03/02/1952\nIf I have a terminal illness I direct that life-sustaining measures, including cardiopulmonary resuscitation, be withheld. Doctor: Dr Casey Staffson."
      description: Populated record 2
      synthetic: true
    - value: "Attorney: Riley Teston\nPrincipal: Alex Teston\nThe principal appoints the attorney for personal/health matters under the Powers of Attorney Act 1998. Witnessed by a justice of the peace on 04/09/2026."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: An enduring power of attorney lets you appoint someone to make financial and personal decisions if you lose capacity. An advance health directive records your wishes about future health care.
      description: Guidance or explainer text
    - value: "Enduring power of attorney (Form 2)\nPrincipal: __________\nAttorney: __________\nPower commences: [ ] immediately [ ] when I lose capacity"
      description: Blank form
    - value: More than 40% of Queenslanders over 65 have made an enduring power of attorney, a Public Advocate survey found.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_enduring_power_of_attorney_ahd_primary
      matches:
        - ref: Regex_au_qld_enduring_power_of_attorney_ahd_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_enduring_power_of_attorney_ahd_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_enduring_power_of_attorney_ahd_primary
      matches:
        - ref: Regex_au_qld_enduring_power_of_attorney_ahd_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_enduring_power_of_attorney_ahd_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_enduring_power_of_attorney_ahd_primary
      pattern: >-
        (?i)\b(?:enduring\s+power\s+of\s+attorney|advance\s+health\s+directive|Powers\s+of\s+Attorney\s+Act\s+1998|statement\s+of\s+(?:the\s+)?principal|life[\s-]+sustaining\s+measures?)\b
    - id: Regex_au_qld_enduring_power_of_attorney_ahd_record_structure
      pattern: >-
        (?i)\b(?:principal|attorney|adult|proposed\s+guardian|proposed\s+administrator|guardian|administrator|applicant|witness|substitute\s+decision[\s-]maker|QCAT\s+(?:file\s+)?(?:no\.?|number|ref)|application\s+(?:no\.?|number)|file\s+(?:no\.?|number)|address|name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_enduring_power_of_attorney_ahd_corroborative
      groups:
        - match_style: word
          terms:
            - principal
            - attorney
            - personal/health matters
            - financial matters
            - capacity
            - eligible witness
            - justice of the peace
            - doctor
            - life-sustaining
            - cardiopulmonary resuscitation
            - terminal illness
            - Form 4
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a queensland enduring power of attorney or advance health directive about an identified person, gated on populated record fields. Completed enduring powers of attorney (Form 2 short form, Form 3 long form) and advance health directives (Form 4) under the Powers of Attorney Act 1998: principal and attorney details, financial and personal/health powers, life-sustaining treatment directions and capacity statements. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Qld Government — Power of attorney and advance health directive forms
    url: https://www.publications.qld.gov.au/dataset/power-of-attorney-and-advance-health-directive-forms
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
