schema: testpattern/v1
name: Board Paper
slug: global-board-paper
version: 1.5.1
type: regex
pattern_class: concept
description: >-
  Detects populated board papers and board resolutions: a board paper / board memorandum / board resolution phrase combined with populated paper metadata (paper number, agenda item, meeting date), a named author or sponsor, or a formal 'That the Board...' recommendation. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex. Primary: board paper/memorandum/pack/submission, for board consideration/approval/decision, board resolution/decision, audit/risk/remuneration committee report/paper. 65 (discovery only): primary alone. 75: primary plus one populated structure - paper number / agenda item / meeting date with a numbered value, prepared by / author / sponsor / approved by with a name, or a recommendation / decision sought / resolution line beginning 'That the Board' or 'to approve/endorse/note'. 85: primary plus two distinct structures (the three above or a financial-implications line with a dollar value) plus board-process evidence (quorum, conflicts of interest, company secretary, in camera, board-in-confidence, commercial-in-confidence, for decision/noting). Template/sample and guidance framing excluded on every enforce tier.
confidence: medium
confidence_justification: >-
  Enforce tiers require populated paper metadata, authorship or a formal board recommendation; governance guides, investor pages and blank board-paper forms stay at 65. Medium because published board minutes and public-sector board papers released under FOI share the structure.
jurisdictions:
  - global
regulations:
  - Corporations Act 2001 (Cth)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - DISP
  - ISO 27001
  - NIST CSF
data_categories:
  - government
  - governance
test_cases:
  should_match:
    - value: "BOARD PAPER - COMMERCIAL-IN-CONFIDENCE\nPaper number: BP-2026-17\nMeeting date: 19/07/2026\nPrepared by: Priya Ramanathan, Chief Financial Officer\nRecommendation: That the Board approves the acquisition of Coral Coast Freight Pty Ltd.\nFinancial implications: total consideration of $48,500,000 funded from existing facilities.\nConflicts of interest: none declared."
      description: Populated board paper - number, date, author, recommendation and financials (85)
      synthetic: true
    - value: "Board paper\nSponsor: Alex Moreau\nThis paper updates directors on the depot relocation."
      description: Board paper with a single populated sponsor field (75)
      synthetic: true
  should_not_match:
    - value: "Governance guidance note: a good board paper states the recommendation, the decision sought and the financial implications, and names who prepared it. Keep board papers under ten pages."
      description: Governance guidance naming the elements without values
      synthetic: true
    - value: "BOARD PAPER\nPaper number: __________\nMeeting date: __________\nPrepared by: __________\nRecommendation: __________"
      description: Blank board paper form - placeholder values
      synthetic: true
    - value: "The council's board paper on the stadium, released to journalists on Friday, shows the board decision was delayed twice."
      description: News item referring to a board paper
      synthetic: true
    - value: "White board used in the meeting room"
      description: Unrelated board wording
      synthetic: true
    - value: "Board game night at the community centre"
      description: Unrelated board wording
      synthetic: true
    - value: "The public investor page links to a board paper."
      description: Public page reference
      synthetic: true
    - value: "Template example: board paper BP-2026-17 with meeting date, recommendation, and decision sought."
      description: Template framing
      synthetic: true
false_positives:
  - description: Governance guides and board-paper writing training.
    mitigation: Guidance and training framing is excluded and such text carries no populated metadata.
  - description: Board minutes or FOI-released board papers that are already public.
    mitigation: They can reach 75/85 because the structure is identical; apply publication context in policy.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  The keyword concept identifies board papers, board memoranda, resolutions, meeting packs, and committee reports prepared for formal governance consideration. A populated paper may combine unreleased recommendations, performance results, legal issues, executive positions, risk analysis, and proposed decisions that a competitor, litigant, or counterparty could exploit. The normal impact is serious but bounded to one organisation and decision process, while published minutes and routine committee material carry less harm. Risk 8 SENSITIVE Government fits the composite governance record; PROTECTED is not met without a protected operation, critical-service dependency, or credible significant damage beyond the board matter. Quality pass 2026-09-24: enforce tiers (75/85) now require populated record structure (labelled fields with real values, identifiers or data rows); phrase-only mentions in guidance, marketing, blank forms and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: &id001
        type: any
        ids:
          - Regex_board_paper
          - Regex_board_resolution
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_board_paper_header
            - Regex_global_board_paper_author
            - Regex_global_board_paper_decision
            - Regex_global_board_paper_financial
        - ref: Keyword_board_decision_content
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_board_paper_guidance_exclusion
    - confidence_level: 75
      id_match: *id001
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_board_paper_header
            - Regex_global_board_paper_author
            - Regex_global_board_paper_decision
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_board_paper_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: *id001
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_board_paper
      pattern: (?i)\b(?:board\s+(?:paper|memorandum|pack|submission)|for\s+board\s+(?:consideration|approval|decision))\b
    - id: Regex_board_resolution
      pattern: (?i)\b(?:board\s+(?:resolution|decision)|(?:audit|risk|remuneration)\s+committee\s+(?:report|paper))\b
    - id: Regex_global_board_paper_header
      pattern: (?i)\b(?:paper\s*(?:no\.?|number|ref(?:erence)?)|agenda\s*(?:item|no\.?|number)|item\s*(?:no\.?|number)|meeting\s+date|board\s+meeting|date\s+of\s+meeting)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[^\n]{0,12}\d)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
    - id: Regex_global_board_paper_author
      pattern: (?i)\b(?:prepared\s+by|author|sponsor|presenter|presented\s+by|submitted\s+by|responsible\s+(?:executive|officer)|approved\s+by|endorsed\s+by)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?:(?:Mr|Mrs|Ms|Mx|Dr|Prof)\.?[ \t]{1,3})?[A-Z][A-Za-z'.-]{1,30}(?:[ \t]{1,3}[A-Z&][A-Za-z'.&-]{0,30}){0,5}
    - id: Regex_global_board_paper_decision
      pattern: (?i)\b(?:recommendations?|decision\s+(?:sought|required)|proposed\s+resolution|resolution)[ \t]{0,3}[:#-][ \t]{0,5}(?:\(?[a-z0-9]\)[ \t]{0,3})?(?:that\s+the\s+board|the\s+board|board\s+to|to\s+(?:approve|endorse|note|resolve))\b
    - id: Regex_global_board_paper_financial
      pattern: (?i)\b(?:financial\s+implications?|total\s+cost|budget(?:\s+impact)?|capital\s+cost|investment|contract\s+value|funding\s+(?:required|sought)|total\s+consideration)[ \t]{0,3}[:#][^\n]{0,40}?(?:AUD|USD|NZD|GBP|EUR|A\$|US\$|NZ\$|\$|£|€)[ \t]?(?:\d{1,3}(?:,\d{3}){1,4}|\d{1,12})(?:\.\d{2})?(?![\d,]\d)(?!\.\d)
  keywords:
    - id: Keyword_board_decision_content
      groups:
        - match_style: word
          terms:
            - quorum
            - conflicts of interest
            - company secretary
            - directors present
            - in camera
            - board-in-confidence
            - commercial-in-confidence
            - risk appetite
            - delegation of authority
            - for decision
            - for noting
      strength: domain
    - id: Keyword_global_board_paper_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - board game
            - whiteboard
            - how to write
            - writing a board paper
            - governance training
            - investor page
      strength: noise
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were phrase-only keyword tiers; 75 now needs populated paper metadata (paper number/agenda/meeting date), a named author/sponsor or a formal 'That the Board' recommendation, and 85 needs two distinct structures plus board-process evidence; replaced the bare 'Board paper' positive; added guidance, blank-form and news decoys; dropped SOCI Act, added Corporations Act 2001 (Cth) with a verified reference.
  - version: 1.4.0
    date: '2026-07-19'
    description: 'Profile quality: align the regex-backed detector type; unify board artifact discovery, decision-content medium, and formal-record high tiers; add public/template adversarial probes.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 521 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
