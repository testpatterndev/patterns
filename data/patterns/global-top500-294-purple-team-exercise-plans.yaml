schema: testpattern/v1
name: Purple team exercise plans
slug: global-top500-294-purple-team-exercise-plans
version: 1.4.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects purple-team and adversary-emulation exercise plans that name ATT&CK techniques, targets, test windows, C2 infrastructure and expected detections. Exercise wording alone is discovery-only; tabletop exercises are out of scope.
operation: >-
  Regex_purple_team_primary (purple-team exercise/engagement/plan or adversary-emulation plan wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a MITRE ATT&CK technique ID (T1xxx / T1xxx.xxx) or a populated exercise field (target host/scope, test window, detection owner, white cell, emulated actor, C2 infrastructure, expected detection). 85 requires a MITRE ATT&CK technique ID (T1xxx / T1xxx.xxx) (two distinct hits), a populated exercise field (target host/scope, test window, detection owner, white cell, emulated actor, C2 infrastructure, expected detection), and independent detection-engineering (SIEM/EDR, telemetry, rules of engagement, tooling) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_purple_team_guidance_exclusion).
pattern: >-
  (?i)\b(?:purple[\s-]team(?:ing)?\s+(?:exercise|engagement|plan|test|scenario|schedule)s?|adversary\s+emulation\s+(?:plan|exercise|scenario)|attack\s+simulation\s+plan)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a MITRE ATT&CK technique ID (T1xxx / T1xxx.xxx) or a populated exercise field (target host/scope, test window, detection owner, white cell, emulated actor, C2 infrastructure, expected detection)), and 85 needs two distinct structures plus independent detection-engineering (SIEM/EDR, telemetry, rules of engagement, tooling) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - detection gap
  - SIEM
  - EDR
  - telemetry
  - rules of engagement
  - deconfliction
  - blue team
  - Atomic Red Team
  - Caldera
  - Cobalt Strike
  proximity: 300
test_cases:
  should_match:
  - value: The next purple team exercise is planned for the finance network in November.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Purple team exercise plan - wave 2
      Target host: fin-app02.harbour.internal
      Test window: 14/11/2026 20:00-23:00
    description: Medium-tier probe (75) - populated exercise fields
    synthetic: true
  - value: |-
      Adversary emulation plan - FIN7 profile
      Target host: fin-app02.harbour.internal
      Test window: 14/11/2026 20:00-23:00
      Steps: T1566.001 spearphishing attachment, T1059.001 PowerShell, T1003.001 LSASS memory
      C2 server: 203.0.113.44 (Cobalt Strike)
      Expected detection: EDR alert and SIEM correlation rule; record every detection gap for the blue team.
    description: High-tier probe (85) - technique IDs, exercise fields and detection context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: purple team exercises are run twice a year with written rules of engagement.'
    description: Policy text
    synthetic: true
  - value: |-
      Purple team exercise plan template
      Target host: ________
      Test window: [insert]
    description: Blank template
    synthetic: true
  - value: 'Course module 2: adversary emulation plan basics - T1059.001 PowerShell and T1566.001 phishing explained.'
    description: Training framing with technique IDs
    synthetic: true
false_positives:
- description: ATT&CK training decks cite technique IDs.
  mitigation: Training/course framing is excluded; 85 also needs populated target or window fields.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_purple_team_primary
    matches:
    - ref: Regex_purple_team_attack_technique
      min_count: 2
      unique_results: true
    - ref: Regex_purple_team_exercise_field
    - ref: Keyword_purple_team_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_purple_team_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_purple_team_primary
    matches:
    - type: any
      refs:
      - Regex_purple_team_attack_technique
      - Regex_purple_team_exercise_field
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_purple_team_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_purple_team_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_purple_team_primary
    pattern: >-
      (?i)\b(?:purple[\s-]team(?:ing)?\s+(?:exercise|engagement|plan|test|scenario|schedule)s?|adversary\s+emulation\s+(?:plan|exercise|scenario)|attack\s+simulation\s+plan)\b
  - id: Regex_purple_team_attack_technique
    pattern: >-
      \bT1\d{3}(?:\.\d{3})?\b
  - id: Regex_purple_team_exercise_field
    pattern: >-
      (?i)\b(?:target(?:\s+(?:host|system|asset|scope))?|in[\s-]scope|test\s+window|exercise\s+date|start\s+time|detection\s+owner|white\s+cell|emulated\s+(?:actor|group)|C2\s+(?:server|infrastructure)|expected\s+detection|use\s+case)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  keywords:
  - id: Keyword_purple_team_context
    groups:
    - match_style: word
      terms:
      - detection gap
      - text: SIEM
        case_sensitive: true
      - text: EDR
        case_sensitive: true
      - telemetry
      - rules of engagement
      - deconfliction
      - blue team
      - Atomic Red Team
      - Caldera
      - Cobalt Strike
    strength: specific
  - id: Keyword_purple_team_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires purple-team or adversary-emulation plan wording plus ATT&CK technique IDs or populated target/window/C2 fields before enforcing. A genuine plan can reveal selected targets, attack techniques, test timing, expected detections, and control gaps, allowing participants or outsiders to evade or disrupt the exercise and learn the defensive posture. The normal affected scale is the systems and teams in one exercise, while public methodologies, conference material, and generic tabletop references can match without operational detail. Risk 8 SENSITIVE is justified for a current plan; PROTECTED would require critical targets, protected operations, or significant damage from disclosure.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because an operational
    purple-team plan can expose intended attack paths and defensive tests. PROTECTED is not met by the topic hit because
    target criticality, exercise scope, live access, and significant consequence are unproven.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic handling is Medium with Medium InfoTech controls for current exercise plans, limiting access until the
      activity and remediation are complete. High is reserved for exercises involving critical or protected environments
      where advance disclosure would cause significant damage.
