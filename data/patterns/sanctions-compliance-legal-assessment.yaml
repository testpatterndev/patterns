schema: testpattern/v1
name: Sanctions Compliance Legal Assessment
slug: sanctions-compliance-legal-assessment
version: 1.6.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects internal legal assessments evaluating compliance with sanctions regimes (DFAT, OFAC, EU). Disclosure reveals identified compliance gaps, risk exposures, and remediation strategies before implementation, exposing the organisation to criminal prosecution under the Autonomous Sanctions Act 2011.
operation: 'Primary: sanction(s) (compliance/assessment/screening/exposure/risk/regime/list), DFAT, OFAC, sanctioned entity/person/party. 65 (discovery only) = primary alone. 75 = primary plus two distinct populated memo or screening fields (To, From, Date, Subject, Re, Prepared by/for, Matter, Our ref, Counterparty, Entity, Vendor, Supplier, Payment reference/date/amount, Amount, Jurisdiction, Screening result/date/tool, List match, Regime, Control). 85 = primary plus three distinct fields plus a concrete compliance finding (compliance/screening gap, material deficiency, breach exposure, control failure, remediation required, counterparties requiring due diligence). Public-list, academic, enforcement and template exclusions apply to every tier.'
pattern: (?i)\b(?:sanctions?(?:\s+(?:compliance|assessment|screening|exposure|risk|regime|list))?|DFAT|OFAC|sanctioned\s+(?:entity|person|party))\b
confidence: medium
confidence_justification: 'Medium: sanctions vocabulary is common in public lists, news, academic analysis and sport, so enforcement requires a populated legal memo or screening record; 85 adds a concrete compliance finding.'
jurisdictions:
  - global
regulations:
  - Autonomous Sanctions Act 2011 (Cth)
  - Charter of the United Nations Act 1945 (Cth)
frameworks:
- QGISCF
data_categories:
  - legal
corroborative_evidence:
  keywords:
    - legal assessment
    - compliance assessment
    - legal opinion
    - risk assessment
    - privilege
    - PROTECTED
    - compliance gap
    - remediation
    - designated person
    - consolidated list
    - screening
    - exposure
  proximity: 300
  keyword_lists:

    - corporate-legal
test_cases:
  should_match:
    - value: |-
        PRIVILEGED - prepared for counsel
        Sanctions legal assessment
        To: Chief Financial Officer
        From: Head of Legal
        Date: 12/08/2026
        Counterparty: Northwind Maritime FZE
        Screening result: Partial match to a DFAT Consolidated List entry
        The assessment identifies a screening gap: payments of $412,000 were released before the alert was cleared, creating breach exposure under the Autonomous Sanctions Act 2011.
      description: 85 - populated memo and screening fields plus a concrete screening-gap finding
      synthetic: true
    - value: |-
        PROTECTED - LEGAL PROFESSIONAL PRIVILEGE
        Sanctions Compliance Legal Assessment

        Prepared for: Chief Financial Officer
        Subject: DFAT Consolidated List Screening Gaps

        This privileged legal assessment identifies three compliance gaps in the current sanctions screening process. Payments to Entity X may constitute a breach of the Autonomous Sanctions Act 2011.
      description: 75 - two populated memo fields; finding present but only two fields
    - value: |-
        Sanctions screening review
        Counterparty: Harbour Shipping Services
        Screening date: 03/06/2026
        No list match; file closed.
      description: 75 - two populated screening fields without a finding
      synthetic: true
    - value: Sanctions compliance working note.
      description: 65 discovery - topic without populated fields
    - value: 'PRIVILEGED DFAT sanctions legal assessment: screening gaps permit Vendor X payment, creating breach exposure and requiring remediation.'
      description: 65 discovery - one-line assessment without populated fields
    - value: This confidential legal opinion addresses the organisation's exposure under OFAC secondary sanctions. The risk assessment identifies 12 counterparties requiring enhanced due diligence. Compliance gaps in the current screening process require immediate remediation.
      description: 65 discovery - prose opinion without populated fields
  should_not_match:
    - value: The Australian Government has imposed sanctions on several entities under the Autonomous Sanctions Act 2011. The DFAT consolidated list of sanctioned persons is publicly available on the DFAT website.
      description: Public guidance about the Australian sanctions regime
    - value: This article discusses the development of international sanctions regimes including OFAC, EU, and Australian sanctions frameworks. The academic analysis examines enforcement trends.
      description: Academic article on sanctions law
    - value: A media report noted that the company was fined for breaching OFAC sanctions. The published enforcement action details are available on the OFAC website.
      description: News about a published enforcement action
    - value: OFAC published an updated sanctions list and public guidance.
      description: Public list activity (discovery inventory only)
    - value: The sports league imposed sanctions for a rules breach.
      description: Non-regulatory disciplinary sanctions
    - value: |-
        Sanctions screening record
        Counterparty: ________
        Screening result: [select]
        Date: ________
        List match: ________
      description: Blank screening template - placeholder fields are rejected
false_positives:
  - description: Public sanctions lists and DFAT consolidated list
    mitigation: Negative match on 'publicly available', 'DFAT website', 'consolidated list published'. Require legal/compliance assessment context
  - description: Academic analysis of sanctions regimes
    mitigation: Require co-occurrence with internal assessment language and privilege/PROTECTED markers
  - description: Published enforcement actions for sanctions breaches
    mitigation: Negative match on 'fined', 'enforcement action', 'published', 'OFAC website'
  - description: Sanctions policy frameworks and procedures (non-assessment)
    mitigation: Require compliance gap/vulnerability language within proximity window
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_sanctions_compliance_primary
      matches:
        - ref: Regex_sanctions_compliance_record_structure
          min_count: 3
          unique_results: true
        - ref: Evidence_sanctions_finding
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - exclusion
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_sanctions_compliance_primary
      matches:
        - ref: Regex_sanctions_compliance_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - exclusion
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_sanctions_compliance_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - exclusion
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_sanctions_compliance_primary
      pattern: (?i)\b(?:sanctions?(?:\s+(?:compliance|assessment|screening|exposure|risk|regime|list))?|DFAT|OFAC|sanctioned\s+(?:entity|person|party))\b
    - id: Regex_sanctions_compliance_record_structure
      pattern: (?i)\b(?:To|From|Date|Subject|Re|Prepared\s+(?:by|for)|Matter(?:\s+(?:no\.?|number))?|Our\s+ref|Counterparty|Entity|Vendor|Supplier|Payment\s+(?:ref(?:erence)?|date|amount)|Amount|Jurisdiction|Screening\s+(?:result|date|tool)|List\s+match|Regime|Control(?:\s+(?:ID|ref))?)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<)[A-Za-z0-9$]
  keywords:
    - id: Evidence_sanctions_finding
      groups:
        - match_style: word
          terms:
            - compliance gap
            - compliance gaps
            - screening gap
            - screening gaps
            - material deficiency
            - material deficiencies
            - breach exposure
            - control failure
            - remediation required
            - counterparties requiring
            - potential breach
      strength: domain
    - id: exclusion
      groups:
        - match_style: word
          terms:
            - publicly available
            - DFAT website
            - OFAC website
            - academic
            - fined
            - enforcement action published
      strength: domain
  filters:
    - type: exclude_keyword
      values:
        - public sanctions list
        - published enforcement
        - DFAT website
      description: Exclude public sanctions information
risk_rating: 7
risk_description: >-
  This concept detector finds an internal legal or compliance assessment of sanctions exposure, screening gaps, affected counterparties, and remediation under regimes such as DFAT or OFAC. Premature disclosure can alert counterparties, reveal control weaknesses, and weaken the organisation's position before remediation or regulator engagement. Public sanctions lists, published enforcement actions, policy frameworks, and academic analysis are excluded, but the remaining low-confidence topic match still needs corroboration. Risk 7 supports SENSITIVE Legal; PROTECTED would require an active major evasion operation, protected intelligence, or systemic control compromise with significant consequences.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Legal, and Medium because candid sanctions gaps
    and legal exposure can cause moderate regulatory and commercial harm. PROTECTED is not met without protected
    sources, major active evasion, or system-wide screening compromise.
  generic:
    classification: Medium
    dlm: Medium Legal
    rationale: >-
      Medium and Medium Legal DLM protect non-public sanctions analysis and remediation plans without treating every
      sanctions reference as high-consequence intelligence.
references:
  - title: Autonomous Sanctions Act 2011 (Cth)
    url: https://www.legislation.gov.au/C2011A00038/latest/text
  - title: DFAT - Australia and sanctions
    url: https://www.dfat.gov.au/international-relations/security/sanctions
created: '2026-02-20'
updated: '2026-09-25'
changelog:
  - version: 1.6.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.6.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): Replaced the legacy keyword primary with an id-bearing regex primary. 75 now requires two distinct populated legal-memo or screening-record fields (new Regex_..._record_structure: counterparty, screening result, payment, To/From/Date ...) instead of legal-assessment keywords; 85 requires three fields plus a concrete compliance finding (the old 85 was reachable on keyword groups alone; the test-fitted "permits Vendor" term was removed). Wired the shared template-exclusion dictionary into every tier with the existing exclusion group and filter; dropped the legal-assessment and marking groups; recommended_confidence 85 -> 75; confidence low -> medium to match the gated design. Added populated 85/75 positives and a blank screening-template decoy; one-line/prose positives re-described as 65. Regulations: added Charter of the United Nations Act 1945 (Cth); added legislation and DFAT references.'
  - version: 1.5.0
    date: '2026-07-19'
    description: 'Targeted blocker remediation: split legal-assessment, concrete exposure/finding, and privilege/marking evidence into canonical keyword references; add distinct 65 discovery, 75 legal-context, and 85 populated privileged-assessment tiers with exact probes while preserving public-list, academic, enforcement, and sports negatives.'
  - version: 1.4.0
    date: '2026-07-17'
    description: 'TP-01579 approved reduced scope: add a policy-capable 75 tier wiring the existing primary keyword group to the existing corroborative group, NOT-gated by the existing exclusion group; the existing public-sanctions exclude_keyword filter continues to apply (all references pre-existing; no new detection structure). The 65 tier remains discovery-only. Deferred per QA/independent review: the proposed 85 tier, pending a split of legal-assessment, concrete-exposure/finding, remediation, and privilege/marking evidence into separate references. Added an internal gap/remediation positive plus public-list and sports-sanctions negatives.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1469 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-12'
    description: 'Baseline burn-down B: the sole pattern_tier had id_match: '''' (empty string) — idMatchIds() treats an empty id_match string as [], so scripts/verify-pattern-testcases.mjs tierEvaluable() filtered the tier out entirely (0 evaluable tiers), which routed should_not_match evaluation through the hard-fail no-tiers-to-gate-it path instead of the discovery_only warn path the tier was designed for. Wired id_match to the existing purview.keywords group id primary (already registered under the group: primary key), making the tier evaluable again; the tier remains discovery_only so a top-level hit on the academic-article negative now surfaces only as a discovery-inventory warning, not a should_not_match failure. Verified: 0 FAILs, all 3 should_not_match negatives clear; all 3 should_match positives still pass via top-level pattern.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove the dead template-exclusion declaration (Keyword_noise_exclusion) — no tier referenced it and the legacy tier shape carries no evidence lists to wire it into (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Downgraded weak high-confidence tier to 65 because independent specific/domain evidence was insufficient.; Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
author: qld-gov-dlp
source: qld-custom
license: MIT
remediation:
  catalog_quality_2026_06_02:
    status: applied
    changes:
      - 'Downgraded weak high-confidence tier to 65 because independent specific/domain evidence was insufficient.'
      - 'Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.'
      - 'Collapsed 3 duplicate 65-confidence tier(s) into the strictest canonical tier.'
      - 'Aligned recommended_confidence to 65.'
