schema: testpattern/v1
name: IBAN values
slug: global-top500-103-iban-values
version: 1.6.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects references to IBAN and international bank account number topics in financial and compliance documents. Commonly found in Australian regulatory filings, transaction records, and audit
  documentation. Topic-level phrase detection only; it does not parse or mod-97-validate IBAN values.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 6 keywords within 300 characters. Keyword
  lists: financial-deposit-terms.
pattern: (?is)\b(?:IBAN|international\s+bank\s+account\s+number)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - iban values
    - iban
    - values
    - financial
    - accounts
    - payments
  proximity: 300
  keyword_lists:
    - financial-deposit-terms
test_cases:
  should_match:
    - value: international bank account number
      description: Primary topic phrase match
    - value: IBAN payment details
      description: Explicit IBAN topic phrase match
    - value: SEPA guide explains IBAN values.
      description: Reference material with an explicit IBAN mention is intentionally discoverable
    - value: |-
        International bank account number: Recorded
        Payee: Avery Teston
        Account number: 12345678
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: bank transfer
      description: Generic word pair from old broad template should not match
    - value: Domestic bank account reconciliation.
      description: Generic domestic banking wording demoted out of the primary - no IBAN or international-account linkage
    - value: wire transfer approval
      description: Generic payment wording demoted out of the primary
    - value: |-
        International bank account number:
        Payee:
        Account name:
        Account number:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about international bank account number are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        International bank account number:
        Payee: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In Australian English, standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      local_noise_filter: true
      id_match: Regex_global_top500_103_iban_values_populated_label
      matches:
        - ref: Regex_global_top500_103_iban_values_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match: Regex_global_top500_103_iban_values_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match: Pattern_iban_values
      matches:
        - ref: Evidence_iban_values
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_iban_values
  regexes:
    - id: Pattern_iban_values
      pattern: (?is)\b(?:IBAN|international\s+bank\s+account\s+number)\b
    - id: Regex_global_top500_103_iban_values_populated_label
      pattern: (?i)\b(?:\b(?:IBAN|international\s+bank\s+account\s+number)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_global_top500_103_iban_values_record_structure
      pattern: (?i)\b(?:payee|supplier|vendor|creditor|beneficiary|account\s+name|BSB|account\s+(?:no\.?|number)|invoice\s+(?:no\.?|number)|remittance\s+(?:no\.?|number|ref(?:erence)?)|payment\s+(?:ref(?:erence)?|date)|amount\s+paid)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_iban_values
      groups:
        - match_style: word
          terms:
            - beneficiary account
            - wire transfer
            - international payment
            - SEPA
            - correspondent bank
            - cross-border payment
            - bank identifier
            - account validation
risk_description: >-
  Despite its name, the regex recognises international-bank-account, beneficiary-account, wire-transfer, correspondent-bank, cross-border-payment, and account-validation topics rather than an IBAN character structure. A match can locate payment discussion, but it does not provide the country code, checksum, bank component, or account component needed to route funds. Meaningful fraud against a beneficiary requires a populated instruction and authorisation context, while generic international-payment documents are expected matches. Risk 4 OFFICIAL reflects this topic-only rail signal; SENSITIVE would require a real IBAN linked to a person or transaction.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because the detector neither validates an
    IBAN nor establishes account authority or ownership. The next higher SENSITIVE classification is not met because no
    real account value linked to a person, transaction, balance, or actionable fraud context is required.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low handling suits IBAN terminology or an isolated routing identifier; contextual controls should rise
      when ownership, payment instructions, balances, or transaction records are present.
references:
  - title: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)"
    url: https://www.legislation.gov.au/C2006A00169/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
created: '2026-02-08'
updated: '2026-10-19'
changelog:
  - version: 1.6.0
    date: '2026-10-19'
    description: "Local noise filter: every tier above 65 opts in to the per-tenant Local Noise Exclusion dictionary (local_noise_filter: true). When the export enables it, each of those tiers gets a pattern-level TextMatchFilter (EndsWith, Exclude) reading that dictionary, so the organisation's own published values (its remit-to BSB, account number, SWIFT/BIC or IBAN) stop reaching 75/85 while the 65 tier still reports them. Detection logic and entity filters are unchanged, and the filter is inert until the customer adds entries."
  - version: 1.5.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_103_iban_values_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (beneficiary account, wire transfer, international payment, SEPA, correspondent bank, cross-border payment, bank identifier, account validation); 85 requires the populated field plus a populated payee/account field (Regex_global_top500_103_iban_values_record_structure). Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (remittance). Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.4.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (SOCI Act 2018 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.4.0
    date: '2026-07-17'
    description: 'Reduced-scope alignment fix (TP-00230): narrow the primary IdMatch to explicit IBAN / international bank account number phrases; generic bank-account, beneficiary-account, wire-transfer, international-payment, correspondent-bank, cross-border-payment, bank-identifier, and account-validation wording is demoted to corroborative evidence only, so domestic banking prose can no longer satisfy every tier of a SIT named IBAN values. Mod-97 value parsing rejected for this concept SIT (separate identifier classifier if ever needed).'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 705 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
