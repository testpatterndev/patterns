schema: testpattern/v1
name: National Metering Identifier
slug: global-national-metering-identifier
version: 1.5.2
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects National Metering Identifier (NMI) patterns used in the Australian energy market. A 10 or 11 digit number identifying electricity and gas connection points. Also covers the gas
  Meter Installation Registration Number (MIRN), which is allocated in the NMI number space: AEMO reserves the 5 XXX XXX XXX range for the gas industry (NSW/ACT 52, Vic 53, Qld 54, SA 55,
  WA 56, Tas 57) and MIRNs travel in the same aseXML NMI element with a checksum attribute. Context-dependent: requires energy/meter keywords.
operation: >-
  Regex pattern using universal engine. The top-level regex \b\d{10,11}\b matches 10 or 11 digit numbers. The Purview engine uses three regexes: Pattern_nmi_labeled (labeled format with
  NMI/MIRN/Meter Installation Registration Number/meter/metering prefix + 10-11 digits), Pattern_nmi_prefix (numbers starting with known NMI prefixes 60/61/70-79, the gas MIRN ranges 52-57, or
  alphanumeric NGGG/QAAA prefixes), and Pattern_au_nmi (bare 10-11 digit format). No checksum validator is applied: the NMI checksum is documented in the MSATS NMI Procedure, but the Queensland
  gas Retail Market Procedures do not state the MIRN checksum algorithm, so neither is claimed.
  Three confidence tiers: High (85) requires energy metering + energy provider keywords with template exclusion logic; Medium (75) requires energy metering keywords (using prefix regex); Low (65)
  requires energy metering + energy provider keywords (using generic regex). Evidence uses 2 keyword groups (13 energy metering terms, 9 energy provider terms) within 500-character proximity. Keyword
  lists: infrastructure-energy.
pattern: \b\d{10,11}\b
confidence: low
confidence_justification: >-
  Low confidence: a bare 10-11 digit number matches phone numbers, ABNs, bank account numbers, and many other numeric sequences. Corroborative evidence keywords such as NMI, meter, energy, or AEMO are
  essential for reliable detection. MIRN values are shape- and range-checked only; the MIRN checksum algorithm is not verified to equal the NMI algorithm, so no checksum validator is
  applied to either.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - infrastructure
  - energy
corroborative_evidence:
  keywords:
    - NMI
    - National Metering Identifier
    - MIRN
    - Meter Installation Registration Number
    - meter
  proximity: 500
  keyword_lists:
    - infrastructure-energy
test_cases:
  should_match:
    - value: '6102345678'
      description: 10-digit NMI (minimum length)
    - value: '61234567890'
      description: 11-digit NMI (maximum length)
    - value: '7001234567'
      description: NMI starting with 7
    - value: 'Gas retailer account - MIRN: 5412345678, supply point at 14 Wattlebird Street, Stafford QLD 4053'
      description: Queensland gas MIRN (54 range) with MIRN label (85 labeled regex)
      synthetic: true
    - value: 'Meter Installation Registration Number (MIRN): 53210987654 - gas distributor transfer request'
      description: Victorian gas MIRN (53 range, 11 characters with checksum digit) with the full label
      synthetic: true
  should_not_match:
    - value: '123456789'
      description: Only 9 digits (below minimum of 10)
    - value: '123456789012'
      description: 12 digits (above maximum of 11)
    - value: 12345ABCDE
      description: Contains letters instead of all digits
    - value: Your MIRN (Meter Installation Registration Number) is printed on the first page of your gas bill.
      description: Retailer help text naming MIRN without a value
false_positives:
  - description: Long numeric sequences in phone numbers, account numbers, ABNs, and other identifiers may match the generic 10-11 digit pattern without energy context.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with energy-specific terms to confirm actual NMI data.
  - description: In Australian English, standard business terminology overlapping with energy detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with NMI-specific prefix patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
risk_rating: 4
risk_description: >-
  The low-confidence rule finds a ten- or eleven-digit Australian National Metering Identifier near energy context. An NMI can help correlate a supply point or customer record, but it does not reveal consumption and cannot authorise meter or account changes alone. The normal unit is one service-point identifier and practical misuse needs customer, address, billing, or operational data. Risk 4 OFFICIAL reflects low standalone harm; SENSITIVE requires a linked account or infrastructure record.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4, PSPF OFFICIAL, QGISCF OFFICIAL and OFFICIAL DLM at Low tier fit one NMI or MIRN near energy context: a
    supply-point identifier that helps correlate a customer record. SENSITIVE is not met because it reveals no
    consumption, cannot authorise meter or account changes, and misuse needs linked customer, address or billing data.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low handling applies to a connection-point identifier; a linked customer account or infrastructure record
      would be needed for Medium.
purview:
  patterns_proximity: 500
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_nmi_labeled
      matches:
        - ref: Evidence_energy_metering
        - ref: Evidence_energy_provider
      excludes:
        - ref: Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_nmi_prefix
      matches:
        - ref: Evidence_energy_metering
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_au_nmi
      matches:
        - ref: Evidence_energy_metering
        - ref: Evidence_energy_provider
  regexes:
    - id: Pattern_au_nmi
      pattern: \b\d{10,11}\b
    - id: Pattern_nmi_labeled
      pattern: (?i)\b(?:NMI|MIRN|National\s+Metering\s+Identifier|Meter\s+Installation\s+Registration\s+Number|meter\s+(?:number|no|ID)|metering\s+(?:identifier|number))(?:\s*\((?:NMI|MIRN)\))?\s*[:#-]?\s*\d{10,11}\b
    - id: Pattern_nmi_prefix
      pattern: \b(?:5[2-7]\d{8,9}|6[01]\d{8,9}|7[0-9]\d{8,9}|NGGG\d{6,7}|QAAA\d{6,7})\b
  keywords:
    - id: Evidence_energy_metering
      groups:
        - match_style: word
          terms:
            - text: NMI
              case_sensitive: true
            - National Metering Identifier
            - text: MIRN
              case_sensitive: true
            - Meter Installation Registration Number
            - distribution supply point
            - meter
            - metering
            - energy
            - electricity
            - gas
            - AEMO
            - smart meter
            - connection point
            - supply point
            - meter data
            - meter reading
      strength: domain
    - id: Evidence_energy_provider
      groups:
        - match_style: word
          terms:
            - distributor
            - retailer
            - energy provider
            - network
            - DNSP
            - power
            - utility
            - grid
            - transmission
      strength: domain
  filters:
    - id: Guard_nmi_same_digits
      type: AllDigitsSameFilter
references:
  - title: AEMO - MSATS National Metering Identifier Procedure v7.4 (NMI structure, checksum, gas range 5 XXX XXX XXX)
    url: https://www.aemo.com.au/-/media/files/electricity/nem/retail_and_metering/metering-procedures/2026/msats-national-metering-identifier-procedure-v74.pdf
  - title: AEMO - National Metering Allocation List v14 (gas ranges 52-57, Qld 5400000000-5499999999)
    url: https://www.aemo.com.au/-/media/files/electricity/nem/retail_and_metering/metering-procedures/nmi-allocation-list.pdf
  - title: AEMO - Retail Market Procedures (Queensland) v23.0 (MIRN definition and checksum digit)
    url: https://www.aemo.com.au/-/media/files/gas/retail_markets_and_metering/market-procedures/qld/2025/retail-market-procedures-qld-v23-clean.pdf
  - title: AEMO - Participant Build Pack 4 (Queensland) (MIRN carried in aseXML NMI element with checksum attribute)
    url: https://www.aemo.com.au/-/media/files/gas/retail_markets_and_metering/market-procedures/qld/2025/participant-build-pack-4--queensland.pdf
created: '2026-02-08'
updated: '2026-09-25'
changelog:
  - version: 1.5.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had no generic classification, no
      rationale, no tier).
  - version: 1.5.0
    date: '2026-09-24'
    description: >-
      Recognise the gas Meter Installation Registration Number (MIRN) instead of creating a separate au-gas-mirn classifier: add MIRN and "Meter Installation Registration Number" (with an
      optional "(NMI)"/"(MIRN)" suffix) to Pattern_nmi_labeled, add the AEMO gas ranges 52-57 to Pattern_nmi_prefix, and add MIRN terms to Evidence_energy_metering. Sources: AEMO NMI Procedure
      v7.4, NMI Allocation List v14, Qld Retail Market Procedures v23.0 and PBP4. No checksum validator added; the MIRN checksum algorithm is not verified to match the NMI algorithm.
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 561 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.1
    date: '2026-07-06'
    description: Add AllDigitsSameFilter guard — primary regex accepted all-zeros/same-digit NMI values (e.g. 0000000000); mirrors au-medicare-card-identifier protection.
  - version: 1.3.0
    date: '2026-07-04'
    description: Widen patterns_proximity 300->500 so keyword evidence still gates at the challenging-layout distance (ph<50 cohort)
  - version: 1.2.0
    date: '2026-07-04'
    description: case/evidence metadata update
