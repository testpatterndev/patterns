schema: testpattern/v1
name: 1Password Service Account Token
slug: global-1password-service-account-token
version: 1.0.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects 1Password Service Account tokens, which begin with ops_eyJ (the ops_ prefix followed by a Base64-encoded JSON envelope) and 100 to 500 Base64/URL-safe characters. Service Account tokens grant non-interactive CLI and SDK access to designated 1Password vaults without master-password or biometric prompts.
operation: >-
  Matches ops_eyJ followed by 100-500 Base64/URL-safe characters, bounded outside identifier characters. Tiers: 85 for two distinct tokens with 1Password context, 75 for one token with context, 65 discovery-only for a bare token, with template-exclusion gating.
pattern: '(?-i)(?<![A-Za-z0-9+/_-])(ops_eyJ[A-Za-z0-9+/=_-]{100,500})(?![A-Za-z0-9+/=_-])'
confidence: high
confidence_justification: >-
  High confidence: 1Password Service Account tokens combine the vendor prefix ops_ with eyJ (Base64 for {"...) and a long structured cryptographic payload, pinned by 1Password docs, GitHub secret scanning, and TruffleHog.
jurisdictions:
- global
regulations:
- Criminal Code Act 1995 (Cth)
frameworks:
- CIS Controls
- ISO 27001
- NIST CSF
- SOC 2
data_categories:
- credentials
- security
corroborative_evidence:
  keywords:
  - 1password
  - OP_SERVICE_ACCOUNT_TOKEN
  - op read
  - op run
  proximity: 300
  keyword_lists:
  - credentials
  - data-record-context
  - generic-data-labels
test_cases:
  # Positive literals omitted: GitHub Push Protection blocks syntactically valid ops_eyJ service account tokens on public repos.
  should_match: []
  should_not_match:
  - value: "OP_SERVICE_ACCOUNT_TOKEN=ops_eyJshortpayload12345"
    description: "Payload shorter than 100 characters after ops_eyJ"
  - value: "OP_SERVICE_ACCOUNT_TOKEN=ops_notbase64json_short"
    description: "Missing eyJ JSON envelope prefix"
  - value: "Export OP_SERVICE_ACCOUNT_TOKEN before calling op run in GitHub Actions."
    description: "Documentation prose without a token value"
  - value: "template example placeholder record identifier"
    description: "Template/sample context should be excluded even when anchor words are present"
false_positives:
- description: "Revoked 1Password service account tokens in retired CI workflow logs."
  mitigation: "Verify active service accounts in 1Password Integrations -> Infrastructure Secrets Management."
- description: "Truncated or mock ops_eyJ strings in CLI tutorials."
  mitigation: "Excluded on every tier by template-exclusion."
exports:
- purview_xml
- yaml
- regex_copy
scope: narrow
risk_rating: 8
risk_description: >-
  The high-confidence detector finds a 1Password Service Account token. Because service accounts authenticate unattended without interactive MFA and unlock every secret in their granted vaults, a leaked token immediately exposes downstream cloud keys, SSH keys, and database credentials stored in those vaults. Risk 8 and SENSITIVE InfoTech reflect high-leverage vault token exposure.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, and Medium because a valid 1Password Service Account token provides unattended programmatic access to all secrets in its authorized vaults. PROTECTED requires confirmed access to enterprise-wide administrative or classified vaults.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium and Medium InfoTech handling suit 1Password Service Account tokens because they unlock all secrets within scoped vaults until revoked.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_onepassword_sa_token
    matches:
    - ref: Regex_onepassword_sa_token
      min_count: 2
      unique_results: true
    - ref: Keyword_onepassword_sa_token
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  - confidence_level: 75
    id_match: Regex_onepassword_sa_token
    matches:
    - ref: Keyword_onepassword_sa_token
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_onepassword_sa_token
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_onepassword_sa_token
    pattern: '(?-i)(?<![A-Za-z0-9+/_-])(ops_eyJ[A-Za-z0-9+/=_-]{100,500})(?![A-Za-z0-9+/=_-])'
  keywords:
  - id: Keyword_onepassword_sa_token
    groups:
    - match_style: word
      terms:
      - 1password
      - OP_SERVICE_ACCOUNT_TOKEN
      - op://
      - op read
      - op run
      - service account token
      - onepassword
    strength: specific
created: '2026-11-25'
updated: '2026-11-25'
changelog:
- version: 1.0.0
  date: '2026-11-25'
  description: Initial release.
author: testpattern-community
license: MIT
references:
- url: https://developer.1password.com/docs/service-accounts/
  title: "1Password Developer Service Accounts documentation (OP_SERVICE_ACCOUNT_TOKEN and ops_ tokens)"
- url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
  title: "Supported secret scanning patterns - GitHub Docs (1Password Service Account Token)"
