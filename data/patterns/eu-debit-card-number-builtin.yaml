schema: testpattern/v1
name: EU Debit Card Number (Microsoft built-in)
slug: eu-debit-card-number-builtin
version: 1.0.0
type: keyword_list
pattern_class: concept
description: >-
  Catalogue reference for the Microsoft Purview built-in EU Debit Card Number sensitive information type, which detects a
  sixteen-digit European debit card number passing the Luhn check, corroborated by card keywords. Microsoft recommends high
  confidence (85) for the built-in entity. This YAML-only record lets a package recipe include the Microsoft entity explicitly;
  it does not reproduce Microsoft's built-in regular expressions, keyword dictionaries, checksums or XML.
operation: >-
  In Microsoft Purview, enable the built-in entity 0e9b3178-9678-47dd-a509-37222ca96b42 to use Microsoft's detection logic.
  This reference exports YAML only and must not be deployed as a custom XML clone. The custom SIT eu-debit-card-number (European
  Debit Card Number) detects the same data with TestPattern's own tiers and stays the default; choose this built-in only through
  an explicit recipe include.
keywords:
- EU Debit Card Number
- European Union Debit Card Number
confidence: medium
confidence_justification: >-
  Medium confidence for this YAML-only record: its keyword logic finds references to the built-in entity name with Microsoft
  Purview context, not populated values. Microsoft's own recommended confidence for the entity is 85. The record does not
  claim to reproduce Microsoft's proprietary detection logic.
jurisdictions:
- eu
regulations:
- GDPR
frameworks:
- ISO 27001
- ISO 27701
- PCI-DSS
- SOC 2
data_categories:
- financial
- pii
test_cases:
  should_match:
  - value: EU Debit Card Number built-in SIT
    description: Microsoft built-in entity name
  - value: European Union Debit Card Number catalogue reference
    description: Name variant used for registry discovery
  - value: |-
      DLP policy inventory - Microsoft Purview
      Rule: Builtin-eu-debit-card-number-builtin
      Condition: EU Debit Card Number (built-in entity 0e9b3178-9678-47dd-a509-37222ca96b42), high confidence, instance count 1 or more
      Action: notify sender
    description: DLP rule inventory row naming the built-in entity with Microsoft Purview context
    synthetic: true
  should_not_match:
  - value: 'Debit card: 5500 0000 0000 0004'
    description: Populated value or sibling reference without the built-in entity name
  - value: European Debit Card Number custom detector
    description: Populated value or sibling reference without the built-in entity name
  - value: Card replacement request form
    description: Populated value or sibling reference without the built-in entity name
false_positives:
- description: Documentation and policy inventories can mention the Microsoft built-in entity by name.
  mitigation: Treat this YAML-only record as catalogue discovery; enable the Microsoft entity for value detection.
- description: The custom SIT eu-debit-card-number detects the same data; deploying both doubles matches on the same content.
  mitigation: Pick one per package. The custom SIT is the default; include this built-in only by an explicit recipe decision.
exports:
- yaml
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
  - confidence_level: 75
    id_match: Keyword_eu_debit_card_number_builtin_name
    matches:
    - ref: Evidence_microsoft_builtin_context
  keywords:
  - id: Keyword_eu_debit_card_number_builtin_name
    groups:
    - match_style: word
      terms:
      - EU Debit Card Number
      - European Union Debit Card Number
    strength: specific
  - id: Evidence_microsoft_builtin_context
    groups:
    - match_style: word
      terms:
      - Microsoft Purview
      - built-in SIT
      - built-in entity
      - catalogue reference
      - entity definition
    strength: domain
risk_rating: 8
risk_description: >-
  The referenced Microsoft entity detects the same data as the custom SIT eu-debit-card-number, so this record carries that
  SIT's reviewed risk (8) and sensitivity labels unchanged. The built-in changes who maintains the detection logic, not what
  the matched content is worth to an attacker.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  idcf: DSL-3
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Tier Medium is carried from the reviewed assessment of the custom SIT eu-debit-card-number, which detects the same data.
    This record is a YAML-only reference to the Microsoft entity.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Generic Medium with Medium Financial handling is carried from eu-debit-card-number, the custom SIT for the same data.
references:
- url: https://learn.microsoft.com/en-us/purview/sit-defn-eu-debit-card-number
  title: EU Debit Card Number entity definition - Microsoft Learn
- url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-entity-definitions
  title: Sensitive information type entity definitions - Microsoft Learn
created: '2026-10-20'
updated: '2026-10-20'
author: testpattern-community
source: microsoft
license: MIT
changelog:
- version: 1.0.0
  date: '2026-10-20'
  description: >-
    Catalogue reference for the Microsoft built-in EU Debit Card Number (GUID 0e9b3178-9678-47dd-a509-37222ca96b42, from the
    tenant SIT inventory and the Microsoft Learn entity definition). In no block: packages take it only by explicit recipe
    include.
