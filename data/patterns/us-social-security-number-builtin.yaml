schema: testpattern/v1
name: U.S. Social Security Number (Microsoft built-in)
slug: us-social-security-number-builtin
version: 1.0.0
type: keyword_list
pattern_class: concept
description: >-
  Catalogue reference for the Microsoft Purview built-in U.S. Social Security Number (SSN) sensitive information type, which
  detects a nine-digit US Social Security Number in formatted, unformatted or randomized form, with SSN keywords. Microsoft
  recommends medium confidence (75) for the built-in entity. This YAML-only record lets a package recipe include the Microsoft
  entity explicitly; it does not reproduce Microsoft's built-in regular expressions, keyword dictionaries, checksums or XML.
operation: >-
  In Microsoft Purview, enable the built-in entity a44669fe-0d48-453d-a9b1-2cc83f2cba77 to use Microsoft's detection logic.
  This reference exports YAML only and must not be deployed as a custom XML clone. The custom SIT us-social-security-number
  (US Social Security Number) detects the same data with TestPattern's own tiers and stays the default; choose this built-in
  only through an explicit recipe include.
keywords:
- U.S. Social Security Number (SSN)
- US Social Security Number
- U.S. Social Security Number
confidence: medium
confidence_justification: >-
  Medium confidence for this YAML-only record: its keyword logic finds references to the built-in entity name with Microsoft
  Purview context, not populated values. Microsoft's own recommended confidence for the entity is 75. The record does not
  claim to reproduce Microsoft's proprietary detection logic.
jurisdictions:
- us
regulations:
- CCPA/CPRA
- GLBA
- HIPAA
- SOX
frameworks:
- ISO 27001
- ISO 27701
- PCI-DSS
data_categories:
- pii
- phi
- government-id
test_cases:
  should_match:
  - value: U.S. Social Security Number (SSN) built-in SIT
    description: Microsoft built-in entity name
  - value: US Social Security Number catalogue reference
    description: Name variant used for registry discovery
  - value: |-
      DLP policy inventory - Microsoft Purview
      Rule: Builtin-us-social-security-number-builtin
      Condition: U.S. Social Security Number (SSN) (built-in entity a44669fe-0d48-453d-a9b1-2cc83f2cba77), medium confidence, instance count 1 or more
      Action: notify sender
    description: DLP rule inventory row naming the built-in entity with Microsoft Purview context
    synthetic: true
  should_not_match:
  - value: 'SSN: 078-05-1120'
    description: Populated value or sibling reference without the built-in entity name
  - value: US Individual Taxpayer register
    description: Populated value or sibling reference without the built-in entity name
  - value: Benefits enrolment guidance
    description: Populated value or sibling reference without the built-in entity name
false_positives:
- description: Documentation and policy inventories can mention the Microsoft built-in entity by name.
  mitigation: Treat this YAML-only record as catalogue discovery; enable the Microsoft entity for value detection.
- description: The custom SIT us-social-security-number detects the same data; deploying both doubles matches on the same
    content.
  mitigation: Pick one per package. The custom SIT is the default; include this built-in only by an explicit recipe decision.
exports:
- yaml
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
  - confidence_level: 75
    id_match: Keyword_us_social_security_number_builtin_name
    matches:
    - ref: Evidence_microsoft_builtin_context
  keywords:
  - id: Keyword_us_social_security_number_builtin_name
    groups:
    - match_style: word
      terms:
      - U.S. Social Security Number (SSN)
      - US Social Security Number
      - U.S. Social Security Number
    strength: specific
  - id: Evidence_microsoft_builtin_context
    groups:
    - match_style: word
      terms:
      - Microsoft Purview
      - built-in SIT
      - built-in entity
      - catalogue reference
      - entity definition
    strength: domain
risk_rating: 5
risk_description: >-
  The referenced Microsoft entity detects the same data as the custom SIT us-social-security-number, so this record carries
  that SIT's reviewed risk (5) and sensitivity labels unchanged. The built-in changes who maintains the detection logic, not
  what the matched content is worth to an attacker.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Tier Low is carried from the reviewed assessment of the custom SIT us-social-security-number, which detects the same data.
    This record is a YAML-only reference to the Microsoft entity.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low with Low handling is carried from us-social-security-number, the custom SIT for the same data.
references:
- url: https://learn.microsoft.com/en-us/purview/sit-defn-us-social-security-number
  title: U.S. Social Security Number (SSN) entity definition - Microsoft Learn
- url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-entity-definitions
  title: Sensitive information type entity definitions - Microsoft Learn
created: '2026-10-20'
updated: '2026-10-20'
author: testpattern-community
source: microsoft
license: MIT
changelog:
- version: 1.0.0
  date: '2026-10-20'
  description: >-
    Catalogue reference for the Microsoft built-in U.S. Social Security Number (SSN) (GUID a44669fe-0d48-453d-a9b1-2cc83f2cba77,
    from the tenant SIT inventory and the Microsoft Learn entity definition). In no block: packages take it only by explicit
    recipe include.
