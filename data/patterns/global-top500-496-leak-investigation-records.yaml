schema: testpattern/v1
name: Leak investigation records
slug: global-top500-496-leak-investigation-records
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to leak investigation records in international contexts. This information
  type is classified as personally identifiable information under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 1 keywords within 240 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:leak\s+investigation\s+records|leak\s+investigation|unauthorized\s+disclosure|information\s+leak|classified\s+leak|source\s+identification|forensic\s+analysis|chain\s+of\s+custody|security\s+breach|insider\s+threat|access\s+audit|disclosure\s+investigation)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
  - GDPR
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
  - leak investigation records
  proximity: 240
test_cases:
  should_match:
  - value: leak investigation records
    description: Primary topic phrase match
  - value: leak investigation
    description: Case-insensitive topic phrase match
  - value: unauthorized disclosure
    description: Alternative topic phrase match
  - value: information leak
    description: Additional topic phrase match
  - value: "To: Director-General\nFrom: Principal Legal Officer\nDate: 12/08/2026\nSubject: leak investigation records\nOur ref: LS2026-0412\nThis briefing sets out the leak investigation records for decision."
    description: Populated doc record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: voter sovereign debt
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about leak investigation records are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Common words and phrases related to leak investigation records appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 240
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_leak_investigation
      matches:
        - ref: Regex_global_top500_496_leak_investigation_records_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_leak_investigation
      matches:
        - ref: Regex_global_top500_496_leak_investigation_records_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_leak_investigation
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_leak_investigation
      pattern: (?is)\b(?:leak\s+investigation\s+records|leak\s+investigation|unauthorized\s+disclosure|information\s+leak|classified\s+leak|source\s+identification|forensic\s+analysis|chain\s+of\s+custody|security\s+breach|insider\s+threat|access\s+audit|disclosure\s+investigation)\b
    - id: Regex_global_top500_496_leak_investigation_records_record_structure
      pattern: >-
        (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9]
risk_description: The concept SIT detects leak investigations, unauthorised disclosure, source identification, forensic analysis,
  access audits, chain of custody, and insider-threat language; it does not prove that an active investigative file is present.
  A genuine record can reveal suspects, witnesses, evidence, hypotheses, access patterns, and forensic methods, warning the
  subject, enabling evidence destruction, or exposing innocent employees to retaliation. Harm is serious but normally contained
  to one investigation and its participants, while incident-response policies and public leak reporting can match the same
  concepts. Risk 8 and SENSITIVE are justified; PROTECTED would require classified sources, covert capabilities, or an active
  case whose compromise is likely to cause significant national or life-safety damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Confidential
frameworks:
  - ISO 27001
  - ISO 27701
