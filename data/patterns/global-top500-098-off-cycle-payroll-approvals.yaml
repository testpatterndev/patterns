schema: testpattern/v1
name: Off-cycle payroll approvals
slug: global-top500-098-off-cycle-payroll-approvals
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects off-cycle and ad hoc payroll payment requests and approvals for an identified employee: off-cycle pay requests, manual/special pay runs, final pay and termination pay calculations, with payment amounts or payment date.
operation: >-
  Primary: an off-cycle payroll phrase (off-cycle payment/pay run request or approval, ad hoc or manual payment request, special or supplementary pay run, urgent payment request, final pay calculation, termination payment calculation). Generic "bonus payment", "one-off payment", "payroll approval" and "final pay" alone were removed. 75 tier requires a populated person field (employee/staff name or number, payroll number, position number, payee) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated payment detail (gross/net amount, payment amount, amount approved, leave payout, payment in lieu of notice, redundancy pay, or a payment date) and an independent corroborative term (approved, approver, authorised, delegate, reason, termination, urgent, final pay). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:off[\s-]cycle\s+(?:pay(?:ments?|roll)?|pay\s+runs?)(?:\s+(?:requests?|approvals?|forms?))?|ad[\s-]hoc\s+(?:payments?|pay\s+runs?)\s+(?:requests?|approvals?)|manual\s+(?:payments?|cheques?|pay\s+runs?)\s+(?:requests?|approvals?)|special\s+pay\s+runs?|supplementary\s+(?:payments?|pay\s+runs?)|urgent\s+payment\s+requests?|final\s+pay\s+(?:calculations?|requests?|approvals?)|termination\s+pay(?:ments?)?\s+(?:calculations?|approvals?|requests?))\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - employment
  - pii
corroborative_evidence:
  keywords:
    - approved
    - approver
    - authorised
    - delegate
    - reason
    - termination
    - urgent
    - final pay
  proximity: 300
test_cases:
  should_match:
    - value: "Off-cycle payment request\nEmployee name: Avery Teston\nEmployee ID: 4471820\nReason: missed overtime from pay period ending 12/09/2026\nGross amount: $642.30\nPayment date: 18/09/2026\nApproved by delegate: Jordan Staffson"
      description: "85: off-cycle payment request with employee, gross amount, payment date and delegate approval"
      synthetic: true
    - value: "Final pay calculation\nStaff member: Morgan Teston\nUnused annual leave paid out: $4,812.66\nPayment in lieu of notice: $3,200.00\nTermination date 30/09/2026; authorised by the HR manager."
      description: "85: final pay calculation with staff member, leave payout and PILN, authorised"
      synthetic: true
    - value: "Special pay run requested for staff member: Casey Teston - details in the attached email."
      description: "75: special pay run request naming the staff member, no amounts"
      synthetic: true
    - value: "off-cycle payment request"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "An employee's final pay calculation includes outstanding wages and unused annual leave. This fact sheet explains when final pay must be paid."
      description: "FWO-style guidance - must stay at or below 65"
    - value: "Off-cycle payment request\nEmployee name: __________\nGross amount: $______\nPayment date: __/__/____"
      description: "Blank request form - must stay at or below 65"
    - value: "Run a special pay run in minutes with our payroll software. Book a demo."
      description: "Vendor marketing - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Payroll calendars that schedule supplementary pay runs without employee data."
    mitigation: "No populated person field, so these stay at 65."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_098_off_cycle_payroll_approvals_primary
      matches:
        - ref: Regex_top500_098_off_cycle_payroll_approvals_person_field
        - ref: Regex_top500_098_off_cycle_payroll_approvals_payment_detail
        - ref: Keyword_top500_098_off_cycle_payroll_approvals_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_098_off_cycle_payroll_approvals_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_098_off_cycle_payroll_approvals_primary
      matches:
        - ref: Regex_top500_098_off_cycle_payroll_approvals_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_098_off_cycle_payroll_approvals_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_098_off_cycle_payroll_approvals_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_098_off_cycle_payroll_approvals_primary
      pattern: >-
        (?i)\b(?:off[\s-]cycle\s+(?:pay(?:ments?|roll)?|pay\s+runs?)(?:\s+(?:requests?|approvals?|forms?))?|ad[\s-]hoc\s+(?:payments?|pay\s+runs?)\s+(?:requests?|approvals?)|manual\s+(?:payments?|cheques?|pay\s+runs?)\s+(?:requests?|approvals?)|special\s+pay\s+runs?|supplementary\s+(?:payments?|pay\s+runs?)|urgent\s+payment\s+requests?|final\s+pay\s+(?:calculations?|requests?|approvals?)|termination\s+pay(?:ments?)?\s+(?:calculations?|approvals?|requests?))\b
    - id: Regex_top500_098_off_cycle_payroll_approvals_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_098_off_cycle_payroll_approvals_payment_detail
      pattern: >-
        (?i)\b(?:gross\s+(?:amount|payment)|net\s+(?:amount|payment)|payment\s+amount|amount\s+(?:requested|approved|payable)|total\s+(?:payable|payment)|(?:unused\s+)?annual\s+leave\s+(?:payout|paid\s+out)|(?:unused\s+)?long\s+service\s+leave\s+paid\s+out|payment\s+in\s+lieu(?:\s+of\s+notice)?|redundancy\s+pay|outstanding\s+wages)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?|\b(?:payment\s+date|pay\s+date)[ \t]{0,3}[:\-]?[ \t]{0,3}(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})
  keywords:
    - id: Keyword_top500_098_off_cycle_payroll_approvals_corroborative
      groups:
        - match_style: word
          terms:
            - approved
            - approver
            - authorised
            - delegate
            - reason
            - termination
            - urgent
            - final pay
      strength: specific
    - id: Keyword_top500_098_off_cycle_payroll_approvals_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - must be paid
            - final pay includes
            - payroll software
            - book a demo
            - free trial
      strength: domain
risk_description: >-
  The classifier identifies off-cycle or final pay requests for an identified employee (75) with payment amounts or dates (85). These reveal individual pay, termination and leave payouts, and are a common target for payroll fraud (fake urgent payments). Guidance, blank forms and marketing stay at 65. Risk 4 supports OFFICIAL.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
