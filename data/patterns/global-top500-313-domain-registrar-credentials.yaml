schema: testpattern/v1
name: Domain registrar credentials
slug: global-top500-313-domain-registrar-credentials
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects domain registrar credentials: registrar account or transfer-code wording with populated login, password, PIN, API key or EPP/auth code values for managed domains. Topic wording alone is discovery-only.
operation: >-
  Regex_registrar_cred_primary (domain registrar account/login, registrar credentials, transfer/auth code or EPP code wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated credential field (username/login, account/customer ID, password, PIN, API key, EPP/auth code) or a managed domain name. 85 requires a populated credential field (username/login, account/customer ID, password, PIN, API key, EPP/auth code) (two distinct hits), a managed domain name, and independent domain-administration (renewal/expiry, nameservers, registrant, WHOIS, registrar brand) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_registrar_cred_guidance_exclusion).
pattern: >-
  (?i)\b(?:domain\s+registrar(?:\s+(?:account|login|portal))?|registrar\s+(?:account|portal|login|credentials)|domain\s+(?:transfer|auth(?:orization)?)\s+code|EPP\s+(?:code|key)|auth[\s-]?info\s+code)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated credential field (username/login, account/customer ID, password, PIN, API key, EPP/auth code) or a managed domain name), and 85 needs two distinct structures plus independent domain-administration (renewal/expiry, nameservers, registrant, WHOIS, registrar brand) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - renewal
    - expiry
    - nameservers
    - registrant
    - WHOIS
    - DNS
    - two-factor
    - auDA
    - GoDaddy
    - Namecheap
  proximity: 300
  keyword_lists:
    - credentials
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: Renewal notices from the domain registrar go to the ICT shared mailbox.
      description: Discovery probe (65)
      synthetic: true
    - value: |-
        Domain registrar account
        Username: ict-admin@harbourhealth.org.au
      description: Medium-tier probe (75) - populated login field
      synthetic: true
    - value: |-
        Domain registrar account - harbourhealth.org.au
        Customer ID: 40118273
        Username: ict-admin@harbourhealth.org.au
        Password: Tide!Harbour2026
        EPP code: zR7#kq2Lw9
        Renewal due 14/03/2027; nameservers ns1.harbourdns.net; two-factor not enabled.
      description: High-tier probe (85) - several credential fields, domain and administration context
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match
    - value: 'Policy statement: domain registrar credentials are held in the privileged password vault.'
      description: Policy text
      synthetic: true
    - value: |-
        Domain registrar account template
        Username: ________
        Password: [insert]
      description: Blank template
      synthetic: true
    - value: 'Course module 1: to move a domain, request the EPP code from your domain registrar and approve the transfer.'
      description: Training framing
      synthetic: true
false_positives:
  - description: Registrar help pages explain how to find an EPP or auth code.
    mitigation: Values must be populated; guidance/training framing is excluded.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
risk_description: >-
  The detector now requires registrar wording plus a populated credential or transfer-code value before enforcing, so enforced hits carry usable account secrets. A topic hit may point toward domain-management material, yet domain hijacking requires a usable registrar session, credential, or transfer code that this detector does not establish. The normal standalone match creates bounded reconnaissance risk for the domain owner, with public registrar guidance and renewal documentation producing legitimate occurrences. Risk 5 OFFICIAL is appropriate for the phrase-level signal; an actual EPP code or active registrar credential would require a separate SENSITIVE assessment.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, and OFFICIAL DLM because the detector identifies registrar and
    transfer topics but no authentication value. SENSITIVE is not met without a complete active credential, code, target
    account, or other material evidence enabling direct domain control.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic handling is Low with Low controls for registrar-topic terminology, while a validated transfer code,
      password, or session should be escalated immediately. Medium classification would overstate public guidance and
      routine renewal records that contain no secret.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_registrar_cred_primary
      matches:
        - ref: Regex_registrar_cred_credential_field
          min_count: 2
          unique_results: true
        - ref: Regex_registrar_cred_managed_domain
        - ref: Keyword_registrar_cred_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_registrar_cred_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_registrar_cred_primary
      matches:
        - type: any
          refs:
            - Regex_registrar_cred_credential_field
            - Regex_registrar_cred_managed_domain
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_registrar_cred_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_registrar_cred_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_registrar_cred_primary
      pattern: >-
        (?i)\b(?:domain\s+registrar(?:\s+(?:account|login|portal))?|registrar\s+(?:account|portal|login|credentials)|domain\s+(?:transfer|auth(?:orization)?)\s+code|EPP\s+(?:code|key)|auth[\s-]?info\s+code)\b
    - id: Regex_registrar_cred_credential_field
      pattern: >-
        (?i)\b(?:username|user\s*name|login|account\s+(?:ID|no\.?|number)|customer\s+(?:ID|no\.?|number)|password|passphrase|PIN|security\s+(?:PIN|answer)|API\s+(?:key|secret)|EPP\s+code|auth(?:orization)?\s+code|transfer\s+code)\s*[:=]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[^\s]{4,64}
    - id: Regex_registrar_cred_managed_domain
      pattern: >-
        (?i)\b[a-z0-9-]{1,63}\.(?:com\.au|net\.au|org\.au|gov\.au|edu\.au|com|net|org|io|co|au)\b
  keywords:
    - id: Keyword_registrar_cred_context
      groups:
        - match_style: word
          terms:
            - renewal
            - expiry
            - nameservers
            - registrant
            - text: WHOIS
              case_sensitive: true
            - text: DNS
              case_sensitive: true
            - two-factor
            - auDA
            - GoDaddy
            - Namecheap
      strength: specific
    - id: Keyword_registrar_cred_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - guidance note
            - best practice guide
            - media release
            - press release
            - news report
            - course module
            - learning objectives
            - awareness course
            - webinar
            - lesson plan
            - quiz question
      strength: domain
