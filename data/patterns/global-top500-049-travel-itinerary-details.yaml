schema: testpattern/v1
name: Travel itinerary details
slug: global-top500-049-travel-itinerary-details
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to travel itinerary details in Australian contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?is)\b(?:travel\s+itinerary\s+details|travel\s+itinerary|flight\s+booking|booking\s+reference|passenger\s+name\s+record|hotel\s+reservation|accommodation\s+booking|trip\s+details|travel\s+plan)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - travel itinerary details
    - travel
    - itinerary
    - details
    - contact
    - location
    - data
  proximity: 300
test_cases:
  should_match:
    - value: travel itinerary details
      description: Primary topic phrase match
    - value: travel itinerary
      description: Case-insensitive topic phrase match
    - value: flight booking
      description: Alternative topic phrase match
    - value: booking reference
      description: Additional topic phrase match
    - value: |-
        Travel itinerary details: Recorded
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: address mac
      description: Generic word pair from old broad template should not match
    - value: |-
        Travel itinerary details:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about travel itinerary details are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Travel itinerary details:
        Name: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Common words and phrases related to travel itinerary details appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_049_travel_itinerary_details_populated_label
      matches:
        - ref: Regex_global_top500_049_travel_itinerary_details_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_049_travel_itinerary_details_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_travel_itinerary
      matches:
        - ref: Evidence_travel_itinerary
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_travel_itinerary
  regexes:
    - id: Pattern_travel_itinerary
      pattern: >-
        (?is)\b(?:travel\s+itinerary\s+details|travel\s+itinerary|flight\s+booking|booking\s+reference|passenger\s+name\s+record|hotel\s+reservation|accommodation\s+booking|trip\s+details|travel\s+plan)\b
    - id: Pattern_au_top500_049_travel_itinerary_details_label_context
      pattern: (?i)\b(?:travel\s+itinerary\s+details)\b
    - id: Regex_global_top500_049_travel_itinerary_details_populated_label
      pattern: (?i)\b(?:\b(?:travel\s+itinerary\s+details|travel\s+itinerary|flight\s+booking|booking\s+reference|passenger\s+name\s+record|hotel\s+reservation|accommodation\s+booking|trip\s+details|travel\s+plan)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_global_top500_049_travel_itinerary_details_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_travel_itinerary
      groups:
        - match_style: word
          terms:
            - text: PNR
              case_sensitive: true
      strength: specific
    - id: Keyword_au_top500_049_travel_itinerary_details_domain_context
      groups:
        - match_style: word
          terms:
            - travel itinerary details
            - travel
            - itinerary
      strength: domain
risk_description: >-
  The Travel itinerary details concept regex matches wording such as travel itinerary, flight booking, booking reference, hotel reservation, or travel plan. It does not require a passenger, date, destination, booking code, or sequence of movements, so generic travel forms and guidance can trigger it. A completed itinerary linked to a person could reveal absence windows and enable targeting or interception, but the phrase-only hit has no actionable journey. Risk 4 and OFFICIAL reflect the contextual cue, with a person-linked schedule containing times and locations setting the SENSITIVE threshold.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 4 with PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM and Low tier fits travel itinerary, flight booking or hotel
    reservation wording with no required passenger, date, destination or booking code. SENSITIVE is not met because the
    phrase gives no actionable journey; a person-linked schedule revealing absence windows would.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low handling fits travel wording; an identified traveller's dated itinerary exposes future movements and
      would warrant Medium.
created: '2026-02-08'
updated: '2026-10-19'
changelog:
  - version: 1.5.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_049_travel_itinerary_details_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (PNR); 85 requires the populated field plus a populated person/client field (Regex_global_top500_049_travel_itinerary_details_record_structure). Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (departure, arrival). Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.4.4
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had a rationale written for an earlier
      risk rating, a tier that did not follow its label).
  - version: 1.4.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 652 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.3.0
    date: '2026-07-04'
    description: case/evidence metadata update
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
