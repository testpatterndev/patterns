  date: '2026-09-24'
  description: 'Quality pass (2026-09-24): primary narrowed to settings/configuration wording (bare remote access, SSH access, jump server removed); self-corroboration removed; 75 needs a remote-tool configuration line or populated access field; 85 needs two config lines, an access field and access-control context; guidance exclusion; populated tests and decoys; GDPR replaced with SOCI Act and Criminal Code Act 1995 (Cth); frameworks and ISM reference added; credentials category removed.'
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1861 without changing detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
