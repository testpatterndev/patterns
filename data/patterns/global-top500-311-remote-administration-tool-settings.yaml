schema: testpattern/v1
name: Remote administration tool settings
slug: global-top500-311-remote-administration-tool-settings
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects remote administration tool settings: RDP connection files, TeamViewer/AnyDesk configuration, sshd directives and populated gateway/jump-host/access-password fields. Topic wording alone is discovery-only.
operation: >-
  Regex_remote_admin_primary (remote administration/access/support tool settings, RDP/VNC configuration or named remote tool configuration wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a remote-tool configuration line (RDP file keys, TeamViewer/AnyDesk ID, AnyDesk password hash, sshd directives) or a populated access field (host, gateway, jump host/bastion, port, access password, allowed users/IPs, session recording). 85 requires a remote-tool configuration line (RDP file keys, TeamViewer/AnyDesk ID, AnyDesk password hash, sshd directives) (two distinct hits), a populated access field (host, gateway, jump host/bastion, port, access password, allowed users/IPs, session recording), and independent remote-access-control (unattended access, MFA, allowlist, vendor access) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_remote_admin_guidance_exclusion).
pattern: >-
  (?i)\b(?:remote\s+(?:administration|access|support|management)\s+(?:tool|software|configuration|settings|policy)|RDP\s+(?:settings|configuration|file|connection\s+file)|VNC\s+(?:settings|configuration)|(?:TeamViewer|AnyDesk|ScreenConnect|Splashtop|BeyondTrust|Bomgar|RustDesk|LogMeIn)\s+(?:settings|configuration|deployment|policy|console))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a remote-tool configuration line (RDP file keys, TeamViewer/AnyDesk ID, AnyDesk password hash, sshd directives) or a populated access field (host, gateway, jump host/bastion, port, access password, allowed users/IPs, session recording)), and 85 needs two distinct structures plus independent remote-access-control (unattended access, MFA, allowlist, vendor access) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- SOCI Act 2018 (Cth)
- Criminal Code Act 1995 (Cth)
frameworks:
- ISO 27001
- NIST CSF
- CIS Controls
data_categories:
- security
corroborative_evidence:
  keywords:
  - unattended access
  - MFA
  - allowlist
  - firewall rule
  - third-party support
  - vendor access
  - session timeout
  - clipboard
  - file transfer
  - privileged
  proximity: 300
test_cases:
  should_match:
  - value: Remote access tool settings are managed by the service desk.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      RDP connection file for the finance jump host
      full address:s:jump01.harbour.internal:3389
    description: Medium-tier probe (75) - one RDP configuration line
    synthetic: true
  - value: |-
      RDP connection file - vendor support
      full address:s:jump01.harbour.internal:3389
      username:s:HARBOUR\svc_vendor
      gatewayhostname:s:rdgw.harbour.com.au
      Allowed IPs: 203.0.113.0/24
      Unattended access enabled for third-party support; MFA not enforced on the gateway.
    description: High-tier probe (85) - several config lines, access field and control context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: remote access tools must be approved by ICT Security and use MFA.'
    description: Policy text
    synthetic: true
  - value: |-
      Remote access configuration template
      Gateway: ________
      Access password: [insert]
    description: Blank template
    synthetic: true
  - value: 'Course module 7: RDP file settings such as full address:s:server01:3389 explained.'
    description: Training framing
    synthetic: true
false_positives:
- description: Vendor knowledge-base articles show RDP and sshd settings.
  mitigation: Guidance/training framing is excluded; 85 needs two config lines plus populated access fields.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The detector now requires remote-tool settings wording plus configuration lines (RDP keys, remote-tool IDs, sshd directives) or populated access fields before enforcing. A genuine settings record can reveal enabled protocols, management entry points, trusted intermediaries, and monitoring choices that support targeted access attempts or defence evasion. The normal scope is one remote-management environment and its administrators or users, while public setup guides and architecture documents can match the same terms. Risk 8 SENSITIVE reflects serious contained access-path exposure; PROTECTED would require usable credentials, critical administrative reach, or significant broad compromise.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_remote_admin_primary
    matches:
    - ref: Regex_remote_admin_config_line
      min_count: 2
      unique_results: true
    - ref: Regex_remote_admin_access_field
    - ref: Keyword_remote_admin_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_remote_admin_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_remote_admin_primary
    matches:
    - type: any
      refs:
      - Regex_remote_admin_config_line
      - Regex_remote_admin_access_field
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_remote_admin_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_remote_admin_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_remote_admin_primary
    pattern: >-
      (?i)\b(?:remote\s+(?:administration|access|support|management)\s+(?:tool|software|configuration|settings|policy)|RDP\s+(?:settings|configuration|file|connection\s+file)|VNC\s+(?:settings|configuration)|(?:TeamViewer|AnyDesk|ScreenConnect|Splashtop|BeyondTrust|Bomgar|RustDesk|LogMeIn)\s+(?:settings|configuration|deployment|policy|console))\b
  - id: Regex_remote_admin_config_line
    pattern: >-
      (?i)\bfull\s+address:s:[A-Za-z0-9.:-]{3,100}|\busername:s:[A-Za-z0-9\\@._-]{2,100}|\bpassword\s+51:b:[0-9A-F]{16,512}|\bgatewayhostname:s:[A-Za-z0-9.-]{3,100}|\b(?:TeamViewer|AnyDesk)\s+ID\s*[:=]?\s*\d(?:[\s-]?\d){8,11}\b|\bad\.anynet\.pwd_hash\s*=|\bSecurityPasswordAES\b|\b(?:PermitRootLogin|PasswordAuthentication|AllowUsers|ListenAddress)\s+[A-Za-z0-9._@*-]{2,60}
  - id: Regex_remote_admin_access_field
    pattern: >-
      (?i)\b(?:host(?:name)?|server|gateway|jump\s+(?:host|server)|bastion|port|listen(?:ing)?\s+port|unattended\s+access\s+password|access\s+password|allowed\s+(?:users|IPs?)|session\s+recording)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  keywords:
  - id: Keyword_remote_admin_context
    groups:
    - match_style: word
      terms:
      - unattended access
      - text: MFA
        case_sensitive: true
      - allowlist
      - firewall rule
      - third-party support
      - vendor access
      - session timeout
      - clipboard
      - file transfer
      - privileged
    strength: specific
  - id: Keyword_remote_admin_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
created: '2026-02-08'
