updated: '2026-10-30'
changelog:
  - version: 1.1.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.0.0
    date: '2026-10-20'
    description: >-
      Initial release (qgfin sector review gap). Anchors on payment lines - ABA type 1 detail records, delimited
      BSB / account / amount rows and labelled BPAY biller code / CRN lines. 75 needs a control record, payment-file
      header or payment-file context; 85 needs three distinct payment lines, a control record or header and context.
      Specification / guidance framing and template framing are excluded on enforce tiers.
