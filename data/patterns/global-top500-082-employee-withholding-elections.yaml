schema: testpattern/v1
name: Employee withholding elections
slug: global-top500-082-employee-withholding-elections
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects completed employee tax withholding declarations and elections: ATO Tax file number declaration (NAT 3092) and withholding declaration (NAT 3093), US Form W-4 and UK starter checklist, with the payee identified and a TFN/SSN, residency or tax-free threshold answer, filing status or payer ABN.
operation: >-
  Primary: a withholding form phrase (TFN declaration, withholding declaration, NAT 3092/3093, Form W-4, employee withholding certificate/election, starter checklist). 75 tier requires a populated person field (payee or employee name, surname/family name, given name, full name, employee number) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated tax detail (labelled TFN or SSN value, answered residency / tax-free threshold / study loan question, filing status, or payer ABN) and an independent corroborative term (payer, signature, Australian Taxation Office, ATO, IRS). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:(?:TFN|tax\s+file\s+number)\s+declaration|withholding\s+declaration|NAT\s?309[23]|Form\s+W-4|employee(?:'s)?\s+withholding\s+(?:certificate|allowance\s+certificate|election)s?|withholding\s+elections?|starter\s+checklist)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Taxation Administration Act 1953 (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - pii
  - employment
corroborative_evidence:
  keywords:
    - payer
    - signature
    - Australian Taxation Office
    - ATO
    - IRS
    - HMRC
    - PAYG
    - residency
    - dependents
    - payroll
  proximity: 300
test_cases:
  should_match:
    - value: "Tax file number declaration (NAT 3092)\nSurname or family name: Teston\nFirst given name: Avery\nTax file number: 123 456 782\nAre you an Australian resident for tax purposes? Yes\nDo you want to claim the tax-free threshold from this payer? Yes\nPayer ABN: 51 824 753 556"
      description: '85: Completed TFN declaration with TFN, residency and payer ABN'
      synthetic: true
    - value: "Form W-4 Employee's Withholding Certificate\nEmployee name: Morgan Teston\nSSN: 123-45-6789\nFiling status: Single\nSigned and returned to payroll for the IRS records."
      description: '85: Completed W-4 with SSN and filing status'
      synthetic: true
    - value: "Withholding declaration\nPayee name: Jordan Staffson\nVariation to withholding lodged with payroll this week."
      description: '75: Withholding declaration naming the payee, no TFN or answers'
      synthetic: true
  should_not_match:
    - value: Give a TFN declaration to your new payer. This fact sheet explains when to claim the tax-free threshold and how withholding works.
      description: Fact sheet - must stay below 75
    - value: "Tax file number declaration\nSurname or family name: __________\nTax file number: ___ ___ ___\nPayer ABN: __________"
      description: Blank form - must stay below 75
    - value: The ATO reminded employers in a media release that TFN declaration forms must be kept for 7 years.
      description: News / media release - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: payroll reimbursement
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_082_employee_withholding_elections_primary
      matches:
        - ref: Regex_top500_082_employee_withholding_elections_person_field
        - ref: Regex_top500_082_employee_withholding_elections_record_detail
        - ref: Keyword_top500_082_employee_withholding_elections_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_082_employee_withholding_elections_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_082_employee_withholding_elections_primary
      matches:
        - ref: Regex_top500_082_employee_withholding_elections_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_082_employee_withholding_elections_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_082_employee_withholding_elections_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_082_employee_withholding_elections_primary
      pattern: >-
        (?i)\b(?:(?:TFN|tax\s+file\s+number)\s+declaration|withholding\s+declaration|NAT\s?309[23]|Form\s+W-4|employee(?:'s)?\s+withholding\s+(?:certificate|allowance\s+certificate|election)s?|withholding\s+elections?|starter\s+checklist)\b
    - id: Regex_top500_082_employee_withholding_elections_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit|payee|(?:payee|employee)(?:'s)?\s+(?:full\s+)?name|surname(?:\s+or\s+family\s+name)?|family\s+name|(?:first\s+)?given\s+names?|full\s+name|first\s+name)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_082_employee_withholding_elections_record_detail
      pattern: >-
        (?i)\b(?:tax\s+file\s+number|TFN)\s*(?:\([^)]{1,20}\))?\s*[:#]?\s*\d{3}\s?\d{3}\s?\d{2,3}\b|\b(?:claim(?:ing)?\s+the\s+tax[\s-]+free\s+threshold|Australian\s+resident\s+for\s+tax\s+purposes|foreign\s+resident|working\s+holiday\s+maker|(?:HELP|STSL|SFSS)\s+debt|study\s+and\s+training\s+support\s+loan)[^\n]{0,40}?\b(?:yes|no)\b|\b(?:filing\s+status|marital\s+status)\s*[:\-]\s*(?:single|married|head\s+of\s+household)|\b(?:SSN|social\s+security\s+(?:no\.?|number))\s*[:#]?\s*\d{3}-\d{2}-\d{4}\b|\b(?:payer|employer)(?:'s)?\s+ABN\s*[:#]?\s*\d{2}\s?\d{3}\s?\d{3}\s?\d{3}\b
  keywords:
    - id: Keyword_top500_082_employee_withholding_elections_corroborative
      groups:
        - match_style: word
          terms:
            - payer
            - signature
            - Australian Taxation Office
            - text: ATO
              case_sensitive: true
            - text: IRS
              case_sensitive: true
            - text: HMRC
              case_sensitive: true
            - text: PAYG
              case_sensitive: true
            - residency
            - dependents
            - payroll
      strength: specific
    - id: Keyword_top500_082_employee_withholding_elections_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a completed tax withholding declaration or election (TFN declaration, withholding declaration, W-4, starter checklist) about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). A completed declaration combines an identifiable employee's tax file number or SSN with residency and tax status; misuse enables tax and identity fraud. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 4 supports OFFICIAL.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: ATO - Tax file number declaration (NAT 3092)
    url: https://www.ato.gov.au/forms-and-instructions/tfn-declaration
  - title: Taxation Administration Act 1953 (Cth)
    url: https://www.legislation.gov.au/C1953A00001/latest/text
