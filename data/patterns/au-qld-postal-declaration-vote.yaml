schema: testpattern/v1
name: Queensland Postal Vote Application or Declaration Envelope Record
slug: au-qld-postal-declaration-vote
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Elector-level postal and declaration voting records held by ECQ and returning officers: postal vote applications (Electoral Act 1992 (Qld) s 119, which require the address to which ballot papers are to be sent), the record of posted voting papers (s 119(7)), declaration envelope records that are signed and witnessed (ss 117, 119(8)), declaration envelopes for uncertain identity (s 121), the register of special postal voters (s 68; grounds in s 114(2)), and late-vote registers. Silent electors are automatically special postal voters (s 114(2)(b)), so the special postal voter register and dispatch lists hold silent-elector addresses. Declaration envelopes are stored for at least a year (s 136). Local government elections have parallel provisions (LGEA 2011 ss 21A, 79, 81, 82). The ECQ postal voting web page, the declaration envelope count procedure, postal vote statistics and blank forms are decoys.
operation: >-
  Primary: postal vote / votes / voting / voter / voters (optionally followed by application, request, register, record, pack, papers, certificate or status), application for a postal vote, declaration envelope(s), declaration vote(s), special or general postal voter(s), register of special postal voters, posted voting papers, or late vote(s). 75 requires, within 300 characters, a populated elector name field (elector, voter, applicant, name, full name or name of elector followed by a name of two or more capitalised words, or surname / family name followed by a capitalised word) AND one application or declaration structure: a populated address field (residential, postal, enrolled, home, mailing, dispatch, overseas or temporary address, or the address to which ballot papers are to be sent, followed by a street number and name or a PO Box), a populated declaration field (witness name, a signed / witnessed / declaration / envelope status such as signed, witnessed, accepted, rejected or admitted, a special postal voter status, or a special postal voter ground), or the silent-elector corroborator (silent elector, silent enrolment). 85 requires a name field AND an address field AND a declaration field or the silent-elector corroborator AND a populated date field (date received, signed, witnessed, sent, dispatched, issued, posted, returned, processed or registered, followed by a date). Values must be on the same line as their label and are placeholder-guarded. All tiers AND NOT the shared template-exclusion dictionary; enforce tiers also exclude guidance wording (frequently asked questions, fact sheet, how to apply for a postal vote, you can apply for a postal vote, legislation.qld.gov.au). 65 is discovery-only. The silent-elector corroborator does not raise the label here; au-qld-silent-elector-record carries the PROTECTED label and should be deployed alongside so a silent elector's postal record is escalated.
pattern: >-
  (?i)\b(?:postal\s+vot(?:e|es|ing|er|ers)(?:\s+(?:application|applications|request|register|record|pack|papers?|certificate|status))?|application\s+for\s+(?:a\s+)?postal\s+vote|declaration\s+(?:envelopes?|votes?)|register\s+of\s+special\s+postal\s+voters|posted\s+voting\s+papers|late\s+votes?)\b
confidence: medium
confidence_justification: >-
  Medium. Postal and declaration vote wording is common in ECQ and AEC guidance, count procedures and statistics, so enforce tiers need a populated elector name plus a populated address, declaration or silent-elector structure. The ECQ postal vote application form field labels are UNVERIFIED (the AEC EF048 form is an image), so the field regexes use general labels plus the verified s 119(3)(c) wording. Elector identifying numbers have no published format and are not used. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Electoral Act 1992 (Qld)
  - Local Government Electoral Act 2011 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - contact-information
  - government
corroborative_evidence:
  keywords:
    - declaration envelope
    - special postal voter
    - witness
    - ballot papers
    - silent elector
    - returning officer
    - electoral district
  proximity: 300
test_cases:
  should_match:
    - value: "Declaration envelope record - 2026 State election, electoral district of Gregory\nElector: Casey Teston\nEnrolled address: 4 Mulga Street, Longreach QLD 4730\nDeclaration status: signed\nWitnessed by: Dana Staffson\nDate received: 26/10/2026"
      description: Signed and witnessed declaration envelope record (85 tier)
      synthetic: true
    - value: "Register of special postal voters - electoral district of Warrego\nName: Morgan Teston\nResidential address: 118 Station Road, Charleville QLD 4470\nGround: more than 15 km from polling booth\nDate registered: 03/03/2026"
      description: Special postal voter register entry with ground and date (85 tier)
      synthetic: true
    - value: "Special postal voter - silent elector. Postal voting papers dispatched automatically at issue of the writ.\nElector: Riley Teston\nPostal address: PO Box 2291, Mackay QLD 4740\nDate dispatched: 07/10/2026"
      description: Silent elector's automatic postal dispatch (85 tier via the silent-elector corroborator; au-qld-silent-elector-record carries PROTECTED)
      synthetic: true
    - value: "Postal vote application received online.\nApplicant name: Jordan Teston\nAddress to which ballot papers are to be sent: 12 Fig Tree Lane, Nambour QLD 4560"
      description: Postal vote application with a dispatch address, no declaration or date (75 tier)
      synthetic: true
    - value: "Late votes register - declaration envelopes received after close of postal voting\nElector: Avery Teston | Witness: Sam Staffson"
      description: Late-vote register line with elector and witness names (75 tier)
      synthetic: true
  should_not_match:
    - value: "Postal voting. Special postal voters, silent electors and full postal ballots receive their materials automatically. Your declaration envelope must be signed and witnessed: you sign here, and your witness signs here. Late votes are recorded and stored."
      description: ECQ postal voting web page text (65 only)
    - value: "Preliminary processing of declaration envelopes: the returning officer checks that each envelope is signed and witnessed, removes the ballot papers without unfolding them and places them in a ballot box for counting. Scrutineers may observe."
      description: Declaration envelope count procedure (65 only)
    - value: "Postal votes issued: 812,405. Postal votes returned: 690,112. Declaration envelopes rejected: 3,881 (not witnessed). Late votes: 1,204."
      description: Aggregate postal vote statistics (65 only)
    - value: "Postal vote application\nName: __________\nAddress to which ballot papers are to be sent: __________\nSignature: __________  Date: __/__/____"
      description: Blank postal vote application form (65 only)
    - value: "119 Making a declaration vote using posted voting papers. (3) The request must state the address to which the ballot paper is to be sent. (7) The commission must keep a record of the ballot papers sent."
      description: Electoral Act s 119 text (65 only)
false_positives:
  - description: ECQ and AEC postal voting guidance, candidate how-to-vote material and news that describe postal applications, declaration envelopes and witnessing.
    mitigation: Enforce tiers need a populated elector name plus a populated address, declaration or silent-elector structure; guidance carries no values. A guidance exclusion suppresses FAQ and fact sheet text.
  - description: Count procedures, returning officer manuals and postal vote statistics.
    mitigation: These lack populated elector name fields and stay at 65.
  - description: Party-run postal vote application mail-outs that pre-fill an elector's name and address.
    mitigation: These reach 75 and are in scope, because they are elector-level roll-derived records. Deploy at 85 if the volume is a concern.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_postal_declaration_vote_primary
      matches:
        - ref: Regex_au_qld_postal_declaration_vote_name_field
        - ref: Regex_au_qld_postal_declaration_vote_address_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_postal_declaration_vote_declaration_field
            - Keyword_au_qld_postal_declaration_vote_silent_elector
        - ref: Regex_au_qld_postal_declaration_vote_date_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_postal_declaration_vote_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_postal_declaration_vote_primary
      matches:
        - ref: Regex_au_qld_postal_declaration_vote_name_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_postal_declaration_vote_address_field
            - Regex_au_qld_postal_declaration_vote_declaration_field
            - Keyword_au_qld_postal_declaration_vote_silent_elector
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_postal_declaration_vote_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_postal_declaration_vote_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_postal_declaration_vote_primary
      pattern: >-
        (?i)\b(?:postal\s+vot(?:e|es|ing|er|ers)(?:\s+(?:application|applications|request|register|record|pack|papers?|certificate|status))?|application\s+for\s+(?:a\s+)?postal\s+vote|declaration\s+(?:envelopes?|votes?)|register\s+of\s+special\s+postal\s+voters|posted\s+voting\s+papers|late\s+votes?)\b
    - id: Regex_au_qld_postal_declaration_vote_name_field
      pattern: >-
        (?i)\b(?:(?:(?:elector|voter|applicant)(?:'?s)?(?:\s+(?:full\s+)?name)?|(?:full\s+)?name|name\s+of\s+(?:the\s+)?(?:elector|voter|applicant))[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|given|family|surname|first|middle|other|previous|date|address|signature|title|gender|occupation)\b|_{2,}|\[|<)(?:(?:Mr|Mrs|Ms|Miss|Mx|Dr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:family\s+name|surname)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|given|family|first|middle|other|previous|date|address|signature|title|gender|occupation)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30})
    - id: Regex_au_qld_postal_declaration_vote_address_field
      pattern: >-
        (?i)\b(?:(?:(?:current|previous|new|temporary)\s+)?(?:(?:residential|postal|enrolled|home|street|mailing|dispatch|delivery|overseas)\s+)?address|address\s+(?:for|to\s+which)\s+(?:the\s+)?ballot\s+papers?(?:\s+(?:are|is)\s+to\s+be\s+sent)?)[ \t]*[:#][ \t]{0,5}(?:(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:PO|P\.O\.|GPO|Locked)[ \t]+(?:Box|Bag)[ \t]+\d{1,6})
    - id: Regex_au_qld_postal_declaration_vote_declaration_field
      pattern: >-
        (?i)\b(?:(?:witness(?:'s)?|witnessed\s+by)(?:\s+(?:full\s+)?name)?[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|signature|date|yes|no)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:declaration|envelope|signature|witness(?:ed)?|signed)(?:\s+(?:status|outcome|result|check))?[ \t]*[:#][ \t]{0,5}(?:yes|signed|unsigned|witnessed|not\s+witnessed|accepted|rejected|admitted|excluded|valid|invalid)\b|(?:special\s+postal\s+voter|SPV)(?:\s+(?:status|ground|grounds|category|reason|type|flag))?[ \t]*[:#][ \t]{0,5}(?:yes|active|registered|silent\s+elector|remote|general\s+postal\s+voter)\b|(?:ground|grounds|category|eligibility)[ \t]*[:#][ \t]{0,5}(?:silent\s+elector|remote|(?:more\s+than\s+)?\d{2}[ \t]?km|illness|infirmity|disability|general\s+postal\s+voter|overseas|interstate|seriously\s+ill|approaching\s+childbirth|religious|detained|prisoner))
    - id: Regex_au_qld_postal_declaration_vote_date_field
      pattern: >-
        (?i)\b(?:date(?:\s+(?:received|signed|witnessed|sent|dispatched|issued|posted|returned|processed|registered|of\s+(?:application|receipt|declaration|dispatch)))?|received|dispatched|issued|registered|signed(?:\s+on)?|witnessed(?:\s+on)?|returned)[ \t]*[:#]?[ \t]{0,5}(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}[ \t]+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}[ \t]+\d{4}|(?:19|20)\d{2}-\d{2}-\d{2})\b
    - id: Regex_au_qld_postal_declaration_vote_guidance_exclusion
      pattern: >-
        (?i)\b(?:frequently\s+asked\s+questions|fact\s?sheet|how\s+to\s+apply\s+for\s+a\s+postal\s+vote|you\s+can\s+apply\s+for\s+a\s+postal\s+vote|legislation\.qld\.gov\.au)\b
  keywords:
    - id: Keyword_au_qld_postal_declaration_vote_silent_elector
      groups:
        - match_style: word
          terms:
            - silent elector
            - silent electors
            - silent enrolment
            - silent elector status
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier identifies an elector-level postal vote application, declaration envelope record, special postal voter register entry or late-vote register line that ties a named elector to a residential or dispatch address, witness details and dates. The records reveal where an elector is (often a temporary, remote or overseas address), why they cannot attend a polling booth (distance, illness, infirmity, religious belief, detention) and whether and when their vote arrived. Silent electors are automatically special postal voters (Electoral Act s 114(2)(b)), so the special postal voter register and dispatch lists hold suppressed addresses; when the silent-elector wording co-occurs with an address, au-qld-silent-elector-record carries the PROTECTED Personal-Privacy label and should take precedence. Guidance, count procedures, statistics and blank forms are excluded from enforce tiers. Risk 7 supports the roll-derived SENSITIVE Electoral Roll label.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Electoral Roll
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Electoral Roll and Medium because the record
    ties an elector to a dispatch address, witness and the reason they cannot attend, such as illness or detention.
    PROTECTED is not met for ordinary postal voters; special postal voter entries that expose silent electors escalate
    to the silent elector pattern.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling applies to an elector's temporary address and absence reason. High applies where
      a silent elector's address is exposed.
references:
  - title: Electoral Act 1992 (Qld) - ss 68, 114, 117, 119, 121, 125, 136
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1992-028
  - title: Local Government Electoral Act 2011 (Qld) - ss 21A, 79, 81, 82
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-2011-027
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release. Postal vote applications, declaration envelope records, special postal voter register entries and late-vote registers, anchored on Electoral Act ss 68, 114, 119 and 121. 75 requires a populated elector name plus an address, declaration or silent-elector structure; 85 requires name + address + declaration or silent-elector wording + a date. Guidance, count procedures, statistics and blank forms stay at 65.
