schema: testpattern/v1
name: Queensland Electoral Roll Extract or Copy
slug: au-qld-electoral-roll-extract
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Extracts and copies of the Queensland electoral roll or a council voters roll: the certified copies and electronic roll data that the Electoral Commission of Queensland (ECQ) must give candidates, registered political parties, members of the Legislative Assembly and local governments (Electoral Act 1992 s 61; Local Government Electoral Act 2011 s 21), and AEC Electoral Roll Access (ERA) data files. The roll holds each elector's surname, given names, address, sex, occupation, date of birth, identifying number and enrolment date (s 58(3); Electoral Regulation 2024 s 3). Only name and address are in the publicly available part (sch 1; Regulation s 5), so a copy that carries date of birth, sex, occupation, enrolment date or an elector ID is restricted information whose misuse is an offence (s 177; Commonwealth Electoral Act 1918 s 91B). Enrolment figures, public inspection guidance, party and candidate registers and fact sheets are decoys.
operation: >-
  Primary: electoral / voters / council voters roll, roll extract / data / changes / copy / download, certified copy or list of the roll or of voters, elector ID / identifying number, electoral district / division, or ERA extract / download / data file. 65 is discovery-only (primary alone) and surfaces guidance, fact sheets and enrolment statistics. 75 requires, within 300 characters, at least two different elector rows: a delimited surname and given names followed by a street address (tab, comma, pipe, semicolon or a run of spaces between columns, as in a printed or exported roll). 85 additionally requires a populated non-public field, either on an elector row (a date of birth or enrolment date, or a single-letter sex code, in a column after the address) or as a labelled field (date of birth, enrolment date, sex / gender, occupation or elector ID with a non-placeholder value), or an AEC ERA data-file name (EX<nn>_C<nnnn>_<8 digits>_<STATE>_<DIVISION>.txt/.zip), plus an independent electoral context term. The elector ID has no published format, so it is a loose digit-bearing label value. Every tier excludes template/fixture text; enforce tiers also exclude fact-sheet, FAQ, legislation-site and "how to enrol / check your enrolment / you can inspect" guidance wording.
pattern: >-
  (?i)\b(?:(?:electoral|voters'?|council\s+voters'?)\s+rolls?|roll\s+(?:extracts?|data|changes|copy|download)|certified\s+(?:copy|list)\s+of\s+(?:the\s+)?(?:electoral\s+|voters'?\s+)?(?:roll|voters)|elector\s+(?:ID|identifying\s+number)|electoral\s+(?:district|division)|ERA\s+(?:extract|download|data\s+files?))\b
confidence: medium
confidence_justification: >-
  Medium: roll wording is common in guidance, statistics and news, so enforce tiers need at least two delimited name-and-street-address rows. The 85 tier's non-public column (date of birth, sex, occupation, enrolment date, elector ID) follows s 58(3) and Regulation 2024 s 5, but ECQ and AEC extract column headers are not published (the ERA column list is an image), so the row shapes are generic and a customer CRM or membership export with DOB columns next to a roll phrase could reach 85. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Electoral Act 1992 (Qld)
  - Electoral Regulation 2024 (Qld)
  - Local Government Electoral Act 2011 (Qld)
  - Commonwealth Electoral Act 1918 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government
corroborative_evidence:
  keywords:
    - elector
    - enrolled
    - electorate
    - division
    - district
    - ward
    - candidate
    - Electoral Commission
    - ECQ
    - AEC
    - Electoral Act
  proximity: 300
customisation:
  - key: elector-identifying-number
    kind: identifier-format
    identifier: elector-identifying-number
    target: purview.regexes/Regex_au_qld_electoral_roll_extract_restricted_field
    mode: extend
    affects_tiers:
      - 85
    required_for_enforcement: false
    note: >-
      Extend the populated-field evidence with the customer's elector identifying number format (see docs/identifiers.md#elector-identifying-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Electoral roll extract - Stafford electoral district (certified copy supplied to candidate, Electoral Act 1992 s 61)\nSurname\tGiven names\tAddress\tSuburb\tPostcode\tDate of birth\tSex\tOccupation\tEnrolment date\nTESTON\tAvery James\t14 Wattlebird Street\tSTAFFORD\t4053\t12/03/1981\tF\tNurse\t02/05/2003\nTESTON\tMorgan Lee\t27 Carrington Avenue\tSTAFFORD\t4053\t04/07/1990\tM\tElectrician\t15/08/2008\nSTAFFSON\tRiley\t8 Sandpiper Court\tGRANGE\t4051\t21/11/1975\tF\tTeacher\t01/02/1994"
      description: Tab-delimited roll extract with DOB, sex, occupation and enrolment date columns populated (85 tier)
      synthetic: true
    - value: "Roll data file EX26_C0183_20260901_QLD_BRISBANE.txt received from the AEC and loaded to the campaign database.\nTeston\tAvery\t14 Wattlebird Street\tSTAFFORD QLD 4053\tBrisbane\nTeston\tJordan\t3 Harlow Road\tLOGAN CENTRAL QLD 4114\tRankin\nStaffson\tCasey Anne\t19 Kestrel Close\tNORMAN PARK QLD 4170\tBrisbane"
      description: Rows accompanied by an AEC ERA data-file name (85 tier)
      synthetic: true
    - value: "Certified copy of the electoral roll - Division 3, Harbourview Regional Council\nTESTON, Avery James    14 Wattlebird Street, STAFFORD 4053    12/03/1981    Nurse\nTESTON, Morgan Lee    27 Carrington Avenue, STAFFORD 4053    04/07/1990    Electrician\nSTAFFSON, Riley    8 Sandpiper Court, GRANGE 4051    21/11/1975    Teacher"
      description: Printed council roll copy with date of birth and occupation columns (85 tier)
      synthetic: true
    - value: "Voters roll for Division 3 - Harbourview Regional Council, supplied after close of nominations\nTESTON, Avery James, 14 Wattlebird Street, STAFFORD QLD 4053\nTESTON, Morgan Lee, 27 Carrington Avenue, STAFFORD QLD 4053\nSTAFFSON, Riley, 8 Sandpiper Court, GRANGE QLD 4051"
      description: Roll copy with names and addresses only (75 tier)
      synthetic: true
  should_not_match:
    - value: "Enrolment figures by electorate (Electoral Act 1992 s 63). Enrolment as at: 02/09/2026\nElectorate  Enrolment  Weighted  Deviation\nAlgester 42,096 n/a 2.33%\nAspley 38,512 n/a -6.39%\nTotal State enrolment: 3,825,969"
      description: Published enrolment figures by electorate (65 at most)
    - value: "You can inspect the publicly available part of the electoral roll free of charge at the ECQ office or a returning officer's office. The public roll shows each elector's name and address only. Sex, occupation, date of birth and enrolment date are restricted information and are not shown."
      description: Public roll inspection guidance
    - value: "Register of political parties\nParty name: Teston Community Party\nRegistered abbreviation: TCP\nRegistered officer: Avery Teston\nAddress: PO Box 4120, Stafford QLD 4053\nDeputy registered officer: Riley Staffson"
      description: Public register of political parties (PO box addresses)
    - value: "Candidates for Division 3, Harbourview Regional Council, in ballot paper order. Candidates receive the voters roll after nominations close.\nTESTON, Avery - Stafford\nSTAFFSON, Riley - Grange\nTESTON, Morgan - Grange"
      description: Candidate listing (name and locality only)
    - value: "Local Government Fact Sheet 04 - roll data for candidates. After nominations close, candidates can ask for the voters roll with the names and addresses of electors for the local government area or division. The addresses of silent electors are not released. Misuse of the voters roll is an offence under LGEA s 21(3)."
      description: LG fact sheet 04 text
    - value: "Roll extract - blank template\nSurname\tGiven names\tAddress\tDate of birth\tSex\n__________\t__________\t__________\t__/__/____\t__"
      description: Blank roll extract template
    - value: "ERA roll data files are named EX26_C0183_YYYYnnnn_STATE_DIVISION.txt and are tab-delimited; see the Data Dictionary for the column list."
      description: AEC ERA download guide text (filename pattern, no real file)
false_positives:
  - description: Published enrolment figures, public roll inspection guidance, ECQ and LG fact sheets, party and candidate registers and legislation text quoting ss 58, 61 and 177.
    mitigation: None of these carry delimited name-and-street-address rows, so they stay at 65. A guidance exclusion (fact sheet, FAQ, legislation site, how to enrol, check your enrolment, you can inspect) suppresses enforce tiers.
  - description: The publicly available roll (name and address only) copied into a document, for example an inspection printout or a candidate's canvassing list.
    mitigation: Reaches 75 by design. It is still roll data supplied for restricted purposes; deploy at 85 if only extracts with non-public fields should be blocked.
  - description: Customer, membership or mailing-list exports with surname, given names, address and DOB columns that also mention an electoral district or the electoral roll (for example an electorate office constituent list).
    mitigation: Such lists can reach 85 when an electoral context term is present. Electorate office constituent lists are often roll-derived and in scope; review before enforcing in MP offices.
  - description: Overlap with au-qld-elector-participation-data (s 133A voted / how / where data) and au-qld-silent-elector-record.
    mitigation: A s 133A dataset that also says "roll" can fire here at 75 as well; both carry SENSITIVE Electoral Roll, so the co-fire does not change the label. Silent elector rows escalate to PROTECTED through the silent elector classifier.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_electoral_roll_extract_primary
      matches:
        - ref: Regex_au_qld_electoral_roll_extract_elector_row
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_electoral_roll_extract_restricted_field
            - Regex_au_qld_electoral_roll_extract_era_filename
        - ref: Keyword_au_qld_electoral_roll_extract_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_electoral_roll_extract_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_electoral_roll_extract_primary
      matches:
        - ref: Regex_au_qld_electoral_roll_extract_elector_row
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_electoral_roll_extract_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_electoral_roll_extract_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_electoral_roll_extract_primary
      pattern: >-
        (?i)\b(?:(?:electoral|voters'?|council\s+voters'?)\s+rolls?|roll\s+(?:extracts?|data|changes|copy|download)|certified\s+(?:copy|list)\s+of\s+(?:the\s+)?(?:electoral\s+|voters'?\s+)?(?:roll|voters)|elector\s+(?:ID|identifying\s+number)|electoral\s+(?:district|division)|ERA\s+(?:extract|download|data\s+files?))\b
    - id: Regex_au_qld_electoral_roll_extract_elector_row
      pattern: >-
        \b[A-Z][A-Za-z'-]{1,30}(?:[ \t]{0,3}[\t,|;][ \t]{0,3}|[ ]{2,6})[A-Z][A-Za-z'-]{1,30}(?:[ ][A-Z][A-Za-z'-]{1,30}){0,2}(?:[ \t]{0,3}[\t,|;][ \t]{0,3}|[ ]{2,6})(?:(?:Unit|Lot|Apt|Flat)[ ])?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ ]{1,3}[A-Z][A-Za-z'-]{1,20}(?:[ ][A-Z][A-Za-z'-]{1,20}){0,2}[ ]{1,3}(?:Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Court|Ct|Crescent|Cres|Place|Pl|Parade|Pde|Terrace|Tce|Lane|Ln|Way|Close|Cl|Highway|Hwy|Boulevard|Bvd|Circuit|Cct|Grove|Gr|Esplanade|Esp)\b
    - id: Regex_au_qld_electoral_roll_extract_restricted_field
      pattern: >-
        (?i)\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ ]{1,3}[A-Z][A-Za-z'-]{1,20}(?:[ ][A-Z][A-Za-z'-]{1,20}){0,2}[ ]{1,3}(?:Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Court|Ct|Crescent|Cres|Place|Pl|Parade|Pde|Terrace|Tce|Lane|Ln|Way|Close|Cl|Highway|Hwy|Boulevard|Bvd|Circuit|Cct|Grove|Gr|Esplanade|Esp)\b[^\r\n]{0,80}?(?:[ \t]{0,3}[\t,|;][ \t]{0,3}|[ ]{2,6})(?:\d{1,2}/\d{1,2}/(?:19|20)\d{2}|(?:19|20)\d{2}-\d{2}-\d{2}|[MFX](?=[ \t]{0,3}[\t,|;\r\n]))|\b(?:(?:date\s+of\s+birth|DOB|birth\s+date|enrol(?:l)?ment\s+date|date\s+(?:of\s+)?enrol(?:l)?(?:ed|ment))\s*[:#]\s*\d{1,2}[/.-]\d{1,2}[/.-](?:19|20)\d{2}|(?:sex|gender)\s*[:#]\s*(?:male|female|M|F|X)\b|occupation\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{2,30}|elector\s+(?:ID|identifying\s+number|number|no\.?)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9-]{3,15}\b)
    - id: Regex_au_qld_electoral_roll_extract_era_filename
      pattern: >-
        \bEX\d{2}_[A-Z]\d{4}_\d{8}_(?:QLD|NSW|VIC|TAS|SA|WA|NT|ACT)_[A-Za-z]{2,30}\.(?:txt|zip)\b
    - id: Regex_au_qld_electoral_roll_extract_guidance_exclusion
      pattern: >-
        (?i)(?:\bfact\s?sheet\b|\bfrequently\s+asked\s+questions\b|\blegislation\.qld\.gov\.au\b|\bhow\s+to\s+enrol\b|\bcheck\s+your\s+enrol(?:l)?ment\b|\byou\s+can\s+inspect\b)
  keywords:
    - id: Keyword_au_qld_electoral_roll_extract_corroborative
      groups:
        - match_style: word
          terms:
            - elector
            - electors
            - enrolled
            - electorate
            - division
            - district
            - ward
            - candidate
            - close of roll
            - Electoral Commission
            - text: ECQ
              case_sensitive: true
            - text: AEC
              case_sensitive: true
            - Electoral Act
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a copy or extract of the Queensland electoral roll or a council voters roll: rows of elector names and home addresses, and at 85 the non-public fields (date of birth, sex, occupation, enrolment date, elector ID) that the Act keeps out of the public roll. These copies are supplied only to candidates, parties, MPs and councils for election purposes, and misuse is an offence (Electoral Act 1992 s 177; LGEA s 21(3); CEA s 91B). A bulk extract lets anyone locate, profile or impersonate electors. Silent elector addresses are withheld from supplied copies; an extract that includes one escalates through au-qld-silent-elector-record. Enrolment figures, guidance, registers and fact sheets are excluded from enforce tiers. Risk 8 supports SENSITIVE Electoral Roll.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Electoral Roll
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Electoral Roll and Medium because a roll copy
    carries names and addresses and often date of birth, occupation or elector ID, and misuse is an offence under s 177.
    PROTECTED is not met because silent-elector addresses are withheld from supplied copies; any that appear escalate
    through the silent elector pattern.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling applies to bulk elector names, addresses and restricted roll fields. High applies
      only where suppressed addresses are present.
references:
  - title: Electoral Act 1992 (Qld) - Part 4 Electoral rolls (ss 58, 60, 61), s 177 Misuse of restricted information
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1992-028
  - title: Electoral Regulation 2024 (Qld) - s 3 prescribed roll information, s 5 restricted information
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/sl-2024-0181
  - title: Local Government Electoral Act 2011 (Qld) - ss 19-21 voters roll
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-2011-027
  - title: Commonwealth Electoral Act 1918 - ss 90B, 91A, 91B
    url: https://www.legislation.gov.au/C1918A00027/latest/text
  - title: AEC - Electoral roll data FAQ
    url: https://www.aec.gov.au/FAQs/electoral-roll-data.htm
  - title: AEC - Downloading electoral roll data files from ERA
    url: https://www.aec.gov.au/Parties_and_Representatives/era/files/download-files-guide.pdf
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - Queensland electoral roll and council voters roll extracts; 75 gated on two delimited name-and-address rows, 85 on a populated non-public field or an ERA data-file name plus electoral context; guidance, figures and registers excluded.
