schema: testpattern/v1
name: Domestic Violence Order Application
slug: domestic-violence-order-application
version: 1.4.2
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects domestic violence order applications and conditions under the Domestic and Family Violence Protection Act 2012 (Qld). These documents contain details of aggrieved persons, respondent details, allegations of domestic violence, ouster conditions, and protection order terms. Disclosure could endanger the aggrieved person.
operation: 'Primary: Queensland DVO terminology (domestic violence order/application, protection order application or conditions, temporary protection order, ouster condition/order, police protection notice or direction). 75 tier requires a populated Qld party field (aggrieved, respondent or named person with a non-placeholder name) or a form-style name field (family name / given names, as laid out under the DV1 party headings) within 300 characters. 85 tier additionally requires one Qld anchor (DFV Protection Act 2012 reference, QPRIME occurrence number QP + 10 digits, Qld DV form number DV01-DV09, DV1 form header or version footer, SPI #, Police Occurrence #, Court File Number, or legacy DVO-YYYY-NNNNN reference) and a DVO corroborative term. All tiers exclude template/fixture text and DFV awareness, statistics, strategy and textbook material. 65 is discovery-only.'
pattern: (?i)\b(domestic\s+violence\s+(?:order|application)|DVO(?:-\d{4}-\d{3,5})?|protection\s+order\s+(?:application|conditions?)|ouster\s+(?:condition|order)|aggrieved\s+(?:person|party)|Domestic\s+and\s+Family\s+Violence\s+Protection\s+Act)\b
confidence: medium
confidence_justification: 'Medium confidence: enforce tiers require DVO terminology plus a populated aggrieved/respondent/named person field; 85 also requires a Queensland statutory, police or form anchor. Earlier versions anchored every tier on a DVO-YYYY-NNNNN reference format not found in any published Queensland court or police source.'
jurisdictions:
  - au
regulations:
- Domestic and Family Violence Protection Act 2012 (Qld)
- Police Powers and Responsibilities Act 2000 (Qld)
frameworks:
- QGISCF
data_categories:
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - SENSITIVE
    - Legal
    - domestic violence order
    - DVO
    - protection order
    - aggrieved
    - respondent
    - ouster condition
    - DFV
    - no-contact condition
    - safe contact
    - domestic violence
    - family violence
    - Magistrates Court
  proximity: 300
  keyword_lists:

    - law-enforcement

    - government-services
    - en-government-classification
test_cases:
  should_match:
    - value: 'SENSITIVE Legal. Application for Domestic Violence Order — Domestic and Family Violence Protection Act 2012 s.37. Court File Number: 4817/26. Aggrieved: Avery Teston, DOB: 03/11/1994. Respondent: Jordan Teston, DOB: 18/06/1990. Relationship: former intimate partners. Grounds: The respondent has committed acts of domestic violence as defined by s.8 of the Act, including physical violence (s.8(1)(a)), threats (s.8(1)(b)), and coercive control (s.8(1)(d)). Application by QPS officer Sgt L. Farrow.'
      description: DVO application with aggrieved and respondent details and statutory grounds
    - value: 'Domestic Violence Order — Conditions. Court File Number: 3291/26, Brisbane Magistrates Court. Respondent: Casey Teston. The respondent must: (1) Be of good behaviour towards the aggrieved and any named person. (2) Ouster condition: vacate and not return to the premises at [Address], Annerley. (3) Not approach within 100 metres of the aggrieved. (4) No-contact condition: must not contact the aggrieved by any means. (5) Surrender all weapons to police. Duration: 2 years from date of order. Breach is a criminal offence under s.177.'
      description: DVO with ouster condition, no-contact order, and weapons surrender
    - value: 'Temporary Protection Order — DFV Protection Act 2012 s.44. QPRIME QP2600051021. Issued by Ipswich Magistrates Court on ex parte application by police. Aggrieved: Morgan Teston and two children aged 4 and 7. Respondent: Riley Teston. Conditions include ouster from family home, supervised contact with children only at DFV safe contact centre, and mandatory attendance at behaviour change program. Return date: 28 March 2026 for contested hearing.'
      description: Temporary protection order with children named and supervised contact
    - value: "Police Protection Direction - QPRIME QP2600412233\nAggrieved: Jamie Teston\nRespondent: Alex Teston\nThe respondent must be of good behaviour and must not contact the aggrieved for 12 months."
      description: Queensland Police Protection Direction without a court reference number
      synthetic: true
  should_not_match:
    - value: White Ribbon Australia launched its annual campaign against domestic violence. The DFV awareness event was attended by 500 people at South Bank, Brisbane. Queensland recorded 28,000 DVO applications in 2024-25.
      description: DFV awareness campaign and published statistics
    - value: The Queensland Government published its Domestic and Family Violence Prevention Strategy 2025-2030, committing $520 million over five years to frontline services, DVO enforcement, and perpetrator programs.
      description: Published government DFV prevention strategy
    - value: A family law textbook chapter on protection orders explains the process for applying for a domestic violence order under the Domestic and Family Violence Protection Act 2012 (Qld) and describes the types of conditions available.
      description: Family law textbook explaining DVO application process
    - value: "Form DV01 Application for a protection order\nAggrieved: __________\nRespondent: __________\nDomestic and Family Violence Protection Act 2012"
      description: Blank DV01 application form
false_positives:
  - description: DFV awareness campaigns and community events
    mitigation: 'Enforce tiers require a populated party or form name field; phrase exclusion: ''awareness campaign'', ''White Ribbon'', ''prevention week'', ''community event'''
  - description: Published government DFV statistics and prevention strategies
    mitigation: 'Enforce tiers require a populated party or form name field; phrase exclusion: ''annual report'', ''prevention strategy'''
  - description: Family law textbooks explaining protection order processes
    mitigation: 'Enforce tiers require a populated party or form name field; phrase exclusion: ''textbook'''
  - description: News reporting on DFV trends without specific party details
    mitigation: 'Require proximity to specific party details or DVO reference numbers, not aggregate reporting.'
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_domestic_violence_order_application_dvo_terms
      matches:
        - type: any
          refs:
            - Pattern_domestic_violence_order_application_party_field
            - Pattern_domestic_violence_order_application_form_name_field
        - type: any
          refs:
            - Pattern_domestic_violence_order_application_dvo_reference_number
            - Pattern_domestic_violence_order_application_dfv_act_reference
            - Pattern_domestic_violence_order_application_form_anchor
        - type: any
          refs:
            - Evidence_domestic_violence_order_application_primary_keywords
            - Evidence_domestic_violence_order_application_classification_markers
            - Evidence_domestic_violence_order_application_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_domestic_violence_order_application_exclusion
    - confidence_level: 75
      id_match: Pattern_domestic_violence_order_application_dvo_terms
      matches:
        - type: any
          refs:
            - Pattern_domestic_violence_order_application_party_field
            - Pattern_domestic_violence_order_application_form_name_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_domestic_violence_order_application_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Pattern_domestic_violence_order_application_dvo_terms
          - Pattern_domestic_violence_order_application_dvo_reference_number
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_domestic_violence_order_application_exclusion
  regexes:
    - id: Pattern_domestic_violence_order_application_dvo_reference_number
      pattern: \b(?:QP\d{10}|DV0\d[A-Z]?)\b
    - id: Pattern_domestic_violence_order_application_dvo_terms
      pattern: (?i)\b(domestic\s+violence\s+(?:order|application)|protection\s+order\s+(?:application|conditions?)|ouster\s+(?:condition|order)|temporary\s+protection\s+order|police\s+protection\s+(?:notice|direction))\b
    - id: Pattern_domestic_violence_order_application_form_name_field
      pattern: >-
        (?i)\b(?:family\s+name|surname|given\s+names?|full\s+name)\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}
    - id: Pattern_domestic_violence_order_application_form_anchor
      pattern: >-
        (?i)\bForm\s+DV0?1\b|\bApplication\s+for\s+a\s+Protection\s+Order\s+-\s+version\s+\d{1,2}\b|\bSPI\s+#|\bPolice\s+Occurrence\s+#|\bCourt\s+File\s+Number\b|\bYOU\s+ARE\s+NOTIFIED\s+that\s+this\s+application\s+will\s+be\s+heard\b|\bDV01C\b
    - id: Pattern_domestic_violence_order_application_party_field
      pattern: (?i)\b(?:aggrieved(?:\s+(?:person|party))?|respondent|named\s+person)(?:\s+(?:name|details))?\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}
    - id: Pattern_domestic_violence_order_application_dfv_act_reference
      pattern: (?i)\bDomestic\s+and\s+Family\s+Violence\s+Protection\s+Act\s+2012\b
  keywords:
    - id: Evidence_domestic_violence_order_application_primary_keywords
      groups:
        - match_style: word
          terms:
            - domestic violence order
            - text: DVO
              case_sensitive: true
            - protection order application
            - protection order conditions
            - ouster condition
            - ouster order
            - temporary protection order
            - police protection notice
            - police protection direction
            - aggrieved person
            - aggrieved party
            - no-contact condition
      strength: specific
    - id: Evidence_domestic_violence_order_application_classification_markers
      groups:
        - match_style: word
          terms:
            - SENSITIVE Legal
            - DFV Protection Act 2012
            - Magistrates Court
            - ex parte application
      strength: specific
    - id: Evidence_domestic_violence_order_application_corroborative_terms
      groups:
        - match_style: word
          terms:
            - respondent
            - aggrieved
            - good behaviour
            - surrender weapons
            - safe contact centre
            - behaviour change program
            - supervised contact
            - breach
            - criminal offence
            - return date
            - contested hearing
            - coercive control
      strength: specific
    - id: Filter_domestic_violence_order_application_exclusion
      groups:
        - match_style: word
          terms:
            - awareness campaign
            - White Ribbon
            - prevention week
            - community event
            - annual report
            - prevention strategy
            - textbook
      strength: noise
risk_rating: 7
risk_description: >-
  The detector identifies a domestic-violence protection application or order containing the aggrieved person, respondent, children, allegations, residence or exclusion details, weapons surrender, contact restrictions, and temporary conditions. Disclosure can expose survivor location and safety arrangements, intensify coercion or retaliation, and reveal untested allegations before the court determines them. Awareness campaigns, aggregate statistics, textbooks, and general news are excluded, so the normal match is a live person-linked protection proceeding. Risk 7 supports SENSITIVE Legal; PROTECTED would require a concealed refuge or protected address, an immediate lethal threat, or a broader safety operation whose compromise causes significant harm.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
references:
  - title: Queensland Courts — Form DV1 Application for a protection order (field layout reference)
    url: https://www.courts.qld.gov.au/__data/assets/pdf_file/0006/162168/dv-f-1.pdf
created: '2026-03-06'
updated: '2026-09-24'
changelog:
  - version: 1.4.1
    date: '2026-09-24'
    description: "Remove the legacy DVO-YYYY-NNNNN alternative (not found in any published source) from the optional reference regex; test values use a labelled Court File Number or a QPRIME occurrence number instead."
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Re-anchor tiers: every tier previously used a DVO-YYYY-NNNNN reference as id_match, a format not found in any published Queensland court or police source, so the classifier could not fire on DVOs without that string. Tiers now use DVO terminology as the primary, require a populated aggrieved/respondent/named person field at 75, and add a Qld anchor (DFVP Act, QPRIME QP + 10 digits, DV01-DV09 form number, or legacy DVO reference) at 85. Added Police Protection Notice/Direction terms (PPDs commenced 1 January 2026). Test cases use synthetic names instead of [Name] placeholders; added PPD positive and blank DV01 negative. Party evidence also accepts form-style name fields (Family name / Given names) used under the DV1 party headings, and 85 accepts DV1 form anchors. Trimmed the exclusion filter from 15 single words to 6 distinctive phrases after a base-rate check on 332 random Wikipedia articles showed the old words appeared in 33% of general text (university 22%, published 12%) and could suppress genuine orders; "Legal" marker narrowed to "SENSITIVE Legal" (matched 78% of DV-topic text).'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1501 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
