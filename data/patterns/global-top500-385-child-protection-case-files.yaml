schema: testpattern/v1
name: Child protection case files
slug: global-top500-385-child-protection-case-files
version: 1.5.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to child protection case files in Australian contexts. This information type is classified as personally identifiable information under the Privacy Act
  1988.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(?:child\s+protection\s+case\s+files|child\s+protection|child\s+safety|mandatory\s+reporting|risk\s+of\s+harm|care\s+order|family\s+services|out[\s-]+of[\s-]+home\s+care|parental\s+responsibility)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - child protection case files
    - child
    - protection
    - case
    - files
    - government
    - citizen
    - services
  proximity: 300
  keyword_lists:
    - government-services
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: child protection case files
      description: Primary topic phrase match
    - value: child protection
      description: Case-insensitive topic phrase match
    - value: child safety
      description: Alternative topic phrase match
    - value: mandatory reporting
      description: Additional topic phrase match
    - value: "child protection case files\nChild: Riley Teston\nDate of birth: 14/05/2019\nCase number: CS20264471\nParent: Jordan Teston\nNotes: child protection case files opened after a notification on 12/08/2026."
      description: Populated child record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: welfare registry
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how records about child protection case files are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to child protection case files appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_child_protection_case
      matches:
        - ref: Regex_global_top500_385_child_protection_case_files_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_child_protection_case
      matches:
        - ref: Regex_global_top500_385_child_protection_case_files_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_child_protection_case
      matches:
        - ref: Evidence_child_protection_case
  regexes:
    - id: Pattern_child_protection_case
      pattern: >-
        (?is)\b(?:child\s+protection\s+case\s+files|child\s+protection|child\s+safety|mandatory\s+reporting|risk\s+of\s+harm|care\s+order|family\s+services|out[\s-]+of[\s-]+home\s+care|parental\s+responsibility)\b
    - id: Regex_global_top500_385_child_protection_case_files_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|child|young\s+person|subject\s+child|parent|guardian|carer|(?:case|file|notification|intake|reference|ref)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_child_protection_case
      groups:
        - match_style: word
          terms:
            - child protection case files
            - child protection
            - child safety
            - mandatory reporting
            - risk of harm
            - care order
            - caseworker
            - family services
            - welfare
            - out-of-home care
            - parental responsibility
risk_description: >-
  This Australian detector recognises child protection case files, child protection, and child safety language with eight nearby case terms. A normal true positive can identify a child, family, reporter, alleged harm, placement, risk assessment, and intervention, making disclosure capable of serious privacy, retaliation, and safeguarding consequences. Policy manuals, mandatory-reporting training, and blank forms can still match because the detector is concept-based and medium-confidence. Risk 8 SENSITIVE fits an ordinary contained case file, while PROTECTED requires active safe-location secrecy, immediate life-safety risk, protected-source exposure, bulk cases, or significant damage.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: High
  rationale: >-
    Risk 9 maps to PSPF and QGISCF PROTECTED and PROTECTED Personal-Privacy (owner decision 2026-09-25) because a child
    protection case file can identify a child, family and reporter together with alleged harm, placement and risk
    assessment; disclosure risks retaliation and the child's safety. The detector is concept-based, so policy and
    training text can still match.
  generic:
    classification: High
    dlm: High Personal-Privacy
    rationale: >-
      High Personal-Privacy handling fits a case file that ties an identified child to alleged harm, placement and
      reporter details, where exposure has direct safeguarding consequences.
