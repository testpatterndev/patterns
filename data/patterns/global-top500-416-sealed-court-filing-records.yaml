schema: testpattern/v1
name: Sealed court filing records
slug: global-top500-416-sealed-court-filing-records
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies sealed or suppressed court filings (documents filed under seal, sealed orders and indictments, suppression / non-publication orders) with populated proceeding and party fields.
operation: 'Primary: sealed record/filing/indictment/order/docket/proceeding, under seal, court seal, confidential filing, sealed court order, expunged record, suppression or non-publication order. 65 (discovery only) = primary alone. 75 = primary plus one populated proceeding or party field (proceeding/case/court/file number, applicant, respondent, defendant, accused, witness, victim, name, date of birth ...) with a non-placeholder value. 85 = primary plus two distinct populated fields plus independent filing evidence (affidavit, exhibit, sealed by order, not to be published, protected witness, pseudonym, in camera, closed court, registry). All tiers exclude template/fixture text.'
pattern: (?is)\b(?:sealed\s+record|sealed\s+filing|court\s+seal|sealed\s+indictment|sealed\s+order|under\s+seal|sealed\s+docket|confidential\s+filing|sealed\s+proceeding|sealed\s+court\s+order|expunged\s+record|(?:suppression|non[\s-]publication)\s+order)\b
confidence: medium
confidence_justification: 'Medium: sealing vocabulary is common in court rules, guidance and court reporting, so enforcement requires populated proceeding/party fields; 85 adds filing evidence the primary does not match.'
jurisdictions:
- global
regulations:
- GDPR
- IPA 2009 (Qld)
- Privacy Act 1988 (Cth)
data_categories:
  - legal
  - pii
corroborative_evidence:
  keywords:
  - sealed court filing records
  proximity: 240
test_cases:
  should_match:
    - value: |-
        UNDER SEAL - not to be published
        Supreme Court of Queensland
        Proceeding number: BS 4471/26
        Applicant: Harbour Freight Pty Ltd
        Respondent: Jordan Staffson
        Affidavit of Avery Teston with exhibits AT-1 to AT-9, sealed by order of the Court on 12/08/2026.
      description: 85 - sealed filing with populated proceeding/party fields and affidavit/exhibit evidence
      synthetic: true
    - value: |-
        Sealed filing notice
        Case number: CV-2026-004471
        The document is withheld from the public file pending the hearing.
      description: 75 - one populated proceeding field without filing evidence
      synthetic: true
    - value: Suppression order copy placed on the matter file.
      description: 65 discovery - topic phrase without populated fields
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: mugshot victim
      description: Generic word pair should not match
    - value: Court rules explain when a party may ask for a sealed filing and how the registry handles documents kept under seal.
      description: Guidance - no populated fields (65 at most)
    - value: |-
        Application to file under seal
        Proceeding number: ________
        Applicant: ________
        Respondent: [name]
      description: Blank application form - placeholder fields are rejected
    - value: A judge ordered the documents to remain under seal, the court heard on Tuesday.
      description: Court reporting - no populated fields
    - value: Access to the staff intranet is restricted access only.
      description: Generic IT "restricted access" wording no longer matches the primary
false_positives:
- description: Common words and phrases related to sealed court filing records appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_sealed_court
      matches:
        - ref: Regex_global_top500_416_sealed_court_filing_records_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_sealed_filing_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_sealed_court
      matches:
        - ref: Regex_global_top500_416_sealed_court_filing_records_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_sealed_court
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_sealed_court
      pattern: (?is)\b(?:sealed\s+record|sealed\s+filing|court\s+seal|sealed\s+indictment|sealed\s+order|under\s+seal|sealed\s+docket|confidential\s+filing|sealed\s+proceeding|sealed\s+court\s+order|expunged\s+record|(?:suppression|non[\s-]publication)\s+order)\b
    - id: Regex_global_top500_416_sealed_court_filing_records_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|defendant|accused|offender|prisoner|inmate|detainee|respondent|applicant|witness|suspect|subject\s+(?:name|person)|person\s+of\s+interest|victim|complainant|officer|CNI|QPRIME|(?:file|case|matter|court|reference|ref|exhibit|brief|job|incident|report|investigation|occurrence)\s*(?:no\.?|number|ID|#)|plaintiff|(?:proceeding|docket|claim|indictment)\s*(?:no\.?|number)|judge|registrar|date\s+filed)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_sealed_filing_evidence
      groups:
        - match_style: word
          terms:
            - affidavit
            - exhibit
            - exhibits
            - sealed by order
            - not to be published
            - protected witness
            - pseudonym
            - in camera
            - closed court
            - registry
      strength: specific
risk_description: This concept regex identifies sealed filings, sealed records, court seals, and sealed indictments with nearby
  legal context. A genuine filing may contain allegations, evidence, protected identities, or facts withheld from public access,
  so premature release can prejudice proceedings or defeat the court's protective purpose. The normal bounded filing creates
  credible moderate legal harm, but the phrase-level detector does not establish that every sealed document carries severe
  or irreversible consequences. Risk 7 supports SENSITIVE Legal; PROTECTED would require witness danger, major active-operation
  exposure, or significant damage that the seal specifically prevents.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
