{
  "schema": "testpattern/v1",
  "name": "Confidential Research Funding Proposal",
  "slug": "au-education-research-funding-proposal",
  "version": "1.0.3",
  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated confidential research funding proposal using record context and corroborating fields.",
  "pattern": "(?i)(?:research funding proposal|research grant application|university grant proposal)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
  "regulations": [
    "Australian Research Council Act 2001 (Cth)",
    "Right to Information Act 2009 (Qld)",
    "Privacy Act 1988 (Cth)"
  ],
  "frameworks": [
    "ISO 27001",
    "ISO 27701"
  ],
  "data_categories": [
    "education",
    "financial"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated confidential research funding proposal can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://www.arc.gov.au/grants"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE Financial"
  },
  "classification": {
    "tier": "Medium",
    "rationale": "Populated confidential research funding proposal maps to SENSITIVE Financial. The classifier requires record context and corroborating fields. The mapping does not determine the risk of every matched document.",
    "generic": {
      "classification": "Medium",
      "dlm": "Medium Financial",
      "rationale": "Medium Financial handling applies to the populated record. Synthetic checks establish local matching behavior, not tenant detection accuracy."
    }
  },
  "package_tags": {
    "primary_component": "business-records",
    "components": [
      "business-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "financial"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          },
          {
            "ref": "Regex_4"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:research funding proposal|research grant application|university grant proposal)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:principal investigator|chief investigator)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{2,70}"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:project title|research project)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{4,100}"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)(?:funding requested|project budget)[ \\t]*:[ \\t]*\\$[1-9][0-9,]*(?:\\.\\d{2})?"
      },
      {
        "id": "Regex_4",
        "pattern": "(?i)(?:confidential proposal|not for public release|unpublished proposal|restricted to reviewers)"
      }
    ]
  },
  "test_cases": {
    "should_match": [
      {
        "value": "Research funding proposal\nConfidential proposal\nPrincipal investigator: Morgan Teston\nProject title: River habitat restoration study\nFunding requested: $85000.00",
        "description": "Synthetic populated record variant 1",
        "synthetic": true
      },
      {
        "value": "University grant proposal\nRestricted to reviewers\nChief investigator: Jordan Teston\nResearch project: Coastal materials research\nProject budget: $120000.00",
        "description": "Synthetic populated record variant 2",
        "synthetic": true
      },
      {
        "value": "Research funding proposal\nConfidential proposal\nPrincipal investigator: Morgan Teston\nProject title: River habitat restoration study\nFunding requested: $85000.00\nForm template version 2.1. Retain the completed record.",
        "description": "Synthetic populated record variant 3",
        "synthetic": true
      },
      {
        "value": "University grant proposal\nRestricted to reviewers\nChief investigator: Jordan Teston\nResearch project: Coastal materials research\nProject budget: $120000.00",
        "description": "Synthetic populated record variant 4",
        "synthetic": true
      }
    ],
    "should_not_match": [
      {
        "value": "Published grant award\nProject title: River habitat restoration study\nPrincipal investigator: Morgan Teston\nFunding requested: $85000.00",
