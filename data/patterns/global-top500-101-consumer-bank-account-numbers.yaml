schema: testpattern/v1
name: Consumer bank account numbers
slug: global-top500-101-consumer-bank-account-numbers
version: 1.7.0
type: regex
pattern_class: concept
engine: boost_regex
description: Detects references to consumer bank account numbers in financial and compliance documents. Commonly found in international regulatory filings, transaction records, and audit documentation.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters. Keyword
  lists: financial-deposit-terms. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?i)\b((?:bank\s+)?account\s+(?:number|no\.?|#)[\s:#-]{0,20}\d{6,17})\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GLBA
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - consumer bank account numbers
    - consumer
    - bank
    - account
    - numbers
    - financial
    - accounts
    - payments
  proximity: 300
  keyword_lists:
    - financial-deposit-terms
    - generic-data-labels
    - data-record-context
test_cases:
  should_match:
    - value: 'Account number: 12345678'
      description: Labelled account number with no banking context, 65 discovery only
    - value: 'Bank account no. 123456789012'
      description: Abbreviated label that names a bank account, 75
    - value: 'account number 987654321'
      description: Label and value, 65 discovery only
    - value: 'Credit union member payout - Account number: 20481736'
      description: Exact 75 probe, banking term beside the labelled value
    - value: 'Tax Invoice - Account Number: 10458823 - EFT payments: BSB 064-000, quote your customer reference.'
      description: Bill with the biller BSB beside a customer account number, one banking term, 75 and not 85
    - value: 'Bank details for refund - BSB 064-000, Account Number: 10458823'
      description: Exact 85 probe, two different banking terms
    - value: 'Bank account number: 10458823 BSB 064-000'
      description: Exact 85 probe, the bank account label and a BSB
  should_not_match:
    - value: 'Council Rates Notice - Account Number: 10458823 - Amount due $512.40. Pay by direct debit from your bank account.'
      description: Rates customer account beside payment boilerplate must remain discovery-only
    - value: 'Mobile services invoice - Account holder: J Carrow - Account Number: 204817365'
      description: Account holder labels a telco customer, not a bank account, must remain discovery-only
    - value: '12345'
      description: Too short and unlabelled
    - value: 'order reference 88412'
      description: Numeric reference, no account label
    - value: 'template example placeholder'
      description: Template/sample text
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In English (as the primary international business language), standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      local_noise_filter: true
      id_match: Regex_consumer_bank_account
      matches:
        - ref: Keyword_bank_account_context
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    # One banking list, two thresholds. 75 needs one banking term: "Account
    # number" also labels rates, utility and customer accounts, so a populated
    # label alone is 65 here (a deliberate departure from the
    # populated-label-is-75 convention). The label "bank account number"
    # carries its own term. 85 needs two different terms: a bill that prints
    # one (the biller's BSB, or "savings account" in payment wording) beside
    # its customer account number stays at 75.
    - confidence_level: 75
      local_noise_filter: true
      id_match: Regex_consumer_bank_account
      matches:
        - ref: Keyword_bank_account_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_consumer_bank_account
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_consumer_bank_account
      pattern: (?i)\b((?:bank\s+)?account\s+(?:number|no\.?|#)[\s:#-]{0,20}\d{6,17})\b
    - id: Pattern_global_top500_101_consumer_bank_account_numbers_label_context
      pattern: (?i)\b(consumer\s+bank\s+account\s+numbers)\b
  keywords:
    # No bare "bank" or "bank account": bill boilerplate ("direct debit from
    # your bank account") sits beside customer account numbers. No "account
    # holder" or "account name": telco and utility bills label customers so.
    - id: Keyword_bank_account_context
      groups:
        - match_style: word
          terms:
            - bank account number
            - bank account no
            - text: BSB
              case_sensitive: true
            - sort code
            - routing number
            - IBAN
            - text: SWIFT
              case_sensitive: true
            - text: BIC
              case_sensitive: true
            - savings account
            - checking account
            - cheque account
            - transaction account
            - direct deposit
            - bank details
            - credit union
            - building society
      strength: domain
    - id: Keyword_global_top500_101_consumer_bank_account_numbers_domain_context
      groups:
        - match_style: word
          terms:
            - consumer bank account numbers
            - consumer
            - bank
      strength: domain
risk_description: >-
  The detector uses structural and proximity cues to find references to consumer bank account numbers in financial or compliance material, but it is a concept recogniser rather than a country-specific checksum validator. A genuine record can expose a consumer payment destination, support fraudulent mandate setup, or enable convincing impersonation when combined with the account holder and institution. Regulatory filings, audit prose, and templates can trigger the financial vocabulary without containing a usable account number, while one true match remains bounded to an account. Risk 7 SENSITIVE reflects credible moderate consumer financial harm; PROTECTED would require a bulk account register, payment credential, or significant damage beyond the normal record.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  idcf: DSL-3
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps consistently to OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Financial, SENS_Fin, and Medium because
    an authentic consumer account datum can materially enable fraud or targeting. The concept detector does not
    establish aggregation, debit authority, or the significant consequence needed for PROTECTED.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Generic Medium with Medium Financial suits a consumer banking record that can support material but bounded misuse.
      Generic High would need a master file, authorisation token, or broad direct-loss capability not shown by the
      match.
references:
  - title: "PCI DSS v4.0.1"
    url: https://docs-prv.pcisecuritystandards.org/PCI%20DSS/Standard/PCI-DSS-v4_0_1.pdf
created: '2026-02-08'
updated: '2026-11-17'
changelog:
  - version: 1.7.0
    date: '2026-11-17'
    description: 'Matching widened: Regex_consumer_bank_account now carries a leading (?i), so the label matches in any case. Purview regex is case-sensitive by default (dev-tenant test recorded in commit bc6255bc9e), so "Account number: 12345678" and "Bank account no. ..." were missed. The value is digits only. Tiers narrowed: 75 now needs a banking term (new Keyword_bank_account_context: BSB, sort code, routing number, IBAN, SWIFT, direct deposit, bank details and similar, or the label "bank account number/no" itself). "Account number" also labels rates, utility and customer accounts, and with the label matching in any case a rates notice or power bill reached the enforcing 75 tier on the label alone. A populated label with no banking term is now 65 discovery only, a deliberate departure from the populated-label-is-75 convention of 1.5.0. Bare "bank" and "bank account" are left out of the terms because bill payment boilerplate carries them, and "account holder" because telco and utility bills label their customers with it. The 65 tier no longer needs a generic-data-labels term, so "Account No." and "account #" labels still report at 65; the unused Evidence_generic_data_labels import is removed. 85 now needs two different terms from the same list (min_count 2, unique_results), replacing Keyword_consumer_bank_account, which is removed: one term was enough before, so a bill printing the biller BSB, or "savings account" in its payment wording, beside a customer account number reached 85. Cost: a BSB, sort code or routing number with an account number and no other banking term is now 75, below the recommended 85. Added exact 75 and 85 probes and rates-notice and telco-bill decoys.'
  - version: 1.6.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.5.0
    date: '2026-10-20'
    description: 'Self-corroboration fix (85 needs independent context, as #80 intended for populated-label IdMatches): Purview counts a supporting match that sits inside the IdMatch span when a word break separates it (dev-tenant run 2026-10-19; ":" and "_" break words, "=" does not), so a single labelled value reached 85 on its own label. Removed from Keyword_consumer_bank_account the terms that match inside the IdMatch label: bank account number, account number. Dropped Evidence_generic_data_labels from the 85 tier: the shared dictionary holds "account number", which sits inside the labelled IdMatch (it stays on the 65 tier). 85 now needs context outside the label. Added a 75 tier on Regex_consumer_bank_account alone: a populated label alone is 75 (the #80 convention), so the value stays enforcing.'
  - version: 1.4.0
    date: '2026-10-19'
    description: "Local noise filter: every tier above 65 opts in to the per-tenant Local Noise Exclusion dictionary (local_noise_filter: true). When the export enables it, each of those tiers gets a pattern-level TextMatchFilter (EndsWith, Exclude) reading that dictionary, so the organisation's own published values (its remit-to BSB, account number, SWIFT/BIC or IBAN) stop reaching 75/85 while the 65 tier still reports them. Detection logic and entity filters are unchanged, and the filter is inert until the customer adds entries."
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1270 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 90 to 85.; Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
  - version: 1.1.0
    date: '2026-03-14'
    description: Wire generic-data-labels evidence keywords at 75/85 tiers
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
