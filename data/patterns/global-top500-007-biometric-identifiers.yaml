schema: testpattern/v1
name: Biometric identifiers
slug: global-top500-007-biometric-identifiers
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to biometric identifiers in Australian contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 6 keywords within 300 characters. Keyword
  lists: biometric-biometric-types. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?is)\b(biometric\s+identifiers?|biometric\s+(?:data|template|record|sample|enrolment|enrollment|authentication))\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - biometric identifiers
    - biometric
    - identifiers
    - personal
    - identity
    - demographics
  proximity: 300
  keyword_lists:
    - biometric-biometric-types
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: biometric identifiers
      description: Exact phrase match
    - value: biometric data
      description: Biometric data phrase match
    - value: biometric template
      description: Biometric template phrase match
    - value: biometric authentication
      description: Biometric authentication phrase match
    - value: |-
        Biometric identifiers: Recorded
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No biometric terminology present
    - value: identifier number 12345
      description: Generic identifier without biometric context
    - value: record reference A12345
      description: Generic anchor terms no longer match
    - value: |-
        Biometric identifiers:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about biometric identifiers are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Biometric identifiers:
        Name: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Common words and phrases related to biometric identifiers appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_007_biometric_identifiers_populated_label
      matches:
        - ref: Regex_global_top500_007_biometric_identifiers_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_007_biometric_identifiers_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_biometric_identifiers
      matches:
        - ref: Evidence_biometric_identifiers
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_biometric_identifiers
  regexes:
    - id: Pattern_biometric_identifiers
      pattern: (?is)\b(biometric\s+identifiers?|biometric\s+(?:data|template|record|sample|enrolment|enrollment|authentication))\b
    - id: Pattern_au_top500_007_biometric_identifiers_label_context
      pattern: (?i)\b(biometric\s+identifiers)\b
    - id: Regex_global_top500_007_biometric_identifiers_populated_label
      pattern: (?i)\b((?:\b(?:biometric\s+identifiers?|biometric\s+(?:data|template|record|sample|enrolment|enrollment|authentication))\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Regex_global_top500_007_biometric_identifiers_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
  keywords:
    - id: Evidence_biometric_identifiers
      groups:
        - match_style: word
          terms:
            - fingerprint template
            - facial recognition
            - iris scan
            - voiceprint
    - id: Keyword_au_top500_007_biometric_identifiers_domain_context
      groups:
        - match_style: word
          terms:
            - biometric identifiers
            - biometric
            - identifiers
risk_description: >-
  This Biometric identifiers pattern detects concept phrases including biometric identifiers, biometric data, and biometric template. Those words can reveal that a document concerns biometric processing and may point reviewers toward nearby high-impact material, but they are not themselves an enrolled person's face, fingerprint, iris, or template. Procurement specifications, privacy notices, and security designs can match without any individual record. Risk 5 and OFFICIAL represent the topic's review value while reserving SENSITIVE for an actual immutable biometric artefact or person-linked enrolment data.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 fits PSPF OFFICIAL, QGISCF OFFICIAL and the OFFICIAL DLM because the detector matches biometric topic
    phrases, not an enrolled person's face, fingerprint, iris or template; procurement specifications, privacy notices
    and security designs match without any individual record. SENSITIVE is reserved for an actual biometric artefact or
    person-linked enrolment data.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low handling suits a topic signal that points reviewers toward biometric processing. An enrolled template or
      person-linked enrolment record warrants Medium Personal-Privacy or higher.
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_007_biometric_identifiers_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (fingerprint template, facial recognition, iris scan, voiceprint); 85 requires the populated field plus a populated person/client field (Regex_global_top500_007_biometric_identifiers_record_structure). Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list. Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.3.5
    date: '2026-09-25'
    description: >-
      Classification reasoning brought in line with the pattern's risk 5 OFFICIAL topic-detector rating: tier and generic
      classification Low; the previous text described an earlier risk 9 PROTECTED assessment.
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (HRIPA (Cth), My Health Records Act 2012 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 613 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
