    date: '2026-09-24'
    description: Document the overlap with au-qld-silent-elector-record in false_positives; no detection change.
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — refuge, safe house, confidential/suppressed address and silent elector records, gated on an Australian address.
