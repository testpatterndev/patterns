    description: 'Quality pass (2026-09-24): 75 now requires a populated identity field (new Regex_..._record_structure, placeholder-guarded) instead of the canonical label phrase; 85 requires two distinct populated identity fields plus identity-registry evidence (new Keyword_identity_record_evidence). Removed the label-context regex and the alias-history keyword groups that repeated the primary (same-span self-corroboration). Replaced bare-phrase positives with populated synthetic records; added guidance, blank-form and news decoys. Metadata: added Privacy Act 1988 (Cth) and ISO 27701. Note: active twin of au-top500-002-previous-legal-names-and-aliases (merge candidate).'
  - version: 1.4.0
    date: '2026-07-19'
    description: 'Personal-name baseline: make 65/75/85 cumulative and exact by separating former-name discovery, the canonical previous-names-and-aliases label, and two non-overlapping additional alias-history terms; preserve AU/global overlap for tenant comparison and add adversarial template coverage.'
  - version: 1.3.0
    date: '2026-07-19'
    description: 'QG/CI package inclusion: add missing 85 high tier as a strict superset of the 75 tier (label context + domain context + two distinct former-name evidence terms, template exclusion retained), mirroring the accepted au-top500-002 tier design; add a high-tier probe positive.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1568 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
