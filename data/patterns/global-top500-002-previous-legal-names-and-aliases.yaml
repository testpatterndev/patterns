schema: testpattern/v1
name: Previous legal names and aliases
slug: global-top500-002-previous-legal-names-and-aliases
version: 1.5.1
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies personal records that link a person to previous legal names or aliases (former, maiden, birth or assumed names, deed-poll name changes, also-known-as entries) with populated identity fields.
operation: 'Primary: previous legal names, former/maiden/birth/assumed name, prior/previous surname, also known as, name change, deed poll. 65 (discovery only) = primary alone. 75 = primary plus one populated identity field (name, surname, given names, date of birth, applicant/registrant, former/maiden/birth name, also known as / AKA / alias, registration, certificate, passport, customer or client number) with a non-placeholder value. 85 = primary plus two distinct populated identity fields plus independent identity-record evidence (Registry of Births, Deaths and Marriages, change of name certificate, birth/marriage certificate, statutory declaration, identity verification, passport). All tiers exclude template/fixture text.'
pattern: (?is)\b(?:previous\s+legal\s+names|former\s+name|maiden\s+name|also\s+known\s+as|name\s+change|deed\s+poll|prior\s+surname|previous\s+surname|birth\s+name|assumed\s+name)\b
confidence: medium
confidence_justification: 'Medium: alias phrases are common in forms, guidance and news, so enforcement requires populated identity fields; 85 adds identity-registry evidence.'
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27701
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - previous legal names and aliases
    - previous
    - legal
    - names
    - aliases
    - personal
    - identity
    - demographics
  proximity: 300
  keyword_lists:
    - pii-personal
    - salutations-standard
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: |-
        Change of name registration
        Applicant name: Avery Teston
        Date of birth: 04/02/1991
        Former name: Avery Mayfield
        Registration number: CN2026004471
        Change of name certificate issued by the Registry of Births, Deaths and Marriages on 12/08/2026.
      description: 85 - populated name-change record with registry evidence
      synthetic: true
    - value: |-
        Customer identity update
        Customer number: C4471820
        Former name: Riley Mayfield
        The customer asked for the account to show the current surname.
      description: 75 - populated former-name field and customer number, no registry evidence
      synthetic: true
    - value: 'Change of name record. Previous legal names and aliases held by the applicant: maiden name and former name as registered by deed poll.'
      description: 75 - record statement with a populated applicant field (alias types listed), no registry evidence
    - value: Applicant advised a maiden name by phone; the details will follow in writing.
      description: 65 discovery - alias mention without populated fields
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: If you have a former name or maiden name, list it on the form so we can match your records.
      description: Form guidance - no populated identity fields (65 at most)
    - value: |-
        Previous legal names and aliases
        Former name: ________
        Maiden name: [if applicable]
        Date of birth: __/__/____
      description: Blank form section - placeholder fields are rejected
    - value: The actor, also known as Riley Mayfield, announced a name change by deed poll last week.
      description: News item - no populated identity fields
    - value: 'Sample: Previous legal names and aliases, maiden name and former name'
      description: Template fixture rejected by the shared exclusion dictionary
false_positives:
  - description: Common words and phrases related to previous legal names and aliases appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: >-
      In English (as the primary international business language), similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute
      sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_previous_legal_names
      matches:
        - ref: Regex_global_top500_002_previous_legal_names_and_aliases_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_identity_record_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_previous_legal_names
      matches:
        - ref: Regex_global_top500_002_previous_legal_names_and_aliases_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_previous_legal_names
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_previous_legal_names
      pattern: (?is)\b(?:previous\s+legal\s+names|former\s+name|maiden\s+name|also\s+known\s+as|name\s+change|deed\s+poll|prior\s+surname|previous\s+surname|birth\s+name|assumed\s+name)\b
    - id: Regex_global_top500_002_previous_legal_names_and_aliases_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|applicant(?:\s+name)?|registrant|(?:former|previous|prior|maiden|birth|assumed)\s+(?:legal\s+)?(?:names?|surnames?)|also\s+known\s+as|AKA|alias(?:es)?|registration\s+(?:no\.?|number)|certificate\s+(?:no\.?|number)|passport\s+(?:no\.?|number)|(?:customer|client)\s+(?:no\.?|number|ID))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_identity_record_evidence
      groups:
        - match_style: word
          terms:
            - Registry of Births, Deaths and Marriages
            - Births, Deaths and Marriages
            - text: BDM
              case_sensitive: true
            - change of name certificate
            - birth certificate
            - marriage certificate
            - statutory declaration
            - identity verification
            - proof of identity
            - passport
      strength: specific
risk_description: >-
  The medium-confidence concept regex finds former-name, maiden-name, prior-surname, deed-poll, birth-name, and alias terminology with personal-name context, rather than extracting a name pair by itself. In a genuine identity record, disclosure can link a person's current and former identities, support impersonation or unwanted tracing, and expose a legally significant name change. The normal affected unit is one person or bounded identity file with serious but contained privacy and identity-fraud consequences. Risk 8 and SENSITIVE are justified, while PROTECTED is not met without a protected witness identity, bulk identity history, or consequences amounting to significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Legal because a person-linked
    former-name history can materially enable identity correlation, impersonation, and legal-record misuse. PROTECTED is
    not met by the normal bounded record because it does not establish protected identity status, broad scale, or
    significant damage.
  generic:
    classification: Medium
    dlm: Medium Legal
    rationale: >-
      Medium generic classification and Medium Legal DLM fit a legally significant identity-history record with serious
      contained misuse potential.
