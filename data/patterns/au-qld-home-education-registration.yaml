schema: testpattern/v1
name: QLD Home Education Registration
slug: au-qld-home-education-registration
version: 1.4.0
type: regex
pattern_class: concept
description: >-
  Detects Queensland home education registration records for a named child - home education registration or provisional registration applications and reports, and exemptions from compulsory schooling - when the phrase sits with populated child/parent identifiers and registration fields.
operation: >-
  Primary: home education registration/application/report, registration for home education, home schooling application, exemption from (compulsory) schooling, RHE-1. 65 (discovery only): phrase alone. 75: phrase plus a populated child or parent identifier field (child/student name, DOB, parent/guardian, year level, EQ ID/LUI). 85: identifier field plus a populated registration field (registration or provisional registration number/type/period, home educator, educational program, program start date, previous school, report due date) plus independent Home Education Unit / Department of Education evidence. Template and guidance/training framing excluded from 75/85. Converted from keyword_list to regex.
pattern: (?i)\b(?:home\s+education\s+(?:registration|application|report)|registration\s+for\s+home\s+education|home\s*schooling\s+application|exemption\s+from\s+(?:compulsory\s+)?schooling|RHE-1)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated child or parent identifier; 85 also needs a registration field and Home Education Unit evidence. Departmental guidance and homeschooling forums carry the phrases without a child record and stay at 65.
jurisdictions:
- au
regulations:
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - Education (General Provisions) Act 2006 (Qld)
frameworks:
- ISO 27001
- ISO 27701
data_categories:
- pii
- children
- education
- government
test_cases:
  should_match:
    - value: "Application for home education registration\nChild name: Riley Ashworth\nDate of birth: 14/05/2016\nParent: Jordan Ashworth\nRegistration type: Full registration\nProgram start date: 27/01/2027\nPrevious school: Harbourview State School\nSummary of the educational program attached for the Home Education Unit."
      description: Populated home education application with child, registration fields and HEU evidence (85)
      synthetic: true
    - value: "Home education report received\nStudent name: Casey Rourke\nYear level: 5"
      description: Home education report with labelled child fields only (75)
      synthetic: true
  should_not_match:
    - value: "Education funding announcement"
      description: Non-match 1
    - value: "Home renovation tips"
      description: Non-match 2
    - value: "Policy guidance: this procedure explains how home education registration applications are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Home education registration application\nChild name: ____________________\nDate of birth: ____________________\nParent: ____________________\nRegistration type: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: more Queensland families applied for home education registration this year, and the Home Education Unit reminded parents that an exemption from compulsory schooling is a separate process."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Generic education or home references.
  mitigation: Require home education specific terms like HEU or home educator.
exports:
- yaml
scope: narrow
risk_rating: 6
risk_description: >-
  The detector recognises Queensland home education registration and exemption language and enforces only when populated child or parent identifier fields sit nearby; phrase-only text stays at 65 discovery. A populated registration can connect a child and family to their schooling arrangement and may reveal contact, curriculum, developmental, or support details used by the administering authority. Generic home-schooling discussion, guidance, or an unfilled learning-plan template can match without exposing a registered student. Risk 6 SENSITIVE Government reflects the moderate privacy and administrative harm of a real registration; PROTECTED would require a large register, acute safeguarding content, or another source of significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_home_education
      matches:
        - ref: Regex_au_qld_home_education_registration_child_fields
        - ref: Regex_au_qld_home_education_registration_registration_fields
        - ref: Evidence_home_education_authority
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_home_education_registration_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_home_education
      matches:
        - ref: Regex_au_qld_home_education_registration_child_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_home_education_registration_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_home_education
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_home_education
      pattern: (?i)\b(?:home\s+education\s+(?:registration|application|report)|registration\s+for\s+home\s+education|home\s*schooling\s+application|exemption\s+from\s+(?:compulsory\s+)?schooling|RHE-1)\b
    - id: Regex_au_qld_home_education_registration_child_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|student(?:\s+name)?|pupil|child|candidate(?:\s+name)?|EQ\s*ID|LUI|USI|year\s+level|grade\s+level|parent(?:\s+name)?|guardian|carer|(?:student|candidate|enrolment|applicant|file)\s*(?:no\.?|number|ID)|home\s+group|class)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_au_qld_home_education_registration_registration_fields
      pattern: (?i)\b(?:(?:registration|provisional\s+registration)\s*(?:no\.?|number|ID|type|period|date)|registration\s+(?:type|period|date|status)|home\s+educator|educational\s+program|program\s+start\s+date|previous\s+school|report\s+due(?:\s+date)?)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Evidence_home_education_authority
      groups:
        - match_style: word
          terms:
            - Home Education Unit
            - text: HEU
              case_sensitive: true
            - Department of Education
            - Education (General Provisions) Act 2006
            - summary of the educational program
            - high-quality education
            - learning plan
      strength: specific
    - id: Keyword_au_qld_home_education_registration_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
created: '2026-02-09'
