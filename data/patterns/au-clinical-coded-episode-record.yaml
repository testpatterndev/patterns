schema: testpattern/v1
name: Australian Clinically Coded Episode Record (ICD-10-AM / ACHI / AMT)
slug: au-clinical-coded-episode-record
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Episode-level clinically coded records using the Australian classifications: ICD-10-AM diagnosis
  codes, ACHI procedure codes (nnnnn-nn), AR-DRG groupings and Australian Medicines Terminology (AMT)
  concept identifiers, attached to a patient episode or separation - the coded abstracts, coding
  query worksheets, QHAPDC and Admitted Patient Data Collection extracts and casemix / activity-based
  funding files produced by health information services. Each record ties a patient or episode
  identifier to diagnoses and procedures. Boundary: code lists, tabular extracts and coding standards
  with no episode belong to no classifier here and stay at 65; US ICD-10-CM / ICD-10-PCS codes belong
  to global-icd-10-cm and global-icd-10-pcs.
operation: >-
  Primary: ICD-10-AM, ACHI, AR-DRG, Australian Refined Diagnosis Related Group, Australian
  Classification of Health Interventions, Australian Coding Standards, clinically coded, clinical
  coding, coded episode / separation / data / record, QHAPDC, Admitted Patient Data Collection,
  Australian Medicines Terminology, AMT code. 65 (discovery only): primary alone, which surfaces
  coding standards, code lists and education material. 75: primary plus a populated episode / patient
  field (URN / UR number, MRN, patient name, DOB, episode or separation number, admission or separation
  date, length of stay, care type, mode of separation) plus a coded value (ICD-10-AM code with decimal
  such as J18.9 or E11.65, ACHI code nnnnn-nn such as 13882-00, an AMT / SNOMED CT-AU concept ID in
  the 1000036 namespace, or a labelled PBS item code such as "PBS item 2622B"). 85: the episode field plus two distinct coded values plus a populated coded
  structure field (principal diagnosis, additional diagnoses, procedures, condition onset flag, DRG,
  NWAU, WIES). Enforce tiers exclude template wording and coding standard, tabular list, education,
  index and training framing.
pattern: >-
  (?i)\b(?:ICD-10-AM|ACHI|AR-DRG|Australian\s+Refined\s+Diagnosis\s+Related\s+Groups?|Australian\s+Classification\s+of\s+Health\s+Interventions|Australian\s+Coding\s+Standards|clinically\s+coded|clinical\s+coding|coded\s+(?:episode|separation|data|record)|QHAPDC|Admitted\s+Patient\s+Data\s+Collection|Australian\s+Medicines\s+Terminology|AMT\s+code)\b
confidence: medium
confidence_justification: >-
  Medium: ICD-10-AM, ACHI and AR-DRG wording is specific to Australian clinical coding and the enforce
  tiers need an episode or patient field plus code values in the published shapes, which code lists and
  coding standards lack. ICD codes without a decimal point (I10) are not counted as coded values, to avoid
  matching ordinary alphanumeric tokens; a record coded only with such codes reaches 75 through another
  code or stays at 65.
jurisdictions:
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Hospital and Health Boards Act 2011 (Qld)
  - Public Health Act 2005 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
  - QGISCF
data_categories:
  - phi
  - health
corroborative_evidence:
  keywords:
    - principal diagnosis
    - additional diagnoses
    - separation date
    - episode number
    - DRG
    - NWAU
  proximity: 300
test_cases:
  should_match:
    - value: "QHAPDC coded episode extract\nURN: 556120\nEpisode number: 2026-0091842\nSeparation date: 07/10/2026\nPrincipal diagnosis: J18.9 Pneumonia, unspecified\nAdditional diagnoses: E11.9; I10\nProcedures: 13882-00 Management of continuous ventilatory support"
      description: 85 tier - QHAPDC episode with URN, episode number, separation date, ICD-10-AM and ACHI codes under coded fields
      synthetic: true
    - value: "Clinically coded record\nPatient: Jordan Teston\nAdmission date: 01/10/2026\nPrincipal diagnosis: K35.8 Acute appendicitis\nProcedure: 30571-00 Laparoscopic appendicectomy\nDischarge medicine AMT ID 21360011000036101, PBS item 0000X"
      description: 85 tier - coded record with patient, admission date, ICD-10-AM diagnosis, ACHI procedure and AMT concept ID
      synthetic: true
    - value: "ICD-10-AM coded separation\nURN: 112093\nS52.50 assigned after coding query resolved"
      description: 75 tier - coded separation with URN and a single ICD-10-AM code
      synthetic: true
  should_not_match:
    - value: "ICD-10-AM Tabular List extract\nJ18.0 Bronchopneumonia, unspecified\nJ18.1 Lobar pneumonia, unspecified\nJ18.9 Pneumonia, unspecified\nACHI 13882-00 Management of continuous ventilatory support, 24 hours or less"
      description: Code reference table with no episode or patient (65 at most)
    - value: "Australian Coding Standards: this standard instructs coders to assign J18.9 when the organism is not documented, and to sequence E11.65 before the complication code. Education module for clinical coders."
      description: Coding standard / education text (65 at most)
    - value: "Clinical coding worksheet\nURN: ____________\nEpisode number: ____________\nPrincipal diagnosis: ____________\nProcedures: ____________"
      description: Blank coding worksheet (65 at most)
    - value: "Replacement part 12345-67 shipped with invoice A12.5 on 03/10/2026."
      description: Unrelated part number and invoice reference with code-like shapes (no match)
false_positives:
  - description: ICD-10-AM / ACHI tabular lists, indexes, coding standards, coding education and casemix grouper documentation.
    mitigation: They carry codes but no populated episode or patient field, and tabular list, index, standard and education framing is excluded from enforce tiers.
  - description: Hyphenated part numbers or references that share the nnnnn-nn ACHI shape.
    mitigation: Coded values only count next to an Australian coding primary and a populated episode or patient field.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_coded_episode_primary
      matches:
        - ref: Regex_coded_episode_episode_field
        - ref: Regex_coded_episode_code_value
          min_count: 2
          unique_results: true
        - ref: Regex_coded_episode_structure_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_coded_episode_reference_exclusion
    - confidence_level: 75
      id_match: Regex_coded_episode_primary
      matches:
        - ref: Regex_coded_episode_episode_field
        - ref: Regex_coded_episode_code_value
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_coded_episode_reference_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_coded_episode_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_coded_episode_primary
      pattern: >-
        (?i)\b(?:ICD-10-AM|ACHI|AR-DRG|Australian\s+Refined\s+Diagnosis\s+Related\s+Groups?|Australian\s+Classification\s+of\s+Health\s+Interventions|Australian\s+Coding\s+Standards|clinically\s+coded|clinical\s+coding|coded\s+(?:episode|separation|data|record)|QHAPDC|Admitted\s+Patient\s+Data\s+Collection|Australian\s+Medicines\s+Terminology|AMT\s+code)\b
    - id: Regex_coded_episode_episode_field
      pattern: >-
        (?i)\b(?:URN|UR\s*(?:no\.?|number)|MRN|medical\s+record\s+(?:no\.?|number)|patient(?:\s+name)?|date\s+of\s+birth|DOB|(?:episode|separation|admission|encounter)\s*(?:no\.?|number|ID)|(?:admission|separation|discharge)\s+date|date\s+of\s+(?:admission|separation|discharge)|length\s+of\s+stay|care\s+type|mode\s+of\s+separation)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_coded_episode_code_value
      pattern: >-
        \b(?:[A-TV-Z][0-9]{2}\.[0-9]{1,2}|[0-9]{5}-[0-9]{2}|[0-9]{2,8}1000036[0-9]{3}|PBS\s+item(?:\s+code)?[ \t]*[:#]?[ \t]{0,3}[0-9]{4,5}[A-Z])\b
    - id: Regex_coded_episode_structure_field
      pattern: >-
        (?i)\b(?:principal\s+diagnosis|additional\s+diagnos[ie]s|secondary\s+diagnos[ie]s|procedures?|interventions?|condition\s+onset\s+flag|DRG|NWAU|WIES)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|unknown|tbc|tba|nil|none|the|a|an|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.,;-]{0,30}
    - id: Regex_coded_episode_reference_exclusion
      pattern: >-
        (?i)\b(?:tabular\s+list|alphabetic\s+index|this\s+(?:standard|policy|procedure|guideline|guide|page|course|module)|coding\s+standards?\s+(?:instructs?|requires?|states?)|education\s+module|training\s+module|e-learning|coding\s+exercise|code\s+(?:list|table|set\s+reference)|frequently\s+asked\s+questions)\b
risk_rating: 8
risk_description: >-
  The classifier recognises Australian clinical coding (ICD-10-AM, ACHI, AR-DRG, AMT) and enforces only
  when an episode or patient identifier sits with code values in the published shapes, with 85 needing
  two distinct codes under coded fields such as principal diagnosis or procedures. A coded abstract is a
  compact statement of a patient's diagnoses, comorbidities and procedures for an admission - including
  mental illness, HIV, substance use or pregnancy outcomes expressed as codes that anyone with a code book
  can read. Coded extracts move in bulk to casemix, funding and research teams, so a single file can
  carry many episodes. Risk 8 and SENSITIVE reflect the per-episode health disclosure; a bulk
  unaggregated extract would justify stronger handling in the receiving system.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because a coded
    episode ties a patient or episode identifier to diagnoses and procedures that any coder can decode. PROTECTED is not
    met by the detector, which establishes one coded episode rather than bulk scale; the code values themselves are
    public classification content.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling protects a patient's coded diagnoses and procedures for an episode. High would
      need a bulk identified extract.
references:
  - title: IHACPA - ICD-10-AM / ACHI / ACS
    url: https://www.ihacpa.gov.au/health-care/classification/icd-10-amachiacs
  - title: Queensland Health - Queensland Hospital Admitted Patient Data Collection (QHAPDC)
    url: https://www.health.qld.gov.au/dsb/collections/qhapdc
  - title: Australian Digital Health Agency - National Clinical Terminology Service (SNOMED CT-AU and AMT)
    url: https://www.healthterminologies.gov.au/learn/australian-medicines-terminology
  - title: Privacy Act 1988 (Cth)
    url: https://www.legislation.gov.au/C2004A03712/latest/text
created: '2026-10-20'
updated: '2026-10-20'
changelog:
  - version: 1.0.0
    date: '2026-10-20'
    description: >-
      Initial release from the qghealth sector review: episode-level records coded with ICD-10-AM, ACHI,
      AR-DRG and AMT. 65 phrase only; 75 needs a populated episode / patient field and one coded value;
      85 needs two distinct coded values (count on the match node) and a coded structure field. Code lists,
      tabular extracts, coding standards and education material excluded. PBS item codes (nnnnX) count only
      when labelled "PBS item": the bare shape collides with ordinary references.
