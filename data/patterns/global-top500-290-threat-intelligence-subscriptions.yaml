schema: testpattern/v1
name: Threat intelligence subscriptions
slug: global-top500-290-threat-intelligence-subscriptions
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects threat-intelligence subscription records - licence and account details, feed API keys, TAXII endpoints and collection IDs for commercial or community CTI feeds. Subscription wording alone is discovery-only.
operation: >-
  Regex_ti_subscription_primary (threat-intelligence subscription/feed/platform, TAXII collection or MISP instance wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated subscription field (subscription/licence/account ID, API key, client ID, collection ID, renewal date) or a TAXII/feed API endpoint URL or collection UUID. 85 requires a populated subscription field (subscription/licence/account ID, API key, client ID, collection ID, renewal date), a TAXII/feed API endpoint URL or collection UUID, and independent subscription-context (fees, renewal, STIX/TLP, ISAC, quotas) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_ti_subscription_guidance_exclusion).
pattern: >-
  (?i)\b(?:threat\s+intel(?:ligence)?\s+(?:subscriptions?|feeds?|platform|service|licen[cs]es?|portal)|TAXII\s+(?:collection|server|feed|endpoint)|MISP\s+(?:instance|feed|community|sync)|CTI\s+(?:feed|subscription|platform))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated subscription field (subscription/licence/account ID, API key, client ID, collection ID, renewal date) or a TAXII/feed API endpoint URL or collection UUID), and 85 needs two distinct structures plus independent subscription-context (fees, renewal, STIX/TLP, ISAC, quotas) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - annual fee
  - renewal
  - poll interval
  - STIX
  - TLP
  - sharing agreement
  - ISAC
  - vendor contact
  - licensed users
  - feed quota
  proximity: 300
test_cases:
  should_match:
  - value: Procurement approved renewal of the threat intelligence subscription for another year.
    description: Discovery probe (65) - subscription wording only
    synthetic: true
  - value: |-
      Threat intelligence feed onboarding
      Subscription ID: HTX-448210
      API key: 9b1f7c22e4a84d0f
    description: Medium-tier probe (75) - populated subscription fields
    synthetic: true
  - value: |-
      TAXII collection access - Harbour Health SOC
      Account ID: HH-SOC-0194
      API key: 9b1f7c22e4a84d0f
      Endpoint: https://intel.tidewatercti.net/taxii2/collections/5f8c2d1e-7a44-4b0e-9c31-2e7f1a6d9b40/objects/
      Poll interval 15 minutes; renewal due 30/06/2027, annual fee AUD 48,000.
    description: High-tier probe (85) - account fields, TAXII endpoint URL with collection UUID, renewal and fee context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: threat intelligence feeds must be sourced from vetted providers and reviewed annually.'
    description: Policy text without subscription details
    synthetic: true
  - value: |-
      Threat intelligence subscription template
      Subscription ID: ________
      API key: [insert]
    description: Blank template
    synthetic: true
  - value: 'Webinar recap: how a threat intelligence platform uses STIX and TAXII collections to share indicators.'
    description: Training/webinar framing
    synthetic: true
false_positives:
- description: Vendor marketing and CTI explainers describe feeds, TAXII and MISP.
  mitigation: Topic wording is discovery-only; enforcement needs populated subscription fields or endpoints and guidance/news framing is excluded.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_ti_subscription_primary
    matches:
    - ref: Regex_ti_subscription_subscription_field
    - ref: Regex_ti_subscription_feed_endpoint
    - ref: Keyword_ti_subscription_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_ti_subscription_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_ti_subscription_primary
    matches:
    - type: any
      refs:
      - Regex_ti_subscription_subscription_field
      - Regex_ti_subscription_feed_endpoint
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_ti_subscription_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_ti_subscription_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_ti_subscription_primary
    pattern: >-
      (?i)\b(?:threat\s+intel(?:ligence)?\s+(?:subscriptions?|feeds?|platform|service|licen[cs]es?|portal)|TAXII\s+(?:collection|server|feed|endpoint)|MISP\s+(?:instance|feed|community|sync)|CTI\s+(?:feed|subscription|platform))\b
  - id: Regex_ti_subscription_subscription_field
    pattern: >-
      (?i)\b(?:subscription\s+(?:ID|no\.?|number)|licen[cs]e\s+(?:key|ID|no\.?|number)|account\s+ID|contract\s+(?:no\.?|number)|API\s+(?:key|token|secret)|client\s+(?:ID|secret)|collection\s+ID|feed\s+ID|renewal\s+date|seats|entitlement)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  - id: Regex_ti_subscription_feed_endpoint
    pattern: >-
      (?i)\bhttps?://[a-z0-9.-]{3,100}/(?:taxii2?|api/v\d|feeds?|collections|events)/[A-Za-z0-9/_.-]{0,100}|\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b
  keywords:
  - id: Keyword_ti_subscription_context
    groups:
    - match_style: word
      terms:
      - annual fee
      - renewal
      - poll interval
      - text: STIX
        case_sensitive: true
      - text: TLP
        case_sensitive: true
      - sharing agreement
      - text: ISAC
        case_sensitive: true
      - vendor contact
      - licensed users
      - feed quota
    strength: specific
  - id: Keyword_ti_subscription_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires threat-intelligence subscription wording plus populated account, licence, API-key or TAXII endpoint details before enforcing. Disclosure of the topic may reveal that an organisation consumes threat intelligence, yet direct misuse requires additional information about providers, access tokens, collection priorities, or defensive integrations. The affected party is usually the subscribing security team, with bounded commercial or reconnaissance harm from a single generic mention and frequent public use of these standards. Risk 5 OFFICIAL reflects that contextual value; SENSITIVE would require an actual confidential subscription record or integration configuration.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
