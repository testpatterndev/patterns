schema: testpattern/v1
name: Incident timeline evidence
slug: global-top500-296-incident-timeline-evidence
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects incident timelines: timeline or chronology wording with timestamped entries and host, user or evidence-source artefacts. Timeline wording alone is discovery-only.
operation: >-
  Regex_incident_timeline_primary (incident timeline / chronology wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a timestamped entry (ISO or d/m/yyyy hh:mm) or a host/user artefact (IPv4, internal hostname, labelled host/user/account/evidence source). 85 requires a timestamped entry (ISO or d/m/yyyy hh:mm) (two distinct hits), a host/user artefact (IPv4, internal hostname, labelled host/user/account/evidence source), and independent attack-phase (initial access, lateral movement, exfiltration, containment) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_incident_timeline_guidance_exclusion).
pattern: >-
  (?i)\b(?:incident\s+timeline|timeline\s+of\s+(?:events|the\s+incident|compromise)|attack\s+timeline|chronology\s+of\s+(?:events|the\s+incident)|event\s+timeline)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a timestamped entry (ISO or d/m/yyyy hh:mm) or a host/user artefact (IPv4, internal hostname, labelled host/user/account/evidence source)), and 85 needs two distinct structures plus independent attack-phase (initial access, lateral movement, exfiltration, containment) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Privacy Act 1988 (Cth)
- NDB Scheme (Cth)
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - initial access
  - lateral movement
  - exfiltration
  - containment
  - eradication
  - first observed
  - privilege escalation
  - ransomware
  - phishing email
  - persistence
  proximity: 300
test_cases:
  should_match:
  - value: The incident timeline will be finalised after the forensic review.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Incident timeline
      2026-09-12 03:14 first alert raised by the mail gateway
    description: Medium-tier probe (75) - one timestamped entry
    synthetic: true
  - value: |-
      Incident timeline - INC-2026-114
      2026-09-12 03:14 phishing email delivered to avery.teston (initial access)
      2026-09-12 03:41 macro executed on ws-fin-114.harbour.internal
      2026-09-12 05:02 lateral movement to 10.20.4.31 using a stolen service account
      2026-09-12 07:15 containment - hosts isolated.
    description: High-tier probe (85) - multiple timestamps, host artefacts, attack phases
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: the incident manager maintains an incident timeline for every major incident.'
    description: Policy text
    synthetic: true
  - value: |-
      Incident timeline template
      Date/time: ________
      Host: [insert]
      Action: ________
    description: Blank template
    synthetic: true
  - value: 'News report: the company published a timeline of events showing attackers moved laterally on 12/09/2026 03:14 before containment.'
    description: News framing
    synthetic: true
false_positives:
- description: Project plans and history articles contain dated timelines.
  mitigation: Enforcement needs incident/timeline wording plus timestamps and host/user artefacts; 85 also needs attack-phase context; guidance/news framing is excluded.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_incident_timeline_primary
    matches:
    - ref: Regex_incident_timeline_timestamp_row
      min_count: 2
      unique_results: true
    - ref: Regex_incident_timeline_host_artefact
    - ref: Keyword_incident_timeline_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_incident_timeline_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_incident_timeline_primary
    matches:
    - type: any
      refs:
      - Regex_incident_timeline_timestamp_row
      - Regex_incident_timeline_host_artefact
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_incident_timeline_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_incident_timeline_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_incident_timeline_primary
    pattern: >-
      (?i)\b(?:incident\s+timeline|timeline\s+of\s+(?:events|the\s+incident|compromise)|attack\s+timeline|chronology\s+of\s+(?:events|the\s+incident)|event\s+timeline)\b
  - id: Regex_incident_timeline_timestamp_row
    pattern: >-
      (?i)\b20\d{2}-[01]\d-[0-3]\d[T ]?[0-2]\d:[0-5]\d(?::[0-5]\d)?|\b[0-3]?\d/[01]?\d/20\d{2}\s+[0-2]?\d:[0-5]\d
  - id: Regex_incident_timeline_host_artefact
    pattern: >-
      (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:host(?:name)?|user(?:name)?|account|source|evidence\s+(?:ref|item|source)|log\s+source)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  keywords:
  - id: Keyword_incident_timeline_context
    groups:
    - match_style: word
      terms:
      - initial access
      - lateral movement
      - exfiltration
      - containment
      - eradication
      - first observed
      - privilege escalation
      - ransomware
      - phishing email
      - persistence
    strength: specific
  - id: Keyword_incident_timeline_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires incident-timeline wording plus timestamped entries and host/user artefacts before enforcing. A real incident timeline can expose when compromise occurred, which controls fired, what responders knew, and how containment unfolded, helping an adversary contest evidence or adapt future activity. The normal scale is one incident and its affected people, systems, and investigators, while generic project timelines and response templates require contextual confirmation. Risk 8 SENSITIVE reflects serious contained investigative harm; PROTECTED would require a critical or legally exceptional incident with significant consequences.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 is consistent with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because an incident
    chronology can reveal evidence, response decisions, and affected systems. PROTECTED is not met by the phrase match
    because incident severity, evidentiary completeness, criticality, and significant damage are not established.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic treatment is Medium with Medium InfoTech controls for incident timelines, preserving need-to-know access
      and evidentiary integrity. High is reserved for critical, protected, or major legal matters with significant
      disclosure consequences.
