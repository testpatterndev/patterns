schema: testpattern/v1
name: HSM key management metadata
slug: global-top500-274-hsm-key-management-metadata
version: 1.4.3
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies hsm key management metadata patterns in security and access control contexts. Detects potential exposure
  of sensitive security information in international systems.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 8 keywords within 300 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:hardware\s+security\s+module|key\s+management|key\s+rotation|key\s+lifecycle|master\s+key|wrapping\s+key|key\s+escrow|key\s+ceremony|cryptographic\s+key)\b
confidence: medium
confidence_justification: structural regex with domain-specific anchors and constrained context replaces phrase-only marker.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
- GDPR
data_categories:
- credentials
- security
corroborative_evidence:
  keywords:
  - hsm key management metadata
  - hsm
  - key
  - management
  - metadata
  - credentials
  - keys
  - secrets
  proximity: 300
test_cases:
  should_match:
  - value: hardware security module
    description: Primary topic phrase match
  - value: key management
    description: Case-insensitive topic phrase match
  - value: key rotation
    description: Alternative topic phrase match
  - value: key lifecycle
    description: Additional topic phrase match
  - value: "hardware security module\nHost: fw01.corp 10.20.30.40\nRule 14: allow tcp/443 from 10.20.0.0/16\nFinding: CVE-2025-21298 unpatched on asset ID WS-004471."
    description: Populated tech record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: hsm key slot
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about hardware security module are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Authentication-related terminology in software documentation, security training materials, or system architecture
    descriptions without actual credentials.
  mitigation: Require proximity to credential-specific patterns (API keys, connection strings, tokens) rather than general
    security terminology.
- description: Code snippets and configuration examples containing credential-related keywords or placeholder values in developer
    documentation.
  mitigation: Check for common placeholder patterns (example.com, localhost, 0000) and documentation file types to reduce
    false positives from technical writing.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_hsm_key_management
      matches:
        - ref: Regex_global_top500_274_hsm_key_management_metadata_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
      min_count: 2
    - confidence_level: 75
      id_match: Regex_hsm_key_management
      matches:
        - ref: Regex_global_top500_274_hsm_key_management_metadata_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_hsm_key_management
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_hsm_key_management
      pattern: (?is)\b(?:hardware\s+security\s+module|key\s+management|key\s+rotation|key\s+lifecycle|master\s+key|wrapping\s+key|key\s+escrow|key\s+ceremony|cryptographic\s+key)\b
    - id: Regex_global_top500_274_hsm_key_management_metadata_record_structure
      pattern: >-
        (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\bCVE-\d{4}-\d{4,7}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:tcp|udp)\s*/?\s*\d{2,5}\b|\b(?:port|dport|sport)\s*[:=]?\s*\d{2,5}\b|\b(?:hostname|host|asset\s+ID|device\s+ID|sAMAccountName|UPN|username|account\s+name)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._\\@-]{2,63}
risk_description: The detector matches hardware security module, HSM, key management, key rotation, or key lifecycle language,
  identifying cryptographic-governance context rather than secret key material. A genuine metadata record can reveal custody
  processes, rotation schedules, key identifiers, system dependencies, and control gaps that improve targeting of key-management
  operations. Standards documentation and general cryptography policy can match, and the pattern does not extract a private
  key, recovery share, or HSM authentication credential. Risk 8 SENSITIVE reflects serious operational-security harm from
  detailed internal metadata; PROTECTED is not supported for a phrase-level record that lacks the keys or significant-damage
  scope.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, SENS_IT, and Medium because
    substantive HSM lifecycle metadata can expose custody processes, rotation schedules, key identifiers, dependencies,
    and control gaps. PROTECTED is not met because the detector identifies governance topics and metadata rather than
    cryptographic key material, privileged HSM access, or significant operational consequence.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic Medium and Medium InfoTech appropriately protect internal cryptographic-management metadata that can aid
      targeted attack planning. Generic High would require actual key material, privileged HSM access, or demonstrated
      significant damage beyond contextual terminology.
frameworks:
  - ISO 27001
  - NIST CSF
