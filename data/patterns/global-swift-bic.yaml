schema: testpattern/v1
name: SWIFT BIC
slug: global-swift-bic
version: 1.6.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects ISO 9362 SWIFT Business Identifier Codes (BICs), the 8- or 11-character bank and branch codes used to route
  international payments. SWIFT/BIC or banking context lifts a match to 85. TestPattern's own detection logic: the
  Microsoft Purview built-in SWIFT Code is catalogued separately as global-swift-bic-builtin.
operation: >-
  Reference: https://en.wikipedia.org/wiki/ISO_9362 Corroborative evidence: 9 keywords within 300 characters. Keyword lists: financial-deposit-terms. Uses additional domain-context evidence and
  explicit exclusion logic for template/sample/test text.
pattern: \b[A-Z]{6}[A-Z0-9]{2}[A-Z0-9]{3}\b|\b[A-Z]{6}[A-Z0-9]{2}\b
confidence: high
confidence_justification: >-
  High confidence: structurally constrained pattern with corroborative keyword support reduces false positive rates significantly. Added context gating and exclusion rules improve precision and reduce
  incidental matches.
jurisdictions:
  - global
regulations:
  - PSD2
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - bank account
    - account number
    - account no
    - BSB
    - routing number
    - sort code
    - IBAN
    - SWIFT
    - BIC
  proximity: 300
  keyword_lists:
    - financial-deposit-terms
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: DEUTDEFF
      description: Deutsche Bank 8-character SWIFT/BIC
    - value: BNPAFRPP
      description: BNP Paribas 8-character SWIFT/BIC
    - value: CHASUS33XXX
      description: JPMorgan Chase 11-character SWIFT/BIC
    - value: 'Beneficiary bank SWIFT code: DEUTDEFF'
      description: Labelled BIC in payment instructions (85 tier)
  should_not_match:
    - value: DEUT1EFF
      description: Contains a digit in the first 6 characters (must be all letters)
    - value: DEUTDE
      description: Only 6 characters instead of minimum 8
    - value: DEUTDEFFXXXX
      description: 12 characters instead of maximum 11
    - value: sample data row, a test value not a real bank code
      description: Template/sample context with no 8-character all-letter token to match the BIC structure
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In English (as the primary international business language), standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      local_noise_filter: true
      id_match: Regex_swift_bic
      matches:
        - ref: Keyword_swift_bic
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_swift_bic
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_swift_bic
      pattern: \b[A-Z]{6}[A-Z0-9]{2}[A-Z0-9]{3}\b|\b[A-Z]{6}[A-Z0-9]{2}\b
  keywords:
    - id: Keyword_swift_bic
      groups:
        - match_style: word
          terms:
            - SWIFT
            - text: BIC
              case_sensitive: true
            - SWIFT code
            - BIC code
            - bank identifier
            - bank code
            - IBAN
            - wire transfer
            - correspondent bank
            - intermediary bank
            - international transfer
            - remittance
      strength: specific
risk_rating: 4
risk_description: >-
  The pattern recognises an ISO 9362-style SWIFT BIC with nearby deposit and banking terms, identifying a financial institution or branch rather than a customer account or payment authority. Disclosure can assist payment routing or identify a banking relationship in context, but BICs are commonly published so counterparties can direct transfers. A BIC alone cannot withdraw funds, authenticate a message, or identify a specific consumer account. Risk 4 OFFICIAL reflects low standalone confidentiality harm; SENSITIVE would require linkage to a confidential transaction, customer account, or non-public payment instruction.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 coherently maps to OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM, OFFI, and Low because a SWIFT BIC is a public
    routing identifier. The next SENSITIVE level is not met without confidential customer or transaction context that
    the code itself does not contain.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low and Low DLM treatment fit a publicly distributed institution code with negligible direct financial
      misuse. Generic Medium would require sensitive linkage rather than the routing datum alone.
references:
  - url: https://www.swift.com/standards/data-standards/bic-business-identifier-code
    title: BIC (Business Identifier Code) - Swift
created: '2026-02-08'
updated: '2026-10-26'
changelog:
  - version: 1.6.0
    date: '2026-10-26'
    description: 'Generated name-word tier removed: the 85 tier whose only evidence was the detector name split into words (Pattern_global_swift_bic_label_context + Keyword_global_swift_bic_domain_context). Its identifying words are already in the curated keyword at the same level, so the tier was redundant. Definitions left unreferenced are removed.'
  - version: 1.5.0
    date: '2026-10-20'
    description: >-
      Custom SIT again, as the owner originally decided: source changes from microsoft to testpattern-community, so
      packages emit these tiers, noise filters and local noise filter as custom XML instead of referencing the Microsoft
      built-in by GUID (which meant this logic never ran). The Microsoft entity is catalogued separately as
      global-swift-bic-builtin. Name and description no longer describe a copy of the built-in, and the reference
      points at Swift's BIC standard. Detection logic is unchanged; a labelled should_match case now exercises the
      85 tier.
  - version: 1.4.0
    date: '2026-10-19'
    description: "Local noise filter: every tier above 65 opts in to the per-tenant Local Noise Exclusion dictionary (local_noise_filter: true). When the export enables it, each of those tiers gets a pattern-level TextMatchFilter (EndsWith, Exclude) reading that dictionary, so the organisation's own published values (its remit-to BSB, account number, SWIFT/BIC or IBAN) stop reaching 75/85 while the 65 tier still reports them. Detection logic and entity filters are unchanged, and the filter is inert until the customer adds entries."
  - version: 1.3.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1269 without changing detector or package metadata.'
  - 'Purview-safe: remove optional multi-match groups'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 90 to 85.; Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
