schema: testpattern/v1
name: Candidate Application Pack (Resume / CV, Cover Letter, Selection Criteria Response)
slug: global-candidate-application-pack
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  A job applicant's own documents as held by recruiters, recruitment platforms and HR: a resume / CV,
  a cover letter with a selection criteria response, or a completed application form. Detected from
  CV section headings (employment history, work experience, education, referees, key skills, career
  objective), a populated candidate contact block (name with phone or email), employment date ranges
  and populated referee details. The panel's side of recruitment (interview notes, selection reports)
  and recommendation letters are covered by separate classifiers.
operation: >-
  Primary: a CV / application section heading followed by a colon or line break (employment / work /
  career history, work / professional experience, career objective / summary / profile, professional
  summary, education, qualifications, referees, key / core / technical skills, core competencies,
  personal details, licences and certifications, selection criteria response, response to the
  selection criteria). 65 is discovery-only (one heading) and surfaces job ads, position descriptions
  and CV guides. 75 requires at least 2 distinct headings plus, within 300 characters, a populated
  contact field: a phone or email label with a real phone number or email address, or a name followed
  by a separator and a phone number or email address. There are two 85 tiers, both built on the 75
  evidence. 85a adds 2 or more distinct employment date ranges (Mar 2019 - Present, 2016 - 2019,
  03/2014 - 11/2018). 85b adds populated referee details (a referee label or heading followed by a name
  and, within 140 characters, a phone number or email address). Every enforce tier excludes
  template/fixture text and job-advertisement, CV-writing-guide and staff-profile wording.
pattern: >-
  (?i)\b(?:employment\s+history|work\s+(?:history|experience)|professional\s+(?:experience|summary|profile)|career\s+(?:history|objective|summary|profile)|education(?:\s+(?:and|&)\s+(?:training|qualifications))?|qualifications|referees|key\s+skills|core\s+(?:skills|competencies)|technical\s+skills|personal\s+details|licen[cs]es\s+(?:and|&)\s+certifications?|selection\s+criteria\s+response|response\s+to\s+(?:the\s+)?selection\s+criteria)[ \t]{0,3}(?::|\r?\n)
confidence: medium
confidence_justification: >-
  Medium: CV headings are shared with job ads, position descriptions, CV writing guides and published
  staff profiles, so enforcement needs a populated phone or email contact with two distinct headings,
  and 85 needs a run of employment date ranges or a referee with contact details. Job-ad, CV-guide and
  staff-profile wording is excluded. CVs laid out as images or with headings the extractor merges into
  body text fall to 65 or below, and a published profile that avoids the excluded wording can reach 75.
  The 85/75 tiers are heuristic evidence tiers, not measured accuracy; tests are synthetic documents.
jurisdictions:
  - global
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - curriculum vitae
    - resume
    - cover letter
    - selection criteria
    - referee
    - employment history
    - career objective
    - key achievements
  proximity: 300
test_cases:
  should_match:
    - value: "Riley Teston | 0412 555 019 | riley.teston@inbox.test\nCareer objective:\nExperienced water treatment operator seeking a senior operations role.\nEmployment history:\nSenior Operator, Northbank Water - Mar 2019 - Present\nTreatment Plant Operator, Riverbend Council - Jan 2014 - Feb 2019\nEducation:\nCertificate IV in Water Industry Operations (2013)"
      description: 85a - resume with a name/contact line, three headings and two employment date ranges
      synthetic: true
    - value: "Application for employment\nPersonal details:\nApplicant name: Casey Teston\nMobile: 0423 555 781\nEmail: casey.teston@inbox.test\nWork experience:\nCustomer service officer, 4 years.\nReferees:\nJordan Examplar, Operations Manager, Harbour Logistics - 07 3555 0199"
      description: 85b - completed application form with contact fields and a referee name with phone number
      synthetic: true
    - value: "Dear Selection Panel,\nPlease find attached my resume for the Senior Project Officer role.\nResponse to the selection criteria:\n1. Stakeholder engagement - in my current role I coordinate twelve regional councils.\nKey skills:\nProject governance, procurement, contract management.\nMorgan Teston\nPhone: 0438 555 206"
      description: 75 - cover letter with selection criteria response, two headings and a populated phone number
      synthetic: true
    - value: "Avery Examplar - avery.examplar@inbox.test\nProfessional summary:\nPayroll specialist with Aurion and SAP experience.\nQualifications:\nBachelor of Business (Accounting)"
      description: 75 - short CV with two headings and a name / email line, no dates or referees
      synthetic: true
  should_not_match:
    - value: "Senior Project Officer (AO6)\nAbout the role:\nLead delivery of regional infrastructure projects.\nKey skills:\nStakeholder engagement, procurement, contract management.\nQualifications:\nA degree in engineering or project management is desirable.\nContact: Jordan Teston on 07 3555 0199 or jordan.teston@agency.test\nApplications close 5pm 14 October 2026. See how to apply."
      description: Job advertisement / position description with headings and a contact officer
    - value: "How to write a resume\nWork experience:\nList your roles in reverse order, with dates such as Mar 2019 - Present and Jan 2014 - Feb 2019.\nReferees:\nAvailable on request is fine for most employers.\nEmail: yourname@provider.test - use a professional address on your resume."
      description: CV writing guide with headings, example date ranges and an example email
    - value: "Application for employment\nPersonal details:\nApplicant name: __________\nMobile: __________\nEmail: __________\nWork experience:\n______________________\nReferees:\nName: ________ Phone: ________"
      description: Blank application form
    - value: "Dr Harper Teston - Senior Lecturer, School of Engineering\nEducation:\nPhD (Civil Engineering), 2012\nProfessional experience:\nTen years in water infrastructure consulting.\nResearch interests: catchment modelling, asset renewal.\nEmail: harper.teston@uni.test"
      description: Published staff profile / bio with headings and a work email
    - value: "A recruitment platform left an open database holding applicant names, contact details, salary expectations and uploaded CVs for more than 800 companies."
      description: Breach news report about CV data
false_positives:
  - description: Job advertisements and position descriptions that use the same headings (key skills, qualifications) and list a contact officer's phone and email.
    mitigation: Job-ad wording (applications close, how to apply, about the role, about you, what we offer, closing date) is excluded from enforce tiers.
  - description: CV writing guides and resume templates with example headings, dates and email addresses.
    mitigation: CV-guide wording (how to write a resume, your resume, your CV, resume tips) and template fixture phrases are excluded; blank lines and placeholders fail the contact regex.
  - description: Published staff profiles and speaker bios with education and experience headings and a work email.
    mitigation: Staff-profile wording (research interests, staff profile, meet the team, our people, biography) is excluded. A bio without that wording can still reach 75; tune locally.
  - description: Selection reports and referee reports written by the panel.
    mitigation: Those are the panel side and are covered by au-qld-public-sector-selection-report and global-top500-074; a pack with an attached referee report may match both.
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_cv_heading
      min_count: 2
      unique_results: true
      matches:
        - ref: Regex_cv_contact
        - ref: Regex_cv_date_range
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_cv_exclusion
    - confidence_level: 85
      id_match: Regex_cv_heading
      min_count: 2
      unique_results: true
      matches:
        - ref: Regex_cv_contact
        - ref: Regex_cv_referee
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_cv_exclusion
    - confidence_level: 75
      id_match: Regex_cv_heading
      min_count: 2
      unique_results: true
      matches:
        - ref: Regex_cv_contact
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_cv_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_cv_heading
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_cv_heading
      pattern: >-
        (?i)\b(?:employment\s+history|work\s+(?:history|experience)|professional\s+(?:experience|summary|profile)|career\s+(?:history|objective|summary|profile)|education(?:\s+(?:and|&)\s+(?:training|qualifications))?|qualifications|referees|key\s+skills|core\s+(?:skills|competencies)|technical\s+skills|personal\s+details|licen[cs]es\s+(?:and|&)\s+certifications?|selection\s+criteria\s+response|response\s+to\s+(?:the\s+)?selection\s+criteria)[ \t]{0,3}(?::|\r?\n)
    - id: Regex_cv_contact
      pattern: >-
        (?i)\b(?:mobile|mob|phone|ph|tel|telephone|email|e-mail)[ \t]{0,3}[:.]?[ \t]{0,3}(?:(?:\+?61[ \t]?4\d{2}|04\d{2})[ \t]?\d{3}[ \t]?\d{3}|(?:\+?61[ \t]?[2378]|\(0[2378]\)|0[2378])[ \t]?\d{4}[ \t]?\d{4}|\+\d{1,3}[ \t]?\d{2,4}[ \t]?\d{3,4}[ \t]?\d{3,4}|[a-z0-9._%+-]{1,40}@[a-z0-9-]{1,40}(?:\.[a-z0-9-]{1,40}){0,3}\.[a-z]{2,10}\b)|\b[A-Z][A-Za-z'-]{1,20}[ \t]+[A-Z][A-Za-z'-]{1,25}[ \t]{0,3}[|,•·–-][ \t]{0,3}(?:(?:\+?61[ \t]?4\d{2}|04\d{2})[ \t]?\d{3}[ \t]?\d{3}|(?:\+?61[ \t]?[2378]|\(0[2378]\)|0[2378])[ \t]?\d{4}[ \t]?\d{4}|[a-z0-9._%+-]{1,40}@[a-z0-9-]{1,40}(?:\.[a-z0-9-]{1,40}){0,3}\.[a-z]{2,10}\b)
    - id: Regex_cv_date_range
      pattern: >-
        (?i)\b(?:(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\.?[ \t]+)?(?:19|20)\d{2}[ \t]{0,3}(?:-|–|—|to|until)[ \t]{0,3}(?:(?:(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\.?[ \t]+)?(?:19|20)\d{2}\b|present\b|current\b|now\b|date\b)|\b(?:0?[1-9]|1[0-2])/(?:19|20)\d{2}[ \t]{0,3}(?:-|–|—|to)[ \t]{0,3}(?:(?:0?[1-9]|1[0-2])/(?:19|20)\d{2}\b|present\b|current\b)
    - id: Regex_cv_referee
      pattern: >-
        (?i)\b(?:referees?|references?)(?:[ \t]{0,2}\d)?[ \t]{0,3}[:\-]?[ \t]{0,3}(?:\r?\n)?[ \t]{0,3}(?:name[ \t]{0,2}:[ \t]{0,3})?(?!(?:available|on\s+request|upon\s+request|provided|to\s+be\s+provided|n/?a|tbc|tba|name|the|a|an|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'.-]{1,30}(?:[ \t]+[A-Z][A-Za-z'.-]{1,30}){1,3}[\s\S]{0,140}?(?:(?:\+?61[ \t]?4\d{2}|04\d{2})[ \t]?\d{3}[ \t]?\d{3}|(?:\+?61[ \t]?[2378]|\(0[2378]\)|0[2378])[ \t]?\d{4}[ \t]?\d{4}|[a-z0-9._%+-]{1,40}@[a-z0-9-]{1,40}(?:\.[a-z0-9-]{1,40}){0,3}\.[a-z]{2,10}\b)
  keywords:
    - id: Keyword_cv_exclusion
      groups:
        - match_style: word
          terms:
            - applications close
            - closing date
            - how to apply
            - about the role
            - about you
            - what we offer
            - how to write a resume
            - how to write a CV
            - your resume
            - your CV
            - resume tips
            - CV tips
            - resume writing
            - CV writing
            - research interests
            - staff profile
            - meet the team
            - our people
            - biography
      strength: specific
risk_rating: 7
risk_description: >-
  A candidate's CV or application pack gives their name, personal phone and email, full work and
  education history, and often referees' names and numbers, salary expectations, visa or citizenship
  status and health or disability disclosures made to support an application. Recruitment platforms,
  applicant-tracking systems and recruitment chatbots have leaked these documents in bulk (open
  databases, misconfigured cloud storage holding millions of resumes, and applicant records taken in
  HR SaaS compromises). The data supports identity fraud, fake-job phishing and targeted social
  engineering, and exposes referees who never consented to publication. Risk 7 supports OFFICIAL:
  Sensitive / SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: Queensland Recruitment and Selection Directive 07/23 (referee checks, applicant documentation)
    url: https://www.forgov.qld.gov.au/pay-benefits-and-policy/directives-policies-circulars-and-guidelines/recruitment-and-selection-directive-0723
  - title: OAIC - Employee records exemption
    url: https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/organisations/employee-records-exemption
  - title: OAIC - Data breach notifications increase to all-time high in 2025 (NDB statistics)
    url: https://www.oaic.gov.au/news/media-centre/data-breach-notifications-increase-to-all-time-high-in-2025,-new-ndb-stats-show
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: >-
      Initial release - applicant's own CV / cover letter / selection criteria response / application
      form, gated on two distinct CV headings plus a populated phone or email contact (75); 85 adds
      employment date ranges or populated referee details. Referee details fold in the referee-report
      gap on the candidate side.
