schema: testpattern/v1
name: Contracted pricing schedules
slug: global-top500-145-contracted-pricing-schedules
version: 1.6.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Negotiated pricing schedules from supply, service and maintenance contracts: contracted pricing, price and rate
  schedules, rate cards and contract unit rates with priced lines (amount per tonne, MWh, GJ, litre, hour, day and
  similar) and commercial terms such as indexation, price review, take-or-pay and volume discounts. Covers
  contracted rather than tendered prices; government-procurement-pricing-schedule-sealed covers sealed tender price
  submissions.
operation: >-
  Primary: contracted pricing / prices, pricing or price schedule, schedule of rates or prices, rate card, unit
  pricing / prices / rates, volume discount, price agreement, contract rate(s) / price(s), commercial in confidence,
  pricing tier, standing offer. 75 needs, within 300 characters, two distinct priced lines - a dollar amount per unit
  (t, tonne, MWh, kWh, GJ, ML, kL, m3, L, litre, kg, km, hour, day, week, month, annum, unit, each, item) or a
  percentage discount or rebate. 85 needs three distinct priced lines plus a commercial term (indexation, CPI,
  escalation, price review, take-or-pay, rise and fall, minimum order or volume, payment terms, demurrage). Every
  enforce tier excludes template text and published price material (media kits, recommended retail prices, the
  Default Market Offer and Victorian Default Offer, media releases, annual reports). 65 is discovery-only.
pattern: (?is)\b(contracted\s+pric(?:ing|es)|pric(?:ing|e)\s+schedule|schedule\s+of\s+(?:rates|prices)|rate\s+card|unit\s+(?:pricing|prices|rates)|volume\s+discount|price\s+agreement|contract\s+(?:rates?|prices?)|commercial\s+in\s+confidence|pricing\s+tier|standing\s+offer)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases are common in contracts and procurement prose, so enforce tiers need two or three
  distinct priced lines with a unit or a percentage discount, which policy text, empty forms and memos lack.
  Published rate cards and retail price lists share the shape and are excluded by source terms within the window
  only. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Competition and Consumer Act 2010 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - business
  - financial
corroborative_evidence:
  keywords:
    - indexation
    - CPI
    - escalation
    - price review
    - take-or-pay
    - minimum order
    - payment terms
  proximity: 300
test_cases:
  should_match:
    - value: "Schedule 3 - Contracted pricing (commercial in confidence)\nCoal supply agreement: base price $118.40/t FOR, volume discount 2.5% above 1.2 Mt per annum\nRail haulage $14.20/t, demurrage $38,000/day\nPrice review: CPI indexation each 1 July; take-or-pay 85%."
      description: Fuel supply contracted pricing with several priced lines and commercial terms - intended 85
      synthetic: true
    - value: "Maintenance services rate card FY27 - Example Mechanical Pty Ltd\nFitter $142.00/hr; Rigger $128.50/hr; 50t crane $1,950/day; after-hours loading 50%.\nRates fixed to 30 June 2027, then CPI escalation."
      description: Service contract rate card with priced lines and escalation - intended 85
      synthetic: true
    - value: "Water treatment chemicals - contract rates 2026-27\nSodium hypochlorite $0.62/L, Alum $410/t."
      description: Contract unit rates with two priced lines - intended 75
      synthetic: true
    - value: |-
        Contracted pricing
        To: Executive Committee
        From: Chief Financial Officer
        Date: 14 August 2026
        Subject: Contracted pricing - FY27 review
      description: Memo heading without priced lines (65 discovery only)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: procurement inventory
      description: Generic word pair from old broad template should not match
    - value: |-
        Contracted pricing:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values (discovery only)"
    - value: "Policy guidance: this procedure explains how records about contracted pricing are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any priced line (discovery only)
    - value: "Media kit 2026 - advertising rate card: full page $4,500 per insertion, half page $2,600 per insertion, online banner $38 per day."
      description: Published advertising rate card (public)
    - value: "Rate card template - Service | Unit | Rate\n[service] | [unit] | $[rate]/hr\nUse this template for supplier submissions."
      description: Blank rate card template
false_positives:
  - description: Published rate cards, media kits, retail price lists and regulated default offers quote prices per unit.
    mitigation: Source terms (media kit, recommended retail price, Default Market Offer, Victorian Default Offer, media
      release, annual report) are excluded within the proximity window at every enforce tier.
  - description: Contract and procurement prose that names pricing schedules or rate cards without any prices.
    mitigation: Enforce tiers need two or three distinct priced lines with a unit or a percentage discount.
  - description: News about commodity contract prices, or retail shelf unit prices, quoting two amounts per unit.
    mitigation: Residual at 75 (not excluded). The label is OFFICIAL, so the impact of a false match is low; 85 still
      needs a third priced line and a commercial term.
  - description: Sealed tender price submissions.
    mitigation: Covered by government-procurement-pricing-schedule-sealed; both may fire on a tender pricing schedule.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_contracted_pricing
      matches:
        - ref: Regex_global_top500_145_priced_line
          min_count: 3
          unique_results: true
        - ref: Keyword_global_top500_145_commercial_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
            - Keyword_global_top500_145_public_price_exclusion
    - confidence_level: 75
      id_match: Pattern_contracted_pricing
      matches:
        - ref: Regex_global_top500_145_priced_line
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
            - Keyword_global_top500_145_public_price_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_contracted_pricing
  regexes:
    - id: Pattern_contracted_pricing
      pattern: (?is)\b(contracted\s+pric(?:ing|es)|pric(?:ing|e)\s+schedule|schedule\s+of\s+(?:rates|prices)|rate\s+card|unit\s+(?:pricing|prices|rates)|volume\s+discount|price\s+agreement|contract\s+(?:rates?|prices?)|commercial\s+in\s+confidence|pricing\s+tier|standing\s+offer)\b
    - id: Regex_global_top500_145_priced_line
      pattern: (?i)((?:\$|AUD\s?)\s?\d{1,3}(?:,\d{3}){0,3}(?:\.\d{1,4})?\s?(?:/|per\s)\s?(?:t|tonnes?|MWh|kWh|GJ|ML|kL|m3|L|litres?|kg|km|h|hr|hours?|days?|weeks?|months?|annum|year|units?|each|items?)\b|\b\d{1,2}(?:\.\d{1,2})?\s?%\s?(?:volume\s+)?(?:discount|rebate)\b)
  keywords:
    - id: Keyword_global_top500_145_commercial_terms
      groups:
        - match_style: word
          terms:
            - indexation
            - text: CPI
              case_sensitive: true
            - escalation
            - price review
            - take-or-pay
            - take or pay
            - rise and fall
            - minimum order
            - minimum volume
            - payment terms
            - demurrage
      strength: specific
    - id: Keyword_global_top500_145_public_price_exclusion
      groups:
        - match_style: word
          terms:
            - media kit
            - recommended retail price
            - Default Market Offer
            - Victorian Default Offer
            - media release
            - annual report
      strength: specific
risk_description: >-
  The classifier enforces only when contracted-pricing language sits with two or more priced lines (amount per unit or
  a percentage discount), and at 85 with a commercial term such as indexation or take-or-pay. A genuine schedule
  reveals negotiated unit rates, discounts and escalation terms, letting competitors or counterparties undercut or
  price against the owner in the next negotiation. One schedule usually affects a bounded supplier relationship.
  Risk 5 OFFICIAL reflects material but contained commercial harm; SENSITIVE requires an active strategic
  negotiation, portfolio-wide rates, dominant-market effects, or trade-secret pricing methodology.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 5 consistently maps to PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because one schedule has limited
    commercial value without products, quantities, counterparties, and transaction context. SENSITIVE is not met by the
    topic match or an isolated rate table absent broader strategic pricing or demonstrable moderate direct harm.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low DLM is appropriate for a bounded rate schedule whose misuse depends on commercial context and a
      specific negotiation. A consolidated pricing strategy or active deal file would require stronger handling.
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.6.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.5.0
    date: '2026-10-23'
    description: >-
      Energy dataset gap review: enforce tiers now look for priced lines instead of memo header fields, which never
      appear in a real pricing schedule (a realistic fuel supply schedule, rate card and contract rate table only
      reached 65). 75 needs two distinct priced lines (amount per unit or percentage discount / rebate); 85 needs
      three plus a commercial term (indexation, CPI, escalation, price review, take-or-pay, rise and fall, minimum
      order or volume, payment terms, demurrage). Primary adds contracted prices, price schedule, schedule of rates /
      prices, unit prices / rates and contract prices. Published price material excluded. Description, data
      categories (business, financial) and regulations corrected: a pricing schedule is commercial data, not
      personal information. Risk and labels unchanged.
  - version: 1.4.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires 2 distinct independent populated document header fields (Regex_global_top500_145_contracted_pricing_schedules_record_structure); 85 requires 3 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list. Removed evidence no longer referenced by any tier (Evidence_contracted_pricing). Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 746 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
