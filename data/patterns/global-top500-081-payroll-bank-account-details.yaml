schema: testpattern/v1
name: Payroll bank account details
slug: global-top500-081-payroll-bank-account-details
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects employee payroll bank account details: a payroll/salary account or direct-deposit phrase combined with a BSB, a bank account number or a named employee/payee field. Phrase-only mentions (policies, scam warnings) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: payroll bank (account) details, salary/wage/pay (bank) account (details), direct deposit details/authorisation/form, employee bank details, bank account details for salary/payroll, nominated account for salary/wages. 65 (discovery only): primary alone. 75: primary plus one populated field - BSB (6 digits), bank account number (6-10 digits) or a named employee/staff number/payee/account holder. 85: primary plus two distinct field types (the three above or an allocation line with a percentage/amount) plus payroll evidence (net pay, pay cycle, pay run, pay period, payslip, superannuation, effective from, change of bank details). Template/sample framing and guidance/training framing excluded on every enforce tier.
pattern: (?i)\b(?:payroll\s+bank(?:ing)?\s+(?:account\s+)?details|(?:salary|wages?|pay)\s+(?:bank\s+)?account(?:\s+details)?|direct\s+deposit\s+(?:details|authori[sz]ation|form)|employee\s+bank(?:ing)?\s+details|bank\s+account\s+details\s+for\s+(?:salary|payroll|pay|wages)|nominated\s+(?:bank\s+)?account\s+for\s+(?:salary|wages|pay))\b
confidence: medium
confidence_justification: >-
  Enforce tiers need a populated BSB, account number or employee field beside the payroll phrase; the previous 75 tier fired on the phrase alone. Payroll-change scam warnings and self-service help pages stay at 65. Medium because HR onboarding correspondence with the same fields is itself sensitive.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Fair Work Act 2009 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - net pay
    - pay cycle
    - pay run
    - pay period
    - payslip
    - superannuation
    - effective from
    - change of bank details
    - payroll officer
    - direct credit
  proximity: 300
  keyword_lists:
    - financial-deposit-terms
    - industry-hr
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: "Payroll bank account details - change form\nEmployee name: Avery Teston\nEmployee ID: 004471\nAccount name: A Teston\nBSB: 064-000\nAccount number: 12345678\nAllocation: 100% of net pay, effective from the pay run of 12/08/2026."
      description: Populated change form - employee, BSB, account number and allocation (85)
      synthetic: true
    - value: "Direct deposit details received for new starter\nEmployee: Jordan Whitlock\nPlease key into the payroll system before Thursday."
      description: Direct deposit note with a named employee only (75)
      synthetic: true
    - value: "this record references the payroll bank account details held on file"
      description: Phrase-only reference (65 discovery)
  should_not_match:
    - value: "Policy guidance: employees can update their payroll bank account details in the self-service portal. Never send your BSB or account number by email."
      description: HR guidance naming the fields without values
      synthetic: true
    - value: "Direct deposit authorisation form\nEmployee name: __________\nBSB: ___-___\nAccount number: __________"
      description: Blank authorisation form - placeholder values
      synthetic: true
    - value: "Training module: scammers impersonate staff and ask payroll to change salary account details to a new BSB. Verify every request by phone."
      description: Security awareness training
      synthetic: true
    - value: "unrelated generic text"
      description: Unrelated
    - value: "template example placeholder record identifier"
      description: Template wording
false_positives:
  - description: HR policies, payroll help pages and payroll-redirection scam warnings.
    mitigation: No populated BSB, account number or employee field, and guidance/training framing is excluded.
  - description: Supplier or customer bank details that mention salary accounts.
    mitigation: Still requires a payroll/salary/direct-deposit phrase; reviewers should confirm the payee is an employee.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_payroll_bank_account
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_081_payroll_bank_account_details_bsb
            - Regex_global_top500_081_payroll_bank_account_details_account_number
            - Regex_global_top500_081_payroll_bank_account_details_payee
            - Regex_global_top500_081_payroll_bank_account_details_allocation
        - ref: Keyword_payroll_bank_account
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_081_payroll_bank_account_details_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_payroll_bank_account
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_081_payroll_bank_account_details_bsb
            - Regex_global_top500_081_payroll_bank_account_details_account_number
            - Regex_global_top500_081_payroll_bank_account_details_payee
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_081_payroll_bank_account_details_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_payroll_bank_account
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_payroll_bank_account
      pattern: (?i)\b(?:payroll\s+bank(?:ing)?\s+(?:account\s+)?details|(?:salary|wages?|pay)\s+(?:bank\s+)?account(?:\s+details)?|direct\s+deposit\s+(?:details|authori[sz]ation|form)|employee\s+bank(?:ing)?\s+details|bank\s+account\s+details\s+for\s+(?:salary|payroll|pay|wages)|nominated\s+(?:bank\s+)?account\s+for\s+(?:salary|wages|pay))\b
    - id: Regex_global_top500_081_payroll_bank_account_details_bsb
      pattern: (?i)\bBSB(?:[ \t]{1,3}(?:no\.?|number))?[ \t]{0,3}[:#]?[ \t]{0,3}\d{3}[ \t-]?\d{3}\b
    - id: Regex_global_top500_081_payroll_bank_account_details_account_number
      pattern: (?i)\b(?:(?:bank\s+)?account|acct|a/c)[ \t]{0,3}(?:no\.?|number|#)[ \t]{0,3}[:#]?[ \t]{0,3}\d{6,10}\b
    - id: Regex_global_top500_081_payroll_bank_account_details_payee
      pattern: (?i)\b(?:employee(?:\s+(?:name|no\.?|number|ID))?|staff\s*(?:no\.?|number|ID)|payee|account\s+(?:name|holder))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
    - id: Regex_global_top500_081_payroll_bank_account_details_allocation
      pattern: (?i)\b(?:allocation|split|remainder|percentage|amount)[ \t]{0,3}[:#][ \t]{0,3}(?:\d{1,3}[ \t]?%|remainder|balance|(?:AUD|USD|NZD|GBP|EUR|A\$|US\$|NZ\$|\$|£|€)[ \t]?(?:\d{1,3}(?:,\d{3}){1,4}|\d{1,12})(?:\.\d{2})?(?![\d,]\d)(?!\.\d))
  keywords:
    - id: Keyword_payroll_bank_account
      groups:
        - match_style: word
          terms:
            - net pay
            - pay cycle
            - pay run
            - pay period
            - payslip
            - superannuation
            - effective from
            - change of bank details
            - payroll officer
            - direct credit
      strength: domain
    - id: Keyword_global_top500_081_payroll_bank_account_details_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - self-service portal
            - never send your
      strength: noise
risk_description: >-
  The pattern recognises the phrase payroll bank account details with nearby payroll and financial-deposit vocabulary, indicating a payroll banking record rather than validating a specific account format. A genuine record can expose where wages are paid and support payroll diversion, supplier-style impersonation, or targeted fraud when paired with an employee name and change process. Published guidance, HR templates, and accounting discussion can match, and the low-confidence phrase does not prove that complete bank details are present. Risk 7 SENSITIVE reflects credible moderate employee financial harm from a true record; PROTECTED would require a payroll master file, authorisation data, or significant damage. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps coherently to OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Financial, SENS_Fin, and Medium because
    authentic payroll banking details can materially enable payment diversion. The concept detector does not establish
    bulk scale, completeness, or direct authority sufficient for PROTECTED.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Generic Medium and Medium Financial handling suit employee payment-account details with moderate fraud and privacy
      impact. Generic High would require a bulk payroll file or operative authorisation elements.
