schema: testpattern/v1
name: Research participant consent files
slug: global-top500-355-research-participant-consent-files
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to research participant consent files in Australian contexts. This information type is classified as personally identifiable information under applicable
  data protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(?:research\s+participant\s+consent\s+files|research\s+participant|consent\s+form|informed\s+consent|participant\s+information\s+sheet|ethics\s+approval|voluntary\s+participation|withdrawal\s+of\s+consent|research\s+ethics|human\s+subjects|clinical\s+trial\s+consent)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - research participant consent files
    - research
    - participant
    - consent
    - files
    - education
    - administration
  proximity: 300
  keyword_lists:
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: research participant consent files
      description: Primary topic phrase match
    - value: research participant
      description: Case-insensitive topic phrase match
    - value: consent form
      description: Alternative topic phrase match
    - value: informed consent
      description: Additional topic phrase match
    - value: "research participant consent files\nPatient name: Avery Teston\nURN: 004418273\nDate of birth: 04/02/1991\nClinician: Dr Jordan Staffson\nNotes: research participant consent files reviewed at appointment on 12/08/2026."
      description: Populated health record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: student grant
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how records about research participant consent files are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to research participant consent files appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_research_participant_consent
      matches:
        - ref: Regex_global_top500_355_research_participant_consent_files_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_research_participant_consent
      matches:
        - ref: Regex_global_top500_355_research_participant_consent_files_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_research_participant_consent
      matches:
        - ref: Evidence_research_participant_consent
  regexes:
    - id: Pattern_research_participant_consent
      pattern: >-
        (?is)\b(?:research\s+participant\s+consent\s+files|research\s+participant|consent\s+form|informed\s+consent|participant\s+information\s+sheet|ethics\s+approval|voluntary\s+participation|withdrawal\s+of\s+consent|research\s+ethics|human\s+subjects|clinical\s+trial\s+consent)\b
    - id: Regex_global_top500_355_research_participant_consent_files_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|patient|client|participant|donor|recipient|clinician|URN|UR\s+number|MRN|medical\s+record\s+number|Medicare(?:\s+number)?|IHI|referring\s+(?:doctor|practitioner)|(?:specimen|accession|lab|laboratory|study|participant|patient|client|trial|case|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_research_participant_consent
      groups:
        - match_style: word
          terms:
            - research participant consent files
            - research participant
            - consent form
            - informed consent
            - participant information sheet
            - ethics approval
            - voluntary participation
            - withdrawal of consent
            - NHMRC
            - research ethics
            - human subjects
            - clinical trial consent
risk_description: >-
  This detector finds research participant consent files, research participant, and consent form language with nearby study context. A normal true positive is a signed participant record linking identity and contact details to study participation, eligibility, procedures, and possibly health or vulnerability information. Blank consent templates, ethics guidance, and recruitment materials can also match because the concept pattern does not confirm a signature or populated subject data. Risk 8 SENSITIVE fits one participant file, while PROTECTED requires highly dangerous study details, re-identifiable bulk cohorts, or significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
references:
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "OAIC - Notifiable Data Breaches scheme"
    url: https://www.oaic.gov.au/privacy/notifiable-data-breaches
