schema: testpattern/v1
name: Rail signaling configurations
slug: global-top500-450-rail-signaling-configurations
version: 1.4.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects rail signalling configuration data: interlocking or control-table wording with populated signal, route, points, track-circuit and balise identifiers plus overlap, release-timing, speed and chainage values. Topic wording alone is discovery-only.
operation: >-
  Regex_rail_signalling_primary (rail signalling configuration/design data, interlocking data/tables, control or route-setting tables, scheme plan, ETCS/CBTC/PTC configuration wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated signalling asset field (signal, route, points, track circuit, axle counter, balise group, block section, berth, interlocking, station/control area) or a distance or timing value (overlap, release/approach-locking time, speed, sighting distance, chainage). 85 requires a populated signalling asset field (signal, route, points, track circuit, axle counter, balise group, block section, berth, interlocking, station/control area) (two distinct hits), a distance or timing value (overlap, release/approach-locking time, speed, sighting distance, chainage), and independent interlocking-logic (route locking, flank protection, points detection, conflicting routes) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_rail_signalling_guidance_exclusion).
pattern: >-
  (?i)\b(?:rail\s+signal(?:l)?ing\s+(?:configuration|design|data|plan)|interlocking\s+(?:configuration|data|design|tables?)|control\s+tables?|route\s+(?:setting|locking)\s+tables?|signal(?:l)?ing\s+(?:scheme\s+plan|design\s+data|control\s+tables?)|track\s+circuit\s+configuration|aspect\s+sequence\s+table|(?:ETCS|CBTC)\s+(?:configuration|data|parameters)|positive\s+train\s+control\s+configuration)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated signalling asset field (signal, route, points, track circuit, axle counter, balise group, block section, berth, interlocking, station/control area) or a distance or timing value (overlap, release/approach-locking time, speed, sighting distance, chainage)), and 85 needs two distinct structures plus independent interlocking-logic (route locking, flank protection, points detection, conflicting routes) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
  - global
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
  - IEC 62443
  - ISO 27001
  - NIST CSF
data_categories:
  - security
corroborative_evidence:
  keywords:
    - route locking
    - flank protection
    - points detection
    - aspect sequence
    - train detection
    - signal box
    - control centre
    - conflicting routes
    - sectional release
    - normal and reverse
  proximity: 300
test_cases:
  should_match:
    - value: The interlocking data for the new platform will be issued for testing in March.
      description: Discovery probe (65)
      synthetic: true
    - value: |-
        Control table - Central interlocking
        Route: R17
        Signal: CE204
      description: Medium-tier probe (75) - populated asset fields
      synthetic: true
    - value: |-
        Interlocking control table - Central control area
        Route: R17 (CE204 to CE212)
        Points: P451 normal, P453 reverse
        Track circuit: CE-TC112
        Overlap distance: 180 m; approach locking time: 120 s
        Flank protection from P455; conflicting routes R18 and R21 locked; sectional release by train detection.
      description: High-tier probe (85) - several signalling identifiers, distance/timing values and interlocking logic
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match
    - value: 'Policy statement: interlocking data changes require independent verification before commissioning.'
      description: Policy text
      synthetic: true
    - value: |-
        Control table template
        Route: ________
        Signal: [insert]
      description: Blank template
      synthetic: true
    - value: 'Course module 4: a control table lists the route, signal and overlap distance: 180 m for each route.'
      description: Training framing
      synthetic: true
    - value: The public signalling standard explains interlocking principles.
      description: Public standard discussion
      synthetic: true
false_positives:
  - description: Signalling principles standards and training describe control tables.
    mitigation: Guidance/training framing is excluded; 85 needs two asset identifiers, a distance/timing value and interlocking-logic context.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_rail_signalling_primary
      matches:
        - ref: Regex_rail_signalling_asset_id_field
          min_count: 2
          unique_results: true
        - ref: Regex_rail_signalling_distance_timing
        - ref: Keyword_rail_signalling_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_rail_signalling_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_rail_signalling_primary
      matches:
        - type: any
          refs:
            - Regex_rail_signalling_asset_id_field
            - Regex_rail_signalling_distance_timing
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_rail_signalling_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_rail_signalling_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_rail_signalling_primary
      pattern: >-
        (?i)\b(?:rail\s+signal(?:l)?ing\s+(?:configuration|design|data|plan)|interlocking\s+(?:configuration|data|design|tables?)|control\s+tables?|route\s+(?:setting|locking)\s+tables?|signal(?:l)?ing\s+(?:scheme\s+plan|design\s+data|control\s+tables?)|track\s+circuit\s+configuration|aspect\s+sequence\s+table|(?:ETCS|CBTC)\s+(?:configuration|data|parameters)|positive\s+train\s+control\s+configuration)\b
    - id: Regex_rail_signalling_asset_id_field
      pattern: >-
        (?i)\b(?:signal|route|points?|track\s+circuit|axle\s+counter(?:\s+section)?|balise(?:\s+group)?|block\s+section|berth|point\s+machine|interlocking|station(?:\s+ID)?|control\s+area)(?:\s+(?:ID|no\.?|number))?\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
    - id: Regex_rail_signalling_distance_timing
      pattern: >-
        (?i)\b(?:overlap(?:\s+distance)?|release\s+time|approach\s+locking\s+time|speed\s+(?:limit|restriction)|line\s+speed|sighting\s+distance|chainage|km\s?post)\s*[:=]?\s*\d{1,4}(?:\.\d{1,3})?\s*(?:m|s|sec(?:onds)?|km/h|km)\b|\b\d{1,3}\.\d{3}\s?km\b
  keywords:
    - id: Keyword_rail_signalling_context
      groups:
        - match_style: word
          terms:
            - route locking
            - flank protection
            - points detection
            - aspect sequence
            - train detection
            - signal box
            - control centre
            - conflicting routes
            - sectional release
            - normal and reverse
      strength: specific
    - id: Keyword_rail_signalling_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - guidance note
            - best practice guide
            - media release
            - press release
            - news report
            - course module
            - learning objectives
            - awareness course
            - webinar
            - lesson plan
            - quiz question
      strength: domain
risk_description: >-
  The detector now requires signalling-configuration wording plus populated signalling asset identifiers or distance/timing values before enforcing. A genuine configuration can expose route logic, control boundaries, and field equipment relationships that assist targeted disruption, unsafe routing attempts, or evasion of railway safeguards. The normal affected unit is one line, control area, or signaling installation and its passengers and operators, while standards, training diagrams, and product documentation remain plausible matches. For the global catalogue analogue, the confirmed substantive record is the consequence unit. Live interlocking, route, block, track-circuit and axle-counter configuration can support unsafe interference or major transport disruption. Significant continuity and life-safety damage is inherent. Risk 10 and PROTECTED InfoTech therefore apply to the confirmed record itself. Require network/site identity and actual route/interlocking/configuration tables; standards and procurement material audit only. This is confidence and exception handling, not a reason to reduce the consequence of a true positive.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED InfoTech
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Confidential
classification:
  tier: High
  rationale: >-
    Risk 10 is warranted because live interlocking, route, block, track-circuit and axle-counter configuration can
    support unsafe interference or major transport disruption. PSPF PROTECTED, QGISCF PROTECTED, PROTECTED InfoTech,
    PROT_IT, High and High InfoTech align with that credible significant-damage case. The global expression carries the
    same consequence once its record structure and operational context are established. Require network/site identity
    and actual route/interlocking/configuration tables; standards and procurement material audit only. Those controls
    govern match disposition while the confirmed record remains PROTECTED.
  generic:
    classification: High
    dlm: High InfoTech
    rationale: >-
      High InfoTech handling is appropriate because live interlocking, route, block, track-circuit and axle-counter
      configuration can support unsafe interference or major transport disruption. Access should be restricted to
      operators and engineers responsible for the affected control environment or essential service. Global policy,
      historical and training references remain lower-confidence exceptions rather than lower-classified records.
