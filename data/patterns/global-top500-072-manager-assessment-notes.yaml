schema: testpattern/v1
name: Manager assessment notes
slug: global-top500-072-manager-assessment-notes
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects manager and supervisor notes, feedback and observations about an identified employee or direct report, with meeting dates, capability ratings, concerns raised or agreed actions.
operation: >-
  Primary: a manager-notes phrase (manager assessment/notes/feedback/comments/observations, supervisor notes/assessment/observations, supervisory notes, one-on-one notes). 75 tier requires a populated person field (employee/staff name or number, direct report, team member, position number or title, work unit) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated note detail (meeting/discussion date, capability rating, concerns raised or agreed actions) and an independent corroborative term (wellbeing, attendance, conduct, coaching, expectations). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:manager(?:'s)?\s+(?:assessment|notes|feedback|comments|observations|evaluation)|supervisor(?:'s)?\s+(?:notes|assessment|comments|observations)|supervisory\s+notes|one[\s-]on[\s-]one\s+notes|1:1\s+notes)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Public Sector Act 2022 (Qld)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - wellbeing
    - attendance
    - conduct
    - coaching
    - expectations
    - follow-up
    - development
    - HR business partner
    - workload
  proximity: 300
test_cases:
  should_match:
    - value: "Manager notes - 1:1\nDirect report: Avery Teston\nMeeting date: 10/09/2026\nConcerns raised: Missed two client deadlines this month.\nAgreed actions: Weekly check-in; coaching on prioritisation. Wellbeing discussed."
      description: '85: One-on-one notes with direct report, date, concerns and actions'
      synthetic: true
    - value: "Manager assessment for calibration\nEmployee ID: 5520117\nCapability rating: 2/5\nDate of discussion: 2026-08-28\nExpectations reset; follow-up in four weeks."
      description: '85: Manager assessment with employee ID, rating and date'
      synthetic: true
    - value: "Supervisor observations\nEmployee name: Jordan Staffson\nArrived late twice this week and left early without approval."
      description: '75: Observations naming the employee, no dated detail'
      synthetic: true
  should_not_match:
    - value: Managers should keep supervisor notes factual and brief. This guideline explains what manager feedback should cover.
      description: Guideline text - must stay below 75
    - value: "Manager notes\nDirect report: __________\nMeeting date: ___/___/____\nConcerns raised: __________"
      description: Blank notes form - must stay below 75
    - value: 'Training module: giving manager feedback. Participants role-play a conversation with a team member about attendance.'
      description: Training material - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_072_manager_assessment_notes_primary
      matches:
        - ref: Regex_top500_072_manager_assessment_notes_person_field
        - ref: Regex_top500_072_manager_assessment_notes_record_detail
        - ref: Keyword_top500_072_manager_assessment_notes_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_072_manager_assessment_notes_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_072_manager_assessment_notes_primary
      matches:
        - ref: Regex_top500_072_manager_assessment_notes_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_072_manager_assessment_notes_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_072_manager_assessment_notes_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_072_manager_assessment_notes_primary
      pattern: >-
        (?i)\b(?:manager(?:'s)?\s+(?:assessment|notes|feedback|comments|observations|evaluation)|supervisor(?:'s)?\s+(?:notes|assessment|comments|observations)|supervisory\s+notes|one[\s-]on[\s-]one\s+notes|1:1\s+notes)\b
    - id: Regex_top500_072_manager_assessment_notes_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit|direct\s+report|team\s+member|reviewee)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_072_manager_assessment_notes_record_detail
      pattern: >-
        (?i)\b(?:date\s+of\s+(?:meeting|discussion|conversation|observation)|meeting\s+date|discussion\s+date)\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|\b(?:rating|capability\s+rating|readiness)\s*[:\-]\s*(?:[1-5](?:\s*/\s*[1-5])?\b|exceeds|meets|partially\s+meets|does\s+not\s+meet|below\s+expectations|unsatisfactory|satisfactory|ready\s+now|high\s+potential)|\b(?:concerns?\s+raised|issues?\s+discussed|actions?\s+agreed|agreed\s+actions?|next\s+steps)\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z][a-z]{2,}
  keywords:
    - id: Keyword_top500_072_manager_assessment_notes_corroborative
      groups:
        - match_style: word
          terms:
            - wellbeing
            - attendance
            - conduct
            - coaching
            - expectations
            - follow-up
            - development
            - HR business partner
            - workload
      strength: specific
    - id: Keyword_top500_072_manager_assessment_notes_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a manager or supervisor assessment note about an employee about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Disclosure exposes candid judgements about an identifiable employee's performance, conduct and wellbeing. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 reconciles to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the SENSITIVE Personal-Privacy DLM, SENS_Pvc, and
    Medium tier for confidential person-specific manager notes. The next PROTECTED level is not met because an ordinary
    appraisal is not a protected investigation, security-clearance file, protected-source record, strategic appointment,
    or bulk high-impact repository.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium and Medium Personal-Privacy handling fit subjective manager evaluations that can materially affect
      one employee's reputation, advancement, and workplace relationships.
