schema: testpattern/v1
name: Supplier due diligence reports
slug: global-top500-149-supplier-due-diligence-reports
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to supplier due diligence reports in Australian contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Keyword
  lists: corporate-m-and-a. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(supplier\s+due\s+diligence|due\s+diligence\s+report|vendor\s+assessment|supplier\s+evaluation|background\s+check|financial\s+viability|compliance\s+verification|modern\s+slavery|supply\s+chain\s+risk|procurement\s+review)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - supplier due diligence reports
    - supplier
    - due
    - diligence
    - reports
    - procurement
    - management
  proximity: 300
  keyword_lists:
    - corporate-m-and-a
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: supplier due diligence
      description: Primary topic phrase match
    - value: due diligence report
      description: Case-insensitive topic phrase match
    - value: vendor assessment
      description: Alternative topic phrase match
    - value: supplier evaluation
      description: Additional topic phrase match
    - value: |-
        Supplier due diligence
        To: Executive Committee
        From: Chief Financial Officer
        Date: 14 August 2026
        Subject: Supplier due diligence - FY27 review
      description: Populated document header reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: procurement inventory
      description: Generic word pair from old broad template should not match
    - value: |-
        Supplier due diligence:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about supplier due diligence are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to supplier due diligence reports appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_supplier_due_diligence
      matches:
        - ref: Regex_global_top500_149_supplier_due_diligence_reports_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_supplier_due_diligence
      matches:
        - ref: Regex_global_top500_149_supplier_due_diligence_reports_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_supplier_due_diligence
  regexes:
    - id: Pattern_supplier_due_diligence
      pattern: >-
        (?is)\b(supplier\s+due\s+diligence|due\s+diligence\s+report|vendor\s+assessment|supplier\s+evaluation|background\s+check|financial\s+viability|compliance\s+verification|modern\s+slavery|supply\s+chain\s+risk|procurement\s+review)\b
    - id: Pattern_au_top500_149_supplier_due_diligence_reports_label_context
      pattern: (?i)\b(supplier\s+due\s+diligence\s+reports)\b
    - id: Regex_global_top500_149_supplier_due_diligence_reports_record_structure
      pattern: (?i)\b((?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$])
  keywords:
    - id: Keyword_au_top500_149_supplier_due_diligence_reports_domain_context
      groups:
        - match_style: word
          terms:
            - supplier due diligence reports
            - supplier
            - due
            - diligence
            - reports
risk_description: >-
  The concept regex detects supplier due diligence, due diligence report, vendor assessment, and supplier evaluation language with seven nearby terms. A genuine report may contain ownership, sanctions, adverse media, litigation, finances, conflicts, site findings, and decision rationale, affecting both individuals and the supplier if disclosed. Generic diligence checklists, M&A guidance, and evaluation templates can also trigger the medium-confidence detector without completed findings. Risk 8 SENSITIVE Personal-Privacy fits serious contained reputational and commercial harm; PROTECTED requires protected sources, strategic transaction compromise, systemic fraud, or significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the SENSITIVE Personal-Privacy DLM, SENS_Pvc, and Medium
    tier for a completed supplier due-diligence report. The next PROTECTED level is not met because an ordinary review
    is not protected intelligence, an active enforcement operation, a critical-national supplier dossier, or system-wide
    significant-damage compromise.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium and Medium Personal-Privacy handling fit supplier due-diligence reports containing adverse
      findings, ownership information, and integrity judgements with serious contained effects.
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires 2 distinct independent populated document header fields (Regex_global_top500_149_supplier_due_diligence_reports_record_structure); 85 requires 3 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list. Removed evidence no longer referenced by any tier (Evidence_supplier_due_diligence). Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 750 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
