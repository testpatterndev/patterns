schema: testpattern/v1
name: Parole Board Queensland Decision or Parole Order
slug: au-qld-parole-board-decision
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Parole applications, Parole Board Queensland decisions and parole orders for a named prisoner: court ordered and board ordered parole, exceptional circumstances parole, conditions, show-cause notices and amendment, suspension or cancellation orders.
operation: >-
  Primary: Parole Board Queensland Decision or Parole Order anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:Parole\s+Board\s+Queensland|court[\s-]+ordered\s+parole(?:\s+order)?|board[\s-]+ordered\s+parole|exceptional\s+circumstances\s+parole|application\s+by\s+prisoner\s+for\s+(?:a\s+)?parole\s+order|parole\s+(?:order|eligibility\s+date|suspension|cancellation)|order\s+by\s+board\s+for\s+(?:amendment|suspension|cancellation))\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Corrective Services Act 2006 (Qld)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - pii
corroborative_evidence:
  keywords:
    - PBQ
    - parolee
    - show cause
    - conditions
    - curfew
    - electronic monitoring
    - Community Corrections
    - supervising officer
  proximity: 300
identifier_dependencies:
  - type: offender
    name: Offender / prisoner number (QCS IOMS)
    note: >-
      IOMS number format (not published)
    affects: precision at 75/85 (public fallback is the generic labelled-field regex)
test_cases:
  should_match:
    - value: "Parole Board Queensland — decision\nPrisoner: Riley Teston\nIOMS number: 4471820\nParole eligibility date: 01/10/2026\nThe Board refuses the application for a parole order: insufficient treatment progress and no suitable accommodation."
      description: Populated record 1
      synthetic: true
    - value: "Order by board for suspension of parole order\nParolee: Morgan Teston\nDate of birth: 04/07/1990\nThe parolee breached the curfew condition on 3 occasions; the order is suspended and a warrant issued for return to custody."
      description: Populated record 2
      synthetic: true
    - value: "Court ordered parole order\nPrisoner: Jamie Teston\nRelease date: 19/09/2026\nConditions: report to Community Corrections Ipswich within 24 hours; no contact with the complainant."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Parole Board Queensland decides applications for board ordered parole. Court ordered parole applies to sentences of 3 years or less, other than for sexual or serious violent offences.
      description: Guidance or explainer text
    - value: "Application by prisoner for parole order (Form 29)\nPrisoner: __________\nIOMS number: __________\nProposed address: __________"
      description: Blank form
    - value: Parole Board Queensland made 11,400 decisions in 2024-25, including 3,100 suspensions, its annual report shows.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_parole_board_decision_primary
      matches:
        - ref: Regex_au_qld_parole_board_decision_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_parole_board_decision_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_parole_board_decision_primary
      matches:
        - ref: Regex_au_qld_parole_board_decision_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_parole_board_decision_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_parole_board_decision_primary
      pattern: >-
        (?i)\b(?:Parole\s+Board\s+Queensland|court[\s-]+ordered\s+parole(?:\s+order)?|board[\s-]+ordered\s+parole|exceptional\s+circumstances\s+parole|application\s+by\s+prisoner\s+for\s+(?:a\s+)?parole\s+order|parole\s+(?:order|eligibility\s+date|suspension|cancellation)|order\s+by\s+board\s+for\s+(?:amendment|suspension|cancellation))\b
    - id: Regex_au_qld_parole_board_decision_record_structure
      pattern: >-
        (?i)\b(?:prisoner|offender|parolee|IOMS(?:\s+(?:no\.?|number))?|correctional\s+centre|security\s+classification|parole\s+eligibility\s+date|release\s+date|eligible\s+person|registered\s+victim|nominee|young\s+person|child|detainee|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_parole_board_decision_corroborative
      groups:
        - match_style: word
          terms:
            - text: PBQ
              case_sensitive: true
            - parolee
            - show cause
            - conditions
            - curfew
            - electronic monitoring
            - Community Corrections
            - supervising officer
            - warrant
            - return to custody
            - Corrective Services Act 2006
            - accommodation
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a parole board queensland decision or parole order about an identified person, gated on populated record fields. Parole applications, Parole Board Queensland decisions and parole orders for a named prisoner: court ordered and board ordered parole, exceptional circumstances parole, conditions, show-cause notices and amendment, suspension or cancellation orders. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Law-Enforcement.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Law-Enforcement
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Qld Government — Parole orders
    url: https://www.qld.gov.au/justice/prison-and-detention/sentences-adult-offenders/parole-orders
  - title: Parole Board Queensland
    url: https://pbq.qld.gov.au/
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
