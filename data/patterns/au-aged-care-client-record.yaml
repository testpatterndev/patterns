schema: testpattern/v1
name: Aged Care and Home Support Client Record
slug: au-aged-care-client-record
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Client files kept by aged care and home support providers, including council-run Commonwealth Home Support Programme (CHSP) and Support at Home services funded under the Aged Care Act 2024 (Cth): client intake and profile records, care needs assessments, care plans and home support plans that tie a named older person (name, date of birth, My Aged Care ID or client number) to care needs, medical conditions, medications, mobility and falls risk, and to a carer, next of kin or representative. Serious incident (SIRS) notifications are covered by au-aged-care-serious-incident-notification and are not the target here. Program manuals, provider guidance, blank intake forms and training case studies are decoys.
operation: >-
  Primary: an aged care / home support / home care / community care / CHSP / Support at Home client, consumer, care recipient or participant record, file, profile, details, summary, assessment, intake or register; a client, consumer, individual(ised), home support or aged care "care plan"; an aged care, home or client "support plan"; "care needs assessment"; "Commonwealth Home Support Programme"; "Support at Home" program, service agreement, classification, budget or client; or a My Aged Care referral, ID, number or client record. 65 is discovery-only (primary alone). 75 requires, within 300 characters, one populated structure: a client field (client / consumer / care recipient / older person name with a two-word value, a date of birth, or a My Aged Care ID / client number containing a digit), a care field (care needs, assessed or support needs, assistance required, services required/provided/approved, medications, medical conditions, diagnosis, allergies, mobility, falls risk, cognition, continence, dietary requirements or personal care with a word value) or a carer field (carer, next of kin, emergency contact, representative, supporter or EPOA with a two-word name). 85 requires a client field AND a care or carer field AND an independent corroborative term (My Aged Care, Support at Home, CHSP, home care package, ACAT, aged care assessment, domestic assistance, respite, meals, social support and similar). Blank lines, bracket placeholders, n/a/tbc and "Yes / No" prompts are rejected. Every tier excludes template/fixture text; enforce tiers also exclude program-manual and guidance wording (this policy/guide/manual, program manual, providers must, must ensure/include, myagedcare.gov.au, health.gov.au, agedcarequality.gov.au, legislation.gov.au).
pattern: >-
  (?i)\b(?:(?:aged\s+care|home\s+support|home\s+care|community\s+care|CHSP|Support\s+at\s+Home)\s+(?:client|consumer|care\s+recipient|participant)\s+(?:records?|files?|profiles?|details|summary|assessments?|intake|registers?)|(?:client|consumer|individual(?:ised)?|home\s+support|aged\s+care)\s+care\s+plans?|(?:aged\s+care|home|client)\s+support\s+plans?|care\s+needs\s+assessments?|Commonwealth\s+Home\s+Support\s+Program(?:me)?|Support\s+at\s+Home\s+(?:program(?:me)?|service\s+agreements?|classifications?|budgets?|clients?)|My\s+Aged\s+Care\s+(?:referrals?|ID|number|client\s+records?))\b
confidence: medium
confidence_justification: >-
  Medium: the program names (CHSP, Support at Home, My Aged Care) are distinctive to Australian aged care, but "care plan" wording also appears in health and disability settings and all anchors fill program manuals and provider policies, so enforce tiers require populated client, care or carer fields. No public My Aged Care ID format is used; the value is a loose, digit-bearing label value. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Aged Care Act 2024 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - health
  - pii
corroborative_evidence:
  keywords:
    - My Aged Care
    - Support at Home
    - CHSP
    - home care package
    - ACAT
    - aged care assessment
    - domestic assistance
    - respite
    - social support
    - meals
  proximity: 300
customisation:
  - key: my-aged-care-id
    kind: identifier-format
    identifier: my-aged-care-id
    target: purview.regexes/Regex_au_aged_care_client_record_client_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's my aged care id format (see docs/identifiers.md#my-aged-care-id). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Home Support Client Profile - Community Care Services\nClient name: Beverley Teston\nDate of birth: 14/02/1941\nMy Aged Care ID: AC49201837\nCare needs: help with showering, domestic assistance fortnightly, transport to medical appointments\nCurrent medications: Apixaban 5mg, Metformin 500mg\nPrimary carer: Graham Teston (son)"
      description: CHSP client profile with name, DOB, My Aged Care ID, care needs, medications and carer (85 tier)
      synthetic: true
    - value: "Client care plan review 17/09/2026 - Support at Home\nConsumer: Walter Staffson\nFalls risk: high, two falls since June; uses a four-wheel walker\nNext of kin: Denise Staffson\nServices approved: personal care three mornings a week and respite on Fridays"
      description: Care plan review with consumer, falls risk, next of kin and services (85 tier)
      synthetic: true
    - value: "Care needs assessment completed. Mobility: walking frame indoors, wheelchair for outings. Assessor to upload to the client file."
      description: Assessment note with a populated care field only (75 tier)
      synthetic: true
    - value: "Aged care client file - emergency contact: Pauline Teston, 0412 555 019."
      description: Client file with a populated carer/contact field only (75 tier)
      synthetic: true
  should_not_match:
    - value: "The Commonwealth Home Support Programme provides entry-level support at home. Providers must record each client's care needs and develop a home support plan in consultation with the client, as set out in this program manual."
      description: Program manual text (guidance exclusion)
    - value: "Home Support Client Intake Form - blank template\nClient name: ____________\nDate of birth: ____________\nMy Aged Care ID: ____________\nCare needs: ____________\nPrimary carer: ____________"
      description: Blank intake form
    - value: "Training case study (training exercise): Client care plan for Mrs Example. Client name: Joan Example, Care needs: assistance with meals, Next of kin: Peter Example."
      description: Training case study (template-exclusion dictionary)
    - value: "Council will transition its Commonwealth Home Support Programme services to a new provider from 1 July 2027, with 640 clients affected, the mayor said."
      description: News about a council leaving aged care (65 only)
false_positives:
  - description: CHSP and Support at Home program manuals, provider policies and My Aged Care pages use every anchor.
    mitigation: Enforce tiers need populated client, care or carer fields; a guidance exclusion suppresses program-manual and regulator wording.
  - description: Hospital and disability support plans that share "care plan" wording.
    mitigation: The primary requires an aged care, home support, client or consumer qualifier; generic clinical care plans stay below 65 unless they use those qualifiers. Health-sector deployments should expect some overlap at 75.
  - description: SIRS notifications quoting the client's care plan.
    mitigation: Overlap with au-aged-care-serious-incident-notification is acceptable; both are sensitive aged care records.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_aged_care_client_record_primary
      matches:
        - ref: Regex_au_aged_care_client_record_client_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_aged_care_client_record_care_field
            - Regex_au_aged_care_client_record_carer_field
        - ref: Keyword_au_aged_care_client_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_aged_care_client_record_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_aged_care_client_record_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_aged_care_client_record_client_field
            - Regex_au_aged_care_client_record_care_field
            - Regex_au_aged_care_client_record_carer_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_aged_care_client_record_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_aged_care_client_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_aged_care_client_record_primary
      pattern: >-
        (?i)\b(?:(?:aged\s+care|home\s+support|home\s+care|community\s+care|CHSP|Support\s+at\s+Home)\s+(?:client|consumer|care\s+recipient|participant)\s+(?:records?|files?|profiles?|details|summary|assessments?|intake|registers?)|(?:client|consumer|individual(?:ised)?|home\s+support|aged\s+care)\s+care\s+plans?|(?:aged\s+care|home|client)\s+support\s+plans?|care\s+needs\s+assessments?|Commonwealth\s+Home\s+Support\s+Program(?:me)?|Support\s+at\s+Home\s+(?:program(?:me)?|service\s+agreements?|classifications?|budgets?|clients?)|My\s+Aged\s+Care\s+(?:referrals?|ID|number|client\s+records?))\b
    - id: Regex_au_aged_care_client_record_client_field
      pattern: >-
        (?i)\b(?:(?:client|consumer|care\s+recipient|older\s+person|resident)(?:\s+(?:full\s+)?name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:(?:Mr|Mrs|Ms|Miss|Mx|Dr)\.?\s+)?[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:client(?:'s)?\s+)?(?:date\s+of\s+birth|DOB)\s*[:#]\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}|(?:19|20)\d{2}-\d{2}-\d{2})|(?:My\s+Aged\s+Care\s+(?:ID|number)|MAC\s+ID|client\s+(?:ID|no\.?|number))\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9-]{4,15}\b)
    - id: Regex_au_aged_care_client_record_care_field
      pattern: >-
        (?i)\b(?:care\s+needs|assessed\s+needs|support\s+needs|assistance\s+(?:required|needed)|services?\s+(?:required|provided|approved)|current\s+medications?|medications?|medical\s+conditions?|diagnos(?:is|es)|allergies|mobility(?:\s+aids?)?|falls\s+risk|cognition|continence|dietary\s+requirements?|personal\s+care\s+needs)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:yes|no|y|n)\s*/)[A-Za-z][A-Za-z'-]{2,30}
    - id: Regex_au_aged_care_client_record_carer_field
      pattern: >-
        (?i)\b(?:(?:primary\s+)?carer|next\s+of\s+kin|NOK|emergency\s+contact|(?:authorised\s+)?representative|supporter|enduring\s+power\s+of\s+attorney|EPOA)(?:\s+(?:full\s+)?name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}
    - id: Regex_au_aged_care_client_record_guidance_exclusion
      pattern: >-
        (?i)(?:\bthis\s+(?:policy|procedure|guideline|guide|manual|fact\s?sheet|module|course)\b|\bprogram(?:me)?\s+manual\b|\bproviders\s+must\b|\bmust\s+(?:ensure|include)\b|\bfrequently\s+asked\s+questions\b|\bmyagedcare\.gov\.au\b|\bhealth\.gov\.au\b|\bagedcarequality\.gov\.au\b|\blegislation\.gov\.au\b)
  keywords:
    - id: Keyword_au_aged_care_client_record_corroborative
      groups:
        - match_style: word
          terms:
            - My Aged Care
            - Support at Home
            - text: CHSP
              case_sensitive: true
            - Commonwealth Home Support
            - home care package
            - text: ACAT
              case_sensitive: true
            - aged care assessment
            - domestic assistance
            - respite
            - social support
            - meals
            - personal care
            - community care
            - home maintenance
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies an aged care or home support client record that links a named older person (often with date of birth and My Aged Care ID) to care needs, medical conditions, medications, mobility and falls risk, and to carers or next of kin. It is health information about people who are frequently frail, cognitively impaired or living alone, and the home address plus care schedule can expose them to financial abuse or targeting. Program manuals, guidance, blank intake forms and training case studies are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Aged Care Act 2024 (Cth) - Federal Register of Legislation
    url: https://www.legislation.gov.au/C2024A00104/latest/text
  - title: Department of Health, Disability and Ageing - Commonwealth Home Support Programme
    url: https://www.health.gov.au/our-work/chsp
  - title: Department of Health, Disability and Ageing - Support at Home program
    url: https://www.health.gov.au/our-work/support-at-home
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - aged care and home support client files (CHSP / Support at Home); 75 gated on a populated client, care or carer field, 85 on client + care/carer fields + corroboration; SIRS notifications left to au-aged-care-serious-incident-notification.
