schema: testpattern/v1
name: Judicial Review Defence File
slug: judicial-review-defence-file
version: 1.5.2
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects government defence materials for judicial review of administrative decisions. These files contain the State's candid assessment of decision-making deficiencies and legal vulnerabilities. Disclosure directly prejudices the State's defence and may establish precedent affecting thousands of similar decisions.
operation: 'Primary detection: keyword proximity matching judicial review terms (''judicial review'', ''JR proceedings'', ''administrative review'') within 200 characters of defence/privilege indicators (''defence'', ''defence strategy'', ''respondent'', ''grounds'', ''privilege'', ''PROTECTED''). Combined with government entity context (Queensland Government, State of Queensland, Director-General). Corroborative evidence: 3 keywords within 300 characters.'
pattern: (?i)\b(?:judicial\s+review|JR\s+proceedings|administrative\s+review)\b
confidence: medium
confidence_justification: 'Medium confidence: Judicial review + government respondent + privilege markers is a precise combination targeting government JR defence files. The requirement for government entity context eliminates private sector JR materials.'
jurisdictions:
  - au
regulations:
- "Evidence Act 1977 (Qld)"
- "Judicial Review Act 1991 (Qld)"
frameworks:
- QGISCF
data_categories:
  - legal
  - government
corroborative_evidence:
  keywords:
    - defence
    - defence strategy
    - respondent
    - grounds
    - privilege
    - PROTECTED
    - Director-General
    - State of Queensland
    - decision-maker
    - jurisdictional error
    - unreasonableness
    - natural justice
  proximity: 300
  keyword_lists:

    - corporate-legal

    - government-services
test_cases:
  should_match:
    - value: |-
        PROTECTED — LEGAL PROFESSIONAL PRIVILEGE
        Judicial Review Defence File

        Matter: ABC Pty Ltd v Director-General, Department of State Development
        Proceedings: Judicial Review Act 1991 (Qld)

        Defence Strategy:
        The respondent's position on the ground of jurisdictional error is vulnerable. The decision-maker failed to consider a mandatory relevant consideration.
      description: JR defence file with privilege marking and vulnerability assessment
    - value: 'This privileged memorandum addresses our defence strategy for the JR proceedings commenced by the mining company. The administrative review challenges the Director-General''s refusal to grant the environmental authority. Key weakness: natural justice breach.'
      description: Privileged JR defence strategy memo
    - value: |-
        CONFIDENTIAL
        Judicial Review — Respondent's Strategy
        State of Queensland (Department of Environment and Science)

        Grounds of review: unreasonableness, failure to consider relevant matters
        Assessment: Moderate risk of adverse finding on ground 2
      description: JR respondent strategy with risk assessment
    - value: "To: Director-General\nFrom: Principal Legal Officer\nDate: 12/08/2026\nSubject: Judicial Review\nOur ref: LS2026-0412\nThis briefing sets out the Judicial Review for decision."
      description: Populated doc record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: The Supreme Court allowed the judicial review application in Smith v Director-General [2024] QSC 89. The published reasons found that the decision-maker had committed jurisdictional error.
      description: Published judicial review decision
    - value: This textbook chapter provides an overview of judicial review in Queensland under the Judicial Review Act 1991. Students should understand the available grounds of review.
      description: Academic textbook on judicial review
    - value: The Ombudsman's annual report noted an increase in administrative review complaints across government agencies. The public report recommends improvements to decision-making processes.
      description: Published Ombudsman report on administrative review
    - value: "Policy guidance: this procedure explains how records about Judicial Review are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Published judicial review decisions from courts
    mitigation: Negative match on court citation formats [YYYY] QSC, [YYYY] QCA and 'published reasons'
  - description: Academic materials on judicial review
    mitigation: Require co-occurrence with government respondent entity names and privilege markers
  - description: Ombudsman or tribunal public reports
    mitigation: Negative match on 'annual report', 'public report', 'published', 'tabled'
  - description: Applicant-side judicial review materials
    mitigation: Require government respondent context (State of Queensland, Director-General, department names)
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_judicial_review_defence_file_judicial_review_terminology
      matches:
        - ref: Regex_judicial_review_defence_file_record_structure
          min_count: 3
          unique_results: true
        - ref: Evidence_judicial_review_defence_file_primary
        - ref: Evidence_judicial_review_defence_file_corroborative
        - ref: Pattern_judicial_review_defence_file_government_entity_reference
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_judicial_review_defence_file_exclusion
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Pattern_judicial_review_defence_file_judicial_review_terminology
      matches:
        - type: any
          refs:
            - Regex_judicial_review_defence_file_record_structure
            - Evidence_judicial_review_defence_file_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Evidence_judicial_review_defence_file_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_judicial_review_defence_file_judicial_review_terminology
  regexes:
    - id: Pattern_judicial_review_defence_file_judicial_review_terminology
      pattern: (?i)\b(?:judicial\s+review|JR\s+proceedings|administrative\s+review)\b
    - id: Pattern_judicial_review_defence_file_government_entity_reference
      pattern: (?i)\b(?:Director-General|State\s+of\s+Queensland)\b
    - id: Regex_judicial_review_defence_file_record_structure
      pattern: >-
        (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9]
  keywords:
    - id: Evidence_judicial_review_defence_file_primary
      groups:
        - match_style: word
          terms:
            - judicial review
            - JR proceedings
            - administrative review
            - judicial review defence
      strength: specific
    - id: Evidence_judicial_review_defence_file_corroborative
      groups:
        - match_style: word
          terms:
            - defence
            - defence strategy
            - respondent
            - grounds
            - privilege
            - PROTECTED
            - Director-General
            - State of Queensland
            - decision-maker
            - jurisdictional error
            - unreasonableness
      strength: domain
    - id: Evidence_judicial_review_defence_file_exclusion
      groups:
        - match_style: word
          terms:
            - published reasons
            - tabled
            - annual report
            - textbook
            - public report

      strength: noise
risk_rating: 8
risk_description: >-
  The detector targets government defence files for judicial review when review grounds, respondent or defence strategy, privilege, and Queensland-government context occur together. A genuine file can reveal jurisdictional errors, natural-justice defects, evidentiary weaknesses, prospects, and planned concessions, allowing an applicant to sharpen grounds and potentially affecting related administrative decisions. The normal unit is one privileged defence file with material legal and policy consequences rather than a public judgment or academic explanation. Risk 8 supports SENSITIVE Legal; PROTECTED would require systemic invalidity across critical decisions, Cabinet consequences, or broad privileged compromise causing significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with SENSITIVE and Medium tiers because a judicial-review defence file exposes candid defects and
    tactics that can prejudice a significant case. PROTECTED is not met without critical systemic invalidity, Cabinet
    consequences, or broad privileged compromise.
  generic:
    classification: Medium
    dlm: Medium Legal
    rationale: >-
      A judicial-review defence file is generically Medium with Medium Legal DLM because it contains privileged
      vulnerability and strategy analysis for a specific administrative challenge.
references:
  - title: "Evidence Act 1977 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1977-047
created: '2026-02-20'
updated: '2026-09-25'
changelog:
  - version: 1.5.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references."
  - version: 1.5.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires either independent doc record structure (Regex ..._record_structure) or one of the hand-authored corroborative terms (none of which the primary matches); 85 requires 3 distinct structure hits plus the existing hand-authored evidence. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1462 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'Legal 75-tier ticket Item 1: require the corroborative evidence group at the 75 tier and add Evidence_*_exclusion to the 75 NOT-group (the corroborative group contains Director-General/decision-maker/jurisdictional error which published decisions also carry, so the exclusion veto is load-bearing for the published-reasons negative). All 3 negatives clear; positives verified.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Convert the Evidence_*_exclusion noise list on the 85 tier from a required positive ref (wiring bug: the tier could only fire when publication/template noise was PRESENT, and the exclusion never vetoed anything) to a max_matches:0 NOT-group per sibling convention (tier-harness triage class T2 sub-case "exclusion lists wired as required refs")'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
