schema: testpattern/v1
name: Australian Loan Agreement
slug: au-loan-agreement
version: 1.4.2
type: regex
pattern_class: concept
description: >-
  Detects populated Australian loan agreements and credit contracts: a loan agreement / credit contract / loan facility phrase combined with named borrower or lender fields, a stated loan amount or repayment, or a loan/facility reference number. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: (personal|business|commercial|consumer|secured|unsecured) loan agreement/contract/deed, credit contract, loan facility (agreement), line of credit agreement. 65 (discovery only): primary alone. 75: primary plus one populated field - named borrower/lender/credit provider/guarantor, loan amount/principal/facility limit/repayment with a dollar value (ranges such as '$5,000 to $50,000' excluded), or a loan/account/facility/contract number. 85: primary plus two distinct field types (the three above or a labelled interest/comparison rate) plus loan-term evidence (repayment schedule, default interest, events of default, drawdown, financial covenants, credit guide, NCCP). Template/sample framing and guidance/marketing framing are excluded on every enforce tier.
confidence: medium
confidence_justification: >-
  Enforce tiers need populated party, amount or reference fields next to the agreement phrase, so lender marketing, calculators and consumer guidance (which name the same terms without values) stay at 65. Medium because loan-application correspondence can carry the same fields.
jurisdictions:
  - au
regulations:
  - National Consumer Credit Protection Act 2009 (Cth)
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
  - legal
  - pii
test_cases:
  should_match:
    - value: "PERSONAL LOAN AGREEMENT\nLender: Harbourside Credit Union Ltd\nBorrower: Morgan Teston\nLoan amount: $38,500.00\nInterest rate: 9.49% p.a. (fixed)\nLoan number: PL2026004471\nMonthly repayment: $812.40 over 60 months. Events of default and default interest are set out in clause 12."
      description: Populated personal loan agreement - parties, amount, rate, reference and default terms (85)
      synthetic: true
    - value: "Commercial loan facility\nBorrower: Coral Coast Freight Pty Ltd\nFacility limit: $1,250,000\nDrawdown on 03/11/2026. Financial covenants: interest cover of at least 2.0x tested quarterly."
      description: Facility with named borrower, limit and covenant evidence (85)
      synthetic: true
    - value: "Loan agreement\nBorrower: Jordan Whitlock\nThe borrower acknowledges receipt of the credit guide."
      description: Agreement with one populated party field (75)
      synthetic: true
  should_not_match:
    - value: "Policy guidance: before you sign a personal loan agreement, check the loan amount, interest rate, comparison rate and repayment schedule, and read the credit guide. Ask the lender to explain any default fees."
      description: Consumer guidance naming the terms without values
      synthetic: true
    - value: "PERSONAL LOAN AGREEMENT\nLender: __________\nBorrower: __________\nLoan amount: $__________\nInterest rate: ____% p.a.\nLoan number: __________"
      description: Blank agreement form - placeholder values
      synthetic: true
    - value: "Banks tightened personal loan contract terms this quarter, with average loan amounts falling to $21,000 and interest rates above 9%, according to lender data released on Tuesday."
      description: News article with aggregate figures and no parties
      synthetic: true
    - value: "Our personal loan contract lets you borrow from $5,000 to $50,000.\nLoan amount: $5,000 to $50,000\nInterest rate: 6.99% p.a.\nComparison rate: 7.45% p.a."
      description: Lender product page with amount ranges and advertised rates
      synthetic: true
    - value: "Definitions\nBorrower: means the person named as borrower in the loan agreement schedule.\nLender: means the credit provider."
      description: Glossary / definitions clause of an unsigned loan agreement
      synthetic: true
    - value: "Can I borrow your pen?"
      description: Unrelated everyday use of borrow
      synthetic: true
    - value: "Student loan information session"
      description: Unrelated loan phrase
      synthetic: true
false_positives:
  - description: Lender marketing, loan calculators and comparison sites describing loan amounts and rates.
    mitigation: Amount ranges are rejected, rate lines only count toward 85, and marketing/calculator framing is excluded.
  - description: Consumer guidance and training about loan agreements.
    mitigation: Guidance names the fields without values, so it stays at 65.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  The pattern identifies Australian loan agreements through borrower, lender, principal, interest, repayment, security, covenant, and default terms, so the unit is a legal facility record. Disclosure can expose a borrower's finances and obligations, reveal covenant pressure, or support impersonation and interference in drawdown, repayment, or settlement communications. The borrower, lender, guarantors, and secured parties may face serious legal, privacy, and financial harm within one facility, although execution and payment changes require separate verification. Risk 8 and SENSITIVE Legal fit that composite contract, while privileged lending-system access or a bulk portfolio would be needed for PROTECTED. Quality pass 2026-09-24: enforce tiers (75/85) now require populated record structure (labelled fields with real values, identifiers or data rows); phrase-only mentions in guidance, marketing, blank forms and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps consistently to QGISCF SENSITIVE, PSPF OFFICIAL: Sensitive, SENSITIVE Legal, SENS_Leg, and Medium
    because an executed loan agreement consolidates consequential obligations and personal financial context. PROTECTED
    is not met by the normal single agreement because affected parties and facility scope are bounded and disclosure
    does not itself authorize funds.
  generic:
    classification: Medium
    dlm: Medium Legal
    rationale: >-
      Medium Legal handling is appropriate for executed loan contracts, covenants, and default provisions. High handling
      requires aggregated portfolios, privileged origination control, or exceptional protected-operation consequences.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_loan_agreement
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_au_loan_agreement_party
            - Regex_au_loan_agreement_amount
            - Regex_au_loan_agreement_reference
            - Regex_au_loan_agreement_rate
        - ref: Keyword_au_loan_agreement_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_loan_agreement_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_loan_agreement
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_loan_agreement_party
            - Regex_au_loan_agreement_amount
            - Regex_au_loan_agreement_reference
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_loan_agreement_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_loan_agreement
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_loan_agreement
      pattern: (?i)\b(?:(?:(?:personal|business|commercial|consumer|secured|unsecured)\s+)?loan\s+(?:agreement|contract|deed)|credit\s+contract|loan\s+facility(?:\s+agreement)?|line\s+of\s+credit\s+agreement)\b
    - id: Regex_au_loan_agreement_party
      pattern: (?i)\b(?:borrowers?|lenders?|credit\s+provider|co-borrowers?|debtors?|principal\s+debtor|guarantors?)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?:(?:Mr|Mrs|Ms|Mx|Dr|Prof)\.?[ \t]{1,3})?[A-Z][A-Za-z'.-]{1,30}(?:[ \t]{1,3}[A-Z&][A-Za-z'.&-]{0,30}){0,5}
    - id: Regex_au_loan_agreement_amount
      pattern: (?i)\b(?:loan\s+amount|principal(?:\s+(?:amount|sum))?|amount\s+of\s+credit|facility\s+limit|credit\s+limit|advance\s+amount|total\s+amount\s+(?:owing|repayable)|repayments?|monthly\s+repayment)[ \t]{0,3}[:#][ \t]{0,3}(?:AUD|USD|NZD|GBP|EUR|A\$|US\$|NZ\$|\$|£|€)[ \t]?(?:\d{1,3}(?:,\d{3}){1,4}|\d{1,12})(?:\.\d{2})?(?![\d,]\d)(?!\.\d)(?![ \t]{0,3}(?:-|–|to)[ \t]{0,3}(?:A?\$|\d))
    - id: Regex_au_loan_agreement_reference
      pattern: (?i)\b(?:(?:loan|account|facility|contract)\s*(?:no\.?|number|ID|ref(?:erence)?))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Z/.-]{0,12}\d)[A-Z0-9][A-Z0-9/.-]{0,24}
    - id: Regex_au_loan_agreement_rate
      pattern: (?i)\b(?:interest\s+rate|annual\s+percentage\s+rate|comparison\s+rate|default\s+rate)[ \t]{0,3}[:#][ \t]{0,3}\d{1,2}(?:\.\d{1,3})?[ \t]?%
  keywords:
    - id: Keyword_au_loan_agreement_terms
      groups:
        - match_style: word
          terms:
            - repayment schedule
            - default interest
            - events of default
            - prepayment
            - drawdown
            - financial covenants
            - security interest
            - establishment fee
            - credit guide
            - hardship
            - text: NCCP
              case_sensitive: true
            - cooling-off
      strength: domain
    - id: Keyword_au_loan_agreement_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - loan calculator
            - compare loans
            - borrowing power
            - information session
      strength: noise
created: '2026-02-09'
updated: '2026-09-25'
changelog:
  - version: 1.4.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were phrase-only keyword tiers; 75 now needs a populated borrower/lender, loan amount or loan reference field and 85 needs two distinct field types plus loan-term evidence; converted type keyword_list -> regex (boost_regex) with a top-level pattern so guidance decoys can be tested against the tier logic; removed the bare 'Loan agreement executed' positive; added blank-form, guidance, news and marketing decoys; dropped SOCI Act, added National Consumer Credit Protection Act 2009 (Cth) and verified references.
  - version: 1.3.2
    date: '2026-07-19'
    description: 'Targeted finance/health blocker remediation: retain bare loan instruments at 65 discovery, require substantive financial terms at 75 and named borrower/lender obligations at 85, broaden the primary to ordinary loan-agreement wording, and add exact-tier plus template probes.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 553 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
