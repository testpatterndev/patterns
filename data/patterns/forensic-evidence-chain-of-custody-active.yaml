schema: testpattern/v1
name: Forensic Evidence and Chain-of-Custody Records
slug: forensic-evidence-chain-of-custody-active
version: 1.4.3
type: keyword_proximity
pattern_class: concept
engine: universal
description: >-
  Detects forensic evidence and chain-of-custody records for active criminal or security investigations, including
  exhibit registers, DNA/fingerprint/ballistics results, custody handovers, and formal chain-of-custody documentation.
operation: >-
  Keyword proximity: primary keywords (chain of custody, exhibit register, forensic evidence, DNA profile match,
  fingerprint match, ballistics match) within 300 characters of case numbers and prosecution markers (committal,
  indictment, trial date). Regex for QPS exhibit reference number patterns. Negative keyword exclusion for concluded
  cases and training. Consolidated coverage (merge ci-2): also covers the former
  au-top500-299-evidence-chain-of-custody-records detector scope.
pattern: >-
  (?i)\b(chain\s+of\s+custody|exhibit\s+register|forensic\s+(?:evidence|certificate)|DNA\s+profile\s+match|fingerprint\s+(?:match|identification)|ballistics\s+(?:match|analysis|report)|toxicology\s+results?)\b
confidence: medium
confidence_justification: >-
  Medium confidence: requires co-occurrence of forensic evidence chain-of-custody terminology with active prosecution
  markers and exhibit reference numbers. The proximity requirement for active prosecution terms (committal, indictment,
  trial date) distinguishes active cases from historical or concluded matters.
jurisdictions:
  - au
regulations:
  - Evidence Act 1977 (Qld)
  - Police Powers and Responsibilities Act 2000 (Qld)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - PROTECTED
    - Law-Enforcement
    - exhibit
    - prosecution brief
    - committal
    - indictment
    - trial date
    - active prosecution
    - forensic certificate
    - Queensland Health Forensic
    - QHFSS
    - scene of crime
    - SOCO
    - evidence bag
    - evidence seal
    - laboratory analysis
  proximity: 300
  keyword_lists:
    - law-enforcement
    - government-services
customisation:
  - key: qps-exhibit-number
    kind: identifier-format
    identifier: qps-exhibit-number
    target: purview.regexes/Pattern_forensic_evidence_chain_of_custody_active_qps_exhibit_reference
    mode: replace
    affects_tiers: [85]
    required_for_enforcement: false
    note: "Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#qps-exhibit-number). Earlier versions used the QPS-EX-YYYY- exhibit format, which does not appear in any published source."
test_cases:
  should_match:
    - value: >-
        PROTECTED Law-Enforcement. Forensic Evidence — Chain of Custody Register. Case: R v MARTINEZ, Indictment No.
        2025/1847. Exhibit number 2025/00342: Blood sample collected from scene. DNA profile match to accused confirmed
        by QHFSS. Forensic certificate issued. Chain of custody: SOCO Constable L. PARK collected 14/01/2025, sealed
        evidence bag number 78234, transferred to QHFSS 15/01/2025.
      description: Active prosecution forensic evidence register with DNA match and chain-of-custody details
    - value: >-
        Prosecution brief — exhibit register update. Trial date: 15 September 2025. Exhibit number 2025/00187: Firearm
        recovered from suspect vehicle. Ballistics match confirmed — projectile from victim matched to seized weapon.
        Chain of custody maintained by four officers. Forensic certificate and continuity statements attached.
      description: Prosecution brief exhibit register with ballistics match for upcoming trial
    - value: >-
        Forensic evidence summary for committal hearing. Re: Operation JASPER. Fingerprint match identified on drug
        packaging — latent print lifted from exhibit number 2024/01294 matches accused. Toxicology results from seized
        substance: 78% purity methylamphetamine, 2.4 kg gross weight. Chain of custody documentation complete.
      description: Committal hearing forensic evidence summary with fingerprint and toxicology results
    - value: "Forensic Evidence\nName: Avery Teston\nDate of birth: 04/02/1991\nReference number: RX22914471\nNotes: Forensic Evidence recorded against the subject; handling restricted."
      description: Populated justice record reaching the 75/85 structure gate
      synthetic: true
    - value: "Chain of custody register — active prosecution\nName: Riley Teston\nDate of birth: 14/03/1988\nIndictment No: 412 of 2026\nExhibit number: 2026/004471 — evidence bag sealed at scene and transferred to QHFSS on 15/09/2026\nTrial date: 02/03/2027"
      description: Complete record with a labelled reference in the documented identifier form (reaches 85)
      synthetic: true
  should_not_match:
    - value: >-
        The Queensland Health Forensic and Scientific Services published its annual report noting that 12,500 DNA
        analyses were completed during the year. The laboratory maintained NATA accreditation for all forensic testing.
      description: Published QHFSS annual report with aggregate laboratory statistics
    - value: >-
        A forensic science training manual explains chain of custody procedures for police recruits. The manual uses
        fictional case studies to demonstrate proper evidence handling and documentation.
      description: Police training manual with fictional chain-of-custody examples
    - value: >-
        The judge in the concluded murder trial noted that the chain of custody for the DNA evidence was properly
        maintained throughout. The accused was convicted and sentenced to life imprisonment.
      description: News report about concluded trial where evidence was admitted
    - value: "Policy guidance: this procedure explains how records about Forensic Evidence are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Forensic laboratory annual reports with aggregate testing statistics
    mitigation: >-
      Negative keyword exclusion: 'annual report', 'published', 'reporting period', 'NATA accreditation'. Require
      proximity to specific case numbers.
  - description: Police training materials about evidence handling procedures
    mitigation: >-
      Negative keyword exclusion: 'training manual', 'training exercise', 'fictional', 'case study', 'police recruit',
      'simulated'
  - description: Media reporting on concluded trials where evidence was publicly discussed
    mitigation: >-
      Negative keyword exclusion: 'convicted', 'sentenced', 'concluded', 'acquitted', 'verdict', 'judge noted', 'court
      heard'
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_forensic_evidence_chain_of_custody_active_forensic_evidence_terms
      matches:
        - ref: Regex_forensic_evidence_chain_of_custody_active_record_structure
          min_count: 2
          unique_results: true
        - ref: Evidence_forensic_evidence_chain_of_custody_active_active_prosecution_markers
        - ref: Evidence_forensic_evidence_chain_of_custody_active_corroborative_terms
        - type: any
          refs:
            - Pattern_forensic_evidence_chain_of_custody_active_qps_exhibit_reference
            - Pattern_forensic_evidence_chain_of_custody_active_indictment_number
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Filter_forensic_evidence_chain_of_custody_active_exclusion
    - confidence_level: 75
      id_match: Pattern_forensic_evidence_chain_of_custody_active_forensic_evidence_terms
      matches:
        - type: any
          refs:
            - Regex_forensic_evidence_chain_of_custody_active_record_structure
            - Evidence_forensic_evidence_chain_of_custody_active_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Filter_forensic_evidence_chain_of_custody_active_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_forensic_evidence_chain_of_custody_active_forensic_evidence_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Filter_forensic_evidence_chain_of_custody_active_exclusion
  regexes:
    - id: Pattern_forensic_evidence_chain_of_custody_active_forensic_evidence_terms
      pattern: >-
        (?i)\b(chain\s+of\s+custody|exhibit\s+register|forensic\s+evidence|DNA\s+profile\s+match|fingerprint\s+match|ballistics\s+match|toxicology\s+results|forensic\s+certificate)\b
    - id: Pattern_forensic_evidence_chain_of_custody_active_qps_exhibit_reference
      pattern: "(?i)\\b(?:exhibit|property\\s+tag|property|evidence\\s+bag|seal)\\s+(?:no\\.?|number|ID|#)\\s*[:#]?\\s*[A-Z0-9][A-Z0-9/-]{3,20}\\b"
    - id: Pattern_forensic_evidence_chain_of_custody_active_indictment_number
      pattern: "(?i)\\bIndictment\\s+(?:No\\.?|Number)\\s*:?\\s*\\d{1,5}(?:/\\d{2,4}|\\s+of\\s+\\d{4})\\b"
    - id: Regex_forensic_evidence_chain_of_custody_active_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|defendant|accused|offender|prisoner|inmate|detainee|respondent|applicant|witness|informant|suspect|subject\s+(?:name|person)|person\s+of\s+interest|POI|victim|complainant|officer|CNI|QPRIME|(?:file|case|matter|court|reference|ref|exhibit|brief|job|incident|report|investigation|occurrence)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_forensic_evidence_chain_of_custody_active_active_prosecution_markers
      groups:
        - match_style: word
          terms:
            - committal
            - indictment
            - trial date
            - prosecution brief
            - active prosecution
            - pending trial
            - listed for hearing
      strength: specific
    - id: Evidence_forensic_evidence_chain_of_custody_active_corroborative_terms
      groups:
        - match_style: word
          terms:
            - QHFSS
            - Queensland Health Forensic
            - scene of crime
            - SOCO
            - evidence bag
            - evidence seal
            - laboratory analysis
            - latent print
            - seized
      strength: specific
    - id: Filter_forensic_evidence_chain_of_custody_active_exclusion
      groups:
        - match_style: word
          terms:
            - media release
            - published
            - annual report
            - training manual
            - training exercise
            - fictional
            - convicted
            - sentenced
            - concluded
            - acquitted
            - verdict
            - police recruit
            - simulated
      strength: noise
risk_rating: 8
risk_description: >-
  Active forensic and custody records can identify investigations, exhibits, and suspects. Risk 8 OFFICIAL:Sensitive
  remains appropriate for operational evidence packages.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Legal, and Medium because active forensic
    findings and custody history can seriously prejudice one prosecution. PROTECTED is not met without protected-person
    risk or systemic compromise affecting multiple major cases.
  generic:
    classification: Medium
    dlm: Medium Legal
    rationale: >-
      Medium and Medium Legal DLM protect active exhibit integrity and forensic results while reserving High handling
      for system-wide or life-safety evidence compromise.
references:
  - title: "Police Powers and Responsibilities Act 2000 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2000-005
  - title: "Evidence Act 1977 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1977-047
created: '2026-02-20'
updated: '2026-09-25'
changelog:
  - version: 1.4.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 2 verified legislation/regulator references."
  - version: 1.4.0
    date: '2026-09-24'
    description: "Replace the QPS-EX-YYYY- exhibit format (not found in any published source) with the documented qps-exhibit-number labelled-reference fallback and declare an identifier-format customisation slot (mode replace) so the customer's real format can be supplied at engagement. Evidence-bag EV-NNNN format removed (evidence bags and seals are covered by the exhibit identifier labels); indictment accepts NNNN/YY and NNN of YYYY; 85 now needs any one labelled reference instead of all three. Test values updated to labelled references."
  - version: 1.3.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires either independent justice record structure (Regex ..._record_structure) or one of the hand-authored corroborative terms (none of which the primary matches); 85 requires 2 distinct structure hits plus the existing hand-authored evidence. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.2.2
    date: '2026-07-19'
    description: >-
      Merge au-top500-299-evidence-chain-of-custody-records: expanded name/description/risk for combined coverage;
      absorbed unique test cases; companion SIT deprecated.
  - version: 1.2.1
    date: '2026-07-14'
    description: >-
      v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1480 without changing
      detector or package metadata.
  - version: 1.2.0
    date: '2026-07-09'
    description: >-
      C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored
      as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged);
      derived by scripts/derive-pattern-class.mjs + spot review
  - version: 1.1.1
    date: '2026-07-09'
    description: >-
      Noise-gate sweep: remove the dead template-exclusion declaration (Keyword_noise_exclusion) instead of wiring it —
      dictionary terms appear in the pattern's own should_match values or positive vocabulary, so a NOT-gate would
      suppress genuine matches (no behavior change: no tier referenced it)
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
