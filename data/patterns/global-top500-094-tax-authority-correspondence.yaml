changelog:
  - version: 1.3.0
    date: '2026-09-24'
    description: 'HR quality pass (2026-09-24): rebuilt tiers - 65 primary phrase (discovery), 75 primary + populated person/party field, 85 adds a distinct populated record-detail regex plus an independent corroborative keyword group; removed the self-corroborating Evidence_* phrase list so a single phrase no longer reaches 75/85; added template-exclusion and guidance/policy/media-release NOT-groups to enforce tiers; replaced bare-phrase tests with synthetic populated records and guidance/blank-form/news decoys. Primary narrowed to authority correspondence. Regulations now cite the Taxation Administration Act 1953 (Cth), Taxation Administration Act 2001 (Qld) and the Privacy (Tax File Number) Rule 2015 (Cth) with the privacy statutes; references cite ATO and legislation sources.'
  - version: 1.2.2
    date: '2026-09-24'
    description: 'Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701).'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1655 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
