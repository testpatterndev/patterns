schema: testpattern/v1
name: Tax authority correspondence
slug: global-top500-094-tax-authority-correspondence
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects correspondence from a tax authority to an identified taxpayer: ATO notices of (amended) assessment, audit and review letters, QRO notices, IRS CP notices and HMRC letters, with taxpayer identifiers and amounts payable, penalties or response dates.
operation: >-
  Primary: a tax authority correspondence phrase (notice of (amended) assessment, ATO/QRO/IRS/HMRC letter, correspondence, notice, audit or review, tax/revenue audit letter, notice of audit/review, IRS notice CPnnnn). Generic "tax notice", "compliance notice", "tax ruling" and "revenue authority" were removed. 75 tier requires a populated taxpayer field (taxpayer/client/entity name, client number, our/your reference, case number, employee name) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated notice detail (amount payable/due/refundable, tax shortfall, penalty, general interest charge, or a due/respond-by/issue date) and an independent corroborative term (Commissioner of Taxation, Taxation Administration Act, income year, tax return, objection, amended, shortfall). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:tax\s+authority\s+correspondence|notice\s+of\s+(?:amended\s+)?assessment|(?:ATO|Australian\s+Taxation\s+Office|Queensland\s+Revenue\s+Office|IRS|HMRC)\s+(?:letter|correspondence|notice|audit|review)|(?:tax|revenue)\s+(?:audit|review)\s+(?:letter|notice|commencement)|notice\s+of\s+(?:audit|review|intention\s+to\s+(?:audit|assess))|IRS\s+notice\s+CP\d{2,4}|penalty\s+notice\s+(?:for|-)\s+(?:late\s+)?lodg(?:e)?ment)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - global
regulations:
  - Taxation Administration Act 1953 (Cth)
  - Taxation Administration Act 2001 (Qld)
  - Privacy (Tax File Number) Rule 2015 (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - pii
corroborative_evidence:
  keywords:
    - Commissioner of Taxation
    - Taxation Administration Act
    - income year
    - tax return
    - objection
    - amended
    - shortfall
    - income tax return
  proximity: 300
test_cases:
  should_match:
    - value: "Notice of amended assessment - individual\nTaxpayer name: Avery Teston\nIncome year: 2025\nAmount payable: $2,418.60\nDue date: 21/10/2026\nIssued by the Commissioner of Taxation."
      description: "85: notice of amended assessment with taxpayer, amount payable, due date and Commissioner"
      synthetic: true
    - value: "ATO letter - commencement of review\nOur reference: 1-2FKQ8ZP\nClient name: Harbourline Trading Pty Ltd\nWe are reviewing your 2024-25 income tax return. Respond by 15/11/2026.\nShortfall penalty: $3,120.00 may apply."
      description: "85: ATO review letter with client name, reference, response date and shortfall penalty"
      synthetic: true
    - value: "HMRC correspondence regarding taxpayer: Morgan Teston - scanned letter saved to the client file."
      description: "75: HMRC correspondence naming the taxpayer, no amounts or dates"
      synthetic: true
    - value: "notice of assessment"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "Scam alert: the ATO will never send you a link asking for your details in a notice of assessment email. This page explains how to verify contact."
      description: "Scam warning guidance - must stay at or below 65"
    - value: "Notice of assessment\nTaxpayer name: __________\nAmount payable: $______\nDue date: __/__/____"
      description: "Blank notice template - must stay at or below 65"
    - value: "The IRS notice CP2000 program sent a million letters last year, according to a news release."
      description: "News - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Phishing emails that imitate tax authority notices."
    mitigation: "These may reach 75/85 if they contain populated fields; they still warrant review as security events."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_094_tax_authority_correspondence_primary
      matches:
        - ref: Regex_top500_094_tax_authority_correspondence_taxpayer_field
        - ref: Regex_top500_094_tax_authority_correspondence_notice_detail
        - ref: Keyword_top500_094_tax_authority_correspondence_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_094_tax_authority_correspondence_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_094_tax_authority_correspondence_primary
      matches:
        - ref: Regex_top500_094_tax_authority_correspondence_taxpayer_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_094_tax_authority_correspondence_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_094_tax_authority_correspondence_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_094_tax_authority_correspondence_primary
      pattern: >-
        (?i)\b(?:tax\s+authority\s+correspondence|notice\s+of\s+(?:amended\s+)?assessment|(?:ATO|Australian\s+Taxation\s+Office|Queensland\s+Revenue\s+Office|IRS|HMRC)\s+(?:letter|correspondence|notice|audit|review)|(?:tax|revenue)\s+(?:audit|review)\s+(?:letter|notice|commencement)|notice\s+of\s+(?:audit|review|intention\s+to\s+(?:audit|assess))|IRS\s+notice\s+CP\d{2,4}|penalty\s+notice\s+(?:for|-)\s+(?:late\s+)?lodg(?:e)?ment)\b
    - id: Regex_top500_094_tax_authority_correspondence_taxpayer_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?|taxpayer(?:\s+name)?|client\s+name|entity\s+name|client\s+(?:account\s+)?(?:number|ID)|our\s+reference|your\s+reference|case\s+(?:number|reference)|UTR|TIN)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_094_tax_authority_correspondence_notice_detail
      pattern: >-
        (?i)\b(?:amount\s+(?:payable|due|owing|refundable)|balance\s+(?:owing|due|payable)|tax\s+(?:payable|assessed|shortfall)|refund(?:\s+amount)?|shortfall\s+(?:amount|penalty)|penalty(?:\s+amount)?|general\s+interest\s+charge|total\s+(?:amount\s+)?(?:due|payable|owing))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?|\b(?:due\s+date|pay\s+by|respond\s+by|date\s+of\s+issue|issue\s+date|date\s+of\s+(?:this\s+)?notice)[ \t]{0,3}[:\-]?[ \t]{0,3}(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})
  keywords:
    - id: Keyword_top500_094_tax_authority_correspondence_corroborative
      groups:
        - match_style: word
          terms:
            - Commissioner of Taxation
            - Taxation Administration Act
            - income year
            - tax return
            - objection
            - amended
            - shortfall
            - income tax return
      strength: specific
    - id: Keyword_top500_094_tax_authority_correspondence_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - scam
            - scam alert
            - will never
            - how to verify
            - what your notice
            - this page explains
      strength: domain
risk_description: >-
  The classifier identifies tax authority correspondence addressed to an identified taxpayer (75) with amounts, penalties or deadlines (85). These reveal a person's or business's tax position, debts and compliance activity. Scam warnings, blank templates and news stay at 65. Risk 4 supports OFFICIAL; individual taxpayer letters carrying TFNs should be handled as SENSITIVE.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: "Taxation Administration Act 1953 (Cth)"
    url: https://www.legislation.gov.au/C1953A00001/latest/text
  - title: "ATO - Your notice of assessment"
    url: https://www.ato.gov.au/individuals-and-families/your-tax-return/your-notice-of-assessment
  - title: "ATO - Scams, cyber safety and identity protection (decoy source)"
    url: https://www.ato.gov.au/online-services/scams-cyber-safety-and-identity-protection
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
