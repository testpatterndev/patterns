schema: testpattern/v1
name: Purchase history
slug: global-top500-363-purchase-history
version: 1.4.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects customer purchase histories: a purchase / transaction / order history phrase combined with populated order data - rows keyed by a customer or order identifier, labelled order numbers, dates or totals, or labelled customer/member identifiers. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: purchase history, transaction history, order history, buying pattern(s), past purchases, purchasing behaviour, sales record(s). 65 (discovery only): primary alone. 75: primary plus one populated structure - a delimited data row keyed by a customer/order identifier with a numeric value, a labelled order number/date/total, SKU, purchase amount or basket value, or a labelled customer/member/loyalty/account ID. 85: primary plus two distinct structures (the three above or a delimited column header pairing a customer/order ID column with order, SKU, product, quantity or amount columns) plus retail analytics evidence (average order value, basket size, repeat purchase, RFM, recency, purchase frequency, returns, product category, units sold, next best offer). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: (?i)\b(?:purchase\s+histor(?:y|ies)|transaction\s+histor(?:y|ies)|order\s+histor(?:y|ies)|buying\s+patterns?|past\s+purchases|purchasing\s+behaviou?r|sales\s+records?)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated dataset structure (a data row keyed by a customer/record identifier, a labelled value or a labelled identifier) beside the topic phrase; a column header on its own only counts toward 85, so blank extracts stay at 65. Help pages, policies, product copy and news that only name the topic stay at 65. Medium because internal analytics documentation with worked examples can still reach 75.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - average order value
    - basket size
    - repeat purchase
    - RFM
    - recency
    - purchase frequency
    - returns
    - product category
    - units sold
    - next best offer
  proximity: 300
test_cases:
  should_match:
    - value: "Purchase history export - customer 88104421\ncustomer_id,order_id,order_date,sku,product_name,qty,order_total\n88104421,SO-771904,2026-08-12,SKU-44120,Bamboo cot sheets,2,89.90\n88104421,SO-771955,2026-09-02,SKU-10087,Prenatal vitamins 90 tabs,1,34.95\nRFM segment: recency 22 days, purchase frequency 14 per year."
      description: Order extract - header, customer rows and RFM evidence (85)
      synthetic: true
    - value: "Order history for customer\nCustomer number: 88104421\nRequested by the customer under an access request."
      description: Single labelled customer identifier (75)
      synthetic: true
  should_not_match:
    - value: "Help centre article: you can view your order history and purchase history in your account. Select an order to see the order number, items and total."
      description: Help article naming the fields
      synthetic: true
    - value: "Purchase history report\ncustomer_id,order_id,order_date,sku,qty,order_total\n"
      description: Blank extract - column header only (65)
      synthetic: true
    - value: "Retailers are mining purchase history to predict demand, with average order value up 6% this year, according to a news report."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing purchase and order history.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of purchase and order history.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_purchase_history
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_363_purchase_history_column_header
            - Regex_global_top500_363_purchase_history_data_row
            - Regex_global_top500_363_purchase_history_labelled_value
            - Regex_global_top500_363_purchase_history_identifier
        - ref: Keyword_global_top500_363_purchase_history_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_363_purchase_history_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_purchase_history
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_363_purchase_history_data_row
            - Regex_global_top500_363_purchase_history_labelled_value
            - Regex_global_top500_363_purchase_history_identifier
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_363_purchase_history_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_purchase_history
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_purchase_history
      pattern: (?i)\b(?:purchase\s+histor(?:y|ies)|transaction\s+histor(?:y|ies)|order\s+histor(?:y|ies)|buying\s+patterns?|past\s+purchases|purchasing\s+behaviou?r|sales\s+records?)\b
    - id: Regex_global_top500_363_purchase_history_column_header
      pattern: (?i)\b(?:(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:order[ _]?(?:id|date|total|value)|sku|product(?:[ _]?(?:name|id|category))?|item(?:[ _]?(?:name|id))?|qty|quantity|unit[ _]?price|purchase[ _]?(?:date|amount)|amount|basket[ _]?value|store[ _]?id)|(?:order[ _]?(?:id|date|total|value)|sku|product(?:[ _]?(?:name|id|category))?|item(?:[ _]?(?:name|id))?|qty|quantity|unit[ _]?price|purchase[ _]?(?:date|amount)|amount|basket[ _]?value|store[ _]?id)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash))\b
    - id: Regex_global_top500_363_purchase_history_data_row
      pattern: (?i)\b[A-Z]{0,5}[-_]?\d{4,12}\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,160}?(?:[,;\t]|\|[ \t]{0,2}))?\"?-?\$?\d{1,12}(?:\.\d{1,6})?%?(?![\w.])
    - id: Regex_global_top500_363_purchase_history_labelled_value
      pattern: (?i)\b(?:order\s*(?:no\.?|number|ID|#)|order\s+(?:date|total)|SKU|purchase\s+(?:date|amount)|amount\s+paid|basket\s+value)[ \t]{0,3}[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:(?:AUD|USD|NZD|GBP|EUR|A\$|US\$|NZ\$|\$|£|€)[ \t]?(?:\d{1,3}(?:,\d{3}){1,4}|\d{1,12})(?:\.\d{2})?(?![\d,]\d)(?!\.\d)|(?=[A-Z/-]{0,8}\d)[A-Z0-9][A-Z0-9/.-]{2,20})
    - id: Regex_global_top500_363_purchase_history_identifier
      pattern: (?i)\b(?:customer\s*(?:no\.?|number|ID)|member\s*(?:no\.?|number|ID)|loyalty\s*(?:no\.?|number|ID)|account\s*(?:no\.?|number|ID))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Za-z-]{0,8}\d)[A-Za-z0-9][A-Za-z0-9._@-]{3,64}
  keywords:
    - id: Keyword_global_top500_363_purchase_history_domain_evidence
      groups:
        - match_style: word
          terms:
            - average order value
            - basket size
            - repeat purchase
            - text: RFM
              case_sensitive: true
            - recency
            - purchase frequency
            - returns
            - product category
            - units sold
            - next best offer
      strength: domain
    - id: Keyword_global_top500_363_purchase_history_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - view your order history
            - in your account
      strength: noise
risk_description: >-
  This regex recognises purchase, transaction, order, and shopping history language, intending to find a customer-linked sequence of purchases rather than a single anonymous sales total. An attributed history can expose habits, finances, health-related products, beliefs, location patterns, and household circumstances, supporting targeted fraud, manipulation, embarrassment, or discriminatory profiling of the customer. The medium-confidence topic rule may also match generic ecommerce guidance and aggregate sales reports without person-level records. Risk 8 and SENSITIVE Personal-Privacy fit serious longitudinal privacy harm; PROTECTED would require highly sensitive categories, protected persons, or population-scale identifiable histories capable of significant damage. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and Personal-Privacy because longitudinal buying
    records reveal behaviour and can support consequential targeting or fraud. PROTECTED is not met without broad
    identifiable aggregation, highly sensitive inference, or severe and widespread financial consequences.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      A linked purchase history is generically Medium with Medium Personal-Privacy controls because repeated
      transactions reveal substantially more about a customer than a single receipt.
