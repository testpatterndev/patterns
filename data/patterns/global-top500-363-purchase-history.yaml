    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs a populated customer/order data row, labelled order value or labelled customer ID and 85 needs two distinct structures (header counts only toward 85) plus retail-analytics evidence. Removed the self-corroborating evidence group and generic primaries (shopping cart, order number, payment record, transaction log). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA, My Health Records Act and TIA Act.
