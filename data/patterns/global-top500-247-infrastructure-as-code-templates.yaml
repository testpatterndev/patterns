schema: testpattern/v1
name: Infrastructure-as-code templates
slug: global-top500-247-infrastructure-as-code-templates
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies infrastructure-as-code files (Terraform, CloudFormation, ARM/Bicep, Ansible) with populated resource, provider, task or network definitions. IaC wording alone is discovery-only.
operation: >-
  Regex_iac_templates (infrastructure as code, IaC repo/module, ARM/Bicep, Terraform configuration/module/plan/state, CloudFormation stack, Ansible playbook, Pulumi program, main.tf, terraform.tfvars) is discovery-only at 65. 75 requires one structure: a Terraform resource/module/provider/backend block, a CloudFormation/ARM/Bicep resource type, an Ansible module task or become/gather_facts key, or a network definition (CIDR, cidr_blocks, CidrIp, internal host). 85 requires two distinct structures plus cloud security context (production, VPC, subnet, security group, IAM role, key vault). Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing. Known limitation: the shared template-exclusion dictionary contains the word "template", so text that literally says "ARM template" or "CloudFormation template" stays at 65.
pattern: (?i)\b(?:infrastructure[\s-]as[\s-]code|IaC\s+(?:templates?|modules?|repository|repo|code)|ARM\s+templates?|Bicep\s+(?:templates?|modules?|files?)|Terraform\s+(?:configuration|modules?|plan|state|code|files?)|CloudFormation\s+(?:templates?|stacks?)|Ansible\s+playbooks?|Pulumi\s+(?:program|stack)|main\.tf|terraform\.tfvars)\b
confidence: medium
confidence_justification: >-
  Medium confidence: topic wording is discovery-only; enforcement requires IaC structure, and 85 adds a second structure and cloud security context.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
  - CIS Controls
data_categories:
  - security
  - technology
corroborative_evidence:
  keywords:
    - production
    - VPC
    - subnet
    - security group
    - IAM role
    - key vault
  proximity: 300
test_cases:
  should_match:
    - value: |-
        Terraform module for the payments network (main.tf)
        # Production VPC security group for the payments database
        provider "aws" {
          region = "ap-southeast-2"
        }
        resource "aws_security_group" "payments_db" {
          name   = "payments-db-prod"
          ingress {
            from_port   = 5432
            to_port     = 5432
            protocol    = "tcp"
            cidr_blocks = ["10.20.0.0/16"]
          }
        }
      description: High tier (85) - Terraform provider/resource blocks and CIDR ingress with production VPC security group context
      synthetic: true
    - value: |-
        Ansible playbook for patching web servers:
        - hosts: webservers
          become: true
          tasks:
            - ansible.builtin.yum:
                name: httpd
                state: latest
      description: Medium tier (75) - Ansible task structure only
      synthetic: true
    - value: |-
        CloudFormation stack for the records bucket:
        AWSTemplateFormatVersion: '2010-09-09'
        Resources:
          RecordsBucket:
            Type: AWS::S3::Bucket
      description: Medium tier (75) - CloudFormation resource type only
      synthetic: true
    - value: We are moving the remaining servers to infrastructure as code next year.
      description: Discovery tier (65) - topic wording only
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: 'Guidance note: organisations should scan infrastructure as code for open security groups before merging.'
      description: Guidance text
    - value: |-
        CloudFormation blank template skeleton
        AWSTemplateFormatVersion: ________
        Resources: ________
      description: Blank template
    - value: 'Training module: learners write a Terraform module with resource "aws_s3_bucket" "demo" in a sandbox account.'
      description: Training/demo framing must not enforce
false_positives:
  - description: Provider documentation, IaC tutorials and module registries contain resource blocks and CIDR examples.
    mitigation: Topic wording is discovery-only; enforcement needs IaC structure, and guidance/tutorial/demo/template framing is excluded.
  - description: Genuine files described as an "ARM template" or "CloudFormation template" trip the shared template-exclusion NOT group (false negative).
    mitigation: Documented limitation; Terraform, Bicep and Ansible content and CloudFormation bodies (AWSTemplateFormatVersion) are unaffected.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_iac_templates
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_terraform_block
            - Evidence_cloud_resource_type
            - Evidence_ansible_task
            - Evidence_network_definition
        - ref: Keyword_cloud_security_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_iac_templates
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_terraform_block
            - Evidence_cloud_resource_type
            - Evidence_ansible_task
            - Evidence_network_definition
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_iac_templates
  regexes:
    - id: Regex_iac_templates
      pattern: (?i)\b(?:infrastructure[\s-]as[\s-]code|IaC\s+(?:templates?|modules?|repository|repo|code)|ARM\s+templates?|Bicep\s+(?:templates?|modules?|files?)|Terraform\s+(?:configuration|modules?|plan|state|code|files?)|CloudFormation\s+(?:templates?|stacks?)|Ansible\s+playbooks?|Pulumi\s+(?:program|stack)|main\.tf|terraform\.tfvars)\b
    - id: Evidence_terraform_block
      pattern: \b(?:resource|data)\s{1,3}\"[a-z0-9_]{2,60}\"\s{1,3}\"[\w-]{1,60}\"|\bmodule\s{1,3}\"[\w-]{1,60}\"\s{0,3}\{|\bprovider\s{1,3}\"[a-z0-9_-]{2,40}\"\s{0,3}\{|\bbackend\s{1,3}\"[a-z0-9_]{2,20}\"\s{0,3}\{
    - id: Evidence_cloud_resource_type
      pattern: \bAWSTemplateFormatVersion\b|\bType:\s{0,3}[\"']?AWS::[A-Za-z0-9]{2,40}::[A-Za-z0-9]{2,60}|\"type\"\s{0,3}:\s{0,3}\"Microsoft\.[A-Za-z]{2,40}/[A-Za-z/]{2,80}\"|\bresource\s{1,3}[A-Za-z]\w{0,60}\s{1,3}'Microsoft\.[A-Za-z]{2,40}/[A-Za-z/]{2,80}@\d{4}-\d{2}-\d{2}(?:-preview)?'
    - id: Evidence_ansible_task
      pattern: \bansible\.(?:builtin|windows|posix)\.[a-z_]{2,40}\s{0,3}:|\bbecome:\s{0,3}(?:true|yes)\b|\bgather_facts:\s{0,3}(?:true|false|yes|no)\b
    - id: Evidence_network_definition
      pattern: (?i)\bcidr_blocks?\s{0,3}=|\bCidrIp:|\bsource_address_prefix(?:es)?\s{0,3}=|\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}/\d{1,2}\b|\b[a-z0-9-]{1,63}\.(?:internal|corp|local|lan)\b
  keywords:
    - id: Keyword_cloud_security_context
      groups:
        - match_style: word
          terms:
            - production
            - text: VPC
              case_sensitive: true
            - subnet
            - security group
            - firewall rule
            - IAM role
            - key vault
            - private endpoint
            - network security group
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
risk_description: >-
  The detector identifies infrastructure-as-code files when Terraform blocks, cloud resource types, Ansible tasks or network definitions are present; IaC wording alone is discovery-only. A genuine private template can disclose resource architecture, security settings, identities, naming conventions, and deployment dependencies that improve reconnaissance or enable misconfiguration reuse. The short IaC term and common platform documentation create substantial false-positive potential, while a normal match may cover only a reusable component. Risk 7 SENSITIVE preserves the accepted classification for a substantive internal template; PROTECTED would require confirmed critical-environment coverage or another path to significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): 75 no longer fires on the primary phrase alone: it now requires IaC structure (Terraform block, CloudFormation/ARM/Bicep resource type, Ansible task, or network/CIDR definition) and 85 requires two distinct structures plus cloud security context (the old noise-strength keyword lists self-corroborated the primary); dropped bare "cloud resource", "provisioning template" and "infrastructure template"; guidance/news/training exclusion added; bare-phrase tests replaced with synthetic Terraform/Ansible/CloudFormation records and decoys; documented the template-word limitation. Replaced GDPR with Criminal Code Act 1995 (Cth); added ISO 27001/NIST CSF/CIS Controls frameworks and verified OWASP IaC / ISM references; data_categories credentials -> technology.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1806 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
