schema: testpattern/v1
name: Sandbox detonation reports
slug: global-top500-292-sandbox-detonation-reports
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects sandbox detonation reports: sandbox or dynamic-analysis report wording with populated behaviour fields (verdict, task ID, spawned processes, dropped files, registry keys, network requests) and host artefacts. Topic wording alone is discovery-only.
operation: >-
  Regex_sandbox_report_primary (sandbox/detonation/dynamic-analysis report wording or named sandbox report) is discovery-only at 65. 75 requires the primary plus one populated structure: a labelled behaviour field (verdict, score, task ID, hash, spawned process, dropped file, mutex, registry key, DNS/HTTP request) or a host artefact (registry path, Windows file path, SHA256, IP:port). 85 requires a labelled behaviour field (verdict, score, task ID, hash, spawned process, dropped file, mutex, registry key, DNS/HTTP request) (two distinct hits), a host artefact (registry path, Windows file path, SHA256, IP:port), and independent behaviour-context (malicious, evasion, persistence, injection, beaconing, ATT&CK) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_sandbox_report_guidance_exclusion).
pattern: >-
  (?i)\b(?:sandbox\s+(?:detonation|analysis|report|results?|verdict)|detonation\s+(?:report|results?|chamber)|dynamic\s+analysis\s+report|(?:Cuckoo|CAPE|Joe\s+Sandbox|ANY\.RUN|Hybrid\s+Analysis|WildFire)\s+(?:report|analysis|verdict))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a labelled behaviour field (verdict, score, task ID, hash, spawned process, dropped file, mutex, registry key, DNS/HTTP request) or a host artefact (registry path, Windows file path, SHA256, IP:port)), and 85 needs two distinct structures plus independent behaviour-context (malicious, evasion, persistence, injection, beaconing, ATT&CK) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - malicious
  - evasion
  - persistence
  - process injection
  - beacon
  - network activity
  - MITRE ATT&CK
  - signature matched
  - anti-VM
  - screenshot
  proximity: 300
test_cases:
  should_match:
  - value: The attachment was sent for sandbox analysis before release to the user.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Sandbox report - task 88213
      Dropped file: svcupd.exe
    description: Medium-tier probe (75) - one populated behaviour field
    synthetic: true
  - value: |-
      CAPE report - analysis of invoice_0912.docm
      Verdict: malicious (threat score 9/10)
      Spawned process: powershell.exe -enc JABjAGwA
      Registry key: HKCU\Software\Microsoft\Windows\CurrentVersion\Run\svcupd
      Network activity: beacon to 185.220.101.47:443 every 60 s; persistence via Run key.
    description: High-tier probe (85) - multiple behaviour fields, registry path, IP:port, behaviour context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: suspicious attachments are submitted for sandbox analysis before quarantine release.'
    description: Policy text
    synthetic: true
  - value: |-
      Sandbox report template
      Verdict: ________
      Spawned process: [insert]
    description: Blank template
    synthetic: true
  - value: 'Course module 4: reading a sandbox report - verdict: malicious, registry key: HKCU\Software\Run\x'
    description: Training framing
    synthetic: true
false_positives:
- description: Sandbox vendor documentation shows report fields.
  mitigation: Fields must carry values; guidance/training framing is excluded.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_sandbox_report_primary
    matches:
    - ref: Regex_sandbox_report_behaviour_field
      min_count: 2
      unique_results: true
    - ref: Regex_sandbox_report_host_artefact
    - ref: Keyword_sandbox_report_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_sandbox_report_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_sandbox_report_primary
    matches:
    - type: any
      refs:
      - Regex_sandbox_report_behaviour_field
      - Regex_sandbox_report_host_artefact
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_sandbox_report_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_sandbox_report_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_sandbox_report_primary
    pattern: >-
      (?i)\b(?:sandbox\s+(?:detonation|analysis|report|results?|verdict)|detonation\s+(?:report|results?|chamber)|dynamic\s+analysis\s+report|(?:Cuckoo|CAPE|Joe\s+Sandbox|ANY\.RUN|Hybrid\s+Analysis|WildFire)\s+(?:report|analysis|verdict))\b
  - id: Regex_sandbox_report_behaviour_field
    pattern: >-
      (?i)\b(?:verdict|threat\s+score|analysis\s+ID|task\s+ID|submission\s+ID|SHA-?256|MD5|spawned\s+process|process\s+tree|dropped\s+file|mutex|registry\s+key|DNS\s+query|HTTP\s+request|contacted\s+(?:host|IP|domain))\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  - id: Regex_sandbox_report_host_artefact
    pattern: >-
      (?i)\b(?:HKLM|HKCU|HKEY_[A-Z_]{4,20})\\[A-Za-z0-9\\ _.-]{3,120}|\b[A-Z]:\\(?:Users|Windows|ProgramData|Temp)\\[A-Za-z0-9\\ _.-]{2,120}|\b[a-fA-F0-9]{64}\b|\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b:\d{2,5}\b
  keywords:
  - id: Keyword_sandbox_report_context
    groups:
    - match_style: word
      terms:
      - malicious
      - evasion
      - persistence
      - process injection
      - beacon
      - network activity
      - MITRE ATT&CK
      - signature matched
      - anti-VM
      - screenshot
    strength: specific
  - id: Keyword_sandbox_report_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires sandbox-report wording plus populated behaviour fields or host artefacts (registry paths, file paths, hashes, IP:port) before enforcing. A genuine report can disclose malicious behaviour, detection observations, infrastructure indicators, and analyst conclusions that help adversaries tune payloads or reveal an active investigation. The normal scope is one analysed sample or campaign and the security team handling it, while public malware research and training reports are common benign contexts. Risk 8 SENSITIVE reflects serious contained defensive-intelligence exposure; PROTECTED would require novel high-impact malware, critical targets, or broader significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
