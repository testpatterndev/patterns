schema: testpattern/v1
name: Immigration interview transcripts
slug: global-top500-389-immigration-interview-transcripts
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to immigration interview transcripts in Australian contexts. This information type is classified as personally identifiable information under the Privacy
  Act 1988.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Keyword
  lists: industry-education.
pattern: (?is)\b(?:immigration\s+interview\s+transcripts|Home\s+Affairs|visa\s+applicant|migration\s+agent|compliance\s+interview|bridging\s+visa)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - immigration interview transcripts
    - immigration
    - interview
    - transcripts
    - government
    - citizen
    - services
  proximity: 300
  keyword_lists:
    - industry-education
test_cases:
  should_match:
    - value: immigration interview transcripts
      description: Primary topic phrase match
    - value: home affairs
      description: Case-insensitive topic phrase match
    - value: visa applicant
      description: Alternative topic phrase match
    - value: migration agent
      description: Additional topic phrase match
    - value: |-
        Immigration interview transcripts
        Name: Avery Teston
        Date of birth: 14/02/1988
        Client number: C4471820
      description: Populated person/client record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: immigration case
      description: Generic word pair from old broad template should not match
    - value: |-
        Immigration interview transcripts:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about immigration interview transcripts are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to immigration interview transcripts appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_immigration_interview
      matches:
        - ref: Regex_global_top500_389_immigration_interview_transcripts_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_immigration_interview
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_immigration_interview
            - Regex_global_top500_389_immigration_interview_transcripts_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_immigration_interview
  regexes:
    - id: Pattern_immigration_interview
      pattern: (?is)\b(?:immigration\s+interview\s+transcripts|Home\s+Affairs|visa\s+applicant|migration\s+agent|compliance\s+interview|bridging\s+visa)\b
    - id: Regex_global_top500_389_immigration_interview_transcripts_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_immigration_interview
      groups:
        - match_style: word
          terms:
            - deportation
risk_description: >-
  The regex identifies immigration interview transcript, home affairs, visa applicant, and migration agent language when seven related terms occur nearby. A normal true positive is an applicant interview record containing identity, family history, travel, status, credibility observations, and reasons for migration, which could expose the applicant to discrimination, fraud, or adverse proceedings. Policy manuals and interview templates can also match because this is a medium-confidence concept detector rather than a transcript parser. Risk 8 SENSITIVE fits a consequential individual case record; PROTECTED would require protected-source material, acute safety threats, a large case repository, or credible significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and Personal-Privacy because a transcript combines
    personal history with evidence used for a consequential immigration decision. PROTECTED is not met for a routine
    case unless it includes security intelligence, protected identities, or a large high-risk population.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Immigration interview transcripts are generically Medium with Medium Personal-Privacy handling because their
      personal testimony can affect status, family unity, and procedural fairness.
created: '2026-02-08'
updated: '2026-10-19'
changelog:
  - version: 1.4.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires an independent populated person/client field (Regex_global_top500_389_immigration_interview_transcripts_record_structure), or one remaining corroborative term (deportation); 85 requires 2 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (transcript, detention). Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 3 verified legislation/regulator references."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 976 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
