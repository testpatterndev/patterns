schema: testpattern/v1
name: "UK EORI Number (Economic Operators Registration and Identification)"
slug: uk-eori-number
version: 1.0.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects UK HMRC Economic Operators Registration and Identification (EORI) numbers prefixed with GB (Great Britain) or XI (Northern Ireland Windsor Framework) followed by 12 digits (VAT-linked usually ending 000) or 15 digits.
operation: >-
  Matches uppercase GB or XI followed by exactly 12 or 15 digits on word boundaries (avoiding 9-digit UK VAT numbers covered by uk-vat-number). Enables local_noise_filter on enforcing tiers.
pattern: '(?-i)\b((?:GB|XI)(?:\d{12}|\d{15}))\b'
confidence: high
confidence_justification: >-
  High confidence: uppercase GB/XI + 12 or 15 digits is the exact HMRC customs trader identifier format, distinct in length from 9-digit GB VAT numbers.
jurisdictions:
  - uk
regulations:
  - "Taxation (Cross-border Trade) Act 2018 (UK)"
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - business
  - financial
  - government-id
corroborative_evidence:
  keywords:
    - "EORI"
    - "EORI number"
    - "HMRC"
    - "Customs Declaration Service"
    - "CDS"
    - "import declaration"
    - "consignee"
  proximity: 300
test_cases:
  should_match:
    - value: "GB123456789000"
      description: "14-character Great Britain VAT-linked EORI number (GB + 12 digits)"
    - value: "EORI: XI987654321000"
      description: "Northern Ireland XI-prefixed EORI number"
    - value: "GB123456789000123"
      description: "17-character branch-specific GB EORI number (GB + 15 digits)"
  should_not_match:
    - value: "GB123456789"
      description: "9-digit UK VAT number (handled by uk-vat-number, not 12/15-digit EORI)"
    - value: "gb123456789000"
      description: "Lowercase gb rejected by case-sensitive rule"
    - value: "Enter the importer EORI number on the Customs Declaration Service entry"
      description: "Prose instruction without an EORI value"
    - value: "Sample template: placeholder example record for training only"
      description: "Template/sample fixture suppressed by shared exclusion dictionary"
false_positives:
  - description: "Commercial shipping invoices routinely display the exporter/importer EORI."
    mitigation: "Risk 4 OFFICIAL reflects commercial trader metadata, and local_noise_filter lets organizations exclude their own EORI."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 4
risk_description: >-
  The detector matches a UK GB- or XI-prefixed 12- or 15-digit EORI customs identifier. EORI numbers appear on customs declarations, bills of lading, and supply-chain invoices; standalone disclosure identifies a trading entity rather than granting HMRC CDS access. Risk 4 and OFFICIAL match uk-vat-number and uk-companies-house-number.
sensitivity_labels:
  pspf: "OFFICIAL"
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: "CUI"
  uk_gov: "OFFICIAL"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
classification:
  tier: Low
  rationale: >-
    Risk 4 maps to PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because a UK EORI number is a commercial customs trader identifier verifiable through the GOV.UK EORI checker.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low handling suits a business customs-registration identifier.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      local_noise_filter: true
      id_match: Regex_uk_eori
      matches:
        - ref: Keyword_uk_eori_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match: Regex_uk_eori
      matches:
        - ref: Keyword_uk_eori_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_uk_eori
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_uk_eori
      pattern: '(?-i)\b((?:GB|XI)(?:\d{12}|\d{15}))\b'
  keywords:
    - id: Keyword_uk_eori_specific
      groups:
        - match_style: word
          terms:
            - text: "EORI"
              case_sensitive: true
            - "EORI number"
            - "Economic Operators Registration"
            - "Customs Declaration Service"
            - "HM Revenue & Customs"
      strength: specific
    - id: Keyword_uk_eori_broad
      groups:
        - match_style: word
          terms:
            - text: "HMRC"
              case_sensitive: true
            - "customs"
            - "consignor"
            - "consignee"
            - "import"
            - "tariff"
            - "bill of lading"
      strength: domain
references:
  - url: https://www.gov.uk/eori
    title: "GOV.UK HMRC - Get an EORI number (GB and XI formats)"
created: '2026-11-25'
updated: '2026-11-25'
changelog:
  - version: 1.0.0
    date: '2026-11-25'
    description: Initial release.
author: testpattern-community
