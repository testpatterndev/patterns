schema: testpattern/v1
name: Synergy realization plans
slug: global-top500-185-synergy-realization-plans
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to synergy realization plans in Australian contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters.'
pattern: >-
  (?is)\b(?:synergy\s+realization|synergy\s+plan|cost\s+synergies|revenue\s+synergies|synergy\s+target|integration\s+savings|run[\s-]+rate\s+savings|merger\s+synergies|synergy\s+capture|post[\s-]+merger\s+value|operational\s+efficiency|headcount\s+reduction)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - synergy realization plans
    - synergy
    - realization
    - plans
    - mergers
    - acquisitions
    - strategy
  proximity: 300
test_cases:
  should_match:
    - value: synergy realization
      description: Primary topic phrase match
    - value: synergy plan
      description: Case-insensitive topic phrase match
    - value: cost synergies
      description: Alternative topic phrase match
    - value: revenue synergies
      description: Additional topic phrase match
    - value: |-
        Synergy realization
        To: Executive Committee
        From: Chief Financial Officer
        Date: 14 August 2026
        Subject: Synergy realization - FY27 review
      description: Populated document header reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: merger fundraising
      description: Generic word pair from old broad template should not match
    - value: |-
        Synergy realization:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about synergy realization are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to synergy realization plans appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_synergy_realization
      matches:
        - ref: Regex_global_top500_185_synergy_realization_plans_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_synergy_realization
      matches:
        - ref: Regex_global_top500_185_synergy_realization_plans_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_synergy_realization
  regexes:
    - id: Pattern_synergy_realization
      pattern: >-
        (?is)\b(?:synergy\s+realization|synergy\s+plan|cost\s+synergies|revenue\s+synergies|synergy\s+target|integration\s+savings|run[\s-]+rate\s+savings|merger\s+synergies|synergy\s+capture|post[\s-]+merger\s+value|operational\s+efficiency|headcount\s+reduction)\b
    - id: Regex_global_top500_185_synergy_realization_plans_record_structure
      pattern: (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$]
risk_description: >-
  The concept regex recognises synergy plans, cost or revenue synergies, integration benefits, and realization targets, with the intended unit being a transaction execution plan rather than a public claim that a merger creates savings. A real plan can expose headcount reductions, site closures, supplier changes, system consolidation, revenue assumptions, and timing, enabling employee flight, supplier pressure, competitor action, or premature market inference. The medium-confidence detector may also match investor presentations or generic integration guidance without non-public detail. Risk 8 and SENSITIVE Financial fit serious contained transaction harm; PROTECTED would require critical operational dependencies or a strategic transaction whose compromise could cause significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  idcf: DSL-3
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE Financial for a genuine transaction
    synergy plan exposing headcount reductions, site closures, supplier changes and timing. PROTECTED is not met because
    the harm, such as staff flight, supplier pressure or premature market inference, stays within one transaction.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Medium Financial handling protects non-public integration targets and restructuring timing that competitors,
      suppliers or staff could act on. One transaction's plan does not reach High.
created: '2026-02-08'
updated: '2026-10-19'
changelog:
  - version: 1.4.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires 2 distinct independent populated document header fields (Regex_global_top500_185_synergy_realization_plans_record_structure); 85 requires 3 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (confidential). Removed evidence no longer referenced by any tier (Evidence_synergy_realization). Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had a rationale written for an earlier
      risk rating, a tier that did not follow its label).
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 786 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
