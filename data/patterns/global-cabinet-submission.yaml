schema: testpattern/v1
name: Cabinet Submission and Cabinet Briefing
slug: global-cabinet-submission
version: 1.6.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies substantive Australian federal and state Cabinet submissions, memoranda, approval
  papers, and Cabinet briefs, briefing notes and briefing books. Topic phrases are retained for
  discovery; enforcement requires purpose, recommendation, financial, consultation, implementation,
  risk, regulatory, key-issues, talking-points or decision-sought sections, and high confidence also
  requires a formal Cabinet marking, minute, decision, or submission identifier. Absorbed
  global-top500-492-cabinet-briefing-books (2026-09-24).
operation: >-
  Regex_cabinet recognises Cabinet submission, memorandum, decision, approval, brief and briefing
  (note/paper/book) topics. The topic alone is discovery-only at 65. Substantive submission or brief
  sections raise it to 75; those sections plus a Cabinet-in-Confidence marking or formal
  submission/minute/decision identifier reach 85. Enforcing tiers reject explicit templates and
  training examples.
pattern: (?is)\b(?:cabinet\s+(?:submission|memorandum|decision|approval|brief|briefing(?:\s+(?:book|note|paper))?)|for\s+cabinet\s+(?:consideration|approval))\b
confidence: medium
confidence_justification: >-
  Medium confidence requires substantive submission content rather than a title. High confidence adds
  formal Cabinet handling or record identifiers.
jurisdictions:
  - global
regulations:
  - Criminal Code 1899 (Qld)
  - RTI Act 2009 (Qld)
frameworks:
- QGISCF
data_categories:
  - government
  - cabinet
test_cases:
  should_match:
    - value: |-
        CABINET-IN-CONFIDENCE
        Cabinet Submission CAB-2026-0417
        Title: Regional water security investment program
        Portfolio: Regional Development and Water
        Purpose: To seek Cabinet approval for a $1.2 billion, ten-year regional water security program.
        Recommendations: That Cabinet approve stage 1 funding of $310 million and note the proposed pipeline route.
        Financial implications: Stage 1 is unfunded and requires a Treasury provision in the 2027-28 Budget.
        Consultation: Queensland Treasury and the Department of Environment have been consulted.
      description: Populated Cabinet submission with marking and submission identifier (85)
      synthetic: true
    - value: |-
        CABINET-IN-CONFIDENCE
        Cabinet briefing book - Cabinet meeting 14 September 2026
        Item 3: Cabinet submission CAB-2026-0452, youth justice reforms
        Key issues: Police support the bail amendments; the Human Rights Commission has raised compatibility concerns.
        Recommendations: The Minister supports the submission subject to a 12-month review clause.
        Talking points: The package delivers on the election commitment and is fully funded from existing resources.
      description: Populated Cabinet briefing book carried over from the absorbed briefing-books scope (85)
      synthetic: true
    - value: |-
        Cabinet briefing note for the Minister
        Purpose: To brief the Minister ahead of Monday's Cabinet meeting on the hospital car parking concession.
        Key issues: The operator seeks a five-year extension in return for capital works.
        Financial implications: Forgone concession revenue of about $14M over four years.
      description: Populated Cabinet briefing note without a formal marking or identifier (75)
      synthetic: true
    - value: |-
        For Cabinet consideration
        Purpose: To seek agreement to release the draft Housing Strategy for public consultation.
        Decision sought: Cabinet agree to release the draft strategy on 1 October 2026.
        Risk assessment: Delay beyond October would compress the statutory consultation period.
      description: Populated Cabinet paper with decision-sought section but no marking (75)
      synthetic: true
  should_not_match:
    - value: Kitchen cabinet installation guide
      description: Non-match 1
    - value: The filing cabinet was full
      description: Furniture usage
    - value: 'The public guide explains how agencies prepare a Cabinet submission.'
      description: Public process guidance without a submission record
    - value: 'Training example: Cabinet-in-Confidence Cabinet submission CAB-2026-104 with recommendations and decision sought'
      description: Explicit training content must not enforce
    - value: The Premier confirmed Cabinet approval of the Olympic venues plan at a press conference on Tuesday, saying construction would begin next year.
      description: News report of a Cabinet decision without submission content (discovery only)
    - value: Under the Cabinet Handbook, departments prepare a Cabinet briefing note for their Minister before each meeting and lodge it through the Cabinet Services portal.
      description: Public handbook-style description of Cabinet briefing notes (discovery only)
false_positives:
  - description: Public process guidance, historical commentary, and generic policy material discuss Cabinet submissions, recommendations, and decisions without containing a live submission.
    mitigation: Keep Cabinet topics discovery-only and require substantive purpose, recommendation, financial, consultation, implementation, risk, regulatory, or decision-sought content.
  - description: Training submissions can contain realistic Cabinet markings, numbers, sections, recommendations, and decisions sought.
    mitigation: Reject explicit template, demo, tutorial, sample-data, and training-example framing from enforcing tiers.
  - description: Cabinet Handbook text, agency process pages and news reports mention Cabinet briefs, briefing notes and briefing books without containing one.
    mitigation: Briefing topics are discovery-only; enforcement needs populated purpose, key-issues, recommendation, talking-points, financial or decision-sought sections. Generic ministerial briefs, Prime Minister, Executive Council and Cabinet committee references are deliberately not primaries.
exports:
  - yaml
scope: narrow
risk_rating: 10
risk_description: >-
  The detector recognises Cabinet submissions, memoranda, decisions, and papers expressly prepared for Cabinet consideration or approval, not furniture-related language. A genuine submission can expose collective executive deliberation, unreleased policy, legal and fiscal advice, stakeholder effects, and announcement timing before an authorised decision is public. Premature disclosure can prejudice Cabinet confidentiality, negotiations, markets, and whole-of-government administration at a scale capable of significant damage. Risk 10 PROTECTED Government follows from the protected executive process and broad consequence; PROTECTED is already the highest accepted classification tier.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Cabinet-in-Confidence
  us_gov: "CUI Specified"
  uk_gov: "SECRET"
  nz_gov: "SECRET"
  ca_gov: "Confidential"
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_cabinet
      matches:
        - ref: Evidence_cabinet_submission_content
        - ref: Evidence_cabinet_formal_record
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_cabinet
      matches:
        - ref: Evidence_cabinet_submission_content
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_cabinet
  regexes:
    - id: Regex_cabinet
      pattern: (?i)\b(?:cabinet\s+(?:submission|memorandum|decision|approval|brief|briefing(?:\s+(?:book|note|paper))?)|for\s+cabinet\s+(?:consideration|approval))\b
    - id: Evidence_cabinet_formal_record
      pattern: >-
        (?i)\b(?:Cabinet-in-Confidence|Cabinet\s+(?:submission|minute|decision)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#-]\s*[A-Z0-9][A-Z0-9/-]{3,}|CAB(?:INET)?[-/][A-Z0-9][A-Z0-9/-]{3,}|Cabinet\s+minute\s+(?:no\.?\s*)?\d+)\b
  keywords:
    - id: Evidence_cabinet_submission_content
      groups:
        - match_style: word
          terms:
            - purpose
            - recommendations
            - decision sought
            - financial implications
            - consultation
            - implementation plan
            - risk assessment
            - regulatory impact
            - human rights implications
            - stakeholder impacts
            - key issues
            - talking points
      strength: domain
references:
  - title: "Criminal Code 1899 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1899-009
  - title: "Right to Information Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-013
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.6.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (IPA 2009 (Qld)); added 2 verified legislation/regulator references."
  - version: 1.6.0
    date: '2026-09-24'
    description: 'Merge global-top500-492-cabinet-briefing-books into this classifier (Qld government classifier review 2026-09-24): Regex_cabinet (and the top-level pattern) now also recognise Cabinet brief and Cabinet briefing / briefing note / briefing paper / briefing book; key issues and talking points added to the substantive-content evidence group so populated Cabinet briefs reach 75, and 85 with the existing Cabinet-in-Confidence / formal identifier evidence. Not imported: ministerial brief (not a Cabinet record), Prime Minister, executive council, cabinet committee, cabinet handbook and PMC (public or generic references), cabinet minute as a primary (it already anchors Evidence_cabinet_formal_record and would self-corroborate), and the absorbed self-corroborating keyword tiers. Replaced the bare-phrase probe positives with populated submission, briefing book, briefing note and Cabinet paper records, and added news and handbook-style decoys. Name/description/operation updated for the merged scope; risk 10 PROTECTED Cabinet-in-Confidence unchanged (absorbed pattern was risk 9 PROTECTED).'
  - version: 1.5.1
    date: '2026-09-14'
    description: 'Assign QGISCF category to PROTECTED Cabinet-in-Confidence; preserve classification tier and detection logic.'
  - version: 1.5.0
    date: '2026-07-04'
    description: Split Cabinet discovery, substantive submission, and formal-record evidence into calibrated 65/75/85 tiers; narrow enforcement and exclude training content.
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 525 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.2.0
    date: '2026-07-04'
    description: Replace bare generic keyword terms with domain-anchored phrases (FP reduction)
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Downgraded weak high-confidence tier to 65 because independent specific/domain evidence was insufficient.
