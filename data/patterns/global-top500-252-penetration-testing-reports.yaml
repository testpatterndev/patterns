schema: testpattern/v1
name: Penetration testing reports
slug: global-top500-252-penetration-testing-reports
version: 1.3.3
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies penetration testing reports patterns in security and access control contexts. Detects potential exposure
  of sensitive security information in international systems.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 7 keywords within 300 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:penetration\s+testing|pentest\s+report|vulnerability\s+finding|security\s+assessment|attack\s+vector|risk\s+rating|scope\s+of\s+engagement|executive\s+summary)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
- GDPR
data_categories:
- credentials
- security
corroborative_evidence:
  keywords:
  - penetration testing reports
  - penetration
  - testing
  - reports
  - software
  - engineering
  - architecture
  proximity: 300
test_cases:
  should_match:
  - value: penetration testing
    description: Primary topic phrase match
  - value: pentest report
    description: Case-insensitive topic phrase match
  - value: vulnerability finding
    description: Alternative topic phrase match
  - value: security assessment
    description: Additional topic phrase match
  - value: "penetration testing\nHost: fw01.corp 10.20.30.40\nRule 14: allow tcp/443 from 10.20.0.0/16\nFinding: CVE-2025-21298 unpatched on asset ID WS-004471."
    description: Populated tech record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: source code config
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about penetration testing are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Authentication-related terminology in software documentation, security training materials, or system architecture
    descriptions without actual credentials.
  mitigation: Require proximity to credential-specific patterns (API keys, connection strings, tokens) rather than general
    security terminology.
- description: Code snippets and configuration examples containing credential-related keywords or placeholder values in developer
    documentation.
  mitigation: Check for common placeholder patterns (example.com, localhost, 0000) and documentation file types to reduce
    false positives from technical writing.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_penetration_testing_reports
      matches:
        - ref: Regex_global_top500_252_penetration_testing_reports_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_penetration_testing_reports
      matches:
        - ref: Regex_global_top500_252_penetration_testing_reports_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_penetration_testing_reports
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_penetration_testing_reports
      pattern: (?is)\b(?:penetration\s+testing|pentest\s+report|vulnerability\s+finding|security\s+assessment|attack\s+vector|risk\s+rating|scope\s+of\s+engagement|executive\s+summary)\b
    - id: Regex_global_top500_252_penetration_testing_reports_record_structure
      pattern: >-
        (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\bCVE-\d{4}-\d{4,7}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:tcp|udp)\s*/?\s*\d{2,5}\b|\b(?:port|dport|sport)\s*[:=]?\s*\d{2,5}\b|\b(?:hostname|host|asset\s+ID|device\s+ID|sAMAccountName|UPN|username|account\s+name)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._\\@-]{2,63}
risk_description: The detector recognises penetration testing, pentest report, vulnerability finding, or security assessment
  language, indicating a report class rather than confirming exploit details. A genuine penetration-test report can expose
  validated attack paths, affected hosts, proof-of-concept steps, control failures, and remediation gaps that can be reused
  against the tested environment. Generic security assessments and public testing guidance can match, while a normal report
  is bounded to a stated scope and may include resolved or low-severity issues. Risk 8 SENSITIVE reflects serious contained
  harm from a current detailed report; PROTECTED would require critical exploitable findings or significant damage established
  by its contents.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, SENS_IT, and Medium because an
    authentic pentest report often contains validated, actionable security weaknesses. The phrase-level detector does
    not prove critical severity, current exposure, or a consequence level sufficient for PROTECTED.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic Medium and Medium InfoTech are appropriate for scoped offensive-security results that can materially
      assist unauthorised access. Generic High requires evidence of a critical live exploit or broad high-consequence
      environment, not merely a report label.
frameworks:
  - ISO 27001
  - NIST CSF
