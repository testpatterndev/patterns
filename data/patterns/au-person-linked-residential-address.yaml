schema: testpattern/v1
name: Australian Person-Linked Residential Address
slug: au-person-linked-residential-address
version: 1.2.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects a populated Australian residential street address linked to a labelled person. Bare address
  structure is available for discovery, the balanced tier requires person and residential context plus
  Australian geography, and the strict tier requires state and postcode corroboration. A parallel
  household-utility path treats a utility supply/service address linked to a labelled account holder as
  a person-linked residence. Absorbs the former au-top500-041-home-address and
  au-top500-054-home-utility-account-addresses classifiers.
operation: >-
  Pattern_au_person_linked_street_address matches a populated street number, street name, and Australian
  road type. The 65 tier is discovery-only. The 75 tier requires a labelled person, an explicit
  residence relationship, and at least one state, locality, or postcode signal, where locality evidence
  draws on the consolidated 15,829-entry Australian suburbs and localities registry. The 85 tier requires
  the same person and residence relationship plus an explicit residential-address label, an Australian
  state or territory, a postcode, and registry or major-locality evidence. The utility path mirrors this:
  75 requires a labelled account holder, utility-service context (electricity/gas/water account, supply
  or service address), independent account/metering context (account number, NMI, MIRN, meter number),
  and one geographic signal; 85 adds a supply/service/connection-address field label, state, locality,
  and postcode. Company account-holder suffixes veto the utility path. Unattributed home addresses stay
  discovery-only. Template and example content is excluded from the enforcing tiers.
pattern: >-
  (?i)\b\d{1,5}[A-Z]?(?:\s*[-/]\s*\d{1,5}[A-Z]?)?\s+[A-Z][A-Z'-]{1,30}(?:\s+[A-Z][A-Z'-]{0,30}){0,5}\s+(?:Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Place|Pl|Court|Ct|Crescent|Cres|Close|Cl|Lane|La|Way|Parade|Pde|Boulevard|Blvd|Terrace|Tce|Circuit|Cct|Highway|Hwy|Grove|Gv|Square|Sq|Esplanade|Esp|Rise|View|Gardens|Loop|Trail|Track|Pass|Heights)\b
confidence: medium
confidence_justification: >-
  Medium confidence: enforcement requires a populated Australian street structure, a labelled person,
  an explicit residential relationship, and geographic corroboration. The high tier additionally requires
  complete state/postcode evidence, while bare structures remain discovery-only.
jurisdictions:
  - au
regulations:
  - AML/CTF Act (Cth)
  - HRIPA (Cth)
  - IPA 2009 (Qld)
  - My Health Records Act 2012 (Cth)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - TIA Act 1979 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - contact-information
  - location
corroborative_evidence:
  keywords:
    - resident
    - tenant
    - occupant
    - home address
    - residential address
    - principal place of residence
    - postcode
    - account holder
    - supply address
    - service address
    - utility account
    - NMI
    - MIRN
  proximity: 300
  keyword_lists:
    - au-road-classification-extended
    - au-major-cities
    - au-suburbs-localities
    - au-states-full
    - au-states-abbreviations
    - au-unit-types
test_cases:
  should_match:
    - value: 7B George Street
      description: Exact 65 probe - populated street structure without person or residential context
    - value: 'Resident: Alex Nguyen; residential address: 18 Church Street, Parramatta 2150'
      description: Exact 75 probe - person-linked residence with locality and postcode but no state
    - value: 'Resident: Alex Nguyen; residential address: 18 Church Street, Parramatta NSW 2150'
      description: Exact 85 probe - person-linked residence with state and postcode
    - value: 'Tenant: Grace Osei; principal place of residence: Unit 4, 12 Ocean Rise, Redcliffe QLD 4020'
      description: Unit-prefixed person-linked Australian residence
    - value: 'Resident: Priya Sharma; residential address: 18 Boronia Street, Abbeywood QLD 4613'
      description: Registry-locality high probe - non-major suburb corroborated by the consolidated suburbs and localities registry
    - value: 'Resident: Mia Chen; home address: Unit 4, 12 Ocean Rise, Redcliffe QLD 4020'
      description: 85 probe carried from au-top500-041-home-address - home-address label with person, state, and postcode
    - value: 'Home address: 18 Banksia Road, Brisbane QLD 4000'
      description: Unattributed home address (from au-top500-041-home-address) stays discovery-only at 65 without a labelled person
    - value: 'Account holder: Noah Williams; NMI 41020012345; electricity supply address: 12 Ocean Rise, Redcliffe QLD 4020'
      description: Exact 85 utility probe carried from au-top500-054 - account holder, metering identifier, supply-address label, state, locality, and postcode
    - value: 'Account holder: Noah Williams; gas account number 552190; service address: 7 Wattle Street, Toowoomba'
      description: Exact 75 utility probe - labelled account holder with utility account evidence and locality but no state or postcode
    - value: 'Account holder: Priya Sharma; NMI 41020012345; electricity supply address: 18 Boronia Street, Abbeywood QLD 4613'
      description: Utility registry-locality 85 probe - non-major suburb corroborated by the suburbs and localities registry
  should_not_match:
    - value: 'Resident: Alex Nguyen; residential address:'
      description: Person and residential labels without a populated address
    - value: 'Contact: Alex Nguyen; office address: 18 Church Street, Parramatta NSW 2150'
      description: Person-linked business address without a residential relationship must not enforce
    - value: 'The conference speaker is Alex Nguyen at 200 George Street, Sydney NSW 2000'
      description: Named person near a public venue without labelled person or residential relationship
    - value: 'Resident: Full Name; residential address: 18 Church Street, Parramatta NSW 2150'
      description: A populated address with a blank-form name placeholder must not establish person linkage
    - value: 'Documentation example: Resident: Alex Nguyen; residential address: 18 Church Street, Parramatta NSW 2150'
      description: Complete but explicitly documented example is excluded from enforcing tiers
    - value: The tenant rights guide explains how to update an address.
      description: Residential topic without a populated address value
    - value: The home address field is mandatory on the application form.
      description: Policy or form prose without an address value (from au-top500-041-home-address)
    - value: 'Account holder: Full Name; electricity account number 884201; service address: 18 Banksia Road, Brisbane QLD 4000'
      description: Blank-form account-holder placeholder must not establish person linkage on the utility path
    - value: 'Account holder: Northwind Traders Pty Ltd; electricity account number 884201; supply address: 18 Banksia Road, Brisbane QLD 4000'
      description: Commercial account holder is vetoed from the household utility path by the company-suffix exclusion
    - value: 'News: crews restored electricity supply to homes near 18 Banksia Road, Brisbane QLD 4000 after the storm; account number enquiries go to the energy retailer.'
      description: News decoy with utility, account, and address wording but no labelled person must not enforce
    - value: 'Documentation example: Account holder: Noah Williams; NMI 41020012345; supply address: 12 Ocean Rise, Redcliffe QLD 4020'
      description: Complete but explicitly documented utility example is excluded from enforcing tiers
    - value: Meter number 123456 was retired after the network upgrade.
      description: Meter context without a populated service address
false_positives:
  - description: A person name and valid address can refer to a business contact, venue, or correspondence destination rather than a residence.
    mitigation: Require an explicit resident, tenant, occupant, home-address, or place-of-residence relationship for enforcement.
  - description: Completed example records in forms, documentation, or training material can look genuine.
    mitigation: Apply the shared template-exclusion NOT-group to the 75 and 85 tiers.
  - description: Utility-industry documents and commercial accounts mention electricity, gas, water, or meters near business premises.
    mitigation: >-
      The utility path requires a labelled account holder plus both utility-service and independent
      account/metering evidence, and company suffixes (Pty Ltd, Ltd, Limited, Inc, Corporation, body
      corporate) veto it.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 6
risk_description: >-
  A true enforcing match links an identified person to a populated Australian residence. Disclosure can
  enable unwanted contact, residence verification, targeted social engineering, or physical targeting,
  although a single ordinary record does not establish vulnerability, a safety threat, or a protected
  location. Risk 6 supports SENSITIVE Personal-Privacy treatment; protected-person and safety-critical
  residences require stronger controls.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
    - dict: au-suburbs-localities
      as: Evidence_au_locality_registry
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_au_person_linked_street_address
      matches:
        - ref: Pattern_au_person_linked_labelled_person
        - ref: Evidence_au_person_linked_residential_context
        - ref: Evidence_au_person_linked_state_territory
        - type: any
          min_matches: 1
          refs:
            - Evidence_au_person_linked_major_locality
            - Evidence_au_locality_registry
        - ref: Pattern_au_person_linked_postcode
        - ref: Pattern_au_person_linked_address_label
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_au_person_linked_street_address
      matches:
        - ref: Pattern_au_person_linked_labelled_person
        - ref: Evidence_au_person_linked_residential_context
        - type: any
          min_matches: 1
          refs:
            - Evidence_au_person_linked_state_territory
            - Evidence_au_person_linked_major_locality
            - Evidence_au_locality_registry
            - Pattern_au_person_linked_postcode
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 85
      id_match: Pattern_au_person_linked_street_address
      matches:
        - ref: Pattern_au_person_linked_labelled_person
        - ref: Evidence_au_person_linked_utility_service_context
        - ref: Evidence_au_person_linked_utility_account_context
        - ref: Evidence_au_person_linked_state_territory
        - type: any
          min_matches: 1
          refs:
            - Evidence_au_person_linked_major_locality
            - Evidence_au_locality_registry
        - ref: Pattern_au_person_linked_postcode
        - ref: Pattern_au_person_linked_service_address_label
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
            - Pattern_au_person_linked_business_holder
      description: Household utility service address - labelled account holder, utility service and account/metering evidence, service-address label, state, locality, and postcode
    - confidence_level: 75
      id_match: Pattern_au_person_linked_street_address
      matches:
        - ref: Pattern_au_person_linked_labelled_person
        - ref: Evidence_au_person_linked_utility_service_context
        - ref: Evidence_au_person_linked_utility_account_context
        - type: any
          min_matches: 1
          refs:
            - Evidence_au_person_linked_state_territory
            - Evidence_au_person_linked_major_locality
            - Evidence_au_locality_registry
            - Pattern_au_person_linked_postcode
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
            - Pattern_au_person_linked_business_holder
      description: Household utility service address - labelled account holder with utility service and account/metering evidence plus Australian geography
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_au_person_linked_street_address
  regexes:
    - id: Pattern_au_person_linked_street_address
      pattern: >-
        (?i)\b\d{1,5}[A-Z]?(?:\s*[-/]\s*\d{1,5}[A-Z]?)?\s+[A-Z][A-Z'-]{1,30}(?:\s+[A-Z][A-Z'-]{0,30}){0,5}\s+(?:Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Place|Pl|Court|Ct|Crescent|Cres|Close|Cl|Lane|La|Way|Parade|Pde|Boulevard|Blvd|Terrace|Tce|Circuit|Cct|Highway|Hwy|Grove|Gv|Square|Sq|Esplanade|Esp|Rise|View|Gardens|Loop|Trail|Track|Pass|Heights)\b
    - id: Pattern_au_person_linked_postcode
      pattern: \b(?:0[289]\d{2}|[1-9]\d{3})\b
    - id: Pattern_au_person_linked_address_label
      pattern: >-
        (?i)\b(?:home\s+address|residential\s+address|permanent\s+address|usual\s+residential\s+address|principal\s+place\s+of\s+residence)\s*[:#-]
    - id: Pattern_au_person_linked_labelled_person
      pattern: >-
        (?i)\b(?:resident|tenant|occupant|applicant|customer|account\s+holder|name)\s*(?:is\s*)?[:#-]\s*(?!(?:full|given|first|last|customer|resident|tenant|occupant|account\s+holder)\s+name\b)(?!firstname\s+lastname\b)(?!(?:john|jane)\s+doe\b)[A-Z][A-Za-z'-]{1,30}(?:\s+[A-Z][A-Za-z'-]{1,30}){1,3}\b
    - id: Pattern_au_person_linked_service_address_label
      pattern: >-
        (?i)\b(?:(?:electricity|gas|water|energy)\s+)?(?:supply|service|connection)\s+(?:address|premises)\s*[:#-]
      description: Utility supply/service/connection address field label (from au-top500-054-home-utility-account-addresses)
    - id: Pattern_au_person_linked_business_holder
      pattern: >-
        (?i)\b(?:pty\.?\s+ltd|ltd|limited|incorporated|inc|corporation|body\s+corporate)\b
      description: Company account-holder suffix - vetoes the utility path so commercial supply addresses do not read as household residences
  keywords:
    - id: Evidence_au_person_linked_residential_context
      groups:
        - match_style: word
          terms:
            - home address
            - residential address
            - principal place of residence
            - place of residence
            - permanent address
            - usual residential address
            - resides at
            - lives at
            - resident
            - tenant
            - occupant
      strength: specific
    - id: Evidence_au_person_linked_utility_service_context
      groups:
        - match_style: word
          terms:
            - electricity account
            - gas account
            - water account
            - energy account
            - utility account
            - utility bill
            - electricity supply
            - gas supply
            - water service
            - supply address
            - service address
            - service premises
            - connection address
            - energy retailer
      strength: specific
    - id: Evidence_au_person_linked_utility_account_context
      groups:
        - match_style: word
          terms:
            - account number
            - customer number
            - billing account
            - meter number
            - text: NMI
              case_sensitive: true
            - text: MIRN
              case_sensitive: true
            - national metering identifier
            - meter reading
            - connection point
      strength: specific
    - id: Evidence_au_person_linked_state_territory
      groups:
        - match_style: word
          terms:
            - text: NSW
              case_sensitive: true
            - text: VIC
              case_sensitive: true
            - text: QLD
              case_sensitive: true
            - text: SA
              case_sensitive: true
            - text: WA
              case_sensitive: true
            - text: TAS
              case_sensitive: true
            - text: NT
              case_sensitive: true
            - text: ACT
              case_sensitive: true
            - New South Wales
            - Victoria
            - Queensland
            - South Australia
            - Western Australia
            - Tasmania
            - Northern Territory
            - Australian Capital Territory
      strength: domain
    - id: Evidence_au_person_linked_major_locality
      groups:
        - match_style: word
          terms:
            - Sydney
            - Melbourne
            - Brisbane
            - Perth
            - Adelaide
            - Hobart
            - Darwin
            - Canberra
            - Gold Coast
            - Newcastle
            - Wollongong
            - Geelong
            - Townsville
            - Cairns
            - Toowoomba
            - Ballarat
            - Bendigo
            - Albury
            - Wodonga
            - Launceston
            - Mackay
            - Rockhampton
            - Redcliffe
            - Parramatta
      strength: domain
created: '2026-07-19'
updated: '2026-09-24'
changelog:
  - version: 1.2.0
    date: '2026-09-24'
    description: 'Merge au-top500-041-home-address and au-top500-054-home-utility-account-addresses into this classifier (Qld government classifier review 2026-09-24): add a household-utility 75/85 path (labelled account holder + utility-service context + independent account/metering context such as NMI/MIRN/meter number + geography; 85 adds a supply/service/connection-address label, state, locality, and postcode) with a company-suffix veto, NMI/MIRN utility corroborative vocabulary, the AER NMI reference, and carried-over home-address and utility-account tests plus blank-holder, commercial-holder, news, and documented-example decoys. 041 contributed no phrases beyond this pattern''s residential context; its unattributed 75 path was not imported, so a home address without a labelled person remains discovery-only.'
  - version: 1.1.0
    date: '2026-07-20'
    description: 'Wire the consolidated au-suburbs-localities registry (15,829 suburb/locality names, all states and territories) as Evidence_au_locality_registry: accepted as the geographic signal in the 75 tier and as locality corroboration in the 85 tier alongside the major-locality list, so complete addresses in non-major suburbs reach the intended tiers; add a registry-locality high probe.'
  - version: 1.0.1
    date: '2026-07-19'
    description: 'Make the 85 tier demonstrably cumulative by requiring an explicit residential-address field label and major-locality evidence in addition to person, state, and postcode corroboration.'
  - version: 1.0.0
    date: '2026-07-19'
    description: 'Initial Australian person-linked residential-address detector with distinct 65, 75, and 85 tiers.'
