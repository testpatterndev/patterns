schema: testpattern/v1
name: Queensland Council Closed Meeting Confidential Report
slug: au-qld-council-closed-meeting-report
version: 1.1.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Council agenda reports, attachments and minutes for business closed to the public under Local Government Regulation 2012 s254J: CEO or staff appointment, discipline or dismissal; rating concessions; commercial negotiations; land acquisition; legal advice and other confidential matters.
operation: >-
  Primary: Queensland Council Closed Meeting Confidential Report anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:closed\s+to\s+the\s+public|closed\s+(?:session|meeting|business)|confidential\s+(?:item|report|business|session)|(?:section|s\.?)\s{0,2}254J(?:\s{0,2}\(\d\))?(?:\s{0,2}\([a-z]\))?|meeting\s+closed\s+under)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Local Government Regulation 2012 (Qld)
  - Local Government Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - government
corroborative_evidence:
  keywords:
    - Local Government Regulation 2012
    - Chief Executive Officer
    - CEO
    - rating concession
    - commercial negotiations
    - land acquisition
    - legal advice
    - contractual matters
  proximity: 300
customisation:
  - key: edrms-record-number
    kind: identifier-format
    identifier: edrms-record-number
    target: purview.regexes/Regex_au_qld_council_closed_meeting_report_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Records management (eDRMS) record number format (see docs/identifiers.md#edrms-record-number). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
  - key: council-property-number
    kind: identifier-format
    identifier: council-property-number
    target: purview.regexes/Regex_au_qld_council_closed_meeting_report_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Council property / rate assessment number format (see docs/identifiers.md#council-property-number). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Ordinary Meeting — Confidential Item 14.2\nMeeting date: 18/09/2026\nAuthor: Director Corporate Services\nThis report is confidential and the meeting will be closed to the public under s254J(3)(g) — negotiations relating to a commercial matter involving the local government. Offer from Harbour Developments for Lot 12 is $2.4 million."
      description: Populated record 1
      synthetic: true
    - value: "Closed session under section 254J(3)(a): appointment of the Chief Executive Officer. Council received the recruitment panel report recommending Jordan Staffson.\nMoved: Cr Riley Teston\nSeconded: Cr Alex Staffson\nResolution carried 7-2."
      description: Populated record 2
      synthetic: true
    - value: "CONFIDENTIAL — Item 9.1 Rating concession application, closed to the public under s254J(3)(d).\nApplicant: Harbour Community Care Inc.\nRecommended concession: 50% of general rates for 2026-27."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Under section 254J of the Local Government Regulation 2012, council may resolve that a meeting be closed to the public only for specified matters, and must state the matter in the resolution.
      description: Guidance or explainer text
    - value: "Agenda item template\nItem number: ____\nMeeting date: ____\nClosed to the public under s254J(3)( ): ____"
      description: Blank form
    - value: Council closed 23 meeting sessions to the public in 2025-26, down from 31 the previous year, the annual report shows.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_council_closed_meeting_report_primary
      matches:
        - ref: Regex_au_qld_council_closed_meeting_report_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_council_closed_meeting_report_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_council_closed_meeting_report_primary
      matches:
        - ref: Regex_au_qld_council_closed_meeting_report_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_council_closed_meeting_report_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_council_closed_meeting_report_primary
      pattern: >-
        (?i)\b(?:closed\s+to\s+the\s+public|closed\s+(?:session|meeting|business)|confidential\s+(?:item|report|business|session)|(?:section|s\.?)\s{0,2}254J(?:\s{0,2}\(\d\))?(?:\s{0,2}\([a-z]\))?|meeting\s+closed\s+under)\b
    - id: Regex_au_qld_council_closed_meeting_report_record_structure
      pattern: >-
        (?i)\b(?:moved|seconded|mover|seconder|councillor|complainant|respondent|subject\s+councillor|applicant|meeting\s+date|agenda\s+item|item\s+(?:no\.?|number)|report\s+(?:no\.?|number|author)|author|prepared\s+by|file\s+(?:no\.?|number|ref)|OIA\s+ref(?:erence)?|reference\s+(?:no\.?|number)|name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_council_closed_meeting_report_corroborative
      groups:
        - match_style: word
          terms:
            - Local Government Regulation 2012
            - Chief Executive Officer
            - text: CEO
              case_sensitive: true
            - rating concession
            - commercial negotiations
            - land acquisition
            - legal advice
            - contractual matters
            - industrial matters
            - moved
            - seconded
            - resolution
            - councillors
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a queensland council closed meeting confidential report about an identified person, gated on populated record fields. Council agenda reports, attachments and minutes for business closed to the public under Local Government Regulation 2012 s254J: CEO or staff appointment, discipline or dismissal; rating concessions; commercial negotiations; land acquisition; legal advice and other confidential matters. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Government.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE Government because s 254J closed
    business covers staff discipline or dismissal, rating concessions, commercial negotiations, land acquisition and
    legal advice for identified people and matters. PROTECTED is not met: premature disclosure harms the people and the
    council's position on one matter.
  generic:
    classification: Medium
    dlm: Medium Government
    rationale: >-
      Medium Government handling fits confidential council business such as personnel decisions, negotiations and legal
      advice. It is not High because the harm is bounded to one council matter.
references:
  - title: Local Government Regulation 2012 s254J
    url: https://www5.austlii.edu.au/au/legis/qld/consol_reg/lgr2012273/s254j.html
