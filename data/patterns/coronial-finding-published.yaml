schema: testpattern/v1
name: Coronial Finding Published
slug: coronial-finding-published
version: 1.4.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects published coronial findings and recommendations under the Coroners Act 2003 (Qld). Although coronial findings are public documents, they contain sensitive details about the circumstances and cause of death, manner of death, and identity of deceased persons. Government agencies handling these documents should classify them as SENSITIVE Legal due to the distressing nature of the content.
operation: >-
  Primary: coronial finding(s)/inquest/investigation/report, inquest into / findings of inquest / inquest findings or recommendations, coroner's finding/recommendation/report/court, non-inquest findings. 65 (discovery only): phrase alone - statistics, textbooks and news stay here. 75: phrase plus a populated findings-header field as used in published Queensland findings (citation, title of court, jurisdiction, file no(s), delivered on/at, hearing dates, findings of, catchwords, representation, counsel assisting, date/place of death, deceased). 85: two distinct populated header fields plus a named deceased ('Inquest into the death of <Name>' / 'death of <Name>') plus independent cause/manner evidence (cause of death, manner of death, autopsy, post-mortem, forensic pathologist, toxicology, Coroners Act 2003, recommendations). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:coronial\s+(?:findings?|inquest|investigation|report)|findings\s+of\s+inquest|inquest\s+(?:into|findings?|recommendations?)|coroner(?:'s|s)?\s+(?:findings?|recommendations?|report|court)|non-inquest\s+findings?)\b
confidence: low
confidence_justification: >-
  Low-medium: coronial findings are published documents, so the classifier labels handling rather than secrecy. Enforce tiers need the published findings header structure; 85 also needs a named deceased and cause/manner evidence. Statistics, textbooks and news carry the phrases without the header fields and stay at 65.
jurisdictions:
  - au
regulations:
- "Coroners Act 2003 (Qld)"
frameworks:
- QGISCF
data_categories:
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - SENSITIVE
    - Legal
    - coronial finding
    - coroner
    - inquest
    - cause of death
    - manner of death
    - autopsy
    - post-mortem
    - Coroners Court
    - Coroners Act 2003
    - State Coroner
    - Deputy State Coroner
    - recommendations
  proximity: 300
  keyword_lists:

    - law-enforcement

    - government-services
test_cases:
  should_match:
    - value: "CORONERS COURT OF QUEENSLAND\nFINDINGS OF INQUEST\nCITATION: Inquest into the death of Morgan Ellisdale\nTITLE OF COURT: Coroners Court\nJURISDICTION: Brisbane\nFILE NO(s): 2025/04417\nDELIVERED ON: 12 February 2026\nFINDINGS OF: Deputy State Coroner Hutton\nCause of death: multi-organ failure secondary to sepsis. Recommendations are made under s 46 of the Coroners Act 2003."
      description: Published findings header with a named deceased and cause-of-death evidence (85)
      synthetic: true
    - value: "Non-inquest findings\nDeceased: Casey Rourke\nFile number: 2025/08812"
      description: Non-inquest findings with labelled deceased and file fields only (75)
      synthetic: true
  should_not_match:
    - value: "The Australian Bureau of Statistics published its annual Causes of Death report for 2024. The leading cause of death was ischaemic heart disease (17,331 deaths), followed by dementia (15,209 deaths). Queensland recorded 34,127 registered deaths."
      description: Published ABS causes of death statistics
    - value: "The Royal Brisbane and Women's Hospital published its 2024-25 annual report noting a mortality rate of 1.2% for admitted patients, consistent with national benchmarks. The hospital recorded 847 deaths during the reporting period."
      description: Hospital annual report with aggregate mortality statistics
    - value: "A forensic pathology textbook chapter explains the process of coronial investigation in Queensland, including the role of the State Coroner, the circumstances requiring investigation under the Coroners Act 2003, and the types of findings available."
      description: Forensic pathology textbook on coronial process
    - value: "Policy guidance: this procedure explains how coronial findings are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Findings of inquest - cover sheet\nCITATION: ____________________\nFILE NO(s): ____________________\nDELIVERED ON: ____________________\nFINDINGS OF: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: the coroner's findings into the bus crash recommended crash barriers on the range road, and the State Coroner said the inquest into the deaths had been difficult for families."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: ABS published causes of death statistics and mortality data
    mitigation: 'Negative keyword exclusion: ''ABS'', ''Australian Bureau of Statistics'', ''leading cause'', ''registered deaths'', ''published'''
  - description: Hospital and health service annual reports with aggregate mortality data
    mitigation: 'Negative keyword exclusion: ''annual report'', ''mortality rate'', ''national benchmarks'', ''reporting period'''
  - description: Forensic pathology and coronial law textbooks
    mitigation: 'Negative keyword exclusion: ''textbook'', ''chapter'', ''explains'', ''academic'', ''university'''
  - description: Media articles reporting on coronial findings already publicly released
    mitigation: 'Require proximity to specific deceased person details, autopsy findings, or recommendation text rather than summary news reporting.'
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: primary_keywords
      matches:
        - ref: Regex_coronial_finding_published_header_fields
          min_count: 2
          unique_results: true
        - ref: Regex_coronial_finding_published_named_deceased
        - ref: corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_coronial_finding_published_guidance_exclusion
    - confidence_level: 75
      id_match: primary_keywords
      matches:
        - ref: Regex_coronial_finding_published_header_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_coronial_finding_published_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: primary_keywords
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: primary_keywords
      pattern: (?i)\b(?:coronial\s+(?:findings?|inquest|investigation|report)|findings\s+of\s+inquest|inquest\s+(?:into|findings?|recommendations?)|coroner(?:'s|s)?\s+(?:findings?|recommendations?|report|court)|non-inquest\s+findings?)\b
    - id: Regex_coronial_finding_published_header_fields
      pattern: (?i)\b(?:citation|title\s+of\s+court|jurisdiction|file\s+no\.?|file\s+number|delivered\s+(?:on|at)|hearing\s+dates?|findings\s+of|catchwords|representation|counsel\s+assisting|date\s+of\s+death|place\s+of\s+death|deceased)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_coronial_finding_published_named_deceased
      pattern: \b(?:[Ii]nquest\s+into\s+the\s+deaths?\s+of|[Dd]eath\s+of)\s+(?:(?:Mr|Mrs|Ms|Miss|Dr|Master)\.?\s+)?[A-Z][a-z]{1,20}\s+[A-Z][A-Za-z'-]{1,30}
  keywords:
    - id: corroborative_terms
      groups:
        - match_style: word
          terms:
            - cause of death
            - manner of death
            - autopsy
            - post-mortem
            - forensic pathologist
            - toxicology
            - Coroners Act 2003
            - recommendations
      strength: specific
    - id: Keyword_coronial_finding_published_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
risk_rating: 3
risk_description: >-
  The detector identifies published coronial findings by combining coronial-finding language with the published findings header fields (citation, file number, delivered on, findings of, deceased), and at 85 a named deceased plus cause or manner of death. Although the subject matter may be distressing and personally sensitive, the normal true positive is an officially released public document whose lawful publication has already removed the core confidentiality interest. Misuse is mainly contextual republication or insensitive handling and generally causes limited incremental harm beyond the public finding itself. Risk 3 and OFFICIAL are proportionate; SENSITIVE would require an unpublished draft, suppressed detail, protected witness, or non-public evidence excluded from the released finding.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
classification:
  tier: Low
  rationale: >-
    Risk 3 maps to PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because the detector expressly targets a final
    public finding rather than confidential coronial evidence. SENSITIVE is not met without draft, suppressed,
    protected-witness, or otherwise non-public content.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low DLM reflects the document's official public status while recognising that respectful handling remains
      appropriate for distressing death details.
references:
  - url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2003-013
    title: Coroners Act 2003 (Qld)
created: '2026-03-06'
updated: '2026-09-25'
changelog:
  - version: 1.4.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): rebuilt tiers - the tier id_match pointed at an empty keyword group (primary_keywords had no terms), so the tiers never evaluated and 85 needed no structure. primary_keywords is now the coronial-finding regex; 75 needs a populated published-findings header field (citation, file no, delivered on, findings of, deceased) and 85 needs two header fields plus a named deceased plus cause/manner evidence. Cause-of-death and Coroners Act phrases moved from the primary to evidence. Placeholder-name tests replaced with populated findings; added policy, blank cover-sheet and news decoys; reference added."
  - version: 1.3.2
    date: '2026-07-19'
    description: 'Targeted finance/health blocker remediation: replace the sole discovery tier with materially distinct 65/75/85 coronial designs, require statutory provenance at 75 and death-finding plus case-detail evidence at 85, canonicalize matcher IDs, and add exact-tier probes.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1505 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-13'
    description: 'Baseline burn-down follow-up: the sole pattern_tier had id_match: '''' (empty string) — idMatchIds() treats an empty id_match string as [], so scripts/verify-pattern-testcases.mjs tierEvaluable() filtered the tier out entirely (0 evaluable tiers), which routed should_not_match evaluation through the hard-fail no-tiers-to-gate-it path instead of the discovery_only warn path the tier was designed for. Wired id_match to the existing purview.keywords group id primary_keywords (already registered under the name: primary_keywords key), making the tier evaluable again; the tier remains discovery_only so a top-level hit on ABS-statistics/hospital-report/textbook prose would surface only as a discovery-inventory warning, not a should_not_match failure. Verified: 0 FAILs, all 3 should_not_match negatives (ABS causes-of-death statistics, hospital annual report, forensic pathology textbook) clear; all 3 should_match positives still pass via top-level pattern.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove the dead template-exclusion declaration (Keyword_noise_exclusion) — no tier referenced it and the legacy tier shape carries no evidence lists to wire it into (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Downgraded weak high-confidence tier to 65 because independent specific/domain evidence was insufficient.; Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
