schema: testpattern/v1
name: University or TAFE Student Disability Access Plan
slug: au-tertiary-disability-access-plan
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Tertiary student disability access and adjustment plans for a named student: condition or diagnosis and the academic adjustments granted. Plan names vary by institution (UQ Student Access Plan, QUT Access Equity Plan, UniSC and Bond Learning Access Plan, CQU Accessibility Plan, UniSQ Learning Support Plan, JCU AccessAbility Services Access Plan).
operation: >-
  Primary: University or TAFE Student Disability Access Plan anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:Student\s+Access\s+Plan|Access\s+Equity\s+Plan|Learning\s+Access\s+Plan|Learning\s+Support\s+Plan|Academic\s+Adjustment\s+Plan|Accessibility\s+Plan|AccessAbility\s+Services|disability\s+notification)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Disability Standards for Education 2005 (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - education
  - health
  - pii
corroborative_evidence:
  keywords:
    - reasonable adjustment
    - reasonable adjustments
    - disability
    - diagnosis
    - extra time
    - rest breaks
    - note-taker
    - alternative format
  proximity: 300
identifier_dependencies:
  - type: student
    name: Student ID / EQ ID
    note: >-
      University / TAFE student number format
    affects: precision at 75/85 (public fallback is the generic labelled-field regex)
test_cases:
  should_match:
    - value: "Student Access Plan (SAP)\nStudent name: Avery Teston\nStudent number: 45118273\nProgram: Bachelor of Nursing\nCondition: chronic fatigue syndrome\nReasonable adjustments: 25% extra time in exams, rest breaks, flexible attendance."
      description: Populated record 1
      synthetic: true
    - value: "Learning Access Plan\nStudent name: Morgan Teston\nStudent ID: s4471820\nDisability adviser: Jordan Staffson\nDiagnosis: autism spectrum disorder\nAdjustments: separate exam room, advance notice of timetable changes."
      description: Populated record 2
      synthetic: true
    - value: "Access Equity Plan\nStudent number: n11234567\nAdjustments: note-taker, lecture recordings, assessment extensions up to 7 days (mental health condition)."
      description: Narrative record 3 without labelled fields (reaches 65 discovery only, by design)
      synthetic: true
  should_not_match:
    - value: Students with a disability, health or mental health condition can register with disability services to receive a Learning Access Plan outlining reasonable adjustments.
      description: Guidance or explainer text
    - value: "Student Access Plan\nStudent name: __________\nStudent number: __________\nReasonable adjustments: __________"
      description: Blank form
    - value: One in ten domestic university students reported a disability in 2025, national higher education data show.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_tertiary_disability_access_plan_primary
      matches:
        - ref: Regex_au_tertiary_disability_access_plan_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_tertiary_disability_access_plan_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_tertiary_disability_access_plan_primary
      matches:
        - ref: Regex_au_tertiary_disability_access_plan_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_tertiary_disability_access_plan_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_tertiary_disability_access_plan_primary
      pattern: >-
        (?i)\b(?:Student\s+Access\s+Plan|Access\s+Equity\s+Plan|Learning\s+Access\s+Plan|Learning\s+Support\s+Plan|Academic\s+Adjustment\s+Plan|Accessibility\s+Plan|AccessAbility\s+Services|disability\s+notification)\b
    - id: Regex_au_tertiary_disability_access_plan_record_structure
      pattern: >-
        (?i)\b(?:student\s+name|child(?:'s)?\s+name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|principal|school|(?:student|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_tertiary_disability_access_plan_corroborative
      groups:
        - match_style: word
          terms:
            - reasonable adjustment
            - reasonable adjustments
            - disability
            - diagnosis
            - extra time
            - rest breaks
            - note-taker
            - alternative format
            - separate room
            - disability adviser
            - medical documentation
            - lecture recordings
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a university or tafe student disability access plan about an identified person, gated on populated record fields. Tertiary student disability access and adjustment plans for a named student: condition or diagnosis and the academic adjustments granted. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: UQ — Student Access Plan (anchor confirmed from official-domain search results; page fetch blocked)
    url: https://my.uq.edu.au/information-and-services/student-support/disability-support
  - title: Bond University — Learning Access Plan (anchor confirmed from official-domain search results; page fetch blocked)
    url: https://bond.edu.au/current-students/support-and-services/disability-support
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
