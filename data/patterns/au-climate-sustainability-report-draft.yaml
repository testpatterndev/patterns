schema: testpattern/v1
name: Draft Climate Statements and Sustainability Report (Pre-Release)
slug: au-climate-sustainability-report-draft
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Draft mandatory climate-related financial disclosures before release: annual sustainability reports and climate
  statements under Corporations Act 2001 Part 2M.3 (s 292A who must prepare, s 296A contents, s 296B no material
  climate risk statement, s 296C compliance with sustainability standards, s 296D climate statement disclosures
  including the s 296D(2B) two-scenario analysis, s 301A audit) and AASB S2 Climate-related Disclosures (governance,
  strategy, risk management, metrics and targets: Scope 1 / 2 / 3 emissions, transition plan, climate-related scenario
  analysis, climate resilience, physical and transition risks, internal carbon price), when the document carries a
  pre-release marker (DRAFT, not for release, embargoed, subject to Board approval, board paper) and populated
  metrics or scenario results. Published sustainability reports, AASB S2 and ASIC guidance are public and do not reach
  enforce tiers.
operation: >-
  Primary: climate statement(s), (annual) sustainability report, AASB S2, climate-related (financial) disclosures,
  climate-related scenario analysis, climate-related risks and opportunities, climate resilience assessment, or a
  section reference to s 292A, 296A-296D or 301A. 65 is discovery-only (primary alone) and will surface published
  reports, AASB / ASIC guidance and commentary. 75 requires a pre-release marker (case-sensitive DRAFT, "Draft v0.x",
  "Draft for Board / audit committee review", not for release / distribution / publication, EMBARGOED / embargoed
  until, subject to Board / directors' approval, for Board approval, board paper, pre-release, Commercial-in-Confidence)
  plus one populated structure within 300 characters: a Scope 1/2/3 emissions figure in t / kt / Mt CO2-e, a
  percentage reduction target against a year, or a scenario result (1.5 / 2-4 degree C, SSP, RCP or NZE scenario with
  a dollar or percentage impact, or an impairment / carrying amount / financial impact / internal carbon price /
  closure or retirement date with a value). 85 requires the marker plus two distinct populated structures (two
  different emissions metrics, or a metric and a scenario result) plus independent evidence (directors' declaration,
  climate resilience, transition plan, scenario analysis, physical / transition risk, location- / market-based,
  limited / reasonable assurance, audit committee, Climate Change Act 2022, Part 2M.3). Every tier excludes
  template/fixture text; enforce tiers also exclude standard-setter and regulator text (aasb.gov.au, asic.gov.au,
  legislation.gov.au, "Exposure Draft", Illustrative Examples, Basis for Conclusions, "this Standard", compilation
  headers, article disclaimers).
pattern: (?i)\b(?:climate\s+statements?|(?:annual\s+)?sustainability\s+report|AASB\s+S2|climate-related\s+(?:financial\s+)?disclosures?|climate-related\s+(?:scenario\s+analysis|risks\s+and\s+opportunities)|climate\s+resilience\s+assessment|(?:section|s\.?)\s?(?:292A|296[A-D]|301A))\b
confidence: medium
confidence_justification: >-
  Medium: the primary terms are statutory and distinctive, but published sustainability reports carry the same terms
  and populated metrics, so enforce tiers require a pre-release marker as well as populated metrics or scenario
  results. A draft circulated without any marker stays at 65, and a published report that leaves "Draft" in a
  footer would be a false positive. 85/75 are heuristic evidence tiers, not measured accuracy; test values are
  synthetic.
jurisdictions:
  - au
regulations:
  - Corporations Act 2001 (Cth)
  - AASB S2 Climate-related Disclosures (September 2024)
  - Climate Change Act 2022 (Cth)
frameworks:
  - QGISCF
  - PSPF
  - AASB S2
data_categories:
  - environment
  - financial
  - business
corroborative_evidence:
  keywords:
    - directors' declaration
    - climate resilience
    - transition plan
    - scenario analysis
    - physical risk
    - transition risk
    - location-based
    - market-based
    - limited assurance
    - reasonable assurance
    - audit committee
    - Climate Change Act 2022
  proximity: 300
test_cases:
  should_match:
    - value: "DRAFT v0.3 - NOT FOR RELEASE\nClimate statements for the year ended 30 June 2026 (AASB S2)\nScope 1 emissions: 3,904,112 tCO2-e\nScope 2 emissions (location-based): 41,870 tCO2-e\nScope 3 emissions: 612,400 tCO2-e\nDirectors' declaration to be signed after audit committee review."
      description: 85 tier - pre-release climate statements with three distinct Scope metrics plus directors' declaration and audit committee evidence
      synthetic: true
    - value: "Board paper - subject to Board approval\nClimate-related scenario analysis (s 296D(2B)) for the annual sustainability report\n1.5°C scenario (NZE 2050): impairment of Callide Ridge units of A$412m and closure brought forward to FY2031\n2.7°C scenario: physical risk to cooling water supply reduces summer output by 18%\nScope 1 emissions 4,120,000 tCO2-e in the FY2026 baseline year\nTransition plan targets remain confidential until release."
      description: 85 tier - board paper with scenario results and a Scope 1 metric plus transition plan and physical risk evidence
      synthetic: true
    - value: "Draft for audit committee review\nSustainability report 2026 - metrics and targets\nScope 1 emissions: 812,300 tCO2-e"
      description: 75 tier - draft marker plus one Scope metric
      synthetic: true
    - value: "EMBARGOED until 28 September 2026\nClimate statements - climate-related scenario analysis\n2.5°C pathway: revenue at risk 7% by 2035 for the gas retail segment"
      description: 75 tier - embargo marker plus one scenario result
      synthetic: true
  should_not_match:
    - value: "AASB S2 Climate-related Disclosures. An entity shall disclose its absolute gross greenhouse gas emissions generated during the reporting period, expressed as metric tonnes of CO2 equivalent, classified as Scope 1 greenhouse gas emissions, Scope 2 greenhouse gas emissions and Scope 3 greenhouse gas emissions. This Standard applies to annual reporting periods beginning on or after 1 January 2025."
      description: AASB S2 standard text
    - value: "Marlow Ridge Energy Annual Sustainability Report 2025\nClimate statements\nScope 1 emissions: 3,904,112 tCO2-e\nScope 2 emissions: 41,870 tCO2-e\nOur 1.5°C scenario indicates an impairment of A$412m for the Callide Ridge units."
      description: Published sustainability report (no pre-release marker)
    - value: "DRAFT climate statement\nScope 1 emissions: ______ tCO2-e\nScope 2 emissions: ______ tCO2-e\nScenario analysis (1.5°C): [insert]"
      description: Blank draft outline with no populated values
    - value: "EXPOSURE DRAFT ED SR1 Australian Sustainability Reporting Standards. Proposed climate-related disclosures would require Scope 1, Scope 2 and Scope 3 emissions and scenario analysis consistent with a 1.5°C pathway. Comments are due by 1 March 2024."
      description: AASB exposure draft
    - value: "Mandatory climate-related financial disclosures now apply to Group 1 entities. Section 296D(2B) requires scenario analysis using at least a 1.5°C scenario and a 2.5°C or higher scenario. This article is general information only and is not legal advice."
      description: Law-firm article
    - value: "Training exercise: DRAFT climate statement\nScope 1 emissions: 1,000 tCO2-e\nScope 2 emissions: 500 tCO2-e"
      description: Training exercise (template-exclusion)
false_positives:
  - description: Published annual and sustainability reports (public once lodged with ASIC) with populated Scope metrics and scenario results.
    mitigation: Enforce tiers require a pre-release marker (case-sensitive DRAFT, not for release, embargoed, subject to Board approval, board paper); published reports stay at 65 discovery.
  - description: AASB S2, AASB exposure drafts, ASIC RG 280 and the Corporations Act text, plus consulting and law-firm commentary.
    mitigation: Guidance has no populated metrics; aasb.gov.au / asic.gov.au / legislation.gov.au, "Exposure Draft", Illustrative Examples, Basis for Conclusions, "this Standard" and article disclaimers are excluded from enforce tiers.
  - description: A published report that still carries a stray "Draft" footer, or an internal draft of a voluntary ESG report.
    mitigation: Accepted; the voluntary draft is still pre-release emissions data and may warrant protection.
  - description: Genuine drafts circulated without any marker.
    mitigation: These stay at 65 discovery; apply the label manually or add the organisation's own draft watermark text to the marker regex.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_climate_sustainability_report_draft_primary
      matches:
        - ref: Regex_au_climate_sustainability_report_draft_marker
        - ref: Regex_au_climate_sustainability_report_draft_metric
          min_count: 2
          unique_results: true
        - ref: Keyword_au_climate_sustainability_report_draft_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_climate_sustainability_report_draft_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_climate_sustainability_report_draft_primary
      matches:
        - ref: Regex_au_climate_sustainability_report_draft_marker
        - ref: Regex_au_climate_sustainability_report_draft_metric
        - ref: Regex_au_climate_sustainability_report_draft_scenario
        - ref: Keyword_au_climate_sustainability_report_draft_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_climate_sustainability_report_draft_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_climate_sustainability_report_draft_primary
      matches:
        - ref: Regex_au_climate_sustainability_report_draft_marker
        - type: any
          refs:
            - Regex_au_climate_sustainability_report_draft_metric
            - Regex_au_climate_sustainability_report_draft_scenario
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_climate_sustainability_report_draft_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_climate_sustainability_report_draft_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_climate_sustainability_report_draft_primary
      pattern: >-
        (?i)\b(?:climate\s+statements?|(?:annual\s+)?sustainability\s+report|AASB\s+S2|climate-related\s+(?:financial\s+)?disclosures?|climate-related\s+(?:scenario\s+analysis|risks\s+and\s+opportunities)|climate\s+resilience\s+assessment|(?:section|s\.?)\s?(?:292A|296[A-D]|301A))\b
    - id: Regex_au_climate_sustainability_report_draft_marker
      pattern: >-
        \b(?:DRAFT|[Dd]raft\s+(?:[vV]\d{1,2}(?:\.\d{1,2})?|[Vv]ersion\s+\d{1,2}(?:\.\d{1,2})?|for\s+(?:[Bb]oard|[Aa]udit|[Dd]irectors|ARC)(?:\s+[Cc]ommittee)?(?:\s+(?:review|approval|consideration))?)|[Nn]ot\s+for\s+(?:release|distribution|publication|external\s+release)|NOT\s+FOR\s+(?:RELEASE|DISTRIBUTION|PUBLICATION)|EMBARGOED|[Ee]mbargoed\s+until|[Ss]ubject\s+to\s+(?:[Bb]oard|[Dd]irectors['’]?)\s+approval|[Ff]or\s+[Bb]oard\s+approval|[Bb]oard\s+paper|[Pp]re-release|[Cc]ommercial[- ]in[- ][Cc]onfidence)\b
    - id: Regex_au_climate_sustainability_report_draft_metric
      pattern: >-
        (?i)(?:\bScope\s+[123](?:\s+(?:GHG|greenhouse\s+gas))?(?:\s+emissions)?(?:\s*\([^)\n]{1,25}\))?[^\n]{0,40}?\b\d{1,3}(?:[, ]\d{3}){0,4}(?:\.\d{1,2})?\s*(?:[kM]?t\s?CO2-?e(?:q)?|(?:thousand\s+|million\s+)?tonnes?\s+(?:of\s+)?CO2(?:-?e|\s+equivalent))\b|\b(?:target|reduc(?:e|tion)|net\s+zero)\b[^\n]{0,60}?\b\d{1,3}(?:\.\d)?\s?%[^\n]{0,40}?\b(?:by|from|against)\s+(?:FY\s?)?20\d{2}\b)
    - id: Regex_au_climate_sustainability_report_draft_scenario
      pattern: >-
        (?i)(?:(?:\b(?:1\.5|[2-4](?:\.\d)?)\s?°\s?C|\b(?:1\.5|[2-4](?:\.\d)?)\s+degrees?\b|\bSSP\d-\d\.\d\b|\bRCP\s?\d\.\d\b|\bNZE(?:\s?2050)?\b)[^\n]{0,100}?(?:A?\$\s?\d{1,3}(?:[,.]\d{1,3}){0,3}\s?(?:m|bn|million|billion|k)\b|\b\d{1,3}(?:\.\d{1,2})?\s?%)|\b(?:impairment|carrying\s+amount|financial\s+(?:impact|effect)|revenue\s+at\s+risk|internal\s+carbon\s+price|shadow\s+carbon\s+price|closure\s+date|(?:early\s+)?retirement\s+date)\b[^\n]{0,60}?(?:A?\$\s?\d{1,3}(?:[,.]\d{1,3}){0,3}\s?(?:m|bn|million|billion|k)?\b|\b(?:FY\s?)?20[2-6]\d\b))
    - id: Regex_au_climate_sustainability_report_draft_guidance_exclusion
      pattern: >-
        (?i)(?:\baasb\.gov\.au|\basic\.gov\.au|\blegislation\.gov\.au|\bexposure\s+draft\b|\bCompilation\s+(?:No\.|date)|\bIllustrative\s+Examples?\b|\bBasis\s+for\s+Conclusions\b|\bthis\s+(?:Standard|article|webinar|guide|fact\s?sheet|explainer|insight)\b|\bgeneral\s+information\s+only\b|\bnot\s+legal\s+advice\b|\bsubscribe\s+to\s+our\b|\bCivil\s+penalty\s*:)
  keywords:
    - id: Keyword_au_climate_sustainability_report_draft_corroborative
      groups:
        - match_style: word
          terms:
            - directors' declaration
            - directors’ declaration
            - directors declaration
            - climate resilience
            - transition plan
            - scenario analysis
            - physical risk
            - physical risks
            - transition risk
            - transition risks
            - location-based
            - market-based
            - limited assurance
            - reasonable assurance
            - audit committee
            - Climate Change Act 2022
            - Part 2M.3
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies draft climate statements and annual sustainability reports before release, gated on a
  pre-release marker and populated emissions metrics or scenario results. Draft scenario analysis can disclose asset
  impairments, unannounced closure or retirement dates and revenue at risk; for listed entities and government-owned
  generators this is price- or market-sensitive information until the report is lodged, and directors' declaration
  and auditor drafts carry legal exposure under Part 2M.3. Published reports, AASB S2 and ASIC guidance are excluded
  from enforce tiers. Risk 8 supports SENSITIVE Commercial-in-Confidence.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Commercial-in-Confidence
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
