  - title: Corporations Act 2001 (Cth) - Part 2M.3 ss 292A, 296A-296E, 301A
    url: https://www.legislation.gov.au/C2004A00818/latest/text
  - title: AASB S2 Climate-related Disclosures (September 2024)
    url: https://standards.aasb.gov.au/sites/default/files/2024-10/AASBS2_09-24.pdf
  - title: ASIC RG 280 Sustainability reporting
    url: https://www.asic.gov.au/regulatory-resources/find-a-document/regulatory-guides/rg-280-sustainability-reporting
  - title: ASIC media release 25-051MR - ASIC issues sustainability reporting regulatory guide
    url: https://www.asic.gov.au/about-asic/news-centre/find-a-media-release/2025-releases/25-051mr-asic-issues-sustainability-reporting-regulatory-guide
