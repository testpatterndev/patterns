schema: testpattern/v1
name: Activist defense plans
slug: global-top500-199-activist-defense-plans
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies board and adviser plans for defending against shareholder activists or hostile bids (activist defence, proxy fight, poison pill, takeover defence, white knight) prepared as populated board papers or memos. Commercial and legal information, not personally identifiable information.
operation: 'Primary: activist defence/defense, shareholder activism/activist, poison pill, proxy fight/contest, hostile takeover, board or takeover defence, shareholder rights plan, activist investor/campaign, white knight. 65 (discovery only) = primary alone. 75 = primary plus two distinct populated document header fields (To, From, Date, Subject, Re, Our ref, File/Matter number, Prepared/Approved/Cleared by, Author, Version, Status, Classification). 85 = primary plus three header fields plus independent campaign-response evidence (stake, requisition, section 249D, EGM, board spill, proxy solicitor, register analysis, substantial holder notice, Takeovers Panel, standstill agreement, engagement plan). All tiers exclude template/fixture text.'
pattern: (?is)\b(?:activist\s+defen[cs]e|shareholder\s+activis[mt]|poison\s+pill|proxy\s+(?:fight|contest)|hostile\s+takeover|board\s+defen[cs]e|shareholder\s+rights\s+plan|activist\s+(?:investor|campaign)|takeover\s+defen[cs]e|white\s+knight)\b
confidence: medium
confidence_justification: 'Medium: takeover-defence vocabulary is common in news, coursework and governance training, so enforcement requires a populated board-paper/memo header; 85 adds campaign-response evidence.'
jurisdictions:
- global
regulations:
  - Corporations Act 2001 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - business
  - legal
corroborative_evidence:
  keywords:
  - activist defense plans
  - activist
  - defense
  - plans
  - mergers
  - acquisitions
  - strategy
  proximity: 300
  keyword_lists:
  - au-government-defence-markers
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
    - value: |-
        STRICTLY CONFIDENTIAL - activist defence plan
        To: Board of Directors
        From: Company Secretary
        Date: 12/08/2026
        Subject: Response to Kestrel Capital requisition
        Kestrel holds a 6.1% stake and has served a section 249D requisition for an EGM; the proxy solicitor recommends engaging the top 20 holders before any board spill vote.
      description: 85 - board paper header with requisition/proxy-solicitor evidence
      synthetic: true
    - value: |-
        Shareholder activism response - working notes
        Prepared by: Investor Relations
        Date: 03/06/2026
        Key messages for the chair are being finalised.
      description: 75 - two populated header fields without campaign-response evidence
      synthetic: true
    - value: Notes on the poison pill option for the board retreat.
      description: 65 discovery - topic phrase without a document header
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: merger fundraising
      description: Generic word pair should not match
    - value: 'Governance course notes: a poison pill is a takeover defence used mainly in the United States; Australian law restricts frustrating action.'
      description: Coursework/guidance - no populated header (65 at most)
    - value: |-
        Activist defence plan
        To: ________
        From: ________
        Date: ________
        Subject: [activist name]
      description: Blank board-paper template - placeholder header fields are rejected
    - value: A hedge fund launched a proxy fight at the miner on Monday, seeking two board seats, the newspaper reported.
      description: News item - no populated header
false_positives:
- description: Common words and phrases related to activist defense plans appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_activist_defense
      matches:
        - ref: Regex_global_top500_199_activist_defense_plans_record_structure
          min_count: 3
          unique_results: true
        - ref: Keyword_activist_campaign_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_activist_defense
      matches:
        - ref: Regex_global_top500_199_activist_defense_plans_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_activist_defense
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_activist_defense
      pattern: (?is)\b(?:activist\s+defen[cs]e|shareholder\s+activis[mt]|poison\s+pill|proxy\s+(?:fight|contest)|hostile\s+takeover|board\s+defen[cs]e|shareholder\s+rights\s+plan|activist\s+(?:investor|campaign)|takeover\s+defen[cs]e|white\s+knight)\b
    - id: Regex_global_top500_199_activist_defense_plans_record_structure
      pattern: (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+(?:by|for)|Approved\s+by|Cleared\s+by|Author|Version|Status|Classification|Contact\s+officer|Meeting\s+date|Agenda\s+item)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<)[A-Za-z0-9$]
  keywords:
    - id: Keyword_activist_campaign_evidence
      groups:
        - match_style: word
          terms:
            - requisition
            - section 249D
            - s 249D
            - text: EGM
              case_sensitive: true
            - board spill
            - two strikes
            - proxy solicitor
            - vote solicitation
            - register analysis
            - beneficial ownership
            - substantial holder notice
            - Takeovers Panel
            - standstill agreement
            - engagement plan
            - stake
      strength: specific
risk_description: The concept regex flags activist defense, shareholder activists, poison pills, proxy fights, hostile takeovers,
  board defenses, rights plans, activist investors, defense strategy, and white knights rather than confirming a current campaign.
  A genuine plan can expose vulnerability assessments, board tactics, adviser roles, shareholder outreach, and response triggers,
  allowing an activist or bidder to anticipate and neutralize the defense. The ordinary scope is one issuer and a bounded
  control contest involving directors, investors, and advisers, while public takeover commentary and governance training can
  match. Risk 8 and SENSITIVE reflect serious contained strategic and participant harm; PROTECTED would require systemic market
  disruption, protected public policy, or significant national damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
