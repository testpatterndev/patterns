schema: testpattern/v1
name: Payment fraud investigation files
slug: global-top500-120-payment-fraud-investigation-files
version: 1.2.4
type: regex
pattern_class: concept
engine: boost_regex
description: Detects references to payment fraud investigation files in financial and compliance documents. Commonly found in international regulatory filings, transaction records, and audit documentation.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(?:payment\s+fraud|fraud\s+investigation|suspicious\s+transaction|unauthorized\s+transaction|fraudulent\s+activity|dispute\s+case|fraud\s+alert|suspicious\s+activity\s+report|fraud\s+case|investigation\s+file)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - payment fraud investigation files
    - payment
    - fraud
    - investigation
    - files
    - financial
    - accounts
    - payments
  proximity: 300
  keyword_lists:
    - corporate-finance
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: payment fraud
      description: Primary topic phrase match
    - value: fraud investigation
      description: Case-insensitive topic phrase match
    - value: suspicious transaction
      description: Alternative topic phrase match
    - value: unauthorized transaction
      description: Additional topic phrase match
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: credit premium
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In English (as the primary international business language), standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 75
      id_match: Regex_payment_fraud
      matches:
        - ref: Pattern_global_top500_120_payment_fraud_investigation_files_label_context
        - ref: Keyword_global_top500_120_payment_fraud_investigation_files_domain_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_payment_fraud
      matches:
        - ref: Keyword_payment_fraud
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_payment_fraud
      pattern: >-
        (?is)\b(?:payment\s+fraud|fraud\s+investigation|suspicious\s+transaction|unauthorized\s+transaction|fraudulent\s+activity|dispute\s+case|fraud\s+alert|suspicious\s+activity\s+report|fraud\s+case|investigation\s+file)\b
    - id: Pattern_global_top500_120_payment_fraud_investigation_files_label_context
      pattern: (?i)\b(?:payment\s+fraud\s+investigation\s+files)\b
  keywords:
    - id: Keyword_payment_fraud
      groups:
        - match_style: word
          terms:
            - payment fraud
            - fraud investigation
            - suspicious transaction
            - unauthorized transaction
            - fraudulent activity
            - chargeback
            - dispute case
            - fraud alert
            - suspicious activity report
            - text: SAR
              case_sensitive: true
            - fraud case
            - investigation file
      strength: specific
    - id: Keyword_global_top500_120_payment_fraud_investigation_files_domain_context
      groups:
        - match_style: word
          terms:
            - payment fraud investigation files
            - payment
            - fraud
            - investigation
            - files
      strength: domain
risk_description: >-
  The detector identifies payment-fraud, suspicious or unauthorised transaction, fraud alert, dispute-case, investigation-file, and related case terminology with financial context. A genuine investigation file can expose victims, suspected methods, disputed transactions, investigative status, and control gaps, enabling evasion or further targeting. The normal affected unit is a case or small set of transactions with moderate financial, privacy, and investigative consequences. Risk 7 and SENSITIVE are proportionate, while PROTECTED would require a major active operation, protected intelligence, broad fraud-case repository, or similarly significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 reconciles with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Financial because a real fraud case
    can expose transaction evidence and investigative decisions with credible moderate harm. PROTECTED is not met by the
    normal match because it does not establish protected law-enforcement methods, systemic compromise, or broad case
    scale.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Medium generic classification and Medium Financial DLM fit a bounded payment-fraud case whose disclosure can
      impede investigation or enable repeat fraud without causing significant national or institutional damage.
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
