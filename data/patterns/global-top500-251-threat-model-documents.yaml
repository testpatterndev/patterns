schema: testpattern/v1
name: Threat model documents
slug: global-top500-251-threat-model-documents
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies populated threat model documents (STRIDE, PASTA, attack trees) that enumerate threats against a named system: threat IDs, STRIDE category rows and trust-boundary / data-flow elements. "STRIDE" is only recognised in threat-model context, not as the English word "stride".
operation: >-
  Regex_threat_model_documents (threat model/modelling document/report/workshop/review, STRIDE analysis/threat model/categories/assessment, attack tree, PASTA threat modelling, trust boundary diagram/analysis) is discovery-only at 65. 75 requires one structure: a labelled threat ID, a STRIDE category row with content (Spoofing: ..., Tampering | ...), or a labelled model element (trust boundary, data flow, entry point, data store, external entity, process, component). 85 requires two distinct structures plus treatment wording (mitigation, residual risk, attack vector, DREAD, security control). Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: (?i)\b(?:threat\s+model(?:s|ling|ing)?(?:\s+(?:document|report|workshop|review|assessment|diagram))?|STRIDE\s+(?:analysis|threat\s+model(?:ling|ing)?|categor(?:y|ies)|assessment|review|model)|attack\s+trees?|PASTA\s+threat\s+model(?:ling|ing)?|trust\s+boundar(?:y|ies)\s+(?:diagram|analysis))\b
confidence: medium
confidence_justification: >-
  Medium confidence: threat-model wording is discovery-only; enforcement requires threat IDs, STRIDE rows or model elements, and 85 adds a second structure and treatment context.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
data_categories:
  - security
  - technology
corroborative_evidence:
  keywords:
    - mitigation
    - residual risk
    - attack vector
    - security control
  proximity: 300
test_cases:
  should_match:
    - value: |-
        Threat model - Rates payment gateway (v1.3, reviewed 02/09/2026)
        Trust boundary: public internet to pay-gw01.corp.example.internal (DMZ)
        Data flow: DF-04 card token from web portal to payments API
        Threat ID: T-07  Spoofing: attacker replays a captured session token against the payments API
        Threat ID: T-08  Tampering: amount parameter altered in transit between portal and gateway
        Mitigation: mutual TLS and signed payment requests; residual risk: low
      description: High tier (85) - threat IDs, STRIDE rows and trust boundary/data flow elements with mitigation and residual risk
      synthetic: true
    - value: 'STRIDE analysis for the HR self-service portal - Repudiation: managers can approve leave without an audit record.'
      description: Medium tier (75) - STRIDE category row only
      synthetic: true
    - value: 'Threat modelling workshop notes - Entry point: public booking API behind the web application firewall.'
      description: Medium tier (75) - model element only
      synthetic: true
    - value: Please attach the threat model to the architecture review submission.
      description: Discovery tier (65) - threat model wording only
      synthetic: true
  should_not_match:
    - value: She lengthened her stride on the final lap of the race.
      description: English word stride is not a threat-model primary
    - value: The company made great strides in model accuracy this year.
      description: Common English usage
    - value: 'Guidance note: teams should build a threat model early; STRIDE categories cover spoofing, tampering and repudiation.'
      description: Guidance text
    - value: |-
        Threat model template
        Threat ID: ____  Spoofing: ____
        Trust boundary: ____
        Mitigation: ____
      description: Blank template
    - value: 'Training course exercise: build a threat model for a made-up pizza shop; Spoofing: a customer pretends to be another customer.'
      description: Training framing with a STRIDE row must not enforce
false_positives:
  - description: Threat modelling guidance (OWASP, Microsoft) and training describe STRIDE categories, trust boundaries and data flows generically.
    mitigation: Threat-model wording is discovery-only; enforcement needs populated threat rows or elements, and guidance/training/template framing is excluded.
  - description: The English word "stride".
    mitigation: STRIDE is only matched when followed by analysis/threat model/categories/assessment/review/model.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_threat_model_documents
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_threat_id
            - Evidence_stride_row
            - Evidence_model_element
        - ref: Keyword_threat_treatment
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_threat_model_documents
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_threat_id
            - Evidence_stride_row
            - Evidence_model_element
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_threat_model_documents
  regexes:
    - id: Regex_threat_model_documents
      pattern: (?i)\b(?:threat\s+model(?:s|ling|ing)?(?:\s+(?:document|report|workshop|review|assessment|diagram))?|STRIDE\s+(?:analysis|threat\s+model(?:ling|ing)?|categor(?:y|ies)|assessment|review|model)|attack\s+trees?|PASTA\s+threat\s+model(?:ling|ing)?|trust\s+boundar(?:y|ies)\s+(?:diagram|analysis))\b
    - id: Evidence_threat_id
      pattern: (?i)\bthreat\s+(?:ID|ref(?:erence)?|no\.?)\s{0,3}[:#]?\s{0,3}(?!_{2,}|\[|<)[A-Z]{0,4}-?\d{1,4}\b
    - id: Evidence_stride_row
      pattern: (?i)\b(?:spoofing|tampering|repudiation|information\s+disclosure|denial\s+of\s+service|elevation\s+of\s+privilege)\s{0,3}[:|]\s{0,3}(?!_{2,}|\[|<)[A-Za-z]
    - id: Evidence_model_element
      pattern: (?i)\b(?:trust\s+boundary|data\s+flow|entry\s+point|data\s+store|external\s+entity|process|component)\s*[:#=|]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._@-]{1,60}
  keywords:
    - id: Keyword_threat_treatment
      groups:
        - match_style: word
          terms:
            - mitigation
            - mitigated
            - residual risk
            - attack vector
            - DREAD
            - security control
            - accepted risk
            - compensating control
            - likelihood
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
risk_description: >-
  The detector identifies threat models when threat IDs, STRIDE category rows or trust-boundary/data-flow elements are present; threat-model wording alone is discovery-only. A genuine threat model can disclose trust boundaries, high-value assets, assumed adversaries, known weaknesses, and accepted residual risks that materially improve attack planning. Training material and process templates can match, and one model is usually limited to a system or project whose criticality remains unknown. Risk 7 SENSITIVE reflects moderate harm from exposing a substantive internal model; PROTECTED would require a critical, comprehensive model whose disclosure could cause significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): STRIDE is now only matched in threat-model context (STRIDE analysis/threat model/categories/assessment/review/model), so the English word "stride" no longer hits; bare attack surface/abuse case removed; 75 no longer fires on the primary alone - it requires a threat ID, STRIDE category row or labelled model element - and 85 requires two distinct structures plus treatment wording (replaces self-corroborating topic keyword list and label-context regex); guidance/news/training exclusion added; bare-phrase tests replaced with a synthetic threat model and stride/guidance/template/training decoys. Replaced GDPR with Criminal Code Act 1995 (Cth); added ISO 27001/NIST CSF frameworks and verified OWASP Threat Modeling, NIST SP 800-30r1 and ISM references; data_categories credentials -> technology.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1810 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
