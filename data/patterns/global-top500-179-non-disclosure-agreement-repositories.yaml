schema: testpattern/v1
name: Non-disclosure agreement repositories
slug: global-top500-179-non-disclosure-agreement-repositories
version: 1.4.4
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to non-disclosure agreement repositories in Australian contexts. This information type is classified as personally identifiable information under
  applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters.'
pattern: >-
  (?is)\b(?:non[\s-]+disclosure\s+agreement\s+repositories|non[\s-]+disclosure\s+agreement|confidentiality\s+agreement|confidential\s+information|mutual\s+NDA|unilateral\s+NDA|trade\s+secret|proprietary\s+information|disclosing\s+party|receiving\s+party|confidentiality\s+obligation)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - non-disclosure agreement repositories
    - non
    - disclosure
    - agreement
    - repositories
    - corporate
    - legal
    - governance
  proximity: 300
test_cases:
  should_match:
    - value: non-disclosure agreement repositories
      description: Primary topic phrase match
    - value: non-disclosure agreement
      description: Case-insensitive topic phrase match
    - value: confidentiality agreement
      description: Alternative topic phrase match
    - value: confidential information
      description: Additional topic phrase match
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: board policy
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Common words and phrases related to non-disclosure agreement repositories appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_nda_repositories
      matches:
        - ref: Evidence_nda_repositories
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_nda_repositories
      matches:
        - ref: Evidence_nda_repositories
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_nda_repositories
      matches:
        - ref: Evidence_nda_repositories
  regexes:
    - id: Pattern_nda_repositories
      pattern: >-
        (?is)\b(?:non[\s-]+disclosure\s+agreement\s+repositories|non[\s-]+disclosure\s+agreement|confidentiality\s+agreement|confidential\s+information|mutual\s+NDA|unilateral\s+NDA|trade\s+secret|proprietary\s+information|disclosing\s+party|receiving\s+party|confidentiality\s+obligation)\b
  keywords:
    - id: Evidence_nda_repositories
      groups:
        - match_style: word
          terms:
            - non-disclosure agreement repositories
            - non-disclosure agreement
            - text: NDA
              case_sensitive: true
            - confidentiality agreement
            - confidential information
            - mutual NDA
            - unilateral NDA
            - trade secret
            - proprietary information
            - disclosing party
            - receiving party
            - confidentiality obligation
      strength: specific
risk_description: >-
  This detector finds references to NDA repositories, confidentiality agreements, non-disclosure agreements, and confidential information rather than credentials for a repository or the agreements stored inside it. A genuine reference may reveal that an organisation maintains a collection of confidentiality instruments, but exploitation still requires its location, access path, parties, or agreement contents. The same wording is routine in procurement guidance, policies, templates, and contract administration, making standalone harm low. Risk 4 supports OFFICIAL; SENSITIVE would require repository access details, a party-indexed agreement inventory, sensitive obligations, or bulk executed NDAs.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 4 with PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM and Low tier fits references to NDA repositories and
    confidentiality agreements, wording that is routine in procurement guidance and templates. SENSITIVE is not met
    because the match carries no repository location, access path, party index or agreement contents.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low handling fits a reference to an NDA collection; an executed agreement inventory or repository access
      details would warrant Medium.
