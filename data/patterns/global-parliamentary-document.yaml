schema: testpattern/v1
name: Parliamentary Document
slug: global-parliamentary-document
version: 1.6.2
type: regex
pattern_class: concept
engine: boost_regex
description: 'Identifies populated Australian question-time briefs (QTB), Senate Estimates briefs, parliamentary question responses and parliamentary correspondence briefs: the brief type together with populated brief header fields (Minister, portfolio, issue, division, contact officer, cleared by, date, question or brief number).'
operation: 'Primary: QTB, question time brief, Senate Estimates brief, estimates committee brief, parliamentary question response, parliamentary correspondence brief. 65 (discovery only) = primary alone. 75 = primary plus two distinct populated brief header fields (Minister, Portfolio, Issue, Topic, Division, Branch, Contact officer, Cleared/Approved/Prepared by, Date, Question/QoN/Brief number, Hearing date, Committee) with non-placeholder values. 85 = primary plus three distinct header fields plus substantive response content (likely question, suggested response, proposed answer, talking points, media lines, key facts, anticipated supplementary). All tiers exclude template/fixture text.'
pattern: (?is)\b(?:QTB|question\s+time\s+brief|Senate\s+Estimates\s+brief|estimates\s+committee\s+brief|parliamentary\s+question\s+response|parliamentary\s+correspondence\s+brief)\b
confidence: medium
confidence_justification: 'Medium: brief-type names appear in public guidance, training and news, so enforcement requires populated brief header fields; 85 adds response content.'
jurisdictions:
  - global
regulations:
  - Right to Information Act 2009 (Qld)
frameworks:
  - PSPF
  - QGISCF
  - ISO 27001
data_categories:
  - government
test_cases:
  should_match:
    - value: |-
        QUESTION TIME BRIEF - NOT FOR RELEASE
        Minister: Minister for Housing
        Portfolio: Housing and Public Works
        Issue: Social housing register growth
        Contact officer: Jordan Staffson, 3035 6621
        Cleared by: Deputy Director-General, 12/08/2026
        Likely question: Why has the register grown by 9 per cent?
        Suggested response: The Government has funded 1,200 additional dwellings this year.
      description: 85 - populated QTB header fields plus likely question and suggested response
      synthetic: true
    - value: |-
        Senate Estimates brief SB26-000412
        Division: Border Operations
        Date: 03/06/2026
        The program remains within its approved budget for 2025-26.
      description: 75 - populated brief header fields without response content
      synthetic: true
    - value: 'Question time brief QTB-204: likely question, proposed answer, talking points, media lines, key facts, not for release, and clearance required'
      description: 65 discovery - brief type and content words but no populated header fields
  should_not_match:
    - value: The parliamentary cafe serves lunch daily
      description: Unrelated parliamentary wording
    - value: A tour of Parliament House
      description: Tourism context
    - value: The public guide explains the purpose of question time briefs.
      description: Public process guidance without a live brief
    - value: 'Training example: question time brief QTB-204 with likely question, proposed answer, and not for release'
      description: Explicit training content must not enforce
    - value: |-
        Question time brief template
        Minister: ________
        Issue: ________
        Contact officer: [name, phone]
        Cleared by: ________
      description: Blank brief template - placeholder fields are rejected
    - value: The minister's leaked question time brief suggested the register had grown, the Opposition told parliament on Tuesday.
      description: News item - no populated brief header fields
false_positives:
  - description: Public parliamentary guidance, published transcripts, and media commentary discuss questions, answers, talking points, and estimates without containing a pre-release response brief.
    mitigation: Keep parliamentary brief topics discovery-only and require likely-question, response, talking-point, media-line, key-fact, supplementary, answer, portfolio, or hearing content.
  - description: Training briefs can contain realistic question numbers, draft answers, media lines, embargoes, and clearance instructions.
    mitigation: Reject explicit template, demo, tutorial, sample-data, and training-example framing from enforcing tiers.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  This keyword classifier recognises parliamentary questions, question-time briefs, Senate Estimates material, talking points, suggested responses, and parliamentary correspondence rather than tourism or general Parliament references. Before tabling or delivery, a genuine document can expose anticipated scrutiny, draft answers, policy positions, operational facts, and communications strategy that enable political manipulation or prejudice an official response. The impact is serious but normally confined to one parliamentary issue, and many documents become public after use or release. Risk 8 SENSITIVE Government is defensible for the pre-release record; PROTECTED is not met without Cabinet material, national-security operations, life-safety effects, or credible significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: "CUI Specified"
  uk_gov: "SECRET"
  nz_gov: "SECRET"
  ca_gov: "Confidential"
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE Government because a populated QTB or
    Estimates brief carries draft answers, policy positions and communications strategy before delivery. PROTECTED is
    not met: the harm is confined to one parliamentary issue, and much of the content becomes public once the question
    is answered.
  generic:
    classification: Medium
    dlm: Medium Government
    rationale: >-
      Medium Government handling fits pre-delivery parliamentary briefs whose premature release could prejudice an
      official response. It stays below High because the material is usually released after use.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_parliamentary_brief
      matches:
        - ref: Regex_global_parliamentary_document_record_structure
          min_count: 3
          unique_results: true
        - ref: Evidence_parliamentary_response_content
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_parliamentary_brief
      matches:
        - ref: Regex_global_parliamentary_document_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_parliamentary_brief
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_parliamentary_brief
      pattern: (?is)\b(?:QTB|question\s+time\s+brief|Senate\s+Estimates\s+brief|estimates\s+committee\s+brief|parliamentary\s+question\s+response|parliamentary\s+correspondence\s+brief)\b
    - id: Regex_global_parliamentary_document_record_structure
      pattern: (?i)\b(?:Minister|Portfolio|Issue|Topic|Division|Branch|Contact\s+officer|Cleared\s+by|Approved\s+by|Prepared\s+by|Date|Question\s+(?:no\.?|number)|QoN\s+(?:no\.?|number)|Brief\s+(?:no\.?|number|ID)|Hearing\s+date|Committee)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<)[A-Za-z0-9$]
  keywords:
    - id: Evidence_parliamentary_response_content
      groups:
        - match_style: word
          terms:
            - likely question
            - suggested response
            - proposed answer
            - talking points
            - media lines
            - key facts
            - key messages
            - anticipated supplementary
            - portfolio issue
      strength: domain
references:
  - title: Right to Information Act 2009 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-013
  - title: Protective Security Policy Framework (PSPF)
    url: https://www.protectivesecurity.gov.au/
created: '2026-02-09'
updated: '2026-09-25'
changelog:
  - version: 1.6.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had no generic classification, no
      rationale, no tier).
  - version: 1.6.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): 75 now requires two distinct populated brief header fields (new Regex_..._record_structure: Minister, Portfolio, Issue, Division, Contact officer, Cleared by, Date, Question/Brief number ...) instead of response-content keywords; 85 requires three header fields plus response content (the old 85 was reachable on topic words alone). Dropped the pre-release keyword group; recommended_confidence 85 -> 75. Replaced bare-phrase and keyword-probe positives with populated synthetic briefs; added blank-template and news decoys. Regulations: removed IPA 2009, Privacy Act and SOCI Act (not applicable to ministerial briefs), added RTI Act 2009 (Qld). Frameworks: DISP and NIST CSF replaced by PSPF and QGISCF. Added references.'
  - version: 1.5.0
    date: '2026-07-04'
    description: Split parliamentary-brief discovery, substantive response content, and pre-release evidence into calibrated 65/75/85 tiers; narrow enforcement and exclude training content.
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 566 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.2.0
    date: '2026-07-04'
    description: Replace bare generic keyword terms with domain-anchored phrases (FP reduction)
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
