schema: testpattern/v1
name: Research lab notebooks
slug: global-top500-209-research-lab-notebooks
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects populated research laboratory notebook entries: a lab/research/electronic lab notebook or experiment-log phrase combined with a labelled experiment/entry/batch identifier or a named researcher/witness. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: research lab notebook(s), lab(oratory) notebook(s), research notebook(s), electronic lab notebook, experiment(al) log(s), laboratory record(s). 65 (discovery only): primary alone. 75: primary plus one populated field - experiment/protocol/page/entry/run/batch/lot/sample/construct/strain/cell line identifier containing a digit, or a named researcher/scientist/investigator/performed by/witnessed by. 85: primary plus two distinct structures (the two above or a measurement with laboratory units such as mg/mL, uL, degC, rpm) plus bench evidence (hypothesis, observations, reagents, protocol deviation, unexpected result, positive/negative control, centrifuged, incubated, aliquot, yield). Template/sample and guidance/news framing excluded on every enforce tier.
pattern: >-
  (?i)\b(?:research\s+lab(?:oratory)?\s+notebooks?|lab(?:oratory)?\s+notebooks?|research\s+notebooks?|electronic\s+lab(?:oratory)?\s+notebooks?|experiment(?:al)?\s+logs?|laboratory\s+records?)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require a populated entry identifier or named researcher beside the notebook phrase; the previous tiers fired on generic phrases such as 'intellectual property' or 'research findings' (removed from the primary). Research-integrity policies and news stay at 65. Medium because teaching-lab worksheets share the structure.
jurisdictions:
  - global
regulations:
  - Patents Act 1990 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - hypothesis
    - observations
    - reagents
    - protocol deviation
    - unexpected result
    - positive control
    - negative control
    - centrifuged
    - incubated
    - aliquot
  proximity: 300
test_cases:
  should_match:
    - value: "Lab notebook - Project HELIX (confidential)\nExperiment ID: HX-114\nPage: 42\nPerformed by: Dr Priya Ramanathan\nIncubated 2.5 mL lysate at 37 °C for 30 min, centrifuged at 12000 rpm; yield 4.2 mg/mL. Observations: unexpected result in the negative control.\nWitnessed by: Alex Moreau"
      description: Populated notebook entry - IDs, researcher, witness, measurements and bench evidence (85)
      synthetic: true
    - value: "Research notebook entry\nResearcher: Jordan Teston\nContinued from the previous page."
      description: Entry with a named researcher only (75)
      synthetic: true
  should_not_match:
    - value: "Policy guidance: keep a lab notebook for every project. Record the experiment ID, date, researcher and results, and have entries witnessed in line with the research integrity policy."
      description: Research-integrity guidance
      synthetic: true
    - value: "LAB NOTEBOOK\nExperiment ID: __________\nResearcher: __________\nWitnessed by: __________"
      description: Blank notebook page - placeholder values
      synthetic: true
    - value: "Scientists' laboratory records from the 1950s were digitised by the museum, a news report said."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "algorithm schematic"
      description: Unrelated
false_positives:
  - description: Research-integrity policies and lab-induction training describing notebook practice.
    mitigation: No populated identifiers or researcher names, and guidance/training framing is excluded.
  - description: Undergraduate teaching-lab worksheets.
    mitigation: They can reach 75 when filled in; confirm research context in policy.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_research_lab_notebooks
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_209_research_lab_notebooks_entry
            - Regex_global_top500_209_research_lab_notebooks_researcher
            - Regex_global_top500_209_research_lab_notebooks_measurement
        - ref: Keyword_global_top500_209_research_lab_notebooks_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_209_research_lab_notebooks_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_research_lab_notebooks
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_209_research_lab_notebooks_entry
            - Regex_global_top500_209_research_lab_notebooks_researcher
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_209_research_lab_notebooks_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_research_lab_notebooks
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_research_lab_notebooks
      pattern: (?i)\b(?:research\s+lab(?:oratory)?\s+notebooks?|lab(?:oratory)?\s+notebooks?|research\s+notebooks?|electronic\s+lab(?:oratory)?\s+notebooks?|experiment(?:al)?\s+logs?|laboratory\s+records?)\b
    - id: Regex_global_top500_209_research_lab_notebooks_entry
      pattern: (?i)\b(?:experiment|expt|protocol|notebook|page|entry|run|batch|lot|sample\s+ID|construct|strain|cell\s+line)\s*(?:no\.?|number|ID|#)?[ \t]{0,3}[:#][ \t]{0,3}(?=[A-Z-]{0,8}\d)[A-Z0-9][A-Z0-9./-]{0,20}\b
    - id: Regex_global_top500_209_research_lab_notebooks_researcher
      pattern: (?i)\b(?:researcher|scientist|investigator|performed\s+by|recorded\s+by|witness(?:ed\s+by)?|analyst|student)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?:(?:Mr|Mrs|Ms|Mx|Dr|Prof)\.?[ \t]{1,3})?[A-Z][A-Za-z'.-]{1,30}(?:[ \t]{1,3}[A-Z&][A-Za-z'.&-]{0,30}){0,5}
    - id: Regex_global_top500_209_research_lab_notebooks_measurement
      pattern: (?i)\b\d{1,5}(?:\.\d{1,4})?[ \t]?(?:mg/mL|mg|µg|ug|ng|mL|µL|uL|mM|µM|uM|nM|°C|rpm|x[ \t]?g)(?![A-Za-z])
  keywords:
    - id: Keyword_global_top500_209_research_lab_notebooks_domain_evidence
      groups:
        - match_style: word
          terms:
            - hypothesis
            - observations
            - reagents
            - protocol deviation
            - unexpected result
            - positive control
            - negative control
            - centrifuged
            - incubated
            - aliquot
            - yield
            - witnessed and understood
      strength: domain
    - id: Keyword_global_top500_209_research_lab_notebooks_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - research integrity policy
            - digitised by the museum
      strength: noise
risk_description: >-
  The detector identifies a research lab notebook, research notebook, experiment log, laboratory record, confidential research record, or document containing unpublished findings. A genuine notebook can preserve experimental sequence, negative results, methods, observations, provenance, and invention priority, allowing a rival to reproduce work or pre-empt publication and patent claims. Broad topic phrases and training material create false positives, but the normal record-level unit is a bounded notebook for one research stream rather than an entire institutional portfolio. Risk 8 supports SENSITIVE InfoTech; PROTECTED would require uniquely strategic critical research, dangerous operational detail, or aggregated programme compromise causing significant damage. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 reconciles with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the Personal-Privacy DLM, and Medium for an
    unpublished research notebook. PROTECTED is not met because a normal notebook does not establish dangerous
    controlled content, critical national capability, or significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium classification and Medium Personal-Privacy DLM reflect serious inventorship and research-value exposure
      within one laboratory notebook or experiment stream.
created: '2026-02-08'
updated: '2026-09-25'
changelog:
  - version: 1.4.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs a populated experiment/entry/batch identifier or named researcher/witness and 85 needs two distinct structures (including laboratory measurements) plus bench evidence. Removed the self-corroborating evidence group and generic primaries (intellectual property, confidential research, proprietary data, research findings, unpublished results). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA, My Health Records Act, TIA Act and GDPR; added Patents Act 1990 (Cth) with a verified reference.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 810 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
