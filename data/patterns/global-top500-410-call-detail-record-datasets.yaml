schema: testpattern/v1
name: Call detail record datasets
slug: global-top500-410-call-detail-record-datasets
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to call detail record datasets in Australian contexts. This information type is classified as personally identifiable information under the Privacy Act
  1988.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(?:call\s+detail\s+record\s+datasets|call\s+detail\s+record|CDR\s+data|telecommunications\s+metadata|call\s+log|phone\s+records|metadata\s+retention|subscriber\s+data|communications\s+data|law\s+enforcement|call\s+history|telephony\s+records)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - call detail record datasets
    - call
    - detail
    - record
    - datasets
    - law
    - enforcement
    - justice
  proximity: 300
  keyword_lists:
    - government-services
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: call detail record datasets
      description: Primary topic phrase match
    - value: call detail record
      description: Case-insensitive topic phrase match
    - value: CDR data
      description: Alternative topic phrase match
    - value: telecommunications metadata
      description: Additional topic phrase match
    - value: |-
        Call detail record datasets
        Name: Avery Teston
        Date of birth: 14/02/1988
        Client number: C4471820
      description: Populated person/client record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: mugshot victim
      description: Generic word pair from old broad template should not match
    - value: |-
        Call detail record datasets:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about call detail record datasets are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to call detail record datasets appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_call_detail_record_datasets
      matches:
        - ref: Regex_global_top500_410_call_detail_record_datasets_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_call_detail_record_datasets
      matches:
        - ref: Regex_global_top500_410_call_detail_record_datasets_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_call_detail_record_datasets
  regexes:
    - id: Pattern_call_detail_record_datasets
      pattern: >-
        (?is)\b(?:call\s+detail\s+record\s+datasets|call\s+detail\s+record|CDR\s+data|telecommunications\s+metadata|call\s+log|phone\s+records|metadata\s+retention|subscriber\s+data|communications\s+data|law\s+enforcement|call\s+history|telephony\s+records)\b
    - id: Pattern_au_top500_410_call_detail_record_datasets_label_context
      pattern: (?i)\b(?:call\s+detail\s+record\s+datasets)\b
    - id: Regex_global_top500_410_call_detail_record_datasets_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_top500_410_call_detail_record_datasets_domain_context
      groups:
        - match_style: word
          terms:
            - call detail record datasets
            - call
            - detail
            - datasets
risk_description: >-
  This detector targets call-detail-record datasets and telecommunications metadata rather than a single telephone number or a generic call reference. A true dataset can map who communicated with whom, when, for how long, and sometimes from where, exposing social networks, confidential contacts, and investigative focus across multiple people. Policy and technical descriptions are possible false positives, but actual rows or schema fields create serious privacy and operational harm. Risk 8 supports SENSITIVE Personal-Privacy; PROTECTED would require population-scale holdings, protected-source networks, critical collection methods, or significant operational compromise.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and Personal-Privacy because call metadata reveals
    relationship and behavioural patterns about subscribers and their contacts. PROTECTED is not met by a bounded
    dataset without population-scale aggregation, protected communications, or major operational consequences.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Call-detail data is generically Medium with Medium Personal-Privacy handling because metadata supports sensitive
      social and location inferences even when message or call content is absent.
references:
  - title: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)"
    url: https://www.legislation.gov.au/C2006A00169/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
