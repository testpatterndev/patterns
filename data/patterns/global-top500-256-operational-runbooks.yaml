schema: testpattern/v1
name: Operational runbooks
slug: global-top500-256-operational-runbooks
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies operational, maintenance and on-call runbooks, operations manuals and troubleshooting guides containing numbered steps, shell/admin commands or internal hosts. Titles alone are discovery-only. Substantially overlaps global-it-runbook-playbook (same structures); candidate for merge.
operation: >-
  Regex_operational_runbooks (operational/operations/maintenance runbook, runbook procedure, on-call playbook/runbook/handbook, operations manual, troubleshooting guide, escalation procedure) is discovery-only at 65. 75 requires one populated structure: a numbered step, a shell/admin command, or an internal hostname/IP/labelled host. 85 requires two distinct structures plus operational wording (rollback, expected output, health check, escalate, maintenance window). Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: (?i)\b(?:operational\s+runbooks?|operations\s+runbooks?|runbook\s+procedures?|maintenance\s+runbooks?|on[\s-]call\s+(?:playbook|runbook|handbook)s?|operations\s+manual|troubleshooting\s+guide|escalation\s+procedures?)\b
confidence: medium
confidence_justification: >-
  Medium confidence: titles are discovery-only; enforcement requires numbered steps, commands or hosts, and 85 adds a second structure and operational context.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
data_categories:
  - security
  - technology
corroborative_evidence:
  keywords:
    - rollback
    - expected output
    - health check
    - escalate
    - maintenance window
  proximity: 300
test_cases:
  should_match:
    - value: |-
        Operational runbook - nightly batch failure (payments)
        Host: batch01.example.internal
        Step 1: Check the job log in /var/log/batch/settlement.log.
        Step 2: Rerun with sudo systemctl restart settlement-batch.
        If the rerun fails, escalate to the payments on-call lead; rollback is not required.
      description: High tier (85) - host, numbered steps and command with escalation/rollback wording
      synthetic: true
    - value: 'Maintenance runbook for the badge readers: controller acs-ctl01.corp at 10.9.1.5 must be rebooted after firmware loads.'
      description: Medium tier (75) - host structure only
      synthetic: true
    - value: 'Troubleshooting guide - Step 3: clear the print spooler queue before restarting the service.'
      description: Medium tier (75) - numbered step only
      synthetic: true
    - value: The operations manual for the new call centre is still in draft.
      description: Discovery tier (65) - title only
      synthetic: true
  should_not_match:
    - value: 'Guidance note: an operational runbook should list numbered steps and an escalation path; teams should review them yearly.'
      description: Guidance text
    - value: |-
        Operational runbook template
        Host: ______
        Step 1: ______
        Escalation: ______
      description: Blank template
    - value: 'Training course: the troubleshooting guide for the demo lab uses kubectl get pods to show pod status.'
      description: Training framing with a command must not enforce
    - value: The incident response team met on Monday.
      description: Incident response wording no longer part of this primary
false_positives:
  - description: Runbook-writing guidance, ITSM training material and vendor documentation describe steps and commands generically.
    mitigation: Titles are discovery-only; enforcement needs populated steps, commands or internal hosts, and guidance/training/template framing is excluded.
  - description: Overlap with global-it-runbook-playbook, which uses the same structures.
    mitigation: Deploy one of the two; merge recommended.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_operational_runbooks
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_numbered_step
            - Evidence_shell_command
            - Evidence_system_host
        - ref: Keyword_runbook_operations
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_operational_runbooks
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_numbered_step
            - Evidence_shell_command
            - Evidence_system_host
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_operational_runbooks
  regexes:
    - id: Regex_operational_runbooks
      pattern: (?i)\b(?:operational\s+runbooks?|operations\s+runbooks?|runbook\s+procedures?|maintenance\s+runbooks?|on[\s-]call\s+(?:playbook|runbook|handbook)s?|operations\s+manual|troubleshooting\s+guide|escalation\s+procedures?)\b
    - id: Evidence_numbered_step
      pattern: (?i)\bstep\s+\d{1,2}(?:\.\d{1,2})?\s*[:.)-]\s*[A-Za-z]
    - id: Evidence_shell_command
      pattern: \b(?:sudo\s+)?(?:systemctl\s+(?:restart|stop|start|status)|kubectl\s+(?:rollout|scale|delete|get|describe|apply|drain|cordon)|docker\s+(?:restart|compose|run|exec)|az\s+[a-z]{2,20}\s+[a-z]{2,20}|aws\s+[a-z0-9]{2,20}\s+[a-z-]{2,40}|(?:Restart|Stop|Start|Get|Set)-[A-Z][A-Za-z]{2,40}|sqlcmd\s+-S|psql\s+-h|ssh\s+[\w.-]{1,60}@[\w.-]{1,120}|iisreset\b|net\s+(?:stop|start)\s+[\w\"-]{2,60}|pg_(?:dump|restore)\s+-|robocopy\s+[\w\\:$.-]{2,120})
    - id: Evidence_system_host
      pattern: (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:hostname|host|server|asset\s+ID|device\s+ID|node|instance)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._-]{2,63}
  keywords:
    - id: Keyword_runbook_operations
      groups:
        - match_style: word
          terms:
            - rollback
            - roll back
            - expected output
            - verification step
            - health check
            - escalate
            - maintenance window
            - change window
            - maintenance mode
            - failover
            - service restart
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
risk_description: >-
  The detector identifies operational runbooks when numbered steps, administrative commands or internal hosts are present; runbook wording alone is discovery-only. A genuine internal runbook can reveal administrative workflows, recovery steps, service dependencies, escalation contacts, and control bypass procedures that aid disruption or social engineering. Public playbooks and generic process documentation can match, and one runbook ordinarily covers a bounded service or task. Risk 7 SENSITIVE reflects credible moderate harm from exposing actionable operations guidance; PROTECTED would require critical-system procedures or significant damage supported by the actual record.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 1.3.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): narrowed the primary to operational/maintenance/on-call runbooks, operations manuals, troubleshooting guides and escalation procedures (removed incident response, standard operating procedure and recovery procedure, which belong to the IR plan, runbook/playbook and DR classifiers); 75 now requires a numbered step, shell/admin command or internal host and 85 requires two distinct structures plus operational wording (replaces self-corroborating topic lists and label-context regex); guidance/news/training exclusion added; populated synthetic tests and decoys. Replaced GDPR with Criminal Code Act 1995 (Cth); added ISO 27001/NIST CSF frameworks and verified ISM / NIST SP 800-61r3 references; data_categories credentials -> technology. Recommended for merge into global-it-runbook-playbook.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1815 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
