schema: testpattern/v1
name: Restrictive Practice Authorisation or Positive Behaviour Support Plan
slug: au-qld-restrictive-practice-behaviour-support
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Positive behaviour support plans, restrictive practice approvals and authorisations for a named adult with disability: containment, seclusion, chemical, mechanical and physical restraint and restricted access to objects; short-term approvals by the Office of the Public Guardian and QCAT approvals under the Disability Services Act 2006 Part 6.
operation: >-
  Primary: Restrictive Practice Authorisation or Positive Behaviour Support Plan anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:positive\s+behaviour\s+support\s+plan|PBSP|restrictive\s+practices?\s+(?:authorisation|approval|use|report)|regulated\s+restrictive\s+practices?|short[\s-]+term\s+approval|Guardian\s+for\s+Restrictive\s+Practices|(?:chemical|mechanical|physical)\s+restraint|containment\s+(?:and|or)\s+seclusion)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Disability Services Act 2006 (Qld) Part 6
  - NDIS (Restrictive Practices and Behaviour Support) Rules 2018 (Cth)
frameworks:
  - QGISCF
data_categories:
  - health
  - pii
  - legal
corroborative_evidence:
  keywords:
    - behaviour support practitioner
    - Office of the Public Guardian
    - QCAT
    - containment
    - seclusion
    - restricted access to objects
    - PRN
    - antipsychotic
  proximity: 300
identifier_dependencies:
  - type: client
    name: Client / customer ID
    note: >-
      Provider client ID format
    affects: precision at 75/85 (public fallback is the generic labelled-field regex)
test_cases:
  should_match:
    - value: "Positive behaviour support plan\nParticipant: Riley Teston\nNDIS number: 430447182\nBehaviour support practitioner: Casey Staffson\nRestrictive practices: chemical restraint (risperidone PRN), restricted access to objects (kitchen knives locked)."
      description: Populated record 1
      synthetic: true
    - value: "Short-term approval — containment and seclusion\nAdult: Morgan Teston\nApproved by the Office of the Public Guardian for 6 months from 01/09/2026. Implementing provider: Harbour Support Services."
      description: Populated record 2
      synthetic: true
    - value: "Restrictive practice use report\nParticipant: Jamie Teston\nDate of incident: 04/09/2026\nPhysical restraint used for 4 minutes during self-harm episode; not authorised in the plan — reported to the NDIS Commission."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Restrictive practices include seclusion, chemical restraint, mechanical restraint, physical restraint and environmental restraint. They must be part of a positive behaviour support plan and authorised.
      description: Guidance or explainer text
    - value: "Positive behaviour support plan\nParticipant: __________\nNDIS number: __________\nRestrictive practices proposed: __________"
      description: Blank form
    - value: The NDIS Commission received 1.1 million reports of unauthorised restrictive practices in 2024-25, most involving chemical restraint.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_restrictive_practice_behaviour_support_primary
      matches:
        - ref: Regex_au_qld_restrictive_practice_behaviour_support_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_restrictive_practice_behaviour_support_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_restrictive_practice_behaviour_support_primary
      matches:
        - ref: Regex_au_qld_restrictive_practice_behaviour_support_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_restrictive_practice_behaviour_support_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_restrictive_practice_behaviour_support_primary
      pattern: >-
        (?i)\b(?:positive\s+behaviour\s+support\s+plan|PBSP|restrictive\s+practices?\s+(?:authorisation|approval|use|report)|regulated\s+restrictive\s+practices?|short[\s-]+term\s+approval|Guardian\s+for\s+Restrictive\s+Practices|(?:chemical|mechanical|physical)\s+restraint|containment\s+(?:and|or)\s+seclusion)\b
    - id: Regex_au_qld_restrictive_practice_behaviour_support_record_structure
      pattern: >-
        (?i)\b(?:participant|NDIS\s+(?:no\.?|number)|plan\s+(?:start|end|review)\s+date|plan\s+manager|support\s+coordinator|provider|registration\s+(?:no\.?|number)|worker|person\s+with\s+disability|adult|nominee|incident\s+date|date\s+of\s+incident|guardian|name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}|\bNDIS\s+(?:no\.?|number)\s*[:#]?\s*43\d{7}\b
  keywords:
    - id: Keyword_au_qld_restrictive_practice_behaviour_support_corroborative
      groups:
        - match_style: word
          terms:
            - behaviour support practitioner
            - Office of the Public Guardian
            - text: QCAT
              case_sensitive: true
            - containment
            - seclusion
            - restricted access to objects
            - text: PRN
              case_sensitive: true
            - antipsychotic
            - implementing provider
            - NDIS Commission
            - Disability Services Act 2006
            - Senior Practitioner
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a restrictive practice authorisation or positive behaviour support plan about an identified person, gated on populated record fields. Positive behaviour support plans, restrictive practice approvals and authorisations for a named adult with disability: containment, seclusion, chemical, mechanical and physical restraint and restricted access to objects; short-term approvals by the Office of the Public Guardian and QCAT approvals under the Disability Services Act 2006 Part 6. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: Office of the Public Guardian — Restrictive practices decisions
    url: https://www.publicguardian.qld.gov.au/understanding-guardianship/decisions-we-make-for-you/restrictive-practices-decisions
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
