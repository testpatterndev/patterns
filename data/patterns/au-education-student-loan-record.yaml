  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated student help and vet loan application or progression using record context and corroborating fields.",
  "pattern": "(?i)(?:VET student loan|HECS-HELP|FEE-HELP|electronic Commonwealth assistance form|eCAF)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
