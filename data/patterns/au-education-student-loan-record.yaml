      "education",
      "financial"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          },
          {
            "ref": "Regex_4"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:VET student loan|HECS-HELP|FEE-HELP|electronic Commonwealth assistance form|eCAF)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:course|provider)[ \\t]*:[ \\t]*[A-Z][A-Z0-9 .'-]{3,90}"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:census date|progression date|application date)[ \\t]*:[ \\t]*(?:\\d{4}-\\d{2}-\\d{2}|\\d{1,2}/\\d{1,2}/\\d{4})"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)(?:loan amount[ \\t]*:[ \\t]*\\$[1-9][0-9,]*(?:\\.\\d{2})?|progression status[ \\t]*:[ \\t]*(?:confirmed|withdrawn|continuing|resumed))"
      },
      {
        "id": "Regex_4",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      }
    ]
  },
