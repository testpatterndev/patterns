  "risk_description": "A populated student help and vet loan application or progression can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://www.dewr.gov.au/node/15922"
    }
  ],
