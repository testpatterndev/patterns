    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE Financial"
  },
  "classification": {
    "tier": "Medium",
    "rationale": "Populated student help and vet loan application or progression maps to SENSITIVE Financial. The classifier requires record context and corroborating fields. The mapping does not determine the risk of every matched document.",
    "generic": {
      "classification": "Medium",
      "dlm": "Medium Financial",
      "rationale": "Medium Financial handling applies to the populated record. Synthetic checks establish local matching behavior, not tenant detection accuracy."
    }
  },
  "package_tags": {
    "primary_component": "student-child-records",
    "components": [
