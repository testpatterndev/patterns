schema: testpattern/v1
name: Field failure investigation reports
slug: global-top500-234-field-failure-investigation-reports
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to field failure investigation reports in international contexts.
  This information type is classified as personally identifiable information under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 8 keywords within 300 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:field\s+failure|failure\s+investigation|failure\s+analysis|field\s+return|customer\s+complaint|defect\s+report|failure\s+mode|incident\s+report|product\s+recall|corrective\s+action)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
  - GDPR
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
  - field failure investigation reports
  - field
  - failure
  - investigation
  - reports
  - product
  - quality
  - safety
  proximity: 300
test_cases:
  should_match:
  - value: field failure
    description: Primary topic phrase match
  - value: failure investigation
    description: Case-insensitive topic phrase match
  - value: failure analysis
    description: Alternative topic phrase match
  - value: field return
    description: Additional topic phrase match
  - value: |-
      Field failure
      To: Executive Committee
      From: Chief Risk Officer
    description: Populated document header with 2 fields (75 tier)
    synthetic: true
  - value: |-
      Field failure
      To: Executive Committee
      From: Chief Risk Officer
      Date: 14 August 2026
    description: Populated document header with 3 distinct fields (85 tier)
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: product failure
    description: Generic word pair from old broad template should not match
  - value: Field failure investigation reports
    description: "Bare detector name: it reached 85 through the generated name-word tier and must not reach an enforcing tier"
  - value: |-
      Field failure:
      To:
      From:
      Date:
      Subject:
    description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
  - value: "Policy guidance: this procedure explains how records about field failure are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Common words and phrases related to field failure investigation reports appearing in policy documents, training
    materials, HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_field_failure_investigation
    matches:
      - ref: Regex_global_top500_234_field_failure_investigation_reports_record_structure
        min_count: 3
        unique_results: true
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 75
    id_match: Regex_field_failure_investigation
    matches:
      - ref: Regex_global_top500_234_field_failure_investigation_reports_record_structure
        min_count: 2
        unique_results: true
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_field_failure_investigation
    matches:
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  regexes:
  - id: Regex_field_failure_investigation
    pattern: (?is)\b(?:field\s+failure|failure\s+investigation|failure\s+analysis|field\s+return|customer\s+complaint|defect\s+report|failure\s+mode|incident\s+report|product\s+recall|corrective\s+action)\b
  - id: Regex_global_top500_234_field_failure_investigation_reports_record_structure
    pattern: (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item|part\s+(?:no\.?|number)|serial\s+(?:no\.?|number)|lot\s+(?:no\.?|number)|batch\s+(?:no\.?|number)|RMA\s+(?:no\.?|number)|NCR\s+(?:no\.?|number))\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$]
risk_description: The detector identifies field-failure, failure-investigation, failure-analysis, or field-return material
  with product-quality context, pointing to investigation content rather than a personal identifier. A genuine report can
  reveal root cause, affected products, known weaknesses, remediation gaps, and customer incidents that competitors, litigants,
  or attackers could exploit. One investigation is normally limited to a product or event, but premature disclosure can still
  cause serious safety, legal, reputational, and operational consequences. Risk 8 and SENSITIVE are appropriate; PROTECTED
  would require a broadly exploitable critical-system weakness, major public-safety exposure, or evidence of significant organization-wide
  damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 corresponds to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the Personal-Privacy DLM, and Medium for
    consequential field-failure findings. PROTECTED is not met because the normal report is bounded to a product
    investigation and does not establish systemic critical-service or life-safety damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium classification and Medium Personal-Privacy DLM recognize serious product, customer, and legal exposure
      without assuming a catastrophic or system-wide failure.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-20'
changelog:
- version: 1.3.0
  date: '2026-10-20'
  description: 'Generated name-word tier removed: the 85 and 75 tiers ANDed Pattern_*_label_context (the detector name, "Field failure investigation reports") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 85. Both lists sit inside the IdMatch phrase, so the bare name alone scored 85. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs 2 populated document header fields (Regex_global_top500_234_field_failure_investigation_reports_record_structure); 85 needs 3 distinct fields. Curated terms that sit inside an IdMatch hit were removed. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
- version: 1.2.5
  date: '2026-09-25'
  description: >-
    Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
    reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
- version: 1.2.3
  date: '2026-09-24'
  description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1793 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical
    tier.
