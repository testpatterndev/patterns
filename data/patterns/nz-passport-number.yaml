schema: testpattern/v1
name: New Zealand Passport Number
slug: nz-passport-number
version: 1.0.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects New Zealand passport numbers issued by the Department of Internal Affairs (Te Tari Taiwhenua). Modern New Zealand e-passports use two uppercase letters (such as the L, E, F, D, O, or T series) followed by six digits (8 characters total).
operation: >-
  Matches a two-letter New Zealand passport series prefix ([DEFHKLMNOPRT][A-Z]) followed by 6 digits on word boundaries. Tiers: 85 with New Zealand passport context, 75 with general passport context, 65 discovery-only for the bare structural token, with template-exclusion gating on every tier.
pattern: (?-i)\b([DEFHKLMNOPRT][A-Z]\d{6})\b
confidence: medium
confidence_justification: >-
  Medium confidence: two uppercase letters plus six digits is concise and can overlap serial numbers or booking references without travel-document keywords within 300 characters.
jurisdictions:
  - nz
regulations:
  - Privacy Act 2020 (NZ)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - government-id
corroborative_evidence:
  keywords:
    - New Zealand passport
    - NZ passport
    - passport number
    - passport no
    - travel document
    - Department of Internal Affairs
    - Te Tari Taiwhenua
  proximity: 300
test_cases:
  should_match:
    - value: LA123456
      description: Modern L-series New Zealand e-passport number
    - value: 'NZ Passport No: EA654321'
      description: Labelled E-series New Zealand passport number
    - value: LM908172
      description: Two-letter L-series prefix with six digits
  should_not_match:
    - value: ZA123456
      description: Leading Z is not an issued New Zealand passport series prefix
    - value: LA12345
      description: Five digits (one short of required six digits)
    - value: Please bring your New Zealand passport to the check-in desk
      description: Prose reference with no passport number
false_positives:
  - description: Invoice numbers, asset tags, or flight/booking codes consisting of two uppercase letters and six digits.
    mitigation: Require passport or Department of Internal Affairs corroborative keywords within 300 characters at enforcing tiers.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 5
risk_description: >-
  The detector matches an eight-character New Zealand passport number (two uppercase series letters and six digits) with passport corroboration at enforcing tiers. A standalone passport number supports record linkage or travel/identity pretexts when paired with holder name and date of birth, but does not expose the biodata page or authenticate travel on its own. Risk 5 and OFFICIAL fit a single travel-document identifier; SENSITIVE requires linked identity dossiers or document scans.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because an isolated New Zealand passport number is a document reference without standalone authentication power. SENSITIVE is not met without biographical dossier details or passport imagery.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low handling reflects bounded correlation risk for a standalone passport number absent full traveller identity records.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_nz_passport
      matches:
        - ref: Keyword_nz_passport_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_nz_passport
      matches:
        - ref: Keyword_nz_passport_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_nz_passport
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_nz_passport
      pattern: (?-i)\b([DEFHKLMNOPRT][A-Z]\d{6})\b
  keywords:
    - id: Keyword_nz_passport_specific
      groups:
        - match_style: word
          terms:
            - New Zealand passport
            - NZ passport
            - Department of Internal Affairs
            - Te Tari Taiwhenua
            - Uruwhenua Aotearoa
      strength: specific
    - id: Keyword_nz_passport_broad
      groups:
        - match_style: word
          terms:
            - passport
            - passport number
            - passport no
            - travel document
            - passport holder
      strength: specific
references:
  - url: https://www.passports.govt.nz/
    title: New Zealand Passports (Te Tari Taiwhenua / Department of Internal Affairs)
  - url: https://learn.microsoft.com/en-us/purview/sit-defn-new-zealand-passport-number
    title: New Zealand Passport Number entity definition - Microsoft Learn
created: '2026-11-25'
updated: '2026-11-25'
changelog:
  - version: 1.0.0
    date: '2026-11-25'
    description: Initial release.
