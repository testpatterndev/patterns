schema: testpattern/v1
name: Student Work Placement, Practicum and Apprenticeship Record
slug: au-education-student-placement-agreement
version: 1.2.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Populated placement records for a named or numbered student: school work experience agreements and
  placement forms, structured workplace learning, school-based apprenticeships and traineeships (SBAT),
  VET vocational placements, university work-integrated learning (WIL), professional experience and
  teaching practicum placements, clinical and field placements, and placement confirmations,
  evaluations and assessment reports. They tie the student to a host employer or placement site and
  usually to a workplace supervisor, mentor or placement dates, and often carry medical, emergency
  contact, Blue Card or insurance details. Boundary: job applications and candidate packs that list
  work experience belong to global-candidate-application-pack; internship and placement adverts and
  subject outlines stay at discovery.
operation: >-
  Primary: student or work placement (agreement, form, record, assessment, report, details,
  confirmation, log, plan), work experience agreement / placement / form / record / log / arrangement /
  program, structured workplace learning, school-based apprenticeship or traineeship, SBAT, vocational
  placement, work-integrated learning, WIL placement or agreement, professional experience, clinical,
  practicum, teaching or field placement, practicum agreement / report / record / assessment /
  confirmation, professional experience report / record / agreement, placement agreement /
  confirmation / evaluation, host employer agreement, internship agreement. 65 (discovery only):
  primary alone, which surfaces adverts, subject outlines and blank agreements. 75: primary plus a
  populated student field (student, learner, pupil, trainee, apprentice, pre-service teacher or student
  teacher name / ID / number, USI, LUI, EQ ID) plus either a populated host field (host employer,
  organisation, business or site, placement provider / site / school / facility / agency, workplace,
  employer, clinical site, ward) or a populated supervision or date field (workplace supervisor, mentor
  teacher, supervising teacher, clinical facilitator, preceptor, placement coordinator; start, end or
  placement dates). 85: student field plus host field plus either a supervision or date field or
  placement evidence (WorkCover, public liability, Blue Card, working with children, placement hours,
  hours completed, emergency contact, medical conditions, risk assessment, induction, logbook).
  Enforce tiers exclude policy, procedure, subject or unit outline, handbook, advert and FAQ framing.
  The shared template dictionary is not applied, so a completed agreement that keeps a form-template
  footer still matches; blank forms fail the field-value guards.
pattern: >-
  (?i)\b((?:student|work)[ \t]+placements?(?:[ \t]+(?:agreement|form|record|assessment|report|details|confirmation|log|plan))?|work[ \t]+experience[ \t]+(?:agreement|placement|form|record|log|arrangement|program)|structured[ \t]+workplace[ \t]+learning|school[\s-]+based[ \t]+(?:apprenticeship|traineeship)|SBAT|vocational[ \t]+placement|work[\s-]+integrated[ \t]+learning|WIL[ \t]+(?:placement|agreement)|(?:professional[ \t]+experience|clinical|practicum|teaching|field)[ \t]+placement|practicum[ \t]+(?:agreement|report|record|assessment|confirmation)|professional[ \t]+experience[ \t]+(?:report|record|agreement)|placement[ \t]+(?:agreement|confirmation|evaluation)|host[ \t]+employer[ \t]+agreement|internship[ \t]+agreement)\b
confidence: medium
confidence_justification: >-
  Medium: placement, practicum and SBAT titles are standard across schools, TAFE, RTOs and
  universities, and enforce tiers need a populated student field with a host, supervisor or date value,
  which adverts, outlines and blank agreements lack. Field labels are matched by wording only, so an
  unusual provider form may stay at 65. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - au-qld
regulations:
  - Further Education and Training Act 2014 (Qld)
  - Education (General Provisions) Act 2006 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - education
  - pii
corroborative_evidence:
  keywords:
    - host employer
    - workplace supervisor
    - mentor teacher
    - placement dates
    - emergency contact
    - Blue Card
  proximity: 300
scope: narrow
risk_rating: 7
risk_description: >-
  A populated student work placement, practicum or apprenticeship record can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.
references:
  - title: Work experience placements for school students procedure (Queensland Department of Education)
    url: https://ppr.qed.qld.gov.au/pp/work-experience-placements-for-school-students-procedure
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
classification:
  tier: Medium
  rationale: >-
    Populated student work placement, practicum and apprenticeship record maps to SENSITIVE Personal-Privacy. The classifier requires record context and corroborating fields. The mapping does not determine the risk of every matched document.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling applies to the populated record. Synthetic checks establish local matching behavior, not tenant detection accuracy.
package_tags:
  primary_component: student-child-records
  components:
    - student-child-records
  component_tier: large
  deployment_priority:
    - expanded
  sectors:
    - education
  addons: []
  label_domains:
    - education
    - privacy
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_placement_primary
      matches:
        - ref: Regex_placement_student_field
        - ref: Regex_placement_host_field
        - type: any
          min_matches: 1
          refs:
            - Regex_placement_supervision_field
            - Keyword_placement_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_placement_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_placement_primary
      matches:
        - ref: Regex_placement_student_field
        - type: any
          min_matches: 1
          refs:
            - Regex_placement_host_field
            - Regex_placement_supervision_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_placement_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_placement_primary
  regexes:
    - id: Regex_placement_primary
      pattern: >-
        (?i)\b((?:student|work)[ \t]+placements?(?:[ \t]+(?:agreement|form|record|assessment|report|details|confirmation|log|plan))?|work[ \t]+experience[ \t]+(?:agreement|placement|form|record|log|arrangement|program)|structured[ \t]+workplace[ \t]+learning|school[\s-]+based[ \t]+(?:apprenticeship|traineeship)|SBAT|vocational[ \t]+placement|work[\s-]+integrated[ \t]+learning|WIL[ \t]+(?:placement|agreement)|(?:professional[ \t]+experience|clinical|practicum|teaching|field)[ \t]+placement|practicum[ \t]+(?:agreement|report|record|assessment|confirmation)|professional[ \t]+experience[ \t]+(?:report|record|agreement)|placement[ \t]+(?:agreement|confirmation|evaluation)|host[ \t]+employer[ \t]+agreement|internship[ \t]+agreement)\b
    - id: Regex_placement_student_field
      pattern: >-
        (?i)\b((?:(?:student|learner|pupil|trainee|apprentice|pre-service[ \t]+teacher|student[ \t]+teacher)(?:[ \t]+(?:full[ \t]+)?(?:name|ID|no\.?|number))?|USI|LUI|EQ[ \t]*ID)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:student|learner|name|id|n/?a|unknown|tbc|tba|withheld|not[ \t]+recorded|enter|insert|write|print|your|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{1,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3})
    - id: Regex_placement_host_field
      pattern: >-
        (?i)\b((?:host[ \t]+(?:employer|organisation|organization|business|site|school|facility)|placement[ \t]+(?:provider|site|location|venue|agency|school|facility|organisation|organization|employer)|workplace|employer|clinical[ \t]+(?:site|facility|venue)|ward)(?:[ \t]+name)?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|unknown|tbc|tba|to[ \t]+be|allocated|pending|enter|insert|write|your|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9&'.-]{1,40}(?:[ \t]+[A-Za-z0-9&'.-]{1,30}){0,6})
    - id: Regex_placement_supervision_field
      pattern: >-
        (?i)\b((?:(?:workplace|host|site|clinical|placement)[ \t]+)?(?:supervisor|mentor(?:[ \t]+teacher)?|supervising[ \t]+teacher|clinical[ \t]+facilitator|placement[ \t]+coordinator|preceptor)(?:[ \t]+name)?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|to[ \t]+be|enter|insert|write|your|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'.-]{1,30}(?:[ \t]+[A-Z][A-Za-z'.-]{0,30}){0,3}|(?:start|finish|end|commencement|placement)[ \t]+dates?[ \t]*[:#][ \t]{0,3}(?:\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/(?:\d{4}|\d{2}))|placement[ \t]+period[ \t]*[:#][ \t]{0,3}(?:\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/(?:\d{4}|\d{2})))
    - id: Regex_placement_guidance_exclusion
      pattern: >-
        (?i)\b(this[ \t]+(?:policy|procedure|guideline|guide|fact[ \t]?sheet|subject|unit|course|page|handbook)|(?:subject|unit|course)[ \t]+outline|information[ \t]+for[ \t]+(?:students|parents|employers|hosts|host[ \t]+employers)|applications[ \t]+(?:open|close)|apply[ \t]+online|frequently[ \t]+asked[ \t]+questions|media[ \t]+release|training[ \t]+module|blank[ \t]+form)\b
  keywords:
    - id: Keyword_placement_evidence
      groups:
        - match_style: word
          terms:
            - WorkCover
            - public liability
            - Blue Card
            - working with children
            - placement hours
            - hours completed
            - emergency contact
            - medical conditions
            - risk assessment
            - induction
            - logbook
      strength: specific
test_cases:
  should_match:
    - value: "Student placement agreement\nStudent name: Avery Teston\nHost employer: River Workshop\nSupervisor: Jordan Staffson\nStart date: 2026-10-01"
      description: 85 tier - agreement with student, host employer, supervisor and start date
      synthetic: true
    - value: "School-based apprenticeship\nLearner ID: RD728491\nPlacement provider: River District Training\nPlacement coordinator: Morgan Staffson\nPlacement date: 2026-10-02"
      description: 85 tier - SBAT with learner ID, placement provider, coordinator and date
      synthetic: true
    - value: "Student placement agreement\nStudent name: Avery Teston\nHost employer: River Workshop\nSupervisor: Jordan Staffson\nStart date: 2026-10-01\nForm template version 2.1. Retain the completed record."
      description: 85 tier - completed agreement that keeps a form-template footer
      synthetic: true
    - value: "School-based apprenticeship\nLearner ID: RD728491\nPlacement provider: River District Training\nPlacement coordinator: Morgan Staffson\nPlacement date: 02/10/2026"
      description: 85 tier - slash-formatted date variant
      synthetic: true
    - value: "Professional experience placement confirmation\nPre-service teacher: Avery Teston\nStudent ID: s4471902\nPlacement school: Rivergum State High School\nMentor teacher: Jordan Staffson\nPlacement dates: 13/10/2026 - 07/11/2026"
      description: 85 tier - teaching practicum confirmation with student, school, mentor and dates
      synthetic: true
    - value: "Clinical placement record\nStudent name: Riley Teston\nClinical site: Ipswich Hospital\nWard: 4B Surgical\nBlue Card: verified\nPlacement hours: 160"
      description: 85 tier - clinical placement with student, site and Blue Card and hours evidence
      synthetic: true
    - value: "Work experience placement form\nStudent: Casey Teston\nYear level: 10\nHost business: Teston Motors\nMedical conditions: asthma, carries a reliever\nEmergency contact: Morgan Teston"
      description: 85 tier - school work experience form with host business and medical evidence
      synthetic: true
    - value: "SBAT training plan\nApprentice name: Sam Teston\nEmployer: Rivergum Electrical Pty Ltd"
      description: 75 tier - SBAT with apprentice and employer only
      synthetic: true
  should_not_match:
    - value: "Work experience agreement information. Students need a host employer and supervisor before a placement start date can be agreed."
      description: Information text with no populated fields (65 at most)
      synthetic: true
    - value: "Student placement agreement\nStudent name: __________\nHost employer: __________\nSupervisor: __________\nStart date: __________"
      description: Blank placement agreement (65 at most)
      synthetic: true
    - value: "Student placement agreement\nEmployee name: Jordan Staffson\nHost employer: River Workshop\nSupervisor: Jordan Staffson\nStart date: 2026-10-01"
      description: Agreement naming an employee, not a student (65 at most)
      synthetic: true
    - value: "Graduate internship program 2027 - applications open. Work placement opportunities for students in engineering and IT. Apply online by 30 October."
      description: Internship and placement advert (65 at most)
      synthetic: true
    - value: "This subject includes a work-integrated learning placement of 80 hours. Students must hold a current Blue Card. Student ID: quote it on the placement request. Placement provider: allocated by the WIL office."
      description: WIL subject outline (65 at most)
      synthetic: true
    - value: "Job application\nApplicant name: Avery Teston\nWork experience: 3 years retail, Coles Springfield\nReferees: available on request"
      description: Job application listing work experience, global-candidate-application-pack territory
      synthetic: true
false_positives:
  - description: Placement and internship adverts, subject and unit outlines, WIL handbooks and parent or employer information sheets.
    mitigation: They lack a populated student field with a host, supervisor or date value, and outline, handbook, advert and information framing is excluded from enforce tiers.
  - description: Job applications and resumes listing work experience.
    mitigation: The primary needs a placement-specific phrase; a bare "work experience" heading does not trigger it.
  - description: Blank placement agreements.
    mitigation: Field values reject underscores, brackets and placeholder words such as allocated, to be, enter and your.
exports:
  - yaml
  - purview
created: '2026-09-13'
updated: '2026-10-30'
author: PVX
license: MIT
changelog:
  - version: 1.2.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.1.0
    date: '2026-10-22'
    description: >-
      Broaden from a single 85 tier that needed four labelled fields within 1000 characters to the 65 / 75 /
      85 ladder at 300 characters, and from school work experience and SBAT to VET placements, university
      WIL, professional experience, teaching practicum and clinical and field placements (renamed). 75
      needs a populated student field (now also trainee, apprentice, pre-service teacher, USI, LUI, EQ ID)
      and a host field or a supervision or date field; 85 needs the host field plus supervision, dates or
      placement evidence (WorkCover, Blue Card, placement hours, emergency contact, medical conditions).
      Discovery tier added. Recommended confidence 85 -> 75. Practicum, clinical, work experience form and
      SBAT positives and advert, subject outline and job application decoys added. Risk and labels unchanged.
  - version: 1.0.3
    date: '2026-09-25'
    description: Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.0.2
    date: '2026-09-24'
    description: 'Metadata: add references / regulations'
