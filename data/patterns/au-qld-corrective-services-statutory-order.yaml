schema: testpattern/v1
name: Queensland Corrective Services Statutory Order or Prisoner Decision
slug: au-qld-corrective-services-statutory-order
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Queensland Corrective Services statutory orders and decisions about a named prisoner: safety orders (including temporary and consecutive), maximum security orders, separate confinement orders, breach of discipline, transfer orders, leave of absence, discharge orders and security classification decisions under the Corrective Services Act 2006.
operation: >-
  Primary: Queensland Corrective Services Statutory Order or Prisoner Decision anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:(?:temporary\s+|consecutive\s+)?safety\s+order|maximum\s+security\s+order|separate\s+confinement\s+order|breach\s+of\s+discipline|order\s+for\s+transfer\s+of\s+(?:a\s+)?prisoner|security\s+classification\s+(?:decision|review)|notice\s+of\s+decision\s+about\s+(?:a\s+)?prisoner'?s\s+security\s+classification)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Corrective Services Act 2006 (Qld)
  - Corrective Services Regulation 2017 (Qld)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - pii
corroborative_evidence:
  keywords:
    - Corrective Services Act 2006
    - correctional centre
    - IOMS
    - prisoner
    - chief executive
    - General Manager
    - Safety Unit
    - At Risk
  proximity: 300
identifier_dependencies:
  - type: offender
    name: Offender / prisoner number (QCS IOMS)
    note: >-
      IOMS number format (not published)
    affects: precision at 75/85 (public fallback is the generic labelled-field regex)
test_cases:
  should_match:
    - value: "Safety order (Form 5)\nPrisoner: Riley Teston\nIOMS number: 4471820\nCorrectional centre: Wolston Correctional Centre\nThe prisoner is to be accommodated in the Safety Unit from 12/09/2026 for 7 days because of a risk of harm to other prisoners."
      description: Populated record 1
      synthetic: true
    - value: "Notice of decision about prisoner's security classification following review\nPrisoner: Morgan Teston\nDate of birth: 14/03/1988\nClassification: high security (previously low). Reasons: assault on staff 02/09/2026."
      description: Populated record 2
      synthetic: true
    - value: "Breach of discipline\nPrisoner: Jamie Teston\nCorrectional centre: Arthur Gorrie\nPossession of a prohibited item (mobile phone) found during cell search; penalty: loss of privileges 14 days."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: The Corrective Services Act 2006 allows the chief executive to make a safety order or maximum security order to manage risk. Prisoners are told the reasons for decisions about their security classification.
      description: Guidance or explainer text
    - value: "Safety order (Form 5)\nPrisoner: __________\nIOMS number: __________\nCorrectional centre: __________"
      description: Blank form
    - value: Queensland prisons recorded 1,120 safety orders in 2025, the Inspector of Detention Services reported.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_corrective_services_statutory_order_primary
      matches:
        - ref: Regex_au_qld_corrective_services_statutory_order_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_corrective_services_statutory_order_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_corrective_services_statutory_order_primary
      matches:
        - ref: Regex_au_qld_corrective_services_statutory_order_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_corrective_services_statutory_order_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_corrective_services_statutory_order_primary
      pattern: >-
        (?i)\b(?:(?:temporary\s+|consecutive\s+)?safety\s+order|maximum\s+security\s+order|separate\s+confinement\s+order|breach\s+of\s+discipline|order\s+for\s+transfer\s+of\s+(?:a\s+)?prisoner|security\s+classification\s+(?:decision|review)|notice\s+of\s+decision\s+about\s+(?:a\s+)?prisoner'?s\s+security\s+classification)\b
    - id: Regex_au_qld_corrective_services_statutory_order_record_structure
      pattern: >-
        (?i)\b(?:prisoner|offender|parolee|IOMS(?:\s+(?:no\.?|number))?|correctional\s+centre|security\s+classification|parole\s+eligibility\s+date|release\s+date|eligible\s+person|registered\s+victim|nominee|young\s+person|child|detainee|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_corrective_services_statutory_order_corroborative
      groups:
        - match_style: word
          terms:
            - Corrective Services Act 2006
            - correctional centre
            - text: IOMS
              case_sensitive: true
            - prisoner
            - chief executive
            - General Manager
            - Safety Unit
            - At Risk
            - Elevated Baseline Risk
            - maximum security
            - high security
            - low security
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a queensland corrective services statutory order or prisoner decision about an identified person, gated on populated record fields. Queensland Corrective Services statutory orders and decisions about a named prisoner: safety orders (including temporary and consecutive), maximum security orders, separate confinement orders, breach of discipline, transfer orders, leave of absence, discharge orders and security classification decisions under the Corrective Services Act 2006. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Law-Enforcement.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Law-Enforcement
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Queensland Corrective Services forms
    url: https://www.publications.qld.gov.au/dataset/queensland-corrective-services-forms
  - title: Corrective Services Act 2006
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2006-029
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
