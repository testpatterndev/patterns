schema: testpattern/v1
name: QLD Health Clinical Credentialing and Scope of Practice Record
slug: au-qld-health-credentialing-scope-of-practice
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Populated credentialing and scope of clinical practice records for named practitioners, as produced
  under the Queensland Health directive on credentialing and defining the scope of clinical practice:
  credentialing committee decisions and minutes, credentialing applications and recredentialing files,
  scope of clinical practice approvals, clinical privileges, conditions and supervision requirements,
  and referee reports. They name the practitioner with their registration details and record the
  scope granted, declined or restricted, conditions or undertakings on their Ahpra registration, and
  referees' frank assessments. Boundary: practitioner directories and lists of labelled provider
  identifiers belong to global-top500-337-provider-identifier-records; a bare Ahpra registration
  number to global-ahpra-registration; public sector discipline outcomes to
  au-qld-public-sector-discipline-record.
operation: >-
  Primary: (re)credentialing committee / decision / application / outcome / file / record / review /
  panel (including "credentialing and scope of clinical practice committee"), scope of clinical
  practice, scope of practice decision / approval / review / application / outcome, clinical
  privileges. 65 (discovery only): primary alone, which surfaces the directive, committee terms of
  reference and by-laws. 75: primary plus a populated practitioner field (practitioner, applicant,
  medical officer, doctor or nurse name, Ahpra / registration number, profession, specialty, position,
  facility) plus a populated decision field (decision, outcome, recommendation, scope granted /
  approved / requested / declined, privileges granted, conditions, restrictions, supervision
  requirements, review date, period of appointment, effective date). 85: the 75 evidence plus
  independent regulatory or assessment context (referee report, conditions on registration,
  undertakings, notification to Ahpra, Medical Board, Nursing and Midwifery Board, Office of the Health
  Ombudsman, peer review, performance concerns, supervised practice, Health Practitioner Regulation
  National Law). Enforce tiers exclude template wording and directive, terms-of-reference, by-law,
  guideline, training and media framing.
pattern: >-
  (?i)\b(?:(?:re-?)?credentialing\s+(?:and\s+(?:defining\s+the\s+)?scope\s+of\s+(?:clinical\s+)?practice\s+)?(?:committee|decision|application|outcome|file|record|review|panel)|scope\s+of\s+clinical\s+practice|scope\s+of\s+practice\s+(?:decision|approval|review|application|outcome)|clinical\s+privileges)\b
confidence: medium
confidence_justification: >-
  Medium: credentialing and scope of clinical practice wording is specific to health workforce
  governance, and enforce tiers need a populated practitioner field and a populated decision field,
  which the directive, committee terms of reference and by-laws lack. Committee minutes that list
  several practitioners in a table without labels may be missed at 75.
jurisdictions:
  - au
  - au-qld
regulations:
  - Hospital and Health Boards Act 2011 (Qld)
  - Health Practitioner Regulation National Law Act 2009 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
  - QGISCF
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - referee report
    - conditions on registration
    - supervised practice
    - scope granted
    - Ahpra
    - peer review
  proximity: 300
test_cases:
  should_match:
    - value: "Credentialing committee decision - Teston Base Hospital\nPractitioner: Dr Jordan Teston\nAhpra registration number: MED0000000000\nSpecialty: General surgery\nDecision: Scope granted for elective general surgery, excluding upper GI and bariatric procedures\nSupervision requirements: proctored laparoscopic cases until review\nReferee report from the previous employer raised concerns about after-hours availability; conditions on registration noted."
      description: 85 tier - credentialing decision with practitioner, registration number, decision, supervision and referee / registration-condition context
      synthetic: true
    - value: "Scope of clinical practice approval\nApplicant: Riley Teston, Nurse Practitioner\nFacility: Teston Rural Hospital\nPrivileges granted: Prescribing within emergency formulary; plain film requesting\nReview date: 01/11/2027\nPeer review of first 20 cases required; undertakings to Ahpra apply."
      description: 85 tier - scope approval with applicant, facility, privileges, review date and peer review / Ahpra undertakings context
      synthetic: true
    - value: "Recredentialing outcome\nMedical officer: Dr Morgan Teston\nOutcome: Scope renewed for three years"
      description: 75 tier - recredentialing outcome naming the medical officer and outcome only
      synthetic: true
  should_not_match:
    - value: "Credentialing and defining the scope of clinical practice: this health service directive sets out how Hospital and Health Services establish a credentialing committee, assess applications, and review scope of clinical practice at least every three years."
      description: Queensland Health directive text (65 at most)
    - value: "Credentialing committee terms of reference\nMembership: Executive Director Medical Services (chair), two senior medical officers, a consumer representative\nQuorum: four members\nMeeting frequency: monthly"
      description: Committee terms of reference with populated governance fields but no practitioner (65 at most)
    - value: "Credentialing application\nPractitioner: ____________________\nAhpra registration number: ____________________\nScope requested: ____________________\nReferee 1: ____________________"
      description: Blank credentialing application form (65 at most)
    - value: "The vendor's API credentials were rotated and the scope of the OAuth token was reduced to read-only."
      description: Unrelated IT credentials and token scope (no match)
false_positives:
  - description: The Queensland Health credentialing directive, HHS by-laws, committee terms of reference and training material.
    mitigation: No populated practitioner field, and directive, terms-of-reference, by-law, guideline and training framing is excluded from enforce tiers.
  - description: Blank credentialing applications and referee templates.
    mitigation: Field values reject blanks, underscores and placeholders; fixture wording is excluded by the shared template-exclusion dictionary.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_credentialing_primary
      matches:
        - ref: Regex_credentialing_practitioner_field
        - ref: Regex_credentialing_decision_field
        - ref: Keyword_credentialing_regulatory_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_credentialing_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_credentialing_primary
      matches:
        - ref: Regex_credentialing_practitioner_field
        - ref: Regex_credentialing_decision_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_credentialing_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_credentialing_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_credentialing_primary
      pattern: >-
        (?i)\b(?:(?:re-?)?credentialing\s+(?:and\s+(?:defining\s+the\s+)?scope\s+of\s+(?:clinical\s+)?practice\s+)?(?:committee|decision|application|outcome|file|record|review|panel)|scope\s+of\s+clinical\s+practice|scope\s+of\s+practice\s+(?:decision|approval|review|application|outcome)|clinical\s+privileges)\b
    - id: Regex_credentialing_practitioner_field
      pattern: >-
        (?i)\b(?:(?:practitioner|applicant|medical\s+officer|doctor|nurse|clinician|midwife|dentist)(?:['’]s)?(?:\s+(?:full\s+)?name)?|(?:Ahpra|AHPRA|practitioner)\s+(?:registration\s+)?(?:no\.?|number|ID)|registration\s+(?:no\.?|number)|profession|specialty|speciality|position|facility)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?:Dr\.?\s+)?(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_credentialing_decision_field
      pattern: >-
        (?i)\b(?:decision|outcome|recommendation|scope\s+(?:granted|approved|requested|declined|renewed)|privileges\s+(?:granted|approved|requested|declined)|conditions|restrictions|supervision(?:\s+requirements)?|review\s+date|period\s+of\s+appointment|effective\s+date)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.,;-]{0,30}(?:[ \t]+[A-Za-z0-9][A-Za-z0-9/'.,;-]{0,30}){0,5}
    - id: Regex_credentialing_guidance_exclusion
      pattern: >-
        (?i)\b(?:this\s+(?:health\s+service\s+directive|directive|policy|procedure|guideline|guide|page|fact\s?sheet|article|course)|terms\s+of\s+reference|by-?laws?|training\s+module|e-learning|frequently\s+asked\s+questions|media\s+release)\b
  keywords:
    - id: Keyword_credentialing_regulatory_context
      groups:
        - match_style: word
          terms:
            - referee report
            - referee
            - conditions on registration
            - undertakings
            - notification to Ahpra
            - Ahpra
            - Medical Board
            - Nursing and Midwifery Board
            - Office of the Health Ombudsman
            - peer review
            - performance concerns
            - supervised practice
            - Health Practitioner Regulation National Law
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier recognises credentialing and scope of clinical practice records and enforces only when
  a populated practitioner field sits with a populated decision field, with 85 also needing regulatory or
  assessment context such as referee reports, registration conditions or peer review. A genuine record is
  a personnel assessment of a named clinician: scope granted or refused, supervision, conditions or
  undertakings on registration (which can stem from health impairment or conduct matters), and referees'
  frank opinions. Disclosure can damage the practitioner's reputation and employment, breach referee
  confidence, and expose health or conduct matters behind registration conditions. The ordinary unit is
  one practitioner, so risk 7 and SENSITIVE fit, in line with au-qld-public-sector-selection-report;
  discipline outcomes are handled at risk 8 by au-qld-public-sector-discipline-record.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because a populated
    credentialing record is a confidential assessment of a named clinician, with scope decisions, registration
    conditions and referee opinions. PROTECTED is not met: one practitioner's file does not expose a child, a
    whistleblower or a critical system, and harm is reputational and employment-related.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling protects one practitioner's credentialing assessment and referee reports. High
      is not met for a single file.
references:
  - title: Queensland Health - Credentialing and defining the scope of clinical practice (health service directive)
    url: https://www.health.qld.gov.au/system-governance/policies-standards/health-service-directives/credentialing-and-defining-the-scope-of-clinical-practice
  - title: Health Practitioner Regulation National Law Act 2009 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-045
  - title: Ahpra - Register of practitioners (registration conditions and undertakings)
    url: https://www.ahpra.gov.au/Registration/Registers-of-Practitioners.aspx
  - title: Hospital and Health Boards Act 2011 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2011-032
created: '2026-10-20'
updated: '2026-10-20'
changelog:
  - version: 1.0.0
    date: '2026-10-20'
    description: >-
      Initial release from the qghealth sector review: credentialing committee decisions, applications,
      recredentialing files, scope of clinical practice approvals, clinical privileges and referee reports.
      65 phrase only; 75 needs a populated practitioner field and a populated decision field; 85 adds
      regulatory or assessment context. Directive, terms-of-reference, by-law and training framing excluded.
