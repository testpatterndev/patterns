schema: testpattern/v1
name: Aged Care Serious Incident Response Scheme (SIRS) Notification
slug: au-aged-care-serious-incident-notification
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Reportable incident notifications and records under the aged care Serious Incident Response Scheme (SIRS), as continued by the Aged Care Act 2024 (Cth) and the Aged Care Rules 2025 from 1 November 2025, for a named older person receiving funded aged care services (residential care homes and services in home or community settings, including Support at Home). Covers the eight reportable incident types (unreasonable use of force, unlawful sexual contact or inappropriate sexual conduct, psychological or emotional abuse, unexpected death, stealing or financial coercion by a staff member, neglect, inappropriate use of a restrictive practice, unexplained absence from care) and the Priority 1 (report within 24 hours) / Priority 2 (report within 30 calendar days) classification. A populated record names the provider, the older person, the aged care worker or subject of allegation, the incident date, type and priority, and the response (police notified, medical treatment, supporters informed). ACQSC guidance, quick guides, SIRS statistics and blank forms are decoys. Structure modelled on au-ndis-reportable-incident, which covers the NDIS scheme; NDIS signals are excluded from this classifier's enforce tiers, but an aged care SIRS record can also reach 75 in the NDIS classifier because both share generic labels (provider, worker, date of incident).
operation: >-
  Primary: "Serious Incident Response Scheme", "SIRS notification/report/incident/priority/portal/reference", "Priority 1/2 reportable incident", "reportable incident notification/report", or one of the aged care incident-type phrases (unreasonable use of force, unexplained absence (from care), stealing or financial coercion, inappropriate use of (a) restrictive practice(s), unlawful sexual contact or inappropriate sexual conduct, psychological or emotional abuse). Bare "SIRS" is not a primary because it collides with systemic inflammatory response syndrome, and bare "Priority 1 incident" is not a primary because it is common IT service-management wording. 65 is discovery-only (primary alone) and surfaces ACQSC guidance and statistics. 75 requires one populated record field within 300 characters: older person / individual / resident / care recipient / client name, date of birth, My Aged Care ID (label with loose value), provider / residential care home / service, aged care worker / staff member / subject of allegation, a dated incident/awareness/report field, a selected Priority 1/2, or a selected incident type. Blank lines, bracket placeholders and n/a/tbc are rejected. 85 requires two distinct populated fields plus an independent corroborative term (Aged Care Quality and Safety Commission, police, 24 hours, 30 days, medical treatment, behaviour support plan, supporter and similar). Every tier excludes template/fixture text; enforce tiers also exclude guidance, NDIS and sepsis (systemic inflammatory response syndrome) signals.
pattern: (?i)\b(?:Serious\s+Incident\s+Response\s+Scheme|SIRS\s+(?:notification|report|incident|priority|portal|reference|submission|P[12])|Priority\s+[12]\s+reportable\s+incident|reportable\s+incident\s+(?:notification|report)|unreasonable\s+use\s+of\s+force|unexplained\s+absence(?:\s+from\s+care)?|stealing\s+or\s+financial\s+coercion|inappropriate\s+use\s+of\s+(?:a\s+)?restrictive\s+practices?|unlawful\s+sexual\s+contact\s+or\s+inappropriate\s+sexual\s+conduct|psychological\s+or\s+emotional\s+abuse)\b
confidence: medium
confidence_justification: >-
  Medium: the SIRS scheme name and the aged care incident-type wording are distinctive, but ACQSC guidance, provider policies, training and SIRS insight reports repeat them. Enforce tiers require populated older-person / provider / incident fields. No public SIRS notification number format is used. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Aged Care Act 2024 (Cth)
  - Aged Care Rules 2025 (Cth)
frameworks:
  - QGISCF
data_categories:
  - health
  - pii
  - law-enforcement
corroborative_evidence:
  keywords:
    - Aged Care Quality and Safety Commission
    - police
    - within 24 hours
    - 30 days
    - medical treatment
    - behaviour support plan
    - supporter
    - older person
    - aged care worker
    - residential care home
  proximity: 300
test_cases:
  should_match:
    - value: "SIRS notification - Priority 1\nProvider: Wattle Grove Residential Care Home\nOlder person: Edna Fictiona\nDate of birth: 02/05/1936\nIncident type: unreasonable use of force\nDate of incident: 15/09/2026\nAged care worker: Tomas Sampleby\nThe older person has bruising to both forearms and was reviewed by the GP; police notified within 24 hours."
      description: 85 tier - Priority 1 notification with provider, older person, DOB, type, date and worker plus police / 24 hours
      synthetic: true
    - value: "Priority 2 reportable incident\nResident: Walter Mockridge\nA staff member spoke to the resident in a demeaning way during a shower on the evening shift."
      description: 75 tier - Priority 2 incident note with one populated resident field
      synthetic: true
    - value: "Serious Incident Response Scheme - reportable incident report\nService: Support at Home - Coral Coast Council Community Care\nIndividual: Mavis Testarossa\nPriority: 2\nThe client reported that a support worker took $200 from her purse. Reported to the Aged Care Quality and Safety Commission within 30 days."
      description: 85 tier - Support at Home report with service, individual and priority plus Commission / 30 days
      synthetic: true
    - value: "Unexplained absence from care\nCare recipient: Harold Fakeley\nDate and time identified: 09/09/2026 21:40\nThe resident was located at a nearby bus stop after 50 minutes; police were called."
      description: 85 tier - unexplained absence with care recipient and dated identification plus police
      synthetic: true
  should_not_match:
    - value: "You must report Priority 1 incidents to the Commission within 24 hours of becoming aware of the incident, and Priority 2 incidents within 30 calendar days. The Serious Incident Response Scheme applies to registered providers of residential care homes and services in home or community settings. See agedcarequality.gov.au."
      description: ACQSC quick guide
    - value: "SIRS notification form\nProvider: __________\nOlder person: __________\nIncident type: [select]\nDate of incident: __________\nPriority: ____"
      description: Blank SIRS form
    - value: "The Commission received 58,000 notifications under the Serious Incident Response Scheme in 2024-25; unreasonable use of force remained the most reported incident type, the SIRS insights report shows."
      description: Published SIRS statistics
    - value: "ICU progress note\nPatient: Ronald Testhouse\nDate of birth: 04/04/1950\nMeets SIRS criteria (temperature 38.9, HR 118); systemic inflammatory response syndrome - start sepsis pathway."
      description: Clinical note using SIRS in the sepsis sense
    - value: "Reportable incident notification\nParticipant: Jamie Teston\nNDIS number: 431982045\nIncident type: unlawful physical contact\nReported to the NDIS Commission within 24 hours."
      description: NDIS reportable incident (covered by au-ndis-reportable-incident)
    - value: "Priority 1 incident INC0048812\nService: Exchange Online\nClient: Finance division\nIncident date: 15/09/2026\nMail flow restored after 42 minutes; problem record raised."
      description: IT service-management Priority 1 incident ticket
    - value: "Training exercise: staff review a case study on inappropriate use of a restrictive practice and discuss when it becomes a Priority 1 incident."
      description: Training material
false_positives:
  - description: ACQSC guidance, quick guides, provider incident management policies and training use the same incident types and priorities.
    mitigation: Enforce tiers require populated fields and exclude agedcarequality.gov.au, "you must report", "providers must", guidance and policy signals.
  - description: Clinical notes use SIRS for systemic inflammatory response syndrome.
    mitigation: Bare "SIRS" is not a primary, and sepsis / systemic inflammatory response signals are excluded from enforce tiers.
  - description: NDIS reportable incident records share "reportable incident notification" and similar labels.
    mitigation: NDIS Commission / NDIS participant / NDIS number signals are excluded here; those records belong to au-ndis-reportable-incident.
  - description: SIRS insights reports and news statistics.
    mitigation: No populated person or provider fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_aged_care_serious_incident_notification_primary
      matches:
        - ref: Regex_au_aged_care_serious_incident_notification_party_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_aged_care_serious_incident_notification_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_aged_care_serious_incident_notification_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_aged_care_serious_incident_notification_primary
      matches:
        - ref: Regex_au_aged_care_serious_incident_notification_party_field
        - ref: Regex_au_aged_care_serious_incident_notification_record_field
        - ref: Keyword_au_aged_care_serious_incident_notification_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_aged_care_serious_incident_notification_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_aged_care_serious_incident_notification_primary
      matches:
        - ref: Regex_au_aged_care_serious_incident_notification_record_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_aged_care_serious_incident_notification_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_aged_care_serious_incident_notification_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_aged_care_serious_incident_notification_primary
      matches:
        - type: any
          refs:
            - Regex_au_aged_care_serious_incident_notification_party_field
            - Regex_au_aged_care_serious_incident_notification_record_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_aged_care_serious_incident_notification_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_aged_care_serious_incident_notification_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_aged_care_serious_incident_notification_primary
      pattern: >-
        (?i)\b(?:Serious\s+Incident\s+Response\s+Scheme|SIRS\s+(?:notification|report|incident|priority|portal|reference|submission|P[12])|Priority\s+[12]\s+reportable\s+incident|reportable\s+incident\s+(?:notification|report)|unreasonable\s+use\s+of\s+force|unexplained\s+absence(?:\s+from\s+care)?|stealing\s+or\s+financial\s+coercion|inappropriate\s+use\s+of\s+(?:a\s+)?restrictive\s+practices?|unlawful\s+sexual\s+contact\s+or\s+inappropriate\s+sexual\s+conduct|psychological\s+or\s+emotional\s+abuse)\b
    - id: Regex_au_aged_care_serious_incident_notification_party_field
      pattern: >-
        (?i)(?:\b(?:older\s+person|individual|resident|care\s+recipient|client|consumer|name\s+of\s+(?:the\s+)?(?:older\s+person|individual|resident)|(?:registered\s+)?provider|provider\s+name|residential\s+care\s+home|facility|service|service\s+name|aged\s+care\s+worker|staff\s+member|worker|subject\s+of\s+(?:the\s+)?allegation|alleged\s+perpetrator|supporter|date\s+of\s+birth|DOB|My\s+Aged\s+Care\s+(?:ID|number))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.,-]{0,30}(?:[ \t]+[A-Za-z0-9(-][A-Za-z0-9/'.,()-]{0,30}){0,7})
    - id: Regex_au_aged_care_serious_incident_notification_record_field
      pattern: >-
        (?i)(?:\b(?:date\s+(?:and\s+time\s+)?of\s+(?:the\s+)?incident|incident\s+date|date\s+(?:and\s+time\s+)?(?:identified|(?:the\s+)?provider\s+became\s+aware|became\s+aware|reported|notified))\s*[:#-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+[a-z]{3,9}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2})|\b(?:priority|incident\s+priority|priority\s+rating)\s*[:#]\s*(?:Priority\s+|P)?[12]\b|\b(?:incident\s+type|type\s+of\s+(?:reportable\s+)?incident|reportable\s+incident\s+type)\s*[:#]\s*(?:unreasonable\s+use\s+of\s+force|unlawful\s+sexual\s+contact|inappropriate\s+sexual\s+conduct|psychological\s+or\s+emotional\s+abuse|unexpected\s+death|stealing\s+or\s+financial\s+coercion|neglect|inappropriate\s+use\s+of\s+(?:a\s+)?restrictive\s+practice|unexplained\s+absence))
    - id: Regex_au_aged_care_serious_incident_notification_guidance_exclusion
      pattern: >-
        (?i)(?:\bagedcarequality\.gov\.au|\blegislation\.gov\.au|\byou\s+must\s+(?:report|notify)\b|\b(?:registered\s+)?providers\s+must\b|\bquick\s+guide\b|\bthis\s+(?:guide|guideline|fact\s?sheet|guidance|policy|procedure|webinar|course|module)\b|\bgeneral\s+guidance\s+only\b|\bSIRS\s+insights\b|\bNDIS\s+(?:Commission|Quality\s+and\s+Safeguards|participant|(?:no\.?|number))|\bsystemic\s+inflammatory\s+response|\bsepsis\b|\bSIRS\s+criteria\b)
  keywords:
    - id: Keyword_au_aged_care_serious_incident_notification_corroborative
      groups:
        - match_style: word
          terms:
            - Aged Care Quality and Safety Commission
            - police
            - within 24 hours
            - 30 days
            - medical treatment
            - psychological treatment
            - behaviour support plan
            - supporter
            - supporters
            - older person
            - aged care worker
            - residential care home
            - Support at Home
            - text: GP
              case_sensitive: true
            - bruising
            - injury
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies an aged care SIRS reportable incident notification or record about a named older person, gated on populated fields. These records describe alleged abuse, neglect, sexual assault, financial coercion, restrictive practices or unexpected death of a frail older person, with health details and the names of workers under allegation. Disclosure harms the older person's dignity and safety, can prejudice police or Commission investigations and can defame workers. Guidance, statistics, clinical SIRS (sepsis) notes and blank forms are excluded from enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy.
