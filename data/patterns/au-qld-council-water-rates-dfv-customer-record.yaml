schema: testpattern/v1
name: Council Rates or Water Account Domestic and Family Violence Affected Customer Record
slug: au-qld-council-water-rates-dfv-customer-record
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Rates and water account records held by Queensland councils and water service providers that flag a ratepayer or water customer as affected by domestic and family violence and record the protective steps taken: a safe or preferred contact method, a suppressed or confidential postal or residential address, instructions not to disclose account details to a co-owner, joint account holder or former partner, account separation, redirected rate notices, and payment arrangements, interest waivers or holds on recovery or restriction action. Unlike energy (National Energy Retail Rules Part 3A) there is no verified Queensland statute that sets out these steps for councils or water providers; they come from council and utility hardship and DFV policies, with the Local Government Regulation 2012 s 120(1)(d) hardship concession and Information Privacy Act 2009 obligations in the background. Modelled on au-energy-family-violence-customer-record. Published council and utility DFV and hardship policies are decoys.
operation: >-
  Primary: a DFV-affected customer phrase (affected by / experiencing / impacted by / fleeing / escaping / victim(-survivor) of domestic (and family) or family violence; domestic or family violence flag, indicator, alert, marker, customer, ratepayer, account, note, case or hardship; DFV, DV or FV flag / indicator / alert / marker / customer / ratepayer / account / note / case / hardship / affected). 75 tier requires, within 300 characters, one populated structure: an account field (property, assessment, rates account, water account, customer or account number with a value containing a digit; a named account holder, ratepayer, registered owner, owner, co-owner, customer or applicant; a property, service, supply, premises or rateable land address with a street number; or a water meter number) or a protection-action field, split across a contact/disclosure regex and an account-arrangement regex (preferred or safe contact method with a value; "do not disclose / discuss / release / share / provide / send ... to / with the joint, former, other or co- owner, account holder, partner or ratepayer"; a postal, residential, mailing, contact or notice address suppressed, withheld, confidential or protected; address or contact details suppression, or a suppressed / silent address, record or account, with yes / active / applied / approved; rate, rates or water notices redirected or sent to a stated place; account separation / split with a status; a payment plan or arrangement amount; interest, fees or penalties waived, remitted or suspended; or recovery, debt recovery, collection or restriction action suspended or on hold). 85 tier requires an account field AND a protection-action field AND an independent council or water term (council, local government, rate notice, rates notice, rates, ratepayer, water, sewerage, meter, Urban Utilities, Unitywater). All enforce tiers AND NOT the shared template-exclusion dictionary and a policy exclusion (this policy, published on our website, policy statement, policy objective). 65 is discovery-only (primary phrase alone) and will surface published policies, support-service information and news.
pattern: >-
  (?i)\b(?:(?:affected\s+by|experiencing|impacted\s+by|fleeing|escaping|victim(?:-survivor)?\s+of)\s+(?:domestic\s+(?:and\s+family\s+)?|family\s+)violence|(?:domestic\s+(?:and\s+family\s+)?|family\s+)violence\s+(?:flag|indicator|alert|marker|customer|ratepayer|account|note|case|hardship)|(?:DFV|DV|FV)[\s-]+(?:flag|indicator|alert|marker|customer|ratepayer|account|note|case|hardship|affected))\b
confidence: medium
confidence_justification: >-
  Medium: the DFV-affected phrases are distinctive, but councils and water utilities publish DFV and hardship policies and support information using the same words, so enforce tiers need populated account or protection-action fields and a policy exclusion. Council and utility CRM field labels are not published and are unverified, and there is no verified statutory list of protective steps for councils or water providers, so the account and action fields are generic labelled-value shapes carried over from the energy classifier. Rates assessment and water account formats are customer-defined. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Information Privacy Act 2009 (Qld)
  - Local Government Regulation 2012 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - pii
  - financial
  - government
corroborative_evidence:
  keywords:
    - domestic and family violence
    - safe contact method
    - address suppressed
    - co-owner
    - joint account holder
    - payment arrangement
    - rate notice
    - water account
  proximity: 300
  keyword_lists:
    - au-dfv-terminology
customisation:
  - key: council-property-number
    kind: identifier-format
    identifier: council-property-number
    target: purview.regexes/Regex_au_qld_council_water_dfv_account_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's council property / rates assessment number format (see docs/identifiers.md#council-property-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: utility-account-number
    kind: identifier-format
    identifier: utility-account-number
    target: purview.regexes/Regex_au_qld_council_water_dfv_account_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's utility customer account number format (see docs/identifiers.md#utility-account-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "DFV flag - ratepayer affected by domestic and family violence\nRatepayer: Casey Teston\nAssessment number: 71120458\nPostal address suppressed - do not disclose any rates details to the co-owner Jordan Teston.\nSafe contact method: SMS to mobile ending 4471\nPayment arrangement: $50 per fortnight; interest waived: yes. Rate notices redirected to the council customer service centre."
      description: Rates record with ratepayer, assessment number, suppressed address, co-owner instruction, safe contact and arrangement (85 tier)
      synthetic: true
    - value: "Customer experiencing family violence - water account.\nWater account number: 2209184476\nService address: 11 Frangipani Street, Logan Central QLD 4114\nAccount separation: requested - former partner to be removed from the account\nRestriction action on hold: yes\nDo not discuss the account with the former partner."
      description: Water account record with account number, address, separation, restriction hold and non-disclosure instruction (85 tier)
      synthetic: true
    - value: "FV note: rates customer affected by family violence. Preferred contact method: email only"
      description: Flag with a recorded preferred contact method, no account field (75 tier)
      synthetic: true
    - value: "Affected by domestic violence - ratepayer requested hardship support. Property number: 30019827."
      description: DFV identification with a property number only (75 tier)
      synthetic: true
  should_not_match:
    - value: "Council's Domestic and Family Violence Financial Hardship Policy is published on our website. Ratepayers affected by domestic and family violence may request a payment arrangement, and council will not share their details with a co-owner."
      description: Published council DFV hardship policy (decoy, 65 only)
    - value: "Rates assistance - domestic and family violence customer - blank template\nRatepayer: __________\nAssessment number: __________\nSafe contact method: <select>"
      description: Blank CRM form (65 only)
    - value: "If you are experiencing domestic and family violence, call DVConnect or 1800RESPECT at any time. Council's rates team can also talk to you about payment options."
      description: Support-services information on a council website (65 only)
    - value: "Queensland councils are being urged to adopt domestic violence hardship policies for ratepayers, according to a new sector report."
      description: News item (65 only)
false_positives:
  - description: Published council and water utility DFV and financial hardship policies and support pages.
    mitigation: They describe protections without populated account or action fields; "this policy", "policy statement" and "published on our website" are also excluded.
  - description: Energy and telco DFV customer records.
    mitigation: These can reach 75 through generic account or action fields; 85 needs council or water evidence. au-energy-family-violence-customer-record and au-telco-dfv-affected-customer-record cover those sectors.
  - description: Sector-neutral DFV case notes (housing, health, police) with an address.
    mitigation: Those can reach 75 through the address field; they are equally sensitive. The au-dfv-* classifiers cover them.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_council_water_dfv_primary
      matches:
        - ref: Regex_au_qld_council_water_dfv_account_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_council_water_dfv_protection_action
            - Regex_au_qld_council_water_dfv_account_arrangement
        - ref: Keyword_au_qld_council_water_dfv_account_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_council_water_dfv_policy_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_council_water_dfv_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_council_water_dfv_account_field
            - Regex_au_qld_council_water_dfv_protection_action
            - Regex_au_qld_council_water_dfv_account_arrangement
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_council_water_dfv_policy_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_council_water_dfv_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_council_water_dfv_primary
      pattern: >-
        (?i)\b(?:(?:affected\s+by|experiencing|impacted\s+by|fleeing|escaping|victim(?:-survivor)?\s+of)\s+(?:domestic\s+(?:and\s+family\s+)?|family\s+)violence|(?:domestic\s+(?:and\s+family\s+)?|family\s+)violence\s+(?:flag|indicator|alert|marker|customer|ratepayer|account|note|case|hardship)|(?:DFV|DV|FV)[\s-]+(?:flag|indicator|alert|marker|customer|ratepayer|account|note|case|hardship|affected))\b
    - id: Regex_au_qld_council_water_dfv_account_field
      pattern: >-
        (?i)\b(?:(?:property|assessment|rate\s+assessment|rates?\s+(?:account|assessment)|water\s+account|customer|account)\s+(?:no\.?|number|ID)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9/-]{3,15}\b|(?:account\s+holder|ratepayer|registered\s+owner|owner|co-?owner|customer|applicant)(?:\s+name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:property|service|supply|premises|rateable\s+land)\s+address\s*[:#]\s*(?:(?:Unit|Lot|Apt|Flat)\s+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?\s+[A-Z][A-Za-z'-]{1,30}|(?:water\s+)?meter\s+(?:no\.?|number)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z-]{0,4}\d)[A-Z0-9][A-Z0-9-]{4,15}\b)
    - id: Regex_au_qld_council_water_dfv_protection_action
      pattern: >-
        (?i)\b(?:(?:preferred|safe)\s+(?:method\s+of\s+)?(?:contact|communication)(?:\s+(?:method|details|channel))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|select)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9@.'-]{1,40}|do\s+not\s+(?:disclose|discuss|release|share|provide|send)\s+[^.\n]{0,80}?\b(?:to|with)\s+(?:the\s+)?(?:(?:joint|former|other|secondary)\s+(?:account\s+holder|owner|partner|ratepayer)|co-?owner|ex-?partner)|(?:postal|residential|mailing|contact|notice)\s+address\s+(?:is\s+)?(?:suppressed|withheld|confidential|protected)|(?:address|contact\s+details)\s+suppression\s*[:#-]\s*(?:yes|active|applied|approved|in\s+place)|(?:suppressed|silent)\s+(?:address|record|account)\s*[:#-]\s*(?:yes|active|applied|approved)|(?:rate|rates|water)\s+notices?\s+(?:redirected|to\s+be\s+sent|issued\s+separately|sent)\s+to\s+[^.\n]{3,60})
    - id: Regex_au_qld_council_water_dfv_account_arrangement
      pattern: >-
        (?i)\b(?:account\s+(?:separation|split|separated)\s*[:#-]\s*(?:yes|approved|completed|requested|in\s+progress|\d)|(?:payment\s+(?:plan|arrangement)|instal(?:l)?ments?)\s*[:#-]\s*\$\s?\d|(?:interest|fees?|penalties)\s+(?:waived|remitted|suspended)\s*[:#-]?\s*(?:\$\s?\d|yes|approved|applied|from\s+\d)|(?:recovery|debt\s+recovery|collection|restriction)\s+(?:action\s+)?(?:suspended|on\s+hold|paused)\s*[:#-]?\s*(?:yes|until|from|applied|\d))
  keywords:
    - id: Keyword_au_qld_council_water_dfv_account_context
      groups:
        - match_style: word
          terms:
            - council
            - local government
            - rate notice
            - rates notice
            - rates
            - ratepayer
            - water
            - sewerage
            - meter
            - Urban Utilities
            - Unitywater
      strength: domain
    - id: Keyword_au_qld_council_water_dfv_policy_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - published on our website
            - policy statement
            - policy objective
      strength: specific
risk_rating: 10
risk_description: >-
  The classifier identifies a council rates or water account record that marks a ratepayer or customer as affected by domestic and family violence and carries the property, assessment or account number and address together with how the person may be safely contacted, what must be withheld from a co-owner, joint account holder or former partner, and payment or recovery arrangements. Rates and water accounts are tied to the home, so disclosure to a person using violence can reveal the victim-survivor's location, new contact details and financial position, with a credible risk of serious harm. This is the same harm that au-dfv-confidential-address and au-energy-family-violence-customer-record reserve PROTECTED for. Risk 10 supports PROTECTED Personal-Privacy; review against the organisation's own harm assessment before enforcement.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: RESTRICTED
  ca_gov: Protected B
