  - title: Information Privacy Act 2009 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: Business Queensland - Customer protections (SEQ water customer hardship protections)
    url: https://www.business.qld.gov.au/industries/mining-energy-water/water/industry-infrastructure/industry-regulation/obligations/customer-protections
