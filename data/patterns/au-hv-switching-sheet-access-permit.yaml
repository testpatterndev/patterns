schema: testpattern/v1
name: HV Switching Sheet or Access / Test Permit
slug: au-hv-switching-sheet-access-permit
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed high-voltage switching sheets (switching programs) and Access / Test Permits for electrical apparatus, in the form used by Queensland electricity entities under the Queensland Electricity Entity Standard for Safe Access to High Voltage Electrical Apparatus (SAHVEA, Nov 2023). SAHVEA cl 7.3 requires a switching sheet to carry a unique reference number, the apparatus, step-by-step switching to isolate, prove de-energised and earth, the completion time of each step, isolation points and DNOBs, Operator Earth locations, and the issue, surrender and cancellation of permits. SAHVEA cl 9.2 requires an Access / Test Permit to carry the associated Switching Sheet number, Work Area, issue and surrender times, the Switching Co-ordinator, Nearby Exposed Live HV/LV and an Abnormalities Section. Populated sheets expose isolation points, equipment identifiers, network configuration and work schedules. SAHVEA itself, ENA DOC 003, blank forms and training material are decoys. "Sanction for test" and "vicinity authority" are not SAHVEA terms and are not used as anchors.
operation: >-
  Primary: Switching Sheet, switching program(me), Access / Test Permit, Access Permit or Test Permit. 65 is discovery-only (primary alone) and will surface SAHVEA, ENA guidelines, blank forms, training material and unrelated "access permits". 75 requires, within 300 characters, either (a) a populated switching step line (a step number, an optional time, then Open / Close / Apply / Remove / Earth / Isolate / Rack out / Rack in / Check open / Prove de-energised / Attach or Place DNOB, followed by an equipment token such as a kV value, CB, DNOB, isolator, earth switch, bus or busbar, feeder, circuit breaker or an alphanumeric plant label), or (b) a populated sheet or permit field (Switching Sheet / Permit / Access Permit / Test Permit No., Number or Ref; Recipient, Switching Co-ordinator, Switching Operator, Issued to/by, Received by or Surrendered by with a person name; Work Area or Isolation Point with a value; or an Issue / Surrender / Cancellation time with an hh:mm value) plus HV evidence (DNOB, Operator Earth, Working Earth, Isolation Point, Nearby Exposed Live, HV apparatus, substation, circuit breaker, earthed, de-energised). 85 requires two distinct step lines (min_count 2, unique) plus a populated sheet or permit field plus HV evidence. All tiers exclude template/fixture text. Enforce tiers also exclude SAHVEA, ENA DOC 003, "Safe Access to High Voltage", "authorised person" course material and "Shall include the following".
pattern: (?i)\b(?:switching\s+(?:sheet|program(?:me)?)s?|access\s*/\s*test\s+permits?|access\s+permits?|test\s+permits?)\b
confidence: medium
confidence_justification: >-
  Medium: Switching Sheet and Access / Test Permit are SAHVEA defined terms, but "access permit" and "test permit" also appear in unrelated contexts (building access, vehicle testing). Enforcement therefore needs a populated switching step with an electrical equipment token, or a populated permit field together with HV isolation vocabulary. Sheet and permit number formats are not public (SAHVEA only requires them to be unique), so number fields are anchored on the label with a loose value. "Switching program" is general industry usage outside Queensland and is not a SAHVEA term. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Electrical Safety Act 2002 (Qld)
  - Electrical Safety Regulation 2013 (Qld)
  - "Queensland Electricity Entity Standard for Safe Access to High Voltage Electrical Apparatus (SAHVEA, Nov 2023) cl 7.3, 9.2"
  - Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - infrastructure
  - security
  - operational
corroborative_evidence:
  keywords:
    - DNOB
    - Operator Earth
    - Working Earth
    - Isolation Point
    - Nearby Exposed Live
    - Abnormalities Section
    - substation
    - circuit breaker
    - de-energised
  proximity: 300
customisation:
  - key: switching-sheet-number
    kind: identifier-format
    identifier: switching-sheet-number
    target: purview.regexes/Regex_au_hv_switching_sheet_access_permit_record_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's switching sheet number format (see docs/identifiers.md#switching-sheet-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: access-test-permit-number
    kind: identifier-format
    identifier: access-test-permit-number
    target: purview.regexes/Regex_au_hv_switching_sheet_access_permit_record_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's access / test permit number format (see docs/identifiers.md#access-test-permit-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Switching Sheet No: SS-26-04417\nApparatus: 33 kV Feeder F412 Kellyvale Substation\nStep 1 06:42 Open 33 kV CB 4122 (A) - attach DNOB\nStep 2 06:48 Rack out CB 4122 and place DNOB on isolator 4122-1 (B)\nStep 3 06:55 Earth 33 kV feeder F412 at earth switch 4122-ES, Operator Earth (C)\nAccess Permit No: AP-26-1180 issued to Recipient: Jordan Pellicott"
      description: Populated switching sheet with timed steps, sheet number, permit reference and recipient - intended 85
      synthetic: true
    - value: "Access / Test Permit\nPermit No: TP-88213\nRecipient: Casey Marrowby\nWork Area: Bay 6, 132 kV busbar section 2, Tarrin substation\nIsolation Points: CB 6052 (D), isolator 6052-2 (E). Operator Earth applied at earth switch 6052-ES.\nNearby Exposed Live HV: 132 kV bus section 1 adjacent."
      description: Populated Access / Test Permit with permit number, recipient, work area and isolation points - intended 75 (fields, no step lines)
      synthetic: true
    - value: "Switching program for tomorrow's transformer outage at Mount Orrin:\n1. Open 11 kV CB 12T2 and attach DNOB\n2. Open isolator T2-11 and prove de-energised"
      description: Two numbered switching step lines without sheet or permit fields - intended 75
      synthetic: true
    - value: "Test Permit TP-4410 surrendered.\nSurrendered by: Riley Vantongeren at 15:20\nAll Working Earths removed; permit returned to the Switching Co-ordinator."
      description: Populated surrender field with HV evidence - intended 75
      synthetic: true
  should_not_match:
    - value: "A Switching Sheet Shall include the following:- a) a unique reference number b) the identification of the Electrical Apparatus to be worked on c) the description of work to be carried out d) all Switching required (step by step) to isolate, prove De-energised, and earth the Electrical Apparatus where access / test is required"
      description: SAHVEA cl 7.3 text (standard decoy) - 65 only
    - value: "Switching Sheet No: __________\nApparatus: __________\nStep | Time | Operation | Apparatus | Initials\nAccess Permit No: __________\nRecipient: __________   Switching Co-ordinator: __________"
      description: Blank switching sheet and permit form - must not reach 75
    - value: "Authorised person refresher - training exercise. Read the example switching sheet and identify the Isolation Points: Step 1 Open 11 kV CB 101, Step 2 Earth feeder 101."
      description: Training material with example steps (fixture exclusion) - must not reach 75
    - value: "Car park access permit No: CP-2231 issued to Sam Holloway for Level 2 of the Kelvin Grove office building."
      description: Unrelated building access permit (no HV evidence) - must not reach 75
    - value: "Crews used a detailed switching program to restore power to 4,000 homes after the storm, the network said in a media statement."
      description: News mention - 65 only
false_positives:
  - description: SAHVEA, ENA DOC 003 and other safe-access standards and procedures that list the required contents of sheets and permits.
    mitigation: Enforce tiers need populated step lines or permit fields, and carry a standard/guidance exclusion group.
  - description: Blank switching sheet and permit forms.
    mitigation: Underscores, square and angle brackets and n/a/tbc values are rejected by the field guard; column headings are not step lines.
  - description: Unrelated access or test permits (building access, parking, vehicle or equipment testing).
    mitigation: A permit field reaches 75 only together with HV isolation vocabulary; step lines need an electrical equipment token.
  - description: Authorised person training and assessment material with example switching.
    mitigation: Template-exclusion and the authorised-person/training exclusion keep it below 75.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_hv_switching_sheet_access_permit_primary
      matches:
        - ref: Regex_au_hv_switching_sheet_access_permit_step_line
          min_count: 2
          unique_results: true
        - ref: Regex_au_hv_switching_sheet_access_permit_record_field
        - ref: Keyword_au_hv_switching_sheet_access_permit_hv_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_hv_switching_sheet_access_permit_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_hv_switching_sheet_access_permit_primary
      matches:
        - ref: Regex_au_hv_switching_sheet_access_permit_step_line
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_hv_switching_sheet_access_permit_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_hv_switching_sheet_access_permit_primary
      matches:
        - ref: Regex_au_hv_switching_sheet_access_permit_record_field
        - ref: Keyword_au_hv_switching_sheet_access_permit_hv_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_hv_switching_sheet_access_permit_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_hv_switching_sheet_access_permit_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_hv_switching_sheet_access_permit_primary
      pattern: >-
        (?i)\b(?:switching\s+(?:sheet|program(?:me)?)s?|access\s*/\s*test\s+permits?|access\s+permits?|test\s+permits?)\b
    - id: Regex_au_hv_switching_sheet_access_permit_step_line
      pattern: >-
        (?i)\b(?:Step\s{1,3})?\d{1,3}[.):]?[ \t]{1,6}(?:\d{1,2}[:.]?\d{2}[ \t]{1,6})?(?:Open|Close|Apply|Remove|Earth|Isolate|Rack\s+out|Rack\s+in|Check\s+open|Prove\s+de-?energi[sz]ed|Attach\s+DNOB|Place\s+DNOB)\b[^\n|]{1,80}?(?:\b\d{1,3}(?:\.\d)?\s?kV\b|\bCB\b|\bDNOB\b|\bisolator\b|\bearth\s+switch\b|\bbus(?:bar)?\b|\bfeeder\b|\bcircuit\s+breaker\b|\b[A-Z]{1,3}\d{2,5}[A-Z]?\b|\b\d{2,5}[A-Z]{1,2}\d{0,2}\b)
    - id: Regex_au_hv_switching_sheet_access_permit_record_field
      pattern: >-
        (?i)(?:\b(?:Switching\s+Sheet|Access\s*/\s*Test\s+Permit|Access\s+Permit|Test\s+Permit|Permit)\s+(?:No\.?|Number|Ref(?:erence)?(?:\s+No\.?)?)\s*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/-]{2,24}|\b(?:Recipient|Switching\s+Co-?ordinator|Switching\s+Operator|Issued\s+(?:to|by)|Received\s+by|Surrendered\s+by|Cancelled\s+by)(?:\s+name)?\s*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,24}[ \t]+[A-Z][A-Za-z'-]{1,30}|\b(?:Work\s+Area|Isolation\s+Points?)\s*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.,-]{1,30}(?:[ \t]+[A-Za-z0-9/'.,()-]{1,30}){1,5}|\b(?:Issue|Surrender|Cancellation)\s+time\s*[:#]?[ \t]{0,5}\d{1,2}[:.]\d{2}\b|\b(?:Issued|Surrendered|Cancelled)\s+at[ \t]{1,3}\d{1,2}[:.]\d{2}\b)
    - id: Regex_au_hv_switching_sheet_access_permit_guidance_exclusion
      pattern: >-
        (?i)(?:\bQueensland\s+Electricity\s+Entity\s+Standard\b|\bSAHVEA\b|\bENA\s+DOC\s*0?03\b|\bSafe\s+Access\s+to\s+(?:HV|High\s+Voltage)\s+Electrical\s+Apparatus\b|\bauthori[sz]ed\s+person\s+(?:course|training|refresher|assessment)\b|\bShall\s+include\s+the\s+following\b|\bmedia\s+(?:statement|release)\b)
  keywords:
    - id: Keyword_au_hv_switching_sheet_access_permit_hv_evidence
      groups:
        - match_style: word
          terms:
            - text: DNOB
              case_sensitive: true
            - Do Not Operate Board
            - Operator Earth
            - Operator Earths
            - Working Earth
            - Working Earths
            - Isolation Point
            - Isolation Points
            - Nearby Exposed Live
            - Abnormalities Section
            - HV apparatus
            - high voltage
            - substation
            - circuit breaker
            - earth switch
            - earthed
            - de-energised
            - Switching Co-ordinator
      strength: specific
risk_rating: 8
risk_description: >-
  A populated switching sheet or Access / Test Permit identifies specific HV apparatus, isolation and earthing points, feeder and circuit-breaker identifiers, crew members and the times when plant will be out of service. For a transmission or distribution network or a generator connection, this reveals network configuration and windows of reduced redundancy that could be used to target critical electricity assets. It also carries worker names and safety-critical isolation records. Standards, blank forms, training and news are excluded from enforce tiers. Risk 8 supports SENSITIVE InfoTech.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 matches PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE InfoTech because a completed switching sheet
    or Access / Test Permit identifies HV apparatus, isolation and earthing points, crew names and when plant is out of
    service. PROTECTED is not met: one sheet exposes a short outage window on specific plant, not a network-wide control
    blueprint.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling fits completed switching programs that reveal network configuration and
      reduced-redundancy windows. A single work package does not reach High.
references:
  - title: Powerlink / Energy Queensland - Queensland Electricity Entity Standard for Safe Access to High Voltage Electrical Apparatus (SAHVEA), Nov 2023
    url: https://www.powerlink.com.au/sites/default/files/2024-06/Queensland%20Electricity%20Entity%20Standard%20for%20Safe%20Access%20to%20High%20Voltage%20Electrical%20Apparatus%20(SAHVEA).pdf
  - title: Queensland Legislation - Electrical Safety Act 2002
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-2002-042
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release. Anchored on SAHVEA (Nov 2023) switching sheet (cl 7.3) and Access / Test Permit (cl 9.2) contents. 75 needs a populated step line, or a sheet/permit field plus HV isolation vocabulary. 85 needs two step lines, a field and HV evidence. Sheet and permit numbers are label-anchored because no public format exists.
