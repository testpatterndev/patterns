schema: testpattern/v1
name: Australian Electricity Forward Curve Artefact
slug: au-forward-curve-artefact
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects Australian electricity forward/broker curve exports - forward or broker
  curve phrasing tied to NEM regional reference identifiers (QLD1, NSW1, VIC1, SA1,
  TAS1), load shape terms (flat/peak/off-peak), or calendar/quarter strip notation
  (Cal27, Q1-27, CY2027, FY27) with $/MWh values. Internal curve marks reveal a
  participant's price expectations and valuation basis.
operation: >-
  Matches 'forward curve' / 'broker curve' / 'price curve' in proximity to a NEM
  region identifier, strip notation, or $/MWh figure. Region IDs and strip notation
  are the distinguishing vocabulary separating curve artefacts from generic finance
  prose. Participant-specific curve names belong in a customer overlay dictionary,
  not this public pattern.
pattern: >-
  \b(?:forward|broker|price)\s+curves?\b[\s\S]{0,200}(?:\b(?:QLD1|NSW1|VIC1|SA1|TAS1)\b|\bCal\s?[0-9]{2}\b|\bQ[1-4][\s/-]?[0-9]{2}\b|(?:\$|AUD)\s?[0-9]{1,4}(?:\.[0-9]{1,2})?\s?/\s?MWh)|\b(?:QLD1|NSW1|VIC1|SA1|TAS1)\b[\s\S]{0,80}\b(?:flat|peak|off-?peak)\b[\s\S]{0,80}(?:\$|AUD)\s?[0-9]{1,4}(?:\.[0-9]{1,2})?\s?/\s?MWh
confidence: low
confidence_justification: >-
  Low confidence: curve vocabulary overlaps with published market commentary and
  ASX Energy settlement summaries. The pattern is discovery-oriented; enforcement
  precision comes from corroborative keywords, volume thresholds and
  participant-specific curve names supplied via customer overlay dictionaries.
jurisdictions:
  - au
regulations:
  - "Corporations Act 2001 (Cth) - market integrity"
frameworks:
  - ISO 27001
data_categories:
  - energy-market
  - trading
  - financial
corroborative_evidence:
  keywords:
    - mark-to-market
    - valuation
    - hedge
    - book
    - long-term pricing
    - internal estimate
    - risk forward
  proximity: 300
test_cases:
  should_match:
    - value: 'internal forward curve update: QLD1 flat Cal27 marked at $71.20/MWh'
      description: Curve mark with region, strip and price
    - value: 'broker curve import - Q1-27 peak $118/MWh, off-peak $44/MWh'
      description: Broker curve with quarter strip and prices
    - value: 'QLD1 off-peak marked at $38.75/MWh in the risk forward book'
      description: Region + shape + price arm
  should_not_match:
    - value: the road has a forward curve ahead, slow down
      description: Prose curve without market vocabulary
    - value: ASX futures settled higher on Tuesday according to the AFR
      description: Public market commentary without curve/region/price structure
    - value: 'QLD1 was the highest demand region last summer'
      description: Region identifier without shape and price context
false_positives:
  - description: Published market reports and ASX Energy summaries quote regional
      prices and strips legitimately.
    mitigation: Discovery-only by default; require internal-valuation keywords for
      enforcement and exclude public market-report locations.
exports:
  - yaml
scope: wide
risk_rating: 7
risk_description: >-
  Internal forward curves expose a participant's price expectations, valuation
  marks and hedge intentions - disclosure moves negotiations and market positions
  against the owner.
sensitivity_labels:
  - SENSITIVE
references:
  - "AEMO NEM regional reference nodes (QLD1/NSW1/VIC1/SA1/TAS1)"
  - "AFMA Electricity Conventions - strip and shape conventions"
created: 2026-07-24
updated: 2026-07-24
changelog:
  - version: 1.0.0
    date: 2026-07-24
    note: Initial draft; participant curve names deferred to customer overlay.
author: Compl8 (draft)
