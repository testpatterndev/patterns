schema: testpattern/v1
name: Queensland Council Local Law Infringement Notice or SPER Referral Record
slug: au-qld-council-infringement-sper-record
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Council-issued infringement notices for local law and animal management offences, and the default certificates and referral records that send unpaid notices to the State Penalties Enforcement Registry (SPER). Under State Penalties Enforcement Act 1999 s 15, an infringement notice must state a unique number for the notice, its date, the alleged offender's full name and address, the offence particulars (place, time and date, and identifying particulars for any animal or vehicle), and the fine. s 22 and s 23 set out payment, court election and instalments within 28 days. When the alleged offender defaults, the administering authority may give SPER a default certificate (s 33), and SPER may then issue an enforcement order (s 38). Council compliance and remedial notices (Local Government Act 2009 s 138AA) often precede the infringement. Local law registers are public, but individual notices and SPER referral batches are not.
operation: >-
  Primary: [penalty] infringement notice, default certificate, State Penalties Enforcement Registry, referred / referral / lodged / registered to or with SPER, SPER referral / registration / lodgement / debt, remedial notice, compliance notice. Every enforce tier also needs a council or local-law context term within 300 characters (local law, council, regional / city / shire council, Local Government Act 2009, Animal Management (Cats and Dogs) Act, authorised person, unregistered dog, wandering, animal at large, overgrown, unsightly, remedial notice). This context requirement keeps traffic-camera notices at 65. 75 requires context plus either a populated alleged-offender field (alleged offender, offender, person served, recipient, full name, name, or residential / postal address, followed by a name of two or more capitalised words or a street address) or a labelled infringement notice number (the infringement-notice-number fallback: notice label followed by a value of at least 7 characters containing a digit). 85 requires context plus an alleged-offender field, a labelled notice number and a populated offence or penalty field (offence [description / details / code / provision / location / date], nature of offence, provision contravened, place or date of offence, fine, penalty [amount], amount payable / due / owing / outstanding, due date, pay by). Field values must be on the same line as their label and are placeholder-guarded. All enforce tiers AND NOT the shared template-exclusion dictionary and a guidance exclusion (frequently asked questions, fact sheet, State Penalties Enforcement Regulation, infringement notice offence means, annual report). 65 is discovery-only.
pattern: >-
  (?i)\b(?:(?:penalty\s+)?infringement\s+notice|default\s+certificate|State\s+Penalties\s+Enforcement\s+Registry|(?:referred|referral|lodged|registered)\s+(?:to|with)\s+SPER|SPER\s+(?:referral|registration|lodgement|debt)|remedial\s+notice|compliance\s+notice)\b
confidence: medium
confidence_justification: >-
  Medium. Infringement and SPER vocabulary is shared with traffic, transport and other state agencies, so enforce tiers need a council / local-law context term and populated fields. Infringement notice number formats are unpublished, so the notice number is the registry's label-anchored fallback (infringement-notice-number). 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - State Penalties Enforcement Act 1999 (Qld) ss 13, 15, 22-24, 33, 38
  - Local Government Act 2009 (Qld) s 138AA
  - Animal Management (Cats and Dogs) Act 2008 (Qld)
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - pii
  - government
corroborative_evidence:
  keywords:
    - local law
    - council
    - authorised person
    - SPER
    - default certificate
    - unregistered dog
    - overgrown
    - unsightly
  proximity: 300
customisation:
  - key: infringement-notice-number
    kind: identifier-format
    identifier: infringement-notice-number
    target: purview.regexes/Regex_au_qld_council_infringement_notice_number
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's infringement notice number format (see docs/identifiers.md#infringement-notice-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Penalty infringement notice - Harbourview Regional Council (animal management local law)\nInfringement notice number: 2026084291\nAlleged offender: Jordan Teston\nAddress: 22 Banksia Drive, Mackay QLD 4740\nOffence: dog not effectively confined to the property\nFine: $309.60\nDue date: 21/10/2026"
      description: Council local law infringement notice with the SPER s 15 fields (85 tier)
      synthetic: true
    - value: "Default certificate - referral to SPER\nCouncil: Harbourview Regional Council\nNotice number: 7004418273\nAlleged offender: Morgan Teston\nAddress: 5 Seagull Parade, Hervey Bay QLD 4655\nOffence: failure to comply with compliance notice (overgrown allotment)\nAmount outstanding: $1,238.00"
      description: SPER referral record for an unpaid local law notice (85 tier)
      synthetic: true
    - value: "Infringement notice issued by council authorised person for an unregistered dog.\nName: Riley Teston"
      description: Council infringement note with the alleged offender name only (75 tier)
      synthetic: true
    - value: "Remedial notice follow-up: the local law officer issued infringement notice no. 2026-0413 for the unsightly allotment after the compliance period ended."
      description: Local law compliance note with a labelled notice number only (75 tier)
      synthetic: true
  should_not_match:
    - value: "15 Infringement notices (1) An infringement notice must be in the form approved by the administering authority. (2) The notice must state a unique number for the notice; the date of the notice; the alleged offender's full name, or surname and any initial, and address."
      description: SPER Act s 15 text (legislation, 65 only)
    - value: "Penalty infringement notice - council local laws\nInfringement notice number: __________\nAlleged offender: __________\nAddress: __________\nOffence: __________\nFine: $________"
      description: Blank council infringement notice form (65 only)
    - value: "Frequently asked questions: if you do not pay your council infringement notice within 28 days it may be referred to SPER, the State Penalties Enforcement Registry."
      description: Council FAQ page (guidance exclusion)
    - value: "Council issued 3,412 local law infringement notices in 2025-26 and referred 1,020 to SPER, the annual report shows."
      description: Aggregate statistics (65 only)
    - value: "Speed camera detection - infringement notice number: 2025041872. Registered operator: Alex Teston, Aitkenvale QLD 4814. Department of Transport and Main Roads."
      description: Traffic camera notice without council / local-law context (65 here; covered by traffic-camera-record)
false_positives:
  - description: SPER Act text, council FAQ and payment pages, annual reports and the SPER Regulation offence schedules.
    mitigation: Enforce tiers need a populated offender field or labelled notice number plus council context. A guidance exclusion suppresses FAQ pages, fact sheets, the Regulation and annual reports.
  - description: Traffic and speed camera notices from the Department of Transport and Main Roads or Queensland Revenue Office.
    mitigation: They lack council / local-law context, so they stay at 65 here. traffic-camera-record covers them. A council parking or camera notice can match both classifiers.
  - description: Blank notice forms.
    mitigation: Values must be on the same line as the label, and blank lines and bracket placeholders are rejected.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_council_infringement_primary
      matches:
        - ref: Regex_au_qld_council_infringement_offender_field
        - ref: Regex_au_qld_council_infringement_notice_number
        - ref: Regex_au_qld_council_infringement_offence_field
        - ref: Keyword_au_qld_council_infringement_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_council_infringement_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_council_infringement_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_council_infringement_offender_field
            - Regex_au_qld_council_infringement_notice_number
        - ref: Keyword_au_qld_council_infringement_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_council_infringement_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_council_infringement_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_council_infringement_primary
      pattern: >-
        (?i)\b(?:(?:penalty\s+)?infringement\s+notice|default\s+certificate|State\s+Penalties\s+Enforcement\s+Registry|(?:referred|referral|lodged|registered)\s+(?:to|with)\s+SPER|SPER\s+(?:referral|registration|lodgement|debt)|remedial\s+notice|compliance\s+notice)\b
    - id: Regex_au_qld_council_infringement_offender_field
      pattern: >-
        (?i)\b(?:alleged\s+offender|offender|person\s+served|recipient|name\s+of\s+(?:the\s+)?(?:alleged\s+)?offender|full\s+name|name|(?:residential\s+|postal\s+)?address)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not|none|nil|redacted|suppressed|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:(?:(?:Mr|Mrs|Ms|Miss|Dr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30})
    - id: Regex_au_qld_council_infringement_notice_number
      pattern: >-
        (?i)\b(?:(?:penalty\s+)?infringement\s+notice|camera[\s-]+detected\s+offence\s+notice|offence\s+notice|notice)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{5,20}\b
    - id: Regex_au_qld_council_infringement_offence_field
      pattern: >-
        (?i)\b(?:offence(?:\s+(?:description|details|code|provision|location|date))?|nature\s+of\s+(?:the\s+)?offence|provision\s+contravened|place\s+of\s+(?:the\s+)?offence|date\s+(?:and\s+time\s+)?of\s+(?:the\s+)?offence|fine(?:\s+amount)?|penalty(?:\s+amount)?|amount\s+(?:payable|due|owing|outstanding)|due\s+date|date\s+due|pay\s+by)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9$][A-Za-z0-9$.,'/()-]{1,40}
  keywords:
    - id: Keyword_au_qld_council_infringement_context
      groups:
        - match_style: word
          terms:
            - local law
            - local laws
            - council
            - regional council
            - city council
            - shire council
            - Local Government Act 2009
            - Animal Management (Cats and Dogs) Act
            - authorised person
            - unregistered dog
            - wandering
            - animal at large
            - overgrown
            - unsightly
            - remedial notice
      strength: specific
    - id: Keyword_au_qld_council_infringement_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - frequently asked questions
            - fact sheet
            - factsheet
            - State Penalties Enforcement Regulation
            - infringement notice offence means
            - annual report
      strength: specific
risk_rating: 6
risk_description: >-
  The classifier identifies a council local law or animal management infringement notice, or a SPER referral record, that names the alleged offender with an address, the offence and the fine. These records expose an identified person's alleged offending, enforcement history and debt, and often neighbour-complaint context. Bulk SPER referral batches expose many people at once and warrant handling at the upper end of this band. Legislation, FAQ pages, statistics, blank forms and traffic-camera notices without council context are excluded from enforce tiers. Risk 6 supports SENSITIVE Legal.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
