schema: testpattern/v1
name: Institutional review board submissions
slug: global-top500-356-institutional-review-board-submissions
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies submissions to, and decisions of, a human research ethics review body - IRB/HREC applications, submissions and approvals, ethics applications, protocol amendments and adverse event reports - when the phrase sits with populated protocol/investigator identifiers and submission fields. Committee descriptions alone remain discovery-only.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: institutional review board, IRB submission/application/approval/protocol, (human research) ethics committee/application/approval/submission, HREC application/approval/reference, protocol amendment, (serious) adverse event report, human subjects research, ethical review. 65 (discovery only): phrase alone. 75: phrase plus a populated protocol or investigator field (IRB/HREC/protocol/project/study/application/amendment number or reference, principal/chief/coordinating investigator). 85: that field plus a populated submission field (submission type/date, review type/pathway, determination, decision, approval date/expiry, risk level, sponsor, sites, participants, sample size, version) plus independent review evidence (approved with conditions, expedited review, full board, low risk, continuing review, participant information sheet, National Statement, data management plan). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:institutional\s+review\s+board|IRB\s+(?:submission|application|approval|protocol)|(?:human\s+research\s+)?ethics\s+(?:committee|application|approval|submission)|HREC\s+(?:application|approval|reference)|protocol\s+amendment|(?:serious\s+)?adverse\s+event\s+report|human\s+subjects\s+research|ethical\s+review)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated protocol or investigator field; 85 also needs a submission field and review evidence. Committee web pages, agendas and research-office guidance stay at 65.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - IPA 2009 (Qld)
  - GDPR
  - HIPAA
data_categories:
- pii
corroborative_evidence:
  keywords:
    - approved with conditions
    - expedited review
    - full board
    - participant information sheet
    - National Statement
    - data management plan
  proximity: 300
test_cases:
  should_match:
    - value: "HREC application - amendment\nHREC reference: HREC/2026/QMS/44718\nPrincipal investigator: Dr Priya Ramanathan\nSubmission type: Amendment 2 (new recruitment site)\nReview pathway: Expedited review\nParticipants: 240\nDetermination: Approved with conditions - update the participant information sheet."
      description: Populated ethics amendment with protocol, submission fields and review evidence (85)
      synthetic: true
    - value: "IRB submission acknowledged\nProtocol number: HSR-882\nChief investigator: Jordan Staffson"
      description: Submission acknowledgement with labelled protocol and investigator fields only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "student grant"
      description: Generic word pair from old broad template should not match
    - value: "The museum acquisitions committee reviewed three landscape paintings."
      description: An unrelated committee topic satisfies no research-review anchor
    - value: "Policy guidance: this procedure explains how ethics application and IRB submission records are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Ethics application form\nProtocol number: ____________________\nPrincipal investigator: ____________________\nSubmission type: ____________________\nParticipants: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "The ethics committee agenda lists elections, meeting dates, and member training with no protocol, application, amendment, or decision."
      description: Committee administration naming the committee only (65 discovery at most)
    - value: "Training: this workshop explains how an ethics application moves through expedited review and when a protocol amendment needs full board review."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Common words and phrases related to institutional review board submissions appearing in policy documents, training
    materials, HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_irb_submissions
      matches:
        - ref: Regex_global_top500_356_institutional_review_board_submissions_protocol_fields
        - ref: Regex_global_top500_356_institutional_review_board_submissions_submission_fields
        - ref: Keyword_global_top500_356_institutional_review_board_submissions_review_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_356_institutional_review_board_submissions_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_irb_submissions
      matches:
        - ref: Regex_global_top500_356_institutional_review_board_submissions_protocol_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_356_institutional_review_board_submissions_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_irb_submissions
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_irb_submissions
      pattern: (?i)\b(?:institutional\s+review\s+board|IRB\s+(?:submission|application|approval|protocol)|(?:human\s+research\s+)?ethics\s+(?:committee|application|approval|submission)|HREC\s+(?:application|approval|reference)|protocol\s+amendment|(?:serious\s+)?adverse\s+event\s+report|human\s+subjects\s+research|ethical\s+review)\b
    - id: Regex_global_top500_356_institutional_review_board_submissions_protocol_fields
      pattern: (?i)\b(?:(?:IRB|HREC|protocol|project|study|ethics|application|amendment|submission)\s*(?:no\.?|number|ID|ref(?:erence)?|#)|(?:principal|chief|coordinating)\s+investigator)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_356_institutional_review_board_submissions_submission_fields
      pattern: (?i)\b(?:submission\s+(?:type|date)|review\s+(?:type|date|pathway)|determination|decision|approval\s+(?:date|expiry|period)|expiry\s+date|risk\s+level|sponsor|sites?|participants?|sample\s+size|version)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_356_institutional_review_board_submissions_review_evidence
      groups:
        - match_style: word
          terms:
            - approved with conditions
            - expedited review
            - full board
            - low risk
            - continuing review
            - participant information sheet
            - National Statement
            - data management plan
      strength: specific
    - id: Keyword_global_top500_356_institutional_review_board_submissions_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
risk_description: >-
  This pattern identifies IRB/HREC and ethics submission, approval, amendment and adverse event report language and enforces only when populated protocol or investigator fields sit nearby; phrase-only text stays at 65 discovery. A genuine submission may combine unpublished methods, investigator judgments, participant recruitment, risk controls, consent design, and vulnerable-population details, so disclosure can undermine both research integrity and participant protection. The ordinary submission remains bounded to one study and the detector does not necessarily expose participant-level data, but commercial, ethical, and privacy harm can still be serious. Risk 8 and SENSITIVE are justified; PROTECTED would require identifiable high-risk participant datasets, dangerous controlled research, or major institution-wide compromise.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
created: '2026-02-08'
updated: '2026-09-24'
changelog:
- version: 1.4.0
  date: '2026-09-24'
  description: "Quality pass (2026-09-24): rebuilt tiers - 75/85 were gated by field-name keywords ('protocol number', 'principal investigator') that appear in blank forms and guidance, and no positive reached 85. 75 now needs a populated protocol or investigator field and 85 needs that plus a populated submission field plus review evidence. Primary consolidated into one regex. Bare-phrase tests replaced with populated records; the committee-agenda example moved to should_not_match; added policy, blank-form and training decoys. Regulations: removed AML/CTF Act, HRIPA, My Health Records Act and TIA Act; added HIPAA; frameworks added; references titled."
- version: 1.3.0
  date: '2026-07-17'
  description: 'Reduced-scope harden (TP-01264): the old 65 tier corroborated the full topic primary with the same-span Keyword_irb_submissions
    list, so "ethics committee" alone enforced at 65. Keyword_irb_submissions is replaced by Keyword_irb_submissions_IndependentContext
    (IRB number, protocol number, principal investigator, submission type, review date, determination, approval expiry, amendment
    number, committee docket). Regex_irb_submissions is modified to the retained strong submission branch (IRB submission,
    protocol amendment, adverse event report) enforcing at 75 with one submission field; Regex_irb_submissions_ContextualBranch
    (ethics committee) enforces at 65 only with two unique submission fields; the full topic vocabulary moves to Regex_irb_submissions_Topic
    as a 65 discovery_only inventory tier (SIT semantic scope preserved — not redefined as populated submissions only, per
    QA). Added submission positive, committee-administration discovery case, and museum-committee negative.'
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1902 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical
    tier.
