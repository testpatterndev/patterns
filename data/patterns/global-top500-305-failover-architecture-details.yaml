schema: testpattern/v1
name: Failover architecture details
slug: global-top500-305-failover-architecture-details
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects failover and high-availability architecture details: failover/DR/HA architecture wording with populated node, VIP, site and listener fields plus internal IPs or hostnames. Topic wording alone is discovery-only.
operation: >-
  Regex_failover_primary (failover/DR/high-availability architecture, configuration or runbook wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated node field (VIP, primary/secondary/standby node or site, DR site, listener, cluster name, witness) or a network artefact (IPv4 address, internal hostname). 85 requires a populated node field (VIP, primary/secondary/standby node or site, DR site, listener, cluster name, witness) (two distinct hits), a network artefact (IPv4 address, internal hostname), and independent replication/HA-mechanics (sync/async replication, quorum, split-brain, cutover) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_failover_guidance_exclusion).
pattern: >-
  (?i)\b(?:failover\s+(?:architecture|design|configuration|runbook|plan|procedure|topology)|disaster\s+recovery\s+(?:architecture|topology|runbook)|high[\s-]availability\s+(?:architecture|design|configuration|topology|cluster))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated node field (VIP, primary/secondary/standby node or site, DR site, listener, cluster name, witness) or a network artefact (IPv4 address, internal hostname)), and 85 needs two distinct structures plus independent replication/HA-mechanics (sync/async replication, quorum, split-brain, cutover) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- SOCI Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - replication
  - synchronous
  - asynchronous
  - quorum
  - split-brain
  - RPO
  - RTO
  - DNS cutover
  - Always On
  - Pacemaker
  proximity: 300
test_cases:
  should_match:
  - value: The failover architecture will be reviewed after the data-centre migration.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Failover configuration - payroll DB
      Primary node: sqlpay01
      Standby node: sqlpay02
    description: Medium-tier probe (75) - populated node fields
    synthetic: true
  - value: |-
      High-availability cluster design - payroll
      Primary node: sqlpay01.harbour.internal (10.20.8.11)
      Standby node: sqlpay02.harbour.internal (10.40.8.11)
      Listener: sqlpay-lsn, VIP: 10.20.8.50
      Synchronous replication inside the site, asynchronous to the DR site; file-share witness prevents split-brain; DNS cutover for manual failover.
    description: High-tier probe (85) - several node fields, IPs/hostnames and replication context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: tier 1 systems require a documented failover design with annual testing.'
    description: Policy text
    synthetic: true
  - value: |-
      Failover configuration template
      Primary node: ________
      VIP: [insert]
    description: Blank template
    synthetic: true
  - value: 'Webinar notes: a high-availability cluster uses a witness and synchronous replication to avoid split-brain.'
    description: Webinar framing
    synthetic: true
false_positives:
- description: Cloud vendor reference architectures describe HA designs.
  mitigation: Enforcement needs populated node fields or internal addresses; guidance/training framing is excluded.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_failover_primary
    matches:
    - ref: Regex_failover_node_field
      min_count: 2
      unique_results: true
    - ref: Regex_failover_network_artefact
    - ref: Keyword_failover_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_failover_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_failover_primary
    matches:
    - type: any
      refs:
      - Regex_failover_node_field
      - Regex_failover_network_artefact
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_failover_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_failover_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_failover_primary
    pattern: >-
      (?i)\b(?:failover\s+(?:architecture|design|configuration|runbook|plan|procedure|topology)|disaster\s+recovery\s+(?:architecture|topology|runbook)|high[\s-]availability\s+(?:architecture|design|configuration|topology|cluster))\b
  - id: Regex_failover_node_field
    pattern: >-
      (?i)\b(?:VIP|virtual\s+IP|primary\s+(?:node|site|DB|database|server)|secondary\s+(?:node|site|server)|standby\s+(?:node|site|replica)|DR\s+site|listener|cluster\s+name|witness|heartbeat\s+(?:interface|network))\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  - id: Regex_failover_network_artefact
    pattern: >-
      (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b
  keywords:
  - id: Keyword_failover_context
    groups:
    - match_style: word
      terms:
      - replication
      - synchronous
      - asynchronous
      - quorum
      - split-brain
      - text: RPO
        case_sensitive: true
      - text: RTO
        case_sensitive: true
      - DNS cutover
      - Always On
      - Pacemaker
    strength: specific
  - id: Keyword_failover_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires failover/HA architecture wording plus populated node/VIP fields or internal network artefacts before enforcing. An actual architecture record can reveal active and standby components, switching mechanisms, concentration points, and failover assumptions that support targeted disruption. The usual affected unit is one service cluster or platform and its users, while product documentation and generic high-availability designs can match without internal detail. Risk 7 SENSITIVE reflects moderate direct operational harm; PROTECTED would require critical-service architecture or significant system-wide consequence.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
