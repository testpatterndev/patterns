      "privacy"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:student protection report|school safeguarding report|student harm disclosure|school protection monitoring record)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:concern recorded|disclosure recorded|harm concern|concern details)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{5,120}"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:outcome|referral|monitoring action|support action)[ \\t]*:[ \\t]*(?:monitor at school|referred|guidance|child safety|police|principal|ongoing support)\\b"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      }
    ]
  },
