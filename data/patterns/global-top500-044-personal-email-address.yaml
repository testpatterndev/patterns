schema: testpattern/v1
name: Personal email address
slug: global-top500-044-personal-email-address
version: 1.7.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to personal email address in Australian contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations. Phrase-level concept detector: it matches email-label wording, not populated mailbox addresses; generic email/contact/correspondence labels without a personal or private
  qualifier are discovery-only.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Keyword
  lists: pii-personal, correspondence-address-labels, correspondence-action-terms. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?is)\b(personal\s+email\s+address|personal\s+email|private\s+email|email\s+contact|email\s+address|correspondence\s+email|contact\s+email)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - personal email address
    - personal
    - email
    - address
    - contact
    - location
    - data
  proximity: 300
  keyword_lists:
    - pii-personal
    - correspondence-address-labels
    - correspondence-action-terms
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: personal email address
      description: Primary topic phrase match
    - value: personal email
      description: Case-insensitive topic phrase match
    - value: private email
      description: Alternative topic phrase match
    - value: email contact
      description: Additional topic phrase match
    - value: |-
        Personal email address: Recorded
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: address mac
      description: Generic word pair from old broad template should not match
    - value: Support contact email for the company.
      description: Role-mailbox decoy — a business support label must not reach the enforcing personal-email tiers
    - value: Sales team shared inbox email address for correspondence.
      description: Shared-inbox decoy — corporate email-address label must not reach the enforcing personal-email tiers
    - value: |-
        Personal email address:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about personal email address are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Personal email address:
        Name: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Common words and phrases related to personal email address appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  recommended_dlp_min_matches: 3
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      local_noise_filter: true
      id_match: Regex_global_top500_044_personal_email_address_populated_label
      matches:
        - ref: Regex_global_top500_044_personal_email_address_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match: Regex_global_top500_044_personal_email_address_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match: Pattern_personal_email
      matches:
        - ref: Evidence_personal_email
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_personal_email
    - confidence_level: 65
      id_match: Pattern_email_generic_label
      discovery_only: true
      description: Generic email/contact/correspondence labels without a personal or private qualifier — discovery inventory only
  regexes:
    - id: Pattern_personal_email
      pattern: (?is)\b(personal\s+email\s+address|personal\s+email|private\s+email)\b
    - id: Pattern_email_generic_label
      pattern: (?is)\b(email\s+contact|email\s+address|correspondence\s+email|contact\s+email)\b
    - id: Pattern_au_top500_044_personal_email_address_label_context
      pattern: (?i)\b(personal\s+email\s+address)\b
    - id: Regex_global_top500_044_personal_email_address_populated_label
      pattern: (?i)\b((?:\b(?:personal\s+email\s+address|personal\s+email|private\s+email)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Regex_global_top500_044_personal_email_address_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
  keywords:
    - id: Evidence_personal_email
      groups:
        - match_style: word
          terms:
            - gmail
            - hotmail
            - yahoo
    - id: Keyword_au_top500_044_personal_email_address_domain_context
      groups:
        - match_style: word
          terms:
            - personal email address
            - personal
            - email
            - address
risk_description: >-
  The Personal email address detector finds wording such as personal email, private email, correspondence email, or contact email. It does not match an address containing an at-sign or identify the mailbox owner, so forms and communication policies can trigger it without any personal contact value. A populated private address could support phishing, unwanted contact, or account correlation when linked to a person, but that misuse requires content beyond this label. Risk 3 and OFFICIAL fit the concept hit, while a confirmed person-linked mailbox and sensitive context would reach the SENSITIVE threshold.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 3 with PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM and Low tier fits wording such as personal or private
    email; the detector matches the label, not an address with an at-sign, so forms and policies trigger it. SENSITIVE
    is not met without a confirmed person-linked mailbox in a sensitive context.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low handling fits an email-label signal; even a populated private address supports phishing but provides
      no mailbox access.
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.7.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.6.0
    date: '2026-10-19'
    description: "Local noise filter: every tier above 65 opts in to the per-tenant Local Noise Exclusion dictionary (local_noise_filter: true). When the export enables it, each of those tiers gets a pattern-level TextMatchFilter (EndsWith, Exclude) reading that dictionary, so the organisation's own published values (its generic mailboxes, mail domain and website) stop reaching 75/85 while the 65 tier still reports them. Detection logic and entity filters are unchanged, and the filter is inert until the customer adds entries."
  - version: 1.5.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_044_personal_email_address_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (gmail, hotmail, yahoo); 85 requires the populated field plus a populated person/client field (Regex_global_top500_044_personal_email_address_record_structure). Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (email contact, inbox, outlook, correspondence email, contact email). Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.4.3
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had a rationale written for an earlier
      risk rating).
  - version: 1.4.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.4.0
    date: '2026-07-17'
    description: 'TP-00172 approved reduced scope: retain concept-class semantics (no mailbox/value parser — delegate populated-address detection to a separate email identifier SIT). Split the generic email contact / email address / correspondence email / contact email alternatives out of Pattern_personal_email into a new Pattern_email_generic_label branch wired to a discovery-only 65 tier, so labels without a personal/private/home qualifier no longer reach the enforcing tiers via identical same-span evidence. Top-level universal-engine pattern and Evidence_personal_email unchanged. Clarified phrase-level concept behaviour in the description. Added role-mailbox and shared-inbox decoy negatives.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 647 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
