schema: testpattern/v1
name: Superannuation identifiers
slug: global-top500-096-superannuation-identifiers
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects Australian superannuation identifiers with populated values: USI (unique superannuation identifier), fund member/account numbers, fund or SMSF ABN and SMSF electronic service address (ESA), optionally with the member or employee name.
operation: >-
  Primary: a superannuation identifier phrase (superannuation identifier, unique superannuation identifier / USI, super member/account number, fund member number, SMSF ABN/ESA, electronic service address, fund ABN). 75 tier requires a populated identifier value field (USI, member number, super account number, fund/SMSF ABN, ESA) whose value contains a digit or is a spaced ABN, placeholder-guarded, within 300 characters. 85 tier additionally requires a populated member/employee name field and an independent corroborative term (SuperStream, rollover, contributions, fund name, standard choice, self-managed super fund, clearing house, stapled fund). Enforce tiers exclude template/fixture text and guidance framing; 65 is discovery-only.
pattern: >-
  (?i)\b(?:superannuation\s+identifiers?|unique\s+superannuation\s+identifier|USI|super(?:annuation)?\s+(?:fund\s+)?(?:member|membership|account)\s+(?:number|no\.?|ID)|fund\s+member\s+(?:number|ID)|SMSF\s+(?:ABN|electronic\s+service\s+address|ESA)|electronic\s+service\s+address|fund\s+ABN)\b
confidence: medium
confidence_justification: >-
  Medium: USIs, member numbers and SMSF ESAs have no single verified public format, so the classifier anchors on a labelled identifier with a populated value that contains a digit (placeholder-guarded) near a superannuation identifier phrase for 75, and adds a populated member/employee name plus independent corroboration for 85. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
regulations:
  - Superannuation Guarantee (Administration) Act 1992 (Cth)
  - Superannuation Industry (Supervision) Act 1993 (Cth)
  - Taxation Administration Act 1953 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - pii
corroborative_evidence:
  keywords:
    - SuperStream
    - rollover
    - contributions
    - fund name
    - standard choice
    - self-managed super fund
    - clearing house
    - stapled fund
  proximity: 300
test_cases:
  should_match:
    - value: "Superannuation details\nEmployee name: Avery Teston\nFund name: Coastline Super\nFund ABN: 12 345 678 901\nUSI: 12345678901001\nMember number: 70442198\nContributions to be paid via SuperStream."
      description: "85: super details with employee, fund ABN, USI, member number and SuperStream"
      synthetic: true
    - value: "SMSF ABN: 98 765 432 109\nElectronic service address (ESA): ESAPROV1\nMember name: Morgan Teston\nRollover to the self-managed super fund to be processed this week."
      description: "85: SMSF details with SMSF ABN, ESA, member name and rollover"
      synthetic: true
    - value: "Superannuation member number: 88120455\nPlease update your records."
      description: "75: super member number with value, no member name"
      synthetic: true
    - value: "superannuation identifiers"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "A unique superannuation identifier (USI) identifies a super fund product. This fact sheet explains where to find your fund's USI."
      description: "ATO-style guidance - must stay at or below 65"
    - value: "Superannuation standard choice form\nFund ABN: __________\nUSI: __________\nMember number: __________"
      description: "Blank choice form - must stay at or below 65"
    - value: "USI: N/A\nMember number: TBC\nFund ABN: [fund ABN]"
      description: "Placeholder values - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "Public fund product listings that publish fund ABNs and USIs."
    mitigation: "Fund ABN/USI alone is public data and stays at 75; 85 needs a populated member name plus corroboration."
  - description: "Overlap with au-tfn-declaration-super-choice-form, au-superannuation-fund-number and superannuation-fund-member-statement-bulk."
    mitigation: "This pattern detects identifiers in any record; the choice-form and bulk-statement classifiers carry the form/bulk context."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_096_superannuation_identifiers_primary
      matches:
        - ref: Regex_top500_096_superannuation_identifiers_identifier_value
        - ref: Regex_top500_096_superannuation_identifiers_person_field
        - ref: Keyword_top500_096_superannuation_identifiers_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_096_superannuation_identifiers_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_096_superannuation_identifiers_primary
      matches:
        - ref: Regex_top500_096_superannuation_identifiers_identifier_value
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_096_superannuation_identifiers_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_096_superannuation_identifiers_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_096_superannuation_identifiers_primary
      pattern: >-
        (?i)\b(?:superannuation\s+identifiers?|unique\s+superannuation\s+identifier|USI|super(?:annuation)?\s+(?:fund\s+)?(?:member|membership|account)\s+(?:number|no\.?|ID)|fund\s+member\s+(?:number|ID)|SMSF\s+(?:ABN|electronic\s+service\s+address|ESA)|electronic\s+service\s+address|fund\s+ABN)\b
    - id: Regex_top500_096_superannuation_identifiers_identifier_value
      pattern: >-
        (?i)\b(?:USI|unique\s+superannuation\s+identifier|(?:fund\s+)?member(?:ship)?\s+(?:number|no\.?|ID)|(?:super(?:annuation)?\s+)?account\s+number|(?:fund|SMSF)\s+ABN|ESA|electronic\s+service\s+address)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})(?:\d{2}(?:[ ]?\d{3}){3}(?:[ ]?\d{3})?|(?=[A-Za-z0-9-]{0,20}\d)[A-Za-z0-9][A-Za-z0-9-]{3,20})\b
    - id: Regex_top500_096_superannuation_identifiers_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?|member(?:\s+(?:full\s+)?name)|fund\s+member\s+name|account\s+holder)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_top500_096_superannuation_identifiers_corroborative
      groups:
        - match_style: word
          terms:
            - SuperStream
            - rollover
            - contributions
            - fund name
            - standard choice
            - self-managed super fund
            - clearing house
            - stapled fund
      strength: specific
    - id: Keyword_top500_096_superannuation_identifiers_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - how to find
            - where to find
            - you can find
            - identifies a super fund
            - what is a usi
      strength: domain
risk_description: >-
  The classifier identifies populated superannuation identifiers (75) and, with a member or employee name, a person-linked super record (85). Member numbers plus names enable account enquiries, rollover fraud and social engineering; fund ABNs/USIs alone are public product data. Guidance and blank forms stay at 65. Risk 4 supports OFFICIAL.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because the detector establishes identifier
    terminology, not a valid value or account holder. The next higher SENSITIVE classification is not met because a real
    identifier linked to a person and material superannuation or financial context is not required.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low handling is suitable for superannuation-identifier labels, with stronger controls when corroboration
      proves an issued member or account value tied to an individual.
references:
  - title: "Superannuation Guarantee (Administration) Act 1992 (Cth)"
    url: https://www.legislation.gov.au/C2004A04402/latest/text
  - title: "ATO - Paying electronically through SuperStream"
    url: https://www.ato.gov.au/businesses-and-organisations/super-for-employers/paying-electronically-through-superstream
  - title: "ATO - Superannuation standard choice form (NAT 13080)"
    url: https://www.ato.gov.au/forms-and-instructions/superannuation-standard-choice-form
  - title: "ATO - Super for employers"
    url: https://www.ato.gov.au/businesses-and-organisations/super-for-employers
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
