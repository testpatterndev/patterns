schema: testpattern/v1
name: Genomic testing results
slug: global-top500-334-genomic-testing-results
version: 1.3.2
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies genomic testing results references in healthcare and patient records. Protected health information
  under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 7 keywords within 300 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:genomic\s+testing|genetic\s+testing|genome\s+sequencing|DNA\s+analysis|genetic\s+variant|hereditary\s+risk|gene\s+mutation|whole\s+genome|genetic\s+counseling)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
  - GDPR
  - Information Privacy Act 2009 (Qld)
  - My Health Records Act 2012 (Cth)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
- healthcare
- phi
corroborative_evidence:
  keywords:
  - genomic testing results
  - genomic
  - testing
  - results
  - health
  - biomedical
  - information
  proximity: 300
  keyword_lists:
  - healthcare-clinical
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
  - value: genomic testing
    description: Primary topic phrase match
  - value: genetic testing
    description: Case-insensitive topic phrase match
  - value: genome sequencing
    description: Alternative topic phrase match
  - value: DNA analysis
    description: Additional topic phrase match
  - value: "genomic testing\nPatient name: Avery Teston\nURN: 004418273\nDate of birth: 04/02/1991\nClinician: Dr Jordan Staffson\nNotes: genomic testing reviewed at appointment on 12/08/2026."
    description: Populated health record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: patient biometric
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about genomic testing are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Medical terminology in health education materials, research publications, clinical guidelines, or public health
    documents without patient-specific data.
  mitigation: Require corroborative evidence keywords confirming patient context. Look for co-occurrence with patient identifiers
    such as medical record numbers or dates of birth.
- description: General wellness and fitness content using medical vocabulary without constituting protected health information.
  mitigation: Layer with patient identifier patterns or healthcare-specific document structure detection to distinguish clinical
    records from general health content.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: The detector locates genomic-testing, genetic-testing, or genome-sequencing phrases with seven healthcare
  corroborators and exclusions for template text, aiming at a clinical genomic result rather than genetics as a topic. A true
  result may reveal pathogenic variants, disease predisposition, ancestry, carrier status, pharmacogenomic response, and information
  about biological relatives as well as the tested patient. Results can reveal disease predisposition, parentage and familial
  findings affecting both the patient and relatives. The permanent and multi-person consequences make significant damage inherent.
  Once corroborated as an actual Genomic testing results record, risk 9 and PROTECTED Personal-Privacy are proportionate to
  the significant damage disclosure can cause.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_genomic_testing_results
      matches:
        - ref: Regex_global_top500_334_genomic_testing_results_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_genomic_testing_results
      matches:
        - ref: Regex_global_top500_334_genomic_testing_results_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_genomic_testing_results
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_genomic_testing_results
      pattern: (?is)\b(?:genomic\s+testing|genetic\s+testing|genome\s+sequencing|DNA\s+analysis|genetic\s+variant|hereditary\s+risk|gene\s+mutation|whole\s+genome|genetic\s+counseling)\b
    - id: Regex_global_top500_334_genomic_testing_results_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|patient|client|participant|donor|recipient|clinician|URN|UR\s+number|MRN|medical\s+record\s+number|Medicare(?:\s+number)?|IHI|referring\s+(?:doctor|practitioner)|(?:specimen|accession|lab|laboratory|study|participant|patient|client|trial|case|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-09-24'
