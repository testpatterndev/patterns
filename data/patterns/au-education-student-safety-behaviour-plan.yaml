  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated individual student safety and behaviour support plan can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://ppr.qed.qld.gov.au/pp/restrictive-practices-procedure"
