schema: testpattern/v1
name: Student Attendance and Absence Record
slug: au-education-attendance-record
version: 1.2.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Populated student attendance and absence records: attendance registers and class, excursion, sport
  and camp rolls, roll-marking records, absence notifications and explanation notes, unexplained
  absence follow-up, attendance summaries and attendance exports from school administration systems.
  They tie a named or numbered student to an attendance status, absence reason, days absent or
  attendance rate. Boundary: staff timesheets and time and attendance records belong to
  global-top500-077-time-and-attendance-records; this classifier needs a student field or a student
  column. Tick-grid rolls with single-letter codes and no labels or status words are not recognised.
operation: >-
  Primary: student attendance or absence, attendance register / roll / record / report / summary /
  history / notification / letter / export / follow-up, class roll, roll marking or roll call record /
  sheet / report / export, excursion / sport / bus / camp roll, absence record / notification /
  explanation / note / report / letter / follow-up, unexplained absence, daily or period attendance.
  65 (discovery only): primary alone, which surfaces procedures, newsletters and blank registers. 75:
  primary plus a populated student field (student, learner, pupil or child name / ID / number / code,
  EQ ID, LUI, USI) plus a populated attendance field (status, attendance, absence reason / type / code,
  AM, PM, period or session with a value such as present, absent, late, partial, excused, unexplained,
  illness, medical, appointment, holiday, suspended; or days absent / present / late with a count; or an
  attendance rate percentage). 85: the 75 evidence plus a populated school context field (school,
  campus, class, roll class, homeroom, form class, year level, teacher) or record evidence (roll marked,
  recorded by, parent contacted or notified, SMS sent, OneSchool, Compass, Sentral). Table path: a
  delimited status cell (present, absent, late ...) below a header that puts a student column (student
  ID / code / name / number, EQ ID, LUI, roll class, homeroom, form class, year level) and an attendance
  column (attendance, attendance status / code, absence reason / type / code, status, AM, PM) within
  200 characters of each other, plus a delimited date cell, reaches 75, and 85 with a second status
  cell. The date cell keeps prose field lists ("student name, class, status, absent or late") out of
  the table path. Purview reads tabs as spaces, so the table path recognises comma, semicolon and pipe
  delimited exports. Enforce tiers exclude procedure, policy, guideline,
  newsletter, training and FAQ framing. The shared template dictionary is not applied, so a completed
  register that keeps a form-template footer still matches; blank registers fail the field-value guards.
pattern: >-
  (?i)\b(student[ \t]+(?:attendance|absences?)|attendance[ \t]+(?:register|roll|record|report|summary|history|notification|letter|export|follow[\s-]?up)|class[ \t]+rolls?|roll[ \t]+(?:marking|call)[ \t]+(?:record|sheet|report|export)|(?:excursion|sport|bus|camp)[ \t]+roll|absence[ \t]+(?:record|notification|explanation|note|report|letter|follow[\s-]?up)|unexplained[ \t]+absences?|(?:daily|period)[ \t]+attendance)\b
confidence: medium
confidence_justification: >-
  Medium: roll and absence titles are standard across Queensland state, Catholic and independent
  schools, and enforce tiers need a populated student field with a populated attendance value, or a
  student export with a status column, which procedures, newsletters and blank registers lack. Field
  labels are matched by wording only, so a school system export with unusual column names may stay at
  65, and tick-grid rolls are missed. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - au-qld
regulations:
  - Education (General Provisions) Act 2006 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - education
  - pii
corroborative_evidence:
  keywords:
    - roll class
    - homeroom
    - year level
    - roll marked
    - parent contacted
    - absence reason
    - unexplained
  proximity: 300
scope: narrow
risk_rating: 7
risk_description: >-
  A populated student attendance and absence record can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.
references:
  - title: Roll marking in state schools procedure (Queensland Department of Education)
    url: https://ppr.qed.qld.gov.au/pp/roll-marking-in-state-schools-procedure
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
classification:
  tier: Medium
  rationale: >-
    Populated student attendance and absence record maps to SENSITIVE Personal-Privacy. The classifier requires record context and corroborating fields. The mapping does not determine the risk of every matched document.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling applies to the populated record. Synthetic checks establish local matching behavior, not tenant detection accuracy.
package_tags:
  primary_component: student-child-records
  components:
    - student-child-records
  component_tier: large
  deployment_priority:
    - expanded
  sectors:
    - education
  addons: []
  label_domains:
    - education
    - privacy
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_attendance_primary
      matches:
        - ref: Regex_attendance_student_field
        - ref: Regex_attendance_status_field
        - type: any
          min_matches: 1
          refs:
            - Regex_attendance_context_field
            - Keyword_attendance_record_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_attendance_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_attendance_table_row
      matches:
        - ref: Regex_attendance_table_header
        - ref: Regex_attendance_table_status_cells
          min_count: 2
        - ref: Regex_attendance_table_date
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_attendance_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_attendance_primary
      matches:
        - ref: Regex_attendance_student_field
        - ref: Regex_attendance_status_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_attendance_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_attendance_table_row
      matches:
        - ref: Regex_attendance_table_header
        - ref: Regex_attendance_table_date
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_attendance_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_attendance_primary
  regexes:
    - id: Regex_attendance_primary
      pattern: >-
        (?i)\b(student[ \t]+(?:attendance|absences?)|attendance[ \t]+(?:register|roll|record|report|summary|history|notification|letter|export|follow[\s-]?up)|class[ \t]+rolls?|roll[ \t]+(?:marking|call)[ \t]+(?:record|sheet|report|export)|(?:excursion|sport|bus|camp)[ \t]+roll|absence[ \t]+(?:record|notification|explanation|note|report|letter|follow[\s-]?up)|unexplained[ \t]+absences?|(?:daily|period)[ \t]+attendance)\b
    - id: Regex_attendance_student_field
      pattern: >-
        (?i)\b((?:(?:student|learner|pupil|child)(?:[ \t]+(?:full[ \t]+)?(?:name|ID|no\.?|number|code))?|EQ[ \t]*ID|LUI|USI)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:student|learner|pupil|name|id|n/?a|unknown|tbc|tba|withheld|not[ \t]+recorded|enter|insert|write|print|your|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{1,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3})
    - id: Regex_attendance_status_field
      pattern: >-
        (?i)\b((?:status|attendance(?:[ \t]+(?:status|code))?|absence(?:[ \t]+(?:reason|type|code))?|reason(?:[ \t]+for[ \t]+absence)?|AM|PM|period[ \t]*\d|session)[ \t]*[:#-][ \t]{0,3}(?:present|absent|late(?:[ \t]+arrival)?|partial(?:[ \t]+absence)?|early[ \t]+departure|excused|explained|unexplained|illness|ill|sick|medical|appointment|family[ \t]+(?:reason|holiday|matter)|holiday|bereavement|suspended|exclusion|school[ \t]+activity|truant)\b|(?:days|half[ \t]+days|sessions)[ \t]+(?:absent|present|late)[ \t]*[:#][ \t]*\d{1,3}\b|attendance(?:[ \t]+rate)?[ \t]*[:#][ \t]*\d{1,3}(?:\.\d{1,2})?[ \t]*%)
    - id: Regex_attendance_context_field
      pattern: >-
        (?i)\b((?:school|campus|class|roll[ \t]+(?:class|group)|home[ \t]*room|form[ \t]+class|year[ \t]+level|year|(?:class[ \t]+)?teacher)[ \t]*:[ \t]{0,3}(?!(?:n/?a|unknown|tbc|tba|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9 .'-]{0,60})
    - id: Regex_attendance_table_header
      pattern: >-
        (?i)\b((?:student[ \t]*(?:ID|code|name|number|no\.?)|EQ[ \t]*ID|LUI|roll[ \t]+(?:class|group)|home[ \t]*room|form[ \t]+class|year[ \t]+level)\b[^\r\n]{0,200}[,\t;|][ \t]*"?(?:attendance(?:[ \t]+(?:status|code))?|absence[ \t]+(?:reason|type|code)|status|AM|PM)|(?:attendance(?:[ \t]+(?:status|code))?|absence[ \t]+(?:reason|type|code))"?[ \t]*[,\t;|][^\r\n]{0,200}\b(?:student[ \t]*(?:ID|code|name|number|no\.?)|EQ[ \t]*ID|LUI|roll[ \t]+(?:class|group)|home[ \t]*room|form[ \t]+class|year[ \t]+level))\b
    - id: Regex_attendance_table_row
      pattern: >-
        (?i)([,\t;|][ \t]*"?(?:present|absent|late|partial(?:[ \t]+absence)?|excused|explained|unexplained|illness|sick|medical|appointment|holiday|suspended))\b
    - id: Regex_attendance_table_status_cells
      pattern: >-
        (?i)([,;|][ \t]*"?(?:present|absent|late|partial(?:[ \t]+absence)?|excused|explained|unexplained|illness|sick|medical|appointment|holiday|suspended))\b
    - id: Regex_attendance_table_date
      pattern: >-
        ([,;|][ \t]*"?(?:\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/(?:\d{4}|\d{2})))\b
    - id: Regex_attendance_guidance_exclusion
      pattern: >-
        (?i)\b(this[ \t]+(?:policy|procedure|guideline|guide|fact[ \t]?sheet|newsletter|page|article|course)|frequently[ \t]+asked[ \t]+questions|media[ \t]+release|news[ \t]+release|training[ \t]+module|e-learning|how[ \t]+to[ \t]+(?:mark|record|complete)|blank[ \t]+form)\b
  keywords:
    - id: Keyword_attendance_record_evidence
      groups:
        - match_style: word
          terms:
            - roll marked
            - recorded by
            - marked by
            - parent contacted
            - parent notified
            - carer contacted
            - SMS sent
            - OneSchool
            - Compass
            - Sentral
      strength: specific
test_cases:
  should_match:
    - value: "Student attendance register\nSchool: Rivergum College\nStudent name: Avery Teston\nClass: 7B\nAttendance date: 2026-09-10\nStatus: Absent\nAbsence reason: Illness"
      description: 85 tier - register with student, status and school and class fields
      synthetic: true
    - value: "Student absence record\nStudent ID: RG20451\nCampus: North Campus\nDate: 2026-09-11\nStatus: Late\nRecorded by: Jordan Staffson"
      description: 85 tier - absence record with student ID, status, campus and recorded-by
      synthetic: true
    - value: "Student attendance register\nSchool: Rivergum College\nStudent name: Avery Teston\nClass: 7B\nAttendance date: 2026-09-10\nStatus: Absent\nAbsence reason: Illness\nForm template version 2.1. Retain the completed record."
      description: 85 tier - completed register that keeps a form-template footer
      synthetic: true
    - value: "Student absence record\nStudent ID: RG20451\nCampus: North Campus\nDate: 11/09/2026\nStatus: Late\nRecorded by: Jordan Staffson"
      description: 85 tier - slash-formatted date variant
      synthetic: true
    - value: "Student ID,Student Name,Class,Date,Status\nRG20451,Avery Teston,7B,2026-09-10,Absent"
      description: 75 tier - one-row attendance export with a student column, status cell and date cell
      synthetic: true
    - value: "Student ID,Student Name,Class,Date,Status\nRG20451,Avery Teston,7B,2026-09-10,Absent\nRG20452,Jordan Teston,7B,2026-09-10,Absent\nRG20453,Casey Teston,7B,2026-09-10,Late"
      description: 85 tier - attendance export with several status rows
      synthetic: true
    - value: "Student Code,Surname,First Name,Roll Class,Date,AM,PM\nAVT0012,Teston,Avery,7B,10/09/2026,Present,Absent\nJOT0031,Teston,Jordan,7B,10/09/2026,Late,Present"
      description: 85 tier - school system export with AM and PM columns
      synthetic: true
    - value: "Unexplained absence notification\nStudent: Riley Teston\nYear level: 9\nDate: 12/09/2026\nAttendance: Absent - unexplained\nPlease contact the school office to explain this absence."
      description: 85 tier - unexplained absence notification with student, status and year level
      synthetic: true
    - value: "Student attendance summary - Term 3\nStudent name: Casey Teston\nEQ ID: 0123456789A\nDays absent: 7\nAttendance rate: 86.5%"
      description: 75 tier - attendance summary with student, days absent and attendance rate
      synthetic: true
    - value: "Excursion roll - Year 10 Geography field trip\nStudent name: Morgan Teston\nStatus: Present"
      description: 75 tier - excursion roll with a student and status, no school context field
      synthetic: true
  should_not_match:
    - value: "Employee attendance register\nEmployee name: Avery Teston\nDepartment: Finance\nDate: 2026-09-10\nStatus: Absent"
      description: Staff attendance register with no student field (65 at most)
      synthetic: true
    - value: "Time and attendance record\nEmployee name: Avery Teston\nEmployee number: 40917\nDate: 10/09/2026\nStatus: Absent\nHours worked: 0"
      description: Staff time and attendance record, global-top500-077 territory (65 at most)
      synthetic: true
    - value: "Employee ID,Employee Name,Date,Status\nE40917,Avery Teston,2026-09-10,Absent\nE40918,Jordan Teston,2026-09-10,Present"
      description: Staff attendance export with no student column
      synthetic: true
    - value: "Student attendance register\nSchool: __________\nStudent name: __________\nClass: __________\nAttendance date: __________\nStatus: __________\nAbsence reason: __________"
      description: Blank attendance register (65 at most)
      synthetic: true
    - value: "Student ID,Student Name,Class,Date,Status\n,,,,"
      description: Empty attendance export header
      synthetic: true
    - value: "Student attendance register\nSchool: Rivergum College\nEmployee name: Jordan Staffson\nClass: 7B\nAttendance date: 2026-09-10\nStatus: Absent\nAbsence reason: Illness"
      description: Register naming a staff member, not a student (65 at most)
      synthetic: true
    - value: "This procedure sets out how state schools mark class rolls twice a day. Student name: record the student's full name. Status: absent, late or present, with an absence reason such as illness or a medical appointment."
      description: Roll marking procedure text (65 at most)
      synthetic: true
    - value: "From the principal: our school's attendance rate for Term 3 was 91%. Every day counts, so please let the office know about any student absences."
      description: Newsletter item about school attendance (65 at most)
      synthetic: true
    - value: "Staff meeting attendance record\nName: Avery Teston\nStatus: Present\nApologies: Jordan Teston"
      description: Meeting attendance with no student field (65 at most)
      synthetic: true
    - value: "Rolls list student name, class, status (present, absent or late) and the teacher's initials."
      description: Prose field list shaped like a header and a status cell
      synthetic: true
    - value: "Class rolls record the student ID, roll class, status, absent or late codes and the reason."
      description: Prose field list after a roll title (65 at most)
      synthetic: true
false_positives:
  - description: Roll marking procedures, newsletters and attendance campaign material that name rolls, absences and status values.
    mitigation: They lack a populated student field, and procedure, newsletter, training and FAQ framing is excluded from enforce tiers.
  - description: Staff timesheets, time and attendance records and meeting attendance lists.
    mitigation: Enforce tiers need a student field or a student column; staff records stay at 65 and belong to global-top500-077.
  - description: Blank registers and empty export headers.
    mitigation: Field values reject underscores, brackets and placeholder words, and the table path needs a populated status cell.
exports:
  - yaml
  - purview
created: '2026-09-13'
updated: '2026-10-30'
author: PVX
license: MIT
changelog:
  - version: 1.2.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.1.0
    date: '2026-10-22'
    description: >-
      Broaden from a single 85 tier that needed four labelled fields within 1000 characters to the 65 / 75 /
      85 ladder at 300 characters. Primary adds attendance summaries, notifications, letters, exports and
      follow-up, roll marking records, excursion, sport, bus and camp rolls, absence notes and letters,
      unexplained absences and daily or period attendance. 75 needs a populated student field (now also
      child, code, EQ ID, LUI, USI) and a populated attendance field (more status values, AM / PM / period,
      days absent, attendance rate); 85 adds a school context field or record evidence. The fixed CSV header
      is replaced by a table path for any header with a student column and an attendance column plus a
      date cell (85 with a second status cell). Discovery
      tier added. Recommended confidence 85 -> 75. Staff timesheet, staff export, procedure, newsletter and
      meeting decoys added. Risk and labels unchanged.
  - version: 1.0.3
    date: '2026-09-25'
    description: Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.0.2
    date: '2026-09-24'
    description: 'Metadata: add references / regulations'
