{
  "schema": "testpattern/v1",
  "name": "Student Attendance and Absence Record",
  "slug": "au-education-attendance-record",
  "version": "1.0.2",
  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated student attendance and absence record using record context and corroborating fields.",
  "pattern": "(?i)(?:student attendance|attendance register|class roll|student absence|absence record)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
  "regulations": [
    "Education (General Provisions) Act 2006 (Qld)",
    "Information Privacy Act 2009 (Qld)",
    "Privacy Act 1988 (Cth)"
  ],
  "frameworks": [
    "ISO 27001",
    "ISO 27701"
  ],
  "data_categories": [
    "education",
    "pii"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated student attendance and absence record can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://ppr.qed.qld.gov.au/pp/roll-marking-in-state-schools-procedure"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE Personal-Privacy"
  },
  "package_tags": {
    "primary_component": "student-child-records",
    "components": [
      "student-child-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "privacy"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          },
          {
            "ref": "Regex_4"
          }
        ]
      },
      {
        "confidence_level": 85,
        "id_match": "Regex_csv_row",
        "matches": [
          {
            "ref": "Regex_csv_header"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:student attendance|attendance register|class roll|student absence|absence record)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:class|school|campus)[ \\t]*:[ \\t]*[A-Z0-9][A-Z0-9 .-]{1,60}"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:attendance date|date|session)[ \\t]*:[ \\t]*(?:\\d{4}-\\d{2}-\\d{2}|\\d{1,2}/\\d{1,2}/\\d{4})"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)(?:status|attendance|absence reason)[ \\t]*:[ \\t]*(?:present|absent|late|excused|illness|medical|unexplained)\\b"
      },
      {
        "id": "Regex_4",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      },
      {
        "id": "Regex_csv_header",
        "pattern": "(?i)Student ID,Student Name,Class,Date,Status"
      },
      {
        "id": "Regex_csv_row",
        "pattern": "(?i)\\b[A-Z0-9-]{4,20},[A-Z][A-Z .'-]{2,60},[A-Z0-9-]{1,20},(?:\\d{4}-\\d{2}-\\d{2}|\\d{1,2}/\\d{1,2}/\\d{4}),(?:present|absent|late|excused|unexplained)\\b"
      }
    ]
  },
  "test_cases": {
    "should_match": [
      {
        "value": "Student attendance register\nSchool: Rivergum College\nStudent name: Avery Teston\nClass: 7B\nAttendance date: 2026-09-10\nStatus: Absent\nAbsence reason: Illness",
        "description": "Synthetic populated record variant 1",
        "synthetic": true
      },
      {
        "value": "Student absence record\nStudent ID: RG20451\nCampus: North Campus\nDate: 2026-09-11\nStatus: Late\nRecorded by: Jordan Staffson",
        "description": "Synthetic populated record variant 2",
        "synthetic": true
      },
      {
        "value": "Student attendance register\nSchool: Rivergum College\nStudent name: Avery Teston\nClass: 7B\nAttendance date: 2026-09-10\nStatus: Absent\nAbsence reason: Illness\nForm template version 2.1. Retain the completed record.",
        "description": "Synthetic populated record variant 3",
        "synthetic": true
      },
      {
        "value": "Student absence record\nStudent ID: RG20451\nCampus: North Campus\nDate: 11/09/2026\nStatus: Late\nRecorded by: Jordan Staffson",
        "description": "Synthetic populated record variant 4",
        "synthetic": true
      },
      {
        "value": "Student ID,Student Name,Class,Date,Status\nRG20451,Avery Teston,7B,2026-09-10,Absent",
        "description": "Synthetic populated record variant 5",
        "synthetic": true
      }
    ],
    "should_not_match": [
      {
        "value": "Employee attendance register\nEmployee name: Avery Teston\nDepartment: Finance\nDate: 2026-09-10\nStatus: Absent",
        "description": "Synthetic public, blank, distant or unrelated counterexample 1",
        "synthetic": true
      },
      {
        "value": "Student attendance register\nSchool: __________\nStudent name: __________\nClass: __________\nAttendance date: __________\nStatus: __________\nAbsence reason: __________",
        "description": "Synthetic public, blank, distant or unrelated counterexample 2",
        "synthetic": true
      },
      {
        "value": "Student ID,Student Name,Class,Date,Status\n,,,,",
        "description": "Synthetic public, blank, distant or unrelated counterexample 4",
        "synthetic": true
      },
      {
        "value": "Student attendance register\nSchool: Rivergum College\nEmployee name: Jordan Staffson\nClass: 7B\nAttendance date: 2026-09-10\nStatus: Absent\nAbsence reason: Illness",
        "description": "Synthetic public, blank, distant or unrelated counterexample 5",
        "synthetic": true
      }
    ]
  },
  "exports": [
