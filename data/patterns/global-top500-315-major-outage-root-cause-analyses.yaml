schema: testpattern/v1
name: Major outage root-cause analyses
slug: global-top500-315-major-outage-root-cause-analyses
version: 1.3.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects major outage root-cause analyses: RCA or post-incident review wording with populated outage fields and technical artefacts (incident/change numbers, hosts, timestamps). Topic wording alone is discovery-only.
operation: >-
  Regex_outage_rca_primary (root-cause analysis, RCA report, post-incident review, post-mortem or major incident report wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated outage field (outage start/end/duration, impacted services, incident/problem/change number, severity) or a technical artefact (ServiceNow INC/CHG/PRB number, IPv4, internal hostname, timestamp). 85 requires a populated outage field (outage start/end/duration, impacted services, incident/problem/change number, severity) (two distinct hits), a technical artefact (ServiceNow INC/CHG/PRB number, IPv4, internal hostname, timestamp), and independent RCA-outcome (contributing factors, corrective/preventive actions, lessons learned) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_outage_rca_guidance_exclusion).
pattern: >-
  (?i)\b(?:root[\s-]cause\s+analys[ie]s|RCA\s+(?:report|document|findings)|post[\s-]incident\s+(?:review|report)|post[\s-]mortem|major\s+(?:incident|outage)\s+(?:report|review))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated outage field (outage start/end/duration, impacted services, incident/problem/change number, severity) or a technical artefact (ServiceNow INC/CHG/PRB number, IPv4, internal hostname, timestamp)), and 85 needs two distinct structures plus independent RCA-outcome (contributing factors, corrective/preventive actions, lessons learned) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - contributing factor
  - corrective action
  - preventive action
  - customer impact
  - lessons learned
  - action owner
  - failover
  - rollback
  - detection
  - mitigation
  proximity: 300
  keyword_lists:
  - industry-critical-infrastructure
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
  - value: A root cause analysis will be circulated after the outage.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Post-incident review
      Incident number: INC0041187
      Duration: 3h 12m
    description: Medium-tier probe (75) - populated outage fields
    synthetic: true
  - value: |-
      Major incident report - payroll outage
      Incident number: INC0041187
      Outage start: 2026-09-12 07:02
      Duration: 3h 12m
      Impacted services: payroll, rostering
      Change CHG0031542 rotated the certificate on lb01.harbour.internal; contributing factor: no rollback step. Corrective action owner: Infrastructure; lessons learned recorded.
    description: High-tier probe (85) - several outage fields, artefacts and RCA outcome context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: a root cause analysis is required for every priority 1 incident.'
    description: Policy text
    synthetic: true
  - value: |-
      Post-incident review template
      Incident number: ________
      Duration: [insert]
    description: Blank template
    synthetic: true
  - value: 'Press release: the provider published its post-mortem after a four-hour outage on 12/09/2026.'
    description: News framing
    synthetic: true
false_positives:
- description: Public status-page post-mortems.
  mitigation: News/press framing is excluded; enforcement needs populated outage fields or internal artefacts.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The detector now requires RCA/post-incident wording plus populated outage fields or technical artefacts before enforcing. A genuine report can reveal architecture weaknesses, failed controls, customer impact, response gaps, and incomplete corrective work that supports repeat disruption or commercial criticism. The normal scope is one major service incident and its users, operators, and customers, while generic post-incident methods and templates can produce topic matches. Risk 8 SENSITIVE reflects serious contained operational and reputational harm; PROTECTED would require critical-service or significant broad consequences.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because a root-cause analysis
    exposes service weaknesses, response performance, and unresolved remediation. PROTECTED is not met without evidence
    of critical infrastructure, protected operations, or significant organisation-wide damage.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic handling is Medium with Medium InfoTech controls for outage analyses, restricting technical cause,
      customer impact, and remediation gaps. High is reserved for critical or protected services whose disclosure would
      cause significant damage.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_outage_rca_primary
    matches:
    - ref: Regex_outage_rca_outage_field
      min_count: 2
      unique_results: true
    - ref: Regex_outage_rca_tech_artefact
    - ref: Keyword_outage_rca_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_outage_rca_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_outage_rca_primary
    matches:
    - type: any
      refs:
      - Regex_outage_rca_outage_field
      - Regex_outage_rca_tech_artefact
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_outage_rca_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_outage_rca_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_outage_rca_primary
    pattern: >-
      (?i)\b(?:root[\s-]cause\s+analys[ie]s|RCA\s+(?:report|document|findings)|post[\s-]incident\s+(?:review|report)|post[\s-]mortem|major\s+(?:incident|outage)\s+(?:report|review))\b
  - id: Regex_outage_rca_outage_field
    pattern: >-
      (?i)\b(?:outage\s+(?:start|end|duration)|start\s+time|end\s+time|duration|impacted\s+(?:services?|users|customers)|incident\s+(?:no\.?|number|ID)|problem\s+(?:no\.?|number|ID)|severity|priority|change\s+(?:no\.?|number|ref))\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  - id: Regex_outage_rca_tech_artefact
    pattern: >-
      (?i)\b(?:INC|CHG|PRB)\d{7}\b|\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b20\d{2}-[01]\d-[0-3]\d[T ][0-2]\d:[0-5]\d
  keywords:
  - id: Keyword_outage_rca_context
    groups:
    - match_style: word
      terms:
      - contributing factor
      - corrective action
      - preventive action
      - customer impact
      - lessons learned
      - action owner
      - failover
      - rollback
      - detection
      - mitigation
    strength: specific
  - id: Keyword_outage_rca_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
created: '2026-02-08'
updated: '2026-09-25'
changelog:
- version: 1.3.2
  date: '2026-09-25'
  description: >-
    Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
    reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
- version: 1.3.0
  date: '2026-09-24'
  description: 'Quality pass (2026-09-24): primary narrowed to RCA/PIR/post-mortem wording (bare service disruption, corrective action removed); self-corroboration removed; 75 needs a populated outage field or technical artefact; 85 needs two outage fields, an artefact and RCA-outcome context; guidance/news exclusion; populated tests and decoys; GDPR replaced with SOCI Act; frameworks and NIST SP 800-61 reference added; credentials category removed.'
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1865 without changing detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
