schema: testpattern/v1
name: Immunization records
slug: global-top500-333-immunization-records
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies individual immunisation / vaccination records - immunisation history statements, vaccination records and certificates, register extracts and vaccine administration entries - when the phrase sits with populated patient identifiers and vaccine administration fields. Health information under applicable data protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: immunisation/vaccination record phrases (immunisation or immunization record/history/schedule/register/certificate/status, vaccination record/history/certificate/status, vaccine history or administration, booster dose, immunisation history statement). 65 (discovery only): phrase alone. 75: phrase plus a populated patient identifier field (name, DOB, Medicare, IHI, URN/MRN). 85: patient field plus a populated vaccine administration field (vaccine/brand, batch or lot number, dose number, date given, vaccinator, injection site) plus independent vaccine evidence (named vaccine or antigen such as influenza, MMR, DTPa, pneumococcal, hepatitis B, HPV, COVID-19, or AEFI). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:immuni[sz]ation\s+(?:records?|history(?:\s+statement)?|schedule|register|certificate|status)|vaccination\s+(?:records?|history|certificate|status)|vaccine\s+(?:history|administration)|booster\s+dose)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated patient identifier; 85 also needs a vaccine administration field and a named vaccine. Immunisation schedules, clinic flyers and public health campaigns carry the phrases but no patient field, so they stay at 65.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - My Health Records Act 2012 (Cth)
  - IPA 2009 (Qld)
  - GDPR
  - HIPAA
data_categories:
- healthcare
- phi
corroborative_evidence:
  keywords:
    - influenza
    - MMR
    - DTPa
    - pneumococcal
    - hepatitis B
    - COVID-19
  proximity: 300
test_cases:
  should_match:
    - value: "Immunisation history statement\nName: Riley Ashworth\nDate of birth: 14/05/2019\nMedicare number: 2953 17720 1\nVaccine: Priorix (MMR)\nDose number: 2\nDate given: 03/06/2024\nBatch number: AK2197\nVaccinator: RN Sam Ortiz"
      description: Populated immunisation record with patient identifiers, administration fields and a named vaccine (85)
      synthetic: true
    - value: "Vaccination record request\nPatient name: Jordan Whitlock\nDOB: 22/11/1987\nRequested for travel clearance."
      description: Vaccination record request with labelled patient identifiers only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "patient biometric"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how immunisation records are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Vaccination record\nPatient name: ____________________\nDate of birth: ____________________\nVaccine: ____________________\nBatch number: ____________________\nDate given: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: the 2026 immunisation schedule adds a booster dose of pneumococcal vaccine for adults over 70, and clinics are reminding families to check their vaccination status before winter influenza season."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Medical terminology in health education materials, research publications, clinical guidelines, or public health
    documents without patient-specific data.
  mitigation: Require corroborative evidence keywords confirming patient context. Look for co-occurrence with patient identifiers
    such as medical record numbers or dates of birth.
- description: General wellness and fitness content using medical vocabulary without constituting protected health information.
  mitigation: Layer with patient identifier patterns or healthcare-specific document structure detection to distinguish clinical
    records from general health content.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  This medium-confidence regex finds immunisation and vaccination record phrases and enforces only when populated patient identifier fields (with vaccine administration fields at 85) sit nearby; phrase-only text stays at 65 discovery. A true record can reveal dates, products, eligibility categories, exemptions, or access decisions and could support limited profiling or document fraud against the patient. Most routine histories are narrow preventive-care records with less diagnostic depth than pathology, consultation, or treatment notes, and benign public-health or education matches remain possible. Risk 6 and SENSITIVE reflect credible privacy harm; risk 8 or PROTECTED requires sensitive exemption reasons, adverse-event detail, a linked clinical dossier, bulk registry exposure, or safety-critical outbreak operations.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_immunization_records
      matches:
        - ref: Regex_global_top500_333_immunization_records_patient_fields
        - ref: Regex_global_top500_333_immunization_records_administration_fields
        - ref: Keyword_global_top500_333_immunization_records_vaccine_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_333_immunization_records_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_immunization_records
      matches:
        - ref: Regex_global_top500_333_immunization_records_patient_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_333_immunization_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_immunization_records
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_immunization_records
      pattern: (?i)\b(?:immuni[sz]ation\s+(?:records?|history(?:\s+statement)?|schedule|register|certificate|status)|vaccination\s+(?:records?|history|certificate|status)|vaccine\s+(?:history|administration)|booster\s+dose)\b
    - id: Regex_global_top500_333_immunization_records_patient_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|patient(?:\s+name)?|URN|UR\s*(?:no\.?|number)|MRN|medical\s+record\s+(?:no\.?|number)|Medicare(?:\s+(?:card\s+)?(?:no\.?|number))?|IHI|DVA\s+(?:no\.?|number)|(?:patient|client|hospital|case|file|episode)\s*(?:no\.?|number|ID)|(?:referring|treating|requesting)\s+(?:doctor|practitioner|clinician|psychiatrist)|clinician|consultant)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_333_immunization_records_administration_fields
      pattern: (?i)\b(?:vaccine(?:\s+(?:brand|name|given))?|batch(?:\s+(?:no\.?|number))?|lot(?:\s+(?:no\.?|number))?|dose(?:\s+(?:no\.?|number))?|date\s+(?:given|administered|of\s+vaccination)|vaccinator|immuni[sz]ation\s+provider|(?:injection\s+)?site(?:\s+of\s+injection)?)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_333_immunization_records_vaccine_evidence
      groups:
        - match_style: word
          terms:
            - influenza
            - text: MMR
              case_sensitive: true
            - DTPa
            - pneumococcal
            - hepatitis B
            - text: HPV
              case_sensitive: true
            - COVID-19
            - meningococcal
            - varicella
            - rotavirus
            - adverse event following immunisation
            - text: AEFI
              case_sensitive: true
      strength: specific
    - id: Keyword_global_top500_333_immunization_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
