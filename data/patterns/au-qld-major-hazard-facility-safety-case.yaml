schema: testpattern/v1
name: Queensland Major Hazard Facility Safety Case or Hazardous Chemicals Manifest
slug: au-qld-major-hazard-facility-safety-case
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Queensland major hazard facility (MHF) safety case outlines and safety cases under the Work Health and Safety Regulation 2011 (Qld) chapter 9 (ss 551-561, Schedule 18: facility description, process flow drawings, general layout drawings locating major incident hazards and initiators, security arrangements), and manifests of hazardous chemicals under s 347 and Schedule 12 (UN number, proper shipping name, class and division, container and storage area identification, after-hours contacts). Populated versions give a hostile reader a map of what is stored where and how the site is protected.
operation: >-
  Primary: MHF / safety case outline / manifest of hazardous chemicals anchors from WHS Regulation 2011 (Qld) ch 7 and ch 9. 65 is discovery-only (primary alone) and will surface the Regulation, Safe Work guidance, local community information and blank manifest templates. 75 requires, within 300 characters, either a populated Schedule 12 / Schedule 18 field (UN number, proper shipping name, class and division, container or storage area ID, tank ID, drawing number, site address, after-hours contact, security zone or gate with a non-placeholder value) or a manifest table row (UN number followed by an upper-case proper shipping name and a class). 85 requires two distinct populated fields plus independent security or major-incident content (security arrangements, unsupervised access, key register, CCTV, intruder alarm, major incident hazard or initiator, process flow or general layout drawing). All tiers exclude template/fixture text and the pattern-specific exclusion group (local community information, fact sheets, safety data sheet transport sections, media releases).
pattern: (?i)\b(?:major\s+hazard\s+facilit(?:y|ies)|MHF\s+(?:safety\s+case|licence)|safety\s+case\s+outline|manifest\s+of\s+hazardous\s+chemicals|hazardous\s+chemicals?\s+manifest)\b
confidence: medium
confidence_justification: >-
  Medium: the primary anchors are statutory terms that also appear in the Regulation, Safe Work Australia and WHSQ guidance, community information and blank manifest templates, so enforce tiers need populated Schedule 12 / Schedule 18 structure. 85/75 are heuristic evidence tiers, not measured accuracy; the test values are synthetic records laid out like Schedule 12 manifests and Schedule 18 safety case sections.
jurisdictions:
  - au
regulations:
  - Work Health and Safety Regulation 2011 (Qld)
frameworks:
  - QGISCF
data_categories:
  - infrastructure
  - security
corroborative_evidence:
  keywords:
    - security arrangements
    - unsupervised access
    - key register
    - major incident hazard
    - major incident initiator
    - process flow drawing
    - general layout drawing
    - CCTV
    - intruder alarm
  proximity: 300
test_cases:
  should_match:
    - value: "Pelican Point Ammonia Terminal (Teston Chemicals Pty Ltd) - major hazard facility safety case, section 4 security arrangements\nStorage area ID: SA-03 bulk ammonia\nUN number: 1005\nProper shipping name: AMMONIA, ANHYDROUS\nClass and division: 2.3 (8)\nMajor incident hazards: loss of containment at tank T-201; unsupervised access to the jetty manifold is limited to six operators on the key register."
      description: Safety case security section with populated Schedule 12 fields and security content (intended 85)
      synthetic: true
    - value: "Manifest of hazardous chemicals - Teston Fertilisers, Stapylton\nDate last amended: 02/09/2026\nUN1942 | AMMONIUM NITRATE | 5.1 | Store B\nUN2067 | AMMONIUM NITRATE BASED FERTILIZER | 5.1 | Store C"
      description: Populated manifest table rows without security content (intended 75)
      synthetic: true
    - value: "Safety case outline - Teston Refinery MHF\nDrawing no.: PFD-1102 Rev C (crude unit)\nThe draft emergency plan and a summary of the arrangements for site security are at Appendix D."
      description: Safety case outline citing one populated drawing reference (intended 75)
      synthetic: true
    - value: "Hazardous chemicals manifest - Teston Water Treatment Plant (major hazard facility)\nContainer identification: T-104\nUN number: 1017\nProper shipping name: CHLORINE\nClass and division: 2.3\nAfter hours contact: Jordan Teston 0491 570 156\nChlorine drum store has CCTV and an intruder alarm monitored off site."
      description: Manifest for an MHF with container, UN and contact fields plus security content (intended 85)
      synthetic: true
  should_not_match:
    - value: "552 Content. A safety case outline provided under section 551 must include (e) a draft emergency plan and (f) a summary of any arrangements that are to be made in relation to the security of the major hazard facility."
      description: Regulation text (legislation decoy, stays at 65)
    - value: "Manifest of hazardous chemicals\nName of PCBU: __________\nUN number: __________\nProper shipping name: __________\nClass and division: __________\nStorage area ID: [enter ID]"
      description: Blank manifest template
    - value: "Information for the local community - Teston Chemicals major hazard facility, Pinkenba\nSite address: 12 Wharf Road, Pinkenba QLD 4008\nIf you hear the site siren, go inside, close windows and listen to local radio."
      description: Public s 572 community information leaflet
    - value: "Training exercise: complete a mock manifest of hazardous chemicals for a small depot.\nUN number: 1203\nProper shipping name: PETROL\nClass and division: 3"
      description: Training exercise
    - value: "SECTION 14: Transport information\nUN number: 1942\nProper shipping name: AMMONIUM NITRATE\nClass and division: 5.1\nSECTION 15: Regulatory information - Schedule 15 chemical; threshold applies for major hazard facilities."
      description: Safety data sheet transport and regulatory sections
    - value: Queensland has about 40 licensed major hazard facilities, including LPG depots, ammonium nitrate plants and refineries, the regulator said in a media release.
      description: News / media release
false_positives:
  - description: The Regulation, Safe Work Australia and WHSQ guides for major hazard facilities, and blank manifest templates.
    mitigation: No populated field values; placeholders (blank lines, brackets, n/a, tbc) are rejected, and template/fixture framing is excluded.
  - description: Public information for the local community (s 572) that names the facility and its address.
    mitigation: The pattern-specific exclusion group removes local community information, fact sheets and media releases within the proximity window. An operator who pastes that leaflet text into a real safety case section loses the hit for that section only.
  - description: Safety data sheets (section 14 transport information lists UN number, proper shipping name and class).
    mitigation: SDS section headings (transport information, regulatory information, safety data sheet) are in the exclusion group.
  - description: Dangerous goods transport documents at non-MHF sites.
    mitigation: The primary requires an MHF, safety case outline or hazardous chemicals manifest anchor; placarding-only documents stay out.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_mhf_safety_case_primary
      matches:
        - ref: Regex_au_qld_mhf_safety_case_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_mhf_safety_case_security_content
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_mhf_safety_case_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_mhf_safety_case_primary
      matches:
        - type: any
          refs:
            - Regex_au_qld_mhf_safety_case_record_structure
            - Regex_au_qld_mhf_safety_case_manifest_row
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_mhf_safety_case_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_mhf_safety_case_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_mhf_safety_case_exclusion
  regexes:
    - id: Regex_au_qld_mhf_safety_case_primary
      pattern: >-
        (?i)\b(?:major\s+hazard\s+facilit(?:y|ies)|MHF\s+(?:safety\s+case|licence)|safety\s+case\s+outline|manifest\s+of\s+hazardous\s+chemicals|hazardous\s+chemicals?\s+manifest)\b
    - id: Regex_au_qld_mhf_safety_case_record_structure
      pattern: >-
        (?i)\b(?:UN\s+(?:no\.?|number)|proper\s+shipping\s+name|class\s+(?:and|&|/)\s+division|container\s+(?:ID|identification(?:\s+(?:number|code))?|no\.?|code)|storage\s+area(?:\s+(?:ID|no\.?|number|code))?|tank\s+(?:ID|no\.?|number)|drawing\s+(?:no\.?|number|ref(?:erence)?)|(?:site|workplace|facility)\s+address|after[\s-]+hours\s+(?:contact|phone|telephone)(?:\s+(?:no\.?|number))?|security\s+(?:zone|gate|access\s+point))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,40}(?:[ \t]+[A-Za-z0-9][A-Za-z0-9/'.,()-]{0,30}){0,4}
    - id: Regex_au_qld_mhf_safety_case_manifest_row
      pattern: >-
        \bUN\s?\d{4}\b[ \t|,;]{1,6}[A-Z][A-Z0-9 ,()'-]{3,60}[ \t|,;]{1,6}[1-9](?:\.[1-6])?[A-Z]?\b
  keywords:
    - id: Keyword_au_qld_mhf_safety_case_security_content
      groups:
        - match_style: word
          terms:
            - security arrangements
            - security of the major hazard facility
            - site security
            - unsupervised access
            - access control
            - key register
            - CCTV
            - intruder alarm
            - perimeter fence
            - security risk assessment
            - major incident hazard
            - major incident hazards
            - major incident initiator
            - major incident initiators
            - process flow drawing
            - general layout drawing
            - scale plan
      strength: specific
    - id: Keyword_au_qld_mhf_safety_case_exclusion
      groups:
        - match_style: word
          terms:
            - information for the local community
            - community information sheet
            - guide for major hazard facilities
            - fact sheet
            - information sheet
            - media release
            - safety data sheet
            - transport information
            - regulatory information
            - how to complete this manifest
      strength: specific
risk_rating: 8
risk_description: >-
  A populated MHF safety case or hazardous chemicals manifest tells a reader which Schedule 15 chemicals are held, in what quantities and containers, where they sit on the site layout, which events can initiate a major incident and how the site is secured. That is targeting information for sabotage or theft at a facility whose failure can harm the surrounding community. The Regulation gives no confidentiality regime beyond the operator's right to withhold security-exposing information from other facilities (s 562(3)) and the community (s 572(3)), so these documents rely on the operator's own handling. Risk 8 supports SENSITIVE; PROTECTED is not justified for a single facility's documents.
