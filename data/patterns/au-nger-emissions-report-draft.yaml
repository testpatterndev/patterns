schema: testpattern/v1
name: NGER Emissions and Energy Report Working Papers (Pre-Lodgement) and Safeguard Working Papers
slug: au-nger-emissions-report-draft
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Working and draft National Greenhouse and Energy Reporting (NGER) material before it is lodged with, or published by,
  the Clean Energy Regulator: section 19 reports being prepared in EERS (the Emissions and Energy Reporting System),
  facility details under NGER Regulations reg 4.04A (facility name, address, facility identification number, industry
  sector), facility-level Scope 1 and Scope 2 emissions in t CO2-e, energy production and consumption in GJ / MWh,
  fuel activity data, method selections, NGER Act s 23 audit information (audit team leader, assurance findings), and
  Safeguard Mechanism working papers (responsible emitter, covered emissions, baseline emissions number, net position
  number, SMC / ACCU surrender planning, declared multi-year periods). The CER's own published data (corporate and
  electricity sector CSVs released by 28 February, the Safeguard baselines and emissions table released by 15 April)
  is public and is excluded from enforce tiers.
operation: >-
  Primary: NGER / National Greenhouse and Energy Reporting, "section 19 report", EERS / Emissions and Energy Reporting
  System, Safeguard Mechanism / Safeguard facility / Safeguard baseline, "baseline emissions number", "safeguard
  mechanism credit unit", "declared multi-year period", "multi-year monitoring period" or "designated large facility".
  65 is discovery-only (primary alone) and will surface CER guidance, legislation and published data. 75 requires one
  populated structure within 300 characters: a labelled NGER field with a non-placeholder value (facility name,
  facility identification number, controlling / reporting / registered corporation, responsible emitter, reporting
  year, facility address, latitude / longitude, industry sector, ANZSIC, audit team leader, production variable,
  monitoring period) or an emissions / energy quantity line (Scope 1/2, covered emissions, net emissions number, gas
  species, energy produced / consumed, electricity produced, fuel type followed by a number with t CO2-e, GJ, TJ, PJ,
  MWh, GWh, kL, ML, kg or t, or a label-colon value for the Safeguard quantities such as net position number, ACCUs
  surrendered, SMCs issued or borrowing adjustment). 85 requires a labelled field plus a quantity line, or two
  distinct quantity lines, plus independent evidence: an NGER working term (section 19, operational control, Method
  1-4, uncertainty, s 23 audit information, reasonable / limited assurance, EERS submission, draft / not yet
  submitted / working paper, Measurement Determination) or a public-format ACCU serial range or ERF project ID, which
  are supporting evidence only. Every tier excludes template/fixture text; enforce tiers also exclude CER published
  data signals (the exact CSV column headings, cer.gov.au / cleanenergyregulator.gov.au / legislation.gov.au URLs,
  compilation headers, "Civil penalty:", guide and fact-sheet framing).
pattern: (?i)\b(?:NGER|National\s+Greenhouse\s+and\s+Energy\s+Report(?:ing|s)?|(?:section|s\.?)\s?19\s+report|EERS|Emissions\s+and\s+Energy\s+Reporting\s+System|Safeguard\s+(?:Mechanism|facility|baseline)|baseline\s+emissions\s+number|safeguard\s+mechanism\s+credit\s+units?|declared\s+multi-year\s+period|multi-year\s+monitoring\s+period|designated\s+large\s+facility)\b
confidence: medium
confidence_justification: >-
  Medium: the primary terms are statutory and distinctive, but CER guides, the NGER Act and Regulations and the CER's
  published data all use them, and the NGER facility identification number and reporter ID formats are not public, so
  there is no identifier to anchor on. Enforce tiers depend on populated facility fields and quantity lines with NGER
  units, and published-data column headings are excluded. A generator's facility-level totals become public after 28
  February, so the classifier is aimed at the working detail and pre-lodgement drafts. 85/75 are heuristic evidence
  tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - National Greenhouse and Energy Reporting Act 2007 (Cth) ss 19, 23, 24, 25 and Part 3H
  - National Greenhouse and Energy Reporting Regulations 2008 (Cth) Part 4 (regs 4.04, 4.04A, 4.16, 4.17B, 4.19-4.22)
  - National Greenhouse and Energy Reporting (Safeguard Mechanism) Rule 2015 (Cth)
  - Clean Energy Regulator Act 2011 (Cth) s 43
frameworks:
  - QGISCF
  - PSPF
data_categories:
  - environment
  - energy-market
  - business
corroborative_evidence:
  keywords:
    - section 19
    - operational control
    - Method 1
    - Method 2
    - Method 3
    - Method 4
    - uncertainty
    - audit information
    - reasonable assurance
    - limited assurance
    - Measurement Determination
    - not yet submitted
    - working paper
  proximity: 300
customisation:
  - key: nger-facility-id
    kind: identifier-format
    identifier: nger-facility-id
    target: purview.regexes/Regex_au_nger_emissions_report_draft_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's nger facility identification number format (see docs/identifiers.md#nger-facility-id). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "DRAFT - NGER section 19 report, reporting year 2025-26 (not yet submitted in EERS)\nControlling corporation: Marlow Ridge Energy Holdings Pty Ltd\nFacility name: Tarrant Creek Power Station\nScope 1 emissions: 4,812,406 t CO2-e (Method 2 for black coal combustion)\nScope 2 emissions: 18,220 t CO2-e\nBlack coal consumed: 52,340,118 GJ\nElectricity produced: 5,120,774 MWh"
      description: 85 tier - pre-lodgement s 19 report with controlling corporation, facility name and Scope 1 / Scope 2 / energy quantity lines plus Method and not-yet-submitted evidence
      synthetic: true
    - value: "Safeguard facility working paper - declared multi-year period (draft for CFO)\nResponsible emitter: Brindle Coal Pty Ltd\nFacility name: Brindle North Mine\nCovered emissions (t CO2-e): 1,284,550\nBaseline emissions number (t CO2-e): 1,190,300\nNet position number: 94,250\nACCUs to be surrendered from serial range 3,605,318,522 - 3,605,412,771 (project ERF900417)."
      description: 85 tier - Safeguard surrender working paper with responsible emitter and populated covered emissions / baseline / net position, ACCU serial range and ERF ID as supporting evidence
      synthetic: true
    - value: "EERS submission working paper - NGER facility energy data\nNatural gas consumed: 3,410,220 GJ\nElectricity produced: 412,800 MWh\nAll three units are under the operational control of Kestrel Gully Generation Pty Ltd."
      description: 85 tier - two distinct energy quantity lines plus operational control statement
      synthetic: true
    - value: "NGER facility details (reg 4.04A)\nFacility name: Kestrel Gully Gas Plant\nIndustry sector confirmation is outstanding."
      description: 75 tier - facility details with one populated field and no quantity line
      synthetic: true
    - value: "NGER audit (s 23 audit information) - reasonable assurance engagement\nAudit team leader: Priya Venn\nFindings: 3 material misstatements in diesel activity data for the Harlow depot."
      description: 75 tier - audit working paper with a named audit team leader and no quantity line
      synthetic: true
  should_not_match:
    - value: "Corporate emissions and energy data 2024-25 (NGER)\nOrganisation name, Identifying details, Total scope 1 emissions (t CO2-e), Total scope 2 emissions (t CO2-e), Net energy consumed (GJ), Important notes\nMarlow Ridge Energy Holdings Pty Ltd, 12 345 678 901, 4812406, 18220, 60120334,"
      description: CER published corporate data CSV (published by 28 February) - excluded by the column headings
    - value: "Electricity sector emissions and generation data 2024-25 (NGER)\nReporting entity, Facility name, Type, State, Electricity production (GJ), Electricity production (MWh), Total scope 1 emissions (t CO2-e), Total scope 2 emissions (t CO2-e), Total emissions\nMarlow Ridge Energy Holdings Pty Ltd, Tarrant Creek Power Station, Black coal, QLD, 18434786, 5120774, 4812406, 18220, 4830626"
      description: CER published electricity sector CSV - excluded by the column headings
    - value: "Safeguard baselines and emissions table 2024-25\nFacility name, Responsible emitter, State/Territory of operation, ANZSIC, ERC, Baseline emissions number, Covered emissions, Borrowing adjustment amount, ACCUs issued, ACCUs deemed surrendered, ACCUs surrendered, SMCs surrendered, Net emissions number, Net position number"
      description: CER published Safeguard table header (published by 15 April)
    - value: "19 Report to be given to the Regulator. (1) A registered corporation must, before the end of 4 months after the end of the financial year, provide the Regulator with a report relating to the greenhouse gas emissions, energy production and energy consumption from the operation of facilities under the operational control of the corporation. Civil penalty: 2,000 penalty units. This is an NGER Act section 19 report obligation."
      description: NGER Act s 19 legislation text
    - value: "NGER section 19 report\nControlling corporation: __________\nFacility name: __________\nFacility identification number: [enter]\nScope 1 emissions (t CO2-e): ____\nEnergy consumed (GJ): ____"
      description: Blank reporting form
    - value: "NGER reporting training exercise\nFacility name: Sunnyvale Power Station\nScope 1 emissions: 1,000,000 t CO2-e\nBlack coal consumed: 10,000,000 GJ"
      description: Training exercise (template-exclusion)
    - value: "Queensland's largest coal generators reported more than 30 million tonnes of emissions in the latest NGER data, the Clean Energy Regulator said on Friday."
      description: News reporting on published NGER data
false_positives:
  - description: CER published corporate, electricity sector and Safeguard data (CSV and web tables), which are public from 28 February / 15 April.
    mitigation: The exact published CSV column headings, "Important notes", "Identifying details" and cer.gov.au / cleanenergyregulator.gov.au URLs are enforce-tier exclusions; published CSV rows carry numbers without labels or units, so they do not satisfy the quantity structure.
  - description: NGER Act, Regulations, Measurement Determination and Safeguard Rule text, CER reporting guides and EERS user guides.
    mitigation: Guidance uses the labels without populated values; legislation.gov.au, compilation headers, "Civil penalty:" and guide / fact-sheet framing are excluded from enforce tiers.
  - description: A genuine internal report that reconciles against a pasted copy of the CER published CSV headings will be suppressed.
    mitigation: Accepted trade-off to keep published data out of enforce tiers; such documents still surface at 65 discovery.
  - description: Voluntary or corporate greenhouse inventories that mention NGER in passing with Scope 1 figures.
    mitigation: These are usually also pre-publication emissions data; scope the policy to the finance / environment teams if they are not wanted.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_nger_emissions_report_draft_primary
      matches:
        - ref: Regex_au_nger_emissions_report_draft_field
        - ref: Regex_au_nger_emissions_report_draft_quantity
        - type: any
          refs:
            - Keyword_au_nger_emissions_report_draft_corroborative
            - Regex_au_nger_emissions_report_draft_supporting
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_nger_emissions_report_draft_published_exclusion
    - confidence_level: 85
      id_match: Regex_au_nger_emissions_report_draft_primary
      matches:
        - ref: Regex_au_nger_emissions_report_draft_quantity
          min_count: 2
          unique_results: true
        - type: any
          refs:
            - Keyword_au_nger_emissions_report_draft_corroborative
            - Regex_au_nger_emissions_report_draft_supporting
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_nger_emissions_report_draft_published_exclusion
    - confidence_level: 75
      id_match: Regex_au_nger_emissions_report_draft_primary
      matches:
        - type: any
          refs:
            - Regex_au_nger_emissions_report_draft_field
            - Regex_au_nger_emissions_report_draft_quantity
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_nger_emissions_report_draft_published_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_nger_emissions_report_draft_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_nger_emissions_report_draft_primary
      pattern: >-
        (?i)\b(?:NGER|National\s+Greenhouse\s+and\s+Energy\s+Report(?:ing|s)?|(?:section|s\.?)\s?19\s+report|EERS|Emissions\s+and\s+Energy\s+Reporting\s+System|Safeguard\s+(?:Mechanism|facility|baseline)|baseline\s+emissions\s+number|safeguard\s+mechanism\s+credit\s+units?|declared\s+multi-year\s+period|multi-year\s+monitoring\s+period|designated\s+large\s+facility)\b
    - id: Regex_au_nger_emissions_report_draft_field
      pattern: >-
        (?i)\b(?:facility\s+(?:name|identification\s+number|ID)|controlling\s+corporation|reporting\s+(?:corporation|entity)|registered\s+corporation|responsible\s+emitter|reporting\s+year|facility\s+(?:street\s+)?address|latitude|longitude|industry\s+sector|ANZSIC(?:\s+code)?|audit\s+team\s+leader|lead\s+auditor|production\s+variable|monitoring\s+period)(?:\s*\([^)\n]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|enter|insert)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/&'.,-]{0,60}(?:[ \t]+[A-Za-z0-9&'.,/-]{1,30}){0,4}
    - id: Regex_au_nger_emissions_report_draft_quantity
      pattern: >-
        (?i)(?:\b(?:scope\s+[12](?:\s+emissions)?|total\s+(?:scope\s+[12]\s+)?emissions|covered\s+emissions|net\s+emissions\s+number|baseline\s+emissions\s+number|CO2|methane|CH4|nitrous\s+oxide|N2O|SF6|fugitive\s+emissions|energy\s+(?:produced|production|consumed|consumption)|net\s+energy\s+consumed|electricity\s+(?:produced|production|generated|sent\s+out)|black\s+coal|brown\s+coal|natural\s+gas|diesel(?:\s+oil)?|fuel\s+oil|LPG)\b[^\n]{0,60}?\b\d{1,3}(?:[, ]\d{3}){0,4}(?:\.\d{1,3})?\s*(?:[kM]?t\s?CO2-?e|tonnes?\s+(?:of\s+)?CO2-?e|GJ|TJ|PJ|MWh|GWh|kL|ML|kg|t|tonnes?)\b|\b(?:scope\s+[12]\s+emissions|total\s+(?:scope\s+[12]\s+)?emissions|covered\s+emissions|net\s+emissions\s+number|baseline\s+emissions\s+number|net\s+position\s+number|ACCUs?\s+(?:issued|surrendered|to\s+be\s+surrendered|deemed\s+surrendered)|SMCs?\s+(?:issued|surrendered|held)|units\s+relinquished|borrowing\s+adjustment(?:\s+amount)?)(?:\s*\([^)\n]{1,15}\))?\s*[:=|]\s*-?\d{1,3}(?:[, ]\d{3}){0,4}(?:\.\d{1,3})?\b)
    - id: Regex_au_nger_emissions_report_draft_supporting
      pattern: >-
        \b(?:ERF\d{6}|\d{1,3}(?:,\d{3}){3}\s?[-–]\s?\d{1,3}(?:,\d{3}){3})\b
    - id: Regex_au_nger_emissions_report_draft_published_exclusion
      pattern: >-
        (?i)(?:\bcer\.gov\.au|\bcleanenergyregulator\.gov\.au|\blegislation\.gov\.au|\bCompilation\s+(?:No\.|date)|\bCivil\s+penalty\s*:|\bIdentifying\s+details\s*,|\bImportant\s+notes\b|\bElectricity\s+production\s+\((?:GJ|MWh)\)\s*,|\bTotal\s+scope\s+1\s+emissions\s+\(t\s?CO2-?e\)\s*,|\bBaseline\s+emissions\s+number\s*,\s*Covered\s+emissions|\bCumulative\s+MYMP\s+net|\bpublished\s+data\s+highlights|\bdata\s+highlights\b|\bthis\s+(?:guideline|guide|fact\s?sheet|article|webinar|explainer)\b|\bgeneral\s+information\s+only\b|\bpenalty\s+units\b)
  keywords:
    - id: Keyword_au_nger_emissions_report_draft_corroborative
      groups:
        - match_style: word
          terms:
            - section 19
            - s 19
            - operational control
            - Method 1
            - Method 2
            - Method 3
            - Method 4
            - uncertainty
            - audit information
            - reasonable assurance
            - limited assurance
            - Measurement Determination
            - emissions intensity determination
            - not yet submitted
            - prior to submission
            - before lodgement
            - working paper
            - text: DRAFT
              case_sensitive: true
            - activity data
            - reporting transfer certificate
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier identifies an entity's own NGER and Safeguard working material before lodgement or publication:
  draft section 19 reports, facility details, per-source fuel and energy quantities, method selections, s 23 audit
  information and Safeguard surrender planning, gated on populated fields and quantity lines. Facility and group totals
  for generators are published by the Clean Energy Regulator after 28 February and Safeguard data by 15 April, but the
  working detail is never published and is protected information in the CER's hands (CER Act s 43). Before release it
  can be market-sensitive for listed and trading entities (production, fuel mix, unit surrender liabilities) and it
  carries compliance exposure under the NGER Act. Published CER data, legislation and guidance are excluded from
  enforce tiers. Risk 7 supports SENSITIVE Commercial-in-Confidence.
