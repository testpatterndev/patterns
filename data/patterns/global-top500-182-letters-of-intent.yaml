schema: testpattern/v1
name: Letters of intent
slug: global-top500-182-letters-of-intent
version: 1.6.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to letters of intent in Australian contexts. This information type is classified as personally identifiable information under applicable data protection
  regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 6 keywords within 300 characters.'
pattern: >-
  (?is)\b(letters\s+of\s+intent|letter\s+of\s+intent|non[\s-]+binding\s+offer|binding\s+offer|preliminary\s+agreement|heads\s+of\s+agreement|memorandum\s+of\s+understanding|intent\s+to\s+acquire|acquisition\s+proposal|merger\s+proposal|indicative\s+offer)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - letters of intent
    - letters
    - intent
    - mergers
    - acquisitions
    - strategy
  proximity: 300
test_cases:
  should_match:
    - value: letters of intent
      description: Primary topic phrase match
    - value: letter of intent
      description: Case-insensitive topic phrase match
    - value: non-binding offer
      description: Alternative topic phrase match
    - value: binding offer
      description: Additional topic phrase match
    - value: |-
        Letters of intent
        To: Executive Committee
        From: Chief Financial Officer
        Date: 14 August 2026
        Subject: Letters of intent - FY27 review
      description: Populated document header reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: merger fundraising
      description: Generic word pair from old broad template should not match
    - value: |-
        Letters of intent:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about letters of intent are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to letters of intent appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_letters_of_intent
      matches:
        - ref: Regex_global_top500_182_letters_of_intent_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_letters_of_intent
      matches:
        - ref: Regex_global_top500_182_letters_of_intent_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_letters_of_intent
      matches:
        - ref: Evidence_letters_of_intent
        - ref: Regex_global_top500_182_letters_of_intent_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_letters_of_intent
  regexes:
    - id: Pattern_letters_of_intent
      pattern: >-
        (?is)\b(letters\s+of\s+intent|letter\s+of\s+intent|non[\s-]+binding\s+offer|binding\s+offer|preliminary\s+agreement|heads\s+of\s+agreement|memorandum\s+of\s+understanding|intent\s+to\s+acquire|acquisition\s+proposal|merger\s+proposal|indicative\s+offer)\b
    - id: Regex_global_top500_182_letters_of_intent_record_structure
      pattern: (?i)\b((?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$])
  keywords:
    - id: Evidence_letters_of_intent
      groups:
        - match_style: word
          terms:
            - text: LOI
              case_sensitive: true
      strength: specific
risk_description: >-
  This regex targets letters of intent, binding or non-binding offers, exclusivity, and transaction terms, aiming at a negotiated legal instrument rather than the abbreviation LOI alone. A genuine letter can reveal price, conditions, timelines, exclusivity, proposed structure, and counterpart identities, allowing competitors or market participants to disrupt the deal and weakening each party's bargaining position. The medium-confidence concept rule can also find templates, academic examples, or already-announced arrangements. Risk 8 and SENSITIVE Legal fit serious but contained negotiation and contractual harm; PROTECTED would require a nationally strategic transaction, protected government interest, or compromise capable of significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  idcf: DSL-3
  idcf_marker: Legal Privilege
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Personal-Privacy because a live letter of
    intent can reveal nonpublic deal terms and identifiable negotiating parties. PROTECTED is not met for a normal
    bounded transaction without systemic market impact, protected policy, or significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy handling suit confidential preliminary deal terms and the organizations or
      people negotiating them. High is reserved for exceptionally consequential protected or systemic transactions.
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.6.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.5.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires 2 distinct independent populated document header fields (Regex_global_top500_182_letters_of_intent_record_structure), or one remaining corroborative term plus one field; 85 requires 3 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (confidential). Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.4.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 783 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-04'
    description: case/evidence metadata update
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
