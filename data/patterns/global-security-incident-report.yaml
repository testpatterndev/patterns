schema: testpattern/v1
name: Security Incident Report
slug: global-security-incident-report
version: 1.5.2
type: regex
pattern_class: concept
engine: boost_regex
description: 'Detects populated cyber security incident reports: incident report / post-incident review titles together with incident record fields (incident ID, severity, detection time, affected hosts, source IPs) or technical artefacts (IPv4 addresses, CVE identifiers).'
operation: 'Primary: security incident report/analysis, cyber (security) incident, incident investigation/forensic report, post-incident review/analysis. 65 (discovery only) = primary alone. 75 = primary plus one populated incident record field (incident/ticket ID, severity, priority, detected / date reported, reported by, affected host/system/asset/user, hostname, source/destination IP, malware family, hash) or a technical artefact (IPv4 address, CVE ID). 85 = primary plus two distinct structure hits plus independent response or root-cause evidence (containment, eradication, forensic analysis, indicators of compromise, root cause, contributing factor ...). All tiers exclude template/fixture text. Converted from keyword_list to a tier-gated regex classifier; the legacy top-level keyword list is kept as descriptive metadata only.'
pattern: (?i)\b(?:security\s+incident\s+(?:report|analysis)|cyber\s*(?:security)?\s+incident|incident\s+(?:investigation|forensic)\s+report|post[\s-]?incident\s+(?:review|analysis))\b
confidence: medium
confidence_justification: 'Medium: incident-report titles also appear in policy, guidance and news, so enforcement requires populated incident fields or technical artefacts; 85 adds response/root-cause evidence.'
jurisdictions:
  - global
regulations:
  - NDB Scheme (Cth)
  - Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- CIS Controls
- DISP
- ISO 27001
- NIST CSF
- PCI-DSS
- SOC 2
data_categories:
  - security
test_cases:
  should_match:
    - value: |-
        Security incident report - INC-2026-0412
        Severity: High
        Detected: 12/08/2026 02:14 AEST
        Affected host: fin-app02.corp.internal (10.20.30.41)
        Source IP: 203.0.113.77
        Root cause: unpatched CVE-2025-21298 allowed code execution; containment completed by isolating the host.
      description: 85 - populated incident record with technical artefacts and root-cause/containment evidence
      synthetic: true
    - value: |-
        Post-incident review
        Incident ID: SIR-0917
        Reported by: Service Desk
        Two staff reported the same phishing email; no further action required.
      description: 75 - populated incident fields without response or root-cause evidence
      synthetic: true
    - value: Security incident report received for review.
      description: 65 discovery - title only
    - value: 'Security incident report: forensic analysis and root cause analysis findings'
      description: 65 discovery - title and topic words without populated fields
  should_not_match:
    - value: Security guard incident report
      description: Physical security usage
    - value: Minor traffic incident
      description: Traffic usage
    - value: Our incident response policy explains how a security incident report is written, reviewed and closed, and who approves containment actions.
      description: Policy guidance - no populated incident fields (65 at most)
    - value: |-
        Security incident report form
        Incident ID: ________
        Severity: [select]
        Affected host: ________
        Source IP: <address>
      description: Blank report template - placeholder fields are rejected
    - value: The council confirmed a cyber security incident on Monday and said a post-incident review would be published next month.
      description: News item - no populated incident fields
    - value: Sample template for documenting a cyber event, causal findings, and containment actions.
      description: Adjacent template language is not a populated cyber-incident record
    - value: 'Data breach report: OAIC notification sent to affected individuals.'
      description: Sibling breach-report language does not satisfy the security-incident primary
false_positives:
  - description: Physical security or traffic incidents.
    mitigation: Require cyber-specific terms like IOC, forensic analysis, or malware analysis.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  The keyword list distinguishes cyber incident reports using forensic analysis, root cause, indicators of compromise, attack-vector, and containment evidence, while traffic or guard incidents are explicit non-matches. Disclosure can reveal successful techniques, investigative visibility, threat attribution, and unfinished remediation to the same actor or a copycat. The normal report concerns one incident and affected environment and does not necessarily establish critical-service impact or broad privileged access. Risk 8 and SENSITIVE InfoTech reflect serious contained response exposure; PROTECTED requires severe critical-operations consequences, life-safety effects, or comparably significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: "CUI Specified"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Medium
  rationale: >-
    Risk 8 reconciles with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech and Medium because an incident
    report reveals affected hosts, source IPs, techniques that worked and unfinished containment. PROTECTED is not met
    because a single-incident report does not by itself establish critical-service impact or broad privileged access.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling fits a report that shows an attacker or copycat what succeeded and what defenders saw,
      bounded to one incident and environment.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_security_incident
      matches:
        - ref: Regex_global_security_incident_report_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 1
          refs:
            - Keyword_incident_response
            - Keyword_root_cause
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_security_incident
      matches:
        - ref: Regex_global_security_incident_report_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_security_incident
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_security_incident
      pattern: (?i)\b(?:security\s+incident\s+(?:report|analysis)|cyber\s*(?:security)?\s+incident|incident\s+(?:investigation|forensic)\s+report|post[\s-]?incident\s+(?:review|analysis))\b
    - id: Regex_global_security_incident_report_record_structure
      pattern: (?i)\b(?:incident\s+(?:ID|number|no\.?|reference|ref)|ticket\s+(?:ID|number|no\.?)|severity|priority|detected|detection\s+(?:time|date)|date\s+(?:detected|reported)|reported\s+by|affected\s+(?:hosts?|systems?|assets?|users?|accounts?)|hostname|asset\s+ID|(?:source|destination|attacker)\s+IP|user\s+account|malware\s+family|SHA-?256|MD5)\s*[:#]\s*(?!(?:n/?a|tbc|tba|unknown)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._:/@-]{1,63}|\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b|\bCVE-\d{4}-\d{4,7}\b
  keywords:
    - id: Keyword_incident_response
      groups:
        - match_style: word
          terms:
            - incident response
            - incident handling
            - containment
            - eradication
            - lessons learned
            - forensic analysis
            - forensic investigation
            - indicators of compromise
            - text: IOC
              case_sensitive: true
            - isolated the host
            - isolating the host
      strength: domain
    - id: Keyword_root_cause
      groups:
        - match_style: word
          terms:
            - root cause
            - root cause analysis
            - text: RCA
              case_sensitive: true
            - contributing factor
            - causal factor
            - post-mortem
      strength: specific
references:
  - title: ASD ACSC - Report a cyber security incident
    url: https://www.cyber.gov.au/report-and-recover/report
  - title: Security of Critical Infrastructure Act 2018 (Cth)
    url: https://www.legislation.gov.au/C2018A00029/latest/text
created: '2026-02-09'
updated: '2026-09-25'
changelog:
  - version: 1.5.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had no generic classification, no
      rationale, no tier).
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): Type keyword_list -> regex (primary promoted to the top-level pattern) so tier gates, not bare keyword-list hits, decide detection. 75 now requires a populated incident record field or technical artefact (new Regex_..._record_structure: incident ID, severity, detected, affected host, source IP, hash, IPv4, CVE) instead of generic incident-response words; 85 requires two distinct structure hits plus response or root-cause evidence (the old 85 was reachable on topic words alone). Dropped the generic recovery/timeline terms and the unused security-assessment group; recommended_confidence 85 -> 75. Tests rebuilt with populated synthetic incident records and policy, blank-template and news decoys. Regulations: removed TIA Act 1979 (not applicable). Added ACSC reporting and SOCI Act references.'
  - version: 1.4.0
    date: '2026-07-19'
    description: 'Targeted blocker remediation: add a discovery-only 65 report tier, make 75 require incident-response evidence, retain 85 for response plus root-cause evidence, and add exact-tier and sibling/public/template probes.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 597 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.1.0
    date: '2026-07-04'
    description: Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
