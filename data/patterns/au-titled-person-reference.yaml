schema: testpattern/v1
name: Titled Person Reference
slug: au-titled-person-reference
version: 2.7.2
type: keyword_proximity
pattern_class: concept
engine: boost_regex
description: >-
  Identifies personal names preceded by salutations (Mr, Mrs, Ms, Dr, Prof, etc.) in Australian
  documents. Uses structural regex for honorific + capitalised name components with corroborative
  evidence from the consolidated Australian forename and surname dictionaries.
operation: >-
  Primary: honorific (Mr, Mrs, Miss, Ms, Dr, Prof, Rev, Hon, Sir, Dame, Lord, Lady) followed by two or three capitalised name tokens (case-sensitive). 65 (discovery only): titled name alone. 75: titled name plus at least one Australian forename or surname registry hit plus a populated contact/identity field (phone, mobile, email, address, DOB, customer/client/member/employee/patient/account/reference number). 85: titled name plus both forename and surname registry hits plus two distinct populated contact/identity fields. Business-name and street-address collisions and template framing are excluded from 75/85.
pattern: \b(?:Mr|Mrs|Miss|Ms|Dr|Prof|Rev|Hon|Sir|Dame|Lord|Lady)\.?\s+(?:[A-Z][a-z]{1,20}\s+[A-Z][a-z]{1,20}\s+[A-Z][a-z]{1,20}|[A-Z][a-z]{1,20}\s+[A-Z][a-z]{1,20})\b
case_sensitive: true
confidence: medium
confidence_justification: >-
  Medium: a titled name alone is common in correspondence and public text, so enforce tiers now need an independent populated contact or identity field next to the name; the registry dictionaries confirm the tokens are plausible names but are not counted as independent evidence.
jurisdictions:
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
- ISO 27001
- ISO 27701
data_categories:
  - pii
  - personal-name
test_cases:
  should_match:
    - value: "Contact record\nMs Sarah Thompson\nMobile: 0412 345 678\nEmail: s.thompson@harbourclinic.com.au\nCustomer number: C4471820"
      description: Titled name with both registry hits and two distinct contact/identity fields (85)
      synthetic: true
    - value: "Dr Aaliyah Zorvane\nPhone: 07 3000 1234"
      description: Titled name with one registry hit and one contact field (75)
      synthetic: true
    - value: "Attention: Prof. James Wilson"
      description: Titled name alone (65 discovery)
      synthetic: true
  should_not_match:
    - value: "The weather forecast predicts rain across the region this weekend."
      description: Generic non-name text with no salutation present
    - value: "The mrs clause in the contract"
      description: Lowercase clause wording does not satisfy the case-sensitive titled-name structure
    - value: "Dr Brown Engineering Pty Ltd lodged the tender."
      description: Titled business-name collision present in both Australian dictionaries must not reach enforcement
    - value: "Dr Victoria Road, QLD 4000"
      description: Titled formatted-address collision present in both Australian dictionaries must not reach enforcement
    - value: "Sample: Dear Dr Aaliyah Abbasi"
      description: High-like titled-name fixture must be rejected by the shared exclusion dictionary
    - value: "The Hon. Justice Michael Kirby delivered the lecture on constitutional law at the university."
      description: Public figure named in prose without contact or identity fields (no enforce tier)
    - value: "Contact details\nName: ____________________\nPhone: ____________________\nEmail: ____________________\nCustomer number: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
false_positives:
  - description: Salutations preceding non-name words in informal text or brand references.
    mitigation: Require capitalised words following the salutation and corroborative family-name dictionary.
exports:
  - purview_xml
  - yaml
scope: wide
risk_rating: 5
risk_description: >-
  A Titled Person Reference match combines an honorific with two or three capitalised name tokens and, to enforce, name-registry evidence plus a populated contact or identity field (phone, email, address, DOB or customer/member number); a titled name alone stays at 65 discovery. It can expose an identifiable person's name and role cue, which may aid correlation, unwanted contact, or a tailored professional pretext. Names and titles are often public, and the match contains no account, case, contact route, or credential. Risk 5 and OFFICIAL recognise a likely populated identity reference while reserving SENSITIVE for a name linked to substantive private or operational information.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: "CUI"
  uk_gov: "OFFICIAL"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to OFFICIAL and Low tiers because the detector can return a real titled name but ordinarily exposes only
    public-facing identity information. SENSITIVE is not met without confidential role context, contact details, a
    protected person, or a consequential personal record.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      A title plus personal name is generically Low with Low DLM because the combination is commonly observable and has
      bounded standalone confidentiality impact.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
    - dict: au-forenames-australian
      as: Evidence_au_forename_registry
      match_style: word
    - dict: au-surnames-australian
      as: Evidence_au_surname_registry
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_titled_person
      matches:
        - ref: Evidence_au_forename_registry
        - ref: Evidence_au_surname_registry
        - ref: Regex_au_titled_person_reference_contact_fields
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Pattern_non_person_name_collision
    - confidence_level: 75
      id_match: Pattern_titled_person
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_au_forename_registry
            - Evidence_au_surname_registry
        - ref: Regex_au_titled_person_reference_contact_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Pattern_non_person_name_collision
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_titled_person
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_titled_person
      pattern: \b(?:Mr|Mrs|Miss|Ms|Dr|Prof|Rev|Hon|Sir|Dame|Lord|Lady)\.?\s+(?:[A-Z][a-z]{1,20}\s+[A-Z][a-z]{1,20}\s+[A-Z][a-z]{1,20}|[A-Z][a-z]{1,20}\s+[A-Z][a-z]{1,20})\b
    - id: Regex_au_titled_person_reference_contact_fields
      pattern: (?i)\b(?:phone|mobile|tel(?:ephone)?|e-?mail|(?:postal\s+|residential\s+)?address|date\s+of\s+birth|DOB|(?:customer|client|member|employee|patient|account|reference|ref)\s*(?:no\.?|number|ID))(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Pattern_non_person_name_collision
      pattern: (?i)\b(?:(?:engineering|consulting|holdings|services|pty\s+ltd|ltd|limited|company|corporation|council|university)|(?:street|road|avenue|highway|parade|drive|lane|terrace|crescent)\s*,?\s*(?:NSW|QLD|VIC|TAS|SA|WA|NT|ACT|\d{4}))\b
created: '2026-02-09'
updated: '2026-09-25'
changelog:
  - version: 2.7.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 2.7.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): 75 fired on a titled name alone ('Dr Aaliyah Zorvane') because the salutation keyword and registry dictionaries match inside the primary span. Removed the salutation evidence; 75 now needs a registry hit plus a populated contact/identity field (phone, email, address, DOB, customer/member/employee number) and 85 needs both registries plus two distinct contact/identity fields. Bare-name positives replaced with populated contact records; added a public-figure prose decoy and a blank contact form. Regulations: removed AML/CTF Act, HRIPA, My Health Records Act and TIA Act; references added."
  - version: 2.6.1
    date: '2026-07-19'
    description: 'Make the 85 tier demonstrably cumulative by requiring a populated titled-person field label and person-record context in addition to both Australian name dictionaries.'
  - version: 2.6.0
    date: '2026-07-19'
    description: 'Australian personal-name baseline: make titled capitalised structure the primary signal with explicit component alternatives accepted by Purview; wire consolidated forename/surname sources through keyword-dictionary references; distinguish title-only discovery, single-dictionary medium, and dual-dictionary high tiers; veto strong business/address collisions; remove bare title keyword fallback; add exact-tier and adversarial probes.'
  - version: 2.5.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 607 without changing detector or package metadata.'
  - version: 2.5.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 2.4.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 2.3.0
    date: '2026-07-04'
    description: Drop bare Mr/Mrs (title alone is not evidence); replace collision-prone should_not_match test value
  - version: 2.2.0
    date: '2026-07-04'
    description: case/evidence metadata update
  - version: 2.1.0
    date: '2026-07-04'
    description: Bound inner quantifier in repeated name-component group to remove Purview-flagged nested-quantifier shape
