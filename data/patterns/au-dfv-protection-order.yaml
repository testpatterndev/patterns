    url: https://www.legalaid.nsw.gov.au/content/dam/legalaidnsw/documents/pdf/my-problem-is-about/apprehended-violence-orders/getting-an-avo/Sample%20Application%20for%20apprehended%20domestic%20violence%20order.pdf
  - title: Magistrates Court of Victoria — FVIO1 Application for a family violence intervention order
    url: https://www.mcv.vic.gov.au/sites/default/files/2019-11/FVIO1-Application-for-Family-Violence-Intervention-Order.pdf
  - title: Magistrates Court of WA — Application for a family violence restraining order
    url: https://www.magistratescourt.wa.gov.au/_files/application_family_violence_restraining_order.pdf
  - title: ACT Courts — Application for a Family Violence Order
    url: https://www.courts.act.gov.au/__data/assets/pdf_file/0019/3019222/Application-for-Family-Violence-Order.pdf
  - title: Attorney-General's Department — National Domestic Violence Order Scheme
    url: https://www.ag.gov.au/families-and-marriage/family-violence/national-domestic-violence-order-scheme
  - title: Queensland Police Service — Police reviews of Police Protection Directions
    url: https://www.police.qld.gov.au/domestic-violence/police-reviews-of-police-protection-directions
  - title: Queensland Courts — Applying for a domestic violence order
    url: https://www.courts.qld.gov.au/types-of-cases/domestic-and-family-violence/applying-for-a-dvo
