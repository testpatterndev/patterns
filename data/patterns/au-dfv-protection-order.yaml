schema: testpattern/v1
name: Australian Domestic and Family Violence Protection Order
slug: au-dfv-protection-order
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects domestic and family violence protection orders, police-issued notices and directions,
  and applications for them, in every Australian jurisdiction, when the document names the
  parties. Covers Qld protection orders, temporary protection orders, Police Protection Notices
  and Police Protection Directions; NSW apprehended domestic violence orders (including
  provisional orders); Vic family violence intervention orders and family violence safety
  notices; WA family violence restraining orders; SA intervention orders; Tas police family
  violence orders and family violence orders; ACT family violence orders (interim and after-hours);
  NT domestic violence orders; and recognised DVOs under the National Domestic Violence Order
  Scheme. Complements the Queensland-specific domestic-violence-order-application classifier.
operation: >-
  Primary: any of two regexes — a case-insensitive order/notice name list across all
  jurisdictions, or a case-sensitive acronym list (DVO, TPO, PPN, PPD, ADVO, FVIO, FVSN, FVRO,
  PFVO, FVO). 75 tier requires a populated party field (aggrieved, respondent, protected person,
  person in need of protection, affected family member, affected person, applicant, defendant or
  named person, with a non-placeholder name) or a form-style name field (family name, given names,
  full name, as used under the party headings of court application forms) within 300 characters.
  85 tier additionally requires an order condition (must not approach/contact/locate…, within N
  metres of, ouster or no-contact condition, weapons surrender, good behaviour) or a published
  court-form anchor (Qld Form DV1 and version footer, SPI #, NSW Police application number /
  Central Name Index / NOTICE TO DEFENDANT, Vic FVI01 / Include on Intervention Order, WA PERSON
  SEEKING TO BE PROTECTED, ACT AF form number, Court File Number). All tiers exclude template/fixture text. 65 is discovery-only.
pattern: >-
  (?i)\b(?:(?:temporary\s+)?protection\s+orders?|domestic\s+violence\s+orders?|police\s+protection\s+(?:notices?|directions?)|(?:provisional\s+)?apprehended\s+domestic\s+violence\s+orders?|provisional\s+(?:apprehended\s+violence\s+)?order|(?:interim\s+|final\s+)?family\s+violence\s+intervention\s+orders?|family\s+violence\s+safety\s+notices?|family\s+violence\s+restraining\s+orders?|(?:interim\s+)?intervention\s+orders?|police\s+family\s+violence\s+orders?|(?:interim\s+|after-hours\s+)?family\s+violence\s+orders?|recognised\s+(?:DVO|interstate\s+order|domestic\s+violence\s+order))\b|\b(?:ADVO|FVIO|FVSN|FVRO|PFVO)s?\b
confidence: medium
confidence_justification: >-
  Medium: order names are published widely in legal information, court forms and statistics, so
  enforce tiers depend on a populated party field. "Intervention order" and "protection order" are
  also used outside DFV (for example personal safety intervention orders), which are equally
  sensitive. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
regulations:
  - Domestic and Family Violence Protection Act 2012 (Qld)
  - Crimes (Domestic and Personal Violence) Act 2007 (NSW)
  - Family Violence Protection Act 2008 (Vic)
  - Restraining Orders Act 1997 (WA)
  - Intervention Orders (Prevention of Abuse) Act 2009 (SA)
  - Family Violence Act 2004 (Tas)
  - Family Violence Act 2016 (ACT)
  - Domestic and Family Violence Act 2007 (NT)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - legal
  - pii
corroborative_evidence:
  keywords:
    - aggrieved
    - respondent
    - protected person
    - affected family member
    - person in need of protection
    - must not approach
    - ouster condition
    - Magistrates Court
  proximity: 300
  keyword_lists:
    - au-dfv-terminology
test_cases:
  should_match:
    - value: 'Provisional Apprehended Domestic Violence Order. Person in need of protection: Avery Teston. Defendant: Jordan Teston. The defendant must not approach the protected person or contact them by any means except through a lawyer.'
      description: NSW provisional ADVO with parties and conditions
      synthetic: true
    - value: "Family Violence Intervention Order (Final)\nAffected family member: Morgan Teston\nRespondent: Riley Teston\nThe respondent must not go within 200 metres of the affected family member's residence."
      description: Victorian FVIO with a distance condition
      synthetic: true
    - value: 'Police Protection Direction issued 14/02/2026. Aggrieved: Avery Teston. Respondent: Casey Teston. Duration: 12 months. The respondent must not contact the aggrieved by any means.'
      description: Queensland Police Protection Direction
      synthetic: true
    - value: "FVRO - Magistrates Court of Western Australia\nProtected person: Jamie Teston\nRespondent: Alex Teston\nRestraint: the respondent is prohibited from being on or near the premises. Surrender all firearms."
      description: WA family violence restraining order (acronym primary)
      synthetic: true
    - value: "Recognised DVO (National Domestic Violence Order Scheme). Issuing jurisdiction: Tasmania. Affected person: Sam Teston.\nApplicant: Tasmania Police"
      description: Recognised interstate order with parties
      synthetic: true
    - value: "FORM DV1 Domestic and Family Violence Protection Act 2012 (s.32)\n1. Aggrieved's details\nFamily name: Teston\nGiven names: Avery\n2. Respondent's Details\nFamily name: Teston\nGiven names: Jordan\nDFVPA - Form DV1 - Application for a Protection Order - version 7 - approved on 19 December 2025"
      description: Completed Qld DV1 application using form-style name fields (layout from the published form)
      synthetic: true
  should_not_match:
    - value: An ADVO is a court order that protects a person in need of protection. The defendant must not assault, threaten or stalk the protected person, and further conditions can be added.
      description: Legal information explainer
    - value: "Form DV01 Application for a protection order\nAggrieved: __________\nRespondent: __________\nDo you want the court to make a temporary protection order?  [ ] Yes  [ ] No"
      description: Blank application form
    - value: "PERSON SEEKING TO BE PROTECTED\nFamily name: __________\nGiven names: __________\nPERSON YOU ARE SEEKING THE RESTRAINING ORDER AGAINST\nFamily name: __________\nFamily violence restraining order application"
      description: Blank WA FVRO application with form anchors but no names
    - value: Queensland Police issued 3,214 Police Protection Directions in the first six months of 2026, and courts made 18,900 protection orders over the same period.
      description: Aggregate statistics
false_positives:
  - description: Legal information, court guides and training material explaining orders and conditions.
    mitigation: Enforce tiers require a populated party field; explainers use party labels as nouns, not as filled fields.
  - description: Blank court forms and practice templates.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders, and n/a/tbc values are rejected; template text is excluded.
  - description: Non-DFV intervention or protection orders (personal safety intervention orders, child protection orders) with named parties.
    mitigation: These are also sensitive person-safety records; review rather than suppress.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match:
        type: any
        ids:
          - Regex_dfv_order_name
          - Regex_dfv_order_acronym
      matches:
        - type: any
          refs:
            - Regex_dfv_order_party_field
            - Regex_dfv_order_form_name_field
        - type: any
          refs:
            - Regex_dfv_order_condition
            - Regex_dfv_order_form_anchor
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match:
        type: any
        ids:
          - Regex_dfv_order_name
          - Regex_dfv_order_acronym
      matches:
        - type: any
          refs:
            - Regex_dfv_order_party_field
            - Regex_dfv_order_form_name_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Regex_dfv_order_name
          - Regex_dfv_order_acronym
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_dfv_order_name
      pattern: >-
        (?i)\b(?:(?:temporary\s+)?protection\s+orders?|domestic\s+violence\s+orders?|police\s+protection\s+(?:notices?|directions?)|(?:provisional\s+)?apprehended\s+domestic\s+violence\s+orders?|provisional\s+(?:apprehended\s+violence\s+)?order|(?:interim\s+|final\s+)?family\s+violence\s+intervention\s+orders?|family\s+violence\s+safety\s+notices?|family\s+violence\s+restraining\s+orders?|(?:interim\s+)?intervention\s+orders?|police\s+family\s+violence\s+orders?|(?:interim\s+|after-hours\s+)?family\s+violence\s+orders?|recognised\s+(?:DVO|interstate\s+order|domestic\s+violence\s+order))\b
    - id: Regex_dfv_order_acronym
      pattern: \b(?:DVO|TPO|PPN|PPD|ADVO|FVIO|FVSN|FVRO|PFVO|FVO)s?\b
    - id: Regex_dfv_order_party_field
      pattern: >-
        (?i)\b(?:aggrieved(?:\s+(?:person|party))?|respondent|protected\s+person|person\s+in\s+need\s+of\s+protection|PINOP|affected\s+family\s+member|affected\s+person|applicant|defendant|named\s+person|person\s+to\s+be\s+protected|person\s+seeking\s+to\s+be\s+protected|person\s+you\s+are\s+seeking\s+the\s+restraining\s+order\s+against|name\s+of\s+person\s+committing\s+the\s+violence(?:\s+against\s+you)?)(?:\s+(?:name|details))?\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}
    - id: Regex_dfv_order_form_name_field
      pattern: >-
        (?i)\b(?:family\s+name|surname|given\s+names?|full\s+name)\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}
    - id: Regex_dfv_order_form_anchor
      pattern: >-
        (?i)\bForm\s+DV0?1\b|\bApplication\s+for\s+a\s+Protection\s+Order\s+-\s+version\s+\d{1,2}\b|\bSPI\s+#|\bPolice\s+application\s+number\b|\bCentral\s+Name\s+Index\b|\bNOTICE\s+TO\s+DEFENDANT\b|\bFVI01\b|\bInclude\s+on\s+Intervention\s+Order\b|\bPERSON\s+SEEKING\s+TO\s+BE\s+PROTECTED\b|\bAF\d{4}-\d{1,3}\b|\bCourt\s+File\s+Number\b|\bYOU\s+ARE\s+NOTIFIED\s+that\s+this\s+application\s+will\s+be\s+heard\b
    - id: Regex_dfv_order_condition
      pattern: >-
        (?i)\b(?:must\s+not|shall\s+not|is\s+not\s+to|is\s+(?:prohibited|restrained)\s+from)\s+(?:[a-z]{1,20}\s{1,5}){0,4}?(?:approach(?:ing)?|contact(?:ing)?|locat(?:e|ing)|follow(?:ing)?|remain(?:ing)?|go(?:ing)?|com(?:e|ing)|enter(?:ing)?|attend(?:ing)?|damag(?:e|ing)|harass(?:ing)?|intimidat(?:e|ing)|threaten(?:ing)?|assault(?:ing)?|stalk(?:ing)?|being\s+on|be\s+on|publish(?:ing)?)\b|\bwithin\s+\d{1,4}\s*(?:m|metres|meters|km|kilometres)\s+of\b|\b(?:ouster|no-contact|good\s+behaviour)\s+condition\b|\bsurrender\s+(?:all\s+)?(?:weapons|firearms)\b|\bbe\s+of\s+good\s+behaviour\s+towards\b|\bnot\s+commit\s+domestic\s+violence\s+against\b
risk_rating: 8
risk_description: >-
  The detector identifies a domestic and family violence protection order, police notice or
  direction, or an application for one, that names the protected person and the respondent.
  These documents disclose allegations of violence, relationship and family details, children,
  exclusion zones and contact restrictions; unauthorised release can expose the protected person
  to retaliation and reveal untested allegations about the respondent. Legal explainers, blank
  forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Legal;
  documents that also reveal a refuge or concealed address are covered by
  au-dfv-confidential-address at PROTECTED.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
