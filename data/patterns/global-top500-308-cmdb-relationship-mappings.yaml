schema: testpattern/v1
name: CMDB relationship mappings
slug: global-top500-308-cmdb-relationship-mappings
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects CMDB relationship mappings: CMDB or dependency-map wording with relationship edges (ServiceNow relationship types or A -> B edges) and populated CI fields. Topic wording alone is discovery-only.
operation: >-
  Regex_cmdb_rel_primary (CMDB, configuration management database, CI relationship or dependency-map wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a relationship edge (ServiceNow relationship type such as Depends on::Used by, or an A -> B edge) or a populated CI field (CI name/ID/class, parent/child, sys_id, business/application service, support group, environment). 85 requires a relationship edge (ServiceNow relationship type such as Depends on::Used by, or an A -> B edge) (two distinct hits), a populated CI field (CI name/ID/class, parent/child, sys_id, business/application service, support group, environment), and independent dependency-impact (upstream/downstream, impact analysis, server roles) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_cmdb_rel_guidance_exclusion).
pattern: >-
  (?i)\b(?:CMDB(?:\s+(?:export|relationships?|map(?:ping)?))?|configuration\s+management\s+database|CI\s+relationships?|service\s+dependency\s+map(?:ping)?|dependency\s+map(?:ping)?|relationship\s+map(?:ping)?)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a relationship edge (ServiceNow relationship type such as Depends on::Used by, or an A -> B edge) or a populated CI field (CI name/ID/class, parent/child, sys_id, business/application service, support group, environment)), and 85 needs two distinct structures plus independent dependency-impact (upstream/downstream, impact analysis, server roles) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - upstream
  - downstream
  - impact analysis
  - single point of failure
  - cmdb_ci
  - application server
  - database server
  - load balancer
  - production
  - discovery source
  proximity: 300
  keyword_lists:
  - corporate-ip
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
  - value: The CMDB is the source of truth for configuration items.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      CMDB relationship export
      payroll-web01 -> payroll-db01
    description: Medium-tier probe (75) - one relationship edge
    synthetic: true
  - value: |-
      CMDB relationship export - Payroll business service
      CI name: payroll-web01 (class: Linux Server)
      payroll-web01 -> payroll-db01
      Depends on::Used by: payroll-app -> payroll-web01
      Support group: Enterprise Apps
      Impact analysis: payroll-db01 is a single point of failure for all downstream pay runs.
    description: High-tier probe (85) - edges, CI fields and impact context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: the CMDB must be updated for every production change.'
    description: Policy text
    synthetic: true
  - value: |-
      CMDB relationship template
      CI name: ________
      Parent CI: [insert]
    description: Blank template
    synthetic: true
  - value: 'Course module 3: CMDB relationship types include Depends on::Used by and Runs on::Runs.'
    description: Training framing
    synthetic: true
false_positives:
- description: ITSM product documentation lists relationship types.
  mitigation: Guidance/training framing is excluded; 85 needs two edges plus populated CI fields.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_cmdb_rel_primary
    matches:
    - ref: Regex_cmdb_rel_relationship_edge
      min_count: 2
      unique_results: true
    - ref: Regex_cmdb_rel_ci_field
    - ref: Keyword_cmdb_rel_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_cmdb_rel_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_cmdb_rel_primary
    matches:
    - type: any
      refs:
      - Regex_cmdb_rel_relationship_edge
      - Regex_cmdb_rel_ci_field
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_cmdb_rel_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_cmdb_rel_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_cmdb_rel_primary
    pattern: >-
      (?i)\b(?:CMDB(?:\s+(?:export|relationships?|map(?:ping)?))?|configuration\s+management\s+database|CI\s+relationships?|service\s+dependency\s+map(?:ping)?|dependency\s+map(?:ping)?|relationship\s+map(?:ping)?)\b
  - id: Regex_cmdb_rel_relationship_edge
    pattern: >-
      (?i)\b(?:Depends\s+on::Used\s+by|Runs\s+on::Runs|Hosted\s+on::Hosts|Contains::Contained\s+by|Connects\s+to::Connected\s+by|Uses::Used\s+by|Provides::Provided\s+by|Members?::Member\s+of)\b|\b[A-Za-z0-9_.-]{2,60}\s*(?:-->|->|=>)\s*[A-Za-z0-9_.-]{2,60}
  - id: Regex_cmdb_rel_ci_field
    pattern: >-
      (?i)\b(?:CI\s+(?:name|ID|class)|parent(?:\s+CI)?|child(?:\s+CI)?|sys_id|application\s+service|business\s+service|support\s+group|environment|relationship\s+type)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  keywords:
  - id: Keyword_cmdb_rel_context
    groups:
    - match_style: word
      terms:
      - upstream
      - downstream
      - impact analysis
      - single point of failure
      - cmdb_ci
      - application server
      - database server
      - load balancer
      - production
      - discovery source
    strength: specific
  - id: Keyword_cmdb_rel_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires CMDB/dependency-map wording plus relationship edges or populated CI fields before enforcing. A real mapping can reveal which applications, hosts, databases, and business services depend on each other, identifying high-value nodes and cascade points for attack or disruption. The affected scale is the mapped service estate and its owners, while CMDB product documentation and process descriptions can produce topic-only hits. Risk 8 SENSITIVE reflects serious contained infrastructure exposure; PROTECTED would require a complete critical-service dependency model or significant broad consequence.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
