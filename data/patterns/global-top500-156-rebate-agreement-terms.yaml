schema: testpattern/v1
name: Rebate agreement terms
slug: global-top500-156-rebate-agreement-terms
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to rebate agreement terms in international contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(rebate\s+agreement|volume\s+rebate|rebate\s+calculation|rebate\s+threshold|rebate\s+payout|retrospective\s+discount|incentive\s+rebate|rebate\s+accrual|rebate\s+claim|tiered\s+rebate|annual\s+rebate|rebate\s+settlement)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - rebate agreement terms
    - rebate
    - agreement
    - terms
    - procurement
    - supplier
    - management
  proximity: 300
test_cases:
  should_match:
    - value: rebate agreement
      description: Primary topic phrase match
    - value: volume rebate
      description: Case-insensitive topic phrase match
    - value: rebate calculation
      description: Alternative topic phrase match
    - value: rebate threshold
      description: Additional topic phrase match
    - value: |-
        Rebate agreement
        To: Executive Committee
        From: Chief Risk Officer
      description: Populated document header with 2 fields (75 tier)
      synthetic: true
    - value: |-
        Rebate agreement
        To: Executive Committee
        From: Chief Risk Officer
        Date: 14 August 2026
      description: Populated document header with 3 distinct fields (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: procurement inventory
      description: Generic word pair from old broad template should not match
    - value: Rebate agreement terms
      description: "Bare detector name: it reached 75 through the generated name-word tier and must not reach an enforcing tier"
    - value: |-
        Rebate agreement:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about rebate agreement are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to rebate agreement terms appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: >-
      In English (as the primary international business language), similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute
      sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_rebate_agreement_terms
      matches:
        - ref: Regex_global_top500_156_rebate_agreement_terms_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_rebate_agreement_terms
      matches:
        - ref: Regex_global_top500_156_rebate_agreement_terms_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_rebate_agreement_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_rebate_agreement_terms
      pattern: >-
        (?is)\b(rebate\s+agreement|volume\s+rebate|rebate\s+calculation|rebate\s+threshold|rebate\s+payout|retrospective\s+discount|incentive\s+rebate|rebate\s+accrual|rebate\s+claim|tiered\s+rebate|annual\s+rebate|rebate\s+settlement)\b
    - id: Regex_global_top500_156_rebate_agreement_terms_record_structure
      pattern: (?i)\b((?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item|supplier|distributor|customer|agreement\s+(?:no\.?|number|ref(?:erence)?))\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$])
risk_description: >-
  The detector recognises rebate-agreement, volume-rebate, rebate-calculation, and rebate-threshold language intended to identify commercial pricing terms. A substantive agreement can reveal discount structures, sales volumes, thresholds, and supplier negotiations, creating bargaining disadvantage or targeted undercutting when competitor and transaction context are available. Generic pricing policies and agreement templates can match, and one routine rebate schedule does not expose credentials, payment access, or an entire pricing strategy. Risk 5 OFFICIAL reflects bounded commercial harm; SENSITIVE would require market-shaping rates, major confidential negotiations, strategic volume data, collusion evidence, or a portfolio-wide pricing repository.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to PSPF OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM, OFFI, and Low tier for one ordinary rebate
    agreement. The next SENSITIVE level is not met because the record does not normally establish market-moving pricing,
    major negotiation strategy, collusion evidence, payment authority, or a broad commercial repository.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low and Low handling suit routine rebate terms whose material commercial impact depends on strategic
      volumes, negotiations, or competitor access.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.4.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.3.0
    date: '2026-10-20'
    description: 'Generated name-word tier removed: the 75 tier ANDed Pattern_*_label_context (the detector name, "Rebate agreement terms") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 75. Both lists sit inside the IdMatch phrase, so the bare name alone scored 75. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs 2 populated document header fields (Regex_global_top500_156_rebate_agreement_terms_record_structure); 85 needs 3 distinct fields. Curated terms that sit inside an IdMatch hit were removed. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
  - version: 1.2.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.2.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1715 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
