schema: testpattern/v1
name: National emergency response plans
slug: global-top500-493-national-emergency-response-plans
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to national emergency response plans in international contexts. This information type is classified as personally identifiable information under applicable
  data protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 1 keywords within 240 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(national\s+emergency\s+response\s+plans|emergency\s+response|disaster\s+recovery|crisis\s+management|continuity\s+of\s+government|civil\s+defense|emergency\s+preparedness|evacuation\s+plan|incident\s+command|threat\s+assessment|critical\s+infrastructure|national\s+resilience)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - national emergency response plans
  proximity: 240
test_cases:
  should_match:
    - value: national emergency response plans
      description: Primary topic phrase match
    - value: emergency response
      description: Case-insensitive topic phrase match
    - value: disaster recovery
      description: Alternative topic phrase match
    - value: crisis management
      description: Additional topic phrase match
    - value: |-
        National emergency response plans
        To: Executive Committee
        From: Chief Financial Officer
        Date: 14 August 2026
        Subject: National emergency response plans - FY27 review
      description: Populated document header reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: voter sovereign debt
      description: Generic word pair from old broad template should not match
    - value: |-
        National emergency response plans:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about national emergency response plans are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to national emergency response plans appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: >-
      In English (as the primary international business language), similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute
      sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 240
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_emergency_response
      matches:
        - ref: Regex_global_top500_493_national_emergency_response_plans_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_emergency_response
      matches:
        - ref: Regex_global_top500_493_national_emergency_response_plans_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_emergency_response
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_emergency_response
      pattern: >-
        (?is)\b(national\s+emergency\s+response\s+plans|emergency\s+response|disaster\s+recovery|crisis\s+management|continuity\s+of\s+government|civil\s+defense|emergency\s+preparedness|evacuation\s+plan|incident\s+command|threat\s+assessment|critical\s+infrastructure|national\s+resilience)\b
    - id: Regex_global_top500_493_national_emergency_response_plans_record_structure
      pattern: (?i)\b((?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$])
risk_description: >-
  The concept detector flags national emergency response, disaster recovery, crisis management, continuity of government, civil defense, preparedness, evacuation, incident command, threat assessment, critical infrastructure, and resilience rather than validating a complete operational plan. A genuine plan can expose command arrangements, dependencies, priorities, evacuation concepts, and response gaps that an adversary could exploit during a crisis or use to frustrate coordination. The normal unit is one national or sector-level planning document affecting agencies, responders, infrastructure operators, and the public, while published frameworks, exercises, and local templates can match. Risk 8 and SENSITIVE reflect serious contained preparedness exposure; PROTECTED would require detailed life-safety or protected-operation procedures whose loss could credibly cause significant national damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Confidential
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Government, and Medium because a substantive
    response plan can materially expose government coordination, dependencies, and preparedness gaps. PROTECTED is not
    met by broad emergency topics or an ordinary planning document without actionable protected operations and likely
    significant national or life-safety damage.
  generic:
    classification: Medium
    dlm: Medium Government
    rationale: >-
      Medium with Medium Government handling fits nonpublic emergency coordination and resilience planning with serious
      but bounded exposure. High is reserved for actionable protected or life-critical national plans.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.4.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.3.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires 2 distinct independent populated document header fields (Regex_global_top500_493_national_emergency_response_plans_record_structure); 85 requires 3 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list. Removed evidence no longer referenced by any tier (Keyword_emergency_response, Keyword_global_top500_493_national_emergency_response_plans_domain_context, Pattern_global_top500_493_national_emergency_response_plans_label_context). Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.2.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.2.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 2032 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
