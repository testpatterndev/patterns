schema: testpattern/v1
name: Immigration file number
slug: global-top500-031-immigration-file-number
version: 1.6.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to immigration file number in Australian contexts. This information type is classified as personally identifiable information under the Privacy Act 1988.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?i)\b(immigration\s+file\s+numbers?)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - immigration file number
    - immigration
    - file
    - number
    - government
    - ids
    - civil
    - status
  proximity: 300
  keyword_lists:
    - government-services
    - generic-data-labels
    - data-record-context
test_cases:
  should_match:
    - value: 'Immigration file number'
      description: Topic phrase present
    - value: 'immigration file number'
      description: Topic phrase, lowercase
    - value: 'this record references the immigration file number held on file'
      description: Topic phrase within surrounding text
    - value: Migration file reference held by Home Affairs.
      description: Source-authored synonym phrase surfaces via the discovery-only synonym branch
    - value: |-
        Immigration file number: Recorded
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match phrase marker
    - value: generic narrative without identifier/document anchors
      description: Should not match plain mention
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
    - value: Immigration policy file was archived.
      description: Policy file is not a case/file reference — adjacent-word requirement keeps it excluded
    - value: Visa conditions changed this year.
      description: Immigration topic alone is insufficient
    - value: |-
        Immigration file number:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about immigration file number are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Immigration file number:
        Name: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Common words and phrases related to immigration file number appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_031_immigration_file_number_populated_label
      matches:
        - ref: Regex_global_top500_031_immigration_file_number_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_031_immigration_file_number_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_immigration_file
      matches:
        - ref: Evidence_immigration_file
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_immigration_file
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      id_match: Pattern_immigration_file_synonyms
      discovery_only: true
      description: Bounded case/reference synonym phrases (immigration/migration file, immigration reference, IMMI reference) — discovery inventory only; any adjacent code is not validated
  regexes:
    - id: Regex_global_top500_031_immigration_file_number_populated_label
      pattern: (?i)\b((?:\b(?:immigration\s+file\s+numbers?)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Regex_global_top500_031_immigration_file_number_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Pattern_immigration_file
      pattern: (?i)\b(immigration\s+file\s+numbers?)\b
    - id: Pattern_immigration_file_synonyms
      pattern: (?i)\b(immigration\s+file|migration\s+file|immigration\s+reference|IMMI\s+reference)\b
    - id: Pattern_au_top500_031_immigration_file_number_label_context
      pattern: (?i)\b(immigration\s+file\s+number)\b
  keywords:
    - id: Evidence_immigration_file
      groups:
        - match_style: word
          terms:
            - immigration reference
            - Department of Home Affairs
            - visa application
            - migration agent
            - immigration status
            - border control
            - visa holder
            - migration file
            - IMMI
    - id: Keyword_au_top500_031_immigration_file_number_domain_context
      groups:
        - match_style: word
          terms:
            - immigration file number
            - immigration
            - file
risk_description: >-
  The Immigration file number concept pattern matches the literal field phrase and related immigration-file wording rather than validating a government-issued case number. It can flag documents associated with migration administration, where nearby status, identity, or case material may be consequential, but the phrase alone identifies no applicant and opens no record. Forms, checklists, and process documentation are ordinary benign sources of the same text. Risk 5 and OFFICIAL retain a useful administrative-context signal while reserving SENSITIVE for a populated person-linked immigration file.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM, OFFI, and Low tier because the detector finds a
    file reference rather than immigration case contents. The next SENSITIVE level is not met because no visa decision,
    legal history, evidence, correspondence, enforcement action, or vulnerable-person record is present.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low and Low handling fit an immigration case reference whose material sensitivity depends on linkage to
      the person and substantive case information.
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.6.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.5.0
    date: '2026-10-20'
    description: 'Self-corroboration fix (PR #69 shape; this pattern was missed by #69): the evidence lists held the IdMatch phrase or phrases inside it (immigration file number, immigration file, file number; generic-data-labels, which holds number labels such as registration/file/identification number). Purview counts a supporting match that equals or sits inside the IdMatch span (dev-tenant tests 2026-10-16 and 2026-10-19), so a bare heading reached an enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_031_immigration_file_number_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (Evidence_immigration_file); 85 requires the populated field plus a populated person/client field (Regex_global_top500_031_immigration_file_number_record_structure). The record-structure field omits file so it cannot match inside the populated field. Phrase-only matches stay at 65 discovery. Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.4.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 3 verified legislation/regulator references."
  - version: 1.4.0
    date: '2026-07-17'
    description: 'TP-00160 approved reduced scope: add Pattern_immigration_file_synonyms — bounded case/reference phrase synonyms already authored in the evidence dictionary (immigration file, migration file, immigration reference, IMMI reference) — wired to a new discovery-only 65 tier; no value syntax is added and any adjacent code is not validated. The exact-phrase primary and its 75/85 tiers with template exclusion are unchanged. Per QA, adjacency is required so immigration policy file stays excluded (immigration and file are not matched as independent loose tokens). Labelled-value/identifier detection deliberately rejected (no authoritative case-number format). Added the migration-file synonym positive plus policy-file and visa-topic negatives.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 635 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
