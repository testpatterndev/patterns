schema: testpattern/v1
name: Endpoint detection telemetry
slug: global-top500-282-endpoint-detection-telemetry
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies endpoint detection telemetry patterns in security and access control contexts. Detects potential exposure
  of sensitive security information in international systems.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 8 keywords within 300 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:endpoint\s+detection|carbon\s+black|defender\s+for\s+endpoint|sentinel\s+one|process\s+telemetry|threat\s+detection|endpoint\s+security|behavioral\s+analysis|agent\s+telemetry)\b
confidence: medium
confidence_justification: structural regex with domain-specific anchors and constrained context replaces phrase-only marker.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
- GDPR
data_categories:
- credentials
- security
corroborative_evidence:
  keywords:
  - endpoint detection telemetry
  - endpoint
  - detection
  - telemetry
  - security
  - operations
  - threat
  - data
  proximity: 300
test_cases:
  should_match:
  - value: endpoint detection
    description: Primary topic phrase match
  - value: carbon black
    description: Case-insensitive topic phrase match
  - value: defender for endpoint
    description: Alternative topic phrase match
  - value: sentinel one
    description: Additional topic phrase match
  - value: "endpoint detection\nHost: fw01.corp 10.20.30.40\nRule 14: allow tcp/443 from 10.20.0.0/16\nFinding: CVE-2025-21298 unpatched on asset ID WS-004471."
    description: Populated tech record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: edr process
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about endpoint detection are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Authentication-related terminology in software documentation, security training materials, or system architecture
    descriptions without actual credentials.
  mitigation: Require proximity to credential-specific patterns (API keys, connection strings, tokens) rather than general
    security terminology.
- description: Code snippets and configuration examples containing credential-related keywords or placeholder values in developer
    documentation.
  mitigation: Check for common placeholder patterns (example.com, localhost, 0000) and documentation file types to reduce
    false positives from technical writing.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_endpoint_detection_telemetry
      matches:
        - ref: Regex_global_top500_282_endpoint_detection_telemetry_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_endpoint_detection_telemetry
      matches:
        - ref: Regex_global_top500_282_endpoint_detection_telemetry_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_endpoint_detection_telemetry
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_endpoint_detection_telemetry
      pattern: (?is)\b(?:endpoint\s+detection|carbon\s+black|defender\s+for\s+endpoint|sentinel\s+one|process\s+telemetry|threat\s+detection|endpoint\s+security|behavioral\s+analysis|agent\s+telemetry)\b
    - id: Regex_global_top500_282_endpoint_detection_telemetry_record_structure
      pattern: >-
        (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\bCVE-\d{4}-\d{4,7}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:tcp|udp)\s*/?\s*\d{2,5}\b|\b(?:port|dport|sport)\s*[:=]?\s*\d{2,5}\b|\b(?:hostname|host|asset\s+ID|device\s+ID|sAMAccountName|UPN|username|account\s+name)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._\\@-]{2,63}
risk_description: This concept regex identifies documents discussing endpoint detection, named EDR products, process telemetry,
  or agent and behavioural analysis rather than matching a single log event. A genuine telemetry collection can expose host
  activity, user actions, detection coverage, and investigation focus that helps an adversary evade controls or target affected
  endpoints. The normal affected scale is an endpoint fleet represented in the record and the organisation operating it, while
  product documentation and generic architecture discussion require validation. Risk 8 SENSITIVE is justified for a substantive
  telemetry record because misuse can cause serious contained security harm; PROTECTED would require evidence of broad privileged
  access, critical operations, or significant protected content.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
frameworks:
  - ISO 27001
  - NIST CSF
