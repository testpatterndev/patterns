schema: testpattern/v1
name: NEM Rebid Log Book Entry or Late-Rebid Contemporaneous Record
slug: au-nem-rebid-log-record
version: 1.0.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Internal NEM trading-desk rebid records: trading log / log book entries and the late-rebid contemporaneous record
  that a Generator must make under NER cl 3.8.22(ca). These entries carry the material conditions behind a rebid,
  the event, aware and decision times (AER Rebidding and Technical Parameters Guideline s 3.4 fields eventTime,
  awareTime, decisionTime), the P/A/F/E rebid category and the fuller narrative behind a published "SL" / "see log"
  rebid reason. Distinct from au-nem-bid-file, which detects AEMO MMS bid tables, Dispatch Bidding API JSON keys and
  bid filenames; this classifier covers the trader's reasoning record, which is never published.
operation: >-
  Primary: rebid log vocabulary (rebid log / reason / record, late rebid or late rebidding period, contemporaneous
  record, trading log, log book entry, see log, bidding or offer strategy). 75 requires, within 300 characters, one
  populated log structure: an event / aware / decision time field with a clock value (e.g. "Aware time: 14:02"), a
  rebid reason line in the HHMM~category~ form, or a "Category: P|A|F|E" field. 85 requires two distinct populated
  time fields (min_count 2, unique) plus an independent trading term (DUID, price band, pre-dispatch, RRP, dispatch
  or trading interval, MAXAVAIL). Every tier excludes template/fixture text, the AER guideline title, AER reports
  and media releases, and AEMO public-file markers (",AEMO,PUBLIC,", PUBLIC_BIDMOVE, I,BID,BIDDAYOFFER_D). 65 is
  discovery-only and will surface guidance and training text.
pattern: (?i)\b(?:rebid\s+(?:log|reason|record|narrative)|late\s+rebid(?:ding)?(?:\s+period)?|contemporaneous\s+record|trading\s+log(?:\s+book)?|log\s+book\s+entry|see\s+log|(?:bidding|offer)\s+strategy)\b
confidence: medium
confidence_justification: >-
  Medium: the phrases come from NER cl 3.8.22(ca) and the AER guideline and also appear in that guideline, AER
  enforcement material and training decks, so enforce tiers require populated log fields (clock-valued
  event/aware/decision times or the published HHMM~category~ reason form). The HHMM~category~ form also appears in
  next-day public bid data, which is excluded only when the AEMO PUBLIC header or bid table marker is within the
  window, so extracts pasted without headers can reach 75. 85/75 are heuristic evidence tiers, not measured
  accuracy.
jurisdictions:
  - au
regulations:
  - National Electricity Rules
  - AER Rebidding and Technical Parameters Guideline (October 2024)
  - Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - energy-market
  - trading
  - business
corroborative_evidence:
  keywords:
    - DUID
    - price band
    - pre-dispatch
    - RRP
    - dispatch interval
    - trading interval
    - MAXAVAIL
    - rebid
  proximity: 300
test_cases:
  should_match:
    - value: "Trading log book entry - Callide Ridge Power Station\nDUID: CRIDGE2\nEvent time: 14:02:00\nAware time: 14:04:30\nDecision time: 14:06:00\nCategory: A\nMaterial conditions: 30MIN PD RRP for QLD1 interval ending 1430 fell from $412 to $96 after the 1400 run; shifted 180 MW from price band 9 to band 3.\nRebid reason submitted: 1402~A~PD price lower than forecast - SL"
      description: Populated log entry with event, aware and decision times plus DUID and price band - intended 85
      synthetic: true
    - value: "Late rebid contemporaneous record\nTrader: Casey Teston\nAware time: 16:41\nDecision time: 16:44\nConditions: unit 2 mill C trip reduced available capacity to 310 MW; rebid 60 MW into band 10 for the 1700 dispatch interval."
      description: Late-rebidding-period contemporaneous record with aware and decision times and dispatch interval - intended 85
      synthetic: true
    - value: "Rebid log 23/09/2026 - Northbank Energy\n0915~P~Boiler tube leak unit 1 reduced capacity to 240MW - SL\nNarrative: operator reported rising drum level alarm, maintenance confirmed leak at 0909."
      description: Rebid log line in the HHMM~category~ form with a see-log suffix - intended 75
      synthetic: true
    - value: "Contemporaneous record for rebid at 05:47\nCategory: F\nThe desk moved volume to the price floor after the counterparty cap position was recalculated overnight; reviewed by the trading manager."
      description: Contemporaneous record with a populated category field - intended 75
      synthetic: true
  should_not_match:
    - value: "Rebidding and Technical Parameters Guideline. 3.4 Form of rebid. The eventTime, category, reason, awareTime and decisionTime fields should be submitted in the following form: eventTime the time, in 24-hour format (HHMMSS). Relevant participants should record further information in their log book and include see log or SL in the rebid reason. A contemporaneous record must be made for a rebid in the late rebidding period."
      description: Published AER guideline text naming the fields without values
    - value: "C,NEMP.WORLD,BIDMOVE_COMPLETE,AEMO,PUBLIC,2026/09/24,04:42:10\nI,BID,BIDDAYOFFER_D,3,SETTLEMENTDATE,DUID,BIDTYPE,PARTICIPANTID,REBIDEXPLANATION\nD,BID,BIDDAYOFFER_D,3,2026/09/23,CRIDGE2,ENERGY,NBEXAMPLE,\"0915~P~Boiler tube leak - SL\""
      description: Next-day public BIDMOVE file with AEMO PUBLIC header and a published rebid reason
    - value: "Rebid log template\nEvent time: __:__\nAware time: __:__\nDecision time: __:__\nCategory (P/A/F/E): ____\nRebid reason: ______________"
      description: Blank rebid log template
    - value: "Training exercise: write a contemporaneous record for a late rebid. Record the aware time and decision time and explain the material conditions and circumstances. Answers are discussed in the session."
      description: Training material without populated values
    - value: "The AER has commenced proceedings alleging a generator's late rebid reasons were false or misleading, the regulator said in a media release on Tuesday."
      description: News / enforcement media release
false_positives:
  - description: The AER Rebidding and Technical Parameters Guideline and AER enforcement reports and media releases quote the field names and example rebid reasons.
    mitigation: Enforce tiers require clock-valued time fields or a category field; the guideline title, AER reports and media releases are excluded within the proximity window.
  - description: AEMO next-day public bid files (BIDMOVE_COMPLETE, Yesterdays_Bids_Reports) carry published rebid reasons in the HHMM~category~ form.
    mitigation: The ",AEMO,PUBLIC," header, PUBLIC_BIDMOVE filename and I,BID,BIDDAYOFFER_D table marker are excluded; header-less extracts can still reach 75.
  - description: Blank log templates and training exercises.
    mitigation: Placeholder clock values (__:__) do not satisfy the time-field regex and the template-exclusion dictionary applies to every tier.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_nem_rebid_log_primary
      matches:
        - ref: Regex_au_nem_rebid_log_time_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_nem_rebid_log_trading
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_nem_rebid_log_exclusion
            - Regex_au_nem_rebid_log_public_file
    - confidence_level: 75
      id_match: Regex_au_nem_rebid_log_primary
      matches:
        - type: any
          refs:
            - Regex_au_nem_rebid_log_time_field
            - Regex_au_nem_rebid_log_reason_line
            - Regex_au_nem_rebid_log_category_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_nem_rebid_log_exclusion
            - Regex_au_nem_rebid_log_public_file
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_nem_rebid_log_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_nem_rebid_log_exclusion
            - Regex_au_nem_rebid_log_public_file
  regexes:
    - id: Regex_au_nem_rebid_log_primary
      pattern: >-
        (?i)\b(?:rebid\s+(?:log|reason|record|narrative)|late\s+rebid(?:ding)?(?:\s+period)?|contemporaneous\s+record|trading\s+log(?:\s+book)?|log\s+book\s+entry|see\s+log|(?:bidding|offer)\s+strategy)\b
    - id: Regex_au_nem_rebid_log_time_field
      pattern: >-
        (?i)\b(?:event|aware|decision)[\s_-]?time\s*[:=]\s*[0-2]\d:?[0-5]\d(?::?[0-5]\d)?\b
    - id: Regex_au_nem_rebid_log_reason_line
      pattern: >-
        \b[0-2]\d:?[0-5]\d\s{0,2}~\s{0,2}[PAFE]\s{0,2}~\s{0,2}[A-Za-z]
    - id: Regex_au_nem_rebid_log_category_field
      pattern: >-
        (?i)\b(?:rebid\s+)?category\s*[:=]\s*[PAFE]\b(?![A-Za-z/])
    - id: Regex_au_nem_rebid_log_public_file
      pattern: >-
        ,AEMO,PUBLIC,|\bPUBLIC_BIDMOVE|\bI,BID,BIDDAYOFFER_D\b|\bYesterdays_Bids_Reports\b
  keywords:
    - id: Keyword_au_nem_rebid_log_trading
      groups:
        - match_style: word
          terms:
            - text: DUID
              case_sensitive: true
            - price band
            - pre-dispatch
            - predispatch
            - text: PD
              case_sensitive: true
            - text: RRP
              case_sensitive: true
            - dispatch interval
            - trading interval
            - text: MAXAVAIL
              case_sensitive: true
            - available capacity
            - price floor
            - price cap
      strength: specific
    - id: Keyword_au_nem_rebid_log_exclusion
      groups:
        - match_style: word
          terms:
            - Rebidding and Technical Parameters Guideline
            - Technical Parameters Guideline
            - media release
            - State of the Market
            - Wholesale markets quarterly
            - training exercise
      strength: specific
risk_rating: 8
risk_description: >-
  A rebid log or late-rebid contemporaneous record reveals a generator's real-time trading reasoning: what the desk
  knew and when (aware and decision times), plant conditions, price-band movements and the commercial trigger for
  each rebid. Before AEMO's next-day publication it is market-sensitive, and the fuller log narrative is never
  published; it is also the primary evidence in AER inquiries under NER cl 3.8.22A. Disclosure would expose trading
  strategy to competitors and prejudice regulatory processes. Risk 8 supports SENSITIVE Commercial-in-Confidence
  (commercial trading reasoning rather than financial statements; au-nem-bid-file carries SENSITIVE Financial for
  the bid prices themselves).
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Commercial-in-Confidence
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Commercial-in-Confidence and Medium because
    rebid logs record aware and decision times, plant conditions and the commercial trigger behind each rebid, and are
    primary AER evidence. PROTECTED is not met because exposure is confined to one participant's trading reasoning and a
    regulatory process.
  generic:
    classification: Medium
    dlm: Medium Commercial-in-Confidence
    rationale: >-
      Medium Commercial-in-Confidence handling applies to unpublished trading-desk reasoning that competitors or
      investigators could exploit.
references:
  - title: National Electricity Rules (AEMC) - cl 3.8.22, 3.8.22(ca), 3.8.22A, 3.13.4(p), Chapter 10 "late rebidding period"
    url: https://www.aemc.gov.au/regulation/energy-rules/national-electricity-rules
  - title: AER - Rebidding and Technical Parameters Guideline (October 2024), s 3.4 Form of rebid and s 3.2.2 contemporaneous record
    url: https://www.aer.gov.au/system/files/2024-10/AER%20-%20Rebidding%20and%20Technical%20Parameters%20Guidelines%20-%20updated%20October%202024_0.pdf
  - title: AEMO NEMweb current reports (public next-day bid data, decoy source)
    url: https://nemweb.com.au/Reports/Current/
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.0.3
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - anchored on NER cl 3.8.22(ca) and the AER guideline s 3.4 field set; 75 gated on populated time, category or HHMM~category~ reason structure; 85 on two distinct time fields plus trading evidence; AEMO public-file markers and the guideline excluded.
