schema: testpattern/v1
name: Community Corrections Order
slug: community-corrections-order
version: 1.5.0
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects community-based corrections orders including probation orders, parole conditions, and community service orders issued under the Corrective Services Act 2006 (Qld). These documents contain offender details, supervision conditions, approved addresses, and compliance assessments by Queensland Corrective Services.
operation: 'Keyword proximity: primary keywords (community corrections order, probation order, parole conditions, community service, supervision order, Queensland Corrective Services) within 300 characters of offender details and legislative references. Negative keyword exclusion for published recidivism statistics and policy discussions.'
pattern: (?i)\b(community\s+corrections?\s+order|probation\s+order|parole\s+(?:conditions?|order|board)|community\s+service\s+order|supervision\s+order|intensive\s+correction\s+order|Queensland\s+Corrective\s+Services)\b
confidence: medium
confidence_justification: 'Medium confidence: requires co-occurrence of corrections-specific order terminology with offender management details and Corrective Services Act references. The combination of order types with individual supervision conditions is unique to genuine corrections documents.'
jurisdictions:
  - au
regulations:
- "Corrective Services Act 2006 (Qld)"
- "Penalties and Sentences Act 1992 (Qld)"
frameworks:
- QGISCF
data_categories:
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - SENSITIVE
    - Legal
    - community corrections
    - probation order
    - parole conditions
    - community service
    - supervision order
    - Queensland Corrective Services
    - offender
    - compliance
    - approved address
    - reporting officer
    - parole board
    - Corrective Services Act
  proximity: 300
  keyword_lists:

    - law-enforcement

    - government-services
    - en-government-classification
customisation:
  - key: qcs-order-reference
    kind: identifier-format
    identifier: qcs-order-reference
    target: purview.regexes/Pattern_community_corrections_order_corrections_reference
    mode: replace
    affects_tiers: [85]
    required_for_enforcement: false
    note: "Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#qcs-order-reference). Earlier versions used the CCO-/PB-YYYY- reference format, which does not appear in any published source."
test_cases:
  should_match:
    - value: 'SENSITIVE Legal. Community Corrections Order — Corrective Services Act 2006 (Qld) s.91. Offender: [Name], DOB: 22/07/1991. Order Reference: CCO-2026-BNE-04523. Probation order: 18 months. Conditions: (1) Report to Brisbane Community Corrections office fortnightly. (2) Reside at approved address: [Address], Inala. (3) Participate in substance misuse program as directed. (4) Not leave Queensland without written permission. Supervising officer: Ms K. Nguyen, Queensland Corrective Services.'
      description: Community corrections order with probation conditions and approved address
    - value: 'Queensland Corrective Services — Parole Conditions. Offender [Name] released on parole effective 1 March 2026 pursuant to Corrective Services Act 2006 s.200. Parole Board decision reference: PB-2025-1847. Conditions: (1) Supervision order for 24 months. (2) Report to Gold Coast Community Corrections weekly for first 3 months, then fortnightly. (3) Intensive correction order conditions apply — GPS monitoring required. (4) No contact with co-offenders. Compliance breach will result in return to custody.'
      description: Parole conditions with GPS monitoring and compliance requirements
    - value: 'Community Service Order — Penalties and Sentences Act 1992 s.103. [Name] sentenced to 200 hours community service. Community Corrections assessment: offender suitable for placement at Ipswich City Council parks maintenance. Reporting schedule: Saturdays 7:00am at Ipswich Community Corrections. Hours completed: 48/200. Supervising officer assessment: satisfactory compliance to date. Next review: 15 April 2026.'
      description: Community service order with placement details and compliance assessment
    - value: "Community Corrections Order\nName: Avery Teston\nDate of birth: 04/02/1991\nReference number: RX22914471\nNotes: Community Corrections Order recorded against the subject; handling restricted."
      description: Populated justice record reaching the 75/85 structure gate
      synthetic: true
    - value: "Community corrections order — Queensland Corrective Services\nOffender: Riley Teston\nDate of birth: 14/03/1988\nOrder number: 2026-004471\nMade under the Corrective Services Act 2006. Approved address: 14 Wattlebird Street, Stafford QLD 4053. Supervising officer: Jordan Staffson."
      description: Complete record with a labelled reference in the documented identifier form (reaches 85)
      synthetic: true
  should_not_match:
    - value: Queensland Corrective Services published its annual report noting that 12,847 offenders were managed on community-based orders during 2024-25. The recidivism rate for community corrections was 38.2% over two years.
      description: Published QCS annual report with recidivism statistics
    - value: The Sentencing Advisory Council released a policy paper discussing the effectiveness of community corrections orders compared with short-term imprisonment, recommending expanded use of intensive correction orders.
      description: Policy discussion on community corrections effectiveness
    - value: A corrections studies textbook chapter examines the principles of community-based sentencing and the role of Queensland Corrective Services in supervising probation and parole orders.
      description: Academic textbook on corrections and sentencing
    - value: "Policy guidance: this procedure explains how records about Community Corrections Order are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Published QCS annual reports with aggregate corrections statistics
    mitigation: 'Negative keyword exclusion: ''annual report'', ''published'', ''recidivism rate'', ''reporting period'''
  - description: Sentencing advisory and law reform policy papers
    mitigation: 'Negative keyword exclusion: ''policy paper'', ''advisory council'', ''recommending'', ''effectiveness'''
  - description: Academic materials on corrections and sentencing principles
    mitigation: 'Negative keyword exclusion: ''textbook'', ''academic'', ''chapter'', ''examines'', ''university'''
  - description: Job advertisements for Queensland Corrective Services positions
    mitigation: 'Negative keyword exclusion: ''vacancy'', ''position available'', ''apply online'', ''selection criteria'''
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_community_corrections_order_corrections_order_terms
      matches:
        - ref: Regex_community_corrections_order_record_structure
          min_count: 2
          unique_results: true
        - ref: Evidence_community_corrections_order_classification_markers
        - ref: Evidence_community_corrections_order_corroborative_terms
        - ref: Pattern_community_corrections_order_corrective_services_act
        - ref: Pattern_community_corrections_order_corrections_reference
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_community_corrections_order_exclusion
    - confidence_level: 75
      id_match: Pattern_community_corrections_order_corrections_order_terms
      matches:
        - type: any
          refs:
            - Regex_community_corrections_order_record_structure
            - Evidence_community_corrections_order_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_community_corrections_order_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_community_corrections_order_corrections_order_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_community_corrections_order_exclusion
  regexes:
    - id: Pattern_community_corrections_order_corrections_order_terms
      pattern: (?i)\b(community\s+corrections?\s+order|probation\s+order|parole\s+(?:conditions?|order|board)|community\s+service\s+order|supervision\s+order|intensive\s+correction\s+order)\b
    - id: Pattern_community_corrections_order_corrective_services_act
      pattern: (?i)\bCorrective\s+Services\s+Act\s+2006\b
    - id: Pattern_community_corrections_order_corrections_reference
      pattern: "(?i)\\b(?:parole\\s+order|community\\s+(?:corrections|service)\\s+order|PBQ|order)\\s+(?:no\\.?|number|ref(?:erence)?)\\s*[:#]?\\s*[A-Z0-9][A-Z0-9/-]{3,20}\\b"
    - id: Regex_community_corrections_order_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|defendant|accused|offender|prisoner|inmate|detainee|respondent|applicant|witness|informant|suspect|subject\s+(?:name|person)|person\s+of\s+interest|POI|victim|complainant|officer|CNI|QPRIME|(?:file|case|matter|court|reference|ref|exhibit|brief|job|incident|report|investigation|occurrence)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_community_corrections_order_classification_markers
      groups:
        - match_style: word
          terms:
            - Legal
            - Corrective Services Act 2006
            - Penalties and Sentences Act 1992
            - Queensland Corrective Services
      strength: specific
    - id: Evidence_community_corrections_order_corroborative_terms
      groups:
        - match_style: word
          terms:
            - offender
            - approved address
            - supervising officer
            - compliance
            - compliance breach
            - return to custody
            - GPS monitoring
            - substance misuse program
            - reporting schedule
            - hours completed
            - fortnightly
            - no contact
      strength: specific
    - id: Filter_community_corrections_order_exclusion
      groups:
        - match_style: word
          terms:
            - published
            - annual report
            - recidivism rate
            - reporting period
            - policy paper
            - advisory council
            - recommending
            - effectiveness
            - textbook
            - academic
            - chapter
            - examines
            - university
            - vacancy
            - position available
            - apply online

      strength: noise
risk_rating: 7
risk_description: >-
  This detector finds a probation, parole, community-service, or supervision order containing offender identity, approved address, monitoring conditions, placement, compliance assessment, and correctional reference. Unauthorised disclosure can reveal criminal history, movements, home or placement information, and supervision controls, enabling stigma, harassment, or deliberate evasion by the offender or associates. Published correctional statistics, sentencing policy, academic material, and job advertisements are excluded, so the normal unit is one active personal order. Risk 7 supports SENSITIVE Legal; PROTECTED would require covert monitoring methods, protected residences, immediate safety risk, or compromise across a corrections system.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
references: []
created: '2026-03-06'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: "Replace the CCO-/PB-YYYY- reference format (not found in any published source) with the documented qcs-order-reference labelled-reference fallback and declare an identifier-format customisation slot (mode replace) so the customer's real format can be supplied at engagement. Test values updated to labelled references."
  - version: 1.4.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires either independent justice record structure (Regex ..._record_structure) or one of the hand-authored corroborative terms (none of which the primary matches); 85 requires 2 distinct structure hits plus the existing hand-authored evidence. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1500 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
