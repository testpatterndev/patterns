schema: testpattern/v1
name: School Counselling and Guidance Case Record (Identified Student)
slug: au-education-school-counselling-record
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Case notes and session records kept by a school counsellor, guidance officer (Queensland), school psychologist or student wellbeing team about an identified student: a populated student field together with counselling content such as the presenting concern, reason for referral, risk assessment, mental health, family circumstances, referrals and follow-up. These are the records the NSW Audit Office report "Security and privacy of student information" (29 June 2026) lists as counsellor records and mental health status, and the kind of file two students were able to open in the incident it describes. Boundary with neighbouring classifiers: behaviour support and student safety plans are au-education-student-safety-behaviour-plan; medical and health-care plans are au-education-individual-health-plan; student protection (harm) reports are au-education-school-student-protection-report; family law and domestic violence orders held for a student are au-education-student-court-orders-record; OneSchool curriculum and learning plans are au-qld-oneschool-student-support-plan. global-top500-346-student-counseling-records is the international topic classifier (US spelling, enforces on any one populated student, parent or name field near a wellbeing phrase); this pattern uses Australian role names and needs counselling content as well as a named student.
operation: >-
  Primary: a counselling role or record phrase (school counsellor, school counselling, guidance officer, school psychologist, student wellbeing officer/coordinator/leader/team/record/case notes, counselling notes/case notes/file/record/session, wellbeing case notes, guidance file, guidance counselling). 65 (discovery only): the phrase alone. 75: within 500 characters, a populated student field (Student / Student name / Student ID / pupil / young person / child / EQ ID followed by a non-placeholder value; year level and generic name or date-of-birth labels do not count) AND either a populated counselling content field (presenting concern, reason for referral, referred to, risk assessment, risk of harm, mental health, diagnosis, family circumstances, session notes, case notes, counsellor notes, intervention, safety plan, follow-up, action taken, outcome, disclosure - each followed by a value) or a wellbeing content term in the narrative (self-harm, suicidal, anxiety, depression, panic attacks, eating disorder, self-referred, risk of harm, mental health, trauma, grief, bullying, family violence, domestic violence, child safety, headspace, CYMHS, CAMHS). 85: the student field AND a populated content field AND a wellbeing content term. All enforce tiers AND NOT the shared template-exclusion dictionary and a guidance exclusion (this policy, this procedure, this guideline, fact sheet, information for parents, frequently asked questions, media release, position description, selection criteria). Proximity is 500 rather than 300 because case notes are usually a short header block followed by narrative.
pattern: >-
  (?i)\b(school\s+counsell?or(?:'s)?|school\s+counsell?ing|guidance\s+officer(?:'s)?|school\s+psychologist(?:'s)?|student\s+wellbeing\s+(?:officer|coordinator|leader|team|record|case\s+notes?)|counsell?ing\s+(?:case\s+)?(?:notes?|file|record|session)|wellbeing\s+case\s+notes?|guidance\s+(?:file|counselling))\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a named or numbered student and counselling content next to the role or record phrase, which policies, blank referral forms, newsletters, position descriptions and news about student-information incidents do not carry. Not high because counselling case notes have no published standard layout: the field labels are common practice wording rather than a verified form, a narrative note with no labelled fields reaches 75 only through a wellbeing term, and the tiers are heuristic evidence gates rather than measured accuracy. Test values are synthetic.
jurisdictions:
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - Education (General Provisions) Act 2006 (Qld)
  - NDB Scheme (Cth)
frameworks:
  - QGISCF
data_categories:
  - pii
  - health
  - children
  - education
corroborative_evidence:
  keywords:
    - school counsellor
    - guidance officer
    - school psychologist
    - case note
    - presenting concern
    - reason for referral
    - risk assessment
    - student name
  proximity: 500
test_cases:
  should_match:
    - value: "SCHOOL COUNSELLING - CASE NOTE\nStudent name: Avery Teston\nYear level: 9\nSchool counsellor: M. Ellisdale\nPresenting concern: Low mood and school refusal over three weeks\nRisk assessment: Low - no current thoughts of self-harm\nFamily circumstances: Parents separated in June; living with grandmother\nReferral to: GP for a mental health care plan; headspace intake booked"
      description: Labelled school counsellor case note with student, presenting concern, risk assessment and referral (85)
      synthetic: true
    - value: "Guidance Officer case note - 12/08/2026\nStudent: Riley Marlow (Year 8)\nRiley self-referred at lunch. Reports ongoing anxiety and trouble sleeping since the move. Nothing to suggest harm at home. Agreed to weekly check-ins; mum to be contacted with Riley's consent."
      description: Header block followed by narrative, no labelled content fields - reaches 75 through the wellbeing terms, not 85
      synthetic: true
    - value: "Student wellbeing team - counselling session record\nStudent ID: 0048213771\nSchool psychologist: J. Okafor\nReason for referral: Teacher concern about withdrawal and weight loss\nMental health: Possible eating disorder - parent consent obtained for referral\nFollow-up: CYMHS referral sent 14/08/2026; safety plan reviewed"
      description: School psychologist session record keyed on a student ID with referral and mental health fields (85)
      synthetic: true
    - value: "The school counselling file is kept in the locked cabinet."
      description: Record phrase alone (65 discovery)
      synthetic: true
  should_not_match:
    - value: "School counsellors and school psychologists keep counselling notes on a confidential file. Access is limited to the counselling service, and information may be shared with the principal where there is a risk of harm to the student or others."
      description: Policy wording about counselling records, no student (65 only)
    - value: "Guidance officer referral form\nStudent name: ____________\nYear level: ____\nReason for referral: ____________\nRisk assessment: ____________\nParent/carer consent: Yes / No"
      description: Blank referral form with unpopulated fields (65 only)
    - value: "The Audit Office found two high school students had accessed about 2,000 files, some holding other students' mental health diagnoses, behavioural concerns and family circumstances. Counsellor records are among the most sensitive information schools hold, and school counselling files should be restricted to the counselling service."
      description: News report about a student-information incident (65 only)
    - value: "Wellbeing Week: our guidance officer and school psychologist will run lunchtime workshops on anxiety and bullying for Year 7 to 9 students. Bookings through the office."
      description: School newsletter item naming the roles and topics, no student (65 only)
    - value: "Position description - Guidance Officer\nSelection criteria: experience in counselling, risk assessment and mental health referral for school-aged students.\nStudent: counsellor ratio at this campus is 1:650."
      description: Job advertisement - removed from enforce tiers by the guidance exclusion (65 only)
false_positives:
  - description: Counselling service policies, consent forms, role descriptions and blank guidance referral forms, which use every role and field label.
    mitigation: Enforce tiers need a student field with a real value; placeholder underscores, brackets and label-only fields do not match, and the guidance exclusion removes policies, fact sheets and position descriptions.
  - description: Behaviour incident emails and teacher referrals that name a student and mention the guidance officer and a wellbeing term ("Student - Avery Teston - referred to guidance officer after bullying incident").
    mitigation: These reach 75. They are wellbeing information about an identified student and close to the intended content, but they are not the counsellor's own case notes. If volume is high, enforce at 85 only, which needs a populated counselling content field.
  - description: University, TAFE, workplace (EAP) and community counselling notes.
    mitigation: Phrases such as "counselling notes" match at 65, and a note that labels the client "Student" reaches enforce tiers. University and TAFE counselling records are equally sensitive; adult EAP notes labelled "Client" or "Employee" do not reach an enforce tier.
  - description: Case notes that label the student only as "Name" or by initials, or that carry no role or record phrase.
    mitigation: Not detected at an enforce tier (false negative). Generic "Name" and "Date of birth" labels are deliberately not counted, to keep adult counselling and health records out; add the organisation's own case-note template labels at deployment.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 500
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_edu_counselling_primary
      matches:
        - ref: Regex_au_edu_counselling_student_field
        - ref: Regex_au_edu_counselling_content_field
        - ref: Keyword_au_edu_counselling_wellbeing_content
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_edu_counselling_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_edu_counselling_primary
      matches:
        - ref: Regex_au_edu_counselling_student_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_edu_counselling_content_field
            - Keyword_au_edu_counselling_wellbeing_content
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_edu_counselling_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_edu_counselling_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_edu_counselling_primary
      pattern: >-
        (?i)\b(school\s+counsell?or(?:'s)?|school\s+counsell?ing|guidance\s+officer(?:'s)?|school\s+psychologist(?:'s)?|student\s+wellbeing\s+(?:officer|coordinator|leader|team|record|case\s+notes?)|counsell?ing\s+(?:case\s+)?(?:notes?|file|record|session)|wellbeing\s+case\s+notes?|guidance\s+(?:file|counselling))\b
    - id: Regex_au_edu_counselling_student_field
      pattern: >-
        (?i)\b((?:(?:student|pupil|young\s+person|child)(?:'s)?(?:\s+(?:full\s+|preferred\s+|legal\s+)?(?:name|ID|number|no\.?))?|EQ\s*ID)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Regex_au_edu_counselling_content_field
      pattern: >-
        (?i)\b((?:presenting\s+(?:concern|issue|problem)s?|reason\s+for\s+referral|referral\s+reason|referred\s+(?:by|to)|referral\s+to|risk\s+(?:assessment|level|rating)|risk\s+of\s+(?:harm|self-harm)|mental\s+health(?:\s+(?:status|concerns?|diagnosis|history))?|diagnos[ie]s|family\s+(?:circumstances|background|situation)|session\s+(?:notes?|summary)|case\s+notes?|counsell?or(?:'s)?\s+notes?|intervention|safety\s+plan|follow[\s-]?up(?:\s+actions?)?|actions?\s+taken|outcome|disclosure)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|not\s+recorded)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/',.-]{1,40})
  keywords:
    - id: Keyword_au_edu_counselling_wellbeing_content
      groups:
        - match_style: word
          terms:
            - self-harm
            - suicidal
            - suicide
            - anxiety
            - depression
            - panic attacks
            - eating disorder
            - self-referred
            - risk of harm
            - mental health
            - trauma
            - grief
            - bullying
            - family violence
            - domestic violence
            - child safety
            - headspace
            - text: CYMHS
              case_sensitive: true
            - text: CAMHS
              case_sensitive: true
      strength: domain
    - id: Keyword_au_edu_counselling_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - fact sheet
            - information for parents
            - frequently asked questions
            - media release
            - position description
            - selection criteria
      strength: exclusion
risk_rating: 8
risk_description: >-
  The classifier enforces on a school counsellor, guidance officer or school psychologist record that names a student and carries counselling content: presenting concerns, risk assessment, mental health, family circumstances and referrals; role and record phrases alone stay at 65 discovery. A genuine match is health and wellbeing information about an identified child, given in confidence, and may record self-harm risk, family breakdown, disclosures and mental health referrals. Disclosure to other students, staff without a need to know or people outside the school can cause lasting stigma and bullying, deter the student and others from seeking help, and expose family circumstances; the 2026 NSW audit describes exactly this exposure through over-shared school files. The normal unit is one student's notes, so risk 8 supports SENSITIVE Personal-Privacy. PROTECTED would need a bulk counselling register, a record that reveals a child's protected location, or content already covered by the student protection and court-order classifiers.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because an
    enforced match is confidential health and wellbeing information about one identified student. PROTECTED is not met
    because the detector does not establish bulk scale, a safety-critical location or a child protection or court-order
    record, which have their own classifiers.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium with Medium Personal-Privacy handling fits one student's counselling notes. High would need a bulk
      register or content that puts a child at risk of physical harm.
references:
  - title: Audit Office of New South Wales - Security and privacy of student information (29 June 2026) - student information schools hold includes counsellor records and mental health status; two students accessed about 2,000 files including other students' mental health diagnoses, behavioural concerns, family circumstances and disabilities
    url: https://www.audit.nsw.gov.au/our-work/reports/security-and-privacy-of-student-information
  - title: NSW Department of Education - Legal Issues Bulletin 51, School counsellors and confidentiality - school counsellor files hold confidential counsellor information; disclosure where a child is at risk of significant harm or there is a risk of serious injury
    url: https://education.nsw.gov.au/rights-and-accountability/legal-issues-bulletins/school-counsellors-and-confidentiality
  - title: Queensland Academies Creative Industries (Queensland state school) - Guidance officer - Queensland role title; guidance officers provide guidance and counselling services, case management and referral, in confidence except where there is a risk of harm
    url: https://qaci.eq.edu.au/support-and-resources/support-staff/guidance-officer
created: '2026-11-16'
updated: '2026-11-16'
changelog:
  - version: 1.0.0
    date: '2026-11-16'
    description: Initial release - school counsellor, guidance officer and school psychologist case records about an identified student. 75 needs a populated student field plus a populated counselling content field or a wellbeing term in the narrative; 85 needs the student field, a content field and a wellbeing term. Policies, blank referral forms, newsletters, position descriptions and incident news stay at 65 discovery.
