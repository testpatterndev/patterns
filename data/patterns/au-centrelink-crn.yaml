changelog:
  - version: 1.6.0
    date: '2026-11-16'
    description: 'Concession card numbers: Services Australia states that Centrelink concession and health care cards display the CRN, and breach notices in 2026 (energy retailer and GP network customer records) described exposed "concession card numbers". A concession card label (concession card, Health Care Card, Seniors Health Card) now satisfies the 75 label gate alongside CRN/Centrelink/Services Australia; 85 still needs independent welfare context. The regex also accepts the 3-3-3 spaced form Services Australia writes (123 456 789A). Added Services Australia and HL7 Australia references and specific false positives.'
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 3 verified legislation/regulator references."
  - version: 1.4.0
    date: '2026-07-18'
    description: 'Profile quality: treat the bare CRN shape as discovery-only, require an explicit Centrelink/CRN label at medium and independent welfare context at high, with template rejection and exact-tier tests.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 527 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-04'
    description: case/evidence metadata update
