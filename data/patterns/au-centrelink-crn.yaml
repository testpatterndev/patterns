schema: testpattern/v1
name: Centrelink Customer Reference Number
slug: au-centrelink-crn
version: 1.6.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects candidate Centrelink Customer Reference Numbers consisting of 9 digits followed by a letter,
  written solid or in the 3-3-3 grouping Services Australia uses (123 456 789A).
  The bare shape is not unique and requires a CRN/Centrelink label, or a concession card label, for
  enforcement. The CRN is the number printed on Centrelink-issued concession and health care cards
  (Pensioner Concession Card, Health Care Card including Low Income, Commonwealth Seniors Health Card),
  so a "concession card number" in customer, patient or billing records is a CRN.
operation: >-
  Pattern_au_crn matches the bare 9-digit-plus-letter candidate (optionally spaced 3-3-3) and is
  discovery-only at 65. A CRN, Customer Reference Number, Centrelink, or Services Australia label, or a
  concession card label (concession card, Pensioner Concession Card, Health Care Card, Commonwealth
  Seniors Health Card), raises it to 75; independent welfare-benefit context (welfare, benefits,
  payment, pension, allowance, named payments) raises the labelled value to 85. A card name alone does
  not count as welfare context, so "Concession card number: 204817365A" with "Pensioner Concession Card"
  nearby is 75, not 85. Enforcing tiers reject explicit templates.
pattern: \b(\d{3}[ ]?\d{3}[ ]?\d{3}[A-Za-z])\b
confidence: low
confidence_justification: >-
  Low confidence: the 9-digit-plus-letter pattern is generic and may match unrelated alphanumeric sequences. Corroborative evidence keywords such as Centrelink, CRN, or Services Australia are
  essential for reliable detection.
jurisdictions:
  - au
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - pii
  - government-id
corroborative_evidence:
  keywords:
    - Centrelink
    - CRN
    - Customer Reference Number
    - concession card
    - Health Care Card
  proximity: 300
  keyword_lists:
    - au-government-services-australia
test_cases:
  should_match:
    - value: 123456789A
      description: Low-tier probe - bare candidate shape
    - value: 'CRN: 987654321Z'
      description: Medium-tier probe - explicitly labelled CRN
    - value: 'Centrelink payment record - Customer Reference Number 111222333B'
      description: High-tier probe - labelled CRN with welfare-payment context
    - value: "Concession card number: 204817365A\nCard type: Pensioner Concession Card"
      description: Medium-tier probe - CRN recorded as a concession card number in a customer record (75)
      synthetic: true
    - value: 'Health Care Card - CRN: 204 817 365A'
      description: Medium-tier probe - spaced 3-3-3 form as written by Services Australia, health care card label (75)
      synthetic: true
    - value: 'Pensioner Concession Card number 204817365A - Disability Support Pension recipient, energy concession applied from 01/07/2026'
      description: High-tier probe - concession card label with independent pension context (85)
      synthetic: true
  should_not_match:
    - value: 12345678A
      description: Only 8 digits instead of 9 before letter
    - value: 1234567890A
      description: 10 digits instead of 9 before letter
    - value: '123456789'
      description: Missing trailing letter
    - value: 'Training example: Centrelink payment CRN 123456789A'
      description: Structurally complete but explicitly framed training content
    - value: 'Student concession card number: 204817365'
      description: Transport or student concession number with no trailing letter is not a CRN
    - value: 'Customers with a Pensioner Concession Card or Health Care Card can apply for the energy concession. Have your concession card number ready when you call.'
      description: Concession guidance naming the cards without any card number
false_positives:
  - description: Pensioner Concession Cards and Commonwealth Seniors Health Cards issued by the Department of Veterans' Affairs, which show a DVA file number rather than a CRN (per the HL7 Australia card-number profiles; not confirmed from a DVA page).
    mitigation: A DVA file number has a state-letter prefix and does not match this shape; global-dva-file-number covers it.
  - description: Other cards called concession cards - state seniors cards, transport and student concession cards, companion cards - whose numbers are not CRNs.
    mitigation: Their numbers do not have the nine-digits-plus-letter shape, so the concession card label alone does not create a match. A nine-digit-plus-letter stock or order code near the words "concession card" would reach 75.
  - description: Common words and phrases related to centrelink customer reference number appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
risk_rating: 4
risk_description: >-
  The identifier pattern matches nine digits followed by a letter, with Centrelink, Services Australia, concession card, or welfare context increasing confidence but a low tier allowing the bare shape. A valid CRN can connect a person to benefits administration and may assist targeted impersonation when combined with a name, date of birth, or account information. The atomic number alone does not reveal entitlement, payment, household circumstances, or online access and the broad structure can collide with unrelated references. Risk 4 OFFICIAL reflects low standalone harm; SENSITIVE is not met without person linkage, substantive welfare details, authentication data, or a compiled claimant record.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 maps to PSPF OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM, and Low because a CRN is an administrative
    identifier with limited independent utility. SENSITIVE is not met without identity, benefit, payment, or access
    context.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low handling is proportionate for one Centrelink reference number whose meaningful misuse depends on
      additional personal or account information.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_au_crn
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_services_australia
            - Evidence_concession_card
        - ref: Evidence_welfare_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_au_crn
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_services_australia
            - Evidence_concession_card
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_au_crn
  regexes:
    - id: Pattern_au_crn
      pattern: \b(\d{3}[ ]?\d{3}[ ]?\d{3}[A-Za-z])\b
  keywords:
    - id: Evidence_services_australia
      groups:
        - match_style: word
          terms:
            - Centrelink
            - text: CRN
              case_sensitive: true
            - Customer Reference Number
            - Services Australia
      strength: specific
    - id: Evidence_concession_card
      groups:
        - match_style: word
          terms:
            - concession card
            - Health Care Card
            - healthcare card
            - Seniors Health Card
      strength: specific
    - id: Evidence_welfare_context
      groups:
        - match_style: word
          terms:
            - Centrelink
            - Services Australia
            - welfare
            - benefits
            - payment
            - pension
            - allowance
            - JobSeeker
            - Youth Allowance
            - Disability Support Pension
      strength: domain
references:
  - title: "Services Australia - Centrelink Customer Reference Number (CRN) - a CRN is 9 numbers and ends with a letter (123 456 789A); found on Centrelink letters and on the concession card"
    url: https://www.servicesaustralia.gov.au/centrelink-customer-reference-number-crn
  - title: "Services Australia - Concession and health care cards - the card displays the Customer Reference Number; card types include Pensioner Concession Card, Health Care Card, Low Income Health Care Card and Commonwealth Seniors Health Card"
    url: https://www.servicesaustralia.gov.au/concession-and-health-care-cards
  - title: "HL7 Australia AU Base - Pensioner Concession Card Number profile - the card number is the Centrelink CRN as displayed on the card (10 characters); DVA-issued cards show a DVA file number instead"
    url: https://hl7.org.au/fhir/StructureDefinition-au-pensionerconcessioncardnumber.html
  - title: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)"
    url: https://www.legislation.gov.au/C2006A00169/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
