schema: testpattern/v1
name: Campus incident reports
slug: global-top500-353-campus-incident-reports
version: 1.5.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to campus incident reports in Australian contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(?:campus\s+incident\s+reports|campus\s+incident|security\s+incident|student\s+conduct|incident\s+report|campus\s+security|safety\s+officer|witness\s+statement|incident\s+number|police\s+report|emergency\s+response|workplace\s+health\s+and\s+safety)\b
confidence: medium
confidence_justification: structural regex with domain-specific anchors and constrained context replaces phrase-only marker. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - campus incident reports
    - campus
    - incident
    - reports
    - education
    - research
    - administration
  proximity: 300
test_cases:
  should_match:
    - value: campus incident reports
      description: Primary topic phrase match
    - value: campus incident
      description: Case-insensitive topic phrase match
    - value: security incident
      description: Alternative topic phrase match
    - value: student conduct
      description: Additional topic phrase match
    - value: "campus incident reports\nStudent name: Avery Teston\nStudent ID: S4471820\nYear level: 9\nParent: Jordan Teston\nNotes: campus incident reports discussed with the family on 12/08/2026."
      description: Populated student record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: campus incident security incident
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how records about campus incident reports are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to campus incident reports appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_campus_incident_reports
      matches:
        - ref: Regex_global_top500_353_campus_incident_reports_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_campus_incident_reports
      matches:
        - ref: Regex_global_top500_353_campus_incident_reports_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_campus_incident_reports
      matches:
        - ref: Evidence_campus_incident_reports
  regexes:
    - id: Pattern_campus_incident_reports
      pattern: >-
        (?is)\b(?:campus\s+incident\s+reports|campus\s+incident|security\s+incident|student\s+conduct|incident\s+report|campus\s+security|safety\s+officer|witness\s+statement|incident\s+number|police\s+report|emergency\s+response|workplace\s+health\s+and\s+safety)\b
    - id: Regex_global_top500_353_campus_incident_reports_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|candidate|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|(?:student|candidate|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_campus_incident_reports
      groups:
        - match_style: word
          terms:
            - campus incident reports
            - campus incident
            - security incident
            - student conduct
            - incident report
            - campus security
            - safety officer
            - witness statement
            - incident number
            - police report
            - emergency response
            - workplace health and safety
risk_description: >-
  This concept detector recognises campus incident reports, campus incident, and security incident language with nearby report terms. A normal true positive may identify students, staff, witnesses, injuries, alleged offenders, locations, and response actions, creating privacy, reputation, and sometimes safety consequences. Public safety guidance, exercise scenarios, and empty reporting forms can also trigger the medium-confidence detector without describing an actual event. Risk 8 SENSITIVE fits a contained incident report, while PROTECTED requires active threat locations, protected witnesses, mass casualty details, or significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the Personal-Privacy DLM, and Medium for an
    identifiable campus incident case. PROTECTED is not met because the normal report does not necessarily expose
    imminent safety operations, privileged investigations, or institution-wide significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy DLM protect allegations, identities, and response details whose disclosure can
      seriously affect campus participants and proceedings.
created: '2026-02-08'
updated: '2026-09-25'
changelog:
  - version: 1.5.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.5.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires independent student record structure (Regex ..._record_structure); 85 requires 2 distinct structure hits. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 940 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-12'
    description: 'Baseline burn-down A2: tier@85''s Evidence_campus_incident_reports group is textually identical to the id_match regex''s own alternation (both list "campus incident", "security incident", etc.), so should_not_match: "campus incident security incident" satisfied the existing min_count: 2 / unique_results gate by stuffing two id_match synonyms against each other — self-corroboration in the purest form. Added a genuinely independent AND-evidence requirement (Evidence_data_record_context, imported via shared_keywords) to tier@85 and tier@75 so two on-topic phrase synonyms can no longer satisfy either tier alone. Also marked the bare tier@65 discovery_only (no-evidence shape) so it surfaces in discovery inventory rather than gating should_not_match.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
