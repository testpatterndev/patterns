schema: testpattern/v1
name: "New Zealand Electricity Installation Control Point (ICP) Identifier"
slug: nz-icp-number
version: 1.0.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects 15-character New Zealand Electricity Authority Installation Control Point (ICP) identifiers assigned under Part 11 of the Electricity Industry Participation Code: 10 digits + 2 uppercase distributor code letters + 3 uppercase hexadecimal checksum characters (e.g. 0000123456UN4F2).
operation: >-
  Matches the exact 15-character \d{10}[A-Z]{2}[0-9A-F]{3} ICP structure on word boundaries. Tier 65 discovers bare ICPs; Tiers 75/85 require ICP, Electricity Authority, registry, metering, or NZ energy-retailer corroboration.
pattern: '(?-i)\b(\d{10}[A-Z]{2}[0-9A-F]{3})\b'
confidence: high
confidence_justification: >-
  High confidence: 10 digits + 2 uppercase letters + 3 uppercase hex characters (15 characters exact) is an austere, high-specificity format standardized across the New Zealand electricity market.
jurisdictions:
  - nz
regulations:
  - "Privacy Act 2020 (NZ)"
  - "Electricity Industry Act 2010 (NZ)"
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - energy-market
  - pii
  - infrastructure
corroborative_evidence:
  keywords:
    - "ICP"
    - "Installation Control Point"
    - "Electricity Authority"
    - "electricity account"
    - "smart meter"
    - "lines company"
  proximity: 300
test_cases:
  should_match:
    - value: "ICP: 0000482917UN4F2"
      description: "15-character Vector/Auckland ICP identifier with label"
    - value: "0001928374WE9A1"
      description: "Bare 15-character Wellington Electricity ICP identifier (65 discovery)"
    - value: "Installation Control Point 0000738291OR2C8 switched retailer"
      description: "Orion network ICP in retail-switching note"
  should_not_match:
    - value: "0000482917UN4GZ"
      description: "Trailing 3 characters contain G and Z (invalid outside [0-9A-F] hex checksum)"
    - value: "000048291UN4F2"
      description: "Nine leading digits instead of required 10"
    - value: "Find your 15-character ICP number on the top right of your power bill"
      description: "Prose instruction without an ICP value"
    - value: "Sample template: placeholder example record for training only"
      description: "Template/sample fixture suppressed by shared exclusion dictionary"
false_positives:
  - description: "Commercial tender schedules publishing government building ICPs."
    mitigation: "Enforcing tiers enable local_noise_filter so asset owners can suppress published facility ICPs."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 6
risk_description: >-
  The detector matches a 15-character New Zealand Electricity Authority Installation Control Point identifier. Like Australia's NMI, a residential or customer-linked ICP uniquely identifies a household supply address, half-hour smart-meter consumption, medically dependent consumer status, and retailer switching records under the Privacy Act 2020 (NZ). Risk 6 and SENSITIVE Personal-Privacy match au-nmi.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Medium
  rationale: >-
    Risk 6 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy, and Medium because a customer-linked NZ ICP identifies a supply premises, consumption profile, and medically dependent consumer status, paralleling au-nmi.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling reflects a customer-attributable electricity metering connection identifier.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      local_noise_filter: true
      id_match: Regex_nz_icp
      matches:
        - ref: Keyword_nz_icp_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match: Regex_nz_icp
      matches:
        - ref: Keyword_nz_icp_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_nz_icp
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_nz_icp
      pattern: '(?-i)\b(\d{10}[A-Z]{2}[0-9A-F]{3})\b'
  keywords:
    - id: Keyword_nz_icp_specific
      groups:
        - match_style: word
          terms:
            - "Installation Control Point"
            - "Electricity Authority"
            - "Electricity Registry"
            - "medically dependent consumer"
      strength: specific
    - id: Keyword_nz_icp_broad
      groups:
        - match_style: word
          terms:
            - text: "ICP"
              case_sensitive: true
            - "power bill"
            - "electricity account"
            - "lines company"
            - "smart meter"
            - "kWh"
      strength: domain
references:
  - url: https://www.ea.govt.nz/operations/retail/ispens-and-registry/
    title: "New Zealand Electricity Authority - ICP Identifiers and Electricity Registry"
created: '2026-11-25'
updated: '2026-11-25'
changelog:
  - version: 1.0.0
    date: '2026-11-25'
    description: Initial release.
author: testpattern-community
