changelog:
- version: 1.3.0
  date: '2026-10-20'
  description: 'Generated name-word tier removed: the 85 and 75 tiers ANDed Pattern_*_label_context (the detector name, "Capacity planning models") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 85. Both lists sit inside the IdMatch phrase, so the bare name alone scored 85. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs a populated technical artefact field (Regex_global_top500_306_capacity_planning_models_record_structure); 85 needs 2 distinct fields. Curated terms that sit inside an IdMatch hit were removed. "headroom" restates the topic and is dropped. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
- version: 1.2.5
