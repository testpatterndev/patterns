schema: testpattern/v1
name: Capacity planning models
slug: global-top500-306-capacity-planning-models
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies capacity planning models patterns in security and access control contexts. Detects potential exposure
  of sensitive security information in international systems.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 6 keywords within 300 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:capacity\s+planning|capacity\s+model|resource\s+forecasting|growth\s+projection|throughput\s+analysis|peak\s+utilization|scaling\s+threshold|infrastructure\s+sizing|performance\s+baseline|demand\s+forecast|capacity\s+report)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
- GDPR
data_categories:
- credentials
- security
corroborative_evidence:
  keywords:
  - capacity planning models
  - capacity
  - planning
  - models
  - operations
  - resilience
  proximity: 300
test_cases:
  should_match:
  - value: capacity planning
    description: Primary topic phrase match
  - value: capacity model
    description: Case-insensitive topic phrase match
  - value: resource forecasting
    description: Alternative topic phrase match
  - value: growth projection
    description: Additional topic phrase match
  - value: |-
      Capacity planning
      Hostname: app-prd-01.corp.local
    description: Populated technical artefact with one field (75 tier)
    synthetic: true
  - value: |-
      Capacity planning
      Hostname: app-prd-01.corp.local
      Source 10.20.30.40 tcp/443
    description: Populated technical artefact with 2 distinct fields (85 tier)
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: backup outage
    description: Generic word pair from old broad template should not match
  - value: Capacity planning models
    description: "Bare detector name: it reached 85 through the generated name-word tier and must not reach an enforcing tier"
  - value: |-
      Capacity planning:
      Hostname:
      username:
    description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
  - value: "Policy guidance: this procedure explains how records about capacity planning are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Authentication-related terminology in software documentation, security training materials, or system architecture
    descriptions without actual credentials.
  mitigation: Require proximity to credential-specific patterns (API keys, connection strings, tokens) rather than general
    security terminology.
- description: Code snippets and configuration examples containing credential-related keywords or placeholder values in developer
    documentation.
  mitigation: Check for common placeholder patterns (example.com, localhost, 0000) and documentation file types to reduce
    false positives from technical writing.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_capacity_planning
    matches:
      - ref: Regex_global_top500_306_capacity_planning_models_record_structure
        min_count: 2
        unique_results: true
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 75
    id_match: Regex_capacity_planning
    matches:
      - ref: Regex_global_top500_306_capacity_planning_models_record_structure
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_capacity_planning
    matches:
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  regexes:
  - id: Regex_capacity_planning
    pattern: (?is)\b(?:capacity\s+planning|capacity\s+model|resource\s+forecasting|growth\s+projection|throughput\s+analysis|peak\s+utilization|scaling\s+threshold|infrastructure\s+sizing|performance\s+baseline|demand\s+forecast|capacity\s+report)\b
  - id: Regex_global_top500_306_capacity_planning_models_record_structure
    pattern: (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\bCVE-\d{4}-\d{4,7}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:tcp|udp)\s*/?\s*\d{2,5}\b|\b(?:port|dport|sport)\s*[:=]?\s*\d{2,5}\b|\b(?:hostname|host|asset\s+ID|device\s+ID|sAMAccountName|UPN|username|account\s+name)\s*:\s*(?!_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9][A-Za-z0-9._\\@-]{2,63}
risk_description: The detector identifies capacity planning, resource forecasts, growth projections, throughput, peak utilisation,
  scaling thresholds, sizing, performance baselines, and demand forecasts associated with planning models. A genuine model
  can disclose service demand, bottlenecks, spare capacity, planned growth, and investment assumptions that competitors or
  attackers could exploit. The affected scale is the represented service portfolio and its operators or customers, while generic
  modelling guidance and benchmark discussions remain possible matches. Risk 8 SENSITIVE reflects serious contained operational
  and commercial harm; PROTECTED would require critical-service capacity constraints or significant strategic damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because detailed capacity
    models expose operational limits, growth, and resilience assumptions. PROTECTED is not met without evidence of
    critical infrastructure, protected strategy, or significant broad consequence.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic handling is Medium with Medium InfoTech controls for organisation-specific capacity models and forecasts.
      High applies only where the model exposes critical-service constraints or protected strategic decisions whose
      disclosure would cause significant damage.
frameworks:
  - ISO 27001
  - NIST CSF
