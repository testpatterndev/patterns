updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release. Complainant and investigation content in council building, plumbing and planning compliance files. 75 requires a populated complainant or investigation-notes field plus council / statute context or a labelled complaint, property or application reference. 85 requires both fields plus context. Show cause and enforcement notices and public register extracts (P&D Reg ss 115-116) stay at 65.
