schema: testpattern/v1
name: Queensland Council Building, Plumbing or Planning Enforcement Complaint and Investigation File
slug: au-qld-building-plumbing-planning-enforcement-file
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Complainant and investigation content in Queensland council building, plumbing and planning compliance files: complaint intake records, complainant details, site inspection and investigation notes, and officer recommendations that lead to a show cause or enforcement notice. The notices themselves are largely public. Building Act 1975 s 247 (show cause), s 248 (enforcement notices) and s 251 (register of notices given); Plumbing and Drainage Act 2018 ss 143-146 (enforcement and show cause notices) with Plumbing and Drainage Regulation 2019 s 115 (register of show cause and enforcement notices) and s 116 (register open to inspection free of charge); Planning Act 2016 s 167 (show cause), s 168 (enforcement notices) and s 170 (notifying about them). The private part is who complained, often a neighbour, and what officers recorded during the investigation. This classifier targets that content, not the notice or the public register entry.
operation: >-
  Primary: show cause notice, enforcement notice, development offence / offense, unlawful building / plumbing / drainage work, unlawful use or development, non-compliant / illegal / unapproved plumbing, drainage, building work, structure or development, building / plumbing / planning / development compliance or enforcement complaint / investigation / request / file / matter / case, and building / plumbing / planning / development complaint. 65 is discovery-only (primary alone) and surfaces notices, public register extracts, legislation and guidance. 75 requires, within 300 characters, one populated private structure and independent context. The structure is either a complainant field (complainant [name / details / address / contact / phone / mobile / email], name of complainant, reported by, informant, person making the complaint, customer name, requester / requestor, followed by a name of two or more capitalised words, a street address, an Australian phone number or an email address) or an investigation field (investigation / inspection / site inspection / site visit / officer / file / case notes, findings, observations or outcome; details / nature / summary / description of the complaint or allegation; complaint details / summary; allegation; investigating officer; action taken; recommended action; officer recommendation; evidence obtained, followed by at least 10 characters of text). The context is a council or statute term (council, local government, Building Act 1975, Plumbing and Drainage Act 2018, Planning Act 2016, building certifier, plumbing inspector, compliance officer, enforcement authority, Development Tribunal, Planning and Environment Court, site inspection) or a labelled complaint / case / request / CRM reference, property / assessment number or application number. 85 requires the complainant field AND the investigation field AND the same context. Field values must be on the same line as the label and are placeholder-guarded (anonymous, withheld, not, none, nil, redacted, suppressed, blank lines, brackets). Enforce tiers AND NOT the shared template-exclusion dictionary and a guidance exclusion (fact sheet, frequently asked questions, how to make / lodge a complaint, annual report).
pattern: >-
  (?i)\b(?:show\s+cause\s+notice|enforcement\s+notice|development\s+offen[cs]e|unlawful\s+(?:building|plumbing|drainage)\s+work|unlawful\s+(?:use|development)|(?:non-?compliant|illegal|unapproved)\s+(?:plumbing|drainage|building\s+work|structure|development)|(?:building|plumbing|planning|development)\s+(?:compliance|enforcement)\s+(?:complaint|investigation|request|file|matter|case)|(?:building|plumbing|planning|development)\s+complaint)\b
confidence: medium
confidence_justification: >-
  Medium. Show cause and enforcement notice vocabulary is statutory and distinctive, but the notices and registers are public, so enforce tiers ignore the notice and need a populated complainant or investigation field with council or statute context. Complaint and CRM reference formats are council-specific, so they are loose label-anchored values used only as context. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Building Act 1975 (Qld)
  - Plumbing and Drainage Act 2018 (Qld)
  - Plumbing and Drainage Regulation 2019 (Qld)
  - Planning Act 2016 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - contact-information
  - government
corroborative_evidence:
  keywords:
    - council
    - Building Act 1975
    - Plumbing and Drainage Act 2018
    - Planning Act 2016
    - plumbing inspector
    - compliance officer
    - site inspection
  proximity: 300
customisation:
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_au_qld_enforcement_file_case_reference
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's case / matter reference number format (see docs/identifiers.md#case-reference-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: council-property-number
    kind: identifier-format
    identifier: council-property-number
    target: purview.regexes/Regex_au_qld_enforcement_file_property_number
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's council property / rates assessment number format (see docs/identifiers.md#council-property-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: council-development-application-number
    kind: identifier-format
    identifier: council-development-application-number
    target: purview.regexes/Regex_au_qld_enforcement_file_application_number
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's development application number format (see docs/identifiers.md#council-development-application-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Building compliance investigation - Harbourview Regional Council\nComplaint number: CRM-2026-048812\nComplainant: Dana Teston\nComplainant phone: 0413 555 219\nProperty number: 4471820\nNature of complaint: neighbour building a carport over the boundary without approval\nSite inspection notes: carport 6 m x 3 m erected without building approval; owner told a show cause notice will be considered.\nInvestigating officer: Sam Staffson"
      description: Building compliance file with complainant identity, complaint details and site inspection notes (85 tier)
      synthetic: true
    - value: "Plumbing enforcement file note\nMatter: non-compliant plumbing at 9 Ironbark Court, Toowoomba\nReported by: Chris Teston (neighbour, 8 Ironbark Court)\nInvestigation notes: inspected 03/09/2026; greywater discharging onto the adjoining lot; plumber licence details requested.\nRecommended action: issue show cause notice under Plumbing and Drainage Act 2018 s 144."
      description: Plumbing investigation file note naming the neighbour who reported it (85 tier)
      synthetic: true
    - value: "Planning compliance complaint received by council about an unlawful use of premises (short-term accommodation).\nComplainant name: Alex Teston, 14 Wattle Street, Bundaberg"
      description: Planning complaint intake with complainant identity only (75 tier)
      synthetic: true
    - value: "Development offence - council compliance officer file\nInvestigation notes: vegetation cleared on Lot 3 without a development permit; photos taken from the road reserve on 11/09/2026."
      description: Development offence investigation notes without complainant details (75 tier)
      synthetic: true
  should_not_match:
    - value: "247 Show cause notices (1) A notice (a show cause notice) inviting a person to show cause why an enforcement or revocation notice should not be given to the person must be in writing; outline the facts and circumstances forming the basis for the belief that an enforcement or revocation notice should be given; and state that representations may be made about the show cause notice."
      description: Building Act 1975 s 247 text (legislation, 65 only)
    - value: "Register of show cause and enforcement notices (Plumbing and Drainage Regulation 2019 s 115) - open for inspection free of charge at council's public office\nNotice type: Enforcement notice\nDate given: 12/08/2026\nProperty number: 4471820\nPremises: 22 Banksia Drive, Mackay\nPerson given notice: Morgan Teston\nReason: non-compliant plumbing - defective sanitary drain"
      description: Public register extract under P&D Reg ss 115-116 (65 only; no complainant or investigation content)
    - value: "Show cause notice - Planning Act 2016 s 167\nTo: Jordan Teston, 14 Wattle Street, Bundaberg\nCouncil is considering giving you an enforcement notice for a development offence (unlawful use of premises). You may make representations about this notice within 20 business days."
      description: The show cause notice itself as given to the owner (65 only; it is a register document)
    - value: "Building and plumbing complaint form - blank template\nComplainant name: ____________\nComplainant address: ____________\nDetails of complaint: ____________"
      description: Blank complaint form
    - value: "Frequently asked questions: council investigates complaints about unlawful building work and non-compliant plumbing. Your details as a complainant are kept confidential and are not given to the property owner."
      description: Council complaints guidance page (guidance exclusion)
    - value: "Council issued 58 enforcement notices for unlawful building work last year and resolved most complaints without a show cause notice, the annual report shows."
      description: Aggregate statistics and news (65 only)
false_positives:
  - description: Show cause notices, enforcement notices and public register extracts (P&D Reg ss 115-116, Building Act s 251, Planning Act s 168) name the owner, premises and reason.
    mitigation: These are public or given to the owner, so they stay at 65. Enforce tiers need a populated complainant or investigation-notes field, which notices and register entries do not carry.
  - description: Council complaint guidance, legislation, annual reports and news.
    mitigation: A guidance exclusion suppresses FAQ pages, fact sheets, complaint how-to pages and annual reports. Legislation and news have no populated fields.
  - description: Customer request (CRM) records about other topics that happen to use the words building complaint.
    mitigation: 75 needs a populated complainant or investigation field plus council or statute context. Out-of-scope CRM records may still reach 75; deploy at 85 if volume is a concern.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_enforcement_file_primary
      matches:
        - ref: Regex_au_qld_enforcement_file_complainant_field
        - ref: Regex_au_qld_enforcement_file_investigation_field
        - type: any
          min_matches: 1
          refs:
            - Keyword_au_qld_enforcement_file_context
            - Regex_au_qld_enforcement_file_case_reference
            - Regex_au_qld_enforcement_file_property_number
            - Regex_au_qld_enforcement_file_application_number
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_enforcement_file_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_enforcement_file_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_enforcement_file_complainant_field
            - Regex_au_qld_enforcement_file_investigation_field
        - type: any
          min_matches: 1
          refs:
            - Keyword_au_qld_enforcement_file_context
            - Regex_au_qld_enforcement_file_case_reference
            - Regex_au_qld_enforcement_file_property_number
            - Regex_au_qld_enforcement_file_application_number
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_enforcement_file_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_enforcement_file_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_enforcement_file_primary
      pattern: >-
        (?i)\b(?:show\s+cause\s+notice|enforcement\s+notice|development\s+offen[cs]e|unlawful\s+(?:building|plumbing|drainage)\s+work|unlawful\s+(?:use|development)|(?:non-?compliant|illegal|unapproved)\s+(?:plumbing|drainage|building\s+work|structure|development)|(?:building|plumbing|planning|development)\s+(?:compliance|enforcement)\s+(?:complaint|investigation|request|file|matter|case)|(?:building|plumbing|planning|development)\s+complaint)\b
    - id: Regex_au_qld_enforcement_file_complainant_field
      pattern: >-
        (?i)\b(?:complainant(?:'?s)?(?:\s+(?:full\s+)?(?:name|details|address|contact|phone|mobile|email))?|name\s+of\s+(?:the\s+)?complainant|reported\s+by|informant|person\s+making\s+(?:the\s+)?complaint|customer\s+name|requester|requestor)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not|none|nil|redacted|suppressed|anonymous|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:(?:(?:Mr|Mrs|Ms|Miss|Dr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:\+?61[ \t]?|0)[2-478](?:[ \t-]?\d){8}|[A-Z0-9._%+-]{1,40}@[A-Z0-9-]{1,40}\.[A-Z.]{2,20})
    - id: Regex_au_qld_enforcement_file_investigation_field
      pattern: >-
        (?i)\b(?:(?:investigation|inspection|site\s+inspection|site\s+visit|officer(?:'?s)?|file|case)\s+(?:notes?|findings|observations|outcome)|(?:details|nature|summary|description)\s+of\s+(?:the\s+)?(?:complaint|allegation|alleged\s+(?:offen[cs]e|breach))|complaint\s+(?:details|summary|description)|allegations?|investigating\s+officer|action\s+taken|recommended\s+action|officer\s+recommendation|evidence\s+obtained)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|nil|none|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9 ,.;'/()&-]{9,120}
    - id: Regex_au_qld_enforcement_file_case_reference
      pattern: >-
        (?i)\b(?:case|file|matter|reference|complaint|request|CRM|investigation)\s+(?:no\.?|number|ID|#)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{3,20}\b
    - id: Regex_au_qld_enforcement_file_property_number
      pattern: >-
        (?i)\b(?:property|assessment|rate\s+assessment|rates\s+account)\s+(?:no\.?|number|ID)\s*[:#]?\s*\d{4,12}\b
    - id: Regex_au_qld_enforcement_file_application_number
      pattern: >-
        (?i)\b(?:(?:development|building|planning|plumbing)\s+application|DA|BA|application|approval|permit|decision\s+notice)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*(?:[A-Z]{1,5}[/-]?)?\d[A-Z0-9/-]{3,20}\b
  keywords:
    - id: Keyword_au_qld_enforcement_file_context
      groups:
        - match_style: word
          terms:
            - council
            - regional council
            - city council
            - shire council
            - local government
            - Building Act 1975
            - Plumbing and Drainage Act 2018
            - Planning Act 2016
            - building certifier
            - building inspector
            - plumbing inspector
            - compliance officer
            - enforcement authority
            - Development Tribunal
            - Planning and Environment Court
            - site inspection
      strength: specific
    - id: Keyword_au_qld_enforcement_file_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - fact sheet
            - factsheet
            - frequently asked questions
            - how to make a complaint
            - how to lodge a complaint
            - annual report
      strength: specific
risk_rating: 5
risk_description: >-
  The classifier identifies council building, plumbing or planning compliance files that name the person who complained, usually a neighbour, with their contact details, and record officers' site inspection notes, findings and recommendations before a show cause or enforcement notice. Disclosure of a complainant's identity to the property owner invites retaliation in neighbour disputes, and investigation notes are unproven allegations about an identified owner. The notices and registers are public (P&D Reg s 116) and stay at 65, as do legislation, guidance, blank forms and statistics. Risk 5 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 5 is paired with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because the
    file names the complainant, usually a neighbour, and records unproven allegations about an identified owner. Risk is
    moderate as notices are public and harm is local retaliation, but complainant identity still warrants SENSITIVE
    handling.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling protects complainant identity and officers' investigation notes. It is not High
      because the matter is a local compliance dispute with public enforcement notices.
references:
  - title: Building Act 1975 (Qld) - ss 247, 248, 251 show cause and enforcement notices, register of notices
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1975-011
  - title: Plumbing and Drainage Act 2018 (Qld) - ss 143-146 enforcement and show cause notices, s 155 public access
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2018-017
  - title: Plumbing and Drainage Regulation 2019 (Qld) - ss 115-117 register of show cause and enforcement notices and public access
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2019-0042
  - title: Planning Act 2016 (Qld) - ss 167, 168, 170 show cause and enforcement notices
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2016-025
  - title: Information Privacy Act 2009 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
