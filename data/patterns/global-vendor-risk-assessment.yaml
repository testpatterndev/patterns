schema: testpattern/v1
name: Vendor Risk Assessment
slug: global-vendor-risk-assessment
version: 1.5.0
type: regex
pattern_class: concept
description: >-
  Detects completed vendor risk assessments: third-party risk assessment wording with populated vendor/contract fields and inherent/residual risk ratings, supported at high confidence by assurance evidence. Topic wording alone is discovery-only.
operation: >-
  Regex_vendor_risk_primary (third-party/vendor/supplier risk assessment, vendor due diligence, TPRM assessment/questionnaire or Shared Assessments SIG wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated vendor field (vendor/supplier, ABN, contract number/value, service, data types, criticality, assessor, owners) or a populated risk rating (inherent/residual/overall/control risk with a level or score). 85 requires a populated vendor field (vendor/supplier, ABN, contract number/value, service, data types, criticality, assessor, owners) (two distinct hits), a populated risk rating (inherent/residual/overall/control risk with a level or score), and independent assurance-evidence (questionnaire response, SOC 2/ISO certificate, pen test, subprocessors, data residency) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_vendor_risk_guidance_exclusion).
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated vendor field (vendor/supplier, ABN, contract number/value, service, data types, criticality, assessor, owners) or a populated risk rating (inherent/residual/overall/control risk with a level or score)), and 85 needs two distinct structures plus independent assurance-evidence (questionnaire response, SOC 2/ISO certificate, pen test, subprocessors, data residency) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
  - global
regulations:
  - IPA 2009 (Qld)
  - Privacy Act 1988 (Cth)
  - SOCI Act 2018 (Cth)
frameworks:
  - DISP
  - ISO 27001
  - NIST CSF
data_categories:
  - security
  - governance
test_cases:
  should_match:
    - value: Vendor risk assessment
      description: Discovery probe (65) - title only
    - value: 'Vendor risk assessment: inherent risk high and residual risk medium.'
      description: Medium-tier probe (75) - populated risk ratings
    - value: |-
        Third-party risk assessment - payroll SaaS
        Vendor: Tidewater Payroll Pty Ltd
        Contract number: HH-2026-044
        Data types: employee bank details, TFNs
        Inherent risk: High; residual risk: Medium
        SOC 2 report reviewed; subprocessor list and data residency (Sydney) confirmed; remediation plan for MFA gap.
      description: High-tier probe (85) - vendor fields, ratings and assurance evidence
      synthetic: true
  should_not_match:
    - value: Vendor booth at the market
      description: Non-match
    - value: Best vendor award ceremony
      description: Non-match
    - value: The public procurement page links to a vendor risk assessment.
      description: Public link mentions only the title
    - value: 'Template example: vendor risk assessment with inherent risk high, security questionnaire response, and data handling controls.'
      description: Template contains otherwise high-tier evidence
    - value: 'Policy statement: a vendor risk assessment is completed before any contract that involves personal information.'
      description: Policy text
      synthetic: true
    - value: |-
        Vendor risk assessment form
        Vendor: ________
        Inherent risk: [insert]
      description: Blank form
      synthetic: true
false_positives:
  - description: Procurement pages linking to a blank vendor risk assessment form.
    mitigation: Blank fields and template/guidance framing are excluded; 85 needs vendor fields, a rating and assurance evidence.
exports:
  - yaml
scope: narrow
risk_rating: 4
risk_description: >-
  The detector now requires vendor risk assessment wording plus populated vendor fields or risk ratings before enforcing. Disclosure may reveal a vendor's control gaps, risk score, remediation commitments, or commercial concerns, but a normal assessment usually requires named assets, technical detail, and attack capability before it enables direct compromise. Templates, procurement guidance, and generic supply-chain discussions are common medium-confidence matches. Risk 4 and OFFICIAL therefore fit low, reversible standalone harm; SENSITIVE is not met without exploitable non-public weaknesses, detailed architecture, credentials, or material concentration risk.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_vendor_risk_primary
      matches:
        - ref: Regex_vendor_risk_vendor_field
          min_count: 2
          unique_results: true
        - ref: Regex_vendor_risk_risk_rating
        - ref: Keyword_vendor_risk_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_vendor_risk_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_vendor_risk_primary
      matches:
        - type: any
          refs:
            - Regex_vendor_risk_vendor_field
            - Regex_vendor_risk_risk_rating
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_vendor_risk_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_vendor_risk_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_vendor_risk_primary
      pattern: >-
        (?i)\b(?:(?:third[\s-]?party|vendor|supplier)\s+risk\s+assessment|vendor\s+due\s+diligence|tprm\s+(?:assessment|questionnaire)|shared\s+assessments?\s+sig)\b
    - id: Regex_vendor_risk_vendor_field
      pattern: >-
        (?i)\b(?:vendor(?:\s+name)?|supplier(?:\s+name)?|third\s+party|ABN|contract\s+(?:no\.?|number|ID|value)|service\s+(?:description|provided)|data\s+(?:types?|classification)|criticality|assessor|assessment\s+date|business\s+owner|contract\s+owner)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
    - id: Regex_vendor_risk_risk_rating
      pattern: >-
        (?i)\b(?:inherent|residual|overall|control)\s+risk(?:\s+(?:rating|score|level))?\s*[:=]?\s*(?:critical|high|medium|moderate|low|extreme|\d{1,2}(?:\.\d)?(?:\s*/\s*\d{1,3})?)\b
  keywords:
    - id: Keyword_vendor_risk_context
      groups:
        - match_style: word
          terms:
            - security questionnaire response
            - SOC 2 report
            - ISO 27001 certificate
            - penetration test
            - subprocessor
            - data residency
            - breach history
            - remediation plan
            - risk exception
            - fourth-party
      strength: specific
    - id: Keyword_vendor_risk_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - guidance note
            - best practice guide
            - media release
            - press release
            - news report
            - course module
            - learning objectives
            - awareness course
            - webinar
            - lesson plan
            - quiz question
      strength: domain
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): tier 75 no longer passes on generic risk words (likelihood/impact); keyword-only 85 path replaced; 75 needs a populated vendor field or an inherent/residual risk rating; 85 needs two vendor fields, a rating and assurance evidence; unused generic compliance group removed; guidance exclusion added; populated assessment tests plus policy and blank-form decoys; ISM and APRA CPS 230 references added.'
  - version: 1.4.0
    date: '2026-07-19'
    description: 'Profile quality: align the regex-backed detector type; add title discovery, assessed-risk medium, and due-diligence-evidence high tiers; add public/template adversarial probes.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1090 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.1.0
    date: '2026-07-04'
    description: Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.; Aligned recommended_confidence to 75.
