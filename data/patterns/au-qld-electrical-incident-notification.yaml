schema: testpattern/v1
name: Queensland Serious Electrical Incident or Dangerous Electrical Event Notification
slug: au-qld-electrical-incident-notification
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed notifications and internal records of a serious electrical incident or dangerous electrical event under the Electrical Safety Act 2002 (Qld). Serious electrical incident (s 11) covers a person killed by electricity or receiving a shock or injury treated by or under a doctor, or at high voltage. Dangerous electrical event (s 12) covers unsafe proximity to HV equipment, significant property damage caused by electricity, and unlicensed or unsafe electrical work. A business or undertaking must notify the regulator immediately (Electrical Safety Regulation 2013 s 265, with written notice within 48 hours if required and records kept 5 years). A distribution entity must give written notice in the approved form received within 24 hours (s 266). Section numbers are taken from the 27 Sep 2024 version of the Regulation; the current version could not be retrieved. Records name the injured or involved person, date, time and location, the equipment and voltage, the injury and treatment, and the notification to the Electrical Safety Office. The Act and Regulation, ESO safety alerts and prosecution summaries, toolbox talks and blank forms are decoys.
operation: >-
  Primary: serious electrical incident, dangerous electrical event, Electrical Safety Office, or electrical incident notification / report. 65 is discovery-only (primary alone) and will surface the Act and Regulation, safety alerts, toolbox talks and blank forms. 75 requires, within 300 characters, either a populated incident field (date or time of the incident or event with a date/time value; location, site or address of the incident with a value; injured / involved person or worker with a name; equipment involved or voltage with a value) or an injury and treatment narrative (received or sustained an electric shock, burns or injury followed by treated, doctor, hospital, ambulance or first aid, or "treated by a doctor" / "admitted to hospital" / "transported to ... Hospital"). 85 requires two distinct populated incident fields (two when/where fields, two who/what fields, each min_count 2 unique, or one of each) plus a notification structure (notified, reported or advised to the ESO, Electrical Safety Office, WHSQ or the regulator with a time or date, or an ESO / notification / incident reference number with a value). All tiers exclude template/fixture text. Enforce tiers also exclude legislation and publication text (Maximum penalty, penalty units, legislation.qld.gov.au, safety alert, toolbox talk, prosecution and fine reporting, "you must notify").
pattern: (?i)\b(?:serious\s+electrical\s+incidents?|dangerous\s+electrical\s+events?|Electrical\s+Safety\s+Office|electrical\s+incident\s+(?:notification|report))\b
confidence: medium
confidence_justification: >-
  Medium: serious electrical incident and dangerous electrical event are defined terms in ss 11-12 of the Electrical Safety Act 2002 (Qld) and appear in almost every ESO publication, so enforcement depends on populated incident fields and injury or notification detail. The approved form's field headings could not be verified (the PDF download was blocked), so field labels are common incident-report labels, not the form's exact wording. Electrical licence numbers have no published format and are not used. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Electrical Safety Act 2002 (Qld)
  - Electrical Safety Regulation 2013 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - health
  - security
  - infrastructure
corroborative_evidence:
  keywords:
    - electric shock
    - high voltage
    - distribution entity
    - incident record
    - regulator
    - approved form
    - person conducting a business or undertaking
  proximity: 300
customisation:
  - key: eso-incident-notification-reference
    kind: identifier-format
    identifier: eso-incident-notification-reference
    target: purview.regexes/Regex_au_qld_electrical_incident_notification_notification
    mode: extend
    affects_tiers:
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's electrical safety office notification reference format (see docs/identifiers.md#eso-incident-notification-reference). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Serious electrical incident - notification record\nDate of incident: 18/09/2026 at 10:40\nLocation of incident: Pole 44718, Gowrie Road, Kellyvale\nInjured person: Morgan Traske (line worker)\nEquipment involved: 11 kV overhead conductor, recloser R-2291\nReported to the Electrical Safety Office by phone at 11:05 on 18/09/2026."
      description: Populated notification with date, location, injured person, equipment and ESO phone notification time - intended 85
      synthetic: true
    - value: "Dangerous electrical event report\nTime of event: 14:15\nSite: Bay 3 switchroom, Mount Orrin Power Station\nWorker: Alex Fennimore came within the exclusion zone of energised 33 kV busbar.\nESO reference number: ESO-2026-118842"
      description: Populated event with time, site, worker and ESO reference - intended 85
      synthetic: true
    - value: "Serious electrical incident: the apprentice received an electric shock from a damaged extension lead and was treated by a doctor at Ipswich Hospital the same afternoon."
      description: Injury and treatment narrative - intended 75
      synthetic: true
    - value: "Electrical incident report\nLocation of incident: 12 Hartigan Street, Toowong, meter box\nNo injuries; consumer reported tingles from a kitchen tap."
      description: One populated incident location field - intended 75
      synthetic: true
  should_not_match:
    - value: "A serious electrical incident is an incident involving electrical equipment if, in the incident, a person is killed by electricity; or a person receives a shock or injury from electricity, and is treated for the shock or injury by or under the supervision of a doctor."
      description: Electrical Safety Act s 11 definition text - 65 only
    - value: "A person who conducts a business or undertaking must ensure that the regulator is notified immediately after becoming aware that a serious electrical incident or dangerous electrical event has occurred. Maximum penalty - 100 penalty units."
      description: Electrical Safety Regulation s 265 text (legislation exclusion) - 65 only
    - value: "Electrical incident notification form\nDate of incident: __________\nLocation of incident: __________\nInjured person: __________\nEquipment involved: __________"
      description: Blank notification form - must not reach 75
    - value: "Safety alert: the Electrical Safety Office is investigating a serious electrical incident in which a worker received an electric shock and was taken to hospital after contacting an overhead line."
      description: ESO safety alert (publication exclusion) - must not reach 75
    - value: "Toolbox talk: what counts as a dangerous electrical event, and why you must notify the Electrical Safety Office straight away."
      description: Toolbox talk / training - 65 only
false_positives:
  - description: The Electrical Safety Act and Regulation and ESO guidance pages quoting the definitions and notification duties.
    mitigation: No populated incident fields, and the legislation exclusion group (Maximum penalty, penalty units, you must notify) applies at enforce tiers.
  - description: ESO safety alerts, prosecution summaries and news reporting of incidents.
    mitigation: These may carry an injury narrative, so enforce tiers exclude safety alert, prosecution, fined and pleaded guilty text.
  - description: Blank notification forms and incident report templates.
    mitigation: Underscore, bracket and n/a/tbc values are rejected by the field guard.
  - description: General WHS incident reports that mention electrical safety without the defined terms.
    mitigation: Not detected unless a primary term is present. Detection of genuine ESO-related incident records is intended.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_electrical_incident_notification_primary
      matches:
        - ref: Regex_au_qld_electrical_incident_notification_when_where
          min_count: 2
          unique_results: true
        - ref: Regex_au_qld_electrical_incident_notification_notification
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_electrical_incident_notification_publication_exclusion
    - confidence_level: 85
      id_match: Regex_au_qld_electrical_incident_notification_primary
      matches:
        - ref: Regex_au_qld_electrical_incident_notification_when_where
        - ref: Regex_au_qld_electrical_incident_notification_who_what
        - ref: Regex_au_qld_electrical_incident_notification_notification
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_electrical_incident_notification_publication_exclusion
    - confidence_level: 85
      id_match: Regex_au_qld_electrical_incident_notification_primary
      matches:
        - ref: Regex_au_qld_electrical_incident_notification_who_what
          min_count: 2
          unique_results: true
        - ref: Regex_au_qld_electrical_incident_notification_notification
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_electrical_incident_notification_publication_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_electrical_incident_notification_primary
      matches:
        - type: any
          refs:
            - Regex_au_qld_electrical_incident_notification_when_where
            - Regex_au_qld_electrical_incident_notification_who_what
            - Regex_au_qld_electrical_incident_notification_injury
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_electrical_incident_notification_publication_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_electrical_incident_notification_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_electrical_incident_notification_primary
      pattern: >-
        (?i)\b(?:serious\s+electrical\s+incidents?|dangerous\s+electrical\s+events?|Electrical\s+Safety\s+Office|electrical\s+incident\s+(?:notification|report))\b
    - id: Regex_au_qld_electrical_incident_notification_when_where
      pattern: >-
        (?i)(?:\b(?:Date|Time|Date\s+and\s+time)\s+of\s+(?:the\s+)?(?:incident|event)\s*[:#][ \t]{0,5}(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}[:.]\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2})|\bIncident\s+(?:date|time)\s*[:#][ \t]{0,5}(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}[:.]\d{2}|20\d{2}-\d{2}-\d{2})|\b(?:(?:Location|Site|Address)\s+of\s+(?:the\s+)?(?:incident|event)|Incident\s+(?:location|site|address)|Site)\s*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.,-]{0,30}(?:[ \t]+[A-Za-z0-9/'.,()-]{1,30}){1,6})
    - id: Regex_au_qld_electrical_incident_notification_who_what
      pattern: >-
        (?i)(?:\b(?:Injured\s+person|Person\s+(?:injured|involved)|Name\s+of\s+(?:the\s+)?(?:injured\s+)?person|Worker|Employee)\s*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,24}[ \t]+[A-Z][A-Za-z'-]{1,30}|\b(?:Equipment\s+involved|Electrical\s+equipment|Apparatus\s+involved|Voltage)\s*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.,-]{0,30}(?:[ \t]+[A-Za-z0-9/'.,()-]{1,30}){0,6})
    - id: Regex_au_qld_electrical_incident_notification_injury
      pattern: >-
        (?i)(?:\b(?:received|sustained|suffered)\s+(?:an?\s+)?(?:(?:electric(?:al)?|minor|severe)\s+)?(?:shock|burns?|injur(?:y|ies)|electrocution)\b[^\n]{0,100}?\b(?:treated|doctor|GP|hospital|ambulance|first\s+aid|paramedics?|medical\s+(?:attention|centre))\b|\btreated\s+(?:by|under\s+the\s+supervision\s+of)\s+(?:a\s+)?doctor\s+(?:at|on)\s+[A-Z0-9]|\badmitted\s+to\s+[A-Z][A-Za-z]{2,20}(?:\s+[A-Z][A-Za-z]{2,20}){0,2}\s+Hospital\b|\btransported\s+to\s+[A-Z][A-Za-z]{2,20}(?:\s+[A-Z][A-Za-z]{2,20}){0,2}\s+(?:Hospital|Base\s+Hospital)\b)
    - id: Regex_au_qld_electrical_incident_notification_notification
      pattern: >-
        (?i)(?:\b(?:notified|reported|advised|phoned|called)\s+(?:to\s+)?(?:the\s+)?(?:ESO|Electrical\s+Safety\s+Office|WHSQ|Workplace\s+Health\s+and\s+Safety\s+Queensland|regulator)\b[^\n]{0,40}?\b(?:at|on)\s+(?:\d{1,2}[:.]\d{2}|\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2})|\b(?:ESO|WHSQ|notification|incident)\s+(?:reference|ref\.?)(?:\s+(?:no\.?|number))?\s*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/-]{3,24})
    - id: Regex_au_qld_electrical_incident_notification_publication_exclusion
      pattern: >-
        (?i)(?:\bMaximum\s+penalty\b|\bpenalty\s+units\b|\blegislation\.qld\.gov\.au\b|\bIn\s+force\s+legislation\b|\bsafety\s+alert\b|\btoolbox\s+talk\b|\bprosecut(?:ion|ed)\b|\bwas\s+fined\b|\bpleaded\s+guilty\b|\byou\s+(?:must|should|need\s+to)\s+(?:notify|report)\b|\bhow\s+to\s+notify\b)
risk_rating: 8
risk_description: >-
  A populated serious electrical incident or dangerous electrical event notification identifies a person who was killed, shocked or injured by electricity, with their injury and treatment, the place and time, and the electrical equipment and voltage involved. It can also document unsafe or unlicensed electrical work that may lead to regulator investigation and prosecution. Disclosure exposes health and personal information and legally sensitive incident facts, and it can reveal hazards on energy network assets. The Act, Regulation, safety alerts, toolbox talks and blank forms are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Queensland Legislation - Electrical Safety Act 2002 (ss 11-12)
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-2002-042
  - title: Queensland Legislation - Electrical Safety Regulation 2013 (Part 14, 27 Sep 2024 version)
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/2024-09-27/sl-2013-0213
  - title: WorkSafe Queensland - Notify WHSQ or the Electrical Safety Office of an incident
    url: https://www.worksafe.qld.gov.au/safety-and-prevention/incidents-and-notifications/notify-us-of-an-incident/notify-workplace-health-and-safety-queensland-or-electrical-safety-office
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release. Anchored on Electrical Safety Act 2002 (Qld) ss 11-12 defined terms and Electrical Safety Regulation 2013 Part 14 (27 Sep 2024 version) notification duties. 75 needs a populated incident field or an injury and treatment narrative. 85 needs two incident fields plus an ESO notification time or reference. Approved-form headings are unverified and not used as anchors.
