schema: testpattern/v1
name: Psychosocial Hazard Risk Register or Risk Assessment
slug: au-psychosocial-risk-register
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Psychosocial hazard registers and risk assessments kept by a person conducting a business or undertaking under the Work Health and Safety Regulation 2011 (Qld) Part 3.2 Division 11 (s 55A meaning of psychosocial hazard, s 55B meaning of psychosocial risk, s 55C duty to manage psychosocial risks, s 55D determining control measures) and the Managing the risk of psychosocial hazards at work Code of Practice 2022 (in force 1 April 2023). Register rows record a hazard (job demands, low job control, poor support, aggression from customers, remote or isolated work), a risk rating, controls and an owner for a team or work area. Most rows are aggregate; the higher tier is reserved for rows that identify an affected worker or link a complaint, grievance or claim. The Code's own text and example register, blank registers and training material are decoys. Complements au-workplace-harassment-psychosocial-complaint, which covers individual complaints.
operation: >-
  Primary: a psychosocial register phrase (psychosocial hazard / risk / safety / health and safety register, (risk) assessment, identification, log, matrix, profile, or action / management / control plan; or a WHS, risk or hazard register headed psychosocial). 75 tier requires, within 300 characters, a populated hazard-row structure: a risk rating field (inherent / residual / current / overall / target risk rating, level, score or ranking, likelihood, consequence or severity with a rating word, number or matrix cell) AND either a populated hazard field (hazard, hazard type / category / description / identified with at least two words) or a populated control / owner field (existing, current, proposed or additional controls, control measures, treatments or actions with at least three words; a risk, action, control or hazard owner or responsible person with a value; or a review, due, target or completion date). 85 tier additionally requires an individual worker field: an affected, impacted, exposed, injured or named worker / employee / staff member / officer, worker or employee name, complainant, reported by or raised by with a two-part name; an employee, staff, worker or payroll number with a digit; or a complaint, grievance, case, incident or (WorkCover) claim reference with a digit. All enforce tiers AND NOT the shared template-exclusion dictionary and a guidance/training exclusion (this Code, this Code of Practice, example risk register, case study, learning outcomes, facilitator notes, training module, workshop activity). 65 is discovery-only (primary phrase alone) and will surface the Code, WorkSafe guidance and news.
pattern: >-
  (?i)\bpsychosocial\s+(?:hazards?|risks?|safety|health\s+and\s+safety)\s+(?:(?:and\s+control\s+)?registers?|(?:risk\s+)?assessments?|identification|logs?|matrix|matrices|profiles?|(?:action|management|control)\s+plans?)\b|\b(?:WHS|risk|hazard)\s+register\s*[:-]\s*psychosocial\b
confidence: medium
confidence_justification: >-
  Medium: the WHS Regulation Division 11 terms and the Code of Practice vocabulary are distinctive, and a populated rating plus hazard or control field separates a working register from guidance, but the Code itself publishes an example risk register with the same columns and training decks reproduce it, so guidance and training wording is excluded and blank fields are placeholder-guarded. Most registers are aggregate (team or work-area level), so 85 is reserved for rows that identify a worker or link a complaint, grievance or claim. Employee and complaint number formats are organisation-defined and loosely shaped. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Work Health and Safety Regulation 2011 (Qld) Part 3.2 Division 11 (ss 55A-55D)
  - Managing the risk of psychosocial hazards at work Code of Practice 2022 (Qld)
  - Work Health and Safety Act 2011 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - employment
  - pii
corroborative_evidence:
  keywords:
    - psychosocial hazard
    - psychosocial risk
    - risk rating
    - likelihood
    - consequence
    - control measures
    - risk owner
    - affected worker
  proximity: 300
customisation:
  - key: employee-id
    kind: identifier-format
    identifier: employee-id
    target: purview.regexes/Regex_au_psy_worker_field
    mode: extend
    affects_tiers:
      - 85
    required_for_enforcement: false
    note: >-
      Extend the populated-field evidence with the customer's employee ID / payroll number format (see docs/identifiers.md#employee-id). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_au_psy_worker_field
    mode: extend
    affects_tiers:
      - 85
    required_for_enforcement: false
    note: >-
      Extend the populated-field evidence with the customer's case / matter reference number format (see docs/identifiers.md#case-reference-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Psychosocial risk register - Customer Contact Centre\nHazard: exposure to aggressive and abusive callers\nRisk rating: High\nControls: call escalation procedure, debrief after critical calls, EAP referral\nAffected worker: Jordan Teston (complaint ref: GR-2026-0144)\nRisk owner: Casey Testwell, Contact Centre Manager\nReview date: 30/10/2026"
      description: Register row with hazard, rating, controls, owner and a named affected worker linked to a complaint (85 tier)
      synthetic: true
    - value: "Psychosocial hazard assessment - Fleet workshop\nHazard: poor organisational change management\nResidual risk rating: Medium\nEmployee number: 208871 raised concerns during restructure consultation; linked grievance number: GRV/2026/031\nAction owner: Riley Teston"
      description: Assessment row linking an employee number and grievance to the hazard (85 tier)
      synthetic: true
    - value: "Psychosocial risk assessment - Corporate Services\nHazard: high job demands during end of financial year\nLikelihood: likely\nConsequence: moderate\nControls: workload review, temporary staff, flexible start times\nRisk owner: Director Corporate Services"
      description: Aggregate team-level register row with rating, controls and owner, no individual (75 tier)
      synthetic: true
    - value: "WHS register - psychosocial\nHazard: remote or isolated work at pump stations\nRisk score: 12\nTarget date: 15/12/2026"
      description: Register row with hazard, numeric score and target date (75 tier)
      synthetic: true
  should_not_match:
    - value: "This Code provides practical guidance on managing psychosocial risks. Appendix C sets out an example risk register. Hazard: high job demands; Likelihood: likely; Risk rating: high; Controls: review workloads with workers and their representatives; Owner: supervisor. A psychosocial risk assessment should be reviewed when controls change."
      description: Code of Practice text with its example register (excluded)
    - value: "Psychosocial hazard register\nHazard: ______________\nRisk rating: [High / Medium / Low]\nControls: ______________\nRisk owner: ______________\nAffected worker: ______________"
      description: Blank register (65 only)
    - value: "Slide 6 - Psychosocial risk assessment in practice\nLearning outcomes: identify hazards, rate risks, choose controls.\nHazard: poor support from supervisors\nRisk rating: Medium\nControls: regular one-on-one check-ins with team members"
      description: Training slide with an illustrative row (excluded)
    - value: "Inspectors issued improvement notices after finding the hospital had no psychosocial risk assessment for its emergency department staff."
      description: News about a missing assessment (65 only)
false_positives:
  - description: The Code of Practice, WorkSafe guidance and Safe Work Australia material, including the Code's example risk register.
    mitigation: Guidance exclusion on this Code / this Code of Practice / example risk register; enforce tiers need populated rating and hazard or control fields.
  - description: Training decks and workshop exercises that fill in an illustrative register row.
    mitigation: Excluded on learning outcomes, facilitator notes, training module, workshop activity, case study and the shared template-exclusion dictionary.
  - description: Individual harassment or bullying complaints that mention a psychosocial risk assessment.
    mitigation: These rarely carry a rating field; they are covered by au-workplace-harassment-psychosocial-complaint.
  - description: Genuine registers that cite the Code by the words "this Code" (for example in a quoted requirement).
    mitigation: Suppressed within the 300-character window; accepted false negative.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_psy_register_primary
      matches:
        - ref: Regex_au_psy_rating_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_psy_hazard_field
            - Regex_au_psy_control_field
        - ref: Regex_au_psy_worker_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_psy_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_psy_register_primary
      matches:
        - ref: Regex_au_psy_rating_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_psy_hazard_field
            - Regex_au_psy_control_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_psy_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_psy_register_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_psy_register_primary
      pattern: >-
        (?i)\bpsychosocial\s+(?:hazards?|risks?|safety|health\s+and\s+safety)\s+(?:(?:and\s+control\s+)?registers?|(?:risk\s+)?assessments?|identification|logs?|matrix|matrices|profiles?|(?:action|management|control)\s+plans?)\b|\b(?:WHS|risk|hazard)\s+register\s*[:-]\s*psychosocial\b
    - id: Regex_au_psy_rating_field
      pattern: >-
        (?i)\b(?:(?:inherent|residual|current|initial|overall|target|raw)\s+)?(?:risk\s+(?:rating|level|score|ranking)|likelihood|consequence|severity)\s*[:=-]\s*(?:extreme|very\s+high|high|medium|moderate|low|very\s+low|significant|major|minor|insignificant|catastrophic|severe|almost\s+certain|likely|possible|unlikely|rare|[1-9]\d?\b|[A-E][1-5]\b)
    - id: Regex_au_psy_hazard_field
      pattern: >-
        (?i)\b(?:psychosocial\s+)?hazard(?:\s+(?:type|category|name|description|identified|source))?\s*[:#-]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|select|insert)\b|_{2,}|\[|<)[A-Za-z][A-Za-z'/-]{2,30}(?:[ \t]+[A-Za-z][A-Za-z'/,-]{0,30}){1,6}
    - id: Regex_au_psy_control_field
      pattern: >-
        (?i)\b(?:(?:(?:existing|current|proposed|additional|further)\s+)?(?:controls?|control\s+measures?|treatments?|actions?)(?:\s+(?:required|in\s+place|proposed|taken))?\s*[:#-]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|select|insert)\b|_{2,}|\[|<)[A-Za-z][A-Za-z'/-]{1,30}(?:[ \t,;]+[A-Za-z0-9][A-Za-z0-9'/-]{0,30}){2,10}|(?:risk|action|control|hazard)\s+owner(?:\s+name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'.,-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}|responsible\s+(?:person|officer|manager|position)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'.,-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}|(?:review|due|target|completion)\s+date\s*[:#]\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}))
    - id: Regex_au_psy_worker_field
      pattern: >-
        (?i)\b(?:(?:(?:affected|impacted|exposed|injured|named)\s+(?:worker|employee|staff\s+member|person|officer)s?|(?:worker|employee|staff\s+member)\s+(?:name|affected|concerned)|complainant|reported\s+by|raised\s+by)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:employee|staff|worker|payroll)\s+(?:no\.?|number|ID)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z-]{0,4}\d)[A-Z0-9][A-Z0-9-]{2,12}\b|(?:complaint|grievance|case|incident|claim)\s+(?:ref(?:erence)?|no\.?|number|ID)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z/-]{0,8}\d)[A-Z0-9][A-Z0-9/-]{3,20}\b)
  keywords:
    - id: Keyword_au_psy_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this Code
            - this Code of Practice
            - example risk register
            - case study
            - learning outcomes
            - facilitator notes
            - training module
            - workshop activity
      strength: specific
risk_rating: 6
risk_description: >-
  The classifier identifies a working psychosocial hazard register or risk assessment: hazards such as aggression, excessive job demands or poor change management rated and assigned to owners for a team or work area, and at 85 rows that name or number an affected worker or link a complaint, grievance or claim. Aggregate rows expose internal WHS risk and potential non-compliance with the s 55C duty; identified rows add a worker's exposure to bullying, aggression or distress, which is sensitive personal and potentially health information. The Code, blank registers and training material are excluded. Risk 6 supports OFFICIAL: Sensitive / SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: Work Health and Safety Regulation 2011 (Qld) - Part 3.2 Division 11 Psychosocial risks (ss 55A, 55B, 55C, 55D)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2011-0240
  - title: WorkSafe Queensland - Managing the risk of psychosocial hazards at work Code of Practice 2022
    url: https://www.worksafe.qld.gov.au/laws-and-compliance/codes-of-practice/managing-the-risk-of-psychosocial-hazards-at-work-code-of-practice-2022
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - psychosocial hazard registers and risk assessments; 75 gated on a populated rating plus hazard or control/owner field, 85 adds an identified worker or complaint/grievance/claim link; the Code, blank registers and training material excluded.
