schema: testpattern/v1
name: Doppler Service and CLI Token
slug: global-doppler-token
version: 1.0.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects Doppler secrets-manager tokens across personal (dp.pt.), service (dp.st.<config>.), CLI (dp.ct.), service account (dp.sa.), SCIM (dp.scim.), and audit (dp.audit.) token types. Because Doppler centralizes runtime application secrets, a leaked token often exposes an entire environment secret set.
operation: >-
  Matches dp.<type>. (including optional environment/config segment on dp.st.) followed by 40-44 alphanumeric characters, bounded outside identifier characters. Tiers: 85 for two distinct tokens with Doppler context, 75 for one token with context, 65 discovery-only for a bare token, with template-exclusion gating.
pattern: '(?-i)(?<![A-Za-z0-9._-])(dp\.(?:pt|ct|sa|scim|audit|st(?:\.[a-z0-9_-]{2,32})?)\.[A-Za-z0-9]{40,44})(?![A-Za-z0-9._-])'
confidence: high
confidence_justification: >-
  High confidence: Doppler intentionally designed its dp.<type>. prefixes and 40-44 alphanumeric secret bodies for deterministic secret-scanning detection, documented in Doppler security docs and implemented in GitHub secret scanning, gitleaks, and TruffleHog.
jurisdictions:
- global
regulations:
- Criminal Code Act 1995 (Cth)
frameworks:
- CIS Controls
- ISO 27001
- NIST CSF
- SOC 2
data_categories:
- credentials
- security
corroborative_evidence:
  keywords:
  - doppler
  - DOPPLER_TOKEN
  - api.doppler.com
  - doppler run
  proximity: 300
  keyword_lists:
  - credentials
  - data-record-context
  - generic-data-labels
test_cases:
  # Positive literals omitted: GitHub Push Protection blocks all syntactically valid dp.<type>.<40-44> strings on public repos.
  should_match: []
  should_not_match:
  - value: "DOPPLER_TOKEN=dp.st.dev.short12345"
    description: "Token secret segment shorter than 40 characters"
  - value: "DOPPLER_TOKEN=dp_invalid_prefix_short"
    description: "Unknown token prefix format"
  - value: "Set DOPPLER_TOKEN before invoking doppler run in CI."
    description: "Documentation prose without a token value"
  - value: "template example placeholder record identifier"
    description: "Template/sample context should be excluded even when anchor words are present"
false_positives:
- description: "Ephemeral CI service tokens already revoked after deployment."
  mitigation: "Verify active status in Doppler Workplace -> Access / Service Tokens."
- description: "Documentation examples using synthetic dp.st.dev tokens."
  mitigation: "Excluded on every tier by template-exclusion."
exports:
- purview_xml
- yaml
- regex_copy
scope: narrow
risk_rating: 8
risk_description: >-
  The high-confidence detector finds a Doppler secrets-manager token. A live service or service-account token allows bulk retrieval (and depending on role, modification) of database passwords, API keys, and signing secrets stored in the target Doppler config or project. Risk 8 and SENSITIVE InfoTech reflect serious secret-store credential exposure.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, and Medium because a valid Doppler token grants direct access to centralized application secrets for its scoped environment or project. PROTECTED requires confirmed multi-system production admin compromise.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium and Medium InfoTech handling suit Doppler tokens because they unlock stored environment secrets within the token project/config scope.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_doppler_token
    matches:
    - ref: Regex_doppler_token
      min_count: 2
      unique_results: true
    - ref: Keyword_doppler_token
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  - confidence_level: 75
    id_match: Regex_doppler_token
    matches:
    - ref: Keyword_doppler_token
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_doppler_token
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_doppler_token
    pattern: '(?-i)(?<![A-Za-z0-9._-])(dp\.(?:pt|ct|sa|scim|audit|st(?:\.[a-z0-9_-]{2,32})?)\.[A-Za-z0-9]{40,44})(?![A-Za-z0-9._-])'
  keywords:
  - id: Keyword_doppler_token
    groups:
    - match_style: word
      terms:
      - doppler
      - DOPPLER_TOKEN
      - api.doppler.com
      - doppler.com
      - doppler run
      - service token
      - secrets manager
    strength: specific
created: '2026-11-25'
updated: '2026-11-25'
changelog:
- version: 1.0.0
  date: '2026-11-25'
  description: Initial release.
author: testpattern-community
license: MIT
references:
- url: https://docs.doppler.com/docs/Auth-token-formats
  title: "Doppler Auth Token Formats documentation (dp.pt, dp.st, dp.ct, dp.sa, dp.scim, dp.audit)"
- url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
  title: "gitleaks doppler-api-token rule"
