    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release. Completed electoral enrolment and update-of-enrolment records anchored on the ER022ESw_QLD field labels and CEA s 98AA evidence of identity. Enforce tiers need electoral context; 75 requires a populated DOB and address, 85 a populated DOB and an evidence-of-identity number. Guidance, blank forms, enrolment figures and school enrolment stay at 65.
