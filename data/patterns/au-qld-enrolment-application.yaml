schema: testpattern/v1
name: Queensland Electoral Enrolment Application or Update Record
slug: au-qld-enrolment-application
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed electoral enrolment and update-of-enrolment forms, and the enrolment transaction records that ECQ and the AEC hold under the joint roll arrangement (Electoral Act 1992 (Qld) s 62). A claim for enrolment carries the elector's name, date of birth, residential, postal and previous addresses, and evidence of identity: an Australian driver's licence number, an Australian passport number, Medicare card details or a citizenship certificate number (Commonwealth Electoral Act 1918 ss 98, 98AA; AEC form ER022ESw_QLD Q2, Q3, Q6 and Q7). Queensland enrolment and provisional enrolment of 16 and 17 year olds run under Electoral Act 1992 ss 65 and 66. Date of birth, sex, occupation and enrolment date are restricted information that is never in the publicly available part of the roll (Electoral Regulation 2024 s 5), and Electoral Act s 33 makes the information confidential in the hands of anyone administering the Act. The "Enrol or update your enrolment" guidance, blank forms and published enrolment figures are decoys.
operation: >-
  Primary: enrolment application / form / claim / record / details / update / change / transaction, application or claim for enrolment, update / change / transfer of enrolment, provisional enrolment, re-enrolment, electoral enrolment, enrol to vote, enrol or update, or the ER022 heading "registration as a silent elector and/or enrolment". Every enforce tier also needs an electoral context term within 300 characters (electoral roll, elector, Electoral Commission of Queensland, ECQ, AEC, electoral district or division, electorate, Electoral Act 1992, Commonwealth Electoral Act, enrolled address, general postal voter, silent elector). This keeps school and training enrolment forms at 65. 75 requires context plus a populated date of birth field (date of birth, birth date or DOB followed by a date on the same line) and a populated address field (residential, postal, enrolled, previous, home or street address followed by a street number and name or a PO Box). 85 requires context plus a populated date of birth field and a populated evidence-of-identity number field (driver's licence, licence, passport, Medicare card or citizenship certificate number followed by a value of 6 to 16 characters containing a digit). Values must be on the same line as their label and are placeholder-guarded, so blank forms stay at 65. All tiers AND NOT the shared template-exclusion dictionary; enforce tiers also exclude published figures and guidance (total State enrolment, weighted enrolment, enrolment statistics or figures, frequently asked questions, fact sheet, legislation.qld.gov.au). 65 is discovery-only.
pattern: >-
  (?i)\b(?:enrolment\s+(?:application|form|claim|record|details|update|change|transaction)s?|(?:application|claim)\s+for\s+(?:electoral\s+)?enrolment|(?:update|change|transfer)\s+(?:of\s+|to\s+|your\s+)?enrolment|provisional\s+enrolment|re-?enrolment|electoral\s+enrolment|enrol\s+to\s+vote|enrol\s+(?:or|and)\s+update|registration\s+as\s+a\s+silent\s+elector\s+and/or\s+enrolment)\b
confidence: medium
confidence_justification: >-
  Medium. Enrolment wording is shared with school, TAFE and course enrolment, so enforce tiers need an electoral context term and populated fields. The identity fields are label-anchored because the classifier does not validate licence, passport or Medicare formats; the elector identifying number (Electoral Act s 58(3)(d)) has no published format and is not used. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Electoral Act 1992 (Qld)
  - Electoral Regulation 2024 (Qld)
  - Commonwealth Electoral Act 1918 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government-id
  - government
corroborative_evidence:
  keywords:
    - electoral roll
    - elector
    - Electoral Commission of Queensland
    - AEC
    - electoral district
    - enrolled address
    - evidence of identity
    - citizenship
  proximity: 300
test_cases:
  should_match:
    - value: "Electoral enrolment form - update of enrolment (ECQ / AEC joint roll)\nFamily name: Teston\nDate of birth (dd/mm/yyyy): 14/03/1991\nCurrent residential address: 27 Wattle Street, Toowoomba QLD 4350\nPrevious residential address: 9 Banksia Court, Dalby QLD 4405\nEvidence of your identity - Australian driver's licence number: 087654321"
      description: Completed update-of-enrolment form with DOB, addresses and a driver licence number (85 tier)
      synthetic: true
    - value: "Application for enrolment - new elector, electoral district of Mirani\nName: Rowan Teston\nDate of birth: 02/11/2007\nPostal address: PO Box 412, Sarina QLD 4737\nMedicare card number: 2123 45670 1\nIndividual reference number (IRN): 2"
      description: Enrolment claim with DOB and Medicare evidence of identity (85 tier)
      synthetic: true
    - value: "Enrolment update received via online transaction. Elector: Casey Teston. Date of birth: 21/07/1985. New residential address: 4/18 Pandanus Avenue, Cairns QLD 4870. Enrolled address transferred to the electoral district of Cairns."
      description: Enrolment transaction record with DOB and a new address, no identity number (75 tier)
      synthetic: true
    - value: "Provisional enrolment (Electoral Act 1992 s 66)\nDate of birth: 30/01/2009\nResidential address: 63 Currawong Road, Rockhampton QLD 4700\nThe elector will be added to the electoral roll on turning 18."
      description: Provisional enrolment of a 17 year old with DOB and address (75 tier)
      synthetic: true
  should_not_match:
    - value: "Enrol or update your enrolment. You must enrol to vote if you are an Australian citizen aged 18 or over and have lived at your address for at least one month. You can enrol or update your enrolment online with the AEC using your driver's licence, Australian passport or Medicare card."
      description: ECQ / AEC "Enrol or update your enrolment" web guidance (65 only)
    - value: "Electoral enrolment form\nFamily name: ______________\nDate of birth (dd/mm/yyyy): __/__/____\nCurrent residential address: ______________\nAustralian driver's licence number: ______________\nElectoral Commission of Queensland"
      description: Blank enrolment form (65 only; no populated values)
    - value: "Enrolment statistics - Electoral Commission of Queensland\nAlgester 42,096 n/a 2.33%\nTotal State enrolment: 3,825,969 Enrolment as at: 02/09/2026"
      description: Published enrolment figures by electorate (decoy)
    - value: "Application for enrolment - Prep 2027, Riverbend State School\nStudent name: Harper Teston\nDate of birth: 04/05/2021\nHome address: 12 Lilly Pilly Street, Ipswich QLD 4305\nParent Medicare card number: 2123 45670 1"
      description: School enrolment form with DOB and address but no electoral context (65 only)
    - value: "98AA Evidence of identity requirements. (1) A claim for enrolment or transfer of enrolment must be accompanied by the claimant's driver's licence number, Australian passport number or other prescribed evidence of identity."
      description: Commonwealth Electoral Act s 98AA text (65 only)
false_positives:
  - description: ECQ and AEC enrolment guidance pages, which name the same evidence-of-identity documents.
    mitigation: Enforce tiers need a populated date of birth plus a populated address or identity number, on the same line as the label. Guidance names documents but carries no values.
  - description: School, TAFE, university and course enrolment forms with a DOB and address.
    mitigation: Enforce tiers need an electoral context term (electoral roll, elector, ECQ, AEC, electoral district, enrolled address) within 300 characters.
  - description: Blank enrolment forms and published enrolment figures.
    mitigation: Blank lines, date masks and bracket placeholders are rejected, and a figures exclusion suppresses total State enrolment, weighted enrolment and enrolment statistics.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_enrolment_application_primary
      matches:
        - ref: Regex_au_qld_enrolment_application_dob_field
        - ref: Regex_au_qld_enrolment_application_eoi_field
        - ref: Keyword_au_qld_enrolment_application_electoral_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_enrolment_application_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_enrolment_application_primary
      matches:
        - ref: Regex_au_qld_enrolment_application_dob_field
        - ref: Regex_au_qld_enrolment_application_address_field
        - ref: Keyword_au_qld_enrolment_application_electoral_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_enrolment_application_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_enrolment_application_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_enrolment_application_primary
      pattern: >-
        (?i)\b(?:enrolment\s+(?:application|form|claim|record|details|update|change|transaction)s?|(?:application|claim)\s+for\s+(?:electoral\s+)?enrolment|(?:update|change|transfer)\s+(?:of\s+|to\s+|your\s+)?enrolment|provisional\s+enrolment|re-?enrolment|electoral\s+enrolment|enrol\s+to\s+vote|enrol\s+(?:or|and)\s+update|registration\s+as\s+a\s+silent\s+elector\s+and/or\s+enrolment)\b
    - id: Regex_au_qld_enrolment_application_dob_field
      pattern: >-
        (?i)\b(?:date\s+of\s+birth|birth\s+date|DOB)(?:[ \t]*\(dd/mm/yyyy\))?[ \t]*[:#]?[ \t]{0,5}(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{4}|\d{1,2}[ \t]+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}[ \t]+\d{4}|(?:19|20)\d{2}-\d{2}-\d{2})\b
    - id: Regex_au_qld_enrolment_application_address_field
      pattern: >-
        (?i)\b(?:(?:current|previous|new|old|former)\s+)?(?:(?:residential|postal|enrolled|home|street)\s+)?address[ \t]*[:#][ \t]{0,5}(?:(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:PO|P\.O\.|GPO|Locked)[ \t]+(?:Box|Bag)[ \t]+\d{1,6})
    - id: Regex_au_qld_enrolment_application_eoi_field
      pattern: >-
        (?i)\b(?:(?:Australian\s+)?driver'?s?\s+licen[cs]e(?:\s+(?:no\.?|number))?|licen[cs]e\s+(?:no\.?|number)|(?:Australian\s+)?passport(?:\s+(?:no\.?|number))?|Medicare(?:\s+card)?(?:\s+(?:no\.?|number))?|citizenship\s+certificate(?:\s+(?:no\.?|number))?)[ \t]*[:#][ \t]{0,5}(?=[A-Z]{0,3}\d)[A-Z0-9][A-Z0-9 -]{4,14}[A-Z0-9]\b
    - id: Regex_au_qld_enrolment_application_guidance_exclusion
      pattern: >-
        (?i)\b(?:total\s+state\s+enrolment|weighted\s+enrolment|enrolment\s+(?:statistics|figures)|frequently\s+asked\s+questions|fact\s?sheet|legislation\.qld\.gov\.au)\b
  keywords:
    - id: Keyword_au_qld_enrolment_application_electoral_context
      groups:
        - match_style: word
          terms:
            - electoral roll
            - electoral rolls
            - elector
            - electors
            - Electoral Commission of Queensland
            - Electoral Commission Queensland
            - text: ECQ
              case_sensitive: true
            - Australian Electoral Commission
            - text: AEC
              case_sensitive: true
            - electoral district
            - electoral division
            - federal division
            - electorate
            - Electoral Act 1992
            - Commonwealth Electoral Act
            - enrolled address
            - general postal voter
            - silent elector
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier identifies a completed electoral enrolment or update-of-enrolment record that ties a named elector to their date of birth, current and previous addresses and an evidence-of-identity number (driver's licence, passport, Medicare card or citizenship certificate). Date of birth and the identity numbers are restricted information that never appears in the public roll (Electoral Regulation 2024 s 5; Electoral Act s 33), and the combination is enough to support identity takeover. Enrolment for a silent elector (ER022) can also expose a suppressed address; au-qld-silent-elector-record carries the PROTECTED label for that case. Guidance, blank forms, published enrolment figures and school enrolment forms are excluded from enforce tiers. Risk 7 supports the roll-derived SENSITIVE Electoral Roll label.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Electoral Roll
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Electoral Roll and Medium because a completed
    enrolment ties a named elector to date of birth, current and previous addresses and a licence, passport or Medicare
    number, enough for identity takeover. PROTECTED is not met for ordinary enrolments; silent-elector ER022 forms
    escalate separately.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling protects one elector's identity evidence and address history. High is reserved
      for silent-elector enrolments.
references:
  - title: Electoral Act 1992 (Qld) - ss 33, 58, 62, 65, 66
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1992-028
  - title: Electoral Regulation 2024 (Qld) - s 5 restricted information
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/sl-2024-0181
  - title: Commonwealth Electoral Act 1918 - ss 98, 98AA
    url: https://www.legislation.gov.au/C1918A00027/latest/text
  - title: AEC form ER022ESw_QLD - Registration as a silent elector and/or enrolment in Queensland (field labels)
    url: https://www.aec.gov.au/Enrolling_to_vote/pdf/forms/silent/ER022ESw_QLD.pdf
