schema: testpattern/v1
name: Queensland Mining and Petroleum Royalty Return
slug: au-qld-mining-petroleum-royalty-return
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Royalty returns, assessments and calculation worksheets for coal, minerals and petroleum (including coal seam gas) lodged with the Queensland Revenue Office by resource authority holders under the Mineral Resources Act 1989, the Mineral Resources (Royalty) Regulation 2025 and the Petroleum and Gas (Production and Safety) Act 2004. A return covers a return period and states the mining lease, petroleum lease or other tenement, the quantity of coal, mineral or petroleum sold, disposed of or used (tonnes, ounces, gigajoules), its value and permitted deductions, the royalty rate and the royalty payable. The figures are a producer's unpublished production, sales value and cost position for each tenement. Intellectual property and music royalty statements (global-top500-177-license-and-royalty-agreements) are a different subject; this SIT needs mining or petroleum context.
operation: >-
  Primary: [mineral / minerals / coal / petroleum / gas / mining] royalty return / assessment / lodgement / calculation / worksheet / statement. Every enforce tier needs resources context within 300 characters (Mineral Resources Act 1989, Mineral Resources (Royalty) Regulation, Petroleum and Gas (Production and Safety) Act, Queensland Revenue Office, Commissioner of State Revenue, QRO, mining lease, petroleum lease, mineral development licence, mining tenement, tenement holder, resource authority, run-of-mine, ROM, saleable coal, thermal / metallurgical / coking coal, coal seam gas, wellhead, free on board, FOB, private royalty, mine site). 65 (discovery only): primary alone. 75: primary plus context plus one of a tenement number (ML, MDL, EPM, EPC, PL, PPL, ATP, MLA with digits, mining / petroleum lease number, labelled tenement), a production quantity (a number with tonnes, kt, Mt, dmt, wmt, oz, GJ, TJ, PJ or bbl, or labelled tonnes / quantity / volume sold / produced / disposed of / mined / used) or a royalty amount (royalty payable / due / amount / rate, total royalty, amount payable, value of coal / mineral / petroleum / gas, gross value, wellhead value, deductions claimed, sale value with a dollar amount or percentage). 85: primary plus context plus any two of tenement, return period (return / royalty / reporting period, period / quarter / month ending with a date or month), quantity and amount. Enforce tiers AND NOT the shared template-exclusion dictionary and a guidance exclusion (public ruling, fact sheet, QRO Online guide, frequently asked questions, annual report, media release, budget paper, learn more).
pattern: >-
  (?i)\b((?:(?:mineral|minerals|coal|petroleum|gas|mining)\s+)?royalty\s+(?:return|assessment|lodgement|calculation|worksheet|statement)s?)\b
confidence: medium
confidence_justification: >-
  Medium. Royalty return wording also appears in QRO rulings and guides and in intellectual property or music royalty statements, so enforce tiers need resources context and populated return fields, and guidance framing is excluded. Tenement prefixes are short, so they count only as one field among several. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Mineral Resources Act 1989 (Qld)
  - Mineral Resources (Royalty) Regulation 2025 (Qld)
  - Petroleum and Gas (Production and Safety) Act 2004 (Qld)
frameworks:
  - QGISCF
data_categories:
  - financial
  - business
  - government
corroborative_evidence:
  keywords:
    - mining lease
    - petroleum lease
    - Mineral Resources Act 1989
    - Queensland Revenue Office
    - run-of-mine
    - saleable coal
    - coal seam gas
    - wellhead
  proximity: 300
test_cases:
  should_match:
    - value: "Coal royalty return - Queensland Revenue Office\nResource authority: ML 70452 (Teston Creek Mine)\nReturn period: September 2026\nSaleable coal sold: 412,580 tonnes\nValue of coal: $61,887,000\nRoyalty payable: $5,104,230.00"
      description: Coal royalty return with tenement, period, tonnage and royalty payable (85 tier)
      synthetic: true
    - value: "Petroleum royalty calculation worksheet - quarter ending 30/09/2026\nPetroleum lease PL 1047, coal seam gas sales 18,240 TJ\nWellhead value: $142,300,000\nRoyalty rate: 12.5%"
      description: Petroleum royalty worksheet with period, lease, volume and wellhead value (85 tier)
      synthetic: true
    - value: "Mineral royalty return draft for the mine site at EPM 27110 - figures to be confirmed by the tenement holder."
      description: Mineral royalty return with a tenement number only (75 tier)
      synthetic: true
  should_not_match:
    - value: "Royalty statement - Q3 2026\nArtist: Casey Teston\nStreams: 120,000\nRoyalty payable: $3,410.00"
      description: Music royalty statement (no resources context, 65 only)
    - value: "Public ruling: this ruling explains how a coal royalty return treats the value of coal under the Mineral Resources (Royalty) Regulation 2025, with an example of 100,000 tonnes."
      description: QRO public ruling (guidance exclusion)
    - value: "Coal royalty return\nResource authority: ML ______\nReturn period: ________\nRoyalty payable: $________"
      description: Blank royalty return form (65 only)
    - value: "The budget paper says coal royalty returns rose on higher saleable coal prices."
      description: Budget commentary (guidance exclusion)
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
false_positives:
  - description: QRO public rulings, QRO Online guides, fact sheets and budget papers that describe royalty returns with worked figures.
    mitigation: A guidance exclusion suppresses every enforce tier.
  - description: Intellectual property, publishing and music royalty statements.
    mitigation: Every enforce tier needs resources context (tenement, coal, petroleum or Queensland revenue terms), so they stay at 65.
  - description: Company annual reports and ASX quarterly production reports that state royalties paid.
    mitigation: Published reports lack the return structure (tenement plus period, quantity and royalty payable) or carry annual report framing; a draft return in a company file is a true positive.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_royalty_return_primary
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_au_qld_royalty_return_tenement
            - Regex_au_qld_royalty_return_period
            - Regex_au_qld_royalty_return_quantity
            - Regex_au_qld_royalty_return_amount
        - ref: Keyword_au_qld_royalty_return_resources_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_royalty_return_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_royalty_return_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_royalty_return_tenement
            - Regex_au_qld_royalty_return_quantity
            - Regex_au_qld_royalty_return_amount
        - ref: Keyword_au_qld_royalty_return_resources_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_royalty_return_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_royalty_return_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_royalty_return_primary
      pattern: >-
        (?i)\b((?:(?:mineral|minerals|coal|petroleum|gas|mining)\s+)?royalty\s+(?:return|assessment|lodgement|calculation|worksheet|statement)s?)\b
    - id: Regex_au_qld_royalty_return_tenement
      pattern: >-
        (\b(?:ML|MDL|EPM|EPC|PL|PPL|ATP|MLA)[ \t]?\d{3,6}\b|\b[Mm]ining\s+[Ll]ease\s+(?:[Nn]o\.?[ \t]{0,2})?\d{3,6}\b|\b[Pp]etroleum\s+[Ll]ease\s+(?:[Nn]o\.?[ \t]{0,2})?\d{3,6}\b|\b[Tt]enement(?:\s+(?:[Nn]o\.?|[Nn]umber|ID))?[ \t]*[:#][ \t]{0,5}[A-Z]{2,4}[ \t]?\d{3,6}\b)
    - id: Regex_au_qld_royalty_return_period
      pattern: >-
        (?i)\b((?:return\s+period|royalty\s+period|reporting\s+period|period\s+(?:ending|ended)|quarter\s+(?:ending|ended)|month\s+(?:ending|ended))[ \t]*[:#]?[ \t]{0,5}(?:\d{1,2}[/-]\d{1,2}[/-]\d{2,4}|\d{1,2}[ \t]+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]{0,6}[ \t]+\d{4}|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]{0,6}[ \t]+\d{4}|Q[1-4][ \t]+\d{4}))
    - id: Regex_au_qld_royalty_return_quantity
      pattern: >-
        (?i)(\b\d{1,3}(?:,\d{3}){0,4}(?:\.\d{1,3})?[ \t]?(?:tonnes|kt|Mt|dmt|wmt|ounces|oz|GJ|TJ|PJ|bbl|barrels)\b|\b(?:tonnes?|quantity|volume)\s+(?:sold|produced|disposed\s+of|mined|used)[ \t]*[:#]?[ \t]{0,5}\d{1,3}(?:,\d{3}){0,4})
    - id: Regex_au_qld_royalty_return_amount
      pattern: >-
        (?i)\b((?:royalty\s+(?:payable|due|amount|rate)|total\s+royalty|amount\s+payable|value\s+of\s+(?:coal|minerals?|petroleum|gas)|gross\s+value|wellhead\s+value|deductions?\s+claimed|sale\s+value)[ \t]*[:#]?[ \t]{0,5}(?:(?:\$|A\$|AUD)[ \t]?\d{1,3}(?:,\d{3}){0,4}(?:\.\d{1,2})?|\d{1,2}(?:\.\d{1,2})?[ \t]?%))
  keywords:
    - id: Keyword_au_qld_royalty_return_resources_context
      groups:
        - match_style: word
          terms:
            - Mineral Resources Act 1989
            - Mineral Resources (Royalty) Regulation
            - Petroleum and Gas (Production and Safety) Act
            - Queensland Revenue Office
            - Commissioner of State Revenue
            - text: QRO
              case_sensitive: true
            - mining lease
            - petroleum lease
            - mineral development licence
            - mining tenement
            - tenement holder
            - resource authority
            - run-of-mine
            - text: ROM
              case_sensitive: true
            - saleable coal
            - thermal coal
            - metallurgical coal
            - coking coal
            - coal seam gas
            - wellhead
            - free on board
            - text: FOB
              case_sensitive: true
            - private royalty
            - mine site
      strength: specific
    - id: Keyword_au_qld_royalty_return_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - public ruling
            - this ruling
            - fact sheet
            - guide for QRO Online
            - frequently asked questions
            - annual report
            - media release
            - budget paper
            - learn more
      strength: noise
risk_rating: 7
risk_description: >-
  The classifier identifies a Queensland coal, mineral or petroleum royalty return or worksheet with resources context and populated return fields: tenement, return period, quantity sold or produced, value and royalty payable. It exposes a producer's unpublished production volumes, realised prices, deductions and royalty liability for each tenement, which competitors, counterparties and traders can exploit, and it is confidential taxpayer information held by the Queensland Revenue Office. Rulings, guides, budget commentary, blank forms and music or IP royalty statements are excluded from enforce tiers. Risk 7 supports SENSITIVE Commercial-in-Confidence; PROTECTED is not met for a single return, though consolidated returns across a producer's portfolio sit at the upper end of this band.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Commercial-in-Confidence
  idcf: DSL-3
  idcf_marker: Confidential
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Commercial-in-Confidence and Medium because a
    royalty return discloses a producer's unpublished production, sale value and royalty liability per tenement.
    PROTECTED is not met for a single return; consolidated portfolio returns sit at the upper end of this band.
  generic:
    classification: Medium
    dlm: Medium Commercial-in-Confidence
    rationale: >-
      Medium Commercial-in-Confidence handling fits a producer's confidential production and royalty figures;
      consolidated portfolio returns deserve stricter handling within the same level.
