  - title: Mineral Resources (Royalty) Regulation 2025 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2025-0108
  - title: Petroleum and Gas (Production and Safety) Act 2004 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2004-025
