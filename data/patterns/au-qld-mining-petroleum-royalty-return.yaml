  - version: 1.1.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.0.0
    date: '2026-10-20'
    description: >-
      Initial release (qgfin sector review gap). Coal, mineral and petroleum royalty returns and worksheets. Every
      enforce tier needs resources context; 75 needs a tenement, quantity or royalty amount, 85 two of tenement,
      period, quantity and amount. Guidance and template framing are excluded on enforce tiers.
