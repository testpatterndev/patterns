schema: testpattern/v1
name: Know-your-customer profiles
slug: global-top500-131-know-your-customer-profiles
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: Detects references to know-your-customer profiles in financial and compliance documents. Commonly found in international regulatory filings, transaction records, and audit documentation.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 500 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(know[\s-]+your[\s-]+customer|customer\s+due\s+diligence|identity\s+verification|beneficial\s+owner|customer\s+risk\s+rating|enhanced\s+due\s+diligence|politically\s+exposed\s+person|source\s+of\s+funds)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - know-your-customer profiles
    - know
    - your
    - customer
    - profiles
    - credit
    - lending
    - insurance
  proximity: 500
  keyword_lists:
    - corporate-finance
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: know your customer
      description: Primary topic phrase match
    - value: customer due diligence
      description: Case-insensitive topic phrase match
    - value: identity verification
      description: Alternative topic phrase match
    - value: beneficial owner
      description: Additional topic phrase match
    - value: |-
        Know your customer
        Name: Avery Teston
      description: Populated person/client record with one field (75 tier)
      synthetic: true
    - value: |-
        Know your customer
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated person/client record with 2 distinct fields (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: credit premium
      description: Generic word pair from old broad template should not match
    - value: Know-your-customer profiles
      description: "Bare detector name (regression guard): the IdMatch does not match it alone, but the generated name-word tier lifted it to 75 next to any IdMatch phrase; it must not reach an enforcing tier"
    - value: |-
        Know your customer:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about know your customer are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In English (as the primary international business language), standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 500
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_kyc
      matches:
        - ref: Regex_global_top500_131_know_your_customer_profiles_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_kyc
      matches:
        - ref: Regex_global_top500_131_know_your_customer_profiles_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_kyc
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_kyc
      pattern: >-
        (?is)\b(know[\s-]+your[\s-]+customer|customer\s+due\s+diligence|identity\s+verification|beneficial\s+owner|customer\s+risk\s+rating|enhanced\s+due\s+diligence|politically\s+exposed\s+person|source\s+of\s+funds)\b
    - id: Regex_global_top500_131_know_your_customer_profiles_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
risk_description: >-
  The medium-confidence concept regex recognises know your customer, customer due diligence, identity verification, beneficial owner, customer risk rating, enhanced due diligence, politically exposed person, and source of funds, using eight corroborators across a 500-character window. Those terms appear in procedures and regulatory guidance, but a populated profile links a customer to identity evidence, ownership, verification results, funds provenance, or a risk outcome. Disclosure of the linked profile can enable identity fraud, expose private financial relationships, or help that customer tailor information to evade onboarding controls; the normal scale is one customer unless records are aggregated. Risk 7 and SENSITIVE Financial are maintained for the corroborated profile, whereas PROTECTED requires a bulk KYC repository, protected-source intelligence, or significant institutional compromise.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Where a match includes customer attribution and due-diligence results, risk 7 coherently maps to OFFICIAL:
    Sensitive, SENSITIVE Financial, and Medium because linked identity and financial evidence creates a direct fraud and
    control-evasion path. PROTECTED is not justified without bulk scale, protected intelligence, or credible severe
    organisational damage; procedure text alone does not even establish the populated SENSITIVE branch.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      A completed KYC profile belongs at Medium Financial because it joins identity, ownership, funds, and risk findings
      for a particular customer. Public compliance guidance and verification procedures lack that linked dossier and
      should not be treated as though they contain one.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-20'
    description: 'Generated name-word tier removed: the 75 tier ANDed Pattern_*_label_context (the detector name, "Know-your-customer profiles") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 75. The IdMatch does not match the bare name, so it scored 0 alone, but the name as a heading lifted any IdMatch phrase near it. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs a populated person/client record field (Regex_global_top500_131_know_your_customer_profiles_record_structure); 85 needs 2 distinct fields. Curated terms that sit inside an IdMatch hit were removed. KYC, CDD, EDD and PEP are acronyms of the IdMatch phrases, so a heading like "Know your customer (KYC) profile" reached 75; they are dropped. The IdMatch now accepts the hyphenated "know-your-customer" used in the detector name. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
  - version: 1.3.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1690 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: Widen patterns_proximity 300->500 so keyword evidence still gates at the challenging-layout distance (ph<50 cohort)
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
