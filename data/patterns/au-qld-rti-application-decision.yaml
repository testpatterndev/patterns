schema: testpattern/v1
name: Queensland Right to Information Access Application, Consultation or Decision
slug: au-qld-rti-application-decision
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Case records for access applications under the Right to Information Act 2009 (Qld): the s 24 access application (including the combined Right to Information and Information Privacy Access Application form), s 37 consultation with a relevant third party, and the s 54 decision notice giving reasons, with refusal grounds under s 47(3) - exempt information (s 48, schedule 3) and contrary to public interest information (s 49, schedule 4) - plus internal review (s 80) and external review by the Information Commissioner (s 85). A populated record carries the applicant's name, the application reference, dates received/decided, the documents sought, page counts, third parties consulted, the decision maker and the outcome. Published disclosure logs (s 78A) are public and treated as decoys, as are the Act, OIC/RTI guidance and blank forms. Overlaps with au-foi-exemption-references, which matches Commonwealth FOI Act exemption section references (ss 33-47) and does not cover Queensland schedule 3/4 grounds. India's Right to Information Act 2005 applications are excluded.
operation: >-
  Primary: "Right to Information Act (2009)", "RTI Act", "RTI (access) application", "Right to Information (access) application", "Information Privacy Access Application", "RTI reference/decision/application number", or a Queensland schedule 3 / schedule 4 ground reference (e.g. "schedule 3, section 10", "sch 4 pt 3"). Bare "Right to Information" (a Queensland government website footer link) is not a primary. 65 is discovery-only (primary alone) and surfaces guidance, the Act and disclosure logs. 75 requires one populated field within 300 characters: applicant / third party / decision maker name, application or RTI reference containing a digit, a dated application/decision field, the documents sought or scope, a page/document count, or a selected decision outcome (full/partial access, access refused, refuse to deal, deferred access). 85 requires two distinct populated fields plus an independent corroborative term (contrary to the public interest, exempt information, internal/external review, Information Commissioner, section 37, processing period, evidence of identity and similar). Every tier excludes template/fixture text; enforce tiers also exclude guidance/legislation signals, published disclosure log framing and Indian RTI Act 2005 signals.
pattern: (?i)\b(?:Right\s+to\s+Information\s+Act(?:\s+2009)?|RTI\s+Act|(?:RTI|Right\s+to\s+Information)\s+(?:access\s+)?application|(?:Right\s+to\s+Information\s+and\s+)?Information\s+Privacy\s+Access\s+Application|RTI\s+(?:ref(?:erence)?|decision|application\s+(?:no\.?|number)|file)|sch(?:edule|\.)?\s?[34],?\s+(?:part|pt|section|s|item)\.?\s?\d{1,2})\b
confidence: medium
confidence_justification: >-
  Medium: the RTI Act titles, form name and schedule 3/4 references are Queensland-specific, but guidance, the Act, training and published disclosure logs repeat them, and RTI application reference formats vary by agency (none is used as a value pattern). Enforce tiers require populated case fields and exclude disclosure-log framing. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Right to Information Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - government
  - pii
  - legal
corroborative_evidence:
  keywords:
    - contrary to the public interest
    - exempt information
    - internal review
    - external review
    - Information Commissioner
    - section 37
    - processing period
    - evidence of identity
    - charges estimate notice
    - refuse access
  proximity: 300
customisation:
  - key: qld-rti-application-reference
    kind: identifier-format
    identifier: qld-rti-application-reference
    target: purview.regexes/Regex_au_qld_rti_application_decision_party_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's rti / ip application reference format (see docs/identifiers.md#qld-rti-application-reference). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Right to Information Act 2009 - decision notice\nApplicant: Harriet Examplestone\nRTI reference: RTI-2026-0417\nDate of decision: 18/09/2026\nDecision: partial access\nNumber of pages released: 112\nInformation on 14 pages is contrary to the public interest (schedule 4, part 3, item 3 - personal information of other individuals) and 6 pages are exempt information. You may apply for internal review or external review by the Information Commissioner."
      description: 85 tier - decision notice with applicant, reference, date, outcome and page count plus public interest / review evidence
      synthetic: true
    - value: "RTI application - third party consultation (s 37)\nThird party: Kestrel Civil Contractors Pty Ltd\nThe agency has received an access application for documents that may be of concern to you. Please tell us within 10 business days whether you object to disclosure."
      description: 75 tier - s 37 consultation letter with a populated third-party field
      synthetic: true
    - value: "Right to Information and Information Privacy Access Application\nApplicant: Lachlan Fauxman\nDocuments sought: all emails between the depot manager and the fleet contractor about vehicle 14 from 1 January to 30 June 2026\nDate application received: 02/09/2026\nEvidence of identity sighted."
      description: 85 tier - access application with applicant, scope and date plus evidence of identity
      synthetic: true
    - value: "RTI Act internal review\nDecision maker: Priya Sampleton, Principal RTI Officer\nAccess refused under schedule 3, section 10 (law enforcement or public safety information)."
      description: 75 tier - internal review note with a populated decision-maker field
      synthetic: true
  should_not_match:
    - value: "Disclosure log\nRTI reference: RTI-2026-0311 | Date of application: 04/07/2026 | Information requested: fleet maintenance contracts 2024-2026 | Documents released: 88 pages. Documents released under the Right to Information Act 2009 are published on this disclosure log."
      description: Published disclosure log entry (public)
    - value: "To make an access application under the Right to Information Act 2009 you must complete the RTI application form, provide evidence of identity if you are seeking your own personal information, and pay the application fee. See rti.qld.gov.au."
      description: RTI / OIC guidance
    - value: "Right to Information and Information Privacy Access Application\nApplicant: __________\nDocuments sought: __________\nDate application received: [dd/mm/yyyy]"
      description: Blank access application form
    - value: "49 Contrary to public interest (1) If an access application is made to an agency or Minister for a document, the agency or Minister must decide to give access unless disclosure would, on balance, be contrary to the public interest. Right to Information Act 2009, current as at 1 July 2026."
      description: Legislation text
    - value: "Application under the Right to Information Act, 2005\nApplicant: Ravi Kumarson\nTo: The Public Information Officer\nFee of Rs. 10 paid by postal order."
      description: India RTI Act 2005 application
    - value: "Council received 212 RTI applications in 2025-26, up 18 per cent, its annual report on the operation of the Right to Information Act shows."
      description: Annual statistics / news
false_positives:
  - description: Published disclosure logs (s 78A) list RTI references, dates and document descriptions and are public.
    mitigation: Enforce tiers exclude disclosure-log headings and "published on/in this disclosure log" framing; logs stay at 65 discovery. A genuine decision letter that only says documents "may be published" in a disclosure log is not excluded.
  - description: Guidance from rti.qld.gov.au / oic.qld.gov.au, the Act and training material.
    mitigation: Enforce tiers require populated fields and exclude those domains, "current as at", "you must complete" and guideline signals.
  - description: Qld government website footers link to "Right to Information".
    mitigation: Bare "Right to Information" is not a primary; the Act title, RTI application, form name or schedule reference is required.
  - description: India's Right to Information Act 2005 applications.
    mitigation: The "Act, 2005" citation, Public Information Officer / PIO / CPIO and Rs. fee signals are excluded from enforce tiers.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_rti_application_decision_primary
      matches:
        - ref: Regex_au_qld_rti_application_decision_party_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_rti_application_decision_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_rti_application_decision_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_qld_rti_application_decision_primary
      matches:
        - ref: Regex_au_qld_rti_application_decision_party_field
        - ref: Regex_au_qld_rti_application_decision_record_field
        - ref: Keyword_au_qld_rti_application_decision_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_rti_application_decision_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_qld_rti_application_decision_primary
      matches:
        - ref: Regex_au_qld_rti_application_decision_record_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_rti_application_decision_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_rti_application_decision_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_rti_application_decision_primary
      matches:
        - type: any
          refs:
            - Regex_au_qld_rti_application_decision_party_field
            - Regex_au_qld_rti_application_decision_record_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_rti_application_decision_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_rti_application_decision_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_rti_application_decision_primary
      pattern: >-
        (?i)\b(?:Right\s+to\s+Information\s+Act(?:\s+2009)?|RTI\s+Act|(?:RTI|Right\s+to\s+Information)\s+(?:access\s+)?application|(?:Right\s+to\s+Information\s+and\s+)?Information\s+Privacy\s+Access\s+Application|RTI\s+(?:ref(?:erence)?|decision|application\s+(?:no\.?|number)|file)|sch(?:edule|\.)?\s?[34],?\s+(?:part|pt|section|s|item)\.?\s?\d{1,2})\b
    - id: Regex_au_qld_rti_application_decision_party_field
      pattern: >-
        (?i)(?:\b(?:applicant|applicant(?:'s)?\s+(?:full\s+)?name|name\s+of\s+(?:the\s+)?applicant|third\s+party|relevant\s+third\s+party|consulted\s+party|decision[\s-]+maker|authorised\s+decision[\s-]+maker)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'.-]{1,30}(?:[ \t]+[A-Za-z&'.,()-]{1,30}){1,6}|\b(?:(?:RTI|IP|application|our|your|file)\s+(?:ref(?:erence)?|no\.?|number)|reference\s+(?:no\.?|number))\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Za-z/._-]{0,12}\d)[A-Za-z0-9][A-Za-z0-9/._-]{2,24})
    - id: Regex_au_qld_rti_application_decision_record_field
      pattern: >-
        (?i)(?:\b(?:date\s+(?:(?:the\s+)?application\s+)?(?:received|made|lodged|compliant)|date\s+of\s+(?:(?:the\s+)?application|(?:the\s+)?decision)|decision\s+date|application\s+date)\s*[:#-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+[a-z]{3,9}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2})|\b(?:decision|outcome)\s*[:#]\s*(?:full\s+access|partial\s+access|access\s+(?:granted|refused)|refus(?:ed|e)\s+(?:access|to\s+deal)|deferred\s+access|documents?\s+(?:released|refused))|\b(?:documents?\s+(?:sought|requested)|scope(?:\s+of\s+(?:the\s+)?application)?|terms\s+of\s+(?:the\s+)?application)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9,;'/().-]{1,40}(?:[ \t]+[A-Za-z0-9,;'/().-]{1,30}){2,12}|\b(?:(?:number\s+of\s+)?(?:pages|folios|documents)\s+(?:located|considered|identified|released|refused)(?:\s+in\s+(?:full|part))?)\s*[:#-]?\s*\d{1,5}\b)
    - id: Regex_au_qld_rti_application_decision_guidance_exclusion
      pattern: >-
        (?i)(?:\brti\.qld\.gov\.au|\boic\.qld\.gov\.au|\blegislation\.qld\.gov\.au|\bcurrent\s+as\s+at\b|\bdisclosure\s+log\s*(?:[:|-]|\r?\n|entries\b|for\s+20\d{2})|\b(?:published|listed)\s+(?:on|in)\s+(?:this|the\s+agency'?s)\s+disclosure\s+log\b|\bto\s+make\s+an\s+access\s+application\b|\byou\s+must\s+complete\b|\bthis\s+(?:guideline|fact\s?sheet|guidance|annotated\s+legislation|webinar|course)\b|\bgeneral\s+information\s+only\b|\bInformation\s+Act,\s+2005\b|\bPublic\s+Information\s+Officer\b|\bC?PIO\b|\bRs\.\s?\d)
  keywords:
    - id: Keyword_au_qld_rti_application_decision_corroborative
      groups:
        - match_style: word
          terms:
            - contrary to the public interest
            - contrary to public interest information
            - exempt information
            - internal review
            - external review
            - Information Commissioner
            - section 37
            - processing period
            - evidence of identity
            - charges estimate notice
            - refuse access
            - access application
            - of concern to you
            - object to disclosure
      strength: specific
risk_rating: 6
risk_description: >-
  The classifier identifies an RTI access application, third-party consultation or decision record, gated on populated case fields. These records identify the applicant (often a journalist, litigant, employee or complainant), what they are pursuing, and through s 37 consultations whose information is involved and whether they object; decision schedules can also describe the withheld material. Disclosure logs, guidance, legislation and blank forms are excluded from enforce tiers. Risk 6 supports OFFICIAL: Sensitive / SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
