schema: testpattern/v1
name: Queensland Reportable Conduct Scheme Notification or Report (QFCC)
slug: au-qld-reportable-conduct-notification
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed notifications and reports under the Queensland Reportable Conduct Scheme in the Child Safe Organisations Act 2024 (Qld), which commenced on 1 July 2026 and is regulated by the Queensland Family and Child Commission (QFCC). The head of an entity must give QFCC an initial notification within 3 business days of becoming aware of a reportable allegation or conviction, an interim report within 30 business days and a final report with the investigation findings. A populated record names the worker (name, date of birth, role, Blue Card or exemption notice number), the child, the head of entity or delegate, the type of reportable conduct (child sexual offence, sexual misconduct, ill-treatment, significant neglect, physical violence, or behaviour causing significant emotional or psychological harm), dates, and risk-management steps. The scheme page, the QFCC guideline, the Act and blank forms are decoys. Reportable conduct records from other states' schemes (NSW, Vic, ACT) that use the same labels can also reach 75; the Queensland-specific corroborative terms mostly lift only Queensland records to 85.
operation: >-
  Primary: "reportable conduct (scheme)", "reportable allegation", "reportable conviction", "Child Safe Organisations Act 2024", or "initial notification / interim report / final report to QFCC / the Commission". 65 is discovery-only (primary alone) and surfaces QFCC guidance, the Act and policies. 75 requires one populated record field within 300 characters: worker / child / young person / student / head of entity / delegate / notifier name, date of birth, role or position, Blue Card or exemption notice number, a dated conduct/awareness field, or a selected type of reportable conduct from the verified list. Blank lines, bracket placeholders and n/a/tbc are rejected. 85 requires two distinct populated fields plus an independent corroborative term (QFCC, Blue Card, stood down, police, 3 / 30 business days, risk assessment, supervision and similar). Every tier excludes template/fixture text; enforce tiers also exclude guidance/legislation signals.
pattern: (?i)\b(?:reportable\s+conduct(?:\s+scheme)?|reportable\s+(?:allegation|conviction)s?|Child\s+Safe\s+Organisations\s+Act\s+2024|(?:initial\s+notification|interim\s+report|final\s+report)\s+(?:to|for)\s+(?:the\s+)?(?:QFCC|Queensland\s+Family\s+and\s+Child\s+Commission|Commission))\b
confidence: medium
confidence_justification: >-
  Medium: the scheme vocabulary is specific, but QFCC guidance, sector policies and training repeat it and the other states' reportable conduct schemes use similar terms. Enforce tiers require populated worker/child/entity fields; the Blue Card number format is not used as a value pattern (label only). 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Child Safe Organisations Act 2024 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - children
  - law-enforcement
corroborative_evidence:
  keywords:
    - QFCC
    - Queensland Family and Child Commission
    - blue card
    - exemption notice
    - stood down
    - police
    - 3 business days
    - 30 business days
    - risk assessment
    - supervision
  proximity: 300
customisation:
  - key: qld-blue-card-number
    kind: identifier-format
    identifier: qld-blue-card-number
    target: purview.regexes/Regex_au_qld_reportable_conduct_notification_record_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's blue card / exemption card number format (see docs/identifiers.md#qld-blue-card-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Reportable conduct - initial notification to QFCC\nHead of entity: Dr Imogen Testwell, Principal\nWorker: Callum Fictor\nWorker date of birth: 12/03/1988\nRole: Year 8 music teacher\nType of reportable conduct: sexual misconduct\nThe worker has been stood down and has no contact with students pending investigation. Police have been notified."
      description: 85 tier - initial notification with head of entity, worker, DOB, role and conduct type plus stood down / police
      synthetic: true
    - value: "Reportable allegation received 04/09/2026\nWorker: Dana Placeholt\nThe allegation concerns rough handling of a child during swimming lessons at the council aquatic centre."
      description: 75 tier - reportable allegation note with one populated worker field
      synthetic: true
    - value: "Interim report to the Commission (reportable conduct)\nChild: Student A (Year 5)\nDate of alleged conduct: 21/08/2026\nBlue card number: 1234567/2\nSupervision changed so the worker is never alone with children; risk assessment reviewed weekly."
      description: 85 tier - interim report with child, date and blue card fields plus supervision / risk assessment
      synthetic: true
    - value: "Reportable conviction - notice to QFCC\nName of worker: Morgan Faketon\nPosition: youth program volunteer\nThe worker disclosed a conviction for physical violence in the presence of a child; the organisation notified QFCC within 3 business days."
      description: 85 tier - reportable conviction with worker name and position plus QFCC / 3 business days
      synthetic: true
  should_not_match:
    - value: "If your organisation receives a report about reportable conduct, the head of your organisation is required to notify us of the report within three business days, provide an interim report within 30 business days and provide a final report including the investigation findings. See qfcc.qld.gov.au."
      description: QFCC scheme guidance page
    - value: "Reportable conduct initial notification form\nHead of entity: __________\nWorker: __________\nDate of birth: __________\nType of reportable conduct: [select]"
      description: Blank notification form
    - value: "Child Safe Organisations Act 2024. Part 4 Reportable conduct scheme. The head of a reportable entity must notify the commission within 3 business days after becoming aware of a reportable allegation. Current as at 1 July 2026."
      description: Legislation text
    - value: "Our school's reportable conduct policy: all staff complete annual training on the Reportable Conduct Scheme and know how to raise a concern with the principal. Training exercise - scenario 2."
      description: Policy / training material
    - value: "QFCC said the new Reportable Conduct Scheme received 140 notifications in its first month, most from schools and early childhood services."
      description: News / statistics
false_positives:
  - description: QFCC guidance, the implementation guideline, the Act and organisation policies describe the same notification content.
    mitigation: Enforce tiers require populated fields and exclude qfcc.qld.gov.au / legislation.qld.gov.au, "current as at", "is required to", "must notify", guideline and policy signals.
  - description: Blank forms and form kits.
    mitigation: Blank lines, bracket placeholders and n/a/tbc values are rejected.
  - description: Interstate reportable conduct records (NSW Office of the Children's Guardian, Vic CCYP, ACT Ombudsman) use similar field labels.
    mitigation: They can reach 75 (equally sensitive); the 85 corroborative list favours Queensland terms (QFCC, Blue Card).
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_reportable_conduct_notification_primary
      matches:
        - ref: Regex_au_qld_reportable_conduct_notification_party_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_reportable_conduct_notification_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_reportable_conduct_notification_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_qld_reportable_conduct_notification_primary
      matches:
        - ref: Regex_au_qld_reportable_conduct_notification_party_field
        - ref: Regex_au_qld_reportable_conduct_notification_record_field
        - ref: Keyword_au_qld_reportable_conduct_notification_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_reportable_conduct_notification_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_qld_reportable_conduct_notification_primary
      matches:
        - ref: Regex_au_qld_reportable_conduct_notification_record_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_reportable_conduct_notification_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_reportable_conduct_notification_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_reportable_conduct_notification_primary
      matches:
        - type: any
          refs:
            - Regex_au_qld_reportable_conduct_notification_party_field
            - Regex_au_qld_reportable_conduct_notification_record_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_reportable_conduct_notification_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_reportable_conduct_notification_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_reportable_conduct_notification_primary
      pattern: >-
        (?i)\b(?:reportable\s+conduct(?:\s+scheme)?|reportable\s+(?:allegation|conviction)s?|Child\s+Safe\s+Organisations\s+Act\s+2024|(?:initial\s+notification|interim\s+report|final\s+report)\s+(?:to|for)\s+(?:the\s+)?(?:QFCC|Queensland\s+Family\s+and\s+Child\s+Commission|Commission))\b
    - id: Regex_au_qld_reportable_conduct_notification_party_field
      pattern: >-
        (?i)\b(?:worker|worker(?:'s)?\s+(?:full\s+)?name|name\s+of\s+(?:the\s+)?worker|subject\s+worker|respondent|child|child(?:'s)?\s+name|young\s+person|student|head\s+of\s+(?:the\s+)?entity|head\s+of\s+(?:the\s+)?organisation|authorised\s+delegate|delegate|notifier|other\s+names?\s+known\s+by|role|position|(?:worker\s+)?date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.,-]{0,30}(?:[ \t]+[A-Za-z0-9(][A-Za-z0-9/'.,()-]{0,30}){0,5}
    - id: Regex_au_qld_reportable_conduct_notification_record_field
      pattern: >-
        (?i)(?:\b(?:blue\s+card(?:\s+(?:no\.?|number))?|exemption\s+notice(?:\s+(?:no\.?|number))?)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|not\s+(?:known|recorded|held))\b|_{2,}|\[|<)[0-9][0-9/ -]{3,14}\d|\b(?:date\s+of\s+(?:(?:the\s+)?alleged\s+)?(?:conduct|incident|allegation|conviction)|date\s+(?:the\s+)?(?:head\s+of\s+(?:the\s+)?entity\s+)?became\s+aware|date\s+(?:allegation\s+)?received|date\s+notified)\s*[:#-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+[a-z]{3,9}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2})|\b(?:type\s+of\s+reportable\s+conduct|reportable\s+conduct\s+type|conduct\s+type|category)\s*[:#]\s*(?:(?:a\s+)?child\s+sexual\s+offence|sexual\s+misconduct|ill[\s-]treatment|significant\s+neglect|physical\s+violence|(?:behaviour\s+(?:that\s+)?caus(?:es|ing)\s+)?significant\s+(?:emotional|psychological)))
    - id: Regex_au_qld_reportable_conduct_notification_guidance_exclusion
      pattern: >-
        (?i)(?:\bqfcc\.qld\.gov\.au|\blegislation\.qld\.gov\.au|\bcurrent\s+as\s+at\b|\b(?:is|are)\s+required\s+to\s+notify\b|\bmust\s+notify\s+the\s+commission\b|\bthe\s+head\s+of\s+(?:an?|your)\s+(?:organisation|entity|reportable\s+entity)\s+(?:must|is\s+required)|\bif\s+your\s+organisation\b|\b(?:implementation\s+)?guideline\s+for\s+implementing\b|\bGuide\s+to\s+Queensland'?s\s+Reportable\s+Conduct\s+Scheme\b|\breportable\s+conduct\s+policy\b|\bthis\s+(?:guideline|policy|fact\s?sheet|guidance|webinar|course|module)\b|\bgeneral\s+information\s+only\b|\bsubscribe\b)
  keywords:
    - id: Keyword_au_qld_reportable_conduct_notification_corroborative
      groups:
        - match_style: word
          terms:
            - text: QFCC
              case_sensitive: true
            - Queensland Family and Child Commission
            - blue card
            - exemption notice
            - stood down
            - suspended
            - police
            - 3 business days
            - 30 business days
            - risk assessment
            - supervision
            - no contact
            - investigation findings
            - disciplinary
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a completed reportable conduct notification or report, gated on populated worker, child or entity fields. These records carry unproven allegations of child sexual offences, sexual misconduct, ill-treatment, neglect or violence against a named worker, together with details of the child. Disclosure can harm the child, prejudice the investigation or any police matter, and defame a worker whose allegation is not substantiated. Guidance, legislation, policies and blank forms are excluded from enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 9 with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and the Medium tier reflects a
    QFCC reportable conduct notification naming a worker, Blue Card details and a child alongside unproven allegations
    of sexual offences, ill-treatment or neglect. SENSITIVE rather than PROTECTED applies because one notification is a
    case record, not a bulk holding.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling protects the child's identity and unproven allegations against a named worker,
      where disclosure can prejudice investigation. Generic High is not applied to a single case notification.
references:
  - title: Child Safe Organisations Act 2024 (Qld)
    url: https://www.legislation.qld.gov.au/view/whole/html/asmade/act-2024-049
  - title: QFCC - Reportable Conduct Scheme (commenced 1 July 2026)
    url: https://www.qfcc.qld.gov.au/childsafe/reportable-conduct-scheme
  - title: QFCC - How to report (initial notification content, 3 / 30 business days)
    url: https://www.qfcc.qld.gov.au/childsafe/reportable-conduct-scheme/what-do-organisations-need-do/how-report
  - title: QFCC - Types of reportable conduct
    url: https://www.qfcc.qld.gov.au/childsafe/reportable-conduct-scheme/what-reportable-conduct-scheme/types-reportable-conduct
