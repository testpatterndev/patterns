schema: testpattern/v1
name: LPP Claim Assessment
slug: lpp-claim-assessment
version: 1.6.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects internal assessments evaluating whether specific documents or communications attract legal professional privilege, including analysis of privilege vulnerabilities. These meta-privilege documents map where the State's privilege claims are strong and where they are vulnerable.
operation: 'Primary: privilege claim(s)/assessment/log/review, LPP (claim) assessment, waiver risk. 65 (discovery only) = primary alone. 75 = primary plus two distinct populated matter/document fields (Matter, Matter/File/RTI/Application number, Our ref, Documents assessed, Doc ID, Category X documents, Privilege claimed/basis/status, Prepared by/for, Date, To, From, Subject). 85 = primary plus three distinct fields plus an independent legal conclusion (vulnerable to challenge, privilege maintained/waived, dominant purpose (not) established, distribution defeated, mixed-purpose). Academic/guide/template and public-decision exclusions, the template-exclusion dictionary and the Qld court-citation filter apply to every tier.'
pattern: (?i)\b(?:privilege\s+(?:claims?|assessment|log|review)|LPP\s+(?:claims?\s+)?assessment|waiver\s+risk)\b
confidence: medium
confidence_justification: 'Medium: privilege-assessment terms also appear in articles, judgments and guides, so enforcement requires populated matter/document fields; 85 adds a privilege conclusion. Tiers are heuristic evidence gates, not measured accuracy.'
jurisdictions:
  - au
regulations:
- Evidence Act 1977 (Qld)
- Right to Information Act 2009 (Qld)
frameworks:
- QGISCF
data_categories:
  - legal
  - government
corroborative_evidence:
  keywords:
    - assessment
    - analysis
    - vulnerable
    - maintain
    - claim
    - PROTECTED
    - waiver
    - privilege log
    - Crown Solicitor
    - State Solicitor
    - dominant purpose
    - Evidence Act
    - s.14
  proximity: 300
  keyword_lists:

    - corporate-legal

    - government-services
test_cases:
  should_match:
    - value: |-
        PROTECTED - LEGAL PROFESSIONAL PRIVILEGE
        LPP claim assessment
        Matter: Harbour Freight Pty Ltd v State of Queensland
        File ref: CL2026-0412
        Documents assessed: 247 (privilege log items 1-247)
        Prepared by: Crown Solicitor
        Documents 42-58 are vulnerable to challenge because distribution defeated dominant purpose.
      description: 85 - populated matter/document fields plus a privilege conclusion
      synthetic: true
    - value: |-
        CONFIDENTIAL
        Internal Assessment: Legal Professional Privilege Claims
        Prepared for: Department of Health Legal Services

        Privilege Vulnerability Analysis:
        - Category A documents: Strong LPP claim (dominant purpose established)
        - Category B documents: Moderate waiver risk (circulated beyond legal team)
      description: 85 - internal privilege vulnerability analysis with populated category ratings and a conclusion
    - value: |-
        Privilege review
        Matter no: RTI-2026-0771
        Prepared by: Legal Services Unit
        Review of 34 email chains is under way.
      description: 75 - two populated matter fields without a conclusion
      synthetic: true
    - value: |-
        PROTECTED - LEGAL PROFESSIONAL PRIVILEGE
        LPP Claim Assessment

        Matter: State of Queensland - RTI Application No. 2025-0342

        This assessment evaluates the privilege claims over 247 documents identified in the privilege log. Documents 42-58 are assessed as vulnerable to challenge due to mixed-purpose communication.
      description: 65 discovery - only one populated field (Matter); conclusion present but structure insufficient
    - value: Privilege assessment intake note.
      description: 65 discovery - topic without matter facts
    - value: 'Privilege assessment for Matter: RTI-771 covering documents 12-18.'
      description: 65 discovery - a single populated matter field
    - value: 'PROTECTED LPP assessment for Matter RTI-342: Crown Solicitor concludes documents 42-58 are vulnerable because distribution defeated dominant purpose.'
      description: 65 discovery - one-line assessment without populated fields
    - value: |-
        Privilege Review - Confidential
        The following privilege assessment has been prepared to identify waiver risk across the discovery set. The Crown Solicitor has advised that certain email chains may not maintain privilege due to wide circulation.
      description: 65 discovery - prose without populated matter fields
  should_not_match:
    - value: This article discusses the doctrine of legal professional privilege in Australian law. The Evidence Act 1977 (Qld) section 14 sets out the statutory basis for privilege claims.
      description: Academic article on LPP doctrine
    - value: The court considered the privilege claim and upheld it in part. The published reasons discussed the dominant purpose test and its application to the documents in question.
      description: Published court decision on a privilege claim (news/judgment)
    - value: A guide to managing privilege logs in large-scale litigation. This template provides a framework for recording privilege claims across document collections.
      description: Guide/template for privilege log management
    - value: The employee claimed a travel privilege under the loyalty program.
      description: Non-legal privilege usage outside scope
    - value: 'Guide template: assess each privilege claim for waiver risk.'
      description: Guide/template wording blocked by the exclusion group
    - value: |-
        Privilege log
        Doc ID: ________
        Date: ________
        Privilege claimed: [select]
        Basis of claim: ________
      description: Blank privilege log - placeholder fields are rejected
false_positives:
  - description: Academic articles on the doctrine of legal professional privilege
    mitigation: Require co-occurrence with specific matter references, government entity names, or privilege vulnerability analysis
  - description: Published court decisions on privilege claims
    mitigation: Negative match on court citation formats and 'published reasons'
  - description: Template privilege log frameworks
    mitigation: Negative match on 'template', 'guide', 'framework', 'sample'. Require specific document counts or matter references
  - description: RTI decision notices discussing privilege (public documents)
    mitigation: Negative match on 'decision notice', 'Information Commissioner', 'published decision'
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_lpp_claim_assessment_primary
      matches:
        - ref: Regex_lpp_claim_assessment_record_structure
          min_count: 3
          unique_results: true
        - ref: Evidence_lpp_conclusion
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - exclusion
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_lpp_claim_assessment_primary
      matches:
        - ref: Regex_lpp_claim_assessment_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - exclusion
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_lpp_claim_assessment_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - exclusion
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_lpp_claim_assessment_primary
      pattern: (?i)\b(?:privilege\s+(?:claims?|assessment|log|review)|LPP\s+(?:claims?\s+)?assessment|waiver\s+risk)\b
    - id: Regex_lpp_claim_assessment_record_structure
      pattern: (?i)\b(?:Matter|Matter\s+(?:no\.?|number)|File\s+(?:ref|no\.?|number)|Our\s+ref|RTI\s+(?:application\s+)?(?:no\.?|number)|Application\s+(?:no\.?|number)|Documents?\s+(?:assessed|range|numbers?)|Doc(?:ument)?\s+ID|Category\s+[A-Z]\s+documents|Privilege\s+(?:claimed|basis|status)|Basis\s+of\s+claim|Prepared\s+(?:by|for)|Date|To|From|Subject)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<)[A-Za-z0-9$]
  keywords:
    - id: Evidence_lpp_conclusion
      groups:
        - match_style: word
          terms:
            - vulnerable to challenge
            - vulnerable to waiver
            - privilege maintained
            - privilege waived
            - dominant purpose established
            - dominant purpose not established
            - distribution defeated
            - mixed-purpose
            - not privileged
      strength: domain
    - id: exclusion
      groups:
        - match_style: word
          terms:
            - textbook
            - article discusses
            - published reasons
            - template
            - guide
            - framework
            - decision notice
            - Information Commissioner
      strength: domain
  filters:
    - type: exclude_pattern
      pattern: \[\d{4}\]\s+Q[SC]C?A?\s+\d+
      description: Exclude QLD court citation formats
risk_rating: 7
risk_description: >-
  This low-confidence keyword-proximity detector looks for internal assessments of legal-professional-privilege claims, privilege logs, waiver risk, and vulnerability analysis in government context. A genuine assessment maps which documents have strong or weak privilege claims, enabling an opponent or requester to target vulnerable communications and increasing the risk of waiver or compelled disclosure. Academic articles, judgments, templates, and public RTI decisions can use the same language, so internal matter and analysis context is essential. Risk 7 supports SENSITIVE Legal; PROTECTED would require broad compromise of a major privileged portfolio or significant institutional damage beyond one review.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
references:
  - title: Evidence Act 1977 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1977-047
  - title: Right to Information Act 2009 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-013
created: '2026-02-20'
updated: '2026-09-24'
changelog:
  - version: 1.6.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): Replaced the legacy keyword primary with an id-bearing regex primary (also matches plural "privilege claims"). 75 now requires two distinct populated matter/document fields (new Regex_..._record_structure) instead of generic matter words (documents, RTI, Matter:); 85 requires three fields plus a privilege conclusion (the old 85 was reachable on keyword groups alone). Wired the shared template-exclusion dictionary (Keyword_noise_exclusion) into every tier alongside the existing exclusion group and citation filter; dropped the marking and matter-context keyword groups; "vulnerable" narrowed to "vulnerable to challenge/waiver"; recommended_confidence 85 -> 75; confidence low -> medium to match the gated design. Added populated 85/75 positives and a blank privilege-log decoy; one-line/prose positives re-described as 65. Added Evidence Act and RTI Act references.'
  - version: 1.5.0
    date: '2026-07-19'
    description: 'Targeted blocker remediation: split matter facts, legal conclusions, and privilege/marking evidence into canonical keyword references; make RTI case-sensitive; author 65 discovery, 75 populated-matter, and 85 matter-plus-conclusion-plus-marking tiers with exact probes while preserving public-decision and template exclusions.'
  - version: 1.4.0
    date: '2026-07-17'
    description: 'TP-01482 approved reduced scope: add a policy-capable 75 tier wiring the existing primary keyword group to the existing corroborative group, NOT-gated by the existing exclusion group (all references pre-existing in this YAML; no new detection structure). The 65 tier remains discovery-only. Deferred per QA/independent review: the proposed 85 tier, pending a split of the flat corroborative group into independently referenceable marking/matter-detail/waiver-conclusion groups. Added a populated-assessment positive plus non-legal-privilege and guide/template negatives.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1465 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-12'
    description: 'Baseline burn-down B: the sole pattern_tier had id_match: '''' (empty string) — idMatchIds() treats an empty id_match string as [], so scripts/verify-pattern-testcases.mjs tierEvaluable() filtered the tier out entirely (0 evaluable tiers), which routed should_not_match evaluation through the hard-fail no-tiers-to-gate-it path instead of the discovery_only warn path the tier was designed for. Wired id_match to the existing purview.keywords group id primary (already registered under the group: primary key), making the tier evaluable again; the tier remains discovery_only so a top-level hit on published-court-decision prose (the privilege claim negative) now surfaces only as a discovery-inventory warning, not a should_not_match failure. Verified: 0 FAILs, all 3 should_not_match negatives clear; all 3 should_match positives still pass via top-level pattern.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove the dead template-exclusion declaration (Keyword_noise_exclusion) — no tier referenced it and the legacy tier shape carries no evidence lists to wire it into (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Downgraded weak high-confidence tier to 65 because independent specific/domain evidence was insufficient.; Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
author: qld-gov-dlp
source: qld-custom
license: MIT
remediation:
  catalog_quality_2026_06_02:
    status: applied
    changes:
      - 'Downgraded weak high-confidence tier to 65 because independent specific/domain evidence was insufficient.'
      - 'Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.'
      - 'Collapsed 3 duplicate 65-confidence tier(s) into the strictest canonical tier.'
      - 'Aligned recommended_confidence to 65.'
