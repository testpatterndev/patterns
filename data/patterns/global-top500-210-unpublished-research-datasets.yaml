schema: testpattern/v1
name: Unpublished research datasets
slug: global-top500-210-unpublished-research-datasets
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects unpublished research datasets: an unpublished / pre-publication / raw research data phrase combined with populated data rows keyed by a participant or sample identifier, or study metadata (study ID, HREC reference, protocol number, data custodian). Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: unpublished (research) data/datasets/results, pre-publication data, raw research data, embargoed data/dataset, confidential (research) dataset, research dataset(s). 65 (discovery only): primary alone. 75: primary plus one populated structure - a delimited data row keyed by a participant/sample/record identifier with a numeric value, or a study-metadata field (ethics approval, HREC reference, protocol number, study ID, dataset ID/DOI, data custodian, chief/principal investigator) with a value. 85: primary plus two distinct structures (the two above or a delimited column header pairing a participant/sample ID column with measurement columns) plus pre-publication evidence (embargo, data management plan, not for distribution, de-identified, re-identifiable, data sharing agreement, manuscript in preparation, collaborators only). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: >-
  (?i)\b(?:unpublished\s+(?:research\s+)?(?:data(?:sets?)?|results)|pre-?publication\s+data(?:sets?)?|raw\s+research\s+data|embargoed\s+data(?:sets?)?|confidential\s+(?:research\s+)?datasets?|research\s+datasets?)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated data rows or study metadata beside the dataset phrase; 'intellectual property' and 'experimental results' were removed from the primary because they matched generic text. Data-management policies and news stay at 65; a header-only extract stays at 65. Medium because published supplementary data files share the structure.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - embargo
    - pre-publication
    - data management plan
    - not for distribution
    - de-identified
    - re-identifiable
    - data sharing agreement
    - manuscript in preparation
    - under review
    - collaborators only
  proximity: 300
test_cases:
  should_match:
    - value: "Unpublished research dataset - embargoed until publication\nStudy ID: SLEEP-QLD-02\nHREC reference: 2025/HE000412\nparticipant_id,age,sex,group,baseline_score,week12_score\nP00417,34,F,intervention,21,12\nP00418,52,M,control,19,18\nData management plan v3; collaborators only."
      description: Dataset with study metadata, header and participant rows (85)
      synthetic: true
    - value: "Raw research data export\nStudy ID: SLEEP-QLD-02\nFiles transferred to the secure research drive."
      description: Export note with study metadata only (75)
      synthetic: true
  should_not_match:
    - value: "Policy guidance: research datasets must be stored on approved storage and unpublished data should only be shared under a data sharing agreement. Record the study ID and HREC reference in the data management plan."
      description: Data-management guidance
      synthetic: true
    - value: "Research dataset\nStudy ID: __________\nHREC reference: __________\nparticipant_id,age,sex,group,baseline_score\n"
      description: Blank dataset - placeholder metadata and header only
      synthetic: true
    - value: "The journal retracted the paper after the authors could not provide the raw research data, a news report said."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "algorithm schematic"
      description: Unrelated
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing research datasets.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of research datasets.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
  - description: Published open datasets and supplementary files.
    mitigation: They can reach 75/85 when they carry participant rows; apply publication status in policy.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_unpublished_research_datasets
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_210_unpublished_research_datasets_column_header
            - Regex_global_top500_210_unpublished_research_datasets_data_row
            - Regex_global_top500_210_unpublished_research_datasets_study_metadata
        - ref: Keyword_global_top500_210_unpublished_research_datasets_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_210_unpublished_research_datasets_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_unpublished_research_datasets
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_210_unpublished_research_datasets_data_row
            - Regex_global_top500_210_unpublished_research_datasets_study_metadata
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_210_unpublished_research_datasets_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_unpublished_research_datasets
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_unpublished_research_datasets
      pattern: (?i)\b(?:unpublished\s+(?:research\s+)?(?:data(?:sets?)?|results)|pre-?publication\s+data(?:sets?)?|raw\s+research\s+data|embargoed\s+data(?:sets?)?|confidential\s+(?:research\s+)?datasets?|research\s+datasets?)\b
    - id: Regex_global_top500_210_unpublished_research_datasets_column_header
      pattern: (?i)\b(?:(?:participant|subject|sample|specimen|patient|record|animal|site)[ _]?(?:id|no|number|code)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:age|sex|gender|group|arm|treatment|dose|baseline(?:[ _]?\w{1,20})?|visit|outcome|score|result|value|measurement|timepoint|bmi|concentration|week\d{1,2}[ _]?\w{1,20})|(?:age|sex|gender|group|arm|treatment|dose|baseline(?:[ _]?\w{1,20})?|visit|outcome|score|result|value|measurement|timepoint|bmi|concentration|week\d{1,2}[ _]?\w{1,20})\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:participant|subject|sample|specimen|patient|record|animal|site)[ _]?(?:id|no|number|code))\b
    - id: Regex_global_top500_210_unpublished_research_datasets_data_row
      pattern: (?i)\b[A-Z]{0,5}[-_]?\d{4,12}\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,160}?(?:[,;\t]|\|[ \t]{0,2}))?\"?-?\$?\d{1,12}(?:\.\d{1,6})?%?(?![\w.])
    - id: Regex_global_top500_210_unpublished_research_datasets_study_metadata
      pattern: (?i)\b(?:ethics\s+approval|HREC(?:\s+(?:ref|reference|no\.?|number|approval))?|protocol\s*(?:no\.?|number|ID)|study\s*(?:ID|code|no\.?)|dataset\s*(?:ID|DOI|version)|data\s+custodian|chief\s+investigator|principal\s+investigator)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
  keywords:
    - id: Keyword_global_top500_210_unpublished_research_datasets_domain_evidence
      groups:
        - match_style: word
          terms:
            - embargo
            - pre-publication
            - data management plan
            - not for distribution
            - de-identified
            - re-identifiable
            - data sharing agreement
            - manuscript in preparation
            - under review
            - collaborators only
      strength: domain
    - id: Keyword_global_top500_210_unpublished_research_datasets_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - secure research drive policy
            - retracted the paper
      strength: noise
risk_description: >-
  This detector identifies unpublished data, a research dataset, raw research data, experimental results, confidential dataset, or proprietary research terminology. A genuine unpublished dataset can embody costly collection, unique observations, negative results, and publication or patent priority, enabling competitors to reproduce conclusions or publish first. The regex also accepts generic research and intellectual-property phrases, so one normal match represents a bounded dataset reference rather than an assumed population-scale personal database. Risk 8 supports SENSITIVE InfoTech; PROTECTED would require irreplaceable strategic research, bulk highly sensitive records, or compromise causing significant programme or participant harm. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs a populated participant/sample data row or study-metadata field and 85 needs two distinct structures (header counts only toward 85) plus pre-publication evidence. Removed the self-corroborating evidence group and generic primaries (intellectual property, proprietary research, experimental results). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA, My Health Records Act and TIA Act; added the NHMRC National Statement reference.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 811 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
