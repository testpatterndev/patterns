schema: testpattern/v1
name: QLD School Incident Report
slug: au-qld-school-incident-report
version: 1.5.1
type: regex
pattern_class: concept
description: >-
  Detects Queensland school incident and student behaviour records for a named student - school/student incident reports, behaviour incident records, behaviour support plans and disciplinary absence (suspension/exclusion) records - when the phrase sits with populated student identifiers and incident fields.
operation: >-
  Primary: school/student/behaviour incident report, notification or record, behaviour incident, (individual) behaviour support plan, school disciplinary absence, short/long/charge-related suspension, proposed exclusion. 65 (discovery only): phrase alone. 75: phrase plus a populated student identifier field (student name, DOB, EQ ID, year level, parent/guardian, class). 85: student field plus a populated incident field (incident date/time/type/location, behaviour category, witnesses, reported by, action taken, consequence, injuries, SDA type) plus independent school-system evidence (OneSchool, Department of Education, State School, parent notified, Student Code of Conduct, duty of care). Template and guidance/training framing excluded from 75/85. Converted from keyword_list to regex.
pattern: (?i)\b(?:(?:school|student|behaviour(?:al)?)\s+incident\s+(?:report|notification|record)|behaviour\s+incident|(?:individual\s+)?behaviour\s+support\s+plan|school\s+disciplinary\s+absence|(?:short|long|charge-related)[\s-]+suspension|proposed\s+exclusion)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated student identifier; 85 also needs an incident field and school-system evidence. Behaviour policies, codes of conduct and news reports stay at 65.
jurisdictions:
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - Education (General Provisions) Act 2006 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - children
  - education
  - government
test_cases:
  should_match:
    - value: "OneSchool behaviour incident record - Harbourview State High School\nStudent name: Riley Ashworth\nEQ ID: 0612345678X\nYear level: 9\nIncident date: 16/09/2026\nIncident type: Physical aggression towards a peer\nAction taken: Short suspension (3 days); parent contacted by the deputy principal."
      description: Populated behaviour incident record with student, incident fields and school-system evidence (85)
      synthetic: true
    - value: "Student incident report\nStudent: Casey Rourke\nClass: 7B"
      description: Incident report with labelled student fields only (75)
      synthetic: true
  should_not_match:
    - value: "Traffic incident report"
      description: Non-match 1
    - value: "The school reopened after holidays"
      description: Non-match 2
    - value: "Policy guidance: this procedure explains how school incident report forms are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Student incident report\nStudent name: ____________________\nYear level: ____________________\nIncident date: ____________________\nIncident type: ____________________\nAction taken: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: the department says school disciplinary absence numbers fell this term after more schools adopted behaviour support plans and restorative practices."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: Generic incident reports in non-school contexts.
    mitigation: Require school-specific terms like OneSchool, student behaviour, or school discipline.
exports:
  - yaml
scope: narrow
risk_rating: 7
risk_description: >-
  The detector recognises school incident, behaviour incident and disciplinary absence language and enforces only when populated student identifier fields sit nearby; phrase-only text stays at 65 discovery. A completed report can identify a student, witnesses, alleged conduct, injuries, interventions, and safeguarding decisions, creating direct reputational, educational, and wellbeing harm if disclosed. General behaviour policies, incident procedures, and staff training can contain the same terms without describing an event. Risk 7 SENSITIVE Government suits a normal student-linked incident report; PROTECTED would require life-safety detail, a major protected investigation, or broad exposure capable of significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_school_incident
      matches:
        - ref: Regex_au_qld_school_incident_report_student_fields
        - ref: Regex_au_qld_school_incident_report_incident_fields
        - ref: Evidence_qld_school_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_school_incident_report_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_school_incident
      matches:
        - ref: Regex_au_qld_school_incident_report_student_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_school_incident_report_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_school_incident
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_school_incident
      pattern: (?i)\b(?:(?:school|student|behaviour(?:al)?)\s+incident\s+(?:report|notification|record)|behaviour\s+incident|(?:individual\s+)?behaviour\s+support\s+plan|school\s+disciplinary\s+absence|(?:short|long|charge-related)[\s-]+suspension|proposed\s+exclusion)\b
    - id: Regex_au_qld_school_incident_report_student_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|student(?:\s+name)?|pupil|child|candidate(?:\s+name)?|EQ\s*ID|LUI|USI|year\s+level|grade\s+level|parent(?:\s+name)?|guardian|carer|(?:student|candidate|enrolment|applicant|file)\s*(?:no\.?|number|ID)|home\s+group|class)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_au_qld_school_incident_report_incident_fields
      pattern: (?i)\b(?:incident\s+(?:date|time|type|category|location)|date\s+of\s+incident|location|behaviour(?:\s+category)?|witness(?:es)?|reported\s+by|action\s+taken|consequence|injur(?:y|ies)|SDA\s+type)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Evidence_qld_school_context
      groups:
        - match_style: word
          terms:
            - OneSchool
            - Department of Education
            - Education Queensland
            - State School
            - State High School
            - parent notified
            - parent contacted
            - Student Code of Conduct
            - duty of care
      strength: specific
    - id: Keyword_au_qld_school_incident_report_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): converted keyword_list to regex; 75 fired on the primary alone ('School incident report') and 85 evidence repeated primary phrases. 75 now needs a populated student identifier and 85 needs student fields plus a populated incident field plus school-system evidence. Dropped the policy-phrase primary 'student code of conduct'. Tests replaced with populated records plus policy, blank-form and news decoys. Regulations: removed AML/CTF Act, HRIPA, My Health Records Act, NDB and TIA Act; added Education (General Provisions) Act 2006 (Qld); references added."
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 587 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-04'
    description: Replace bare generic keyword terms with domain-anchored phrases (FP reduction)
  - version: 1.2.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 90 to 85.; Mapped non-canonical confidence 80 to 75.
