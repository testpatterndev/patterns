schema: testpattern/v1
name: Data protection impact assessments
slug: global-top500-465-data-protection-impact-assessments
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to data protection impact assessments in international contexts. This information type is classified as personally identifiable information under
  applicable data protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(data\s+protection\s+impact\s+assessments?|privacy\s+impact\s+assessment|risk\s+assessment|processing\s+risk|high\s+risk\s+processing|necessity\s+assessment|data\s+protection\s+officer|supervisory\s+authority|privacy\s+compliance|mitigating\s+measures)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - data protection impact assessments
    - data
    - protection
    - impact
    - assessments
    - privacy
    - compliance
    - risk
  proximity: 300
test_cases:
  should_match:
    - value: data protection impact assessment
      description: Primary topic phrase match
    - value: privacy impact assessment
      description: Case-insensitive topic phrase match
    - value: risk assessment
      description: Alternative topic phrase match
    - value: processing risk
      description: Additional topic phrase match
    - value: |-
        Data protection impact assessment
        To: Executive Committee
        From: Chief Risk Officer
      description: Populated document header with 2 fields (75 tier)
      synthetic: true
    - value: |-
        Data protection impact assessment
        To: Executive Committee
        From: Chief Risk Officer
        Date: 14 August 2026
      description: Populated document header with 3 distinct fields (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: data inventory compliance
      description: Generic word pair from old broad template should not match
    - value: Data protection impact assessments
      description: "Bare detector name (regression guard): the IdMatch does not match it alone, but the generated name-word tier lifted it to 75 next to any IdMatch phrase; it must not reach an enforcing tier"
    - value: |-
        Data protection impact assessment:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about data protection impact assessment are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to data protection impact assessments appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: >-
      In English (as the primary international business language), similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute
      sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_dpia
      matches:
        - ref: Regex_global_top500_465_data_protection_impact_assessments_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_dpia
      matches:
        - ref: Regex_global_top500_465_data_protection_impact_assessments_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_dpia
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_dpia
      pattern: >-
        (?is)\b(data\s+protection\s+impact\s+assessments?|privacy\s+impact\s+assessment|risk\s+assessment|processing\s+risk|high\s+risk\s+processing|necessity\s+assessment|data\s+protection\s+officer|supervisory\s+authority|privacy\s+compliance|mitigating\s+measures)\b
    - id: Regex_global_top500_465_data_protection_impact_assessments_record_structure
      pattern: (?i)\b((?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item|project\s+(?:name|ID)|system\s+owner|processing\s+activity|DPO)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$])
risk_description: >-
  The concept regex covers privacy or data-protection impact assessments, high-risk processing, necessity analysis, mitigation measures, and related governance terms; it does not require a completed assessment. A genuine DPIA can expose data flows, affected groups, unresolved privacy risks, suppliers, and planned safeguards, giving an attacker or litigant a map of weak points before controls are implemented. Harm is usually serious but contained to one project, service, and its data subjects, while templates and general privacy guidance are frequent semantic matches. Risk 8 and SENSITIVE are proportionate; PROTECTED would require current exploitable gaps involving highly sensitive or national-scale processing with a credible prospect of significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to SENSITIVE because a completed DPIA can reveal sensitive processing design, unresolved weaknesses, and
    affected populations with credible project-level harm. PROTECTED is not met without high-consequence live
    processing, exploitable control gaps, and a likely path to significant or broad damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium and Personal-Privacy handling fit a substantive privacy assessment containing project risks, data
      flows, affected groups, and mitigation decisions.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.4.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.3.0
    date: '2026-10-20'
    description: 'Generated name-word tier removed: the 75 tier ANDed Pattern_*_label_context (the detector name, "Data protection impact assessments") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 75. The IdMatch does not match the bare name, so it scored 0 alone, but the name as a heading lifted any IdMatch phrase near it. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs 2 populated document header fields (Regex_global_top500_465_data_protection_impact_assessments_record_structure); 85 needs 3 distinct fields. Curated terms that sit inside an IdMatch hit were removed. DPIA is the acronym of the IdMatch phrase and "proportionality" is a DPIA template heading; both are dropped. The detector name is the identifying phrase but lived only in the generated label regex, so the IdMatch now accepts the plural "data protection impact assessments" (65 discovery; enforcing still needs a populated field). Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
  - version: 1.2.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.2.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 2005 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
