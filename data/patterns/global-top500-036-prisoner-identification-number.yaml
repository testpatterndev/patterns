schema: testpattern/v1
name: Prisoner identification number
slug: global-top500-036-prisoner-identification-number
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to prisoner identification number in international contexts. This
  information type is classified as personally identifiable information under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 1 keywords within 240 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:prisoner\s+identification\s+number|prisoner\s+ID|inmate\s+number|inmate\s+identification|prisoner\s+number|correctional\s+ID|custodial\s+number|detention\s+number|offender\s+ID|incarceration\s+number|prison\s+record|booking\s+number)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
- GDPR
- AML/CTF Act (Cth)
- IPA 2009 (Qld)
- NDB Scheme (Cth)
- Privacy Act 1988 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
  - prisoner identification number
  proximity: 240
test_cases:
  should_match:
  - value: prisoner identification number
    description: Primary topic phrase match
  - value: prisoner id
    description: Case-insensitive topic phrase match
  - value: inmate number
    description: Alternative topic phrase match
  - value: inmate identification
    description: Additional topic phrase match
  - value: "prisoner identification number\nName: Avery Teston\nDate of birth: 04/02/1991\nReference number: RX22914471\nNotes: prisoner identification number recorded against the subject; handling restricted."
    description: Populated justice record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: "Policy guidance: this procedure explains how records about prisoner identification number are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Common words and phrases related to prisoner identification number appearing in policy documents, training
    materials, HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 240
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_prisoner_identification_number
      matches:
        - ref: Regex_global_top500_036_prisoner_identification_number_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
      min_count: 2
    - confidence_level: 75
      id_match: Regex_prisoner_identification_number
      matches:
        - ref: Regex_global_top500_036_prisoner_identification_number_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_prisoner_identification_number
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_prisoner_identification_number
      pattern: (?is)\b(?:prisoner\s+identification\s+number|prisoner\s+ID|inmate\s+number|inmate\s+identification|prisoner\s+number|correctional\s+ID|custodial\s+number|detention\s+number|offender\s+ID|incarceration\s+number|prison\s+record|booking\s+number)\b
    - id: Regex_global_top500_036_prisoner_identification_number_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|defendant|accused|offender|prisoner|inmate|detainee|respondent|applicant|witness|informant|suspect|subject\s+(?:name|person)|person\s+of\s+interest|POI|victim|complainant|officer|CNI|QPRIME|(?:file|case|matter|court|reference|ref|exhibit|brief|job|incident|report|investigation|occurrence)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
risk_description: The Prisoner identification number pattern finds phrases such as prisoner ID, inmate number, correctional
  ID, booking number, or prison record. It does not parse an issued identifier, name a detained person, or reveal offence,
  sentence, facility, health, or release information, and generic corrections documentation can trigger it. A populated identifier
  linked to a person could expose incarceration and facilitate harmful correlation, but that person-level fact is not established
  by the concept match. Risk 5 and OFFICIAL retain a cautious custody-context cue, with an identified prisoner record setting
  the SENSITIVE threshold.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
