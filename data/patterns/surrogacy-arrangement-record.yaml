schema: testpattern/v1
name: Surrogacy Arrangement Record
slug: surrogacy-arrangement-record
version: 1.5.2
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects surrogacy arrangement records including parentage orders, surrogacy agreements, birth mother medical records, and intended parent assessments under the Surrogacy Act 2010 (Qld). These records contain deeply personal information about reproductive choices, medical procedures, and legal parentage transfers — disclosure can cause severe emotional distress and breach court-sealed parentage orders.
operation: >-
  Primary: surrogacy phrases (surrogacy arrangement/agreement, parentage order, gestational carrier/surrogacy, birth mother consent/identity, intended parents assessment, surrogacy counselling report). 65 = phrase only (discovery). 75 = phrase plus a populated party field (birth mother, intended parents, surrogate, child, counsellor, name, date of birth, file number) or a labelled file reference. 85 = phrase plus two distinct populated fields plus independent evidence (Surrogacy Act 2010, counselling certificate, independent legal advice, embryo transfer, IVF ...). Law reform, fact sheet, marketing and research framing excluded.
pattern: (?i)\b(surrogacy\s+(?:arrangement|agreement)|parentage\s+order|gestational\s+(?:carrier|surrogacy)|birth\s+mother\s+(?:consent|medical|identity)|intended\s+parent[s]?\s+(?:assessment|application)|surrogacy\s+(?:counselling|guidance)\s+(?:report|certificate))\b
confidence: medium
confidence_justification: >-
  Medium confidence: enforcement requires populated party fields; court and agency file numbers are unpublished, so the reference is a documented label-anchored fallback.
jurisdictions:
  - au
regulations:
  - Information Privacy Act 2009 (Qld)
  - Status of Children Act 1978 (Qld)
  - Surrogacy Act 2010 (Qld)
frameworks:
  - QGISCF
data_categories:
  - health
  - government
corroborative_evidence:
  keywords:
    - PROTECTED
    - Privacy
    - surrogacy arrangement
    - parentage order
    - birth mother
    - intended parents
    - gestational carrier
    - surrogacy agreement
    - Surrogacy Act 2010
    - counselling certificate
    - medical practitioner
    - independent legal advice
    - birth certificate
    - District Court
    - IVF
    - embryo transfer
    - surrogacy counsellor
    - consent
  proximity: 300
  keyword_lists:

    - healthcare-clinical

    - government-services
    - en-government-classification
customisation:
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_surrogacy_arrangement_record_case_reference
    mode: replace
    affects_tiers: [75]
    required_for_enforcement: false
    note: Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#case-reference-number). Earlier versions used the SUR-YYYY-NNNNN format, which does not appear in any published source.
test_cases:
  should_match:
    - value: 'PROTECTED Privacy. Surrogacy Arrangement Record — Surrogacy Act 2010 (Qld) Part 3. Birth mother: Michelle Anne TAYLOR, DOB 14/06/1990. Intended parents: Daniel and Sophie HARTLEY. Surrogacy agreement executed 12/09/2025 with independent legal advice confirmed for all parties. Surrogacy counselling report (s.22) completed by registered psychologist Dr Emma Liu. Gestational surrogacy — embryo transfer conducted at Queensland Fertility Group on 03/11/2025. Medical practitioner confirmation: Dr James Park. Parentage order to be applied for within 28 days of birth.'
      description: Surrogacy arrangement record with party identifiers and legal compliance details (reaches 85)
    - value: 'District Court of Queensland — Parentage Order Application. File No: 2026/00189. Application under s.39 Surrogacy Act 2010 for transfer of parentage. Birth mother: Kelly Susan MORRISON. Child: male infant, DOB 22/02/2026, born at Mater Mothers Hospital Brisbane. Intended parents: Andrew and Yuki WATANABE. Surrogacy counselling certificates attached for all parties. Birth mother consent to parentage order confirmed. Medical records confirm gestational surrogacy with no genetic relationship between birth mother and child.'
      description: Parentage order application with birth details and medical confirmation (reaches 85)
    - value: 'Confidential — Surrogacy Guidance Report. Prepared for: intended parents Marcus and Lauren BROWN. Surrogacy counsellor: Dr Patricia Feng, MAPS. This report is prepared under s.22 of the Surrogacy Act 2010 (Qld). Assessment confirms that both intended parents understand the legal, medical, and emotional implications of the surrogacy arrangement. The proposed birth mother, Angela SMITH, has undergone independent counselling. Independent legal advice certificates obtained from separate law firms. IVF treatment plan to commence following all statutory requirements being met.'
      description: Surrogacy counselling guidance report with intended parent and birth mother details (reaches 75)
    - value: "Surrogacy arrangement — parentage order application\nBirth mother: Avery Teston\nIntended parents: Jordan and Riley Staffson\nFile number: 2026/00412\nCounselling certificate and independent legal advice obtained for all parties; embryo transfer completed."
      description: 'Populated surrogacy record: birth mother, intended parents and file number plus counselling / legal-advice evidence (reaches 85)'
      synthetic: true
  should_not_match:
    - value: The Queensland Law Reform Commission published a report on the effectiveness of the Surrogacy Act 2010. The report recommends legislative amendments to improve access to altruistic surrogacy and strengthen protections for all parties.
      description: Published law reform report on surrogacy legislation
    - value: The Australian Government Department of Health published a fact sheet explaining the difference between altruistic and commercial surrogacy. The fact sheet outlines the legal frameworks across Australian states and territories.
      description: Government fact sheet on surrogacy law with no personal details
    - value: A Melbourne fertility clinic advertised its surrogacy support program on its website, highlighting success rates and patient testimonials. All testimonials were published with informed consent and used first names only.
      description: Fertility clinic marketing with consented testimonials
    - value: "Policy guidance: this procedure explains how records about Surrogacy Arrangement are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: "Parentage order application\nBirth mother: __________\nIntended parents: __________\nFile number: __________"
      description: Blank form / template with unfilled fields (must stay below 75)
    - value: "News: the law reform commission recommended changes to how a parentage order is made after an altruistic surrogacy arrangement."
      description: News or training text naming the topic (must stay below 75)
false_positives:
  - description: Published law reform reports and policy discussions about surrogacy legislation
    mitigation: 'Negative keyword exclusion: ''law reform'', ''legislative amendment'', ''policy discussion'', ''public submission'', ''parliamentary inquiry''. Require proximity to actual party identifiers or case references.'
  - description: Government fact sheets and public information about surrogacy legal frameworks
    mitigation: 'Negative keyword exclusion: ''fact sheet'', ''public information'', ''frequently asked questions'', ''eligibility criteria'''
  - description: Fertility clinic marketing and general surrogacy program information
    mitigation: 'Negative keyword exclusion: ''advertisement'', ''marketing'', ''success rates'', ''testimonial'', ''published with consent'''
  - description: Academic research on surrogacy outcomes using de-identified data
    mitigation: 'Negative keyword exclusion: ''research'', ''study'', ''de-identified'', ''anonymised'', ''participants'', ''journal'''
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_surrogacy_arrangement_record_surrogacy_arrangement_terms
      matches:
        - ref: Regex_surrogacy_arrangement_record_record_structure
          min_count: 2
          unique_results: true
        - ref: Evidence_surrogacy_arrangement_record_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_surrogacy_arrangement_record_exclusion
    - confidence_level: 75
      id_match: Pattern_surrogacy_arrangement_record_surrogacy_arrangement_terms
      matches:
        - type: any
          refs:
            - Regex_surrogacy_arrangement_record_record_structure
            - Regex_surrogacy_arrangement_record_case_reference
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_surrogacy_arrangement_record_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_surrogacy_arrangement_record_surrogacy_arrangement_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_surrogacy_arrangement_record_exclusion
  regexes:
    - id: Pattern_surrogacy_arrangement_record_surrogacy_arrangement_terms
      pattern: (?i)\b(surrogacy\s+(?:arrangement|agreement)|parentage\s+order|gestational\s+(?:carrier|surrogacy)|birth\s+mother|intended\s+parents?|surrogacy\s+counselling|surrogacy\s+guidance)\b
    - id: Regex_surrogacy_arrangement_record_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|birth\s+mother|intended\s+parents?|surrogate|child|counsellor|medical\s+practitioner|(?:case|file|court|matter)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_surrogacy_arrangement_record_case_reference
      pattern: >-
        (?i)\b(?:case|file|matter|reference)\s+(?:no\.?|number|ID|#)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{3,20}\b
  keywords:
    - id: Evidence_surrogacy_arrangement_record_corroborative_terms
      groups:
        - match_style: word
          terms:
            - Surrogacy Act 2010
            - counselling certificate
            - medical practitioner
            - independent legal advice
            - birth certificate
            - District Court
            - text: IVF
              case_sensitive: true
            - embryo transfer
            - Queensland Fertility Group
            - registered psychologist
            - altruistic surrogacy
      strength: specific
    - id: Filter_surrogacy_arrangement_record_exclusion
      groups:
        - match_style: word
          terms:
            - law reform
            - legislative amendment
            - policy discussion
            - public submission
            - parliamentary inquiry
            - fact sheet
            - public information
            - frequently asked questions
            - advertisement
            - marketing
            - success rates
            - testimonial
            - published with consent
            - research
            - study
            - de-identified
            - anonymised

      strength: noise
risk_rating: 8
risk_description: >-
  This proximity detector identifies a surrogacy case record by locating parentage orders, agreements, birth-mother or gestational-carrier terms near intended-parent, counselling, medical-practitioner, privacy, or statutory context. Release could expose reproductive choices, pregnancy and medical details, counselling, and the legal transfer of parentage to children, carriers, intended parents, or outsiders before the family chooses disclosure. The harm is serious emotional distress and disruption to a small family group, while negative exclusions reduce public law-reform, policy, and marketing hits. Risk 8 and SENSITIVE are justified; PROTECTED would require sealed records at scale, a specific safety threat, or consequences amounting to significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, Personal-Privacy DLM, and Medium because one true
    record links medical, reproductive, counselling, and parentage information. PROTECTED is not reached without a
    serious safety factor, bulk sealed holdings, or significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy suit a person-linked surrogacy and parentage record with serious but normally
      contained family impact. High protection requires exceptional aggregation or safety circumstances.
references:
  - title: Surrogacy Act 2010 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2010-002
created: '2026-03-06'
updated: '2026-09-25'
changelog:
  - version: 1.5.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): rebuilt tiers - 75 needs a populated surrogacy record field or a labelled file reference, 85 needs two distinct record fields plus independent evidence (Surrogacy Act, counselling certificate, independent legal advice ...); removed the invented SUR-YYYY-NNNNN regex in favour of the case-reference-number labelled fallback (identifier-format slot); dropped the generic 'Privacy' marker and the generic 'consent' evidence term; tests converted with an 85 positive and blank-form/news decoys; references added."
  - version: 1.4.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires either independent health record structure (Regex ..._record_structure) or one of the hand-authored corroborative terms (none of which the primary matches); 85 requires 2 distinct structure hits plus the existing hand-authored evidence. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1496 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
