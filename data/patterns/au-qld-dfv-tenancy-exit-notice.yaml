schema: testpattern/v1
name: Queensland DFV Tenancy Exit Notice (RTA Form 20 / 4a)
slug: au-qld-dfv-tenancy-exit-notice
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Notices ending a tenancy interest because of domestic and family violence (RTA Form 20, R20 for rooming accommodation), bond refunds for people experiencing DFV (Form 4a) and the supporting Domestic and Family Violence Report, identifying the tenant, the rental premises and the evidence of violence.
operation: >-
  Primary: Queensland DFV Tenancy Exit Notice (RTA Form 20 / 4a) anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:notice\s+ending\s+tenancy\s+interest\s*\(?\s*domestic\s+and\s+family\s+violence\)?|notice\s+ending\s+residency\s+interest|bond\s+refund\s+for\s+persons?\s+experiencing\s+domestic\s+and\s+family\s+violence|Domestic\s+and\s+Family\s+Violence\s+Report)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Residential Tenancies and Rooming Accommodation Act 2008 (Qld)
  - DFV Protection Act 2012 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government
corroborative_evidence:
  keywords:
    - Residential Tenancies Authority
    - RTA
    - Form 20
    - Form 4a
    - domestic and family violence
    - protection order
    - temporary protection order
    - lessor
  proximity: 300
customisation:
  - key: housing-tenancy-number
    kind: identifier-format
    identifier: housing-tenancy-number
    target: purview.regexes/Regex_au_qld_dfv_tenancy_exit_notice_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Queensland social housing tenancy / property reference format (see docs/identifiers.md#housing-tenancy-number). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Notice ending tenancy interest (domestic and family violence) — Form 20\nTenant: Avery Teston\nAddress of the rental premises: Unit 3/27 Carrington Avenue, Toowong QLD 4066\nLessor / property manager: Harbour Property Group\nEvidence attached: temporary protection order."
      description: Populated record 1
      synthetic: true
    - value: "Bond refund for persons experiencing domestic and family violence (Form 4a)\nBond number: 20417733\nTenant: Morgan Teston\nThe tenant has left the premises; refund the tenant's share of the bond to BSB 064-000 account 12345678."
      description: Populated record 2
      synthetic: true
    - value: "Domestic and Family Violence Report\nTenant: Jamie Teston\nCompleted by: Riley Staffson, specialist DFV worker, DVConnect\nI confirm the tenant is experiencing domestic and family violence and cannot safely remain at the premises."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: If you are experiencing domestic and family violence, you can end your tenancy interest with 7 days notice using Form 20. You need evidence such as a protection order or a Domestic and Family Violence Report.
      description: Guidance or explainer text
    - value: "Form 20 Notice ending tenancy interest (domestic and family violence)\nTenant: __________\nAddress of the rental premises: __________"
      description: Blank form
    - value: The RTA received 2,150 notices ending a tenancy interest because of domestic and family violence in 2024-25.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_dfv_tenancy_exit_notice_primary
      matches:
        - ref: Regex_au_qld_dfv_tenancy_exit_notice_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_dfv_tenancy_exit_notice_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_dfv_tenancy_exit_notice_primary
      matches:
        - ref: Regex_au_qld_dfv_tenancy_exit_notice_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_dfv_tenancy_exit_notice_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_dfv_tenancy_exit_notice_primary
      pattern: >-
        (?i)\b(?:notice\s+ending\s+tenancy\s+interest\s*\(?\s*domestic\s+and\s+family\s+violence\)?|notice\s+ending\s+residency\s+interest|bond\s+refund\s+for\s+persons?\s+experiencing\s+domestic\s+and\s+family\s+violence|Domestic\s+and\s+Family\s+Violence\s+Report)\b
    - id: Regex_au_qld_dfv_tenancy_exit_notice_record_structure
      pattern: >-
        (?i)\b(?:applicant|tenant|household\s+member|co-tenant|lessor|property\s+manager|premises|property\s+address|address\s+of\s+(?:the\s+)?(?:rental\s+)?premises|rental\s+premises|application\s+(?:no\.?|number)|tenancy\s+(?:no\.?|number|ID)|client\s+(?:no\.?|number|ID)|bond\s+(?:no\.?|number)|CRN|Housing\s+Service\s+Centre|SLK|client|name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_dfv_tenancy_exit_notice_corroborative
      groups:
        - match_style: word
          terms:
            - Residential Tenancies Authority
            - text: RTA
              case_sensitive: true
            - Form 20
            - Form 4a
            - domestic and family violence
            - protection order
            - temporary protection order
            - lessor
            - co-tenant
            - bond
            - seven days
            - 7 days
            - rental premises
            - text: DFV
              case_sensitive: true
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a queensland dfv tenancy exit notice (rta form 20 / 4a) about an identified person, gated on populated record fields. Notices ending a tenancy interest because of domestic and family violence (RTA Form 20, R20 for rooming accommodation), bond refunds for people experiencing DFV (Form 4a) and the supporting Domestic and Family Violence Report, identifying the tenant, the rental premises and the evidence of violence. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: 'RTA — Domestic violence in a rental property: how to leave'
    url: https://www.rta.qld.gov.au/domestic-violence-in-a-rental-property/how-to-leave
  - title: RTA — Forms for general tenancies
    url: https://www.rta.qld.gov.au/forms-resources/forms/forms-for-general-tenancies
created: '2026-09-24'
updated: '2026-09-24'
