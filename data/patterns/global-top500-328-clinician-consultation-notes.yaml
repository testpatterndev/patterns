schema: testpattern/v1
name: Clinician consultation notes
slug: global-top500-328-clinician-consultation-notes
version: 1.3.2
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies clinician consultation notes references in healthcare and patient records. Protected health information
  under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 7 keywords within 300 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:consultation\s+notes|clinician\s+notes|clinical\s+notes|progress\s+notes|SOAP\s+notes|attending\s+physician|chief\s+complaint|assessment\s+and\s+plan|patient\s+encounter)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
  - GDPR
  - Information Privacy Act 2009 (Qld)
  - My Health Records Act 2012 (Cth)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
- healthcare
- phi
corroborative_evidence:
  keywords:
  - clinician consultation notes
  - clinician
  - consultation
  - notes
  - health
  - biomedical
  - information
  proximity: 300
  keyword_lists:
  - healthcare-clinical
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
  - value: consultation notes
    description: Primary topic phrase match
  - value: clinician notes
    description: Case-insensitive topic phrase match
  - value: clinical notes
    description: Alternative topic phrase match
  - value: progress notes
    description: Additional topic phrase match
  - value: "consultation notes\nPatient name: Avery Teston\nURN: 004418273\nDate of birth: 04/02/1991\nClinician: Dr Jordan Staffson\nNotes: consultation notes reviewed at appointment on 12/08/2026."
    description: Populated health record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: patient biometric
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about consultation notes are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Medical terminology in health education materials, research publications, clinical guidelines, or public health
    documents without patient-specific data.
  mitigation: Require corroborative evidence keywords confirming patient context. Look for co-occurrence with patient identifiers
    such as medical record numbers or dates of birth.
- description: General wellness and fitness content using medical vocabulary without constituting protected health information.
  mitigation: Layer with patient identifier patterns or healthcare-specific document structure detection to distinguish clinical
    records from general health content.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: The detector finds consultation-note, clinician-note, or clinical-note phrases with seven nearby healthcare
  indicators and template exclusions, representing free-text documentation of a patient encounter. Consultation notes commonly
  combine symptoms, examination, differential diagnosis, clinician judgement, family or social history, and follow-up in one
  narrative, so disclosure can reveal more than a coded result. The affected patient could face stigma, discrimination, relationship
  harm, or compromised continuity of care, although educational examples and generic documentation guidance can match. Risk
  8 and SENSITIVE reflect that dense personal context; PROTECTED requires acute safety content, a protected person, bulk notes,
  or significant clinical-service damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_clinician_consultation_notes
      matches:
        - ref: Regex_global_top500_328_clinician_consultation_notes_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_clinician_consultation_notes
      matches:
        - ref: Regex_global_top500_328_clinician_consultation_notes_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_clinician_consultation_notes
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_clinician_consultation_notes
      pattern: (?is)\b(?:consultation\s+notes|clinician\s+notes|clinical\s+notes|progress\s+notes|SOAP\s+notes|attending\s+physician|chief\s+complaint|assessment\s+and\s+plan|patient\s+encounter)\b
    - id: Regex_global_top500_328_clinician_consultation_notes_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|patient|client|participant|donor|recipient|clinician|URN|UR\s+number|MRN|medical\s+record\s+number|Medicare(?:\s+number)?|IHI|referring\s+(?:doctor|practitioner)|(?:specimen|accession|lab|laboratory|study|participant|patient|client|trial|case|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
frameworks:
  - ISO 27001
  - ISO 27701
