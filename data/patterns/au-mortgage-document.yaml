schema: testpattern/v1
name: Australian Mortgage Document
slug: au-mortgage-document
version: 1.5.1
type: keyword_proximity
pattern_class: concept
description: >-
  Detects populated Australian mortgage documents (mortgage deeds, home loan contracts, registered mortgages, discharges): the mortgage phrase combined with named mortgagor/mortgagee fields, a security property or title reference, or a secured loan amount. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: keyword_proximity evaluated through purview tiers. Primary: mortgage deed/agreement/contract/document/instrument, home loan agreement/contract, secured loan agreement/deed, residential/registered mortgage, discharge of mortgage, memorandum of common provisions. 65 (discovery only): primary alone. 75: primary plus one populated field - named mortgagor/mortgagee/borrower/lender, security property/property address/title reference/lot on plan with a numbered value, or loan amount/principal/secured amount with a dollar value. 85: primary plus two distinct field types (the three above or a dealing/registration/loan account number) plus mortgage-term evidence (LVR, LMI, offset account, redraw, break costs, power of sale, event of default, discharge authority, Land Title Act). Template/sample and guidance/marketing framing excluded on every enforce tier.
confidence: medium
confidence_justification: >-
  Enforce tiers require populated party, property or amount fields beside the mortgage phrase; rate comparison pages, seminars and consumer fact sheets carry the same vocabulary without values and stay at 65. Medium because broker correspondence can carry the same fields.
jurisdictions:
  - au
regulations:
  - National Consumer Credit Protection Act 2009 (Cth)
  - Land Title Act 1994 (Qld)
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
  - legal
  - pii
test_cases:
  should_match:
    - value: "RESIDENTIAL MORTGAGE\nMortgagor: Avery Teston and Jordan Teston\nMortgagee: Southern Cross Mutual Bank Ltd\nSecurity property: 14 Wattlebird Street, Stafford QLD 4053\nTitle reference: 50412398\nLoan amount: $640,000.00\nLVR 80%. Lenders mortgage insurance not required; the offset account is linked to the loan."
      description: Populated mortgage - parties, property, title and amount with LVR/LMI terms (85)
      synthetic: true
    - value: "Mortgage deed\nBorrower: Casey Rourke\nProperty address: 7/22 Ocean Parade, Burleigh Heads QLD 4220\nPower of sale applies on an event of default."
      description: Mortgage deed with borrower and property plus default terms (85)
      synthetic: true
    - value: "Discharge of mortgage\nMortgagee: Southern Cross Mutual Bank Ltd\nPlease lodge the discharge at the titles office."
      description: Discharge with one populated party field (75)
      synthetic: true
  should_not_match:
    - value: "Fact sheet: a registered mortgage gives the lender security over your property. Check the loan to value ratio, whether LMI applies and how the offset account works before signing the mortgage document."
      description: Consumer fact sheet naming mortgage terms without values
      synthetic: true
    - value: "RESIDENTIAL MORTGAGE\nMortgagor: __________\nMortgagee: __________\nSecurity property: __________\nLoan amount: $__________"
      description: Blank mortgage form - placeholder values
      synthetic: true
    - value: "Residential mortgage arrears rose to 1.4% in the June quarter, with lenders reporting 12,000 more borrowers behind on repayments on loans above $600,000."
      description: News article with aggregate figures
      synthetic: true
    - value: "Mortgage rates comparison website"
      description: Comparison site wording
      synthetic: true
    - value: "He mortgaged his future for the project"
      description: Figurative use
      synthetic: true
    - value: "Residential mortgage seminar agenda"
      description: Seminar wording - discovery only at most
      synthetic: true
false_positives:
  - description: Rate comparison sites, broker marketing and consumer fact sheets using mortgage terminology.
    mitigation: No populated party, property or amount field, and marketing/guidance framing is excluded, so they stay at 65.
  - description: Property listings quoting an address near the word mortgage.
    mitigation: An address alone reaches 75 only when labelled as a security/mortgaged property or title reference beside a mortgage instrument phrase.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  This classifier identifies mortgage deeds and related records through mortgagor, mortgagee, property security, title, LVR, discharge, and consent terms. Disclosure can reveal a borrower's address, secured property, debt position, equity, lender relationship, and settlement details that support fraud, coercion, or targeted impersonation. The borrower, household, lender, and property stakeholders may face serious financial, legal, and privacy harm within one mortgage, while title changes and fund movements still require formal verification. Risk 8 and SENSITIVE Legal fit that composite security record, while a bulk mortgage portfolio or privileged land and lending-system access would be needed for PROTECTED. Quality pass 2026-09-24: enforce tiers (75/85) now require populated record structure (labelled fields with real values, identifiers or data rows); phrase-only mentions in guidance, marketing, blank forms and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_mortgage
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_au_mortgage_document_party
            - Regex_au_mortgage_document_property
            - Regex_au_mortgage_document_amount
            - Regex_au_mortgage_document_dealing
        - ref: Keyword_au_mortgage_document_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_mortgage_document_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_mortgage
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_mortgage_document_party
            - Regex_au_mortgage_document_property
            - Regex_au_mortgage_document_amount
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_mortgage_document_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_mortgage
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_mortgage
      pattern: (?i)\b(?:mortgage\s+(?:deed|agreement|contract|document|instrument)|home\s+loan\s+(?:agreement|contract)|secured\s+loan\s+(?:agreement|deed)|residential\s+mortgage|registered\s+mortgage|discharge\s+of\s+mortgage|memorandum\s+of\s+common\s+provisions)\b
    - id: Regex_au_mortgage_document_party
      pattern: (?i)\b(?:mortgagors?|mortgagees?|borrowers?|lenders?|chargors?|chargees?|guarantors?)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?:(?:Mr|Mrs|Ms|Mx|Dr|Prof)\.?[ \t]{1,3})?[A-Z][A-Za-z'.-]{1,30}(?:[ \t]{1,3}[A-Z&][A-Za-z'.&-]{0,30}){0,5}
    - id: Regex_au_mortgage_document_property
      pattern: (?i)\b(?:(?:mortgaged|security|secured)\s+property|property(?:\s+address)?|land|title\s+reference|lot\s+(?:and|on)\s+plan|certificate\s+of\s+title|volume\s*/\s*folio)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[^\n]{0,20}\d)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
    - id: Regex_au_mortgage_document_amount
      pattern: (?i)\b(?:loan\s+amount|principal(?:\s+(?:amount|sum))?|secured\s+amount|facility\s+limit|credit\s+limit|amount\s+secured)[ \t]{0,3}[:#][ \t]{0,3}(?:AUD|USD|NZD|GBP|EUR|A\$|US\$|NZ\$|\$|£|€)[ \t]?(?:\d{1,3}(?:,\d{3}){1,4}|\d{1,12})(?:\.\d{2})?(?![\d,]\d)(?!\.\d)(?![ \t]{0,3}(?:-|–|to)[ \t]{0,3}(?:A?\$|\d))
    - id: Regex_au_mortgage_document_dealing
      pattern: (?i)\b(?:(?:mortgage\s+)?dealing\s*(?:no\.?|number)|registration\s*(?:no\.?|number)|instrument\s*(?:no\.?|number)|loan\s*(?:account\s*)?(?:no\.?|number))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Z/.-]{0,12}\d)[A-Z0-9][A-Z0-9/.-]{0,24}
  keywords:
    - id: Keyword_au_mortgage_document_terms
      groups:
        - match_style: word
          terms:
            - loan to value
            - text: LVR
              case_sensitive: true
            - text: LMI
              case_sensitive: true
            - lenders mortgage insurance
            - offset account
            - redraw
            - fixed rate period
            - variable rate
            - break costs
            - power of sale
            - event of default
            - discharge authority
            - Land Title Act
      strength: domain
    - id: Keyword_au_mortgage_document_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - mortgage calculator
            - compare home loans
            - borrowing power
            - first home buyer guide
            - seminar
            - rates comparison
      strength: noise
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were phrase-only keyword tiers (and the 85 evidence repeated the primary 'registered mortgage'); 75 now needs a populated mortgagor/mortgagee, security property/title or secured amount field and 85 needs two distinct field types plus mortgage-term evidence; removed the self-corroborating term; replaced the bare-phrase positive with populated deeds; added fact-sheet, blank-form and news decoys; dropped SOCI Act, added NCCP Act 2009 (Cth) and Land Title Act 1994 (Qld) with verified references.
  - version: 1.4.2
    date: '2026-07-19'
    description: 'Targeted finance/health blocker remediation: align the evidence-gated detector to keyword_proximity, keep mortgage-instrument phrases at 65 discovery, require mortgage-party/term evidence at 75 and additional title/security evidence at 85, broaden registered/discharge coverage, and add exact-tier plus seminar probes.'
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 559 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.2.0
    date: '2026-07-04'
    description: Replace bare generic keyword terms with domain-anchored phrases (FP reduction)
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
