schema: testpattern/v1
name: Water Quality Data Reference
slug: au-water-quality-data-reference
version: 1.4.0
type: regex
engine: boost_regex
pattern_class: concept
description: >-
  Identifies drinking-water and effluent quality monitoring records: laboratory or field results with measured parameters and units, and sample/site records. Water quality wording alone is discovery-only.
operation: >-
  Pattern_water_quality_phrase (water quality/testing/sample/treatment/monitoring, ADWG, turbidity, E. coli/coliform results, effluent quality, catchment data) is discovery-only at 65. 75 requires a measured parameter with a value and unit (e.g. turbidity 0.4 NTU, free chlorine 0.9 mg/L, E. coli <1 MPN/100mL) or a labelled sample/site/lab record field. 85 requires both structures plus exceedance, guideline-value, boil-water, DWQMP, scheme or reservoir context. Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: (?i)\b(?:water\s+(?:quality|testing|sample|treatment|monitoring|compliance)|ADWG|Australian\s+Drinking\s+Water\s+Guidelines|turbidity|(?:E\.\s{0,2}coli|coliform)\s+(?:test|level|result|count)|effluent\s+quality|catchment\s+data)\b
confidence: medium
confidence_justification: >-
  Medium confidence: topic wording is discovery-only; enforcement requires numeric results with units or sample record fields, and 85 needs both plus compliance context.
jurisdictions:
  - au
regulations:
  - Water Supply (Safety and Reliability) Act 2008 (Qld)
frameworks:
  - ISO 27001
data_categories:
  - environmental
  - infrastructure
test_cases:
  should_match:
    - value: |-
        Drinking water quality monitoring results - Mount Carrow water supply scheme
        Sample ID: MC-RES-0412   Sampling point: Reservoir outlet R2   Date sampled: 14/09/2026
        Turbidity: 0.4 NTU   Free chlorine: 0.9 mg/L   E. coli: <1 MPN/100mL
        Manganese: 0.12 mg/L - exceedance of the aesthetic guideline value, reported under the DWQMP.
      description: High tier (85) - sample record fields, measured parameters with units and exceedance/scheme context
      synthetic: true
    - value: 'Water quality results for Lakeside intake: turbidity 1.8 NTU, fluoride 0.8 mg/L.'
      description: Medium tier (75) - measured values with units only
      synthetic: true
    - value: 'Water sample register - Site code: WTP-07, collected by field officer on the Tuesday run.'
      description: Medium tier (75) - labelled sample record without results
      synthetic: true
    - value: Please send the water quality summary to the operations team before Friday.
      description: Discovery tier (65) - topic phrase only
      synthetic: true
  should_not_match:
    - value: No water quality phrase matched by the Purview regex
      description: Unrelated text
    - value: No water quality phrase present
      description: Unrelated text
    - value: 'Guidance note: the Australian Drinking Water Guidelines say turbidity should be kept low; organisations should test chlorine residual daily.'
      description: Guidance naming parameters without results must stay below 75
    - value: |-
        Water quality sampling template
        Sample ID: ______  Sampling point: ______
        Turbidity (NTU): ____  Free chlorine (mg/L): ____
      description: Blank template
    - value: "Media release: the council says water quality is safe after last week's storms and the boil water notice has been lifted."
      description: News framing
false_positives:
  - description: Public drinking water guidelines, council water quality web pages and news cite parameters and thresholds.
    mitigation: Topic wording is discovery-only; enforcement needs measured values with units or sample record fields, and guidance, template and news framing are excluded.
exports:
  - yaml
scope: narrow
risk_rating: 5
risk_description: >-
  The keyword pattern identifies water-quality reports, testing results, turbidity, E. coli thresholds, catchment data, and monitoring-compliance references rather than a control-system configuration. Disclosure may reveal local sampling outcomes or a developing issue and could create reputational or operational pressure, but routine regulatory water-quality data is often published and usually needs location, timing, and incident context for material misuse. The normal unit is one report or reference with bounded public-administration consequences. Risk 5 OFFICIAL is appropriate; SENSITIVE is not met without an unreleased contamination event, exploitable supply vulnerability, precise critical-asset detail, or credible public-safety impact.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_water_quality_phrase
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_water_measurement
            - Evidence_sample_record
        - ref: Keyword_water_compliance_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_water_quality_phrase
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_water_measurement
            - Evidence_sample_record
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_water_quality_phrase
  regexes:
    - id: Pattern_water_quality_phrase
      pattern: (?i)\b(?:water\s+(?:quality|testing|sample|treatment|monitoring|compliance)|ADWG|Australian\s+Drinking\s+Water\s+Guidelines|turbidity|(?:E\.\s{0,2}coli|coliform)\s+(?:test|level|result|count)|effluent\s+quality|catchment\s+data)\b
    - id: Evidence_water_measurement
      pattern: (?i)\b(?:turbidity|E\.?\s?coli|total\s+coliforms?|thermotolerant\s+coliforms?|free\s+chlorine|total\s+chlorine|chlorine\s+residual|monochloramine|fluoride|nitrate|nitrite|lead|manganese|iron|arsenic|conductivity|trihalomethanes|THMs?|cyanobacteria)\s{0,3}(?:\([\w/]{1,10}\))?\s{0,3}[:=]?\s{0,3}(?:<\s{0,2}|>\s{0,2})?\d{1,6}(?:\.\d{1,4})?\s{0,3}(?:NTU|mg/L|µg/L|ug/L|CFU/100\s?mL|MPN/100\s?mL|orgs?/100\s?mL|µS/cm|uS/cm|cells/mL)
    - id: Evidence_sample_record
      pattern: (?i)\b(?:sample\s+(?:ID|no\.?|number|point)|sampling\s+(?:point|site|location)|monitoring\s+(?:site|point)|site\s+(?:ID|code)|lab(?:oratory)?\s+(?:ref|reference|report\s+no\.?|batch)|date\s+(?:sampled|collected)|collected\s+by)\s*[:#=|]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._@-]{1,60}
  keywords:
    - id: Keyword_water_compliance_context
      groups:
        - match_style: word
          terms:
            - exceedance
            - health guideline value
            - aesthetic guideline value
            - boil water notice
            - boil water alert
            - drinking water quality management plan
            - DWQMP
            - water supply scheme
            - reservoir
            - reticulation
            - drinking water service provider
            - notifiable incident
      strength: domain
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): converted from keyword_list to a regex-backed concept (the keyword list primary matched any "water quality" mention, including decoys, with no tier gate); 75 now requires measured parameters with units or labelled sample/site/lab record fields and 85 requires both plus compliance context (exceedance, guideline value, boil water, DWQMP, scheme); removed the phrase-only 85 path (critical infrastructure/SOCI terms) and the noise-strength monitoring word list; standardised the template NOT group as Keyword_noise_exclusion and added a guidance/news exclusion; populated synthetic tests and guidance/template/news decoys. Removed irrelevant AML/CTF, IPA, NDB and Privacy Act tags and ISO 27701; added Water Supply (Safety and Reliability) Act 2008 (Qld) and verified NHMRC ADWG / Qld legislation references.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1092 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-04'
    description: case/evidence metadata update
