schema: testpattern/v1
name: Academic transcripts
slug: global-top500-343-academic-transcripts
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies individual academic transcripts - official, academic or student transcripts, academic records, statements of academic record, records of results and course histories - when the phrase sits with populated student identifiers and transcript fields. Education records under applicable privacy law (FERPA in the US).
operation: >-
  Pattern type: regex (boost_regex engine). Primary: academic/official/student transcript, academic record, statement of academic record or results, record of results, course history, transcript of (academic) record. 65 (discovery only): phrase alone. 75: phrase plus a populated student identifier field. 85: student field plus a populated transcript field (program, degree awarded, award, conferral date, major, course/unit code, credit points or hours, GPA/cumulative GPA, WAM, grade, mark, result) plus independent academic-record evidence (grade point average, weighted average mark, high distinction, credit transfer, conferred, Registrar, advanced standing, honours, academic standing). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:academic\s+transcript|official\s+transcript|student\s+transcript|academic\s+record|statement\s+of\s+(?:academic\s+record|results)|record\s+of\s+results|course\s+history|transcript\s+of\s+(?:academic\s+)?record)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated student identifier; 85 also needs a transcript field and academic-record evidence. Ordering instructions, handbooks and verification-service pages stay at 65.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - GDPR
  - FERPA
data_categories:
- pii
corroborative_evidence:
  keywords:
    - grade point average
    - weighted average mark
    - conferred
    - Registrar
    - advanced standing
    - academic standing
  proximity: 300
test_cases:
  should_match:
    - value: "OFFICIAL ACADEMIC TRANSCRIPT\nStudent name: Avery Teston\nStudent ID: 40912876\nDate of birth: 04/02/1991\nProgram: Bachelor of Science (Honours)\nMajor: Microbiology\nCumulative GPA: 6.4\nDegree conferred 12/12/2025 - issued by the Registrar"
      description: Populated official transcript with student, transcript fields and academic-record evidence (85)
      synthetic: true
    - value: "Academic transcript request\nStudent ID: 30118274\nName: Casey Rourke"
      description: Transcript request with labelled student fields only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "student grant"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how academic transcript records are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Official transcript request form\nStudent name: ____________________\nStudent ID: ____________________\nProgram: ____________________\nMajor: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: graduates can now share a digital academic transcript with employers, and the university says the course history section will show credit transfer."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Common words and phrases related to academic transcripts appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  This regex flags academic, official or student transcript and academic-record language and enforces only when populated student identifier fields sit nearby; phrase-only text stays at 65 discovery. A genuine transcript can expose identity attributes, institutions, subjects, grades, dates, and progression, supporting document forgery, discriminatory screening, or misrepresentation in admissions and employment. The student faces serious but bounded harm because the record does not itself grant system access and authenticity still requires issuer verification. Risk 8 and SENSITIVE are proportionate; PROTECTED would require a bulk transcript repository, signing or issuance compromise, or consequences reaching significant institutional damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 reconciles with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the Personal-Privacy DLM, and Medium for a
    composite academic history. PROTECTED is not met because one transcript lacks bulk scale, credential-issuance
    control, privileged access, or the severe impact required for significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy DLM reflect the combined identity and educational-history value of an authentic
      transcript without treating it as a credential system.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_academic_transcripts
      matches:
        - ref: Regex_global_top500_343_academic_transcripts_student_fields
        - ref: Regex_global_top500_343_academic_transcripts_transcript_fields
        - ref: Keyword_global_top500_343_academic_transcripts_record_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_343_academic_transcripts_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_academic_transcripts
      matches:
        - ref: Regex_global_top500_343_academic_transcripts_student_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_343_academic_transcripts_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_academic_transcripts
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_academic_transcripts
      pattern: (?i)\b(?:academic\s+transcript|official\s+transcript|student\s+transcript|academic\s+record|statement\s+of\s+(?:academic\s+record|results)|record\s+of\s+results|course\s+history|transcript\s+of\s+(?:academic\s+)?record)\b
    - id: Regex_global_top500_343_academic_transcripts_student_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|student(?:\s+name)?|pupil|child|candidate(?:\s+name)?|EQ\s*ID|LUI|USI|year\s+level|grade\s+level|parent(?:\s+name)?|guardian|carer|(?:student|candidate|enrolment|applicant|file)\s*(?:no\.?|number|ID)|home\s+group|class)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_343_academic_transcripts_transcript_fields
      pattern: (?i)\b(?:program(?:me)?|degree(?:\s+awarded)?|award|conferral\s+date|date\s+conferred|major|course(?:\s+code)?|unit(?:\s+code)?|credit\s+points|credit\s+hours|GPA|cumulative\s+GPA|WAM|grade|mark|result)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_343_academic_transcripts_record_evidence
      groups:
        - match_style: word
          terms:
            - grade point average
            - weighted average mark
            - high distinction
            - credit transfer
            - conferred
            - Registrar
            - advanced standing
            - honours
            - academic standing
      strength: specific
    - id: Keyword_global_top500_343_academic_transcripts_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
