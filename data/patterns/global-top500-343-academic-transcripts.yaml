  description: "Quality pass (2026-09-24): rebuilt tiers - the old tiers were corroborated by the primary's own phrases and no positive reached an enforce tier. 75 now needs a populated student identifier and 85 needs student fields plus a transcript field plus academic-record evidence. Primary tightened (credit hours, GPA and degree awarded moved to structure fields). Bare-phrase tests replaced with populated records plus policy, blank-form and news decoys. Regulations: removed AML/CTF Act, HRIPA, My Health Records Act, IPA and TIA Act; added FERPA; frameworks added; expired HESF 2015 reference replaced with HESF 2021 and FERPA."
