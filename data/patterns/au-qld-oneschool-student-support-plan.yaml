schema: testpattern/v1
name: Queensland OneSchool Student Support and Curriculum Plan
slug: au-qld-oneschool-student-support-plan
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  OneSchool Support records and individual curriculum and learning plans for a named Queensland state school student (Individual Curriculum Plan, Individual Learning Plan). Behaviour support and student safety plans are covered by au-education-student-safety-behaviour-plan.
operation: >-
  Primary: Queensland OneSchool Student Support and Curriculum Plan anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:OneSchool\s+(?:Support\s+record|student\s+plan|record)|Individual\s+Curriculum\s+Plan|Individual\s+Learning\s+Plan)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Education (General Provisions) Act 2006 (Qld)
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - education
  - pii
corroborative_evidence:
  keywords:
    - OneSchool
    - triggers
    - de-escalation
    - reasonable adjustment
    - learning goals
    - support provisions
    - case manager
    - guidance officer
  proximity: 300
customisation:
  - key: qld-eq-id
    kind: identifier-format
    identifier: qld-eq-id
    target: purview.regexes/Regex_au_qld_oneschool_student_support_plan_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Education Queensland student ID (EQ ID) format (see docs/identifiers.md#qld-eq-id). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Individual Learning Plan\nStudent name: Riley Teston\nEQ ID: 0048213772K\nYear level: 6\nLearning goals: decode two-syllable words; independent writing of 3 sentences\nSupport provisions: speech-to-text, teacher aide 3 sessions a week\nReview date: 30/10/2026"
      description: Populated record 1
      synthetic: true
    - value: "OneSchool Support record\nStudent: Morgan Teston\nParent: Alex Teston\nGuidance officer referral following disclosure of self-harm; Individual Student Safety Plan commenced 14/08/2026."
      description: Populated record 2
      synthetic: true
    - value: "Individual Curriculum Plan — Mathematics\nStudent name: Jamie Teston\nYear level: 9\nLearning goals are set two year levels below cohort; assessment adjusted accordingly."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Schools develop an Individual Curriculum Plan when a student needs a curriculum below or above their year level. Plans are recorded in OneSchool and reviewed each term.
      description: Guidance or explainer text
    - value: "Individual Curriculum Plan\nStudent name: __________\nYear level: __________\nLearning area: __________"
      description: Blank form
    - value: 'Fact sheet: what is an Individual Curriculum Plan and who is involved in writing it.'
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_oneschool_student_support_plan_primary
      matches:
        - ref: Regex_au_qld_oneschool_student_support_plan_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_oneschool_student_support_plan_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_oneschool_student_support_plan_primary
      matches:
        - ref: Regex_au_qld_oneschool_student_support_plan_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_oneschool_student_support_plan_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_oneschool_student_support_plan_primary
      pattern: >-
        (?i)\b(?:OneSchool\s+(?:Support\s+record|student\s+plan|record)|Individual\s+Curriculum\s+Plan|Individual\s+Learning\s+Plan)\b
    - id: Regex_au_qld_oneschool_student_support_plan_record_structure
      pattern: >-
        (?i)\b(?:student\s+name|child(?:'s)?\s+name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|principal|school|(?:student|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_oneschool_student_support_plan_corroborative
      groups:
        - match_style: word
          terms:
            - OneSchool
            - triggers
            - de-escalation
            - reasonable adjustment
            - learning goals
            - support provisions
            - case manager
            - guidance officer
            - review date
            - restrictive practice
            - safety response
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a queensland oneschool student support and curriculum plan about an identified person, gated on populated record fields. OneSchool Support records and individual curriculum and learning plans for a named Queensland state school student (Individual Curriculum Plan, Individual Learning Plan). Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Qld DoE — OneSchool
    url: https://education.qld.gov.au/parents-and-carers/school-information/oneschool
created: '2026-09-24'
updated: '2026-09-24'
changelog:
