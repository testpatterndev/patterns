schema: testpattern/v1
name: QLD Cancer Register Notification
slug: au-qld-cancer-register-notification
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Populated cancer notifications to the Queensland Cancer Register (QCR). Notification of cancer is
  mandatory under the Public Health Act 2005 (Qld) for public and private hospitals, pathology
  laboratories and diagnostic imaging practices; hospital, pathology and imaging notifications and
  the extracts sent through the QCR secure transfer portal name the patient and carry the tumour
  details - date of diagnosis, primary site, morphology / histology, behaviour, grade, stage and
  laterality, and the basis of diagnosis. Boundary: notifiable communicable condition reports belong
  to au-qld-notifiable-condition-report; pathology reports in general to
  global-top500-327-pathology-reports; perinatal and termination of pregnancy records to
  au-qld-perinatal-termination-of-pregnancy-record.
operation: >-
  Primary: Queensland Cancer Register, QCR, cancer notification, cancer registry / register
  notification, notification of cancer, Queensland Oncology Repository. 65 (discovery only): primary
  alone, which surfaces notifier guidelines, statistics and unrelated QCR acronyms. 75: primary plus a
  populated patient field (patient name, DOB, URN / UR number, MRN, Medicare, IHI) plus a populated
  tumour field (date of diagnosis, primary or tumour site, topography, morphology, histology /
  histological type, ICD-O code, behaviour, grade, stage, TNM, laterality, basis of diagnosis). 85: the
  75 evidence plus independent oncology or statutory context (histopathology, pathology laboratory,
  diagnostic imaging, oncology, multidisciplinary team, MDT, chemotherapy, radiotherapy, notifier,
  Public Health Act). Enforce tiers exclude template wording and guideline, technical specification,
  statistics, training and media framing.
pattern: >-
  (?i)\b(?:Queensland\s+Cancer\s+Register|QCR|cancer\s+(?:notification|regist(?:ry|er)\s+notification)|notification\s+of\s+cancer|Queensland\s+Oncology\s+Repository)\b
confidence: medium
confidence_justification: >-
  Medium: Queensland Cancer Register and cancer notification wording is specific, and enforce tiers need
  a populated patient field and a populated tumour field. "QCR" is also an unrelated acronym (quality or
  change request), which lacks tumour fields and stays at 65. Hospital extracts sent as headerless CSV
  files are not covered.
jurisdictions:
  - au
  - au-qld
regulations:
  - Public Health Act 2005 (Qld)
  - Hospital and Health Boards Act 2011 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
  - QGISCF
data_categories:
  - phi
  - health
  - pii
corroborative_evidence:
  keywords:
    - date of diagnosis
    - primary site
    - morphology
    - histopathology
    - multidisciplinary team
    - Public Health Act
  proximity: 300
test_cases:
  should_match:
    - value: "Cancer notification - Queensland Cancer Register\nPatient: Jordan Teston\nDOB: 09/09/1961\nDate of diagnosis: 22/09/2026\nPrimary site: C18.7 Sigmoid colon\nMorphology: 8140/3 Adenocarcinoma NOS\nBasis of diagnosis: Histopathology of primary tumour\nMultidisciplinary team review booked for 30/09/2026."
      description: 85 tier - QCR notification with patient, diagnosis date, primary site, morphology and histopathology / MDT context
      synthetic: true
    - value: "Notification of cancer\nPatient name: Riley Teston\nURN: 778120\nTumour site: Left breast, upper outer quadrant\nGrade: 2\nLaterality: Left\nNotifying pathology laboratory: Teston Pathology Services"
      description: 85 tier - pathology cancer notification with patient, tumour site, grade, laterality and pathology laboratory context
      synthetic: true
    - value: "Cancer notification form\nPatient: Morgan Teston\nDate of diagnosis: 01/10/2026"
      description: 75 tier - cancer notification with patient and date of diagnosis only
      synthetic: true
  should_not_match:
    - value: "Hospital notifier guidelines: this guideline explains how to submit a cancer notification to the Queensland Cancer Register, including primary site, morphology and date of diagnosis fields, within 120 days."
      description: QCR notifier guideline (65 at most)
    - value: "Queensland Cancer Register statistics: 33,500 new cancers were diagnosed in Queensland in 2024, with prostate, breast and colorectal cancer the most common."
      description: Aggregate cancer statistics (65 at most)
    - value: "Cancer notification form\nPatient: ____________________\nDate of diagnosis: __/__/____\nPrimary site: ____________________\nMorphology: ____________________"
      description: Blank notification form (65 at most)
    - value: "QCR 4521 (quality change request) approved\nOwner: Facilities\nSite: Building 3 loading dock"
      description: Unrelated QCR acronym with populated fields but no patient (65 at most)
false_positives:
  - description: QCR hospital, pathology and imaging notifier guidelines and technical specifications.
    mitigation: No populated patient field, and guideline, technical specification and training framing is excluded from enforce tiers.
  - description: Published cancer statistics and Cancer Alliance Queensland reports.
    mitigation: Aggregate figures carry no patient field and are excluded as statistics.
  - description: Unrelated uses of the acronym QCR.
    mitigation: They lack patient and tumour fields and stay at 65.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_cancer_notification_primary
      matches:
        - ref: Regex_cancer_notification_patient_field
        - ref: Regex_cancer_notification_tumour_field
        - ref: Keyword_cancer_notification_oncology_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_cancer_notification_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_cancer_notification_primary
      matches:
        - ref: Regex_cancer_notification_patient_field
        - ref: Regex_cancer_notification_tumour_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_cancer_notification_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_cancer_notification_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_cancer_notification_primary
      pattern: >-
        (?i)\b(?:Queensland\s+Cancer\s+Register|QCR|cancer\s+(?:notification|regist(?:ry|er)\s+notification)|notification\s+of\s+cancer|Queensland\s+Oncology\s+Repository)\b
    - id: Regex_cancer_notification_patient_field
      pattern: >-
        (?i)\b(?:patient(?:\s+name)?|full\s+name|surname|given\s+names?|date\s+of\s+birth|DOB|URN|UR\s*(?:no\.?|number)|MRN|medical\s+record\s+(?:no\.?|number)|Medicare(?:\s+(?:card\s+)?(?:no\.?|number))?|IHI)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_cancer_notification_tumour_field
      pattern: >-
        (?i)\b(?:date\s+of\s+diagnosis|diagnosis\s+date|(?:primary|tumou?r)\s+site|topography|morphology|histology|histological\s+type|ICD-O(?:-3)?(?:\s+code)?|behaviou?r|grade|stage|TNM(?:\s+stage)?|laterality|basis\s+of\s+diagnosis)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.,-]{0,30}(?:[ \t]+[A-Za-z0-9][A-Za-z0-9/'.,-]{0,30}){0,5}
    - id: Regex_cancer_notification_guidance_exclusion
      pattern: >-
        (?i)\b(?:this\s+(?:policy|procedure|guideline|guide|page|fact\s?sheet|article|course)|notifier\s+guidelines?|technical\s+(?:guide|specifications?)|training\s+module|e-learning|statistics|annual\s+report|frequently\s+asked\s+questions|media\s+release)\b
  keywords:
    - id: Keyword_cancer_notification_oncology_context
      groups:
        - match_style: word
          terms:
            - histopathology
            - pathology laboratory
            - diagnostic imaging
            - oncology
            - oncologist
            - multidisciplinary team
            - text: MDT
              case_sensitive: true
            - chemotherapy
            - radiotherapy
            - notifier
            - Public Health Act
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier recognises Queensland Cancer Register notifications and enforces only when a populated
  patient field sits with a populated tumour field (diagnosis date, site, morphology, grade, stage), with
  85 also needing oncology or statutory context. A genuine notification states that a named person has
  been diagnosed with a specific cancer, with its stage and the treating facility. Disclosure can lead
  to discrimination in employment and insurance and to distress before the patient has told family. The
  register is a statutory collection under the Public Health Act 2005 (Qld) with confidentiality duties.
  The normal unit is one patient's notification, so the harm is serious but contained; risk 8 matches
  au-qld-notifiable-condition-report.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because a populated
    cancer notification discloses a named person's cancer diagnosis, site, stage and treating facility. PROTECTED is
    not met for one notification; a bulk register extract or notifier portal credentials would be needed.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling protects one person's cancer diagnosis held in a statutory register
      notification. High is not met unless register data is extracted in bulk.
references:
  - title: Cancer Alliance Queensland - Queensland Cancer Register (QCR) and cancer notification
    url: https://cancerallianceqld.health.qld.gov.au/queensland-cancer-register-qcr/
  - title: Public Health Act 2005 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2005-048
  - title: Information Privacy Act 2009 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
created: '2026-10-20'
updated: '2026-10-20'
changelog:
  - version: 1.0.0
    date: '2026-10-20'
    description: >-
      Initial release from the qghealth sector review (item 7, split): Queensland Cancer Register
      notifications from hospitals, pathology laboratories and diagnostic imaging practices. 65 phrase only;
      75 needs a populated patient field and a populated tumour field; 85 adds oncology or statutory
      context. Guideline, technical specification, statistics and training framing excluded.
