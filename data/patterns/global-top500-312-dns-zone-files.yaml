  date: '2026-09-24'
  description: 'Quality pass (2026-09-24): primary limited to zone directives; resource records and internal-zone artefacts are separate structures; the TTL self-corroboration (keyword TTL on a $TTL primary) is removed; 75 needs a resource record line; 85 needs two record lines, an internal-zone artefact and zone-administration context; guidance exclusion; tests rebuilt (no example.com), policy/template/training decoys; GDPR replaced with SOCI Act; frameworks and NIST SP 800-128 reference added; credentials category removed.'
- version: 1.3.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1862 without changing detector or package metadata.'
- version: 1.3.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
- version: 1.2.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
- version: 1.2.0
