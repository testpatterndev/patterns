schema: testpattern/v1
name: DNS zone files
slug: global-top500-312-dns-zone-files
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects DNS zone files: $ORIGIN/$TTL/SOA directives with resource record lines, especially internal zones with private addresses and internal hostnames. A directive alone is discovery-only.
operation: >-
  Regex_dns_zone_primary (a zone-file directive ($ORIGIN, $TTL, IN SOA)) is discovery-only at 65. 75 requires the primary plus one populated structure: a resource record line (owner IN A/AAAA/CNAME/MX/NS/TXT/SRV/PTR with data) or an internal-zone artefact (internal hostname, RFC 1918 address, SOA serial block). 85 requires a resource record line (owner IN A/AAAA/CNAME/MX/NS/TXT/SRV/PTR with data) (two distinct hits), an internal-zone artefact (internal hostname, RFC 1918 address, SOA serial block), and independent zone-administration (SOA timers, hostmaster, AXFR, BIND) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_dns_zone_guidance_exclusion).
pattern: >-
  \$ORIGIN\s+[A-Za-z0-9.-]{1,253}|\$TTL\s+\d{1,10}|\bIN\s+SOA\s+[A-Za-z0-9.-]{1,253}
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a resource record line (owner IN A/AAAA/CNAME/MX/NS/TXT/SRV/PTR with data) or an internal-zone artefact (internal hostname, RFC 1918 address, SOA serial block)), and 85 needs two distinct structures plus independent zone-administration (SOA timers, hostmaster, AXFR, BIND) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- SOCI Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - refresh
  - retry
  - expire
  - hostmaster
  - zone transfer
  - AXFR
  - named.conf
  - BIND
  - split-horizon
  - serial
  proximity: 300
test_cases:
  should_match:
  - value: $TTL 86400
    description: Discovery probe (65) - TTL directive only
  - value: |-
      $ORIGIN harbour.internal.
      fs01 IN A 10.20.4.10
    description: Medium-tier probe (75) - directive plus one record
    synthetic: true
  - value: |-
      $ORIGIN harbour.internal.
      $TTL 3600
      @ IN SOA ns1.harbour.internal. hostmaster.harbour.internal. ( 2026091801 ; serial
       7200 ; refresh
       3600 ; retry
       1209600 ; expire
       3600 )
      @ IN NS ns1.harbour.internal.
      fs01 IN A 10.20.4.10
      sqlpay01 IN A 10.20.8.11
      mail IN MX 10 mx1.harbour.internal.
    description: High-tier probe (85) - internal zone with SOA serial, several records and timers
    synthetic: true
  should_not_match:
  - value: we met in a meeting room
    description: Lowercase "in a" prose must not match (IN is case-sensitive)
  - value: the soa architecture team reviewed it
    description: Lowercase "soa" prose must not match
  - value: 'Policy statement: internal DNS zone files are held only on the primary name servers; $TTL values follow the naming standard.'
    description: Policy text with a directive fragment
    synthetic: true
  - value: |-
      DNS zone file template
      $ORIGIN [insert].
      host IN A ________
    description: Blank template
    synthetic: true
  - value: 'Course module 2: a zone file begins with $ORIGIN and lists records such as www IN A 192.0.2.1.'
    description: Training framing
    synthetic: true
false_positives:
- description: Public zone snippets in DNS tutorials and RFCs.
  mitigation: Guidance/training framing and template-exclusion terms (example.com) suppress enforce tiers; 85 needs internal-zone artefacts.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The detector recognises DNS zone syntax and enforces only when a directive is accompanied by resource record lines, with internal-zone artefacts required at 85. Many records in a public authoritative zone are already queryable and expose no secret, although an internal or unpublished zone can reveal hostnames, addresses, services, mail routes, and infrastructure relationships useful for reconnaissance. The normal standalone file therefore creates bounded harm that depends on whether the zone is internal, complete, and non-public, affecting the domain owner and mapped systems. Risk 5 OFFICIAL is appropriate for undifferentiated zone data; SENSITIVE requires evidence of internal topology, hidden services, or consequential operational records.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_dns_zone_primary
    matches:
    - ref: Regex_dns_zone_resource_record
      min_count: 2
      unique_results: true
    - ref: Regex_dns_zone_internal_zone
    - ref: Keyword_dns_zone_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_dns_zone_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_dns_zone_primary
    matches:
    - type: any
      refs:
      - Regex_dns_zone_resource_record
      - Regex_dns_zone_internal_zone
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_dns_zone_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_dns_zone_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_dns_zone_primary
    pattern: >-
      \$ORIGIN\s+[A-Za-z0-9.-]{1,253}|\$TTL\s+\d{1,10}|\bIN\s+SOA\s+[A-Za-z0-9.-]{1,253}
  - id: Regex_dns_zone_resource_record
    pattern: >-
      \b[A-Za-z0-9_@*.-]{1,253}\s+(?:\d{1,10}\s+)?IN\s+(?:A\s+\d{1,3}(?:\.\d{1,3}){3}|AAAA\s+[0-9A-Fa-f:]{3,39}|CNAME\s+[A-Za-z0-9.-]{1,253}|MX\s+\d{1,5}\s+[A-Za-z0-9.-]{1,253}|NS\s+[A-Za-z0-9.-]{1,253}|TXT\s+\"|SRV\s+\d|PTR\s+[A-Za-z0-9.-]{1,253})
  - id: Regex_dns_zone_internal_zone
    pattern: >-
      (?i)\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:10\.\d{1,3}|192\.168|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b|\(\s*\d{8,10}\s*;
  keywords:
  - id: Keyword_dns_zone_context
    groups:
    - match_style: word
      terms:
      - refresh
      - retry
      - expire
      - hostmaster
      - zone transfer
      - text: AXFR
        case_sensitive: true
      - named.conf
      - text: BIND
        case_sensitive: true
      - split-horizon
      - serial
    strength: specific
  - id: Keyword_dns_zone_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
created: '2026-02-08'
updated: '2026-09-24'
