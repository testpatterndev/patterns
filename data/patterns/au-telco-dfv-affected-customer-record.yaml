schema: testpattern/v1
name: Telco Domestic, Family and Sexual Violence Affected Person Record
slug: au-telco-dfv-affected-customer-record
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Telecommunications provider account records that identify a customer or end-user as an "affected person" under the Telecommunications (Domestic, Family and Sexual Violence Consumer Protections) Industry Standard 2025 (F2025L00664). Covers the agreed communication method recorded under s 10, the privacy, safety and security protections put on the account under ss 11-12 (PIN or password, verification code to a safe number or email, a new account not linked to the perpetrator), holds on and urgent reversal of a service limiting action under s 13, non-disclosure instructions under ss 25 and 27, privacy breach notifications to the affected person and the ACMA under s 29, and the record of the type of evidence sought, provided and sighted under ss 14 and 30-31. Most of the Standard commenced on 1 January 2026 (1 April 2026 for small providers); some provisions commenced on 1 July 2025. This is the telco counterpart of au-energy-family-violence-customer-record, with telco account structure (account or customer number, service or mobile number, MSISDN).
operation: >-
  Primary: an affected-person or DFV account phrase (affected person, customer/consumer affected by or experiencing domestic, family or sexual violence, a DFV/DFSV/FV or domestic/family violence flag, indicator, alert, marker, account, note or case, or "service limiting action"). 75 tier requires, within 300 characters, one populated structure: a telco account field (an account, customer or service number or ID containing a digit, a labelled mobile/service/phone number or MSISDN with an Australian mobile value, or an account holder name) or a protection-action field (an agreed, preferred or safe communication or contact method with a value, a safe number or email with a value, a PIN, password or verification code added or set, a restriction, suspension, disconnection or barring reversed or lifted, a disconnection, suspension, credit-management or collections hold with a status or date, a new account not linked to the perpetrator, an authorised representative removed, a "do not disclose/discuss ... to/with" the account holder, authorised representative, former partner or perpetrator, a populated "evidence sought/provided/sighted" field, or an "ACMA notified" / "affected person notified" entry with a date). 85 tier requires an account field AND a protection-action field AND an independent telco term (mobile, SIM, nbn, carriage service, telco, prepaid, postpaid, handset, porting, plan, bill). All enforce tiers AND NOT the shared template-exclusion dictionary and a standard/policy exclusion (this industry standard, a provider must, DFV statement, our DFV policy, published on our website, Communications Alliance, Action on telco consumer protections). 65 is discovery-only (primary phrase alone) and will surface the Standard, ACMA guidance and published telco DFV statements.
pattern: >-
  (?i)\b(?:affected\s+persons?|(?:customer|consumer|end-user|account\s+holder)\s+(?:is\s+)?(?:affected\s+by|experiencing|impacted\s+by)\s+(?:domestic|family|sexual|DFV|DFSV|FV)|(?:DFV|DFSV|FDV|FV|(?:domestic\s+(?:and\s+family\s+)?|family\s+)violence)\s+(?:flag|indicator|alert|marker|account|note|case)|service\s+limiting\s+action)\b
confidence: medium
confidence_justification: >-
  Medium: "affected person", "agreed communication method" and "service limiting action" are the defined terms of F2025L00664, but the Standard, ACMA guidance and every provider's published DFV statement (s 17) use the same words, and "affected person" is also used outside DFV. Enforce tiers therefore need a populated telco account or protection-action field, and a standard/policy exclusion. Provider CRM field labels (for example the wording of a DFV flag) are not published and are unverified, so the account and action fields are generic labelled-value shapes. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - "Telecommunications (Domestic, Family and Sexual Violence Consumer Protections) Industry Standard 2025 (Cth)"
  - Telecommunications Act 1997 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - contact-information
corroborative_evidence:
  keywords:
    - affected person
    - agreed communication method
    - service limiting action
    - perpetrator
    - safe number
    - verification code
    - authorised representative
    - mobile
  proximity: 300
  keyword_lists:
    - au-dfv-terminology
customisation:
  - key: telco-account-number
    kind: identifier-format
    identifier: telco-account-number
    target: purview.regexes/Regex_au_telco_dfv_account_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's telco account / service number format (see docs/identifiers.md#telco-account-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Account note - affected person (DFV)\nAccount number: 30071188452\nService number: 0412 555 781\nAgreed communication method: SMS only, weekdays 10am-2pm\nAccount PIN added; verification code to safe email only.\nDo not disclose any account details to the former partner Jordan Teston.\nEvidence sighted: DVO copy, not retained. Postpaid mobile plan."
      description: Flagged postpaid account with account and service numbers, agreed communication method, PIN, non-disclosure and evidence-type record (85 tier)
      synthetic: true
    - value: "DFSV flag added 14/01/2026 - customer is an affected person.\nMSISDN: 61412998004\nDisconnection reversed 14/01/2026 at customer request (safety risk).\nCredit management hold: applied until 15/02/2026\nReplacement SIM issued in store."
      description: Urgent reversal of a service limiting action and credit-management hold on a mobile service (85 tier)
      synthetic: true
    - value: "Privacy incident - affected person\nCustomer number: 99102837\nMobile number: 0421 330 118\nNew address disclosed to former partner by a store agent on 04/05/2026.\nACMA notified: 06/05/2026\nAffected person notified: 06/05/2026 by email\nPrepaid mobile service."
      description: Section 29 privacy breach notification record with customer and mobile numbers (85 tier)
      synthetic: true
    - value: "Customer identified as an affected person on 02/03/2026.\nAgreed communication method: email to personal address only, no calls"
      description: Affected person identification with an agreed communication method and no account field (75 tier)
      synthetic: true
    - value: "DFV flag - account number: 8820194473. Customer asked not to be transferred between teams again."
      description: DFV account flag with an account number only (75 tier)
      synthetic: true
  should_not_match:
    - value: "affected person means an individual who is a consumer and who identifies as someone who is, or may be, experiencing domestic and family violence. A provider must keep a record of the type of evidence that was sought, provided and sighted by the provider."
      description: Text of the Industry Standard 2025 (definition and s 30 record-keeping wording), 65 only
    - value: "Our DFV statement. If you are an affected person we will agree a safe communication method with you, will not disconnect your mobile service while you get help, and will never ask you to deal with the perpetrator. Call 1800RESPECT for support."
      description: Provider's published DFV statement required by s 17 (decoy, 65 only)
    - value: "DFV flag: [Y/N]\nAccount number: __________\nService number: __________\nAgreed communication method: <select>\nEvidence sighted: __________"
      description: Blank CRM template (65 only)
    - value: "The ACMA's Action on telco consumer protections report found that 12 providers had not trained frontline staff to help an affected person experiencing domestic and family violence."
      description: ACMA compliance report / news (65 only)
    - value: "Training example: an affected person calls to ask for a new account. Agreed communication method: SMS. Service number: 0412 345 678. Discuss the options in the DFV procedure."
      description: Staff training scenario, suppressed by the template exclusion
false_positives:
  - description: The Industry Standard 2025, ACMA guidance and compliance reports, and industry guidelines, which use every defined term.
    mitigation: Standard/policy exclusion group ("this industry standard", "a provider must", "Action on telco consumer protections", "Communications Alliance"); enforce tiers need populated account or protection-action fields that legislation and guidance do not carry.
  - description: Provider DFV statements and DFV policies that every provider must publish (ss 17 and 19).
    mitigation: Exclusion on "DFV statement", "our DFV policy" and "published on our website"; published statements describe protections without populated fields.
  - description: Non-telco records using "affected person" (for example a DVO recording the affected person, or an insurance claim) that also carry an account number.
    mitigation: These can reach 75. The 85 tier needs both an account and a protection-action field plus telco evidence. Protection orders are covered by au-dfv-protection-order and energy accounts by au-energy-family-violence-customer-record.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_telco_dfv_primary
      matches:
        - ref: Regex_au_telco_dfv_account_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_telco_dfv_protection_action
            - Regex_au_telco_dfv_service_evidence_action
        - ref: Keyword_au_telco_dfv_telco_service
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_telco_dfv_standard_exclusion
    - confidence_level: 75
      id_match: Regex_au_telco_dfv_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_telco_dfv_account_field
            - Regex_au_telco_dfv_protection_action
            - Regex_au_telco_dfv_service_evidence_action
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_telco_dfv_standard_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_telco_dfv_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_telco_dfv_primary
      pattern: >-
        (?i)\b(?:affected\s+persons?|(?:customer|consumer|end-user|account\s+holder)\s+(?:is\s+)?(?:affected\s+by|experiencing|impacted\s+by)\s+(?:domestic|family|sexual|DFV|DFSV|FV)|(?:DFV|DFSV|FDV|FV|(?:domestic\s+(?:and\s+family\s+)?|family\s+)violence)\s+(?:flag|indicator|alert|marker|account|note|case)|service\s+limiting\s+action)\b
    - id: Regex_au_telco_dfv_account_field
      pattern: >-
        (?i)\b(?:(?:account|customer|service|billing)\s+(?:no\.?|number|ID)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9 -]{4,15}\b|(?:MSISDN|(?:mobile|phone|service)\s+(?:no\.?|number))\s*[:#]\s*(?:\+?61[ \t]?4|04)\d{2}[ \t]?\d{3}[ \t]?\d{3}\b|account\s+holder(?:\s+name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30})
    - id: Regex_au_telco_dfv_protection_action
      pattern: >-
        (?i)\b(?:(?:agreed|preferred|safe)\s+(?:method\s+of\s+)?(?:communication|contact)(?:\s+(?:method|details|channel|time))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|select)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9@.'-]{1,40}|safe\s+(?:number|email|phone)(?:\s+address)?\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld)\b|_{2,}|\[|<)[A-Z0-9+][A-Za-z0-9@.' -]{3,40}|(?:account\s+)?(?:PIN|password|passphrase|verification\s+code|security\s+question)\s+(?:added|set|applied|enabled|changed|reset|in\s+place|required)|new\s+account\s+(?:created|opened|set\s+up)|authori[sz]ed\s+representative\s+(?:removed|revoked|cancelled)|do\s+not\s+(?:disclose|discuss|release|share|provide)\s+[^.\n]{0,80}?\b(?:to|with)\s+(?:the\s+)?(?:account\s+holder|authori[sz]ed\s+representative|joint|former|other|ex-?partner|perpetrator|person\s+using\s+violence))
    - id: Regex_au_telco_dfv_service_evidence_action
      pattern: >-
        (?i)\b(?:(?:restriction|suspension|disconnection|barring|service\s+limiting\s+action)\s+(?:reversed|lifted|removed)|(?:disconnection|suspension|restriction|credit\s+management|collections?)\s+(?:hold|block|paused|on\s+hold)\s*[:#-]?\s*(?:yes|applied|active|placed|until|from|\d)|evidence\s+(?:type\s+)?(?:sought|provided|sighted)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|none)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,40}|(?:ACMA|affected\s+person)\s+notified\s*[:#-]?\s*\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4})
  keywords:
    - id: Keyword_au_telco_dfv_telco_service
      groups:
        - match_style: word
          terms:
            - mobile
            - text: SIM
              case_sensitive: true
            - nbn
            - carriage service
            - telco
            - prepaid
            - postpaid
            - handset
            - porting
            - plan
            - bill
            - text: MSISDN
              case_sensitive: true
      strength: domain
    - id: Keyword_au_telco_dfv_standard_exclusion
      groups:
        - match_style: word
          terms:
            - this industry standard
            - a provider must
            - the provider must
            - DFV statement
            - our DFV policy
            - published on our website
            - Communications Alliance
            - Action on telco consumer protections
            - Consumer Protections) Industry Standard 2025
      strength: specific
risk_rating: 10
risk_description: >-
  The classifier identifies a telco account record that marks a customer or end-user as affected by domestic, family or sexual violence and carries the account, service or mobile number together with how the provider may safely contact them, what must be withheld from an account holder, authorised representative or former partner, security protections, reconnection or collections holds, the evidence type sighted, and any privacy breach. The Standard (ss 25 and 27) prohibits disclosing information that could identify or locate an affected person, including the fact that they are an affected person. Disclosure to a person using violence can reveal a victim-survivor's number, whereabouts and new account, with a credible risk of serious harm. This is the same harm the au-dfv-confidential-address and au-energy-family-violence-customer-record classifiers treat as PROTECTED. Risk 10 supports PROTECTED Personal-Privacy; review against the organisation's own harm assessment before enforcement.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: Federal Register of Legislation - Telecommunications (Domestic, Family and Sexual Violence Consumer Protections) Industry Standard 2025 (F2025L00664)
    url: https://www.legislation.gov.au/F2025L00664/latest/text
  - title: ACMA - Domestic, family and sexual violence standard - rules for industry (decoy source)
    url: https://www.acma.gov.au/domestic-family-and-sexual-violence-standard-rules-industry
created: '2026-09-24'
updated: '2026-09-24'
changelog:
