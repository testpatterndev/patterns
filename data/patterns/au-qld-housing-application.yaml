schema: testpattern/v1
name: QLD Housing Application
slug: au-qld-housing-application
version: 1.4.2
type: regex
pattern_class: concept
description: >-
  Detects populated Queensland social / public housing applications and housing register records: a housing application or housing register phrase combined with a named applicant or household member, household income, household size or current address. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: public/social housing application or assessment, housing register/assistance application, housing register, housing wait list, priority housing/assessment, eligible for social/public housing. 65 (discovery only): primary alone. 75: primary plus one populated field - applicant/household member name, date of birth, CRN, client or application number, household income with a dollar value, household size / number of dependants, or a numbered current address. 85: primary plus two distinct field types plus applicant circumstances evidence (homelessness, domestic and family violence, disability, priority need, current tenancy, housing needs assessment, bond loan, rental assistance). Template/sample and guidance/news framing excluded on every enforce tier.
confidence: medium
confidence_justification: >-
  Enforce tiers require populated applicant, income, household or address fields next to the housing phrase; eligibility pages, media releases and blank forms stay at 65. Medium because housing-provider correspondence can carry the same fields.
jurisdictions:
  - au
regulations:
  - Housing Act 2003 (Qld)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - pii
  - financial
  - government
test_cases:
  should_match:
    - value: "SOCIAL HOUSING APPLICATION - Department of Housing\nApplicant name: Avery Teston\nDate of birth: 04/02/1991\nCRN: 204889137K\nCurrent address: 14 Wattlebird Street, Stafford QLD 4053\nHousehold size: 3\nGross weekly household income: $912.40\nThe applicant is at risk of homelessness after a domestic and family violence incident; priority need assessed."
      description: Populated application - applicant, CRN, address, household and income with circumstances (85)
      synthetic: true
    - value: "Housing register application\nApplicant: Jordan Whitlock\nReceived at the Brisbane housing service centre on 12/08/2026."
      description: Register application with one populated applicant field (75)
      synthetic: true
  should_not_match:
    - value: "Fact sheet: to join the housing register you complete a social housing application. We assess household income, the number of household members and any disability or homelessness risk. Eligibility criteria are on our website."
      description: Eligibility fact sheet naming the fields without values
      synthetic: true
    - value: "SOCIAL HOUSING APPLICATION\nApplicant name: __________\nDate of birth: ____/____/______\nCurrent address: __________\nHousehold size: ____\nGross weekly household income: $________"
      description: Blank application form - placeholder values
      synthetic: true
    - value: "The social housing wait list in Queensland grew to 44,000 households this year, the Minister said on Tuesday."
      description: News item with aggregate figures
      synthetic: true
    - value: "Housing market report"
      description: Unrelated housing phrase
      synthetic: true
    - value: "New housing development announced"
      description: Unrelated housing phrase
      synthetic: true
    - value: "Priority assessment software demo"
      description: Product-demo wording must remain discovery-only
      synthetic: true
false_positives:
  - description: Housing eligibility pages, fact sheets and ministerial media releases about the housing register.
    mitigation: They carry no populated applicant, income, household or address field and guidance/news framing is excluded, so they stay at 65.
  - description: "'Priority assessment' in unrelated operational or software contexts."
    mitigation: The phrase alone is discovery-only; enforce tiers need populated applicant structure.
exports:
  - yaml
scope: narrow
risk_rating: 4
risk_description: >-
  The pattern identifies Queensland social-housing and housing-assistance applications through eligibility, needs-assessment, public-housing, wait-list, and support language. A completed record can expose financial hardship, household composition, disability or support needs, past tenancies, and housing insecurity that may enable stigma, fraud, or coercive targeting. The applicant and household bear the harm, while a blank form or programme description has low consequence and the keyword match does not distinguish completion state. Risk 4 OFFICIAL reflects the low-content match; SENSITIVE requires an identifiable application containing income, hardship, property, eligibility, disability, household, or support details. Quality pass 2026-09-24: enforce tiers (75/85) now require populated record structure (labelled fields with real values, identifiers or data rows); phrase-only mentions in guidance, marketing, blank forms and news stay at 65 discovery.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    The broad housing-application concept maps at risk 4 to PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, OFFI, and Low
    because its regex can stop at assistance or application language without proving a populated record. SENSITIVE is
    not justified by the normal match; that threshold requires an identified person or household plus completed income,
    hardship, property, eligibility, or support details.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic handling is appropriate for templates and general housing-program material. Identifiable applicant
      responses, hardship evidence, and support-needs assessments should be governed by a specific SENSITIVE personal or
      government-record control.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: &id001
        type: any
        ids:
          - Pattern_housing_application
          - Pattern_housing_register
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_au_qld_housing_application_applicant
            - Regex_au_qld_housing_application_income
            - Regex_au_qld_housing_application_household
            - Regex_au_qld_housing_application_address
        - ref: Evidence_applicant_household_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_housing_application_guidance_exclusion
    - confidence_level: 75
      id_match: *id001
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_housing_application_applicant
            - Regex_au_qld_housing_application_income
            - Regex_au_qld_housing_application_household
            - Regex_au_qld_housing_application_address
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_housing_application_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: *id001
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_housing_application
      pattern: (?i)\b(?:(?:public|social)\s+housing\s+(?:application|assessment)|housing\s+(?:register|assistance)\s+application)\b
    - id: Pattern_housing_register
      pattern: (?i)\b(?:housing\s+register|housing\s+wait\s+list|(?:public|social)\s+housing\s+wait\s+list|priority\s+(?:housing|assessment)|eligible\s+for\s+(?:social|public)\s+housing)\b
    - id: Regex_au_qld_housing_application_applicant
      pattern: (?i)\b(?:applicant(?:\s+name)?|co-applicant|(?:full\s+)?name|client\s+name|household\s+member(?:\s+\d)?|date\s+of\s+birth|DOB|CRN|customer\s+reference\s+number|client\s*(?:no\.?|number|ID)|application\s*(?:no\.?|number|ID))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
    - id: Regex_au_qld_housing_application_income
      pattern: (?i)\b(?:(?:gross|total|weekly|fortnightly|annual|assessable)[ \t]{1,3}){0,3}(?:household[ \t]{1,3})?income[ \t]{0,3}[:#][ \t]{0,3}(?:AUD|USD|NZD|GBP|EUR|A\$|US\$|NZ\$|\$|£|€)[ \t]?(?:\d{1,3}(?:,\d{3}){1,4}|\d{1,12})(?:\.\d{2})?(?![\d,]\d)(?!\.\d)
    - id: Regex_au_qld_housing_application_household
      pattern: (?i)\b(?:household\s+size|number\s+of\s+(?:adults|children|dependants|occupants|household\s+members)|dependants|bedrooms\s+required)[ \t]{0,3}[:#][ \t]{0,3}\d{1,2}\b
    - id: Regex_au_qld_housing_application_address
      pattern: (?i)\b(?:(?:current|residential|postal)\s+address|address)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]{1,3}[A-Z][A-Za-z'-]{1,30}
  keywords:
    - id: Evidence_applicant_household_context
      groups:
        - match_style: word
          terms:
            - homelessness
            - at risk of homelessness
            - domestic and family violence
            - disability
            - priority need
            - current tenancy
            - housing needs assessment
            - bond loan
            - rental assistance
            - Centrelink
            - supported accommodation
      strength: domain
    - id: Keyword_au_qld_housing_application_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - eligibility criteria
            - housing market
            - development announced
            - software demo
      strength: noise
created: '2026-02-09'
updated: '2026-09-25'
changelog:
  - version: 1.4.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were phrase-only keyword tiers; 75 now needs a populated applicant/household member, income, household-size or address field and 85 needs two distinct field types plus applicant-circumstances evidence; converted type keyword_list -> regex (boost_regex) with a top-level pattern; replaced bare-phrase positives with a populated application; added fact-sheet, blank-form and news decoys; dropped AML/CTF Act and SOCI Act, added Housing Act 2003 (Qld) and verified references.
  - version: 1.3.2
    date: '2026-07-19'
    description: 'Targeted finance/health blocker remediation: keep housing application/register phrases at 65 discovery, require applicant or household details at 75 and QLD housing provenance at 85, broaden wait-list coverage, and add exact-tier plus software-demo probes.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 583 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
