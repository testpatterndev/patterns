schema: testpattern/v1
name: Student enrollment records
slug: global-top500-341-student-enrollment-records
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies individual student enrolment records - student enrolment/enrollment records and forms, enrolment verification or confirmation, student registration, admission and course registration records - when the phrase sits with populated student identifiers and enrolment fields. Education records under applicable privacy law (FERPA in the US).
operation: >-
  Pattern type: regex (boost_regex engine). Primary: student enrolment/enrollment (record, form), enrolment record/verification/confirmation, confirmation of enrolment, student registration, admission record, course registration. 65 (discovery only): phrase alone. 75: phrase plus a populated student identifier field (student name/ID/number, DOB, USI, LUI, candidate number). 85: student field plus a populated enrolment field (program, course code, major, faculty, campus, term/semester, study load or mode, enrolment status/date, commencement date, credit points) plus independent enrolment evidence (full-time, part-time, census date, CRICOS, Commonwealth supported place, HECS-HELP, tuition, registrar). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:student\s+enrol(?:l)?ment(?:\s+(?:records?|forms?))?|enrol(?:l)?ment\s+(?:records?|verification|confirmation)|confirmation\s+of\s+enrol(?:l)?ment|student\s+registration|admission\s+record|course\s+registration)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated student identifier; 85 also needs an enrolment field and enrolment evidence. Handbooks, enrolment guides and statistics stay at 65.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - GDPR
  - FERPA
  - Higher Education Support Act 2003 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
    - census date
    - full-time
    - part-time
    - CRICOS
    - HECS-HELP
    - registrar
  proximity: 300
test_cases:
  should_match:
    - value: "Confirmation of enrolment\nStudent name: Avery Teston\nStudent ID: 40912876\nProgram: Bachelor of Nursing\nCampus: Kelvin Grove\nSemester: 2, 2026\nStudy load: Full-time (Commonwealth supported place)\nCensus date: 31/08/2026"
      description: Populated confirmation of enrolment with student, enrolment fields and enrolment evidence (85)
      synthetic: true
    - value: "Enrollment verification request\nStudent: Casey Rourke\nDate of birth: 22/11/2003"
      description: Verification request with labelled student fields only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "student grant"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how student enrollment records are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Student enrollment form\nStudent name: ____________________\nStudent ID: ____________________\nProgram: ____________________\nSemester: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: university student enrolment rose 4 percent this year, with course registration opening earlier and census date moved to the fourth week of semester."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Common words and phrases related to student enrollment records appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  This detector recognises student enrolment, enrolment verification and registration terminology and enforces only when populated student identifier fields sit nearby; phrase-only text stays at 65 discovery. A normal true positive is an identified learner's registration linking institution, program, status, contact, and eligibility details, which can support impersonation or unwanted profiling. Public enrollment instructions, catalogues, and blank forms may also match because the medium-confidence concept pattern does not verify a populated student file. Risk 8 SENSITIVE fits the individual education record, while PROTECTED requires a bulk registry, concealed vulnerable-student details, or significant-damage exposure.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, Personal-Privacy DLM, SENS_Pvc, and Medium
    classification for an attributable global enrollment record. The next PROTECTED level is not met because the
    detector does not establish bulk students, active safeguarding locations, systemic identity abuse, or significant
    damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium Personal-Privacy handling protects learner-to-institution linkage without assigning the same harm
      to public enrollment guidance and uncompleted registration forms.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_student_enrollment_records
      matches:
        - ref: Regex_global_top500_341_student_enrollment_records_student_fields
        - ref: Regex_global_top500_341_student_enrollment_records_enrolment_fields
        - ref: Keyword_global_top500_341_student_enrollment_records_enrolment_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_341_student_enrollment_records_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_student_enrollment_records
      matches:
        - ref: Regex_global_top500_341_student_enrollment_records_student_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_341_student_enrollment_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_student_enrollment_records
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_student_enrollment_records
      pattern: (?i)\b(?:student\s+enrol(?:l)?ment(?:\s+(?:records?|forms?))?|enrol(?:l)?ment\s+(?:records?|verification|confirmation)|confirmation\s+of\s+enrol(?:l)?ment|student\s+registration|admission\s+record|course\s+registration)\b
    - id: Regex_global_top500_341_student_enrollment_records_student_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|student(?:\s+name)?|pupil|child|candidate(?:\s+name)?|EQ\s*ID|LUI|USI|year\s+level|grade\s+level|parent(?:\s+name)?|guardian|carer|(?:student|candidate|enrolment|applicant|file)\s*(?:no\.?|number|ID)|home\s+group|class)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_341_student_enrollment_records_enrolment_fields
      pattern: (?i)\b(?:program(?:me)?|course(?:\s+code)?|major|faculty|campus|term|semester|intake|study\s+(?:load|mode)|enrol(?:l)?ment\s+(?:status|date|type)|commencement\s+date|attendance\s+type|credit\s+points|units?\s+enrolled)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_341_student_enrollment_records_enrolment_evidence
      groups:
        - match_style: word
          terms:
            - full-time
            - part-time
            - census date
            - tuition
            - CRICOS
            - Commonwealth supported place
            - HECS-HELP
            - withdrawal
            - registrar
      strength: specific
    - id: Keyword_global_top500_341_student_enrollment_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
