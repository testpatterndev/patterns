  date: '2026-09-24'
  description: "Quality pass (2026-09-24): rebuilt tiers - the old tiers were corroborated by the primary's own phrases and no positive reached an enforce tier. 75 now needs a populated student identifier and 85 needs student fields plus an enrolment field plus enrolment evidence. Primary tightened (dropped bare 'student ID', 'academic year', 'enrollment status', 'student intake'). Bare-phrase tests replaced with populated records plus policy, blank-form and news decoys. Regulations: removed AML/CTF Act, HRIPA, My Health Records Act, IPA and TIA Act; added FERPA and Higher Education Support Act 2003 (Cth); frameworks and references added."
- version: 1.2.1
  date: '2026-07-14'
