schema: testpattern/v1
name: Admissions review notes
slug: global-top500-350-admissions-review-notes
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies admissions review notes about individual applicants - admissions reviews, decisions, committee notes and files, applicant evaluations, ratings and rankings, reader notes, offers of admission and acceptance/rejection letters - when the phrase sits with populated applicant identifiers and evaluation fields.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: admission(s) review/decision/committee/notes/file/assessment, applicant evaluation/rating/ranking, enrolment decision, offer of admission, acceptance/rejection letter, reader notes/rating. 65 (discovery only): phrase alone. 75: phrase plus a populated applicant identifier field (applicant/student name or number, application ID, DOB). 85: identifier field plus a populated evaluation field (reviewer/reader/interviewer, academic/overall/interview rating or score, rank, ATAR, GPA, test scores, recommendation, outcome, committee vote) plus independent admissions evidence (admit, waitlist, deferred, holistic review, personal statement, extracurricular, first-generation, interview panel). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:admissions?\s+(?:review|decision|committee|notes?|file|assessment)|applicant\s+(?:evaluation|rating|ranking)|enrol(?:l)?ment\s+decision|offer\s+of\s+admission|(?:acceptance|rejection)\s+letter|reader\s+(?:notes|rating))\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated applicant identifier; 85 also needs an evaluation field and admissions evidence. Admissions policies, selection criteria pages and news stay at 65.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - GDPR
  - FERPA
data_categories:
- pii
corroborative_evidence:
  keywords:
    - waitlist
    - holistic review
    - personal statement
    - extracurricular
    - first-generation
    - interview panel
  proximity: 300
test_cases:
  should_match:
    - value: "Admissions committee notes - Round 2\nApplicant name: Avery Teston\nApplication ID: 2026-AD-44718\nReader 1: J. Staffson\nAcademic rating: 4/5\nInterview score: 38/40\nRecommendation: Admit - strong personal statement, first-generation applicant."
      description: Populated admissions committee notes with applicant, evaluation fields and admissions evidence (85)
      synthetic: true
    - value: "Admission decision letter prepared\nApplicant: Casey Rourke\nApplication number: 88120451"
      description: Decision letter note with labelled applicant fields only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "student grant"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how admissions committee notes are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Applicant evaluation form\nApplicant name: ____________________\nApplication ID: ____________________\nAcademic rating: ____________________\nRecommendation: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: the admissions committee will move to holistic review next year, and every offer of admission will be issued through the online portal."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Common words and phrases related to admissions review notes appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The detector finds admissions review, decision, committee and applicant-evaluation language and enforces only when populated applicant identifier fields sit nearby; phrase-only text stays at 65 discovery. Disclosure can expose subjective judgments, ranking factors, vulnerabilities, or disputed reasons and may bias reviewers, distress an applicant, or enable manipulation of an active selection process. The ordinary case affects one applicant or a limited cohort and causes serious privacy and opportunity harm without granting institutional access. Risk 8 and SENSITIVE are justified; PROTECTED would require a bulk applicant dossier, privileged decision-system compromise, or significant institution-wide damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_admissions_review_notes
      matches:
        - ref: Regex_global_top500_350_admissions_review_notes_applicant_fields
        - ref: Regex_global_top500_350_admissions_review_notes_evaluation_fields
        - ref: Keyword_global_top500_350_admissions_review_notes_admissions_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_350_admissions_review_notes_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_admissions_review_notes
      matches:
        - ref: Regex_global_top500_350_admissions_review_notes_applicant_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_350_admissions_review_notes_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_admissions_review_notes
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_admissions_review_notes
      pattern: (?i)\b(?:admissions?\s+(?:review|decision|committee|notes?|file|assessment)|applicant\s+(?:evaluation|rating|ranking)|enrol(?:l)?ment\s+decision|offer\s+of\s+admission|(?:acceptance|rejection)\s+letter|reader\s+(?:notes|rating))\b
    - id: Regex_global_top500_350_admissions_review_notes_applicant_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|student(?:\s+name)?|pupil|child|candidate(?:\s+name)?|EQ\s*ID|LUI|USI|year\s+level|grade\s+level|parent(?:\s+name)?|guardian|carer|(?:student|candidate|enrolment|applicant|file)\s*(?:no\.?|number|ID)|home\s+group|class|applicant(?:\s+name)?|application\s*(?:no\.?|number|ID))(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_350_admissions_review_notes_evaluation_fields
      pattern: (?i)\b(?:(?:reviewer|reader|assessor|interviewer)(?:\s+\d)?|(?:academic|overall|personal|interview)\s+(?:rating|score)|rating|score|rank(?:ing)?|ATAR|GPA|test\s+scores?|recommendation|outcome|committee\s+vote)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_350_admissions_review_notes_admissions_evidence
      groups:
        - match_style: word
          terms:
            - admit
            - waitlist
            - deferred
            - holistic review
            - personal statement
            - extracurricular
            - first-generation
            - interview panel
      strength: specific
    - id: Keyword_global_top500_350_admissions_review_notes_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
created: '2026-02-08'
updated: '2026-09-24'
changelog:
- version: 1.3.0
  date: '2026-09-24'
  description: "Quality pass (2026-09-24): rebuilt tiers - the old tiers were corroborated by the primary's own phrases and no positive reached an enforce tier. 75 now needs a populated applicant identifier and 85 needs applicant fields plus an evaluation field (reader, rating, score, recommendation) plus admissions evidence. Primary tightened (dropped generic 'selection criteria', 'applicant profile', 'interview notes'). Bare-phrase tests replaced with populated records plus policy, blank-form and news decoys. Regulations: removed AML/CTF Act, HRIPA, My Health Records Act, IPA and TIA Act; added FERPA; frameworks added; expired HESF 2015 reference replaced."
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1896 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical
    tier.
