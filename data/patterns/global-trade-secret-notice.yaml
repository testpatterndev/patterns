  - version: 1.6.0
    date: '2026-07-19'
    description: 'Profile quality: align the regex-backed detector type; replace alternative high paths with notice discovery, restricted-use medium, and ownership-obligation high tiers; add public/template adversarial probes.'
  - version: 1.5.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1087 without changing detector or package metadata.'
  - version: 1.5.0
