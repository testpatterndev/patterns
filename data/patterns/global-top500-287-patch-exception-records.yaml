schema: testpattern/v1
name: Patch exception records
slug: global-top500-287-patch-exception-records
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies patch and vulnerability exception records (deferrals, waivers, exemptions) that name affected assets, deferred patches/CVEs, expiry dates or approvers. Generic risk register, asset owner and remediation plan wording no longer matches.
operation: >-
  Regex_patch_exception_records (patch/patching exception/deferral/waiver/exemption (request/record/register/form), vulnerability exception/waiver, security exception request/record/register, remediation exception/deferral) is discovery-only at 65. 75 requires one structure: an affected host/IP/asset ID, a deferred patch reference (CVE, KB, MS bulletin), a dated expiry/review/deferred-until field, or a named approver/risk owner. 85 requires two distinct structures plus justification wording (compensating control, risk acceptance, segmentation, application control, end of support, business justification). Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: (?i)\b(?:patch(?:ing)?\s+(?:exception|deferral|waiver|exemption)s?(?:\s+(?:request|record|register|form)s?)?|vulnerability\s+(?:exception|waiver|remediation\s+exception)s?|security\s+exception\s+(?:request|record|register)s?|remediation\s+(?:exception|deferral)s?)\b
confidence: medium
confidence_justification: >-
  Medium confidence: exception wording is discovery-only; enforcement requires asset, patch reference, expiry or approver structure, and 85 adds a second structure and justification context.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - Essential Eight
  - ISO 27001
  - NIST CSF
data_categories:
  - security
  - technology
corroborative_evidence:
  keywords:
    - compensating control
    - risk acceptance
    - network segmentation
    - end of support
    - business justification
  proximity: 300
test_cases:
  should_match:
    - value: |-
        Patch exception request - SCADA historian
        Asset: hist01.ot.example.internal (10.12.5.20)
        Deferred patches: KB5034441, CVE-2024-21412
        Business justification: vendor certification for the historian build is pending until the March outage.
        Compensating control: host isolated in the OT DMZ with application control enforced.
        Approved by: Renee Caldwell (risk owner)   Expiry date: 31/03/2027
      description: High tier (85) - asset host/IP, deferred KB/CVE, approver and expiry with compensating control justification
      synthetic: true
    - value: 'Vulnerability exception for the legacy kiosk: expires 30/06/2027, reviewed quarterly by the service owner.'
      description: Medium tier (75) - expiry date only
      synthetic: true
    - value: Patch deferral record - KB5031356 held back on the finance terminal servers.
      description: Medium tier (75) - patch reference only
      synthetic: true
    - value: The patch exception register is reviewed at the monthly security meeting.
      description: Discovery tier (65) - exception wording only
      synthetic: true
  should_not_match:
    - value: The asset owner updated the risk register.
      description: Generic risk/asset wording is no longer a primary
    - value: 'Policy statement: a patch exception must be approved by the CISO and reviewed every 90 days; this policy requires compensating controls.'
      description: Policy text
    - value: |-
        Patch exception form template
        Asset: ______
        CVE: ______
        Approved by: ______
        Expiry date: ______
      description: Blank template
    - value: 'News report: the auditor found agencies had open patch exceptions with no compensating controls, reviewed 01/07/2026.'
      description: News framing
false_positives:
  - description: Patch management policies and audit reports describe exception processes and approval requirements.
    mitigation: Exception wording is discovery-only; enforcement needs asset, patch, expiry or approver structure, and policy/news/template framing is excluded.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_patch_exception_records
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_affected_asset
            - Evidence_patch_reference
            - Evidence_expiry_date
            - Evidence_approver
        - ref: Keyword_exception_justification
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_patch_exception_records
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_affected_asset
            - Evidence_patch_reference
            - Evidence_expiry_date
            - Evidence_approver
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_patch_exception_records
  regexes:
    - id: Regex_patch_exception_records
      pattern: (?i)\b(?:patch(?:ing)?\s+(?:exception|deferral|waiver|exemption)s?(?:\s+(?:request|record|register|form)s?)?|vulnerability\s+(?:exception|waiver|remediation\s+exception)s?|security\s+exception\s+(?:request|record|register)s?|remediation\s+(?:exception|deferral)s?)\b
    - id: Evidence_affected_asset
      pattern: (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:hostname|host|server|asset\s+ID|device\s+ID|node|instance)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._-]{2,63}
    - id: Evidence_patch_reference
      pattern: \b(?:CVE-\d{4}-\d{4,7}|KB\d{6,7}|MS\d{2}-\d{3})\b
    - id: Evidence_expiry_date
      pattern: (?i)\b(?:expiry|expires|expiration|exception\s+end|review|valid\s+until|deferred\s+until|re-?assess(?:ment)?)\s{0,3}(?:date|by|on)?\s{0,3}[:=]?\s{0,3}(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s{1,3}(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s{1,3}\d{4})
    - id: Evidence_approver
      pattern: (?i)\b(?:approved\s+by|risk\s+owner|approver|accepted\s+by|asset\s+owner)\s*[:#=|]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][a-z'-]{1,20}\s+[A-Z][A-Za-z'-]{1,30}
  keywords:
    - id: Keyword_exception_justification
      groups:
        - match_style: word
          terms:
            - compensating control
            - risk acceptance
            - network segmentation
            - application control
            - end of support
            - vendor certification
            - business justification
            - text: EDR
              case_sensitive: true
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
risk_description: >-
  The detector identifies patch and vulnerability exception records when affected assets, deferred CVE/KB references, expiry dates or approvers are present; exception wording alone is discovery-only. A genuine exception can tell an adversary which assets remain vulnerable, why patching was delayed, what controls substitute for remediation, and when the exception expires. The affected scope is the named systems and accountable teams, while policy templates and generic risk-register discussions can match without exposing a live weakness. Risk 8 SENSITIVE reflects serious contained targeting value; PROTECTED would require a broad critical-service exception set or significant demonstrated damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because active patch-exception
    records disclose known residual weaknesses and mitigation gaps. PROTECTED is not met without proof of
    critical-system scope, live exploitability, broad coverage, or significant consequence.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic handling is Medium with Medium InfoTech controls for patch exceptions, limiting access to owners, security
      teams, and approved risk decision-makers. High is reserved for exception registers exposing critical or
      organisation-wide unpatched infrastructure.
created: '2026-02-08'
updated: '2026-09-25'
changelog:
  - version: 1.3.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): narrowed the primary to patch/vulnerability/security exception, deferral and waiver records (removed risk acceptance, compensating control, risk register, asset owner, remediation plan and change advisory, which matched unrelated governance text); 75 requires an affected host/asset, deferred CVE/KB reference, dated expiry or named approver and 85 requires two distinct structures plus justification wording (the removed primary terms now serve as independent 85 evidence); guidance/news/training exclusion added; bare-phrase tests replaced with a synthetic exception record and decoys. Replaced GDPR with Criminal Code Act 1995 (Cth); added Essential Eight/ISO 27001/NIST CSF frameworks and verified NIST SP 800-40r4, Essential Eight and ISM references; data_categories credentials -> technology.'
  - version: 1.2.2
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1838 without changing detector or package metadata.'
  - version: 1.2.1
    date: '2026-07-12'
    description: 'Baseline burn-down: mark the no-evidence 65 tier discovery_only — it is a broad inventory tier by shape (id_match only, no required evidence), so bare topic fragments correctly surface in discovery rather than counting as classification; aligns with corpus convention and clears the should_not_match failure + check:quality discoveryMissing informational. No compiled detection change (discovery_only is harness/quality metadata).'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
