    url: https://dcj.nsw.gov.au/documents/service-providers/domestic-and-family-violence-services/Domestic-Violence-Safety-Assessment-Tool.pdf
  - title: Queensland Government — CRASF Level 2 DFV risk assessment tool
    url: https://www.publications.qld.gov.au/dataset/2dc310f9-4ba2-456e-a280-58df0e2a37ca/resource/c2c68111-6c6a-49f0-8966-afa848dbe493/download/common-risk-safety-framework-level-2-tool.pdf
  - title: Victorian Government — MARAM Practice Guides Responsibility 3 (brief risk assessment tool)
    url: https://www.vic.gov.au/sites/default/files/2020-05/PG%20Responsibility%203.pdf
  - title: WA — CRARMF Practice Tool 2 Common risk assessment tool
    url: https://www.wa.gov.au/system/files/2021-10/CRARMF-Practice-Tool-2-Common-risk-assessment-tool.pdf
  - title: Queensland Government — DFV Common Risk and Safety Framework
    url: https://www.families.qld.gov.au/our-work/domestic-family-sexual-violence/for-service-providers/integrated-service-responses/dfv-common-risk-safety-framework
  - title: NSW DCJ — Domestic Violence Safety Assessment Tool guide
    url: https://dcj.nsw.gov.au/documents/service-providers/domestic-and-family-violence-services/Domestic-Violence-Safety-Assessment-Tool-Guide.pdf
  - title: WA — Family and Domestic Violence Common Risk Assessment and Risk Management Framework
    url: https://www.wa.gov.au/government/document-collections/western-australian-family-and-domestic-violence-common-risk-assessment-and-risk-management-framework
  - title: SA Office for Women — Family Safety Framework
    url: https://officeforwomen.sa.gov.au/family-safety-framework
