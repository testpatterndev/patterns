schema: testpattern/v1
name: Domestic and Family Violence Risk Assessment or Safety Plan
slug: au-dfv-risk-assessment
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects completed domestic and family violence (DFV) risk assessments, safety plans and
  multi-agency risk meeting records for an identified person, across Australian frameworks: Qld
  Common Risk and Safety Framework (CRASF), QPS Domestic Violence Protective Assessment Framework
  (DV-PAF) and High Risk Teams; NSW Domestic Violence Safety Assessment Tool (DVSAT) and Safety
  Action Meetings; Vic MARAM; WA CRARMF; SA and NT Family Safety Framework meetings and Positive
  Action Plans; NT RAMF Common Risk Assessment Tool; and generic DFV risk assessments and safety
  plans.
operation: >-
  Primary: any of two regexes — a case-insensitive framework/tool/meeting/assessment phrase, or a
  case-sensitive framework acronym (CRASF, DVSAT, DV-PAF, MARAM, CRARMF). Ambiguous acronyms
  (SAM, HRT, FSM, RAST, CRAT) are deliberately excluded. 75 tier requires a populated risk level
  (serious threat, at threat, high, elevated, category 1/2 …) and a populated party field
  (victim-survivor, person using violence, aggrieved, respondent, client …) within 300
  characters. 85 tier additionally requires an evidence-based risk indicator (strangulation,
  threats to kill, access to weapons, recent separation, pregnancy, stalking, sexual violence,
  coercive control, escalation, suicide threats, harm to animals). All tiers exclude
  template/fixture text. 65 is discovery-only.
pattern: >-
  (?i)\b(?:common\s+risk\s+and\s+safety\s+framework|domestic\s+violence\s+safety\s+assessment\s+tool|domestic\s+violence\s+protective\s+assessment\s+framework|multi-agency\s+risk\s+assessment\s+and\s+management|common\s+risk\s+assessment\s+and\s+risk\s+management\s+framework|common\s+risk\s+assessment\s+tool|family\s+safety\s+(?:framework|meeting)|safety\s+action\s+meeting|high\s+risk\s+team|positive\s+action\s+plan|victim\s+survivor\s+(?:brief|intermediate|comprehensive)\s+risk\s+assessment|(?:DFV|FDV|domestic(?:\s+and\s+family)?\s+violence|family(?:\s+and\s+domestic)?\s+violence)\s+(?:risk\s+assessment|safety\s+assessment|safety\s+plan|risk\s+management\s+plan|(?:routine\s+)?screening))\b|\b(?:CRASF|DVSAT|DV-PAF|MARAM|CRARMF)\b
confidence: medium
confidence_justification: >-
  Medium: framework names appear heavily in guidance and training, and framework manuals contain
  example risk levels. Enforce tiers therefore need both a populated risk level and a populated
  party field; 85 adds a risk indicator. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
regulations:
  - Domestic and Family Violence Protection Act 2012 (Qld)
  - Crimes (Domestic and Personal Violence) Act 2007 (NSW)
  - Family Violence Protection Act 2008 (Vic)
  - Restraining Orders Act 1997 (WA)
  - Domestic and Family Violence Act 2007 (NT)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - pii
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - risk level
    - serious threat
    - safety plan
    - victim-survivor
    - person using violence
    - non-fatal strangulation
    - threats to kill
    - high risk team
  proximity: 300
  keyword_lists:
    - au-dfv-terminology
test_cases:
  should_match:
    - value: "DFV risk assessment (CRASF)\nVictim-survivor: Avery Teston\nPerson using violence: Jordan Teston\nRisk level: High\nRisk indicators: non-fatal strangulation (June 2026), threats to kill, recent separation. Referred to High Risk Team."
      description: Queensland CRASF-aligned assessment with indicators
      synthetic: true
    - value: 'DVSAT completed 03/09/2026. Person in need of protection: Jamie Teston. Defendant: Alex Teston. Outcome: serious threat. Defendant has access to firearms and has been stalking the victim. Referred to Safety Action Meeting.'
      description: NSW DVSAT with serious threat outcome
      synthetic: true
    - value: "MARAM comprehensive assessment\nClient: Morgan Teston\nAssessed risk: elevated risk\nNotes: client is pregnant; escalation in frequency of physical violence since separation."
      description: Victorian MARAM assessment
      synthetic: true
    - value: "Domestic Violence Safety Assessment Tool\nClient's name: Jamie Teston\nClient's date of birth: 02/03/1990\nHas your partner ever threatened to harm or kill you? Yes\nTotal number of indicators: 13\nThreat Level: At serious threat\nAction Required: referral to a Safety Action Meeting"
      description: Completed NSW DVSAT laid out like the published form
      synthetic: true
    - value: "Domestic and family violence risk assessment tool\nPart 1: Victim-survivor information\nPuV details (if known): Casey Teston\nPart 3: Risk Assessment Summary\nLevel of risk: High Risk - at high risk of lethality or serious harm. Strangulation reported in August.\nReferral to High Risk Team"
      description: Completed Qld CRASF Level 2 assessment laid out like the published tool
      synthetic: true
    - value: "Family Safety Meeting - Positive Action Plan\nProtected person: Sam Teston\nRespondent: Casey Teston\nThreat level: high\nActions: police to prioritise response to address; housing to expedite transfer."
      description: SA/NT Family Safety Meeting action plan
      synthetic: true
  should_not_match:
    - value: 'The Common Risk and Safety Framework describes three risk levels. Risk level: high means the victim-survivor is at risk of serious harm; practitioners should refer to a High Risk Team.'
      description: Framework guidance with an example risk level
    - value: "DFV risk assessment\nVictim-survivor: __________\nPerson using violence: __________\nRisk level: [ ] Low  [ ] Medium  [ ] High"
      description: Blank assessment form
    - value: "Domestic Violence Safety Assessment Tool\nClient's name: ____________\nRisk indicator | Yes | No | Unknown | Refused to answer\nThreat Level: At threat / At serious threat"
      description: Blank DVSAT form
    - value: 'Patient: Morgan Teston. HRT review. Risk level: low. Continue current dose and review in six months.'
      description: Clinical note using the HRT acronym
false_positives:
  - description: Framework manuals, practice guides and training scenarios.
    mitigation: Enforce tiers require a populated party field with a proper name; guidance and scenario text rarely provide one. Training scenarios with fictional names can still match.
  - description: Non-DFV clinical or workplace risk assessments.
    mitigation: Primary requires a DFV-specific framework, tool or qualifier; ambiguous acronyms are excluded.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match:
        type: any
        ids:
          - Regex_dfv_risk_framework
          - Regex_dfv_risk_framework_acronym
      matches:
        - ref: Regex_dfv_risk_level
        - ref: Regex_dfv_risk_party_field
        - ref: Regex_dfv_risk_indicator
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match:
        type: any
        ids:
          - Regex_dfv_risk_framework
          - Regex_dfv_risk_framework_acronym
      matches:
        - ref: Regex_dfv_risk_level
        - ref: Regex_dfv_risk_party_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Regex_dfv_risk_framework
          - Regex_dfv_risk_framework_acronym
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_dfv_risk_framework
      pattern: >-
        (?i)\b(?:common\s+risk\s+and\s+safety\s+framework|domestic\s+violence\s+safety\s+assessment\s+tool|domestic\s+violence\s+protective\s+assessment\s+framework|multi-agency\s+risk\s+assessment\s+and\s+management|common\s+risk\s+assessment\s+and\s+risk\s+management\s+framework|common\s+risk\s+assessment\s+tool|family\s+safety\s+(?:framework|meeting)|safety\s+action\s+meeting|high\s+risk\s+team|positive\s+action\s+plan|victim\s+survivor\s+(?:brief|intermediate|comprehensive)\s+risk\s+assessment|(?:DFV|FDV|domestic(?:\s+and\s+family)?\s+violence|family(?:\s+and\s+domestic)?\s+violence)\s+(?:risk\s+assessment|safety\s+assessment|safety\s+plan|risk\s+management\s+plan|(?:routine\s+)?screening))\b
    - id: Regex_dfv_risk_framework_acronym
      pattern: \b(?:CRASF|DVSAT|DV-PAF|MARAM|CRARMF)\b
    - id: Regex_dfv_risk_level
      pattern: >-
        (?i)\b(?:risk\s+(?:level|rating|category|outcome)|level\s+of\s+(?:FDV\s+)?risk|assessed\s+risk|assessment\s+outcome|outcome|threat\s+level|fear\s+level)\s*[:\-]?\s*(?:at\s+serious\s+threat|serious\s+threat|at\s+threat|serious\s+risk|elevated(?:\s+risk)?|at\s+(?:high\s+|imminent\s+)?risk|very\s+high|high(?:\s+risk)?|extreme|imminent(?:\s+risk)?|medium|moderate|low|category\s+[12]|very\s+fearful|fearful|terrified)\b
    - id: Regex_dfv_risk_party_field
      pattern: >-
        (?i)\b(?:victim(?:-survivor|\s+survivor)?(?:'s)?|person\s+using\s+violence|PuV|perpetrator|aggrieved(?:\s+(?:person|party))?|respondent|protected\s+person|person\s+in\s+need\s+of\s+protection|PINOP|affected\s+family\s+member|affected\s+person|defendant|client(?:'s)?|participant)(?:\s+(?:name|details))?(?:\s*\([^)]{1,20}\))?\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}
    - id: Regex_dfv_risk_indicator
      pattern: >-
        (?i)\b(?:non-fatal\s+strangulation|strangl(?:ed|ing|ation)|chok(?:ed|ing)|suffocat(?:ed|ing|ion)|threat(?:s|ened)?\s+to\s+(?:harm\s+or\s+)?kill|access\s+to\s+(?:a\s+)?(?:firearms?|weapons?)|(?:recent|pending)\s+separation|since\s+separation|pregnan(?:t|cy)|escalat(?:ion|ing)|stalk(?:ed|ing)|sexual\s+(?:assault|violence)|coercive\s+control|threat(?:s|ened)?\s+(?:of\s+)?suicide|harm(?:ed)?\s+to\s+(?:pets|animals))\b
risk_rating: 9
risk_description: >-
  The detector identifies a completed DFV risk assessment, safety plan or multi-agency risk meeting
  record for identified people. These records hold the most detailed picture of the danger a
  victim-survivor faces — lethality indicators such as strangulation, threats to kill and weapon
  access, children, pregnancy, and the agencies' safety actions — and are shared under statutory
  information-sharing schemes. Disclosure to the person using violence can defeat the safety plan
  and escalate lethal risk. Guidance, blank forms and non-DFV clinical assessments are excluded from
  enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy; assessments that also disclose a refuge
  or concealed address are covered by au-dfv-confidential-address at PROTECTED.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
