schema: testpattern/v1
name: Sensitive network topology diagrams
slug: global-top500-285-sensitive-network-topology-diagrams
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies sensitive network topology diagrams patterns in security and access control contexts. Detects potential
  exposure of sensitive security information in international systems.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 9 keywords within 300 characters. Keyword lists: pii-personal. Uses additional domain-context
  evidence and explicit exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:network\s+topology|network\s+diagram|network\s+architecture|ip\s+addressing|routing\s+table|network\s+segment|infrastructure\s+diagram|network\s+map|data\s+center\s+layout)\b
confidence: medium
confidence_justification: structural regex with domain-specific anchors and constrained context replaces phrase-only marker.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
- GDPR
data_categories:
- credentials
- security
corroborative_evidence:
  keywords:
  - sensitive network topology diagrams
  - sensitive
  - network
  - topology
  - diagrams
  - security
  - operations
  - threat
  - data
  proximity: 300
  keyword_lists:
  - pii-personal
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
  - value: network topology
    description: Primary topic phrase match
  - value: network diagram
    description: Case-insensitive topic phrase match
  - value: network architecture
    description: Alternative topic phrase match
  - value: ip addressing
    description: Additional topic phrase match
  - value: "network topology\nHost: fw01.corp 10.20.30.40\nRule 14: allow tcp/443 from 10.20.0.0/16\nFinding: CVE-2025-21298 unpatched on asset ID WS-004471."
    description: Populated tech record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: network diagram dmz
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about network topology are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Authentication-related terminology in software documentation, security training materials, or system architecture
    descriptions without actual credentials.
  mitigation: Require proximity to credential-specific patterns (API keys, connection strings, tokens) rather than general
    security terminology.
- description: Code snippets and configuration examples containing credential-related keywords or placeholder values in developer
    documentation.
  mitigation: Check for common placeholder patterns (example.com, localhost, 0000) and documentation file types to reduce
    false positives from technical writing.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_network_topology_diagrams
      matches:
        - ref: Regex_global_top500_285_sensitive_network_topology_diagrams_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_network_topology_diagrams
      matches:
        - ref: Regex_global_top500_285_sensitive_network_topology_diagrams_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_network_topology_diagrams
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_network_topology_diagrams
      pattern: (?is)\b(?:network\s+topology|network\s+diagram|network\s+architecture|ip\s+addressing|routing\s+table|network\s+segment|infrastructure\s+diagram|network\s+map|data\s+center\s+layout)\b
    - id: Regex_global_top500_285_sensitive_network_topology_diagrams_record_structure
      pattern: >-
        (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\bCVE-\d{4}-\d{4,7}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:tcp|udp)\s*/?\s*\d{2,5}\b|\b(?:port|dport|sport)\s*[:=]?\s*\d{2,5}\b|\b(?:hostname|host|asset\s+ID|device\s+ID|sAMAccountName|UPN|username|account\s+name)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._\\@-]{2,63}
risk_description: The regex identifies network topology, architecture, addressing, routing, segmentation, data-centre layout,
  and infrastructure-diagram terminology, signalling a topology record rather than validating an image format. A genuine diagram
  can expose trust boundaries, internal routes, key systems, and concentration points that make reconnaissance and attack
  planning materially easier. The normal scope is one environment or data centre and its operators, while public reference
  architectures and training diagrams remain benign possibilities. Risk 8 SENSITIVE is appropriate for a detailed internal
  map; PROTECTED would require critical-infrastructure coverage, protected operations, or a scale capable of significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
frameworks:
  - ISO 27001
  - NIST CSF
