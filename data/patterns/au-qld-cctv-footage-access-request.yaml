schema: testpattern/v1
name: Queensland Council CCTV Footage Access Request and Release Record
slug: au-qld-cctv-footage-access-request
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Council records of requests for CCTV footage and of footage released: request forms from residents, insurers and businesses, police requests, and release registers or logs recording the camera, the footage period, the incident or Queensland Police Service (QPS) reference, and who received the footage. No Queensland statute deals specifically with council CCTV. Councils handle footage as personal information under the Information Privacy Act 2009 and their CCTV policy. A disclosure to a law enforcement agency relies on QPP 6.2(e) (disclosure reasonably necessary for enforcement-related activities), and QPP 6.5 requires the agency to make a written note of that disclosure. That note is the basis of the release register. Council CCTV policies, published camera location lists, legislation and news are decoys.
operation: >-
  Primary: CCTV / camera / video / surveillance / security camera footage request(s), access request(s), release, disclosure, application, register or log; request(s) for / to view / to access / to obtain (CCTV / camera / video) footage; footage request(s) / release / disclosure (form / register / log / record); CCTV request(s) / release / disclosure / access (form / register / log / record); release of (CCTV / camera / video) footage. 65 is discovery-only (primary alone). 75 requires, within 300 characters, one populated structure and independent context. The structure is a footage field (camera [ID / no. / number / name / location / site / reference], recording date / time / period, footage date / time / period / timeframe / duration / start / end, date / time (and time) of footage / recording / incident, time range / period / window, start time, end time, timestamp, period requested), a requester or recipient field (requested by, requester / requestor, applicant (name), released / provided to, recipient, requesting officer, QPS / police officer, officer name / collecting, collected by, person depicted / identified / of interest, insurer, followed by a name, street address, phone number or email) or a labelled QPS / police / QPRIME / occurrence / incident / event / job reference or number with a digit-bearing value. The context is QPS, Queensland Police Service, police, Information Privacy Act, QPP 6, law enforcement, council, insurance claim, incident or offence. 85 requires the footage field AND either the requester / recipient field or the incident reference AND the same context. Field values are on the same line as the label and placeholder-guarded. Enforce tiers AND NOT the shared template-exclusion dictionary and a policy exclusion (this policy / procedure / guideline / fact sheet, frequently asked questions, how to request / apply, annual report, camera locations, CCTV network map, legislation.qld.gov.au).
pattern: >-
  (?i)\b(?:(?:CCTV|camera|video|surveillance|security\s+camera)\s+footage\s+(?:requests?|access\s+requests?|release|disclosure|application|register|log)|requests?\s+(?:for|to\s+(?:view|access|obtain))\s+(?:(?:CCTV|camera|video)\s+)?footage|footage\s+(?:requests?|release|disclosure)(?:\s+(?:form|register|log|record))?|CCTV\s+(?:requests?|release|disclosure|access)(?:\s+(?:form|register|log|record))?|release\s+of\s+(?:(?:CCTV|camera|video)\s+)?footage)\b
confidence: medium
confidence_justification: >-
  Medium. Footage request and release wording is distinctive, but council CCTV policies and web pages use the same words. Enforce tiers therefore need populated camera, footage-period, requester or incident-reference fields. Camera IDs and QPS occurrence numbers have no verified public format, so they are loose label-anchored values. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - IPA 2009 (Qld) sch 3 QPP 6.2(e), QPP 6.5
  - Council CCTV policy (no specific statute)
frameworks:
  - QGISCF
data_categories:
  - pii
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - Queensland Police Service
    - QPS
    - police
    - Information Privacy Act
    - law enforcement
    - council
    - insurance claim
    - incident
  proximity: 300
customisation:
  - key: qps-occurrence-number
    kind: identifier-format
    identifier: qps-occurrence-number
    target: purview.regexes/Regex_au_qld_cctv_request_incident_reference
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's qps occurrence / police reference number format (see docs/identifiers.md#qps-occurrence-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "CCTV footage release register - Harbourview Regional Council\nRequest number: CR-2026-0142\nRequested by: Senior Constable Jess Teston, Queensland Police Service\nQPS reference: QP2600913345\nCamera ID: CAM-044 (Flinders Street Mall east)\nFootage period: 14/09/2026 22:00 to 22:45\nReleased to: Jess Teston on USB, 16/09/2026\nDisclosure basis: QPP 6.2(e) law enforcement"
      description: Release register entry to QPS with camera, footage period, officer and QPS reference (85 tier)
      synthetic: true
    - value: "Request for CCTV footage - council customer service\nApplicant name: Pat Staffson\nPhone: 0413 555 776\nDate and time of incident: 02/09/2026 approx 7:15 pm\nCamera location: Council car park level 2\nReason: vehicle damaged in car park, insurance claim lodged"
      description: Resident footage request with applicant details, incident time and camera (85 tier)
      synthetic: true
    - value: "Police request to view CCTV footage.\nTimestamp: 21/08/2026 01:32\nQueensland Police Service attended the council operations centre to view the recording."
      description: Police viewing request with a timestamp only (75 tier)
      synthetic: true
    - value: "Footage release log: incident number 2026-11873, copy provided to police on 05/09/2026."
      description: Release log line with an incident number only (75 tier)
      synthetic: true
  should_not_match:
    - value: "This policy sets out how council manages requests for CCTV footage. Requests for footage from the Queensland Police Service are assessed under QPP 6.2(e) of the Information Privacy Act 2009 and each release is recorded in the CCTV release register."
      description: Council CCTV policy (policy exclusion)
    - value: "6.5 If an agency uses or discloses personal information in accordance with QPP 6.2(e), the agency must make a written note of the use or disclosure."
      description: IPA sch 3 QPP 6.5 text (legislation)
    - value: "CCTV footage request form - blank template\nApplicant name: ____________\nCamera location: ____________\nDate and time of incident: ____________\nQPS reference: ____________"
      description: Blank footage request form
    - value: "Public safety CCTV network - camera locations\nCamera ID: CAM-044 Location: Flinders Street Mall east\nCamera ID: CAM-045 Location: Victoria Bridge\nFor footage requests, contact council."
      description: Published camera location list (policy exclusion)
    - value: "Council released CCTV footage to police after the assault in the mall, and handled 214 footage requests last year, a council spokesperson said."
      description: News and statistics (65 only)
false_positives:
  - description: Council CCTV policies, procedures and web pages describe footage requests, release to QPS and the release register.
    mitigation: Enforce tiers need populated camera, footage-period, requester or incident fields. A policy exclusion suppresses policy, procedure, FAQ and how-to text.
  - description: Published lists of public safety camera locations with camera IDs.
    mitigation: A camera-locations / network-map exclusion keeps them below enforce tiers.
  - description: QPS and other agency records about footage they hold themselves.
    mitigation: These can reach 75 if they carry a footage field and police context. They are still personal information about an incident, but deploy at 85 if volume is a concern. global-top500-408-surveillance-video-evidence covers footage used as evidence.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_cctv_request_primary
      matches:
        - ref: Regex_au_qld_cctv_request_footage_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_cctv_request_party_field
            - Regex_au_qld_cctv_request_incident_reference
        - ref: Keyword_au_qld_cctv_request_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_cctv_request_policy_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_cctv_request_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_cctv_request_footage_field
            - Regex_au_qld_cctv_request_party_field
            - Regex_au_qld_cctv_request_incident_reference
        - ref: Keyword_au_qld_cctv_request_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_cctv_request_policy_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_cctv_request_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_cctv_request_primary
      pattern: >-
        (?i)\b(?:(?:CCTV|camera|video|surveillance|security\s+camera)\s+footage\s+(?:requests?|access\s+requests?|release|disclosure|application|register|log)|requests?\s+(?:for|to\s+(?:view|access|obtain))\s+(?:(?:CCTV|camera|video)\s+)?footage|footage\s+(?:requests?|release|disclosure)(?:\s+(?:form|register|log|record))?|CCTV\s+(?:requests?|release|disclosure|access)(?:\s+(?:form|register|log|record))?|release\s+of\s+(?:(?:CCTV|camera|video)\s+)?footage)\b
    - id: Regex_au_qld_cctv_request_footage_field
      pattern: >-
        (?i)\b(?:camera(?:\s+(?:ID|no\.?|number|name|location|site|reference))?|recording\s+(?:date|time|period)|footage\s+(?:date|time|period|timeframe|duration|start|end)|(?:date|time)\s+(?:and\s+time\s+)?of\s+(?:the\s+)?(?:footage|recording|incident)|time\s+(?:range|period|window)|start\s+time|end\s+time|timestamp|period\s+requested)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|nil|none|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9 :./,'()-]{2,60}
    - id: Regex_au_qld_cctv_request_party_field
      pattern: >-
        (?i)\b(?:requested\s+by|requester|requestor|applicant(?:\s+name)?|released\s+to|provided\s+to|recipient|requesting\s+officer|(?:QPS|police)\s+officer|officer\s+(?:name|collecting)|collected\s+by|person\s+(?:depicted|identified|of\s+interest)|insurer)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not|none|nil|redacted|suppressed|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:(?:(?:Mr|Mrs|Ms|Miss|Dr|Sgt|Const|Det)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:\+?61[ \t]?|0)[2-478](?:[ \t-]?\d){8}|[A-Z0-9._%+-]{1,40}@[A-Z0-9-]{1,40}\.[A-Z.]{2,20})
    - id: Regex_au_qld_cctv_request_incident_reference
      pattern: >-
        (?i)\b(?:QPS|police|QPRIME|occurrence|incident|event|job)\s+(?:ref(?:erence)?|no\.?|number|#)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{4,20}\b
    - id: Regex_au_qld_cctv_request_policy_exclusion
      pattern: >-
        (?i)(?:\bthis\s+(?:policy|procedure|guideline|fact\s?sheet)\b|\bfrequently\s+asked\s+questions\b|\bhow\s+to\s+(?:request|apply)\b|\bannual\s+report\b|\bcamera\s+locations\b|\bCCTV\s+network\s+map\b|\blegislation\.qld\.gov\.au\b)
  keywords:
    - id: Keyword_au_qld_cctv_request_context
      groups:
        - match_style: word
          terms:
            - Queensland Police Service
            - text: QPS
              case_sensitive: true
            - police
            - Information Privacy Act
            - QPP 6
            - law enforcement
            - council
            - regional council
            - city council
            - insurance claim
            - incident
            - offence
      strength: specific
risk_rating: 5
risk_description: >-
  The classifier identifies council CCTV footage requests and release records that tie a camera and footage period to an incident, a QPS or incident reference, and a named requester or recipient. These records show who was involved in, reported or was investigated for an incident, and where and when, and they document disclosures to police under QPP 6.2(e). Release logs also show which footage exists, which matters while an investigation is live. Policies, published camera location lists, legislation, blank forms and news are excluded from enforce tiers. Risk 5 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: Information Privacy Act 2009 (Qld) - sch 3 QPP 6 use or disclosure, QPP 6.5 written note of disclosure
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release. Council CCTV footage requests and release registers (IPA 2009 QPP 6.2(e) and 6.5; no specific statute). 75 requires one populated camera / footage-period, requester / recipient or incident-reference field plus police, privacy or council context. 85 requires the footage field plus a requester / recipient or incident reference plus context. Policies and published camera location lists are excluded.
