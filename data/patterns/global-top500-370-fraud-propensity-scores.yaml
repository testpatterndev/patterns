schema: testpattern/v1
name: Fraud propensity scores
slug: global-top500-370-fraud-propensity-scores
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects fraud propensity score outputs: a fraud score / fraud risk score phrase combined with populated scoring data - rows keyed by a transaction or account identifier, labelled fraud scores, decisions or reason codes, or labelled account/transaction identifiers. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: fraud propensity/risk/probability/model score(s), fraud score(s), fraud scoring outputs/results/exports, risk-scored transactions, transaction risk score(s). 65 (discovery only): primary alone. 75: primary plus one populated structure - a delimited data row keyed by a transaction/account identifier with a numeric value, a labelled fraud score/risk score/model score, decision (decline, review, step-up, hold, block, approve) or reason code, or a labelled customer/account/transaction ID. 85: primary plus two distinct structures (the three above or a delimited column header pairing a transaction/account ID column with fraud score, risk score, decision, reason code or rule-hit columns) plus fraud-signal evidence (device fingerprint, velocity, mule account, account takeover, chargeback, card not present, geolocation mismatch, new payee, rule hit, step-up authentication, scam). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: >-
  (?i)\b(?:fraud\s+(?:propensity|risk|probability|model)\s+scores?|fraud\s+scores?|fraud\s+scoring\s+(?:outputs?|results?|exports?)|risk[\s-]scored\s+transactions?|transaction\s+risk\s+scores?)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated dataset structure (a data row keyed by a customer/record identifier, a labelled value or a labelled identifier) beside the topic phrase; a column header on its own only counts toward 85, so blank extracts stay at 65. Help pages, policies, product copy and news that only name the topic stay at 65. Medium because fraud-operations runbooks and internal analytics documentation with worked examples can still reach 75.
jurisdictions:
  - global
regulations:
  - AML/CTF Act (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - device fingerprint
    - velocity
    - mule account
    - account takeover
    - chargeback
    - card not present
    - geolocation mismatch
    - new payee
    - rule hit
    - step-up authentication
  proximity: 300
test_cases:
  should_match:
    - value: "Fraud risk scores - card-not-present queue 12/09/2026\ntxn_id,account_id,amount,fraud_score,decision,reason_codes\nT88120441,A4471820,1890.00,0.94,decline,R07|R12\nT88120452,A4471820,15.00,0.31,approve,\nDevice fingerprint mismatch and velocity rule hit on new payee."
      description: Scoring extract - header, transaction rows and fraud-signal evidence (85)
      synthetic: true
    - value: "Fraud score review\nCustomer ID: A4471820\nHeld pending call with the customer."
      description: Single labelled customer identifier (75)
      synthetic: true
  should_not_match:
    - value: "Policy guidance: fraud scores range from 0 to 1000 and transactions above the threshold go to manual review. Analysts must document the reason for every override."
      description: Fraud-operations guidance
      synthetic: true
    - value: "Fraud scoring output\ntxn_id,account_id,amount,fraud_score,decision\n"
      description: Blank extract - column header only (65)
      synthetic: true
    - value: "Banks said fraud scores now flag 30% more scams before payment, according to a news report."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing fraud scoring.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of fraud scoring.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_fraud_propensity_scores
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_370_fraud_propensity_scores_column_header
            - Regex_global_top500_370_fraud_propensity_scores_data_row
            - Regex_global_top500_370_fraud_propensity_scores_labelled_value
            - Regex_global_top500_370_fraud_propensity_scores_identifier
        - ref: Keyword_global_top500_370_fraud_propensity_scores_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_370_fraud_propensity_scores_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_fraud_propensity_scores
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_370_fraud_propensity_scores_data_row
            - Regex_global_top500_370_fraud_propensity_scores_labelled_value
            - Regex_global_top500_370_fraud_propensity_scores_identifier
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_370_fraud_propensity_scores_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_fraud_propensity_scores
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_fraud_propensity_scores
      pattern: (?i)\b(?:fraud\s+(?:propensity|risk|probability|model)\s+scores?|fraud\s+scores?|fraud\s+scoring\s+(?:outputs?|results?|exports?)|risk[\s-]scored\s+transactions?|transaction\s+risk\s+scores?)\b
    - id: Regex_global_top500_370_fraud_propensity_scores_column_header
      pattern: (?i)\b(?:(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:fraud[ _]?(?:score|prob(?:ability)?|risk|flag|propensity)|risk[ _]?score|model[ _]?score|decision|reason[ _]?codes?|rule[ _]?hits?)|(?:fraud[ _]?(?:score|prob(?:ability)?|risk|flag|propensity)|risk[ _]?score|model[ _]?score|decision|reason[ _]?codes?|rule[ _]?hits?)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash))\b
    - id: Regex_global_top500_370_fraud_propensity_scores_data_row
      pattern: (?i)\b[A-Z]{0,5}[-_]?\d{4,12}\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,160}?(?:[,;\t]|\|[ \t]{0,2}))?\"?-?\$?\d{1,12}(?:\.\d{1,6})?%?(?![\w.])
    - id: Regex_global_top500_370_fraud_propensity_scores_labelled_value
      pattern: (?i)\b(?:fraud\s+(?:score|probability|risk)|risk\s+score|model\s+score|decision|reason\s+codes?)[ \t]{0,3}[:#=][ \t]{0,3}(?:0?\.\d{1,4}|\d{1,4}|decline[d]?|manual\s+review|review|step[- ]up|challenge|hold|block|approve[d]?|R\d{2,3})\b
    - id: Regex_global_top500_370_fraud_propensity_scores_identifier
      pattern: (?i)\b(?:customer\s*(?:no\.?|number|ID)|account\s*(?:no\.?|number|ID)|transaction\s*(?:no\.?|number|ID)|txn\s*ID|card\s+ending)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Za-z-]{0,8}\d)[A-Za-z0-9][A-Za-z0-9._@-]{3,64}
  keywords:
    - id: Keyword_global_top500_370_fraud_propensity_scores_domain_evidence
      groups:
        - match_style: word
          terms:
            - device fingerprint
            - velocity
            - mule account
            - account takeover
            - chargeback
            - card not present
            - geolocation mismatch
            - new payee
            - rule hit
            - step-up authentication
            - scam
      strength: domain
    - id: Keyword_global_top500_370_fraud_propensity_scores_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - threshold go to manual review
            - analysts must document
      strength: noise
risk_description: >-
  This detector finds fraud-propensity scores or risk-scoring records associated with a customer or subject. Disclosure can brand a person as likely fraudulent, expose internal profiling, and influence service, investigation, or account decisions without the subject understanding or challenging the score. A normal record can cause serious privacy, reputational, and financial harm to one person, while also helping adversaries infer how fraud controls operate. Risk 8 and SENSITIVE are justified; bulk model data, protected intelligence features, or system-level evasion capability would raise the classification. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs a populated transaction/account score row, labelled fraud score/decision/reason code or labelled account ID and 85 needs two distinct structures (header counts only toward 85) plus fraud-signal evidence. Removed the self-corroborating evidence group and generic primaries (fraud detection, risk assessment, anomaly detection, suspicious activity, transaction monitoring, fraud alert). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped HRIPA, My Health Records Act and TIA Act; kept AML/CTF Act (transaction monitoring).
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 957 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-04'
    description: case/evidence metadata update
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
