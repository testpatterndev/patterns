schema: testpattern/v1
name: Air traffic operational procedures
slug: global-top500-451-air-traffic-operational-procedures
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects air traffic operational procedures: ATC unit, local operating or separation procedure wording with populated sector, frequency, waypoint, transfer-level and restriction fields and operational values (flight levels, runways, frequencies, distances). Topic wording alone is discovery-only.
operation: >-
  Regex_atc_procedure_primary (air traffic operational/control/services procedures, ATC unit procedures, local operating procedures, unit operating procedures or separation minima wording) is discovery-only at 65. 75 requires the primary plus one populated structure: an operational value (flight level, runway designator, VHF frequency, NM distance, altitude in ft, squawk code) or a populated procedure field (sector, frequency, waypoint/fix, holding, transfer point/level, release point, handoff, clearance limit, restrictions). 85 requires an operational value (flight level, runway designator, VHF frequency, NM distance, altitude in ft, squawk code) (two distinct hits), a populated procedure field (sector, frequency, waypoint/fix, holding, transfer point/level, release point, handoff, clearance limit, restrictions), and independent ATC-operations (controller, coordination, transfer of control, approach/tower, vectoring) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_atc_procedure_guidance_exclusion).
pattern: >-
  (?i)\b(?:air\s+traffic\s+(?:operational|control|management|services?)\s+(?:procedures?|instructions?|manual|orders?)|ATC\s+(?:procedures?|unit\s+procedures|instructions?)|manual\s+of\s+air\s+traffic\s+services|local\s+(?:operating|operational)\s+procedures?|(?:tower|approach|terminal|en[\s-]route|centre)\s+(?:control\s+)?operating\s+procedures?|separation\s+(?:minima|standards?)|contingency\s+procedures?\s+for\s+air\s+traffic)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (an operational value (flight level, runway designator, VHF frequency, NM distance, altitude in ft, squawk code) or a populated procedure field (sector, frequency, waypoint/fix, holding, transfer point/level, release point, handoff, clearance limit, restrictions)), and 85 needs two distinct structures plus independent ATC-operations (controller, coordination, transfer of control, approach/tower, vectoring) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
  - global
regulations:
  - SOCI Act 2018 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
data_categories:
  - security
corroborative_evidence:
  keywords:
    - controller
    - coordination
    - transfer of control
    - approach control
    - tower
    - departures
    - arrivals
    - vectoring
    - conflict
    - airspace
  proximity: 300
test_cases:
  should_match:
    - value: Local operating procedures for the tower are reviewed every six months.
      description: Discovery probe (65)
      synthetic: true
    - value: |-
        ATC unit procedures - Brisbane Approach
        Sector: BN APP North
        Frequency: 125.600 MHz
      description: Medium-tier probe (75) - populated procedure fields and a frequency
      synthetic: true
    - value: |-
        Local operating procedures - Brisbane Approach / Centre coordination
        Sector: BN APP North
        Transfer level: FL130 at waypoint GOMOL
        Runway 19L arrivals: descend to 5000 ft, 10 NM spacing on final
        Frequency: 125.600 MHz
        Transfer of control occurs at the release point after coordination with the approach controller; vectoring for departures resolves any conflict.
      description: High-tier probe (85) - several operational values, procedure fields and ATC-operations context
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match
    - value: 'Policy statement: air traffic control procedures are approved by the Chief Controller before publication.'
      description: Policy text
      synthetic: true
    - value: |-
        ATC unit procedure template
        Sector: ________
        Frequency: [insert]
      description: Blank template
      synthetic: true
    - value: 'Course module 6: separation minima - 5 NM radar separation on runway 19L arrivals at FL130.'
      description: Training framing
      synthetic: true
    - value: The ICAO overview explains the purpose of air traffic control.
      description: Public overview
      synthetic: true
false_positives:
  - description: Public AIP/ICAO material and aviation training cite runways and flight levels.
    mitigation: Guidance/training framing is excluded; 85 needs two operational values plus populated procedure fields and ATC-operations context.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_atc_procedure_primary
      matches:
        - ref: Regex_atc_procedure_operational_value
          min_count: 2
          unique_results: true
        - ref: Regex_atc_procedure_procedure_field
        - ref: Keyword_atc_procedure_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_atc_procedure_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_atc_procedure_primary
      matches:
        - type: any
          refs:
            - Regex_atc_procedure_operational_value
            - Regex_atc_procedure_procedure_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_atc_procedure_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_atc_procedure_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_atc_procedure_primary
      pattern: >-
        (?i)\b(?:air\s+traffic\s+(?:operational|control|management|services?)\s+(?:procedures?|instructions?|manual|orders?)|ATC\s+(?:procedures?|unit\s+procedures|instructions?)|manual\s+of\s+air\s+traffic\s+services|local\s+(?:operating|operational)\s+procedures?|(?:tower|approach|terminal|en[\s-]route|centre)\s+(?:control\s+)?operating\s+procedures?|separation\s+(?:minima|standards?)|contingency\s+procedures?\s+for\s+air\s+traffic)\b
    - id: Regex_atc_procedure_operational_value
      pattern: >-
        (?i)\bFL\s?[0-4]\d{2}\b|\b(?:RWY|runway)\s?(?:0[1-9]|[12]\d|3[0-6])[LCR]?\b|\b1[1-3]\d\.\d{2,3}\s?MHz\b|\b\d{1,3}(?:\.\d)?\s?NM\b|\b\d{3,5}\s?ft\b|\bsquawk\s?[0-7]{4}\b
    - id: Regex_atc_procedure_procedure_field
      pattern: >-
        (?i)\b(?:sector|frequency|waypoint|fix|holding\s+(?:fix|pattern)|transfer\s+(?:point|level|of\s+control)|release\s+point|hand[\s-]?off|coordination\s+(?:point|requirement)|clearance\s+limit|altitude\s+restriction|speed\s+restriction|missed\s+approach)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  keywords:
    - id: Keyword_atc_procedure_context
      groups:
        - match_style: word
          terms:
            - controller
            - coordination
            - transfer of control
            - approach control
            - tower
            - departures
            - arrivals
            - vectoring
            - conflict
            - airspace
      strength: specific
    - id: Keyword_atc_procedure_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - guidance note
            - best practice guide
            - media release
            - press release
            - news report
            - course module
            - learning objectives
            - awareness course
            - webinar
            - lesson plan
            - quiz question
      strength: domain
risk_description: >-
  The detector now requires ATC procedure wording plus operational values (flight levels, runways, frequencies, distances) or populated sector/transfer fields before enforcing. A substantive operational procedure could reveal routing assumptions or control practices that help a knowledgeable actor plan disruption, evade safeguards, or exploit a local weakness. The likely impact is serious but normally confined to an airport, airspace sector, operator, or procedure, and benign training or policy discussion remains a material match source. Risk 8 and SENSITIVE fit that contained operational exposure; PROTECTED would require current exploitable control detail whose compromise could cause broad aviation disruption or major life-safety consequences.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Confidential
