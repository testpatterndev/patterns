changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): primary broadened to ATC/local/unit operating procedure wording (flight clearance, approach procedure, radar vectoring removed as bare topics); unbounded operational-value regex replaced with bounded FL/runway/MHz/NM/ft/squawk forms; keyword-only local-detail group (including case-sensitive SID/STAR) replaced with a populated procedure-field regex; 75 needs an operational value or procedure field; 85 needs two values, a field and ATC-operations context; guidance exclusion; populated procedure tests and decoys; GDPR replaced with SOCI Act (aviation assets); ISO 27001/NIST CSF frameworks and ISM reference added. Addresses the 2026-07-06 NOT_DETECTED tenant verdict.'
  - version: 1.3.0
    date: '2026-07-04'
    description: 'CI profile hardening: restrict the primary to operational procedure topics; require local runway, sector, waypoint, handoff, or airspace detail at 75 and an operational value at 85; reject public overview and training text.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1991 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
