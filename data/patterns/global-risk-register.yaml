schema: testpattern/v1
name: Risk Register
slug: global-risk-register
version: 1.5.1
type: regex
pattern_class: concept
description: >-
  Identifies populated risk registers, risk matrices and enterprise risk reports: risk IDs, rated likelihood/consequence/residual values and named risk owners. Titles alone are discovery-only.
operation: >-
  Regex_risk_register (risk register, risk (assessment) matrix, risk heat map, enterprise risk (management) report, KRI dashboard/report) is discovery-only at 65. 75 requires one populated structure: a labelled risk ID, a likelihood/consequence/inherent/residual rating with a value, or a named risk/treatment/control owner. 85 requires two distinct structures plus treatment/control wording. Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
confidence: medium
confidence_justification: >-
  Medium confidence: titles are discovery-only; enforcement requires risk IDs, rated values or named owners, and 85 adds a second structure and treatment context.
jurisdictions:
  - global
regulations:
  - Financial Accountability Act 2009 (Qld)
frameworks:
  - DISP
  - ISO 27001
  - NIST CSF
data_categories:
  - governance
  - security
test_cases:
  should_match:
    - value: |-
        Corporate risk register - Q3 2026
        Risk ID: CR-014  Title: Loss of key payroll vendor
        Likelihood: Possible  Consequence: Major  Residual rating: High
        Risk owner: Dana Whitfield (CFO)
        Existing controls: vendor exit clause; treatment plan approved by the audit and risk committee.
      description: High tier (85) - risk ID, ratings and named owner with treatment context
      synthetic: true
    - value: 'Risk register extract: Risk ID: ICT-022 - unsupported database version on the permit system.'
      description: Medium tier (75) - risk ID only
      synthetic: true
    - value: 'Project risk matrix row - Likelihood: Likely, flooding of the site compound during the wet season.'
      description: Medium tier (75) - rated likelihood only
      synthetic: true
    - value: The risk register will be discussed at the next committee meeting.
      description: Discovery tier (65) - title only
      synthetic: true
  should_not_match:
    - value: This guidance explains how agencies should rate likelihood and consequence in a risk matrix, from rare to almost certain.
      description: Guidance text
    - value: |-
        Risk register template
        Risk ID: ____  Likelihood: ____  Consequence: ____
        Risk owner: ____
      description: Blank template
    - value: "News report: the auditor found the department's risk register had not been updated for two years."
      description: News framing
    - value: 'Training course slide: a risk matrix with Likelihood: Likely and Consequence: Major gives a High rating.'
      description: Training framing with ratings must not enforce
false_positives:
  - description: Risk management guidance, risk matrix explainers and news about risk registers.
    mitigation: Titles are discovery-only; enforcement needs populated risk IDs, ratings or named owners, and guidance/training/news/template framing is excluded.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  The concept pattern identifies risk registers and treatment records containing likelihood, consequence, inherent or residual ratings, owners, tolerances, and mitigation plans rather than generic discussion of risk. A substantive register can expose known vulnerabilities, control gaps, accepted residual risks, accountable teams, and remediation priorities that an attacker, competitor, or litigant could exploit. The affected scale may span several business functions, but an ordinary organisational register still produces serious contained harm rather than automatic critical-service compromise. Risk 8 SENSITIVE Government is appropriate; PROTECTED is not met without critical-infrastructure weaknesses, protected operations, or credible significant damage at strategic or system scale.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
classification:
  tier: Medium
  rationale: >-
    Risk 8 fits PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE Government because a populated register lists
    known risks, residual ratings, owners and treatment gaps that an attacker, competitor or litigant could prioritise
    against. PROTECTED is not met for an ordinary organisational register without critical-infrastructure weaknesses or
    strategic-scale consequences.
  generic:
    classification: Medium
    dlm: Medium Government
    rationale: >-
      Medium Government handling protects rated risks, accepted residual exposure and treatment plans. It is not High
      unless the register maps critical-service weaknesses.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_risk_register
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_risk_id
            - Evidence_risk_rating
            - Evidence_risk_owner
        - ref: Keyword_risk_treatment
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_risk_register
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_risk_id
            - Evidence_risk_rating
            - Evidence_risk_owner
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_risk_register
  regexes:
    - id: Regex_risk_register
      pattern: (?i)\b(?:risk\s+register|risk\s+(?:assessment\s+)?matrix|risk\s+heat\s{0,2}map|enterprise\s+risk\s+(?:management\s+)?report|KRI\s+(?:dashboard|report))\b
    - id: Evidence_risk_id
      pattern: (?i)\brisk\s+(?:ID|ref(?:erence)?|no\.?|number)\s{0,3}[:#]?\s{0,3}(?!_{2,}|\[|<)[A-Z]{0,6}-?\d{1,5}\b
    - id: Evidence_risk_rating
      pattern: (?i)\b(?:likelihood|consequence|inherent\s+(?:risk\s+)?rating|residual\s+(?:risk\s+)?rating|risk\s+rating|risk\s+score|current\s+rating|target\s+rating)\s*[:#=|]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:almost\s+certain|likely|possible|unlikely|rare|insignificant|minor|moderate|major|severe|catastrophic|extreme|very\s+high|high|medium|low|\d{1,2}(?:\s{0,2}/\s{0,2}\d{1,2})?)\b
    - id: Evidence_risk_owner
      pattern: (?i)\b(?:risk\s+owner|treatment\s+owner|control\s+owner|action\s+owner)\s*[:#=|]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][a-z'-]{1,20}\s+[A-Z][A-Za-z'-]{1,30}
  keywords:
    - id: Keyword_risk_treatment
      groups:
        - match_style: word
          terms:
            - risk treatment
            - treatment plan
            - treatment action
            - mitigating control
            - existing controls
            - control effectiveness
            - risk appetite
            - risk tolerance
            - emerging risk
            - escalated to
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
created: '2026-02-09'
updated: '2026-09-25'
changelog:
  - version: 1.5.1
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had no generic classification, no
      rationale, no tier).
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): 75 now requires populated register structure (labelled risk ID, rated likelihood/consequence/residual value, or named risk owner) and 85 requires two distinct structures plus treatment/control wording; removed the phrase-only 85 path (bare likelihood/impact words) and the generic compliance/governance word group; guidance/news/training exclusion added; populated synthetic tests and decoys. Removed irrelevant IPA 2009, Privacy Act 1988 and SOCI Act tags; added Financial Accountability Act 2009 (Qld) (accountable officer risk management obligations) and verified NIST SP 800-30r1 / Qld legislation references.'
  - version: 1.4.0
    date: '2026-07-19'
    description: 'Profile quality: align the regex-backed detector type; add register-title discovery, assessed-risk medium, and treatment-corroborated high tiers; add public/template adversarial probes.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 593 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.1.0
    date: '2026-07-04'
    description: Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
