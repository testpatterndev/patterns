schema: testpattern/v1
name: Device IMEI numbers
slug: global-top500-051-device-imei-numbers
version: 1.7.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to device imei numbers in Australian contexts. This information type is classified as personally identifiable information under applicable data protection
  regulations. Detection is phrase-level concept matching anchored on explicit IMEI, TAC, and equipment-identity vocabulary; it does not parse or Luhn-validate 15-digit IMEI values.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Keyword
  lists: phone-international. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?is)\b(device\s+IMEI\s+numbers|IMEI\s+number|handset\s+identifier|type\s+allocation\s+code|equipment\s+identity)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Telecommunications (Interception and Access) Act 1979 (Cth)
  - GDPR
frameworks:
  - CIS Controls
  - DISP
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - device imei numbers
    - device
    - imei
    - numbers
    - contact
    - location
    - data
  proximity: 300
  keyword_lists:
    - phone-international
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: device IMEI numbers
      description: Primary topic phrase match
    - value: imei number
      description: Case-insensitive topic phrase match
    - value: equipment identity
      description: Alternative topic phrase match
    - value: type allocation code
      description: Additional topic phrase match
    - value: |-
        Device IMEI numbers: Recorded
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: address mac
      description: Generic word pair from old broad template should not match
    - value: Mobile device management policy
      description: Generic mobile-device wording demoted out of the primary - MDM policy prose must not anchor the SIT
    - value: asset serial number register
      description: Generic serial-number wording demoted out of the primary - asset inventories must not anchor the SIT
    - value: |-
        Device IMEI numbers:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about device imei numbers are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Device IMEI numbers:
        Name: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Common words and phrases related to device imei numbers appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_051_device_imei_numbers_populated_label
      matches:
        - ref: Regex_global_top500_051_device_imei_numbers_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_051_device_imei_numbers_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_device_imei
      matches:
        - ref: Evidence_device_imei
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_device_imei
  regexes:
    - id: Pattern_device_imei
      pattern: (?is)\b(device\s+IMEI\s+numbers|IMEI\s+number|handset\s+identifier|type\s+allocation\s+code|equipment\s+identity)\b
    - id: Pattern_au_top500_051_device_imei_numbers_label_context
      pattern: (?i)\b(device\s+imei\s+numbers)\b
    - id: Regex_global_top500_051_device_imei_numbers_populated_label
      pattern: (?i)\b((?:\b(?:device\s+IMEI\s+numbers|IMEI\s+number|handset\s+identifier|type\s+allocation\s+code|equipment\s+identity)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Regex_global_top500_051_device_imei_numbers_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
  keywords:
    - id: Evidence_device_imei
      groups:
        - match_style: word
          terms:
            - MEID
            - text: TAC
              case_sensitive: true
      strength: specific
    - id: Keyword_au_top500_051_device_imei_numbers_domain_context
      groups:
        - match_style: word
          terms:
            - device imei numbers
            - device
            - imei
      strength: domain
risk_description: >-
  This concept pattern finds references to IMEI numbers and device-identity topics rather than validating a 15-digit IMEI value. A true record can support device tracking, blacklisting, or correlation with subscriber and account data, but those outcomes need an actual identifier and additional ownership information. The normal match affects one device or a small set and creates bounded harm because broad terms such as mobile device or serial number can also trigger. Risk 5 and OFFICIAL are defensible at this boundary; verified person-linked device registers would require higher contextual handling.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 5 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM, OFFI, and Low tier for an isolated handset
    identifier. The next SENSITIVE level is not met because no subscriber identity, live location, communications
    history, device contents, management secret, or consequential inventory is detected.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low and Low handling suit one IMEI reference that requires carrier, subscriber, or management-system
      context before it creates material privacy or operational harm.
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.7.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.6.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_051_device_imei_numbers_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (MEID, TAC); 85 requires the populated field plus a populated person/client field (Regex_global_top500_051_device_imei_numbers_record_structure). Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (device identifier, mobile device, serial number, device registration). Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.5.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (SOCI Act 2018 (Cth)); added 2 verified legislation/regulator references."
  - version: 1.5.0
    date: '2026-07-17'
    description: 'Reduced-scope alignment fix (TP-00179): demote generic ''device identifier'', ''mobile device'', ''serial number'', and ''device registration'' out of the primary IdMatch (they remain corroborative evidence only), keeping explicit IMEI/TAC/equipment-identity phrases as the concept core; add MDM-policy and asset-serial negatives. Value-level Luhn-validated IMEI detection stays out of scope for this concept SIT (separate identifier classifier if ever needed).'
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 654 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.3.0
    date: '2026-07-04'
    description: case/evidence metadata update
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
