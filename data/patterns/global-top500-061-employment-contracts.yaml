schema: testpattern/v1
name: Employment contracts
slug: global-top500-061-employment-contracts
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects individual employment contracts, contracts of employment and letters of offer for a named or numbered employee, with commencement, remuneration or classification terms.
operation: >-
  Primary: an employment contract phrase (employment contract/agreement, contract of employment, terms of employment, letter of offer, offer of employment, individual flexibility arrangement). 75 tier requires a populated person field (employee/staff name or number, appointee, candidate, position number or title, work unit) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated contract term (commencement/start date, salary or hourly rate amount, or classification level) and an independent corroborative term (probation, superannuation, ordinary hours, confidentiality, non-compete). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:employment\s+(?:contract|agreement)|contract\s+of\s+employment|terms\s+of\s+employment|letter\s+of\s+offer|offer\s+(?:of\s+employment|letter)|individual\s+flexibility\s+arrangement)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Public Sector Act 2022 (Qld)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - probation
    - superannuation
    - ordinary hours
    - confidentiality
    - non-compete
    - acceptance
    - notice period
    - award
    - signed
  proximity: 300
test_cases:
  should_match:
    - value: "Letter of offer - contract of employment\nEmployee name: Avery Teston\nPosition title: Senior Project Officer\nCommencement date: 06/10/2026\nBase salary: $98,450 per annum plus superannuation\nProbation: 6 months. Please sign and return the acceptance by 30/09/2026."
      description: '85: Letter of offer with employee, commencement date and salary'
      synthetic: true
    - value: "Employment contract\nEmployee: Jordan Staffson\nStart date: 2026-11-02\nAnnual salary: USD 112,000\nAt-will employment; confidentiality and non-compete obligations apply."
      description: '85: Contract with employee, start date and salary'
      synthetic: true
    - value: "Employment agreement variation\nEmployee ID: 4471820\nThe parties agree that clause 7 is varied to 30 ordinary hours per week."
      description: '75: Contract variation naming an employee ID, no populated term'
      synthetic: true
  should_not_match:
    - value: An employment contract sets out the terms of employment, such as salary, hours and probation. This fact sheet explains what employers must include.
      description: Guidance / fact sheet - must stay below 75
    - value: "Contract of employment\nEmployee name: __________\nPosition title: __________\nCommencement date: ___/___/____\nBase salary: $__________"
      description: Blank contract template - must stay below 75
    - value: 'Training module 3: negotiating an employment agreement. Participants review a letter of offer and discuss salary expectations.'
      description: Training material - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_061_employment_contracts_primary
      matches:
        - ref: Regex_top500_061_employment_contracts_person_field
        - ref: Regex_top500_061_employment_contracts_record_detail
        - ref: Keyword_top500_061_employment_contracts_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_061_employment_contracts_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_061_employment_contracts_primary
      matches:
        - ref: Regex_top500_061_employment_contracts_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_061_employment_contracts_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_061_employment_contracts_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_061_employment_contracts_primary
      pattern: >-
        (?i)\b(?:employment\s+(?:contract|agreement)|contract\s+of\s+employment|terms\s+of\s+employment|letter\s+of\s+offer|offer\s+(?:of\s+employment|letter)|individual\s+flexibility\s+arrangement)\b
    - id: Regex_top500_061_employment_contracts_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit|appointee|candidate)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_061_employment_contracts_record_detail
      pattern: >-
        (?i)\b(?:(?:commencement|start|appointment)\s+date|date\s+of\s+(?:commencement|appointment))\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|\b(?:base\s+salary|annual\s+salary|salary|remuneration|hourly\s+rate|total\s+(?:fixed\s+)?remuneration)\s*(?:\([^)]{1,20}\))?\s*[:\-]?\s*(?:of\s+)?(?:(?:AUD|USD|GBP|NZD|A\$|US\$|NZ\$|\$|£|€)\s?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?)|\b(?:classification|level|grade)\s*[:\-]\s*[A-Z]{1,4}\s?-?\d{1,2}(?:\.\d{1,2})?\b
  keywords:
    - id: Keyword_top500_061_employment_contracts_corroborative
      groups:
        - match_style: word
          terms:
            - probation
            - superannuation
            - ordinary hours
            - confidentiality
            - non-compete
            - acceptance
            - notice period
            - award
            - signed
      strength: specific
    - id: Keyword_top500_061_employment_contracts_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a individual employment contract or letter of offer about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Disclosure exposes an identifiable employee's remuneration, classification and contractual terms. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
