schema: testpattern/v1
name: Reinsurance contract terms
slug: global-top500-138-reinsurance-contract-terms
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: Detects references to reinsurance contract terms in financial and compliance documents. Commonly found in international regulatory filings, transaction records, and audit documentation.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(?:reinsurance\s+contract|reinsurance\s+treaty|ceding\s+commission|excess\s+of\s+loss|quota\s+share|treaty\s+reinsurance|facultative\s+reinsurance|loss\s+ratio|reinsurance\s+premium|catastrophe\s+bond|aggregate\s+limit)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - reinsurance contract terms
    - reinsurance
    - contract
    - terms
    - credit
    - lending
    - insurance
  proximity: 300
  keyword_lists:
    - corporate-finance
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: reinsurance contract
      description: Primary topic phrase match
    - value: reinsurance treaty
      description: Case-insensitive topic phrase match
    - value: ceding commission
      description: Alternative topic phrase match
    - value: excess of loss
      description: Additional topic phrase match
    - value: |-
        Reinsurance contract
        To: Executive Committee
        From: Chief Risk Officer
      description: Populated document header with 2 fields (75 tier)
      synthetic: true
    - value: |-
        Reinsurance contract
        To: Executive Committee
        From: Chief Risk Officer
        Date: 14 August 2026
      description: Populated document header with 3 distinct fields (85 tier)
      synthetic: true
    - value: |-
        Reinsurance contract - retrocession
        To: Executive Committee
      description: Kept independent term "retrocession" with the phrase and one header field (75 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: credit premium
      description: Generic word pair from old broad template should not match
    - value: Reinsurance contract terms
      description: "Bare detector name: it reached 75 through the generated name-word tier and must not reach an enforcing tier"
    - value: |-
        Reinsurance contract:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about reinsurance contract are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In English (as the primary international business language), standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_reinsurance_contract_terms
      matches:
        - ref: Regex_global_top500_138_reinsurance_contract_terms_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_reinsurance_contract_terms
      matches:
        - ref: Regex_global_top500_138_reinsurance_contract_terms_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_reinsurance_contract_terms
      matches:
        - ref: Keyword_reinsurance_contract_terms
        - ref: Regex_global_top500_138_reinsurance_contract_terms_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_reinsurance_contract_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_reinsurance_contract_terms
      pattern: >-
        (?is)\b(?:reinsurance\s+contract|reinsurance\s+treaty|ceding\s+commission|excess\s+of\s+loss|quota\s+share|treaty\s+reinsurance|facultative\s+reinsurance|loss\s+ratio|reinsurance\s+premium|catastrophe\s+bond|aggregate\s+limit)\b
    - id: Regex_global_top500_138_reinsurance_contract_terms_record_structure
      pattern: (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item|cedant|reinsurer|treaty\s+(?:no\.?|number|ref(?:erence)?)|contract\s+(?:no\.?|number|ref(?:erence)?))\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$]
  keywords:
    - id: Keyword_reinsurance_contract_terms
      groups:
        - match_style: word
          terms:
            - retrocession
      strength: specific
risk_description: >-
  The detector finds reinsurance contract or treaty, ceding commission, excess-of-loss, quota-share, premium, loss-ratio, catastrophe-bond, and aggregate-limit terminology with financial context. A match can reveal the subject of a commercial arrangement and aid negotiation profiling, but it does not require the parties, rates, attachment points, limits, or signed wording. The normal phrase-level exposure has low reversible impact for an insurer or reinsurer unless substantive contract values surround it. Risk 4 and OFFICIAL are appropriate, while a negotiated treaty containing pricing, exposures, and limits would warrant SENSITIVE.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 4 is consistent with PSPF OFFICIAL, QGISCF OFFICIAL, and the OFFICIAL DLM because reinsurance terminology alone
    does not disclose an actionable contract position. SENSITIVE is not met without counterparties, pricing, covered
    risks, or negotiated limits.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic classification and Low DLM fit reinsurance topic terms whose commercial sensitivity depends on
      populated contractual economics.
frameworks:
  - ISO 27001
  - ISO 27701
