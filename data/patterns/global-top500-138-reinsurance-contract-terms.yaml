    description: 'Generated name-word tier removed: the 75 tier ANDed Pattern_*_label_context (the detector name, "Reinsurance contract terms") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 75. Both lists sit inside the IdMatch phrase, so the bare name alone scored 75. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs 2 populated document header fields (Regex_global_top500_138_reinsurance_contract_terms_record_structure) or the kept independent term retrocession plus one field; 85 needs 3 distinct fields. Curated terms that sit inside an IdMatch hit were removed. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
  - version: 1.2.3
