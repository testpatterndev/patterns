schema: testpattern/v1
name: Taxpayer identification number
slug: au-top500-025-taxpayer-identification-number
version: 1.6.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to taxpayer identification number in Australian contexts. This information type is classified as personally identifiable information under the Privacy Act
  1988.
operation: 'Pattern type: regex (boost_regex engine). Regex uses word-boundary phrase matching with flexible whitespace. Corroborative evidence: 8 keywords within 300 characters.'
pattern: \b(taxpayer\s+identification\s+number)\b
confidence: low
confidence_justification: 'Low confidence marker: phrase-based artifact detection to bootstrap line-by-line coverage. Requires corroborative evidence and later hardening to high-confidence structural patterns.'
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - taxpayer identification number
    - taxpayer
    - identification
    - number
    - government
    - ids
    - civil
    - status
  proximity: 300
  keyword_lists:
    - government-services
test_cases:
  should_match:
    - value: 'Taxpayer identification number'
      description: Topic phrase present
    - value: 'taxpayer identification number'
      description: Topic phrase, lowercase
    - value: 'this record references the taxpayer identification number held on file'
      description: Topic phrase within surrounding text
    - value: |-
        Taxpayer identification number: Recorded
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match phrase marker
    - value: |-
        Taxpayer identification number:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about taxpayer identification number are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Taxpayer identification number:
        Name: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Common words and phrases related to taxpayer identification number appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_top500_025_taxpayer_identification_number_populated_label
      matches:
        - ref: Regex_au_top500_025_taxpayer_identification_number_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_au_top500_025_taxpayer_identification_number_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_taxpayer_id
      matches:
        - ref: Evidence_taxpayer_id
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_taxpayer_id
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
  regexes:
    - id: Regex_au_top500_025_taxpayer_identification_number_populated_label
      pattern: (?i)\b((?:\b(?:taxpayer\s+identification\s+numbers?)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Regex_au_top500_025_taxpayer_identification_number_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Pattern_taxpayer_id
      pattern: \b(taxpayer\s+identification\s+number)\b
  keywords:
    - id: Evidence_taxpayer_id
      groups:
        - match_style: word
          terms:
            - text: TIN
              case_sensitive: true
            - tax file number
            - text: TFN
              case_sensitive: true
            - tax identifier
            - text: ATO
              case_sensitive: true
            - Australian Taxation Office
            - tax return
            - tax assessment
            - tax registration
      strength: specific
risk_description: >-
  The low-confidence regex matches the literal phrase taxpayer identification number, not the identifier value that may follow it. The phrase can flag a form field or record heading that, if populated nearby, helps locate tax identity material, but it cannot itself be used for impersonation or filing. Harm to a taxpayer therefore depends on additional captured digits and identity context, and policy documents, templates, and training material are expected false positives. Risk 5 OFFICIAL recognises that locator and correlation value; SENSITIVE would require confirmation that an actual personal tax number is present.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 remains compatible with PSPF OFFICIAL, QGISCF OFFICIAL, DLM OFFICIAL, and Low tier because the normal match
    is only a tax-identifier label and harmful use needs the missing value. SENSITIVE is not met until the content is
    correlated with a real taxpayer number or populated tax record.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic treatment fits a phrase marker that indicates possible tax context but is not personal data on its
      own. Medium handling belongs to the validated identifier or completed form found through secondary inspection, not
      to this label-only hit.
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.6.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.5.0
    date: '2026-10-20'
    description: 'Self-corroboration fix (PR #69 shape; this pattern was missed by #69): the evidence lists held the IdMatch phrase or phrases inside it (taxpayer identification). Purview counts a supporting match that equals or sits inside the IdMatch span (dev-tenant tests 2026-10-16 and 2026-10-19), so a bare heading reached an enforcement tier. 75 now uses the populated field as its primary (Regex_au_top500_025_taxpayer_identification_number_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (Evidence_taxpayer_id); 85 requires the populated field plus a populated person/client field (Regex_au_top500_025_taxpayer_identification_number_record_structure). Phrase-only matches stay at 65 discovery. Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.4.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 3 verified legislation/regulator references."
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 629 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-04'
    description: case/evidence metadata update
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
