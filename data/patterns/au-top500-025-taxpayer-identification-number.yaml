schema: testpattern/v1
name: Taxpayer identification number
slug: au-top500-025-taxpayer-identification-number
version: 1.4.4
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to taxpayer identification number in Australian contexts. This information type is classified as personally identifiable information under the Privacy Act
  1988.
operation: 'Pattern type: regex (boost_regex engine). Regex uses word-boundary phrase matching with flexible whitespace. Corroborative evidence: 8 keywords within 300 characters.'
pattern: \btaxpayer\s+identification\s+number\b
confidence: low
confidence_justification: 'Low confidence marker: phrase-based artifact detection to bootstrap line-by-line coverage. Requires corroborative evidence and later hardening to high-confidence structural patterns.'
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - taxpayer identification number
    - taxpayer
    - identification
    - number
    - government
    - ids
    - civil
    - status
  proximity: 300
  keyword_lists:
    - government-services
test_cases:
  should_match:
    - value: 'Taxpayer identification number'
      description: Topic phrase present
    - value: 'taxpayer identification number'
      description: Topic phrase, lowercase
    - value: 'this record references the taxpayer identification number held on file'
      description: Topic phrase within surrounding text
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match phrase marker
false_positives:
  - description: Common words and phrases related to taxpayer identification number appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_taxpayer_id
      matches:
        - ref: Evidence_taxpayer_id
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_taxpayer_id
      matches:
        - ref: Evidence_taxpayer_id
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_taxpayer_id
  regexes:
    - id: Pattern_taxpayer_id
      pattern: \btaxpayer\s+identification\s+number\b
  keywords:
    - id: Evidence_taxpayer_id
      groups:
        - match_style: word
          terms:
            - taxpayer identification
            - text: TIN
              case_sensitive: true
            - tax file number
            - text: TFN
              case_sensitive: true
            - tax identifier
            - text: ATO
              case_sensitive: true
            - Australian Taxation Office
            - tax return
            - tax assessment
            - tax registration
      strength: specific
risk_description: >-
  The low-confidence regex matches the literal phrase taxpayer identification number, not the identifier value that may follow it. The phrase can flag a form field or record heading that, if populated nearby, helps locate tax identity material, but it cannot itself be used for impersonation or filing. Harm to a taxpayer therefore depends on additional captured digits and identity context, and policy documents, templates, and training material are expected false positives. Risk 5 OFFICIAL recognises that locator and correlation value; SENSITIVE would require confirmation that an actual personal tax number is present.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 remains compatible with PSPF OFFICIAL, QGISCF OFFICIAL, DLM OFFICIAL, and Low tier because the normal match
    is only a tax-identifier label and harmful use needs the missing value. SENSITIVE is not met until the content is
    correlated with a real taxpayer number or populated tax record.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic treatment fits a phrase marker that indicates possible tax context but is not personal data on its
      own. Medium handling belongs to the validated identifier or completed form found through secondary inspection, not
      to this label-only hit.
