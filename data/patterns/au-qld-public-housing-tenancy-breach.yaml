schema: testpattern/v1
name: Queensland Public Housing Tenancy Breach or Antisocial Behaviour Record
slug: au-qld-public-housing-tenancy-breach
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Tenancy enforcement records for named social housing tenants: Antisocial Behaviour Policy warnings and strikes, Acceptable Behaviour Agreements, Notice to remedy breach (Form 11), Notice to leave (Form 12) and termination and QCAT tenancy applications.
operation: >-
  Primary: Queensland Public Housing Tenancy Breach or Antisocial Behaviour Record anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:Anti[\s-]?social\s+Behaviour\s+Policy|Acceptable\s+Behaviour\s+Agreement|Notice\s+to\s+remedy\s+breach|Notice\s+to\s+leave)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Residential Tenancies and Rooming Accommodation Act 2008 (Qld)
  - Housing Act 2003 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government
corroborative_evidence:
  keywords:
    - public housing
    - social housing
    - tenancy
    - neighbour
    - police
    - QCAT
    - termination
    - Form 11
  proximity: 300
identifier_dependencies:
  - type: client
    name: Client / customer ID
    note: >-
      Housing tenancy / client number format
    affects: precision at 75/85 (public fallback is the generic labelled-field regex)
  - type: property
    name: Property / tenancy reference
    note: >-
      Tenancy / property reference
    affects: precision at 75/85 (public fallback is the generic labelled-field regex)
test_cases:
  should_match:
    - value: "Notice to remedy breach (Form 11)\nTenant: Riley Teston\nAddress of the rental premises: 8 Sandpiper Court, Mackay QLD 4740\nBreach: repeated disturbance to neighbours (police attended 3 times in August). Remedy by 30/09/2026."
      description: Populated record 1
      synthetic: true
    - value: "Antisocial Behaviour Policy — second strike\nTenant: Morgan Teston\nTenancy number: T20417733\nIncident 21/08/2026: threats to a neighbour; police occurrence QP2600517734."
      description: Populated record 2
      synthetic: true
    - value: "Acceptable Behaviour Agreement\nTenant: Jamie Teston\nHousehold member: Alex Teston (18)\nThe tenant agrees that no visitor will cause damage or disturbance; breach may result in a Notice to leave."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Under the Antisocial Behaviour Policy, serious and nuisance behaviour can lead to a formal warning, a breach notice and then ending the tenancy.
      description: Guidance or explainer text
    - value: "Notice to remedy breach (Form 11)\nTenant: __________\nAddress of the rental premises: __________\nDetails of breach: __________"
      description: Blank form
    - value: In the first year of the new policy, 312 public housing tenancies received a third strike, the department reported.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_public_housing_tenancy_breach_primary
      matches:
        - ref: Regex_au_qld_public_housing_tenancy_breach_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_public_housing_tenancy_breach_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_public_housing_tenancy_breach_primary
      matches:
        - ref: Regex_au_qld_public_housing_tenancy_breach_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_public_housing_tenancy_breach_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_public_housing_tenancy_breach_primary
      pattern: >-
        (?i)\b(?:Anti[\s-]?social\s+Behaviour\s+Policy|Acceptable\s+Behaviour\s+Agreement|Notice\s+to\s+remedy\s+breach|Notice\s+to\s+leave)\b
    - id: Regex_au_qld_public_housing_tenancy_breach_record_structure
      pattern: >-
        (?i)\b(?:applicant|tenant|household\s+member|co-tenant|lessor|property\s+manager|premises|property\s+address|address\s+of\s+(?:the\s+)?(?:rental\s+)?premises|rental\s+premises|application\s+(?:no\.?|number)|tenancy\s+(?:no\.?|number|ID)|client\s+(?:no\.?|number|ID)|bond\s+(?:no\.?|number)|CRN|Housing\s+Service\s+Centre|SLK|client|name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_public_housing_tenancy_breach_corroborative
      groups:
        - match_style: word
          terms:
            - public housing
            - social housing
            - tenancy
            - neighbour
            - police
            - text: QCAT
              case_sensitive: true
            - termination
            - Form 11
            - Form 12
            - Housing Service Centre
            - first strike
            - second strike
            - third strike
            - formal warning
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a queensland public housing tenancy breach or antisocial behaviour record about an identified person, gated on populated record fields. Tenancy enforcement records for named social housing tenants: Antisocial Behaviour Policy warnings and strikes, Acceptable Behaviour Agreements, Notice to remedy breach (Form 11), Notice to leave (Form 12) and termination and QCAT tenancy applications. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Qld Government — Antisocial behaviour policy
    url: https://www.qld.gov.au/housing/public-community-housing/public-housing-tenants/during-your-tenancy/tenancy-and-behaviour/anti-social-behaviour-policy
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
