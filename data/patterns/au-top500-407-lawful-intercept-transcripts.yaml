schema: testpattern/v1
name: Lawful intercept transcripts
slug: au-top500-407-lawful-intercept-transcripts
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to lawful intercept transcripts in Australian contexts. This information type is classified as personally identifiable information under the Privacy Act
  1988.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Keyword
  lists: industry-education. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(?:lawful\s+intercept\s+transcripts|lawful\s+intercept|telephone\s+intercept|wiretap\s+transcript|telecommunications\s+interception|surveillance\s+warrant|intercept\s+warrant|monitored\s+communications|interception\s+record|law\s+enforcement|TIA\s+Act|listening\s+device)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - lawful intercept transcripts
    - lawful
    - intercept
    - transcripts
    - law
    - enforcement
    - justice
  proximity: 300
  keyword_lists:
    - industry-education
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: lawful intercept transcripts
      description: Primary topic phrase match
    - value: lawful intercept
      description: Case-insensitive topic phrase match
    - value: telephone intercept
      description: Alternative topic phrase match
    - value: wiretap transcript
      description: Additional topic phrase match
    - value: |-
        Lawful intercept transcripts
        Name: Avery Teston
        Date of birth: 14/02/1988
        Case number: QP2600123456
      description: Populated justice record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: mugshot victim
      description: Generic word pair from old broad template should not match
    - value: |-
        Lawful intercept transcripts:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about lawful intercept transcripts are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to lawful intercept transcripts appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_lawful_intercept_transcripts
      matches:
        - ref: Regex_au_top500_407_lawful_intercept_transcripts_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_lawful_intercept_transcripts
      matches:
        - ref: Regex_au_top500_407_lawful_intercept_transcripts_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_lawful_intercept_transcripts
  regexes:
    - id: Pattern_lawful_intercept_transcripts
      pattern: >-
        (?is)\b(?:lawful\s+intercept\s+transcripts|lawful\s+intercept|telephone\s+intercept|wiretap\s+transcript|telecommunications\s+interception|surveillance\s+warrant|intercept\s+warrant|monitored\s+communications|interception\s+record|law\s+enforcement|TIA\s+Act|listening\s+device)\b
    - id: Pattern_au_top500_407_lawful_intercept_transcripts_label_context
      pattern: (?i)\b(?:lawful\s+intercept\s+transcripts)\b
    - id: Regex_au_top500_407_lawful_intercept_transcripts_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|defendant|accused|offender|prisoner|inmate|detainee|respondent|applicant|witness|informant|suspect|subject\s+(?:name|person)|person\s+of\s+interest|POI|victim|complainant|officer|CNI|QPRIME|(?:file|case|matter|court|reference|ref|exhibit|brief|job|incident|report|investigation|occurrence)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_top500_407_lawful_intercept_transcripts_domain_context
      groups:
        - match_style: word
          terms:
            - lawful intercept transcripts
            - lawful
            - intercept
            - transcripts
risk_description: >-
  The regex targets transcripts and records of lawful telephone or communications interception, not merely a statutory reference to interception powers. A real transcript can expose private conversations, associates, investigative targets, evidence, collection timing, and covert monitoring, enabling evasion or serious privacy intrusion. Educational and policy discussion may still match, so transcript structure and case context should confirm the harmful unit. Risk 8 supports SENSITIVE Personal-Privacy; PROTECTED would require exposure of an ongoing protected operation, high-risk source, critical collection capability, or a large intercept corpus.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with OFFICIAL: Sensitive, SENSITIVE, SENSITIVE Personal-Privacy, and Medium because an intercept
    transcript exposes both private communications and investigative evidence. PROTECTED is not met without
    protected-operation compromise, life-safety risk, critical capability disclosure, or broad corpus exposure.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      A lawful-intercept transcript is generically Medium with Medium Personal-Privacy DLM because it reveals private
      communications and non-public investigative relationships.
