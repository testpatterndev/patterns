schema: testpattern/v1
name: Special Education and Special Needs Learning Plans
slug: au-qld-special-needs-education-plan
version: 1.6.0
type: regex
pattern_class: concept
description: >-
  Detects special education and special needs learning plans for a named student - personalised learning plans, individual curriculum/education/support plans, Education Adjustment Program profiles and student support plans with disability, adjustment and goal details - when the plan phrase sits with populated student identifiers and plan fields.
operation: >-
  Primary: personalised learning plan, individual(ised) curriculum/education/support/learning plan, Education Adjustment Program (profile), special needs (education) plan, student support plan, NCCD adjustment. 65 (discovery only): phrase alone. 75: phrase plus a populated student identifier field. 85: student field plus a populated plan field (disability/impairment category, verified disability, diagnosis, adjustment level/category, learning goals, support hours or needs, review date, case manager, responsible or specialist teacher) plus independent school/support evidence (Department of Education, State School, OneSchool, guidance officer, speech-language pathologist, occupational therapist, parent consultation, reasonable adjustment, Disability Standards for Education). Template and guidance/training framing excluded from 75/85. Converted from keyword_list to regex.
pattern: (?i)\b(?:personali[sz]ed\s+learning\s+plan|individual(?:ised)?\s+(?:curriculum|education(?:al)?|support|learning)\s+plan|education\s+adjustment\s+program(?:\s+profile)?|special\s+needs\s+(?:education\s+)?plan|student\s+support\s+plan|NCCD\s+adjustment)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated student identifier; 85 also needs a plan field and school/support evidence. Inclusion policies and professional-learning material stay at 65.
jurisdictions:
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - Education (General Provisions) Act 2006 (Qld)
  - Disability Standards for Education 2005 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
  - SOC 2
data_categories:
  - pii
  - children
  - health
  - education
  - government
test_cases:
  should_match:
    - value: "Individual education plan - Harbourview State School\nStudent name: Riley Ashworth\nYear level: 4\nDisability category: Autism spectrum disorder (verified)\nAdjustment level: Substantial\nLearning goals: independent transitions between activities\nReview date: 20/11/2026\nPrepared with the guidance officer after parent consultation."
      description: Populated individual education plan with student, plan fields and school-support evidence (85)
      synthetic: true
    - value: "Personalised learning plan meeting\nStudent: Casey Rourke\nParent: Jordan Rourke"
      description: Plan meeting note with labelled student fields only (75)
      synthetic: true
  should_not_match:
    - value: "Special needs of the business"
      description: Non-match 1
    - value: "Education reform announcement"
      description: Non-match 2
    - value: "Sample template for a learner support record: learner name, year, goals, review date."
      description: Adjacent template language is not a populated special-needs plan
    - value: "The public policy discusses classroom adjustment planning requirements."
      description: Public policy has no special-needs-plan primary or populated student fields
    - value: "Individual business continuity plan for special operational needs."
      description: Sibling planning language does not satisfy the education-plan primary
    - value: "Policy guidance: this procedure explains how individual education plan documents are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Individual education plan\nStudent name: ____________________\nYear level: ____________________\nDisability category: ____________________\nLearning goals: ____________________\nReview date: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "Training: this professional learning session shows teachers how a personalised learning plan links reasonable adjustment decisions to the Disability Standards for Education."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: Generic special needs or education references.
    mitigation: Require IEP, EAP, or verified disability specific terms.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  Special education plans combine a child's identity with disability and support arrangements. Risk 8 OFFICIAL:Sensitive
  remains appropriate for child education + disability substance.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_special_needs_plan
      matches:
        - ref: Regex_au_qld_special_needs_education_plan_student_fields
        - ref: Regex_au_qld_special_needs_education_plan_plan_fields
        - ref: Evidence_school_support_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_special_needs_education_plan_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_special_needs_plan
      matches:
        - ref: Regex_au_qld_special_needs_education_plan_student_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_special_needs_education_plan_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_special_needs_plan
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_special_needs_plan
      pattern: (?i)\b(?:personali[sz]ed\s+learning\s+plan|individual(?:ised)?\s+(?:curriculum|education(?:al)?|support|learning)\s+plan|education\s+adjustment\s+program(?:\s+profile)?|special\s+needs\s+(?:education\s+)?plan|student\s+support\s+plan|NCCD\s+adjustment)\b
    - id: Regex_au_qld_special_needs_education_plan_student_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|student(?:\s+name)?|pupil|child|candidate(?:\s+name)?|EQ\s*ID|LUI|USI|year\s+level|grade\s+level|parent(?:\s+name)?|guardian|carer|(?:student|candidate|enrolment|applicant|file)\s*(?:no\.?|number|ID)|home\s+group|class)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_au_qld_special_needs_education_plan_plan_fields
      pattern: (?i)\b(?:(?:disability|impairment)\s+category|verified\s+disability|diagnosis|adjustment(?:\s+(?:level|category|type))?|level\s+of\s+adjustment|learning\s+goals?|goal\s+\d|support\s+(?:hours|provided|needs)|review\s+date|case\s+manager|responsible\s+teacher|specialist\s+teacher)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Evidence_school_support_context
      groups:
        - match_style: word
          terms:
            - Department of Education
            - Education Queensland
            - State School
            - OneSchool
            - guidance officer
            - speech-language pathologist
            - occupational therapist
            - parent consultation
            - reasonable adjustment
            - Disability Standards for Education
      strength: specific
    - id: Keyword_au_qld_special_needs_education_plan_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.6.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): converted keyword_list to regex; 75/85 were gated by field-name keywords ('student name', 'year level') that match blank forms. 75 now needs a populated student identifier and 85 needs student fields plus a populated plan field plus school/support evidence. Bare acronym primaries (PLP/ICP/ISSP, case-insensitive) removed. Tests replaced with populated records plus policy, blank-form and training decoys. Regulations: removed HRIPA, My Health Records Act and NDB; added Education (General Provisions) Act 2006 (Qld) and Disability Standards for Education 2005 (Cth); references added."
  - version: 1.5.1
    date: '2026-07-19'
    description: >-
      Merge au-top500-345-special-education-plans: expanded name/description/risk for combined coverage; absorbed unique
      test cases; companion SIT deprecated.
  - version: 1.5.0
    date: '2026-07-19'
    description: >-
      Targeted blocker remediation: add a 65 discovery plan tier, require populated student-plan fields at 75 and
      Queensland education-authority evidence at 85, plus exact-tier and sibling/public/template probes.
  - version: 1.4.1
    date: '2026-07-14'
    description: >-
      v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 588 without changing
      detector or package metadata.
  - version: 1.4.0
    date: '2026-07-09'
    description: >-
      C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored
      as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged);
      derived by scripts/derive-pattern-class.mjs + spot review
  - version: 1.3.0
    date: '2026-07-04'
    description: Replace bare generic keyword terms with domain-anchored phrases (FP reduction)
  - version: 1.2.0
    date: '2026-07-04'
    description: >-
      Mapped non-canonical confidence 95 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest
      canonical tier.
