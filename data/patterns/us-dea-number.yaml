schema: testpattern/v1
name: DEA
slug: us-dea-number
version: 1.5.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects DEA patterns. This pattern is based on a Microsoft Purview built-in sensitive information type. Users already running Purview may prefer to enable the built-in SIT directly, or use this version as a starting point for customisation.
operation: >-
  Checksum enforced in Purview via split inline Checksum validators: Validator_us_dea_alpha (Weights 1,2,1,2,1,2,0 / Mod 10 / CheckDigit 7 on [ABFGMPRX][A-Z]\d{7}) and Validator_us_dea_nine (Weights 0,1,2,1,2,1,2,0 / Mod 10 / CheckDigit 8 on [ABFGMPRX]9\d{7}, zero-weighting the leading 9 registrant marker), computing ((d1+d3+d5) + 2*(d2+d4+d6)) mod 10 == d7 exactly. Reference: https://en.wikipedia.org/wiki/DEA_number Corroborative
  evidence: 19 keywords within 300 characters. Keyword lists: healthcare-identifiers, au-healthcare-medications.
pattern: (?-i)\b([ABFGMPRX][A-Z9]\d{7})\b
confidence: high
confidence_justification: 'High confidence: validated with Checksum: (d1+d3+d5) + 2*(d2+d4+d6) and supported by corroborative keyword evidence.'
jurisdictions:
  - us
regulations:
- CCPA/CPRA
- FTC Act
- HIPAA
- State Breach Laws (US)
frameworks:
- ISO 27001
- ISO 27701
- SOC 2
data_categories:
  - phi
  - healthcare
corroborative_evidence:
  keywords:
    - MRN
    - medical record number
    - patient ID
    - NPI
    - DEA
    - medicare
    - medicaid
    - insurance ID
    - member ID
    - beneficiary
    - ICD-10
    - ICD-9
    - CPT
    - NDC
    - SNOMED
    - HCPCS
    - diagnosis code
    - procedure code
    - drug code
  proximity: 300
  keyword_lists:

    - healthcare-identifiers

    - au-healthcare-medications
test_cases:
  should_match:
    - value: AB1234563
      description: Standard DEA number (Mod-10 checksum valid)
    - value: FA9876547
      description: DEA with F prefix (Mod-10 checksum valid)
    - value: MR1234563
      description: Mid-level practitioner DEA (Mod-10 checksum valid)
    - value: A91234563
      description: DEA number with 9 in second character position (Mod-10 checksum valid)
  should_not_match:
    - value: CB1234563
      description: Invalid first character (C not in valid set A/B/F/G/M/P/R/X)
    - value: AB123456
      description: Only 6 digits instead of 7
    - value: AB12345678
      description: 8 digits instead of 7
    - value: AB1234567
      description: Fails DEA Mod-10 checksum (perturbation of AB1234563)
    - value: A91234567
      description: Fails DEA Mod-10 checksum on 9-second-character form
false_positives:
  - description: >-
      Medical terminology in health education materials, research publications, clinical guidelines, or public health
      documents without patient-specific data.
    mitigation: >-
      Require corroborative evidence keywords confirming patient context. Look for co-occurrence with patient
      identifiers such as medical record numbers or dates of birth.
  - description: General wellness and fitness content using medical vocabulary without constituting protected health information.
    mitigation: >-
      Layer with patient identifier patterns or healthcare-specific document structure detection to distinguish clinical
      records from general health content.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match:
        type: any
        ids:
          - Regex_us_dea_alpha
          - Regex_us_dea_nine
      matches:
        - ref: Keyword_us_dea_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match:
        type: any
        ids:
          - Regex_us_dea_alpha
          - Regex_us_dea_nine
      matches:
        - ref: Keyword_us_dea_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Regex_us_dea_alpha
          - Regex_us_dea_nine
  regexes:
    - id: Regex_us_dea_alpha
      pattern: (?-i)\b([ABFGMPRX][A-Z]\d{7})\b
      validators:
        - ref: Validator_us_dea_alpha
    - id: Regex_us_dea_nine
      pattern: (?-i)\b([ABFGMPRX]9\d{7})\b
      validators:
        - ref: Validator_us_dea_nine
  validators:
    - id: Validator_us_dea_alpha
      type: Checksum
      params:
        weights: "1,2,1,2,1,2,0"
        mod: 10
        checkDigit: 7
    - id: Validator_us_dea_nine
      type: Checksum
      params:
        weights: "0,1,2,1,2,1,2,0"
        mod: 10
        checkDigit: 8
  keywords:
    - id: Keyword_us_dea_specific
      groups:
        - match_style: word
          terms:
            - DEA number
            - DEA registration
            - DEA no
            - DEA#
            - Drug Enforcement Administration
            - DEA certificate
            - controlled substance
            - prescriber DEA
      strength: specific
    - id: Keyword_us_dea_broad
      groups:
        - match_style: word
          terms:
            - text: DEA
              case_sensitive: true
            - prescription
            - prescriber
            - pharmacy
            - controlled substance
            - narcotic
            - schedule II
            - dispensing
      strength: domain
risk_rating: 5
risk_description: >-
  The high-confidence regex recognizes a US DEA registration-number structure with checksum validation and healthcare or medication context; it identifies a registered prescriber or organization, not a prescription pad or signing credential. A valid number can be reused in forged controlled-substance paperwork or provider impersonation, but successful diversion also needs the registrant's name, signature, prescribing details, and a willing processing channel. The normal unit is one professional registration reference, some of which can be verified through legitimate healthcare workflows. Risk 5 and OFFICIAL reflect bounded fraud-enablement value, while a complete prescriber identity package or active diversion record would be SENSITIVE.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: "CUI Specified"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "CONFIDENTIAL"
  ca_gov: "Protected B"
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because a DEA number alone neither authorizes
    dispensing nor supplies a complete prescription. SENSITIVE is not met without correlated prescriber identity,
    signature, drug, patient, or transaction data capable of moderate direct harm.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low DLM fits one validated professional registration reference with limited independent exploitability.
      Prescribing credentials or fraud packages require stronger handling.
references:
  - url: https://learn.microsoft.com/en-us/purview/sit-defn-drug-enforcement-agency-number
    title: "Drug Enforcement Agency (DEA) number entity definition - Microsoft Learn"
