{
  "schema": "testpattern/v1",
  "name": "Labelled Education Student Identifier Record",
  "slug": "au-education-student-id-record",
  "version": "1.0.2",
  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated labelled education student identifier record using record context and corroborating fields.",
  "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:ID|number)[ \\t]*[:#][ \\t]*(?=[A-Z0-9-]{4,20}\\b)(?=[A-Z0-9-]*\\d)[A-Z0-9][A-Z0-9-]{3,19}\\b",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
  "regulations": [
    "Student Identifiers Act 2014 (Cth)",
    "Education (General Provisions) Act 2006 (Qld)",
    "Information Privacy Act 2009 (Qld)",
    "Privacy Act 1988 (Cth)"
  ],
  "frameworks": [
    "ISO 27001",
    "ISO 27701"
  ],
  "data_categories": [
    "education",
    "pii"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated labelled education student identifier record can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://ppr.qed.qld.gov.au/pp/enrolment-in-state-primary-secondary-and-special-schools-procedure"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE Personal-Privacy"
  },
  "package_tags": {
    "primary_component": "student-child-records",
    "components": [
      "student-child-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "privacy"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:ID|number)[ \\t]*[:#][ \\t]*(?=[A-Z0-9-]{4,20}\\b)(?=[A-Z0-9-]*\\d)[A-Z0-9][A-Z0-9-]{3,19}\\b"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:school|college|university|TAFE|RTO)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{2,70}"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:student name|learner name)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{2,70}"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      }
    ]
  },
  "test_cases": {
    "should_match": [
      {
        "value": "School: Rivergum College\nStudent name: Avery Teston\nStudent ID: RG20451\nEnrolment: Year 7",
        "description": "Synthetic populated record variant 1",
        "synthetic": true
      },
      {
        "value": "TAFE: River District Institute\nLearner name: Morgan Teston\nLearner number: 72849106\nCourse: Certificate III",
        "description": "Synthetic populated record variant 2",
        "synthetic": true
      },
      {
        "value": "School: Rivergum College\nStudent name: Avery Teston\nStudent ID: RG20451\nEnrolment: Year 7\nForm template version 2.1. Retain the completed record.",
        "description": "Synthetic populated record variant 3",
        "synthetic": true
      },
      {
        "value": "TAFE: River District Institute\nLearner name: Morgan Teston\nLearner number: 72849106\nCourse: Certificate III",
        "description": "Synthetic populated record variant 4",
        "synthetic": true
      }
    ],
    "should_not_match": [
      {
        "value": "School: Rivergum College\nStudent name: Avery Teston\nTelephone: 0712345678",
        "description": "Synthetic public, blank, distant or unrelated counterexample 1",
        "synthetic": true
      },
      {
        "value": "School: __________\nStudent name: __________\nStudent ID: __________\nEnrolment: __________",
        "description": "Synthetic public, blank, distant or unrelated counterexample 2",
        "synthetic": true
      },
      {
        "value": "School: Rivergum College\nEmployee name: Jordan Staffson\nEmployee name: Jordan Staffson\nEnrolment: Year 7",
        "description": "Synthetic public, blank, distant or unrelated counterexample 4",
        "synthetic": true
      }
    ]
  },
  "exports": [
    "yaml",
    "purview"
  ],
