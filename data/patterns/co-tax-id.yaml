schema: testpattern/v1
name: Colombia Tax Identification Number
slug: co-tax-id
version: 1.4.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects Colombia Tax Identification Number patterns. This pattern is based on a Microsoft Purview built-in sensitive information type. Due to the numeric format, corroborative evidence keywords are
  essential for reliable detection.
operation: 'Corroborative evidence: 5 keywords within 300 characters. Keyword lists: tax-id, co-financial. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.'
pattern: \b(?<!-)\d{6,10}-?\d?\b
confidence: medium
confidence_justification: >-
  Medium confidence: variable-length numeric patterns are common. Colombian NIT keywords like 'NIT' or 'DIAN' are required for reliable identification. Added context gating and exclusion rules improve
  precision and reduce incidental matches.
jurisdictions:
  - co
regulations:
  - Habeas Data Law (Colombia)
data_categories:
  - pii
  - financial
  - government-id
corroborative_evidence:
  keywords:
    - NIT
    - número de identificación tributaria
    - DIAN
    - RUT
    - cédula
  proximity: 300
  keyword_lists:
    - tax-id
    - co-financial
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: 900123456-7
      description: Colombian NIT with check digit
    - value: '1234567890'
      description: Ten-digit Colombian tax ID
    - value: 123456-7
      description: Short-form Colombian NIT
    - value: 'NIT: 900123456-7, razón social Ejemplo S.A.S., Bogotá, Colombia'
      description: Labelled NIT with independent Colombian tax context (85 tier)
  should_not_match:
    - value: '12345'
      description: Too few digits for Colombian tax ID
    - value: '123456789012'
      description: 12 digits exceeds maximum length for Colombian NIT
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
    - value: "TAX INVOICE\nInvoice number: INV-204511\nCustomer reference: 204511\nAmount due: $1,245.60"
      description: >-
        Australian invoice remittance block (2026-10-16 boilerplate run). The word "tax" used to satisfy both 85
        evidence refs on its own; the prefixed INV-204511 is now rejected and the bare reference stays at 65 discovery.
    - value: 'Factura número 204511, impuesto incluido'
      description: Spanish-language invoice number; generic tax words without a NIT/RUT/DIAN label stay at 65 discovery
false_positives:
  - description: Generic numeric sequences in non-tax contexts such as reference numbers or account identifiers
    mitigation: Require corroborative evidence keywords within the proximity window to distinguish tax identifiers from general numeric data.
  - description: >-
      Invoice, order and customer reference numbers in any tax invoice: a 6-10 digit run next to "tax", "factura" or
      "impuesto" used to reach 85, because the word "tax" satisfied both 85 evidence refs at once.
    mitigation: >-
      75 needs a Colombian tax-ID label (NIT, RUT, DIAN, número de identificación tributaria) and 85 adds independent
      Colombian tax context; generic tax words alone stay at the 65 discovery tier. The regex also rejects a digit run
      that follows a hyphen, as in prefixed references like INV-204511.
  - description: Numbers from other identification schemes with similar digit patterns
    mitigation: Layer with jurisdiction-specific detection to prioritise matches in tax-related documents and cross-reference with other identifier types.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    # A labelled value (NIT/RUT/DIAN within the window) is 75; 85 also needs
    # independent Colombian tax context. A bare "tax" or "factura" next to an
    # invoice or order number stays at the 65 discovery tier.
    - confidence_level: 85
      id_match: Regex_co_tax_id
      matches:
        - ref: Keyword_co_tax
        - ref: Keyword_co_tax_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_co_tax_id
      matches:
        - ref: Keyword_co_tax
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_co_tax_id
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_co_tax_id
      pattern: \b(?<!-)\d{6,10}-?\d?\b
  keywords:
    - id: Keyword_co_tax
      groups:
        - match_style: word
          terms:
            - text: NIT
              case_sensitive: true
            - número de identificación tributaria
            - DIAN
            - text: RUT
              case_sensitive: true
            - registro único tributario
            - cédula tributaria
      strength: specific
    - id: Keyword_co_tax_context
      groups:
        - match_style: word
          terms:
            - Colombia
            - colombiana
            - colombiano
            - identificación fiscal
            - contribuyente
            - impuesto
            - declaración de renta
            - factura
            - razón social
      strength: domain
  filters:
    - id: Guard_co_tax_id_same_digits
      type: AllDigitsSameFilter
risk_rating: 5
risk_description: >-
  The rule finds a six-to-ten digit Colombian tax identifier, optionally with its verification digit, when NIT, DIAN, or related tax language is nearby. The value may belong to an individual taxpayer or a legal entity and can be reused in false invoices, registration lookups, or convincing tax-themed impersonation. Harm to the taxpayer is bounded because the number does not reveal a return, tax debt, credential, or filing authority and generic reference numbers remain a collision source. Risk 5 and OFFICIAL fit that limited misuse potential; connection to private returns, payment details, or authenticated DIAN access would raise the material toward SENSITIVE.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to PSPF OFFICIAL, QGISCF OFFICIAL, DLM OFFICIAL, and Low for one contextual Colombian taxpayer
    identifier. The next SENSITIVE level is not met because the match neither distinguishes a person from an entity nor
    establishes confidential tax content, financial authority, or account access.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low and Low DLM reflect a tax reference whose standalone disclosure creates bounded impersonation and linkage
      risk. A return, assessment, debt record, or credential would be a different and more harmful information unit.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-09'
updated: '2026-10-20'
changelog:
  - version: 1.4.0
    date: '2026-10-20'
    description: "Invoice-number false positive (2026-10-16 boilerplate run): an Australian remittance block (\"Tax invoice\", \"Invoice number: INV-204511\") reached 85, because the generated 85 tier took the word \"tax\" as both its label and its domain evidence, and the second 85 tier fired on generic words such as factura or impuesto. Removed the generated tier with its Pattern_co_tax_id_label_context and Keyword_co_tax_id_domain_context. Keyword_co_tax now holds only the Colombian tax-ID labels (NIT, RUT, DIAN, número de identificación tributaria, registro único tributario, cédula tributaria); the generic tax words move to a new Keyword_co_tax_context with Colombia. 75 = value + label, 85 = value + label + context, 65 unchanged. The regex (and its top-level copy) rejects a digit run that follows a hyphen, so INV-204511 no longer matches. Added the remittance block and a Spanish invoice line as should_not_match."
  - version: 1.3.4
    date: '2026-09-25'
    description: 'References completed: every reference has a title and a verified URL.'
  - version: 1.3.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): filled empty frameworks (ISO 27001, ISO 27701)."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1157 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.2
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.1
    date: '2026-07-06'
    description: Add AllDigitsSameFilter guard — primary regex accepted all-zeros/same-digit tax ID values (e.g. 0000000000); mirrors au-medicare-card-identifier protection.
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 90 to 85.; Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
