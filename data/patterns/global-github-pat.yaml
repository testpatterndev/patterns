schema: testpattern/v1
name: Github Pat
slug: global-github-pat
version: 1.7.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects GitHub access tokens by prefix: classic personal access tokens (ghp_), OAuth tokens (gho_), GitHub App user tokens (ghu_), refresh tokens (ghr_) and GitHub App installation tokens (ghs_).
  Installation tokens are matched in both formats: the legacy 40-character form and the stateless form GitHub made the default in October 2026 (still ghs_, about 520 characters, a JWT with two dots).
  Fine-grained personal access tokens (github_pat_) are covered by global-github-pat-fine-grained. This pattern is based on a Microsoft Purview built-in sensitive information type. Users already
  running Purview may prefer to enable the built-in SIT directly, or use this version as a starting point for customisation.
operation: >-
  Two regexes share the same tiers. (1) Opaque tokens: one of the prefixes ghp_, gho_, ghu_, ghs_, ghr_ followed by exactly 36 alphanumeric characters (reference:
  https://github.blog/changelog/2021-03-31-authentication-token-format-updates/). (2) Stateless installation tokens: ghs_ followed by three runs of letters, digits, hyphens and underscores joined by
  exactly two dots, i.e. the ghs_APPID_JWT layout. GitHub publishes the prefix, the two dots, the character set and an approximate length of 520 that varies with the token's contents; it publishes no
  segment lengths, so the bounds are deliberately loose (first run 20-300, second 20-1000, third 20-700) and the regex does not assume a numeric app ID or an eyJ header. Tiers: 85 with a GitHub keyword
  within 300 characters, 65 discovery-only for a bare token. Template/sample text is excluded on both.
pattern: (?-i)\b((?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36})\b
confidence: high
confidence_justification: >-
  High confidence: every branch starts with a GitHub-specific prefix that GitHub introduced so that scanners can identify its tokens. The opaque branch is a fixed 40 characters. The stateless
  installation-token branch needs ghs_ plus three long URL-safe runs joined by exactly two dots, which file names and identifiers that merely begin with ghs_ do not satisfy. GitHub advises treating
  tokens as opaque and may change the stateless layout again; the bounds leave room above the published length of about 520 for that reason. The checksum in the opaque format is not validated.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - CIS Controls
  - ISO 27001
  - NIST CSF
  - PCI-DSS
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - api key
    - api_key
    - apikey
    - access key
    - secret key
    - private key
    - auth token
    - authorization
  proximity: 300
  keyword_lists:
    - credentials
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0123
      description: GitHub PAT with ghp prefix
    - value: gho_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0123
      description: GitHub OAuth token
    - value: ghs_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0123
      description: GitHub server-to-server token
    - value: ghs_1234567_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij.ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123_-.abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefgh
      description: Bare stateless installation token (ghs_, app ID, underscore, then a three-part JWT; 488 characters); 65 discovery tier
    - value: 'GitHub App installation token: ghs_1234567_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij.ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123_-.abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefgh'
      description: Labelled stateless installation token; 85 tier
    - value: 'https://x-access-token:ghs_7654321_KLMNOPQRSTUVWXYZabcdefghijklmnopqrst.0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRST.ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGH@github.com/octo-org/octo-repo.git'
      description: Stateless installation token embedded in a git remote URL (github.com supplies the keyword); 85 tier
  should_not_match:
    - value: GitHub Actions reads ghs_config.production.yaml before each deploy
      description: A file name that begins with ghs_ and has two dots; the runs are far shorter than a token's
    - value: 'GitHub App installation token: ghs_1234567_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij.ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'
      description: ghs_ value with only one dot (a truncated stateless token) is neither format
    - value: ghx_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef01
      description: Invalid prefix (ghx instead of ghp/gho/ghu/ghs/ghr)
    - value: ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0
      description: Too few characters after prefix (35 instead of 36)
    - value: ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef012
      description: Too many characters after prefix (37 instead of 36)
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
false_positives:
  - description: Expired tokens. Installation tokens (ghs_) expire after one hour, so one found in an old CI log or chat export is usually dead.
    mitigation: The pattern cannot test validity. Treat a recent match as live; for older content, confirm the timestamp before escalating.
  - description: Made-up tokens in documentation, tests and tutorials that copy the real prefix and length.
    mitigation: The template-exclusion dictionary suppresses values framed as examples or placeholders. The opaque format's checksum is not validated, so structurally valid fakes still match.
  - description: Source files, variables or keys whose names begin with ghs_ and contain dots.
    mitigation: The stateless branch needs three runs of at least 20 characters with no other punctuation, joined by exactly two dots, which names of this kind do not reach.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: &id001
        type: any
        ids:
          - Regex_github_pat
          - Regex_github_stateless_installation_token
      matches:
        - ref: Keyword_github_pat
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: *id001
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_github_pat
      pattern: (?-i)\b((?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36})\b
    - id: Regex_github_stateless_installation_token
      pattern: (?-i)(?<![A-Za-z0-9_.-])(ghs_[A-Za-z0-9_-]{20,300}\.[A-Za-z0-9_-]{20,1000}\.[A-Za-z0-9_-]{20,700})(?![A-Za-z0-9_-])
  keywords:
    - id: Keyword_github_pat
      groups:
        - match_style: word
          terms:
            - GitHub
            - personal access token
            - text: PAT
              case_sensitive: true
            - github token
            - access token
            - gh token
            - repository token
            - git credential
            - GITHUB_TOKEN
            - github api
            - GitHub App
            - installation token
            - installation access token
      strength: specific
risk_rating: 8
risk_description: >-
  The pattern identifies GitHub token prefixes for personal, OAuth, user-to-server, server-to-server, and refresh credentials followed by the expected 36-character body, and GitHub App installation tokens in the longer stateless ghs_ format. A valid token can authenticate to GitHub and expose or modify repositories, issues, packages, workflows, or account data within that token's grants. The normal affected scale is one token owner, application installation, or server relationship, while token type, expiry, revocation, and permissions determine actual reach. Risk 8 SENSITIVE is retained for serious bounded account or repository compromise; PROTECTED needs demonstrated organisation-wide administration or critical software-supply-chain control.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because a live GitHub token
    can be replayed directly against resources allowed by its type and scopes. PROTECTED is not established by the
    prefix alone because privileges, ownership, validity, organisation reach, and criticality are unknown.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic treatment is Medium with Medium InfoTech controls for GitHub bearer credentials, including immediate
      revocation and secret scanning after disclosure. High applies only when the specific token is shown to control
      broad administration, releases, signing, or other high-impact supply-chain functions.
references:
  - url: https://learn.microsoft.com/en-us/purview/sit-defn-github-personal-access-token
    title: GitHub personal access token entity definition - Microsoft Learn
  - url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github
    title: About authentication to GitHub, GitHub's token formats - GitHub Docs (prefix per token type; stateless ghs_APPID_JWT rollout from 27 April 2026; installation tokens may not be 40 characters)
  - url: https://github.blog/changelog/2026-04-24-notice-about-upcoming-new-format-for-github-app-installation-tokens/
    title: GitHub changelog, 24 April 2026 (installation tokens change to ghs_APPID_JWT, about 520 characters and varying; ghs_[A-Za-z0-9]{36} may not match; GitHub Enterprise Server not affected)
  - url: https://github.blog/changelog/2026-05-15-github-app-installation-tokens-per-request-override-header
    title: GitHub changelog, 15 May 2026 (a stateless token has two dots, a stateful one none; GitHub's recommended regex for both is ghs_[A-Za-z0-9\.\-_]{36,})
  - url: https://github.blog/changelog/2026-10-02-stateless-github-app-installation-tokens-rolled-out/
    title: GitHub changelog, 2 October 2026 (stateless format is now the default for newly minted installation tokens; still ghs_, about 520 characters instead of 40)
created: '2026-02-08'
updated: '2026-11-25'
changelog:
  - version: 1.7.0
    date: '2026-11-25'
    description: State explicit regex case rule ((?i) or (?-i)) and align tier/keyword semantics with Microsoft Purview evaluation.
  - version: 1.6.0
    date: '2026-11-16'
    description: 'Added the stateless GitHub App installation token format as a second regex (Regex_github_stateless_installation_token): ghs_ followed by three URL-safe runs joined by exactly two dots. GitHub made this format the default on 2 October 2026; at about 520 characters it never matched the 36-character branch, so new installation tokens went undetected. The existing branch for ghp_/gho_/ghu_/ghr_ and legacy ghs_ is unchanged, and both regexes share the 85 and 65 tiers. Added GitHub App and installation-token keywords, test cases for the new format, pattern-specific false positives and the GitHub sources; description, operation and confidence justification rewritten to say what is matched.'
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking. An existing group around part of the match became (?:...).'
  - version: 1.4.0
    date: '2026-10-20'
    description: 'Generated name-word tier removed: the 85 tier whose only evidence was the detector name split into words (Pattern_global_github_pat_label_context + Keyword_global_github_pat_domain_context). The only lost lift is the lower-case acronym; the curated keyword holds it case-sensitive (SAS, PAT). The bare token stays at its current level; only the lift from a generic name word is removed. Name words that identify the service stay through the curated keyword. Definitions left unreferenced are removed.'
  - version: 1.3.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1236 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 90 to 85.; Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
