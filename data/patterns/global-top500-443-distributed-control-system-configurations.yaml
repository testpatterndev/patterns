    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): primary broadened to DCS configuration/database/tag/I/O list and named-platform configuration wording (bare controller configuration removed); keyword-only content/live-detail groups (phrase-only path) replaced with an ISA instrument-tag regex and a populated configuration-parameter regex; 75 needs either; 85 needs two instrument tags, a parameter and DCS-engineering context; guidance exclusion; populated tag-list tests and decoys; irrelevant privacy/AML/health/TIA regulations replaced with SOCI Act; IEC 62443/ISO 27001/NIST CSF frameworks and NIST SP 800-82 reference added.'
  - version: 1.3.0
    date: '2026-07-04'
    description: 'CI profile hardening: align the global DCS detector with the reviewed configuration contract; require controller, module, I/O, tag, alarm, or loop content at 75 and a deployable tag, value, node, rack, or site reference at 85.'
  - version: 1.2.3
    date: '2026-07-15'
    description: 'v25 authoritative risk alignment from Compl8DLPDeploy workbook row 1983; detector and package metadata unchanged.'
  - version: 1.2.2
