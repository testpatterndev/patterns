schema: testpattern/v1
name: Distributed control system configurations
slug: global-top500-443-distributed-control-system-configurations
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects distributed control system configuration records: DCS configuration/database/tag-list wording with instrument tags and populated setpoints, alarm limits, controller nodes, card/channel assignments and IP addresses. Topic wording alone is discovery-only.
operation: >-
  Regex_dcs_config_primary (DCS configuration/database/tag or I/O list, control module configuration or named DCS platform configuration wording) is discovery-only at 65. 75 requires the primary plus one populated structure: an ISA-style instrument tag with loop number (TIC-204, FT-1101, XV-3302) or a populated configuration parameter (setpoint, alarm limits, range, gain/reset, mode, controller node, card/channel/slot, IP address). 85 requires an ISA-style instrument tag with loop number (TIC-204, FT-1101, XV-3302) (two distinct hits), a populated configuration parameter (setpoint, alarm limits, range, gain/reset, mode, controller node, card/channel/slot, IP address), and independent DCS-engineering (control module, function block, PID, interlock, trip, historian, stations) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_dcs_config_guidance_exclusion).
pattern: >-
  (?i)\b(?:distributed\s+control\s+system|DCS\s+(?:configuration|database|tag\s+list|point\s+list|I/O\s+list|export)|control\s+module\s+configuration|(?:DeltaV|Experion\s+PKS|CENTUM\s+VP|System\s+800xA|Ovation|SIMATIC\s+PCS\s?7)\s+(?:configuration|database|export|control\s+module|tag))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (an ISA-style instrument tag with loop number (TIC-204, FT-1101, XV-3302) or a populated configuration parameter (setpoint, alarm limits, range, gain/reset, mode, controller node, card/channel/slot, IP address)), and 85 needs two distinct structures plus independent DCS-engineering (control module, function block, PID, interlock, trip, historian, stations) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
  - global
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
  - IEC 62443
  - ISO 27001
  - NIST CSF
data_categories:
  - security
corroborative_evidence:
  keywords:
    - control module
    - function block
    - PID
    - interlock
    - trip
    - alarm priority
    - historian
    - engineering station
    - operator station
    - redundant controller
  proximity: 300
test_cases:
  should_match:
    - value: The distributed control system upgrade is scheduled for the 2027 shutdown.
      description: Discovery probe (65)
      synthetic: true
    - value: |-
        DeltaV configuration export - Unit 200
        Setpoint: 365 degC
        Controller node: CTRL-07
      description: Medium-tier probe (75) - populated configuration parameters
      synthetic: true
    - value: |-
        DCS tag list - Unit 200 reactor
        TIC-204 control module PID, Setpoint: 365 degC, HH: 390, LL: 300
        FT-2210 flow transmitter, Range: 0-120 m3/h
        XV-2302 trip valve on high-high temperature interlock
        Controller node: CTRL-07 (10.40.2.17), Card: 3, Channel: 12; alarm priority critical.
      description: High-tier probe (85) - several instrument tags, populated parameters, IP and engineering context
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match
    - value: 'Policy statement: changes to the distributed control system follow the OT management-of-change procedure.'
      description: Policy text
      synthetic: true
    - value: |-
        DCS configuration template
        Setpoint: ________
        Controller node: [insert]
      description: Blank template
      synthetic: true
    - value: 'Course module 3: in a DeltaV control module, TIC-204 uses a PID function block with Setpoint: 365.'
      description: Training framing
      synthetic: true
false_positives:
  - description: Vendor DCS manuals and training describe control modules and tags.
    mitigation: Guidance/training framing is excluded; 85 needs two instrument tags, populated parameters and engineering context.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_dcs_config_primary
      matches:
        - ref: Regex_dcs_config_instrument_tag
          min_count: 2
          unique_results: true
        - ref: Regex_dcs_config_config_parameter
        - ref: Keyword_dcs_config_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_dcs_config_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_dcs_config_primary
      matches:
        - type: any
          refs:
            - Regex_dcs_config_instrument_tag
            - Regex_dcs_config_config_parameter
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_dcs_config_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_dcs_config_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_dcs_config_primary
      pattern: >-
        (?i)\b(?:distributed\s+control\s+system|DCS\s+(?:configuration|database|tag\s+list|point\s+list|I/O\s+list|export)|control\s+module\s+configuration|(?:DeltaV|Experion\s+PKS|CENTUM\s+VP|System\s+800xA|Ovation|SIMATIC\s+PCS\s?7)\s+(?:configuration|database|export|control\s+module|tag))\b
    - id: Regex_dcs_config_instrument_tag
      pattern: >-
        \b(?:TIC|PIC|FIC|LIC|AIC|TT|PT|FT|LT|AT|FV|TV|LV|PV|XV|HS|ZSO|ZSC|PSV|TIT|FIT|LIT|PIT)[-_]?\d{3,5}[A-Z]?\b
    - id: Regex_dcs_config_config_parameter
      pattern: >-
        (?i)\b(?:SP|setpoint|PV_?HI|PV_?LO|HI_?LIM|LO_?LIM|alarm\s+(?:limit|high|low)|HH|LL|range|EU\s*(?:HI|LO|range)|gain|reset|mode|controller\s+node|node(?:\s+(?:ID|name))?|IP\s+address|card|channel|slot)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}|\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b
  keywords:
    - id: Keyword_dcs_config_context
      groups:
        - match_style: word
          terms:
            - control module
            - function block
            - text: PID
              case_sensitive: true
            - interlock
            - trip
            - alarm priority
            - historian
            - engineering station
            - operator station
            - redundant controller
      strength: specific
    - id: Keyword_dcs_config_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - guidance note
            - best practice guide
            - media release
            - press release
            - news report
            - course module
            - learning objectives
            - awareness course
            - webinar
            - lesson plan
            - quiz question
      strength: domain
risk_description: >-
  The detector now requires DCS configuration wording plus instrument tags or populated configuration parameters (setpoints, alarm limits, nodes, IPs) before enforcing. A genuine configuration can reveal process logic and operating thresholds, helping an attacker manipulate equipment, disrupt production, or conceal unsafe states. The normal bounded configuration presents serious operational and safety risk, but the concept match does not guarantee credentials, write access, or a complete design for a critical service. For the global catalogue analogue, the confirmed substantive record is the consequence unit. A live DCS configuration exposes controller roles, parameters, alarms and dependencies. It can enable system-scale disruption or defeat safeguards, creating significant service or safety damage. Risk 9 and PROTECTED InfoTech therefore apply to the confirmed record itself. Require actual controller/configuration sections, tags, alarm limits, topology or site identifiers; vendor guides remain excluded. This is confidence and exception handling, not a reason to reduce the consequence of a true positive.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED InfoTech
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Confidential
classification:
  tier: High
  rationale: >-
    Risk 9 is warranted because a live DCS configuration exposes controller roles, parameters, alarms and dependencies.
    PSPF PROTECTED, QGISCF PROTECTED, PROTECTED InfoTech, PROT_IT, High and High InfoTech align with that credible
    significant-damage case. The global expression carries the same consequence once its record structure and
    operational context are established. Require actual controller/configuration sections, tags, alarm limits, topology
    or site identifiers; vendor guides remain excluded. Those controls govern match disposition while the confirmed
    record remains PROTECTED.
  generic:
    classification: High
    dlm: High InfoTech
    rationale: >-
      High InfoTech handling is appropriate because a live DCS configuration exposes controller roles, parameters,
      alarms and dependencies. Access should be restricted to operators and engineers responsible for the affected
      control environment or essential service. Global policy, historical and training references remain
      lower-confidence exceptions rather than lower-classified records.
