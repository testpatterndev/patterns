schema: testpattern/v1
name: Security clearance adjudication files
slug: global-top500-433-security-clearance-adjudication-files
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to security clearance adjudication files in international contexts.
  This information type is classified as personally identifiable information under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 1 keywords within 240 characters. Keyword lists: au-government-security-clearances. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.'
pattern: (?is)\b(security\s+clearance|background\s+investigation|personnel\s+security|clearance\s+level|top\s+secret|sensitive\s+compartmented|eligibility\s+determination|security\s+screening|need\s+to\s+know)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
  - GDPR
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
  - security clearance adjudication files
  proximity: 240
  keyword_lists:
  - au-government-security-clearances
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
  - value: security clearance
    description: Primary topic phrase match
  - value: background investigation
    description: Case-insensitive topic phrase match
  - value: personnel security
    description: Alternative topic phrase match
  - value: clearance level
    description: Additional topic phrase match
  - value: |-
      Security clearance
      Name: Avery Teston
    description: Populated person/client record with one field (75 tier)
    synthetic: true
  - value: |-
      Security clearance
      Name: Avery Teston
      Date of birth: 14/02/1988
    description: Populated person/client record with 2 distinct fields (85 tier)
    synthetic: true
  - value: Security clearance with polygraph
    description: Kept independent term "polygraph" with the phrase (75 tier)
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: classified contingency
    description: Generic word pair from old broad template should not match
  - value: Security clearance adjudication files
    description: "Bare detector name: it reached 85 through the generated name-word tier and must not reach an enforcing tier"
  - value: |-
      Security clearance:
      Name:
      Date of birth:
    description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
  - value: "Policy guidance: this procedure explains how records about security clearance are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Common words and phrases related to security clearance adjudication files appearing in policy documents, training
    materials, HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 240
  recommended_confidence: 85
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_security_clearance_adjudication
    matches:
      - ref: Regex_global_top500_433_security_clearance_adjudication_files_record_structure
        min_count: 2
        unique_results: true
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 75
    id_match: Regex_security_clearance_adjudication
    matches:
      - type: any
        min_matches: 1
        refs:
          - Keyword_security_clearance_adjudication
          - Regex_global_top500_433_security_clearance_adjudication_files_record_structure
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_security_clearance_adjudication
    matches:
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  regexes:
  - id: Regex_security_clearance_adjudication
    pattern: (?is)\b(security\s+clearance|background\s+investigation|personnel\s+security|clearance\s+level|top\s+secret|sensitive\s+compartmented|eligibility\s+determination|security\s+screening|need\s+to\s+know)\b
  - id: Regex_global_top500_433_security_clearance_adjudication_files_record_structure
    pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#)|subject|adjudicator|investigator)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
  keywords:
  - id: Keyword_security_clearance_adjudication
    groups:
    - match_style: word
      terms:
      - polygraph
    strength: specific
risk_description: This detector finds security-clearance, background-investigation, personnel-security, and clearance-level
  files with an Australian clearance keyword list. A genuine adjudication file can expose finances, relationships, health
  or conduct concerns, referee statements, vulnerabilities, and the reasoning behind a clearance decision, enabling coercion,
  stigma, or evasion of vetting. The normal subject file creates serious personal and government harm but does not inherently
  reveal classified holdings or active intelligence methods. Risk 8 supports SENSITIVE Personal-Privacy; PROTECTED would require
  protected sources, exploitable counterintelligence detail, or broad compromise of cleared personnel records.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: Secret
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Confidential
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and Personal-Privacy because adjudication files
    consolidate deeply personal vulnerabilities and consequential personnel-security judgments. PROTECTED is not met
    without protected sources, active counterintelligence methods, or significant compromise across a cleared workforce.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Security-clearance adjudications are generically Medium with Medium Personal-Privacy handling because intimate
      vetting evidence can support coercion and materially affect a person's career and access.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-30'
changelog:
- version: 1.4.0
  date: '2026-10-30'
  description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
- version: 1.3.0
  date: '2026-10-20'
  description: 'Generated name-word tier removed: the 85 and 75 tiers ANDed Pattern_*_label_context (the detector name, "Security clearance adjudication files") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 85. Both lists sit inside the IdMatch phrase, so the bare name alone scored 85. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs a populated person/client record field (Regex_global_top500_433_security_clearance_adjudication_files_record_structure) or the kept independent term polygraph; 85 needs 2 distinct fields. Curated terms that sit inside an IdMatch hit were removed. "adjudication" is the detector name (the IdMatch keeps "security clearance") and "vetting" restates the topic; both are dropped. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
- version: 1.2.5
  date: '2026-09-25'
  description: >-
    Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
    reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
- version: 1.2.3
  date: '2026-09-24'
  description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1974 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical
    tier.
