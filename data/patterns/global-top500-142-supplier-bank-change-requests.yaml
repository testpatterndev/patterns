  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs a populated BSB, bank account number, named supplier/payee or vendor number/ABN and 85 needs two distinct field types plus change-verification evidence. Removed the self-corroborating evidence group and the generic data-record-context import; trimmed generic primaries (supplier verification, fraud prevention, account update request). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped HRIPA, My Health Records Act, TIA Act and AML/CTF Act; added a verified ACSC business email compromise reference.
  - version: 1.3.1
