schema: testpattern/v1
name: Supplier bank change requests
slug: global-top500-142-supplier-bank-change-requests
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects supplier/vendor bank detail change requests - the payment-redirection pattern behind business email compromise: a bank-detail change phrase combined with a BSB, a bank account number, a named supplier/payee or a vendor number/ABN. Phrase-only mentions (scam warnings, AP procedures) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: supplier/vendor/creditor/payee bank (details) change/update/amendment (request), change of bank details, bank detail change/update, new/updated/revised bank (account) details, payment redirect(ion), BSB change, remittance update, vendor bank modification. 65 (discovery only): primary alone. 75: primary plus one populated field - BSB, bank account number, named supplier/vendor/payee/account name, or vendor number/ABN. 85: primary plus two distinct field types plus change-verification evidence (call-back/callback, verified by phone, effective date, previous/old account, authorised signatory, bank statement, letterhead, urgent). Template/sample and guidance/scam-warning framing excluded on every enforce tier.
pattern: >-
  (?i)\b(?:(?:supplier|vendor|creditor|payee)\s+bank(?:ing)?\s+(?:details?\s+)?(?:change|update|amendment)(?:\s+request)?|change\s+of\s+bank(?:ing)?\s+details|bank\s+details?\s+(?:change|update|amendment)|(?:new|updated|revised)\s+bank(?:ing)?\s+(?:account\s+)?details|payment\s+redirect(?:ion)?|BSB\s+change|remittance\s+(?:details\s+)?update|vendor\s+bank\s+modification)\b
confidence: medium
confidence_justification: >-
  Enforce tiers need a populated BSB, account, supplier or vendor-number field beside the change phrase; 'fraud prevention' and 'supplier verification' were removed from the primary because they matched generic policy text. Scam warnings and AP procedures stay at 65. Medium because legitimate supplier onboarding forms share the structure.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - call-back
    - callback
    - verified by phone
    - verbal verification
    - effective date
    - effective immediately
    - previous account
    - old account
    - authorised signatory
    - bank statement
  proximity: 300
  keyword_lists:
    - data-record-context
test_cases:
  should_match:
    - value: "Supplier bank details change request\nSupplier: Harbour Logistics Pty Ltd\nVendor ID: V10442\nABN: 51 824 753 556\nNew BSB: 064-000\nNew account number: 12345678\nEffective date: 01/10/2026. Verified by phone call-back to the number on file by Casey Rourke."
      description: Populated change request - supplier, vendor ID/ABN, BSB, account and call-back verification (85)
      synthetic: true
    - value: "Change of bank details\nVendor: Coral Coast Freight Pty Ltd\nForwarded to accounts payable for review."
      description: Change notice with a named vendor only (75)
      synthetic: true
  should_not_match:
    - value: "Fact sheet: payment redirection scams ask you to update a supplier's bank details. Always verify a change of bank details by calling the supplier on a known number before updating the BSB and account number."
      description: Scam-awareness fact sheet
      synthetic: true
    - value: "SUPPLIER BANK DETAILS CHANGE REQUEST\nSupplier name: __________\nABN: __ ___ ___ ___\nBSB: ___-___\nAccount number: __________"
      description: Blank change-request form - placeholder values
      synthetic: true
    - value: "Police warned businesses after a payment redirection scam cost a Gold Coast firm $480,000 when fraudsters emailed new bank details, a news report said."
      description: News report about a scam
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "credit premium"
      description: Unrelated
false_positives:
  - description: Accounts-payable procedures and payment-redirection scam warnings.
    mitigation: They name the change without populated bank or supplier fields, and guidance/scam-warning framing is excluded.
  - description: Legitimate new-supplier onboarding forms with bank details.
    mitigation: They can reach 75/85; they carry the same payment-redirection risk and warrant protection.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_supplier_bank_change
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_142_supplier_bank_change_requests_bsb
            - Regex_global_top500_142_supplier_bank_change_requests_account_number
            - Regex_global_top500_142_supplier_bank_change_requests_supplier
            - Regex_global_top500_142_supplier_bank_change_requests_vendor_id
        - ref: Evidence_supplier_bank_change_verification
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_142_supplier_bank_change_requests_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_supplier_bank_change
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_142_supplier_bank_change_requests_bsb
            - Regex_global_top500_142_supplier_bank_change_requests_account_number
            - Regex_global_top500_142_supplier_bank_change_requests_supplier
            - Regex_global_top500_142_supplier_bank_change_requests_vendor_id
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_142_supplier_bank_change_requests_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_supplier_bank_change
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_supplier_bank_change
      pattern: (?i)\b(?:(?:supplier|vendor|creditor|payee)\s+bank(?:ing)?\s+(?:details?\s+)?(?:change|update|amendment)(?:\s+request)?|change\s+of\s+bank(?:ing)?\s+details|bank\s+details?\s+(?:change|update|amendment)|(?:new|updated|revised)\s+bank(?:ing)?\s+(?:account\s+)?details|payment\s+redirect(?:ion)?|BSB\s+change|remittance\s+(?:details\s+)?update|vendor\s+bank\s+modification)\b
    - id: Regex_global_top500_142_supplier_bank_change_requests_bsb
      pattern: (?i)\bBSB(?:[ \t]{1,3}(?:no\.?|number))?[ \t]{0,3}[:#]?[ \t]{0,3}\d{3}[ \t-]?\d{3}\b
    - id: Regex_global_top500_142_supplier_bank_change_requests_account_number
      pattern: (?i)\b(?:(?:bank\s+)?account|acct|a/c)[ \t]{0,3}(?:no\.?|number|#)[ \t]{0,3}[:#]?[ \t]{0,3}\d{6,10}\b
    - id: Regex_global_top500_142_supplier_bank_change_requests_supplier
      pattern: (?i)\b(?:supplier(?:\s+name)?|vendor(?:\s+name)?|creditor|payee|account\s+name|remit\s+to)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?:(?:Mr|Mrs|Ms|Mx|Dr|Prof)\.?[ \t]{1,3})?[A-Z][A-Za-z'.-]{1,30}(?:[ \t]{1,3}[A-Z&][A-Za-z'.&-]{0,30}){0,5}
    - id: Regex_global_top500_142_supplier_bank_change_requests_vendor_id
      pattern: (?i)\b(?:(?:vendor|supplier|creditor)\s*(?:no\.?|number|ID|code)[ \t]{0,3}[:#]?[ \t]{0,3}(?=[A-Z-]{0,6}\d)[A-Z0-9][A-Z0-9-]{3,14}\b|ABN[ \t]{0,3}[:#]?[ \t]{0,3}\d{2}[ \t]?\d{3}[ \t]?\d{3}[ \t]?\d{3}\b)
  keywords:
    - id: Evidence_supplier_bank_change_verification
      groups:
        - match_style: word
          terms:
            - call-back
            - callback
            - verified by phone
            - verbal verification
            - effective date
            - effective immediately
            - previous account
            - old account
            - authorised signatory
            - bank statement
            - letterhead
            - urgent
      strength: domain
    - id: Keyword_global_top500_142_supplier_bank_change_requests_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - scam warning
            - payment redirection scams
            - known number
      strength: noise
risk_description: >-
  This detector finds requests to change a supplier's bank details or redirect future payments. Such a request is a familiar business-email-compromise vehicle: an attacker can substitute their account and cause the payer to send legitimate invoices to the wrong beneficiary. The normal true positive combines payment-routing context with a requested operational change, creating direct loss for the payer and supplier even though a separate approver should verify it. Risk 8 and SENSITIVE are justified; privileged payment-system access or a campaign affecting many suppliers would be needed for PROTECTED-level damage. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Financial because a live supplier
    bank-change request can directly enable payment diversion and serious but contained loss. PROTECTED is not met
    without privileged treasury access, many suppliers, or consequences amounting to significant damage.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Medium generic classification and Medium Financial DLM fit a payment-redirection request with direct fraud value
      but bounded supplier and transaction scope.
