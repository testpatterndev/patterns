schema: testpattern/v1
name: Records of processing activities
slug: global-top500-462-records-of-processing-activities
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to records of processing activities in Australian contexts. This information type is classified as personally identifiable information under applicable
  data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters.'
pattern: >-
  (?is)\b(records\s+of\s+processing\s+activities|processing\s+activities|data\s+processing|lawful\s+basis|purpose\s+limitation|data\s+controller|data\s+processor|personal\s+information|APP\s+entity)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - records of processing activities
    - records
    - processing
    - activities
    - privacy
    - compliance
    - risk
  proximity: 300
test_cases:
  should_match:
    - value: records of processing activities
      description: Primary topic phrase match
    - value: processing activities
      description: Case-insensitive topic phrase match
    - value: data processing
      description: Alternative topic phrase match
    - value: lawful basis
      description: Additional topic phrase match
    - value: |-
        Records of processing activities
        To: Executive Committee
        From: Chief Financial Officer
        Date: 14 August 2026
        Subject: Records of processing activities - FY27 review
      description: Populated document header reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: data inventory compliance
      description: Generic word pair from old broad template should not match
    - value: |-
        Records of processing activities:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about records of processing activities are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to records of processing activities appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_processing_activities
      matches:
        - ref: Regex_global_top500_462_records_of_processing_activities_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_processing_activities
      matches:
        - ref: Regex_global_top500_462_records_of_processing_activities_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_processing_activities
      matches:
        - ref: Evidence_processing_activities
        - ref: Regex_global_top500_462_records_of_processing_activities_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_processing_activities
  regexes:
    - id: Pattern_processing_activities
      pattern: >-
        (?is)\b(records\s+of\s+processing\s+activities|processing\s+activities|data\s+processing|lawful\s+basis|purpose\s+limitation|data\s+controller|data\s+processor|personal\s+information|APP\s+entity)\b
    - id: Regex_global_top500_462_records_of_processing_activities_record_structure
      pattern: (?i)\b((?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$])
  keywords:
    - id: Evidence_processing_activities
      groups:
        - match_style: word
          terms:
            - ROPA
risk_description: >-
  The detector recognises records of processing activities, data processing, lawful basis, controller and processor relationships, purposes, recipient categories, and related privacy-governance language. A populated ROPA can reveal how an organisation collects, shares, retains, and transfers categories of personal data, helping an attacker, complainant, or competitor identify valuable processes or governance gaps. The normal register describes categories rather than individual records, and Article 30 guidance or blank templates can readily match. Risk 5 OFFICIAL captures the bounded exposure; SENSITIVE is not met without detailed live systems, vulnerable populations, named recipients, or actionable transfer and control weaknesses.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because an ordinary ROPA describes processing
    categories and governance relationships rather than disclosing underlying personal records. SENSITIVE is not met
    without detailed live systems, named high-risk populations, or actionable transfer and control weaknesses capable of
    moderate direct harm.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low DLM fits a category-level processing register whose misuse depends on substantial operational and
      data context. A detailed live architecture or vulnerable data-flow inventory would require stronger handling.
references:
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "OAIC - Notifiable Data Breaches scheme"
    url: https://www.oaic.gov.au/privacy/notifiable-data-breaches
