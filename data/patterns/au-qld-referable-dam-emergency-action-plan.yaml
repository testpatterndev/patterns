schema: testpattern/v1
name: Queensland Referable Dam Emergency Action Plan - Unredacted Notification List or Population at Risk Detail
slug: au-qld-referable-dam-emergency-action-plan
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Unredacted working copies of Queensland referable dam emergency action plans (EAPs) under the Water Supply (Safety and Reliability) Act 2008 s 352H, and failure impact assessments, that contain the warning and notification lists (named individuals with mobile numbers, in order of priority) or property-level population at risk (PAR) detail (street addresses with occupant or PAR counts). Approved EAPs are published by design on the s 352M register with individuals' names, addresses and contact details removed, so the published plan is not the target; the personal detail stripped from it is.
operation: >-
  Primary: referable dam, dam emergency action plan, emergency action plan for a named dam or weir, failure impact assessment or rating, population at risk (PAR). 65 is discovery-only (primary alone) and will surface every published EAP, the Act and the Business Queensland EAP list. 75 requires, within 300 characters, either an unredacted contact row (a two-word personal name followed within 40 non-digit characters by an Australian mobile number; role, agency and place words are rejected as names) or a property-level PAR row (a street address or Qld lot-on-plan followed by a PAR, occupant, resident or person count). 85 requires both a contact row and a PAR row plus independent EAP operating content (Dam Duty Officer, Lean Forward, Stand Up, Stand Down, controlled copy, warning list, notification list, order of priority, inundation, spillway). All tiers exclude template/fixture text and a pattern-specific exclusion group (media releases, public register and Business Queensland listing text, have your say).
pattern: (?i)\b(?:referable\s+dams?|dam\s+emergency\s+action\s+plan|emergency\s+action\s+plan\s*(?:[-:]|for(?:\s+the)?)\s*[A-Z][A-Za-z'. ]{1,40}(?:Dam|Weir)|failure\s+impact\s+(?:assessment|rating)|population\s+at\s+risk\s*\(PAR\))\b
confidence: medium
confidence_justification: >-
  Medium: the EAP and referable dam terms are statutory and appear in every published plan, so they only drive discovery. Enforcement rests on personal contact rows and property-level PAR rows, which the published s 352M copies remove. Name-plus-mobile matching can still catch an agency role number where the role words are not in the rejection list, and mobile-only matching misses individuals listed with landlines. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic rows using ACMA fictional mobile numbers.
jurisdictions:
  - au
regulations:
  - Water Supply (Safety and Reliability) Act 2008 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - contact-information
  - infrastructure
corroborative_evidence:
  keywords:
    - Dam Duty Officer
    - Lean Forward
    - Stand Up
    - Stand Down
    - controlled copy
    - warning list
    - notification list
    - order of priority
    - inundation
    - spillway
  proximity: 300
test_cases:
  should_match:
    - value: "EMERGENCY ACTION PLAN - Teston Creek Dam (ID 9901) CONTROLLED COPY\nCategory 2 referable dam\nWarning list (order of priority):\n1. Avery Teston 0491 570 156 - 14 Weir Road, Teston Valley - PAR 4\n2. Blake Teston 0491 570 157 - 16 Weir Road, Teston Valley - PAR 3"
      description: Unredacted warning list with named residents, mobiles and property PAR (intended 85)
      synthetic: true
    - value: "Dam emergency action plan - notification list (Lean Forward)\nLandholder: Jordan Teston mob 0491 570 158\nGrazier: Casey Teston mob 0491 570 159"
      description: Unredacted notification list with named individuals and mobiles, no property PAR (intended 75)
      synthetic: true
    - value: "Failure impact assessment - Teston Weir, sunny day failure\nProperty: 22 Ridge Street, Teston - 3 occupants\nProperty: Lot 4 on RP123456, Teston Road - PAR 2"
      description: Property-level population at risk detail without contacts (intended 75)
      synthetic: true
    - value: "Emergency action plan for Teston Gorge Dam - Stand Up\nDam Duty Officer to phone downstream residents in order of priority:\nMorgan Teston 0491 570 110, 3 Gorge Lane, Teston (2 residents)\nInundation reaches the Gorge Lane crossing within 40 minutes of spillway flow."
      description: Stand Up notification with a named resident, mobile and household count (intended 85)
      synthetic: true
  should_not_match:
    - value: "EMERGENCY ACTION PLAN - Teston Creek Dam (ID 9901)\nApproved by the delegate of the Chief Executive\nNotification list: [personal information removed]\nLocal Disaster Coordinator, Teston Regional Council 0491 570 006\nPublic copies are redacted to protect people's personal information."
      description: Published redacted EAP with an agency role number only
    - value: "352H Requirements for plan. The emergency action plan must identify each dam hazard for the dam and state when and how the owner plans to warn persons who may be harmed, including the order of priority, for each referable dam."
      description: Act text (legislation decoy, stays at 65)
    - value: "Dam emergency action plan\nWarning list\nName: __________ Mobile: __________\nProperty address: __________ PAR: __"
      description: Blank EAP template
    - value: Sunwater says 17 of its referable dams now have updated emergency action plans after the wet season review, according to a media release.
      description: News / media release
    - value: "Training exercise: using the failure impact assessment for a mock dam, list the population at risk (PAR) for 5 Example Street - 3 residents."
      description: Training exercise
false_positives:
  - description: Published approved EAPs on the s 352M register and the Business Queensland EAP list.
    mitigation: Published copies remove individuals' names, addresses and contact details, so they stay at 65 discovery; register and listing text is excluded.
  - description: Agency or role numbers (local disaster coordinator, council, police, Sunwater or Seqwater duty officers) listed in published EAPs.
    mitigation: The contact row rejects role, agency and place words as name tokens and requires a mobile number. Unlisted role titles written as two capitalised words next to a mobile can still reach 75.
  - description: Engineering dam safety reports (covered separately by global-top500-460-dam-safety-and-integrity-reports).
    mitigation: This classifier needs personal contact or property PAR rows, not structural condition findings.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_referable_dam_eap_primary
      matches:
        - ref: Regex_au_qld_referable_dam_eap_contact_row
        - ref: Regex_au_qld_referable_dam_eap_par_property
        - ref: Keyword_au_qld_referable_dam_eap_operations
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_referable_dam_eap_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_referable_dam_eap_primary
      matches:
        - type: any
          refs:
            - Regex_au_qld_referable_dam_eap_contact_row
            - Regex_au_qld_referable_dam_eap_par_property
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_referable_dam_eap_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_referable_dam_eap_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_referable_dam_eap_exclusion
  regexes:
    - id: Regex_au_qld_referable_dam_eap_primary
      pattern: >-
        (?i)\b(?:referable\s+dams?|dam\s+emergency\s+action\s+plan|emergency\s+action\s+plan\s*(?:[-:]|for(?:\s+the)?)\s*[A-Z][A-Za-z'. ]{1,40}(?:Dam|Weir)|failure\s+impact\s+(?:assessment|rating)|population\s+at\s+risk\s*\(PAR\))\b
    - id: Regex_au_qld_referable_dam_eap_contact_row
      pattern: >-
        \b(?!(?:Dam|Duty|Officer|Manager|Coordinator|Council|Regional|Shire|City|Local|District|Disaster|Emergency|Operations|Control|Centre|Center|Police|Station|Service|Services|Group|Office|State|Water|Sunwater|Seqwater|Queensland|Bureau|After|Hours|Business|Mobile|Phone|Primary|Secondary|Backup|Chief|Executive|Engineer|Supervisor|Operator|Team|Leader|Fire|Rescue|Ambulance|SES|Main|Road|Roads|Street|Creek|River|Weir|Gorge)\b)[A-Z][a-z]{1,20}\s+(?!(?:Dam|Duty|Officer|Manager|Coordinator|Council|Regional|Shire|City|Local|District|Disaster|Emergency|Operations|Control|Centre|Center|Police|Station|Service|Services|Group|Office|State|Water|Sunwater|Seqwater|Queensland|Bureau|After|Hours|Business|Mobile|Phone|Primary|Secondary|Backup|Chief|Executive|Engineer|Supervisor|Operator|Team|Leader|Fire|Rescue|Ambulance|SES|Main|Road|Roads|Street|Creek|River|Weir|Gorge)\b)[A-Z][A-Za-z'-]{1,25}\b[^\n\d]{0,40}(?:\+61\s?4\d{2}|04\d{2})[\s-]?\d{3}[\s-]?\d{3}\b
    - id: Regex_au_qld_referable_dam_eap_par_property
      pattern: >-
        \b(?:\d{1,5}[A-Z]?\s+[A-Z][A-Za-z'-]{2,25}(?:\s+[A-Z][A-Za-z'-]{2,25}){0,2}\s+(?:Road|Rd|Street|St|Lane|Ln|Drive|Dr|Avenue|Ave|Court|Ct|Crescent|Cres|Place|Pl|Highway|Hwy|Terrace|Tce|Parade|Pde)|Lot\s+\d{1,4}\s+on\s+(?:RP|SP|CP|AP)\s?\d{3,7})\b(?:[^\n\d]{0,30}(?:PAR|[Oo]ccupants?|[Rr]esidents?|[Pp]ersons|[Pp]eople)\s*[:=]?\s*\d{1,3}\b|[^\n\d]{0,30}\(?\d{1,3}\s+(?:occupants?|residents?|persons|people)\b)
  keywords:
    - id: Keyword_au_qld_referable_dam_eap_operations
      groups:
        - match_style: word
          terms:
            - Dam Duty Officer
            - Lean Forward
            - Stand Up
            - Stand Down
            - controlled copy
            - warning list
            - notification list
            - order of priority
            - inundation
            - spillway
            - dam hazard event
            - emergency event
      strength: specific
    - id: Keyword_au_qld_referable_dam_eap_exclusion
      groups:
        - match_style: word
          terms:
            - media release
            - public register
            - Business Queensland
            - have your say
      strength: specific
risk_rating: 8
risk_description: >-
  The published EAP is public by design; the risk sits in the unredacted working copy. Its warning and notification lists name downstream residents, landholders and staff with mobile numbers and addresses, and its PAR tables say how many people live in each property inside the inundation area. Disclosure exposes private individuals' contact and residential details (the Act itself requires the public register to omit them) and maps who is vulnerable in a dam failure. Risk 8 supports SENSITIVE Personal-Privacy.
