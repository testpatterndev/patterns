  - strategy
  - strategic direction
  - strategic priorities
  - strategic objectives
  - strategic plan
  - strategic initiative
  - roadmap
  - go-to-market
  - GTM
  - business case
  - project initiation
  - project charter
  - implementation plan
  - three-year plan
  - five-year plan
pattern: (?i)\b(?:strategic\s+(?:plan|planning|initiative)|(?:3|5|three|five)[\s-]?year\s+plan)\b
engine: boost_regex
references:
