schema: testpattern/v1
name: Worker Screening or Background Check Outcome (AusCheck CIBCO, NDIS, Criminal History, Security Clearance)
slug: au-worker-screening-background-check-outcome
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Outcome records of worker screening and background checks about an identified person: the AusCheck Critical Infrastructure Background Check Outcome (CIBCO) used for SOCI critical workers under the CIRMP Rules (LIN 23/006 s 9; enhanced requirements LIN 26/075 s 9A), with findings such as Unfavourable Criminal History, CIRMP security-relevant offence, meets / does not meet statutory criteria, Adverse or Qualified Security Assessment; NDIS / Queensland disability worker screening clearance, exclusion, interim bar or negative notice (Disability Services Act 2006 (Qld)); national police check / criminal history check results; and security clearance outcomes at the PSPF Policy 12 levels (Baseline, NV1, NV2, PV). Screening reference, clearance and application numbers have no public format and are matched only by label. Bare reference numbers are covered by au-police-check-reference; clearance mentions without an outcome record by global-security-clearance-reference.
operation: >-
  Primary: Critical Infrastructure Background Check (Outcome), CIBCO, AusCheck background check / outcome / result / advice, critical worker suitability / background check / assessment, Adverse / Qualified Security Assessment, Unfavourable Criminal History, (NDIS / disability) worker screening check / clearance / exclusion / outcome / decision, police check / criminal history check result or outcome, security clearance outcome / decision / status, background check outcome. 65 is discovery-only (primary alone) and will surface AusCheck / NDIS Commission / CISC guidance, CIRMP Rules text, fact sheets and job ads. 75 requires a populated person field (applicant, worker, employee, candidate, full name, surname, given names, date of birth, position with a non-placeholder value) AND a labelled outcome (outcome / result / decision / finding / status / clearance level / criminal history / security assessment / suitability with a value such as meets or does not meet statutory criteria, unfavourable, no disclosable court outcomes, adverse, qualified, non-prejudicial, cleared, clearance granted, excluded, interim bar, negative notice, suitable / not suitable, granted / denied / revoked, Baseline, NV1, NV2, PV) within 300 characters. 85 additionally requires a check reference / authority / date field (application, reference, check, clearance, AusCheck, CIBCO or worker screening number by label; date of decision / outcome / check / application / expiry; issuing authority, screening unit or responsible entity code with a value) plus an independent screening context term (CIRMP, critical component, responsible entity, statutory criteria, ASIO, AGSVA, NDIS Commission, Disability Services Act 2006, identity verification, re-check). Every tier excludes template/fixture text; enforce tiers also exclude legislation text, fact sheets, guidance pages and job ads ("must be able to obtain", "apply now").
pattern: (?i)\b(?:Critical\s+Infrastructure\s+Background\s+Check(?:\s+Outcome)?|CIBCO|AusCheck\s+(?:background\s+check|outcome|result|advice)|critical\s+worker\s+(?:suitability(?:\s+assessment)?|background\s+check|assessment)|(?:Adverse|Qualified)\s+Security\s+Assessment|Unfavourable\s+Criminal\s+History|(?:NDIS\s+|disability\s+)?worker\s+screening\s+(?:check|clearance|exclusion|outcome|decision)|(?:national\s+)?police\s+check\s+(?:result|outcome)|criminal\s+history\s+(?:check|screening)\s+(?:result|outcome)|security\s+clearance\s+(?:outcome|decision|status)|background\s+check\s+(?:outcome|result))s?\b
confidence: medium
confidence_justification: >-
  Medium: CIBCO, the AusCheck outcome terms and the worker screening outcome words are specific, but screening and clearance terms are heavily used in guidance, CIRMP policy documents and job ads, and no reference or clearance number has a public format. Enforce tiers therefore require a populated person plus a labelled outcome, and 85 a reference / authority / date. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
  - "Security of Critical Infrastructure (Critical infrastructure risk management program) Rules (LIN 23/006) 2023 s 9, s 9A"
  - AusCheck Act 2007 (Cth)
  - Disability Services Act 2006 (Qld)
  - Protective Security Policy Framework Policy 12
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - PSPF
  - QGISCF
data_categories:
  - pii
  - criminal-history
  - security
  - employment
corroborative_evidence:
  keywords:
    - CIRMP
    - critical component
    - responsible entity
    - statutory criteria
    - ASIO
    - AGSVA
    - NDIS Commission
    - Disability Services Act 2006
    - identity verification
    - re-check
  proximity: 300
customisation:
  - key: screening-check-reference
    kind: identifier-format
    identifier: screening-check-reference
    target: purview.regexes/Regex_au_worker_screening_background_check_outcome_reference_field
    mode: extend
    affects_tiers:
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's worker screening / background check reference format (see docs/identifiers.md#screening-check-reference). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Critical Infrastructure Background Check Outcome (CIBCO)\nApplicant name: Morgan Teston\nDate of birth: 17/06/1988\nApplication number: ACK-2026-118245\nDate of outcome: 04/09/2026\nCriminal history: Unfavourable Criminal History - CIRMP security-relevant offence\nSecurity assessment: Non-prejudicial\nResponsible entity: Carrow Valley Power Pty Ltd - critical worker for unit control systems (critical component access)."
      description: 85 tier - CIBCO with applicant, application number and outcome date, criminal history outcome, responsible entity / critical component context
      synthetic: true
    - value: "NDIS worker screening decision\nWorker: Taylor Teston\nOutcome: exclusion\nDecision date: 11/08/2026\nThe NDIS Commission has recorded the exclusion in the national worker screening database."
      description: 85 tier - NDIS worker screening exclusion with worker, outcome, decision date and NDIS Commission context
      synthetic: true
    - value: "Police check result\nCandidate name: Jamie Teston\nResult: No disclosable court outcomes"
      description: 75 tier - police check result with candidate and outcome only
      synthetic: true
    - value: "Security clearance status - personnel register\nEmployee: Riley Teston\nClearance level: NV1\nClearance number: 7719-4420\nExpiry date: 30/06/2031\nSponsored by AGSVA; revalidation due before expiry."
      description: 85 tier - clearance register row with employee, NV1 level, clearance number / expiry and AGSVA context
      synthetic: true
    - value: "AusCheck outcome\nWorker: Alex Teston\nFinding: does not meet statutory criteria"
      description: 75 tier - AusCheck outcome with worker and finding
      synthetic: true
  should_not_match:
    - value: "A critical infrastructure background check is conducted under the AusCheck scheme. The Critical Infrastructure Background Check Outcome (CIBCO) will show whether the applicant has an Unfavourable Criminal History or an Adverse Security Assessment. See the Critical Worker Factsheet at auscheck.gov.au."
      description: AusCheck guidance / fact sheet
    - value: "Worker screening clearance record\nApplicant name: ______________\nDate of birth: __/__/____\nOutcome: [clearance / exclusion]\nReference number: ______________"
      description: Blank worker screening form
    - value: "Control systems engineer - you must be able to obtain an NV1 security clearance; security clearance status will be checked. Apply now."
      description: Job advertisement
    - value: "(3) The background check may be a background check conducted under the AusCheck scheme, including an assessment against criminal history criteria. Federal Register of Legislation - Compilation No. 2."
      description: CIRMP Rules legislation text
    - value: "Police check results now arrive faster: the ACIC says most national police check outcomes are returned within one business day."
      description: News / statistics
false_positives:
  - description: AusCheck, CISC, Home Affairs and NDIS Commission guidance pages, the CIRMP Rules text and critical worker fact sheets describe the same outcomes.
    mitigation: Guidance names outcomes without a populated person field and stays at 65 discovery; fact sheets, legislation markers and guidance wording are excluded from enforce tiers.
  - description: Job ads that require an NV1 / Baseline clearance or a police check.
    mitigation: No labelled person and outcome fields; "must be able to obtain", "ability to obtain", "apply now" and "position description" are excluded.
  - description: Blank screening forms and outcome templates.
    mitigation: Blank lines and bracket placeholders are rejected; outcome fields need a recognised outcome value.
  - description: Screening reference, clearance and application numbers have no public format.
    mitigation: Matched only by label; no standalone number regex is shipped. Bare police check reference numbers remain with au-police-check-reference.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_worker_screening_background_check_outcome_primary
      matches:
        - ref: Regex_au_worker_screening_background_check_outcome_person_field
        - ref: Regex_au_worker_screening_background_check_outcome_outcome_field
        - ref: Regex_au_worker_screening_background_check_outcome_reference_field
        - ref: Keyword_au_worker_screening_background_check_outcome_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_worker_screening_background_check_outcome_exclusion
    - confidence_level: 75
      id_match: Regex_au_worker_screening_background_check_outcome_primary
      matches:
        - ref: Regex_au_worker_screening_background_check_outcome_person_field
        - ref: Regex_au_worker_screening_background_check_outcome_outcome_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_worker_screening_background_check_outcome_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_worker_screening_background_check_outcome_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_worker_screening_background_check_outcome_primary
      pattern: >-
        (?i)\b(?:Critical\s+Infrastructure\s+Background\s+Check(?:\s+Outcome)?|CIBCO|AusCheck\s+(?:background\s+check|outcome|result|advice)|critical\s+worker\s+(?:suitability(?:\s+assessment)?|background\s+check|assessment)|(?:Adverse|Qualified)\s+Security\s+Assessment|Unfavourable\s+Criminal\s+History|(?:NDIS\s+|disability\s+)?worker\s+screening\s+(?:check|clearance|exclusion|outcome|decision)|(?:national\s+)?police\s+check\s+(?:result|outcome)|criminal\s+history\s+(?:check|screening)\s+(?:result|outcome)|security\s+clearance\s+(?:outcome|decision|status)|background\s+check\s+(?:outcome|result))s?\b
    - id: Regex_au_worker_screening_background_check_outcome_person_field
      pattern: >-
        (?i)\b(?:applicant(?:\s+name)?|worker(?:['’]s)?(?:\s+name)?|employee(?:\s+(?:name|no\.?|number|ID))?|candidate(?:\s+name)?|contractor(?:\s+name)?|full\s+name|surname|given\s+names?|date\s+of\s+birth|DOB)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{1,30}(?:[ \t]+[A-Z][A-Za-z'.-]{1,30}){0,3}
    - id: Regex_au_worker_screening_background_check_outcome_outcome_field
      pattern: >-
        (?i)\b(?:outcome|result|decision|finding|status|clearance(?:\s+(?:level|status|outcome))?|criminal\s+history(?:\s+(?:finding|outcome|result))?|security\s+assessment|suitability(?:\s+(?:assessment|outcome))?|screening\s+(?:outcome|result))\s*[:#]\s*(?:does\s+not\s+meet\s+(?:the\s+)?statutory\s+criteria|meets\s+(?:the\s+)?statutory\s+criteria|unfavourable(?:\s+criminal\s+history)?|favourable|no\s+disclosable\s+court\s+outcomes|disclosable\s+court\s+outcomes|no\s+(?:adverse|criminal)\s+(?:finding|information|record|history)|adverse(?:\s+security\s+assessment)?|qualified(?:\s+security\s+assessment)?|non-prejudicial|clearance\s+(?:granted|issued)|cleared|excluded|exclusion|interim\s+bar|negative\s+notice|not\s+suitable|unsuitable|suitable|granted|denied|refused|revoked|suspended|cancelled|Baseline|NV1|NV2|PV|Negative\s+Vetting\s+(?:Level\s+)?[12]|Positive\s+Vetting)\b
    - id: Regex_au_worker_screening_background_check_outcome_reference_field
      pattern: >-
        (?i)(?:\b(?:application|reference|ref|check|clearance|AusCheck|CIBCO|(?:NDIS\s+)?worker\s+screening|screening|certificate)\s+(?:ID|no\.?|number|reference)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Z0-9/-]{3,24}\b|\b(?:date\s+of\s+(?:decision|outcome|check|application|issue|expiry)|(?:decision|outcome|check|application|issue|expiry)\s+date|valid\s+(?:until|to))\s*[:#]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2})|\b(?:issuing\s+authority|issued\s+by|screening\s+unit|responsible\s+entity(?:\s+code)?)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|the|a|an|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9&'.,-]{1,40}(?:[ \t]+[A-Za-z0-9&'.,-]{1,30}){0,5})
    - id: Regex_au_worker_screening_background_check_outcome_exclusion
      pattern: >-
        (?i)(?:\bauscheck\.gov\.au|\bhomeaffairs\.gov\.au|\bcisc\.gov\.au|\blegislation\.gov\.au|\bFederal\s+Register\s+of\s+Legislation|\bCompilation\s+(?:No\.|date)|\bCivil\s+penalty\s*:|\bfact\s?sheet\b|\bthis\s+(?:article|course|guidance|guide|page|webinar|module)\b|\b(?:must\s+(?:be\s+able\s+to\s+)?(?:hold|obtain|maintain)|ability\s+to\s+obtain|eligible\s+to\s+obtain)\b|\bapply\s+now\b|\bposition\s+description\b|\bgeneral\s+information\s+only\b)
  keywords:
    - id: Keyword_au_worker_screening_background_check_outcome_corroborative
      groups:
        - match_style: word
          terms:
            - text: CIRMP
              case_sensitive: true
            - critical component
            - responsible entity
            - statutory criteria
            - security-relevant offence
            - text: ASIO
              case_sensitive: true
            - text: AGSVA
              case_sensitive: true
            - NDIS Commission
            - worker screening database
            - Disability Services Act 2006
            - identity verification
            - re-check
            - revalidation
            - Security of Critical Infrastructure Act 2018
            - text: ACIC
              case_sensitive: true
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies worker screening and background check outcomes about an identified person - AusCheck CIBCO findings, NDIS / disability worker screening clearances and exclusions, criminal history check results and security clearance decisions - gated on a populated person field and a labelled outcome, with 85 also needing a check reference, authority or date. Outcomes reveal criminal history, adverse security assessments and suitability decisions; disclosure causes serious reputational and employment harm, and critical-worker lists expose who controls critical components. Guidance, blank forms, job ads and legislation are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because a
    CIBCO, NDIS screening, criminal history or clearance outcome reveals a named person's criminal history or adverse
    suitability finding. PROTECTED is not met because the normal match is one outcome, not assessment content or a
    critical-worker list.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling protects criminal history and suitability decisions that cause reputational and
      employment harm. One screening outcome does not reach High.
references:
  - title: AusCheck - critical infrastructure risk management programs
    url: https://www.auscheck.gov.au/about/programs/critical-infrastructure-risk-management-programs
  - title: Security of Critical Infrastructure (Critical infrastructure risk management program) Rules (LIN 23/006) 2023
    url: https://www.legislation.gov.au/F2023L00112/latest/text
  - title: Security of Critical Infrastructure Act 2018
    url: https://www.legislation.gov.au/C2018A00029/latest/text
  - title: Queensland Worker Screening - worker rights and obligations
    url: https://www.workerscreening.qld.gov.au/workers/worker-rights-and-obligations
  - title: NDIS Quality and Safeguards Commission - worker screening
    url: https://www.ndiscommission.gov.au/workforce/worker-screening
  - title: PSPF Policy 12 - Eligibility and suitability of personnel
    url: https://www.protectivesecurity.gov.au/publications-library/policy-12-eligibility-and-suitability-personnel
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - anchored on AusCheck CIBCO / CIRMP critical worker outcome terms, NDIS / Qld disability worker screening outcomes, criminal history check results and PSPF clearance levels; 75 gated on a populated person plus a labelled outcome, 85 adds a check reference / authority / date and screening context. Reference and clearance numbers matched by label only (formats not public).
