  date: '2026-09-24'
  description: "Quality pass (2026-09-24): rebuilt around labelled provider identifiers - the old 75 fired on the phrase 'provider identifier records' alone and 85 relied on generic data labels. Primary is now a labelled provider identifier with a populated value (Medicare provider number, prescriber number, HPI-I/HPI-O, AHPRA registration, NPI, licence number; no formats asserted); 75 adds a practitioner/practice field and 85 needs two distinct identifiers plus practitioner context plus credentialing evidence. Bare-phrase tests replaced with populated records plus policy, blank-form and news decoys. Regulations: added Healthcare Identifiers Act 2010 (Cth), Privacy Act 1988 (Cth), HIPAA; frameworks and references added. Recommend deprecating in favour of the identifier classifiers (au-medicare-provider-number, au-hpi-individual, global-ahpra-registration, au-pbs-prescriber-number) or merging with au-top500-337-provider-identifier-records."
