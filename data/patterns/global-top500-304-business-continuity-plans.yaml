schema: testpattern/v1
name: Business continuity plans
slug: global-top500-304-business-continuity-plans
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects business continuity plans and business impact analyses with populated recovery objectives (RTO/RPO/MTPD values), crisis contacts and alternate sites. Topic wording alone is discovery-only.
operation: >-
  Regex_bcp_primary (business continuity plan, crisis management plan or business impact analysis wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated recovery objective (RTO/RPO/MTPD/MAO with a duration) or a populated continuity contact or site field (crisis lead, incident controller, alternate/recovery site, after-hours contact). 85 requires a populated recovery objective (RTO/RPO/MTPD/MAO with a duration) (two distinct hits), a populated continuity contact or site field (crisis lead, incident controller, alternate/recovery site, after-hours contact), and independent continuity-operations (critical functions, workarounds, activation, call tree) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_bcp_guidance_exclusion).
pattern: >-
  (?i)\b(?:business\s+continuity\s+(?:plans?|management\s+plan|arrangements)|continuity\s+of\s+operations\s+plan|crisis\s+management\s+plan|business\s+impact\s+analysis)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated recovery objective (RTO/RPO/MTPD/MAO with a duration) or a populated continuity contact or site field (crisis lead, incident controller, alternate/recovery site, after-hours contact)), and 85 needs two distinct structures plus independent continuity-operations (critical functions, workarounds, activation, call tree) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - critical business function
  - manual workaround
  - workaround
  - activation
  - invocation
  - escalation
  - minimum staffing
  - supplier dependency
  - call tree
  - dependencies
  proximity: 300
  keyword_lists:
  - industry-education
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
  - value: The business continuity plan is due for its annual review in March.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Business impact analysis - Payroll
      RTO: 24 hours
      RPO: 4 hours
    description: Medium-tier probe (75) - populated recovery objectives
    synthetic: true
  - value: |-
      Business continuity plan - Payroll Services
      RTO: 24 hours; RPO: 4 hours; MTPD: 3 days
      Crisis lead: Jordan Staffson (0412 555 019)
      Alternate site: Level 3, 88 Wharf Street
      Critical business function: fortnightly pay run - manual workaround via bank file upload; activation by the incident controller.
    description: High-tier probe (85) - several objectives, contacts/site and continuity context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: every business unit maintains a business continuity plan and tests it annually.'
    description: Policy text
    synthetic: true
  - value: |-
      Business continuity plan template
      RTO: ____ hours
      Crisis lead: [insert]
    description: Blank template
    synthetic: true
  - value: 'Course module 1: a business impact analysis sets targets such as an RTO of 4 hours.'
    description: Training framing
    synthetic: true
false_positives:
- description: Continuity standards and consulting material quote RTO/RPO definitions.
  mitigation: Objectives must carry durations; guidance/training framing is excluded and 85 needs contacts or sites.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_bcp_primary
    matches:
    - ref: Regex_bcp_recovery_objective
      min_count: 2
      unique_results: true
    - ref: Regex_bcp_contact_site
    - ref: Keyword_bcp_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_bcp_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_bcp_primary
    matches:
    - type: any
      refs:
      - Regex_bcp_recovery_objective
      - Regex_bcp_contact_site
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_bcp_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_bcp_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_bcp_primary
    pattern: >-
      (?i)\b(?:business\s+continuity\s+(?:plans?|management\s+plan|arrangements)|continuity\s+of\s+operations\s+plan|crisis\s+management\s+plan|business\s+impact\s+analysis)\b
  - id: Regex_bcp_recovery_objective
    pattern: >-
      (?i)\b(?:RTO|RPO|MTPD|MAO|recovery\s+time\s+objective|recovery\s+point\s+objective|maximum\s+tolerable\s+(?:period\s+of\s+)?(?:disruption|downtime|outage))\s*[:=]?\s*\d{1,3}\s*(?:min(?:utes?)?|h(?:ours?|rs?)?|days?|weeks?)\b
  - id: Regex_bcp_contact_site
    pattern: >-
      (?i)\b(?:crisis\s+(?:lead|manager|team\s+lead)|incident\s+controller|BCP\s+(?:owner|coordinator)|alternate\s+(?:site|location|contact)|recovery\s+site|deputy|after[\s-]hours\s+(?:contact|phone)|mobile|assembly\s+point)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  keywords:
  - id: Keyword_bcp_context
    groups:
    - match_style: word
      terms:
      - critical business function
      - manual workaround
      - workaround
      - activation
      - invocation
      - escalation
      - minimum staffing
      - supplier dependency
      - call tree
      - dependencies
    strength: specific
  - id: Keyword_bcp_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires continuity-plan wording plus populated recovery objectives or crisis contact/site fields before enforcing. A substantive plan can expose critical processes, acceptable downtime, succession arrangements, workarounds, dependencies, and response contacts that could be exploited during disruption. The affected scale may span several business functions and their staff or customers, while generic resilience guidance and template plans remain plausible false positives. Risk 8 SENSITIVE reflects serious contained operational and commercial harm; PROTECTED would require critical-service or protected-operation details capable of significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
