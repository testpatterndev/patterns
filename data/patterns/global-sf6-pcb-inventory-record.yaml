schema: testpattern/v1
name: SF6 Switchgear and PCB Equipment Inventory or Leak / Test Record
slug: global-sf6-pcb-inventory-record
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Operational inventories and records for two regulated insulating substances in electrical plant: sulphur
  hexafluoride (SF6) in gas-insulated switchgear and circuit breakers (stock held in equipment, top-up, leakage and
  recovery quantities in kg, as reported under Australian NGER Regulations reg 4.16 and Measurement Determination
  Part 4.5), and polychlorinated biphenyls (PCBs) in transformers and capacitors (oil test results in mg/kg classed as
  scheduled PCB material at or above 50 mg/kg, non-scheduled, or PCB-free at or below 2 mg/kg under the ANZECC PCB
  Management Plan; notifiable quantities above 10 kg). Records carry asset or serial numbers, substation / site
  locations and measured quantities. The PCB Management Plan, IChEMS advice, NGER Determination text and vendor
  guidance are decoys.
operation: >-
  Primary: SF6, sulphur / sulfur hexafluoride, polychlorinated biphenyl(s), PCB(s), scheduled PCB material / waste,
  non-scheduled PCB, PCB-free. 65 is discovery-only (primary alone) and will also surface printed-circuit-board
  documents, guidance and news. 75 requires one populated measurement within 300 characters: an inventory row (an
  asset-style token such as TX-0412 or CB-2231 followed on the same line by a concentration in mg/kg, or by an SF6
  quantity in kg) or a labelled measurement with a value (PCB concentration / content / result, concentration (mg/kg),
  oil test result, SF6 mass / charge / fill / stock / top-up / recovered / leakage, gas / nameplate / rated mass in
  kg, top-up or quantity added / recovered / lost in kg). 85 requires two distinct inventory rows, or a labelled
  measurement plus a populated asset / serial / equipment / plant number, functional location, substation, switchyard,
  site, location or bay field, plus independent evidence (transformer, capacitor, circuit breaker, gas insulated
  switchgear, kVA / MVA, insulating oil, dielectric, leak, top up, gas cart, recovery, disposal, NATA, laboratory,
  density monitor, reg 4.16). Every tier excludes template/fixture text; enforce tiers also exclude guidance signals
  (nepc.gov.au, dcceew.gov.au, legislation.gov.au, "Revised Edition", compilation headers, "this plan / guideline /
  fact sheet", article disclaimers).
pattern: (?i)\b(?:SF6|sul(?:ph|f)ur\s+hexafluoride|polychlorinated\s+biphenyls?|PCBs?|scheduled\s+PCB\s+(?:material|waste)|non-scheduled\s+PCB|PCB[- ]free)\b
confidence: medium
confidence_justification: >-
  Medium: SF6 and PCB terms are specific to electrical plant, but "PCB" also means printed circuit board, and the ANZECC
  plan, NGER Determination and vendor guidance quote the thresholds (50 mg/kg, 2 mg/kg, 10 kg, 0.0089). Enforce tiers
  need populated measurements tied to an asset row or labelled field, and ppm is accepted only in labelled PCB fields
  (electronics documents use ppm). Asset and serial number formats are organisation-specific, so rows are recognised
  by an uppercase letters-plus-digits token only. 85/75 are heuristic evidence tiers, not measured accuracy; test
  values are synthetic.
jurisdictions:
  - global
  - au
regulations:
  - National Greenhouse and Energy Reporting Regulations 2008 (Cth)
  - National Greenhouse and Energy Reporting (Measurement) Determination 2008 (Cth) Part 4.5
  - ANZECC Polychlorinated Biphenyls Management Plan (Revised Edition April 2003)
  - Environmental Protection Act 1994 (Qld)
frameworks:
  - QGISCF
  - ISO 14001
data_categories:
  - environment
  - infrastructure
  - operations
corroborative_evidence:
  keywords:
    - transformer
    - capacitor
    - circuit breaker
    - gas insulated switchgear
    - kVA
    - MVA
    - insulating oil
    - dielectric
    - leak
    - top up
    - recovery
    - disposal
    - NATA
    - density monitor
  proximity: 300
customisation:
  - key: asset-functional-location
    kind: identifier-format
    identifier: asset-functional-location
    target: purview.regexes/Regex_global_sf6_pcb_inventory_record_asset_field
    mode: extend
    affects_tiers:
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's asset number / functional location format (see docs/identifiers.md#asset-functional-location). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "PCB transformer and capacitor inventory - Northgate depot\nTX-0412 | Oakdale Zone Substation | 1500 kVA | oil 820 L | 12 mg/kg | non-scheduled\nTX-0419 | Oakdale Zone Substation | 750 kVA | oil 410 L | <2 mg/kg | PCB-free\nCAP-2207 | Ferris Road Switchyard | capacitor bank | 64 mg/kg | scheduled PCB material - notify\nDisposal booked with licensed contractor."
      description: 85 tier - PCB inventory with three distinct asset rows carrying mg/kg results plus transformer / capacitor / disposal evidence
      synthetic: true
    - value: "SF6 leak and top-up record - reporting year 2025-26\nAsset number: GIS-B3-CB12\nSubstation: Harlow Creek 275 kV\nSF6 top-up: 4.6 kg (cylinder C-7781)\nGas mass (nameplate): 38.0 kg\nLeak located at bay 3 density monitor flange; repair work order raised."
      description: 85 tier - SF6 top-up record with labelled measurements, asset number and substation plus leak / density monitor evidence
      synthetic: true
    - value: "SF6 stock register 2025-26\nCircuit breaker CB-2231 Tarrant 132 kV bay: SF6 charge 7.2 kg"
      description: 75 tier - one SF6 inventory row
      synthetic: true
    - value: "Transformer oil PCB test results\nPCB concentration (mg/kg): 38\nSample point: bottom drain valve"
      description: 75 tier - one labelled PCB concentration with no asset field
      synthetic: true
  should_not_match:
    - value: "Scheduled PCB material means PCB material with a PCB concentration at or above the threshold concentration of 50 mg/kg and a quantity of 50 g or more. PCB-free means a concentration at or below 2 mg/kg. More than 10 kg of PCBs is a notifiable quantity. This plan applies to all jurisdictions."
      description: ANZECC PCB Management Plan definitions
    - value: "4.102 Method 1 - emissions of sulphur hexafluoride from gas insulated switchgear and circuit breaker applications are estimated by multiplying the SF6 stock contained in the equipment by the default annual leakage rate of 0.0089."
      description: NGER Measurement Determination text
    - value: "SF6 inventory\nAsset number: ______\nSF6 mass (kg): ____\nSubstation: [site]\nPCB concentration (mg/kg): ____"
      description: Blank inventory form
    - value: "PCB layout for controller board REV-0102: 4 layers, 2 oz copper, crystal Y1 tolerance 20 ppm, panel weight 1.2 kg."
      description: Printed circuit board design note
    - value: "Utilities are phasing out SF6 switchgear; a single 132 kV bay can hold more than 40 kg of the gas, according to industry groups."
      description: News reporting
    - value: "SF6 handling training exercise\nCircuit breaker CB-1001: SF6 charge 5.0 kg\nSF6 top-up: 1.0 kg"
      description: Training exercise (template-exclusion)
false_positives:
  - description: The ANZECC PCB Management Plan, IChEMS advice, NPI fact sheets, the NGER Measurement Determination and switchgear vendor guidance quote the same thresholds and units.
    mitigation: Guidance states thresholds in prose without asset tokens or labelled measurements; nepc.gov.au / dcceew.gov.au / legislation.gov.au, "Revised Edition", compilation headers and guide framing are excluded from enforce tiers.
  - description: Printed circuit board ("PCB") engineering documents.
    mitigation: Inventory rows only count mg/kg concentrations or kg quantities tied to SF6; ppm only counts in labelled PCB concentration fields; board documents stay at 65 discovery.
  - description: Public PCB registers kept by environment agencies (ANZECC plan clause 4.3) and CER published NGER data.
    mitigation: A published agency register is still an inventory and may match; scope the policy to internal repositories if this matters.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_sf6_pcb_inventory_record_primary
      matches:
        - ref: Regex_global_sf6_pcb_inventory_record_row
          min_count: 2
          unique_results: true
        - ref: Keyword_global_sf6_pcb_inventory_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_global_sf6_pcb_inventory_record_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_global_sf6_pcb_inventory_record_primary
      matches:
        - ref: Regex_global_sf6_pcb_inventory_record_measurement
        - ref: Regex_global_sf6_pcb_inventory_record_asset_field
        - ref: Keyword_global_sf6_pcb_inventory_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_global_sf6_pcb_inventory_record_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_global_sf6_pcb_inventory_record_primary
      matches:
        - type: any
          refs:
            - Regex_global_sf6_pcb_inventory_record_row
            - Regex_global_sf6_pcb_inventory_record_measurement
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_global_sf6_pcb_inventory_record_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_global_sf6_pcb_inventory_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_global_sf6_pcb_inventory_record_primary
      pattern: >-
        (?i)\b(?:SF6|sul(?:ph|f)ur\s+hexafluoride|polychlorinated\s+biphenyls?|PCBs?|scheduled\s+PCB\s+(?:material|waste)|non-scheduled\s+PCB|PCB[- ]free)\b
    - id: Regex_global_sf6_pcb_inventory_record_row
      pattern: >-
        \b(?!(?:IEC|ISO|AS|NZS|EN|IEEE|ASTM|REV|SF)[-/]?\d)[A-Z]{1,5}[-/]?\d{2,6}(?:[-/][A-Z0-9]{1,6})?\b[^\n]{0,120}?(?:\b\d{1,6}(?:\.\d{1,3})?\s?mg/kg\b|\b(?:SF6|[Ss]ulph?ur\s+hexafluoride)[^\n]{0,40}?\b\d{1,4}(?:\.\d{1,3})?\s?kg\b|\b\d{1,4}(?:\.\d{1,3})?\s?kg\s+(?:of\s+)?SF6\b)
    - id: Regex_global_sf6_pcb_inventory_record_measurement
      pattern: >-
        (?i)\b(?:PCB\s+(?:concentration|content|level|result|test\s+result)(?:\s*\((?:mg/kg|ppm)\))?|(?:oil\s+)?(?:PCB\s+)?concentration\s*\((?:mg/kg|ppm)\)|oil\s+test\s+result(?:\s*\((?:mg/kg|ppm)\))?|SF6\s+(?:mass|charge|fill|stock|quantity|inventory|top[- ]?up|added|recovered|loss|leak(?:age|ed)?)(?:\s*\(kg\))?|(?:gas|nameplate|rated|filled?)\s+(?:mass|charge|weight)(?:\s*\([^)\n]{1,12}\))?|(?:top[- ]?up|quantity\s+(?:added|recovered|lost|leaked))(?:\s*\(kg\))?)\s*[:=|]\s*(?:<\s?)?\d{1,6}(?:\.\d{1,3})?\b
    - id: Regex_global_sf6_pcb_inventory_record_asset_field
      pattern: >-
        (?i)\b(?:asset\s+(?:no\.?|number|ID|tag)|equipment\s+(?:no\.?|number|ID)|serial\s+(?:no\.?|number)|plant\s+(?:no\.?|number)|functional\s+location|(?:zone\s+)?substation|switchyard|site|location|bay)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|enter|insert)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/&'.,-]{0,40}(?:[ \t]+[A-Za-z0-9&'.,/-]{1,30}){0,3}
    - id: Regex_global_sf6_pcb_inventory_record_guidance_exclusion
      pattern: >-
        (?i)(?:\bnepc\.gov\.au|\bdcceew\.gov\.au|\blegislation\.gov\.au|\bRevised\s+Edition\b|\bCompilation\s+(?:No\.|date)|\bthis\s+(?:plan|guideline|guide|fact\s?sheet|article|webinar|explainer)\b|\bgeneral\s+information\s+only\b|\bsubscribe\s+to\s+our\b)
  keywords:
    - id: Keyword_global_sf6_pcb_inventory_record_corroborative
      groups:
        - match_style: word
          terms:
            - transformer
            - capacitor
            - circuit breaker
            - gas insulated switchgear
            - gas-insulated switchgear
            - text: GIS
              case_sensitive: true
            - text: kVA
              case_sensitive: true
            - text: MVA
              case_sensitive: true
            - insulating oil
            - dielectric
            - leak
            - top up
            - top-up
            - gas cart
            - recovery
            - disposal
            - text: NATA
              case_sensitive: true
            - laboratory
            - density monitor
            - reg 4.16
      strength: specific
risk_rating: 6
risk_description: >-
  The classifier identifies internal SF6 and PCB equipment inventories and leak / test records, gated on populated
  measurements tied to asset rows or labelled fields. They map where regulated hazardous or high-global-warming
  substances sit in named substations and plant, quantify leakage that feeds NGER reports, and document environmental
  and disposal liabilities (scheduled PCB material, notifiable quantities) before they are notified or remediated.
  Much of the aggregate data is later reported to regulators, and agencies keep public registers of scheduled PCB
  material, so the sensitivity is operational and liability-related rather than personal. Guidance and legislation
  are excluded from enforce tiers. Risk 6 supports OFFICIAL: Sensitive with SENSITIVE Commercial-in-Confidence.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Commercial-in-Confidence
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: National Greenhouse and Energy Reporting Regulations 2008 (Cth) - reg 4.16 Emissions - hydrofluorocarbons and sulphur hexafluoride gases
    url: https://www.legislation.gov.au/F2008L02230/latest/text
  - title: National Greenhouse and Energy Reporting (Measurement) Determination 2008 (Cth) - Part 4.5 synthetic greenhouse gases
    url: https://www.legislation.gov.au/F2008L02309/latest/text
  - title: ANZECC Polychlorinated Biphenyls Management Plan, Revised Edition April 2003
    url: https://www.nepc.gov.au/sites/default/files/2022-09/anzecc-gl-polychlorinated-biphenyls-management-plan-revised-200304.pdf
  - title: IChEMS Advisory Committee advice on PCBs
    url: https://www.dcceew.gov.au/sites/default/files/documents/ichems-advisory-committee-advice-pcbs.pdf
  - title: Environmental Protection Act 1994 (Qld) - Schedule 3 notifiable activities (item 13 electrical transformers)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1994-062
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - anchored on NGER reg 4.16 SF6 stock / leakage terms and ANZECC PCB Management Plan classes; 75 gated on an asset inventory row or labelled measurement, 85 on two distinct rows or a measurement plus a populated asset / location field with independent plant evidence; guidance and printed-circuit-board documents kept below 75.
