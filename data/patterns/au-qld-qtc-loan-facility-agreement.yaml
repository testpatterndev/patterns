changelog:
  - version: 1.1.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.0.0
    date: '2026-10-20'
    description: >-
      Initial release (qgfin sector review gap). QTC client-side lending documents. Every enforce tier needs QTC
      context; 75 needs a reference, facility amount or loan terms, 85 two of reference, amount, terms and borrower.
      Publication / guidance and template framing are excluded on enforce tiers.
