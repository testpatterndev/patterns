schema: testpattern/v1
name: Queensland Treasury Corporation Client Loan or Facility Agreement
slug: au-qld-qtc-loan-facility-agreement
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Loan, facility and client agreements between Queensland Treasury Corporation (QTC) and its borrowing clients (government departments, statutory bodies, government owned corporations, local governments and universities), with their facility offers and confirmations, drawdown notices, debt pool and loan statements and repayment schedules. QTC is the State's central financing authority under the Queensland Treasury Corporation Act 1988 and lends to statutory bodies under the Statutory Bodies Financial Arrangements Act 1982 with Treasurer's borrowing approval. A client agreement states the client number, loan or facility number, facility limit or principal, interest rate or margin, fees, maturity and repayment schedule. These terms are the borrower's unpublished debt position and pricing. state-borrowing-and-debt-issuance-strategy covers QTC's own market borrowing and issuance strategy; this SIT covers the client-side lending documents.
operation: >-
  Primary: [fixed rate / floating rate / working capital / term] loan agreement / offer / confirmation / schedule / statement, [master] [loan] facility agreement / offer / letter / confirmation / schedule, master client / lending agreement, client service agreement, repayment schedule, debt pool / facility statement, drawdown notice / request / confirmation. Every enforce tier needs QTC context within 300 characters (Queensland Treasury Corporation, QTC, Queensland Treasury Corporation Act 1988, Statutory Bodies Financial Arrangements Act 1982, SBFA, generic debt pool, Treasurer's approval, borrowing approval). 65 (discovery only): primary alone. 75: primary plus context plus one of a labelled client / loan / facility / deal / borrower number, a facility amount (facility limit / amount, loan amount / principal, principal, approved borrowing / limit / amount, borrowing limit, drawdown amount, amount drawn, outstanding balance / principal, book / market value with a dollar amount) or loan terms (interest / fixed rate, margin, administration or competitive neutrality fee, maturity date, repayment amount / date / frequency, instalment amount, loan term with a value, or a dated repayment row with two amounts). 85: primary plus context plus any two of reference, amount, terms and a populated borrower field (borrower, client [name], entity [name]). Enforce tiers AND NOT the shared template-exclusion dictionary and a publication / guidance exclusion (annual report, investor booklet, investor book, offering circular, information memorandum, media release, fact sheet, frequently asked questions, borrowing program). Field values are placeholder-guarded.
pattern: >-
  (?i)\b((?:(?:(?:fixed|floating)\s+rate\s+|working\s+capital\s+|term\s+)?loan\s+(?:agreement|offer|confirmation|schedule|statement)|(?:master\s+)?(?:loan\s+)?facility\s+(?:agreement|offer|letter|confirmation|schedule)|master\s+(?:client|lending)\s+agreement|client\s+service\s+agreement|repayment\s+schedule|debt\s+(?:pool|facility)\s+statement|drawdown\s+(?:notice|request|confirmation))s?)\b
confidence: medium
confidence_justification: >-
  Medium. Loan and facility agreement wording is used by every lender, so enforce tiers need QTC context plus populated loan fields, and QTC's public investor and annual reporting is excluded. Client and facility number formats are unpublished, so references are label-anchored. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Queensland Treasury Corporation Act 1988 (Qld)
  - Statutory Bodies Financial Arrangements Act 1982 (Qld)
  - Financial Accountability Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - financial
  - government
corroborative_evidence:
  keywords:
    - Queensland Treasury Corporation
    - QTC
    - Statutory Bodies Financial Arrangements Act 1982
    - generic debt pool
    - borrowing approval
  proximity: 300
test_cases:
  should_match:
    - value: "Queensland Treasury Corporation - fixed rate loan agreement\nBorrower: Harbourview Teston Water Board\nClient number: C-40877\nLoan number: FRL-2026-0193\nLoan amount: $48,500,000\nInterest rate: 4.62% p.a. fixed\nMaturity date: 15/10/2036"
      description: QTC fixed rate loan agreement with borrower, client and loan numbers, amount and terms (85 tier)
      synthetic: true
    - value: "QTC repayment schedule - generic debt pool\nFacility number: GDP-77120\n01/01/2027 | 1,215,400.00 | 46,880,000.00\n01/07/2027 | 1,215,400.00 | 46,120,500.00"
      description: QTC repayment schedule with facility number and repayment rows (85 tier)
      synthetic: true
    - value: "Working capital facility offer from QTC under the Statutory Bodies Financial Arrangements Act 1982. Facility limit: $15,000,000."
      description: QTC working capital facility offer with the facility limit only (75 tier)
      synthetic: true
  should_not_match:
    - value: "QTC annual report 2025-26: loans to clients totalled $118 billion under the generic debt pool; loan agreements are made under the Statutory Bodies Financial Arrangements Act 1982. Loan amount: $118,000,000,000."
      description: QTC annual report (publication exclusion)
    - value: "Westpac business loan agreement\nBorrower: Teston Logistics Pty Ltd\nLoan number: BL-88231\nLoan amount: $1,200,000"
      description: Commercial bank loan agreement (no QTC context, 65 only)
    - value: "QTC loan agreement\nBorrower: __________\nClient number: __________\nLoan amount: $________"
      description: Blank QTC loan agreement form (65 only)
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
false_positives:
  - description: QTC annual reports, investor booklets, offering circulars and borrowing program releases.
    mitigation: A publication / guidance exclusion suppresses every enforce tier.
  - description: Commercial bank and other lenders' loan agreements.
    mitigation: Every enforce tier needs QTC context, so they stay at 65 here.
  - description: Council budget papers and long-term financial plans that list QTC loan balances.
    mitigation: They can reach 75 when a loan balance sits beside QTC context; an unpublished debt schedule is a reasonable catch, while published budget documents can be tuned out with the template / guidance exclusions.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_qtc_loan_primary
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_au_qld_qtc_loan_reference
            - Regex_au_qld_qtc_loan_amount
            - Regex_au_qld_qtc_loan_terms
            - Regex_au_qld_qtc_loan_borrower
        - ref: Keyword_au_qld_qtc_loan_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_qtc_loan_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_qtc_loan_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_qtc_loan_reference
            - Regex_au_qld_qtc_loan_amount
            - Regex_au_qld_qtc_loan_terms
        - ref: Keyword_au_qld_qtc_loan_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_qtc_loan_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_qtc_loan_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_qtc_loan_primary
      pattern: >-
        (?i)\b((?:(?:(?:fixed|floating)\s+rate\s+|working\s+capital\s+|term\s+)?loan\s+(?:agreement|offer|confirmation|schedule|statement)|(?:master\s+)?(?:loan\s+)?facility\s+(?:agreement|offer|letter|confirmation|schedule)|master\s+(?:client|lending)\s+agreement|client\s+service\s+agreement|repayment\s+schedule|debt\s+(?:pool|facility)\s+statement|drawdown\s+(?:notice|request|confirmation))s?)\b
    - id: Regex_au_qld_qtc_loan_reference
      pattern: >-
        (?i)\b((?:client\s+(?:ID|no\.?|number|code)|loan\s+(?:ID|no\.?|number|account(?:\s+(?:no\.?|number))?)|facility\s+(?:ID|no\.?|number|reference)|deal\s+(?:ID|no\.?|number)|borrower\s+(?:ID|no\.?|number))[ \t]*[:#]?[ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not|none|nil|the|see|refer)\b|_{2,}|\[|<)(?=[A-Z0-9/-]{0,10}\d)[A-Z0-9][A-Z0-9/-]{3,20})\b
    - id: Regex_au_qld_qtc_loan_amount
      pattern: >-
        (?i)\b((?:facility\s+(?:limit|amount)|loan\s+(?:amount|principal)|principal(?:\s+amount)?|approved\s+(?:borrowing|limit|amount)|borrowing\s+limit|drawdown\s+amount|amount\s+drawn|outstanding\s+(?:balance|principal)|book\s+value|market\s+value)[ \t]*[:#]?[ \t]{0,5}(?:\$|A\$|AUD)[ \t]?\d{1,3}(?:,\d{3}){0,4}(?:\.\d{2})?)
    - id: Regex_au_qld_qtc_loan_terms
      pattern: >-
        (?i)(\b(?:interest\s+rate|fixed\s+rate|margin|administration\s+fee|competitive\s+neutrality\s+fee|maturity\s+date|final\s+maturity|repayment\s+(?:amount|date|frequency)|instalment\s+amount|loan\s+term)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|the|see|refer)\b|_{2,}|\[|<|\$_)[0-9$][0-9$,/% A-Za-z-]{1,30}|\b\d{1,2}[/-]\d{1,2}[/-]\d{2,4}[ \t,|]{1,6}\$?\d{1,3}(?:,\d{3}){0,4}\.\d{2}[ \t,|]{1,6}\$?\d{1,3}(?:,\d{3}){0,4}\.\d{2}\b)
    - id: Regex_au_qld_qtc_loan_borrower
      pattern: >-
        (?i)\b((?:borrower|client(?:\s+name)?|entity(?:\s+name)?)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not|none|nil|redacted|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z&'-]{1,30}(?:[ \t]+[A-Z&][A-Za-z&'-]{0,30}){1,6})
  keywords:
    - id: Keyword_au_qld_qtc_loan_context
      groups:
        - match_style: word
          terms:
            - Queensland Treasury Corporation
            - text: QTC
              case_sensitive: true
            - Queensland Treasury Corporation Act 1988
            - Statutory Bodies Financial Arrangements Act 1982
            - text: SBFA
              case_sensitive: true
            - generic debt pool
            - Treasurer's approval
            - borrowing approval
      strength: specific
    - id: Keyword_au_qld_qtc_loan_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - annual report
            - investor booklet
            - investor book
            - offering circular
            - information memorandum
            - media release
            - fact sheet
            - frequently asked questions
            - borrowing program
      strength: noise
risk_rating: 7
risk_description: >-
  The classifier identifies a QTC client loan, facility or client agreement, drawdown notice, debt statement or repayment schedule with QTC context and populated loan fields: client and loan numbers, facility limit or principal, interest rate, margin, fees, maturity and repayments. It exposes a public sector borrower's unpublished debt position, pricing and refinancing profile, which counterparties, contractors and market participants can use against the borrower or the State in negotiations. QTC annual reports, investor material, blank forms and other lenders' agreements are excluded from enforce tiers. Risk 7 supports SENSITIVE Commercial-in-Confidence, one band below state-borrowing-and-debt-issuance-strategy (QTC's own market strategy, risk 8).
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Commercial-in-Confidence
  idcf: DSL-3
  idcf_marker: Confidential
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Commercial-in-Confidence and Medium because a
    QTC client loan or facility agreement discloses a borrower's unpublished debt, pricing and repayment profile.
    PROTECTED is not met: a single client's facility does not reach the sovereign or market damage threshold that
    QTC's own issuance strategy approaches.
  generic:
    classification: Medium
    dlm: Medium Commercial-in-Confidence
    rationale: >-
      Medium Commercial-in-Confidence handling fits a public borrower's confidential loan terms and debt schedule.
references:
