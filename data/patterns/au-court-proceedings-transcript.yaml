    url: https://schiffradio.com/wp-content/uploads/2023/11/Injunction-part-1.pdf
  - title: Supreme Court of Queensland transcript of 5 June 2009 produced by the State Reporting Bureau (third-party hosted copy) - "Transcript of Proceedings" title, "Copyright in this transcript is vested in the Crown", ..DATE and ..DAY lines, identification WARNING naming the Child Protection Act 1999, HIS HONOUR and MR SURNAME speaker turns
