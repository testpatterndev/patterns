changelog:
  - version: 1.0.0
    date: '2026-11-16'
    description: Initial release - court proceedings transcripts. Case-sensitive judicial speaker-turn primary; 75 needs a counsel speaker turn plus a transcript title, copyright notice, provider marking or page reference within 1000 characters; 85 adds a family law, children's, protection-order, closed-court or suppression term. Quoted exchanges in judgments, news prose, ordering guidance and mock-trial scripts stay at 65 or do not match.
