schema: testpattern/v1
name: Queensland SSAN / Explosives Safety and Security Management System and Security Plan
slug: au-qld-ssan-security-plan
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Security plans and safety and security management systems for security sensitive ammonium nitrate (SSAN) and other explosives held under a prescribed authority in Queensland (Explosives Regulation 2017 (Qld) s 8A, ss 46A-46D, Schedule 3): identified security risks, access detection, chain of possession, authorised receivers, the list of persons allowed unsupervised access, magazine and store identifiers, and reviews after a change in the national counter terrorism alert level or a loss of explosives.
operation: >-
  Primary: SSAN / security sensitive ammonium nitrate / security sensitive explosive / safety and security management system / explosives security plan. 65 is discovery-only (primary alone) and will surface the Regulation, RSHQ explosives information bulletins, the public authority register and blank templates. 75 requires, within 300 characters, a populated access or custody field (authorised receiver or person, unsupervised access, security clearance number or holder, key holder, licence number, magazine or store ID, consignee, delivered to) with a non-placeholder value. 85 requires two distinct populated access or custody fields plus independent security-plan content (chain of possession, counter terrorism alert level, loss of explosives, access detection, intruder alarm, CCTV, stocktake or reconciliation) or an SSAN UN number (1942, 2067, 2071, 3375, 3139). All tiers exclude template/fixture text and a pattern-specific exclusion group (information bulletins, safety notices and alerts, media releases, public register search text).
pattern: (?i)\b(?:security\s+sensitive\s+(?:ammonium\s+nitrate|explosives?)|SSAN|safety\s+and\s+security\s+management\s+system|explosives?\s+security\s+plan)\b
confidence: medium
confidence_justification: >-
  Medium: SSAN and "safety and security management system" are distinctive statutory terms, but RSHQ bulletins, the Regulation and industry guidance use them constantly, so enforce tiers need populated access or custody fields. Licence and security clearance number formats are not public, so those fields use a loose placeholder-guarded value. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out along s 46C.
jurisdictions:
  - au
regulations:
  - Explosives Act 1999 (Qld)
  - Explosives Regulation 2017 (Qld) s 8A, ss 46A-46D, Schedule 3
frameworks:
  - QGISCF
data_categories:
  - security
  - infrastructure
corroborative_evidence:
  keywords:
    - chain of possession
    - unsupervised access
    - national counter terrorism alert level
    - loss of explosives
    - authorised receiver
    - magazine
    - intruder alarm
    - stocktake
  proximity: 300
customisation:
  - key: qld-explosives-licence-number
    kind: identifier-format
    identifier: qld-explosives-licence-number
    target: purview.regexes/Regex_au_qld_ssan_security_plan_access_record
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's queensland explosives licence number format (see docs/identifiers.md#qld-explosives-licence-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: qld-explosives-security-clearance-number
    kind: identifier-format
    identifier: qld-explosives-security-clearance-number
    target: purview.regexes/Regex_au_qld_ssan_security_plan_access_record
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's queensland explosives security clearance number format (see docs/identifiers.md#qld-explosives-security-clearance-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "SSAN security plan - Teston Quarry, Mt Cotton (s 46C)\nAuthorised receiver: Casey Teston (shotfirer)\nUnsupervised access: Casey Teston; Riley Teston\nMagazine ID: MAG-02 ammonium nitrate prill store\nProduct: UN1942 ammonium nitrate 12 t\nChain of possession: supplier to our magazine by licensed transport; stocktake weekly."
      description: Security plan with authorised receiver, unsupervised access list, magazine ID and chain of possession (intended 85)
      synthetic: true
    - value: "Safety and security management system - Teston Blasting Services\nSecurity clearance no.: 4471-2026\nThe emulsion store is alarmed and every entry is logged."
      description: SSMS with one populated clearance field (intended 75)
      synthetic: true
    - value: "Explosives security plan review - triggered by a change in the national counter terrorism alert level\nKey holder: Morgan Teston\nAuthorised person: Jamie Teston\nAll padlocks re-keyed and the access register reconciled on 14/09/2026."
      description: Security plan review after an alert-level change with two named access holders (intended 85)
      synthetic: true
    - value: "SSAN delivery record\nConsignee: Teston Mining Pty Ltd, Moranbah\nUN 3375 ammonium nitrate emulsion, 20 t, received into store 4."
      description: SSAN delivery record with a populated consignee (intended 75)
      synthetic: true
  should_not_match:
    - value: "Explosives information bulletin no. 56 - Security sensitive ammonium nitrate (SSAN) is ammonium nitrate, and emulsions and mixtures with more than 45% ammonium nitrate by mass (UN 1942, 2067, 2071, 3375 and 3139). A licence to use SSAN explosives is required."
      description: RSHQ bulletin (regulator publication decoy)
    - value: "46C Contents of security plan. A security plan must identify security risks for explosives and adopt processes that ensure the chain of possession of the explosives can be traced and records identify persons allowed unsupervised access, as part of the safety and security management system."
      description: Regulation text (legislation decoy, stays at 65)
    - value: "SSAN security plan\nAuthorised receiver: __________\nUnsupervised access: [list names]\nMagazine ID: tbc\nSecurity clearance no.: __________"
      description: Blank security plan form
    - value: "Training exercise: draft a safety and security management system for a mock SSAN store.\nAuthorised receiver: Alex Sample\nKey holder: Sam Sample"
      description: Training exercise
    - value: Police say 200 kg of security sensitive ammonium nitrate taken from a Central Queensland mine site has been recovered, according to a media release.
      description: News / media release
false_positives:
  - description: RSHQ explosives information bulletins (nos. 53 and 56), safety notices and the Regulation itself.
    mitigation: No populated access or custody fields; bulletin, safety notice and media release wording is in the exclusion group.
  - description: The public register of explosives authorities and security clearances (s 47A).
    mitigation: Register search text is excluded; a copied register row with a licence number and holder name can still reach 75, which is acceptable because it names an SSAN authority holder.
  - description: Blank templates from industry bodies and consultants.
    mitigation: Blank lines, square brackets, n/a and tbc values are rejected and template framing is excluded.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_ssan_security_plan_primary
      matches:
        - ref: Regex_au_qld_ssan_security_plan_access_record
          min_count: 2
          unique_results: true
        - type: any
          refs:
            - Keyword_au_qld_ssan_security_plan_content
            - Regex_au_qld_ssan_security_plan_un_number
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_ssan_security_plan_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_ssan_security_plan_primary
      matches:
        - ref: Regex_au_qld_ssan_security_plan_access_record
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_ssan_security_plan_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_ssan_security_plan_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_ssan_security_plan_exclusion
  regexes:
    - id: Regex_au_qld_ssan_security_plan_primary
      pattern: >-
        (?i)\b(?:security\s+sensitive\s+(?:ammonium\s+nitrate|explosives?)|SSAN|safety\s+and\s+security\s+management\s+system|explosives?\s+security\s+plan)\b
    - id: Regex_au_qld_ssan_security_plan_access_record
      pattern: >-
        (?i)\b(?:authori[sz]ed\s+(?:receiver|recipient|person)|unsupervised\s+access(?:\s+(?:holder|person|list))?|(?:security\s+)?clearance\s+(?:no\.?|number|holder)|key\s*holder|(?:explosives?\s+)?licence\s+(?:no\.?|number)|magazine\s+(?:ID|no\.?|number|location)|store\s+(?:ID|no\.?|number|location)|consignee|delivered\s+to)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,40}(?:[ \t]+[A-Za-z0-9][A-Za-z0-9/'.,()-]{0,30}){0,4}
    - id: Regex_au_qld_ssan_security_plan_un_number
      pattern: >-
        \bUN\s?(?:No\.?\s?)?(?:1942|2067|2071|3375|3139)\b
  keywords:
    - id: Keyword_au_qld_ssan_security_plan_content
      groups:
        - match_style: word
          terms:
            - chain of possession
            - counter terrorism alert level
            - national counter terrorism alert level
            - loss of explosives
            - access detection
            - access register
            - intruder alarm
            - CCTV
            - padlocks
            - re-keyed
            - stocktake
            - reconciled
            - reconciliation
            - security risk assessment
      strength: specific
    - id: Keyword_au_qld_ssan_security_plan_exclusion
      groups:
        - match_style: word
          terms:
            - information bulletin
            - explosives information bulletin
            - safety notice
            - safety alert
            - media release
            - search the register
            - public register
      strength: specific
risk_rating: 9
risk_description: >-
  A populated SSAN or explosives security plan names the people with unsupervised access to explosives, the authorised receivers, the magazine and store locations and the controls that detect access and trace custody. SSAN is prescribed as a security sensitive explosive because of its use in improvised explosive devices; the plan is a direct guide to diverting it and a list of people who could be coerced. Risk 9 supports SENSITIVE; PROTECTED would require a national-level aggregation of sites.
