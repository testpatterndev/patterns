schema: testpattern/v1
name: Azure Storage Connection String
slug: global-azure-storage-connection-string
version: 1.4.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects Azure Storage Connection String patterns. This pattern is based on a Microsoft Purview built-in sensitive information type. Users already running Purview may prefer to enable the built-in
  SIT directly, or use this version as a starting point for customisation.
operation: >-
  Reference: https://learn.microsoft.com/en-us/azure/storage/common/storage-configure-connection-string Corroborative evidence: 8 keywords within 300 characters. Keyword lists: credentials. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=\s]{86,92})
confidence: high
confidence_justification: >-
  High confidence: structurally constrained pattern with corroborative keyword support reduces false positive rates significantly. Added context gating and exclusion rules improve precision and reduce
  incidental matches.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - CIS Controls
  - ISO 27001
  - NIST CSF
  - PCI-DSS
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - api key
    - api_key
    - apikey
    - access key
    - secret key
    - private key
    - auth token
    - authorization
  proximity: 300
  keyword_lists:
    - credentials
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: DefaultEndpointsProtocol=https;AccountName=myaccount;AccountKey=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/ABCDEFGHIJKLMNOPQRSTUVWXyz==
      description: Azure Storage connection string
    - value: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      description: Azurite emulator connection string
    - value: DefaultEndpointsProtocol=https;AccountName=test;AccountKey=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
      description: Test connection string
  should_not_match:
    - value: DefaultEndpointsProtocol=https;AccountName=myaccount
      description: Missing AccountKey parameter
    - value: DefaultEndpointsProtocol=https;AccountName=myaccount;AccountKey=short
      description: AccountKey too short (not 86-88 chars)
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
false_positives:
  - description: Authentication-related terminology in software documentation, security training materials, or system architecture descriptions without actual credentials.
    mitigation: Require proximity to credential-specific patterns (API keys, connection strings, tokens) rather than general security terminology.
  - description: Code snippets and configuration examples containing credential-related keywords or placeholder values in developer documentation.
    mitigation: Check for common placeholder patterns (example.com, localhost, 0000) and documentation file types to reduce false positives from technical writing.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: specific
risk_rating: 8
risk_description: >-
  This regex finds an Azure Storage connection string containing protocol, account name, and account key, so the normal match is a complete endpoint credential rather than a key fragment. A recipient can attempt direct access to the named account and may read, write, or delete storage content according to the account key's effective authority. The likely scale is one storage account and the applications and people depending on it, while emulator strings, test accounts, placeholders, and revoked keys reduce actual harm. Risk 8 SENSITIVE reflects serious but contained compromise; PROTECTED would require evidence that the account supports critical services or contains protected holdings at significant scale.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps correctly to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because the connection
    string supplies both target and authentication material for one storage account. PROTECTED is not met without
    evidence of criticality, broad organisational reach, high-impact permissions, or protected data within that account.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic treatment is Medium with Medium InfoTech controls because complete cloud connection strings are directly
      actionable and should be vaulted and rotated after exposure. High is reserved for confirmed use against critical
      or broadly privileged production storage rather than inferred from the string format alone.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_azure_storage
      matches:
        - ref: Keyword_azure_storage_access_key
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    # Populated label alone is 75 (self-corroboration convention); 85 still needs
    # independent context. The label evidence inside the IdMatch never matches (dev-tenant word-break probe 2026-10-19, testpatterndev/testpattern.dev#30).
    - confidence_level: 75
      id_match: Regex_azure_storage
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_azure_storage
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_azure_storage
      pattern: (DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=\s]{86,92})
  keywords:
    - id: Keyword_azure_storage_access_key
      groups:
        - match_style: word
          terms:
            - Azure Storage
            - storage account
            - AccountKey
            - AccountName
            - DefaultEndpointsProtocol
            - blob
            - container
            - connection string
            - core.windows.net
            - primary key
            - secondary key
      strength: domain
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.4.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.3.0
    date: '2026-10-20'
    description: 'Generated name-word tier removed: the 85 tier whose only evidence was the detector name split into words (Pattern_global_azure_storage_connection_string_label_context + Keyword_global_azure_storage_connection_string_domain_context). It was the only enforcing tier, so the bare connection string sat at 65 and reached 85 only beside a name word (azure, storage, connection, string). A full connection string is itself a credential (#71), so this detector now carries the same tiers as its twin azure-storage-account-access-key (same IdMatch): 85 on Keyword_azure_storage_access_key and 75 on the string alone. Its curated terms inside the string (AccountKey=, DefaultEndpointsProtocol=) are joined by "=", which is not a Purview word break (testpattern.dev#30), so the bare string rises from 65 to 75 and storage context lifts it to 85. Definitions left unreferenced are removed.'
  - version: 1.2.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1216 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 90 to 85.; Downgraded weak high-confidence tier to 65 because independent specific/domain evidence was insufficient.
