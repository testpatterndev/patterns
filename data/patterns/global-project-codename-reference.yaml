schema: testpattern/v1
name: Internal Project Codename Reference
slug: global-project-codename-reference
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects references to internal project or initiative codenames in the
  "Project <CODENAME>" / "Operation <CODENAME>" labelling style. The public
  form of this pattern carries fictional example codenames only - it is a
  customisation skeleton: deployments substitute their organisation's live
  codename list via the declared customisation, which is what gives the
  pattern real detection value.
operation: >-
  The regex matches the generic labelling shape (project/operation/codename
  followed by an upper-case token). Precision comes entirely from the
  corroborative codename list, which is declared as a required keyword-set
  customisation - the in-file terms are fictional placeholders and enforcing
  deployments must replace them. The pattern matches case-sensitively, since
  the upper-case codename token itself is the signal that distinguishes a
  labelled codename from ordinary lower-case project-management prose.
pattern: >-
  \b(?:[Pp]roject|[Oo]peration|[Ii]nitiative|[Cc]odename)\s+[A-Z][A-Z0-9]{3,14}\b
confidence: low
confidence_justification: >-
  Low confidence by design: the labelling shape alone matches ordinary project
  management prose. Real precision requires the organisation-specific codename
  list supplied through the declared customisation; until then the pattern is
  a discovery-only skeleton.
jurisdictions:
  - global
regulations: []
frameworks:
  - ISO 27001
data_categories:
  - business
  - intellectual-property
case_sensitive: true
corroborative_evidence:
  keywords:
    - PROJECT CORALSTONE
    - PROJECT SEAHORSE
    - OPERATION WATTLEBIRD
  proximity: 300
customisation:
  - key: project-codenames
    kind: keyword-set
    target: corroborative_evidence.keywords
    note: >-
      Replace the fictional example codenames with your organisation's live
      project/initiative codenames (deployment overlay). The in-file terms are
      placeholders; enforcement without substitution is refused by compliant
      deployment tooling.
    required_for_enforcement: true
test_cases:
  should_match:
    - value: 'the Project CORALSTONE steering pack is embargoed until the board meeting'
      description: Codename labelling shape with an upper-case token
    - value: 'access to Operation WATTLEBIRD materials is restricted to cleared staff'
      description: Operation-style codename reference
  should_not_match:
    - value: 'the project deadline moved and the operation continues normally'
      description: Ordinary prose without an upper-case codename token
    - value: 'Project managers met to discuss initiative funding'
      description: Title-case role wording, not a codename
false_positives:
  - description: Legitimate public project names and all-caps acronyms following
      the word project (e.g. project HVAC scope).
    mitigation: Keep the pattern discovery-only until the codename customisation
      is applied; the organisation-specific list is the precision mechanism.
exports:
  - yaml
scope: wide
risk_rating: 5
risk_description: >-
  Internal codenames mark an organisation's most sensitive initiatives -
  references travelling outside controlled channels reveal that the initiative
  exists and often its context. Severity is organisation-specific, which is
  why the codename list itself is customisation-supplied.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 5 keeps PSPF OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM and Low tier because the public pattern ships
    fictional placeholder codenames and matches only the Project or Operation CODENAME labelling shape. SENSITIVE is not
    met by the skeleton; severity depends on the organisation's live codename list, which deployments must supply and
    may rate higher.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low handling is the default for the customisation skeleton; organisations should raise the label to match
      the initiatives their live codename list covers.
references:
  - title: ASX Listing Rules Guidance Note 8 - Continuous Disclosure
    url: >-
      https://www.asx.com.au/content/dam/asx/rules-guidance-notes-waivers/asx-listing-rules/guidance-notes/gn08-continuous-disclosure.pdf
created: 2026-07-25
updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier). References completed: every reference has a title and a verified URL (No
      regulation listed and the existing ref was a generic title-only citation; replaced with ASX Guidance Note 8
      (confidentiality of undisclosed proposals and leak handling) as the closest authoritative source. PDF verified by
      HTTP 200/redirect only (text not machine-readable)).
  - version: 1.0.1
    date: 2026-08-03
    note: Label-taxonomy fix - replace the list-shaped sensitivity_labels (bare SENSITIVE) with the canonical jurisdiction map; qgiscf_dlm OFFICIAL (severity is organisation-specific and the skeleton is discovery-only until the codename customisation is applied), matching global-strategic-plan-roadmap.
  - version: 1.0.0
    date: 2026-07-25
    note: Initial customisation-skeleton demonstrator (keyword-set, required_for_enforcement).
author: Compl8 (draft)
source: compl8-customisation-v1
