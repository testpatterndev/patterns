schema: testpattern/v1
name: Contract usage analytics
slug: global-top500-374-contract-usage-analytics
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects contract usage analytics: a contract usage / licence utilisation / consumption report phrase combined with populated usage data - rows keyed by a customer or contract identifier, labelled licensed seats, active users, utilisation or overage values, or labelled customer/contract identifiers. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: contract usage analytics/report/data, licence/license usage/consumption/utilisation (report/data/analytics), consumption report, entitlement usage, seat utilisation, usage against contract/commitment/entitlement, committed spend tracking/report. 65 (discovery only): primary alone. 75: primary plus one populated structure - a delimited data row keyed by a customer/contract identifier with a numeric value, a labelled licensed seats/active users/entitlement/committed spend/consumption/utilisation/overage/true-up value, or a labelled customer/account/contract/agreement/tenant ID. 85: primary plus two distinct structures (the three above or a delimited column header pairing a customer/contract ID column with seats, users, consumption, entitlement, overage or utilisation columns) plus commercial evidence (true-up, renewal, shelfware, overage charges, price uplift, expansion opportunity, downgrade risk, enterprise agreement, annual commit, consumption trend). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: (?i)\b(?:contract\s+usage\s+(?:analytics|reports?|data)|licen[cs]e\s+(?:usage|consumption|utili[sz]ation)(?:\s+(?:reports?|data|analytics))?|consumption\s+reports?|entitlement\s+usage|seat\s+utili[sz]ation|usage\s+against\s+(?:contract|commitment|entitlement)|committed\s+spend\s+(?:tracking|reports?))\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated dataset structure (a data row keyed by a customer/record identifier, a labelled value or a labelled identifier) beside the topic phrase; a column header on its own only counts toward 85, so blank extracts stay at 65. Help pages, policies, product copy and news that only name the topic stay at 65. Medium because internal analytics documentation with worked examples can still reach 75.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - true-up
    - renewal
    - shelfware
    - overage charges
    - price uplift
    - expansion opportunity
    - downgrade risk
    - enterprise agreement
    - annual commit
    - consumption trend
  proximity: 300
test_cases:
  should_match:
    - value: "Contract usage analytics - Q3 FY26 (commercial-in-confidence)\ncustomer_id,contract_id,licensed_seats,active_users,utilisation_pct,overage\nC104421,EA-2024-0187,1200,1374,114.5,174\nC104587,EA-2025-0033,500,212,42.4,0\nTrue-up and price uplift to be raised at renewal; shelfware at C104587."
      description: Usage extract - header, customer rows and commercial evidence (85)
      synthetic: true
    - value: "License utilization report\nCustomer ID: C104421\nShared with the account team."
      description: Single labelled customer identifier (75)
      synthetic: true
  should_not_match:
    - value: "Help centre article: the license usage report shows licensed seats, active users and utilisation for your tenant. Admins can export it from the portal."
      description: Product help article
      synthetic: true
    - value: "Contract usage analytics\ncustomer_id,contract_id,licensed_seats,active_users,utilisation_pct\n"
      description: Blank extract - column header only (65)
      synthetic: true
    - value: "Software vendors are auditing license usage more aggressively, with true-up bills rising 20%, a news report said."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing licence and contract usage.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of licence and contract usage.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_contract_usage_analytics
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_374_contract_usage_analytics_column_header
            - Regex_global_top500_374_contract_usage_analytics_data_row
            - Regex_global_top500_374_contract_usage_analytics_labelled_value
            - Regex_global_top500_374_contract_usage_analytics_identifier
        - ref: Keyword_global_top500_374_contract_usage_analytics_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_374_contract_usage_analytics_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_contract_usage_analytics
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_374_contract_usage_analytics_data_row
            - Regex_global_top500_374_contract_usage_analytics_labelled_value
            - Regex_global_top500_374_contract_usage_analytics_identifier
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_374_contract_usage_analytics_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_contract_usage_analytics
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_contract_usage_analytics
      pattern: (?i)\b(?:contract\s+usage\s+(?:analytics|reports?|data)|licen[cs]e\s+(?:usage|consumption|utili[sz]ation)(?:\s+(?:reports?|data|analytics))?|consumption\s+reports?|entitlement\s+usage|seat\s+utili[sz]ation|usage\s+against\s+(?:contract|commitment|entitlement)|committed\s+spend\s+(?:tracking|reports?))\b
    - id: Regex_global_top500_374_contract_usage_analytics_column_header
      pattern: (?i)\b(?:(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:licen[cs]ed[ _]?(?:seats|units|users)|active[ _]?users|seats(?:[ _]?used)?|consumption|usage(?:[ _]?(?:units|pct))?|entitle(?:ment|d)|overage|committed(?:[ _]?(?:spend|units))?|utili[sz]ation(?:[ _]?pct)?)|(?:licen[cs]ed[ _]?(?:seats|units|users)|active[ _]?users|seats(?:[ _]?used)?|consumption|usage(?:[ _]?(?:units|pct))?|entitle(?:ment|d)|overage|committed(?:[ _]?(?:spend|units))?|utili[sz]ation(?:[ _]?pct)?)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash))\b
    - id: Regex_global_top500_374_contract_usage_analytics_data_row
      pattern: (?i)\b[A-Z]{0,5}[-_]?\d{4,12}\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,160}?(?:[,;\t]|\|[ \t]{0,2}))?\"?-?\$?\d{1,12}(?:\.\d{1,6})?%?(?![\w.])
    - id: Regex_global_top500_374_contract_usage_analytics_labelled_value
      pattern: (?i)\b(?:licen[cs]ed\s+(?:seats|units|users)|active\s+users|seats\s+used|entitlement|committed\s+(?:spend|units|volume)|consumption|utili[sz]ation|overage|true-?up\s+amount)[ \t]{0,3}[:#][ \t]{0,3}(?:(?:AUD|USD|NZD|GBP|EUR|A\$|US\$|NZ\$|\$|£|€)[ \t]?(?:\d{1,3}(?:,\d{3}){1,4}|\d{1,12})(?:\.\d{2})?(?![\d,]\d)(?!\.\d)|\d{1,3}(?:,\d{3}){0,3}(?:\.\d{1,2})?(?:[ \t]?%)?)
    - id: Regex_global_top500_374_contract_usage_analytics_identifier
      pattern: (?i)\b(?:customer\s*(?:no\.?|number|ID)|account\s*(?:no\.?|number|ID)|contract\s*(?:no\.?|number|ID)|agreement\s*(?:no\.?|number)|tenant\s+ID)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Za-z-]{0,8}\d)[A-Za-z0-9][A-Za-z0-9._@-]{3,64}
  keywords:
    - id: Keyword_global_top500_374_contract_usage_analytics_domain_evidence
      groups:
        - match_style: word
          terms:
            - true-up
            - renewal
            - shelfware
            - overage charges
            - price uplift
            - expansion opportunity
            - downgrade risk
            - enterprise agreement
            - annual commit
            - consumption trend
      strength: domain
    - id: Keyword_global_top500_374_contract_usage_analytics_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - admins can export it
      strength: noise
risk_description: >-
  The detector recognises contract-usage analytics, service agreements, licence usage, consumption reports, and utilisation metrics that may describe how a customer consumes contractual rights or services. A populated analytic view can expose commercial dependencies, overages, renewal leverage, compliance posture, and customer behaviour that a counterparty or competitor could exploit in negotiation or dispute. The normal unit is bounded to one contract or customer analysis and does not necessarily contain privileged advice, signatures, or an enterprise-wide customer dataset. Risk 8 SENSITIVE Personal-Privacy reflects serious contained customer and commercial harm; PROTECTED is not met without systemic customer exposure, privileged high-stakes strategy, or credible significant organisational damage. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs a populated customer/contract usage row, labelled usage value or labelled customer/contract ID and 85 needs two distinct structures (header counts only toward 85) plus commercial evidence. Removed the self-corroborating evidence group (which held generic words such as contract, usage, analytics, customer) and the generic 'service agreement' primary. Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA, My Health Records Act and TIA Act.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 961 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
