schema: testpattern/v1
name: Legal advice memoranda
slug: global-top500-163-legal-advice-memoranda
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to legal advice memoranda in international contexts. These are privileged
  or confidential legal advice records; the category is not personally identifiable information.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 6 keywords within 300 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:legal\s+advice\s+memoranda|legal\s+opinion|legal\s+memorandum|legal\s+counsel|solicitor\s+advice|legal\s+professional\s+privilege|privileged\s+communication|without\s+prejudice|legal\s+risk\s+assessment|general\s+counsel|in[\s-]+house\s+counsel|legal\s+briefing)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
- GDPR
- AML/CTF Act (Cth)
- HRIPA (Cth)
- IPA 2009 (Qld)
- My Health Records Act 2012 (Cth)
- NDB Scheme (Cth)
- Privacy Act 1988 (Cth)
- TIA Act 1979 (Cth)
data_categories:
- legal
corroborative_evidence:
  keywords:
  - legal advice memoranda
  - legal
  - advice
  - memoranda
  - corporate
  - governance
  proximity: 300
test_cases:
  should_match:
  - value: legal advice memoranda
    description: Primary topic phrase match
  - value: legal opinion
    description: Case-insensitive topic phrase match
  - value: legal memorandum
    description: Alternative topic phrase match
  - value: legal counsel
    description: Additional topic phrase match
  - value: "To: Director-General\nFrom: Principal Legal Officer\nDate: 12/08/2026\nSubject: legal advice memoranda\nOur ref: LS2026-0412\nThis briefing sets out the legal advice memoranda for decision."
    description: Populated doc record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: board policy
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about legal advice memoranda are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Common words and phrases related to legal advice memoranda appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_legal_advice_memoranda
      matches:
        - ref: Regex_global_top500_163_legal_advice_memoranda_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_legal_advice_memoranda
      matches:
        - ref: Regex_global_top500_163_legal_advice_memoranda_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_legal_advice_memoranda
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_legal_advice_memoranda
      pattern: (?is)\b(?:legal\s+advice\s+memoranda|legal\s+opinion|legal\s+memorandum|legal\s+counsel|solicitor\s+advice|legal\s+professional\s+privilege|privileged\s+communication|without\s+prejudice|legal\s+risk\s+assessment|general\s+counsel|in[\s-]+house\s+counsel|legal\s+briefing)\b
    - id: Regex_global_top500_163_legal_advice_memoranda_record_structure
      pattern: >-
        (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9]
risk_description: The detector recognizes legal opinions, memoranda, counsel, privilege, without-prejudice, risk-assessment,
  and legal-briefing language rather than proving that advice was sought or privilege attaches. A genuine memorandum can disclose
  counsel's analysis, admitted weaknesses, litigation exposure, recommended actions, and client facts, allowing an opponent
  or regulator to exploit the organization's position. The normal affected unit is one client matter and its participants,
  while reported judgments, legal training, and generic templates may use the same phrases. Risk 8 and SENSITIVE Legal reflect
  serious contained prejudice to that matter; PROTECTED would require an exceptional protected operation or legal disclosure
  capable of significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
