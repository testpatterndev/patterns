changelog:
- version: 1.4.1
  date: '2026-09-24'
  description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
- version: 1.4.0
  date: '2026-09-24'
  description: 'Merge global-top500-164-attorney-client-privileged-communications into this classifier (Qld government classifier
    review 2026-09-24): added a privilege-marker regex (legal professional privilege incl. "subject to", client legal privilege,
    privileged and confidential, solicitor-/attorney-/lawyer-client privilege or communication, litigation privilege, work
    product, privilege log, "prepared for the dominant purpose of", privileged communication). It is used as independent evidence
    for a new 85 path (advice primary + 2 header fields + privilege marking) and as a second primary (65 discovery; 75 with 2
    header fields) so privileged communications without advice wording are still detected. Moved legal professional privilege
    and privileged communication out of the advice primary so the evidence never shares a span with it; widened "legal advice
    memoranda" to memorandum/memoranda. Added a guidance exclusion (fact sheet, training module, e-learning, FAQ, this/these
    guideline(s)) to enforcing tiers. Not imported: the absorbed self-corroborating topic tiers, legal hold (litigation-hold
    notices are a different record), and the generic confidential legal / protected communication phrases. Replaced bare-phrase
    tests with populated memo, email, privilege-log and file-note records plus LPP training, fact-sheet, news and email-disclaimer
    decoys. Name and description updated for the merged scope; risk 8 and labels unchanged (both classifiers were risk 8 SENSITIVE
    Legal).'
- version: 1.3.0
  date: '2026-09-24'
  description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires independent doc record structure (Regex ..._record_structure); 85 requires 3 distinct structure hits. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
- version: 1.2.3
  date: '2026-07-18'
  description: 'Adversarial accuracy pass: correct data_categories from [''pii''] to [''legal''] so package routing and workbook
    category claims match the detector content (description may already have been fixed in wave1).'
- version: 1.2.2
  date: '2026-07-17'
  description: 'SIT alignment wave1 (TP-01084, reduced scope): description-only correction — removed the incorrect PII claim
    and reworded the category as privileged or confidential legal advice, per the approved reduced scope. The proposed behavioral
    tier_rebalance was NOT implemented (no concrete replacement references were defined) and remains deferred; detection logic
    unchanged.'
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1722 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
