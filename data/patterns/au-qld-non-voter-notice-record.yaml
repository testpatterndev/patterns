schema: testpattern/v1
name: Queensland Apparent Non-Voter Notice, Response or Infringement Record
slug: au-qld-non-voter-notice-record
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Elector-level records from ECQ's compulsory voting enforcement process: apparent failure to vote notices issued after a State or local government election (Electoral Act 1992 (Qld) s 134), elector responses giving a valid and sufficient reason for not voting or saying that they did vote and giving the details, payment records (s 135), infringement notices for failing to vote (s 186; LGEA 2011 ss 165, 166, 168), and referrals of unpaid notices to the State Penalties Enforcement Registry (SPER). ECQ's published process is apparent failure to vote notice, then infringement notice, then SPER referral. Excuses often disclose health conditions, hospital admissions, disability, bereavement, travel, religious duty (s 186(2)) or family circumstances. The "Do I have to vote?" page, penalty unit value statements, aggregate non-voter statistics and blank response forms are decoys.
operation: >-
  Primary: apparent failure to vote, failure / failed / failing to vote, non-voter(s) / nonvoter(s), valid and sufficient reason or excuse, or reason / excuse for not voting. 75 requires, within 300 characters, a populated elector name field (elector, voter, name, full name, recipient, addressee or name of elector followed by a name of two or more capitalised words, or surname / family name followed by a capitalised word) AND one apparent-failure-to-vote structure: a labelled notice number (the infringement-notice-number fallback: infringement notice, offence notice or notice followed by no. / number / ref and a value of at least 7 characters containing a digit), a populated reason, excuse or payment field, or a populated address field (street number and name or PO Box). 85 requires a name field AND a labelled notice number AND a populated reason, excuse or payment field (reason [for not voting / given], excuse, explanation, elector's response, response, outcome, decision, I did vote, voted at, polling place attended, amount paid / payable / due / owing / outstanding, penalty amount, payment [received / amount / date / reference / status], paid, fine [amount], due date, pay by, status). Values must be on the same line as their label and are placeholder-guarded. All tiers AND NOT the shared template-exclusion dictionary; enforce tiers also exclude guidance and statistics wording (do I have to vote, frequently asked questions, fact sheet, value of a penalty unit, penalty unit value, annual report, legislation.qld.gov.au). 65 is discovery-only.
pattern: >-
  (?i)\b(?:apparent\s+failure\s+to\s+vote|fail(?:ure|ed|ing)\s+to\s+vote|non-?voters?|valid\s+and\s+sufficient\s+(?:reason|excuse)|(?:reason|excuse)\s+for\s+not\s+voting)\b
confidence: medium
confidence_justification: >-
  Medium. Failure-to-vote wording is distinctive to compulsory voting enforcement, but ECQ and AEC guidance, penalty statements and annual reports use the same phrases, so enforce tiers need a populated elector name plus a notice number, excuse, payment or address field. The ECQ notice number format is unpublished, so the notice number is the registry's label-anchored infringement-notice-number fallback. The "Apparent Failure to Vote" notice title and the response wording come from the ECQ "Do I have to vote?" page. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Electoral Act 1992 (Qld) ss 134, 135, 186
  - Local Government Electoral Act 2011 (Qld) ss 165, 166, 168
  - State Penalties Enforcement Act 1999 (Qld)
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government
  - law-enforcement
corroborative_evidence:
  keywords:
    - apparent failure to vote
    - infringement notice
    - SPER
    - valid and sufficient reason
    - polling day
    - elector
    - Electoral Commission of Queensland
  proximity: 300
customisation:
  - key: infringement-notice-number
    kind: identifier-format
    identifier: infringement-notice-number
    target: purview.regexes/Regex_au_qld_non_voter_notice_number
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the populated-field evidence with the customer's infringement notice number format (see docs/identifiers.md#infringement-notice-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Apparent Failure to Vote Notice - 2026 Queensland State election\nNotice number: 2026417733\nElector: Harper Teston\nAddress: 31 Lorikeet Street, Townsville QLD 4810\nReason for not voting: admitted to hospital on polling day with a fractured hip\nOutcome: valid and sufficient reason accepted"
      description: Notice and response with a health-related excuse (85 tier)
      synthetic: true
    - value: "Infringement notice - failure to vote, 2024 local government elections\nInfringement notice number: 7004418219\nName: Jordan Teston\nAmount payable: $161.30\nDue date: 14/11/2024\nStatus: unpaid, referred to SPER"
      description: Failure-to-vote infringement notice with payment details and SPER referral (85 tier)
      synthetic: true
    - value: "Non-voter response received by email.\nElector: Casey Teston\nI did vote: voted at Kenmore State School polling booth on election day"
      description: Elector response saying they did vote, no notice number (75 tier)
      synthetic: true
    - value: "Apparent failure to vote notice returned to sender.\nName: Riley Teston\nAddress: 7 Grevillea Crescent, Bundaberg QLD 4670"
      description: Returned notice with elector name and address (75 tier)
      synthetic: true
  should_not_match:
    - value: "Do I have to vote? Voting is compulsory for enrolled Queensland electors. If you did not vote you will receive an apparent failure to vote notice. You can provide a valid and sufficient reason for not voting, or tell us that you did vote and provide the details. Unpaid fines are referred to SPER."
      description: ECQ "Do I have to vote?" page text (65 only)
    - value: "The penalty for failing to vote is 1 penalty unit, which is $172.70 from 1 July 2026. Half the penalty applies if it is paid by the due date."
      description: Penalty unit value statement (65 only)
    - value: "Non-voter statistics: 312,448 apparent failure to vote notices were issued after the 2024 State election and 41,902 electors provided a valid and sufficient reason."
      description: Aggregate non-voter statistics (65 only)
    - value: "Apparent failure to vote - response form\nElector name: ______________\nNotice number: ______________\nReason for not voting: ______________"
      description: Blank response form (65 only)
    - value: "186 Failure to vote etc. (1) An elector must vote at each election for the electoral district for which the elector is enrolled unless the elector has a valid and sufficient reason for not voting."
      description: Electoral Act s 186 text (65 only)
false_positives:
  - description: ECQ and AEC compulsory voting guidance, payment pages and annual reports.
    mitigation: Enforce tiers need a populated elector name plus a notice number, excuse, payment or address field. A guidance exclusion suppresses "Do I have to vote", FAQ, fact sheet, penalty unit value and annual report text.
  - description: Council local law infringement notices and other SPER referrals.
    mitigation: They lack failure-to-vote wording, so this classifier does not fire. The reverse overlap exists; see risk_description.
  - description: Blank notice and response forms.
    mitigation: Blank lines and bracket placeholders are rejected, and the notice number must contain a digit.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_non_voter_notice_primary
      matches:
        - ref: Regex_au_qld_non_voter_notice_name_field
        - ref: Regex_au_qld_non_voter_notice_number
        - ref: Regex_au_qld_non_voter_notice_reason_payment_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_non_voter_notice_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_non_voter_notice_primary
      matches:
        - ref: Regex_au_qld_non_voter_notice_name_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_non_voter_notice_number
            - Regex_au_qld_non_voter_notice_reason_payment_field
            - Regex_au_qld_non_voter_notice_address_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_non_voter_notice_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_non_voter_notice_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_non_voter_notice_primary
      pattern: >-
        (?i)\b(?:apparent\s+failure\s+to\s+vote|fail(?:ure|ed|ing)\s+to\s+vote|non-?voters?|valid\s+and\s+sufficient\s+(?:reason|excuse)|(?:reason|excuse)\s+for\s+not\s+voting)\b
    - id: Regex_au_qld_non_voter_notice_name_field
      pattern: >-
        (?i)\b(?:(?:(?:elector|voter)(?:'?s)?(?:\s+(?:full\s+)?name)?|(?:full\s+)?name|name\s+of\s+(?:the\s+)?(?:elector|voter)|recipient|addressee)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|given|family|surname|first|middle|other|previous|date|address|signature|title|gender|occupation)\b|_{2,}|\[|<)(?:(?:Mr|Mrs|Ms|Miss|Mx|Dr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:family\s+name|surname)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|given|family|first|middle|other|previous|date|address|signature|title|gender|occupation)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30})
    - id: Regex_au_qld_non_voter_notice_number
      pattern: >-
        (?i)\b(?:(?:penalty\s+)?infringement\s+notice|camera[\s-]+detected\s+offence\s+notice|offence\s+notice|notice)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{5,20}\b
    - id: Regex_au_qld_non_voter_notice_reason_payment_field
      pattern: >-
        (?i)\b(?:(?:reason|excuse|explanation)(?:\s+(?:for\s+not\s+voting|given|provided))?|elector'?s?\s+(?:response|reason|explanation)|response|outcome|decision|I\s+did\s+vote|voted\s+at|polling\s+(?:place|booth)\s+attended|amount\s+(?:paid|payable|due|owing|outstanding)|penalty\s+amount|payment(?:\s+(?:received|amount|date|reference|status))?|paid|fine(?:\s+amount)?|due\s+date|pay\s+by|status)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9$][A-Za-z0-9$.,'/() -]{1,60}
    - id: Regex_au_qld_non_voter_notice_address_field
      pattern: >-
        (?i)\b(?:(?:(?:current|previous|new)\s+)?(?:(?:residential|postal|enrolled|home|street|mailing)\s+)?address)[ \t]*[:#][ \t]{0,5}(?:(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:PO|P\.O\.|GPO|Locked)[ \t]+(?:Box|Bag)[ \t]+\d{1,6})
    - id: Regex_au_qld_non_voter_notice_guidance_exclusion
      pattern: >-
        (?i)\b(?:do\s+I\s+have\s+to\s+vote|frequently\s+asked\s+questions|fact\s?sheet|value\s+of\s+a\s+penalty\s+unit|penalty\s+unit\s+value|annual\s+report|legislation\.qld\.gov\.au)\b
risk_rating: 6
risk_description: >-
  The classifier identifies an elector-level apparent failure to vote notice, the elector's response, a failure-to-vote infringement notice or a SPER referral that names the elector with an address, a notice number and the excuse or payment position. Excuses routinely disclose health conditions, hospital admissions, disability, pregnancy, bereavement, travel, religious duty and family or domestic circumstances, which is why the label is SENSITIVE Personal-Privacy rather than the roll-derived SENSITIVE Electoral Roll: the harm is the personal circumstances, not the roll entry. Once a notice becomes an infringement notice or SPER referral it also carries enforcement character; an organisation that wants SENSITIVE Legal for that stage should co-deploy au-qld-council-infringement-sper-record, which fires on failure-to-vote infringement notices only when council or local-law context (for example a named city or regional council in a local government election notice) sits within 300 characters. Guidance, penalty unit statements, statistics and blank forms are excluded from enforce tiers. Risk 6 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Electoral Act 1992 (Qld) - ss 134, 135, 186
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1992-028
  - title: Local Government Electoral Act 2011 (Qld) - ss 165, 166, 168
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-2011-027
  - title: Electoral Commission of Queensland - Do I have to vote?
    url: https://www.ecq.qld.gov.au/how-to-vote/do-i-have-to-vote
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release. Apparent failure to vote notices, elector responses, failure-to-vote infringement notices and SPER referrals, anchored on Electoral Act ss 134, 135, 186 and the ECQ non-voter process. 75 requires a populated elector name plus a notice number, excuse / payment or address field; 85 requires name + notice number (infringement-notice-number fallback) + excuse or payment field. Guidance, penalty unit statements, statistics and blank forms stay at 65.
