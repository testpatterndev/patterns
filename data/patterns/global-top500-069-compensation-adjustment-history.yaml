schema: testpattern/v1
name: Compensation adjustment history
slug: global-top500-069-compensation-adjustment-history
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects salary reviews, pay increases and compensation adjustment histories for an identified employee, with current/new salary amounts, percentage increases, classification/step or effective dates.
operation: >-
  Primary: a compensation phrase (compensation adjustment/history, salary review/adjustment/increase/history, pay increase/rise, remuneration review, wage adjustment, increment progression). 75 tier requires a populated person field (employee/staff name or number, payroll number, position number or title, work unit) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated pay detail (current/new salary amount, percentage increase, effective date, or classification/step) and an independent corroborative term (approved by, delegate, market, retention, reclassification). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:compensation\s+(?:adjustment|history|change)|salary\s+(?:review|adjustment|increase|history|change|progression)|pay\s+(?:increase|rise|adjustment)|remuneration\s+(?:review|adjustment|change)|wage\s+adjustment|increment(?:al)?\s+(?:advancement|progression)|pay\s+point\s+progression)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - approved by
    - delegate
    - market
    - retention
    - reclassification
    - superannuation
    - remuneration committee
    - budget
    - higher duties
  proximity: 300
test_cases:
  should_match:
    - value: "Salary review outcome 2026\nEmployee name: Avery Teston\nClassification: AO6 step 2\nCurrent salary: $104,219\nNew salary: $107,867\nEffective date: 01/07/2026\nApproved by delegate: Director, People and Culture."
      description: '85: Salary review with employee, classification, salaries and effective date'
      synthetic: true
    - value: "Compensation history\nEmployee: Jordan Staffson\nPrevious base: USD 92,000\nRevised base: USD 97,500\nEffective from 2025-04-01; retention adjustment signed off by the remuneration committee."
      description: '85: Compensation history with previous/revised base'
      synthetic: true
    - value: "Pay increase confirmation\nEmployee ID: 4471820\nYour increase reflects the market adjustment agreed at your one-on-one."
      description: '75: Pay increase naming an employee ID, no amounts'
      synthetic: true
  should_not_match:
    - value: The salary review process runs each July. This policy explains how pay increase decisions are made and approved.
      description: Policy text - must stay below 75
    - value: "Salary adjustment form\nEmployee name: __________\nCurrent salary: $__________\nNew salary: $__________\nEffective date: ___/___/____"
      description: Blank form - must stay below 75
    - value: The Queensland public sector wage adjustment of 4% takes effect in July, the Treasurer said in a media release.
      description: News / media release - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_069_compensation_adjustment_history_primary
      matches:
        - ref: Regex_top500_069_compensation_adjustment_history_person_field
        - ref: Regex_top500_069_compensation_adjustment_history_record_detail
        - ref: Keyword_top500_069_compensation_adjustment_history_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_069_compensation_adjustment_history_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_069_compensation_adjustment_history_primary
      matches:
        - ref: Regex_top500_069_compensation_adjustment_history_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_069_compensation_adjustment_history_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_069_compensation_adjustment_history_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_069_compensation_adjustment_history_primary
      pattern: >-
        (?i)\b(?:compensation\s+(?:adjustment|history|change)|salary\s+(?:review|adjustment|increase|history|change|progression)|pay\s+(?:increase|rise|adjustment)|remuneration\s+(?:review|adjustment|change)|wage\s+adjustment|increment(?:al)?\s+(?:advancement|progression)|pay\s+point\s+progression)\b
    - id: Regex_top500_069_compensation_adjustment_history_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_069_compensation_adjustment_history_record_detail
      pattern: >-
        (?i)\b(?:current|previous|old|new|revised|proposed|base)\s+(?:salary|base|rate|remuneration|package)\s*(?:\([^)]{1,20}\))?\s*[:\-]\s*(?:(?:AUD|USD|GBP|NZD|A\$|US\$|NZ\$|\$|£|€)\s?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?)|\b(?:increase|adjustment|change)\s*(?:\(%\)|%|percent(?:age)?)?\s*[:\-]\s*\+?\d{1,2}(?:\.\d{1,2})?\s*%|\beffective\s+(?:date|from)\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|\b(?:classification|level|grade|pay\s+point|step|increment)\s*[:\-]\s*[A-Z]{0,4}\s?-?\d{1,2}(?:\.\d{1,2})?\b
  keywords:
    - id: Keyword_top500_069_compensation_adjustment_history_corroborative
      groups:
        - match_style: word
          terms:
            - approved by
            - delegate
            - market
            - retention
            - reclassification
            - superannuation
            - remuneration committee
            - budget
            - higher duties
      strength: specific
    - id: Keyword_top500_069_compensation_adjustment_history_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a individual salary review or compensation adjustment record about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Disclosure exposes an identifiable employee's pay and pay history, enabling pay comparisons, social engineering and workplace conflict. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 reconciles to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the SENSITIVE Personal-Privacy DLM, SENS_Pvc, and
    Medium tier for an individual's pay-change history. The next PROTECTED level is not met because a normal employee
    record is not a bulk payroll system, protected executive strategy, market-sensitive plan, or significant-damage
    compromise.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium and Medium Personal-Privacy handling fit longitudinal compensation changes that expose personal
      finances and management decisions with serious but individualised consequences.
