schema: testpattern/v1
name: International Banking Account Number (Microsoft built-in)
slug: global-iban-builtin
version: 1.0.0
type: keyword_list
pattern_class: concept
description: >-
  Catalogue reference for the Microsoft Purview built-in International Banking Account Number (IBAN) sensitive information
  type, which detects an International Bank Account Number with a valid country code and mod-97 check digits. Microsoft recommends
  high confidence (85) for the built-in entity. This YAML-only record lets a package recipe include the Microsoft entity explicitly;
  it does not reproduce Microsoft's built-in regular expressions, keyword dictionaries, checksums or XML.
operation: >-
  In Microsoft Purview, enable the built-in entity e7dc4711-11b7-4cb0-b88b-2c394a771f0e to use Microsoft's detection logic.
  This reference exports YAML only and must not be deployed as a custom XML clone. The custom SIT global-iban (International
  Bank Account Number (IBAN) - Global) detects the same data with TestPattern's own tiers and stays the default; choose this
  built-in only through an explicit recipe include.
keywords:
- International Banking Account Number (IBAN)
- International Banking Account Number
- International Bank Account Number
confidence: medium
confidence_justification: >-
  Medium confidence for this YAML-only record: its keyword logic finds references to the built-in entity name with Microsoft
  Purview context, not populated values. Microsoft's own recommended confidence for the entity is 85. The record does not
  claim to reproduce Microsoft's proprietary detection logic.
jurisdictions:
- global
regulations:
- GDPR
- CCPA/CPRA
frameworks:
- ISO 27001
- ISO 27701
- PCI-DSS
- SOC 2
data_categories:
- financial
- pii
test_cases:
  should_match:
  - value: International Banking Account Number (IBAN) built-in SIT
    description: Microsoft built-in entity name
  - value: International Banking Account Number catalogue reference
    description: Name variant used for registry discovery
  - value: |-
      DLP policy inventory - Microsoft Purview
      Rule: Builtin-global-iban-builtin
      Condition: International Banking Account Number (IBAN) (built-in entity e7dc4711-11b7-4cb0-b88b-2c394a771f0e), high confidence, instance count 1 or more
      Action: notify sender
    description: DLP rule inventory row naming the built-in entity with Microsoft Purview context
    synthetic: true
  should_not_match:
  - value: 'Account: GB82 WEST 1234 5698 7654 32'
    description: Populated value or sibling reference without the built-in entity name
  - value: SWIFT code lookup table
    description: Populated value or sibling reference without the built-in entity name
  - value: Bank transfer instructions template
    description: Populated value or sibling reference without the built-in entity name
false_positives:
- description: Documentation and policy inventories can mention the Microsoft built-in entity by name.
  mitigation: Treat this YAML-only record as catalogue discovery; enable the Microsoft entity for value detection.
- description: The custom SIT global-iban detects the same data; deploying both doubles matches on the same content.
  mitigation: Pick one per package. The custom SIT is the default; include this built-in only by an explicit recipe decision.
exports:
- yaml
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
  - confidence_level: 75
    id_match: Keyword_global_iban_builtin_name
    matches:
    - ref: Evidence_microsoft_builtin_context
  keywords:
  - id: Keyword_global_iban_builtin_name
    groups:
    - match_style: word
      terms:
      - International Banking Account Number (IBAN)
      - International Banking Account Number
      - International Bank Account Number
    strength: specific
  - id: Evidence_microsoft_builtin_context
    groups:
    - match_style: word
      terms:
      - Microsoft Purview
      - built-in SIT
      - built-in entity
      - catalogue reference
      - entity definition
    strength: domain
risk_rating: 4
risk_description: >-
  The referenced Microsoft entity detects the same data as the custom SIT global-iban, so this record carries that SIT's reviewed
  risk (4) and sensitivity labels unchanged. The built-in changes who maintains the detection logic, not what the matched
  content is worth to an attacker.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Tier Low is carried from the reviewed assessment of the custom SIT global-iban, which detects the same data. This record
    is a YAML-only reference to the Microsoft entity.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low with Low handling is carried from global-iban, the custom SIT for the same data.
references:
- url: https://learn.microsoft.com/en-us/purview/sit-defn-international-banking-account-number
  title: International Banking Account Number (IBAN) entity definition - Microsoft Learn
- url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-entity-definitions
  title: Sensitive information type entity definitions - Microsoft Learn
created: '2026-10-20'
updated: '2026-10-20'
author: testpattern-community
source: microsoft
license: MIT
changelog:
- version: 1.0.0
  date: '2026-10-20'
  description: >-
    Catalogue reference for the Microsoft built-in International Banking Account Number (IBAN) (GUID e7dc4711-11b7-4cb0-b88b-2c394a771f0e,
    from the tenant SIT inventory and the Microsoft Learn entity definition). In no block: packages take it only by explicit
    recipe include.
