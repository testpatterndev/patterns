schema: testpattern/v1
name: Psychometric assessment results
slug: global-top500-073-psychometric-assessment-results
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects psychometric, personality, aptitude and cognitive-ability assessment results for an identified candidate or employee: a named candidate/applicant with scores, percentiles, sten values, trait ratings or a suitability recommendation.
operation: >-
  Primary: a psychometric assessment phrase (psychometric assessment/test/report/results, personality profile/assessment/questionnaire/inventory, cognitive ability test, aptitude test, psychological assessment, verbal/numerical/abstract reasoning test, situational judgement test, OPQ32, Hogan inventories). The old over-broad "test results", "candidate profile" and "assessment score" alternatives were removed. 75 tier requires a populated person field (candidate/applicant/participant/employee name or ID, staff or payroll number) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated result detail (score, percentile, sten/stanine, trait scale value, or a suitability recommendation) and an independent corroborative term (percentile, norm group, assessor, psychologist, selection panel, shortlisting, feedback report, recruitment). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:psychometric\s+(?:assessments?|tests?|testing|reports?|results?|profiles?)|personality\s+(?:profile|assessment|questionnaire|inventory)|cognitive\s+ability\s+(?:tests?|assessments?)|aptitude\s+tests?|psychological\s+assessments?|(?:verbal|numerical|abstract|inductive|deductive)\s+reasoning\s+tests?|situational\s+judg(?:e)?ment\s+tests?|OPQ32|Hogan\s+(?:Personality\s+Inventory|Development\s+Survey))\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - Anti-Discrimination Act 1991 (Qld)
  - Public Sector Act 2022 (Qld)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - percentile
    - norm group
    - assessor
    - psychologist
    - selection panel
    - shortlisting
    - feedback report
    - recruitment
    - hiring manager
    - development plan
  proximity: 300
test_cases:
  should_match:
    - value: "Psychometric assessment report\nCandidate name: Avery Teston\nRole: Senior Project Officer\nNumerical reasoning: 78th percentile\nVerbal reasoning: 64th percentile\nConscientiousness: Sten 7\nRecommendation: Suitable\nReport prepared for the selection panel."
      description: "85: psychometric report with candidate, reasoning percentiles, trait sten and recommendation"
      synthetic: true
    - value: "Personality assessment results - Hogan Personality Inventory\nApplicant ID: CAND-20931\nAdjustment: 32 percentile\nAmbition: 81 percentile\nAssessor: Dr Jordan Staffson, registered psychologist"
      description: "85: personality inventory results with applicant ID, percentiles and assessor"
      synthetic: true
    - value: "Cognitive ability test - candidate: Morgan Teston. Results will be shared with the hiring manager after the panel meets."
      description: "75: cognitive ability test naming the candidate, no scores"
      synthetic: true
    - value: "psychometric assessment"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "Our psychometric assessments measure numerical reasoning, verbal reasoning and personality so you can hire with confidence. Book a demo of the aptitude test platform."
      description: "Vendor marketing (no person) - must stay at or below 65"
    - value: "Psychometric assessment report\nCandidate name: __________\nNumerical reasoning: ____ percentile\nRecommendation: __________"
      description: "Blank report template - must stay at or below 65"
    - value: "Candidates who completed a psychometric test scored in the 70th percentile on average, the study found, according to a media release."
      description: "News / research summary - must stay at or below 65"
    - value: "Free practice aptitude test: question 1 asks how far a train travels in 3 hours at 80 km/h. Use these sample questions to prepare."
      description: "Practice test guidance - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "Vendor marketing, practice tests and research articles that quote percentiles."
    mitigation: "No populated candidate field; vendor/practice framing (book a demo, free practice, sample questions) is excluded."
  - description: "Results that identify the candidate only in free text (no field label) fall to 65."
    mitigation: "Accepted precision trade-off; extend the person-field regex with the customer candidate-ID format to recover recall."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_073_psychometric_assessment_results_primary
      matches:
        - ref: Regex_top500_073_psychometric_assessment_results_person_field
        - ref: Regex_top500_073_psychometric_assessment_results_result_detail
        - ref: Keyword_top500_073_psychometric_assessment_results_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_073_psychometric_assessment_results_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_073_psychometric_assessment_results_primary
      matches:
        - ref: Regex_top500_073_psychometric_assessment_results_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_073_psychometric_assessment_results_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_073_psychometric_assessment_results_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_073_psychometric_assessment_results_primary
      pattern: >-
        (?i)\b(?:psychometric\s+(?:assessments?|tests?|testing|reports?|results?|profiles?)|personality\s+(?:profile|assessment|questionnaire|inventory)|cognitive\s+ability\s+(?:tests?|assessments?)|aptitude\s+tests?|psychological\s+assessments?|(?:verbal|numerical|abstract|inductive|deductive)\s+reasoning\s+tests?|situational\s+judg(?:e)?ment\s+tests?|OPQ32|Hogan\s+(?:Personality\s+Inventory|Development\s+Survey))\b
    - id: Regex_top500_073_psychometric_assessment_results_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?|candidate(?:\s+(?:name|no\.?|number|ID))?|applicant(?:\s+(?:name|no\.?|number|ID))?|participant(?:\s+(?:name|ID))?|assessee)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_073_psychometric_assessment_results_result_detail
      pattern: >-
        (?i)\b(?:percentile|sten|stanine|T-score|raw\s+score|overall\s+score|(?:verbal|numerical|abstract|inductive|deductive|logical|mechanical)\s+reasoning|cognitive\s+ability|conscientiousness|agreeableness|neuroticism|emotional\s+stability|extraversion|openness|integrity|adjustment|ambition)[ \t]{0,3}[:=\-][ \t]{0,3}(?:(?:sten|stanine)[ \t]?)?\d{1,3}(?:\.\d{1,2})?(?:[ \t]?(?:%|st|nd|rd|th|/[ \t]?\d{1,3}))?|\b\d{1,3}(?:st|nd|rd|th)?[ \t]+percentile\b|\b(?:overall\s+)?(?:recommendation|suitability|outcome)[ \t]{0,3}:[ \t]{0,3}(?:not\s+)?(?:recommended|suitable|unsuitable|progress|do\s+not\s+progress)\b
  keywords:
    - id: Keyword_top500_073_psychometric_assessment_results_corroborative
      groups:
        - match_style: word
          terms:
            - percentile
            - norm group
            - assessor
            - psychologist
            - selection panel
            - shortlisting
            - feedback report
            - recruitment
            - hiring manager
            - development plan
      strength: specific
    - id: Keyword_top500_073_psychometric_assessment_results_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - practice test
            - free practice
            - how to prepare
            - sample questions
            - book a demo
            - free trial
      strength: domain
risk_description: >-
  The classifier identifies psychometric or personality assessment results about an identified candidate or employee, gated on a populated person field (75) plus populated scores, percentiles or a suitability recommendation (85). Such results can reveal cognitive and personality traits, affect selection decisions and are open to misuse or discrimination claims. Marketing, practice tests, guidance and blank templates stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the SENSITIVE Personal-Privacy DLM, SENS_Pvc, and
    Medium tier for person-specific psychometric results. The next PROTECTED level is not met because an ordinary
    employment assessment is not protected security vetting, a clinical dossier, a protected-person file, or a bulk
    high-impact repository.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium and Medium Personal-Privacy handling fit psychometric scores and interpretations that can
      materially affect one person's reputation, selection, and career prospects.
references:
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "OAIC - Australian Privacy Principles"
    url: https://www.oaic.gov.au/privacy/australian-privacy-principles
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Anti-Discrimination Act 1991 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1991-085
  - title: "Queensland Government - Recruitment and selection Directive 07/23"
    url: https://www.forgov.qld.gov.au/pay-benefits-and-policy/directives-policies-circulars-and-guidelines/recruitment-and-selection-directive-0723
