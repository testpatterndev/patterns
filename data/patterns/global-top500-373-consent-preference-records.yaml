schema: testpattern/v1
name: Consent preference records
slug: global-top500-373-consent-preference-records
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects consent and preference records: a consent record / consent register / marketing or privacy consent phrase combined with populated consent data - rows keyed by a customer identifier, labelled consent status/date/version values or labelled customer identifiers. Phrase-only mentions (privacy notices, cookie banners) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: consent (preference) record(s), consent register/log/receipt, privacy/marketing/cookie/data processing consent (records/logs/status), consent management (platform) export/extract/data, communication preferences. 65 (discovery only): primary alone. 75: primary plus one populated structure - a delimited data row keyed by a customer identifier with a numeric/date value, a labelled consent status/given/date/version/withdrawn, opt-in, marketing email/SMS/phone, lawful basis or cookie-category value, or a labelled customer/member/user/subscriber ID. 85: primary plus two distinct structures (the three above or a delimited column header pairing a customer ID column with consent, opt-in, marketing channel, lawful basis or purpose columns) plus consent-evidence terms (privacy notice version, consent withdrawn, double opt-in, proof of consent, IP address, source channel, preference centre, granular consent, data subject). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: (?i)\b(?:consent\s+(?:preference\s+)?records?|consent\s+(?:register|logs?|receipts?)|(?:privacy|marketing|cookie|data\s+processing)\s+consents?(?:\s+(?:records?|logs?|status))?|consent\s+management\s+(?:platform\s+)?(?:exports?|extracts?|data)|communication\s+preferences)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated dataset structure (a data row keyed by a customer/record identifier, a labelled value or a labelled identifier) beside the topic phrase; a column header on its own only counts toward 85, so blank extracts stay at 65. Help pages, policies, product copy and news that only name the topic stay at 65. Medium because internal analytics documentation with worked examples can still reach 75.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Spam Act 2003 (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - privacy notice version
    - consent withdrawn
    - double opt-in
    - proof of consent
    - IP address
    - source channel
    - preference centre
    - granular consent
    - data subject
  proximity: 300
test_cases:
  should_match:
    - value: "Consent preference records - CMP export\ncustomer_id,consent_purpose,marketing_email,marketing_sms,consent_version,consent_timestamp\n88104421,marketing,true,false,v3.1,2026-08-02T10:14:22Z\n88104437,analytics,false,false,v3.1,2026-08-03T19:02:11Z\nProof of consent held with IP address and source channel."
      description: CMP export - header, customer rows and proof-of-consent evidence (85)
      synthetic: true
    - value: "Privacy consent record\nCustomer ID: 88104421\nUpdated via the preference centre."
      description: Single labelled customer identifier (75)
      synthetic: true
  should_not_match:
    - value: "Policy guidance: keep consent records showing when and how each person gave marketing consent, and honour withdrawals promptly. Our privacy notice explains the purposes."
      description: Privacy guidance
      synthetic: true
    - value: "Consent register\ncustomer_id,consent_purpose,marketing_email,consent_timestamp\n"
      description: Blank register - column header only (65)
      synthetic: true
    - value: "Regulators found cookie consent banners on 40% of sites did not record valid consent, a news report said."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing consent and preferences.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of consent and preferences.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_consent_preference_records
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_373_consent_preference_records_column_header
            - Regex_global_top500_373_consent_preference_records_data_row
            - Regex_global_top500_373_consent_preference_records_labelled_value
            - Regex_global_top500_373_consent_preference_records_identifier
        - ref: Keyword_global_top500_373_consent_preference_records_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_373_consent_preference_records_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_consent_preference_records
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_373_consent_preference_records_data_row
            - Regex_global_top500_373_consent_preference_records_labelled_value
            - Regex_global_top500_373_consent_preference_records_identifier
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_373_consent_preference_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_consent_preference_records
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_consent_preference_records
      pattern: (?i)\b(?:consent\s+(?:preference\s+)?records?|consent\s+(?:register|logs?|receipts?)|(?:privacy|marketing|cookie|data\s+processing)\s+consents?(?:\s+(?:records?|logs?|status))?|consent\s+management\s+(?:platform\s+)?(?:exports?|extracts?|data)|communication\s+preferences)\b
    - id: Regex_global_top500_373_consent_preference_records_column_header
      pattern: (?i)\b(?:(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:consent(?:[ _]?(?:status|date|version|purpose|channel|timestamp|id))?|opt[ _]?in|marketing[ _]?(?:email|sms|phone)|lawful[ _]?basis|purpose|withdrawn[ _]?(?:at|date))|(?:consent(?:[ _]?(?:status|date|version|purpose|channel|timestamp|id))?|opt[ _]?in|marketing[ _]?(?:email|sms|phone)|lawful[ _]?basis|purpose|withdrawn[ _]?(?:at|date))\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash))\b
    - id: Regex_global_top500_373_consent_preference_records_data_row
      pattern: (?i)\b[A-Z]{0,5}[-_]?\d{4,12}\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,160}?(?:[,;\t]|\|[ \t]{0,2}))?\"?-?\$?\d{1,12}(?:\.\d{1,6})?%?(?![\w.])
    - id: Regex_global_top500_373_consent_preference_records_labelled_value
      pattern: (?i)\b(?:consent\s+(?:status|given|date|version|timestamp|withdrawn)|opt[\s-]?in|marketing\s+(?:email|sms|phone|post)|lawful\s+basis|analytics\s+cookies|advertising\s+cookies)[ \t]{0,3}[:#=][ \t]{0,3}(?:yes|no|true|false|granted|denied|given|withdrawn|accepted|rejected|opted[\s-]?(?:in|out)|legitimate\s+interests?|consent|v\d{1,3}(?:\.\d{1,2})?|(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}[ \t]{1,3}(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}[ \t]{1,3}\d{4}))\b
    - id: Regex_global_top500_373_consent_preference_records_identifier
      pattern: (?i)\b(?:customer\s*(?:no\.?|number|ID)|member\s*(?:no\.?|number|ID)|user\s*ID|subscriber\s*(?:no\.?|number|ID)|data\s+subject\s+ID)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Za-z-]{0,8}\d)[A-Za-z0-9][A-Za-z0-9._@-]{3,64}
  keywords:
    - id: Keyword_global_top500_373_consent_preference_records_domain_evidence
      groups:
        - match_style: word
          terms:
            - privacy notice version
            - consent withdrawn
            - double opt-in
            - proof of consent
            - IP address
            - source channel
            - preference centre
            - granular consent
            - data subject
      strength: domain
    - id: Keyword_global_top500_373_consent_preference_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - our privacy notice explains
            - cookie banners
      strength: noise
risk_description: >-
  The concept regex finds consent-preference records, privacy consent, data-processing consent, and consent-management language rather than requiring a complete person-linked ledger. A genuine preference can show whether contact or processing is allowed and could be altered or ignored to frustrate an individual's choices, but meaningful harm usually needs identity, purpose, and system access. The normal unit is one bounded preference or governance reference, while notices, policies, and templates can carry the same terminology. Risk 5 OFFICIAL is proportionate; SENSITIVE is not met without a bulk identified register, sensitive processing purpose, or evidence enabling systematic consent override. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
