schema: testpattern/v1
name: Political Opinion & Affiliation
slug: global-political-opinion
version: 1.4.1
type: regex
pattern_class: concept
engine: universal
description: >-
  Detects references to political opinions and party affiliation: party membership, voter
  registration by party, political donations and campaign contributions. GDPR Article 9 lists
  political opinions as a special category of personal data with no fixed format — it is detectable
  only by topic vocabulary. Topic-grade detector, low confidence by design.
operation: >-
  The primary regex matches political affiliation/opinion, party membership or affiliation, voted-for and registered-party statements, political donations and campaign contributions. 65 (discovery only): phrase alone - policy, guidance, news and survey-design text naming the category stays here. 75: phrase plus a populated identified-person field (name, DOB, employee/member/customer/patient/participant number or ID, data subject). 85: person field plus a populated political field (party or party code, membership number/status, donation amount, contribution date/amount, electorate, division, voting intention, branch) plus independent record evidence (donor record, constituent, CRM note, membership file, campaign database, electoral roll, doorknock, supporter score). Template framing and guidance/policy/public-aggregate framing are excluded from 75/85. Converted from keyword_list to regex so the tier logic decides matches.
pattern: (?i)\b(?:political\s+affiliations?|political\s+opinions?|party\s+membership|party\s+affiliations?|voted\s+for|registered\s+(?:Democrat|Republican|Green|Libertarian|to\s+vote\s+as)|political\s+donations?|campaign\s+contributions?|political\s+party\s+member|partisan\s+affiliations?|voter\s+registration\s+party)\b
confidence: low
confidence_justification: >-
  Low by design: the attribute has no fixed format. Enforce tiers now require the attribute to be tied to an identified person record (a populated name/DOB/ID field), and 85 also requires a populated political field plus independent record evidence, so policy text, surveys-in-design and news naming the category stay at 65 discovery.
jurisdictions:
  - global
  - eu
regulations:
  - GDPR
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - politics
    - election
    - candidate
    - ballot
    - donor
    - constituent
    - voter
    - electorate
  proximity: 300
test_cases:
  should_match:
    - value: "Campaign database - donor record\nName: Avery Teston\nMember number: 0044718\nParty code: GRN\nDonation amount: AUD 250\nContribution date: 12/07/2026\nNote: political donation receipted; add to doorknock list."
      description: Person record with populated political fields and donor-record evidence (85)
      synthetic: true
    - value: "Constituent contact\nName: Casey Rourke\nCustomer ID: C4471820\nMentioned party membership during the call."
      description: Person record naming party membership without a populated political field (75)
      synthetic: true
  should_not_match:
    - value: "The quarterly sales report shows revenue grew across all regions."
      description: Unrelated business prose, no political terms
    - value: "The committee registered the new vendor in the procurement system."
      description: Near-miss prose ("registered" but not a party), no political opinion
    - value: "The team selected the winning design after a quick internal poll."
      description: Unrelated prose, "poll" without political affiliation vocabulary
    - value: "Published election result includes aggregate party-support statistics."
      description: Public aggregate political material is not a person-linked opinion record
    - value: "Sample template: campaign donor record, amount AUD 100, contribution date 1 July."
      description: Adjacent template language is not a populated political-opinion record
    - value: "Membership file records appointment to the company board."
      description: Sibling organisational membership does not satisfy the political primary
    - value: "Policy guidance: this procedure explains how political opinion and party membership details are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Membership application\nName: ____________________\nMember number: ____________________\nParty: ____________________\nBranch: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: the report on campaign contributions found that political donations from individuals rose sharply ahead of the state election."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: >-
      Phrases like "voted for" or "registered" appear in non-political contexts (board elections,
      award votes, vendor registration), producing matches with no political-opinion content.
    mitigation: >-
      Require corroborative keywords (election, candidate, donor, constituent, ballot) within the
      proximity window; treat isolated "voted for"/"registered" hits as low confidence.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: broad
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_political_opinion_topic
      matches:
        - ref: Regex_global_political_opinion_person_fields
        - ref: Regex_global_political_opinion_political_fields
        - ref: Evidence_political_record_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_political_opinion_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_political_opinion_topic
      matches:
        - ref: Regex_global_political_opinion_person_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_political_opinion_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_political_opinion_topic
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_political_opinion_topic
      pattern: (?i)\b(?:political\s+affiliations?|political\s+opinions?|party\s+membership|party\s+affiliations?|voted\s+for|registered\s+(?:Democrat|Republican|Green|Libertarian|to\s+vote\s+as)|political\s+donations?|campaign\s+contributions?|political\s+party\s+member|partisan\s+affiliations?|voter\s+registration\s+party)\b
    - id: Regex_global_political_opinion_person_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|employee(?:\s+name)?|(?:employee|staff|member|customer|client|patient|participant|respondent|person|applicant|voter|record)\s*(?:no\.?|number|ID)|staff\s+member|member(?:\s+name)?|patient(?:\s+name)?|client(?:\s+name)?|customer(?:\s+name)?|applicant(?:\s+name)?|data\s+subject|resident(?:\s+name)?)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_political_opinion_political_fields
      pattern: (?i)\b(?:party(?:\s+(?:code|name))?|membership\s+(?:no\.?|number|status|type)|donation(?:\s+amount)?|contribution(?:\s+(?:amount|date))?|electorate|division|voting\s+intention|branch)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Evidence_political_record_evidence
      groups:
        - match_style: word
          terms:
            - donor record
            - constituent
            - CRM note
            - membership file
            - campaign database
            - electoral roll
            - doorknock
            - supporter score
      strength: specific
    - id: Keyword_global_political_opinion_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
            - public policy document
            - public policy guidance
            - public dataset
            - aggregate statistics
            - aggregate report
            - academic paper
            - blank questionnaire
            - awareness campaign
            - published election result
            - public campaign website
            - aggregate polling
            - news article
            - academic analysis
            - blank form
      strength: exclusion
risk_rating: 7
risk_description: >-
  The Political Opinion and Affiliation detector recognises party membership, registered-party, political donation and campaign contribution statements and enforces only when they sit with a populated person identifier; policy and news text stays at 65 discovery. Its normal positive cases can contain a person-linked CRM or donor fact rather than only a blank category label, so disclosure may expose an individual's beliefs and enable discrimination, pressure, profiling, or targeted campaigning. Low confidence leaves room for political commentary that is not attributable to a person, but the corroborated true positive concerns one person's sensitive viewpoint or association. Risk 7 and SENSITIVE Personal-Privacy reflect credible direct personal harm, while PROTECTED would require a high-consequence bulk register, coercive targeting context, or severe safety impact.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Basic
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy DLM, and Medium generic tiers
    because a true positive can attribute political belief or activity to a person. PROTECTED is not met for the normal
    single profile fact without bulk exposure, persecution risk, protected operations, or significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Person-linked political affiliation is generically Medium with Medium Personal-Privacy DLM because disclosure can
      directly enable profiling or discriminatory treatment.
created: '2026-06-13'
