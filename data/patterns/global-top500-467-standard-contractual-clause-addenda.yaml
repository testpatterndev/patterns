schema: testpattern/v1
name: Standard contractual clause addenda
slug: global-top500-467-standard-contractual-clause-addenda
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to standard contractual clause addenda in Australian contexts. This information type is classified as personally identifiable information under applicable
  data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters.'
pattern: (?is)\b(?:standard\s+contractual\s+clause\s+addenda|contractual\s+clause|data\s+processing\s+agreement|data\s+exporter|data\s+importer)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - standard contractual clause addenda
    - standard
    - contractual
    - clause
    - addenda
    - privacy
    - compliance
    - risk
  proximity: 300
test_cases:
  should_match:
    - value: standard contractual clause addenda
      description: Primary topic phrase match
    - value: contractual clause
      description: Case-insensitive topic phrase match
    - value: data processing agreement
      description: Alternative topic phrase match
    - value: data exporter
      description: Additional topic phrase match
    - value: |-
        Standard contractual clause addenda
        To: Executive Committee
        From: Chief Financial Officer
        Date: 14 August 2026
        Subject: Standard contractual clause addenda - FY27 review
      description: Populated document header reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: data inventory compliance
      description: Generic word pair from old broad template should not match
    - value: |-
        Standard contractual clause addenda:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about standard contractual clause addenda are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to standard contractual clause addenda appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_scc_addenda
      matches:
        - ref: Regex_global_top500_467_standard_contractual_clause_addenda_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_scc_addenda
      matches:
        - ref: Regex_global_top500_467_standard_contractual_clause_addenda_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_scc_addenda
      matches:
        - ref: Evidence_scc_addenda
        - ref: Regex_global_top500_467_standard_contractual_clause_addenda_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_scc_addenda
  regexes:
    - id: Pattern_scc_addenda
      pattern: (?is)\b(?:standard\s+contractual\s+clause\s+addenda|contractual\s+clause|data\s+processing\s+agreement|data\s+exporter|data\s+importer)\b
    - id: Regex_global_top500_467_standard_contractual_clause_addenda_record_structure
      pattern: (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$]
  keywords:
    - id: Evidence_scc_addenda
      groups:
        - match_style: word
          terms:
            - text: SCC
              case_sensitive: true
            - text: DPA
              case_sensitive: true
            - sub-processor
      strength: domain
risk_description: >-
  The pattern matches standard contractual clause addenda, data-processing agreements, contractual clauses, and data-exporter language used to govern international transfers. A completed addendum may expose counterparties, processing roles, transfer mechanisms, and negotiated deviations, but standard clauses are published and many executions contain routine legal terms rather than strategic negotiation. The normal impact is bounded contractual and governance exposure requiring deal-specific context before material misuse. Risk 5 OFFICIAL is proportionate; SENSITIVE is not met without non-standard concessions, contentious legal advice, high-value negotiation strategy, or detailed sensitive-data flows.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because standard transfer clauses are
    publicly available and an ordinary addendum has limited value without transaction and data-flow context. SENSITIVE
    is not met unless bespoke terms, named sensitive transfers, material control gaps, or dispute strategy create
    moderate direct harm.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low and Low DLM are appropriate for a standard-clause addendum whose confidential value is bounded to specific
      counterparties and negotiated variations. Detailed nonstandard transfer risk requires stronger controls.
