schema: testpattern/v1
name: NDIS Reportable Incident Record
slug: au-ndis-reportable-incident
version: 1.1.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Reportable incident notifications and investigation records for a named NDIS participant: death, serious injury, abuse or neglect, unlawful sexual or physical contact, sexual misconduct and unauthorised use of a restrictive practice (24-hour immediate notification and 5-business-day report).
operation: >-
  Primary: NDIS Reportable Incident Record anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:reportable\s+incident|immediate\s+notification|5[\s-]+business[\s-]+day\s+(?:notification|report)|unauthorised\s+(?:use\s+of\s+(?:a\s+)?)?restrictive\s+practices?|unlawful\s+(?:sexual|physical)\s+contact)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - National Disability Insurance Scheme Act 2013 (Cth)
  - NDIS (Incident Management and Reportable Incidents) Rules 2018 (Cth)
frameworks:
  - QGISCF
data_categories:
  - health
  - pii
  - law-enforcement
corroborative_evidence:
  keywords:
    - NDIS Commission
    - NDIS Quality and Safeguards Commission
    - participant
    - worker
    - provider
    - abuse
    - neglect
    - serious injury
  proximity: 300
customisation:
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_au_ndis_reportable_incident_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Agency case / file / matter number format (see docs/identifiers.md#case-reference-number). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Reportable incident — immediate notification\nParticipant: Avery Teston\nNDIS number: 431982045\nDate of incident: 02/09/2026\nWorker: Jordan Staffson\nAllegation: unlawful physical contact (worker pushed participant). Police notified; worker stood down."
      description: Populated record 1
      synthetic: true
    - value: "5 business day report\nParticipant: Morgan Teston\nIncident: serious injury — fractured wrist after an unsupervised fall; investigation found staffing below the approved 2:1 ratio."
      description: Populated record 2
      synthetic: true
    - value: "Unauthorised use of a restrictive practice\nParticipant: Jamie Teston\nProvider: Harbour Support Services\nSeclusion used for 25 minutes on 11/09/2026 without authorisation; reported to the NDIS Commission within 5 business days."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Registered NDIS providers must notify the NDIS Commission of reportable incidents, including unauthorised use of a restrictive practice, within 24 hours or 5 business days.
      description: Guidance or explainer text
    - value: "Reportable incident notification\nParticipant: __________\nDate of incident: __________\nIncident type: __________"
      description: Blank form
    - value: The NDIS Commission received 16,800 reportable incident notifications in 2024-25, most concerning unauthorised restrictive practices.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_ndis_reportable_incident_primary
      matches:
        - ref: Regex_au_ndis_reportable_incident_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_ndis_reportable_incident_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_ndis_reportable_incident_primary
      matches:
        - ref: Regex_au_ndis_reportable_incident_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_ndis_reportable_incident_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_ndis_reportable_incident_primary
      pattern: >-
        (?i)\b(?:reportable\s+incident|immediate\s+notification|5[\s-]+business[\s-]+day\s+(?:notification|report)|unauthorised\s+(?:use\s+of\s+(?:a\s+)?)?restrictive\s+practices?|unlawful\s+(?:sexual|physical)\s+contact)\b
    - id: Regex_au_ndis_reportable_incident_record_structure
      pattern: >-
        (?i)\b(?:participant|NDIS\s+(?:no\.?|number)|plan\s+(?:start|end|review)\s+date|plan\s+manager|support\s+coordinator|provider|registration\s+(?:no\.?|number)|worker|person\s+with\s+disability|adult|nominee|incident\s+date|date\s+of\s+incident|guardian|name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}|\bNDIS\s+(?:no\.?|number)\s*[:#]?\s*43\d{7}\b
  keywords:
    - id: Keyword_au_ndis_reportable_incident_corroborative
      groups:
        - match_style: word
          terms:
            - NDIS Commission
            - NDIS Quality and Safeguards Commission
            - participant
            - worker
            - provider
            - abuse
            - neglect
            - serious injury
            - police
            - investigation
            - stood down
            - within 24 hours
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a ndis reportable incident record about an identified person, gated on populated record fields. Reportable incident notifications and investigation records for a named NDIS participant: death, serious injury, abuse or neglect, unlawful sexual or physical contact, sexual misconduct and unauthorised use of a restrictive practice (24-hour immediate notification and 5-business-day report). Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 9 and the Medium tier fit a record of death, serious injury, abuse, sexual misconduct or unauthorised
    restrictive practice involving a named NDIS participant. Labels stay PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and
    SENSITIVE Personal-Privacy, not PROTECTED, because each record concerns one participant's incident rather than
    aggregated incident data.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling with restricted access applies to one participant's incident and its
      investigation. High handling would suit bulk incident extracts.
references:
  - title: NDIS Commission — Reportable incidents
    url: https://www.ndiscommission.gov.au/providers/incident-management-and-reportable-incidents
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.1.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.1.0
    date: '2026-09-24'
    description: Declare identifier-format customisation slots (case-reference-number) replacing the interim identifier_dependencies metadata; definitions and replacement steps live in data/identifiers/ and docs/identifiers.md.
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
