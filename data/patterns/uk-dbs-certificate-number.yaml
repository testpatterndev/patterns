schema: testpattern/v1
name: "UK Disclosure and Barring Service (DBS) Certificate Number"
slug: uk-dbs-certificate-number
version: 1.0.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects 12-digit UK Disclosure and Barring Service (DBS) Basic, Standard, and Enhanced criminal-record check certificate numbers, which begin with 00 followed by 10 digits (e.g. 001482937162), used in pre-employment safeguarding and DBS Update Service checks.
operation: >-
  Matches 12-digit numbers starting with 00 on word boundaries. Enforcing tiers require DBS, Disclosure and Barring Service, Enhanced Disclosure, Update Service, or barred-list safeguarding vocabulary within 300 characters.
pattern: '\b(00\d{10})\b'
confidence: medium
confidence_justification: >-
  Medium-high confidence: the mandatory 00 prefix on a 12-digit number eliminates standard timestamps and phone numbers, and DBS safeguarding keywords confirm criminal-record check context.
jurisdictions:
  - uk
regulations:
  - "UK GDPR"
  - "Data Protection Act 2018 (UK)"
  - "Safeguarding Vulnerable Groups Act 2006 (UK)"
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - government-id
corroborative_evidence:
  keywords:
    - "DBS certificate"
    - "Disclosure and Barring Service"
    - "Enhanced DBS"
    - "DBS Update Service"
    - "certificate number"
    - "barred list"
  proximity: 300
test_cases:
  should_match:
    - value: "DBS Certificate Number: 001482937162"
      description: "Labelled 12-digit UK DBS certificate number"
    - value: "001839204715 — Enhanced DBS with Children's Barred List check"
      description: "Enhanced DBS certificate number in safeguarding register"
    - value: "001928374650"
      description: "Bare 00-prefixed 12-digit DBS certificate number (65 discovery)"
  should_not_match:
    - value: "011482937162"
      description: "Starts with 01 rather than DBS 00 prefix"
    - value: "00148293716"
      description: "Eleven digits (one short of 12-digit DBS certificate number)"
    - value: "Check the applicant status on the online DBS Update Service"
      description: "Prose instruction without a certificate number"
    - value: "Sample template: placeholder example record for training only"
      description: "Template/sample fixture suppressed by shared exclusion dictionary"
false_positives:
  - description: "International dialling strings written with 00 + 10-digit subscriber number without spaces."
    mitigation: "Enforcing tiers require explicit DBS, Disclosure and Barring Service, or safeguarding check keywords within 300 characters."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 7
risk_description: >-
  The detector matches a 12-digit UK Disclosure and Barring Service certificate number in safeguarding or recruitment context. Together with the applicant's surname and date of birth, a DBS certificate number is the direct lookup key for the online DBS Update Service, exposing criminal-offence and barred-list status regulated under Article 10 UK GDPR and Schedule 1 Data Protection Act 2018. Risk 7 and SENSITIVE Personal-Privacy reflect criminal-vetting identifier sensitivity.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy, and Medium because a DBS certificate number is the online Update Service lookup key for UK GDPR Article 10 criminal-record vetting status.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling reflects UK GDPR Article 10 criminal-record check sensitivity.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_uk_dbs_cert
      matches:
        - ref: Keyword_uk_dbs_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_uk_dbs_cert
      matches:
        - ref: Keyword_uk_dbs_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_uk_dbs_cert
      matches:
        - ref: Keyword_uk_dbs_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_uk_dbs_cert
      pattern: '\b(00\d{10})\b'
  keywords:
    - id: Keyword_uk_dbs_specific
      groups:
        - match_style: word
          terms:
            - "Disclosure and Barring Service"
            - "DBS certificate"
            - "DBS check"
            - "DBS Update Service"
            - "Enhanced DBS"
            - "Standard DBS"
            - "Basic DBS"
            - "barred list"
      strength: specific
    - id: Keyword_uk_dbs_broad
      groups:
        - match_style: word
          terms:
            - text: "DBS"
              case_sensitive: true
            - "criminal record check"
            - "safeguarding"
            - "single central record"
            - "disclosure certificate"
      strength: domain
references:
  - url: https://www.gov.uk/government/organisations/disclosure-and-barring-service
    title: "GOV.UK - Disclosure and Barring Service (DBS) Certificates and Update Service"
  - url: https://www.legislation.gov.uk/ukpga/2018/12/contents
    title: "Data Protection Act 2018 (UK)"
created: '2026-11-25'
updated: '2026-11-25'
changelog:
  - version: 1.0.0
    date: '2026-11-25'
    description: Initial release.
author: testpattern-community
