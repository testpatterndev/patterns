schema: testpattern/v1
name: Volatile memory captures
slug: global-top500-298-volatile-memory-captures
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects volatile memory capture records and analysis output: memory-capture wording with capture metadata, memory image file names, Volatility plugin output and addresses. Topic wording alone is discovery-only.
operation: >-
  Regex_memory_capture_primary (memory dump/capture, volatile memory, RAM capture, hiberfil or crash-dump wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated capture field (host, image file/path, profile, acquisition tool/time, OS build, KDBG/DTB, PID) or a memory artefact (.raw/.mem/.vmem/.dmp/.lime file, Volatility plugin output name, hex address). 85 requires a populated capture field (host, image file/path, profile, acquisition tool/time, OS build, KDBG/DTB, PID) (two distinct hits), a memory artefact (.raw/.mem/.vmem/.dmp/.lime file, Volatility plugin output name, hex address), and independent memory-forensics (Volatility/WinPmem/DumpIt/LiME, credential extraction) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_memory_capture_guidance_exclusion).
pattern: >-
  (?i)\b(?:memory\s+(?:dump|capture|image|acquisition)s?|volatile\s+memory|RAM\s+(?:capture|dump|image)|hiberfil\.sys|crash\s+dump|lsass\s+dump)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated capture field (host, image file/path, profile, acquisition tool/time, OS build, KDBG/DTB, PID) or a memory artefact (.raw/.mem/.vmem/.dmp/.lime file, Volatility plugin output name, hex address)), and 85 needs two distinct structures plus independent memory-forensics (Volatility/WinPmem/DumpIt/LiME, credential extraction) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Privacy Act 1988 (Cth)
- GDPR
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - Volatility
  - WinPmem
  - DumpIt
  - LiME
  - Magnet RAM Capture
  - NTLM hash
  - Mimikatz
  - process list
  - injected code
  - encryption keys
  proximity: 300
test_cases:
  should_match:
  - value: Incident responders took a memory capture before powering off the server.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Memory capture record
      Hostname: ws-fin-114
      Image file: ws-fin-114_20260912.raw
    description: Medium-tier probe (75) - capture fields and image file
    synthetic: true
  - value: |-
      Memory capture record - IR-2026-114
      Hostname: ws-fin-114
      Acquisition tool: WinPmem 4.0
      Acquisition time: 2026-09-12 04:02
      Image file: ws-fin-114_20260912.raw
      Volatility windows.malfind flagged injected code in PID 4312 at 0x7ff6a2c10000; Mimikatz strings present.
    description: High-tier probe (85) - several capture fields, image file, plugin output, tooling context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: responders should capture volatile memory before shutting down a compromised host.'
    description: Policy text
    synthetic: true
  - value: |-
      Memory capture record template
      Hostname: ________
      Image file: [insert]
    description: Blank template
    synthetic: true
  - value: 'Webinar notes: using Volatility on a memory dump - run windows.pslist against memory.raw.'
    description: Webinar/training framing
    synthetic: true
false_positives:
- description: Application crash-dump settings and developer debugging guides.
  mitigation: Enforcement needs capture metadata or memory artefacts; 85 also needs memory-forensics tooling context; guidance framing is excluded.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_memory_capture_primary
    matches:
    - ref: Regex_memory_capture_capture_field
      min_count: 2
      unique_results: true
    - ref: Regex_memory_capture_memory_artefact
    - ref: Keyword_memory_capture_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_memory_capture_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_memory_capture_primary
    matches:
    - type: any
      refs:
      - Regex_memory_capture_capture_field
      - Regex_memory_capture_memory_artefact
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_memory_capture_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_memory_capture_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_memory_capture_primary
    pattern: >-
      (?i)\b(?:memory\s+(?:dump|capture|image|acquisition)s?|volatile\s+memory|RAM\s+(?:capture|dump|image)|hiberfil\.sys|crash\s+dump|lsass\s+dump)\b
  - id: Regex_memory_capture_capture_field
    pattern: >-
      (?i)\b(?:host(?:name)?|image\s+(?:file|path)|profile|acquisition\s+tool|acquired\s+by|acquisition\s+time|capture\s+(?:time|date)|OS\s+build|KDBG|DTB|PID|evidence\s+(?:no\.?|number|ID))\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  - id: Regex_memory_capture_memory_artefact
    pattern: >-
      (?i)\b[A-Za-z0-9_-]{1,60}\.(?:raw|mem|vmem|dmp|lime|aff4)\b|\bwindows\.(?:pslist|pstree|netscan|malfind|cmdline|hashdump|lsadump)\b|\b0x[0-9a-f]{8,16}\b
  keywords:
  - id: Keyword_memory_capture_context
    groups:
    - match_style: word
      terms:
      - Volatility
      - WinPmem
      - DumpIt
      - LiME
      - Magnet RAM Capture
      - NTLM hash
      - Mimikatz
      - process list
      - injected code
      - encryption keys
    strength: specific
  - id: Keyword_memory_capture_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires memory-capture wording plus populated capture metadata or memory artefacts before enforcing. A real capture may contain running process data, session tokens, encryption keys, credentials, messages, and evidence of malicious activity that can be replayed or exposed. The ordinary scope is one host and its active users and services, with documentation and diagnostic guidance creating benign matches. Risk 8 SENSITIVE reflects serious contained credential, personal, and forensic harm; PROTECTED would require a critical host or confirmed protected material with significant impact.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because a volatile-memory
    image can aggregate directly usable secrets and investigative evidence from one system. PROTECTED is not met by the
    topic signal because an actual capture, host criticality, protected contents, and significant scale are unverified.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic treatment is Medium with Medium InfoTech controls for memory captures, including encrypted storage, short
      retention, and restricted forensic access. High applies where a confirmed capture comes from a protected or
      critical system and contains significant secret material.
