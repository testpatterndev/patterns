schema: testpattern/v1
name: Witness Protection Program Record
slug: witness-protection-program-record
version: 1.6.2
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects documents containing witness protection program records including new identities, relocation details, and safe house locations for protected witnesses. Disclosure directly endangers the lives of witnesses and their families who have testified against violent criminals.
operation: >-
  Primary: witness protection phrases (witness protection, protected witness, relocation plan, safe house location, new identity documents, Witness Protection Act). 65 = phrase only (discovery). 75 = phrase plus a populated protected-person field (protected person, former/assumed name, new identity, relocation, case officer, name, date of birth, file number) or a labelled file reference. 85 = phrase plus two distinct populated fields plus independent evidence (assumed name, identity documents, drivers licence, Medicare card, threat assessment, interstate transfer ...). Media, fiction, policy and research framing excluded.
pattern: (?i)\b(witness\s+protection|protected\s+witness|relocation\s+plan|safe\s+house\s+location|new\s+identity\s+(?:document|program|package)|Witness\s+Protection\s+Act)\b
confidence: medium
confidence_justification: >-
  Medium confidence: enforcement requires populated protected-person fields; program file numbers are unpublished, so the reference is a documented label-anchored fallback.
jurisdictions:
  - au
regulations:
  - Crime and Corruption Act 2001 (Qld)
  - Police Powers and Responsibilities Act 2000 (Qld)
  - Witness Protection Act 2000 (Qld)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - PROTECTED
    - Law-Enforcement
    - WITNESS PROTECTION
    - Witness Protection Act 2000
    - relocation
    - new identity
    - safe house
    - assumed name
    - protected person
    - protection order
    - threat assessment
    - QPS
    - Queensland Police
    - identity documents
    - drivers licence
    - Medicare card
    - birth certificate
  proximity: 300
  keyword_lists:

    - law-enforcement

    - government-services
    - en-government-classification
customisation:
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_witness_protection_program_record_case_reference
    mode: replace
    affects_tiers: [75]
    required_for_enforcement: false
    note: Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#case-reference-number). Earlier versions used the WP-YYYY-NNNN format, which does not appear in any published source.
test_cases:
  should_match:
    - value: 'PROTECTED — WITNESS PROTECTION. Record of protected witness relocation. Protected person: formerly known as Sandra Marie BLAKE. New identity documents issued under Witness Protection Act 2000 (Qld) s.10. Relocation plan: interstate transfer to safe house location on file number 2024/0087.'
      description: Witness protection relocation record with new identity details and legislative references (reaches 75)
    - value: Witness Protection Program — Threat Assessment Update. Subject remains at HIGH risk from associates of convicted drug trafficker Raymond COSTELLO. Safe house location reviewed and deemed secure. New identity integration progressing; protected witness has commenced employment under assumed name.
      description: Threat assessment update for an active witness protection case (65 discovery only - prose without populated record fields)
    - value: 'Memorandum to QPS Witness Protection Unit. Re: Application for inclusion in witness protection program. The witness provided evidence in Operation MERCURY resulting in the conviction of three members of the organised crime syndicate. Relocation plan prepared. New identity package includes Queensland drivers licence, Medicare card, and bank accounts.'
      description: Application memorandum for witness protection program inclusion (65 discovery only - prose without populated record fields)
    - value: "PROTECTED — Witness Protection Unit\nProtected person: Avery Teston\nFormer name: Avery Marsh\nFile number: 2026/0417\nAssumed name documents issued (drivers licence, Medicare card); threat assessment reviewed before interstate transfer."
      description: 'Populated protection record: protected person, former name and file number plus identity-document evidence (reaches 85)'
      synthetic: true
  should_not_match:
    - value: The Queensland Government administers the Witness Protection Act 2000 which provides a framework for protecting witnesses who assist law enforcement. The Act is publicly available on the Queensland legislation website.
      description: General public description of the Witness Protection Act
    - value: In the film 'Witness Protection' (2023), the protagonist enters a federal witness protection program after testifying against a crime boss. The movie explores themes of identity and isolation.
      description: Movie description involving witness protection as a plot device
    - value: The Australian Institute of Criminology published a research paper examining the effectiveness of witness protection programs across Australian jurisdictions. The study used anonymised aggregate data.
      description: Academic research paper about witness protection using anonymised data
    - value: "Policy guidance: this procedure explains how records about WITNESS PROTECTION are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: "Witness protection — application for inclusion\nProtected person: __________\nFormer name: __________\nFile number: __________"
      description: Blank form / template with unfilled fields (must stay below 75)
    - value: "News: a film about witness protection follows a protected witness who is given a new identity after testifying."
      description: News or training text naming the topic (must stay below 75)
false_positives:
  - description: News reporting about witness protection programs in general terms
    mitigation: 'Negative keyword exclusion: ''media release'', ''news article'', ''reported'', ''published''. Require proximity to actual personal identifiers or case numbers.'
  - description: Legislative and policy documents discussing the Witness Protection Act framework
    mitigation: 'Negative keyword exclusion: ''policy'', ''framework'', ''legislation'', ''parliamentary''. Require co-occurrence with operational terms like ''relocation plan'' or ''safe house''.'
  - description: Crime fiction and films featuring witness protection storylines
    mitigation: 'Negative keyword exclusion: ''novel'', ''fiction'', ''film'', ''movie'', ''television'', ''character'', ''actor'''
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_witness_protection_program_record_witness_protection_terms
      matches:
        - ref: Regex_witness_protection_program_record_record_structure
          min_count: 2
          unique_results: true
        - ref: Evidence_witness_protection_program_record_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_witness_protection_program_record_exclusion
    - confidence_level: 75
      id_match: Pattern_witness_protection_program_record_witness_protection_terms
      matches:
        - type: any
          refs:
            - Regex_witness_protection_program_record_record_structure
            - Regex_witness_protection_program_record_case_reference
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_witness_protection_program_record_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_witness_protection_program_record_witness_protection_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_witness_protection_program_record_exclusion
  regexes:
    - id: Pattern_witness_protection_program_record_witness_protection_terms
      pattern: (?i)\b(witness\s+protection|protected\s+witness|relocation\s+plan|safe\s+house|new\s+identity|Witness\s+Protection\s+Act)\b
    - id: Regex_witness_protection_program_record_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|protected\s+(?:person|witness)|former\s+name|assumed\s+name|new\s+identity|relocation\s+(?:date|area|address)|case\s+officer|witness|informant|(?:file|case|reference|ref)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_witness_protection_program_record_case_reference
      pattern: >-
        (?i)\b(?:case|file|matter|reference)\s+(?:no\.?|number|ID|#)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{3,20}\b
  keywords:
    - id: Evidence_witness_protection_program_record_corroborative_terms
      groups:
        - match_style: word
          terms:
            - text: QPS
              case_sensitive: true
            - Queensland Police
            - assumed name
            - identity documents
            - drivers licence
            - Medicare card
            - birth certificate
            - threat assessment
            - interstate transfer
      strength: specific
    - id: Filter_witness_protection_program_record_exclusion
      groups:
        - match_style: word
          terms:
            - media release
            - published
            - annual report
            - template
            - training exercise
            - fictional
            - movie
            - television
            - news article
            - novel
            - film
            - policy framework
            - parliamentary
            - academic
            - published finding
            - research paper
            - publicly available

      strength: noise
risk_rating: 10
risk_description: >-
  This detector finds witness-protection records containing a protected person's former and new identities, relocation plan, safe-house location, threat assessment, or family arrangements. An unauthorised recipient could locate the witness, expose relatives, assist violent offenders, and invalidate the protective identity and relocation measures. Media, legislation, policy, and fictional discussion are excluded, so the normal true positive is an active protection record with direct safety implications. Risk 10 supports PROTECTED Law-Enforcement because disclosure can cause lethal harm; no higher classification exists within the accepted QGISCF scale.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Law-Enforcement
classification:
  tier: High
  rationale: >-
    Risk 10 aligns with PSPF PROTECTED, QGISCF PROTECTED, PROTECTED Law-Enforcement, and High because new identity,
    relocation, and safe-location data can directly expose protected witnesses and families. The classification is
    already maximal, with no higher QGISCF tier available.
  generic:
    classification: High
    dlm: High Law-Enforcement
    rationale: >-
      High and High Law-Enforcement DLM reflect immediate witness and family safety risk plus irreversible compromise of
      identity and relocation protections.
references:
  - title: Witness Protection Act 2000 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2000-056
  - title: Crime and Corruption Act 2001 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2001-069
created: '2026-02-20'
updated: '2026-09-25'
changelog:
  - version: 1.6.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.6.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): rebuilt tiers - 75 needs a populated protected-person record field or a labelled file reference, 85 needs two distinct record fields plus independent identity/relocation evidence; removed the invented WP-YYYY-NNNN regex in favour of the case-reference-number labelled fallback (identifier-format slot); removed the WITNESS PROTECTION marker group, which repeated the primary phrase (same-span self-corroboration); tests converted with an 85 positive and blank-form/news decoys; added the Crime and Corruption Act 2001 (Qld) (the CCC runs the program) and references.'
  - version: 1.5.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires either independent justice record structure (Regex ..._record_structure) or one of the hand-authored corroborative terms (none of which the primary matches); 85 requires 2 distinct structure hits plus the existing hand-authored evidence. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1474 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-12'
    description: 'Baseline burn-down B: should_not_match negative "The Queensland Government administers the Witness Protection Act 2000 which provides a framework..." tripped tier@75 — its primary-keyword evidence hit on the literal term ''Witness Protection Act'' and no existing Filter_..._exclusion or template-exclusion term matched this general legislative-description prose (it references no operational identifier, case reference, or relocation detail, and uses ''framework'' rather than the pattern''s pre-existing ''policy framework'' exclusion phrase). Added ''publicly available'' to Filter_witness_protection_program_record_exclusion — the value''s closing sentence reads "The Act is publicly available on the Queensland legislation website" (follows the legal-75-tier wave convention in native-title-negotiation-strategy.yaml, which uses the same phrase). Verified collision-free against all 3 should_match values (word-boundary, case-insensitive) via a one-off node check. Verified: 0 FAILs; all 3 should_match positives still pass.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
