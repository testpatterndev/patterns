schema: testpattern/v1
name: Safety Instrumented System Cause and Effect Matrix / HAZOP Worksheet
slug: global-sis-cause-effect-hazop
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Plant-specific process safety engineering records: HAZOP (hazard and operability) study worksheets with node / guide word / deviation / causes / consequences / safeguards / recommendations columns, and safety instrumented system (SIS) cause and effect matrices and safety requirements with trip tags, voting (1oo2, 2oo3) and SIL ratings. Populated worksheets and matrices tie instrument tags and trip logic to a real facility, which is why enforcement needs populated tags and structure, not the methodology vocabulary that appears in standards, training and textbooks.
operation: >-
  65 (discovery-only): a HAZOP / hazard and operability / cause and effect matrix / safety instrumented function or system / safety requirements specification phrase. 75: the phrase plus independent populated structure - a HAZOP worksheet header row (at least deviation, causes, consequences and safeguards headings in order within a bounded span), or at least 5 distinct ISA-5.1 style instrument tags from a whitelist of common tag prefixes (FIC-101, PSV-2003, LSHH-310), or a voting / SIL / SIF value. 85: the phrase plus at least 5 distinct instrument tags plus a second distinct structure (worksheet header row or voting / SIL / SIF value) plus independent evidence (a P&ID reference, action owner, node description or trip setpoint). All enforce tiers exclude template / noise text and training, course, textbook and example framing.
pattern: >-
  (?i)\b(?:HAZOP|hazard\s+and\s+operability\s+(?:study|review|worksheet)|cause\s*(?:&|and)\s*effects?\s+(?:matrix|chart|diagram)|C&E\s+matrix|safety\s+instrumented\s+(?:functions?|systems?)|safety\s+requirements?\s+specification)\b
confidence: medium
confidence_justification: >-
  Medium: the methodology vocabulary (guide words, deviations, SIL, voting) is common to standards, courses and textbooks, so enforce tiers require populated instrument tags and worksheet structure. ISA-5.1 tag shapes are a convention (the standard is paywalled and its full letter table was not verified), so only a whitelist of common tag prefixes is used and at least 5 distinct tags are required. IEC 61882 worksheet columns were verified only from secondary sources. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - global
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
  - WHS Regulation 2011 (Qld) Chapter 9
frameworks:
  - IEC 61511
  - IEC 61882
  - ISA-5.1
data_categories:
  - infrastructure
  - technology
corroborative_evidence:
  keywords:
    - P&ID
    - action owner
    - node
    - trip setpoint
    - safeguards
    - SIL
    - voting
    - interlock
  proximity: 1000
test_cases:
  should_match:
    - value: |-
        HAZOP worksheet - Boiler 2 feedwater system - P&ID DWG-BLR2-PID-004 Rev C
        Node 4: Deaerator to boiler feed pumps
        Guide word | Deviation | Causes | Consequences | Safeguards | Recommendations | Action owner
        No | No flow | FV-2104 fails closed | Boiler low level | LSLL-2110 trips burner (2oo3), LT-2108 alarm | Review FV-2104 fail position | J. Teston
        More | High level | LIC-2108 fault | Carry-over to turbine | LSHH-2112 trip, PIC-2120 control | Confirm SIL 2 for LSHH-2112 | R. Staffson
      description: 85 - populated HAZOP worksheet with header row, 5+ distinct tags, voting/SIL and P&ID reference
      synthetic: true
    - value: |-
        Cause and effect matrix - Gas turbine fuel skid, SIF-017 (SIL 2)
        Causes: PSHH-3301 fuel gas pressure high high (2oo3); TSHH-3310 exhaust temperature high high; LSLL-3320 knock-out drum level low low; FIC-3302 flow deviation; PT-3304 transmitter fault
        Effects: close ESDV-3300, close XV-3305, trip unit - trip setpoint 45 barg
      description: 85 - cause and effect matrix with 5+ distinct tags, voting/SIL and trip setpoint
      synthetic: true
    - value: |-
        Hazard and operability study - chlorine dosing room
        Node | Guide word | Deviation | Causes | Consequences | Safeguards | Recommendations
        1 | Less | Less dosing | Dosing pump failure | Low residual in reservoir | Residual analyser alarm | Add standby pump
      description: 75 - HAZOP worksheet header row with one populated row, no tag set
      synthetic: true
    - value: |-
        Safety requirements specification - pump station wet well: safety instrumented function SIF-004 requires 1oo2 voting on the high high level switches.
      description: 75 - safety instrumented function with a voting value, no worksheet or tag set
      synthetic: true
  should_not_match:
    - value: >-
        IEC 61882 describes the HAZOP method: the team applies guide words such as No, More, Less, As well as, Part of, Reverse and Other than to each node to identify deviations, their causes and consequences, and the safeguards in place.
      description: Standard / methodology description (no populated worksheet)
    - value: |-
        HAZOP worksheet blank template
        Node | Guide word | Deviation | Causes | Consequences | Safeguards | Recommendations
        ______ | ______ | ______ | ______ | ______ | ______ | ______
      description: Blank HAZOP worksheet blank template
    - value: |-
        HAZOP training exercise: for the example reactor in this course, the deviation "more temperature" could be caused by TIC-101 failing; safeguards include TSH-102 and PSV-103. Quiz: which guide word applies?
      description: Training course example with a few textbook tags
    - value: >-
        The operator engaged consultants to run a HAZOP and review its safety instrumented systems before the new unit is commissioned next year, the company said.
      description: News text naming the activities
false_positives:
  - description: Standards, textbooks, courses and consultant marketing use the HAZOP and SIS vocabulary.
    mitigation: Enforce tiers need populated worksheet structure, a set of distinct instrument tags or voting / SIL values; training, course, textbook and example framing is excluded.
  - description: Instrument-tag shapes resemble part numbers and document codes.
    mitigation: Only a whitelist of common ISA-style tag prefixes is used, and at least 5 distinct tags are required.
  - description: Worksheets laid out as images or in columns far apart after text extraction.
    mitigation: Proximity is 1000 characters; image-only worksheets are not detected.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 1000
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_sis_hazop_phrase
      matches:
        - ref: Regex_global_sis_hazop_instrument_tag
          min_count: 5
          unique_results: true
        - type: any
          refs:
            - Regex_global_sis_hazop_header_row
            - Regex_global_sis_hazop_voting_sil
        - type: any
          refs:
            - Regex_global_sis_hazop_pid_reference
            - Keyword_global_sis_hazop_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_sis_hazop_exclusion
    - confidence_level: 75
      id_match: Regex_global_sis_hazop_phrase
      matches:
        - type: any
          refs:
            - Regex_global_sis_hazop_header_row
            - Regex_global_sis_hazop_voting_sil
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_sis_hazop_exclusion
    - confidence_level: 75
      id_match: Regex_global_sis_hazop_phrase
      matches:
        - ref: Regex_global_sis_hazop_instrument_tag
          min_count: 5
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_sis_hazop_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_global_sis_hazop_phrase
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_global_sis_hazop_phrase
      pattern: >-
        (?i)\b(?:HAZOP|hazard\s+and\s+operability\s+(?:study|review|worksheet)|cause\s*(?:&|and)\s*effects?\s+(?:matrix|chart|diagram)|C&E\s+matrix|safety\s+instrumented\s+(?:functions?|systems?)|safety\s+requirements?\s+specification)\b
    - id: Regex_global_sis_hazop_header_row
      pattern: >-
        (?i)\bdeviations?\b[^\n]{0,40}\bcauses?\b[^\n]{0,40}\bconsequences?\b[^\n]{0,40}\bsafeguards?\b
    - id: Regex_global_sis_hazop_instrument_tag
      pattern: >-
        \b(?:FIC|FIT|FT|FV|LIC|LT|LSH|LSL|LSHH|LSLL|PIC|PT|PSV|PSH|PSL|PSHH|PSLL|TIC|TT|TSH|TSHH|XV|ESDV|SDV|HS)-\d{3,5}[A-Z]?\b
    - id: Regex_global_sis_hazop_voting_sil
      pattern: >-
        \b[1-3]oo[1-4]\b|\bSIL[ \t]?[1-4]\b|\bSIF[-\s]?\d{1,4}\b
    - id: Regex_global_sis_hazop_pid_reference
      pattern: >-
        (?i)\bP&ID\s{0,3}(?:(?:no\.?|number|dwg|drawing)\s{0,3})?[:#]?\s{0,3}[A-Z0-9][A-Z0-9-]{3,24}
  keywords:
    - id: Keyword_global_sis_hazop_evidence
      groups:
        - match_style: word
          terms:
            - action owner
            - node
            - trip setpoint
            - setpoint
            - interlock
            - proof test interval
            - bypass
            - revision
      strength: specific
    - id: Keyword_global_sis_hazop_exclusion
      groups:
        - match_style: word
          terms:
            - training exercise
            - training course
            - course
            - quiz
            - textbook
            - worked example
            - for example
            - example reactor
            - IEC 61882 describes
      strength: specific
risk_rating: 8
risk_description: >-
  A populated HAZOP worksheet or SIS cause and effect matrix documents how a specific plant can fail and which instruments, trip setpoints and voting arrangements prevent a major incident. For critical infrastructure (power stations, water treatment, gas facilities) that is sensitive operational information and can be SOCI protected information; it also carries commercial and liability sensitivity. Standards text, training material, blank templates and news are excluded from enforce tiers. Risk 8 supports SENSITIVE InfoTech.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: CERN ICALEPCS 2019 - cause and effect matrix for safety instrumented systems (MOPHA041)
    url: https://proceedings.jacow.org/icalepcs2019/papers/mopha041.pdf
  - title: Hazard and operability study (overview of IEC 61882 guide words)
    url: https://en.wikipedia.org/wiki/Hazard_and_operability_study
  - title: ANSI/ISA-5.1-2009 Instrumentation Symbols and Identification (preview)
    url: https://webstore.ansi.org/preview-pages/ISA/preview_ANSI+ISA+5.1-2009.pdf
