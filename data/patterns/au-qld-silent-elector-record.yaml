schema: testpattern/v1
name: Queensland Silent Elector Record
slug: au-qld-silent-elector-record
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Records that identify a silent elector: completed AEC silent elector registrations (form ER022ESw_QLD, used for Queensland enrolment under the joint roll arrangement), silent elector registers, roll entries flagged silent, silent enrolment confirmations and special postal voter register entries for silent electors. A silent elector is a person whose address the Electoral Commission of Queensland has kept off the public roll because showing it would put the personal safety of the person or their family at risk (Electoral Act 1992 s 58(5) and sch 1; Commonwealth Electoral Act 1918 s 104, backed by a statutory declaration). Silent electors are automatically special postal voters (s 114(2)(b)), and council voters rolls must omit their address (LGEA s 19(2)). Nomination form guidance, fact sheets, AEC guidance, blank forms, legislation and news are decoys.
operation: >-
  Primary: silent elector(s), silent enrolment, registration as a silent elector, the ER022ESw form code, or the ER022 declaration wording (residential address shown on any / the publicly available roll places the personal safety ... at risk). 65 is discovery-only (primary alone). 75 requires, within 300 characters, a populated name field (elector, name, full / current / family / given name, surname or applicant, with a non-placeholder value) plus one of: a populated electoral district / division / electorate / ward field (or "Division n" / "Ward n"), a residential street address, or a date of birth. 85 requires the populated name field plus a residential street address or a populated date of birth, plus an independent electoral context term (enrolled, enrolment, roll, special postal voter, personal safety, statutory declaration, AEC, ECQ and similar). Every tier excludes template/fixture text; enforce tiers also exclude the candidate nomination form instruction ("please do not insert your address details here"), fact sheet / FAQ / legislation-site wording, "addresses of silent electors are not released" style disclosure notes and the s 133A(5) wording. The pattern carries PROTECTED Electoral Roll for records with an address; name-only records at 75 carry the lower SENSITIVE Electoral Roll sensitivity (see risk_description).
pattern: >-
  (?i)\b(?:silent\s+electors?|silent\s+enrol(?:l)?ment|registration\s+as\s+a\s+silent\s+elector|ER022ESw_[A-Z]{2,3}(?:_\d{6})?|(?:residential\s+)?address\s+shown\s+on\s+(?:any|the\s+publicly\s+available)\s+(?:electoral\s+)?roll\s+places\s+the\s+personal\s+safety)\b
confidence: medium
confidence_justification: >-
  Medium: "silent elector" is a specific statutory term, but it appears in every ECQ candidate nomination form, fact sheet and AEC guidance page, so enforce tiers need a populated name field plus a district, address or DOB, and nomination and fact-sheet wording is excluded. The exact silent marker or column in ECQ internal extracts is not published, so roll-extract rows flagged "S" without the words "silent elector" are not detected. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Electoral Act 1992 (Qld) ss 58(5), 68, 114(2)(b), sch 1
  - Local Government Electoral Act 2011 (Qld) ss 19(2), 82
  - Commonwealth Electoral Act 1918 (Cth) s 104
  - IPA 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government
corroborative_evidence:
  keywords:
    - enrolled
    - enrolment
    - roll
    - special postal voter
    - personal safety
    - statutory declaration
    - AEC
    - ECQ
    - division
    - district
  proximity: 300
test_cases:
  should_match:
    - value: "Registration as a silent elector and/or enrolment in Queensland (ER022ESw_QLD_081024)\nFamily name: Teston\nGiven name(s): Avery James\nDate of birth (dd/mm/yyyy): 12/03/1981\nCurrent residential address: 14 Wattlebird Street, Stafford QLD 4053\nI declare that having my residential address shown on any electoral roll places the personal safety of myself or members of my family at risk."
      description: Completed ER022 silent elector registration with DOB and residential address (85 tier)
      synthetic: true
    - value: "Register of special postal voters - Stafford district\nElector: Morgan Teston\nCategory: silent elector\nBallot material posted to: 27 Carrington Avenue, Stafford QLD 4053\nDate of birth: 04/07/1990"
      description: Special postal voter register entry for a silent elector with address and DOB (85 tier)
      synthetic: true
    - value: "Silent enrolment confirmation\nElector name: Casey Teston\nDOB: 09/09/1999\nDivision: Rankin\nYour address will not appear on the publicly available roll."
      description: Silent enrolment confirmation with name and DOB, no address (85 tier)
      synthetic: true
    - value: "Roll entry - silent elector (address not shown)\nName: Riley Staffson\nElectoral district: Stafford"
      description: Name and district only (75 tier, SENSITIVE Electoral Roll sensitivity)
      synthetic: true
    - value: "Council voters roll - silent electors, addresses omitted under LGEA s 19(2)\nElector: Jordan Teston\nDivision: Division 3"
      description: Council voters roll silent elector entry with name and division (75 tier)
      synthetic: true
  should_not_match:
    - value: "Form 006 SG Nomination of candidate - candidate details (as enrolled)\nSurname: Teston\nGiven name: Avery\nOccupation: Pharmacist\nDate of birth: 12/03/1981\nEnrolled address: 14 Wattlebird Street, Stafford QLD 4053\nIf you are enrolled as a silent elector, please do not insert your address details here."
      description: Completed nomination form; the silent elector sentence is form boilerplate (nomination exclusion)
    - value: "Nomination of candidate\nSurname: __________\nGiven name: __________\nEnrolled address: __________\nIf you are enrolled as a silent elector, please do not insert your address details here."
      description: Blank nomination form guidance
    - value: "Local Government Fact Sheet 04. Candidates receive the voters roll with the names and addresses of electors after nominations close. The addresses of silent electors are not released. After the election, information about silent electors is not released either."
      description: LG fact sheet 04 text
    - value: "If you register as a silent elector, only your name and the name of your division will appear on the electoral rolls. You must give a statutory declaration explaining the risk to your personal safety."
      description: AEC silent elector guidance
    - value: "More than 150,000 Australians are now registered as silent electors, whose addresses are kept off the public roll to protect their personal safety, the AEC said on Tuesday."
      description: Public news report
    - value: "Registration as a silent elector (ER022ESw_QLD)\nFamily name: ________\nDate of birth (dd/mm/yyyy): __/__/____\nCurrent residential address: ________\nReturn to silent@aec.gov.au or AEC, Reply Paid 9867, Brisbane QLD 4001"
      description: Blank ER022 form
    - value: "Electoral Act 1992 s 133A(5): The commission must not give elector information about a silent elector."
      description: Legislation text
false_positives:
  - description: Candidate nomination forms (ECQ Form 005 / 006) carry the instruction "If you are enrolled as a silent elector, please do not insert your address details here" next to populated candidate details.
    mitigation: The nomination instruction is an enforce-tier exclusion, so completed nomination forms do not fire. A silent-elector candidate's nomination is left to the candidate nomination classifier.
  - description: Fact sheets, AEC and ECQ guidance, legislation and news mention silent electors without a populated record.
    mitigation: Enforce tiers need a populated name field plus district, address or DOB; fact sheet, FAQ, legislation-site and "not released" wording is excluded.
  - description: Overlap with au-dfv-confidential-address, which also treats "silent elector" and the ER022 declaration as a confidential-address anchor and fires at 75/85 when a street address (and person field) is present.
    mitigation: The two are complementary. A silent elector record with an address fires both, at PROTECTED (this one PROTECTED Electoral Roll, the DFV one PROTECTED Personal-Privacy); an organisation deploying both should let the electoral policy take precedence for roll-derived records. This classifier adds the name-plus-district and name-plus-DOB records (no address) that the DFV classifier does not detect, plus the ER022 form code and silent enrolment wording. Use this one for electoral-roll policies and the DFV one for cross-sector confidential-address policies; do not stack both in one rule if match counts matter.
  - description: Roll extracts that flag silent electors only with a code or column (for example "S") and no "silent elector" wording.
    mitigation: Not detected; the ECQ internal marker is unpublished. au-qld-electoral-roll-extract still detects the extract.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_silent_elector_record_primary
      matches:
        - ref: Regex_au_qld_silent_elector_record_name_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_silent_elector_record_residential_address
            - Regex_au_qld_silent_elector_record_dob
        - ref: Keyword_au_qld_silent_elector_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_silent_elector_record_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_silent_elector_record_primary
      matches:
        - ref: Regex_au_qld_silent_elector_record_name_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_silent_elector_record_district_field
            - Regex_au_qld_silent_elector_record_residential_address
            - Regex_au_qld_silent_elector_record_dob
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_silent_elector_record_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_silent_elector_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_silent_elector_record_primary
      pattern: >-
        (?i)\b(?:silent\s+electors?|silent\s+enrol(?:l)?ment|registration\s+as\s+a\s+silent\s+elector|ER022ESw_[A-Z]{2,3}(?:_\d{6})?|(?:residential\s+)?address\s+shown\s+on\s+(?:any|the\s+publicly\s+available)\s+(?:electoral\s+)?roll\s+places\s+the\s+personal\s+safety)\b
    - id: Regex_au_qld_silent_elector_record_name_field
      pattern: >-
        (?i)\b(?:elector(?:'s)?(?:\s+(?:full\s+)?name)?|(?:full|current|family|given)\s+name(?:\(s\)|s)?|surname|applicant(?:\s+name)?|(?<![A-Za-z] )name)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_au_qld_silent_elector_record_district_field
      pattern: >-
        (?i)\b(?:(?:electoral\s+)?(?:district|division|electorate|ward)(?:\s+name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{2,30}|(?:division|ward)\s+\d{1,2}\b)
    - id: Regex_au_qld_silent_elector_record_residential_address
      pattern: >-
        (?i)\b(?:(?:Unit|Lot|Apt|Flat)\s+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?\s+[A-Z][A-Za-z'-]{1,20}(?:\s[A-Z][A-Za-z'-]{1,20}){0,2}\s+(?:Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Court|Ct|Crescent|Cres|Place|Pl|Parade|Pde|Terrace|Tce|Lane|Ln|Way|Close|Cl|Highway|Hwy|Boulevard|Bvd|Circuit|Cct|Grove|Gr|Esplanade|Esp)\b
    - id: Regex_au_qld_silent_elector_record_dob
      pattern: >-
        (?i)\b(?:date\s+of\s+birth|DOB|birth\s+date)(?:\s*\(dd/mm/yyyy\))?\s*[:#]?\s*\d{1,2}[/.-]\d{1,2}[/.-](?:19|20)\d{2}\b
    - id: Regex_au_qld_silent_elector_record_guidance_exclusion
      pattern: >-
        (?i)(?:\bplease\s+do\s+not\s+insert\s+your\s+address\s+details\s+here\b|\baddress(?:es)?\s+of\s+silent\s+electors\s+(?:are|is)\s+not\s+(?:released|provided|published)\b|\binformation\s+about\s+silent\s+electors\s+is\s+not\s+released\b|\bmust\s+not\s+give\s+elector\s+information\s+about\s+a\s+silent\s+elector\b|\bfact\s?sheet\b|\bfrequently\s+asked\s+questions\b|\blegislation\.(?:qld\.)?gov\.au\b)
  keywords:
    - id: Keyword_au_qld_silent_elector_record_corroborative
      groups:
        - match_style: word
          terms:
            - enrolled
            - enrolment
            - roll
            - special postal voter
            - special postal voters
            - personal safety
            - statutory declaration
            - division
            - district
            - electorate
            - ward
            - text: AEC
              case_sensitive: true
            - text: ECQ
              case_sensitive: true
            - Electoral Commission
      strength: specific
risk_rating: 10
risk_description: >-
  The classifier identifies a record that names a silent elector: a person whose address the Electoral Commission has withheld from the public roll because showing it would put the personal safety of the person or their family at risk, a status granted on a statutory declaration (Electoral Act 1992 s 58(5); CEA s 104). Silent electors are frequently people escaping domestic and family violence, stalking or threats. A record that pairs a silent elector's name with their residential address (ER022 registration, special postal voter register, internal roll entry) defeats the protection and can let the person posing the risk find them, so the pattern-level label is PROTECTED Electoral Roll (risk 10), the PROTECTED mirror of SENSITIVE Electoral Roll. Owner decision on the split: a record that names a silent elector with only their district or date of birth and no residential address (the name-only 75 tier) carries the lower SENSITIVE Electoral Roll sensitivity; deploy the 75 tier under a SENSITIVE Electoral Roll rule and the 85 tier with an address under PROTECTED where the policy engine allows per-tier labels. Nomination forms, fact sheets, guidance, blank forms and news are excluded from enforce tiers.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Electoral Roll
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: Electoral Act 1992 (Qld) - s 58(5), sch 1 silent elector, s 68, s 114(2)(b), s 133A(5)
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1992-028
  - title: Local Government Electoral Act 2011 (Qld) - s 19(2) voters roll must not include address of silent elector
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-2011-027
  - title: Commonwealth Electoral Act 1918 - s 104 Request for address not to be shown on Roll
    url: https://www.legislation.gov.au/C1918A00027/latest/text
  - title: AEC - Silent electors
    url: https://www.aec.gov.au/Enrolling_to_vote/Special_Category/silent-electors.htm
  - title: AEC - ER022ESw_QLD Registration as a silent elector and/or enrolment in Queensland
    url: https://www.aec.gov.au/Enrolling_to_vote/pdf/forms/silent/ER022ESw_QLD.pdf
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.1
    date: '2026-09-25'
    description: Owner decision - silent elector records with an address carry the new PROTECTED Electoral Roll label (PROTECTED mirror of SENSITIVE Electoral Roll) instead of PROTECTED Personal-Privacy.
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - silent elector registrations, registers and roll entries; 75 gated on a populated name plus district, address or DOB, 85 on name plus residential address or DOB plus electoral context; nomination form instruction, fact sheets and guidance excluded. Complements au-dfv-confidential-address.
