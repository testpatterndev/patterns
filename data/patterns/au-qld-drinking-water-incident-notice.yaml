schema: testpattern/v1
name: Queensland Drinking Water Incident Notification Record
slug: au-qld-drinking-water-incident-notice
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Working records of a drinking water service provider's notifications to the drinking water regulator under Water Supply (Safety and Reliability) Act 2008 (Qld) s 102 (notice of noncompliance with water quality criteria) and s 102A (notice of prescribed incident): the immediate notification and the follow-up notice in the approved form covering the noncompliance or incident, the circumstances, the action taken or to be taken, and the measures to prevent recurrence. Includes internal boil water notice decision and incident logs that carry the scheme, incident reference, notification times, parameter exceedances (E. coli, total coliforms, turbidity NTU, chlorine mg/L) and corrective actions. Distinct from au-water-quality-data-reference, which covers routine measured water quality data: this classifier needs the incident or notification structure. Public boil water notices, media releases and published DWQMP annual or water quality reports are decoys.
operation: >-
  Primary: an incident/notification phrase (notice of noncompliance with water quality criteria, notice of prescribed incident, prescribed incident, water quality incident/noncompliance/non-compliance, drinking water incident/noncompliance, noncompliance with the water quality criteria, boil water notice/advisory/alert, do not drink/consume notice). 75 tier requires, within 300 characters, one populated incident-administration field: scheme or scheme name, service provider or SPID, incident number/reference/ID/date/type, date and time of detection/incident/notification, time regulator notified or informed, notified to regulator, or sampling point / sample location, each with a non-placeholder value. 85 tier requires that field AND a second distinct structure (a parameter exceedance such as E. coli, total or thermotolerant coliforms, turbidity, free/total chlorine, chlorine residual, monochloramine, fluoride, nitrate, manganese, Naegleria or trihalomethanes followed within 25 characters by a number with NTU, mg/L, ug/L, MPN/100mL, cfu/100mL or orgs/100mL; or a populated action field of at least three words: action taken/proposed/to be taken, corrective or immediate actions, root cause, circumstances, measures to prevent recurrence) AND an independent corroborative term (regulator, section 102/102A, water quality criteria, DWQMP, drinking water quality management plan, Queensland Health, public health unit, ADWG, exceedance, detection, reasonable excuse). All enforce tiers AND NOT the shared template-exclusion dictionary and a public-notice/publication exclusion (rolling boil, residents are advised, until further notice, media release, we apologise for the inconvenience, annual report, water quality report, fact sheet, frequently asked questions). 65 is discovery-only (primary phrase alone) and will surface public boil water notices, legislation and guidance.
pattern: >-
  (?i)\b(?:notice\s+of\s+(?:non-?compliance\s+with\s+(?:the\s+)?water\s+quality\s+criteria|(?:a\s+)?prescribed\s+incident)|prescribed\s+incident|(?:drinking\s+)?water\s+quality\s+(?:incident|non-?compliance)|drinking\s+water\s+(?:incident|non-?compliance)|non-?compliance\s+with\s+the\s+water\s+quality\s+criteria|boil\s+water\s+(?:notice|advisory|alert)|do\s+not\s+(?:drink|consume)\s+(?:notice|advisory))\b
confidence: medium
confidence_justification: >-
  Medium: the s 102/102A notice titles and "prescribed incident" are statutory and distinctive, but boil water notice wording is widely published, so enforce tiers require populated incident-administration fields and a public-notice exclusion. Parameter values are unit-checked only. The approved form's own field headings were not available to the research, so field labels follow the s 102(3)/102A(3) content list (noncompliance or incident, circumstances, action taken, preventive measures) and common incident-log labels. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Water Supply (Safety and Reliability) Act 2008 (Qld)
frameworks:
  - QGISCF
data_categories:
  - health
  - infrastructure
  - environmental
corroborative_evidence:
  keywords:
    - regulator
    - section 102
    - section 102A
    - water quality criteria
    - DWQMP
    - drinking water quality management plan
    - Queensland Health
    - public health unit
    - exceedance
    - detection
  proximity: 300
customisation:
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_au_qld_drinking_water_incident_notice_admin_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's case / matter reference number format (see docs/identifiers.md#case-reference-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Notice of noncompliance with water quality criteria - s 102 follow-up\nScheme: Mount Carrow Drinking Water Scheme\nIncident number: DWI-2026-031\nDate and time of detection: 14/09/2026 06:40\nTime regulator notified: 14/09/2026 08:15 by phone\nResult: E. coli 3 MPN/100mL at Reservoir R2 outlet; free chlorine 0.1 mg/L\nAction taken: reservoir isolated, mains flushed and chlorine dosing increased; resampling at three reticulation points.\nPublic health unit consulted before the boil water notice decision."
      description: High tier (85) - scheme, incident and notification fields, E. coli and chlorine exceedance, actions and regulator context
      synthetic: true
    - value: "Prescribed incident - Lakeside WTP filter failure\nService provider: Testvale Regional Council\nIncident date: 03/09/2026\nTurbidity 1.9 NTU on combined filtered water for 45 minutes.\nCircumstances: backwash valve stuck open after a power interruption at the plant.\nNotified to the drinking water regulator under section 102A."
      description: High tier (85) - provider and incident fields, turbidity exceedance and circumstances with section 102A
      synthetic: true
    - value: "Boil water advisory decision log\nScheme name: Carrow Creek township supply\nIncident ref: BWA-26-004\nDuty officer to confirm resampling results before lifting."
      description: Medium tier (75) - populated scheme and incident reference, no results
      synthetic: true
    - value: "Water quality incident - sampling point: Hilltop reservoir inlet RS-14. Awaiting lab confirmation."
      description: Medium tier (75) - populated sampling point only
      synthetic: true
    - value: Can someone draft the water quality incident summary for the operations meeting?
      description: Discovery tier (65) - primary phrase only
      synthetic: true
  should_not_match:
    - value: "102A Notice of prescribed incident (1) This section applies if a drinking water service provider becomes aware a prescribed incident has happened in relation to the provider or the provider's service. (2) The drinking water service provider must, unless the provider has a reasonable excuse, immediately inform the regulator of the prescribed incident."
      description: Legislation text (65 only)
    - value: "BOIL WATER NOTICE - Mount Carrow. Residents are advised to bring water to a rolling boil before drinking until further notice. Affected area: Mount Carrow, Carrow Heights. E. coli was detected at 3 MPN/100mL in routine testing. We apologise for the inconvenience."
      description: Public boil water notice with an exceedance value (public-notice exclusion)
    - value: "Drinking Water Quality Management Plan annual report 2025-26. Scheme: Carrow Creek. Water quality incident reported to the regulator on 12/02/2026: turbidity 1.2 NTU; action taken: filters backwashed and the boil water alert lifted after two clear results."
      description: Published DWQMP annual report incident table (publication exclusion)
    - value: "Notice of prescribed incident - blank template\nScheme: ______\nIncident number: [to be assigned]\nDate and time of detection: ______\nAction taken: ______"
      description: Blank approved-form template
    - value: "Media release: the boil water alert for Lakeside has been lifted after testing confirmed the supply is safe to drink."
      description: News and media release (65 only)
false_positives:
  - description: Public boil water notices and alerts on council websites, social media and letterbox drops, some of which quote the detection result.
    mitigation: The public-notice exclusion suppresses rolling boil, residents are advised, until further notice and apology wording; public notices rarely carry incident references or regulator notification times, which the 75 tier needs.
  - description: Published Drinking Water Quality Management Plan annual reports and water quality reports that tabulate past incidents.
    mitigation: Annual report and water quality report wording is excluded; routine measured results without incident structure belong to au-water-quality-data-reference.
  - description: The legislation, regulator guidelines and blank approved forms.
    mitigation: Enforce tiers require populated fields; blank lines, square-bracket and angle-bracket placeholders are rejected.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_drinking_water_incident_notice_primary
      matches:
        - ref: Regex_au_qld_drinking_water_incident_notice_admin_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_drinking_water_incident_notice_exceedance
            - Regex_au_qld_drinking_water_incident_notice_action_field
        - ref: Keyword_au_qld_drinking_water_incident_notice_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_drinking_water_incident_notice_public_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_drinking_water_incident_notice_primary
      matches:
        - ref: Regex_au_qld_drinking_water_incident_notice_admin_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_drinking_water_incident_notice_public_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_drinking_water_incident_notice_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_drinking_water_incident_notice_primary
      pattern: >-
        (?i)\b(?:notice\s+of\s+(?:non-?compliance\s+with\s+(?:the\s+)?water\s+quality\s+criteria|(?:a\s+)?prescribed\s+incident)|prescribed\s+incident|(?:drinking\s+)?water\s+quality\s+(?:incident|non-?compliance)|drinking\s+water\s+(?:incident|non-?compliance)|non-?compliance\s+with\s+the\s+water\s+quality\s+criteria|boil\s+water\s+(?:notice|advisory|alert)|do\s+not\s+(?:drink|consume)\s+(?:notice|advisory))\b
    - id: Regex_au_qld_drinking_water_incident_notice_admin_field
      pattern: >-
        (?i)\b(?:(?:drinking\s+)?water\s+(?:supply\s+)?scheme(?:\s+name)?|scheme(?:\s+name)?|(?:drinking\s+water\s+)?service\s+provider(?:\s+(?:name|ID))?|SPID|incident\s+(?:no\.?|number|ref(?:erence)?|ID|date|type|category)|date\s+(?:and\s+time\s+)?(?:of\s+)?(?:detection|incident|notification)|time\s+(?:of\s+)?(?:detection|notification)|(?:date|time)\s+(?:the\s+)?regulator\s+(?:notified|informed)|regulator\s+(?:notified|informed)(?:\s+(?:at|on))?|notified\s+to\s+(?:the\s+)?regulator|sampling\s+point|sample\s+(?:location|site|point))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/:'.-]{0,40}(?:[ \t]+[A-Za-z0-9/:'.-]{1,30}){0,5}
    - id: Regex_au_qld_drinking_water_incident_notice_exceedance
      pattern: >-
        (?i)\b(?:E\.\s{0,2}coli|Escherichia\s+coli|(?:total|thermotolerant|faecal)\s+coliforms?|turbidity|free\s+chlorine|total\s+chlorine|chlorine\s+residual|monochloramine|fluoride|nitrate|manganese|Naegleria(?:\s+fowleri)?|trihalomethanes|THMs?)[^\n\d]{0,25}[<>]?\s{0,2}\d{1,5}(?:\.\d{1,3})?\s{0,2}(?:NTU|mg/L|ug/L|µg/L|MPN/100\s{0,2}mL|(?:cfu|orgs?|organisms)/100\s{0,2}mL)
    - id: Regex_au_qld_drinking_water_incident_notice_action_field
      pattern: >-
        (?i)\b(?:(?:immediate\s+|corrective\s+|preventive\s+|remedial\s+)?actions?\s+(?:taken|proposed|to\s+be\s+taken)|corrective\s+actions?|immediate\s+actions?|root\s+cause|circumstances(?:\s+that\s+gave\s+rise(?:\s+to\s+the\s+(?:noncompliance|non-compliance|incident))?)?|(?:measures|actions)\s+to\s+prevent(?:\s+recurrence)?|preventive\s+measures)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|nil|none|see|refer)\b|_{2,}|\[|<)[A-Za-z][A-Za-z'-]{1,30}(?:[ \t,]{1,3}[A-Za-z0-9'./-]{1,30}){2,12}
  keywords:
    - id: Keyword_au_qld_drinking_water_incident_notice_corroborative
      groups:
        - match_style: word
          terms:
            - regulator
            - section 102
            - section 102A
            - s 102
            - s 102A
            - water quality criteria
            - text: DWQMP
              case_sensitive: true
            - drinking water quality management plan
            - Queensland Health
            - public health unit
            - text: ADWG
              case_sensitive: true
            - exceedance
            - detection
            - reasonable excuse
      strength: specific
    - id: Keyword_au_qld_drinking_water_incident_notice_public_exclusion
      groups:
        - match_style: word
          terms:
            - rolling boil
            - residents are advised
            - until further notice
            - media release
            - we apologise for the inconvenience
            - annual report
            - water quality report
            - fact sheet
            - factsheet
            - frequently asked questions
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier identifies a drinking water service provider's s 102 or s 102A notification working record or incident log: the affected scheme, the contamination or treatment failure (E. coli, turbidity, disinfection loss), when it was detected and notified, and the corrective actions. Before a public notice is issued, disclosure can cause panic or misinformation, and the circumstances and root-cause detail reveal treatment-plant weaknesses in a critical infrastructure asset and potential regulatory offences; afterwards the record still carries enforcement-relevant admissions. It rarely identifies private individuals. Public boil water notices, published DWQMP annual reports, legislation and blank forms are excluded from enforce tiers. Risk 7 supports OFFICIAL: Sensitive / SENSITIVE Government.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 fits PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE Government because a s 102 or s 102A
    notification record reveals a scheme's contamination or treatment failure, root cause and corrective action before
    public notice. PROTECTED is not met: it rarely identifies individuals and the incident itself is usually made
    public.
  generic:
    classification: Medium
    dlm: Medium Government
    rationale: >-
      Medium Government handling protects pre-publication water quality incident records and treatment weaknesses at a
      named scheme. It is not High because the substance is typically released through a public notice.
references:
  - title: Water Supply (Safety and Reliability) Act 2008 (Qld) s 102 - notice of noncompliance with water quality criteria
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2008-034#sec.102
  - title: Water Supply (Safety and Reliability) Act 2008 (Qld) s 102A - notice of prescribed incident
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2008-034#sec.102A
  - title: Water Supply (Safety and Reliability) Act 2008 (Qld) s 92 - approved drinking water quality management plan
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2008-034#sec.92
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - WSSR Act s 102/102A drinking water noncompliance and prescribed incident notification records; 75 gated on a populated incident-administration field, 85 adds a parameter exceedance or action field and regulator context; public boil water notices, published reports, legislation and blank forms excluded.
