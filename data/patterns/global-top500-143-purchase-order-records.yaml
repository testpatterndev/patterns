  - version: 1.4.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires an independent populated payee/account field (Regex_global_top500_143_purchase_order_records_record_structure); 85 requires 2 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list. Removed evidence no longer referenced by any tier (Evidence_purchase_order). Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.3.6
    date: '2026-09-25'
    description: >-
      References completed: every reference has a title and a verified URL (EUR-Lex GDPR URL returns a bot-challenge (202)
      - well-known official URL kept unverified).
  - version: 1.3.5
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.3
