schema: testpattern/v1
name: Purchase order records
slug: global-top500-143-purchase-order-records
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to purchase order records in Australian contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?is)\b(?:purchase\s+order|PO\s+number|procurement\s+order|order\s+confirmation|delivery\s+schedule|goods\s+receipt|purchase\s+requisition|supplier\s+order|order\s+value)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - My Health Records Act 2012 (Cth)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - Telecommunications (Interception and Access) Act 1979 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - business
corroborative_evidence:
  keywords:
    - purchase order records
    - purchase
    - order
    - records
    - procurement
    - supplier
    - management
  proximity: 300
test_cases:
  should_match:
    - value: purchase order
      description: Primary topic phrase match
    - value: po number
      description: Case-insensitive topic phrase match
    - value: procurement order
      description: Alternative topic phrase match
    - value: order confirmation
      description: Additional topic phrase match
    - value: |-
        Purchase order
        Payee: Riverbend Supplies Pty Ltd
        BSB: 064-000
        Account number: 12345678
        Payment reference: INV-20431
      description: Populated payee/account reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: procurement inventory
      description: Generic word pair from old broad template should not match
    - value: |-
        Purchase order:
        Payee:
        Account name:
        Account number:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about purchase order are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to purchase order records appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_purchase_order
      matches:
        - ref: Regex_global_top500_143_purchase_order_records_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_purchase_order
      matches:
        - ref: Regex_global_top500_143_purchase_order_records_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_purchase_order
  regexes:
    - id: Pattern_purchase_order
      pattern: (?is)\b(?:purchase\s+order|PO\s+number|procurement\s+order|order\s+confirmation|delivery\s+schedule|goods\s+receipt|purchase\s+requisition|supplier\s+order|order\s+value)\b
    - id: Pattern_au_top500_143_purchase_order_records_label_context
      pattern: (?i)\b(?:purchase\s+order\s+records)\b
    - id: Regex_global_top500_143_purchase_order_records_record_structure
      pattern: (?i)\b(?:payee|supplier|vendor|creditor|beneficiary|account\s+name|BSB|account\s+(?:no\.?|number)|invoice\s+(?:no\.?|number)|remittance\s+(?:no\.?|number|ref(?:erence)?)|payment\s+(?:ref(?:erence)?|date)|amount\s+paid)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_top500_143_purchase_order_records_domain_context
      groups:
        - match_style: word
          terms:
            - purchase order records
            - purchase
            - order
risk_description: >-
  The detector recognises purchase order, PO number, procurement order, and order confirmation language with seven nearby terms. A normal true positive is routine purchasing evidence containing supplier, items, quantities, delivery, and approval information, which usually creates low and reversible commercial harm if disclosed alone. Policies, order templates, and generic confirmations can also match without a completed transaction. Risk 4 OFFICIAL fits ordinary procurement administration; SENSITIVE requires strategic quantities, controlled goods, non-public negotiation, fraud evidence, or a concentrated order repository.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 4 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM, OFFI, and Low tier for one routine purchase
    order. The next SENSITIVE level is not met because the record does not normally contain protected procurement,
    payment authority, critical destinations, strategic negotiations, or a consequential bulk register.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low and Low handling suit ordinary purchase orders that are shared operationally and require additional
      payment or strategic context for material misuse.
