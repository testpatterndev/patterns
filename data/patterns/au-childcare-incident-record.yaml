schema: testpattern/v1
name: Early Childhood Education and Care Incident, Injury, Trauma and Illness Record
slug: au-childcare-incident-record
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed incident, injury, trauma and illness records kept by education and care services (long day care, kindergarten, family day care, outside school hours care), including council-run centres, under the Education and Care Services National Law and National Regulations (regulation 87, record; regulation 86, notification to parents; regulation 183, storage - regulation numbers as listed in ACECQA's Incident, injury, trauma and illness policy guidelines). A populated record names the child (name, date of birth or age), the date and time of the incident, the nature of the injury, trauma or illness, first aid or medication given, action taken and when the parent or guardian was notified. The records must be kept confidentially until the child turns 25. ACECQA guidance, service policies, the regulation text, blank forms and training scenarios are decoys. School incident reports are covered by au-qld-school-incident-report.
operation: >-
  Primary: "incident, injury, trauma and illness record/report/form/register" or an early childhood setting (education and care, early childhood, childcare, family day care, kindergarten/kindy, OSHC, outside school hours care) followed by incident/injury/illness/accident record/report/form. 65 is discovery-only (primary alone) and surfaces policies, guidance and blank forms. 75 requires, within 300 characters, one populated structure: a child field (child's name / name of child followed by a two-word name, a date of birth, or an age in years or months) or an incident field (dated or timed date/time of incident, injury or illness; nature of injury, illness or trauma, body part, symptoms, first aid given, medication administered or action taken with a word value; or parent/guardian notified with a date or time). 85 requires a child field AND an incident field AND an independent corroborative term (educator, nominated supervisor, approved provider, responsible person, witness, room, first aid, ice pack and similar). Blank lines, bracket placeholders, n/a/tbc and "Yes / No" tick-box prompts are rejected as values. Every tier excludes template/fixture text; enforce tiers also exclude policy, guidance and regulation wording (this policy, policy guidelines, policies and procedures, Quality Area 2, approved provider must, must ensure/include, acecqa.gov.au, legislation.nsw.gov.au, Penalty:).
pattern: >-
  (?i)\b(?:incident,?\s+injury,?\s+trauma,?\s+(?:and|&|or)\s+illness\s+(?:records?|reports?|forms?|registers?)|(?:education\s+and\s+care|early\s+childhood|child\s*care|family\s+day\s+care|kindergarten|kindy|OSHC|outside\s+school\s+hours\s+care)\s+(?:incident|injury|illness|accident)\s+(?:records?|reports?|forms?))\b
confidence: medium
confidence_justification: >-
  Medium: "incident, injury, trauma and illness record" is the prescribed record title and is distinctive, but ACECQA guidance, service policies and blank forms repeat it, so enforce tiers require populated child and incident fields. Regulation numbers are taken from ACECQA's published policy guidelines rather than the regulation text itself (the legislation site was not reachable this session), so they appear only in metadata, not in the detector. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Education and Care Services National Law (Queensland)
  - Education and Care Services National Regulations
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - children
  - health
  - pii
corroborative_evidence:
  keywords:
    - educator
    - nominated supervisor
    - approved provider
    - responsible person
    - witness
    - first aid
    - ice pack
    - room
  proximity: 300
test_cases:
  should_match:
    - value: "Incident, Injury, Trauma and Illness Record\nChild's name: Harper Teston\nDate of birth: 12/03/2022\nRoom: Wattle\nDate and time of incident: 18/09/2026 10:40am\nNature of injury: graze to left knee after a fall from the climbing frame\nFirst aid administered: wound cleaned and ice pack applied\nParent/guardian notified: 18/09/2026 at 3:15pm by phone\nEducator: Casey Staffson"
      description: Completed centre record with child, DOB, incident date, injury, first aid, parent notification and educator (85 tier)
      synthetic: true
    - value: "Kindergarten illness report\nName of child: Oliver Staffson\nAge: 4 years\nSymptoms: temperature of 38.9 and vomiting after lunch\nMedication administered: none, child isolated and monitored\nParent notified at 12:20pm; collected 12:55pm. Nominated supervisor: Riley Teston"
      description: Kindergarten illness record with child, age, symptoms and parent notification (85 tier)
      synthetic: true
    - value: "Family day care incident report - Child: Mia Teston, DOB: 04/11/2023. Details to be completed by the educator."
      description: Record with a populated child field only (75 tier)
      synthetic: true
    - value: "Incident, injury, trauma and illness record updated.\nNature of illness: rash on both arms, suspected hand foot and mouth.\nParent notified at 11:20am."
      description: Record with populated illness and notification fields only (75 tier)
      synthetic: true
  should_not_match:
    - value: "87 Incident, injury, trauma and illness record (1) The approved provider of an education and care service must ensure that an incident, injury, trauma and illness record is kept in accordance with this regulation. (3) The incident, injury, trauma and illness record must include the name and age of the child and the circumstances leading to the incident."
      description: Regulation text (excluded as regulation wording)
    - value: "Incident, Injury, Trauma and Illness Record - blank template\nChild's name: ____________\nDate of birth: ____________\nDate and time of incident: ____________\nNature of injury: ____________\nFirst aid administered: Yes / No\nParent/guardian notified: ____________"
      description: Blank form with unpopulated fields and tick-box prompts
    - value: "Incident, injury, trauma and illness policy. This policy explains how educators complete an incident, injury, trauma and illness record and store it confidentially until the child is 25 years old, in line with Quality Area 2."
      description: Service policy text (guidance exclusion)
    - value: "Training exercise: using the scenario below, complete an incident, injury, trauma and illness record. Child's name: Sam Example, Date and time of incident: 01/02/2026 9:00am, Nature of injury: bumped head."
      description: Training scenario (template-exclusion dictionary)
    - value: "The council's four childcare centres logged 212 incident, injury, trauma and illness records in 2025-26, most of them minor falls, the community services report shows."
      description: Aggregate statistics or news (65 only)
false_positives:
  - description: ACECQA guidance, service policies and the National Regulations quote the record title and list its required contents.
    mitigation: Enforce tiers need populated child or incident fields; a guidance/regulation exclusion suppresses policy wording and regulation text.
  - description: Blank incident forms with Yes / No tick boxes.
    mitigation: Blank lines, bracket placeholders, n/a/tbc and "Yes /" or "No /" tick-box prompts are rejected as values.
  - description: Workplace (staff) injury reports that happen to sit in a childcare service's files.
    mitigation: The primary requires the childcare incident record title or an early childhood setting; a staff injury form using a generic title stays below 65. A staff injury recorded on the children's form can reach 75.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_childcare_incident_record_primary
      matches:
        - ref: Regex_au_childcare_incident_record_child_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_childcare_incident_record_incident_when_field
            - Regex_au_childcare_incident_record_incident_detail_field
        - ref: Keyword_au_childcare_incident_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_childcare_incident_record_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_childcare_incident_record_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_childcare_incident_record_child_field
            - Regex_au_childcare_incident_record_incident_when_field
            - Regex_au_childcare_incident_record_incident_detail_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_childcare_incident_record_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_childcare_incident_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_childcare_incident_record_primary
      pattern: >-
        (?i)\b(?:incident,?\s+injury,?\s+trauma,?\s+(?:and|&|or)\s+illness\s+(?:records?|reports?|forms?|registers?)|(?:education\s+and\s+care|early\s+childhood|child\s*care|family\s+day\s+care|kindergarten|kindy|OSHC|outside\s+school\s+hours\s+care)\s+(?:incident|injury|illness|accident)\s+(?:records?|reports?|forms?))\b
    - id: Regex_au_childcare_incident_record_child_field
      pattern: >-
        (?i)\b(?:(?:child(?:'s)?|name\s+of\s+(?:the\s+)?child|child\s+involved)(?:\s+(?:full\s+)?name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:child(?:'s)?\s+)?(?:date\s+of\s+birth|DOB)\s*[:#]\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}|20\d{2}-\d{2}-\d{2})|(?:child(?:'s)?\s+)?age\s*[:#]\s*\d{1,2}\s{0,2}(?:years?|yrs?|months?|mths?)\b)
    - id: Regex_au_childcare_incident_record_incident_when_field
      pattern: >-
        (?i)\b(?:(?:date\s+(?:and\s+time\s+)?of\s+(?:the\s+)?(?:incident|injury|trauma|illness|accident)|(?:incident|injury|illness)\s+date|time\s+of\s+(?:the\s+)?(?:incident|injury|accident))\s*[:#-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}|20\d{2}-\d{2}-\d{2}|\d{1,2}[:.]\d{2}\s{0,2}(?:am|pm)?)|(?:parent|guardian|parent\s*/\s*guardian|parent\s+or\s+guardian|family)\s+(?:notified|contacted|informed)(?:\s+(?:at|on|by))?\s*[:#-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}|\d{1,2}[:.]\d{2}\s{0,2}(?:am|pm)?))
    - id: Regex_au_childcare_incident_record_incident_detail_field
      pattern: >-
        (?i)\b(?:nature\s+of\s+(?:the\s+)?(?:injury|illness|trauma|incident)|(?:type|details)\s+of\s+(?:the\s+)?(?:injury|illness|trauma)|injury\s+(?:type|sustained|details)|body\s+part(?:\s+(?:injured|affected))?|symptoms(?:\s+observed)?|first\s+aid\s+(?:given|administered|provided)|medication\s+(?:given|administered)|action\s+taken)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:yes|no|y|n)\s*/)[A-Za-z][A-Za-z'-]{2,30}
    - id: Regex_au_childcare_incident_record_guidance_exclusion
      pattern: >-
        (?i)(?:\bthis\s+(?:policy|procedure|guideline|guide|fact\s?sheet|module|course|resource)\b|\bpolicy\s+guidelines\b|\bpolicies\s+and\s+procedures\b|\bquality\s+area\s+2\b|\bapproved\s+provider\s+must\b|\bmust\s+(?:ensure|include)\b|\bfrequently\s+asked\s+questions\b|\bacecqa\.gov\.au\b|\blegislation\.nsw\.gov\.au\b|\bpenalty\s*:)
  keywords:
    - id: Keyword_au_childcare_incident_record_corroborative
      groups:
        - match_style: word
          terms:
            - educator
            - nominated supervisor
            - approved provider
            - responsible person
            - witness
            - room leader
            - room
            - first aid
            - ice pack
            - family day care
            - kindergarten
            - centre director
            - collected
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a completed early childhood incident, injury, trauma or illness record that ties a named young child to an injury, illness, trauma or medication event, together with the service's response and parent notification. It is health information about a child, is often relied on in insurance claims, child protection referrals and litigation, and must be kept confidential until the child turns 25. Disclosure exposes a child's health and can reveal family circumstances. Policies, guidance, the regulation text, blank forms and training scenarios are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because a
    completed record ties a named young child to an injury, illness, trauma or medication event, often later relied on
    in child protection referrals or litigation. PROTECTED is not met by one incident record without protection
    findings.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling covers a child's health event and the service's response, which must stay
      confidential until the child turns 25. High would need child protection or bulk content.
references:
  - title: ACECQA - Incident, injury, trauma and illness policy guidelines (June 2021), table of National Law sections and National Regulations
    url: https://www.acecqa.gov.au/sites/default/files/2021-08/IncidentInjuryTraumaIllnessPolicyGuidelines.pdf
  - title: Education and Care Services National Regulations (NSW legislation, host jurisdiction)
    url: https://legislation.nsw.gov.au/view/html/inforce/current/sl-2011-0653
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - early childhood incident, injury, trauma and illness records; 75 gated on a populated child or incident field, 85 on child + incident fields + corroboration; regulation text, policies, blank forms and training scenarios excluded.
