updated: '2026-10-30'
changelog:
  - version: 1.1.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.0.0
    date: '2026-10-20'
    description: >-
      Initial release (qgfin sector review gap). Purchasing card statements, transaction reports and acquittals. 75
      needs a cardholder, masked card number or transaction line; 85 needs two statement structures plus card-statement
      evidence. Policy / guidance and template framing are excluded on enforce tiers.
