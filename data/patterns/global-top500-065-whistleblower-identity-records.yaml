changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): rebuilt tiers - the old 75/85 fired on the primary phrase alone (the evidence keyword group repeated the primary). 75 now needs a populated discloser identifier or case reference and 85 needs discloser fields plus disclosure fields plus protection evidence. Primary tightened (dropped policy-level 'PID Act', 'whistleblower protection', 'reportable conduct'). Bare-phrase tests replaced with populated records plus policy, blank-form and news decoys. Regulations: removed AML/CTF Act, HRIPA, My Health Records Act, NDB and TIA Act; added PID Act 2010 (Qld), PID Act 2013 (Cth), Corporations Act 2001 (Cth); references added. Note: uk_gov/nz_gov SECRET and ca_gov Protected C are out of band for risk 8 but were not flagged by the audit, so they are left for label review."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 668 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
