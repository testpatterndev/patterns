schema: testpattern/v1
name: Whistleblower identity records
slug: global-top500-065-whistleblower-identity-records
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies records that reveal a whistleblower's identity - public interest / protected disclosure intake and case records, whistleblower reports and discloser identity registers - when the disclosure phrase sits with populated discloser identifiers and disclosure case fields.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: whistleblower or discloser identity, protected disclosure (record/report/register/file), public interest disclosure, qualifying/confidential disclosure, whistleblower report, eligible whistleblower. 65 (discovery only): phrase alone - PID policies, training and news stay here. 75: phrase plus a populated discloser identifier or case field (discloser/whistleblower name, DOB, employee number, position, work unit, contact, PID/disclosure/case reference). 85: identifier field plus a populated disclosure field (date received, received by, disclosure type, subject of disclosure, alleged wrongdoing, subject officer, referred to, reprisal risk, confidentiality level, anonymous) plus independent protection evidence (reprisal, detrimental action, identity must not be disclosed, strictly confidential, Ombudsman, Crime and Corruption Commission, eligible recipient). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:(?:whistleblower|discloser)\s+identity|protected\s+disclosure(?:\s+(?:record|report|register|file))?|public\s+interest\s+disclosure|(?:qualifying|confidential)\s+disclosure|whistleblower\s+report|eligible\s+whistleblower)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated discloser identifier or case reference; 85 also needs a disclosure field and protection evidence. PID procedures, annual reporting and news stay at 65.
jurisdictions:
  - global
regulations:
  - Public Interest Disclosure Act 2010 (Qld)
  - Public Interest Disclosure Act 2013 (Cth)
  - Corporations Act 2001 (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - reprisal
    - detrimental action
    - strictly confidential
    - eligible recipient
    - Ombudsman
    - Crime and Corruption Commission
  proximity: 300
test_cases:
  should_match:
    - value: "PUBLIC INTEREST DISCLOSURE - intake record\nPID reference: PID-2026-0417\nDiscloser name: Avery Teston\nPosition: Senior Procurement Officer\nWork unit: Regional Contracts\nDate received: 12/08/2026\nAlleged wrongdoing: Contract splitting to avoid tender thresholds\nReprisal risk rating: High - identity must not be disclosed to the subject officer."
      description: Populated PID intake record with discloser, disclosure fields and protection evidence (85)
      synthetic: true
    - value: "Whistleblower report received\nCase number: WB-88120\nContact phone: 0412 345 678"
      description: Whistleblower report with a labelled case reference and contact only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "employee interview"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how public interest disclosure records are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Protected disclosure intake form\nDiscloser name: ____________________\nPosition: ____________________\nDate received: ____________________\nAlleged wrongdoing: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: the Ombudsman's annual report shows public interest disclosure numbers rose, and agencies were reminded that whistleblower identity must be protected from reprisal."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: Common words and phrases related to whistleblower identity records appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_whistleblower_identity
      matches:
        - ref: Regex_global_top500_065_whistleblower_identity_records_discloser_fields
        - ref: Regex_global_top500_065_whistleblower_identity_records_disclosure_fields
        - ref: Keyword_global_top500_065_whistleblower_identity_records_protection_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_065_whistleblower_identity_records_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_whistleblower_identity
      matches:
        - ref: Regex_global_top500_065_whistleblower_identity_records_discloser_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_065_whistleblower_identity_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_whistleblower_identity
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_whistleblower_identity
      pattern: (?i)\b(?:(?:whistleblower|discloser)\s+identity|protected\s+disclosure(?:\s+(?:record|report|register|file))?|public\s+interest\s+disclosure|(?:qualifying|confidential)\s+disclosure|whistleblower\s+report|eligible\s+whistleblower)\b
    - id: Regex_global_top500_065_whistleblower_identity_records_discloser_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|discloser(?:\s+name)?|whistleblower(?:\s+name)?|(?:discloser|reporter|complainant)\s*(?:ID|contact)|employee(?:\s+(?:no\.?|number|ID))?|contact\s+(?:phone|email|number)|position|work\s+unit|(?:PID|disclosure|case|file|reference|ref)\s*(?:no\.?|number|ID|#))(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_065_whistleblower_identity_records_disclosure_fields
      pattern: (?i)\b(?:date\s+received|received\s+by|disclosure\s+type|subject\s+of\s+disclosure|alleged\s+wrongdoing|wrongdoing\s+type|subject\s+officer|referred\s+to|risk\s+of\s+reprisal|reprisal\s+risk(?:\s+rating)?|confidentiality(?:\s+(?:level|requirements?))?|anonymous)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_065_whistleblower_identity_records_protection_evidence
      groups:
        - match_style: word
          terms:
            - reprisal
            - detrimental action
            - identity must not be disclosed
            - strictly confidential
            - Ombudsman
            - Crime and Corruption Commission
            - eligible recipient
      strength: specific
    - id: Keyword_global_top500_065_whistleblower_identity_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
risk_description: >-
  The detector recognises whistleblower, protected disclosure and public interest disclosure language and enforces only when populated discloser identifier or case reference fields sit nearby; phrase-only text stays at 65 discovery. A genuine file can reveal who reported misconduct, their allegations, employment relationship, contact details, and protective arrangements, enabling retaliation, intimidation, or contamination of an inquiry. The normal record creates serious personal and investigative harm for one source and a bounded matter, although the phrase alone does not prove an imminent threat. Risk 8 supports SENSITIVE Personal-Privacy; PROTECTED would require an identified source facing credible life-safety danger or compromise of a major protected investigation.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Protected C
