schema: testpattern/v1
name: IP Address v6
slug: global-ip-address-v6
version: 1.0.0
type: keyword_list
pattern_class: concept
description: >-
  Catalogue reference for the Microsoft Purview built-in IP Address v6 sensitive information type, which detects an IPv6 address
  in full or compressed form, with IP-address keywords raising confidence. Microsoft recommends medium confidence (75) for
  the built-in entity. This YAML-only record lets a package recipe include the Microsoft entity explicitly; it does not reproduce
  Microsoft's built-in regular expressions, keyword dictionaries, checksums or XML.
operation: >-
  In Microsoft Purview, enable the built-in entity 3f691089-7413-4926-ab3b-3c5ea8a1c17e to use Microsoft's detection logic.
  This reference exports YAML only and must not be deployed as a custom XML clone. The custom SIT global-ipv6-address (IPv6)
  detects the same data with TestPattern's own tiers and stays the default; choose this built-in only through an explicit
  recipe include.
keywords:
- IP Address v6
- IPv6 Address
confidence: medium
confidence_justification: >-
  Medium confidence for this YAML-only record: its keyword logic finds references to the built-in entity name with Microsoft
  Purview context, not populated values. Microsoft's own recommended confidence for the entity is 75. The record does not
  claim to reproduce Microsoft's proprietary detection logic.
jurisdictions:
- global
regulations:
- GDPR
frameworks:
- CIS Controls
- ISO 27001
- NIST CSF
- SOC 2
data_categories:
- network
- pii
test_cases:
  should_match:
  - value: IP Address v6 built-in SIT
    description: Microsoft built-in entity name
  - value: IPv6 Address catalogue reference
    description: Name variant used for registry discovery
  - value: |-
      DLP policy inventory - Microsoft Purview
      Rule: Builtin-global-ip-address-v6
      Condition: IP Address v6 (built-in entity 3f691089-7413-4926-ab3b-3c5ea8a1c17e), medium confidence, instance count 1 or more
      Action: notify sender
    description: DLP rule inventory row naming the built-in entity with Microsoft Purview context
    synthetic: true
  should_not_match:
  - value: Host at 2001:db8::1
    description: Populated value or sibling reference without the built-in entity name
  - value: Network diagram legend
    description: Populated value or sibling reference without the built-in entity name
  - value: Router configuration guidance
    description: Populated value or sibling reference without the built-in entity name
false_positives:
- description: Documentation and policy inventories can mention the Microsoft built-in entity by name.
  mitigation: Treat this YAML-only record as catalogue discovery; enable the Microsoft entity for value detection.
- description: The custom SIT global-ipv6-address detects the same data; deploying both doubles matches on the same content.
  mitigation: Pick one per package. The custom SIT is the default; include this built-in only by an explicit recipe decision.
exports:
- yaml
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
  - confidence_level: 75
    id_match: Keyword_global_ip_address_v6_name
    matches:
    - ref: Evidence_microsoft_builtin_context
  keywords:
  - id: Keyword_global_ip_address_v6_name
    groups:
    - match_style: word
      terms:
      - IP Address v6
      - IPv6 Address
    strength: specific
  - id: Evidence_microsoft_builtin_context
    groups:
    - match_style: word
      terms:
      - Microsoft Purview
      - built-in SIT
      - built-in entity
      - catalogue reference
      - entity definition
    strength: domain
risk_rating: 4
risk_description: >-
  The referenced Microsoft entity detects the same data as the custom SIT global-ipv6-address, so this record carries that
  SIT's reviewed risk (4) and sensitivity labels unchanged. The built-in changes who maintains the detection logic, not what
  the matched content is worth to an attacker.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: Public
  uk_gov: OFFICIAL
  nz_gov: UNCLASSIFIED
  ca_gov: Unclassified
classification:
  tier: Low
  rationale: >-
    Tier Low is carried from the reviewed assessment of the custom SIT global-ipv6-address, which detects the same data. This
    record is a YAML-only reference to the Microsoft entity.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low with Low handling is carried from global-ipv6-address, the custom SIT for the same data.
references:
- url: https://learn.microsoft.com/en-us/purview/sit-defn-ip-address-v6
  title: IP Address v6 entity definition - Microsoft Learn
- url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-entity-definitions
  title: Sensitive information type entity definitions - Microsoft Learn
created: '2026-10-20'
updated: '2026-10-20'
author: testpattern-community
source: microsoft
license: MIT
changelog:
- version: 1.0.0
  date: '2026-10-20'
  description: >-
    Catalogue reference for the Microsoft built-in IP Address v6 (GUID 3f691089-7413-4926-ab3b-3c5ea8a1c17e, from the tenant
    SIT inventory and the Microsoft Learn entity definition). In no block: packages take it only by explicit recipe include.
