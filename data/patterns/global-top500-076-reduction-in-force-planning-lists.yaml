schema: testpattern/v1
name: Reduction-in-force planning lists
slug: global-top500-076-reduction-in-force-planning-lists
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects reduction-in-force and redundancy selection lists, voluntary separation offers and employees-requiring-placement records that name employees, with separation dates, redundancy or severance amounts, years of service or placement status.
operation: >-
  Primary: a workforce-reduction phrase (reduction in force, workforce reduction, position elimination/abolition, redundancy list/selection/pool, voluntary separation offer, affected employees, employees requiring placement, surplus employee). 75 tier requires a populated person field (employee/staff name or number, payroll number, position number or title, work unit) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated separation detail (separation/notice date, redundancy/severance amount, years of service, or redeployment/redundant status) and an independent corroborative term (consultation, restructure, organisational change, change management plan, National Employment Standards). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:reduction\s+in\s+force|workforce\s+reduction|position\s+(?:elimination|abolition)|positions?\s+abolished|redundancy\s+(?:list|selection|pool)|voluntary\s+(?:separation|redundancy)\s+(?:program|programme|offer)|involuntary\s+separation|RIF\s+list|affected\s+employees?|employees?\s+requiring\s+placement|surplus\s+(?:employee|staff))\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Public Sector Act 2022 (Qld)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - consultation
    - restructure
    - organisational change
    - change management plan
    - National Employment Standards
    - Directive 06/14
    - outplacement
    - EAP
  proximity: 300
test_cases:
  should_match:
    - value: "Workforce reduction - confidential selection list\nEmployee name: Avery Teston\nPosition number: 30012345\nYears of service: 12.5\nRedundancy payment: $86,420\nProposed separation date: 30/11/2026\nConsultation meeting held; outplacement offered."
      description: '85: Selection list row with employee, service, payment and separation date'
      synthetic: true
    - value: "RIF list v3\nEmployee ID: 5520117\nStatus: Redeployment\nNotice date: 2026-10-15\nOrganisational change plan step 4 complete."
      description: '85: RIF list row with status and notice date'
      synthetic: true
    - value: "Affected employees - restructure\nStaff number: P0048213\nPosition title: Team Leader, Records\nNotified in the first round of meetings."
      description: '75: Affected employee list naming staff, no separation detail'
      synthetic: true
  should_not_match:
    - value: Before any workforce reduction, employers must consult affected employees and consider redeployment. This fact sheet explains redundancy pay under the National Employment Standards.
      description: Fact sheet - must stay below 75
    - value: "Redundancy selection list\nEmployee name: __________\nYears of service: ___\nSeparation date: ___/___/____"
      description: Blank list template - must stay below 75
    - value: The company announced a workforce reduction of 400 roles in a media release, citing lower demand.
      description: News / media release - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_076_reduction_in_force_planning_lists_primary
      matches:
        - ref: Regex_top500_076_reduction_in_force_planning_lists_person_field
        - ref: Regex_top500_076_reduction_in_force_planning_lists_record_detail
        - ref: Keyword_top500_076_reduction_in_force_planning_lists_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_076_reduction_in_force_planning_lists_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_076_reduction_in_force_planning_lists_primary
      matches:
        - ref: Regex_top500_076_reduction_in_force_planning_lists_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_076_reduction_in_force_planning_lists_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_076_reduction_in_force_planning_lists_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_076_reduction_in_force_planning_lists_primary
      pattern: >-
        (?i)\b(?:reduction\s+in\s+force|workforce\s+reduction|position\s+(?:elimination|abolition)|positions?\s+abolished|redundancy\s+(?:list|selection|pool)|voluntary\s+(?:separation|redundancy)\s+(?:program|programme|offer)|involuntary\s+separation|RIF\s+list|affected\s+employees?|employees?\s+requiring\s+placement|surplus\s+(?:employee|staff))\b
    - id: Regex_top500_076_reduction_in_force_planning_lists_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_076_reduction_in_force_planning_lists_record_detail
      pattern: >-
        (?i)\b(?:separation|termination|exit|last\s+day|notice)\s+date\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|\b(?:redundancy|severance|separation|termination|notice|VSP|VRP)\s*(?:pay|payment|amount|estimate|entitlement)?\s*(?:\([^)]{1,20}\))?\s*[:\-]\s*(?:(?:AUD|USD|GBP|NZD|A\$|US\$|NZ\$|\$|£|€)\s?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?)|\b(?:years\s+of\s+service|length\s+of\s+service|continuous\s+service|service\s+years)\s*[:\-]\s*\d{1,2}(?:\.\d{1,2})?|\b(?:status|outcome|decision)\s*[:\-]\s*(?:redeploy(?:ed|ment)|retained|redundant|displaced|surplus|placement)
  keywords:
    - id: Keyword_top500_076_reduction_in_force_planning_lists_corroborative
      groups:
        - match_style: word
          terms:
            - consultation
            - restructure
            - organisational change
            - change management plan
            - National Employment Standards
            - Directive 06/14
            - outplacement
            - text: EAP
              case_sensitive: true
      strength: specific
    - id: Keyword_top500_076_reduction_in_force_planning_lists_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a reduction-in-force, redundancy selection or placement list naming employees about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Pre-announcement disclosure exposes which identifiable employees are to lose their jobs and their payouts, with industrial, commercial and personal consequences. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 reconciles to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the SENSITIVE Personal-Privacy DLM, SENS_Pvc, and
    Medium tier for pre-decision workforce reduction lists. The next PROTECTED level is not met because a normal
    redundancy plan is not a Cabinet decision, critical-service contingency, protected staffing operation, or
    market-wide significant-damage event.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium and Medium Personal-Privacy handling fit planned redundancy lists that directly affect employees
      and expose confidential organisational decisions before announcement.
