schema: testpattern/v1
name: Neural & Neurotechnology Data
slug: global-neural-data
version: 1.4.0
type: regex
pattern_class: concept
engine: universal
description: >-
  Detects references to neural / neurotechnology data: brain-computer interface signals, EEG/EMG
  recordings, evoked potentials, neural decoding output and neurofeedback data. Colorado HB24-1058
  and California SB 1223 both classify neural data as sensitive personal information. Topic-grade
  vocabulary detector, not a fixed-format detector.
operation: >-
  The primary regex matches neural/neurotechnology vocabulary (EEG, BCI, neural data/signals/recordings, electrode montage, evoked potentials, neurofeedback, EMG, P300, fMRI BOLD, neural decoding, spike trains, local field potentials). 65 (discovery only): term alone - research papers, product pages and news stay here. 75: term plus a populated subject identifier field (name, DOB, subject/participant/patient/user/device/session ID). 85: subject field plus a populated recording field (channels, sampling rate, montage, epoch, reference electrode, impedance, recording date/duration, session date, headset, device serial) plus independent linkage evidence (microvolt, artifact rejection, seizure, epileptiform, linked diagnosis, consent form, calibration, raw export). Template and public-research/guidance framing excluded from 75/85. Converted from keyword_list to regex.
pattern: (?i)\b(?:EEG|electroencephalogram|electroencephalography|BCIs?|brain[\s-]+computer\s+interfaces?|neural\s+data|neural\s+signals?|neural\s+recordings?|electrode\s+montage|evoked\s+potentials?|neurofeedback|brain\s+activity\s+data|neural\s+interfaces?|EMG|electromyography|electromyograph|P300|fMRI\s+BOLD|BOLD\s+signal|neural\s+decoding|neural\s+spike\s+trains?|neurotechnolog(?:y|ies)|cortical\s+activity|neural\s+oscillations?|local\s+field\s+potentials?)\b
confidence: low
confidence_justification: >-
  Low: vocabulary-grade detector. Enforce tiers now require a populated subject identifier; 85 also needs a recording field and linkage evidence, so papers and product copy stay at 65.
jurisdictions:
  - global
  - us
regulations:
  - CCPA/CPRA
  - GDPR
frameworks:
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - pii
  - biometric
  - health
corroborative_evidence:
  keywords:
    - neurodata
    - neural recording
    - brain activity
    - electrode
    - subject
    - patient
    - consent
    - neurotechnology
  proximity: 300
test_cases:
  should_match:
    - value: "EEG recording export\nPatient name: Morgan Ellisdale\nSubject ID: N-204\nRecording date: 12/08/2026\nChannels: 32 (10-20 montage)\nSampling rate: 256 Hz\nEpileptiform discharges noted after artifact rejection; linked diagnosis on file."
      description: Subject-linked EEG export with populated recording fields and clinical linkage evidence (85)
      synthetic: true
    - value: "BCI calibration session\nParticipant ID: P-0917\nNotes: participant completed the neural signal calibration without discomfort."
      description: Subject-linked BCI session note with an identifier only (75)
      synthetic: true
    - value: "The BCI captured neural signal data during the calibration trial."
      description: BCI and neural signal terms present
    - value: "P300 evoked potential amplitudes were logged per participant."
      description: Evoked potential / P300 neurotechnology terms
    - value: "fMRI BOLD time series stored alongside the neural decoding output."
      description: fMRI BOLD and neural decoding terms
  should_not_match:
    - value: "The quarterly sales report shows revenue grew across all regions."
      description: Unrelated business prose, no neural terms
    - value: "Please update the egg supplier contract before the audit."
      description: Near-miss prose ("egg" is not EEG), no neural vocabulary
    - value: "The marketing team reviewed the new brand guidelines yesterday."
      description: Unrelated prose with no neurotechnology terms
    - value: "Published study: scalp sensor subject N-204, channel Fp1 sampled at 256 Hz."
      description: Adjacent public-research language is not an authored neural-data primary
    - value: "Sample template: scalp sensor subject N-204, channel Fp1 sampled at 256 Hz."
      description: Adjacent template language is not a neural-data record
    - value: "Patient ECG recording channel II sampled at 256 Hz."
      description: Sibling cardiac signal record does not satisfy the neural-data primary
    - value: "Policy guidance: this procedure explains how neural data and EEG recordings are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "EEG session log\nSubject ID: ____________________\nRecording date: ____________________\nChannels: ____________________\nSampling rate: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: two states now treat neural data from consumer EEG headsets as sensitive information, and researchers welcomed the brain-computer interface rules."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: >-
      Acronyms EEG/EMG/BCI/P300/BOLD can appear in unrelated medical-device engineering,
      signal-processing, or gaming literature without referring to an identifiable person's data.
    mitigation: >-
      Require corroborative keywords (subject, patient, recording, consent, neurotechnology) within
      the proximity window and treat single bare-acronym hits as low confidence.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: broad
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_neural_data_topic
      matches:
        - ref: Regex_global_neural_data_subject_fields
        - ref: Regex_global_neural_data_recording_fields
        - ref: Evidence_neural_linkage_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_neural_data_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_neural_data_topic
      matches:
        - ref: Regex_global_neural_data_subject_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_neural_data_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_neural_data_topic
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_neural_data_topic
      pattern: (?i)\b(?:EEG|electroencephalogram|electroencephalography|BCIs?|brain[\s-]+computer\s+interfaces?|neural\s+data|neural\s+signals?|neural\s+recordings?|electrode\s+montage|evoked\s+potentials?|neurofeedback|brain\s+activity\s+data|neural\s+interfaces?|EMG|electromyography|electromyograph|P300|fMRI\s+BOLD|BOLD\s+signal|neural\s+decoding|neural\s+spike\s+trains?|neurotechnolog(?:y|ies)|cortical\s+activity|neural\s+oscillations?|local\s+field\s+potentials?)\b
    - id: Regex_global_neural_data_subject_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|(?:subject|participant|patient|user|device|session|recording)\s*(?:no\.?|number|ID)|subject|participant|patient(?:\s+name)?)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_neural_data_recording_fields
      pattern: (?i)\b(?:channels?|sampling\s+rate|sample\s+rate|montage|epoch|reference\s+electrode|impedance|recording\s+(?:date|duration|start)|session\s+date|headset|device\s+serial)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Evidence_neural_linkage_evidence
      groups:
        - match_style: word
          terms:
            - microvolt
            - artifact rejection
            - seizure
            - epileptiform
            - linked diagnosis
            - consent form
            - calibration
            - raw export
      strength: specific
    - id: Keyword_global_neural_data_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
            - public policy document
            - public policy guidance
            - public dataset
            - aggregate statistics
            - aggregate report
            - academic paper
            - blank questionnaire
            - awareness campaign
            - published study
            - journal article
            - methods section
            - textbook
      strength: exclusion
risk_rating: 7
risk_description: >-
  This low-confidence vocabulary detector flags neurotechnology subject matter (EEG/EMG recordings, brain-computer interfaces, evoked potentials, neural signals, decoding outputs) and enforces only when it sits with a populated subject identifier. A real subject-linked recording could expose health state, cognitive responses, disability, or behavioural inferences and could be reused for profiling without consent. Bare acronyms also occur in device engineering, signal-processing, gaming, and published research, so the normal alert may need patient, subject, recording, or consent evidence before it carries direct personal harm. Risk 7 and SENSITIVE reflect the credible sensitivity of actual neural data, while risk 8 or PROTECTED requires an identifiable recording, consequential inference, bulk research cohort, or safety-critical use.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
