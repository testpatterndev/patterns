changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): converted keyword_list to regex; 75 was gated by signal-structure keywords that repeated the primary ('electrode montage') and appear in papers. 75 now requires a populated subject identifier and 85 requires subject fields plus a populated recording field plus independent linkage evidence. Tests: added populated subject-linked records and policy, blank-form and news decoys; kept the vocabulary probes."
  - version: 1.3.0
    date: '2026-07-19'
    description: 'Targeted blocker remediation: add a 65 neural-topic discovery tier, a 75 structured-signal tier, and an 85 subject-linked structured-record tier, with exact-tier and sibling/public/template probes.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1549 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.0
    date: '2026-07-04'
    description: 'PDF-safety: literal inter-word spaces in phrase alternation replaced with \s+ (and brain-computer/brain computer hyphen variants merged into brain[\s-]+computer)'
