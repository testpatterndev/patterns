schema: testpattern/v1
name: Configuration baseline snapshots
slug: global-top500-319-configuration-baseline-snapshots
version: 1.3.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects configuration baseline snapshots: baseline/snapshot wording with actual device or OS configuration lines and populated snapshot metadata. Topic wording alone is discovery-only.
operation: >-
  Regex_config_baseline_primary (configuration baseline, baseline snapshot, golden image, CIS/STIG/SOE baseline or config-snapshot wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a device or OS configuration line (hostname/interface/ip address/snmp-server/access-list, Junos set, password/lockout/UAC/sshd settings) or a populated snapshot metadata field (captured/snapshot date, baseline version, device, OS version, build, firmware). 85 requires a device or OS configuration line (hostname/interface/ip address/snmp-server/access-list, Junos set, password/lockout/UAC/sshd settings) (two distinct hits), a populated snapshot metadata field (captured/snapshot date, baseline version, device, OS version, build, firmware), and independent compliance-drift (drift, deviation, compliant, hardening) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_config_baseline_guidance_exclusion).
pattern: >-
  (?i)\b(?:configuration\s+baseline|baseline\s+(?:configuration|snapshot|build)|golden\s+(?:image|config(?:uration)?)|(?:CIS|STIG|SOE)\s+baseline|running[\s-]config(?:uration)?\s+(?:backup|snapshot)|config(?:uration)?\s+snapshot)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a device or OS configuration line (hostname/interface/ip address/snmp-server/access-list, Junos set, password/lockout/UAC/sshd settings) or a populated snapshot metadata field (captured/snapshot date, baseline version, device, OS version, build, firmware)), and 85 needs two distinct structures plus independent compliance-drift (drift, deviation, compliant, hardening) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
- CIS Controls
data_categories:
- security
corroborative_evidence:
  keywords:
  - drift
  - deviation
  - non-compliant
  - compliant
  - hardening
  - approved baseline
  - CIS Benchmark
  - checksum
  - version control
  - remediation
  proximity: 300
test_cases:
  should_match:
  - value: The configuration baseline is reviewed after each major release.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Configuration baseline snapshot
      Device: core-sw01
      OS version: IOS-XE 17.9.4
    description: Medium-tier probe (75) - populated snapshot metadata
    synthetic: true
  - value: |-
      Configuration baseline snapshot - core-sw01
      Captured: 2026-09-18 02:00
      OS version: IOS-XE 17.9.4
      hostname core-sw01
      interface GigabitEthernet1/0/1
       ip address 10.20.0.1 255.255.255.0
      snmp-server community H4rb0urRO RO
      Drift check: 2 deviations from the approved baseline (non-compliant).
    description: High-tier probe (85) - several config lines, metadata and drift context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: all servers are built from the approved configuration baseline.'
    description: Policy text
    synthetic: true
  - value: |-
      Configuration baseline template
      Device: ________
      OS version: [insert]
    description: Blank template
    synthetic: true
  - value: 'Course module 5: a golden image baseline sets MinimumPasswordLength = 14 and PasswordComplexity = 1.'
    description: Training framing
    synthetic: true
false_positives:
- description: Vendor hardening guides and CIS Benchmark documents quote settings.
  mitigation: Guidance/training framing is excluded; 85 needs two configuration lines plus snapshot metadata.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The detector now requires baseline/snapshot wording plus actual configuration lines or populated snapshot metadata before enforcing. A genuine snapshot can reveal exact settings, enabled controls, software posture, deviations, and hardening assumptions that help an attacker identify weaknesses or reproduce a trusted image. The normal affected scale is one platform, endpoint class, or managed environment and its operators, while generic baseline standards and vendor guides can match without organisation-specific values. Risk 8 SENSITIVE reflects serious contained control exposure; PROTECTED would require critical-system configurations or significant broad compromise potential.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because an operational
    baseline snapshot reveals detailed security and configuration posture. PROTECTED is not met without evidence of
    critical scope, complete privileged configuration, exploitable weakness, or significant damage.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic handling is Medium with Medium InfoTech controls for configuration snapshots and golden-image details.
      High is reserved for critical or protected platform baselines whose disclosure would materially enable significant
      compromise.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_config_baseline_primary
    matches:
    - ref: Regex_config_baseline_config_line
      min_count: 2
      unique_results: true
    - ref: Regex_config_baseline_snapshot_meta
    - ref: Keyword_config_baseline_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_config_baseline_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_config_baseline_primary
    matches:
    - type: any
      refs:
      - Regex_config_baseline_config_line
      - Regex_config_baseline_snapshot_meta
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_config_baseline_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_config_baseline_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_config_baseline_primary
    pattern: >-
      (?i)\b(?:configuration\s+baseline|baseline\s+(?:configuration|snapshot|build)|golden\s+(?:image|config(?:uration)?)|(?:CIS|STIG|SOE)\s+baseline|running[\s-]config(?:uration)?\s+(?:backup|snapshot)|config(?:uration)?\s+snapshot)\b
  - id: Regex_config_baseline_config_line
    pattern: >-
      \bhostname\s+[A-Za-z0-9_-]{2,63}\b|\binterface\s+(?:GigabitEthernet|TenGigabitEthernet|Ethernet|Vlan|Port-channel|ge-|xe-)[0-9/.:-]{1,20}|\bip\s+address\s+\d{1,3}(?:\.\d{1,3}){3}\s+\d{1,3}(?:\.\d{1,3}){3}|\bsnmp-server\s+community\s+[^\s]{2,64}|\baccess-list\s+\d{1,4}\s+(?:permit|deny)|\bset\s+(?:system|interfaces|security)\s+[A-Za-z0-9-]{2,40}|\b(?:MinimumPasswordLength|PasswordComplexity|LockoutBadCount|EnableLUA|LmCompatibilityLevel|PermitRootLogin|PASS_MAX_DAYS)\s*[:=]?\s*[A-Za-z0-9]{1,20}
  - id: Regex_config_baseline_snapshot_meta
    pattern: >-
      (?i)\b(?:captured|snapshot\s+(?:date|time|taken)|collected|baseline\s+(?:version|date|ID)|device|OS\s+version|build|firmware)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  keywords:
  - id: Keyword_config_baseline_context
    groups:
    - match_style: word
      terms:
      - drift
      - deviation
      - non-compliant
      - compliant
      - hardening
      - approved baseline
      - CIS Benchmark
      - checksum
      - version control
      - remediation
    strength: specific
  - id: Keyword_config_baseline_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
created: '2026-02-08'
updated: '2026-09-25'
