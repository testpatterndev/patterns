schema: testpattern/v1
name: Phishing simulation results
slug: global-top500-293-phishing-simulation-results
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects phishing simulation result exports: simulation-result wording with per-user outcome rows (email plus clicked/submitted/reported) and numeric campaign metrics. Discussions of phishing simulations are discovery-only.
operation: >-
  Regex_phish_sim_primary (phishing-simulation results/report/export wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a per-user outcome row (email address with clicked/submitted/reported/no action) or a campaign metric with a number (click/report/submission rate, emails sent, recipients). 85 requires a per-user outcome row (email address with clicked/submitted/reported/no action) (two distinct hits), a campaign metric with a number (click/report/submission rate, emails sent, recipients), and independent campaign-follow-up (remedial training, repeat clicker, lure, department/manager) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_phish_sim_guidance_exclusion).
pattern: >-
  (?i)\b(?:phishing\s+(?:simulation|campaign|test|exercise)\s+(?:results?|report|export|summary)|simulated\s+phishing\s+(?:campaign|results?|report)|(?:KnowBe4|Gophish|Cofense\s+PhishMe|Attack\s+Simulation\s+Training)\s+(?:results?|report|export|campaign))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a per-user outcome row (email address with clicked/submitted/reported/no action) or a campaign metric with a number (click/report/submission rate, emails sent, recipients)), and 85 needs two distinct structures plus independent campaign-follow-up (remedial training, repeat clicker, lure, department/manager) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Privacy Act 1988 (Cth)
- GDPR
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
- pii
corroborative_evidence:
  keywords:
  - remedial training
  - repeat clicker
  - landing page
  - lure
  - department
  - manager
  - payload
  - sender spoof
  - business unit
  - follow-up
  proximity: 300
test_cases:
  should_match:
  - value: The quarterly phishing simulation results will be presented to the audit committee.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Phishing simulation results - September campaign
      Emails sent: 1240
      Click rate: 7.4%
    description: Medium-tier probe (75) - numeric campaign metrics
    synthetic: true
  - value: |-
      Phishing simulation results - "Payroll update" lure
      Emails delivered: 1240; click rate: 7.4%
      avery.teston@harbourhealth.org.au, Finance, clicked
      jordan.staffson@harbourhealth.org.au, Payroll, submitted credentials
      riley.marsh@harbourhealth.org.au, ICT, reported
      Repeat clicker list forwarded to each department manager for remedial training.
    description: High-tier probe (85) - per-user outcome rows, metrics and follow-up context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: all staff complete a phishing simulation exercise each quarter; results are reported in aggregate.'
    description: Policy text
    synthetic: true
  - value: |-
      Phishing simulation results template
      Email: ________
      Outcome: [insert]
    description: Blank template
    synthetic: true
  - value: 'Media release: industry phishing test report finds the average click rate fell to 4.1% this year.'
    description: News framing with an aggregate metric
    synthetic: true
false_positives:
- description: Vendor reports publish aggregate industry click rates.
  mitigation: Aggregate metrics alone reach 75 only with result wording; news/press framing is excluded and 85 needs per-user rows.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_phish_sim_primary
    matches:
    - ref: Regex_phish_sim_user_outcome
      min_count: 2
      unique_results: true
    - ref: Regex_phish_sim_campaign_metric
    - ref: Keyword_phish_sim_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_phish_sim_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_phish_sim_primary
    matches:
    - type: any
      refs:
      - Regex_phish_sim_user_outcome
      - Regex_phish_sim_campaign_metric
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_phish_sim_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_phish_sim_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_phish_sim_primary
    pattern: >-
      (?i)\b(?:phishing\s+(?:simulation|campaign|test|exercise)\s+(?:results?|report|export|summary)|simulated\s+phishing\s+(?:campaign|results?|report)|(?:KnowBe4|Gophish|Cofense\s+PhishMe|Attack\s+Simulation\s+Training)\s+(?:results?|report|export|campaign))\b
  - id: Regex_phish_sim_user_outcome
    pattern: >-
      (?i)\b[a-z0-9._%+-]{1,64}@[a-z0-9.-]{1,100}\.[a-z]{2,24}\b[\s,;|\t]{1,20}(?:[A-Za-z &/-]{1,40}[\s,;|\t]{1,5}){0,2}(?:clicked|opened|submitted\s+(?:data|credentials)|reported|no\s+action|entered\s+credentials|attachment\s+opened)\b
  - id: Regex_phish_sim_campaign_metric
    pattern: >-
      (?i)\b(?:click(?:ed)?\s+rate|report(?:ed|ing)?\s+rate|submission\s+rate|credentials?\s+submitted|emails?\s+(?:sent|delivered)|recipients|failure\s+rate|phish[\s-]prone\s+percentage)\s*[:=]?\s*\d{1,5}(?:\.\d{1,2})?\s*%?
  keywords:
  - id: Keyword_phish_sim_context
    groups:
    - match_style: word
      terms:
      - remedial training
      - repeat clicker
      - landing page
      - lure
      - department
      - manager
      - payload
      - sender spoof
      - business unit
      - follow-up
    strength: specific
  - id: Keyword_phish_sim_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires phishing-simulation result wording plus per-user outcome rows or numeric campaign metrics before enforcing, so enforced hits identify individual staff outcomes. A real result set can identify employees or teams who clicked, reported, or submitted data and can expose training weaknesses useful for targeted social engineering. The affected parties are exercise participants and the organisation's security program, with scale ranging from one campaign to a workforce cohort and with generic awareness material requiring validation. Risk 8 SENSITIVE reflects serious contained personnel and defensive harm; PROTECTED would require exceptional scale or significant irreversible impact not inherent in a normal simulation report.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
