schema: testpattern/v1
name: Wage garnishment orders
slug: global-top500-087-wage-garnishment-orders
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects wage garnishee notices and earnings attachment orders served on an employer for an identified employee: ATO garnishee notices (TAA 1953 Sch 1 s 260-5), Services Australia child support and debt garnishee notices, court attachment of earnings / income withholding orders, with the amount owing or amount to deduct.
operation: >-
  Primary: a garnishment phrase (wage garnishment, garnishee notice/order, attachment of earnings order, income withholding order, child support deduction notice). Generic "court order", "debt recovery", "statutory deduction" and "writ of execution" were removed. 75 tier requires a populated debtor/employee field (employee name or ID, payroll number, debtor, customer reference number) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated deduction detail (amount owing, amount to be deducted, deduction per pay, protected earnings amount, or a deduction percentage) and an independent corroborative term (section 260-5, Taxation Administration Act, Child Support, Services Australia, remit, deductions to start, court, payroll). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:wage\s+garnishment(?:\s+orders?)?|garnishee\s+(?:notices?|orders?)|attachment\s+of\s+earnings\s+orders?|income\s+withholding\s+orders?|child\s+support\s+(?:employer\s+)?deduction\s+(?:notices?|advices?)|notice\s+to\s+deduct\s+child\s+support)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - global
regulations:
  - Taxation Administration Act 1953 (Cth) Sch 1 s 260-5
  - Child Support (Registration and Collection) Act 1988 (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - employment
  - pii
corroborative_evidence:
  keywords:
    - section 260-5
    - Taxation Administration Act
    - Child Support
    - Services Australia
    - remit
    - deductions to start
    - first pay after
    - court
    - payroll
  proximity: 300
test_cases:
  should_match:
    - value: "Garnishee notice - section 260-5, Schedule 1, Taxation Administration Act 1953\nEmployee name: Riley Teston\nPayroll number: 88213\nAmount owing: $6,420.00\nAmount to be deducted: $150.00 per pay\nDeductions to start from the first pay after 01/11/2026."
      description: "85: ATO garnishee notice with employee, payroll number, amount owing and deduction"
      synthetic: true
    - value: "Child support deduction notice\nEmployee: Casey Teston\nDeduct per fortnight: $212.00\nProtected earnings amount: $498.00\nRemit to Services Australia by the 21st of the following month."
      description: "85: child support deduction notice with employee, deduction and protected earnings"
      synthetic: true
    - value: "Attachment of earnings order\nDebtor: Jordan Staffson\nThe order has been received and payroll will be contacted separately."
      description: "75: attachment of earnings order naming the debtor, no amounts"
      synthetic: true
    - value: "garnishee notice"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "A garnishee notice is one of the firmer actions we may take to collect an unpaid tax debt. Before we issue a garnishee notice we send a warning letter."
      description: "ATO-style guidance - must stay at or below 65"
    - value: "Garnishee notice\nEmployee name: __________\nAmount owing: $__________\nAmount to be deducted: $__________"
      description: "Blank garnishee notice - must stay at or below 65"
    - value: "The court ordered wage garnishment for unpaid fines, according to a media release."
      description: "News - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Bank-account garnishee notices (not wages) carry the same phrase."
    mitigation: "Accepted: they are equally sensitive debt-enforcement records; person field still required for 75."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_087_wage_garnishment_orders_primary
      matches:
        - ref: Regex_top500_087_wage_garnishment_orders_debtor_field
        - ref: Regex_top500_087_wage_garnishment_orders_deduction_detail
        - ref: Keyword_top500_087_wage_garnishment_orders_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_087_wage_garnishment_orders_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_087_wage_garnishment_orders_primary
      matches:
        - ref: Regex_top500_087_wage_garnishment_orders_debtor_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_087_wage_garnishment_orders_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_087_wage_garnishment_orders_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_087_wage_garnishment_orders_primary
      pattern: >-
        (?i)\b(?:wage\s+garnishment(?:\s+orders?)?|garnishee\s+(?:notices?|orders?)|attachment\s+of\s+earnings\s+orders?|income\s+withholding\s+orders?|child\s+support\s+(?:employer\s+)?deduction\s+(?:notices?|advices?)|notice\s+to\s+deduct\s+child\s+support)\b
    - id: Regex_top500_087_wage_garnishment_orders_debtor_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?|(?:judgment\s+)?debtor(?:\s+name)?|customer\s+reference\s+number|CRN|client\s+reference|obligor|paying\s+parent)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_087_wage_garnishment_orders_deduction_detail
      pattern: >-
        (?i)\b(?:amount\s+(?:owing|owed|outstanding|of\s+(?:the\s+)?debt|to\s+be\s+deducted)|deduction\s+amount|deduct(?:ion)?\s+per\s+(?:pay|week|fortnight|month)|total\s+debt|protected\s+earnings(?:\s+amount)?|garnishment\s+amount)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?|\b(?:deduct|deduction\s+rate)[ \t]{0,3}[:\-]?[ \t]{0,3}\d{1,2}(?:\.\d{1,2})?[ \t]?%
  keywords:
    - id: Keyword_top500_087_wage_garnishment_orders_corroborative
      groups:
        - match_style: word
          terms:
            - section 260-5
            - Taxation Administration Act
            - Child Support
            - Services Australia
            - remit
            - deductions to start
            - first pay after
            - court
            - payroll
      strength: specific
    - id: Keyword_top500_087_wage_garnishment_orders_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - what is a garnishee notice
            - we may ask you
            - firmer action
            - before we issue
            - you may receive
      strength: domain
risk_description: >-
  The classifier identifies garnishee notices or earnings attachment orders for an identified employee (75) with amounts owing or to be deducted (85). These reveal tax, child support or court debts of an individual. Guidance, blank notices and news stay at 65. Risk 4 supports OFFICIAL; handle bulk garnishee registers as SENSITIVE.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: "ATO - Garnishee notice (issued under Taxation Administration Act 1953 Sch 1 s 260-5)"
    url: https://www.ato.gov.au/individuals-and-families/paying-the-ato/if-you-don-t-pay/firmer-action-we-may-take/garnishee-notice
  - title: "Taxation Administration Act 1953 (Cth)"
    url: https://www.legislation.gov.au/C1953A00001/latest/text
  - title: "Services Australia - Garnishee notice to employers for deductions from salaries or wages"
    url: https://www.servicesaustralia.gov.au/garnishee-notice-to-employers-for-deductions-from-salaries-or-wages
  - title: "Services Australia - Child Support information for employers"
    url: https://www.servicesaustralia.gov.au/child-support-information-for-employers
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
