schema: testpattern/v1
name: Queensland Elector Participation Data (Who Voted, How and Where)
slug: au-qld-elector-participation-data
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Post-election elector participation data ("election and elector information") that the Electoral Commission of Queensland releases on request to registered political parties, independent members and, for council elections, councillors: for each elector who voted, their name and address, whether they voted in person, by post or in another way, and the polling booth location (Electoral Act 1992 s 133A; LG Fact Sheet 04). Also marked-roll extracts that record which electors voted. The data may be used only for an election-related purpose (s 133A(6), maximum 200 penalty units) and never includes silent electors (s 133A(5)). Booth-level results, turnout statistics, results by vote type and the fact sheet are decoys.
operation: >-
  Primary: election and elector information, elector (participation) information or data, voter / elector participation, marked (electoral / voters / certified) roll or list, voted in person / by post / (in an)other way, vote / voting method or type, how (the elector) voted, or section / s 133A. 65 is discovery-only (primary alone) and surfaces results, turnout statistics and the fact sheet. 75 requires, within 300 characters, a populated elector name: a delimited surname and given names followed by a street address, or a labelled elector / voter / name / surname / family name field with a non-placeholder value. 85 requires a delimited elector row with a street address AND a vote-method value (in person, by post, postal, pre-poll, early vote, ordinary or other way, either in a column after the address or as a labelled vote method / how voted / voted field) AND a polling booth value (a labelled polling booth / place / voting centre field, or a column value ending State School, Community / Civic / Early Voting / Pre-poll Centre, Hall, PCYC, Library or Uniting Church), plus an independent electoral context term. Every tier excludes template/fixture text; enforce tiers also exclude fact-sheet / FAQ / legislation-site wording and results wording (formal / informal votes, two-candidate preferred, first preferences).
pattern: >-
  (?i)\b(?:election\s+and\s+elector\s+information|elector\s+(?:participation\s+)?(?:information|data)|(?:voter|elector)\s+participation|marked\s+(?:electoral\s+|voters'?\s+|certified\s+)?(?:rolls?|lists?)|voted\s+(?:in\s+person|by\s+post|(?:in\s+)?(?:an)?other\s+way)|(?:vote|voting)\s+(?:method|type)|how\s+(?:the\s+elector\s+)?voted|(?:section|s)\s{0,2}133A)\b
confidence: medium
confidence_justification: >-
  Medium: the s 133A wording is distinctive, but vote-method and polling-place vocabulary is shared with published results, turnout statistics and the ECQ fact sheet, so enforce tiers need populated elector names and 85 needs name-and-address rows with per-elector vote method and booth values. The column layout of ECQ's s 133A release is not published, so the row shapes are generic. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Electoral Act 1992 (Qld)
  - Local Government Electoral Act 2011 (Qld)
  - Commonwealth Electoral Act 1918 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government
corroborative_evidence:
  keywords:
    - elector
    - election
    - polling
    - registered political party
    - councillor
    - close of roll
    - division
    - district
    - ECQ
  proximity: 300
test_cases:
  should_match:
    - value: "Election and elector information (Electoral Act 1992 s 133A) - Stafford district, 2028 state general election, supplied to a registered political party\nSurname, Given names, Address, Suburb, Postcode, How voted, Polling booth\nTESTON, Avery James, 14 Wattlebird Street, STAFFORD, 4053, In person, Stafford State School\nTESTON, Morgan Lee, 27 Carrington Avenue, STAFFORD, 4053, By post, Postal\nSTAFFSON, Riley, 8 Sandpiper Court, GRANGE, 4051, In person, Grange Community Hall"
      description: s 133A dataset with name, address, vote method and polling booth columns (85 tier)
      synthetic: true
    - value: "Elector participation data - Harbourview Regional Council, Division 3 (requested by councillor after the election)\nTeston\tCasey\t19 Kestrel Close\tNORMAN PARK\tPre-poll\tNorman Park Early Voting Centre\nStaffson\tJordan\t3 Harlow Road\tLOGAN CENTRAL\tIn person\tLogan Central PCYC"
      description: Council elector participation data, tab-delimited (85 tier)
      synthetic: true
    - value: "Marked roll - Stafford district, 2028 state general election\nElector: Avery Teston  Voted: Yes\nElector: Morgan Teston  Voted: Yes"
      description: Marked roll with named electors and a voted indicator (75 tier)
      synthetic: true
    - value: "Elector participation information\nName: Riley Staffson\nHow voted: in person"
      description: Single elector participation record with name and vote method, no address (75 tier)
      synthetic: true
  should_not_match:
    - value: "Stafford district - results by polling booth\nPolling booth: Stafford State School\nVote type: Ordinary\nFormal votes: 2,341  Informal votes: 58\nTESTON, Avery (Independent) 1,102\nSTAFFSON, Riley (Teston Community Party) 1,239"
      description: Booth-level aggregate results by vote type
    - value: "Turnout at the 2028 state general election was 88.4 per cent. About 1.2 million electors voted in person on election day, 640,000 voted early and 410,000 voted by post."
      description: Turnout statistics
    - value: "After the election, councillors and registered political parties may ask for each elector's name and address as at close of roll, whether the elector voted in person, by post, or in another way, and the polling booth location. Information about silent electors is not released. (Local Government Fact Sheet 04)"
      description: LG fact sheet 04 text
    - value: "Request for election and elector information (s 133A) - blank template\nElector name: __________\nHow voted: [ ] In person  [ ] By post  [ ] Other\nPolling place: __________"
      description: Blank request form
    - value: "Electoral Act 1992 s 133A(4): the elector information is the elector's name and address, whether the elector voted in person, by post or another way, and the location of the polling place."
      description: Legislation text
false_positives:
  - description: Published results by polling booth or by vote type, turnout statistics and the ECQ fact sheet use the same vote-method and polling-place vocabulary.
    mitigation: None carry populated elector names, so they stay at 65; results wording (formal / informal votes, two-candidate preferred, first preferences) and fact-sheet wording are excluded from enforce tiers.
  - description: Scrutineer or campaign notes that name a voter and record that they voted or the booth they attended.
    mitigation: Reach 75 when an s 133A-style phrase is present. They record an individual's participation and are in scope.
  - description: Overlap with au-qld-electoral-roll-extract.
    mitigation: A s 133A dataset whose cover text also says "roll" can fire the roll extract classifier at 75. Both carry SENSITIVE Electoral Roll, so the co-fire does not change the label. Silent electors are excluded from s 133A releases by law, so au-qld-silent-elector-record should not co-fire on a genuine release.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_elector_participation_data_primary
      matches:
        - ref: Regex_au_qld_elector_participation_data_elector_row
        - ref: Regex_au_qld_elector_participation_data_vote_method
        - ref: Regex_au_qld_elector_participation_data_booth
        - ref: Keyword_au_qld_elector_participation_data_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_elector_participation_data_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_elector_participation_data_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_elector_participation_data_elector_row
            - Regex_au_qld_elector_participation_data_name_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_elector_participation_data_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_elector_participation_data_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_elector_participation_data_primary
      pattern: >-
        (?i)\b(?:election\s+and\s+elector\s+information|elector\s+(?:participation\s+)?(?:information|data)|(?:voter|elector)\s+participation|marked\s+(?:electoral\s+|voters'?\s+|certified\s+)?(?:rolls?|lists?)|voted\s+(?:in\s+person|by\s+post|(?:in\s+)?(?:an)?other\s+way)|(?:vote|voting)\s+(?:method|type)|how\s+(?:the\s+elector\s+)?voted|(?:section|s)\s{0,2}133A)\b
    - id: Regex_au_qld_elector_participation_data_elector_row
      pattern: >-
        \b[A-Z][A-Za-z'-]{1,30}(?:[ \t]{0,3}[\t,|;][ \t]{0,3}|[ ]{2,6})[A-Z][A-Za-z'-]{1,30}(?:[ ][A-Z][A-Za-z'-]{1,30}){0,2}(?:[ \t]{0,3}[\t,|;][ \t]{0,3}|[ ]{2,6})(?:(?:Unit|Lot|Apt|Flat)[ ])?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ ]{1,3}[A-Z][A-Za-z'-]{1,20}(?:[ ][A-Z][A-Za-z'-]{1,20}){0,2}[ ]{1,3}(?:Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Court|Ct|Crescent|Cres|Place|Pl|Parade|Pde|Terrace|Tce|Lane|Ln|Way|Close|Cl|Highway|Hwy|Boulevard|Bvd|Circuit|Cct|Grove|Gr|Esplanade|Esp)\b
    - id: Regex_au_qld_elector_participation_data_name_field
      pattern: >-
        (?i)\b(?:elector(?:'s)?(?:\s+(?:full\s+)?name)?|voter(?:\s+name)?|surname|family\s+name|(?<![A-Za-z] )(?:full\s+)?name)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}(?:[ \t][A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_au_qld_elector_participation_data_vote_method
      pattern: >-
        (?i)\b(?:(?:vote|voted|voting)\s+(?:method|type)|how\s+voted|voted)\s*[:#]\s*(?:in\s+person|by\s+post|postal(?:\s+vote)?|pre-?poll|early(?:\s+vote)?|ordinary|other(?:\s+way)?)\b|\b(?:Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Court|Ct|Crescent|Cres|Place|Pl|Parade|Pde|Terrace|Tce|Lane|Ln|Way|Close|Cl|Highway|Hwy|Boulevard|Bvd|Circuit|Cct|Grove|Gr|Esplanade|Esp)\b[^\r\n]{0,60}?(?:[ \t]{0,3}[\t,|;][ \t]{0,3}|[ ]{2,6})(?:in\s+person|by\s+post|postal|pre-?poll|early\s+vote|ordinary|other\s+way)\b
    - id: Regex_au_qld_elector_participation_data_booth
      pattern: >-
        (?i)\b(?:polling\s+(?:booth|place)|booth|voting\s+(?:centre|location))(?:\s+(?:name|location))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{2,30}|(?:[ \t]{0,3}[\t,|;][ \t]{0,3}|[ ]{2,6})[A-Z][A-Za-z'-]{1,25}(?:[ ][A-Z][A-Za-z'-]{1,25}){0,3}[ ](?:State\s+(?:High\s+)?School|(?:Community|Civic|Cultural|Early\s+Voting|Pre-?poll(?:ing)?|Neighbourhood)\s+Centre|(?:Memorial|Community|Town|Church|Scout|School|Public)\s+Hall|PCYC|Library|Uniting\s+Church)\b
    - id: Regex_au_qld_elector_participation_data_exclusion
      pattern: >-
        (?i)(?:\bfact\s?sheet\b|\bfrequently\s+asked\s+questions\b|\blegislation\.qld\.gov\.au\b|\b(?:formal|informal)\s+votes\b|\btwo[\s-]+candidate[\s-]+preferred\b|\bfirst\s+preferences?\b)
  keywords:
    - id: Keyword_au_qld_elector_participation_data_corroborative
      groups:
        - match_style: word
          terms:
            - elector
            - electors
            - election
            - polling
            - registered political party
            - councillor
            - close of roll
            - division
            - district
            - ward
            - text: ECQ
              case_sensitive: true
            - Electoral Commission
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies elector participation data released under Electoral Act 1992 s 133A (and the council equivalent): named electors with their home address, whether they voted in person, by post or another way, and the polling booth they used. This is roll-derived personal information that reveals individual voting behaviour and movements, released only to parties, independent members and councillors for election purposes (misuse up to 200 penalty units, s 133A(6)). Bulk disclosure enables voter profiling and targeting outside the permitted purpose. Results, turnout statistics, the fact sheet and blank forms are excluded from enforce tiers. Risk 8 supports SENSITIVE Electoral Roll.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Electoral Roll
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Electoral Act 1992 (Qld) - s 133A Election and elector information
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1992-028
  - title: Local Government Electoral Act 2011 (Qld)
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-2011-027
  - title: Commonwealth Electoral Act 1918 - s 90B
    url: https://www.legislation.gov.au/C1918A00027/latest/text
  - title: ECQ - Local Government Fact Sheet 04 (roll data for candidates, July 2025)
    url: https://www.ecq.qld.gov.au/
created: '2026-09-24'
updated: '2026-09-24'
