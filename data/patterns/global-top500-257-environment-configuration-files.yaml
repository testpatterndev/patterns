schema: testpattern/v1
name: Environment configuration files
slug: global-top500-257-environment-configuration-files
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies environment and application configuration files (.env, appsettings.json, application.properties/yml, web.config) with populated configuration: environment variable assignments, connection/host values or config sections. Secret values themselves are handled by the credential classifiers.
operation: >-
  Regex_environment_config_files (.env / .env.<environment>, appsettings*.json, application*.properties|yml, web.config, dotenv file, environment configuration/variables file) is discovery-only at 65. 75 requires one structure: an UPPER_SNAKE environment variable assignment with a non-placeholder value, a connection URL or internal host, or a config section (INI [database], "ConnectionStrings": {, spring.datasource.*=). 85 requires two distinct structures plus environment context (production, staging, do not commit, secrets manager, key vault, rotate). Placeholder values (<redacted>, ${VAR}, xxxx, ***) do not count. Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: (?i)(?:(?<![\w.])\.env(?:\.(?:local|production|prod|staging|development|dev|test))?\b|\bappsettings(?:\.[A-Za-z]{2,20})?\.json\b|\bapplication(?:-[a-z]{2,20})?\.(?:properties|ya?ml)\b|\bweb\.config\b|\bdotenv\s+file\b|\benvironment\s+(?:configuration|variables?)\s+(?:file|for\s+(?:production|staging|prod))\b)
confidence: medium
confidence_justification: >-
  Medium confidence: file-name wording is discovery-only; enforcement requires populated assignments, hosts or sections, and 85 adds a second structure and environment context.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
  - CIS Controls
data_categories:
  - security
  - technology
corroborative_evidence:
  keywords:
    - production
    - staging
    - do not commit
    - secrets manager
    - key vault
  proximity: 300
test_cases:
  should_match:
    - value: |-
        .env.production for the rates-api service (do not commit)
        APP_ENV=production
        DB_HOST=rates-db01.example.internal
        DB_PORT=5432
        DB_USER=rates_app
        DB_PASSWORD=<redacted>
        REDIS_URL=redis://cache01.example.internal:6379
        SMTP_HOST=relay.example.internal
      description: High tier (85) - env assignments and connection hosts with production/do-not-commit context (secret value redacted)
      synthetic: true
    - value: |-
        appsettings.Production.json
        {
          "ConnectionStrings": {
            "RatesDb": "<redacted>"
          }
        }
      description: Medium tier (75) - config section only
      synthetic: true
    - value: 'application.properties for the permits service: spring.datasource.url = <redacted>'
      description: Medium tier (75) - spring datasource key only
      synthetic: true
    - value: Remember to add the new flag to the .env file before you restart the container.
      description: Discovery tier (65) - file wording only
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: 'Secrets management guidance note: organisations should keep .env files out of source control and load credentials from a secrets manager.'
      description: Guidance text
    - value: |-
        .env blank template
        DB_HOST=
        DB_PORT=
        DB_PASSWORD=
      description: Blank template
    - value: 'Tutorial: create a .env file with APP_ENV=development and run the demo app.'
      description: Tutorial/demo framing must not enforce
false_positives:
  - description: Framework documentation and README files show example .env and appsettings content.
    mitigation: File wording is discovery-only; enforcement needs populated non-placeholder assignments, hosts or sections, and guidance/tutorial/demo/template framing is excluded.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_environment_config_files
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_config_assignment
            - Evidence_connection_host
            - Evidence_config_section
        - ref: Keyword_environment_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_environment_config_files
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_config_assignment
            - Evidence_connection_host
            - Evidence_config_section
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_environment_config_files
  regexes:
    - id: Regex_environment_config_files
      pattern: (?i)(?:(?<![\w.])\.env(?:\.(?:local|production|prod|staging|development|dev|test))?\b|\bappsettings(?:\.[A-Za-z]{2,20})?\.json\b|\bapplication(?:-[a-z]{2,20})?\.(?:properties|ya?ml)\b|\bweb\.config\b|\bdotenv\s+file\b|\benvironment\s+(?:configuration|variables?)\s+(?:file|for\s+(?:production|staging|prod))\b)
    - id: Evidence_config_assignment
      pattern: \b(?:[A-Z][A-Z0-9]{1,30}_){1,4}(?:API_KEY|KEY|TOKEN|SECRET|PASSWORD|PASS|PWD|URL|URI|DSN|HOST|USER|USERNAME|ID|REGION|PORT|ENDPOINT|DATABASE|DB|NAME)\s{0,3}[=:]\s{0,3}[\"']?(?!_{2,}|\[|<|\$\{|x{4,}|X{4,}|\*{3,})[A-Za-z0-9/+_.:@-]{2,200}
    - id: Evidence_connection_host
      pattern: (?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqps?|sqlserver|jdbc:[a-z]{2,20}):\/\/[\w.-]{1,120}(?::\d{2,5})?|\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:hostname|host|server|asset\s+ID|device\s+ID|node|instance)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._-]{2,63}
    - id: Evidence_config_section
      pattern: (?i)\[(?:database|db|redis|smtp|auth|oauth|production|default|mysqld|client|server)\]|\"(?:ConnectionStrings|AppSettings|Kestrel|Serilog)\"\s{0,3}:\s{0,3}\{|\bspring\.(?:datasource|redis|mail)\.[a-z-]{2,40}\s{0,3}=
  keywords:
    - id: Keyword_environment_context
      groups:
        - match_style: word
          terms:
            - production
            - staging
            - do not commit
            - secrets manager
            - key vault
            - rotate
            - credentials
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
risk_description: >-
  The detector identifies environment configuration files when non-placeholder variable assignments, connection hosts or config sections are present; file wording alone is discovery-only. A genuine environment configuration can disclose hosts, endpoints, feature settings, service relationships, and references to credentials that aid reconnaissance or unauthorised changes. Generic deployment documentation and example configuration guidance can match, and the normal record may concern a non-production or limited environment. Risk 7 SENSITIVE reflects moderate operational harm from a substantive internal configuration; PROTECTED would require critical production scope, live high-impact secrets, or significant damage beyond the phrase match.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
