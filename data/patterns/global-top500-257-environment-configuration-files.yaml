  - version: 1.3.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): primary now anchors on configuration file names (.env*, appsettings*.json, application*.properties/yml, web.config) instead of generic config/connection-string/secrets-management wording; 75 requires a non-placeholder env assignment, connection URL/internal host or config section and 85 requires two distinct structures plus environment context (replaces self-corroborating topic keyword list and label-context regex); guidance/news/training exclusion added; bare-phrase tests replaced with synthetic config files (secret values redacted) and decoys. Replaced GDPR with Criminal Code Act 1995 (Cth); added ISO 27001/NIST CSF/CIS Controls frameworks and verified OWASP Secrets Management / ISM references; data_categories credentials -> technology.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1816 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
