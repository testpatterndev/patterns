schema: testpattern/v1
name: NEM System Restart Plan or Local Black System Procedure
slug: au-nem-system-restart-black-system-procedure
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed system restart material for a named National Electricity Market generating system or network: local black system procedures (LBSPs) that generators, integrated resource providers and network service providers must prepare and submit to AEMO for approval under NER cl 4.8.12(d)-(g), and extracts of the AEMO system restart plan, which NER cl 4.8.12(b) makes confidential information. Such a record holds plant and unit data, units that can restart without external supply, dead-bus synchronisation and trip-to-house-load (TTHL) capability, minimum load and transformer energisation limits, step-by-step restart switching, and approver and contact blocks. The blank AEMO Generator LBSP template, the SRAS Guideline, the System Restart Standard and news about restart tests contain the same headings without values, so they stay at 65 discovery.
operation: >-
  Primary: local black system procedure(s) / LBSP, system restart plan, black start (capability), system restart ancillary services / SRAS, or trip to house load / TTHL. 65 is discovery-only (primary alone) and will surface the NER, the AEMO SRAS Guideline, the blank LBSP template and news. 75 requires, within 300 characters, one populated restart structure. That can be a technical value from the AEMO LBSP template items: number of units with a digit, unit or station capacity in MW, minimum load in MW, largest transformer in MVA, or dead-bus synchronisation answered Yes/No. It can also be a restart step line (Step N: Open / Close / Start / Energise / Synchronise / Isolate / Transfer / Block load ... followed by a kV, CB, bus, breaker, MW or Unit N token), or a populated version/contact field (Approver, Release Date, Primary or Secondary Contact, Name of the generation facility, Name of Registered Participant) with a non-placeholder value. 85 requires two distinct structure hits (min_count 2, unique) plus independent restart evidence such as energy support agreement, ancillary services agreement, dead bus, auxiliary supply, restart path, electrical sub-network, diesel generator, TNSP or confidential information. All tiers exclude template/fixture text. Enforce tiers also exclude guidance and consultation text: System Restart Standard, SRAS Guideline, Guidelines for Preparing Local Black System Procedures, Reliability Panel, the WEM Local Black Start Procedure Guideline, issues or consultation papers, draft or final determinations, media releases and aemc.gov.au.
pattern: (?i)\b(?:local\s+black\s+system\s+procedures?|LBSPs?|system\s+restart\s+plan|black\s+start(?:\s+capab(?:le|ility))?|system\s+restart\s+ancillary\s+services?|SRAS|trip(?:ping|ped)?\s+to\s+house\s+load|TTHL)\b
confidence: medium
confidence_justification: >-
  Medium: the primary terms are NER defined terms (cl 4.8.12, 3.11.7-3.11.10) and AEMO LBSP template headings. They dominate the Rules, the SRAS Guideline, Reliability Panel papers and the blank template, so enforce tiers depend on populated values (MW, MVA, unit counts, Yes/No answers, restart step lines, approver and contact fields). The item codes and headings come from the AEMO Generator LBSP template (final stage, 2019). Step-line wording (Open, Close, Energise and similar) is ordinary switching language, not a mandated AEMO format. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - National Electricity Rules (v217) cl 4.8.12 (system restart plan and local black system procedures)
  - National Electricity Rules (v217) cl 3.11.7-3.11.10 (system restart ancillary services)
  - National Electricity Law s 54A
frameworks:
  - SOCI
  - ISO 27001
data_categories:
  - infrastructure
  - security
  - energy-market
corroborative_evidence:
  keywords:
    - energy support agreement
    - ancillary services agreement
    - dead bus
    - auxiliary supply
    - restart path
    - electrical sub-network
    - diesel generator
    - confidential information
  proximity: 300
test_cases:
  should_match:
    - value: "Local Black System Procedures - Wirrabara Downs Power Station\nApprover: Dana Testwell, Station Manager\nRelease Date: 14/03/2026\n1I Number of generating units that can be returned to service without external supply: 2\n3G Dead-bus synchronisation: Yes - Unit 1 onto the 11 kV station board via the black start diesel generator\n3O Minimum load: 120 MW per unit\nThe Generator is not a party to an energy support agreement."
      description: Populated LBSP with approver, release date, unit count, dead-bus answer and minimum load, plus energy support agreement evidence - intended 85
      synthetic: true
    - value: "System restart plan - Northern electrical sub-network restart path (extract)\nStep 1: Start black start diesel generator DG1 and confirm auxiliary supply to 415 V board\nStep 2: Close 132 kV CB 7042 to energise the dead bus at Kellyvale substation\nStep 3: Synchronise Unit 2 and block load 20 MW\nConfidential information under NER cl 4.8.12(b)."
      description: Restart plan extract with three step lines and restart-path evidence - intended 85
      synthetic: true
    - value: "TTHL capability summary for Mount Orrin Station\n9A Number of generating units capable of tripping to house load (TTHL): 2\nUnits must be above 60% load at the time of the disturbance."
      description: One populated technical value (units capable of TTHL) - intended 75
      synthetic: true
    - value: "Local black system procedures, Tarrawonga Hydro, revision 3.\n3R Largest transformer that can be energised: 180 MVA generator step-up transformer T2 from Unit 1 alone."
      description: One populated transformer energisation limit - intended 75
      synthetic: true
    - value: "SRAS restart sequence (Station control room copy)\nStep 4: Close generator CB G1-52 onto the 11 kV bus after the diesel start permissive clears."
      description: Single restart step line - intended 75
      synthetic: true
  should_not_match:
    - value: "(b) The system restart plan is confidential information. (d) Each Generator, Integrated Resource Provider and Network Service Provider must develop local black system procedures in accordance with the guidelines referred to in clause 4.8.12(e)."
      description: NER cl 4.8.12 text (legislation decoy) - 65 only
    - value: "Section 0: LBSP version Information\nGeneration facility | Version: | Release Date: | Approver: |\n1B Is the Generator a party to an energy support agreement (refer to the Rules definition)? (Yes / No)\n1I Number of generating units that can be returned to service without external supply:\n3G Can generating units or generating system be connected to a de-energised bus (e.g. dead-bus synchronisation)?\n3O What is the minimum load requirement for stable operation of each generating unit?\n3R Please specify the largest size of transformer that can be energised by the generation facility."
      description: Blank AEMO Generator LBSP template headings (template decoy) - must not reach 75
    - value: "AEMO has published the updated SRAS Guideline, which sets out how it acquires system restart ancillary services for each electrical sub-network and how black start capability is tested against the System Restart Standard."
      description: SRAS Guideline / System Restart Standard guidance text - excluded from enforce tiers
    - value: "The market operator said a black start test at a Queensland hydro station last week went to plan, restoring supply to a local island within the target time. The system restart plan itself remains confidential."
      description: News about a restart test (no populated values) - 65 only
    - value: "Black start training exercise for new control room operators: Step 1: Close CB 101 onto the 11 kV bus. Discuss what could go wrong."
      description: Training exercise with an example step line (fixture exclusion) - must not reach 75
false_positives:
  - description: The NER, AEMO SRAS Guideline, Reliability Panel System Restart Standard papers and AEMC consultation documents.
    mitigation: No populated values, and enforce tiers carry a guidance/consultation exclusion group; these stay at 65 discovery.
  - description: The blank AEMO Generator LBSP template, which has every item heading and one example restart-time table.
    mitigation: Value regexes need a digit with MW/MVA, a Yes/No answer after a colon, a step line with an equipment token, or a named approver or contact. Blank cells, pipes and underscores do not count. The template's example "30 mins to start 1 unit" table is not an anchor.
  - description: Generic plant start-up or switching procedures that mention black start in passing.
    mitigation: The step-line regex needs an electrical equipment token, and 85 also needs independent restart evidence. Where a station procedure is really a black start procedure, detection is intended.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_nem_system_restart_black_system_procedure_primary
      matches:
        - ref: Regex_au_nem_system_restart_black_system_procedure_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_nem_system_restart_black_system_procedure_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_nem_system_restart_black_system_procedure_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_nem_system_restart_black_system_procedure_primary
      matches:
        - ref: Regex_au_nem_system_restart_black_system_procedure_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_nem_system_restart_black_system_procedure_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_nem_system_restart_black_system_procedure_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_nem_system_restart_black_system_procedure_primary
      pattern: >-
        (?i)\b(?:local\s+black\s+system\s+procedures?|LBSPs?|system\s+restart\s+plan|black\s+start(?:\s+capab(?:le|ility))?|system\s+restart\s+ancillary\s+services?|SRAS|trip(?:ping|ped)?\s+to\s+house\s+load|TTHL)\b
    - id: Regex_au_nem_system_restart_black_system_procedure_record_structure
      pattern: >-
        (?i)(?:\bnumber\s+of\s+(?:generating\s+)?units[^\n:|]{0,90}:[ \t]{0,5}\d{1,2}\b|\b(?:individual\s+unit|combined\s+station|unit|station)\s+capacity\s*:[ \t]{0,5}\d[\d,.]{0,6}[ \t]{0,2}MW\b|\bminimum\s+load[^\n|?]{0,60}?\b\d[\d.]{0,5}[ \t]{0,2}MW\b|\blargest\s+(?:size\s+of\s+)?transformer[^\n|?]{0,70}?\b\d[\d.]{0,5}[ \t]{0,2}MVA\b|\bdead[\s-]{1,3}bus\s+synchroni[sz]ation[ \t]{0,3}[:-][ \t]{0,5}(?:Yes|No)\b|\bStep\s{1,3}\d{1,2}\s{0,3}[:.)-]\s{0,3}(?:Open|Close|Start|Energi[sz]e|Synchroni[sz]e|Run\s+up|Isolate|Transfer|Block\s+load|Trip|Confirm)\b[^\n|]{2,120}?(?:\b\d{1,3}(?:\.\d)?\s?kV\b|\bCB\b|\bbus\b|\bbreaker\b|\b\d{1,4}\s?MW\b|\bUnit\s+\d{1,2}\b)|\b(?:Approver|Release\s+Date|Primary\s+Contact|Secondary\s+Contact|Name\s+of\s+(?:the\s+)?generation\s+facility|Name\s+of\s+Registered\s+Participant)\s*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Za-z0-9][A-Za-z0-9/'.,-]{0,30}){0,3})
    - id: Regex_au_nem_system_restart_black_system_procedure_guidance_exclusion
      pattern: >-
        (?i)(?:\bSystem\s+Restart\s+Standard\b|\bSRAS\s+Guideline\b|\bGuidelines?\s+for\s+(?:the\s+)?Prepar(?:ing|ation\s+of)\s+Local\s+Black\s+System\s+Procedures\b|\bReliability\s+Panel\b|\bLocal\s+Black\s+Start\s+Procedure\s+Guideline\b|\b(?:issues|consultation|discussion)\s+paper\b|\b(?:draft|final)\s+(?:report|determination)\b|\bmedia\s+release\b|\baemc\.gov\.au\b|\bInstructions\s+for\s+completion\b)
  keywords:
    - id: Keyword_au_nem_system_restart_black_system_procedure_corroborative
      groups:
        - match_style: word
          terms:
            - energy support agreement
            - energy support arrangement
            - ancillary services agreement
            - dead bus
            - de-energised bus
            - auxiliary supply
            - restart path
            - electrical sub-network
            - diesel generator
            - station board
            - confidential information
            - text: TNSP
              case_sensitive: true
            - text: DNSP
              case_sensitive: true
            - Jurisdictional System Security Coordinator
            - major supply disruption
      strength: specific
risk_rating: 9
risk_description: >-
  A populated system restart plan extract or local black system procedure sets out how a named NEM generating system or network restarts after a black system: which units can start without external supply, restart switching steps, dead-bus and house-load capability, loading limits and who to call. NER cl 4.8.12(b) makes the system restart plan confidential information, and this material is system-security sensitive for critical electricity assets under the SOCI Act. Disclosure would help anyone planning to disrupt or delay power system restoration. The NER, guidelines, the blank template and news are excluded from enforce tiers. Risk 9 supports SENSITIVE InfoTech.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: AEMC - National Electricity Rules (cl 4.8.12 system restart plan and local black system procedures; v217 used)
    url: https://www.aemc.gov.au/regulation/energy-rules/national-electricity-rules
  - title: AEMO - Generator LBSP template (final stage, 2019)
    url: https://www.aemo.com.au/-/media/files/stakeholder_consultation/consultations/nem-consultations/2019/lbsp-amendments/final-stage/generator_lbsp_template.docx
  - title: AEMO - System Restart Ancillary Services Guideline
    url: https://www.aemo.com.au/energy-systems/electricity/national-electricity-market-nem/system-operations/ancillary-services/system-restart-ancillary-services-guideline
  - title: AEMC Reliability Panel - Review of the System Restart Standard
    url: https://www.aemc.gov.au/market-reviews-advice/review-system-restart-standard-0
