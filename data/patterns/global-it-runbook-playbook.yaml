schema: testpattern/v1
name: IT Runbook/Playbook
slug: global-it-runbook-playbook
version: 1.6.1
type: regex
pattern_class: concept
description: >-
  Identifies IT runbooks, operational/security playbooks, SOPs and work instructions that contain executable operational detail: numbered steps, shell/admin commands, or internal hosts and addresses. Titles alone are discovery-only.
operation: >-
  Regex_runbook_playbook (runbook, incident/security/SOC/on-call/IT operations/support playbook, standard operating procedure, SOP document/manual, work instruction) is discovery-only at 65. 75 requires one populated structure: a numbered step, a shell/admin command (systemctl, kubectl, PowerShell verbs, sqlcmd, ssh, etc.), or an internal hostname/IP/labelled host. 85 requires two distinct structures plus operational wording (rollback, expected output, health check, escalate, maintenance window). Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
confidence: medium
confidence_justification: >-
  Medium confidence: titles are discovery-only; enforcement requires numbered steps, commands or hosts, and 85 adds a second structure and operational context.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - CIS Controls
  - DISP
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - technology
  - security
test_cases:
  should_match:
    - value: |-
        Runbook: restart the licensing service (APP-LIC)
        Host: lic-app02.example.internal (10.40.2.18)
        Step 1: Put the node into maintenance mode in the load balancer.
        Step 2: Run sudo systemctl restart flexlm and confirm the service is active.
        Expected output: active (running). If the service fails twice, escalate to the platform on-call engineer.
      description: High tier (85) - host, numbered steps and command with expected output/escalation
      synthetic: true
    - value: 'Standard operating procedure for month-end backups - Step 1: confirm the previous job completed before starting the new run.'
      description: Medium tier (75) - numbered step only
      synthetic: true
    - value: 'SOC playbook for phishing triage: pull headers with Get-MessageTrace before contacting the user.'
      description: Medium tier (75) - admin command only
      synthetic: true
    - value: The new starter was pointed to the runbook on the team wiki.
      description: Discovery tier (65) - title only
      synthetic: true
  should_not_match:
    - value: 'Guidance note: a good runbook lists prerequisites, numbered steps and an escalation path; agencies should review runbooks each year.'
      description: Guidance text
    - value: |-
        Runbook template
        Service: ______
        Host: ______
        Step 1: ______
        Step 2: ______
      description: Blank template
    - value: 'Training module: learners follow a runbook to restart a demo web server using systemctl restart nginx.'
      description: Training framing with a command must not enforce
    - value: The coach drew up a new playbook for the grand final.
      description: Sports playbook - not an IT playbook
false_positives:
  - description: Sports, marketing and Ansible playbooks and runbook-writing guidance.
    mitigation: Playbook requires an incident/security/SOC/on-call/IT operations/support qualifier; enforcement needs populated steps, commands or hosts, and guidance/training/template framing is excluded.
  - description: Overlap with global-top500-256-operational-runbooks, which uses the same structures.
    mitigation: Deploy one of the two; merge recommended.
exports:
  - yaml
scope: narrow
risk_rating: 4
risk_description: >-
  The detector identifies IT runbooks, security/operations playbooks and SOPs only when they contain numbered steps, administrative commands or internal hosts; titles alone are discovery-only. A matched document can disclose operational workflow, host names and routine administrative commands, but the detector does not require credentials, privileged access paths or incident-specific targets, and harm is usually limited to one service and operations team. Risk 4 OFFICIAL is retained for routine procedures; SENSITIVE requires embedded secrets, privileged access procedures, exploitable configuration or sensitive incident-response detail. The overlapping global-top500-256-operational-runbooks is rated 7 on the same structures; the two ratings should be reconciled if the classifiers are merged.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: "CUI Specified"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Low
  rationale: >-
    Risk 4, PSPF OFFICIAL, QGISCF OFFICIAL and OFFICIAL DLM at Low tier fit a runbook with numbered steps, admin
    commands or internal hosts, which reveals routine workflow for one service. SENSITIVE is not met because the
    detector does not require embedded secrets, privileged access paths, exploitable configuration or incident-specific
    response detail.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low handling suits routine operational procedures; runbooks carrying credentials or privileged access
      steps belong under Medium controls.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_runbook_playbook
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_numbered_step
            - Evidence_shell_command
            - Evidence_system_host
        - ref: Keyword_runbook_operations
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_runbook_playbook
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_numbered_step
            - Evidence_shell_command
            - Evidence_system_host
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_runbook_playbook
  regexes:
    - id: Regex_runbook_playbook
      pattern: (?i)\b(?:runbooks?|(?:incident|security|SOC|on[\s-]call|IT\s+operations|response|support)\s+playbooks?|standard\s+operating\s+procedures?|SOP\s+(?:document|manual)|work\s+instructions?)\b
    - id: Evidence_numbered_step
      pattern: (?i)\bstep\s+\d{1,2}(?:\.\d{1,2})?\s*[:.)-]\s*[A-Za-z]
    - id: Evidence_shell_command
      pattern: \b(?:sudo\s+)?(?:systemctl\s+(?:restart|stop|start|status)|kubectl\s+(?:rollout|scale|delete|get|describe|apply|drain|cordon)|docker\s+(?:restart|compose|run|exec)|az\s+[a-z]{2,20}\s+[a-z]{2,20}|aws\s+[a-z0-9]{2,20}\s+[a-z-]{2,40}|(?:Restart|Stop|Start|Get|Set)-[A-Z][A-Za-z]{2,40}|sqlcmd\s+-S|psql\s+-h|ssh\s+[\w.-]{1,60}@[\w.-]{1,120}|iisreset\b|net\s+(?:stop|start)\s+[\w\"-]{2,60}|pg_(?:dump|restore)\s+-|robocopy\s+[\w\\:$.-]{2,120})
    - id: Evidence_system_host
      pattern: (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:hostname|host|server|asset\s+ID|device\s+ID|node|instance)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._-]{2,63}
  keywords:
    - id: Keyword_runbook_operations
      groups:
        - match_style: word
          terms:
            - rollback
            - roll back
            - expected output
            - verification step
            - health check
            - escalate
            - maintenance window
            - change window
            - maintenance mode
            - failover
            - service restart
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
created: '2026-02-09'
updated: '2026-09-25'
changelog:
  - version: 1.6.1
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had no generic classification, no
      rationale, no tier).
  - version: 1.6.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): 75 now requires populated operational structure (numbered step, shell/admin command, or internal host/IP) and 85 requires two distinct structures plus operational wording; removed the phrase-only 85 path (runbook section headings, generic infrastructure/IT-operations words); bare \"playbook\" narrowed to incident/security/SOC/on-call/IT operations/support playbooks so sports, marketing and Ansible playbooks do not hit; guidance/news/training exclusion added; populated synthetic tests and decoys. Replaced the unrelated SOCI Act and TIA Act tags with Criminal Code Act 1995 (Cth) (runbooks expose access paths relevant to computer offences, matching the repo convention for security-operations documents); added verified ISM and NIST SP 800-61r3 references. Overlaps global-top500-256-operational-runbooks - see that pattern's description."
  - version: 1.5.0
    date: '2026-07-19'
    description: 'Profile quality: align the regex-backed detector type; add title discovery, procedure-section medium, and infrastructure-corroborated high tiers; add public/template adversarial probes.'
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 552 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: Replace bare generic keyword terms with domain-anchored phrases (FP reduction)
  - version: 1.1.0
    date: '2026-07-04'
    description: Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.; Aligned recommended_confidence to 75.
