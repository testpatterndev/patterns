    url: https://csrc.nist.gov/pubs/sp/800/61/r3/final
keywords:
  - runbook
  - response playbook
  - playbook procedure
  - operational procedure
  - standard operating procedure
  - SOP
  - escalation path
  - escalation matrix
  - on-call
  - incident procedure
  - troubleshooting guide
  - runbook automation
  - operational playbook
