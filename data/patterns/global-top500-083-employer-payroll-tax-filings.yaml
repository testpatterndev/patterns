schema: testpattern/v1
name: Employer payroll tax filings
slug: global-top500-083-employer-payroll-tax-filings
version: 1.3.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects completed employer payroll tax and withholding filings: Queensland (state) payroll tax returns and annual reconciliations, PAYG withholding annual reports, Single Touch Payroll pay events/finalisation summaries and US Form 941/940 returns, with populated wage/withholding totals and an employer identifier or reporting period.
operation: >-
  Primary: an employer payroll tax filing phrase (payroll tax return/lodgement/annual reconciliation, PAYG withholding return/annual report, payment summary annual report, STP pay event/finalisation, Form 941/940). The single enforce tier (75) requires two distinct populated structures within 300 characters: a labelled filing amount (taxable wages, total salary and wages, amounts withheld, payroll tax payable, Form 941 wages/taxes) with a currency value, AND a populated employer identifier (employer name/ABN/EIN, payroll tax client number) or reporting period. Capped at 75 because the record is aggregate entity-level data. Enforce tier excludes template/fixture text and guidance/policy/marketing framing; 65 is discovery-only (primary alone).
pattern: >-
  (?i)\b(?:employer\s+payroll\s+tax\s+filings?|payroll\s+tax\s+(?:returns?|filings?|lodg(?:e)?ments?|annual\s+reconciliation|reconciliation|liability\s+statement)|annual\s+payroll\s+tax\s+reconciliation|PAYG\s+withholding\s+(?:returns?|summary|annual\s+report)|payment\s+summary\s+annual\s+report|STP\s+(?:pay\s+event|finali[sz]ation)|Single\s+Touch\s+Payroll\s+(?:pay\s+event|finali[sz]ation|report)|Form\s+94[01]|employer'?s\s+(?:quarterly|annual)\s+federal\s+(?:unemployment\s+)?(?:\(FUTA\)\s+)?tax\s+return)\b
confidence: low
confidence_justification: >-
  Low: employer payroll tax and withholding filings are aggregate, entity-level business records (total wages, tax withheld, employer identifiers) that normally carry no person-level data. The pattern is capped at 75: it needs a populated amount line plus a populated employer identifier or reporting period, which separates real returns from guidance, but no tier claims 85 because the record itself is low sensitivity. Tiers are heuristic evidence levels, not measured accuracy.
jurisdictions:
  - au
  - global
regulations:
  - Taxation Administration Act 1953 (Cth)
  - Payroll Tax Act 1971 (Qld)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - taxable wages
    - amount withheld
    - W1
    - W2
    - Queensland Revenue Office
    - Single Touch Payroll
    - finalisation
  proximity: 300
test_cases:
  should_match:
    - value: "Payroll tax annual reconciliation 2025-26\nEmployer name: Tealbrook Logistics Pty Ltd\nPayroll tax client number: 4402917\nTotal taxable wages: $3,412,880.00\nPayroll tax payable: $112,402.00\nReturn period ending 30/06/2026"
      description: "75: Qld payroll tax annual reconciliation with employer, client number, wages and period (capped at 75)"
      synthetic: true
    - value: "Form 941 Employer's Quarterly Federal Tax Return\nEIN: 12-3456789\nQuarter: Q2 2026\nWages, tips, and other compensation: $412,500.00\nTotal taxes after adjustments: $98,211.40"
      description: "75: US Form 941 with EIN, quarter and totals (capped at 75)"
      synthetic: true
    - value: "STP finalisation - PAYG withholding annual report\nABN: 12 345 678 901\nReporting period: FY2025-26\nW1 Total salary, wages and other payments: $1,284,300\nW2 Amount withheld: $301,122"
      description: "75: STP finalisation / PAYG withholding annual report with ABN, period and W1/W2 amounts (capped at 75)"
      synthetic: true
    - value: "payroll tax return"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "Payroll tax is payable when your total taxable wages are above the threshold. You must lodge an annual reconciliation by 21 July each year; this fact sheet explains how."
      description: "Payroll tax guidance - must stay at or below 65"
    - value: "Payroll tax annual reconciliation\nEmployer name: __________\nPayroll tax client number: __________\nTotal taxable wages: $__________"
      description: "Blank reconciliation form - must stay at or below 65"
    - value: "Payroll tax filings rose 8% this year, the revenue office said in a media release."
      description: "News - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Payroll software and accountant marketing that shows sample totals."
    mitigation: "Marketing framing (payroll software, book a demo, free trial) is excluded; the pattern is capped at 75 so it never reaches high confidence on its own."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 75
      id_match: Regex_top500_083_employer_payroll_tax_filings_primary
      matches:
        - ref: Regex_top500_083_employer_payroll_tax_filings_filing_amount
        - ref: Regex_top500_083_employer_payroll_tax_filings_filing_entity_period
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_083_employer_payroll_tax_filings_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_083_employer_payroll_tax_filings_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_083_employer_payroll_tax_filings_primary
      pattern: >-
        (?i)\b(?:employer\s+payroll\s+tax\s+filings?|payroll\s+tax\s+(?:returns?|filings?|lodg(?:e)?ments?|annual\s+reconciliation|reconciliation|liability\s+statement)|annual\s+payroll\s+tax\s+reconciliation|PAYG\s+withholding\s+(?:returns?|summary|annual\s+report)|payment\s+summary\s+annual\s+report|STP\s+(?:pay\s+event|finali[sz]ation)|Single\s+Touch\s+Payroll\s+(?:pay\s+event|finali[sz]ation|report)|Form\s+94[01]|employer'?s\s+(?:quarterly|annual)\s+federal\s+(?:unemployment\s+)?(?:\(FUTA\)\s+)?tax\s+return)\b
    - id: Regex_top500_083_employer_payroll_tax_filings_filing_amount
      pattern: >-
        (?i)\b(?:(?:total\s+)?taxable\s+wages|total\s+(?:gross\s+)?wages|gross\s+wages|total\s+salary,?\s+wages\s+and\s+other\s+payments|amounts?\s+withheld|PAYG\s+(?:tax\s+)?withheld|payroll\s+tax\s+(?:payable|liability|due|paid)|wages,?\s+tips,?\s+and\s+other\s+compensation|total\s+taxes(?:\s+after\s+adjustments)?|total\s+(?:tax\s+)?liability|gross\s+payments)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?
    - id: Regex_top500_083_employer_payroll_tax_filings_filing_entity_period
      pattern: >-
        (?i)\b(?:employer\s+(?:name|ABN|number|registration\s+number)|payroll\s+tax\s+(?:client|registration)\s+(?:number|no\.?)|client\s+(?:number|reference)|ABN|EIN|employer\s+identification\s+number|withholding\s+payer\s+number|branch\s+number)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}|\b(?:(?:return|reporting|lodg(?:e)?ment|financial)\s+(?:period|year)(?:\s+ending)?|period\s+ending|quarter\s+ending)[ \t]{0,3}[:\-]?[ \t]{0,3}(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|\b(?:return|reporting|financial)\s+(?:period|year)[ \t]{0,3}:[ \t]{0,3}(?:FY[ \t]?)?20\d{2}(?:[-/]\d{2,4})?\b|\bquarter[ \t]{0,3}:[ \t]{0,3}(?:Q[1-4][ \t]20\d{2}|20\d{2}[ \t]Q[1-4])\b
  keywords:
    - id: Keyword_top500_083_employer_payroll_tax_filings_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - threshold is
            - you must lodge
            - you need to lodge
            - how to lodge
            - payroll software
            - book a demo
            - free trial
      strength: domain
risk_description: >-
  The classifier identifies completed employer payroll tax / withholding filings (aggregate wages and tax withheld with an employer identifier or period), capped at 75. These are commercial tax records of the employer rather than personal data about workers; disclosure mainly reveals payroll size and tax position. Guidance, blank forms and news stay at 65. Risk 4 supports OFFICIAL.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 maps to PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, OFFI, and Low because the medium-confidence concept
    commonly identifies general filing material with bounded business sensitivity. SENSITIVE is not met without evidence
    of a completed confidential return or person-level payroll information.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low with Low DLM treatment is appropriate for a payroll-tax filing reference or bounded employer record
      with limited direct harm. Generic Medium would require substantive confidential values or linked employee details.
