schema: testpattern/v1
name: SOCI Mandatory Cyber Security Incident Report or Ransomware Payment Report
slug: au-soci-cyber-incident-report
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed regulatory cyber incident reports made to the Australian Signals Directorate: mandatory cyber security incident reports under the Security of Critical Infrastructure Act 2018 (s 30BC critical incidents, 12 hours, written record within 84 hours of an oral report; s 30BD other incidents, 72 hours, written record within 48 hours), content entered in the ASD/ACSC "Report a cyber security incident" form (organisation, ABN, contact number, date and time the incident was identified, whether it is ongoing, incident type, Home Affairs consent), and ransomware payment reports under s 27 of the Cyber Security Act 2024. Distinct from global-security-incident-report and the OT cyber incident report classifiers, which cover internal incident and forensic reports; this one requires the regulatory reporting frame plus populated ASD form fields.
operation: >-
  Primary: "cyber security incident report/notification" (optionally "critical"), "mandatory cyber (security) incident report(ing)", "ransomware payment report", "critical cyber security incident", s 30BC / 30BD, "Cyber Security Act 2024" or "reported to ASD/ACSC/Australian Signals Directorate". 65 is discovery-only (primary alone) and will surface cyber.gov.au and CISC guidance and commentary. 75 requires one populated structure within 300 characters: a verified ASD form question with an answer ("Date and time the incident was identified" + date, "Is the incident ongoing?" + a single Yes/No, the Home Affairs consent question + a single Yes/No), an organisation/reporting entity name, ABN, Australian contact number, a selected incident type from the form's list, a dated oral report, or a ransomware payment amount/date. Blank forms that print "Yes / No" are rejected. 85 requires two distinct structure hits plus an independent corroborative term (significant/relevant impact, OT/IT/customer data impact, NOCS, ASD, Home Affairs, ransom demand, threat actor). Every tier excludes template/fixture text; enforce tiers also exclude guidance and legislation signals.
pattern: (?i)\b(?:(?:critical\s+)?cyber\s+security\s+incident\s+(?:report|notification)|mandatory\s+cyber\s+(?:security\s+)?incident\s+report(?:ing)?|ransomware\s+payment\s+report|critical\s+cyber\s+security\s+incident|(?:section|s\.?)\s?30B[CD]|Cyber\s+Security\s+Act\s+2024|reported\s+to\s+(?:the\s+)?(?:ASD|ACSC|Australian\s+Signals\s+Directorate))\b
confidence: medium
confidence_justification: >-
  Medium: the statutory terms and ASD form labels are specific, but cyber.gov.au, CISC and law-firm guidance repeat the deadlines, section numbers and form questions. Enforce tiers require answered form fields rather than the questions alone, and there is no public report identifier. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
  - Cyber Security Act 2024 (Cth)
  - Ransomware Payment Reporting Rules 2025 (Cyber Security Act 2024)
frameworks:
  - PSPF
  - QGISCF
data_categories:
  - security
  - infrastructure
  - government
corroborative_evidence:
  keywords:
    - significant impact
    - relevant impact
    - Operational technology systems
    - Information technology systems
    - Customer data
    - National Office of Cyber Security
    - Australian Signals Directorate
    - Department of Home Affairs
    - ransom demand
    - threat actor
  proximity: 300
test_cases:
  should_match:
    - value: "Mandatory cyber security incident report - critical (s 30BC), written record following oral report\nOrganisation name: Tallowood Energy Pty Ltd\nABN: 62 000 641 439\nContact number: 07 3555 0192\nDate and time the incident was identified: 12/09/2026 03:40\nIs the incident ongoing? Yes\nIncident type: Ransomware\nImpacted: Operational technology systems (distribution SCADA). Consent to share with the National Office of Cyber Security (NOCS): Yes"
      description: 85 tier - completed ASD report form for a critical incident with several answered fields and OT impact
      synthetic: true
    - value: "Cyber security incident report - other incident (s 30BD)\nDate and time the incident was identified: 3 September 2026, 14:20\nSummary: credential stuffing against the customer portal caused a relevant impact on billing availability."
      description: 75 tier - s 30BD report with one answered form field
      synthetic: true
    - value: "Ransomware payment report under the Cyber Security Act 2024 (s 27)\nReporting entity: Brolga Freight Logistics Pty Ltd\nAmount paid: USD 180,000 in Bitcoin\nDate of payment: 19/09/2026\nThe threat actor supplied a decryptor after an initial ransom demand of USD 400,000."
      description: 85 tier - s 27 ransomware payment report with entity, amount and payment date plus threat actor / ransom demand
      synthetic: true
    - value: "Critical cyber security incident - reported to ASD by phone.\nIs the incident ongoing? No"
      description: 75 tier - critical incident note with one answered form question
      synthetic: true
    - value: "SOCI s 30BC notification\nOral report made to ASD at 06:15 on 12/09/2026; written record to follow within 84 hours.\nContact number: 0412 555 318"
      description: 85 tier - dated oral report plus contact number and ASD reference
      synthetic: true
  should_not_match:
    - value: "If your organisation is a responsible entity for a critical infrastructure asset you must report a critical cyber security incident within 12 hours of becoming aware of it (s 30BC) and other cyber security incidents within 72 hours (s 30BD). If you report orally you must make a written record within 84 hours."
      description: cyber.gov.au / CISC guidance
    - value: "Report a cyber security incident\nOrganisation name: __________\nABN: __________\nDate and time the incident was identified: ____\nIs the incident ongoing? Yes / No\nDo you consent for this cyber incident report to be provided to the Department of Home Affairs to meet mandatory regulatory reporting requirements? Yes No\nWhich of the following are being impacted? Information technology systems / Operational technology systems / Customer data"
      description: Blank ASD reporting form
    - value: "SOCI Act explained: the 12-hour and 72-hour mandatory cyber incident reporting deadlines, what counts as a significant impact, and how the Cyber Security Act 2024 adds ransomware payment reporting. This article is general information only."
      description: Law-firm article
    - value: "Ransomware payment reporting under the Cyber Security Act 2024 gives affected businesses 72 hours to report a payment, and the minister said early numbers were lower than expected."
      description: News reporting
    - value: "Security incident report INC-4471: root cause was a phished VPN credential; containment completed 14:20 and the firewall rule was tightened."
      description: Internal security incident report without the regulatory frame (covered by global-security-incident-report)
false_positives:
  - description: cyber.gov.au and CISC guidance, law-firm and vendor articles repeat the 12/72/84/48-hour deadlines, section numbers and form questions.
    mitigation: Guidance stays at 65 discovery; enforce tiers need answered form fields and exclude cisc.gov.au / legislation.gov.au, "Civil penalty:", "you must report" instructions and law-firm disclaimers.
  - description: Blank or printed ASD reporting forms list every option ("Yes / No", all incident types).
    mitigation: Yes/No answers followed by the other option are rejected, and incident type must follow a labelled field; blank lines and placeholders are rejected.
  - description: Internal incident reports and post-incident reviews.
    mitigation: Without the regulatory frame (s 30BC/30BD, ASD report, Cyber Security Act 2024) the primary does not fire; these are covered by global-security-incident-report.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_soci_cyber_incident_report_primary
      matches:
        - ref: Regex_au_soci_cyber_incident_report_form_answer
          min_count: 2
          unique_results: true
        - ref: Keyword_au_soci_cyber_incident_report_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_soci_cyber_incident_report_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_soci_cyber_incident_report_primary
      matches:
        - ref: Regex_au_soci_cyber_incident_report_form_answer
        - ref: Regex_au_soci_cyber_incident_report_reporter_field
        - ref: Keyword_au_soci_cyber_incident_report_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_soci_cyber_incident_report_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_soci_cyber_incident_report_primary
      matches:
        - ref: Regex_au_soci_cyber_incident_report_reporter_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_soci_cyber_incident_report_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_soci_cyber_incident_report_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_soci_cyber_incident_report_primary
      matches:
        - type: any
          refs:
            - Regex_au_soci_cyber_incident_report_form_answer
            - Regex_au_soci_cyber_incident_report_reporter_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_soci_cyber_incident_report_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_soci_cyber_incident_report_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_soci_cyber_incident_report_primary
      pattern: >-
        (?i)\b(?:(?:critical\s+)?cyber\s+security\s+incident\s+(?:report|notification)|mandatory\s+cyber\s+(?:security\s+)?incident\s+report(?:ing)?|ransomware\s+payment\s+report|critical\s+cyber\s+security\s+incident|(?:section|s\.?)\s?30B[CD]|Cyber\s+Security\s+Act\s+2024|reported\s+to\s+(?:the\s+)?(?:ASD|ACSC|Australian\s+Signals\s+Directorate))\b
    - id: Regex_au_soci_cyber_incident_report_form_answer
      pattern: >-
        (?i)(?:\bDate\s+and\s+time\s+the\s+incident\s+was\s+identified\s*[:?-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2})|\bIs\s+the\s+incident\s+ongoing\s*\??\s*[:-]?\s*(?:Yes|No)\b(?![ \t]{0,3}(?:/|or\b)?[ \t]{0,3}\r?\n?[ \t]{0,3}(?:Yes|No)\b)|\bmandatory\s+regulatory\s+reporting\s+requirements\s*\??\s*[:-]?\s*(?:Yes|No)\b(?![ \t]{0,3}(?:/|or\b)?[ \t]{0,3}\r?\n?[ \t]{0,3}(?:Yes|No)\b)|\b(?:Incident\s+type|Type\s+of\s+incident)\s*[:#]\s*(?:Denial\s+of\s+service|Scanning\s+and\s+reconnaissance|Unauthorised\s+access|Data\s+exposure|Malicious\s+code|Ransomware|Phishing)|\b(?:oral|verbal)\s+(?:report|notification)\s+(?:was\s+)?(?:made|given|provided)\s+(?:to\s+(?:the\s+)?(?:ASD|ACSC|Australian\s+Signals\s+Directorate)\s+)?(?:at|on)\s+(?:\d{1,2}[:.]\d{2}|\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\.?\s+20\d{2}))
    - id: Regex_au_soci_cyber_incident_report_reporter_field
      pattern: >-
        (?i)(?:\b(?:Organisation\s+name|Reporting\s+entity|Responsible\s+entity)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9&'.,-]{0,60}(?:[ \t]+[A-Za-z0-9&'.,/-]{1,30}){0,4}|\bABN\s*[:#]?\s*\d{2}\s?\d{3}\s?\d{3}\s?\d{3}\b|\bContact\s+number\s*[:#]\s*(?:\+?61[ \t]?|0)[2-478](?:[ \t]?\d){8}\b|\b(?:ransom\s+)?(?:payment\s+amount|amount\s+paid|ransom\s+(?:paid|amount))\s*[:#]\s*(?:A?\$|AUD|USD|US\$)?\s?\d[\d,.]{0,15}|\bdate\s+(?:and\s+time\s+)?of\s+(?:the\s+)?(?:ransomware\s+)?payment\s*[:#]\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2}))
    - id: Regex_au_soci_cyber_incident_report_guidance_exclusion
      pattern: >-
        (?i)(?:\bcisc\.gov\.au|\blegislation\.gov\.au|\bFederal\s+Register\s+of\s+Legislation|\bCivil\s+penalty\s*:|\bCompilation\s+(?:No\.|date)|\b(?:does\s+not|is\s+not\s+intended\s+to)\s+constitute\s+legal\s+advice|\bgeneral\s+information\s+only\b|\bthis\s+(?:article|insight|fact\s?sheet|guidance(?:\s+note)?|webinar|explainer)\b|\bsubscribe\s+to\s+our\b|\bcontact\s+(?:our|the)\s+(?:team|authors?|partners?)\b|\bhow\s+to\s+report\s+a\s+cyber\b|\byou\s+(?:must|should|need\s+to)\s+(?:report|notify)\b)
  keywords:
    - id: Keyword_au_soci_cyber_incident_report_corroborative
      groups:
        - match_style: word
          terms:
            - significant impact
            - relevant impact
            - Operational technology systems
            - Information technology systems
            - Customer data
            - National Office of Cyber Security
            - text: NOCS
              case_sensitive: true
            - Australian Signals Directorate
            - text: ASD
              case_sensitive: true
            - text: ACSC
              case_sensitive: true
            - Department of Home Affairs
            - critical infrastructure sector
            - ransom demand
            - threat actor
            - written record
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a completed mandatory cyber security incident report or ransomware payment report made to ASD, gated on answered form fields. These reports are SOCI "relevant information" (s 5A: reports under s 30BC or 30BD) and describe a live compromise of a critical infrastructure asset: affected IT/OT systems, timing, whether the attacker still has access, and for ransomware reports the payment made. Disclosure can aid the attacker or copycats and prejudice the asset's security; unauthorised disclosure of protected information is an offence under SOCI s 45. Guidance, blank forms and commentary are excluded from enforce tiers. Risk 9 supports SENSITIVE InfoTech.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 9 is recorded with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech and the Medium tier because a
    completed s 30BC or s 30BD report describes a live compromise of a critical asset, whether the attacker still has
    access and any ransomware payment. SENSITIVE rather than PROTECTED applies because SOCI s 45 protection is a
    statutory regime, not a PSPF marking.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling applies, with SOCI disclosure restrictions, to one entity's incident report. High would
      need multi-asset or national-significance impact shown in the content.
references:
  - title: Security of Critical Infrastructure Act 2018 (Cth) - ss 30BC, 30BD, 30BF, 5A, 45
    url: https://www.legislation.gov.au/C2018A00029/latest/text
  - title: ASD / ACSC - Report a cyber security incident (form field labels)
    url: https://www.cyber.gov.au/report-and-recover/report/report-a-cyber-security-incident
  - title: Ransomware Payment Reporting Rules 2025 (Cyber Security Act 2024)
    url: https://www.legislation.gov.au/F2025L00278/asmade/text
