schema: testpattern/v1
name: Queensland Corrective Services Victims Register Record
slug: au-qld-corrections-victims-register
version: 1.1.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Queensland Corrective Services Victims Register applications (Form 49), referrals (Form 49a), nominee registrations and notifications linking a registered victim or eligible person to a named offender (parole, discharge, escape, transfer, death). Around 60% of registrations relate to domestic and family violence.
operation: >-
  Primary: Queensland Corrective Services Victims Register Record anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:Victims\s+Register|eligible\s+persons?\s+register|register(?:ed)?\s+(?:as\s+an?\s+)?eligible\s+person|application\s+to\s+(?:register|be\s+registered)\s+as\s+an?\s+eligible\s+person|eligible\s+person\s+(?:notification|information))\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Corrective Services Act 2006 (Qld)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - pii
corroborative_evidence:
  keywords:
    - Queensland Corrective Services
    - QCS
    - eligible person
    - nominee
    - parole
    - discharge
    - escape
    - transfer
  proximity: 300
customisation:
  - key: qcs-ioms-number
    kind: identifier-format
    identifier: qcs-ioms-number
    target: purview.regexes/Regex_au_qld_corrections_victims_register_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Queensland Corrective Services IOMS number format (see docs/identifiers.md#qcs-ioms-number). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "QCS Victims Register — application to be registered as an eligible person (Form 49)\nName: Avery Teston\nAddress: 14 Wattlebird Street, Stafford QLD 4053\nOffender: Jordan Teston\nIOMS number: 4471820\nRelationship: former partner (DFV)"
      description: Populated record 1
      synthetic: true
    - value: "Eligible person notification\nRegistered victim: Morgan Teston\nThe offender Riley Teston becomes eligible for parole on 01/12/2026 and has been transferred to a low security farm."
      description: Populated record 2
      synthetic: true
    - value: "Victims Register\nNominee: Casey Teston on behalf of registered victim Jamie Teston (minor). Please notify the nominee of any discharge or escape."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: The Queensland Corrective Services Victims Register gives eligible persons information about an offender's parole eligibility, discharge, escape or death.
      description: Guidance or explainer text
    - value: "Victims Register application (Form 49)\nName: __________\nOffender's name: __________\nIOMS number (if known): __________"
      description: Blank form
    - value: About 60% of people on the QCS Victims Register are victims of domestic and family violence, the department reports.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_corrections_victims_register_primary
      matches:
        - ref: Regex_au_qld_corrections_victims_register_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_corrections_victims_register_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_corrections_victims_register_primary
      matches:
        - ref: Regex_au_qld_corrections_victims_register_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_corrections_victims_register_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_corrections_victims_register_primary
      pattern: >-
        (?i)\b(?:Victims\s+Register|eligible\s+persons?\s+register|register(?:ed)?\s+(?:as\s+an?\s+)?eligible\s+person|application\s+to\s+(?:register|be\s+registered)\s+as\s+an?\s+eligible\s+person|eligible\s+person\s+(?:notification|information))\b
    - id: Regex_au_qld_corrections_victims_register_record_structure
      pattern: >-
        (?i)\b(?:prisoner|offender|parolee|IOMS(?:\s+(?:no\.?|number))?|correctional\s+centre|security\s+classification|parole\s+eligibility\s+date|release\s+date|eligible\s+person|registered\s+victim|nominee|young\s+person|child|detainee|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_corrections_victims_register_corroborative
      groups:
        - match_style: word
          terms:
            - Queensland Corrective Services
            - text: QCS
              case_sensitive: true
            - eligible person
            - nominee
            - parole
            - discharge
            - escape
            - transfer
            - security classification
            - submission
            - Form 49
            - offender
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a queensland corrective services victims register record about an identified person, gated on populated record fields. Queensland Corrective Services Victims Register applications (Form 49), referrals (Form 49a), nominee registrations and notifications linking a registered victim or eligible person to a named offender (parole, discharge, escape, transfer, death). Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: QCS — Victims Register
    url: https://corrections.qld.gov.au/the-queensland-corrective-services-victims-register-support-and-safety-for-victims-of-crime/
created: '2026-09-24'
updated: '2026-09-24'
