schema: testpattern/v1
name: Queensland Council Disaster Vulnerable Persons Register Record
slug: au-qld-disaster-vulnerable-persons-register
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed registrations and entries in a Queensland council or Local Disaster Management Group vulnerable persons register (VPR), also called a special needs register or a register of persons requiring special assistance in a disaster or evacuation. A populated entry ties a named person and home address to disability, mobility or medical dependency (oxygen, dialysis, life sustaining equipment), a carer or emergency contact, and evacuation or transport needs. The Disaster Management Act 2003 does not create or name these registers. Councils keep them under the state framework "People with vulnerabilities in disasters: A framework for an effective local response" (2016) and their own local disaster management arrangements. Information acquired while performing a function under the Act is covered by the s 139 confidentiality offence. The Local Disaster Management Plan is public (s 60) but the register is not.
operation: >-
  Primary: a register or form title (vulnerable persons register [registration / form / entry / record], VPR registration / entry / record / form, persons requiring special assistance in a disaster, special needs registration [form], people with vulnerabilities in disasters). Field regexes use same-line values only, so a blank form's stacked labels (Name: / Address:) never count, and values are placeholder-guarded. 75 requires, within 300 characters, one populated field: a person or address field (name, full name, registrant, resident or client followed by a capitalised name of two or more words; address, residential address or location followed by a street number and name), a needs field (description of special requirements, special needs, assistance required, evacuation needs, life sustaining equipment, medical condition / equipment / dependency, mobility aid, support aid or assistance animal, medication or disability followed by a value that is not none, nil or no), or a carer / contact field (contact person, carer, next of kin, emergency contact, support person, relationship to the person being registered, followed by a value). 85 requires all three field types together: person or address, needs, and carer or contact. All enforce tiers AND NOT the shared template-exclusion dictionary and a guidance exclusion (framework for an effective local response, fact sheet, frequently asked questions, how to register, who can register). 65 is discovery-only (primary alone). It will surface council VPR web pages, blank forms, the state framework and news.
pattern: >-
  (?i)\b(?:vulnerable\s+persons?\s+register(?:\s+(?:registration|form|entry|record))?|VPR\W{0,4}(?:registration|entry|record|form)|persons?\s+requiring\s+special\s+assistance\s+in\s+a\s+disaster|special\s+needs\s+registration(?:\s+form)?|people\s+with\s+vulnerabilities\s+in\s+disasters)\b
confidence: medium
confidence_justification: >-
  Medium. The register titles are distinctive but not statutory. "Vulnerable Persons Register" and the form title "Registration - Persons Requiring Special Assistance in a Disaster/Evacuation" come from a Queensland council page and form (Central Highlands Regional Council, Annexure 3-C). Other councils word their forms differently, and recall on differently titled registers is lower. The needs, contact and person field labels follow that form: person being registered, contact person who can provide special assistance, description of special requirements, support aid animal, life sustaining equipment, relationship to the person being registered. Framework vocabulary adds oxygen dependent, reliant on medical equipment and medication, and carers. Field values are loose and placeholder-guarded. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Disaster Management Act 2003 (Qld) s 139
  - Disaster Management Act 2003 (Qld) ss 29-30, 57, 60
  - IPA 2009 (Qld)
  - Public Records Act 2023 (Qld)
frameworks:
  - QGISCF
data_categories:
  - health
  - pii
  - government
corroborative_evidence:
  keywords:
    - special assistance
    - evacuation
    - life sustaining equipment
    - oxygen
    - wheelchair
    - carer
    - contact person
    - Local Disaster Management Group
  proximity: 300
test_cases:
  should_match:
    - value: "Vulnerable Persons Register - registration record\nName: Avery Teston\nAddress: 14 Wattlebird Street, Emerald QLD 4720\nDo you live alone? Yes\nContact person: Morgan Teston (daughter) 0491 570 156\nDescription of special requirements: uses a wheelchair, oxygen dependent, requires transport to hospital\nLife sustaining equipment: oxygen concentrator"
      description: Completed VPR entry with person, address, needs and contact fields (85 tier)
      synthetic: true
    - value: "Registration - Persons Requiring Special Assistance in a Disaster/Evacuation\nCONFIDENTIAL DOCUMENT\nFull name: Jamie Teston\nResidential address: 3/27 Carrington Avenue, Blackwater QLD 4717\nMedical condition: home haemodialysis three times weekly\nCarer: Riley Teston\nAssistance animal: guide dog"
      description: Completed council special-assistance registration with dialysis dependency and carer (85 tier)
      synthetic: true
    - value: "VPR entry updated 12/09/2026. Evacuation needs: bed-bound, requires stretcher transport; SES to phone before cyclone landfall."
      description: Register note with a populated evacuation needs field only (75 tier)
      synthetic: true
    - value: "Local disaster coordinator - vulnerable persons register extract for the Emerald flood evacuation\nResident: Casey Teston\nLocation: 8 Sandpiper Court, Emerald"
      description: LDMG register extract with a named resident and address only (75 tier)
      synthetic: true
  should_not_match:
    - value: "People with vulnerabilities in disasters: A framework for an effective local response. People may have impaired mobility, multiple chronic health conditions, or be reliant on medical equipment and medication, and some are oxygen dependent."
      description: State framework text (guidance exclusion, 65 at most)
    - value: "Registration - Persons Requiring Special Assistance in a Disaster/Evacuation\nDetails of person being registered\nName:\nAddress:\nTelephone:\nContact person who can provide special assistance, support and/or information. (e.g. parent, sibling, etc.)\nName:\nDescription of special requirements. (e.g. use a wheelchair, requires transport to hospital)\nPlease provide details: ______________"
      description: Blank council registration form (labels without values, 65 only)
    - value: "Vulnerable Persons Register. Council maintains this register to better support people who may require special assistance during a disaster or emergency event. Download the VPR registration form and email it to council."
      description: Council VPR web page (65 only)
    - value: "The council says 412 residents are now on its vulnerable persons register ahead of storm season, up from 350 last year."
      description: News with aggregate numbers (65 only)
    - value: "Local Disaster Management Plan (available for inspection under s 60). The LDMG will use the vulnerable persons register to prioritise evacuation assistance. Special needs: see Annexure 3-C."
      description: Public LDMP text that refers to the register (65 only)
    - value: "Vulnerable persons register - use this template for staff induction\nName: Alex Teston\nAddress: 1 Example Street, Emerald\nCarer: Sam Teston"
      description: Induction template with fixture framing (template exclusion)
false_positives:
  - description: Council VPR web pages, the state framework, LDMPs and news that name the register.
    mitigation: Enforce tiers need a populated field, and a guidance exclusion suppresses the framework, fact sheets and FAQ pages.
  - description: Blank registration forms.
    mitigation: Values must be on the same line as the label, and blank lines, square-bracket and angle-bracket placeholders and n/a/tbc/see values are rejected, so a form's stacked labels never count.
  - description: Evacuation-centre sign-in sheets and recovery assistance files that do not use a register title.
    mitigation: Not matched here. Recovery aid files are covered by global-top500-399-emergency-aid-request-files, and emergency contact lists by global-top500-046-emergency-contact-details.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_vpr_primary
      matches:
        - ref: Regex_au_qld_vpr_person_address_field
        - ref: Regex_au_qld_vpr_needs_field
        - ref: Regex_au_qld_vpr_contact_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_vpr_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_vpr_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_vpr_person_address_field
            - Regex_au_qld_vpr_needs_field
            - Regex_au_qld_vpr_contact_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_vpr_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_vpr_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_vpr_primary
      pattern: >-
        (?i)\b(?:vulnerable\s+persons?\s+register(?:\s+(?:registration|form|entry|record))?|VPR\W{0,4}(?:registration|entry|record|form)|persons?\s+requiring\s+special\s+assistance\s+in\s+a\s+disaster|special\s+needs\s+registration(?:\s+form)?|people\s+with\s+vulnerabilities\s+in\s+disasters)\b
    - id: Regex_au_qld_vpr_person_address_field
      pattern: >-
        (?i)\b(?:(?:name|full\s+name|name\s+of\s+(?:the\s+)?person\s+being\s+registered|registrant|resident|client)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:(?:Mr|Mrs|Ms|Miss|Dr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:address|residential\s+address|home\s+address|street\s+address|location)[ \t]*[:#][ \t]{0,5}(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30})
    - id: Regex_au_qld_vpr_needs_field
      pattern: >-
        (?i)\b(?:description\s+of\s+special\s+requirements|special\s+(?:requirements|needs)|assistance\s+(?:required|needed)|evacuation\s+(?:needs|requirements)|life\s+sustaining\s+equipment|medical\s+(?:conditions?|equipment|dependency|needs)|mobility(?:\s+(?:aid|needs))?|support\s+aid\s+animal|assistance\s+animal|medication|disability)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|none|nil|no|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z][A-Za-z'-]{2,30}
    - id: Regex_au_qld_vpr_contact_field
      pattern: >-
        (?i)\b(?:contact\s+person|primary\s+carer|carer|next\s+of\s+kin|emergency\s+contact|support\s+person|relationship\s+to\s+(?:the\s+)?person\s+being\s+registered)(?:\s+(?:name|details))?[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|none|nil|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z(][A-Za-z()'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_vpr_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - framework for an effective local response
            - fact sheet
            - factsheet
            - frequently asked questions
            - how to register
            - who can register
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a completed vulnerable persons register entry or special-assistance registration. The entry ties a named person and home address to disability, mobility limits or dependence on medical equipment such as oxygen or dialysis, along with carers and evacuation needs. It is health information tied to the location of a person who may not be able to self-evacuate. Disclosure exposes health status and makes the person identifiable as someone living alone or dependent on others, which carries risks of targeting and exploitation. Loss or corruption of the register can delay evacuation. Information acquired under the Disaster Management Act 2003 is subject to the s 139 confidentiality offence. Council web pages, the state framework, LDMPs and blank forms are excluded from enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy.
