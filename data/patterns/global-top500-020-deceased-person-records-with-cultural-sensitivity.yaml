schema: testpattern/v1
name: Deceased-person records with cultural sensitivity
slug: global-top500-020-deceased-person-records-with-cultural-sensitivity
version: 1.5.2
type: regex
pattern_class: concept
engine: boost_regex
description: 'Identifies records about a deceased person that carry cultural-sensitivity handling requirements (for example Aboriginal and Torres Strait Islander name and image restrictions): a deceased-person record with populated person fields and explicit cultural-protocol evidence.'
operation: 'Primary: deceased person/estate, death record/notification, next of kin, Aboriginal deceased, Torres Strait Islander, sorry business, cultural sensitivity. 65 (discovery only) = primary alone. 75 = primary plus one populated deceased-person record field (name / name of deceased, date of birth, date or place of death, next of kin, community, language group, registration / case / file number, coroner reference) plus cultural-protocol evidence (cultural protocol, restricted name or image, images of the deceased, replacement name, name avoidance, community authority, traditional custodian, culturally restricted). 85 = primary plus two distinct populated record fields plus cultural-protocol evidence. All tiers exclude template/fixture text.'
pattern: (?is)\b(?:deceased\s+person|deceased\s+estate|death\s+record|cultural\s+sensitivity|Aboriginal\s+deceased|Torres\s+Strait\s+Islander|sorry\s+business|death\s+notification|next\s+of\s+kin)\b
confidence: medium
confidence_justification: 'Medium: death-record vocabulary is common in probate, guidance and news; enforcement needs a populated deceased-person record and cultural-protocol evidence that the primary does not itself match.'
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - government
corroborative_evidence:
  keywords:
    - deceased-person records with cultural sensitivity
    - deceased
    - person
    - records
    - cultural
    - sensitivity
    - personal
    - identity
    - demographics
  proximity: 300
  keyword_lists:
    - pii-personal
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: |-
        Death notification - Aboriginal deceased
        Name of deceased: Jamie Teston
        Date of death: 02/08/2026
        Community: Palm Island
        Senior next of kin: Morgan Teston
        Cultural protocol: the family requests that the name and images are not used; use the replacement name advised by community authority.
      description: 85 - populated deceased-person record with cultural-protocol evidence
      synthetic: true
    - value: |-
        Deceased estate file
        Name of deceased: Riley Teston
        The family asked that images of the deceased are not reproduced, in line with cultural protocol.
      description: 75 - one populated record field plus cultural-protocol evidence
      synthetic: true
    - value: 'Aboriginal deceased record: restricted image under community cultural protocol.'
      description: 65 discovery - cultural restriction without populated record fields
    - value: Death record received from the registry for the estate file.
      description: 65 discovery - death-record mention without fields or cultural evidence
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: Deceased estate notice sent to next of kin.
      description: Generic probate wording without cultural-protocol evidence stays discovery-only
    - value: Cultural sensitivity training for customer service.
      description: Culture wording without a deceased-person record must not enforce
    - value: 'Cultural protocol guidance: when a deceased person is Aboriginal or Torres Strait Islander, ask the family before using their name or image.'
      description: Guidance naming the protocol - no populated record (65 at most)
    - value: |-
        Death notification form
        Name of deceased: ________
        Date of death: __/__/____
        Community: [if known]
        Cultural protocol: [family advice]
      description: Blank form - placeholder fields are rejected
    - value: 'Warning: this story contains images of a deceased person. The community asked media to respect cultural protocol.'
      description: News warning - no populated record fields
false_positives:
  - description: >-
      Common words and phrases related to deceased-person records with cultural sensitivity appearing in policy documents, training materials, HR templates, or compliance guidelines without actual
      personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_deceased_records
      matches:
        - ref: Regex_global_top500_020_deceased_person_records_record_structure
          min_count: 2
          unique_results: true
        - ref: Evidence_deceased_cultural_protocol
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Pattern_deceased_records
      matches:
        - ref: Regex_global_top500_020_deceased_person_records_record_structure
        - ref: Evidence_deceased_cultural_protocol
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_deceased_records
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_deceased_records
      pattern: (?is)\b(?:deceased\s+person|deceased\s+estate|death\s+record|cultural\s+sensitivity|Aboriginal\s+deceased|Torres\s+Strait\s+Islander|sorry\s+business|death\s+notification|next\s+of\s+kin)\b
    - id: Regex_global_top500_020_deceased_person_records_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|name\s+of\s+deceased|deceased(?:\s+name)?|date\s+of\s+death|DOD|place\s+of\s+death|(?:senior\s+)?next\s+of\s+kin|NOK|community|language\s+group|informant|(?:death\s+)?registration\s+(?:no\.?|number)|coroner(?:'s)?\s+(?:ref|reference|case\s+(?:no\.?|number))|(?:case|file)\s+(?:no\.?|number))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_deceased_cultural_protocol
      groups:
        - match_style: word
          terms:
            - cultural protocol
            - restricted name
            - restricted image
            - images of the deceased
            - images of deceased
            - replacement name
            - name avoidance
            - community authority
            - traditional custodian
            - culturally restricted
            - cultural advice
      strength: domain
risk_description: The enforcing tiers identify a populated deceased-person record (name, dates, community, next of kin, registration or case references) that also records cultural-protocol handling such as name or image restrictions. Disclosure can breach community cultural protocols and cause distress to families and communities, and may expose living next of kin, but the record usually concerns one deceased person and a bounded family group. Phrase-only mentions (probate notices, guidance, news warnings) stay at 65 discovery. Risk 3 and OFFICIAL are retained from the reviewed workbook; populated culturally restricted records may warrant local elevation.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 3, PSPF OFFICIAL, QGISCF OFFICIAL and OFFICIAL DLM at Low tier are retained from the reviewed workbook for a
    populated deceased-person record carrying cultural-protocol handling. Disclosure can breach name or image
    restrictions and distress family and community, but SENSITIVE is not met under that rating because the record
    usually concerns one person and a bounded family group.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low handling is the baseline for one deceased-person record; agencies holding culturally restricted
      records should apply local protocol controls on top.
references:
  - title: AIATSIS - Australian Institute of Aboriginal and Torres Strait Islander Studies
    url: https://aiatsis.gov.au/
  - title: OAIC - What is personal information
    url: https://www.oaic.gov.au/privacy/your-privacy-rights/your-personal-information/what-is-personal-information
