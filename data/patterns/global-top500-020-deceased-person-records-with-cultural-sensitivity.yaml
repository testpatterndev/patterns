  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): 75 now requires a populated deceased-person record field (new Regex_..._record_structure) plus cultural-protocol evidence; 85 requires two distinct record fields plus that evidence (the old tiers could fire on primary phrases alone because the evidence groups repeated them). Removed Aboriginal deceased / Torres Strait Islander deceased / sorry business from the protocol group (the primary matches them) and dropped the unused label/domain groups; template exclusion renamed to the standard Keyword_noise_exclusion. Replaced bare-phrase positives with populated synthetic records; added guidance, blank-form and news decoys. Metadata: removed HRIPA, My Health Records Act, NDB Scheme and GDPR (not applicable to deceased-person cultural records); data_categories government-id -> government; risk_description updated to the gated behaviour (risk 3 retained); added references.'
  - version: 1.4.0
    date: '2026-07-17'
    description: 'TP-00151 approved reduced scope: add the reviewer-defined Evidence_deceased_cultural_protocol phrase dictionary (Aboriginal deceased, Torres Strait Islander deceased, sorry business, cultural protocol, restricted name/image, community authority, traditional custodian, culturally restricted) and require it on the 75/85 enforcing tiers alongside the existing death-record anchor, evidence, and template NOT-gate; the generic deceased-record 65 tier is demoted to discovery_only. Per QA consistency correction, the generic-probate near miss is authored as a non-enforcing (discovery) negative rather than the first-pass no-match expectation. Added the cultural-restriction positive plus probate and culture-training negatives.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 626 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
