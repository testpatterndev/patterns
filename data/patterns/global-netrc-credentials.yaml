schema: testpattern/v1
name: Netrc Credentials (.netrc / _netrc)
slug: global-netrc-credentials
version: 1.0.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects login and password entries from a .netrc file (_netrc on Windows), the plaintext auto-login file read by
  curl, git, ftp, pip, Heroku and many other command-line tools. An entry names a host (machine, or the catch-all
  default) and supplies the login and password used for it, on one line or spread across several. npm supply-chain
  worms and infostealers in 2026 harvested ~/.netrc because one file often holds source-control, package-registry and
  deployment credentials together.
operation: >-
  The primary regex matches an adjacent login/password token pair in either order (an account token may sit between
  login and password), with an unquoted or double-quoted password, and is discovery-only at 65. The 75 tier also requires the netrc host token on a different span (machine
  <host> followed by login, password or account, or default login). The 85 tier further requires a netrc file reference
  or a second distinct login/password pair. A machine <host> password <value> entry with no login token is
  discovery-only. Placeholder passwords, environment-variable references and the documented anonymous FTP default are
  rejected inside the regex; the shared template exclusion vetoes documentation examples on every tier.
pattern: '(?i)(?<![A-Za-z0-9_-])(login\s+(?!anonymous\s)[^\s]{1,128}(?:\s+account\s+[^\s]{1,128})?\s+password\s+(?!"?(?:<|\*{3}|x{4}|\$|your|pass(?:word|wd)?\b|secret\b|token\b|changeme|redacted))(?:"[^"\n]{1,128}"|[^\s"]{1,256})|password\s+(?!"?(?:<|\*{3}|x{4}|\$|your|pass(?:word|wd)?\b|secret\b|token\b|changeme|redacted))(?:"[^"\n]{1,128}"|[^\s"]{1,256})\s+login\s+[^\s]{1,128})'
confidence: medium
confidence_justification: >-
  Medium confidence. The netrc grammar is documented by GNU inetutils and curl and the machine/login/password token
  sequence is rare outside real netrc content, but the tokens are ordinary English words and the password has no
  fixed shape, so the regex cannot tell a live secret from a stale or invented one. Enforce tiers therefore require the
  host token as well as the login/password pair and reject placeholder values.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
  - Computer Fraud and Abuse Act
  - Computer Misuse Act 1990
frameworks:
  - CIS Controls
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - machine
    - default
    - .netrc
    - _netrc
    - netrc
  proximity: 300
test_cases:
  should_match:
    - value: login deploy password ABCDEFGHIJKLMNOP0123
      description: Exact 65 probe - login/password token pair with no machine or default token
    - value: machine git.internal.corp login deploy password ABCDEFGHIJKLMNOP0123
      description: Exact 75 probe - single-line netrc entry
    - value: |-
        machine registry.internal.corp
          login ops@corp.internal
          password ABCDEFGHIJKLMNOPQRSTUVWXYZ012345
      description: Exact 75 probe - one entry spread across lines, as most .netrc files are written
    - value: default login svc-backup password ABCDEFGHIJ0123456789
      description: Exact 75 probe - default entry with a real login
    - value: machine artifacts.internal.corp password ABCDEFGHIJKLMNOP0123 login deploy
      description: Exact 75 probe - password token before the login token (the grammar fixes no order)
    - value: machine ftp.internal.corp login backup account ops password ABCDEFGHIJ0123456789
      description: Exact 75 probe - account token between login and password
    - value: machine nas.internal.corp login backup password "ABCDEF GHIJKL 012345"
      description: Exact 75 probe - double-quoted password containing spaces (curl 7.84.0 and later)
    - value: |-
        machine github.com
        login buildbot
        password ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0123

        machine pypi.internal.corp
        login __token__
        password abcdefghijklmnopqrstuvwxyz012345
      description: Exact 85 probe - two distinct entries in one file
    - value: |-
        $ cat ~/.netrc
        machine build.internal.corp login svc-ci password 0123456789ABCDEFGHIJ
      description: Exact 85 probe - one entry with a netrc file reference
    - value: machine vault.internal.corp password ABCDEFGHIJKLMNOP0123
      description: Discovery only - machine and password with no login token
  should_not_match:
    - value: default login anonymous password user@site
      description: The anonymous FTP default from the GNU inetutils manual is not a secret
    - value: machine example.com login daniel password qwerty
      description: The curl documentation example; the shared template exclusion vetoes its example.com host
    - value: machine git.internal.corp login deploy password <your-token>
      description: Angle-bracket placeholder instead of a password
    - value: machine git.internal.corp login deploy password ${NETRC_PASSWORD}
      description: Environment-variable reference in a netrc template, not a stored secret
    - value: machine git.internal.corp login deploy
      description: Entry with no password token
    - value: Store the login and the password for each machine in your netrc file.
      description: Prose that names the tokens without an entry
    - value: 'auth: login failed, password expired for machine build01'
      description: Log line whose words fall in login/password order with no netrc host token (discovery only)
    - value: 'Documentation example for ~/.netrc: machine git.internal.corp login deploy password ABCDEFGHIJKLMNOP0123'
      description: Complete entry with file context, vetoed on every tier by the documentation-example framing
false_positives:
  - description: >-
      Documentation, READMEs and CI templates that show a netrc entry with an invented password that is not one of the
      recognised placeholder forms.
    mitigation: >-
      The regex rejects angle-bracket, starred, x-run and variable-reference values and the words password, secret and
      token; the shared template exclusion vetoes example.com hosts and documentation framing. Review remaining hits
      against the named host.
  - description: >-
      Prose or log text where the words login and password happen to be followed by other words, such as a log line
      reporting a failed login.
    mitigation: >-
      Such text reaches only the discovery tier. Enforce tiers require a machine <host> or default login token next to
      a netrc token, which ordinary sentences do not contain.
  - description: Stale .netrc files whose passwords have been rotated or whose hosts no longer exist.
    mitigation: The pattern cannot test liveness. Treat a match as a credential to rotate and confirm with the host owner.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 8
risk_description: >-
  This medium-confidence detector identifies a host, login and plaintext password from a .netrc auto-login file. A
  valid entry lets whoever holds it authenticate to the named host as that account, which for typical developer
  machines means source-control, package-registry, deployment or FTP access, and a single file often carries several
  such entries. Harm is serious but bounded by each account's rights and by whether the password is still current; the
  match does not establish administrator rights or the criticality of the host. Risk 8 and SENSITIVE InfoTech fit
  directly usable host credentials with unknown privilege; PROTECTED requires confirmed privileged access to critical
  systems.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE InfoTech because a netrc entry is a
    directly usable host login. PROTECTED is not met because the entry does not establish the account's privilege, the
    criticality of the host, or that the password is still valid.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling fits plaintext host credentials whose reach is limited to the named account. High
      handling requires confirmed privileged or critical-system access.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Regex_netrc_login_password
          - Regex_netrc_machine_password
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_netrc_login_password
      matches:
        - ref: Pattern_netrc_host_token
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 85
      id_match: Regex_netrc_login_password
      matches:
        - ref: Pattern_netrc_host_token
        - type: any
          min_matches: 1
          children:
            - ref: Keyword_netrc_file_context
            - ref: Regex_netrc_login_password
              min_count: 2
              unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_netrc_login_password
      pattern: '(?i)(?<![A-Za-z0-9_-])(login\s+(?!anonymous\s)[^\s]{1,128}(?:\s+account\s+[^\s]{1,128})?\s+password\s+(?!"?(?:<|\*{3}|x{4}|\$|your|pass(?:word|wd)?\b|secret\b|token\b|changeme|redacted))(?:"[^"\n]{1,128}"|[^\s"]{1,256})|password\s+(?!"?(?:<|\*{3}|x{4}|\$|your|pass(?:word|wd)?\b|secret\b|token\b|changeme|redacted))(?:"[^"\n]{1,128}"|[^\s"]{1,256})\s+login\s+[^\s]{1,128})'
    - id: Regex_netrc_machine_password
      pattern: '(?i)(?<![A-Za-z0-9_-])(machine\s+[A-Za-z0-9._-]{1,255}\s+password\s+(?!"?(?:<|\*{3}|x{4}|\$|your|pass(?:word|wd)?\b|secret\b|token\b|changeme|redacted))(?:"[^"\n]{1,128}"|[^\s"]{1,256}))'
    - id: Pattern_netrc_host_token
      pattern: '(?i)(?<![A-Za-z0-9_-])(machine\s+[A-Za-z0-9._-]{1,255}\s+(?:login|password|account)\s|default\s+login\s)'
  keywords:
    - id: Keyword_netrc_file_context
      groups:
        - match_style: string
          terms:
            - .netrc
            - _netrc
            - netrc
      strength: specific
created: '2026-11-16'
updated: '2026-11-16'
changelog:
  - version: 1.0.0
    date: '2026-11-16'
    description: Initial release.
author: testpattern-community
license: MIT
references:
  - url: https://www.gnu.org/software/inetutils/manual/html_node/The-_002enetrc-file.html
    title: 'GNU inetutils manual, The .netrc file (tokens machine, default, login, password, account, macdef; separated by spaces, tabs or new-lines; the anonymous default example)'
  - url: https://everything.curl.dev/usingcurl/netrc.html
    title: 'everything curl, .netrc (single-line and multi-line entries; double-quoted strings since curl 7.84.0; _netrc on Windows)'
  - url: https://www.stepsecurity.io/blog/chaindrop-npm-worm
    title: 'StepSecurity, ChainDrop npm worm, 4 August 2026 (lists ~/.netrc among the credential files harvested)'
