schema: testpattern/v1
name: Family and Domestic Violence Leave and Workplace Support Record
slug: au-family-domestic-violence-leave-record
version: 1.1.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects HR, payroll and timesheet records showing that a named or numbered employee has taken
  or requested family and domestic violence (FDV) leave, and employee DFV support and workplace
  safety plans. Under Fair Work Act 2009 ss106A-106E every national-system employee is entitled
  to 10 days of paid FDV leave, and Fair Work Regulations 2009 reg 3.48 prevents FDV leave from
  being shown on pay slips because the record itself discloses that the employee is experiencing
  violence. Queensland public sector and state-system employees have DFV leave under the
  Industrial Relations Act 2016 (Qld) ss 52-54, and Queensland public service employees have
  additional support under Public Service Commission Directive 03/20 "Support for employees
  affected by domestic and family violence": confidentiality of disclosures, risk assessment and
  safety planning, changes to work location, hours, email addresses and telephone numbers,
  removal of public contact details, secure parking, flexible working arrangements, and support
  to transfer or relocate. Enterprise agreements and other directives and policies use the same
  terms.
operation: >-
  Primary: a family and domestic violence / domestic and family violence / domestic violence /
  family violence leave phrase, the FDV leave / DFV leave / FDVL abbreviations, a workplace / DFV /
  FDV safety plan phrase, a DFV/FDV support plan, options, arrangement or request or workplace
  support or adjustment phrase, "employee(s) affected by domestic and family violence",
  "Directive 03/20", or a Fair Work Act 2009 s 106A-106E or Industrial Relations Act 2016 s 52-54
  citation. 75 tier requires a populated employee field (employee/staff/worker name, number or ID
  with a non-placeholder value) within 300 characters. 85 tier additionally requires either a
  populated leave detail (leave dates, start/end date, days or hours taken) or a populated
  workplace-support structure (work location changed to a named place, a new or unlisted work
  email or phone with a value, hours/roster changed, security or reception alerted, a photo of the
  respondent held, a named respondent or perpetrator, a DVO naming the workplace, secure parking
  allocated, email blocking applied, online profile removed, flexible arrangements with a value,
  or a review date). All enforce tiers exclude template/fixture text and directive/policy text
  (This directive, this policy applies, Supersedes, QH-POL, information sheet, Workplace approach
  to employees who use violence). 65 is discovery-only and will surface policy, directive,
  enterprise agreement and payroll configuration text.
pattern: >-
  (?i)\b(?:paid\s+)?(?:family\s+and\s+domestic\s+violence|domestic\s+and\s+family\s+violence|domestic\s+violence|family\s+violence)\s+leave\b|\b(?:FDV|DFV)\s+leave\b|\bFDVL\b|\b(?:workplace|DFV|FDV)\s+safety\s+plan\b|\b(?:DFV|FDV|(?:domestic\s+and\s+family|family\s+and\s+domestic)\s+violence)\s+(?:support\s+(?:plan|options?|arrangements?|request)|workplace\s+(?:support|adjustments?))\b|\bemployees?\s+affected\s+by\s+(?:domestic\s+and\s+family|family\s+and\s+domestic)\s+violence\b|\bDirective\s+0?3/20\b|\bFair\s+Work\s+Act(?:\s+2009)?(?:\s*\(Cth\))?,?\s+(?:s|ss|section|sections)\.?\s*106[A-E]\b|\bIndustrial\s+Relations\s+Act\s+2016(?:\s*\(Qld\))?,?\s+(?:s|ss|section|sections)\.?\s*5[234]\b
confidence: medium
confidence_justification: >-
  Medium: FDV leave and DFV support terms are common in enterprise agreements, directives, HR
  policy and payroll setup, so enforce tiers require a populated employee field and exclude
  directive/policy text. Records that identify the employee only by name in free text, without a
  field label, fall to discovery. Workplace safety-plan field labels are not published by the
  directive, so the support structure is a generic populated-field shape built from the support
  options the directive lists. Whether Directive 03/20 has been replaced under the Public Sector
  Act 2022 was not verified; the anchor is kept because existing records cite it. 85/75 are
  heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - family and domestic violence leave
    - leave request
    - leave balance
    - payroll
    - timesheet
    - employee
    - workplace safety plan
    - Directive 03/20
  proximity: 300
  keyword_lists:
    - au-dfv-terminology
test_cases:
  should_match:
    - value: "Leave request\nEmployee name: Avery Teston\nEmployee ID: 4471820\nLeave type: Family and domestic violence leave (paid)\nStart date: 15/09/2026\nEnd date: 17/09/2026\nApproved by: Jordan Staffson"
      description: Approved FDV leave request
      synthetic: true
    - value: 'Timesheet adjustment. Staff number: P0048213. FDV leave taken 7.6 hours on 03/09/2026. Record against confidential leave code only; do not show on payslip.'
      description: Timesheet entry for FDV leave
      synthetic: true
    - value: "HR case note - Employee ID: 5520117. Manager advised employee has requested domestic and family violence leave\nand a change of work location. Leave dates: 22/09/2026 to 26/09/2026."
      description: HR case note recording DFV leave and dates across a line break
      synthetic: true
    - value: "Workplace safety plan - CONFIDENTIAL (Directive 03/20)\nEmployee name: Sam Teston\nPosition number: 30012877\nWork location changed to: Toowoomba regional office from 06/10/2026\nNew work phone number: 07 4600 1234 (unlisted)\nReception alerted; photo of the respondent held at the front desk.\nRespondent: Jordan Teston\nReview date: 06/01/2027"
      description: Directive 03/20 workplace safety plan with relocation, changed contact details and security alert (85 tier)
      synthetic: true
    - value: "Employee ID: 7730251. DFV support plan agreed with the employee; details held by HR only."
      description: DFV support plan with a populated employee number only (75 tier)
      synthetic: true
    - value: "Pay slip\nEmployee: Alex Teston\nEmployee number: 0091827\nPay period: 01/09/2026 to 14/09/2026\nFDV leave 15.2 hrs $684.00"
      description: Pay slip that shows FDV leave (reg 3.48 compliance breach) with a populated employee (75 tier)
      synthetic: true
  should_not_match:
    - value: Under the Fair Work Act 2009, all employees, including casuals, are entitled to 10 days of paid family and domestic violence leave in each 12-month period.
      description: Entitlement description from guidance
    - value: 'Clause 34.5 Domestic and family violence leave. An employee experiencing domestic and family violence is entitled to paid leave in accordance with the Directive.'
      description: Enterprise agreement clause
    - value: "Pay code: 0735\nDescription: FDV leave\nPayslip display: Ordinary hours\nEmployee: __________"
      description: Payroll configuration row with a blank employee field
    - value: "Support for employees affected by domestic and family violence\nDirective 03/20 | Supersedes: 04/15\nThe chief executive will conduct risk assessments and implement workplace safety needs and arrangements such as increased security measures; changes to email addresses and telephone numbers and email blocking; secure parking; support to transfer or relocate, where practicable. Leave applications should be processed in such a way as to maximise confidentiality."
      description: Directive 03/20 text (decoy, 65 only)
    - value: "QH-POL-391 Support for employees affected by domestic and family violence. Managers should develop a workplace safety plan with the employee, which may include a change of work location, secure parking and email blocking."
      description: Agency DFV support policy (decoy, 65 only)
    - value: "Workplace safety plan\nEmployee name: __________\nWork location changed to: __________\nRespondent: __________\nReview date: ___/___/____"
      description: Blank workplace safety plan form (65 only)
    - value: "Under the Fair Work Act 2009 ss 106A-106E, employers must keep information about an employee's family and domestic violence leave confidential where possible, and pay slips must not show it."
      description: Fair Work Act guidance paraphrase (65 only)
false_positives:
  - description: Enterprise agreements, HR policies, Directive 03/20, agency DFV support policies and Fair Work guidance describing the entitlement and support options.
    mitigation: Enforce tiers require a populated employee field; policy text has none. Directive/policy exclusion group (This directive, this policy applies, Supersedes, QH-POL, information sheet).
  - description: Payroll system configuration (leave type and pay code tables).
    mitigation: Configuration tables have no employee value; blank and placeholder values are rejected.
  - description: Blank safety-plan and support-request forms.
    mitigation: Workplace-support and employee fields reject blank lines, bracket placeholders and undated review lines.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_fdv_leave
      matches:
        - ref: Regex_employee_field
        - ref: Regex_leave_detail
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_fdv_policy_exclusion
    - confidence_level: 85
      id_match: Regex_fdv_leave
      matches:
        - ref: Regex_employee_field
        - type: any
          min_matches: 1
          refs:
            - Regex_dfv_workplace_support
            - Regex_dfv_workplace_security
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_fdv_policy_exclusion
    - confidence_level: 75
      id_match: Regex_fdv_leave
      matches:
        - ref: Regex_employee_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_fdv_policy_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_fdv_leave
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_fdv_leave
      pattern: >-
        (?i)\b(?:paid\s+)?(?:family\s+and\s+domestic\s+violence|domestic\s+and\s+family\s+violence|domestic\s+violence|family\s+violence)\s+leave\b|\b(?:FDV|DFV)\s+leave\b|\bFDVL\b|\b(?:workplace|DFV|FDV)\s+safety\s+plan\b|\b(?:DFV|FDV|(?:domestic\s+and\s+family|family\s+and\s+domestic)\s+violence)\s+(?:support\s+(?:plan|options?|arrangements?|request)|workplace\s+(?:support|adjustments?))\b|\bemployees?\s+affected\s+by\s+(?:domestic\s+and\s+family|family\s+and\s+domestic)\s+violence\b|\bDirective\s+0?3/20\b|\bFair\s+Work\s+Act(?:\s+2009)?(?:\s*\(Cth\))?,?\s+(?:s|ss|section|sections)\.?\s*106[A-E]\b|\bIndustrial\s+Relations\s+Act\s+2016(?:\s*\(Qld\))?,?\s+(?:s|ss|section|sections)\.?\s*5[234]\b
    - id: Regex_employee_field
      pattern: >-
        (?i)\b(?:employee|staff|worker|personnel|payroll)(?:\s+(?:name|no\.?|number|ID|#))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_leave_detail
      pattern: >-
        (?i)\b(?:(?:leave|absence)\s+(?:dates?|period|from|start|taken)|(?:start|end|commencement|return)\s+date|date\s+(?:from|to)|(?:days|hours)\s+taken|taken)\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,3}(?:\.\d{1,2})?\s*(?:days?|hours?|hrs?)\b)
    - id: Regex_dfv_workplace_support
      pattern: >-
        (?i)\b(?:(?:work\s+)?(?:location|site|office|workplace|team)\s+(?:changed|relocated|transferred|moved)(?:\s+(?:to|from))?\s*[:#-]?\s*(?!(?:n/?a|unknown|tbc|tba|the|a|an|any|where)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9'-]{2,30}|(?:new|changed|unlisted)\s+(?:work\s+)?(?:email|phone|telephone|mobile|extension)(?:\s+(?:number|address))?\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)[A-Z0-9+(][A-Za-z0-9@.()+ -]{3,40}|(?:hours|roster|shifts?|start\s+time|work\s+pattern)\s+(?:changed|varied|adjusted)(?:\s+(?:to|from))?\s*[:#-]?\s*[0-9A-Z]|flexible\s+(?:working\s+)?arrangements?\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|the|a|an|any)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9'-]{2,40}|review\s+date\s*[:#-]?\s*\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4})
    - id: Regex_dfv_workplace_security
      pattern: >-
        (?i)\b(?:(?:security|reception|front\s+desk)\s+(?:alerted|briefed|notified|alert\s+(?:issued|placed|active))|photo(?:graph)?\s+of\s+(?:the\s+)?(?:respondent|perpetrator|person\s+using\s+violence)\s+(?:provided|held|given|supplied)|(?:respondent|perpetrator|person\s+using\s+violence)(?:\s+name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:DVO|domestic\s+violence\s+order|protection\s+order)\s+(?:names|includes|covers)\s+(?:the\s+)?workplace|secure\s+parking\s+(?:allocated|approved|provided|arranged)|email\s+blocking\s+(?:applied|enabled|in\s+place|set\s+up)|(?:online\s+profile|public\s+contact\s+details)\s+(?:removed|hidden|suppressed))
  keywords:
    - id: Keyword_fdv_policy_exclusion
      groups:
        - match_style: word
          terms:
            - This directive
            - this policy applies
            - 'Supersedes:'
            - QH-POL
            - information sheet
            - Workplace approach to employees who use violence
      strength: specific
risk_rating: 8
risk_description: >-
  The detector identifies an HR, payroll or timesheet record showing that an identified employee
  has requested or taken family and domestic violence leave, or a workplace safety or support plan
  for an employee affected by DFV. The record discloses that the employee is experiencing violence
  and, often, when they are absent, where they now work, their new contact details and the
  identity of the respondent. If it reaches a person using violence who works in the same
  organisation, a shared payroll mailbox or a joint bank statement, it can escalate risk; this is
  why reg 3.48 keeps FDV leave off pay slips and Directive 03/20 requires disclosures to be kept
  confidential. Enterprise agreements, directives, policies and payroll configuration are excluded
  from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy; safety plans that record a
  relocated work location may warrant handling at the au-dfv-confidential-address level.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Fair Work Ombudsman — Pay slips (reporting paid family and domestic violence leave)
    url: https://www.fairwork.gov.au/pay-and-wages/paying-wages/pay-slips
  - title: Fair Work Ombudsman — Family and domestic violence leave
    url: https://www.fairwork.gov.au/leave/family-and-domestic-violence-leave
  - title: Queensland Government (forgov) — Support for employees affected by domestic and family violence (Directive 03/20) (decoy source)
    url: https://www.forgov.qld.gov.au/pay-benefits-and-policy/directives-policies-circulars-and-guidelines/support-for-employees-affected-by-domestic-and-family-violence-directive-0320
