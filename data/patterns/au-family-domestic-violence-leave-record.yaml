    date: '2026-09-24'
    description: >-
      Add employee DFV support and workplace safety plans (Directive 03/20; IR Act 2016 (Qld) ss 52-54; Fair Work Act ss 106A-106E citations) to the primary; add a second 85 route requiring a populated workplace-support structure (relocation, changed contact details, security alert, named respondent, review date); add a directive/policy exclusion to enforce tiers; add safety-plan, support-plan and pay-slip-leak positives and Directive 03/20, agency policy, blank form and Fair Work guidance decoys. Existing tests unchanged.
  - version: 1.0.0
    date: '2026-09-24'
