schema: testpattern/v1
name: Competency Assessment, RPL and Credit Transfer Record
slug: au-vet-competency-rpl-evidence
version: 1.2.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Populated assessment and recognition records for a named or numbered learner in VET and higher
  education: competency assessment records, recognition of prior learning (RPL) applications,
  evidence portfolios, assessments and decisions, recognition of current competency, credit
  transfer and advanced standing applications and decisions, and course credit applications. They
  tie a learner to units, qualifications or courses and to an assessment outcome, credit granted or an
  assessor. The slug keeps its original VET name; the detector now also covers university credit and
  advanced standing. Boundary: academic transcripts and statements of results belong to
  global-top500-343-academic-transcripts; completion and graduation records to
  au-education-graduation-completion-record.
operation: >-
  Primary: recognition of prior learning, RPL application / assessment / evidence / portfolio / kit /
  candidate / record / report / interview, competency assessment or conversation record / report /
  outcome, recognition of current competency, recognition of credit, credit transfer application /
  decision / record / assessment, advanced standing application / decision / assessment / record,
  course credit application. 65 (discovery only): primary alone, which surfaces policies, candidate
  guides and blank RPL kits. 75: primary plus a populated learner field (student, learner, candidate,
  applicant, trainee or apprentice name / ID / number, USI, LUI, EQ ID) plus either a populated unit,
  qualification or course field or a populated outcome field (competent, not yet competent, granted,
  approved, declined, further evidence required, credit points). 85: learner field plus a unit,
  qualification or course field plus either an outcome field or a named assessor, assessment officer,
  decision maker or approver. Enforce tiers exclude policy, procedure, guide, candidate instruction,
  handbook and FAQ framing. The shared template dictionary is not applied, so a completed record that
  keeps a form-template footer still matches; blank forms fail the field-value guards.
pattern: >-
  (?i)\b(recognition[ \t]+of[ \t]+prior[ \t]+learning|RPL[ \t]+(?:application|assessment|evidence|portfolio|kit|candidate|record|report|interview)|competency[ \t]+(?:assessment|conversation)[ \t]+(?:record|report|outcome)|recognition[ \t]+of[ \t]+(?:current[ \t]+competency|credit)|credit[ \t]+transfer[ \t]+(?:applications?|decisions?|records?|assessments?)|advanced[ \t]+standing[ \t]+(?:applications?|decisions?|assessments?|records?)|course[ \t]+credit[ \t]+applications?)\b
confidence: medium
confidence_justification: >-
  Medium: RPL, credit transfer and advanced standing are standard terms across RTOs, TAFE and
  universities, and enforce tiers need a populated learner field with a unit, course or outcome
  value, which policies, candidate guides and blank kits lack. Field labels are matched by wording
  only, so a provider form with unusual labels may stay at 65. 85/75 are heuristic evidence tiers, not
  measured accuracy.
jurisdictions:
  - au
regulations:
  - National Vocational Education and Training Regulator Act 2011 (Cth)
  - Tertiary Education Quality and Standards Agency Act 2011 (Cth)
  - Student Identifiers Act 2014 (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - education
  - pii
corroborative_evidence:
  keywords:
    - unit of competency
    - qualification
    - assessor
    - competent
    - credit granted
    - advanced standing
  proximity: 300
scope: narrow
risk_rating: 7
risk_description: >-
  A populated competency assessment, RPL or credit transfer record can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.
references:
  - title: ASQA assessment practice guide
    url: https://www.asqa.gov.au/for-providers/standards-for-RTOs/practice-guides/quality-area-1-training-and-assessment/assessment-practice-guide
  - title: AQF qualifications pathways policy (credit and recognition of prior learning)
    url: https://www.aqf.edu.au/framework/aqf-policies
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
classification:
  tier: Medium
  rationale: >-
    Populated competency assessment, RPL and credit transfer record maps to SENSITIVE Personal-Privacy. The classifier requires record context and corroborating fields. The mapping does not determine the risk of every matched document.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling applies to the populated record. Synthetic checks establish local matching behavior, not tenant detection accuracy.
package_tags:
  primary_component: student-child-records
  components:
    - student-child-records
  component_tier: large
  deployment_priority:
    - expanded
  sectors:
    - education
  addons: []
  label_domains:
    - education
    - privacy
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_rpl_primary
      matches:
        - ref: Regex_rpl_learner_field
        - ref: Regex_rpl_unit_field
        - type: any
          min_matches: 1
          refs:
            - Regex_rpl_outcome_field
            - Regex_rpl_assessor_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_rpl_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_rpl_primary
      matches:
        - ref: Regex_rpl_learner_field
        - type: any
          min_matches: 1
          refs:
            - Regex_rpl_unit_field
            - Regex_rpl_outcome_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_rpl_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_rpl_primary
  regexes:
    - id: Regex_rpl_primary
      pattern: >-
        (?i)\b(recognition[ \t]+of[ \t]+prior[ \t]+learning|RPL[ \t]+(?:application|assessment|evidence|portfolio|kit|candidate|record|report|interview)|competency[ \t]+(?:assessment|conversation)[ \t]+(?:record|report|outcome)|recognition[ \t]+of[ \t]+(?:current[ \t]+competency|credit)|credit[ \t]+transfer[ \t]+(?:applications?|decisions?|records?|assessments?)|advanced[ \t]+standing[ \t]+(?:applications?|decisions?|assessments?|records?)|course[ \t]+credit[ \t]+applications?)\b
    - id: Regex_rpl_learner_field
      pattern: >-
        (?i)\b((?:(?:student|learner|candidate|applicant|trainee|apprentice)(?:[ \t]+(?:full[ \t]+)?(?:name|ID|no\.?|number))?|USI|LUI|EQ[ \t]*ID)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:student|learner|candidate|name|id|n/?a|unknown|tbc|tba|withheld|not[ \t]+recorded|enter|insert|write|print|your|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{1,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3})
    - id: Regex_rpl_unit_field
      pattern: >-
        (?i)\b((?:unit(?:[ \t]+of[ \t]+(?:competency|study))?(?:[ \t]+code)?|units?[ \t]+(?:claimed|sought|requested)|qualification(?:[ \t]+(?:code|title|sought))?|course(?:[ \t]+(?:code|title|applied[ \t]+for))?|subject(?:[ \t]+code)?|national[ \t]+code|prior[ \t]+(?:study|qualification))[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|unknown|tbc|tba|the|a|an|any|all|each|see|refer|enter|insert|write|your)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9&,'./-]{1,40}(?:[ \t]+[A-Za-z0-9&,'./-]{1,30}){0,8})
    - id: Regex_rpl_outcome_field
      pattern: >-
        (?i)\b((?:assessment[ \t]+outcome|outcome|result|competency[ \t]+decision|RPL[ \t]+(?:decision|outcome)|credit[ \t]+transfer[ \t]+outcome|judgement|credit[ \t]+(?:granted|awarded|approved)|credit[ \t]+points[ \t]+(?:granted|awarded))[ \t]*[:#][ \t]{0,3}(?:competent|not[ \t]+yet[ \t]+competent|NYC|satisfactory|not[ \t]+satisfactory|granted|approved|not[ \t]+granted|not[ \t]+approved|declined|partially[ \t]+granted|partial|further[ \t]+evidence[ \t]+required|resubmit|\d{1,3}(?:[ \t]+credit[ \t]+points)?))\b
    - id: Regex_rpl_assessor_field
      pattern: >-
        (?i)\b((?:assessor|assessment[ \t]+officer|assessed[ \t]+by|decision[ \t]+maker|delegate|approved[ \t]+by|academic[ \t]+approver)(?:[ \t]+name)?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|enter|insert|write|your|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'.-]{1,30}(?:[ \t]+[A-Z][A-Za-z'.-]{0,30}){0,3})
    - id: Regex_rpl_guidance_exclusion
      pattern: >-
        (?i)\b(this[ \t]+(?:policy|procedure|guideline|guide|fact[ \t]?sheet|page|handbook|kit[ \t]+explains)|(?:assessor|candidate|applicant|student)[ \t]+guide|instructions[ \t]+(?:for|to)[ \t]+(?:candidates|applicants|students|assessors)|information[ \t]+for[ \t]+(?:candidates|applicants|students)|frequently[ \t]+asked[ \t]+questions|how[ \t]+to[ \t]+apply|applications[ \t]+close|media[ \t]+release|training[ \t]+module|blank[ \t]+form)\b
test_cases:
  should_match:
    - value: "Competency assessment record\nLearner name: Morgan Teston\nUnit code: BSBTEC201\nAssessor: Jordan Staffson\nAssessment outcome: Competent"
      description: 85 tier - competency assessment with learner, unit, assessor and outcome
      synthetic: true
    - value: "Recognition of prior learning decision\nStudent ID: RD728491\nUnit of competency: BSBTEC201\nAssessment officer: Casey Staffson\nRPL decision: Further evidence required"
      description: 85 tier - RPL decision with student ID, unit, assessment officer and decision
      synthetic: true
    - value: "Competency assessment record\nLearner name: Morgan Teston\nUnit code: BSBTEC201\nAssessor: Jordan Staffson\nAssessment outcome: Competent\nForm template version 2.1. Retain the completed record."
      description: 85 tier - completed record that keeps a form-template footer
      synthetic: true
    - value: "Credit transfer application\nStudent ID: s4471902\nCourse: Bachelor of Nursing\nPrior study: Diploma of Nursing, TAFE Queensland\nCredit granted: 80 credit points\nApproved by: Casey Teston"
      description: 85 tier - university credit transfer with student, course, credit granted and approver
      synthetic: true
    - value: "Advanced standing decision\nStudent number: 10458812\nCourse code: EDU101\nOutcome: Approved"
      description: 85 tier - advanced standing decision with student number, course code and outcome
      synthetic: true
    - value: "Recognition of current competency\nTrainee: Jordan Teston\nUnit of competency: HLTAID011 Provide first aid\nAssessor: Riley Staffson"
      description: 85 tier - recognition of current competency with trainee, unit and assessor
      synthetic: true
    - value: "RPL application\nCandidate name: Sam Teston\nUSI: ABCD123456\nQualification sought: CHC30121 Certificate III in Early Childhood Education and Care"
      description: 75 tier - RPL application with candidate and qualification, no outcome yet
      synthetic: true
  should_not_match:
    - value: "Public training unit BSBTEC201. Recognition of prior learning decisions should consider evidence of competency and an assessor judgement."
      description: Public training material (65 at most)
      synthetic: true
    - value: "Competency assessment record\nLearner name: __________\nUnit code: __________\nAssessor: __________\nAssessment outcome: __________"
      description: Blank competency assessment form (65 at most)
      synthetic: true
    - value: "Competency assessment record\nEmployee name: Jordan Staffson\nUnit code: BSBTEC201\nAssessor: Jordan Staffson\nAssessment outcome: Competent"
      description: Workplace record naming an employee, not a learner (65 at most)
      synthetic: true
    - value: "RPL kit - instructions for candidates.\nCandidate name: write your full name as it appears on your USI.\nQualification sought: enter the qualification code.\nYour assessor will contact you within ten days."
      description: RPL kit candidate instructions (65 at most)
      synthetic: true
    - value: "This policy explains how credit transfer applications are assessed. Student ID: quote it on every application. Outcome: approved applications are recorded against the student's academic record."
      description: Credit transfer policy text (65 at most)
      synthetic: true
    - value: "Advanced standing applications close 30 January. Students should attach certified transcripts and unit outlines for each subject they want credit for."
      description: Handbook notice with no identified learner (65 at most)
      synthetic: true
false_positives:
  - description: RPL kits, candidate and assessor guides, credit transfer policies and handbook pages that name the process and list the fields.
    mitigation: They lack a populated learner field with a unit, course or outcome value, and guide, instruction, policy and handbook framing is excluded from enforce tiers.
  - description: Workplace competency records for employees.
    mitigation: Enforce tiers need a learner, student, candidate, applicant, trainee or apprentice field; employee-only records stay at 65.
  - description: Blank RPL and credit transfer forms.
    mitigation: Field values reject underscores, brackets and instruction words such as enter, write and your.
exports:
  - yaml
  - purview
created: '2026-09-13'
updated: '2026-10-30'
author: PVX
license: MIT
changelog:
  - version: 1.2.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.1.0
    date: '2026-10-22'
    description: >-
      Broaden from a single 85 tier that needed four labelled fields within 1000 characters to the 65 / 75 /
      85 ladder at 300 characters, and from VET only to VET and higher education (renamed). Primary adds RPL
      applications, kits, candidates, records, reports and interviews, competency conversations,
      recognition of current competency and of credit, credit transfer, advanced standing and course credit
      applications. 75 needs a populated learner field (now also candidate, applicant, trainee, apprentice,
      USI, LUI, EQ ID) and a unit, qualification or course field or an outcome; 85 needs the unit field plus
      an outcome or a named assessor or approver. Outcome values add approved, declined, satisfactory and
      credit points. Discovery tier added. Recommended confidence 85 -> 75. University positives and RPL kit,
      policy and handbook decoys added. Risk and labels unchanged.
  - version: 1.0.3
    date: '2026-09-25'
    description: Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.0.2
    date: '2026-09-24'
    description: 'Metadata: add references / regulations'
