{
  "schema": "testpattern/v1",
  "name": "VET Competency Assessment and RPL Evidence",
  "slug": "au-vet-competency-rpl-evidence",
  "version": "1.0.2",
  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated vet competency assessment and rpl evidence using record context and corroborating fields.",
  "pattern": "(?i)(?:competency assessment record|recognition of prior learning (?:assessment|decision)|RPL evidence portfolio)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
  "regulations": [
    "National Vocational Education and Training Regulator Act 2011 (Cth)",
    "Student Identifiers Act 2014 (Cth)",
    "Privacy Act 1988 (Cth)"
  ],
  "frameworks": [
    "ISO 27001",
    "ISO 27701"
  ],
  "data_categories": [
    "education",
    "pii"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated vet competency assessment and rpl evidence can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://www.asqa.gov.au/for-providers/standards-for-RTOs/practice-guides/quality-area-1-training-and-assessment/assessment-practice-guide"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE Personal-Privacy"
  },
  "package_tags": {
    "primary_component": "student-child-records",
    "components": [
      "student-child-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "privacy"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          },
          {
            "ref": "Regex_4"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:competency assessment record|recognition of prior learning (?:assessment|decision)|RPL evidence portfolio)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:unit code|unit of competency)[ \\t]*:[ \\t]*[A-Z]{3,8}\\d{3,9}\\b"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:assessor|assessment officer)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{2,70}"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)(?:assessment outcome|competency decision|RPL decision)[ \\t]*:[ \\t]*(?:competent|not yet competent|granted|not granted|further evidence required)\\b"
      },
      {
        "id": "Regex_4",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      }
    ]
  },
  "test_cases": {
    "should_match": [
      {
        "value": "Competency assessment record\nLearner name: Morgan Teston\nUnit code: BSBTEC201\nAssessor: Jordan Staffson\nAssessment outcome: Competent",
        "description": "Synthetic populated record variant 1",
        "synthetic": true
      },
      {
        "value": "Recognition of prior learning decision\nStudent ID: RD728491\nUnit of competency: BSBTEC201\nAssessment officer: Casey Staffson\nRPL decision: Further evidence required",
        "description": "Synthetic populated record variant 2",
        "synthetic": true
      },
      {
        "value": "Competency assessment record\nLearner name: Morgan Teston\nUnit code: BSBTEC201\nAssessor: Jordan Staffson\nAssessment outcome: Competent\nForm template version 2.1. Retain the completed record.",
        "description": "Synthetic populated record variant 3",
        "synthetic": true
      },
      {
        "value": "Recognition of prior learning decision\nStudent ID: RD728491\nUnit of competency: BSBTEC201\nAssessment officer: Casey Staffson\nRPL decision: Further evidence required",
        "description": "Synthetic populated record variant 4",
        "synthetic": true
      }
    ],
    "should_not_match": [
      {
        "value": "Public training unit BSBTEC201. Recognition of prior learning decisions should consider evidence of competency and an assessor judgement.",
        "description": "Synthetic public, blank, distant or unrelated counterexample 1",
        "synthetic": true
      },
      {
        "value": "Competency assessment record\nLearner name: __________\nUnit code: __________\nAssessor: __________\nAssessment outcome: __________",
        "description": "Synthetic public, blank, distant or unrelated counterexample 2",
        "synthetic": true
      },
      {
        "value": "Competency assessment record\nEmployee name: Jordan Staffson\nUnit code: BSBTEC201\nAssessor: Jordan Staffson\nAssessment outcome: Competent",
        "description": "Synthetic public, blank, distant or unrelated counterexample 4",
        "synthetic": true
      }
    ]
  },
  "exports": [
    "yaml",
    "purview"
  ],
