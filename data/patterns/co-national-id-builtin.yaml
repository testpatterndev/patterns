schema: testpattern/v1
name: Colombia National ID (Microsoft built-in)
slug: co-national-id-builtin
version: 1.0.0
type: keyword_list
pattern_class: concept
description: >-
  Catalogue reference for the Microsoft Purview built-in Colombia National ID sensitive information type, which detects a
  Colombian national identification number (cedula de ciudadania) corroborated by identity keywords. Microsoft recommends
  medium confidence (75) for the built-in entity. This YAML-only record lets a package recipe include the Microsoft entity
  explicitly; it does not reproduce Microsoft's built-in regular expressions, keyword dictionaries, checksums or XML.
operation: >-
  In Microsoft Purview, enable the built-in entity 060c591a-0fd7-4598-a715-8a94b283dfcf to use Microsoft's detection logic.
  This reference exports YAML only and must not be deployed as a custom XML clone. The custom SIT co-national-id (Cédula de
  Ciudadanía) detects the same data with TestPattern's own tiers and stays the default; choose this built-in only through
  an explicit recipe include.
keywords:
- Colombia National ID
- Colombia National Identification Number
confidence: medium
confidence_justification: >-
  Medium confidence for this YAML-only record: its keyword logic finds references to the built-in entity name with Microsoft
  Purview context, not populated values. Microsoft's own recommended confidence for the entity is 75. The record does not
  claim to reproduce Microsoft's proprietary detection logic.
jurisdictions:
- co
regulations:
- PDPL (Colombia)
frameworks:
- ISO 27001
- ISO 27701
data_categories:
- pii
- government-id
test_cases:
  should_match:
  - value: Colombia National ID built-in SIT
    description: Microsoft built-in entity name
  - value: Colombia National Identification Number catalogue reference
    description: Name variant used for registry discovery
  - value: |-
      DLP policy inventory - Microsoft Purview
      Rule: Builtin-co-national-id-builtin
      Condition: Colombia National ID (built-in entity 060c591a-0fd7-4598-a715-8a94b283dfcf), medium confidence, instance count 1 or more
      Action: notify sender
    description: DLP rule inventory row naming the built-in entity with Microsoft Purview context
    synthetic: true
  should_not_match:
  - value: 'Cedula de ciudadania: 1.234.567.890'
    description: Populated value or sibling reference without the built-in entity name
  - value: Colombia passport register
    description: Populated value or sibling reference without the built-in entity name
  - value: National ID card scan guidance
    description: Populated value or sibling reference without the built-in entity name
false_positives:
- description: Documentation and policy inventories can mention the Microsoft built-in entity by name.
  mitigation: Treat this YAML-only record as catalogue discovery; enable the Microsoft entity for value detection.
- description: The custom SIT co-national-id detects the same data; deploying both doubles matches on the same content.
  mitigation: Pick one per package. The custom SIT is the default; include this built-in only by an explicit recipe decision.
exports:
- yaml
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
  - confidence_level: 75
    id_match: Keyword_co_national_id_builtin_name
    matches:
    - ref: Evidence_microsoft_builtin_context
  keywords:
  - id: Keyword_co_national_id_builtin_name
    groups:
    - match_style: word
      terms:
      - Colombia National ID
      - Colombia National Identification Number
    strength: specific
  - id: Evidence_microsoft_builtin_context
    groups:
    - match_style: word
      terms:
      - Microsoft Purview
      - built-in SIT
      - built-in entity
      - catalogue reference
      - entity definition
    strength: domain
risk_rating: 5
risk_description: >-
  The referenced Microsoft entity detects the same data as the custom SIT co-national-id, so this record carries that SIT's
  reviewed risk (5) and sensitivity labels unchanged. The built-in changes who maintains the detection logic, not what the
  matched content is worth to an attacker.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Tier Low is carried from the reviewed assessment of the custom SIT co-national-id, which detects the same data. This record
    is a YAML-only reference to the Microsoft entity.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low with Low handling is carried from co-national-id, the custom SIT for the same data.
references:
- url: https://learn.microsoft.com/en-us/purview/sit-defn-colombia-national-id
  title: Colombia National ID entity definition - Microsoft Learn
- url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-entity-definitions
  title: Sensitive information type entity definitions - Microsoft Learn
created: '2026-10-20'
updated: '2026-10-20'
author: testpattern-community
source: microsoft
license: MIT
changelog:
- version: 1.0.0
  date: '2026-10-20'
  description: >-
    Catalogue reference for the Microsoft built-in Colombia National ID (GUID 060c591a-0fd7-4598-a715-8a94b283dfcf, from the
    tenant SIT inventory and the Microsoft Learn entity definition). In no block: packages take it only by explicit recipe
    include.
