schema: testpattern/v1
name: Australian Electricity Derivative / PPA Confirmation
slug: au-electricity-derivative-confirmation
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects Australian OTC electricity derivative and power purchase agreement
  confirmation content - documentation under the June 2006 Australian Electricity
  Addendum and 2005 ISDA Commodity Definitions, electricity swap/cap/floor/swaption
  confirmations settled against the AEMO regional reference price, and PPA
  confirmation phrasing with $/MWh fixed prices.
operation: >-
  Matches distinctive documentation anchors (Australian Electricity Addendum, ISDA
  Commodity Definitions with electricity context), instrument-confirmation phrases
  (electricity swap confirmation, cap/floor/swaption on electricity), or fixed-price
  terms quoting $/MWh against a NEM regional reference. Confirmation documents are
  formulaic, making phrase anchors reliable.
pattern: >-
  \bAustralian\s+Electricity\s+Addendum\b|\bISDA\s+Commodity\s+Definitions\b[\s\S]{0,200}\belectricity\b|\b(?:electricity|power)\s+(?:swap|cap|floor|swaption|hedge)\s+(?:confirmation|transaction|agreement)\b|\bfixed\s+price\b[\s\S]{0,60}(?:\$|AUD)\s?[0-9]{1,4}(?:\.[0-9]{1,2})?\s?(?:/|per\s)\s?MWh|\bpower\s+purchase\s+agreement\b[\s\S]{0,120}\bconfirmation\b
confidence: medium
confidence_justification: >-
  Medium confidence: the Addendum and ISDA anchors are highly specific to executed
  or drafted electricity derivative documentation; the price-term arm is looser and
  needs corroboration. Market convention discussion (AFMA guides) uses the same
  vocabulary without deal data.
jurisdictions:
  - au
regulations:
  - "Corporations Act 2001 (Cth) - derivatives"
  - "Competition and Consumer Act 2010 (Cth)"
frameworks:
  - ISO 27001
data_categories:
  - energy-market
  - trading
  - financial
  - legal
corroborative_evidence:
  keywords:
    - counterparty
    - notional quantity
    - settlement
    - regional reference price
    - pool price
    - strike
    - trading day
    - confirmation
  proximity: 300
test_cases:
  should_match:
    - value: 'This Confirmation supplements the ISDA Master Agreement and incorporates the June 2006 Australian Electricity Addendum'
      description: Documentation anchor for an AU electricity derivative confirmation
    - value: 'electricity swap confirmation - QLD1 flat, fixed price $68.50/MWh, Cal27'
      description: Instrument confirmation with fixed $/MWh price
    - value: 'the cap strike is settled against the pool price as determined by AEMO under the 2005 ISDA Commodity Definitions for electricity transactions'
      description: ISDA Commodity Definitions with electricity context
    - value: 'power purchase agreement - executed confirmation attached for the wind farm offtake'
      description: PPA with confirmation phrasing
  should_not_match:
    - value: the swap meet is on Saturday and entry is $5
      description: Generic prose with swap and a price
    - value: solar PPA explained - a power purchase agreement is a long-term contract
      description: Educational PPA definition without confirmation context
    - value: electricity prices averaged $92/MWh in Q2 according to the AER report
      description: Public market price commentary, not a fixed-price deal term
false_positives:
  - description: AFMA conventions, ISDA templates, law-firm explainers and training
      material quote the same documentation anchors without live deal terms.
    mitigation: Require corroborative deal keywords (counterparty, notional,
      strike); reject template/example framing from enforcing tiers.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  Executed derivative confirmations and PPAs reveal hedge book composition,
  counterparties, volumes and prices - among the most commercially sensitive
  records an energy market participant holds.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: "Competition and Consumer Act 2010 (Cth)"
    url: https://www.legislation.gov.au/C2004A00109/latest/text
