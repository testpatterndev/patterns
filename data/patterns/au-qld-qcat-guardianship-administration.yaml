schema: testpattern/v1
name: QCAT Guardianship and Administration Application or Order
slug: au-qld-qcat-guardianship-administration
version: 1.1.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  QCAT applications and orders appointing or reviewing guardians and administrators for adults with impaired decision-making capacity (Form 10), interim orders and supporting health-professional reports.
operation: >-
  Primary: QCAT Guardianship and Administration Application or Order anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:Application\s+for\s+administration/guardianship\s+appointment(?:\s+or\s+review)?|guardianship\s+(?:and|or)\s+administration|Guardianship\s+and\s+Administration\s+Act\s+2000|(?:appointment|review)\s+of\s+(?:a\s+)?(?:guardian|administrator)|impaired\s+(?:decision[\s-]+making\s+)?capacity)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Guardianship and Administration Act 2000 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - health
  - legal
  - pii
corroborative_evidence:
  keywords:
    - QCAT
    - adult
    - Form 10
    - interim order
    - Public Guardian
    - Public Trustee
    - health professional report
    - dementia
  proximity: 300
customisation:
  - key: qcat-file-number
    kind: identifier-format
    identifier: qcat-file-number
    target: purview.regexes/Regex_au_qld_qcat_guardianship_administration_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's QCAT file number format (see docs/identifiers.md#qcat-file-number). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "QCAT — Application for administration/guardianship appointment or review (Form 10)\nAdult: Avery Teston\nDate of birth: 30/06/1941\nApplicant: Jordan Teston (son)\nThe adult has advanced dementia and impaired capacity for financial matters; the applicant seeks appointment of the Public Trustee as administrator."
      description: Populated record 1
      synthetic: true
    - value: "Interim order — guardianship and administration\nAdult: Morgan Teston\nQCAT file number: GAA4471-26\nThe Public Guardian is appointed for accommodation and health care decisions until the hearing on 14/10/2026."
      description: Populated record 2
      synthetic: true
    - value: "Health professional report\nAdult: Riley Teston\nDiagnosis: acquired brain injury (2019). In my opinion the adult has impaired capacity for complex financial decisions. Doctor: Dr Casey Staffson."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: QCAT can appoint a guardian or administrator for an adult with impaired decision-making capacity under the Guardianship and Administration Act 2000.
      description: Guidance or explainer text
    - value: "Form 10 Application for administration/guardianship appointment or review\nAdult: __________\nApplicant: __________\nRelationship to adult: __________"
      description: Blank form
    - value: QCAT finalised 9,850 guardianship and administration matters in 2024-25, its annual report shows.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_qcat_guardianship_administration_primary
      matches:
        - ref: Regex_au_qld_qcat_guardianship_administration_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_qcat_guardianship_administration_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_qcat_guardianship_administration_primary
      matches:
        - ref: Regex_au_qld_qcat_guardianship_administration_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_qcat_guardianship_administration_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_qcat_guardianship_administration_primary
      pattern: >-
        (?i)\b(?:Application\s+for\s+administration/guardianship\s+appointment(?:\s+or\s+review)?|guardianship\s+(?:and|or)\s+administration|Guardianship\s+and\s+Administration\s+Act\s+2000|(?:appointment|review)\s+of\s+(?:a\s+)?(?:guardian|administrator)|impaired\s+(?:decision[\s-]+making\s+)?capacity)\b
    - id: Regex_au_qld_qcat_guardianship_administration_record_structure
      pattern: >-
        (?i)\b(?:principal|attorney|adult|proposed\s+guardian|proposed\s+administrator|guardian|administrator|applicant|witness|substitute\s+decision[\s-]maker|QCAT\s+(?:file\s+)?(?:no\.?|number|ref)|application\s+(?:no\.?|number)|file\s+(?:no\.?|number)|address|name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_qcat_guardianship_administration_corroborative
      groups:
        - match_style: word
          terms:
            - text: QCAT
              case_sensitive: true
            - adult
            - Form 10
            - interim order
            - Public Guardian
            - Public Trustee
            - health professional report
            - dementia
            - intellectual disability
            - acquired brain injury
            - accommodation
            - financial matters
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a qcat guardianship and administration application or order about an identified person, gated on populated record fields. QCAT applications and orders appointing or reviewing guardians and administrators for adults with impaired decision-making capacity (Form 10), interim orders and supporting health-professional reports. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: QCAT — Forms
    url: https://www.qcat.qld.gov.au/resources/forms
created: '2026-09-24'
updated: '2026-09-24'
changelog:
