schema: testpattern/v1
name: Incident Response Plan
slug: global-incident-response-plan
version: 1.4.2
type: regex
pattern_class: concept
description: >-
  Identifies organisation-specific incident response plans with named role assignments, severity definitions or contact details. Plan titles alone are discovery-only.
operation: >-
  Regex_incident_response_plan (incident response plan/procedure/playbook, IRP, cyber security incident response plan, security incident plan) is discovery-only at 65. 75 requires one populated structure: a named IR role assignment (incident commander/manager, SOC/CSIRT lead, on-call engineer, escalation contact), a severity/priority definition row (SEV1: ..., P2 - ...), or a phone/email contact. 85 requires two distinct structures plus IR-phase wording (containment, eradication, IOCs, forensic image, ransomware, ASD/ACSC reporting). Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
confidence: medium
confidence_justification: >-
  Medium confidence: titles are discovery-only; enforcement requires named roles, severity rows or contacts, and 85 adds a second structure and IR-phase context.
jurisdictions:
  - global
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
  - CIS Controls
  - DISP
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - security
  - technology
test_cases:
  should_match:
    - value: |-
        Cyber security incident response plan - Harbourside Council (v2.1)
        Incident commander: Priya Ellison
        SOC lead: Mei Tanaka, soc-duty@harbourside.example.internal, phone 07 5550 1234
        SEV1: confirmed ransomware or data exfiltration - page the incident commander within 15 minutes
        SEV2: contained malware on a single endpoint
        Containment: isolate affected hosts; preserve a forensic image before rebuild.
      description: High tier (85) - named roles, contact details and severity rows with containment/forensic context
      synthetic: true
    - value: 'Incident response plan, section 3 - Incident manager: Jordan Blake is accountable for decisions during an incident.'
      description: Medium tier (75) - named role assignment only
      synthetic: true
    - value: 'Incident response procedure severity table - P1 (Critical): customer-facing outage or confirmed breach.'
      description: Medium tier (75) - severity definition only
      synthetic: true
    - value: The incident response plan was exercised in a tabletop session last quarter.
      description: Discovery tier (65) - plan title only
      synthetic: true
  should_not_match:
    - value: Agencies should maintain a cyber security incident response plan that names an incident manager and defines severity levels.
      description: Guidance text
    - value: |-
        Incident response plan template
        Incident commander: ________
        Phone: ________
        SEV1: ________
      description: Blank template
    - value: 'Press release: the hospital activated its incident response plan after a ransomware attack, a spokesperson said.'
      description: News framing
    - value: 'Training module: students write an incident response plan with Incident commander: Alex Smith and SEV1: outage.'
      description: Training framing with populated fields must not enforce
false_positives:
  - description: Generic incident references, IR guidance (e.g. NIST SP 800-61) and news about organisations activating their plans.
    mitigation: Plan titles are discovery-only; enforcement needs named role assignments, severity rows or contacts, and guidance/training/news/template framing is excluded.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  The detector identifies incident response plans only when they contain named role assignments, severity definitions or contact details; the title alone is discovery-only. An attacker could use the procedures to predict communications, delay containment, and avoid expected response stages. The record normally affects the organisation and the systems under the plan, causing serious but bounded harm unless it governs critical services or reveals active compromise. Risk 8 and SENSITIVE InfoTech are appropriate, while PROTECTED needs significant-damage evidence beyond the plan concept.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: "CUI Specified"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Medium
  rationale: >-
    Risk 8 fits PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE InfoTech because a plan with named IR roles,
    severity definitions and contacts lets an attacker predict escalation, target responders and delay containment.
    PROTECTED is not met: the harm is bounded to the organisation under the plan unless it governs critical services or
    reveals active compromise.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling protects named responders, escalation paths and severity thresholds. It is not High
      because a response plan does not itself grant access or reveal a live compromise.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_incident_response_plan
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_ir_role_assignment
            - Evidence_severity_definition
            - Evidence_contact_detail
        - ref: Keyword_ir_phase
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_incident_response_plan
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_ir_role_assignment
            - Evidence_severity_definition
            - Evidence_contact_detail
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_incident_response_plan
  regexes:
    - id: Regex_incident_response_plan
      pattern: (?i)\b(?:incident\s+response\s+(?:plan|procedure|playbook)|IRP\s+(?:document|plan)|cyber\s{0,3}(?:security)?\s+(?:incident\s+)?response\s+plan|security\s+incident\s+(?:response\s+)?plan)\b
    - id: Evidence_ir_role_assignment
      pattern: (?i)\b(?:incident\s+(?:commander|manager|lead|coordinator)|(?:CSIRT|SOC|IR)\s+(?:lead|manager)|on[\s-]call\s+(?:engineer|manager|lead)|escalation\s+contact|security\s+duty\s+officer|communications\s+lead|legal\s+contact)\s*[:#=|]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][a-z'-]{1,20}\s+[A-Z][A-Za-z'-]{1,30}
    - id: Evidence_severity_definition
      pattern: (?i)\b(?:SEV|severity|priority|P)\s{0,2}-?\s{0,2}[1-4]\s{0,2}(?:\([A-Za-z]{3,10}\))?\s{0,2}[:=|–-]\s{0,3}(?!_{2,}|\[|<)[A-Za-z]{3,}
    - id: Evidence_contact_detail
      pattern: (?i)\b(?:phone|mobile|tel|hotline|pager)\s{0,3}[:=]?\s{0,3}\+?\d[\d\s-]{7,14}\d\b|\b[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9-]{1,63}(?:\.[A-Za-z0-9-]{1,63}){1,4}\b
  keywords:
    - id: Keyword_ir_phase
      groups:
        - match_style: word
          terms:
            - containment
            - eradication
            - indicators of compromise
            - forensic image
            - evidence preservation
            - isolate affected
            - ransomware
            - data exfiltration
            - notifiable data breach
            - text: ASD
              case_sensitive: true
            - text: ACSC
              case_sensitive: true
            - CSIRT
      strength: domain
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
created: '2026-02-09'
updated: '2026-09-25'
changelog:
  - version: 1.4.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had no generic classification, no
      rationale, no tier).
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): 75 now requires a populated structure (named IR role assignment, severity definition row, or phone/email contact) instead of generic IR phase words, and 85 requires two distinct structures plus IR-phase evidence; removed the phrase-only 85 path, the escalation/on-call keyword list and the generic IT-operations group; guidance/news/training exclusion added; populated synthetic tests and decoys. Removed the irrelevant TIA Act 1979 (Cth) tag; added verified NIST SP 800-61r3 and ISM references.'
  - version: 1.3.0
    date: '2026-07-19'
    description: 'Profile quality: align the regex-backed detector type; add title discovery, response-lifecycle medium, and escalation-corroborated high tiers; add public/template adversarial probes.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 547 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove the dead template-exclusion declaration (Keyword_noise_exclusion) instead of wiring it — dictionary terms appear in the pattern''s own should_match values or positive vocabulary, so a NOT-gate would suppress genuine matches (no behavior change: no tier referenced it)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
