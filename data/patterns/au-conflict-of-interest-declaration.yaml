schema: testpattern/v1
name: Employee Conflict of Interest Declaration and Management Plan
slug: au-conflict-of-interest-declaration
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed employee conflict of interest declarations and conflict management plans that name the declaring employee (or panel member or contractor), describe the private interest or relationship, and record how the conflict is managed: procurement and tender evaluation declarations, selection panel declarations required by Directive 07/23, discipline decision-maker declarations under Directive 05/23, and Queensland public sector declarations tied to the work performance and personal conduct principles in Public Sector Act 2022 (Qld) s 40. Built conservatively: 75 already needs two populated structures. Councillor conflict declarations in published meeting minutes and registers of interests are public and are treated as decoys.
operation: >-
  Primary: a conflict of interest phrase (conflict of interest declaration/disclosure/register/management plan/form/statement, declaration of an actual/potential/perceived conflict of interest, actual/potential/perceived/declared conflict of interest, COI declaration/register/management plan/form). 75 tier requires, within 300 characters, BOTH a populated declarant field (declarant, employee, staff member, officer, person declaring, panel member, contractor, declared by, position title/number, with a non-placeholder value) AND a populated interest field (nature/description/details of the interest, conflict, relationship or association, interest declared, private/personal/financial interest, relationship to the party/supplier/applicant/matter, with at least three words; or type of conflict: actual/potential/perceived). 85 tier additionally requires a management field (management plan/action/strategy/arrangements, proposed management or action, action taken/agreed, approved or endorsed by, approving officer/delegate, supervisor decision/comments with at least two words; or a date declared/approved or review date) AND an independent corroborative term (supervisor, delegate, procurement, tender, evaluation panel, secondary employment, gifts and benefits, Code of Conduct, Public Sector Act 2022, research integrity, review). All enforce tiers AND NOT the shared template-exclusion dictionary and a public-register/guidance exclusion (Cr, seconded, carried unanimously, left the meeting, returned to the meeting, declarable or prescribed conflict of interest, register of interests, register of councillor interests, Register of Members' Interests, fact sheet, this guideline, training module, case study). 65 is discovery-only.
pattern: >-
  (?i)\b(?:conflicts?\s+of\s+interest\s+(?:declaration|disclosure|register|management\s+plan|form|statement)s?|declarations?\s+of\s+(?:(?:an?\s+)?(?:actual|potential|perceived)\s+)?conflicts?\s+of\s+interest|(?:actual|potential|perceived|declared)\s+conflicts?\s+of\s+interest|COI\s+(?:declaration|register|management\s+plan|form)s?)
confidence: medium
confidence_justification: >-
  Medium, conservative build: the legal anchors are thin (PSA 2022 s 40 principles, and the COI declaration requirements in Directives 05/23 and 07/23; no standalone Qld COI directive was found), and "conflict of interest" saturates codes of conduct, council minutes and parliamentary registers. 75 therefore needs both a named declarant and a described interest, 85 adds a management plan or approval, and public council/parliamentary declarations are excluded. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic declarations.
jurisdictions:
  - au
regulations:
  - Public Sector Act 2022 (Qld)
  - Discipline Directive 05/23 (Qld)
  - Recruitment and Selection Directive 07/23 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - conflict of interest declaration
    - management plan
    - nature of the interest
    - perceived conflict of interest
    - supervisor
    - delegate
    - tender
    - secondary employment
  proximity: 300
customisation:
  - key: employee-id
    kind: identifier-format
    identifier: employee-id
    target: purview.regexes/Regex_au_coi_declaration_declarant_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's employee / staff id format (see docs/identifiers.md#employee-id). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Conflict of interest declaration\nEmployee: Jordan Testwell\nNature of the interest: my brother-in-law is a director of Testline Civil Pty Ltd, a tenderer for contract 2026-114\nType of conflict: actual\nManagement plan: removed from the evaluation panel and no access to tender documents\nApproved by: Riley Teston, Director Procurement"
      description: Declaration with employee, interest, management plan and approval (85 tier)
      synthetic: true
    - value: "Conflict of interest management plan\nStaff member: Dr Priya Testwell\nDescription of the conflict: paid consultancy with Testgen Pharma while supervising a funded research project\nAction agreed: annual disclosure to Research Integrity and Head of School approval of publications\nReview date: 01/03/2027"
      description: University management plan with staff member, conflict description, agreed action and review date (85 tier)
      synthetic: true
    - value: "Declaration of a perceived conflict of interest\nPanel member: Casey Teston\nDetails of the relationship: I supervised applicant Morgan Testcase for two years at a previous agency"
      description: Selection panel declaration with declarant and relationship, no management plan (75 tier)
      synthetic: true
    - value: "COI declaration - Staff member: Alex Testwell; Private interest: holds shares in Testco Energy Ltd, a supplier to the unit"
      description: Short declaration with staff member and private interest (75 tier)
      synthetic: true
  should_not_match:
    - value: "4. DECLARATIONS OF CONFLICTS OF INTEREST\nCr Jamie Teston declared a declarable conflict of interest in Item 8.2.\nNature of the interest: her brother is the applicant for the development approval.\nCr Teston left the meeting at 10.14am. Moved Cr Smith, seconded Cr Jones. Carried unanimously."
      description: Published council meeting minutes (public, excluded)
    - value: "Register of interests - Councillor: Riley Teston\nFinancial interests: shares in Testco Energy Ltd and a rental property in Toowong\nPotential conflict of interest noted with the energy portfolio."
      description: Published councillor register of interests (public, excluded)
    - value: "Employees must declare any actual, perceived or potential conflict of interest to their supervisor, who will decide whether a management plan is needed."
      description: Code of conduct guidance (65 only)
    - value: "Conflict of interest declaration form\nEmployee name: ____________\nNature of the interest: [describe the interest]\nManagement plan: <to be completed by supervisor>"
      description: Blank declaration form (65 only)
    - value: "The Minister declared a perceived conflict of interest over the stadium contract, the Premier's office said on Tuesday."
      description: News (65 only)
false_positives:
  - description: Council meeting minutes and councillor registers of interests record conflict declarations with names and interests, and are published.
    mitigation: Minutes and register wording (Cr, seconded, carried unanimously, left/returned to the meeting, declarable/prescribed conflict of interest, register of interests) is excluded. Side effect - a council employee declaration that mentions a councillor as "Cr" is suppressed.
  - description: Parliamentary Register of Members' Interests and ministerial news.
    mitigation: Register of Members' Interests is excluded; news has no populated declarant and interest fields.
  - description: Codes of conduct, COI policies and training.
    mitigation: 75 needs both a populated declarant field and a populated interest field; guideline, fact sheet, training module and case study wording is excluded.
  - description: Blank declaration forms.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders are rejected.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_coi_declaration_primary
      matches:
        - ref: Regex_au_coi_declaration_declarant_field
        - ref: Regex_au_coi_declaration_interest_field
        - ref: Regex_au_coi_declaration_management_field
        - ref: Keyword_au_coi_declaration_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_coi_declaration_public_register_exclusion
    - confidence_level: 75
      id_match: Regex_au_coi_declaration_primary
      matches:
        - ref: Regex_au_coi_declaration_declarant_field
        - ref: Regex_au_coi_declaration_interest_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_coi_declaration_public_register_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_coi_declaration_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_coi_declaration_primary
      pattern: >-
        (?i)\b(?:conflicts?\s+of\s+interest\s+(?:declaration|disclosure|register|management\s+plan|form|statement)s?|declarations?\s+of\s+(?:(?:an?\s+)?(?:actual|potential|perceived)\s+)?conflicts?\s+of\s+interest|(?:actual|potential|perceived|declared)\s+conflicts?\s+of\s+interest|COI\s+(?:declaration|register|management\s+plan|form)s?)
    - id: Regex_au_coi_declaration_declarant_field
      pattern: >-
        (?i)\b(?:declarant|(?:name\s+of\s+)?(?:employee|staff\s+member|officer|person\s+declaring|panel\s+member|contractor)(?:\s+(?:name|no\.?|number|ID))?|declared\s+by|position\s+(?:title|no\.?|number))\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_au_coi_declaration_interest_field
      pattern: >-
        (?i)\b(?:(?:(?:nature|description|details)\s+of\s+(?:the\s+)?(?:interest|conflict|relationship|association)|interests?\s+declared|(?:private|personal|financial)\s+interests?|relationship\s+to\s+(?:the\s+)?(?:party|supplier|applicant|matter|tenderer))\s*[:\-]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|nil|none)\b|_{2,}|\[|<)[A-Za-z][A-Za-z'-]{0,30}(?:[ \t,;]+[A-Za-z0-9'/().-]{1,30}){2,12}|type\s+of\s+conflict\s*[:\-]\s*(?:actual|potential|perceived))
    - id: Regex_au_coi_declaration_management_field
      pattern: >-
        (?i)\b(?:(?:(?:conflict\s+)?management\s+(?:plan|action|strategy|arrangements?)|proposed\s+(?:management|action)|action\s+(?:taken|agreed)|(?:approved|endorsed)\s+by|approving\s+(?:officer|delegate)|supervisor(?:'s)?\s+(?:decision|comments))\s*[:\-]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|nil|none)\b|_{2,}|\[|<)[A-Za-z][A-Za-z'-]{1,30}(?:[ \t,;]+[A-Za-z0-9'/().-]{1,30}){1,12}|(?:date\s+(?:declared|of\s+declaration|approved)|review\s+date)\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}))
  keywords:
    - id: Keyword_au_coi_declaration_corroborative
      groups:
        - match_style: word
          terms:
            - supervisor
            - delegate
            - procurement
            - tender
            - tenderer
            - evaluation panel
            - secondary employment
            - gifts and benefits
            - Code of Conduct
            - Public Sector Act 2022
            - research integrity
            - review
      strength: specific
    - id: Keyword_au_coi_declaration_public_register_exclusion
      groups:
        - match_style: word
          terms:
            - text: Cr
              case_sensitive: true
            - seconded
            - carried unanimously
            - left the meeting
            - returned to the meeting
            - declarable conflict of interest
            - prescribed conflict of interest
            - register of interests
            - register of councillor interests
            - Register of Members' Interests
            - fact sheet
            - this guideline
            - training module
            - case study
      strength: specific
risk_rating: 6
risk_description: >-
  The classifier identifies a completed employee conflict of interest declaration or management plan that names the declarant and describes their private interests (family relationships, shareholdings, secondary employment, supplier connections) and how the conflict is managed. Disclosure exposes personal and financial information about the employee and third parties and can compromise live procurement or selection processes. Public council minutes, registers of interests, codes of conduct and blank forms are excluded from enforce tiers. Risk 6 supports OFFICIAL: Sensitive / SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 6 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because a completed
    declaration discloses an employee's family relationships, shareholdings and supplier connections and can compromise
    live procurement or selection. Higher risk is not met: it is one declarant's personal and financial detail, not
    health or safety data.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling protects the private interests of the declarant and related third parties. It is
      not High because exposure affects one process and one person's affairs.
references:
  - title: Queensland Government (forgov) - Recruitment and selection Directive 07/23 (panel conflict of interest declarations)
    url: https://www.forgov.qld.gov.au/pay-benefits-and-policy/directives-policies-circulars-and-guidelines/recruitment-and-selection-directive-0723
  - title: Queensland Government (forgov) - Discipline Directive 05/23
    url: https://www.forgov.qld.gov.au/pay-benefits-and-policy/directives-policies-circulars-and-guidelines/discipline-directive-0523
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial conservative release - employee conflict of interest declarations and management plans; 75 gated on populated declarant AND interest fields, 85 adds a management/approval field and corroborative term; council minutes, registers of interests, guidance and blank forms excluded.
