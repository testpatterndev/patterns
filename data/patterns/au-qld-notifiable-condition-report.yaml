  - version: 1.5.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): converted keyword_list to regex; 75/85 were gated by generic case-response words only. 75 now needs a populated case identifier and 85 needs case fields plus a notification field (condition, organism, onset/specimen date, notifying lab) plus public-health response evidence. Bare-phrase tests replaced with populated records plus policy, blank-form and news decoys. Regulations: removed HRIPA (Cth) and My Health Records Act 2012 (Cth), added Public Health Act 2005 (Qld); references added."
  - version: 1.4.2
    date: '2026-07-19'
    description: 'Targeted finance/health blocker remediation: keep report phrases at 65 discovery, require independent case-response evidence at 75 and Public Health Act context at 85, with exact-tier and notification-software probes.'
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 586 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-04'
    description: Replace bare generic keyword terms with domain-anchored phrases (FP reduction)
  - version: 1.2.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Mapped non-canonical confidence 90 to 85.
