schema: testpattern/v1
name: QLD Notifiable Condition Report
slug: au-qld-notifiable-condition-report
version: 1.5.2
type: regex
pattern_class: concept
description: >-
  Detects Queensland notifiable condition reports - notifiable condition or disease notifications, communicable disease reports and public health notifications made under the Public Health Act 2005 (Qld) - when the phrase sits with populated case identifiers and notification fields.
operation: >-
  Primary: notifiable condition/disease report or notification, communicable disease report, public health notification, disease notification or surveillance, reportable condition/disease. 65 (discovery only): phrase alone. 75: phrase plus a populated patient/case identifier field. 85: identifier field plus a populated notification field (condition, organism, onset date, specimen/collection date, test result, notifying doctor or laboratory, vaccination status, occupation, setting) plus independent public-health response evidence (contact tracing, case investigation, outbreak, public health unit, Public Health Act 2005, close contacts, exclusion period). Template and guidance/training framing excluded from 75/85. Converted from keyword_list to regex.
pattern: (?i)\b(?:notifiable\s+(?:condition|disease)\s+(?:report|notification)|communicable\s+disease\s+report|public\s+health\s+notification|disease\s+(?:surveillance|notification)|reportable\s+(?:condition|disease))\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated case identifier; 85 also needs a notification field and public-health response evidence. Surveillance dashboards, guidelines and news carry the phrases without a case and stay at 65.
jurisdictions:
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Public Health Act 2005 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
  - SOC 2
data_categories:
  - phi
  - health
  - government
test_cases:
  should_match:
    - value: "NOTIFIABLE CONDITION REPORT - Pathology Queensland\nPatient name: Riley Ashworth\nDOB: 14/05/2019\nMedicare number: 2953 17720 1\nCondition: Pertussis\nSpecimen date: 15/09/2026\nNotifying laboratory: Pathology Queensland Central\nPublic health unit commenced contact tracing of close contacts at childcare."
      description: Populated notification with case, notification fields and public-health response (85)
      synthetic: true
    - value: "Disease notification received\nPatient: Morgan Ellisdale\nURN: 118204"
      description: Notification with labelled case identifiers only (75)
      synthetic: true
  should_not_match:
    - value: "Notification of scheduled maintenance"
      description: Non-match 1
    - value: "Disease prevention tips"
      description: Non-match 2
    - value: "Reportable disease dashboard redesign"
      description: Product dashboard phrase must remain discovery-only
    - value: "Policy guidance: this procedure explains how notifiable condition report forms are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Notifiable condition report form\nPatient name: ____________________\nDate of birth: ____________________\nCondition: ____________________\nOnset date: ____________________\nNotifying doctor: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: disease surveillance data show a rise in pertussis notifications, and public health units are urging parents to check vaccination status."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: Generic notification or disease in non-surveillance contexts.
    mitigation: Require notifiable condition or public health notification specific terms.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  The detector recognises Queensland notifiable condition and disease notification language and enforces only when populated case identifier fields sit nearby; phrase-only text stays at 65 discovery. A genuine report can identify an infected person, diagnosis, exposure contacts, locations, and public-health action, enabling stigma, retaliation, evasion of controls, or harm to an active investigation. The ordinary case is bounded to one notification or cluster rather than the full surveillance system, but its disclosure still creates serious individual and operational consequences. Risk 8 and SENSITIVE are justified; PROTECTED would require a major outbreak operation, protected source intelligence, or disclosure causing significant population-safety damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the Personal-Privacy DLM, and Medium for a
    notifiable-condition case report. PROTECTED is not met because an ordinary notification lacks major outbreak-command
    scale and significant population-safety damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium classification and Medium Personal-Privacy DLM protect diagnosis, contact, exposure, and surveillance
      details within one public-health notification.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_notifiable_condition
      matches:
        - ref: Regex_au_qld_notifiable_condition_report_case_fields
        - ref: Regex_au_qld_notifiable_condition_report_notification_fields
        - ref: Evidence_case_response_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_notifiable_condition_report_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_notifiable_condition
      matches:
        - ref: Regex_au_qld_notifiable_condition_report_case_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_notifiable_condition_report_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_notifiable_condition
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_notifiable_condition
      pattern: (?i)\b(?:notifiable\s+(?:condition|disease)\s+(?:report|notification)|communicable\s+disease\s+report|public\s+health\s+notification|disease\s+(?:surveillance|notification)|reportable\s+(?:condition|disease))\b
    - id: Regex_au_qld_notifiable_condition_report_case_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|patient(?:\s+name)?|URN|UR\s*(?:no\.?|number)|MRN|medical\s+record\s+(?:no\.?|number)|Medicare(?:\s+(?:card\s+)?(?:no\.?|number))?|IHI|DVA\s+(?:no\.?|number)|(?:patient|client|hospital|case|file|episode)\s*(?:no\.?|number|ID)|(?:referring|treating|requesting)\s+(?:doctor|practitioner|clinician|psychiatrist)|clinician|consultant)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_au_qld_notifiable_condition_report_notification_fields
      pattern: (?i)\b(?:condition|disease|organism|pathogen|onset\s+date|date\s+of\s+onset|specimen\s+(?:date|type)|collection\s+date|test\s+result|result|notifying\s+(?:doctor|laboratory|practitioner)|laboratory|vaccination\s+status|occupation|setting)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Evidence_case_response_context
      groups:
        - match_style: word
          terms:
            - contact tracing
            - case investigation
            - outbreak
            - public health unit
            - Public Health Act 2005
            - close contacts
            - exclusion period
            - laboratory confirmed
      strength: specific
    - id: Keyword_au_qld_notifiable_condition_report_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
created: '2026-02-09'
