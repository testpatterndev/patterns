schema: testpattern/v1
name: Diagnostic imaging data
slug: global-top500-326-diagnostic-imaging-data
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies diagnostic imaging data references in healthcare and patient records. Protected health information
  under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 7 keywords within 300 characters. Keyword lists: au-healthcare-records. Uses additional
  domain-context evidence and explicit exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:diagnostic\s+imaging|radiology\s+report|imaging\s+data|CT\s+scan|imaging\s+study)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
- GDPR
- HRIPA (Cth)
- IPA 2009 (Qld)
- My Health Records Act 2012 (Cth)
- NDB Scheme (Cth)
- Privacy Act 1988 (Cth)
data_categories:
- healthcare
- phi
corroborative_evidence:
  keywords:
  - diagnostic imaging data
  - diagnostic
  - imaging
  - data
  - health
  - biomedical
  - information
  proximity: 300
  keyword_lists:
  - au-healthcare-records
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
  - value: diagnostic imaging
    description: Primary topic phrase match
  - value: radiology report
    description: Case-insensitive topic phrase match
  - value: imaging data
    description: Alternative topic phrase match
  - value: CT scan
    description: Additional topic phrase match
  - value: "diagnostic imaging\nPatient name: Avery Teston\nURN: 004418273\nDate of birth: 04/02/1991\nClinician: Dr Jordan Staffson\nNotes: diagnostic imaging reviewed at appointment on 12/08/2026."
    description: Populated health record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: patient biometric
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about diagnostic imaging are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Medical terminology in health education materials, research publications, clinical guidelines, or public health
    documents without patient-specific data.
  mitigation: Require corroborative evidence keywords confirming patient context. Look for co-occurrence with patient identifiers
    such as medical record numbers or dates of birth.
- description: General wellness and fitness content using medical vocabulary without constituting protected health information.
  mitigation: Layer with patient identifier patterns or healthcare-specific document structure detection to distinguish clinical
    records from general health content.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: The pattern finds diagnostic-imaging, radiology-report, or imaging-data phrases with nearby healthcare-record
  evidence, so the intended unit is a clinical image or interpretation rather than an administrative imaging appointment.
  Disclosure can expose anatomy, injury, tumour, pregnancy, disability, or diagnostic uncertainty and may include identifiers
  embedded in a report or imaging export. An individual study can seriously affect the patient's privacy and employment or
  insurance interests, while education, research, and imaging guidelines remain plausible false positives. Risk 8 and SENSITIVE
  fit; PROTECTED would require critical emergency or surgical reliance, bulk imaging archives, protected-patient exposure,
  or other significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_diagnostic_imaging_data
      matches:
        - ref: Regex_global_top500_326_diagnostic_imaging_data_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_diagnostic_imaging_data
      matches:
        - ref: Regex_global_top500_326_diagnostic_imaging_data_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_diagnostic_imaging_data
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_diagnostic_imaging_data
      pattern: (?is)\b(?:diagnostic\s+imaging|radiology\s+report|imaging\s+data|CT\s+scan|imaging\s+study)\b
    - id: Regex_global_top500_326_diagnostic_imaging_data_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|patient|client|participant|donor|recipient|clinician|URN|UR\s+number|MRN|medical\s+record\s+number|Medicare(?:\s+number)?|IHI|referring\s+(?:doctor|practitioner)|(?:specimen|accession|lab|laboratory|study|participant|patient|client|trial|case|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
created: '2026-02-08'
updated: '2026-09-24'
