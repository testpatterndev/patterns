schema: testpattern/v1
name: Queensland Council Rates Concession or Hardship Application
slug: au-qld-council-rates-concession-hardship-application
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Individual applications, assessments and decisions for rates concessions made by Queensland local governments under Local Government Regulation 2012 ch 4 pt 10. Covers pensioner rebates (s 120(1)(a) land owned or occupied by a pensioner; s 123 rebate for land occupied by pensioners; sch 8 defines a pensioner as a holder of a pensioner concession card), hardship concessions (s 120(1)(d) payment will cause hardship to the land owner) and agreements to defer rates (ss 121(b), 125). A concession for a stated ratepayer can be granted only after that ratepayer applies (s 122(3)). These records link a named applicant and property to Centrelink or DVA concession status, income, household circumstances and the council's decision. Council concession policies, revenue statements and class resolutions are public and are decoys.
operation: >-
  Primary: a rates concession phrase (pensioner (rates) concession / rebate / remission / subsidy / discount; rates or rating concession, rebate, remission, relief or deferral; rates (financial) hardship; hardship application / assistance / concession for rates; deferral of rates; application or agreement to defer rates; concession for or on rates). 75 tier requires, within 300 characters, one populated structure: an applicant/property field (named applicant, ratepayer, owner, pensioner or occupier; a property or assessment number containing a digit; or a property address with a street number), an eligibility field (pensioner concession / health care / DVA / gold card number, a Centrelink CRN, a DVA file number, a card expiry date, or a filled pension or payment type), a hardship field (filled reason for hardship or circumstances, an income amount, a number of dependants, or a rent / mortgage / living expense amount) or a decision field (decision / outcome / recommendation of approved, declined, granted or deferral approved, or a rebate, concession, remission or deferral granted with an amount, percentage or status). 85 tier requires an applicant/property field AND an eligibility, hardship or decision field AND an independent council or Centrelink term (council, local government, ratepayer, rate notice, Centrelink, Services Australia, Department of Veterans' Affairs). All enforce tiers AND NOT the shared template-exclusion dictionary and a policy exclusion (this policy, policy statement, revenue statement, to be eligible, how to apply, you may be eligible, frequently asked questions). 65 is discovery-only (primary phrase alone) and will surface concession policies, budget resolutions and the Regulation.
pattern: >-
  (?i)\b(?:pensioner\s+(?:rates?\s+)?(?:concession|rebate|remission|subsidy|discount)s?|(?:rates?|rating)\s+(?:concession|rebate|remission|relief|deferral)s?|(?:rates?|rating)\s+(?:financial\s+)?hardship|hardship\s+(?:application|assistance|concession|relief|arrangement)\s+(?:for|on|[:-])\s*(?:general\s+)?rates|deferral\s+of\s+(?:general\s+)?rates|(?:agreement|application)\s+to\s+defer\s+(?:general\s+)?rates|concession\s+(?:for|on)\s+(?:general\s+)?rates)\b
confidence: medium
confidence_justification: >-
  Medium: the concession, rebate, hardship and deferral terms come from LGR ss 119-126, but councils also use them in public concession policies, revenue statements and budget resolutions, so enforce tiers need populated applicant, eligibility, hardship or decision fields and a policy exclusion. The Centrelink CRN shape (9 digits and a letter) is reused from au-centrelink-crn; concession card and rates assessment formats are unverified, so those values are loose and placeholder-guarded. The State Government pensioner rate subsidy form's field names were not verified and are not used as anchors. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Local Government Regulation 2012 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - financial
  - pii
  - government
corroborative_evidence:
  keywords:
    - pensioner concession card
    - Centrelink
    - customer reference number
    - financial hardship
    - rebate
    - deferral
    - ratepayer
    - assessment number
  proximity: 300
customisation:
  - key: council-property-number
    kind: identifier-format
    identifier: council-property-number
    target: purview.regexes/Regex_au_qld_rates_concession_applicant_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's council property / rates assessment number format (see docs/identifiers.md#council-property-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Pensioner Rate Concession Application\nApplicant name: Avery Teston\nProperty number: 3308152\nProperty address: 5 Banksia Place, Bundaberg QLD 4670\nPensioner Concession Card number: 408 612 773K\nCard expiry: 03/2028\nPension type: Age Pension\nDecision: approved - rebate granted: $265.00 for 2026-27. Ratepayer notified by letter; Centrelink confirmation obtained."
      description: Completed pensioner concession application with applicant, property, card, pension type and decision (85 tier)
      synthetic: true
    - value: "Rates financial hardship application - assessment\nRatepayer: Riley Testwell\nAssessment number: 55012874\nReason for hardship: Job loss after the local meatworks closed; partner undergoing cancer treatment\nHousehold income: $812 per fortnight\nDependants: 3\nRecommendation: deferral approved until 30/06/2027 under the council hardship arrangement."
      description: Hardship assessment with ratepayer, assessment number, circumstances, income and recommendation (85 tier)
      synthetic: true
    - value: "Pensioner rebate query - CRN 204 118 562A supplied by caller; asked when the rebate will appear on the next notice."
      description: Concession query with a Centrelink CRN only (75 tier)
      synthetic: true
    - value: "Rates concession - hardship circumstances: Recently widowed, sole income is a carer payment. Please call back."
      description: Hardship circumstances without an applicant or property field (75 tier)
      synthetic: true
  should_not_match:
    - value: "Pensioner Rate Concession Policy. To be eligible, the applicant must hold a current Pensioner Concession Card and occupy the property as their principal place of residence. Maximum rebate: $300 per annum."
      description: Published council concession policy (65 only)
    - value: "121 Types of concession. The concession may only be a rebate of all or part of the rates or charges, an agreement to defer payment of the rates or charges, or an agreement to accept a transfer of unencumbered land. A rates concession for a stated ratepayer requires an application."
      description: Local Government Regulation 2012 s 121 text (legislation, 65 only)
    - value: "Pensioner Rate Concession Application - blank template\nApplicant name: __________\nPensioner Concession Card number: __________\nCard expiry: __/__\nDecision: [office use only]"
      description: Blank application form (65 only)
    - value: "Council resolved to increase the pensioner rate rebate to $300 for eligible ratepayers in the 2026-27 budget, the mayor announced."
      description: Class concession resolution reported in the news (public, 65 only)
false_positives:
  - description: Council concession and hardship policies, revenue statements and the budget resolution granting a concession to a class of ratepayers (s 122(1)(b)).
    mitigation: Those carry no populated applicant, card, hardship or decision fields; policy wording is also excluded.
  - description: Energy, water or telco hardship applications.
    mitigation: The primary requires rates-specific wording; water hardship is covered by au-qld-water-customer-hardship-restriction-record.
  - description: Closed-meeting reports on a named ratepayer's concession.
    mitigation: These are genuinely sensitive (s 122(1)(a) resolutions name a stated ratepayer) and may match both this classifier and au-qld-council-closed-meeting-report.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_rates_concession_primary
      matches:
        - ref: Regex_au_qld_rates_concession_applicant_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_rates_concession_eligibility_field
            - Regex_au_qld_rates_concession_hardship_field
            - Regex_au_qld_rates_concession_decision_field
        - ref: Keyword_au_qld_rates_concession_council
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_rates_concession_policy_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_rates_concession_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_rates_concession_applicant_field
            - Regex_au_qld_rates_concession_eligibility_field
            - Regex_au_qld_rates_concession_hardship_field
            - Regex_au_qld_rates_concession_decision_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_rates_concession_policy_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_rates_concession_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_rates_concession_primary
      pattern: >-
        (?i)\b(?:pensioner\s+(?:rates?\s+)?(?:concession|rebate|remission|subsidy|discount)s?|(?:rates?|rating)\s+(?:concession|rebate|remission|relief|deferral)s?|(?:rates?|rating)\s+(?:financial\s+)?hardship|hardship\s+(?:application|assistance|concession|relief|arrangement)\s+(?:for|on|[:-])\s*(?:general\s+)?rates|deferral\s+of\s+(?:general\s+)?rates|(?:agreement|application)\s+to\s+defer\s+(?:general\s+)?rates|concession\s+(?:for|on)\s+(?:general\s+)?rates)\b
    - id: Regex_au_qld_rates_concession_applicant_field
      pattern: >-
        (?i)\b(?:(?:applicant|ratepayer|registered\s+owner|owner|pensioner|occupier)(?:\s+(?:full\s+)?name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:property|assessment|rate\s+assessment|rates?\s+account)\s+(?:no\.?|number|ID)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9/-]{3,15}\b|(?:property|residential|rateable\s+land)\s+address\s*[:#]\s*(?:(?:Unit|Lot|Apt|Flat)\s+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?\s+[A-Z][A-Za-z'-]{1,30})
    - id: Regex_au_qld_rates_concession_eligibility_field
      pattern: >-
        (?i)\b(?:(?:pensioner\s+concession|concession|health\s+care|DVA(?:\s+(?:gold|white))?|gold)\s+card\s+(?:no\.?|number)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)(?=[A-Z0-9 -]{0,6}\d)[A-Z0-9][A-Z0-9 -]{5,14}\b|(?:Centrelink\s+)?(?:customer\s+reference\s+number|CRN)\s*[:#]?\s*\d{3}[ ]?\d{3}[ ]?\d{3}[A-Z]\b|DVA\s+file\s+(?:no\.?|number)\s*[:#]\s*[A-Z]{1,3}\d{3,8}\b|(?:card\s+)?expiry(?:\s+date)?\s*[:#]\s*\d{1,2}[/.-]\d{2,4}\b|(?:pension|benefit|payment)\s+type\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|see|refer|select)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{2,30})
    - id: Regex_au_qld_rates_concession_hardship_field
      pattern: >-
        (?i)\b(?:(?:reason\s+for\s+(?:hardship|application|request|applying)|hardship\s+(?:circumstances|reason|details|grounds)|financial\s+circumstances)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{2,30}|(?:household|gross|net|weekly|fortnightly|annual|total)\s+(?:household\s+)?income\s*[:#]\s*\$\s?\d|(?:number\s+of\s+)?dependants?\s*[:#]\s*\d{1,2}\b|(?:rent|mortgage|living)\s+(?:expenses|repayments?|costs)\s*[:#]\s*\$\s?\d)
    - id: Regex_au_qld_rates_concession_decision_field
      pattern: >-
        (?i)\b(?:(?:decision|outcome|recommendation|assessment\s+outcome|delegate\s+decision)\s*[:#-]\s*(?:approved|declined|refused|granted|not\s+approved|partially\s+approved|deferral\s+approved|recommended)|(?:rebate|concession|remission|deferral)\s+(?:granted|approved|applied)\s*[:#-]\s*(?:\$\s?\d|\d{1,3}(?:\.\d{1,2})?\s?%|yes|from\s+\d)|(?:approved|granted)\s+(?:rebate|concession|remission)\s*[:#-]\s*(?:\$\s?\d|\d{1,3}\s?%))
  keywords:
    - id: Keyword_au_qld_rates_concession_council
      groups:
        - match_style: word
          terms:
            - council
            - local government
            - ratepayer
            - rate notice
            - rates notice
            - Centrelink
            - Services Australia
            - Department of Veterans' Affairs
            - text: DVA
              case_sensitive: true
      strength: domain
    - id: Keyword_au_qld_rates_concession_policy_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - policy statement
            - revenue statement
            - to be eligible
            - how to apply
            - you may be eligible
            - frequently asked questions
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier identifies a ratepayer's application for a pensioner rebate, hardship concession or rates deferral, or the council's assessment and decision on it. These records link a named person and property to Centrelink or DVA pension status and card numbers, household income and dependants, and narratives of job loss, illness, bereavement or family breakdown. Disclosure exposes financial vulnerability and health or family circumstances. Concession policies and class resolutions are public and excluded. Risk 7 supports OFFICIAL: Sensitive / SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Local Government Regulation 2012 (Qld) - ch 4 pt 10 concessions (s 120 criteria, s 121 types, s 122 resolutions, s 123 pensioner rebate, s 125 deferral agreements) and sch 8 definition of pensioner
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2012-0236
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - LGR ch 4 pt 10 pensioner, hardship and deferral concession applications; 75 gated on one populated applicant, eligibility, hardship or decision field, 85 on an applicant/property field plus a second field and council or Centrelink evidence; policies, revenue statements and blank forms excluded.
