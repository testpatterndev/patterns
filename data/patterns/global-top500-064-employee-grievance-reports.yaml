schema: testpattern/v1
name: Employee grievance reports
slug: global-top500-064-employee-grievance-reports
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects employee grievance and workplace complaint records (including bullying and harassment complaints) naming a complainant, respondent or employee, with lodgement or incident dates, a reference number or a finding.
operation: >-
  Primary: a grievance phrase (employee grievance, grievance report/outcome/investigation/hearing/decision/form, formal grievance, workplace/bullying/harassment complaint). 75 tier requires a populated person field (employee/staff name or number, complainant, respondent, aggrieved employee, position number or title, work unit) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated grievance detail (lodgement/incident date, substantiated/upheld finding, or grievance/complaint reference number) and an independent corroborative term (witness, mediation, internal review, early resolution, conciliation). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:(?:individual\s+)?employee\s+grievance|grievance\s+(?:report|outcome|investigation|hearing|lodged|decision|form|notification)|formal\s+grievance|workplace\s+complaint|bullying\s+complaint|harassment\s+complaint)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Public Sector Act 2022 (Qld)
  - Work Health and Safety Act 2011 (Qld)
  - Sex Discrimination Act 1984 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - witness
    - mediation
    - internal review
    - early resolution
    - conciliation
    - support person
    - recommendation
    - Fair Work Commission
    - Queensland Industrial Relations Commission
  proximity: 300
test_cases:
  should_match:
    - value: "Employee grievance - outcome letter\nAggrieved employee: Avery Teston\nGrievance ref: GR-2026-0412\nDate lodged: 03/08/2026\nFinding: Partially substantiated. Recommendation: facilitated mediation between the parties."
      description: '85: Grievance outcome with employee, reference, date lodged and finding'
      synthetic: true
    - value: "Workplace complaint intake\nEmployee ID: 5520117\nIncident date: 21/08/2026\nComplaint: supervisor shouted at the employee in front of customers; two witness statements attached."
      description: '85: Complaint intake with employee ID and incident date'
      synthetic: true
    - value: "Bullying complaint\nComplainant: Morgan Teston\nRespondent: Jordan Staffson\nThe complainant describes being excluded from team meetings since June."
      description: '75: Complaint naming complainant and respondent, no dates or finding'
      synthetic: true
  should_not_match:
    - value: This procedure explains how an employee grievance is lodged, assessed and reviewed, and when a matter can go to internal review.
      description: Procedure text - must stay below 75
    - value: "Grievance form\nComplainant: __________\nRespondent: __________\nDate lodged: ___/___/____\nDescribe the workplace complaint: __________"
      description: Blank grievance form - must stay below 75
    - value: Nurses lodged a formal grievance over rosters, the union said in a media release on Monday.
      description: News / media release - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_064_employee_grievance_reports_primary
      matches:
        - ref: Regex_top500_064_employee_grievance_reports_person_field
        - ref: Regex_top500_064_employee_grievance_reports_record_detail
        - ref: Keyword_top500_064_employee_grievance_reports_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_064_employee_grievance_reports_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_064_employee_grievance_reports_primary
      matches:
        - ref: Regex_top500_064_employee_grievance_reports_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_064_employee_grievance_reports_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_064_employee_grievance_reports_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_064_employee_grievance_reports_primary
      pattern: >-
        (?i)\b(?:(?:individual\s+)?employee\s+grievance|grievance\s+(?:report|outcome|investigation|hearing|lodged|decision|form|notification)|formal\s+grievance|workplace\s+complaint|bullying\s+complaint|harassment\s+complaint)\b
    - id: Regex_top500_064_employee_grievance_reports_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit|complainant|respondent|aggrieved\s+employee|grievant|subject\s+employee)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_064_employee_grievance_reports_record_detail
      pattern: >-
        (?i)\b(?:date\s+(?:lodged|received|of\s+(?:incident|complaint|lodgement))|lodgement\s+date|incident\s+date)\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|\b(?:outcome|finding|decision)\s*[:\-]\s*(?:partially\s+|not\s+)?(?:substantiated|upheld)|\b(?:outcome|finding|decision)\s*[:\-]\s*(?:unsubstantiated|resolved|dismissed)|\b(?:grievance|complaint|matter|case|reference|file)\s*(?:no\.?|number|ref|ID|#)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Z0-9/-]{2,20}\b
  keywords:
    - id: Keyword_top500_064_employee_grievance_reports_corroborative
      groups:
        - match_style: word
          terms:
            - witness
            - mediation
            - internal review
            - early resolution
            - conciliation
            - support person
            - recommendation
            - Fair Work Commission
            - Queensland Industrial Relations Commission
      strength: specific
    - id: Keyword_top500_064_employee_grievance_reports_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a employee grievance or workplace complaint record about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Disclosure exposes complainant identity, allegations about named respondents and workplace conflict details, with victimisation and reputational risk. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, Personal-Privacy DLM, SENS_Pvc, and Medium classification
    for confidential employee allegations. The next PROTECTED level is not met because a normal grievance does not
    establish acute retaliation risk, protected witnesses, a systemic bulk repository, or significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium Personal-Privacy handling protects employee allegations and responses while recognising that
      policies and unused complaint forms may contain the same terms.
