schema: testpattern/v1
name: Ad attribution datasets
slug: global-top500-378-ad-attribution-datasets
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects advertising attribution datasets: an ad / marketing / multi-touch attribution or conversion-tracking data phrase combined with populated identifiers - SHA-256 hashed emails or device IDs, click identifiers (gclid, fbclid, msclkid) or advertising IDs. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: ad/advertising/marketing/multi-touch/last-click/conversion attribution (dataset/data/report/export/log), attribution dataset(s), conversion tracking data/logs/export. 65 (discovery only): primary alone. 75: primary plus one populated structure - a 64-hex-character hashed identifier (SHA-256 email or device hash) or a click/advertising identifier with a value (gclid, fbclid, msclkid, ttclid, click ID, IDFA, GAID, MAID). 85: primary plus two distinct structures (the two above or a delimited column header pairing a user/device/hashed-email ID column with campaign, channel, touchpoint, conversion or click-ID columns) plus attribution evidence (last click, first touch, view-through, lookback window, conversion value, remarketing, audience/customer match, matched audience, cross-device). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: (?i)\b(?:(?:ad|advertising|marketing|multi-?touch|last[\s-]click|conversion)\s+attribution(?:\s+(?:datasets?|data|reports?|exports?|logs?))?|attribution\s+datasets?|conversion\s+tracking\s+(?:data|logs?|exports?))\b
confidence: medium
confidence_justification: >-
  Enforce tiers require machine-format identifiers (hashed emails, click or advertising IDs) beside the attribution phrase; marketing explainers and news stay at 65, as do header-only extracts. Medium because hashed identifiers also appear in unrelated technical logs near the phrase.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - last click
    - first touch
    - view-through
    - lookback window
    - conversion value
    - remarketing
    - audience match
    - customer match
    - matched audience
    - cross-device
  proximity: 300
test_cases:
  should_match:
    - value: "Ad attribution dataset - September export (restricted)\nhashed_email,campaign_id,channel,touchpoint,conversion_value,conversion_time\n5f4dcc3b5aa765d61d8327deb882cf995f4dcc3b5aa765d61d8327deb882cf99,CMP-2291,paid_social,view-through,149.00,2026-09-12T20:41:00Z\ngclid=Cj0KCQjw4bipBhCyARIsAFsieCy7Zb2Kx\nMulti-touch model: 30-day lookback window, cross-device matched audience."
      description: Attribution export - header, hashed email, click ID and attribution evidence (85)
      synthetic: true
    - value: "Conversion tracking export\ngclid=Cj0KCQjw4bipBhCyARIsAFsieCy7Zb2Kx\nUploaded to the ads account."
      description: Single click identifier (75)
      synthetic: true
  should_not_match:
    - value: "Help center article: marketing attribution assigns credit for a conversion to the ads a person saw or clicked. Choose a last click or data-driven model and a lookback window."
      description: Product help article
      synthetic: true
    - value: "Attribution dataset\nhashed_email,campaign_id,channel,touchpoint,conversion_value\n"
      description: Blank extract - column header only (65)
      synthetic: true
    - value: "Advertisers are rethinking multi-touch attribution as browsers block third-party cookies, a news report said."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing advertising attribution.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of advertising attribution.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_ad_attribution_datasets
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_378_ad_attribution_datasets_column_header
            - Regex_global_top500_378_ad_attribution_datasets_hashed_identifier
            - Regex_global_top500_378_ad_attribution_datasets_click_identifier
        - ref: Keyword_global_top500_378_ad_attribution_datasets_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_378_ad_attribution_datasets_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_ad_attribution_datasets
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_378_ad_attribution_datasets_hashed_identifier
            - Regex_global_top500_378_ad_attribution_datasets_click_identifier
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_378_ad_attribution_datasets_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_ad_attribution_datasets
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_ad_attribution_datasets
      pattern: (?i)\b(?:(?:ad|advertising|marketing|multi-?touch|last[\s-]click|conversion)\s+attribution(?:\s+(?:datasets?|data|reports?|exports?|logs?))?|attribution\s+datasets?|conversion\s+tracking\s+(?:data|logs?|exports?))\b
    - id: Regex_global_top500_378_ad_attribution_datasets_column_header
      pattern: (?i)\b(?:(?:user|device|customer|visitor|advertising)[ _]?(?:id|hash)|hashed[ _]?email|email[ _]?(?:hash|sha256)|maid|idfa|gaid\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:campaign(?:[ _]?(?:id|name))?|channel|touchpoint|touch[ _]?\d|conversion(?:[ _]?(?:value|event|time))?|revenue|impression[ _]?id|click[ _]?id|gclid|fbclid)|(?:campaign(?:[ _]?(?:id|name))?|channel|touchpoint|touch[ _]?\d|conversion(?:[ _]?(?:value|event|time))?|revenue|impression[ _]?id|click[ _]?id|gclid|fbclid)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:user|device|customer|visitor|advertising)[ _]?(?:id|hash)|hashed[ _]?email|email[ _]?(?:hash|sha256)|maid|idfa|gaid)\b
    - id: Regex_global_top500_378_ad_attribution_datasets_hashed_identifier
      pattern: (?i)\b[a-f0-9]{64}\b
    - id: Regex_global_top500_378_ad_attribution_datasets_click_identifier
      pattern: (?i)\b(?:gclid|fbclid|msclkid|ttclid|click[_\s]?id|idfa|gaid|maid|advertising[_\s]id)[ \t]{0,3}[:=#][ \t]{0,3}[A-Za-z0-9_-]{8,120}
  keywords:
    - id: Keyword_global_top500_378_ad_attribution_datasets_domain_evidence
      groups:
        - match_style: word
          terms:
            - last click
            - first touch
            - view-through
            - lookback window
            - conversion value
            - remarketing
            - audience match
            - customer match
            - matched audience
            - cross-device
      strength: domain
    - id: Keyword_global_top500_378_ad_attribution_datasets_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - third-party cookies
            - data-driven model
      strength: noise
risk_description: >-
  The regex targets ad-attribution datasets, conversion tracking, campaign joins, and marketing exports that connect advertising exposure or interaction to customer outcomes. A real dataset can reveal identifiers, browsing or purchase behaviour, campaign response, and inferred interests, enabling intrusive profiling, discriminatory targeting, or unauthorised reuse across a customer cohort. Generic campaign analysis may match without personal rows, but the intended dataset is more consequential than a single marketing metric. Risk 8 SENSITIVE Personal-Privacy fits the combined behavioural record; PROTECTED is not met without population-scale surveillance, highly vulnerable subjects, or significant systemic identity compromise. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs a hashed identifier or a click/advertising identifier and 85 needs two distinct structures (header counts only toward 85) plus attribution evidence. Removed the self-corroborating evidence group (generic 'attribution', 'datasets', 'customer', 'commercial'). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA, My Health Records Act and TIA Act; replaced the broken legislation link C2003A00129 with the OAIC personal-information reference.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 965 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
