schema: testpattern/v1
name: Queensland School Suspension, Exclusion or Enrolment Cancellation Decision
slug: au-qld-school-suspension-exclusion-decision
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Principal decision notices and records to suspend, exclude or cancel the enrolment of a named student at a Queensland state school under the Education (General Provisions) Act 2006 (ss281-283 suspension, charge-related suspension, exclusion, s316 cancellation of enrolment), including the grounds, behaviour and student details.
operation: >-
  Primary: Queensland School Suspension, Exclusion or Enrolment Cancellation Decision anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:(?:short|long)[\s-]+suspension|charge[\s-]+related\s+suspension|suspension\s+(?:decision|notice)|decision\s+(?:notice\s+)?(?:to|about)\s+(?:suspend|exclude)|notice\s+of\s+(?:suspension|exclusion)|exclusion\s+(?:decision|notice|order)|proposed\s+exclusion|cancellation\s+of\s+enrolment|(?:suspended|excluded)\s+from\s+(?:the\s+)?school)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Education (General Provisions) Act 2006 (Qld)
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - education
  - pii
corroborative_evidence:
  keywords:
    - Education (General Provisions) Act 2006
    - principal
    - school days
    - show cause
    - grounds
    - behaviour
    - submission
    - review
  proximity: 300
identifier_dependencies:
  - type: student
    name: Student ID / EQ ID
    note: >-
      EQ ID / school student number format (reported as 10 digits + 1 letter; confirm with a real sample)
    affects: precision at 75/85 (public fallback is the generic labelled-field regex)
test_cases:
  should_match:
    - value: "Notice of suspension\nStudent name: Riley Teston\nEQ ID: 0048213772K\nYear level: 8\nSchool: Wattle Creek State High School\nSuspension: long suspension of 15 school days from 12/08/2026 under s282 of the Education (General Provisions) Act 2006.\nGrounds: physical assault of another student."
      description: Populated record 1
      synthetic: true
    - value: "Student: Morgan Teston (Year 10)\nDate of birth: 03/04/2011\nPrincipal: Jordan Staffson\nProposed exclusion — you may make a submission within 5 school days. The student remains suspended from school pending the decision."
      description: Populated record 2
      synthetic: true
    - value: "Cancellation of enrolment\nStudent name: Jamie Teston\nStudent ID: S4471820\nThe principal has decided to cancel the student's enrolment (s316) because of persistent refusal to participate in the educational program."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Principals may impose a short suspension (1 to 10 school days) or long suspension (11 to 20 school days) under the Education (General Provisions) Act 2006. Parents can seek a review of an exclusion decision.
      description: Guidance or explainer text
    - value: "Notice of suspension\nStudent name: __________\nEQ ID: __________\nYear level: __________\nSuspension period: ____ school days"
      description: Blank form
    - value: In 2025 Queensland state schools recorded 78,500 short suspensions and 1,420 exclusions, according to the department's annual school disciplinary absences data.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_school_suspension_exclusion_decision_primary
      matches:
        - ref: Regex_au_qld_school_suspension_exclusion_decision_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_school_suspension_exclusion_decision_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_school_suspension_exclusion_decision_primary
      matches:
        - ref: Regex_au_qld_school_suspension_exclusion_decision_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_school_suspension_exclusion_decision_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_school_suspension_exclusion_decision_primary
      pattern: >-
        (?i)\b(?:(?:short|long)[\s-]+suspension|charge[\s-]+related\s+suspension|suspension\s+(?:decision|notice)|decision\s+(?:notice\s+)?(?:to|about)\s+(?:suspend|exclude)|notice\s+of\s+(?:suspension|exclusion)|exclusion\s+(?:decision|notice|order)|proposed\s+exclusion|cancellation\s+of\s+enrolment|(?:suspended|excluded)\s+from\s+(?:the\s+)?school)\b
    - id: Regex_au_qld_school_suspension_exclusion_decision_record_structure
      pattern: >-
        (?i)\b(?:student\s+name|child(?:'s)?\s+name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|principal|school|(?:student|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_school_suspension_exclusion_decision_corroborative
      groups:
        - match_style: word
          terms:
            - Education (General Provisions) Act 2006
            - principal
            - school days
            - show cause
            - grounds
            - behaviour
            - submission
            - review
            - Director-General
            - return to school
            - support plan
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a queensland school suspension, exclusion or enrolment cancellation decision about an identified person, gated on populated record fields. Principal decision notices and records to suspend, exclude or cancel the enrolment of a named student at a Queensland state school under the Education (General Provisions) Act 2006 (ss281-283 suspension, charge-related suspension, exclusion, s316 cancellation of enrolment), including the grounds, behaviour and student details. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Education (General Provisions) Act 2006 s282 (AustLII)
    url: http://classic.austlii.edu.au/au/legis/qld/consol_act/epa2006305/s282.html
  - title: Qld DoE — Cancellation of enrolment procedure
    url: https://ppr.qed.qld.gov.au/pp/cancellation-of-enrolment-procedure
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
