        "description": "Synthetic populated record variant 1",
        "synthetic": true
      },
      {
        "value": "International student homestay record\nStudent ID: RD728491\nHomestay host: Morgan Teston\nHomestay address: 27 Demonstration Avenue\nPlacement start date: 2026-10-01",
        "description": "Synthetic populated record variant 2",
        "synthetic": true
      },
      {
        "value": "CAAW record\nStudent name: Avery Teston\nWelfare contact: Jordan Teston\nAccommodation address: 84 Example Grove\nWelfare start date: 2026-10-01\nForm template version 2.1. Retain the completed record.",
        "description": "Synthetic populated record variant 3",
        "synthetic": true
      },
      {
        "value": "International student homestay record\nStudent ID: RD728491\nHomestay host: Morgan Teston\nHomestay address: 27 Demonstration Avenue\nPlacement start date: 01/10/2026",
        "description": "Synthetic populated record variant 4",
        "synthetic": true
      }
    ],
    "should_not_match": [
      {
