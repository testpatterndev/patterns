schema: testpattern/v1
name: Loyalty program balances
slug: global-top500-365-loyalty-program-balances
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects loyalty programme balance records: a loyalty programme / points balance / frequent flyer phrase combined with populated member data - rows keyed by a member identifier, labelled points balances, status credits or tiers, or labelled membership numbers. Phrase-only mentions (programme terms, marketing) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: loyalty program(me) (balances), points balance, frequent flyer (account/statement/number/program), loyalty card/account/membership, reward(s) points, accrued points, status credits, membership tier. 65 (discovery only): primary alone. 75: primary plus one populated structure - a delimited data row keyed by a member identifier with a numeric value, a labelled points balance/points earned/redeemed/status credits/tier value, or a labelled membership/frequent flyer/loyalty card number. 85: primary plus two distinct structures (the three above or a delimited column header pairing a member ID column with points, balance, tier or status-credit columns) plus programme evidence (redemption, points expiry, tier review, partner earn, statement period, points transfer, fraudulent redemption, lounge access, bonus points). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: (?i)\b(?:loyalty\s+program(?:me)?s?(?:\s+balances?)?|points\s+balances?|frequent\s+flyer(?:\s+(?:account|statement|number|program(?:me)?))?|loyalty\s+(?:card|account|member(?:ship)?)s?|rewards?\s+points|accrued\s+points|status\s+credits|membership\s+tier)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated dataset structure (a data row keyed by a customer/record identifier, a labelled value or a labelled identifier) beside the topic phrase; a column header on its own only counts toward 85, so blank extracts stay at 65. Help pages, policies, product copy and news that only name the topic stay at 65. Medium because internal analytics documentation with worked examples can still reach 75.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - redemption
    - points expiry
    - tier review
    - partner earn
    - statement period
    - points transfer
    - fraudulent redemption
    - lounge access
    - bonus points
  proximity: 300
test_cases:
  should_match:
    - value: "Frequent flyer statement - September 2026\nMember name: Avery Teston\nMembership number: 1044218703\nPoints balance: 184,250\nStatus credits: 620\nTier: Gold\nRedemption: 60,000 points, BNE-SYD return, 14/09/2026. Points expiry review due in March."
      description: Member statement - membership number, balances and redemption evidence (85)
      synthetic: true
    - value: "Loyalty program balances extract\nmember_id,tier,points_balance,status_credits\n10442187,Gold,184250,620\n10442190,Silver,22110,180\nBonus points campaign eligibility attached."
      description: Balance extract - header and member rows (85)
      synthetic: true
    - value: "Loyalty account\nMember number: 1044218703\nPlease reset the PIN."
      description: Single labelled membership number (75)
      synthetic: true
  should_not_match:
    - value: "Program terms: earn reward points on every purchase and check your points balance in the app. Points expire after 18 months of inactivity; see frequently asked questions."
      description: Programme terms and FAQ
      synthetic: true
    - value: "Loyalty program statement\nMember name: __________\nMembership number: __________\nPoints balance: ______"
      description: Blank statement - placeholder values
      synthetic: true
    - value: "The airline's frequent flyer program added 1.2 million members this year and cut the points needed for upgrades, according to a news report."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing loyalty programmes and points balances.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of loyalty programmes and points balances.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_loyalty_program_balances
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_365_loyalty_program_balances_column_header
            - Regex_global_top500_365_loyalty_program_balances_data_row
            - Regex_global_top500_365_loyalty_program_balances_labelled_value
            - Regex_global_top500_365_loyalty_program_balances_identifier
        - ref: Keyword_global_top500_365_loyalty_program_balances_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_365_loyalty_program_balances_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_loyalty_program_balances
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_365_loyalty_program_balances_data_row
            - Regex_global_top500_365_loyalty_program_balances_labelled_value
            - Regex_global_top500_365_loyalty_program_balances_identifier
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_365_loyalty_program_balances_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_loyalty_program_balances
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_loyalty_program_balances
      pattern: (?i)\b(?:loyalty\s+program(?:me)?s?(?:\s+balances?)?|points\s+balances?|frequent\s+flyer(?:\s+(?:account|statement|number|program(?:me)?))?|loyalty\s+(?:card|account|member(?:ship)?)s?|rewards?\s+points|accrued\s+points|status\s+credits|membership\s+tier)\b
    - id: Regex_global_top500_365_loyalty_program_balances_column_header
      pattern: (?i)\b(?:(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:points(?:[ _]?balance)?|balance|tier|status[ _]?credits|points[ _]?(?:earned|redeemed|expiring)|lifetime[ _]?points)|(?:points(?:[ _]?balance)?|balance|tier|status[ _]?credits|points[ _]?(?:earned|redeemed|expiring)|lifetime[ _]?points)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash))\b
    - id: Regex_global_top500_365_loyalty_program_balances_data_row
      pattern: (?i)\b[A-Z]{0,5}[-_]?\d{4,12}\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,160}?(?:[,;\t]|\|[ \t]{0,2}))?\"?-?\$?\d{1,12}(?:\.\d{1,6})?%?(?![\w.])
    - id: Regex_global_top500_365_loyalty_program_balances_labelled_value
      pattern: (?i)\b(?:points\s+balance|balance|available\s+points|points\s+(?:earned|redeemed|expiring)|status\s+credits|tier(?:\s+status)?|membership\s+(?:tier|level))[ \t]{0,3}[:#][ \t]{0,3}(?:\d{1,3}(?:,\d{3}){1,3}|\d{1,9}|platinum|gold|silver|bronze|elite|premier)\b
    - id: Regex_global_top500_365_loyalty_program_balances_identifier
      pattern: (?i)\b(?:member(?:ship)?\s*(?:no\.?|number|ID)|frequent\s+flyer\s*(?:no\.?|number)|loyalty\s*(?:no\.?|number|ID)|loyalty\s+card\s*(?:no\.?|number)|card\s*(?:no\.?|number))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Za-z-]{0,8}\d)[A-Za-z0-9][A-Za-z0-9._@-]{3,64}
  keywords:
    - id: Keyword_global_top500_365_loyalty_program_balances_domain_evidence
      groups:
        - match_style: word
          terms:
            - redemption
            - points expiry
            - tier review
            - partner earn
            - statement period
            - points transfer
            - fraudulent redemption
            - lounge access
            - bonus points
      strength: domain
    - id: Keyword_global_top500_365_loyalty_program_balances_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - program terms
            - earn reward points on every purchase
      strength: noise
risk_description: >-
  This regex looks for loyalty programs, points balances, membership tiers, rewards accounts, and redemption language, aiming at customer-linked balance records rather than promotional copy. Disclosure can expose account identifiers, status, travel or shopping relationships, and stored reward value, enabling account takeover attempts, fraudulent redemption, targeted phishing, or profiling of members across the affected file. Marketing pages and generic programme terms remain possible medium-confidence matches without actual member balances. Risk 8 and SENSITIVE Personal-Privacy preserve the serious person-linked fraud and privacy outcome; PROTECTED would require usable credentials, exceptionally high stored value, protected members, or significant-damage scale. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
