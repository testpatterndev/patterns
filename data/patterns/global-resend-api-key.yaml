- url: https://resend.com/docs/api-reference/introduction
  title: "Resend API Reference authentication documentation (re_ Bearer API keys)"
- url: https://github.com/trufflesecurity/trufflehog/tree/main/pkg/detectors/resend
  title: "TruffleHog production Resend detector"
