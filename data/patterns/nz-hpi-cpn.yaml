schema: testpattern/v1
name: "New Zealand Health Practitioner Index Common Person Number (HPI-CPN)"
slug: nz-hpi-cpn
version: 1.0.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects 6-character New Zealand Health Practitioner Index Common Person Numbers (HPI-CPNs, formatted as 2 digits followed by 4 uppercase letters excluding I and O, e.g. 14ABCD -> 14KMPQ) issued by Te Whatu Ora / Health New Zealand to clinicians and health workers.
operation: >-
  Matches 2 digits followed by 4 uppercase letters ([A-HJ-NP-Z]{4}) on word boundaries. Enforcing tiers require HPI, CPN, Te Whatu Ora, MCNZ, Nursing Council, or NZ health-provider context within 300 characters, with local_noise_filter enabled.
pattern: '(?-i)\b(\d{2}[A-HJ-NP-Z]{4})\b'
confidence: high
confidence_justification: >-
  High confidence when corroborated: 2 digits + 4 uppercase letters (excluding I and O) is compact and structurally distinct from NHI numbers (3 letters + 4 digits), and NZ health-practitioner keywords remove incidental alphanumeric codes.
jurisdictions:
  - nz
regulations:
  - "Privacy Act 2020 (NZ)"
  - "Health Practitioners Competence Assurance Act 2003 (NZ)"
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - health
  - government-id
corroborative_evidence:
  keywords:
    - "HPI-CPN"
    - "Common Person Number"
    - "Health Practitioner Index"
    - "Te Whatu Ora"
    - "Health New Zealand"
    - "Medical Council of New Zealand"
  proximity: 300
test_cases:
  should_match:
    - value: "HPI-CPN: 19KMPQ"
      description: "Labelled 6-character NZ Health Practitioner Index Common Person Number"
    - value: "Practitioner 24TRWX — Te Whatu Ora ePrescription"
      description: "HPI-CPN in NZ ePrescription provider context"
    - value: "12BCFG"
      description: "Bare 2-digit + 4-letter HPI-CPN format (65 discovery)"
  should_not_match:
    - value: "ABC1234"
      description: "NHI patient number format (3 letters + 4 digits), not HPI-CPN (2 digits + 4 letters)"
    - value: "19KMIO"
      description: "Contains excluded letters I and O"
    - value: "Look up the clinician Common Person Number in the Health Practitioner Index"
      description: "Prose instruction without an HPI-CPN value"
    - value: "Sample template: placeholder example record for training only"
      description: "Template/sample fixture suppressed by shared exclusion dictionary"
false_positives:
  - description: "NZ motor-vehicle plates or grid references with 2 digits + 4 letters."
    mitigation: "Enforcing tiers require HPI, CPN, Te Whatu Ora, or clinical prescribing keywords within 300 characters."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 4
risk_description: >-
  The detector matches a 6-character New Zealand Health Practitioner Index Common Person Number (HPI-CPN). Like Australia's HPI-I and Ahpra registration numbers, an HPI-CPN identifies a healthcare practitioner rather than a patient, appearing on referrals, ePrescriptions, and credentialing records. Risk 4 and OFFICIAL match au-hpi-individual.
sensitivity_labels:
  pspf: "OFFICIAL"
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: "CUI"
  uk_gov: "OFFICIAL"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
classification:
  tier: Low
  rationale: >-
    Risk 4 maps to PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because an HPI-CPN is a professional health-worker directory identifier rather than patient clinical information.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low handling suits a health-practitioner registry identifier.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      local_noise_filter: true
      id_match: Regex_nz_hpi_cpn
      matches:
        - ref: Keyword_nz_hpi_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match: Regex_nz_hpi_cpn
      matches:
        - ref: Keyword_nz_hpi_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_nz_hpi_cpn
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_nz_hpi_cpn
      pattern: '(?-i)\b(\d{2}[A-HJ-NP-Z]{4})\b'
  keywords:
    - id: Keyword_nz_hpi_specific
      groups:
        - match_style: word
          terms:
            - "HPI-CPN"
            - "Common Person Number"
            - "Health Practitioner Index"
            - "Te Whatu Ora"
            - "Health New Zealand"
            - "Medical Council of New Zealand"
            - "MCNZ"
      strength: specific
    - id: Keyword_nz_hpi_broad
      groups:
        - match_style: word
          terms:
            - text: "HPI"
              case_sensitive: true
            - text: "CPN"
              case_sensitive: true
            - "prescriber"
            - "practitioner"
            - "referral"
            - "dispensing"
      strength: domain
references:
  - url: https://www.tewhatuora.govt.nz/health-services-and-programmes/digital-health/health-practitioner-index/
    title: "Health New Zealand / Te Whatu Ora - Health Practitioner Index (HPI-CPN)"
created: '2026-11-25'
updated: '2026-11-25'
changelog:
  - version: 1.0.0
    date: '2026-11-25'
    description: Initial release.
