schema: testpattern/v1
name: Customer chat transcripts
slug: global-top500-367-customer-chat-transcripts
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing captured customer messaging conversations in international contexts. Direct chat-transcript, customer-chat, live-chat, and chat-log anchors are retained; support-ticket
  wording is gated behind independent conversation-record context rather than treated as a transcript on its own, and generic customer-interaction, online-support, and customer-message phrasing no longer
  anchors detection.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 6 keywords within 300 characters. Keyword
  lists: industry-education. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(chat\s+transcript|customer\s+chat|live\s+chat|chat\s+log|chat\s+session|support\s+ticket|chatbot\s+conversation|messaging\s+history|chat\s+record)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - customer chat transcripts
    - customer
    - chat
    - transcripts
    - commercial
    - data
  proximity: 300
  keyword_lists:
    - industry-education
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: chat transcript
      description: Primary topic phrase match
    - value: customer chat
      description: Case-insensitive topic phrase match
    - value: live chat
      description: Alternative topic phrase match
    - value: chat log
      description: Additional topic phrase match
    - value: |-
        Chat transcript
        Name: Avery Teston
      description: Populated person/client record with one field (75 tier)
      synthetic: true
    - value: |-
        Chat transcript
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated person/client record with 2 distinct fields (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: customer invoice
      description: Generic word pair from old broad template should not match
    - value: The web team enabled an online support page containing telephone opening hours.
      description: Online support is a service-channel announcement, not a captured conversation - removed from the primary
    - value: customer interaction survey results
      description: Generic customer-interaction phrasing no longer anchors detection without transcript structure
    - value: customer message backlog report
      description: Customer-message phrasing no longer anchors detection without transcript structure
    - value: Customer chat transcripts
      description: "Bare detector name: it reached 75 through the generated name-word tier and must not reach an enforcing tier"
    - value: |-
        Chat transcript:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about chat transcript are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to customer chat transcripts appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: >-
      In English (as the primary international business language), similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute
      sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_chat_transcripts
      matches:
        - ref: Regex_global_top500_367_customer_chat_transcripts_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_chat_transcripts
      matches:
        - ref: Regex_global_top500_367_customer_chat_transcripts_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_chat_transcripts
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_chat_transcripts_ContextualBranch
      matches:
        - ref: Keyword_chat_transcripts_IndependentContext
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_chat_transcripts
      pattern: >-
        (?is)\b(chat\s+transcript|customer\s+chat|live\s+chat|chat\s+log|chat\s+session|chatbot\s+conversation|messaging\s+history|chat\s+record)\b
    - id: Regex_chat_transcripts_ContextualBranch
      pattern: (?is)\b(support\s+ticket)\b
    - id: Regex_global_top500_367_customer_chat_transcripts_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#)|agent|visitor|(?:conversation|participant|ticket|transcript)\s*(?:ID|no\.?|number|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
  keywords:
    - id: Keyword_chat_transcripts_IndependentContext
      groups:
        - match_style: word
          terms:
            - conversation ID
            - session ID
            - channel
            - participant ID
            - customer ID
            - agent
            - bot
            - timestamp
            - transferred
            - attachment
            - disposition
      strength: specific
risk_description: >-
  This contextual regex identifies chat transcripts, customer chats, live-chat content, or chat logs, representing a conversational record rather than an isolated contact identifier. An authentic transcript can combine identity clues, account issues, support verification, emotional disclosures, staff commitments, and transaction details, enabling social engineering, embarrassment, fraud, or manipulation of a complaint. The normal conversation is limited to one interaction but can still create serious privacy and service consequences for both customer and organization. Risk 8 and SENSITIVE are proportionate; PROTECTED would require a bulk transcript corpus, reusable credentials, privileged service access, or major widespread compromise.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 reconciles with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the Personal-Privacy DLM, and Medium for a
    customer conversation record. PROTECTED is not met because one transcript lacks bulk scale, privileged access, and
    the severe or significant damage threshold.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy DLM reflect the cumulative identity, account, and narrative detail present in a
      genuine customer chat.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-20'
    description: 'Generated name-word tier removed: the 75 tier ANDed Pattern_*_label_context (the detector name, "Customer chat transcripts") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 75. Both lists sit inside the IdMatch phrase, so the bare name alone scored 75. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs a populated person/client record field (Regex_global_top500_367_customer_chat_transcripts_record_structure); 85 needs 2 distinct fields. Curated terms that sit inside an IdMatch hit were removed. "support ticket" and "online support" restate the topic and "customer interaction" / "customer message" use detector-name words; they are dropped. The discovery-only "support ticket" branch is unchanged. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
  - version: 1.3.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
  - version: 1.3.0
    date: '2026-07-17'
    description: 'Reduced-scope alignment fix (TP-01275): keep the strong conversation anchors (chat transcript, customer chat, live chat, chat log, chat session, chatbot conversation, messaging history, chat record) in Regex_chat_transcripts; move support-ticket wording to Regex_chat_transcripts_ContextualBranch, which reaches 65 only with two unique independent conversation-record terms from Keyword_chat_transcripts_IndependentContext (conversation/session ID, channel, participant/customer ID, agent/bot, timestamp, transferred, attachment, disposition); drop customer interaction, online support, and customer message as primary anchors. Expanded industry-education terms deliberately NOT reused as a transcript gate.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1913 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
