schema: testpattern/v1
name: NEM Generating Unit Outage / Maintenance Plan (Internal)
slug: au-nem-generating-unit-outage-plan
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Internal generating-unit outage and maintenance plans held by a NEM generator before (or in more detail than) the
  public PASA submission: planned outage schedules and overhaul programmes listing the unit or DUID, outage start and
  finish dates, MW deratings, unit states, work scope and return-to-service (RTS) dates or unit recall times. The
  unit-level PASA availability and unit-state codes AEMO publishes under NER cl 3.7.2(f)(5) (NEMweb
  MTPASA_DUIDAvailability / STPASA_DUIDAvailability) are public and treated as decoys; the plan detail behind them
  (scope, work orders, exact dates, reason narrative, drafts not yet submitted) is not published.
operation: >-
  Primary: outage-plan vocabulary (planned / unit / major / minor outage plan, schedule, programme or window, outage
  plan revision, planned or maintenance outage, overhaul plan or schedule, return to service, RTS date, unit recall
  time). 75 requires, within 300 characters, either a populated schedule row (a date range on one line followed by a
  MW figure or an NER unit-state token such as OUTAGEPLANBASIC or DERATINGPLANEXTEND, or "derated to/by NNN MW") or a
  populated plan field (DUID, unit, outage start / finish / type / reference, RTS date, recall time, work order,
  work scope with a non-placeholder value). 85 requires both a schedule row and a plan field plus an independent
  internal-plan term (draft, not yet submitted, work order, scope of work, tube leak, overhaul, boiler inspection,
  turbine, PASA submission). Every tier excludes template/fixture text, AEMO public-file markers (",AEMO,PUBLIC,",
  PUBLIC_MTPASA / PUBLIC_STPASA, I,MTPASA,DUIDAVAILABILITY, the PASAAVAILABILITY,PASAUNITSTATE header), ESOO and
  market notices. 65 is discovery-only and will surface IT and network outage notices.
pattern: (?i)\b(?:(?:planned|unit|generating\s+unit|major|minor|maintenance)\s+outage\s+(?:plan|schedule|programme|program|window)|outage\s+plan(?:\s+rev(?:ision)?)?|planned\s+outage|maintenance\s+outage|overhaul\s+(?:plan|schedule|programme)|return\s+to\s+service|RTS\s+date|unit\s+recall\s+time)\b
confidence: medium
confidence_justification: >-
  Medium: "planned outage" and "return to service" are generic (IT, network and fleet maintenance use them), so
  enforce tiers require generator-specific structure: a dated schedule row carrying MW or an NER unit-state token,
  or a populated DUID / outage / RTS field. Public AEMO PASA CSVs are excluded on their header markers. 85/75 are
  heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
regulations:
  - National Electricity Rules cl 3.7.2 (medium term PASA inputs - plant maintenance, PASA availability, unit state, unit recall time)
  - National Electricity Rules cl 3.7.3 (short term PASA inputs)
frameworks:
  - ISO 27001
  - SOCI Act 2018 (Cth)
data_categories:
  - energy-market
  - infrastructure
  - business
corroborative_evidence:
  keywords:
    - DUID
    - derate
    - return to service
    - unit recall time
    - PASA availability
    - work order
    - scope of work
    - overhaul
  proximity: 300
customisation:
  - key: generator-outage-work-order
    kind: identifier-format
    identifier: generator-outage-work-order
    target: purview.regexes/Regex_au_nem_outage_plan_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's generator outage work order / reference format (see docs/identifiers.md#generator-outage-work-order). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Unit 3 major outage plan - rev C DRAFT (not yet submitted to AEMO)\nDUID: TARONG3X\nOutage start: 02/03/2027\nRTS date: 14/04/2027\nSchedule:\n02/03/2027 to 09/03/2027  unit offline 0 MW  OUTAGEPLANBASIC  boiler inspection\n10/03/2027 to 14/04/2027  turbine overhaul, HP rotor exchange\nScope of work: HP/IP turbine overhaul, boiler tube replacement, work order WO-448120."
      description: Draft major outage plan with DUID, outage and RTS fields, dated MW / unit-state row and work scope - intended 85
      synthetic: true
    - value: "Planned outage schedule - Kogan Ridge Units 1-2\nUnit: KRIDGE1\n15/11/2026 - 22/11/2026 derated to 180 MW for mill overhaul\nReturn to service: 23/11/2026 06:00\nWork order: 7732019"
      description: Planned outage schedule with populated unit and work-order fields and a derating row - intended 85
      synthetic: true
    - value: "Minor outage window, Unit 2\n05/06/2027 to 07/06/2027 DERATINGPLANBASIC 210 MW available; condenser tube cleaning."
      description: Outage window with a dated row carrying a unit-state token and MW - intended 75
      synthetic: true
    - value: "Maintenance outage for the air heater has been moved.\nDUID: STANW4B\nRevised timing has been agreed with operations."
      description: Maintenance outage note with a populated DUID field - intended 75
      synthetic: true
  should_not_match:
    - value: "C,NEMP.WORLD,MTPASA_DUIDAVAILABILITY,AEMO,PUBLIC,2026/09/24,10:00:00\nI,MTPASA,DUIDAVAILABILITY,1,DAY,REGIONID,DUID,PASAAVAILABILITY,PASAUNITSTATE,PASARECALLTIME,LATEST_OFFER_DATETIME\nD,MTPASA,DUIDAVAILABILITY,1,2026/10/01,QLD1,BARCALDN,0,OUTAGEPLANBASIC,48,2026/09/23 14:00:00\nplanned outage return to service"
      description: Public AEMO MTPASA_DUIDAvailability extract with unit-state codes
    - value: "PASA availability means the physical plant capability available in a particular period, including any physical plant capability that can be made available during that period on 24 hours notice. The unit state must distinguish between a physical and economic reason for unavailability, and the unit recall time is the period in which the plant can be made available."
      description: NER definitions of PASA availability, unit state and unit recall time
    - value: "Planned outage: the customer portal will be unavailable from 01/10/2026 to 02/10/2026 while we upgrade servers. Service will return to service by 6am."
      description: IT planned outage notice with a date range but no MW or generator fields
    - value: "Outage plan template\nDUID: ________\nOutage start: [dd/mm/yyyy]\nRTS date: [dd/mm/yyyy]\nDerated to: ___ MW"
      description: Blank outage plan template
    - value: "A unit at the Queensland coal station tripped offline on Monday and is expected to return to service later this week, the operator said, as AEMO issued a market notice on reserve levels."
      description: News report / market notice
false_positives:
  - description: AEMO public MT PASA and ST PASA DUID availability files list DUIDs, PASA availability and unit-state codes.
    mitigation: The ",AEMO,PUBLIC," header, PUBLIC_MTPASA / PUBLIC_STPASA filenames, I,MTPASA,DUIDAVAILABILITY and the PASAAVAILABILITY,PASAUNITSTATE column header are excluded within the proximity window.
  - description: IT, telecommunications and network planned-outage notices.
    mitigation: Enforce tiers require a MW figure, NER unit-state token or populated DUID / unit / RTS / work-order field.
  - description: NER definitions, AEMO ESOO and MT PASA reports, market notices and news about unit trips.
    mitigation: No populated schedule rows or plan fields; ESOO, market notice and media release terms are excluded.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_nem_outage_plan_primary
      matches:
        - ref: Regex_au_nem_outage_plan_schedule_row
        - ref: Regex_au_nem_outage_plan_field
        - ref: Keyword_au_nem_outage_plan_internal
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_nem_outage_plan_exclusion
            - Regex_au_nem_outage_plan_public_file
    - confidence_level: 75
      id_match: Regex_au_nem_outage_plan_primary
      matches:
        - type: any
          refs:
            - Regex_au_nem_outage_plan_schedule_row
            - Regex_au_nem_outage_plan_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_nem_outage_plan_exclusion
            - Regex_au_nem_outage_plan_public_file
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_nem_outage_plan_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_nem_outage_plan_exclusion
            - Regex_au_nem_outage_plan_public_file
  regexes:
    - id: Regex_au_nem_outage_plan_primary
      pattern: >-
        (?i)\b(?:(?:planned|unit|generating\s+unit|major|minor|maintenance)\s+outage\s+(?:plan|schedule|programme|program|window)|outage\s+plan(?:\s+rev(?:ision)?)?|planned\s+outage|maintenance\s+outage|overhaul\s+(?:plan|schedule|programme)|return\s+to\s+service|RTS\s+date|unit\s+recall\s+time)\b
    - id: Regex_au_nem_outage_plan_schedule_row
      pattern: >-
        (?i)\b\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}\s{0,3}(?:-|to|until)\s{0,3}\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}\b[^\r\n]{0,120}(?:\b\d{1,4}(?:\.\d{1,2})?\s?MW\b|\b(?:OUTAGE(?:PLAN|UNPLAN)(?:BASIC|EXTEND|FORCED|MAINT)|DERATING(?:PLAN|UNPLAN)(?:BASIC|EXTEND|FORCED|MAINT)|INACTIVERESERVE|MOTHBALLED)\b)|\bderat(?:e|ed|ing)\s+(?:to|by)\s+\d{1,4}(?:\.\d{1,2})?\s?MW\b
    - id: Regex_au_nem_outage_plan_field
      pattern: >-
        (?i)\b(?:DUID|unit(?:\s+(?:name|no\.?|number))?|generating\s+unit|outage\s+(?:start|finish|end|type|ref(?:erence)?|no\.?|number|duration)|RTS(?:\s+date)?|return\s+to\s+service(?:\s+date)?|(?:unit\s+)?recall\s+time|work\s+order(?:\s+(?:no\.?|number))?|work\s+scope|scope\s+of\s+works?)(?:\s*\([^)]{1,20}\))?\s*[:#=]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.:-]{1,40}
    - id: Regex_au_nem_outage_plan_public_file
      pattern: >-
        ,AEMO,PUBLIC,|\bPUBLIC_(?:MTPASA|STPASA)|\bI,MTPASA,DUIDAVAILABILITY\b|\bPASAAVAILABILITY,PASAUNITSTATE\b
  keywords:
    - id: Keyword_au_nem_outage_plan_internal
      groups:
        - match_style: word
          terms:
            - draft
            - not yet submitted
            - work order
            - scope of work
            - scope of works
            - tube leak
            - overhaul
            - boiler inspection
            - turbine
            - PASA submission
            - unit recall time
            - derated
            - mill
            - condenser
      strength: specific
    - id: Keyword_au_nem_outage_plan_exclusion
      groups:
        - match_style: word
          terms:
            - Electricity Statement of Opportunities
            - market notice
            - media release
            - High Impact Outages
      strength: specific
risk_rating: 7
risk_description: >-
  An internal generating-unit outage plan discloses when and for how long specific units will be unavailable or
  derated, the work scope and the return-to-service dates, ahead of or in more detail than AEMO's public unit-level
  PASA data. In the NEM this is market-sensitive: advance knowledge of a competitor's capacity withdrawal informs
  bidding and contract pricing, and outage windows also reveal plant condition and periods of reduced resilience for
  critical infrastructure. Unit-level PASA availability itself is public, so the risk sits in the plan detail and
  timing. Risk 7 supports SENSITIVE Commercial-in-Confidence.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Commercial-in-Confidence
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: National Electricity Rules (AEMC) - cl 3.7.1, 3.7.2, 3.7.3 and Chapter 10 "PASA availability"
    url: https://www.aemc.gov.au/regulation/energy-rules/national-electricity-rules
  - title: AEMO NEMweb current reports - MTPASA_DUIDAvailability and STPASA_DUIDAvailability (public, decoy source)
    url: https://nemweb.com.au/Reports/Current/
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - anchored on NER cl 3.7.2 outage / PASA vocabulary; 75 gated on a dated MW / unit-state row or populated plan field; 85 on both plus an internal-plan term; AEMO public PASA files excluded.
