schema: testpattern/v1
name: NEM Dispatchable Unit Identifier (DUID) Context
slug: au-nem-duid
version: 1.0.3
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects AEMO Dispatchable Unit Identifiers (DUIDs) when labelled as such. DUIDs
  are short (max 8 character) unit codes - modern IDs are alphanumeric, legacy IDs
  may contain '#', '/' or '-' (e.g. BARRON-1, W/HOE#1, ER01, LOYYB1).
  IMPORTANT: DUIDs are fully PUBLIC identifiers (published in the AEMO NEM
  Registration and Exemption List and in five-minute NEMWEB dispatch data). This
  pattern is a discovery-only context marker and corroborative building block for
  sensitive-content patterns (bids, availability, curves) - it must never enforce
  on its own. A bare DUID token is indistinguishable from ordinary text, so the
  pattern requires the DUID label (or dispatchable-unit phrasing) immediately
  before the code.
operation: >-
  Matches 'DUID' (or 'dispatchable unit id/identifier') followed within a few
  characters by a plausible DUID token of 3-8 chars from the DUID charset (the token
  must contain a digit, '#', '/' or '-', which excludes ordinary following words and
  covers virtually all registered DUIDs). Deploy
  alongside a keyword dictionary of actual registered DUIDs generated from the AEMO
  NEM Registration and Exemption List ('PU and Scheduled Loads' tab) for
  participant-specific precision.
pattern: >-
  \b(?:DUID|dispatchable\s+unit\s+(?:id|identifier))\b[\s:=,"'\)\(]{1,6}(?=[A-Z0-9#/_-]{0,7}[0-9#/-])[A-Z0-9][A-Z0-9#/_-]{2,7}(?![A-Za-z0-9#/_-])
confidence: low
confidence_justification: >-
  Low confidence by design: the identifier itself is public, so a match carries no
  sensitivity on its own - DUIDs appear throughout public AEMO dispatch data,
  market commentary and analyst material. The pattern exists for discovery and as
  an AND-condition/corroborative element beside sensitive-content patterns
  (au-nem-bid-file, au-forward-curve-artefact) and participant-specific DUID
  dictionaries.
jurisdictions:
  - au
regulations:
  - "National Electricity Rules Ch 2 (registration) and cl 3.8 (dispatch)"
frameworks:
  - ISO 27001
  - SOCI Act 2018 (Cth)
data_categories:
  - energy-market
  - infrastructure
corroborative_evidence:
  keywords:
    - AEMO
    - dispatch
    - registered capacity
    - bid
    - generating unit
    - station
    - availability
  proximity: 300
  keyword_lists:
    - au-nem-duids
customisation:
  - key: participant-duids
    kind: dictionary-subset
    target: corroborative_evidence.keyword_lists/au-nem-duids
    note: >-
      For participant-specific precision, replace the full-market DUID
      dictionary with the subset registered to your organisation (deployment
      overlay). Without the overlay this pattern stays a generic market-context
      discovery marker.
    required_for_enforcement: false
test_cases:
  should_match:
    - value: 'DUID: BARRON-1 offered availability reduced to 320 MW'
      description: Labelled legacy DUID with hyphen
    - value: 'dispatchable unit identifier W/HOE#1 out of service'
      description: Spelled-out label with legacy hash/slash DUID
    - value: 'rebid lodged for DUID LOYYB1'
      description: Labelled modern alphanumeric DUID
  should_not_match:
    - value: David's DUID badge number is not on file
      description: Prose without a following unit token pattern context
    - value: the DUID
      description: Label with no code following
    - value: unit BARRON-1 tripped at 14:05
      description: Bare DUID without the label (dictionary handles these)
false_positives:
  - description: Public AEMO dispatch reports, WattClarity-style market commentary,
      and academic datasets legitimately reference DUIDs.
    mitigation: Keep enforcement paired with participant-specific dictionaries and
      trading-context keywords; treat public market data locations as out of scope.
exports:
  - yaml
scope: wide
risk_rating: 3
risk_description: >-
  The DUID itself is public and carries no standalone risk. Risk arises only from
  unpublished content attached to a DUID (availability, outage intentions, price
  bands, rebid reasoning) - detect that with the sensitive-content patterns this
  marker corroborates.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - "AEMO NEM Registration and Exemption List (PU and Scheduled Loads tab)"
  - "AEMO application guides - DUID format (max 8 chars, alnum preferred)"
created: 2026-07-24
updated: 2026-08-03
changelog:
  - version: 1.0.3
    date: 2026-08-03
    note: Label-taxonomy fix - replace the list-shaped sensitivity_labels (bare SENSITIVE) with the canonical jurisdiction map; qgiscf_dlm OFFICIAL (DUIDs are fully public identifiers and this pattern is discovery-only), matching the identifier convention (au-medicare-card-identifier, au-hpi-individual).
  - version: 1.0.2
    date: 2026-07-25
    note: Declare participant-duids dictionary-subset customisation (deployment overlays supply a participant-filtered DUID subset).
  - version: 1.0.1
    date: 2026-07-24
    note: Downgraded to discovery-only (confidence low, scope wide, risk 3) - DUIDs
      are public identifiers; pattern repositioned as corroborative context marker.
  - version: 1.0.0
    date: 2026-07-24
    note: Initial draft; dictionary build step documented from public registration list.
author: Compl8 (draft)
