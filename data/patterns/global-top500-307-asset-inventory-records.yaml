schema: testpattern/v1
name: Asset inventory records
slug: global-top500-307-asset-inventory-records
version: 1.3.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects IT asset inventory records: asset register/inventory wording with populated asset tags, serial numbers, hostnames, MAC/IP addresses and owners. Topic wording alone is discovery-only.
operation: >-
  Regex_asset_inventory_primary (IT/hardware/software asset inventory or register wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated asset field (asset tag, serial, hostname, model, MAC, IP, assigned owner, location, OS) or an inventory column header or a device artefact (MAC address, IPv4, internal hostname). 85 requires a populated asset field (asset tag, serial, hostname, model, MAC, IP, assigned owner, location, OS) or an inventory column header (two distinct hits), a device artefact (MAC address, IPv4, internal hostname), and independent asset-lifecycle (EOL, warranty, device class) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_asset_inventory_guidance_exclusion).
pattern: >-
  (?i)\b(?:(?:IT|ICT|hardware|software)\s+asset\s+(?:inventory|register)|asset\s+(?:inventory|register)(?:\s+export)?|hardware\s+inventory|software\s+inventory)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated asset field (asset tag, serial, hostname, model, MAC, IP, assigned owner, location, OS) or an inventory column header or a device artefact (MAC address, IPv4, internal hostname)), and 85 needs two distinct structures plus independent asset-lifecycle (EOL, warranty, device class) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
- CIS Controls
data_categories:
- security
corroborative_evidence:
  keywords:
  - end of life
  - warranty
  - lifecycle
  - decommissioned
  - in service
  - laptop
  - server
  - workstation
  - firewall
  - switch
  proximity: 300
test_cases:
  should_match:
  - value: The asset register will be reconciled against the CMDB next quarter.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      IT asset register extract
      Asset tag: HB-004471
      Serial number: 5CG2141XYZ
    description: Medium-tier probe (75) - populated asset fields
    synthetic: true
  - value: |-
      IT asset register extract - Finance floor
      Asset tag: HB-004471
      Hostname: ws-fin-114
      Serial number: 5CG2141XYZ
      MAC address: 3C:52:82:1A:9F:04
      IP address: 10.20.4.17
      Assigned to: A. Teston - laptop, warranty expires 30/06/2027, end of life 2028.
    description: High-tier probe (85) - several asset fields, MAC/IP artefacts and lifecycle context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: all ICT equipment is recorded in the asset register when received.'
    description: Policy text
    synthetic: true
  - value: |-
      Asset register template
      Asset tag: ________
      Serial number: [insert]
      Hostname: ________
    description: Blank template
    synthetic: true
  - value: 'Course module 2: an asset inventory records the asset tag, serial number and MAC address of each laptop.'
    description: Training framing
    synthetic: true
false_positives:
- description: Financial fixed-asset registers (furniture, vehicles).
  mitigation: Enforcement needs IT asset fields or device artefacts; 85 also needs device lifecycle context.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_asset_inventory_primary
    matches:
    - ref: Regex_asset_inventory_asset_field
      min_count: 2
      unique_results: true
    - ref: Regex_asset_inventory_device_artefact
    - ref: Keyword_asset_inventory_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_asset_inventory_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_asset_inventory_primary
    matches:
    - type: any
      refs:
      - Regex_asset_inventory_asset_field
      - Regex_asset_inventory_device_artefact
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_asset_inventory_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_asset_inventory_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_asset_inventory_primary
    pattern: >-
      (?i)\b(?:(?:IT|ICT|hardware|software)\s+asset\s+(?:inventory|register)|asset\s+(?:inventory|register)(?:\s+export)?|hardware\s+inventory|software\s+inventory)\b
  - id: Regex_asset_inventory_asset_field
    pattern: >-
      (?i)\b(?:asset\s+(?:tag|ID|no\.?|number)|serial\s+(?:no\.?|number)|S/N|hostname|model|manufacturer|MAC(?:\s+address)?|IP\s+address|assigned\s+to|owner|location|OS(?:\s+version)?|purchase\s+date|warranty\s+(?:end|expiry))\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}|\b(?:asset\s*(?:tag|ID)|hostname|serial\s*(?:no|number)?)\s*[,|\t;]\s*(?:hostname|serial\s*(?:no|number)?|model|MAC|IP(?:\s+address)?|owner|location)\b
  - id: Regex_asset_inventory_device_artefact
    pattern: >-
      (?i)\b[0-9A-F]{2}(?::[0-9A-F]{2}){5}\b|\b[0-9A-F]{2}(?:-[0-9A-F]{2}){5}\b|\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b
  keywords:
  - id: Keyword_asset_inventory_context
    groups:
    - match_style: word
      terms:
      - end of life
      - warranty
      - lifecycle
      - decommissioned
      - in service
      - laptop
      - server
      - workstation
      - firewall
      - switch
    strength: specific
  - id: Keyword_asset_inventory_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires asset-inventory wording plus populated asset fields or device artefacts (MAC, IP, internal hostname) before enforcing. A complete inventory can enumerate systems, versions, owners, locations, and lifecycle status, enabling theft, social engineering, vulnerability targeting, or commercial inference. The normal scope is an organisational asset set and its custodians, while isolated serial-number mentions, procurement forms, and inventory templates can match without forming a full register. Risk 8 SENSITIVE reflects serious contained operational exposure; PROTECTED would require a critical or enterprise-wide inventory capable of significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because a substantive asset
    register exposes systems, ownership, versions, and lifecycle information useful for targeting. PROTECTED is not met
    because the concept detector does not establish completeness, critical-asset concentration, or significant
    organisation-wide consequence.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic handling is Medium with Medium InfoTech controls for asset inventories, restricting detailed identifiers,
      locations, owners, and software versions. High is reserved for broad critical-asset registers whose disclosure
      would cause significant damage.
