schema: testpattern/v1
name: Queensland CCC Corrupt Conduct Notification
slug: au-qld-ccc-corrupt-conduct-notification
version: 1.1.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Notifications to the Crime and Corruption Commission of suspected corrupt conduct (Crime and Corruption Act 2001 s38), s40 direction assessments and internal corrupt-conduct assessment and investigation records that name the subject officer.
operation: >-
  Primary: Queensland CCC Corrupt Conduct Notification anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:(?:suspected\s+)?corrupt\s+conduct|(?:section|s\.?)\s{0,2}38\s+(?:of\s+the\s+)?(?:Crime\s+and\s+Corruption\s+Act|CC\s+Act)|(?:section|s\.?)\s{0,2}40\s+directions?|CCC\s+(?:notification|referral|assessment|reference))\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Crime and Corruption Act 2001 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - government
  - law-enforcement
  - pii
corroborative_evidence:
  keywords:
    - Crime and Corruption Commission
    - CCC
    - subject officer
    - allegation
    - assessment
    - investigation
    - misconduct
    - reasonable suspicion
  proximity: 300
customisation:
  - key: ccc-reference
    kind: identifier-format
    identifier: ccc-reference
    target: purview.regexes/Regex_au_qld_ccc_corrupt_conduct_notification_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Crime and Corruption Commission reference format (see docs/identifiers.md#ccc-reference). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
  - key: employee-id
    kind: identifier-format
    identifier: employee-id
    target: purview.regexes/Regex_au_qld_ccc_corrupt_conduct_notification_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Employee / staff ID format (see docs/identifiers.md#employee-id). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Notification to the CCC under s38 of the Crime and Corruption Act 2001\nSubject officer: Riley Teston, Team Leader Licensing\nDate notified: 09/09/2026\nAllegation: accepted gifts from an applicant in exchange for expediting licences. Reasonable suspicion of corrupt conduct."
      description: Populated record 1
      synthetic: true
    - value: The CCC has referred the corrupt conduct matter about Jordan Staffson back to the department to deal with, subject to monitoring. Investigation plan and interview schedule attached.
      description: Narrative record 2 without labelled fields (reaches 65 discovery only, by design)
      synthetic: true
    - value: "CCC reference: CO-26-1187\nSubject officer: Morgan Teston\nAssessment outcome: suspected corrupt conduct — fraudulent overtime claims totalling $18,240."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Public sector agencies must notify the CCC if they reasonably suspect corrupt conduct (section 38 of the Crime and Corruption Act 2001). Section 40 directions set out matters that need not be notified.
      description: Guidance or explainer text
    - value: "Corrupt conduct notification\nSubject officer: __________\nDate notified: __________\nSummary of allegation: __________"
      description: Blank form
    - value: The CCC received 2,960 complaints of suspected corrupt conduct in 2024-25, most involving the public sector, its annual report says.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_ccc_corrupt_conduct_notification_primary
      matches:
        - ref: Regex_au_qld_ccc_corrupt_conduct_notification_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_ccc_corrupt_conduct_notification_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_ccc_corrupt_conduct_notification_primary
      matches:
        - ref: Regex_au_qld_ccc_corrupt_conduct_notification_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_ccc_corrupt_conduct_notification_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_ccc_corrupt_conduct_notification_primary
      pattern: >-
        (?i)\b(?:(?:suspected\s+)?corrupt\s+conduct|(?:section|s\.?)\s{0,2}38\s+(?:of\s+the\s+)?(?:Crime\s+and\s+Corruption\s+Act|CC\s+Act)|(?:section|s\.?)\s{0,2}40\s+directions?|CCC\s+(?:notification|referral|assessment|reference))\b
    - id: Regex_au_qld_ccc_corrupt_conduct_notification_record_structure
      pattern: >-
        (?i)\b(?:discloser|subject\s+officer|subject\s+person|complainant|witness|officer|employee\s+(?:no\.?|number|ID)|position|work\s+unit|allegation|CCC\s+ref(?:erence)?|file\s+(?:no\.?|number|ref)|reference\s+(?:no\.?|number)|case\s+(?:no\.?|number)|date\s+(?:received|of\s+disclosure|notified)|name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_ccc_corrupt_conduct_notification_corroborative
      groups:
        - match_style: word
          terms:
            - Crime and Corruption Commission
            - text: CCC
              case_sensitive: true
            - subject officer
            - allegation
            - assessment
            - investigation
            - misconduct
            - reasonable suspicion
            - natural justice
            - disciplinary
            - referred back
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a queensland ccc corrupt conduct notification about an identified person, gated on populated record fields. Notifications to the Crime and Corruption Commission of suspected corrupt conduct (Crime and Corruption Act 2001 s38), s40 direction assessments and internal corrupt-conduct assessment and investigation records that name the subject officer. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 9 supports SENSITIVE Legal.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: CCC — Assessing and notifying
    url: https://www.ccc.qld.gov.au/public-sector/assessing-and-notifying
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.1.0
    date: '2026-09-24'
    description: Declare identifier-format customisation slots (ccc-reference, employee-id) replacing the interim identifier_dependencies metadata; definitions and replacement steps live in data/identifiers/ and docs/identifiers.md.
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
