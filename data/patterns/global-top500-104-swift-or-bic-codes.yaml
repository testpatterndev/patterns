schema: testpattern/v1
name: SWIFT or BIC codes
slug: global-top500-104-swift-or-bic-codes
version: 1.6.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects references to SWIFT or BIC codes in financial and compliance documents. Commonly found in Australian regulatory filings, transaction records, and audit documentation. Phrase-level
  payment-rail concept detection anchored on explicit SWIFT/BIC vocabulary; it does not parse 8- or 11-character BIC values.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Keyword
  lists: financial-deposit-terms.
pattern: (?is)\b(?:SWIFT\s+code|BIC\s+code|bank\s+identifier\s+code|SWIFT\s+network)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - swift or bic codes
    - swift
    - bic
    - codes
    - financial
    - accounts
    - payments
  proximity: 300
  keyword_lists:
    - financial-deposit-terms
test_cases:
  should_match:
    - value: SWIFT code
      description: Primary topic phrase match
    - value: bic code
      description: Case-insensitive topic phrase match
    - value: bank identifier code
      description: Alternative topic phrase match
    - value: SWIFT network
      description: Additional topic phrase match
    - value: |-
        SWIFT code: Recorded
        Payee: Avery Teston
        Account number: 12345678
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: bank transfer
      description: Generic word pair from old broad template should not match
    - value: Domestic routing code changed.
      description: Generic routing-code wording demoted out of the primary - no SWIFT/BIC linkage
    - value: correspondent bank arrangements
      description: Correspondent-bank wording demoted out of the primary - corroborative evidence only
    - value: wire transfer approval
      description: Generic payment wording demoted out of the primary
    - value: |-
        SWIFT code:
        Payee:
        Account name:
        Account number:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about swift code are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        SWIFT code:
        Payee: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In Australian English, standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_104_swift_or_bic_codes_populated_label
      matches:
        - ref: Regex_global_top500_104_swift_or_bic_codes_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_104_swift_or_bic_codes_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_swift_or_bic_codes
      matches:
        - ref: Evidence_swift_or_bic_codes
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_swift_or_bic_codes
  regexes:
    - id: Pattern_swift_or_bic_codes
      pattern: (?is)\b(?:SWIFT\s+code|BIC\s+code|bank\s+identifier\s+code|SWIFT\s+network)\b
    - id: Regex_global_top500_104_swift_or_bic_codes_populated_label
      pattern: (?i)\b(?:\b(?:SWIFT\s+code|BIC\s+code|bank\s+identifier\s+code|SWIFT\s+network)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_global_top500_104_swift_or_bic_codes_record_structure
      pattern: (?i)\b(?:payee|supplier|vendor|creditor|beneficiary|account\s+name|BSB|account\s+(?:no\.?|number)|invoice\s+(?:no\.?|number)|remittance\s+(?:no\.?|number|ref(?:erence)?)|payment\s+(?:ref(?:erence)?|date)|amount\s+paid)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_swift_or_bic_codes
      groups:
        - match_style: word
          terms:
            - correspondent bank
            - wire transfer
            - international payment
      strength: specific
risk_description: >-
  The regex recognises SWIFT-code, BIC-code, bank-identifier-code, correspondent-bank, wire-transfer, international-payment, network, and routing-code terminology. It does not parse the eight- or eleven-character structure of a BIC and therefore may indicate only payment-rail discussion. Even a real BIC usually identifies a bank or branch rather than a personal account, and payment fraud needs beneficiary details plus authority. Risk 4 OFFICIAL reflects low standalone harm; SENSITIVE would require a complete non-public payment instruction or linked customer transaction.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, OFFICIAL DLM, and Low because SWIFT or BIC routing references are
    often public and confer no account authority. The next higher SENSITIVE classification is not met because linkage to
    a customer, account, confidential transaction, or manipulable beneficiary instruction is not established.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low handling is appropriate for public institution-routing information, while payment instructions
      combining it with beneficiary accounts and transaction details need contextual escalation.
references:
  - title: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)"
    url: https://www.legislation.gov.au/C2006A00169/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
created: '2026-02-08'
updated: '2026-10-19'
changelog:
  - version: 1.6.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_104_swift_or_bic_codes_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (correspondent bank, wire transfer, international payment); 85 requires the populated field plus a populated payee/account field (Regex_global_top500_104_swift_or_bic_codes_record_structure). Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (interbank, bank code, routing code). Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.5.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (SOCI Act 2018 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.5.0
    date: '2026-07-17'
    description: 'Reduced-scope alignment fix (TP-00231): narrow the primary IdMatch to explicit SWIFT/BIC concepts (SWIFT code, BIC code, bank identifier code, SWIFT network); correspondent-bank, wire-transfer, international-payment, bank-code, and routing-code wording is demoted to corroborative evidence only, so domestic routing prose can no longer reach enforceable tiers under a SWIFT/BIC title. 8/11-character BIC value parsing rejected for this concept SIT (separate identifier classifier if ever needed).'
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 706 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-04'
    description: case/evidence metadata update
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
