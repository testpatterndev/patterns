schema: testpattern/v1
name: Sexual Orientation
slug: global-sexual-orientation
version: 1.3.0
type: regex
pattern_class: concept
engine: universal
description: >-
  Detects sexual-orientation information in person-linked workforce, patient, survey, member,
  relationship, intake, and case records. The detector recognises the explicit sexual
  orientation phrase, orientation-specific identification statements, coming-out statements,
  and same-sex partner or spouse references, then raises confidence only for person records and
  populated attributions. It deliberately excludes transgender status, gender identity, and
  pronouns because those are distinct attributes. Sexual orientation is protected under GDPR
  Article 9 and Australian anti-discrimination and privacy law. Topic-grade detector, low
  confidence by design.
operation: >-
  The primary regex matches the explicit sexual orientation phrase, orientation-specific identification and coming-out statements, and same-sex partner/spouse references. 65 (discovery only): phrase alone - policy, guidance, news and survey-design text naming the category stays here. 75: phrase plus a populated identified-person field (name, DOB, employee/member/customer/patient/participant number or ID, data subject). 85: person field plus a populated orientation value (heterosexual, gay, lesbian, bisexual, pansexual, asexual, queer) that is not part of the primary statement plus independent record evidence (recorded as, response selected, disclosed to, optional demographic question, diversity survey, next of kin). Template framing and guidance/policy/public-aggregate framing are excluded from 75/85. Converted from keyword_list to regex so the tier logic decides matches.
pattern: (?i)\b(?:sexual\s+orientations?|identif(?:y|ies|ied)\s+as\s+(?:gay|lesbian|bisexual|queer)|same-sex\s+(?:partner|spouse)|coming\s+out\s+as\s+(?:gay|lesbian|bisexual|queer))\b
confidence: low
confidence_justification: >-
  Low by design: the attribute has no fixed format. Enforce tiers now require the attribute to be tied to an identified person record (a populated name/DOB/ID field), and 85 also requires a separately populated orientation value plus independent record evidence, so policy text, surveys-in-design and news naming the category stay at 65 discovery.
jurisdictions:
  - global
  - au
  - eu
regulations:
  - GDPR
  - Privacy Act 1988 (Cth)
  - Sex Discrimination Act 1984 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - sexual orientation
    - gay
    - lesbian
    - bisexual
    - queer
    - partner
    - spouse
    - demographic response
  proximity: 300
test_cases:
  should_match:
    - value: "HR diversity survey - individual response\nEmployee ID: E40917\nName: Avery Teston\nSexual orientation: Bisexual\nResponse selected voluntarily; recorded as confidential."
      description: Person record with a populated orientation value and survey-response evidence (85)
      synthetic: true
    - value: "Patient intake record\nPatient name: Casey Rourke\nNotes: same-sex partner listed as support person."
      description: Person record with a same-sex partner reference only (75)
      synthetic: true
  should_not_match:
    - value: "The new employee orientation begins Monday morning."
      description: Near-miss ("orientation" alone), no sexual-orientation disclosure
    - value: "The building's orientation faces north for solar efficiency."
      description: Unrelated "orientation" (architectural), no disclosure vocabulary
    - value: "The team celebrated Pride month with a company-wide event."
      description: Topical mention ("Pride"), no personal disclosure phrase
    - value: "Public policy document reports aggregate LGBTQ community demographics."
      description: Public aggregate material is not a person-linked orientation disclosure
    - value: "Sample template: patient intake record with optional demographic response Example Value."
      description: Adjacent template language is not a populated orientation record
    - value: "Patient intake record lists preferred pronouns as they and them."
      description: Sibling gender-expression data is excluded from the orientation-only Purview primary
    - value: "Employee profile records transgender status and gender identity."
      description: Gender identity is a distinct attribute and must not satisfy this classifier
    - value: "The organisation published its LGBTQ+ inclusion policy for Pride month."
      description: Community and policy terminology without a person-linked orientation
    - value: "Policy guidance: this procedure explains how sexual orientation details are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Optional demographic questions\nName: ____________________\nEmployee ID: ____________________\nSexual orientation: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: the national survey will ask about sexual orientation for the first time, and advocates say the question must stay optional."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: >-
      The bare word "orientation" appears in unrelated contexts (employee orientation,
      building/map orientation) that have nothing to do with sexual orientation.
    mitigation: >-
      The regex targets full orientation-specific phrases rather than the bare word
      "orientation"; enforcement requires a person-record context, and the high tier also
      requires a populated attribution.
  - description: >-
      "Coming out as" can appear in non-disclosure prose unrelated to sexual orientation
      (e.g. "the album is coming out as a double LP", "the report is coming out as
      scheduled").
    mitigation: >-
      The regex now requires "coming out as" to be followed by an orientation term, and
      enforcement requires person-record evidence in the same bounded span.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: broad
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_global_sexual_orientation
      matches:
        - ref: Regex_global_sexual_orientation_person_fields
        - ref: Regex_global_sexual_orientation_orientation_value
        - ref: Evidence_orientation_record_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_sexual_orientation_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_global_sexual_orientation
      matches:
        - ref: Regex_global_sexual_orientation_person_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_sexual_orientation_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_global_sexual_orientation
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_global_sexual_orientation
      pattern: (?i)\b(?:sexual\s+orientations?|identif(?:y|ies|ied)\s+as\s+(?:gay|lesbian|bisexual|queer)|same-sex\s+(?:partner|spouse)|coming\s+out\s+as\s+(?:gay|lesbian|bisexual|queer))\b
    - id: Regex_global_sexual_orientation_person_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|employee(?:\s+name)?|(?:employee|staff|member|customer|client|patient|participant|respondent|person|applicant|voter|record)\s*(?:no\.?|number|ID)|staff\s+member|member(?:\s+name)?|patient(?:\s+name)?|client(?:\s+name)?|customer(?:\s+name)?|applicant(?:\s+name)?|data\s+subject|resident(?:\s+name)?)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_sexual_orientation_orientation_value
      pattern: (?i)(?<!as\s)\b(?:heterosexual|gay|lesbian|bisexual|pansexual|asexual|queer)\b
  keywords:
    - id: Evidence_orientation_record_evidence
      groups:
        - match_style: word
          terms:
            - recorded as
            - response selected
            - disclosed to
            - optional demographic
            - diversity survey
            - next of kin
      strength: specific
    - id: Keyword_global_sexual_orientation_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
            - public policy document
            - public policy guidance
            - public dataset
            - aggregate statistics
            - aggregate report
            - academic paper
            - blank questionnaire
            - awareness campaign
            - training course
            - public report
      strength: exclusion
risk_rating: 7
risk_description: >-
  A true positive attributes sexual orientation or a same-sex relationship to a person.
  Disclosure can cause involuntary outing, discrimination, harassment, coercion, or safety
  harm, particularly where orientation carries legal or social risk. The normal single-person
  record does not by itself establish the scale or severe consequence required for PROTECTED.
  Risk 7 and SENSITIVE Personal-Privacy are appropriate.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: "SENSITIVE Personal-Privacy"
  us_gov: CUI Basic
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
created: '2026-07-12'
updated: '2026-09-24'
changelog:
  - version: 1.3.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): converted keyword_list to regex; 75 was gated only by record-context keywords (HR file, intake form, case record) that appear in policy and survey-design text, and 85 evidence could repeat the primary. 75 now requires the attribute to sit with a populated identified-person field (name, DOB, member/employee/patient ID) and 85 requires person fields plus a separately populated orientation value plus independent record evidence; policy text naming the category stays at 65. Bare-phrase tests replaced with populated person records; added policy, blank-form and news decoys; public-context exclusions folded into the guidance exclusion group."
  - version: 1.2.0
    date: '2026-07-19'
    description: 'Consolidate the retired Australian alias into the global detector: add Australian legal and workforce evidence, align the top-level and Purview primaries, remove transgender/gender-identity/LGBTQ-policy scope, retain 65 discovery, and require person-record plus populated orientation evidence at 75/85.'
  - version: 1.1.0
    date: '2026-07-19'
    description: 'Targeted blocker remediation: add an orientation-only 65 topic-discovery tier, a 75 data-subject-record tier, and an 85 populated orientation-attribution tier, with exact-tier and sibling/public/template probes.'
  - version: 1.0.1
    date: '2026-07-12'
    description: 'Final-review finding: document the "coming out as" false-positive vector (non-disclosure prose like album/report release timing) in false_positives, matching the precedent files'' practice of documenting each broad alternation''s FP risk.'
  - version: 1.0.0
    date: '2026-07-12'
    description: 'New pattern: replaces the deprecated au/global-top500-015-sexual-orientation attribute-value patterns (needs-EDM/ML) with an honest topic-classifier concept, modeled on global-political-opinion. Fills the D-wave coverage gap logged in c3-deprecation-report.md.'
