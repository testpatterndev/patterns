schema: testpattern/v1
name: Religious or Philosophical Beliefs
slug: global-religious-beliefs
version: 1.5.0
type: regex
pattern_class: concept
engine: universal
description: >-
  Detects religious or philosophical belief information in person-linked membership, patient,
  workforce, student, census, pastoral-care, and accommodation records. The detector recognises
  explicit belief, affiliation, observance, denomination, religious instruction and structured
  religion-field terminology, including a Religion column in a person table, then raises
  confidence only for person records and populated belief or accommodation statements. School
  records covered include enrolment forms that record religion or baptism, religious instruction
  (Queensland) and special religious education (NSW) participation records, and student lists
  with a religion column. Religious Education as a school subject is not a belief disclosure and
  does not trigger the detector. Religious or philosophical beliefs are protected under GDPR
  Article 9 and Australian anti-discrimination and privacy law. Topic-grade detector, low
  confidence by design.
operation: >-
  The primary regex matches explicit religious/philosophical-belief phrases, religious instruction, special religious education, religious background and structured religion, faith or denomination labels. 65 (discovery only): phrase alone - policy, guidance, news, program timetables and survey-design text naming the category stays here. 75: phrase plus a populated identified-person field (name, DOB, student/learner/employee/member/customer/patient/participant number or ID, EQ ID, LUI, USI, parent or guardian name, data subject). 85: person field plus a named religion or denomination value (Christian, Catholic, Anglican, Uniting, Seventh-day Adventist, Muslim, Hindu, Sikh, Jewish, Buddhist, no religion ...) plus independent record evidence (chaplaincy, pastoral care, congregation, parish, baptism, sacraments, prayer, halal/kosher, Sabbath, Ramadan, religious dress, religious leave). A second 75 path takes a table header that puts a person column (student, employee, member, patient ... ID or name) and a Religion, Denomination or Faith column within 160 characters of each other, plus at least two delimited cells holding a named religion value, so a populated export reaches 75 while an empty header, or a prose field list that names one or two religions, does not. Template framing and guidance/policy/public-aggregate framing are excluded from 75/85.
pattern: (?i)\b(religious\s+(?:or\s+philosophical\s+)?beliefs?|philosophical\s+beliefs?|religious\s+affiliations?|faith\s+affiliations?|belief\s+systems?|faith\s+traditions?|religious\s+(?:observance|preference|background|instruction|denominations?|conversion\s+record)|special\s+religious\s+education|place\s+of\s+worship|(?:religion|faith|denomination)\s*(?::|(?:field|code|response)))
confidence: low
confidence_justification: >-
  Low by design: the attribute has no fixed format. Enforce tiers require the attribute to be tied to an identified person record (a populated name/DOB/ID field) or a person table with a populated religion column, and 85 also requires a named religion or denomination value plus independent record evidence, so policy text, program timetables, surveys-in-design and news naming the category stay at 65 discovery. Christian is also a given name, so a religion value alone never lifts a record; it counts only beside a religion label or column.
jurisdictions:
  - global
  - au
  - eu
regulations:
  - GDPR
  - Privacy Act 1988 (Cth)
  - Fair Work Act 2009 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - faith
    - congregation
    - worship
    - clergy
    - denomination
    - doctrine
    - spiritual
    - religion
  proximity: 300
test_cases:
  should_match:
    - value: "Patient admission record\nPatient name: Morgan Ellisdale\nMRN: 5540921\nDOB: 17/03/1968\nReligion: Hindu (Shaivism)\nPastoral care: chaplaincy visit requested; vegetarian dietary requirement."
      description: Person record with a populated religion value and pastoral-care evidence (85)
      synthetic: true
    - value: "Employee file\nEmployee number: E40917\nName: Casey Rourke\nNotes: requested that religious affiliation not be shared with the roster team."
      description: Person record naming religious affiliation without a populated value (75)
      synthetic: true
    - value: "Workplace accommodation request - People and Culture\nEmployee name: Taylor Okafor\nStaff ID: S-30215\nReligious observance: Muslim, fasting during Ramadan\nRequested: prayer room access at 1pm, shift ending 30 minutes earlier during Ramadan, and religious leave for Eid al-Fitr.\nApproved by roster manager 02/02/2026."
      description: Workforce accommodation record with staff identifiers, religious observance value and leave/prayer evidence (85)
      synthetic: true
    - value: "The form records religious affiliation for each new starter."
      description: "Category term without a person field or belief value: discovery tier only (65)"
      synthetic: true
    - value: "Chaplaincy services are offered regardless of religious beliefs."
      description: "Category term without an identified person: discovery tier only (65)"
      synthetic: true
    - value: "Enrolment application - St Brigid's Catholic Primary School\nStudent name: Avery Teston\nDate of birth: 03/04/2019\nReligion: Catholic\nBaptism certificate: sighted 12/08/2026\nParish: St Brigid's, Redbank"
      description: Catholic school enrolment with student, religion value and baptism and parish evidence (85)
      synthetic: true
    - value: "Student enrolment form\nStudent name: Jordan Teston\nDate of birth: 21/07/2016\nReligion: Christian\nReligious instruction: Yes"
      description: State school enrolment recording religion and religious instruction choice, no further evidence (75)
      synthetic: true
    - value: "Religious instruction participation\nStudent: Riley Teston\nEQ ID: 0123456789A\nYear level: 4\nProgram: Combined Churches"
      description: Religious instruction participation record for a named student (75)
      synthetic: true
    - value: "Student ID,Student Name,Year,Religion\nRG20451,Avery Teston,7,Islam\nRG20452,Jordan Teston,7,No religion\nRG20453,Casey Teston,7,Seventh-day Adventist"
      description: Student export with a populated religion column (75)
      synthetic: true
    - value: "Student support note\nStudent ID: s4471902\nFaith: Muslim\nRequest: prayer room access between exam sessions during Ramadan"
      description: University student accommodation note with student ID, faith value and prayer evidence (85)
      synthetic: true
  should_not_match:
    - value: "We believe in transparent pricing for all customers."
      description: Generic corporate "believe", not a belief-system disclosure
    - value: "The museum exhibit covered world religions through history."
      description: Topical/educational mention, no personal disclosure phrase
    - value: "Religious studies 101 is a required elective this semester."
      description: Academic course listing, no disclosure phrase
    - value: "Public policy document reports aggregate congregation demographics."
      description: Public aggregate material is not a person-linked belief disclosure
    - value: "Sample template: patient record with stated faith Example Faith."
      description: Adjacent template language is not a populated belief record
    - value: "Patient record lists a vegetarian dietary preference."
      description: Sibling preference record does not satisfy the religious-belief primary
    - value: "Policy guidance: this procedure explains how religious beliefs and religious affiliation details are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Diversity survey\nName: ____________________\nEmployee number: ____________________\nReligion: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: the census shows the share of people reporting no religion rose again, and faith traditions in the region continue to diversify."
      description: News/training prose about the topic without a populated record (65 discovery at most)
    - value: "Semester 1 report\nStudent name: Avery Teston\nYear level: 6\nReligious Education: B\nEnglish: A\nMathematics: B"
      description: Catholic school report card; Religious Education is a subject result, not a belief disclosure
    - value: "Student name: Christian Teston\nYear level: 8\nHomeroom: 8C\nBus route: 14"
      description: Given name Christian with no religion label or column
    - value: "Religious instruction consent form\nStudent name: ____________________\nParent/guardian name: ____________________\nI consent to my child taking part in religious instruction: [ ] Yes [ ] No"
      description: Blank religious instruction consent form (65 discovery at most)
    - value: "This procedure explains how state schools offer religious instruction in school hours. Parents may withdraw their child at any time by notifying the principal in writing."
      description: Religious instruction procedure text (65 discovery at most)
    - value: "Religious instruction timetable: Tuesday 9:00, Year 4, Room 12, Combined Churches volunteers"
      description: Program timetable with no identified person (65 discovery at most)
    - value: "Student ID,Student Name,Year,Religion\n,,,\n,,,"
      description: Empty export header with a religion column
    - value: "Information collection notice: the school collects your child's student name, date of birth, religion (for example Catholic, Anglican or Uniting) and medical conditions for religious instruction."
      description: Collection notice listing fields in prose (65 discovery at most)
    - value: "The enrolment system stores student ID, year level, religion, Catholic baptism status and parish for each family."
      description: System description listing fields in prose
    - value: "Student ID,Student Name,Year,Religion\nRG20451,Christian Teston,7,\nRG20452,Jordan Teston,7,"
      description: Export with a blank religion column and one student named Christian
false_positives:
  - description: >-
      A person table with a Religion column whose religion cells are blank but whose name column holds
      two or more students or staff named Christian, or a delimited prose list naming two or more
      religions near a person-and-religion field list.
    mitigation: >-
      Rare residuals of the table path, which needs two delimited religion-value cells. Purview reads line
      breaks as spaces, so a cell cannot be tied to the Religion column itself.
  - description: >-
      Generic corporate or educational use of "believe"/"religion"/"religious" (values
      statements, history/comparative-religion content) has nothing to do with a personal
      belief-disclosure record.
    mitigation: >-
      The regex targets full disclosure phrases and structured belief labels rather than the
      bare words "believe" or "religion"; enforcement requires a person-record context, and the
      high tier also requires a populated attribution or accommodation signal.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: broad
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_global_religious_belief
      matches:
        - ref: Regex_global_religious_beliefs_person_fields
        - ref: Regex_global_religious_beliefs_religion_value
        - ref: Evidence_belief_record_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_religious_beliefs_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_global_religious_belief
      matches:
        - ref: Regex_global_religious_beliefs_person_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_religious_beliefs_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_global_religious_beliefs_table_header
      matches:
        - ref: Regex_global_religious_beliefs_religion_cell
          min_count: 2
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_religious_beliefs_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_global_religious_belief
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_global_religious_belief
      pattern: (?i)\b(religious\s+(?:or\s+philosophical\s+)?beliefs?|philosophical\s+beliefs?|religious\s+affiliations?|faith\s+affiliations?|belief\s+systems?|faith\s+traditions?|religious\s+(?:observance|preference|background|instruction|denominations?|conversion\s+record)|special\s+religious\s+education|place\s+of\s+worship|(?:religion|faith|denomination)\s*(?::|(?:field|code|response)))
    - id: Regex_global_religious_beliefs_table_header
      pattern: (?i)(\b(?:student|learner|pupil|employee|staff|member|patient|client|participant)[ \t]*(?:ID|no\.?|number|name)\b[^\r\n]{0,160}[,\t;|][ \t]*"?(?:religion|religious[ \t]+affiliation|denomination|faith)\b|\b(?:religion|religious[ \t]+affiliation|denomination|faith)"?[ \t]*[,\t;|][^\r\n]{0,160}\b(?:student|learner|pupil|employee|staff|member|patient|client|participant)[ \t]*(?:ID|no\.?|number|name)\b)
    - id: Regex_global_religious_beliefs_religion_cell
      pattern: (?i)([,;|][ \t]*"?(?:Christian(?:ity)?|Catholic(?:ism)?|Roman\s+Catholic|Anglican|Uniting(?:\s+Church)?|Combined\s+Churches|Presbyterian|Baptist|Pentecostal|Lutheran|Methodist|Seventh[\s-]day\s+Adventist|Adventist|Church(?:es)?\s+of\s+Christ|Salvation\s+Army|Greek\s+Orthodox|Orthodox|Coptic|Maronite|Assyrian\s+Church|Quaker|Mormon|Latter-day\s+Saints?|Jehovah\W?s\s+Witness(?:es)?|Muslim|Islam(?:ic)?|Sunni|Shia|Hindu(?:ism)?|Buddhis[mt]|Sikh(?:ism)?|Jewish|Judaism|Jain(?:ism)?|Tao(?:ism|ist)|Shinto|Zoroastrian|Druze|Baha\W?i|Shaivism|Vaishnavism|Aboriginal\s+(?:traditional\s+)?(?:spirituality|religions?)|humanis[mt]|agnostic|atheis[mt]|secular\s+beliefs|no\s+religion))\b
    - id: Regex_global_religious_beliefs_person_fields
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|employee(?:\s+name)?|(?:employee|staff|member|customer|client|patient|participant|respondent|person|applicant|voter|record)\s*(?:no\.?|number|ID)|staff\s+member|member(?:\s+name)?|patient(?:\s+name)?|client(?:\s+name)?|customer(?:\s+name)?|applicant(?:\s+name)?|data\s+subject|resident(?:\s+name)?|(?:student|learner|pupil|child|parent|guardian|carer)(?:\s+(?:full\s+)?name)?|(?:student|learner|pupil)\s*(?:no\.?|number|ID)|parent/guardian(?:\s+name)?|EQ\s*ID|LUI|USI)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3})
    - id: Regex_global_religious_beliefs_religion_value
      pattern: (?i)\b(Christian(?:ity)?|Catholic(?:ism)?|Roman\s+Catholic|Anglican|Uniting(?:\s+Church)?|Combined\s+Churches|Presbyterian|Baptist|Pentecostal|Lutheran|Methodist|Seventh[\s-]day\s+Adventist|Adventist|Church(?:es)?\s+of\s+Christ|Salvation\s+Army|Greek\s+Orthodox|Orthodox|Coptic|Maronite|Assyrian\s+Church|Quaker|Mormon|Latter-day\s+Saints?|Jehovah\W?s\s+Witness(?:es)?|Muslim|Islam(?:ic)?|Sunni|Shia|Hindu(?:ism)?|Buddhis[mt]|Sikh(?:ism)?|Jewish|Judaism|Jain(?:ism)?|Tao(?:ism|ist)|Shinto|Zoroastrian|Druze|Baha\W?i|Shaivism|Vaishnavism|Aboriginal\s+(?:traditional\s+)?(?:spirituality|religions?)|humanis[mt]|agnostic|atheis[mt]|secular\s+beliefs|no\s+religion)\b
  keywords:
    - id: Evidence_belief_record_evidence
      groups:
        - match_style: word
          terms:
            - chaplain
            - chaplaincy
            - pastoral care
            - congregation
            - prayer room
            - halal
            - kosher
            - Sabbath
            - Ramadan
            - religious leave
            - dietary requirement
            - baptism
            - baptised
            - baptized
            - baptismal
            - parish
            - sacrament
            - sacraments
            - sacramental
            - faith formation
            - prayer time
            - hijab
            - kippah
            - turban
            - Eid
            - Diwali
            - Yom Kippur
      strength: specific
    - id: Keyword_global_religious_beliefs_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
            - public policy document
            - public policy guidance
            - public dataset
            - aggregate statistics
            - aggregate report
            - academic paper
            - blank questionnaire
            - awareness campaign
            - museum catalogue
            - comparative religion
      strength: exclusion
risk_rating: 7
risk_description: >-
  A true positive attributes a religious or philosophical belief, affiliation, observance, or
  accommodation need to a person. Disclosure can enable discrimination, coercion, exclusion,
  harassment, or safety harm where minority status carries legal or social risk. The normal
  single-person record does not by itself establish the scale or severe consequence required
  for PROTECTED. Risk 7 and SENSITIVE Personal-Privacy are appropriate.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: "SENSITIVE Personal-Privacy"
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Basic
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Personal-Privacy because the enforcing
    tiers require explicit religious or philosophical belief terminology in a person-linked record; the 85 tier also
    requires a populated belief, denomination, observance, conversion, or accommodation statement. The topic-only 65
    branch is discovery-only. PROTECTED is not met without a protected population, credible severe threat, or
    significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      A confirmed person-linked belief, affiliation, observance, or religious accommodation record is generically Medium
      Personal-Privacy because disclosure can enable discrimination, coercion, exclusion, harassment, or safety harm.
      High handling requires a severe threat or broad high-consequence holding.
created: '2026-07-12'
updated: '2026-10-30'
changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-22'
    description: >-
      Education coverage. Primary adds religious instruction, special religious education and religious
      background. Person fields add student, learner, pupil, child, parent and guardian names and IDs, EQ ID,
      LUI and USI. Religion values add Christian, Uniting, Combined Churches, Methodist, Seventh-day Adventist,
      Churches of Christ, Salvation Army, Coptic, Maronite, Islamic, the -ism forms, Jain, Taoist, Shinto,
      Aboriginal spirituality, humanism and secular beliefs. 85 evidence adds baptism, parish, sacraments,
      faith formation, prayer time, religious dress and festivals. New 75 path: a table header with a person
      column and a Religion, Denomination or Faith column, plus two delimited religion-value cells, so prose
      field lists stay out. Religious Education as
      a subject stays out. Education positives and decoys added (report card, given name Christian, blank RI
      consent, RI procedure and timetable, empty export).
  - version: 1.3.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.0
    date: '2026-09-24'
    description: "Quality pass (2026-09-24): converted keyword_list to regex; 75 was gated only by record-context keywords (membership form, patient record, employee file) that appear in policy and survey-design text, and 85 evidence could repeat the primary. 75 now requires the attribute to sit with a populated identified-person field (name, DOB, member/employee/patient ID) and 85 requires person fields plus a named religion/denomination value plus independent record evidence; policy text naming the category stays at 65. Bare-phrase tests replaced with populated person records; added policy, blank-form and news decoys; public-context exclusions folded into the guidance exclusion group."
  - version: 1.2.0
    date: '2026-07-19'
    description: 'Consolidate the retired Australian alias into the global detector: add Australian legal and workforce/accommodation evidence, recognise structured religion and denomination fields, retain 65 discovery, and require person-record plus populated belief evidence at 75/85.'
  - version: 1.1.0
    date: '2026-07-19'
    description: 'Targeted blocker remediation: add a 65 belief-topic discovery tier, a 75 person-record tier, and an 85 populated faith/observance attribution tier, with exact-tier and sibling/public/template probes.'
  - version: 1.0.0
    date: '2026-07-12'
    description: 'New pattern: replaces the deprecated au/global-top500-016-religious-or-philosophical-beliefs attribute-value patterns (needs-EDM/ML) with an honest topic-classifier concept, modeled on global-political-opinion. Deliberately avoids the deprecated pattern''s generic corroborative terms (personal, identity, demographics), which were the documented cause of its imprecision. Fills the D-wave coverage gap logged in c3-deprecation-report.md.'
