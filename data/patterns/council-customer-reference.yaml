  - title: Local Government Regulation 2012 (Qld) - ch 4 rates and charges
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2012-0236
  - title: Animal Management (Cats and Dogs) Act 2008 (Qld) - ss 46-49 registration
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2008-074
  - title: State Penalties Enforcement Act 1999 (Qld) - s 15 infringement notice contents
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1999-070
  - title: Planning Regulation 2017 (Qld) - sch 22 public access to development application documents
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2017-0078
