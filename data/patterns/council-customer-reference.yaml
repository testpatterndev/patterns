schema: testpattern/v1
name: Council Customer Reference Linked to a Named Customer (Assessment, Rate Account, Application, Animal Registration, Infringement)
slug: council-customer-reference
version: 1.0.1
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  A parameterised template for council customer references: rates assessment and property numbers, rate and water account numbers, development / building / plumbing application numbers, animal registration numbers and infringement notice numbers, when they appear in council correspondence, CRM exports and customer records alongside a named customer. Every council numbers these differently and none of the formats is published, so the public version anchors on the field labels (Assessment No, Property No, Rate Account, Application No, Animal Registration No, Infringement No and close variants) with a loose, placeholder-guarded, digit-bearing value. Each reference type is a separate regex so that a deployment can extend it with the council's real format through the existing identifier types council-property-number, utility-account-number, council-development-application-number, animal-registration-number and infringement-notice-number. The record-specific council classifiers (rates arrears, concessions, animal registration, infringement / SPER, water hardship) remain the higher-confidence detectors; this template catches the long tail of customer correspondence that carries a council reference. Published DA notices, council FAQ pages and blank forms are decoys.
operation: >-
  Primary (any one of five labelled reference regexes, each a separate slot): property / [rate[s]] assessment [no. / number / ID]; rate[s] / water [and sewerage] / council account [no. / number / ID] or customer no. / number / ID / reference; [development / building / plumbing / planning / operational works] application, DA, BA, approval or permit no. / number / ref[erence]; animal / dog / cat / pet registration no. / number, registration tag no. / number or tag no. / number; [penalty] infringement [notice] no. / number / ref[erence] or PIN no. / number. Each label must be followed on the same line by a value that starts with a digit or a short letter prefix and contains a digit, and that is not a placeholder (n/a, tbc, withheld, underscores, brackets, 0000, 123456). 75 requires, within 300 characters, a populated customer field (name, customer [name], ratepayer, [registered] owner['s name], applicant['s name], account holder, full name, postal / residential / mailing address, email, phone or mobile, followed by a name of two or more capitalised words, a street address, an email address or an Australian phone number, or a "Dear" salutation followed by a two-word name) AND a council context term (council, regional / city / shire council, local government, rates notice, ratepayer, animal management, local law, customer service centre). Both tiers AND NOT the shared template-exclusion dictionary; 75 also ANDs NOT a guidance / public-notice exclusion (frequently asked questions, fact sheet, how do I find, where to find, for example, public notice, public notification, properly made submission). There is no 85 tier: the value formats are customer-defined and a reference plus a name is not strong enough evidence on its own. 65 is discovery-only.
pattern: >-
  (?i)\b(?:(?:property|(?:rates?\s+)?assessment)\s+(?:no\.?|number|ID)|(?:rates?|water(?:\s+and\s+sewerage)?|council)\s+account(?:\s+(?:no\.?|number|ID))?|customer\s+(?:no\.?|number|ID|reference)|(?:(?:development|building|plumbing|planning|operational\s+works)\s+application|DA|BA|application|approval|permit)\s+(?:no\.?|number|ref(?:erence)?)|(?:(?:animal|dog|cat|pet)\s+registration|registration\s+tag|tag)\s+(?:no\.?|number)|(?:(?:penalty\s+)?infringement(?:\s+notice)?|PIN)\s+(?:no\.?|number|ref(?:erence)?))[ \t]*[:#]?[ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|0{4,}\b|123456)(?=[A-Z/-]{0,5}\d)[A-Z0-9][A-Z0-9/.-]{3,20}\b
confidence: low
confidence_justification: >-
  Low. None of the council reference formats is published (the identifier registry lists all five types as customer-defined or unpublished), so the public version matches a labelled, digit-bearing loose value. Labels such as "Application No" and "Customer No" are generic, which is why 75 needs both a populated customer field and a council context term, and why there is no 85 tier. recommended_confidence is 75. Precision improves when a deployment supplies the council's real formats through the identifier slots. 75 is a heuristic evidence tier, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Local Government Act 2009 (Qld)
  - Local Government Regulation 2012 (Qld)
  - Animal Management (Cats and Dogs) Act 2008 (Qld)
  - State Penalties Enforcement Act 1999 (Qld)
  - Planning Act 2016 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government
corroborative_evidence:
  keywords:
    - council
    - rates notice
    - ratepayer
    - local government
    - animal management
    - local law
    - customer service centre
  proximity: 300
customisation:
  - key: council-property-number
    kind: identifier-format
    identifier: council-property-number
    target: purview.regexes/Regex_council_customer_reference_property
    mode: extend
    affects_tiers:
      - 65
      - 75
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's council property / rates assessment number format (see docs/identifiers.md#council-property-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: utility-account-number
    kind: identifier-format
    identifier: utility-account-number
    target: purview.regexes/Regex_council_customer_reference_account
    mode: extend
    affects_tiers:
      - 65
      - 75
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's utility customer account number format (see docs/identifiers.md#utility-account-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: council-development-application-number
    kind: identifier-format
    identifier: council-development-application-number
    target: purview.regexes/Regex_council_customer_reference_application
    mode: extend
    affects_tiers:
      - 65
      - 75
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's development application number format (see docs/identifiers.md#council-development-application-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: animal-registration-number
    kind: identifier-format
    identifier: animal-registration-number
    target: purview.regexes/Regex_council_customer_reference_animal_registration
    mode: extend
    affects_tiers:
      - 65
      - 75
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's animal registration number format (see docs/identifiers.md#animal-registration-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: infringement-notice-number
    kind: identifier-format
    identifier: infringement-notice-number
    target: purview.regexes/Regex_council_customer_reference_infringement
    mode: extend
    affects_tiers:
      - 65
      - 75
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's infringement notice number format (see docs/identifiers.md#infringement-notice-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Harbourview Regional Council - customer request CR-2026-18821\nCustomer name: Avery Teston\nPostal address: 41 Poinciana Street, Mackay QLD 4740\nAssessment number: 40218877\nRequest: change of postal address for rates notices"
      description: Council CRM request tying a named ratepayer to an assessment number (75 tier)
      synthetic: true
    - value: "Dear Morgan Teston,\nRate account: 7004418273\nThank you for your call to the council customer service centre about your water and rates payment plan.\nEmail: morgan.teston@mailtest.au"
      description: Council letter with a rate account number and the customer's email (75 tier)
      synthetic: true
    - value: "Council animal management - renewal reminder\nRegistered owner: Jordan Teston\nAnimal registration no: D204718\nPhone: 0491 570 156"
      description: Animal registration reminder with the owner and registration number (75 tier)
      synthetic: true
    - value: "Local law review request\nInfringement no: 2026084291\nApplicant: Riley Teston\nCouncil received the request on 2 October 2026."
      description: Local law infringement review request with the applicant named (75 tier)
      synthetic: true
    - value: "Application no: MCU/2026/0412"
      description: A labelled application number on its own (65 tier, discovery)
      synthetic: true
  should_not_match:
    - value: "Frequently asked questions: how do I find my assessment number? It is printed at the top right of your council rates notice, above your name.\nAssessment number: 40218877\nCustomer name: Avery Teston"
      description: Council rates FAQ page (guidance exclusion)
    - value: "Council rates notice - change of address form\nCustomer name: ______________\nPostal address: ______________\nAssessment number: ______________"
      description: Blank change of address form (65 at most)
    - value: "Public notice - development application under the Planning Act 2016. Application no: MCU/2026/0412\nApplicant: Harbourview Developments Pty Ltd\nProperly made submissions may be lodged with council until 30 October 2026."
      description: Published DA public notice (public-notice exclusion)
    - value: "Harbour Bakery job applications\nApplication no: 20260412\nFull name: Casey Teston\nPosition: casual baker"
      description: Private-sector job application with no council context (65 only)
    - value: "Council issued 3,412 infringement notices and processed 1,284 development applications in 2025-26."
      description: Annual statistics (no labelled reference)
false_positives:
  - description: Council FAQ pages, rates notice explainers and form instructions that show a sample reference number.
    mitigation: 75 excludes FAQ and "how do I find" wording and needs a populated customer field. Placeholder values are rejected.
  - description: Published development application notices, which the Planning Regulation makes public.
    mitigation: Public notice and submission phrases are excluded at 75.
  - description: Non-council records that use the same labels (job applications, customer numbers in retail and banking).
    mitigation: 75 needs a council context term; without it these stay at 65.
  - description: Internal council reports that list many assessment numbers against owner names, which are legitimate business records.
    mitigation: This is the intended detection; use the record-specific council classifiers to decide severity.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 75
      id_match:
        type: any
        ids:
          - Regex_council_customer_reference_property
          - Regex_council_customer_reference_account
          - Regex_council_customer_reference_application
          - Regex_council_customer_reference_animal_registration
          - Regex_council_customer_reference_infringement
      matches:
        - ref: Regex_council_customer_reference_customer_field
        - ref: Keyword_council_customer_reference_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_council_customer_reference_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Regex_council_customer_reference_property
          - Regex_council_customer_reference_account
          - Regex_council_customer_reference_application
          - Regex_council_customer_reference_animal_registration
          - Regex_council_customer_reference_infringement
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_council_customer_reference_property
      pattern: >-
        (?i)\b(?:property|(?:rates?\s+)?assessment)\s+(?:no\.?|number|ID)[ \t]*[:#]?[ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|0{4,}\b|123456)(?=[A-Z/-]{0,5}\d)[A-Z0-9][A-Z0-9/.-]{3,20}\b
    - id: Regex_council_customer_reference_account
      pattern: >-
        (?i)\b(?:(?:rates?|water(?:\s+and\s+sewerage)?|council)\s+account(?:\s+(?:no\.?|number|ID))?|customer\s+(?:no\.?|number|ID|reference))[ \t]*[:#]?[ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|0{4,}\b|123456)(?=[A-Z/-]{0,5}\d)[A-Z0-9][A-Z0-9/.-]{3,20}\b
    - id: Regex_council_customer_reference_application
      pattern: >-
        (?i)\b(?:(?:development|building|plumbing|planning|operational\s+works)\s+application|DA|BA|application|approval|permit)\s+(?:no\.?|number|ref(?:erence)?)[ \t]*[:#]?[ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|0{4,}\b|123456)(?=[A-Z/-]{0,5}\d)[A-Z0-9][A-Z0-9/.-]{3,20}\b
    - id: Regex_council_customer_reference_animal_registration
      pattern: >-
        (?i)\b(?:(?:animal|dog|cat|pet)\s+registration|registration\s+tag|tag)\s+(?:no\.?|number)[ \t]*[:#]?[ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|0{4,}\b|123456)(?=[A-Z/-]{0,5}\d)[A-Z0-9][A-Z0-9/.-]{3,20}\b
    - id: Regex_council_customer_reference_infringement
      pattern: >-
        (?i)\b(?:(?:penalty\s+)?infringement(?:\s+notice)?|PIN)\s+(?:no\.?|number|ref(?:erence)?)[ \t]*[:#]?[ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|0{4,}\b|123456)(?=[A-Z/-]{0,5}\d)[A-Z0-9][A-Z0-9/.-]{3,20}\b
    - id: Regex_council_customer_reference_customer_field
      pattern: >-
        (?i)\b(?:name|customer(?:\s+name)?|ratepayer(?:\s+name)?|(?:registered\s+)?owner(?:'?s)?(?:\s+name)?|applicant(?:'?s)?(?:\s+name)?|account\s+holder|full\s+name|(?:postal|residential|mailing)\s+address|e-?mail(?:\s+address)?|(?:tele)?phone(?:\s+(?:no\.?|number))?|mobile(?:\s+(?:no\.?|number))?)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not|none|nil|redacted|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:(?:(?:Mr|Mrs|Ms|Miss|Dr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:\+?61[ \t]?|0)[2-478](?:\d{2}[ \t]?\d{3}[ \t]?\d{3}|[ \t]?\d{4}[ \t]?\d{4})|[A-Z0-9._%+-]{1,40}@[A-Z0-9-]{1,40}\.[A-Z.]{2,20})|\bdear[ \t]+(?!(?:customer|ratepayer|resident|sir|madam|owner|applicant|occupier)\b|\[|<)(?:(?:Mr|Mrs|Ms|Miss|Dr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}
  keywords:
    - id: Keyword_council_customer_reference_context
      groups:
        - match_style: word
          terms:
            - council
            - regional council
            - city council
            - shire council
            - local government
            - rates notice
            - ratepayer
            - animal management
            - local law
            - customer service centre
      strength: specific
    - id: Keyword_council_customer_reference_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - frequently asked questions
            - fact sheet
            - factsheet
            - how do I find
            - where to find
            - for example
            - public notice
            - public notification
            - properly made submission
            - properly made submissions
      strength: specific
risk_rating: 4
risk_description: >-
  The classifier identifies council correspondence and customer records that tie a named person, address, phone or email to a council reference (rates assessment, rate or water account, application, animal registration or infringement number). A reference on its own is low sensitivity, but linked to a named customer it lets a reader look up the person's property, account balance, applications, pets or penalties in council systems, and bulk CRM exports expose many ratepayers at once. FAQ pages, blank forms, published DA notices and non-council records are excluded from the enforce tier. Risk 4 supports OFFICIAL with privacy handling.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI Basic
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
