schema: testpattern/v1
name: Marketing suppression lists
slug: global-top500-372-marketing-suppression-lists
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects marketing suppression / do-not-contact lists: a suppression list / do-not-contact / opt-out list phrase combined with populated contact data - email addresses, Australian phone numbers or labelled opt-out/suppression dates and reasons. Phrase-only mentions (Spam Act guidance, unsubscribe policies) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: (marketing) suppression list(s), do not contact/mail/call/email list(s)/flag(s), marketing exclusion list(s), email/SMS suppression(s), opt-out list(s), unsubscribe list(s). 65 (discovery only): primary alone. 75: primary plus one populated structure - an email address, an Australian mobile or landline number, or a labelled opt-out/unsubscribe date or suppression reason/date/source. 85: primary plus two distinct structures (the three above or a delimited column header pairing an email/phone/contact ID column with opt-out, suppression, unsubscribe, DNC, reason or channel columns) plus suppression evidence (Spam Act, Do Not Call Register, hard bounce, spam complaint, withdrawn consent, unsubscribe, opt-out, deceased, vulnerable customer, do not market). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: >-
  (?i)\b(?:(?:marketing\s+)?suppression\s+lists?|do[\s-]+not[\s-]+(?:contact|mail|call|email)\s+(?:lists?|flags?)|marketing\s+exclusion\s+lists?|(?:email|sms)\s+suppressions?|opt[\s-]?out\s+lists?|unsubscribe\s+lists?)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated contact data (email, phone, labelled opt-out/suppression values) beside the suppression-list phrase; Spam Act guidance and unsubscribe policies stay at 65, as do header-only upload files. 'Spam Act', 'direct marketing' and 'Do Not Call Register' moved from the primary to 85 evidence. Medium because marketing send lists near the phrase can also carry emails.
jurisdictions:
  - global
regulations:
  - Spam Act 2003 (Cth)
  - Do Not Call Register Act 2006 (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - Spam Act
    - Do Not Call Register
    - hard bounce
    - spam complaint
    - withdrawn consent
    - unsubscribe
    - opt-out
    - deceased
    - vulnerable customer
    - do not market
  proximity: 300
  keyword_lists:
    - data-record-context
test_cases:
  should_match:
    - value: "Marketing suppression list - export 12/09/2026\nemail,mobile,suppression_reason,opt_out_date\navery.teston@mailbox.com.au,0412 345 678,unsubscribe,2026-08-02\njordan.w@harbourmail.net,0423 555 019,deceased,2026-08-15\nDo Not Call Register wash completed; hard bounce addresses added."
      description: Suppression export - header, emails, phones and suppression evidence (85)
      synthetic: true
    - value: "Do not contact list addition\nOpt-out date: 12/09/2026\nRequested through the app."
      description: Single labelled opt-out date (75)
      synthetic: true
  should_not_match:
    - value: "Policy guidance: add every unsubscribe request to the suppression list within 5 business days, as the Spam Act requires, and wash call lists against the Do Not Call Register."
      description: Compliance guidance
      synthetic: true
    - value: "Suppression list upload\nemail,mobile,suppression_reason,opt_out_date\n"
      description: Blank upload file - column header only (65)
      synthetic: true
    - value: "The retailer was fined after emailing people on its suppression list, the regulator said in a media release."
      description: Media release
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing marketing suppression.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of marketing suppression.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_marketing_suppression
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_372_marketing_suppression_lists_column_header
            - Regex_global_top500_372_marketing_suppression_lists_labelled_value
            - Regex_global_top500_372_marketing_suppression_lists_email
            - Regex_global_top500_372_marketing_suppression_lists_phone
        - ref: Keyword_global_top500_372_marketing_suppression_lists_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_372_marketing_suppression_lists_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_marketing_suppression
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_372_marketing_suppression_lists_labelled_value
            - Regex_global_top500_372_marketing_suppression_lists_email
            - Regex_global_top500_372_marketing_suppression_lists_phone
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_372_marketing_suppression_lists_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_marketing_suppression
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_marketing_suppression
      pattern: (?i)\b(?:(?:marketing\s+)?suppression\s+lists?|do[\s-]+not[\s-]+(?:contact|mail|call|email)\s+(?:lists?|flags?)|marketing\s+exclusion\s+lists?|(?:email|sms)\s+suppressions?|opt[\s-]?out\s+lists?|unsubscribe\s+lists?)\b
    - id: Regex_global_top500_372_marketing_suppression_lists_column_header
      pattern: (?i)\b(?:(?:customer|contact|member|subscriber)[ _]?(?:id|no|number)|e-?mail(?:[ _]?address)?|mobile|phone|msisdn\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:opt[ _]?out(?:[ _]?(?:date|reason|channel))?|suppress(?:ed|ion)(?:[ _]?(?:date|reason|source))?|unsubscribed?(?:[ _]?date)?|dnc(?:[ _]?(?:flag|date))?|reason|channel)|(?:opt[ _]?out(?:[ _]?(?:date|reason|channel))?|suppress(?:ed|ion)(?:[ _]?(?:date|reason|source))?|unsubscribed?(?:[ _]?date)?|dnc(?:[ _]?(?:flag|date))?|reason|channel)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:customer|contact|member|subscriber)[ _]?(?:id|no|number)|e-?mail(?:[ _]?address)?|mobile|phone|msisdn)\b
    - id: Regex_global_top500_372_marketing_suppression_lists_labelled_value
      pattern: (?i)\b(?:opt[\s-]?out\s+date|unsubscribe(?:d)?\s+date|suppression\s+(?:reason|date|source)|suppressed\s+(?:on|date))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
    - id: Regex_global_top500_372_marketing_suppression_lists_email
      pattern: (?i)\b[A-Z0-9._%+-]{1,64}@[A-Z0-9-]{1,63}(?:\.[A-Z0-9-]{1,63}){0,4}\.[A-Z]{2,24}\b
    - id: Regex_global_top500_372_marketing_suppression_lists_phone
      pattern: (?:\+61[ \t]?|\b0)4\d{2}[ \t]?\d{3}[ \t]?\d{3}\b|(?:\+61[ \t]?|\b0)[2378][ \t]?\d{4}[ \t]?\d{4}\b
  keywords:
    - id: Keyword_global_top500_372_marketing_suppression_lists_domain_evidence
      groups:
        - match_style: word
          terms:
            - Spam Act
            - Do Not Call Register
            - hard bounce
            - spam complaint
            - withdrawn consent
            - unsubscribe
            - opt-out
            - deceased
            - vulnerable customer
            - do not market
      strength: domain
    - id: Keyword_global_top500_372_marketing_suppression_lists_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - within 5 business days
      strength: noise
risk_description: >-
  This regex targets suppression lists, do-not-contact, opt-out, and Do Not Call language, with the intended unit being a person-linked list of communication preferences rather than public compliance guidance. A true list can expose customer identities, contact channels, complaint or consent status, and sometimes sensitive reasons for exclusion, enabling unwanted targeting, privacy violations, social engineering, or deliberate circumvention of lawful preferences across the listed population. The medium-confidence concept rule may also find policy, training, and regulatory material without customer rows. Risk 8 and SENSITIVE Personal-Privacy reflect serious consent and aggregate privacy harm; PROTECTED would require protected persons, safety-related suppression, or population-scale misuse capable of significant damage. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs a populated email address, Australian phone number or labelled opt-out/suppression value and 85 needs two distinct structures (header counts only toward 85) plus suppression evidence. Removed the self-corroborating evidence group and data-record-context import; moved legal references (Spam Act, Do Not Call Register, direct marketing) out of the primary. Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA, My Health Records Act and TIA Act; added Spam Act 2003 (Cth) and Do Not Call Register Act 2006 (Cth); replaced the broken legislation link C2003A00129 with the verified Spam Act link C2004A01214.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 959 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
