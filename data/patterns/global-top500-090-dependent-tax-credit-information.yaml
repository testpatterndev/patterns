schema: testpattern/v1
name: Dependent tax credit information
slug: global-top500-090-dependent-tax-credit-information
version: 1.5.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects dependant-related tax credit and family benefit claims for an identified person: Family Tax Benefit claims, dependant (invalid and carer) tax offset claims, US child tax credit / Schedule 8812, with dependant names or dates of birth, number of children or claimed amounts.
operation: >-
  Primary: a dependant tax credit phrase (dependent tax credit, dependant (invalid and carer) tax offset, Family Tax Benefit Part A/B, child tax credit, Schedule 8812, credit for other dependents, dependent care credit). Generic "tax offset", "zone tax offset", "carer allowance" and "child dependent" were removed. 75 tier requires a populated person field (taxpayer/claimant/customer/recipient/applicant name, CRN, employee name or ID) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated dependant detail (dependant/child name, date of birth or age, number of dependants/children, or a claimed offset/credit/benefit amount) and an independent corroborative term (Services Australia, Centrelink, adjusted taxable income, income estimate, care percentage, tax return). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:dependent\s+tax\s+credits?|dependant\s+\(invalid\s+and\s+carer\)\s+tax\s+offset|invalid\s+and\s+invalid\s+carer\s+tax\s+offset|family\s+tax\s+benefit(?:\s+Part\s+[AB])?|FTB\s+Part\s+[AB]|child\s+tax\s+credits?|Schedule\s+8812|credit\s+for\s+other\s+dependents|dependent\s+care\s+credit)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - global
regulations:
  - A New Tax System (Family Assistance) Act 1999 (Cth)
  - Taxation Administration Act 1953 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - pii
corroborative_evidence:
  keywords:
    - Services Australia
    - Centrelink
    - adjusted taxable income
    - income estimate
    - care percentage
    - shared care
    - tax return
    - Form 1040
  proximity: 300
test_cases:
  should_match:
    - value: "Family Tax Benefit Part A claim\nClaimant name: Avery Teston\nCRN: 204718332K\nChild 1 name: Sam Teston\nChild 1 date of birth: 12/05/2019\nAdjusted taxable income estimate: $92,000\nCare percentage: 100%"
      description: "85: FTB claim with claimant, CRN, child name/DOB and income estimate"
      synthetic: true
    - value: "Schedule 8812 Credits for Qualifying Children and Other Dependents\nTaxpayer: Morgan Teston\nNumber of qualifying children: 2\nChild tax credit claimed: $4,000.00\nAttach to Form 1040."
      description: "85: Schedule 8812 with taxpayer, number of children and credit claimed"
      synthetic: true
    - value: "Dependant (invalid and carer) tax offset\nTaxpayer name: Jordan Staffson\nSupporting documents to follow with the tax return."
      description: "75: dependant tax offset naming the taxpayer, no dependant detail"
      synthetic: true
    - value: "Family Tax Benefit"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "Family Tax Benefit is a payment that helps with the cost of raising children. This fact sheet explains who can get it and how to claim."
      description: "Services Australia-style guidance - must stay at or below 65"
    - value: "Family Tax Benefit claim\nClaimant name: __________\nChild 1 name: __________\nChild 1 date of birth: __/__/____"
      description: "Blank claim form - must stay at or below 65"
    - value: "Changes to the child tax credit will affect millions of families, according to a news release."
      description: "News - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Tax return worksheets for the taxpayer's own records."
    mitigation: "These are genuine personal records; 85 requires dependant detail plus corroboration."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_090_dependent_tax_credit_information_primary
      matches:
        - ref: Regex_top500_090_dependent_tax_credit_information_person_field
        - ref: Regex_top500_090_dependent_tax_credit_information_dependant_detail
        - ref: Keyword_top500_090_dependent_tax_credit_information_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_090_dependent_tax_credit_information_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_090_dependent_tax_credit_information_primary
      matches:
        - ref: Regex_top500_090_dependent_tax_credit_information_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_090_dependent_tax_credit_information_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_090_dependent_tax_credit_information_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_090_dependent_tax_credit_information_primary
      pattern: >-
        (?i)\b(?:dependent\s+tax\s+credits?|dependant\s+\(invalid\s+and\s+carer\)\s+tax\s+offset|invalid\s+and\s+invalid\s+carer\s+tax\s+offset|family\s+tax\s+benefit(?:\s+Part\s+[AB])?|FTB\s+Part\s+[AB]|child\s+tax\s+credits?|Schedule\s+8812|credit\s+for\s+other\s+dependents|dependent\s+care\s+credit)\b
    - id: Regex_top500_090_dependent_tax_credit_information_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?|(?:taxpayer|claimant|customer|recipient|primary\s+carer|applicant)(?:\s+name)?|customer\s+reference\s+number|CRN)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_090_dependent_tax_credit_information_dependant_detail
      pattern: >-
        (?i)\b(?:dependant|dependent|child)(?:'s)?(?:[ \t]\d)?\s+(?:name|full\s+name|date\s+of\s+birth|DOB|age)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}|\bnumber\s+of\s+(?:qualifying\s+)?(?:dependants|dependents|children)[ \t]{0,3}[:\-][ \t]{0,3}\d{1,2}\b|\b(?:(?:offset|credit|benefit|FTB)\s+(?:amount|claimed|rate|entitlement)|child\s+tax\s+credit(?:\s+claimed)?|family\s+tax\s+benefit\s+(?:amount|paid))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?
  keywords:
    - id: Keyword_top500_090_dependent_tax_credit_information_corroborative
      groups:
        - match_style: word
          terms:
            - Services Australia
            - Centrelink
            - adjusted taxable income
            - income estimate
            - care percentage
            - shared care
            - tax return
            - Form 1040
      strength: specific
    - id: Keyword_top500_090_dependent_tax_credit_information_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - who can get
            - you may be eligible
            - you can claim
            - how to claim
            - payment rates
      strength: domain
risk_description: >-
  The classifier identifies dependant tax credit or family benefit claims for an identified claimant (75) with dependant names, dates of birth, counts or amounts (85). These reveal family composition, children's details, income and carer status. Guidance, blank forms and news stay at 65. Risk 4 supports OFFICIAL; records with children's details should be handled as SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, and the OFFICIAL DLM because the detector establishes a
    dependent-tax-credit topic but not a usable claim or identity record. SENSITIVE is not met by the normal true
    positive without claimant identity, income, entitlement, or payment data.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic classification and Low DLM are appropriate for contextual tax-credit terminology whose harm depends on
      correlation with a completed household or tax record.
references:
  - title: "Services Australia - Family Tax Benefit"
    url: https://www.servicesaustralia.gov.au/family-tax-benefit
  - title: "Taxation Administration Act 1953 (Cth)"
    url: https://www.legislation.gov.au/C1953A00001/latest/text
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
