schema: testpattern/v1
name: Queensland Council CEO and Senior Executive Register of Interests
slug: au-qld-council-senior-executive-interest-register
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Register of interests entries and lodgement forms for a Queensland local government's chief executive officer, senior executive employees, councillor advisors and persons related to them (spouse or dependent), kept under Local Government Regulation 2012 (Qld) ss 289-291 and schedule 5 (shareholdings and controlling interests, executive officer roles, trusts, self managed superannuation funds, land, liabilities, gifts, sponsored travel and other particulars). Unlike a councillor's register, which may be inspected by the public (s 293(1)) and is published as an extract (s 295), these registers are open only to councillors, the CEO and persons permitted by law (s 293(2)-(3)); access must be applied for in writing and logged (s 294), and disclosure outside those persons is an offence (s 297(2)). The public councillor register, its published extracts and councillor declarations in minutes are decoys.
operation: >-
  Primary: a register of interests phrase (register/registers of interests, interests register, register of financial interests, statement of interests). 75 tier requires, within 300 characters, BOTH a restricted-role field (position/role/designation/category/register type/capacity/relevant person/relationship label whose value is chief executive officer, CEO, deputy CEO, senior executive employee, senior executive, general manager, executive director, director, councillor advisor, spouse, dependent, related person or person related to) AND a populated schedule 5 interest field (shareholding, corporation, company, trust, self managed superannuation fund, real property, land, liabilities, gifts, sponsored travel, hospitality, investments, executive officer, directorships, memberships, donations, other income, financial institution, debts, partnerships followed by a non-placeholder value; nil/none values do not count). 85 tier requires the role field, two distinct interest fields (min_count 2, unique results) AND an independent corroborative term (section 290/291/294/297, schedule 5, related person, spouse, dependent, mayor, restricted, confidential, access log). All enforce tiers AND NOT the shared template-exclusion dictionary and a public-register/guidance exclusion (councillor register of interests, register of interests of a councillor, register of councillor interests, extract of the register, published extract, may be inspected by the public, fact sheet, guideline, frequently asked questions). 65 is discovery-only (primary phrase alone) and will surface councillor registers, guidance and legislation.
pattern: >-
  (?i)\b(?:registers?\s+of\s+(?:financial\s+)?interests|interests?\s+registers?|statements?\s+of\s+interests)\b
confidence: medium
confidence_justification: >-
  Medium: "register of interests" is shared by the public councillor register, state parliament registers and guidance, so enforce tiers need a restricted-role value (CEO, senior executive employee, councillor advisor or related person) and populated schedule 5 interest fields. The approved form layouts vary by council and were not verified, so field labels follow schedule 5 particulars. A councillor's spouse register (restricted under s 293(2)(d)) that is labelled only with councillor wording can fall to 65. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Local Government Regulation 2012 (Qld)
  - Local Government Act 2009 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - financial
  - employment
  - government
corroborative_evidence:
  keywords:
    - section 294
    - section 297
    - schedule 5
    - related person
    - spouse
    - dependent
    - mayor
    - restricted
    - confidential
  proximity: 300
test_cases:
  should_match:
    - value: "Register of interests - senior executive employee (Local Government Regulation 2012, s 291 and schedule 5)\nName: Jordan Staffson\nPosition: Senior Executive Employee - Director Infrastructure Services\nShareholdings: Testco Civil Pty Ltd (controlling interest, earthmoving contractor)\nReal property: residential land at Carrow Heights; investment unit in Toowong\nLiabilities: mortgage with Harbour Mutual Bank\nGifts: 2 tickets to State of Origin from Riverbend Quarries\nRestricted register - access only under section 294; related person register for spouse attached."
      description: High tier (85) - senior executive role, several schedule 5 interest fields and s 294 context
      synthetic: true
    - value: "Chief Executive Officer register of interests (maintained by the Mayor)\nRelevant person: Chief Executive Officer\nExecutive officer of: Carrow Regional Water Alliance Ltd, non-executive director\nSelf managed superannuation fund: Teston Family Super Fund - residential property in Mackay\nSponsored travel: LGAQ conference Cairns, flights paid by Testvale Consulting"
      description: High tier (85) - CEO register with three interest fields and mayor context
      synthetic: true
    - value: "Update to register of interests\nRelationship: spouse of senior executive employee\nTrust: Riverbend Family Trust - beneficiary, holds shares in a local civil contractor"
      description: Medium tier (75) - related person role and one populated trust interest
      synthetic: true
    - value: "Interests register lodgement - Role: Councillor Advisor\nGifts: hamper from Harbour Developments valued above the threshold"
      description: Medium tier (75) - councillor advisor role with a populated gift interest
      synthetic: true
    - value: Reminder that the senior executive team must update the register of interests by 30 September.
      description: Discovery tier (65) - primary phrase only
      synthetic: true
  should_not_match:
    - value: "293 Who may inspect a register of interests (1) A register of interests of a councillor may be inspected by the public. (2) Subsection (3) applies to a register of interests of (a) a chief executive officer; or (b) a councillor advisor; or (c) a senior executive employee; or (d) a person who is related to a councillor, chief executive officer, councillor advisor or senior executive employee."
      description: Legislation text (65 only)
    - value: "Councillor register of interests - published extract\nName: Cr Riley Teston\nPosition: Councillor, Division 3\nShareholdings: Testco Energy Ltd\nReal property: rental property in Toowong\nGifts: nil"
      description: Public councillor register extract (public-register exclusion)
    - value: "Register of interests of a councillor. Name: Cr Alex Staffson. Position: Deputy Mayor. Shareholdings: Carrow Credit Union members' shares. Liabilities: home loan with Harbour Mutual Bank."
      description: Councillor register without an extract heading (no restricted role)
    - value: "Register of interests - senior executive employee - blank template\nName: ______\nPosition: Senior Executive Employee\nShareholdings: ______\nReal property: ______\nGifts: ______"
      description: Blank form (template wording and placeholders)
    - value: "Registers of interests guideline: the chief executive officer and senior executive employees must record shareholdings, trusts, land and gifts in the approved form within 30 days."
      description: Department guidance (65 only)
    - value: "The mayor told reporters the CEO's register of interests was up to date and that no conflicts had been identified with the quarry contract."
      description: News framing (65 only)
false_positives:
  - description: Published councillor registers of interests and their website extracts carry the same schedule 5 particulars.
    mitigation: Enforce tiers need a restricted-role value (CEO, senior executive employee, councillor advisor, spouse or related person); councillor and deputy mayor roles do not qualify, and a public-register exclusion suppresses extract and "councillor register" wording.
  - description: Queensland Parliament and state public sector registers of interests, and employee conflict of interest declarations.
    mitigation: State registers name members or chief executives of departments and can reach 75 when a CEO role and interest fields appear together; employee COI declarations are covered by au-conflict-of-interest-declaration.
  - description: Legislation, guidelines and blank approved forms.
    mitigation: Placeholders and nil/none values are rejected and guidance wording is excluded.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_council_senior_executive_interest_register_primary
      matches:
        - ref: Regex_au_qld_council_senior_executive_interest_register_role_field
        - ref: Regex_au_qld_council_senior_executive_interest_register_interest_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_council_senior_executive_interest_register_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_council_senior_executive_interest_register_public_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_council_senior_executive_interest_register_primary
      matches:
        - ref: Regex_au_qld_council_senior_executive_interest_register_role_field
        - ref: Regex_au_qld_council_senior_executive_interest_register_interest_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_council_senior_executive_interest_register_public_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_council_senior_executive_interest_register_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_council_senior_executive_interest_register_primary
      pattern: >-
        (?i)\b(?:registers?\s+of\s+(?:financial\s+)?interests|interests?\s+registers?|statements?\s+of\s+interests)\b
    - id: Regex_au_qld_council_senior_executive_interest_register_role_field
      pattern: >-
        (?i)\b(?:position(?:\s+title)?|role|designation|category|register\s+type|capacity|relevant\s+person(?:\s+type)?|type\s+of\s+(?:relevant\s+)?person|relationship(?:\s+to\s+(?:the\s+)?(?:officer|employee|relevant\s+person))?)\s*[:#]\s*(?:the\s+|a\s+)?(?:chief\s+executive\s+officer|CEO|deputy\s+(?:chief\s+executive\s+officer|CEO)|senior\s+executive(?:\s+employee)?|general\s+manager|executive\s+director|director|councillor\s+advisor|spouse|dependent|dependant|related\s+person|person\s+related\s+to)\b
    - id: Regex_au_qld_council_senior_executive_interest_register_interest_field
      pattern: >-
        (?i)\b(?:shareholdings?|shares\s+held|controlling\s+interests?|corporations?|compan(?:y|ies)|trusts?|self[\s-]+managed\s+superannuation\s+fund|real\s+property|land(?:\s+held)?|property\s+interests?|liabilit(?:y|ies)|gifts?(?:\s+received)?|sponsored\s+travel(?:\s+(?:or|and)\s+accommodation)?|hospitality|investments?|executive\s+officer\s+of|directorships?|memberships?|donations?|other\s+(?:assets|income|sources\s+of\s+income)|financial\s+institutions?|savings\s+or\s+investment\s+accounts?|debts?\s+owed|partnerships?)(?:\s*\([^)]{1,30}\))?\s*[:#]\s*(?!(?:n/?a|nil|none|not\s+applicable|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9&'.,/-]{1,40}(?:[ \t]+[A-Za-z0-9&'.,/()-]{1,30}){0,8}
  keywords:
    - id: Keyword_au_qld_council_senior_executive_interest_register_corroborative
      groups:
        - match_style: word
          terms:
            - section 290
            - section 291
            - section 294
            - section 297
            - s 294
            - s 297
            - schedule 5
            - related person
            - spouse
            - dependent
            - mayor
            - restricted
            - confidential
            - access log
      strength: specific
    - id: Keyword_au_qld_council_senior_executive_interest_register_public_exclusion
      groups:
        - match_style: word
          terms:
            - councillor register of interests
            - register of interests of a councillor
            - register of interests of councillors
            - register of councillor interests
            - councillors' registers of interests
            - extract of the register
            - published extract
            - may be inspected by the public
            - fact sheet
            - guideline
            - frequently asked questions
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier identifies a council CEO, senior executive employee, councillor advisor or related-person register of interests entry: the officer's and family members' shareholdings, trusts, superannuation fund holdings, land, liabilities, gifts and sponsored travel. The Regulation restricts inspection to councillors, the CEO and persons permitted by law, requires written access applications and makes disclosure outside those persons an offence (LGR s 297(2)), because the entries expose personal and family financial affairs and can be used for targeting, pressure or reputational harm. Public councillor registers, legislation, guidance and blank forms are excluded from enforce tiers. Risk 7 supports OFFICIAL: Sensitive / SENSITIVE Personal-Privacy.
