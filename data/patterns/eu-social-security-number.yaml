schema: testpattern/v1
name: EU Social Security Number (SSN) or Equivalent ID
slug: eu-social-security-number
version: 1.5.0
type: regex
pattern_class: concept
engine: universal
description: >-
  Detects references to EU Social Security Number (SSN) or Equivalent ID using keyword matching. This pattern is based on a Microsoft Purview built-in sensitive information type. Users already running
  Purview may prefer to enable the built-in SIT directly, or use this version as a starting point for customisation.
operation: >-
  Reference: https://learn.microsoft.com/en-us/purview/sit-defn-eu-social-security-number-equivalent-identification Keyword-based detection for EU-wide keyword-based detection for social security
  number references across member states. Keyword lists: pii-civic-credentials. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
confidence: medium
confidence_justification: >-
  Medium confidence: pattern has structural constraints but corroborative keywords are recommended to reduce false positive rates. Added context gating and exclusion rules improve precision and reduce
  incidental matches.
jurisdictions:
  - eu
regulations:
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - government-id
corroborative_evidence:
  keywords:
    - social security
    - SSN
    - sozialversicherung
    - sécurité sociale
    - previdenza sociale
  proximity: 300
  keyword_lists:
    - pii-civic-credentials
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: social security number
      description: English keyword match
    - value: sozialversicherungsnummer
      description: German keyword match
    - value: numéro de sécurité sociale
      description: French keyword match
    - value: "Sozialversicherungsnummer: 65170839J003"
      description: Populated ID-number field (75 tier)
      synthetic: true
    - value: |-
        Sozialversicherungsnummer: 65170839J003
        Name: Avery Teston
      description: Populated ID-number field with a person field (85 tier)
      synthetic: true
  should_not_match:
    - value: employee benefits plan
      description: Non-SSN reference
    - value: insurance policy number
      description: Generic insurance reference
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
    - value: EU Social Security Number (SSN) or Equivalent ID
      description: "Bare detector name: it reached 75 through the generated name-word tier and must not reach an enforcing tier"
    - value: "Insurance number: POL-4471820"
      description: A bare "insurance number" field (an insurance policy) is not a social security number; it was a context term and is not a populated-label primary
    - value: |-
        Sozialversicherungsnummer:
        Name: Avery Teston
      description: "Person record with the ID label but no value: the label must not corroborate itself (discovery only)"
    - value: "Policy guidance: this procedure explains how records about social security number are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Broad keyword matching across EU languages may match general policy discussion, training materials, or compliance documentation.
    mitigation: Layer with additional contextual signals such as structured identifiers or form fields to distinguish actual data from policy references.
  - description: In multiple languages, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_eu_social_security_number_populated_label
      matches:
        - ref: Regex_eu_social_security_number_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_eu_social_security_number_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Keyword_eu_ssn_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  keywords:
    - id: Keyword_eu_ssn_primary
      groups:
        - match_style: word
          terms:
            - social security
            - text: SSN
              case_sensitive: true
            - sozialversicherung
            - sécurité sociale
            - previdenza sociale
            - seguridad social
            - sociale zekerheid
            - socialförsäkring
            - sosiaaliturva
            - segurança social
            - social insurance
            - national insurance
      strength: specific
  regexes:
    - id: Regex_eu_social_security_number_populated_label
      pattern: (?i)\b((?:social\s+security(?:\s+(?:no\.?|number))?|SSN|sozialversicherung(?:snummer)?|SV-?Nummer|(?:num[ée]ro\s+de\s+)?s[ée]curit[ée]\s+sociale|(?:numero\s+di\s+)?previdenza\s+sociale|(?:n[úu]mero\s+de\s+)?seguridad\s+social|sociale\s+zekerheid|burgerservicenummer|BSN|socialf[öo]rs[äa]kring|personnummer|sosiaaliturva|henkil[öo]tunnus|seguran[çc]a\s+social|NISS|social\s+insurance(?:\s+(?:no\.?|number))?|national\s+insurance(?:\s+(?:no\.?|number))?)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
    - id: Regex_eu_social_security_number_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
risk_rating: 3
risk_description: >-
  This EU-wide detector matches multilingual phrases such as social security number, Sozialversicherungsnummer, or numéro de sécurité sociale rather than validating any member state's identifier value. A hit can indicate that a form, policy, or workflow discusses collection of social-security identifiers, but it does not expose a person's number on its own. The affected party and scale are therefore usually indeterminate, and policy, training, and blank-template text are documented false-positive contexts. Risk 3 and OFFICIAL fit the low topic-level signal; a structured national identifier or populated benefits record would be assessed separately and could raise the context toward SENSITIVE.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 3 maps to PSPF OFFICIAL, QGISCF OFFICIAL, DLM OFFICIAL, and a Low tier because the detector establishes
    terminology, not personal reference data. SENSITIVE is not met without an actual identifier, named holder,
    entitlement information, or populated administrative record.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low and Low DLM accurately describe a multilingual topic indicator with little inherent confidentiality. Any
      higher treatment must come from a co-detected national number or substantive benefits, employment, health, or
      identity content.
references:
  - url: https://learn.microsoft.com/en-us/purview/sit-defn-eu-social-security-number-equivalent-identification
    title: EU Social Security Number (SSN) or Equivalent ID entity definition - Microsoft Learn
created: '2026-02-09'
updated: '2026-10-30'
changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-20'
    description: 'Generated name-word tier removed: the 75 tier ANDed Pattern_*_label_context (the detector name, "EU Social Security Number (SSN) or Equivalent ID") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 75. Both lists sit inside the IdMatch phrase, so the bare name alone scored 75. Re-tiered in the #69 attribute shape: 65 is the phrase alone (discovery only); 75 needs the ID label followed by a value (Regex_eu_social_security_number_populated_label, now the enforcing primary); 85 adds a populated person field (Regex_eu_social_security_number_record_structure). Curated terms that sit inside an IdMatch hit were removed. The context list held the primary''s own phrases ("social security number", "insurance number") and national names for the same number (BSN, personnummer, NISS), so "social security number" alone reached 75. The national names are now labels in the populated-field regex. Added the bare name, a person record with the ID label but no value and a policy-guidance text as should_not_match, and populated ID fields reaching 75 and 85.'
  - version: 1.3.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1193 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
