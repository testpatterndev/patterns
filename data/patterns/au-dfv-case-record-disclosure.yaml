schema: testpattern/v1
name: Domestic and Family Violence Disclosure in Case Record
slug: au-dfv-case-record-disclosure
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects client, tenant, patient or customer case records that record a disclosure of domestic
  and family violence (DFV): case notes, intake assessments, service referrals and payment
  applications that name or number an individual and state that they have disclosed,
  experienced, fled or are at risk of DFV, coercive control or intimate partner violence.
  Sector-neutral: the same shape appears in housing, human services, health, education,
  justice and Commonwealth support records (Leaving Violence Program, the legacy Escaping Violence Payment, and Crisis Payment for extreme circumstances family and domestic violence).
  Also covers information-sharing requests and disclosures under Part 5A of the Domestic and
  Family Violence Protection Act 2012 (Qld) - s 169D (assessing a domestic violence threat),
  s 169E (responding to a serious domestic violence threat) and s 169F (police referral to a
  specialist DFV service provider) - made or received by prescribed entities (for example state
  schools, Hospital and Health Services, housing, corrections and police) and specialist DFV
  service providers, when the record names the requesting or disclosing entity, the person at
  risk or the person using violence, the information shared, the reason and the date. The
  Department of Education's Part 5A Instrument of Authorisation, which quotes s 169D verbatim,
  and the DFV Information Sharing Guidelines are decoys.
operation: >-
  Primary: a DFV disclosure statement regex (disclosed / reported / experiencing / fleeing /
  escaping / at risk of, followed within three words by domestic or family violence, DFV, FDV,
  intimate partner violence, coercive control or non-fatal strangulation) or a Leaving
  Violence Program / Escaping Violence Payment / FDV Crisis Payment reference. 75 tier requires a populated case-record field (client, tenant,
  patient, customer or participant name/ID, case/file/reference number, or date of birth with
  a non-placeholder value) within 300 characters. 85 tier additionally requires two distinct
  DFV response terms (safety plan, referral, specialist service, protection order, party roles, refuge) that are independent of the disclosure phrase.
  Part 5A route: the primary also matches an information sharing request/disclosure/referral,
  a Part 5A request/disclosure/referral, a request/disclosure/referral under s 169D/E/F, a Part
  5A or s 169D/E/F citation of the DFVP Act, or "specialist DFV service provider". A second 75
  tier requires a populated Part 5A party field (requesting/disclosing/receiving/providing/
  referring entity, agency, organisation, service or officer with a value; person at risk, person
  using violence, aggrieved, respondent or victim-survivor with a two-word name) or a populated
  Part 5A detail field (information shared/disclosed/requested/provided with a value; date of
  request/disclosure/referral; risk level or reason for sharing/disclosure with a value; or a
  consent status). A second 85 tier requires a party field AND a detail field plus an
  independent Part 5A evidence term (serious
  threat, consent not obtained, without consent, reasonably believes, risk assessment, Level 2,
  CRASF, High Risk Team, safety plan, QPRIME, occurrence number). All enforce tiers exclude
  template/fixture text and Part 5A instrument/guidance text (Instrument of Authorisation,
  Column 4, Table of Authorised Officers, Domestic and Family Violence Information Sharing
  Guidelines, Example for paragraph). 65 is discovery-only (disclosure statement or Part 5A
  anchor alone), which will also surface policy, legislation and guidance text.
pattern: >-
  (?i)\b(?:disclos(?:ed|es|ing|ure\s+of)|report(?:ed|s|ing)|experienc(?:ed|es|ing)|fle(?:e|es|eing|d)|escap(?:ed|es|ing)|subjected\s+to|history\s+of|victim\s+of|at\s+risk\s+of)\s+(?:[a-z]{1,20}\s{1,5}){0,3}?(?:domestic\s+(?:and\s+family\s+)?violence|family\s+(?:and\s+domestic\s+)?violence|DFV|FDV|intimate\s+partner\s+violence|coercive\s+control|non-fatal\s+strangulation)\b|\bCONFIDENTIAL:\s+Domestic\s+and\s+family\s+violence\s+information\b|\b(?:Leaving\s+Violence\s+Program|Escaping\s+Violence\s+Payment|Crisis\s+Payment\s+for\s+extreme\s+circumstances\s+family\s+and\s+domestic\s+violence)\b|\b(?:(?:DFV\s+)?information[\s-]+sharing\s+(?:request|disclosure|referral)|Part\s+5A\s+(?:request|disclosure|referral)|(?:request|disclosure|referral)\s+under\s+(?:s(?:ection)?\.?\s*)?169[DEF]|(?:Part\s+5A|s(?:ection)?\.?\s*169[DEF])\s+(?:of\s+the\s+)?(?:DFVP\s+Act|Domestic\s+and\s+Family\s+Violence\s+Protection\s+Act)|specialist\s+DFV\s+service\s+provider)\b
confidence: medium
confidence_justification: >-
  Medium: the disclosure phrase is common in policy, training and service guidance, so enforce
  tiers depend on a populated case-record field to distinguish an individual's record from
  general text. Free-text case notes without any structured identifier fall to the
  discovery-only tier. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - DFV Protection Act 2012 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government
corroborative_evidence:
  keywords:
    - coercive control
    - victim-survivor
    - person using violence
    - safety plan
    - protection order
    - refuge
    - DVConnect
    - 1800RESPECT
  proximity: 300
  keyword_lists:
    - au-dfv-terminology
test_cases:
  should_match:
    - value: 'Case note 12/08/2026. Client name: Avery Teston. Client ID: C4417820. Client disclosed domestic and family violence from former partner Jordan Teston, including coercive control and non-fatal strangulation in July. Safety plan completed; referral made to DVConnect.'
      description: Case note with client identifiers and a DFV disclosure
      synthetic: true
    - value: 'Customer reference: 204889137K. Customer is fleeing family violence with two children and has applied to the Leaving Violence Program. Victim-survivor is staying with a relative; person using violence remains at the former address.'
      description: Payment record for a customer fleeing family violence
      synthetic: true
    - value: 'Patient ID: MRN0048213. Date of birth: 04/02/1991. Patient reported experiencing intimate partner violence over 18 months. Safety plan provided; referred to specialist DFV service with consent.'
      description: Health intake note recording an intimate partner violence disclosure
      synthetic: true
    - value: "Tenant name: Morgan Teston\nFile number: HF-2026-00817\nNotes: tenant disclosed\ndomestic violence and requested a transfer. Protection order in place; referred to DVConnect."
      description: Case record where the disclosure wraps across a line break (PDF extraction)
      synthetic: true
    - value: "Part 5A information sharing request - DFVP Act s 169D\nRequesting entity: Metro South Hospital and Health Service\nDisclosing entity: Rivergum State School\nPerson at risk: Avery Teston\nPerson using violence: Jordan Teston\nInformation shared: attendance records and collection arrangements\nDate of disclosure: 14/09/2026\nConsent not obtained - serious threat to the person's life, health or safety. Level 2 risk assessment completed."
      description: School disclosure to a Hospital and Health Service under s 169D with parties, information and date (Part 5A 85 tier)
      synthetic: true
    - value: "Information sharing disclosure (s 169E)\nReceiving entity: Queensland Police Service\nRespondent: Jordan Teston\nDate of disclosure: 21/08/2026\nReason for sharing: respondent released from custody and knows the new address. Consent not obtained."
      description: Section 169E disclosure to police with the respondent, date and reason (Part 5A 85 tier)
      synthetic: true
    - value: "Referral under s 169F to specialist DFV service provider\nPerson at risk: Casey Teston\nContact attempted by phone; no answer."
      description: Police referral received by a specialist DFV service provider with a named person at risk (Part 5A 75 tier)
      synthetic: true
  should_not_match:
    - value: Where a client discloses domestic and family violence, staff must offer a referral to DVConnect and record the disclosure in the case file. Do not record the address of any refuge.
      description: Practice guidance describing how to handle a disclosure, with no individual record
    - value: "Client name: __________\nCase number: __________\nHas the client disclosed domestic violence?  [ ] Yes  [ ] No"
      description: Blank intake form
    - value: In 2024-25 the department recorded 4,812 households reporting family violence as a reason for seeking assistance, a 9% increase on the prior year.
      description: Aggregate statistics
    - value: 'Client name: Avery Teston. Client ID: C4417820. Client reported rent arrears of $1,240 and agreed to a repayment plan.'
      description: Ordinary case note without DFV content
    - value: "Instrument of Authorisation - Director-General's Powers under Part 5A of the Domestic and Family Violence Protection Act 2012. Schedule 1 - Table of Authorised Officers. s.169D Sharing information for assessing domestic violence threat. (1) A prescribed entity or specialist DFV service provider (each the holder) may give information to another prescribed entity or specialist DFV service provider if the holder reasonably believes (a) a person fears or is experiencing domestic violence. Authorised Officers (Column 4): Principal, Deputy Principal, Guidance Officer."
      description: Department of Education Part 5A Instrument of Authorisation quoting s 169D (critical decoy, 65 only)
    - value: "Information sharing request (Part 5A)\nRequesting entity: __________\nPerson at risk: __________\nPerson using violence: __________\nInformation requested: __________\nDate of request: ___/___/____"
      description: Blank Part 5A request form (65 only)
    - value: "Council is not a prescribed entity under s 169C of the Domestic and Family Violence Protection Act 2012 and cannot make an information sharing request, but staff may refer a resident to a specialist DFV service provider with consent."
      description: Council DFV policy describing Part 5A (65 only)
    - value: "Domestic and Family Violence Information Sharing Guidelines. A specialist DFV service provider receiving an information sharing request should record the requesting entity, the person at risk and the information shared. Requesting entity: Brisbane North HHS. Person at risk: Sam Sample."
      description: Information Sharing Guidelines with an illustrative record, suppressed by the guidance exclusion
false_positives:
  - description: Policies, practice guides and training that describe how to respond when someone discloses DFV.
    mitigation: Enforce tiers require a populated case-record field; guidance text has field labels without values or no labels at all.
  - description: Blank intake and assessment forms containing DFV screening questions.
    mitigation: Field values that are blank lines, square-bracket or angle-bracket placeholders, or n/a/tbc are rejected.
  - description: Case notes about a worker or third party rather than the client (for example a staff member's own disclosure in an HR file).
    mitigation: These are still sensitive DFV records; route to the same handling rather than suppress.
  - description: Part 5A legislation, the DoE Instrument of Authorisation, the DFV Information Sharing Guidelines, training and council policies quoting ss 169C-169F.
    mitigation: Part 5A enforce tiers need populated party, information, date or consent fields; guidance exclusion on Instrument of Authorisation, Column 4, Table of Authorised Officers, the Guidelines title and "Example for paragraph".
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_dfv_disclosure_statement
      matches:
        - ref: Regex_dfv_case_record_field
        - ref: Keyword_dfv_case_response
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_dfv_part5a_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_dfv_disclosure_statement
      matches:
        - ref: Regex_dfv_part5a_party
        - ref: Regex_dfv_part5a_detail
        - ref: Keyword_dfv_part5a_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_dfv_part5a_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_dfv_disclosure_statement
      matches:
        - ref: Regex_dfv_case_record_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_dfv_part5a_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_dfv_disclosure_statement
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_dfv_part5a_party
            - Regex_dfv_part5a_detail
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_dfv_part5a_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_dfv_disclosure_statement
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  keywords:
    - id: Keyword_dfv_case_response
      groups:
        - match_style: word
          terms:
            - safety plan
            - safety planning
            - risk assessment
            - referral made
            - DVConnect
            - 1800RESPECT
            - The Orange Door
            - specialist DFV service
            - specialist family violence service
            - protection order
            - intervention order
            - police protection notice
            - person using violence
            - victim-survivor
            - perpetrator
            - aggrieved
            - respondent
            - refuge
            - crisis accommodation
            - high risk team
            - safe contact
            - relocated
      strength: specific
    - id: Keyword_dfv_part5a_evidence
      groups:
        - match_style: word
          terms:
            - serious threat
            - consent not obtained
            - without consent
            - reasonably believes
            - risk assessment
            - Level 2
            - text: CRASF
              case_sensitive: true
            - High Risk Team
            - safety plan
            - text: QPRIME
              case_sensitive: true
            - occurrence number
      strength: specific
    - id: Keyword_dfv_part5a_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - Instrument of Authorisation
            - Column 4
            - Table of Authorised Officers
            - Domestic and Family Violence Information Sharing Guidelines
            - DFV Information Sharing Guidelines
            - Example for paragraph
      strength: specific
  regexes:
    - id: Regex_dfv_disclosure_statement
      pattern: >-
        (?i)\b(?:disclos(?:ed|es|ing|ure\s+of)|report(?:ed|s|ing)|experienc(?:ed|es|ing)|fle(?:e|es|eing|d)|escap(?:ed|es|ing)|subjected\s+to|history\s+of|victim\s+of|at\s+risk\s+of)\s+(?:[a-z]{1,20}\s{1,5}){0,3}?(?:domestic\s+(?:and\s+family\s+)?violence|family\s+(?:and\s+domestic\s+)?violence|DFV|FDV|intimate\s+partner\s+violence|coercive\s+control|non-fatal\s+strangulation)\b|\bCONFIDENTIAL:\s+Domestic\s+and\s+family\s+violence\s+information\b|\b(?:Leaving\s+Violence\s+Program|Escaping\s+Violence\s+Payment|Crisis\s+Payment\s+for\s+extreme\s+circumstances\s+family\s+and\s+domestic\s+violence)\b|\b(?:(?:DFV\s+)?information[\s-]+sharing\s+(?:request|disclosure|referral)|Part\s+5A\s+(?:request|disclosure|referral)|(?:request|disclosure|referral)\s+under\s+(?:s(?:ection)?\.?\s*)?169[DEF]|(?:Part\s+5A|s(?:ection)?\.?\s*169[DEF])\s+(?:of\s+the\s+)?(?:DFVP\s+Act|Domestic\s+and\s+Family\s+Violence\s+Protection\s+Act)|specialist\s+DFV\s+service\s+provider)\b
    - id: Regex_dfv_case_record_field
      pattern: >-
        (?i)\b(?:(?:client|tenant|applicant|customer|participant|patient|resident)\s+(?:name|ID|no\.?|number|reference)|(?:case|file|client|matter|customer|reference|ref)\s*(?:no\.?|number|ID|#)|customer\s+reference|CRN|MRN|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_dfv_part5a_party
      pattern: >-
        (?i)\b(?:(?:requesting|disclosing|receiving|providing|referring|holding)\s+(?:entity|agency|organisation|service|officer)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9'&.-]{1,40}|(?:person\s+at\s+risk|person\s+using\s+violence|aggrieved|respondent|victim-survivor)(?:\s+name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30})
    - id: Regex_dfv_part5a_detail
      pattern: >-
        (?i)\b(?:information\s+(?:shared|disclosed|requested|provided|given)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|nil|none)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9'-]{1,40}|(?:date\s+(?:of\s+)?(?:request|disclosure|referral)|(?:request|disclosure|referral)\s+date)\s*[:#]\s*\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|(?:risk\s+level|reason\s+for\s+(?:sharing|disclosure|request|referral))\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|the|a|an|any|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9'-]{1,40}|consent\s*[:#]\s*(?:not\s+(?:obtained|sought|given)|declined|withheld|obtained|given|yes|no)\b)
risk_rating: 8
risk_description: >-
  The detector identifies an individual's case record that records a disclosure of domestic and
  family violence. Such records reveal that a named or numbered person is a victim-survivor,
  often with the identity of the person using violence, children, current circumstances and
  support arrangements. Unauthorised disclosure can alert the person using violence, escalate
  risk, and expose highly personal information. Policy text, blank forms and statistics are
  excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy; records that also
  reveal a refuge or concealed address are covered by au-dfv-confidential-address at a higher
  rating.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Queensland Government — CRASF Level 1 routine screening tool
    url: https://www.publications.qld.gov.au/dataset/2dc310f9-4ba2-456e-a280-58df0e2a37ca/resource/e6de8c84-5c61-4e1c-887e-761ee411bdc5/download/common-risk-safety-framework-level-1-tool.pdf
  - title: Domestic and Family Violence Protection Act 2012 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2012-005
  - title: Domestic and Family Violence Protection Act 2012 (Qld) Part 5A information sharing, ss 169A-169O (current whole Act)
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-2012-005
  - title: Queensland Department of Education - Instrument of Authorisation, Director-General's Powers under Part 5A (decoy source)
    url: https://ppr.qed.qld.gov.au/delegation/part-5a-of-the-domestic-and-family-violence-protection-act-2012-director-general-authorisation.pdf
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.1.0
    date: '2026-09-24'
    description: >-
      Add DFVP Act 2012 (Qld) Part 5A information-sharing requests, disclosures and s 169F referrals (ss 169D-169F; prescribed entities and specialist DFV service providers) to the primary, with new populated Part 5A party (requesting/disclosing entity, person at risk / person using violence) and detail (information shared, date, reason, consent) regexes gating a second 75 tier (either) and a second 85 tier (both plus independent Part 5A evidence). Add a Part 5A instrument/guidance exclusion (Instrument of Authorisation, Column 4, Information Sharing Guidelines) to all enforce tiers. Add Part 5A positives and Instrument of Authorisation, blank request form, council policy and Guidelines decoys. Existing tests unchanged.
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — sector-neutral DFV disclosure in case records, gated on populated case-record fields.
