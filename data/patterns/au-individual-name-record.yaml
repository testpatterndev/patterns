schema: testpattern/v1
name: Australian Individual Name Record
slug: au-individual-name-record
version: 3.0.0
type: keyword_proximity
pattern_class: concept
engine: boost_regex
description: >-
  Identifies Australian personal names using capitalised name structure with controlled evidence
  from the consolidated Australian forename and surname dictionaries. Supports the multicultural
  name coverage represented in Australian birth, immigration, and administrative sources.
operation: >-
  The primary match is a pair of capitalised words (John Smith, JOHN SMITH, Ewan McDonald, Jane Smith-Jones).
  Purview reads line breaks and tabs as spaces, so longer runs would glue a name to the words around it;
  instead every adjacent pair is checked. Three IdMatch regexes cover the pair alignments (plain, and with
  one or three capitalised words consumed before \K), so a name is found after up to four other capitalised
  words and the reported value is the pair itself. A leading (?-i) states their case-sensitivity explicitly
  (Purview's default in a dev-tenant test), so lowercase prose does not match; a fourth regex matches a pair in any case directly after a name label (customer
  name: harry tobin), so names typed in lowercase on forms are still found; titles and salutations (Mr, Dr, Dear, Regards and similar, in any case) cannot be
  part of the pair; a pair followed by a road-type or company word (Road, Street, Pty, Ltd, Holdings,
  Corporation and similar) is not a name. Two value filters keep only pairs whose first word is in the
  consolidated Australian forename dictionary and whose second word is in the surname dictionary. A pair may
  hold one known middle particle (Van, Thi, Bin, De, Al and similar), so Nguyen Van Minh is one match; other
  names of three or more parts are reported as overlapping pairs. Keep the regexes in this order: when two
  patterns match at the same word, Purview keeps the earlier one before the filters run. 65 is
  discovery-only; 75 adds an explicit
  person-to-name relation and record context; 85 additionally requires a name-field label (including legal
  name, legal full name, full legal name, and family name). Placeholder values after a field label (N/A, TBC,
  Not recorded, Full Name, blanks) do not count as a person relation. Template fixtures veto every tier.
case_sensitive: true
confidence: medium
confidence_justification: >-
  Medium confidence: enforcement requires capitalised name structure, Australian dictionary evidence,
  and personal-record context. Broad dictionary-only recognition remains discovery-only because names
  and name-like words can occur in organisations, headings, and ordinary prose.
jurisdictions:
  - au
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
- ISO 27001
- ISO 27701
data_categories:
  - pii
  - personal-name
test_cases:
  should_match:
    - value: Aaliyah Abbasi attended the briefing.
      description: Exact 65 discovery probe - structured name with both consolidated dictionary hits but no personal-record context
    - value: Applicant identified as Aaliyah Abbasi during identity intake.
      description: Exact 75 probe - structured name with a person-to-name relation and both dictionary classes but no field label
    - value: 'Customer name: Aaliyah Abbasi'
      description: Exact 85 probe - structured name with record context plus consolidated forename and surname evidence
    - value: 'Customer name: Sarah Williams'
      description: Common Western female name with surname
    - value: 'Patient: Nguyen Van Minh'
      description: Vietnamese-Australian name pattern
    - value: Employee details for Raj Kumar Singh
      description: Indian-Australian name with context
    - value: 'Identity verification record 20417 - full legal name: Aaliyah Abbasi; date of birth and document number verified'
      description: Exact 85 probe carried from global-top500-001-legal-full-name - populated full-legal-name field in an identity record
    - value: 'Change of name register entry. Family name: Nguyen; given name: Minh Oliver; legal full name: Minh Oliver Nguyen'
      description: 85 probe - populated legal-full-name, family-name, and given-name fields in one record
    - value: 'Member recorded as Oliver Bennett; legal name change lodged with the registry.'
      description: Exact 75 probe - person-to-name relation with both dictionary classes but no labelled name field
    - value: "Kind Regards\nHarry Tobin\nSenior Consultant"
      description: Signature block - the reported value is the name line only, not the sign-off or job title
    - value: Approved By Project Manager Harry Tobin
      description: Labels and job titles on the same line are not part of the reported name
    - value: Dr Jane Smith-Jones
      description: Title is skipped and a hyphenated surname is kept whole
    - value: Ewan McDonald and Sean O'Brien attended.
      description: Mc and O' surname shapes
    - value: 'DEAR JOHN SMITH,'
      description: All-caps name; the salutation is skipped in any case
    - value: John SMITH signed the form.
      description: Surname written in capitals
    - value: Approved Harry Tobin
      description: One capitalised word before the name (offset pair)
    - value: Document Control Officer Harry Tobin
      description: Three capitalised words before the name (three-word offset pair)
    - value: 'customer name: harry tobin'
      description: Lowercase name after a name label
    - value: 'Full name: mr harry tobin'
      description: Lowercase name with a title after a name label
  should_not_match:
    - value: Please review the attached quarterly sales figures before Friday.
      description: Generic business text with no name pattern
    - value: Southern Cross Engineering submitted a tender for the contract.
      description: Organisation name may surface in discovery but lacks personal-record context and must not reach enforcement
    - value: 'Applicant organisation: Southern Cross Engineering Pty Ltd'
      description: Business-suffix collision in the Australian name dictionaries must not reach enforcement
    - value: 'Delivery location: Victoria Park Road, QLD 4000'
      description: Formatted-address vocabulary present in both name dictionaries must not reach enforcement
    - value: 'Client name: Quarterly Revenue'
      description: Name-field wording and capitalised structure without Australian name-dictionary evidence
    - value: 'Sample: Customer name: Aaliyah Abbasi'
      description: High-like template fixture must be rejected by the shared exclusion dictionary
    - value: 'Identity Verification Form. Legal full name of the applicant, including given name and family name, exactly as shown on the identity document.'
      description: Blank-form instruction with the absorbed pattern's label phrasing but no populated name must not enforce
    - value: 'Full legal name: Not Recorded; family name: TBC'
      description: Placeholder values after legal-name field labels must not establish a person relation
    - value: 'Legal name: Full Name'
      description: Blank-form name placeholder after a legal-name label must not enforce
    - value: 'Media release: Minister Oliver Bennett announced the legal name change reforms in Parliament today.'
      description: News decoy with a real-looking name and legal-name phrasing but no record field or person relation stays below enforcement
    - value: 'Training example: full legal name: Oliver Bennett'
      description: Training fixture with a populated legal-name field is vetoed by the template exclusion
    - value: Kind Regards
      description: Sign-off words are never a name
    - value: The Contract Price was agreed.
      description: Ends with a surname-list word but does not start with a forename
    - value: Grace Records Management
      description: Starts with a forename but does not end with a surname
    - value: Please ensure the Wall Seal is replaced.
      description: Two ordinary words that were in the name lists before the 2026-10-22 dictionary review
    - value: Riverbend Power Station
      description: Place name; Station is not a surname
    - value: the client will grant access in may
      description: Lowercase prose cannot match the case-sensitive name structure
    - value: Annual Report Summary
      description: Ann must match a whole word, not the start of Annual
    - value: PROJECT STATUS REPORT
      description: All-caps heading is not a name
    - value: Harry Tobin Pty Ltd
      description: Company named after a person - a pair followed by a company word is not a name
    - value: Harry Tobin Holdings
      description: Company named after a person
    - value: spoke to harry tobin yesterday
      description: Lowercase name without a name label is not matched (by design)
    - value: 'contact: please call reception'
      description: Words after a label that are not a forename and surname
false_positives:
  - description: Common surnames such as Brown, Young, or Green appear frequently as everyday words.
    mitigation: Use corroborative evidence keywords to filter. Require PII context.
  - description: >-
      Forms, policies, HR templates, and training material use legal-name field labels (legal name, full
      legal name, family name) without any populated value.
    mitigation: >-
      Field labels are only record evidence; enforcement also needs a populated capitalised name with
      dictionary evidence and a person relation, and placeholder values (N/A, TBC, Not recorded, Full Name,
      blanks) after the label are rejected.
exports:
  - purview_xml
  - yaml
scope: wide
risk_rating: 5
risk_description: >-
  The Australian Individual Name Record combines name-related dictionary terms with capitalised word structure, so it can identify an actual person's name rather than only a blank label. A matched name can support identity correlation, unwanted contact, or a more credible pretext when joined to an organisation, role, account, or case. Names are nevertheless routinely disclosed and the low-confidence construction can also match headings or ordinary title-cased text. Risk 5 and OFFICIAL recognise the potentially populated identity value without assuming the surrounding document is a sensitive personal dossier.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: "CUI"
  uk_gov: "OFFICIAL"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to OFFICIAL and Low tiers because the detector may return a real individual name but that name alone has
    limited confidentiality impact and uncertain precision. SENSITIVE is not met without additional private attributes,
    a vulnerable subject, or consequential operational context.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      An individual name record is generically Low with Low DLM because standalone names are commonly observable and
      require linked data for material misuse.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
    - dict: au-forenames-australian
      as: Evidence_au_forename_registry
      match_style: word
    - dict: au-surnames-australian
      as: Evidence_au_surname_registry
      match_style: word
  filters:
    - id: Filter_name_starts_with_forename
      type: TextMatchFilter
      direction: StartsWith
      logic: Include
      text_processor_ref: Evidence_au_forename_registry
    - id: Filter_name_ends_with_surname
      type: TextMatchFilter
      direction: EndsWith
      logic: Include
      text_processor_ref: Evidence_au_surname_registry
  pattern_tiers:
    - confidence_level: 85
      local_noise_filter: true
      id_match:
        type: any
        ids:
          - Pattern_individual_name
          - Pattern_individual_name_offset1
          - Pattern_individual_name_offset3
          - Pattern_individual_name_labelled
      matches:
        - ref: Evidence_au_forename_registry
          proximity: 1
        - ref: Evidence_au_surname_registry
          proximity: 1
        - ref: Pattern_individual_name_relation
        - ref: Evidence_name_record_context
        - ref: Pattern_individual_name_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match:
        type: any
        ids:
          - Pattern_individual_name
          - Pattern_individual_name_offset1
          - Pattern_individual_name_offset3
          - Pattern_individual_name_labelled
      matches:
        - ref: Evidence_au_forename_registry
          proximity: 1
        - ref: Evidence_au_surname_registry
          proximity: 1
        - ref: Pattern_individual_name_relation
        - ref: Evidence_name_record_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Pattern_individual_name
          - Pattern_individual_name_offset1
          - Pattern_individual_name_offset3
          - Pattern_individual_name_labelled
      matches:
        # A forename and a surname inside the match (proximity 1 = overlapping).
        # Redundant while the value filters apply; keeps the tier gated on the name
        # lists if a deployer drops the filters.
        - ref: Evidence_au_forename_registry
          proximity: 1
        - ref: Evidence_au_surname_registry
          proximity: 1
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_individual_name
      pattern: '(?-i)\b(?!(?i:Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Sir|Dear|Hi|Hello|Regards|Kind|Thanks)\b)(?:O[’''])?[A-Z][A-Za-z]{1,20}(?:-[A-Z][A-Za-z]{1,20})?\s+(?:(?:Van|Thi|Duc|Bin|Binti|Binte|Ibn|Abu|Al|El|De|Del|Della|Di|Da|Dos|Du|Le|La|Von|Der|Den|Ter|Ten)\s+)?(?!(?i:Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Sir|Dear|Hi|Hello|Regards|Kind|Thanks)\b)(?:O[’''])?[A-Z][A-Za-z]{1,20}(?:-[A-Z][A-Za-z]{1,20})?\b(?!\s+(?i:Street|St|Road|Rd|Avenue|Ave|Drive|Lane|Court|Place|Parade|Terrace|Crescent|Highway|Boulevard|Close|Circuit|Way|Pty|Ltd|Limited|Holdings|Group|Corporation|Corp|Company|Inc|Engineering|Consulting|Services|Partners|Associates|Council|University)\b)'
    - id: Pattern_individual_name_offset1
      pattern: '(?-i)\b(?:O[’''])?[A-Z][A-Za-z]{1,20}(?:-[A-Z][A-Za-z]{1,20})?\s+\K(?!(?i:Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Sir|Dear|Hi|Hello|Regards|Kind|Thanks)\b)(?:O[’''])?[A-Z][A-Za-z]{1,20}(?:-[A-Z][A-Za-z]{1,20})?\s+(?:(?:Van|Thi|Duc|Bin|Binti|Binte|Ibn|Abu|Al|El|De|Del|Della|Di|Da|Dos|Du|Le|La|Von|Der|Den|Ter|Ten)\s+)?(?!(?i:Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Sir|Dear|Hi|Hello|Regards|Kind|Thanks)\b)(?:O[’''])?[A-Z][A-Za-z]{1,20}(?:-[A-Z][A-Za-z]{1,20})?\b(?!\s+(?i:Street|St|Road|Rd|Avenue|Ave|Drive|Lane|Court|Place|Parade|Terrace|Crescent|Highway|Boulevard|Close|Circuit|Way|Pty|Ltd|Limited|Holdings|Group|Corporation|Corp|Company|Inc|Engineering|Consulting|Services|Partners|Associates|Council|University)\b)'
    - id: Pattern_individual_name_offset3
      pattern: '(?-i)\b(?:O[’''])?[A-Z][A-Za-z]{1,20}(?:-[A-Z][A-Za-z]{1,20})?\s+(?:O[’''])?[A-Z][A-Za-z]{1,20}(?:-[A-Z][A-Za-z]{1,20})?\s+(?:O[’''])?[A-Z][A-Za-z]{1,20}(?:-[A-Z][A-Za-z]{1,20})?\s+\K(?!(?i:Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Sir|Dear|Hi|Hello|Regards|Kind|Thanks)\b)(?:O[’''])?[A-Z][A-Za-z]{1,20}(?:-[A-Z][A-Za-z]{1,20})?\s+(?:(?:Van|Thi|Duc|Bin|Binti|Binte|Ibn|Abu|Al|El|De|Del|Della|Di|Da|Dos|Du|Le|La|Von|Der|Den|Ter|Ten)\s+)?(?!(?i:Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Sir|Dear|Hi|Hello|Regards|Kind|Thanks)\b)(?:O[’''])?[A-Z][A-Za-z]{1,20}(?:-[A-Z][A-Za-z]{1,20})?\b(?!\s+(?i:Street|St|Road|Rd|Avenue|Ave|Drive|Lane|Court|Place|Parade|Terrace|Crescent|Highway|Boulevard|Close|Circuit|Way|Pty|Ltd|Limited|Holdings|Group|Corporation|Corp|Company|Inc|Engineering|Consulting|Services|Partners|Associates|Council|University)\b)'
    - id: Pattern_individual_name_labelled
      pattern: '(?i)\b(?:full\s+legal\s+name|legal\s+full\s+name|full\s+name|legal\s+name|first\s+name|last\s+name|surname|given\s+name|family\s+name|middle\s+name|(?:applicant|customer|client|patient|employee|member|holder|contact)\s+name|applicant|customer|client|patient|employee|member|holder|contact)\s*(?::|-|is)\s*(?:(?:Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Sir)\.?\s+)?\K(?!(?:Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Sir)\b)(?:O[’''])?[A-Z][A-Z]{1,20}(?:-[A-Z][A-Z]{1,20})?\s+(?:(?:Van|Thi|Duc|Bin|Binti|Binte|Ibn|Abu|Al|El|De|Del|Della|Di|Da|Dos|Du|Le|La|Von|Der|Den|Ter|Ten)\s+)?(?:O[’''])?[A-Z][A-Z]{1,20}(?:-[A-Z][A-Z]{1,20})?\b(?!\s+(?:Street|St|Road|Rd|Avenue|Ave|Drive|Lane|Court|Place|Parade|Terrace|Crescent|Highway|Boulevard|Close|Circuit|Way|Pty|Ltd|Limited|Holdings|Group|Corporation|Corp|Company|Inc|Engineering|Consulting|Services|Partners|Associates|Council|University)\b)'
    - id: Pattern_individual_name_relation
      pattern: (?i)\b(?:(?:full\s+legal\s+name|legal\s+full\s+name|full\s+name|legal\s+name|first\s+name|last\s+name|surname|given\s+name|family\s+name|middle\s+name|(?:applicant|customer|client|patient|employee|member|holder|contact)\s+name|applicant|customer|client|patient|employee|member|holder|contact)\s*(?::|-|is)\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|(?:full|legal|given|first|last|family)\s+name\b|_{2,}|\[|<)(?:[a-z]{2,20}\s+[a-z]{2,20}\s+[a-z]{2,20}\s+[a-z]{2,20}|[a-z]{2,20}\s+[a-z]{2,20}\s+[a-z]{2,20}|[a-z]{2,20}\s+[a-z]{2,20})|(?:applicant|customer|client|patient|employee|member|holder|contact)\s+(?:identified\s+as|recorded\s+as|named|details\s+for)\s+(?:[a-z]{2,20}\s+[a-z]{2,20}\s+[a-z]{2,20}\s+[a-z]{2,20}|[a-z]{2,20}\s+[a-z]{2,20}\s+[a-z]{2,20}|[a-z]{2,20}\s+[a-z]{2,20}))\b
    - id: Pattern_individual_name_field
      pattern: (?i)\b(?:full\s+legal\s+name|legal\s+full\s+name|full\s+name|legal\s+name|first\s+name|last\s+name|surname|given\s+name|family\s+name|middle\s+name|(?:applicant|customer|client|patient|employee|member|holder|contact)\s+name|applicant|customer|client|patient|employee|member|holder|contact)\s*(?::|-|is)\s*
  keywords:
    - id: Evidence_name_record_context
      groups:
        - match_style: word
          terms:
            - name
            - full name
            - legal name
            - legal full name
            - full legal name
            - family name
            - first name
            - last name
            - surname
            - given name
            - middle name
            - applicant
            - customer
            - client
            - patient
            - employee
            - member
            - holder
            - owner
            - contact
      strength: domain
references:
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "OAIC - Notifiable Data Breaches scheme"
    url: https://www.oaic.gov.au/privacy/notifiable-data-breaches
created: '2026-02-09'
updated: '2026-10-22'
changelog:
  - version: 3.0.0
    date: '2026-10-22'
    description: >-
      Match the name itself, not the words around it (tested on a dev tenant). The primary match is a pair
      of capitalised words, checked by value filters that require the first word to be in the forename
      dictionary and the second in the surname dictionary. Purview reads line breaks and tabs as spaces, so
      every adjacent pair is tried: three IdMatch regexes (plain, and one or three words consumed before \K)
      find the name after up to four other capitalised words. The regexes are case-sensitive, stated
      explicitly with (?-i), accept ALL CAPS and mixed case (McDonald), skip titles and salutations in any case, and reject
      a pair followed by a road-type or company word; this replaces the business/address collision veto,
      which also suppressed real people named next to their employer. Forename and surname evidence now has
      to sit inside the match (proximity 1), which keeps every tier gated on the name lists if a deployer
      drops the filters. A pair may hold one known middle particle (Nguyen Van Minh); other multi-part names
      are reported as overlapping pairs. Lowercase names are matched only directly after a name label
      (customer name: harry tobin), so lowercase prose stays out. Tested on a dev tenant. Needs the
      dictionary-backed TextMatchFilter export (text_processor_ref). The 75 and 85 tiers also opt in to
      the per-tenant Local Noise Exclusion dictionary (local_noise_filter: true): an organisation can list
      the names of its own executives and contact officers, which signature blocks and letterheads repeat,
      and those stop reaching 75/85 while the 65 tier still reports them. As the match is now the name
      alone, the value ends with the name, which is what that filter compares.
  - version: 2.7.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 2.7.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references."
  - version: 2.7.0
    date: '2026-09-24'
    description: 'Merge global-top500-001-legal-full-name into this classifier (Qld government classifier review 2026-09-24): add legal full name, full legal name, and family name as record-field labels in the relation/field regexes and name-record evidence, add the repo placeholder guard (plus blank-form Full Name/Legal Name values) before relation values, and replace the absorbed bare-phrase tests with populated identity/change-of-name records and blank-form, placeholder, news, and training decoys. The absorbed topic-phrase tiers (label phrase corroborating itself) were not imported.'
  - version: 2.6.0
    date: '2026-07-19'
    description: 'Australian personal-name baseline: make capitalised name structure the primary signal with explicit component alternatives accepted by Purview; wire the consolidated 10,961-forename and 23,065-surname sources through keyword-dictionary references; distinguish dictionary-backed discovery, person-related medium, and explicit-field high tiers; veto strong business/address collisions; remove bare keyword fallback; add exact-tier and adversarial probes.'
  - version: 2.5.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 550 without changing detector or package metadata.'
  - version: 2.5.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 2.4.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 2.3.0
    date: '2026-07-04'
    description: Replace collision-prone should_not_match test values with true negatives (FP reduction)
  - version: 2.2.0
    date: '2026-07-04'
    description: case/evidence metadata update
  - version: 2.1.0
    date: '2026-07-04'
    description: Bound inner quantifier in repeated name-component group to remove Purview-flagged nested-quantifier shape
