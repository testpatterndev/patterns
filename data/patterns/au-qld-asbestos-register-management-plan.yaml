schema: testpattern/v1
name: Queensland Workplace Asbestos Register, Management Plan or Removal Record
slug: au-qld-asbestos-register-management-plan
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Populated workplace asbestos records under the Work Health and Safety Regulation 2011 (Qld) chapter 8: asbestos registers (s 425 - date identified, location, type and condition of asbestos or ACM), asbestos management plans (s 429, reviewed at least every 5 years under s 430), asbestos removal control plans (s 464), regulator notification of licensed removal (s 466), clearance inspections and clearance certificates (ss 473-474, including the less than 0.01 asbestos fibres/mL air-monitoring statement), air monitoring (s 482) and class A / class B removal licence details (ss 485, 487). The target is a record for a real site with filled location, material, friable status, condition, sample result or removalist fields. Worker asbestos health monitoring reports (ss 435-444) are covered by au-whs-health-monitoring-record and are not targeted here.
operation: >-
  Primary: asbestos register, asbestos management plan, asbestos removal control plan, clearance inspection, clearance certificate, asbestos air monitoring (report or results) or asbestos removal notification. 65 is discovery-only (primary alone) and surfaces the Regulation, the Code of Practice, SWA guidance and blank templates. 75 requires, within 300 characters, a populated register or plan field (location, room, area, building, material, ACM or asbestos type, friable status, condition, sample number, result, date identified, removalist, licence number, assessor, clearance date, quantity or extent) whose value is not blank, bracketed, n/a, tbc or another placeholder. 85 requires two distinct populated fields plus an analysis or monitoring result (a named asbestos fibre type detected or not detected, "no asbestos detected", or a labelled fibre reading in fibres/mL) plus independent corroboration (Regulation section references, class A or B licence, licensed asbestos assessor, competent person, NATA, encapsulation, enclosure, decontamination, WorkSafe notification). All tiers exclude template/fixture text and legislation or awareness-training text (maximum penalty, penalty units, asbestos awareness, fact sheet, media release, public register).
pattern: (?i)\b(?:asbestos\s+(?:register|management\s+plan|removal\s+control\s+plan|removal\s+notification|clearance\s+certificate)|clearance\s+(?:inspection|certificate)|asbestos\s+air\s+monitoring(?:\s+(?:report|results?))?)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases are statutory record names that also appear throughout the Regulation, the Code of Practice and guidance, so they are discovery-only on their own. Enforcement depends on populated labelled fields, which guidance and blank templates do not carry, but an informal register written without "label: value" fields (for example a table pasted without column headers) will stay at 65. The Queensland Code of Practice Appendix D/E register column names could not be read at source and are unverified, so the field list uses the legislated fields (s 425 date, location, type, condition) plus common industry labels rather than a template's exact headings. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Work Health and Safety Regulation 2011 (Qld)
  - Work Health and Safety Act 2011 (Qld)
frameworks:
  - QGISCF
data_categories:
  - environmental
  - health
  - location
corroborative_evidence:
  keywords:
    - class A asbestos removal licence
    - class B asbestos removal licence
    - licensed asbestos assessor
    - competent person
    - NATA
    - encapsulated
    - enclosure
    - decontamination
    - WorkSafe
    - section 425
    - section 474
  proximity: 300
customisation:
  - key: asbestos-removal-licence-number
    kind: identifier-format
    identifier: asbestos-removal-licence-number
    target: purview.regexes/Regex_au_qld_asbestos_register_record_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's asbestos removal licence number format (see docs/identifiers.md#asbestos-removal-licence-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
  - key: asbestos-sample-reference
    kind: identifier-format
    identifier: asbestos-sample-reference
    target: purview.regexes/Regex_au_qld_asbestos_register_record_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's asbestos sample reference format (see docs/identifiers.md#asbestos-sample-reference). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Asbestos register - Teston Power Station, Unit 2 turbine hall\nDate identified: 14/03/2026\nLocation: Turbine hall level 3, north wall lagging\nMaterial: Pipe lagging\nFriable status: Friable\nCondition: Poor, damaged\nSample no: TPS-U2-017 - Chrysotile detected, amosite detected (NATA accredited laboratory)\nRemoval by class A asbestos removal licence holder before the 2027 outage."
      description: Populated register row with sample result and class A licence (intended 85)
      synthetic: true
    - value: "Asbestos management plan - Teston Substation control building (review under s 430 due 06/2031)\nLocation: Switchroom ceiling cavity\nMaterial: Fibre cement sheeting\nCondition: Good, painted"
      description: Management plan with populated location, material and condition, no lab result (intended 75)
      synthetic: true
    - value: "Clearance certificate\nSite: Teston Depot workshop, 12 Foundry Road Teston\nAssessor: Casey Teston, licensed asbestos assessor\nResult: <0.01 fibres/mL (four static samples)\nNo asbestos detected in visual inspection of the enclosure after removal; decontamination unit dismantled."
      description: Clearance certificate with assessor, site and air monitoring result (intended 85)
      synthetic: true
    - value: "Asbestos removal control plan - Teston Pump Station roof\nRemovalist: Teston Demolition Pty Ltd\nLicence number: AR-TEST-0042\nQuantity: 45 m2 bonded roof sheeting"
      description: Removal control plan with populated removalist, licence and quantity (intended 75)
      synthetic: true
  should_not_match:
    - value: "425 Asbestos register (1) A person with management or control of a workplace must ensure that a register (an asbestos register) is prepared and kept at the workplace. Maximum penalty-36 penalty units. (3) The asbestos register must record the date on which the asbestos or ACM was identified and the location, type and condition of the asbestos or ACM."
      description: Regulation text (legislation decoy, excluded by maximum penalty / penalty units)
    - value: "Asbestos register template\nDate identified: __________\nLocation: __________\nType of asbestos: [insert]\nCondition: __________\nFriable status: __________"
      description: Blank register template
    - value: "Asbestos awareness training module 2: what an asbestos management plan must contain, who can issue a clearance certificate and when air monitoring is required."
      description: Awareness training content
    - value: "Media release: the regulator reminds building owners that an asbestos register must be kept for workplaces built before 1990, after inspectors found gaps at 40 sites."
      description: News / media release
    - value: "A clearance certificate must state that the assessor found no visible asbestos residue and, if air monitoring was carried out, that the airborne asbestos fibre level was less than 0.01 asbestos fibres/ml."
      description: Paraphrase of s 474 clearance certificate requirement (no populated fields)
false_positives:
  - description: The Regulation, the Code of Practice (How to manage and control asbestos in the workplace), SWA asbestos registers guide and ASSEA guidance.
    mitigation: These use the record names but no populated label-and-value fields; legislation markers (maximum penalty, penalty units) are excluded, so they stay at 65 discovery.
  - description: Blank register and plan templates (including the Code of Practice Appendix D template, whose exact column names are unverified).
    mitigation: Blank lines, bracketed and angle-bracket placeholders and n/a/tbc values are rejected by the field guard, and "template" is in the shared template-exclusion dictionary.
  - description: Public asbestos removalist and assessor licence-holder lists published by WorkSafe Queensland.
    mitigation: These do not use the register/plan/clearance record names; "public register" is excluded.
  - description: Worker asbestos health monitoring reports (ss 435-444).
    mitigation: Out of scope here; covered by au-whs-health-monitoring-record. A register that sits in the same file as a health monitoring report can still match this classifier on its register fields.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_asbestos_register_primary
      matches:
        - ref: Regex_au_qld_asbestos_register_record_field
          min_count: 2
          unique_results: true
        - ref: Regex_au_qld_asbestos_register_analysis_result
        - ref: Keyword_au_qld_asbestos_register_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_asbestos_register_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_asbestos_register_primary
      matches:
        - ref: Regex_au_qld_asbestos_register_record_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_asbestos_register_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_asbestos_register_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_asbestos_register_exclusion
  regexes:
    - id: Regex_au_qld_asbestos_register_primary
      pattern: >-
        (?i)\b(?:asbestos\s+(?:register|management\s+plan|removal\s+control\s+plan|removal\s+notification|clearance\s+certificate)|clearance\s+(?:inspection|certificate)|asbestos\s+air\s+monitoring(?:\s+(?:report|results?))?)\b
    - id: Regex_au_qld_asbestos_register_record_field
      pattern: >-
        (?i)\b(?:date\s+identified|date\s+of\s+identification|location|room|area|building|site|material(?:\s+description)?|product\s+type|ACM\s+type|asbestos\s+type|type\s+of\s+asbestos|friab(?:le|ility)(?:\s+status)?|condition|sample\s+(?:no\.?|number|ID|ref(?:erence)?)|lab(?:oratory)?\s+result|result|removalist|licen[cs]e\s+(?:no\.?|number)|assessor|clearance\s+date|quantity|extent)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<(?![\s\d]))[<A-Za-z0-9][A-Za-z0-9/'.,-]{0,40}(?:[ \t]+[A-Za-z0-9][A-Za-z0-9/'.,-]{0,30}){0,4}
    - id: Regex_au_qld_asbestos_register_analysis_result
      pattern: >-
        (?i)\b(?:(?:chrysotile|amosite|crocidolite|tremolite|actinolite|anthophyllite)(?:\s+asbestos)?\s+(?:not\s+detected|detected|identified|present)|no\s+asbestos\s+detected|(?:result|reading|fibre\s+(?:count|level|concentration)|measured|recorded)\s*[:=]?\s*[<>]?\s*\d{1,3}(?:[.·]\d{1,4})?\s*(?:asbestos\s+)?(?:fibres?|f)\s*/\s*mL)\b
  keywords:
    - id: Keyword_au_qld_asbestos_register_corroborative
      groups:
        - match_style: word
          terms:
            - class A asbestos removal licence
            - class B asbestos removal licence
            - class A licence
            - class B licence
            - licensed asbestos assessor
            - competent person
            - NATA
            - encapsulated
            - enclosure
            - decontamination
            - WorkSafe
            - section 425
            - section 429
            - section 464
            - section 466
            - section 474
            - labelled photograph
            - warning sign
      strength: specific
    - id: Keyword_au_qld_asbestos_register_exclusion
      groups:
        - match_style: word
          terms:
            - maximum penalty
            - penalty units
            - asbestos awareness
            - awareness training
            - fact sheet
            - media release
            - public register
      strength: specific
risk_rating: 7
risk_description: >-
  A populated asbestos register, management plan or removal record says where asbestos-containing material is in a named building or plant, whether it is friable and in poor condition, what laboratory results showed and whether removal was cleared. It is not a public record, but it is shared with workers and contractors (s 427), so it is internal-sensitive rather than secret. Unauthorised disclosure creates WHS and environmental liability exposure (evidence of known, unremediated friable asbestos), regulatory scrutiny and reputational harm, and can affect property transactions. It does not carry personal health information; worker health monitoring is handled by a separate classifier. Risk 7 supports OFFICIAL: Sensitive / SENSITIVE.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 fits PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE Government because a populated asbestos
    register or removal record shows where friable ACM sits in a named building, its condition and lab results, creating
    WHS liability. PROTECTED is not met: the record is shared with workers and contractors under s 427 and carries no
    personal health data.
  generic:
    classification: Medium
    dlm: Medium Government
    rationale: >-
      Medium Government handling fits a site asbestos register or clearance record that evidences known hazards and
      liability. It is not High because it is routinely shared with workers and contractors.
references:
  - title: Work Health and Safety Regulation 2011 (Qld) - chapter 8 asbestos (ss 422-430, 464-466, 473-475, 482, 485, 487)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2011-0240
  - title: Safe Work Australia - Asbestos Registers Guide (August 2023)
    url: https://www.safeworkaustralia.gov.au/sites/default/files/2023-09/Guidance%20material%20-%20Asbestos%20Registers%20Guide%20-%20August%202023.pdf
  - title: WorkSafe Queensland - Asbestos removal and licensing
    url: https://www.worksafe.qld.gov.au/licensing-and-registrations/asbestos-removal-and-licensing/asbestos
