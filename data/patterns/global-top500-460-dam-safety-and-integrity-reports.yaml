schema: testpattern/v1
name: Dam safety and integrity reports
slug: global-top500-460-dam-safety-and-integrity-reports
version: 1.4.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects dam safety and integrity engineering reports: dam safety review, surveillance or inspection report wording with instrumentation readings (piezometers, seepage weirs, survey marks, reservoir levels) and located condition findings (seepage, cracking, erosion at the toe, spillway or abutment). Distinct from the referable-dam emergency action plan classifier, which covers EAP notification and inundation content. Topic wording alone is discovery-only.
operation: >-
  Regex_dam_condition_primary (dam safety/integrity/surveillance/condition review, report, inspection or audit, inspection report, dam failure analysis or embankment stability assessment wording) is discovery-only at 65. 75 requires the primary plus one populated structure: an instrumentation reading with units (piezometer, V-notch/seepage weir, inclinometer, settlement point, survey mark, reservoir level/FSL) or a located condition finding (seepage, cracking, erosion, slumping, settlement, spalling, scour, sinkhole, boil or piping at a chainage, toe, face, spillway, abutment, crest, gallery or outlet). 85 requires an instrumentation reading with units (piezometer, V-notch/seepage weir, inclinometer, settlement point, survey mark, reservoir level/FSL) (two distinct hits), a located condition finding (seepage, cracking, erosion, slumping, settlement, spalling, scour, sinkhole, boil or piping at a chainage, toe, face, spillway, abutment, crest, gallery or outlet), and independent engineering-assessment (remedial works, risk rating, consequence category, dam safety engineer, recommendations) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_dam_condition_guidance_exclusion).
pattern: >-
  (?i)\b(?:dam\s+(?:safety|integrity|surveillance|condition)\s+(?:review|report|inspection|assessment|audit)s?|(?:comprehensive|periodic|annual|routine|special)\s+(?:dam\s+(?:safety\s+)?)?inspection\s+report|dam\s+failure\s+(?:analysis|impact\s+assessment)|embankment\s+(?:condition|stability)\s+(?:assessment|report)|dam\s+safety\s+and\s+integrity\s+reports?)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (an instrumentation reading with units (piezometer, V-notch/seepage weir, inclinometer, settlement point, survey mark, reservoir level/FSL) or a located condition finding (seepage, cracking, erosion, slumping, settlement, spalling, scour, sinkhole, boil or piping at a chainage, toe, face, spillway, abutment, crest, gallery or outlet)), and 85 needs two distinct structures plus independent engineering-assessment (remedial works, risk rating, consequence category, dam safety engineer, recommendations) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
  - global
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
  - Water Supply (Safety and Reliability) Act 2008 (Qld)
frameworks:
  - ISO 27001
  - NIST CSF
data_categories:
  - security
  - location
corroborative_evidence:
  keywords:
    - remedial works
    - risk rating
    - consequence category
    - dam safety engineer
    - urgent
    - repair
    - geotechnical
    - monitoring frequency
    - deficiency
    - recommendation
  proximity: 300
test_cases:
  should_match:
    - value: The comprehensive dam safety review for Harbour Creek Dam is due in 2027.
      description: Discovery probe (65)
      synthetic: true
    - value: |-
        Annual dam safety inspection report - Harbour Creek Dam
        Seepage observed at the downstream toe near chainage 420 m.
      description: Medium-tier probe (75) - located condition finding
      synthetic: true
    - value: |-
        Dam surveillance report - Harbour Creek Dam, Q3 2026
        Piezometer P4: 112.4 mAHD (up 0.8 m since June)
        V-notch weir: 3.2 L/s
        Reservoir level: 98 %
        Finding 3: increased seepage and a wet area on the downstream toe at chainage 420 m; longitudinal cracking on the crest near the left abutment.
        Recommendation: urgent geotechnical investigation and remedial works; dam safety engineer to confirm risk rating.
      description: High-tier probe (85) - several instrument readings, located findings and engineering-assessment context
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match
    - value: 'Policy statement: dam owners must submit a dam safety report to the regulator each year.'
      description: Policy text
      synthetic: true
    - value: |-
        Dam safety inspection report template
        Piezometer P1: ____ mAHD
        Finding: [insert]
      description: Blank template
      synthetic: true
    - value: 'Course module 5: in a dam safety inspection, seepage at the downstream toe is measured with a V-notch weir: 3.2 L/s.'
      description: Training framing
      synthetic: true
    - value: The public ANCOLD standard describes dam safety management principles.
      description: Public standard discussion
      synthetic: true
false_positives:
  - description: ANCOLD guidelines and dam engineering courses describe seepage and piezometers.
    mitigation: Guidance/training framing is excluded; 85 needs two readings, a located finding and engineering-assessment context.
  - description: Referable-dam emergency action plans.
    mitigation: Covered by au-qld-referable-dam-emergency-action-plan; this pattern needs engineering condition content.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_dam_condition_primary
      matches:
        - ref: Regex_dam_condition_instrument_reading
          min_count: 2
          unique_results: true
        - ref: Regex_dam_condition_condition_finding
        - ref: Keyword_dam_condition_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_dam_condition_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_dam_condition_primary
      matches:
        - type: any
          refs:
            - Regex_dam_condition_instrument_reading
            - Regex_dam_condition_condition_finding
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_dam_condition_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_dam_condition_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_dam_condition_primary
      pattern: >-
        (?i)\b(?:dam\s+(?:safety|integrity|surveillance|condition)\s+(?:review|report|inspection|assessment|audit)s?|(?:comprehensive|periodic|annual|routine|special)\s+(?:dam\s+(?:safety\s+)?)?inspection\s+report|dam\s+failure\s+(?:analysis|impact\s+assessment)|embankment\s+(?:condition|stability)\s+(?:assessment|report)|dam\s+safety\s+and\s+integrity\s+reports?)\b
    - id: Regex_dam_condition_instrument_reading
      pattern: >-
        (?i)\b(?:piezometer|standpipe|V-notch(?:\s+weir)?|seepage(?:\s+weir)?|inclinometer|settlement\s+(?:point|pin|monument)|survey\s+(?:mark|monument)|pressure\s+cell|reservoir\s+level|full\s+supply\s+level|FSL)\s*(?:[A-Z]{1,3}-?\d{1,4})?\s*[:=]?\s*[-+]?\d{1,5}(?:\.\d{1,3})?\s*(?:L/s|ML/d|mAHD|m\s?AHD|mm|kPa|m|%)
    - id: Regex_dam_condition_condition_finding
      pattern: >-
        (?i)\b(?:seepage|crack(?:ing)?|erosion|slump(?:ing)?|settlement|deformation|spalling|scour|sinkhole|wet\s+area|boil|piping|corrosion)\b[\s\S]{0,60}?\b(?:chainage|Ch\s?\d|downstream\s+(?:toe|face|slope)|upstream\s+(?:face|slope)|spillway|abutment|crest|gallery|outlet\s+(?:works|conduit)|toe\s+drain)\b
  keywords:
    - id: Keyword_dam_condition_context
      groups:
        - match_style: word
          terms:
            - remedial works
            - risk rating
            - consequence category
            - dam safety engineer
            - urgent
            - repair
            - geotechnical
            - monitoring frequency
            - deficiency
            - recommendation
      strength: specific
    - id: Keyword_dam_condition_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - guidance note
            - best practice guide
            - media release
            - press release
            - news report
            - course module
            - learning objectives
            - awareness course
            - webinar
            - lesson plan
            - quiz question
      strength: domain
risk_description: >-
  The detector now requires dam safety report wording plus instrumentation readings or located condition findings (seepage, cracking, erosion at named dam features) before enforcing. A genuine report can disclose failure modes, degraded components, flood consequences, and inspection gaps that support sabotage, unsafe interference, or targeted disinformation. The normal exposure is serious for one dam operator and downstream community, while public safety standards and educational engineering material remain common matches. Risk 8 and SENSITIVE fit that contained consequence; PROTECTED would require a current exploitable weakness with a credible prospect of major flooding, widespread service loss, or significant life-safety damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Confidential
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with SENSITIVE because an actual integrity report can reveal consequential structural weaknesses and
    downstream impacts. PROTECTED is not met without current exploit detail and a credible path to significant damage,
    major inundation, or broad life-safety consequences.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium handling captures serious dam and downstream-community exposure; Personal-Privacy is retained
      solely as the prescribed medium DLM crosswalk.
