      References completed: every reference has a title and a verified URL (ISM URL redirected; updated to current
      cyber.gov.au location).
  - version: 1.4.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): primary broadened to dam safety/surveillance/inspection/condition report wording (inundation map and consequence category removed - covered by the referable-dam EAP classifier); keyword-only condition and consequence groups (phrase-only path) replaced with an instrumentation-reading regex and a located condition-finding regex; 75 needs either; 85 needs two readings, a finding and engineering-assessment context; guidance exclusion; populated surveillance-report tests and decoys; irrelevant privacy/AML/health/TIA regulations replaced with SOCI Act and Water Supply (Safety and Reliability) Act 2008 (Qld); ISO 27001/NIST CSF frameworks and Water Supply Act/NIST SP 800-82 references added.'
  - version: 1.3.0
    date: '2026-07-04'
    description: 'CI profile hardening: align the global dam detector with the reviewed engineering-finding contract; require condition findings at 75 and severe weakness, emergency, failure, or downstream-consequence evidence at 85.'
  - version: 1.2.2
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 2000 without changing detector or package metadata.'
  - version: 1.2.1
    date: '2026-07-12'
    description: 'Baseline burn-down: mark the no-evidence 65 tier discovery_only — it is a broad inventory tier by shape (id_match only, no required evidence), so bare topic fragments correctly surface in discovery rather than counting as classification; aligns with corpus convention and clears the should_not_match failure + check:quality discoveryMissing informational. No compiled detection change (discovery_only is harness/quality metadata).'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
