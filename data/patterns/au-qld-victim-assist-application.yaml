schema: testpattern/v1
name: Victim Assist Queensland Financial Assistance Application
slug: au-qld-victim-assist-application
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed applications for financial assistance under the Victims of Crime Assistance Act 2009 (Qld) ss 51-52, made on the Victim Assist Queensland "Financial Assistance Application Form: Primary victim" (Form 1, Version 5, effective 14 September 2023) or recorded in Victim Assist case files: the primary victim's name and date of birth, the act of violence (what happened, key dates, offender name), police report details (reference number, station, investigating officer) or special primary victim report details (for example a domestic violence worker), injuries, recognition payment (special assistance) and recovery expense claims, and safe contact arrangements. Acts of violence include domestic and family violence, sexual offences and child abuse. The blank form, qld.gov.au application guidance and media coverage are decoys.
operation: >-
  Primary: a Victim Assist anchor (Victim Assist Queensland, Financial Assistance Application Form: Primary victim, Victims of Crime Assistance Act 2009, primary victim application, special primary victim / special primary victim report, or recognition payment (special assistance)). 75 tier requires, within 300 characters, one populated structure: an applicant field (the victim's / your / applicant / primary victim's full name, other names used, date of birth or offender's name, with an optional form hint in brackets, followed by a non-placeholder value) or a crime field (a police or claim reference number containing a digit, a police station or investigating officer with a name, "date the report was made" or "when did it start/end/happen" with a date). 85 tier requires an applicant field AND a crime field AND an independent act-of-violence or claim term (assault, domestic violence, sexual, injury, counselling, offender, recovery expenses, loss of earnings, medical). All enforce tiers AND NOT the shared template-exclusion dictionary and a media/guidance exclusion (media statement, ministerial statement, annual report, how to apply). 65 is discovery-only (primary alone) and will surface the blank form and application guidance.
pattern: >-
  (?i)\b(?:Victim\s+Assist\s+Queensland|Financial\s+Assistance\s+Application\s+Form:?\s+Primary\s+victim|Victims\s+of\s+Crime\s+Assistance\s+Act(?:\s+2009)?|primary\s+victim\s+(?:financial\s+assistance\s+)?application|special\s+primary\s+victim(?:\s+report(?:\s+form)?)?|recognition\s+payment\s*\(special\s+assistance\))\b
confidence: medium
confidence_justification: >-
  Medium: the form title, Act name and "special primary victim" are distinctive Victim Assist Queensland terms taken from Form 1 Version 5, but the blank form, qld.gov.au guidance and news use them too. Enforce tiers therefore need populated applicant or crime fields; the blank form's labels have no colon-delimited values. Victim Assist internal case-file labels and the claim reference number format are not published, so they are matched as labelled values containing a digit. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Victims of Crime Assistance Act 2009 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government
  - law-enforcement
corroborative_evidence:
  keywords:
    - primary victim
    - act of violence
    - recognition payment
    - recovery expenses
    - special primary victim report
    - domestic violence worker
    - police report
    - offender
  proximity: 300
  keyword_lists:
    - au-dfv-terminology
customisation:
  - key: victim-assist-claim-reference
    kind: identifier-format
    identifier: victim-assist-claim-reference
    target: purview.regexes/Regex_au_qld_vaq_crime_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's victim assist queensland claim reference format (see docs/identifiers.md#victim-assist-claim-reference). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Victim Assist Queensland - Financial Assistance Application Form: Primary victim\nThe victim's full name (as it is written on your ID): Avery Teston\nDate of birth: 14/02/1989\nQ7 What happened? I was a victim of domestic violence by my former partner. Assault on 3 occasions.\nOffenders name: Jordan Teston\nQ8c Police report details\nReference number (if known): QP2600417721\nPolice station (if known): Logan Central\nInjuries: fractured wrist, anxiety. Claiming counselling and recovery expenses."
      description: Completed Form 1 with applicant, offender, police report and injury detail (85 tier)
      synthetic: true
    - value: "Special primary victim report - Victim Assist Queensland\nPrimary victim's name: Casey Teston\nDate of birth: 22/08/2004\nWhen did it start? 01/03/2025\nWhen did it end? 30/06/2026\nReported to a domestic violence worker; sexual violence and coercive control disclosed. Counselling sessions requested."
      description: Special primary victim report with applicant identity and key dates (85 tier)
      synthetic: true
    - value: "Victims of Crime Assistance Act 2009 - application received\nApplicant name: Morgan Teston\nRecognition payment (special assistance) requested; supporting documents to follow."
      description: Application intake note with a populated applicant name only (75 tier)
      synthetic: true
    - value: "Victim Assist Queensland claim - police reference number: QP2500998812. Date the report was made: 17/11/2025."
      description: Claim note with police report reference and date, no applicant field (75 tier)
      synthetic: true
  should_not_match:
    - value: "Victim Assist Queensland\nFinancial Assistance Application Form: Primary victim\nVictims of Crime Assistance Act 2009 (sections 51 and 52)\nQ10 The primary victim's details\nThe victim's full name (as it is written on your ID)\nOther names used\nDate of birth\nQ8c Police report details\nDate the report was made\nReference number (if known)\nPolice station (if known)\nInvestigating officer (if known)"
      description: Blank Form 1 labels (critical decoy, 65 only)
    - value: "Apply for victim assistance. Victim Assist Queensland can help primary victims of an act of violence pay for counselling, medical and other recovery expenses. You can apply online or use the Financial Assistance Application Form: Primary victim."
      description: qld.gov.au application guidance (65 only)
    - value: "Ministerial media statement: victims of domestic and family violence will receive larger recognition payments under changes to the Victims of Crime Assistance Act 2009 commencing in September 2023."
      description: Media coverage of the 2023 payment changes (65 only)
    - value: "Victim Assist Queensland received 11,240 applications in 2025-26; 58% related to domestic and family violence, the annual report shows."
      description: Aggregate statistics (65 only)
    - value: "Training exercise: complete a mock Victim Assist Queensland application. The victim's full name: Sam Sample. Date of birth: 01/01/1990. Reference number: QP0000000000."
      description: Staff training exercise, suppressed by the template exclusion
false_positives:
  - description: The blank Form 1 and the special primary victim report form, which carry every label.
    mitigation: Enforce tiers need colon-delimited populated values; the blank form's labels have none, and blank lines and bracket placeholders are rejected.
  - description: qld.gov.au and Victim Assist guidance pages, media statements and annual reports.
    mitigation: No populated fields; a media/guidance exclusion suppresses statements and annual reports.
  - description: Victim support service case notes that mention Victim Assist Queensland alongside a client name and DOB.
    mitigation: These can reach 75 and are equally sensitive; the DFV case-note content is also covered by au-dfv-case-record-disclosure.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_vaq_primary
      matches:
        - ref: Regex_au_qld_vaq_applicant_field
        - ref: Regex_au_qld_vaq_crime_field
        - ref: Keyword_au_qld_vaq_violence_claim
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_vaq_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_vaq_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_vaq_applicant_field
            - Regex_au_qld_vaq_crime_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_vaq_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_vaq_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_vaq_primary
      pattern: >-
        (?i)\b(?:Victim\s+Assist\s+Queensland|Financial\s+Assistance\s+Application\s+Form:?\s+Primary\s+victim|Victims\s+of\s+Crime\s+Assistance\s+Act(?:\s+2009)?|primary\s+victim\s+(?:financial\s+assistance\s+)?application|special\s+primary\s+victim(?:\s+report(?:\s+form)?)?|recognition\s+payment\s*\(special\s+assistance\))\b
    - id: Regex_au_qld_vaq_applicant_field
      pattern: >-
        (?i)\b(?:(?:the\s+)?(?:victim|applicant|primary\s+victim)(?:'s)?\s+(?:full\s+)?name|your\s+full\s+name|applicant|other\s+names\s+used|(?:your\s+)?date\s+of\s+birth|DOB|of{1,2}enders?'?s?\s+name)(?:\s*\([^)]{1,40}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_au_qld_vaq_crime_field
      pattern: >-
        (?i)\b(?:(?:(?:police|claim)\s+)?(?:report\s+)?reference\s+(?:number|no\.?)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z-]{0,4}\d)[A-Z0-9][A-Z0-9/-]{4,20}|(?:police\s+station|investigating\s+of{1,2}icer)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}|(?:date\s+the\s+report\s+was\s+made|when\s+did\s+it\s+(?:start|end|happen))\??\s*[:#-]?\s*\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4})
  keywords:
    - id: Keyword_au_qld_vaq_violence_claim
      groups:
        - match_style: word
          terms:
            - assault
            - assaulted
            - domestic violence
            - domestic and family violence
            - sexual
            - child abuse
            - injury
            - injuries
            - injured
            - counselling
            - offender
            - recovery expenses
            - loss of earnings
            - medical
      strength: specific
    - id: Keyword_au_qld_vaq_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - media statement
            - ministerial statement
            - annual report
            - how to apply
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a completed victim assistance application or case record that names a primary victim of an act of violence - often domestic and family violence, sexual offences or child abuse - with their date of birth, the offender, police report details, injuries, counselling and expense claims, and safe contact arrangements. Disclosure exposes the victim's identity, health and trauma history and can alert the offender, with a risk of retaliation and serious harm. Blank forms, guidance, media and statistics are excluded from enforce tiers. Risk 9 supports SENSITIVE Personal-Privacy; records that also reveal a concealed address are covered by au-dfv-confidential-address at PROTECTED.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: Victim Assist Queensland - Financial Assistance Application Form - Primary victim (Form 1, Version 5, effective 14 September 2023)
    url: https://www.publications.qld.gov.au/dataset/d5e08dd6-4276-4dcd-8cf8-a3c88713bae1/resource/af12eaa0-a116-4e5f-a073-038706f7632c/download/primary-victim-financial-assistance-application-form-victim-assist-queensland.pdf
  - title: Queensland Government - Apply for victim assistance (online application link printed on Form 1; decoy source)
    url: https://www.qld.gov.au/victimsapply
