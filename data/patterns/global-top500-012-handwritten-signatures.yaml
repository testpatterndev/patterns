schema: testpattern/v1
name: Handwritten signatures
slug: global-top500-012-handwritten-signatures
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to handwritten signatures in Australian contexts. This remains a concept detector over manual/wet/ink/specimen signature wording — it does not
  inspect handwriting pixels or capture a signature image. Bare "signed by" attribution (common in electronic/typed signature text) is corroborating evidence only, not a primary indicator.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 6 keywords within 300 characters. Keyword
  lists: biometric-behavioral. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text. "signed by" was removed from the primary alternation (electronic
  attribution is not handwriting) and participates only as evidence beside manual/ink cues; the unexcluded 65 concept tier is discovery_only.
pattern: (?is)\b(?:handwritten\s+signature|wet\s+signature|specimen\s+signature|signature\s+sample|signature\s+card|authorised\s+signature|authorized\s+signature|signature\s+verification|manual\s+signature)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - handwritten signatures
    - handwritten
    - signatures
    - personal
    - identity
    - demographics
  proximity: 300
  keyword_lists:
    - biometric-behavioral
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: handwritten signature
      description: Primary topic phrase match
    - value: wet signature
      description: Alternative topic phrase match
    - value: specimen signature
      description: Additional topic phrase match
    - value: 'Wet handwritten signature captured on the deed.'
      description: Manual execution wording is unambiguous
    - value: |-
        Handwritten signature: Recorded
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: name disability
      description: Generic word pair from old broad template should not match
    - value: 'PDF signed by Alice using DocuSign.'
      description: Electronic "signed by" attribution no longer satisfies the primary (removed from the ID)
    - value: The manager approved the request.
      description: Approval alone has no signature concept
    - value: |-
        Handwritten signature:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about handwritten signature are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Handwritten signature:
        Name: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Common words and phrases related to handwritten signatures appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_012_handwritten_signatures_populated_label
      matches:
        - ref: Regex_global_top500_012_handwritten_signatures_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_012_handwritten_signatures_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_handwritten_signatures
  regexes:
    - id: Pattern_handwritten_signatures
      pattern: (?is)\b(?:handwritten\s+signature|wet\s+signature|specimen\s+signature|signature\s+sample|signature\s+card|authorised\s+signature|authorized\s+signature|signature\s+verification|manual\s+signature)\b
    - id: Pattern_au_top500_012_handwritten_signatures_label_context
      pattern: (?i)\b(?:handwritten\s+signatures)\b
    - id: Regex_global_top500_012_handwritten_signatures_populated_label
      pattern: (?i)\b(?:\b(?:handwritten\s+signature|wet\s+signature|specimen\s+signature|signature\s+sample|signature\s+card|authorised\s+signature|authorized\s+signature|signature\s+verification|manual\s+signature)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_global_top500_012_handwritten_signatures_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_top500_012_handwritten_signatures_domain_context
      groups:
        - match_style: word
          terms:
            - handwritten signatures
            - handwritten
            - signatures
risk_description: >-
  The Handwritten signatures detector finds phrases such as handwritten signature, wet signature, or signed by in text. It does not capture the ink image, stroke pattern, signatory name, or a completed instrument, so many instructions and workflow descriptions can satisfy the regex. A copied signature image on a financial or legal document could facilitate fraud, but that more consequential object is outside this match. Risk 3 and OFFICIAL assess the ordinary wording signal rather than presuming a reusable signature specimen.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 3, PSPF OFFICIAL, QGISCF OFFICIAL and OFFICIAL DLM at Low tier fit wording such as wet, ink or specimen
    signature; the detector never captures the ink image, stroke pattern or signatory. SENSITIVE is not met because a
    reusable signature specimen on a financial or legal instrument, which could enable forgery, lies outside this text
    match.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low with Low handling fits signature wording; a scanned specimen signature linked to a signatory is the object
      that would justify Medium.
created: '2026-02-08'
updated: '2026-10-19'
changelog:
  - version: 1.5.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_012_handwritten_signatures_populated_label: the label followed by a value); 85 requires the populated field plus a populated person/client field (Regex_global_top500_012_handwritten_signatures_record_structure). Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (signed by). Removed evidence no longer referenced by any tier (Evidence_handwritten_signatures). Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.4.3
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had a rationale written for an earlier
      risk rating, a tier that did not follow its label).
  - version: 1.4.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 3 verified legislation/regulator references."
  - version: 1.4.0
    date: '2026-07-17'
    description: >-
      Reduced-scope precision fix (TP-00143): remove bare "signed by" from the primary
      alternation (top-level and Purview ID) — electronic/typed attribution satisfied the SIT
      and the identical phrase in the evidence dictionary corroborated itself (circular
      same-span evidence). "signed by" remains in the evidence keyword list only, usable
      beside manual/ink cues. Per QA, the unexcluded 65 concept tier is now discovery_only,
      and the description/operation clarify that no handwriting pixels are inspected. Added
      wet-signature positive and DocuSign/approval negatives.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 618 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
