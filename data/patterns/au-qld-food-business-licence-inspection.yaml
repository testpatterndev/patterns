schema: testpattern/v1
name: Queensland Food Business Licence Application or Inspection and Improvement Notice Record
slug: au-qld-food-business-licence-inspection
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Council food business licence applications, food premises inspection reports and improvement notices under the Food Act 2006 (Qld). A person must hold a licence to carry on a licensable food business (s 49). The application is made to the local government (s 52) in the approved form, which must provide for the applicant's contact details (s 85). It must state the applicant's name and address, or for a corporation its directors, the premises, the business, and details of any conviction for a relevant offence (s 53). Council decides suitability, including convictions and previous refusal, suspension or cancellation (s 57). An authorised person may give an improvement notice stating the provision believed to be contravened, how it is contravened and the period to remedy it (s 209). Information gained in administering the Act about a person's affairs is confidential (s 272). The chief executive's register of mobile-premises food businesses (ss 264-266), council lists of licensed businesses and published conviction or "name and shame" registers are public and are decoys.
operation: >-
  Primary: food business licence [application / renewal / restoration / amendment / number / certificate / conditions], licence to carry on a licensable food business, licensable food business, food safety / food premises / food business inspection [report / record / checklist / findings], routine / follow-up / compliance inspection report, improvement notice, food safety supervisor notification or details, accredited food safety program. Every enforce tier needs a food context term within 300 characters (Food Act 2006, food business, food premises, food safety, Food Standards Code, food handler, food handling, environmental health officer). Field values must be on the same line as their label and are placeholder-guarded. 75 requires context plus one populated structure, either a licensee / person field (licensee, applicant, proprietor, director, food safety supervisor, contact person, person in charge, operator, residential / home / postal address, phone, mobile, email or date of birth, followed by a name of two or more capitalised words, a street address, an Australian phone number, an email address or a date) or an inspection / suitability field (non-compliance, finding, observation, contravention, provision contravened, relevant provision, action required, corrective action, remedy by, period to remedy, compliance or re-inspection date, inspection outcome / result, convictions, relevant offence, details of the offence, previously refused / cancelled / suspended). 85 requires context plus both a person field and an inspection / suitability field. All enforce tiers AND NOT the shared template-exclusion dictionary and a public-register / guidance exclusion (name and shame, register of food businesses, public register, published register, register of auditors, fact sheet, frequently asked questions, how to apply, Work Health and Safety Act). 65 is discovery-only.
pattern: >-
  (?i)\b(?:food\s+business\s+licen[cs]e(?:\s+(?:application|renewal|restoration|amendment|number|no\.?|certificate|conditions))?|licen[cs]e\s+to\s+carry\s+on\s+a\s+licensable\s+food\s+business|licensable\s+food\s+business|food\s+(?:safety|premises|business)\s+inspection(?:\s+(?:report|record|checklist|findings))?|(?:routine|follow[- ]up|compliance)\s+inspection\s+report|improvement\s+notice|food\s+safety\s+supervisor\s+(?:notification|details)|accredited\s+food\s+safety\s+program)\b
confidence: medium
confidence_justification: >-
  Medium. Licence and inspection vocabulary is statutory (Food Act 2006 ss 49, 52-53, 57, 209), but it also fills council web pages, the Act and public licence lists, and "improvement notice" is shared with work health and safety law. Enforce tiers therefore need food context and populated same-line fields, and public registers are excluded by phrase. Licence and inspection numbers are council-defined and are not relied on. A company licensee name matches the person field, so an unlabelled public list that names companies with phone numbers can still reach 75. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Food Act 2006 (Qld) ss 49, 52-53, 57, 60, 85
  - Food Act 2006 (Qld) s 209 (improvement notice)
  - Food Act 2006 (Qld) ss 264-266, 272
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - government
  - business
corroborative_evidence:
  keywords:
    - Food Act 2006
    - food business
    - food premises
    - Food Standards Code
    - licensee
    - non-compliance
    - improvement notice
    - environmental health officer
  proximity: 300
test_cases:
  should_match:
    - value: "Food safety inspection report - Harbourview Regional Council\nLicensee: Avery Teston\nMobile: 0491 570 156\nPremises: Shop 3, 14 Wharf Street, Harbourview QLD 4655\nInspection result: unsatisfactory\nNon-compliance: cool room holding at 11C, above the 5C limit in Food Standards Code standard 3.2.2\nRemedy by: 15/10/2026"
      description: Inspection report naming the licensee with a mobile and the non-compliance findings (85 tier)
      synthetic: true
    - value: "Improvement notice - Food Act 2006 s 209\nLicensee: Morgan Teston\nResidential address: 22 Banksia Drive, Mackay QLD 4740\nProvision contravened: Food Standards Code standard 3.2.2 clause 24 (hand washing facilities)\nPeriod to remedy: 14 days from the date of this notice"
      description: Improvement notice naming the licensee with a home address and the contravention (85 tier)
      synthetic: true
    - value: "Application for a food business licence (licensable food business)\nApplicant's full name: Riley Teston\nResidential address: 9 Fig Tree Lane, Toowoomba QLD 4350\nDate of birth: 04/07/1988\nDetails of the offence: fined in 2023 for selling food that was not suitable\nFood safety supervisor: Casey Teston"
      description: Licence application with applicant identity and s 53 conviction details (85 tier)
      synthetic: true
    - value: "Re: food business licence renewal for the cafe at 3 Wharf Street. The food business owner asked us to update the contact details.\nMobile: 0491 570 157\nEmail: jordan.teston@mailtest.au"
      description: Renewal correspondence with the licensee's private mobile and email (75 tier)
      synthetic: true
    - value: "Routine inspection report (food premises)\nInspection outcome: follow-up required\nNon-compliance: no soap or paper towel at the food preparation hand basin"
      description: Food premises inspection finding without personal fields (75 tier)
      synthetic: true
  should_not_match:
    - value: "209 Improvement notice (1) This section applies if an authorised person reasonably believes a person carrying on a food business is contravening a provision of this Act. (3) The improvement notice must state the provision the authorised person believes is being, or has been, contravened and the period in which the person must remedy the contravention."
      description: Food Act 2006 s 209 text (legislation, 65 only)
    - value: "Application for a food business licence\nApplicant's full name: ______________\nResidential address: ______________\nPhone: ______________\nConvictions for a relevant offence: ______________\nFood safety supervisor: ______________"
      description: Blank licence application form (65 only)
    - value: "Register of food businesses (mobile premises), kept under s 264 and available for inspection free of charge. Each licensable food business is listed.\nLicensee: Harbour Coffee Van Pty Ltd\nLicence number: MFB-2026-018\nPhone: 07 5550 1234\nExpiry: 30/06/2027\nDescription: coffee van"
      description: Public register of mobile food businesses (public-register exclusion)
    - value: "Food business name and shame register - convictions published by council\nBusiness: Harbour Takeaway Pty Ltd\nPremises: 12 Wharf Street, Harbourview\nOffence: failure to comply with an improvement notice under the Food Act 2006\nConviction date: 14/03/2026\nPenalty: $8,000"
      description: Published name-and-shame conviction register (public-register exclusion)
    - value: "Council environmental health officers issued 42 improvement notices to food businesses this year and completed 1,310 food premises inspections, the annual report shows."
      description: News / annual report statistics (65 at most)
    - value: "Improvement notice issued under the Work Health and Safety Act 2011\nPerson conducting a business or undertaking - contact phone: 0491 570 158\nContravention: edge protection missing on the level 2 scaffold\nRemedy by: 30/10/2026"
      description: WHS improvement notice without food context (65 only)
false_positives:
  - description: Food Act text, council licensing web pages, fact sheets and application guides.
    mitigation: Enforce tiers need food context and a populated same-line field; guidance phrases are excluded.
  - description: Public registers - the chief executive's register of mobile-premises food businesses (s 266), council lists of licensed businesses and published conviction or name-and-shame registers.
    mitigation: Register and name-and-shame phrases are excluded. Business name and premises address are not person fields. An unlabelled public list that names a company licensee with a phone number can still reach 75.
  - description: Work health and safety improvement notices.
    mitigation: They lack food context, so they stay at 65.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_food_licence_primary
      matches:
        - ref: Regex_au_qld_food_licence_person_field
        - ref: Regex_au_qld_food_licence_finding_field
        - ref: Keyword_au_qld_food_licence_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_food_licence_public_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_food_licence_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_food_licence_person_field
            - Regex_au_qld_food_licence_finding_field
        - ref: Keyword_au_qld_food_licence_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_food_licence_public_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_food_licence_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_food_licence_primary
      pattern: >-
        (?i)\b(?:food\s+business\s+licen[cs]e(?:\s+(?:application|renewal|restoration|amendment|number|no\.?|certificate|conditions))?|licen[cs]e\s+to\s+carry\s+on\s+a\s+licensable\s+food\s+business|licensable\s+food\s+business|food\s+(?:safety|premises|business)\s+inspection(?:\s+(?:report|record|checklist|findings))?|(?:routine|follow[- ]up|compliance)\s+inspection\s+report|improvement\s+notice|food\s+safety\s+supervisor\s+(?:notification|details)|accredited\s+food\s+safety\s+program)\b
    - id: Regex_au_qld_food_licence_person_field
      pattern: >-
        (?i)\b(?:licensee(?:'?s)?(?:\s+(?:full\s+)?name)?|applicant(?:'?s)?(?:\s+(?:full\s+)?name)?|proprietor|director(?:'?s)?(?:\s+name)?|(?:nominated\s+)?food\s+safety\s+supervisor(?:\s+name)?|contact\s+person|person\s+in\s+charge|operator|(?:residential|home|postal)\s+address|(?:contact\s+|home\s+|after[- ]hours\s+)?(?:tele)?phone(?:\s+(?:no\.?|number))?|mobile(?:\s+(?:no\.?|number))?|e-?mail(?:\s+address)?|date\s+of\s+birth)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not|none|nil|redacted|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:(?:(?:Mr|Mrs|Ms|Miss|Dr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:(?:Unit|Lot|Apt|Flat|Shop)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:\+?61[ \t]?|0)[2-478](?:\d{2}[ \t]?\d{3}[ \t]?\d{3}|[ \t]?\d{4}[ \t]?\d{4})|[A-Z0-9._%+-]{1,40}@[A-Z0-9-]{1,40}\.[A-Z.]{2,20}|\d{1,2}[/.-]\d{1,2}[/.-](?:19|20)\d{2})
    - id: Regex_au_qld_food_licence_finding_field
      pattern: >-
        (?i)\b(?:non[- ]?compliance(?:\s+(?:item|details|found|observed))?|findings?|observations?|issues?\s+identified|contravention|provision\s+contravened|relevant\s+provision|(?:section|standard|clause)\s+contravened|action\s+required|corrective\s+action|remedy\s+by|period\s+to\s+remedy|compliance\s+(?:date|due)|re-?inspection\s+(?:date|due)|inspection\s+(?:outcome|result)|convictions?(?:\s+for\s+a\s+relevant\s+offence)?|relevant\s+offence|details\s+of\s+(?:the\s+)?offence|previous(?:ly)?\s+(?:refused|cancelled|suspended)(?:\s+licen[cs]e)?)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|none|nil|no|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9$][A-Za-z0-9$.,'/()-]{2,40}
  keywords:
    - id: Keyword_au_qld_food_licence_context
      groups:
        - match_style: word
          terms:
            - Food Act 2006
            - Food Act
            - food business
            - food businesses
            - food premises
            - food safety
            - Food Standards Code
            - food handler
            - food handling
            - environmental health officer
      strength: specific
    - id: Keyword_au_qld_food_licence_public_exclusion
      groups:
        - match_style: word
          terms:
            - name and shame
            - register of food businesses
            - public register
            - published register
            - register of auditors
            - fact sheet
            - factsheet
            - frequently asked questions
            - how to apply
            - Work Health and Safety Act
      strength: specific
risk_rating: 4
risk_description: >-
  The classifier identifies a council food business licence application, inspection report or improvement notice that names the licensee or applicant with private contact details, or records inspection findings, contraventions or conviction details. Food Act s 272 makes information about a person's affairs gained in administering the Act confidential, and licence applications carry convictions, previous refusals and directors' details (ss 53, 57). Most sole-trader licensees are identifiable individuals. Legislation, blank forms, public registers of food businesses, published conviction registers and WHS notices are excluded from enforce tiers. Risk 4 supports OFFICIAL with privacy handling.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI Basic
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: Food Act 2006 (Qld) - ss 49, 52-53, 57, 60, 85, 94, 209, 264-266, 272
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2006-003
