    date: '2026-09-24'
    description: Initial release. Council food business licence applications, inspection reports and improvement notices anchored on Food Act 2006 terms. 75 requires food context + a populated person field or an inspection / suitability field. 85 requires both. Legislation, blank forms, public registers, name-and-shame lists and WHS notices are excluded.
