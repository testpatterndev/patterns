schema: testpattern/v1
name: CI/CD pipeline configurations
slug: global-top500-245-ci-cd-pipeline-configurations
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies CI/CD pipeline configuration files (GitHub Actions workflows, GitLab CI, Azure Pipelines, Jenkinsfiles, Bitbucket/CodeBuild/CircleCI configs) containing pipeline syntax, secret references or internal build/registry hosts. Pipeline topic wording alone is discovery-only.
operation: >-
  Regex_ci_cd_pipeline_configs (pipeline file names such as .gitlab-ci.yml, .github/workflows/*.yml, azure-pipelines.yml, Jenkinsfile, buildspec.yml, or CI/CD/build/release/deployment pipeline configuration/definition wording) is discovery-only at 65. 75 requires one structure: pipeline syntax (runs-on:, stages:, before_script:, uses: owner/action@ref, stage('...'), pipeline {), a secret reference (${{ secrets.X }}, credentials('id'), $X_TOKEN), or an internal host/IP. 85 requires two distinct structures plus a deployment target (production, docker push, helm upgrade, kubectl/terraform apply). Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: (?i)(?:\.gitlab-ci\.ya?ml|\.github/workflows/[\w.-]{1,80}\.ya?ml|\bazure-pipelines\.ya?ml|\bbitbucket-pipelines\.yml|\bJenkinsfile\b|\bbuildspec\.ya?ml|\.circleci/config\.yml|\b(?:CI/CD|build|release|deployment)\s+pipeline\s+(?:configuration|definition|file|YAML)\b|\bpipeline\s+(?:configuration|definition)\b)
confidence: medium
confidence_justification: >-
  Medium confidence: topic wording is discovery-only; enforcement requires pipeline syntax, secret references or internal hosts, and 85 adds a second structure and deployment target.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
  - CIS Controls
data_categories:
  - security
  - technology
corroborative_evidence:
  keywords:
    - production
    - docker push
    - helm upgrade
    - kubectl apply
    - terraform apply
  proximity: 300
test_cases:
  should_match:
    - value: |-
        .github/workflows/deploy.yml
        on:
          workflow_dispatch:
        jobs:
          deploy:
            runs-on: [self-hosted, build01]
            steps:
              - uses: actions/checkout@v4
              - run: docker push registry.example.internal/payments/api:2.14.0
                env:
                  REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
              - run: helm upgrade payments ./chart --namespace production
      description: High tier (85) - workflow syntax, secret reference and internal registry host with docker push/helm upgrade to production
      synthetic: true
    - value: |-
        Jenkinsfile for the billing service:
        pipeline {
          agent any
          stages {
            stage('Build') { steps { sh 'mvn -B package' } }
          }
        }
      description: Medium tier (75) - Jenkins pipeline syntax only
      synthetic: true
    - value: 'azure-pipelines.yml excerpt: pool vmImage: ubuntu-latest, then the unit test job.'
      description: Medium tier (75) - Azure Pipelines syntax only
      synthetic: true
    - value: The team is rewriting the build pipeline configuration for the mobile app next sprint.
      description: Discovery tier (65) - topic wording only
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: 'OWASP guidance note: organisations should never store credentials in a CI/CD pipeline configuration; use the platform secret store.'
      description: Guidance text
    - value: |-
        Pipeline configuration blank template
        runs-on: ________
        uses: ________
      description: Blank template
    - value: 'Training course lab: copy this .gitlab-ci.yml into your sandbox project; it has a stages: list with build and test.'
      description: Training framing with pipeline syntax must not enforce
false_positives:
  - description: CI/CD documentation, vendor tutorials and security guidance quote pipeline syntax and secret-reference examples.
    mitigation: Topic wording is discovery-only; enforcement needs pipeline syntax, secret references or internal hosts, and guidance/tutorial/template framing is excluded.
  - description: Secret references (${{ secrets.X }}) name a secret without containing its value.
    mitigation: The classifier targets pipeline configuration exposure; actual secret values are handled by the credential classifiers.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_ci_cd_pipeline_configs
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_ci_syntax
            - Evidence_secret_reference
            - Evidence_build_host
        - ref: Keyword_deploy_target
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_ci_cd_pipeline_configs
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_ci_syntax
            - Evidence_secret_reference
            - Evidence_build_host
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_ci_cd_pipeline_configs
  regexes:
    - id: Regex_ci_cd_pipeline_configs
      pattern: (?i)(?:\.gitlab-ci\.ya?ml|\.github/workflows/[\w.-]{1,80}\.ya?ml|\bazure-pipelines\.ya?ml|\bbitbucket-pipelines\.yml|\bJenkinsfile\b|\bbuildspec\.ya?ml|\.circleci/config\.yml|\b(?:CI/CD|build|release|deployment)\s+pipeline\s+(?:configuration|definition|file|YAML)\b|\bpipeline\s+(?:configuration|definition)\b)
    - id: Evidence_ci_syntax
      pattern: \b(?:runs-on|before_script|after_script|workflow_dispatch|vmImage|pull_request_target|needs|stages)\s{0,3}:|\buses:\s{0,3}[\w.-]{1,60}/[\w.-]{1,60}@[\w.-]{1,40}|\bstage\s{0,3}\(\s{0,3}['\"][\w\s-]{1,60}['\"]\s{0,3}\)|\bpipeline\s{0,3}\{
    - id: Evidence_secret_reference
      pattern: \$\{\{\s{0,3}secrets\.[A-Za-z0-9_]{2,60}\s{0,3}\}\}|\bcredentials\(\s{0,3}['\"][\w.-]{2,60}['\"]\s{0,3}\)|\bwithCredentials\b|\$[A-Z][A-Z0-9_]{1,40}_(?:TOKEN|KEY|SECRET|PASSWORD)\b
    - id: Evidence_build_host
      pattern: (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:hostname|host|server|asset\s+ID|device\s+ID|node|instance)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._-]{2,63}
  keywords:
    - id: Keyword_deploy_target
      groups:
        - match_style: word
          terms:
            - production
            - staging
            - docker push
            - helm upgrade
            - kubectl apply
            - terraform apply
            - deploy to production
            - artifact registry
            - container registry
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
risk_description: >-
  The detector identifies CI/CD pipeline configuration files when pipeline syntax, secret references or internal build hosts are present; pipeline wording alone is discovery-only. A genuine pipeline configuration can disclose build stages, deployment targets, approval gates, runner identities, and secret references that support software-supply-chain or environment attacks. General DevOps guidance and product documentation can match, and a normal true positive is bounded to one workflow unless the surrounding file shows wider reach. Risk 7 SENSITIVE reflects moderate operational and security harm from a substantive configuration; PROTECTED would require control of a critical release chain or another basis for significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, SENS_IT, and the Medium tier because a
    real CI/CD configuration can expose material deployment logic and defensive controls. The concept match does not
    establish live secrets, privileged runner access, or critical-estate impact needed for PROTECTED.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic Medium with Medium InfoTech fits internal automation configuration that can enable targeted tampering or
      reconnaissance. Generic High is not justified without evidence of a high-consequence deployment authority or broad
      compromise path.
