schema: testpattern/v1
name: Energy Retail Customer Hardship, Payment Plan or Concession Record
slug: au-energy-customer-hardship-concession-record
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Energy retailer customer records about hardship, payment plans, concessions and vulnerability. The National Energy Retail Law requires each retailer to have a customer hardship policy (s 43) meeting minimum requirements (s 44), and National Energy Retail Rules Part 3 (rr 70A-75B) sets out hardship customer obligations: informing the customer of the policy (r 71), payment plans set by capacity to pay, arrears and expected consumption (r 72), waiver of late payment fees (r 73), Centrepay (r 74) and the AER Customer Hardship Policy Guideline (r 75A). Queensland Government energy concessions (Electricity Rebate, Reticulated Natural Gas Rebate, Home Energy Emergency Assistance Scheme, Medical Cooling and Heating Electricity Concession Scheme) are applied through the retailer on proof of a Pensioner Concession Card, Health Care Card, Veteran (DVA) Gold Card, Queensland Seniors Card or ImmiCard. Records tie an account holder, customer or account number, NMI/MIRN or supply address to hardship program status, arrears, concession card details, payment plan amounts and "personal circumstances" notes. The incident class is a retailer's outsourced call-centre compromise exposing customer circumstances notes and government concession numbers. Published hardship policies, the AER guideline, blank applications and news are decoys.
operation: >-
  Primary: a hardship, concession or vulnerability phrase (hardship customer / program / plan / flag / status / team / assessment / application / arrangement / case / payment plan; energy, electricity or gas hardship, concession or rebate; customer, financial or energy hardship record / note / referral; Electricity Rebate; Reticulated Natural Gas Rebate; Home Energy Emergency Assistance (Scheme) / HEEAS; Medical Cooling and Heating Electricity Concession (Scheme) / MCHECS; concession card holder / details / number / type; concession eligibility or status; personal circumstances note / notes / flag; vulnerable or vulnerability customer / flag / indicator / marker / note). 75 tier requires, within 300 characters, a populated account field (NMI/MIRN label with an NMI-shaped value, customer or account number containing a digit, a named account holder, or a supply / service / property / premises / site address with a street number) AND a populated hardship or concession field (hardship program / status / flag / plan / customer / indicator of enrolled, active, approved, accepted, commenced, granted, entered or current; a concession or rebate type / applied / status / eligibility naming a scheme or approved / active / eligible; a concession card type naming the card; arrears, amount owing / overdue / outstanding, debt or balance owing with a dollar amount; late payment fees waived; a Centrepay deduction / reference / amount / arrangement; or a disconnection or de-energisation hold) OR a detail field (below). 85 tier requires the account field AND a hardship or concession field AND a detail field (payment plan, instalment, agreed payment or plan amount with a dollar value; a Pensioner Concession, pension, Health Care, DVA / Veteran Gold or Seniors card number with a CRN-shaped, DVA-file-shaped or alphanumeric value; a CRN / Centrelink customer reference number with a CRN-shaped value; a DVA file number; or a personal / customer / household circumstances, hardship reason or vulnerability note of several words) AND an independent energy-account term (electricity, gas, energy, retailer, bill, meter, kWh, tariff, NMI, MIRN). All enforce tiers AND NOT the shared template-exclusion dictionary and a policy/guidance/news exclusion (this policy, our hardship policy, published on our website, Customer Hardship Policy Guideline, standardised statements, Australian Energy Regulator, National Energy Retail Law, National Energy Retail Rules, you may be eligible, told reporters, said in a statement). 65 is discovery-only (primary phrase alone) and will surface policies, concession pages and news.
pattern: >-
  (?i)\b(?:hardship\s+(?:customers?|program(?:me)?s?|plans?|flags?|status|team|assessments?|applications?|arrangements?|cases?|payment\s+plans?)|(?:energy|electricity|gas)\s+(?:hardship|concessions?|rebates?)|(?:customer|financial|energy)\s+hardship\s+(?:record|note|referral)s?|Reticulated\s+Natural\s+Gas\s+Rebate|Home\s+Energy\s+Emergency\s+Assistance(?:\s+Scheme)?|HEEAS|Medical\s+Cooling\s+and\s+Heating\s+Electricity\s+Concession(?:\s+Scheme)?|MCHECS|concession\s+(?:card\s+(?:holder|details|number|type)|eligibility|status)|personal\s+circumstances\s+(?:note|notes|flag)|vulnerab(?:le|ility)\s+(?:customer|flag|indicator|marker|note)s?)\b
confidence: medium
confidence_justification: >-
  Medium: NERL/NERR hardship terms and the Queensland concession scheme names are distinctive, but every retailer must publish a hardship policy containing the AER guideline's standardised statements and concession pages list the same cards, so enforce tiers need a populated account field plus a populated hardship, concession or detail field, and policy, guideline and news wording is excluded. The CRN shape (nine digits and a letter) and DVA file number shape are reused from au-centrelink-crn and global-dva-file-number and have no checksum; retailer account numbers are organisation-defined, so account values are loose and placeholder-guarded. Water and council hardship records with the same fields can reach 75 here; the 85 tier needs energy-account evidence. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - National Energy Retail Law
  - National Energy Retail Rules
  - AER Customer Hardship Policy Guideline
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - financial
  - pii
  - government-id
corroborative_evidence:
  keywords:
    - hardship program
    - payment plan
    - Pensioner Concession Card
    - Health Care Card
    - Electricity Rebate
    - personal circumstances
    - Centrepay
    - NMI
  proximity: 300
customisation:
  - key: utility-account-number
    kind: identifier-format
    identifier: utility-account-number
    target: purview.regexes/Regex_au_energy_hardship_account_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the populated-field evidence with the customer's utility customer account number format (see docs/identifiers.md#utility-account-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Hardship program review - residential electricity\nCustomer number: 5502918844\nNMI: 3120456789\nHardship status: active\nConcession card type: Pensioner Concession Card\nConcession card number: 301 456 789K\nPayment plan amount: $35 per fortnight\nPersonal circumstances: recently widowed, caring for grandchild, reduced hours at work"
      description: Hardship review with customer number, NMI, status, concession card number, payment plan and circumstances note (85 tier)
      synthetic: true
    - value: "Account note - vulnerable customer\nAccount holder: Morgan Teston\nSupply address: 27 Banksia Street, Rockhampton QLD 4700\nRebate applied: Electricity Rebate\nDVA file number: QX123456\nArrears: $1,106.40. Gas and electricity accounts both placed on disconnection hold."
      description: Vulnerable customer note with account holder, supply address, rebate, DVA file number and arrears (85 tier)
      synthetic: true
    - value: "Customer hardship team referral\nAccount number: EA-7730-1182\nHardship program: enrolled 03/09/2026"
      description: Hardship referral with an account number and program status, no detail field (75 tier)
      synthetic: true
    - value: "Electricity Rebate eligibility check - customer number: 8841120937, card type: Health Care Card. Rebate will show on the next bill."
      description: Rebate eligibility check with a customer number and card type (75 tier)
      synthetic: true
  should_not_match:
    - value: "AER Customer Hardship Policy Guideline. Retailers must include the standardised statements, such as: We will offer you a payment plan that takes into account your capacity to pay. A retailer must inform a hardship customer of its hardship program. Hardship status: active customers are reported under the hardship program indicators."
      description: AER guideline text (excluded)
    - value: "Our hardship policy is published on our website. If you hold a Pensioner Concession Card or Health Care Card you may be eligible for the Electricity Rebate. Our hardship program can offer a payment plan, Centrepay and waiver of late payment fees."
      description: Retailer hardship policy page (65 only / excluded)
    - value: "Electricity Rebate application\nAccount holder: ______________\nNMI: __________\nConcession card number: __________\nCard type: [ ] Pensioner Concession Card [ ] Health Care Card\nPayment plan amount: $______"
      description: Blank rebate application (65 only)
    - value: "An energy retailer confirmed that concession card numbers and notes about customers' personal circumstances were accessed through an outsourced call centre, the company said in a statement."
      description: Breach news report (65 at most)
false_positives:
  - description: Published retailer hardship policies (NERL s 43) and the AER Customer Hardship Policy Guideline's standardised statements.
    mitigation: Policies describe the program without populated account fields; policy, guideline and Law/Rules wording is excluded.
  - description: Queensland Government concession pages and blank rebate application forms.
    mitigation: Placeholder-guarded fields; the shared template-exclusion dictionary and you may be eligible wording.
  - description: Water, council rates and telco hardship records with account and arrears fields.
    mitigation: These can reach 75 (same harm class); 85 needs an energy-account term. Water and council records are covered by au-qld-water-customer-hardship-restriction-record and au-qld-council-rates-concession-hardship-application.
  - description: News reports about utility breaches or hardship statistics.
    mitigation: Excluded on said in a statement and told reporters; news seldom carries populated account fields.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_energy_hardship_primary
      matches:
        - ref: Regex_au_energy_hardship_account_field
        - ref: Regex_au_energy_hardship_status_field
        - ref: Regex_au_energy_hardship_detail_field
        - ref: Keyword_au_energy_hardship_energy_account
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_energy_hardship_policy_exclusion
    - confidence_level: 75
      id_match: Regex_au_energy_hardship_primary
      matches:
        - ref: Regex_au_energy_hardship_account_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_energy_hardship_status_field
            - Regex_au_energy_hardship_detail_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_energy_hardship_policy_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_energy_hardship_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_energy_hardship_primary
      pattern: >-
        (?i)\b(?:hardship\s+(?:customers?|program(?:me)?s?|plans?|flags?|status|team|assessments?|applications?|arrangements?|cases?|payment\s+plans?)|(?:energy|electricity|gas)\s+(?:hardship|concessions?|rebates?)|(?:customer|financial|energy)\s+hardship\s+(?:record|note|referral)s?|Reticulated\s+Natural\s+Gas\s+Rebate|Home\s+Energy\s+Emergency\s+Assistance(?:\s+Scheme)?|HEEAS|Medical\s+Cooling\s+and\s+Heating\s+Electricity\s+Concession(?:\s+Scheme)?|MCHECS|concession\s+(?:card\s+(?:holder|details|number|type)|eligibility|status)|personal\s+circumstances\s+(?:note|notes|flag)|vulnerab(?:le|ility)\s+(?:customer|flag|indicator|marker|note)s?)\b
    - id: Regex_au_energy_hardship_account_field
      pattern: >-
        (?i)\b(?:(?:NMI|MIRN|National\s+Metering\s+Identifier)\s*[:#-]?\s*(?:\d{10,11}|[A-HJ-NP-Z]{2}[0-9A-HJ-NP-Z]{2}\d{6,7})\b|(?:customer|account)\s+(?:no\.?|number|ID)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9-]{4,15}\b|account\s+holder(?:\s+name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:service|supply|property|premises|site)\s+address\s*[:#]\s*(?:(?:Unit|Lot|Apt|Flat)\s+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?\s+[A-Z][A-Za-z'-]{1,30})
    - id: Regex_au_energy_hardship_status_field
      pattern: >-
        (?i)\b(?:hardship\s+(?:program(?:me)?|status|flag|plan|customer|indicator)\s*[:#-]\s*(?:enrolled|active|approved|yes|accepted|commenced|granted|entered|current)\b|(?:concession|rebate)(?:\s+(?:type|applied|status|approved|eligibility|scheme))?\s*[:#-]\s*(?:Electricity\s+Rebate|(?:Reticulated\s+Natural\s+)?Gas\s+Rebate|HEEAS|MCHECS|Home\s+Energy\s+Emergency|Medical\s+Cooling|applied|approved|active|eligible|yes)\b|(?:concession\s+)?card\s+type\s*[:#-]\s*(?:Pensioner\s+Concession|PCC|Health\s+Care|HCC|(?:DVA\s+|Veteran\s+)?Gold|Queensland\s+Seniors|ImmiCard)\b|(?:arrears|amount\s+(?:owing|overdue|outstanding)|debt|outstanding\s+balance|balance\s+owing)\s*[:#=-]\s*\$\s?\d|late\s+payment\s+fees?\s+waived|Centrepay\s+(?:deduction|reference|amount|arrangement)\s*[:#-]\s*(?:\$\s?\d|active|approved|commenced|(?=[A-Z]{0,4}\d)[A-Z0-9]{4,20}\b)|(?:disconnection|de-?energi[sz]ation)\s+(?:hold|block|on\s+hold|suspended)\b)
    - id: Regex_au_energy_hardship_detail_field
      pattern: >-
        (?i)\b(?:(?:payment\s+plan|instal(?:l)?ments?|agreed\s+(?:payment|instalment)|plan)(?:\s+amount)?\s*[:#-]\s*\$\s?\d|(?:(?:pensioner\s+)?concession\s+card|pension(?:er)?\s+card|health\s+care\s+card|(?:DVA\s+|veteran\s+)?gold\s+card|seniors\s+card)\s+(?:no\.?|number)\s*[:#]\s*(?:\d{3}\s?\d{3}\s?\d{3}\s?[A-Z]\b|[NVQSWATD][XKVGTASBM]?\s?\d{5,7}\b|(?=[A-Z]{0,3}\d)[A-Z0-9]{6,12}\b)|(?:CRN|Centrelink\s+(?:customer\s+)?reference\s+(?:no\.?|number)|customer\s+reference\s+number)\s*[:#]?\s*\d{3}\s?\d{3}\s?\d{3}\s?[A-Z]\b|DVA\s+file\s+(?:no\.?|number)\s*[:#]?\s*[NVQSWATD][XKVGTASBM]?\s?\d{5,7}\b|(?:(?:personal|customer|household)\s+circumstances(?:\s+(?:note|notes|details))?|reason\s+for\s+hardship|hardship\s+reason|vulnerability(?:\s+(?:note|details|type))?)\s*[:#-]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|select|insert)\b|_{2,}|\[|<)[A-Za-z][A-Za-z'-]{1,30}(?:[ \t,;]+[A-Za-z0-9$][A-Za-z0-9'/$.,-]{0,30}){2,15})
  keywords:
    - id: Keyword_au_energy_hardship_energy_account
      groups:
        - match_style: word
          terms:
            - electricity
            - gas
            - energy
            - retailer
            - bill
            - meter
            - text: kWh
              case_sensitive: true
            - tariff
            - text: NMI
              case_sensitive: true
            - text: MIRN
              case_sensitive: true
      strength: domain
    - id: Keyword_au_energy_hardship_policy_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - our hardship policy
            - published on our website
            - Customer Hardship Policy Guideline
            - standardised statements
            - Australian Energy Regulator
            - National Energy Retail Law
            - National Energy Retail Rules
            - you may be eligible
            - told reporters
            - said in a statement
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier identifies an energy retail customer's hardship, payment plan, concession or vulnerability record that links an account holder, account number, NMI or supply address to financial hardship status, arrears, concession card or Centrelink/DVA numbers and free-text notes about personal circumstances such as bereavement, illness, caring duties or job loss. This is the incident class seen when a retailer's outsourced call centre was compromised and circumstances notes and government concession numbers were exposed. Disclosure exposes financial vulnerability and health or family circumstances and enables targeted scams against vulnerable customers. Policies, the AER guideline, blank applications and news are excluded. Risk 7 supports OFFICIAL: Sensitive / SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because the
    record links an account holder and NMI to arrears, concession or Centrelink numbers and notes on bereavement,
    illness or job loss. PROTECTED is not met for a single customer file, though the notes make vulnerable customers
    scam targets.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling covers financial hardship status, concession numbers and circumstance notes for
      one customer. High would require bulk vulnerability data.
references:
  - title: AEMC - National Energy Retail Rules v37 (full), Part 3 Customer hardship (rr 70A-75B; r 70A and r 75B refer to NERL ss 43-45)
    url: https://energy-rules.aemc.gov.au/storage/rules/ea1906d07927e4ba3bf5da59bf1d891308cfabda/assets/files/NERR%20-%20v37%20-%20Full.pdf
  - title: AER - Customer Hardship Policy Guideline (Version 1, March 2019)
    url: https://www.aer.gov.au/system/files/2025-02/AER%20-%20Customer%20Hardship%20Policy%20Guideline%20March%202019.pdf
  - title: AER - Customer hardship policies
    url: https://www.aer.gov.au/industry/retail/customer-hardship-policies
  - title: Queensland Government - Electricity and gas rebates (Electricity Rebate, Reticulated Natural Gas Rebate, Home Energy Emergency Assistance Scheme, Medical Cooling and Heating Electricity Concession Scheme; eligible cards)
    url: https://www.qld.gov.au/community/cost-of-living-support/concessions/energy-concessions/electricity-gas-rebates
