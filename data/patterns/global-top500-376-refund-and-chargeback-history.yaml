schema: testpattern/v1
name: Refund and chargeback history
slug: global-top500-376-refund-and-chargeback-history
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects refund and chargeback histories: a refund/chargeback/dispute history phrase combined with populated dispute data - rows keyed by an order or customer identifier, labelled chargeback amounts, reason codes, ARNs or dispute IDs, masked card numbers or labelled customer identifiers. Phrase-only mentions (refund policies) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: refund and chargeback history, refund/chargeback/dispute history/record(s)/log/report(s)/register, chargeback case/file, credit note(s). 65 (discovery only): primary alone. 75: primary plus one populated structure - a delimited data row keyed by an order/customer identifier with a numeric value, a labelled chargeback amount/date/reason/ID, reason code, dispute ID/date/amount, ARN, refund amount/date/ID or credit note number, a masked card number (e.g. 4564 **** **** 1123), or a labelled customer/account/order/merchant ID. 85: primary plus two distinct structures (the four above or a delimited column header pairing an order/customer ID column with refund, chargeback, reason code, dispute, ARN or outcome columns) plus dispute evidence (friendly fraud, serial refunder, goods not received, not as described, representment, pre-arbitration, cardholder dispute, refund abuse, issuer, acquirer). Template/sample framing and guidance/help/news/training framing are excluded on every enforce tier.
pattern: (?i)\b(?:refund\s+and\s+chargeback\s+history|(?:refund|chargeback|dispute)\s+(?:history|records?|log|reports?|register)|chargebacks?\s+(?:case|file)|credit\s+notes?)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated dataset structure (a data row keyed by a customer/record identifier, a labelled value or a labelled identifier) beside the topic phrase; a column header on its own only counts toward 85, so blank extracts stay at 65. Help pages, policies, product copy and news that only name the topic stay at 65. Medium because internal analytics documentation with worked examples can still reach 75.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Competition and Consumer Act 2010 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - friendly fraud
    - serial refunder
    - goods not received
    - not as described
    - representment
    - pre-arbitration
    - cardholder dispute
    - refund abuse
    - issuer
    - acquirer
  proximity: 300
test_cases:
  should_match:
    - value: "Refund and chargeback history - customer 88104421\norder_id,refund_amount,chargeback_amount,reason_code,dispute_date,case_status\nSO-771904,0.00,189.90,4853,2026-08-19,representment\nSO-771955,34.95,0.00,,2026-09-03,refunded\nCard 4564 **** **** 1123. Flagged as possible serial refunder."
      description: Dispute extract - header, order rows, masked card and dispute evidence (85)
      synthetic: true
    - value: "Chargeback case\nChargeback amount: $189.90\nReceived on 19/08/2026."
      description: Single labelled chargeback amount (75)
      synthetic: true
  should_not_match:
    - value: "Help centre article: customers can view their refund history in the app. Our refund policy explains how chargeback disputes are handled; keep receipts for 12 months."
      description: Refund policy / help article
      synthetic: true
    - value: "Chargeback case\nChargeback amount: $________\nReason code: __________\nCase ID: __________"
      description: Blank case form - placeholder values
      synthetic: true
    - value: "Merchants reported chargeback records rising 18% this year as refund abuse grew, according to a news report."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Privacy notices, help-centre articles, product pages and policies describing refunds and chargebacks.
    mitigation: They name the topic without populated rows, labelled values or identifiers, and guidance/help framing is excluded, so they stay at 65.
  - description: Analytics training material and documentation with worked examples of refunds and chargebacks.
    mitigation: Training and template framing is excluded; unframed worked examples with realistic rows can still reach 75.
  - description: News and industry commentary with aggregate statistics.
    mitigation: Aggregate percentages are not keyed to a record identifier, so they do not satisfy the row or labelled-value structures.
  - description: Supplier credit notes in accounts payable.
    mitigation: "'credit note' is a discovery-only primary; enforce tiers need populated dispute structure."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_refund_chargeback_history
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_376_refund_and_chargeback_history_column_header
            - Regex_global_top500_376_refund_and_chargeback_history_data_row
            - Regex_global_top500_376_refund_and_chargeback_history_labelled_value
            - Regex_global_top500_376_refund_and_chargeback_history_identifier
            - Regex_global_top500_376_refund_and_chargeback_history_masked_card
        - ref: Keyword_global_top500_376_refund_and_chargeback_history_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_376_refund_and_chargeback_history_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_refund_chargeback_history
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_376_refund_and_chargeback_history_data_row
            - Regex_global_top500_376_refund_and_chargeback_history_labelled_value
            - Regex_global_top500_376_refund_and_chargeback_history_identifier
            - Regex_global_top500_376_refund_and_chargeback_history_masked_card
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_376_refund_and_chargeback_history_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_refund_chargeback_history
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_refund_chargeback_history
      pattern: (?i)\b(?:refund\s+and\s+chargeback\s+history|(?:refund|chargeback|dispute)\s+(?:history|records?|log|reports?|register)|chargebacks?\s+(?:case|file)|credit\s+notes?)\b
    - id: Regex_global_top500_376_refund_and_chargeback_history_column_header
      pattern: (?i)\b(?:(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:refund(?:[ _]?(?:amount|date|reason|id))?|chargeback(?:[ _]?(?:amount|date|reason))?|reason[ _]?code|dispute[ _]?(?:id|date|status)|arn|case[ _]?status|outcome)|(?:refund(?:[ _]?(?:amount|date|reason|id))?|chargeback(?:[ _]?(?:amount|date|reason))?|reason[ _]?code|dispute[ _]?(?:id|date|status)|arn|case[ _]?status|outcome)\b\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,200}?(?:[,;\t]|\|[ \t]{0,2}))?\"?(?:customer|cust|client|member|account|acct|user|subscriber|visitor|device|contact|caller|txn|transaction|order|case|ticket|participant|subject|specimen|record|contract|profile)[ _]?(?:id|no|number|key|ref|hash))\b
    - id: Regex_global_top500_376_refund_and_chargeback_history_data_row
      pattern: (?i)\b[A-Z]{0,5}[-_]?\d{4,12}\"?(?:[,;\t]|[ \t]{0,2}\|[ \t]{0,2})(?:[^\n]{0,160}?(?:[,;\t]|\|[ \t]{0,2}))?\"?-?\$?\d{1,12}(?:\.\d{1,6})?%?(?![\w.])
    - id: Regex_global_top500_376_refund_and_chargeback_history_labelled_value
      pattern: (?i)\b(?:chargeback\s+(?:amount|date|reason|ID|ref(?:erence)?)|reason\s+code|dispute\s+(?:ID|date|amount|reason)|ARN|refund\s+(?:amount|date|ID|reason)|credit\s+note\s*(?:no\.?|number)|case\s+(?:ID|number))[ \t]{0,3}[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9$][A-Za-z0-9 $.,/-]{1,40}
    - id: Regex_global_top500_376_refund_and_chargeback_history_identifier
      pattern: (?i)\b(?:customer\s*(?:no\.?|number|ID)|account\s*(?:no\.?|number|ID)|order\s*(?:no\.?|number|ID)|merchant\s+ID)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?=[A-Za-z-]{0,8}\d)[A-Za-z0-9][A-Za-z0-9._@-]{3,64}
    - id: Regex_global_top500_376_refund_and_chargeback_history_masked_card
      pattern: \b(?:\d{4}|\d{6})[ -]?(?:[*xX•]{2,8}[ -]?){1,3}\d{4}\b
  keywords:
    - id: Keyword_global_top500_376_refund_and_chargeback_history_domain_evidence
      groups:
        - match_style: word
          terms:
            - friendly fraud
            - serial refunder
            - goods not received
            - not as described
            - representment
            - pre-arbitration
            - cardholder dispute
            - refund abuse
            - issuer
            - acquirer
      strength: domain
    - id: Keyword_global_top500_376_refund_and_chargeback_history_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - our refund policy
            - keep receipts
      strength: noise
risk_description: >-
  This detector finds customer histories of refunds, credit notes, and chargebacks across a period. Leakage can reveal disputes, purchasing patterns, merchant relationships, and possible fraud indicators, allowing targeted scams or unfair adverse treatment. The normal record profiles one customer or account and can cause serious privacy and financial harm, though it does not provide card credentials or authority to initiate a refund. Risk 8 and SENSITIVE are justified; bulk merchant data, payment credentials, or an active fraud operation would increase the impact. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and Personal-Privacy because a dispute history reveals
    customer behaviour, allegations, and consequential merchant decisions. PROTECTED is not met without active payment
    credentials, broad fraud-system exposure, or significant portfolio-wide financial damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Refund and chargeback histories are generically Medium with Medium Personal-Privacy handling because linked
      disputes can influence fraud treatment and reveal sensitive customer or merchant conduct.
created: '2026-02-08'
updated: '2026-09-25'
changelog:
  - version: 1.4.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs a populated order/customer dispute row, labelled chargeback/refund value, masked card number or labelled customer ID and 85 needs two distinct structures (header counts only toward 85) plus dispute evidence. Removed the self-corroborating evidence group (generic words such as history, customer, commercial, transaction). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA, My Health Records Act and TIA Act; added Competition and Consumer Act 2010 (Cth) (consumer refunds).
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 963 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
