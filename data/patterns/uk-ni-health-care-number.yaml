schema: testpattern/v1
name: "UK Northern Ireland Health and Care (H&C) Number"
slug: uk-ni-health-care-number
version: 1.0.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects 10-digit Northern Ireland Health and Care (H&C) Numbers allocated by HSC Northern Ireland in the dedicated 320 000 0000 to 399 999 9999 range, completing UK four-nations health-ID coverage alongside uk-nhs-number (England/Wales/Isle of Man) and uk-chi-number (Scotland). Enforces the exact Modulo-11 check digit via dual inline Purview Checksum validators.
operation: >-
  Matches 10-digit numbers beginning 32-39 (compact or 3-3-4 grouped) and validates all 10 digits with dual Mod-11 Checksum validators (1,2,3,4,5,6,7,8,9,0 + 2,4,6,8,10,1,3,5,7,10 / Mod 11 / CheckDigit 10) so invalid remainder-10 values ending in 0 are rejected.
pattern: '\b(3[2-9]\d[\s-]?\d{3}[\s-]?\d{4})\b'
confidence: high
confidence_justification: >-
  High confidence: constraining the leading two digits to Northern Ireland's allocated 32-39 range plus exact dual Modulo-11 checksum validation eliminates >98% of random 10-digit numbers.
jurisdictions:
  - uk
regulations:
  - "UK GDPR"
  - "Data Protection Act 2018 (UK)"
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - phi
  - pii
  - health
  - government-id
corroborative_evidence:
  keywords:
    - "Health and Care Number"
    - "H&C Number"
    - "HSC Northern Ireland"
    - "HSCNI"
    - "Belfast Health"
    - "patient"
  proximity: 300
test_cases:
  should_match:
    - value: "321 456 7896"
      description: "Valid Northern Ireland H&C Number in 3-3-4 format (Mod-11 check digit 6)"
    - value: "H&C Number: 345-123-4564"
      description: "Labelled valid NI Health and Care Number (Mod-11 check digit 4)"
    - value: "3801234568"
      description: "Compact 10-digit valid NI Health and Care Number (Mod-11 check digit 8)"
  should_not_match:
    - value: "485 777 3456"
      description: "Starts with 48 (England/Wales NHS range, not Northern Ireland 32-39 range)"
    - value: "321 456 7890"
      description: "Fails Modulo-11 check digit"
    - value: "Provide your Health and Care Number when registering with an HSC GP practice"
      description: "Prose instruction without a 10-digit H&C number"
    - value: "320 000 0040"
      description: "Never-issued remainder-10 H&C number ending in 0 — rejected by Validator_uk_ni_hc_rem10"
    - value: "Sample template: placeholder example record for training only"
      description: "Template/sample fixture suppressed by shared exclusion dictionary"
false_positives:
  - description: "Ten-digit reference numbers starting 32-39 that coincidentally pass Mod-11."
    mitigation: "Enforcing tiers require HSC / Health and Care / clinical patient keywords within 300 characters."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 7
risk_description: >-
  The detector matches a checksum-valid 10-digit Northern Ireland Health and Care (H&C) Number in healthcare context. Like an England/Wales NHS Number or Scottish CHI Number, an H&C Number is the lifelong patient identifier across HSC Northern Ireland hospitals, GP practices, and social-care services. Risk 7 and SENSITIVE Personal-Privacy match uk-nhs-number and uk-chi-number.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: "CUI Specified"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "CONFIDENTIAL"
  ca_gov: "Protected B"
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy, and Medium because a Northern Ireland Health and Care Number is a national patient health identifier linking clinical and social-care records across HSCNI.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling reflects a national health-care identifier linking an identifiable patient across HSC Northern Ireland.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_uk_ni_hc
      matches:
        - ref: Keyword_uk_ni_hc_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_uk_ni_hc
      matches:
        - ref: Keyword_uk_ni_hc_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_uk_ni_hc
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_uk_ni_hc
      pattern: '\b(3[2-9]\d[\s-]?\d{3}[\s-]?\d{4})\b'
      validators:
        - ref: Validator_uk_ni_hc_checksum
        - ref: Validator_uk_ni_hc_rem10
  validators:
    - id: Validator_uk_ni_hc_checksum
      type: Checksum
      params:
        - name: Weights
          value: 1, 2, 3, 4, 5, 6, 7, 8, 9, 0
        - name: Modulo
          value: '11'
        - name: CheckDigit
          value: '10'
    - id: Validator_uk_ni_hc_rem10
      type: Checksum
      params:
        - name: Weights
          value: 2, 4, 6, 8, 10, 1, 3, 5, 7, 10
        - name: Modulo
          value: '11'
        - name: CheckDigit
          value: '10'
  keywords:
    - id: Keyword_uk_ni_hc_specific
      groups:
        - match_style: word
          terms:
            - "Health and Care Number"
            - "H&C Number"
            - "H&C no"
            - "HSC Northern Ireland"
            - "HSCNI"
            - "Business Services Organisation"
      strength: specific
    - id: Keyword_uk_ni_hc_broad
      groups:
        - match_style: word
          terms:
            - "patient"
            - "medical record"
            - "GP practice"
            - "hospital"
            - "referral"
            - "Northern Ireland"
      strength: domain
  filters:
    - id: Filter_uk_ni_hc_same_digits
      type: AllDigitsSameFilter
references:
  - url: https://online.hscni.net/my-health-and-care-number/
    title: "HSC Northern Ireland - Health and Care (H&C) Number specification"
created: '2026-11-25'
updated: '2026-11-25'
changelog:
  - version: 1.0.0
    date: '2026-11-25'
    description: Initial release.
author: testpattern-community
