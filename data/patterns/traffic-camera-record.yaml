schema: testpattern/v1
name: Traffic Camera Record
slug: traffic-camera-record
version: 1.5.0
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects traffic camera and speed camera infringement records containing driver identification details, vehicle registration, and photographic evidence references, and automatic number plate recognition (ANPR / ALPR) read records that place a plate at a camera site, lane, direction and time. These records link specific vehicles and individuals to locations and traffic offences via camera evidence under the Transport Operations (Road Use Management) Act 1995 (Qld). Absorbs the former automated-plate-reader-data classifier.
operation: >-
  Primary: camera phrases (traffic / speed / red light camera record, detection or infringement, infringement notice, penalty infringement notice, registered operator, automatic number plate recognition, ANPR, ALPR, plate reader / plate read). 65 = phrase only (discovery). 75 = phrase plus one populated camera read field (plate / registration / rego / VRM, camera / site / reader ID, lane, direction of travel, read / capture time, timestamp) or a labelled infringement notice number. 85 = phrase plus two distinct read fields, or two different independent evidence types (read fields, notice number, penalty-process terms such as demerit points, enforcement order, km/h, fine). Road safety campaigns, published camera location lists, reviews and statistics excluded.
pattern: (?i)\b(?:traffic\s+camera\s+(?:record|image|evidence)|speed\s+camera\s+(?:detection|infringement)|red\s+light\s+camera\s+(?:detection|infringement)|infringement\s+notice|registered\s+operator|penalty\s+infringement\s+notice|automatic\s+(?:number|licen[cs]e)\s+plate\s+recognition|ANPR|ALPR|(?:number|licen[cs]e)\s+plate\s+(?:recognition|readers?)|plate\s+(?:reads?|readers?))\b
confidence: medium
confidence_justification: >-
  Medium confidence: requires camera terminology with populated vehicle / site read fields or a labelled notice number; notice-number formats are unpublished, so the reference is a documented label-anchored fallback.
jurisdictions:
  - au
regulations:
  - "SPER Act 1999 (Qld)"
  - "TORUM Act 1995 (Qld)"
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - SENSITIVE
    - Legal
    - traffic camera
    - speed camera
    - red light camera
    - infringement notice
    - registered operator
    - vehicle registration
    - penalty infringement
    - TMR
    - Department of Transport
    - SPER
    - camera evidence
    - demerit points
  proximity: 300
  keyword_lists:

    - law-enforcement

    - government-services
    - en-government-classification
customisation:
  - key: infringement-notice-number
    kind: identifier-format
    identifier: infringement-notice-number
    target: purview.regexes/Regex_traffic_camera_record_infringement_notice_number
    mode: replace
    affects_tiers: [75, 85]
    required_for_enforcement: false
    note: Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#infringement-notice-number). Earlier versions used the TIN-YYYY-XXX-NNNNNN / PIN-YYYY-NNNNNNN notice format, which does not appear in any published source.
test_cases:
  should_match:
    - value: 'SENSITIVE Legal. Traffic Camera Infringement Record. Infringement Notice Number: 2026084291. Camera Site: Pacific Motorway southbound, Eight Mile Plains (Site ID: 4127). Detection: Speed camera — 118 km/h in 100 km/h zone. Date/Time: 14 February 2026, 08:42:17. Vehicle: White Toyota Hilux, registration 123ABC (QLD). Registered Operator: [Name], [Address], Upper Mount Gravatt QLD 4122. Penalty: $287 fine, 1 demerit point. Image reference: CAM-4127-20260214-084217.jpg.'
      description: Speed camera infringement with registered operator details and camera evidence (reaches 85)
    - value: 'Department of Transport and Main Roads — Penalty Infringement Notice. Infringement notice number: 260057823. Red light camera detection at intersection of Ipswich Road and Annerley Road, Woolloongabba. Camera site ID: 2089. Vehicle: registration 456DEF (QLD), silver Mazda 3. Registered operator: [Name], [Address], Coorparoo QLD 4151. Offence: Fail to stop at red traffic light — Transport Operations (Road Use Management) Act 1995 s.79. Demerit points: 3. Fine: $575. Statutory declaration option available.'
      description: Red light camera infringement with driver identification and statutory reference (reaches 85)
    - value: 'SPER Enforcement — Outstanding Traffic Camera Infringement. Original infringement notice number: 2025041872. Registered operator [Name] of [Address], Aitkenvale QLD 4814. Speed camera detection: 134 km/h in 110 km/h zone, Bruce Highway northbound at Bowen (Site ID: 7341). Original fine: $287 plus 1 demerit point. SPER enforcement order issued: additional $113.15 enforcement fee. Total amount due: $400.15. Payment required within 28 days or enforcement warrant may issue.'
      description: SPER enforcement of outstanding camera infringement with escalated penalties (reaches 85)
    - value: "ANPR read record\nPlate: 123ABC (QLD)\nRead time: 14/02/2026 08:42:17\nCamera ID: ANPR0412\nSite: Gateway Motorway, Nudgee\nLane: 2\nDirection: Southbound\nHotlist: unregistered vehicle"
      description: ANPR read record with plate, read time, camera ID, lane and direction (85, absorbed plate-reader scope)
      synthetic: true
    - value: "Automatic number plate recognition search - registration 987XYZ (QLD). 3 reads returned. First read 03/03/2026 07:12, Gateway Motorway northbound, site ID: GM0217."
      description: ANPR search result placing a registration at a camera site with one labelled site ID (75)
      synthetic: true
  should_not_match:
    - value: The Queensland Government published its updated list of fixed speed camera and red light camera locations across the state. The 2026 list includes 142 fixed camera sites and 87 mobile camera deployment zones.
      description: Published camera location list from government
    - value: 'Road Safety Week 2026: The Department of Transport and Main Roads reminded drivers that speed cameras save lives. Last year, camera-detected offences decreased by 8.2% across Queensland, with 1.2 million infringement notices issued.'
      description: Road safety campaign with aggregate infringement statistics
    - value: A motoring magazine reviewed the latest speed camera detection technology, noting that Queensland has deployed point-to-point cameras on sections of the Bruce Highway.
      description: Motoring magazine article about camera technology
    - value: The Queensland Police Service uses automatic number plate recognition (ANPR) cameras to detect unregistered and stolen vehicles. ANPR read data is retained for a limited period under the ANPR procedures.
      description: Public explanation of ANPR use without any read record (discovery only)
    - value: Our ANPR camera reads plates at up to 250 km/h across three lanes and reports direction of travel for every capture.
      description: Vendor product copy about an ANPR camera - speed and lane vocabulary without populated read fields (discovery only)
    - value: "Camera detected offence notice — transfer form\nInfringement notice number: __________\nRegistration: __________\nSite ID: __________"
      description: Blank notice transfer form (must stay below 75)
false_positives:
  - description: Published speed camera and red light camera location lists
    mitigation: 'Negative keyword exclusion: ''camera locations'', ''location list'', ''site list'', ''published list'''
  - description: Road safety campaigns with aggregate infringement statistics
    mitigation: 'Negative keyword exclusion: ''road safety'', ''campaign'', ''save lives'', ''decreased by'''
  - description: Motoring magazine articles about camera technology
    mitigation: 'Negative keyword exclusion: ''magazine'', ''review'', ''technology'', ''deployed'''
  - description: TMR annual reports with traffic enforcement statistics
    mitigation: 'Negative keyword exclusion: ''annual report'', ''statistics'', ''published'', ''reporting period'''
  - description: ANPR / plate-reader explainers, procedures and vendor product copy
    mitigation: Phrase-only matches stay at the 65 discovery tier; enforce tiers need a populated read field (plate, camera / site ID, lane, direction, read time) or a notice reference.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_traffic_camera_record_camera_infringement_terms
      matches:
        - ref: Regex_traffic_camera_record_read_fields
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_traffic_camera_record_exclusion
    - confidence_level: 85
      id_match: Pattern_traffic_camera_record_camera_infringement_terms
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_traffic_camera_record_read_fields
            - Regex_traffic_camera_record_infringement_notice_number
            - Evidence_traffic_camera_record_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_traffic_camera_record_exclusion
    - confidence_level: 75
      id_match: Pattern_traffic_camera_record_camera_infringement_terms
      matches:
        - type: any
          refs:
            - Regex_traffic_camera_record_read_fields
            - Regex_traffic_camera_record_infringement_notice_number
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_traffic_camera_record_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_traffic_camera_record_camera_infringement_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_traffic_camera_record_exclusion
  regexes:
    - id: Pattern_traffic_camera_record_camera_infringement_terms
      pattern: (?i)\b(?:traffic\s+camera\s+(?:record|image|infringement)|speed\s+camera\s+(?:detection|infringement)|red\s+light\s+camera\s+(?:detection|infringement)|penalty\s+infringement\s+notice|automatic\s+(?:number|licen[cs]e)\s+plate\s+recognition|ANPR|ALPR|(?:number|licen[cs]e)\s+plate\s+(?:recognition|readers?)|plate\s+(?:reads?|readers?))\b
    - id: Regex_traffic_camera_record_read_fields
      pattern: >-
        (?i)\b(?:(?:(?:(?:number|licen[cs]e|registration)\s+)?plate(?:\s+(?:no\.?|number|read))?|registration(?:\s+(?:no\.?|number))?|rego|VRM)\s*[:#]\s*(?!(?:n/?a|none|unknown|tbc|tba|withheld|the|a|an|any|all|see|refer)\b|_{2,}|\[|<)[A-Z0-9]{1,4}[ -]?[A-Z0-9]{1,5}\b|(?:camera|site|reader|detector|device)\s*(?:ID|no\.?|number|code)\s*[:#]\s*(?!(?:n/?a|none|unknown|tbc|tba|the|a|an|any|all|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/-]{1,20}|lane(?:\s*(?:no\.?|number))?\s*[:#]\s*\d{1,2}\b|direction(?:\s+of\s+travel)?\s*[:#]\s*(?:(?:north|south|east|west)(?:bound)?|inbound|outbound|[NSEW]B)\b|(?:read|capture|detection|passage)\s+(?:time|date(?:\s*/\s*time)?|timestamp)\s*[:#]\s*\d{1,4}[/.-]\d{1,2}|timestamp\s*[:#]\s*\d{1,4}[/.-]\d{1,2})
    - id: Regex_traffic_camera_record_infringement_notice_number
      pattern: >-
        (?i)\b(?:(?:penalty\s+)?infringement\s+notice|camera[\s-]+detected\s+offence\s+notice|offence\s+notice|notice)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{5,20}\b
  keywords:
    - id: Evidence_traffic_camera_record_corroborative_terms
      groups:
        - match_style: word
          terms:
            - vehicle registration
            - demerit points
            - camera site
            - image reference
            - statutory declaration
            - enforcement order
            - enforcement fee
            - enforcement warrant
            - km/h
            - fine
            - penalty
      strength: specific
    - id: Filter_traffic_camera_record_exclusion
      groups:
        - match_style: word
          terms:
            - camera locations
            - location list
            - site list
            - published list
            - road safety
            - campaign
            - save lives
            - decreased by
            - magazine
            - review
            - technology
            - deployed
            - annual report
            - statistics
            - published

      strength: noise
risk_rating: 7
risk_description: >-
  This detector finds a traffic or speed-camera infringement record linking a registered operator or identified driver to a vehicle, location, timestamp, measured conduct, image reference, notice, and penalty, or an ANPR read record placing a plate at a camera site, lane and direction at a given time. Disclosure can reveal a person's movements and alleged offence, expose an address or registration, and support harassment or fraudulent social engineering around a genuine infringement. Published camera locations, road-safety campaigns, motoring articles, and aggregate enforcement statistics are excluded, so the normal match is an attributed administrative enforcement record. Risk 7 supports SENSITIVE Legal; PROTECTED would require protected-location tracking, systematic movement surveillance, or compromise of a large enforcement repository.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
references:
  - title: Transport Operations (Road Use Management) Act 1995 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1995-009
  - title: Queensland Revenue Office — About fines in Queensland
    url: https://qro.qld.gov.au/fines-and-infringements/about/
created: '2026-03-06'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): removed the invented TIN-YYYY-XXX-NNNNNN notice-reference detector family (a primary with its own 65/75/85 tiers), the invented PIN-YYYY-NNNNNNN regex and the invented SC-/RLC-NNNN camera-site regex (camera / site IDs are already covered by the labelled read fields); a labelled infringement notice number now uses the new infringement-notice-number fallback (identifier-format slot); 75 = camera phrase + a populated read field or a labelled notice number; 85 = two distinct read fields, or two different evidence types (read fields, notice number, penalty-process terms); tests converted to labelled notice numbers and site IDs with a blank-form decoy; references added.'
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Merge global-top500-409-automated-plate-reader-data into this classifier (Qld government classifier review 2026-09-24): camera-phrase regex gains automatic number / licence plate recognition, ANPR, ALPR, number / licence plate recognition / reader and plate read(er), and becomes a second primary family (65 phrase / 75 plus one populated read field, TIN / PIN reference or camera site ID / 85 plus two read fields or two independent evidence types). New Regex_..._read_fields recognises populated ANPR read-record fields: plate / registration / rego / VRM, camera / site / reader ID, lane, direction of travel, read / capture time and timestamp. TIN-reference 85 tier simplified (it required TIN and PIN references, site ID and every keyword group at once, and no test reached it) to camera keyword plus one of read fields, penalty-process terms or a PIN reference; "registered operator" removed from the corroborative list because it is already a primary keyword. Not imported: bare licence plate, number plate, registration plate, plate number, vehicle tracking and vehicle identification (everyday vehicle-sale / insurance vocabulary) and the absorbed self-corroborating label/domain tiers. Added an 85 ANPR read record, a 75 ANPR search result, and ANPR explainer and vendor-copy decoys. Risk unchanged at 7 (ANPR read records of a single vehicle are an administrative movement record; the absorbed classifier rated 8 for bulk tracking data, noted but not adopted).'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1504 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
