    url: https://www.legislation.gov.au/F1996B00580/2024-07-01/2024-07-01/text/original/epub/OEBPS/document_1/document_1.html
  - title: Superannuation Industry (Supervision) Act 1993 (Cth)
    url: https://www.legislation.gov.au/Series/C2004A04633
  - title: The Hacker News - ShinyHunters exploits Oracle PeopleSoft (HCM dependant and beneficiary details exposed)
    url: https://thehackernews.com/2026/06/shinyhunters-exploits-oracle-peoplesoft.html
  - title: BleepingComputer - Australian pension funds hit by wave of credential stuffing attacks
    url: https://www.bleepingcomputer.com/news/security/australian-pension-funds-hit-by-wave-of-credential-stuffing-attacks/
