updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: >-
      Initial release - binding / non-binding death benefit nominations (SIS Regulations reg 6.17A),
      employer group life beneficiary nominations and HR dependant / next of kin / emergency contact
      records. 65 phrase only; 75 needs a populated member / employee field plus a named beneficiary or
      dependant with a relationship; 85 adds a share / percentage, date of birth or witness detail. PDS,
      guide, policy and legislation wording excluded. Member and employee numbers matched by label
      only (identifier slots super-member-number and employee-id).
