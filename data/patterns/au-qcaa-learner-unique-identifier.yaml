{
  "schema": "testpattern/v1",
  "name": "Queensland Learner Unique Identifier (LUI)",
  "slug": "au-qcaa-learner-unique-identifier",
  "version": "1.0.2",
  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated queensland learner unique identifier (lui) using record context and corroborating fields.",
  "pattern": "(?i)\\b(?:LUI|learner unique identifier)[ \\t]*[:#][ \\t]*(?!0{10}\\b|1{10}\\b)\\d{10}\\b",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au",
    "au-qld"
  ],
  "regulations": [
    "Education (Queensland Curriculum and Assessment Authority) Act 2014 (Qld)",
    "Information Privacy Act 2009 (Qld)",
    "Privacy Act 1988 (Cth)"
  ],
  "frameworks": [
    "ISO 27001",
    "ISO 27701"
  ],
  "data_categories": [
    "education",
    "pii"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated queensland learner unique identifier (lui) can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://www.qcaa.qld.edu.au/senior/certificates-and-qualifications/qce/learning-accounts"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE Personal-Privacy"
  },
  "package_tags": {
    "primary_component": "student-child-records",
    "components": [
      "student-child-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "privacy"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)\\b(?:LUI|learner unique identifier)[ \\t]*[:#][ \\t]*(?!0{10}\\b|1{10}\\b)\\d{10}\\b"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)\\b(?:QCAA|Queensland Curriculum and Assessment Authority|QCE|QCIA|learning account)\\b"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      }
    ]
  },
  "test_cases": {
    "should_match": [
      {
        "value": "QCAA learning account\nStudent name: Avery Teston\nLUI: 2746183950\nQCE enrolment status: Active",
        "description": "Synthetic populated record variant 1",
        "synthetic": true
      },
      {
        "value": "Student ID: RG20451\nLearner Unique Identifier: 9361827405\nLearning account results are available through QCAA.",
        "description": "Synthetic populated record variant 2",
        "synthetic": true
      },
      {
        "value": "QCAA learning account\nStudent name: Avery Teston\nLUI: 2746183950\nQCE enrolment status: Active\nForm template version 2.1. Retain the completed record.",
        "description": "Synthetic populated record variant 3",
        "synthetic": true
      },
      {
        "value": "Student ID: RG20451\nLearner Unique Identifier: 9361827405\nLearning account results are available through QCAA.",
        "description": "Synthetic populated record variant 4",
        "synthetic": true
      }
    ],
    "should_not_match": [
      {
        "value": "Student name: Avery Teston\nUSI: 2746183950\nQCAA learning account enrolment",
