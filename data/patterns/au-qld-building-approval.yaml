schema: testpattern/v1
name: QLD Building Approval
slug: au-qld-building-approval
version: 1.5.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies Queensland building approvals, permits, certifications, development applications and decision notices. Topic phrases are retained for discovery; enforcement requires populated approval-record fields (applicant, property, certifier, decision date, application number), and high confidence adds a second field plus decision or authority context.
operation: >-
  Pattern_building_approval recognises building-approval and development-application topics. 65 = topic only (discovery). 75 = topic plus a populated approval-record field (applicant, owner, property/site address, lot on plan, assessment manager, certifier, decision/approval date, building class, application number) or a labelled application number. 85 = topic plus two distinct populated record fields plus decision or authority evidence (decision notice, conditions of approval, approved works, QBCC, Building Act 1975 ...). Templates and training examples are excluded from every tier.
pattern: >-
  (?i)\b(?:Queensland\s+building\s+approval|building\s+(?:approval|permit|certification)|development\s+(?:permit|application)|planning\s+(?:permit|approval)|occupancy\s+certificate|compliance\s+certificate)\b
confidence: medium
confidence_justification: >-
  Medium confidence: enforcement requires populated approval-record fields; council and certifier application numbers are customer-defined, so the reference is a documented label-anchored fallback.
jurisdictions:
  - au
regulations:
  - Building Act 1975 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Planning Act 2016 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
  - QGISCF
data_categories:
  - government
  - infrastructure
customisation:
  - key: council-development-application-number
    kind: identifier-format
    identifier: council-development-application-number
    target: purview.regexes/Regex_building_application_reference
    mode: replace
    affects_tiers: [75]
    required_for_enforcement: false
    note: Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#council-development-application-number). Earlier versions used the BA######## / DA/YYYY/NNNN application format, which does not appear in any published source.
test_cases:
  should_match:
    - value: "Decision notice — building approval\nApplication number: A006123456\nApplicant: Harbour Build Pty Ltd\nProperty address: 14 Wattlebird Street, Stafford QLD 4053\nBuilding certifier: Jordan Staffson (licence A1234567)\nConditions of approval: approved works limited to a Class 1a dwelling extension."
      description: 'Populated decision notice: application number, applicant, address and certifier plus conditions of approval (reaches 85)'
      synthetic: true
    - value: "Development permit issued\nApplication number: MCU/2026/0412\nRefer to the attached plans."
      description: Labelled application number with a development-permit primary (reaches 75)
      synthetic: true
    - value: Queensland building approval
      description: Topic phrase only (65 discovery)
  should_not_match:
    - value: Approval to proceed with the project
      description: Generic approval outside building regulation
    - value: Building rapport with the team
      description: Non-construction use of building
    - value: 'How to apply for a building permit in Queensland: lodge the development application with your council, pay the fee and the assessment manager will issue a decision notice with conditions of approval.'
      description: Public guidance naming the process without any record (must stay below 75)
    - value: "Development application form\nApplication number: __________\nApplicant: __________\nProperty address: __________"
      description: Blank form (must stay below 75)
    - value: 'Training example: QBCC building approval decision notice, application number A006123456, with conditions of approval'
      description: Explicit training content must not enforce
    - value: 'News: council approved 1,200 development applications last quarter and building approvals rose 8 per cent.'
      description: News / statistics (must stay below 75)
false_positives:
  - description: Public planning guidance and applicant checklists discuss building permits, development applications, certifiers, and approval conditions without containing an issued record.
    mitigation: Keep topic-only matches discovery-only and require decision, condition, assessment, certification, or approved-work content for enforcement.
  - description: Training and form examples can include realistic QBCC references, application numbers, and decision language.
    mitigation: Reject explicit template, demo, tutorial, sample-data, and training-example framing from enforcing tiers.
exports:
  - yaml
scope: narrow
risk_rating: 5
risk_description: >-
  The keyword pattern identifies Queensland building approvals, QBCC permits, development applications, certifier documents, and occupancy or compliance certificates. A genuine approval can reveal a site, proposed works, responsible parties, and regulatory status, which may modestly affect privacy, commercial timing, or property security when combined with an address. Much of the information is routine planning administration or ultimately public, and the detector does not establish a protected facility or exploitable building plan. Risk 5 OFFICIAL reflects bounded contextual harm; SENSITIVE is not met without confidential design, security features, protected-location data, or a contentious unreleased development decision.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to PSPF OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM, and Low because routine approval records are
    administrative and often public. SENSITIVE is not met without protected sites, confidential designs, security
    detail, or consequential pre-decision content.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low handling suits ordinary building approvals and certificates whose sensitivity depends on protected
      locations, detailed plans, or unresolved commercial decisions.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_building_approval
      matches:
        - ref: Regex_building_approval_record_structure
          min_count: 2
          unique_results: true
        - type: any
          refs:
            - Evidence_approval_record_detail
            - Evidence_qld_building_authority
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_building_approval
      matches:
        - type: any
          refs:
            - Regex_building_approval_record_structure
            - Regex_building_application_reference
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_building_approval
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
  regexes:
    - id: Pattern_building_approval
      pattern: >-
        (?i)\b(?:Queensland\s+building\s+approval|building\s+(?:approval|permit|certification)|development\s+(?:permit|application)|planning\s+(?:permit|approval)|occupancy\s+certificate|compliance\s+certificate)\b
    - id: Regex_building_application_reference
      pattern: >-
        (?i)\b(?:(?:development|building|planning|plumbing)\s+application|DA|BA|application|approval|permit|decision\s+notice)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*(?:[A-Z]{1,5}[/-]?)?\d[A-Z0-9/-]{3,20}\b
    - id: Regex_building_approval_record_structure
      pattern: >-
        (?i)\b(?:applicant|owner|property\s+address|site\s+address|address\s+of\s+(?:the\s+)?premises|lot\s+on\s+plan|real\s+property\s+description|assessment\s+manager|building\s+certifier|certifier|decision\s+date|date\s+of\s+decision|approval\s+date|classification|building\s+class|approved\s+use|(?:application|approval|licence)\s*(?:no\.?|number))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_approval_record_detail
      groups:
        - match_style: word
          terms:
            - decision notice
            - conditions of approval
            - approved works
            - assessment manager
            - occupancy permit
            - building certifier
            - building classification
      strength: domain
    - id: Evidence_qld_building_authority
      groups:
        - match_style: word
          terms:
            - text: QBCC
              case_sensitive: true
            - Queensland Building and Construction Commission
            - Building Act 1975
            - Queensland Government
            - State of Queensland
      strength: specific
created: '2026-02-09'
updated: '2026-09-25'
changelog:
  - version: 1.5.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): 75 now needs populated approval-record structure (applicant, owner, property address, lot on plan, certifier, decision date, classification ...) or a labelled application number instead of generic approval vocabulary (audit B), and 85 needs two distinct record fields plus decision/authority evidence; removed occupancy/compliance certificate from the evidence group (same span as the primary, audit A); replaced the invented BA######## / DA/YYYY/NNNN regex with the new council-development-application-number labelled fallback (identifier-format slot); bare-phrase tests replaced with populated records and guidance/blank-form/news decoys; regulations: removed SOCI Act, added Planning Act 2016 and Building Act 1975; frameworks: removed DISP, added QGISCF; references added.'
  - version: 1.4.0
    date: '2026-07-04'
    description: 'Profile quality hardening: preserve risk 5 OFFICIAL while converting the keyword-list detector to a regex-backed concept; require substantive approval-record content at 75 and a formal identifier plus Queensland authority context at 85.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 575 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
