schema: testpattern/v1
name: Terrorism Watchlist Entry
slug: terrorism-watchlist-entry
version: 1.5.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects terrorism and national security watchlist entries including risk ratings, monitoring status, intelligence basis, and border alert configurations. Disclosure enables subjects to evade monitoring and compromises border security.
operation: >-
  Primary: watchlist phrases (terrorism watchlist, persons of interest register, national security flag, adverse security assessment, border/security alert entry, movement alert, no-fly list nomination, ASIO referral/assessment). 65 = phrase only (discovery). 75 = phrase plus a populated subject field (subject, suspect, person of interest, name, date of birth, reference number), a labelled reference or a passport number. 85 = phrase plus two distinct populated fields plus independent evidence (AFP, Australian Border Force, Home Affairs, active monitoring, enhanced screening, no-fly nomination ...). Factsheets, civil-liberties commentary and media framing excluded.
pattern: (?i)\b(terrorism\s+watchlist|persons?\s+of\s+interest\s+register|national\s+security\s+flag|adverse\s+security\s+assessment|security\s+alert\s+(?:entry|notification)|border\s+alert\s+(?:entry|notification)|movement\s+alert\s+(?:list|entry)|no[\-\s]fly\s+list\s+(?:entry|nomination)|ASIO\s+(?:referral|assessment|security\s+assessment))\b
confidence: medium
confidence_justification: >-
  Medium confidence: enforcement requires a populated subject record; ASIO and agency references are unpublished, so the reference is a documented label-anchored fallback.
jurisdictions:
  - global
regulations:
  - "Criminal Code Act 1995 (Cth)"
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
corroborative_evidence:
  keywords:
    - PROTECTED
    - Law-Enforcement
    - NATIONAL SECURITY
    - RESTRICTED
    - ASIO
    - AFP
    - Australian Border Force
    - watchlist
    - national security flag
    - adverse assessment
    - border alert
    - movement alert
    - no-fly list
    - enhanced screening
    - active monitoring
    - high risk
    - elevated risk
  proximity: 300
  keyword_lists:

    - law-enforcement
    - en-government-classification
customisation:
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_terrorism_watchlist_entry_case_reference
    mode: replace
    affects_tiers: [75]
    required_for_enforcement: false
    note: Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#case-reference-number). Earlier versions used the ASA-YYYY-NNNN ASIO format, which does not appear in any published source.
test_cases:
  should_match:
    - value: 'PROTECTED — NATIONAL SECURITY. Terrorism Watchlist Entry. Subject: Omar Hassan IBRAHIM, DOB 03/11/1988, passport PA1234567. National security flag: ACTIVE. ASIO adverse security assessment 14/10/2024. Reference number: 2024/7892. Risk: HIGH. Border alert: movement alert — notify AFP/ASIO on travel. Enhanced screening all airports.'
      description: Terrorism watchlist entry with ASIO assessment and border alerts (reaches 75)
    - value: 'RESTRICTED. POI Register update. Subject added to watchlist per ASIO referral (reference number 2025/0342). Adverse assessment: foreign terrorist organisation association. Active monitoring. No-fly list nomination to Home Affairs. Movement alert all border points.'
      description: POI register update with ASIO referral and no-fly nomination (reaches 75)
    - value: 'Border alert notification. Subject: Fatima AL-RASHIDI. National security flag triggered at Brisbane International. Movement alert confirmed. ASIO assessment: elevated risk. Enhanced screening. AFP and ASIO notified. POI register entry active since March 2024.'
      description: Border alert triggered by watchlist at airport (65 discovery only - prose without populated record fields)
    - value: "Terrorism watchlist entry\nSubject name: Avery Teston\nDate of birth: 04/02/1991\nReference number: 2026/0417\nNational security flag active; enhanced screening at international travel points; Australian Border Force to notify AFP on departure."
      description: 'Populated watchlist entry: subject name, DOB and reference number plus border-alert evidence (reaches 85)'
      synthetic: true
  should_not_match:
    - value: Home Affairs published a factsheet explaining Australia's border alert system, including alert types and review processes.
      description: Published government factsheet
    - value: A civil liberties report criticised the lack of transparency in no-fly list processes, arguing individuals lack due process.
      description: Civil liberties report on watchlists
    - value: A news article reported an Australian citizen was denied boarding due to a security watchlist. The lawyer would challenge in court.
      description: Media report about watchlist challenge
    - value: "Policy guidance: this procedure explains how records about Terrorism Watchlist are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: "Border alert nomination form\nSubject name: __________\nDate of birth: __________\nReference number: __________"
      description: Blank form / template with unfilled fields (must stay below 75)
    - value: "News: a civil liberties group criticised the no-fly list nomination process, saying people cannot see the evidence against them."
      description: News or training text naming the topic (must stay below 75)
false_positives:
  - description: Government factsheets about border systems
    mitigation: 'Negative keyword exclusion: ''factsheet'', ''published'', ''explains'', ''public information'''
  - description: Civil liberties reports on watchlist processes
    mitigation: 'Negative keyword exclusion: ''civil liberties'', ''human rights'', ''criticising'', ''due process'''
  - description: Media reporting about watchlist challenges
    mitigation: 'Negative keyword exclusion: ''news article'', ''reported'', ''allegedly'', ''lawyer stated'''
  - description: Parliamentary reviews of national security legislation
    mitigation: 'Negative keyword exclusion: ''parliamentary'', ''committee'', ''legislative review'''
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_terrorism_watchlist_entry_watchlist_terms
      matches:
        - ref: Regex_terrorism_watchlist_entry_record_structure
          min_count: 2
          unique_results: true
        - ref: Evidence_terrorism_watchlist_entry_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_terrorism_watchlist_entry_exclusion
    - confidence_level: 75
      id_match: Pattern_terrorism_watchlist_entry_watchlist_terms
      matches:
        - type: any
          refs:
            - Regex_terrorism_watchlist_entry_record_structure
            - Regex_terrorism_watchlist_entry_case_reference
            - Pattern_terrorism_watchlist_entry_passport_number
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_terrorism_watchlist_entry_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_terrorism_watchlist_entry_watchlist_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_terrorism_watchlist_entry_exclusion
  regexes:
    - id: Pattern_terrorism_watchlist_entry_watchlist_terms
      pattern: (?i)\b(terrorism\s+watchlist|persons?\s+of\s+interest\s+register|national\s+security\s+flag|adverse\s+security\s+assessment|border\s+alert|movement\s+alert|no[\-\s]fly\s+list|ASIO\s+referral)\b
    - id: Pattern_terrorism_watchlist_entry_passport_number
      pattern: \b(?:PA|P)[A-Z]?\d{7,8}\b
    - id: Regex_terrorism_watchlist_entry_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|defendant|accused|offender|prisoner|inmate|detainee|respondent|applicant|witness|informant|suspect|subject\s+(?:name|person)|person\s+of\s+interest|POI|victim|complainant|officer|CNI|QPRIME|(?:file|case|matter|court|reference|ref|exhibit|brief|job|incident|report|investigation|occurrence)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_terrorism_watchlist_entry_case_reference
      pattern: >-
        (?i)\b(?:case|file|matter|reference)\s+(?:no\.?|number|ID|#)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{3,20}\b
  keywords:
    - id: Evidence_terrorism_watchlist_entry_corroborative_terms
      groups:
        - match_style: word
          terms:
            - text: AFP
              case_sensitive: true
            - Australian Border Force
            - Department of Home Affairs
            - high risk
            - elevated risk
            - active monitoring
            - enhanced screening
            - international travel
            - no-fly nomination
      strength: specific
    - id: Filter_terrorism_watchlist_entry_exclusion
      groups:
        - match_style: word
          terms:
            - media release
            - published
            - factsheet
            - public information
            - civil liberties
            - human rights
            - criticising
            - due process
            - news article
            - reported
            - allegedly
            - lawyer stated
            - parliamentary
            - committee

      strength: noise
risk_rating: 10
risk_description: >-
  The detector identifies a terrorism or national-security watchlist entry containing a named subject, risk rating, intelligence basis, monitoring status, ASIO referral, border alert, or no-fly configuration. Disclosure can tell the subject how authorities assess and monitor them, enabling identity changes, route alteration, avoidance of border controls, and concealment of associates or activity. Public factsheets, civil-liberties reports, media, and parliamentary reviews are excluded, so the normal match is an operative person-level alert rather than discussion of watchlist policy. Risk 10 supports PROTECTED Law-Enforcement because exposure can defeat coordinated national-security monitoring and border intervention; no higher QGISCF tier exists.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Law-Enforcement
classification:
  tier: High
  rationale: >-
    Risk 10 maps to PSPF PROTECTED, QGISCF PROTECTED, PROTECTED Law-Enforcement, and High because subject-level alerts
    and intelligence grounds can be used immediately to evade national-security monitoring. The classification is
    already maximal, with no higher QGISCF tier.
  generic:
    classification: High
    dlm: High Law-Enforcement
    rationale: >-
      High with High Law-Enforcement DLM protects active watchlist status, intelligence basis, and border controls whose
      compromise can create broad public-safety consequences.
references:
  - title: Criminal Code Act 1995 (Cth)
    url: https://www.legislation.gov.au/C2004A04868/latest/text
created: '2026-02-20'
updated: '2026-09-25'
changelog:
  - version: 1.5.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): rebuilt tiers - 75 needs a populated subject field, a labelled reference or a passport-number shape, 85 needs two distinct record fields plus independent border/monitoring evidence; removed the invented ASA-YYYY-NNNN regex in favour of the case-reference-number labelled fallback (identifier-format slot); dropped the single-term NATIONAL SECURITY marker group; tests converted with an 85 positive and blank-form/news decoys; references added.'
  - version: 1.4.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires either independent justice record structure (Regex ..._record_structure) or one of the hand-authored corroborative terms (none of which the primary matches); 85 requires 2 distinct structure hits plus the existing hand-authored evidence. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1490 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
