schema: testpattern/v1
name: Merchant acquiring credentials
slug: global-top500-111-merchant-acquiring-credentials
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: Detects references to merchant acquiring credentials in financial and compliance documents. Commonly found in international regulatory filings, transaction records, and audit documentation.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters. Keyword
  lists: credentials. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(?:merchant\s+ID|acquiring\s+bank|merchant\s+account|payment\s+gateway|terminal\s+ID|merchant\s+credentials|API\s+key|settlement\s+account|payment\s+processor|merchant\s+number|POS\s+terminal)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - merchant acquiring credentials
    - merchant
    - acquiring
    - credentials
    - financial
    - accounts
    - payments
  proximity: 300
  keyword_lists:
    - credentials
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: merchant ID
      description: Primary topic phrase match
    - value: acquiring bank
      description: Case-insensitive topic phrase match
    - value: merchant account
      description: Alternative topic phrase match
    - value: payment gateway
      description: Additional topic phrase match
    - value: |-
        Merchant ID
        Payee: Riverbend Supplies Pty Ltd
      description: Populated payee/account with one field (75 tier)
      synthetic: true
    - value: |-
        Merchant ID
        Payee: Riverbend Supplies Pty Ltd
        BSB: 064-000
      description: Populated payee/account with 2 distinct fields (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: bank transfer
      description: Generic word pair from old broad template should not match
    - value: Merchant acquiring credentials
      description: "Bare detector name (regression guard): the IdMatch does not match it alone, but the generated name-word tier lifted it to 75 next to any IdMatch phrase; it must not reach an enforcing tier"
    - value: |-
        Merchant ID:
        Payee:
        Account name:
        Account number:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about merchant id are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In English (as the primary international business language), standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_merchant_credentials
      matches:
        - ref: Regex_global_top500_111_merchant_acquiring_credentials_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_merchant_credentials
      matches:
        - ref: Regex_global_top500_111_merchant_acquiring_credentials_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_merchant_credentials
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_merchant_credentials
      pattern: >-
        (?is)\b(?:merchant\s+ID|acquiring\s+bank|merchant\s+account|payment\s+gateway|terminal\s+ID|merchant\s+credentials|API\s+key|settlement\s+account|payment\s+processor|merchant\s+number|POS\s+terminal)\b
    - id: Regex_global_top500_111_merchant_acquiring_credentials_record_structure
      pattern: (?i)\b(?:payee|supplier|vendor|creditor|beneficiary|account\s+name|BSB|account\s+(?:no\.?|number)|invoice\s+(?:no\.?|number)|remittance\s+(?:no\.?|number|ref(?:erence)?)|payment\s+(?:ref(?:erence)?|date)|amount\s+paid|MID|TID|merchant\s+name|trading\s+name|acquirer(?:\s+(?:name|ID))?|card\s+acceptor\s+ID|store\s+(?:ID|no\.?|number)|secret\s+key|signing\s+key)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
risk_description: >-
  The medium-confidence concept regex recognises merchant-acquiring terms such as merchant ID, acquiring bank, payment gateway, terminal ID, API key, and settlement account; its should-match set includes bare service phrases, so it does not verify a live credential. Public integration documentation, reports, and templates have little standalone harm, whereas a value paired with secret, token, or authentication context can enable merchant impersonation, gateway access, or settlement diversion. A confirmed secret ordinarily affects one merchant relationship and the customers whose payments traverse it, with active status and granted permissions required for exploitation. Risk 8 and SENSITIVE InfoTech are retained for the credential-corroborated branch; PROTECTED needs platform-wide privilege, cross-merchant reach, or significant payment-system damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    For the credential-corroborated form, risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE
    InfoTech, and Medium because an active secret can alter merchant payment operations. A service term by itself
    establishes neither access nor broad privilege, and PROTECTED is not reached without verified platform-wide
    authority or significant cross-entity damage.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling suits a live merchant integration secret whose misuse is serious but normally limited to
      one account or gateway relationship. Public merchant identifiers and service descriptions do not inherit that
      consequence unless authentication material or access context accompanies them.
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
