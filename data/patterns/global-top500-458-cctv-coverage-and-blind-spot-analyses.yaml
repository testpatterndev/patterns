schema: testpattern/v1
name: CCTV coverage and blind spot analyses
slug: global-top500-458-cctv-coverage-and-blind-spot-analyses
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects CCTV coverage and blind-spot analyses: CCTV survey or blind-spot wording with populated camera records (IDs, NVR channels, locations, FOV) and located coverage weaknesses. Topic wording alone is discovery-only.
operation: >-
  Regex_cctv_coverage_primary (CCTV coverage/layout/survey/audit, camera placement/layout plan, blind spot analysis or surveillance coverage map wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated camera field (camera ID/number, NVR/DVR channel, location, mounting height, lens, FOV, PTZ preset, resolution, retention) or a located coverage weakness (blind spot/coverage gap/dead zone/unmonitored near a gate, door, dock, stairwell, car park, perimeter, plant or server room). 85 requires a populated camera field (camera ID/number, NVR/DVR channel, location, mounting height, lens, FOV, PTZ preset, resolution, retention) (two distinct hits), a located coverage weakness (blind spot/coverage gap/dead zone/unmonitored near a gate, door, dock, stairwell, car park, perimeter, plant or server room), and independent physical-security (guards, patrols, lighting, access control, intrusion) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_cctv_coverage_guidance_exclusion).
pattern: >-
  (?i)\b(?:CCTV\s+(?:coverage|camera\s+(?:schedule|register|layout|plan)|layout|site\s+plan|audit|survey|review|assessment)|camera\s+(?:coverage|placement|layout|schedule)(?:\s+(?:plan|analysis|review|map))?|blind\s+spot\s+(?:analysis|assessment|review)|surveillance\s+(?:coverage|camera\s+plan|map))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated camera field (camera ID/number, NVR/DVR channel, location, mounting height, lens, FOV, PTZ preset, resolution, retention) or a located coverage weakness (blind spot/coverage gap/dead zone/unmonitored near a gate, door, dock, stairwell, car park, perimeter, plant or server room)), and 85 needs two distinct structures plus independent physical-security (guards, patrols, lighting, access control, intrusion) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
  - global
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
  - ISO 27001
  - PSPF
data_categories:
  - security
  - location
corroborative_evidence:
  keywords:
    - security guard
    - patrol route
    - lighting
    - access control
    - intrusion
    - infrared
    - night vision
    - recording retention
    - monitoring room
    - tailgating
  proximity: 300
  keyword_lists:
    - industry-critical-infrastructure
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: The CCTV audit for the depot is due in the next quarter.
      description: Discovery probe (65)
      synthetic: true
    - value: |-
        CCTV camera schedule - Depot
        Camera ID: CAM-12
        Location: loading dock east
      description: Medium-tier probe (75) - populated camera fields
      synthetic: true
    - value: |-
        CCTV coverage review - Wharf Street depot
        Camera ID: CAM-12, NVR channel: 7, Location: loading dock east, FOV: 78 degrees
        Camera ID: CAM-14, Location: north stairwell
        Blind spot behind Gate 3 and no coverage in the plant room; security guard patrol route and lighting do not compensate after hours.
      description: High-tier probe (85) - several camera fields, located weaknesses and physical-security context
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match
    - value: 'Policy statement: the procurement policy requires CCTV coverage of all public entrances.'
      description: Policy text
      synthetic: true
    - value: |-
        CCTV camera schedule template
        Camera ID: ________
        Location: [insert]
      description: Blank template
      synthetic: true
    - value: 'Course module 2: a blind spot analysis finds coverage gaps near the gate and assigns camera IDs such as CAM-01.'
      description: Training framing
      synthetic: true
    - value: cctv blind spot
      description: Generic word pair
false_positives:
  - description: CCTV procurement specifications and vendor brochures describe FOV and resolution.
    mitigation: Guidance/template framing is excluded; 85 needs camera records plus a located weakness and physical-security context.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_cctv_coverage_primary
      matches:
        - ref: Regex_cctv_coverage_camera_field
          min_count: 2
          unique_results: true
        - ref: Regex_cctv_coverage_coverage_weakness
        - ref: Keyword_cctv_coverage_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_cctv_coverage_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_cctv_coverage_primary
      matches:
        - type: any
          refs:
            - Regex_cctv_coverage_camera_field
            - Regex_cctv_coverage_coverage_weakness
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_cctv_coverage_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_cctv_coverage_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_cctv_coverage_primary
      pattern: >-
        (?i)\b(?:CCTV\s+(?:coverage|camera\s+(?:schedule|register|layout|plan)|layout|site\s+plan|audit|survey|review|assessment)|camera\s+(?:coverage|placement|layout|schedule)(?:\s+(?:plan|analysis|review|map))?|blind\s+spot\s+(?:analysis|assessment|review)|surveillance\s+(?:coverage|camera\s+plan|map))\b
    - id: Regex_cctv_coverage_camera_field
      pattern: >-
        (?i)\b(?:camera\s+(?:ID|no\.?|number|name)|cam(?:era)?\s*#|NVR|DVR|channel|location|mount(?:ing)?\s+height|lens|field\s+of\s+view|FOV|PTZ\s+preset|resolution|retention)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
    - id: Regex_cctv_coverage_coverage_weakness
      pattern: >-
        (?i)\b(?:blind\s+spot|coverage\s+gap|dead\s+zone|not\s+covered|no\s+coverage|unmonitored|obstructed|occluded)\b[\s\S]{0,60}?\b(?:gate|door|entrance|exit|dock|stairwell|car\s?park|perimeter|fence|corridor|level\s+\d{1,2}|lift|foyer|plant\s+room|server\s+room)\b
  keywords:
    - id: Keyword_cctv_coverage_context
      groups:
        - match_style: word
          terms:
            - security guard
            - patrol route
            - lighting
            - access control
            - intrusion
            - infrared
            - night vision
            - recording retention
            - monitoring room
            - tailgating
      strength: specific
    - id: Keyword_cctv_coverage_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - guidance note
            - best practice guide
            - media release
            - press release
            - news report
            - course module
            - learning objectives
            - awareness course
            - webinar
            - lesson plan
            - quiz question
      strength: domain
risk_description: >-
  The detector now requires CCTV coverage wording plus populated camera records or located coverage weaknesses before enforcing. A real blind-spot analysis can show where observation fails, allowing trespass, theft, sabotage, or evasion of evidence collection at a particular facility. The affected scale is usually one premises or security operation, with generic physical-security policies and camera procurement documents creating substantial benign traffic. Risk 8 and SENSITIVE fit the serious site-level exposure; PROTECTED would require precise weaknesses at a high-consequence facility that create a credible route to significant damage or life-safety harm.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Confidential
classification:
  tier: Medium
  rationale: >-
    Risk 8 is consistent with SENSITIVE because an actual camera coverage analysis gives actionable physical-security
    information for a defined site. PROTECTED is not met without precise access routes or surveillance weaknesses at a
    critical facility where exploitation is likely to cause significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium handling reflects actionable but usually facility-bounded surveillance exposure; the
      Personal-Privacy DLM is the canonical crosswalk rather than a claim about recorded individuals.
