updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): removed the invented QP-YYYY-NNNNNNN and OCC-NNNNNNN reference formats from the primary and top-level pattern; the real QPRIME occurrence number shape (QP + 10 digits, already used across the catalogue) now counts as 75 structure; the primary is the incident-report phrase list; 75 = phrase + a populated incident field or a QPRIME occurrence number; 85 = phrase + two distinct populated fields + independent evidence (witness statement, CCTV, forensic examination ...); removed the QPS/Queensland Police Service marker group and the evidence terms that are also record-field labels; tests converted to QPRIME numbers with an 85 positive, blank-form and policy decoys; references added.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1503 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
