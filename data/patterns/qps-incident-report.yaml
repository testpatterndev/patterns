schema: testpattern/v1
name: QPS Incident Report
slug: qps-incident-report
version: 1.4.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects Queensland Police Service (QPS) incident reports containing operational details about reported offences, informant information, and occurrence records. These are non-covert operational documents that are sensitive due to informant and victim details but do not involve covert methodology or life-safety risks.
operation: >-
  Primary: incident report phrases (QPS incident report, occurrence number/report, reporting officer, offence code, QPRIME entry/reference/record). 65 = phrase only (discovery). 75 = phrase plus a populated incident field (occurrence number, QPRIME reference, reporting/attending officer, informant, complainant, victim, witness, suspect, offence code, date of occurrence, location, badge ...) or a QPRIME occurrence number (QP + 10 digits). 85 = phrase plus two distinct populated fields plus independent evidence (witness statement, CCTV, forensic examination, statutory declaration, patrol group, badge number ...). Media releases, statistics, fiction and training framing excluded.
pattern: (?i)\b(?:QPS\s+incident\s+report|occurrence\s+(?:number|report)|reporting\s+officer|offence\s+code|QPRIME\s+(?:entry|reference|record|occurrence))\b
confidence: medium
confidence_justification: >-
  Medium confidence: enforcement requires a populated incident record or a QPRIME occurrence number; phrase-only mentions stay at discovery.
jurisdictions:
  - au
regulations:
  - Police Powers and Responsibilities Act 2000 (Qld)
  - Police Service Administration Act 1990 (Qld)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - SENSITIVE
    - Law-Enforcement
    - QPS
    - Queensland Police Service
    - incident report
    - occurrence number
    - reporting officer
    - QPRIME
    - offence code
    - informant
    - complainant
    - person of interest
    - attending officer
    - patrol group
  proximity: 300
  keyword_lists:

    - law-enforcement

    - government-services
    - en-government-classification
test_cases:
  should_match:
    - value: 'SENSITIVE Law-Enforcement. QPS Incident Report. Occurrence Number: QP2600458723. Reporting Officer: Sgt M. Thompson, Badge 14892, Fortitude Valley Patrol Group. Date of Occurrence: 14 February 2026. Offence Code: 0711 — Assault Occasioning Bodily Harm. Informant: Ms J. Williams attended Fortitude Valley station at 2245hrs. QPRIME entry created.'
      description: QPS incident report with occurrence number, reporting officer details, and QPRIME reference (reaches 85)
    - value: 'Queensland Police Service — QPRIME Record. QPRIME reference: QP2600345210. Incident Classification: Break and Enter — Dwelling. Location: 42 Boundary Street, West End QLD 4101. Attending Officers: Const. A. Chen (Badge 22104), Const. R. Patel (Badge 22356). Complainant provided statutory declaration. Forensic examination requested. Offence code 0521 recorded.'
      description: QPRIME record with QP reference number and forensic request (reaches 85)
    - value: 'QPS Occurrence Report — QP2600612984. Traffic incident involving pedestrian at intersection of George and Elizabeth Streets, Brisbane CBD. Reporting officer Senior Constable D. Murray, South Brisbane District. Informant transported to RBWH. Witness statements obtained from three bystanders. Person of interest identified via CCTV. QPRIME updated.'
      description: Traffic incident occurrence report with witness and person of interest details (reaches 75)
    - value: "QPS incident report\nOccurrence number: QP2600417731\nReporting officer: Senior Constable Avery Teston\nComplainant: Jordan Staffson\nDate of occurrence: 12/09/2026\nWitness statement taken; CCTV requested from the licensed venue; forensic examination of the scene booked."
      description: 'Populated incident report: QPRIME occurrence number, reporting officer, complainant and date plus witness/CCTV evidence (reaches 85)'
      synthetic: true
  should_not_match:
    - value: The Queensland Police Service Annual Statistical Review 2024-25 reported 285,432 offences across the state, a 3.2% decrease from the previous year. Assault offences decreased by 4.1% statewide.
      description: Published QPS crime statistics annual report
    - value: 'QPS Media Release: Police have charged a 34-year-old man following an investigation into an alleged assault at Surfers Paradise on Saturday night. He will appear in Southport Magistrates Court on Monday.'
      description: QPS media release about a charged person
    - value: A crime fiction novel described how Detective Inspector Blake filed the occurrence report into the QPRIME system and assigned the case to the Fortitude Valley CIB.
      description: Crime fiction novel referencing police systems
    - value: "QPS incident report — form\nOccurrence number: __________\nReporting officer: __________\nComplainant: __________\nDate of occurrence: __________"
      description: Blank incident report form (must stay below 75)
    - value: "Policy guidance: the reporting officer must record the occurrence number and offence code for every incident before the end of shift."
      description: Policy guidance naming the fields without any values (must stay below 75)
false_positives:
  - description: Published QPS annual statistical reviews and crime reports
    mitigation: 'Negative keyword exclusion: ''annual report'', ''statistical review'', ''published''. Require proximity to specific occurrence numbers.'
  - description: QPS media releases about charged persons and completed investigations
    mitigation: 'Negative keyword exclusion: ''media release'', ''charged'', ''will appear in court'', ''sentenced'''
  - description: Crime fiction and television scripts referencing police terminology
    mitigation: 'Negative keyword exclusion: ''novel'', ''fiction'', ''screenplay'', ''episode'''
  - description: Police training manuals and academy materials
    mitigation: 'Negative keyword exclusion: ''training manual'', ''academy'', ''exercise'', ''scenario'''
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_qps_incident_report_incident_report_terms
      matches:
        - ref: Regex_qps_incident_report_record_structure
          min_count: 2
          unique_results: true
        - ref: Evidence_qps_incident_report_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_qps_incident_report_exclusion
    - confidence_level: 75
      id_match: Pattern_qps_incident_report_incident_report_terms
      matches:
        - type: any
          refs:
            - Regex_qps_incident_report_record_structure
            - Regex_qps_incident_report_qprime_occurrence_number
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_qps_incident_report_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_qps_incident_report_incident_report_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_qps_incident_report_exclusion
  regexes:
    - id: Pattern_qps_incident_report_incident_report_terms
      pattern: >-
        (?i)\b(?:QPS\s+incident\s+report|occurrence\s+(?:number|report)|reporting\s+officer|offence\s+code|QPRIME\s+(?:entry|reference|record|occurrence))\b
    - id: Regex_qps_incident_report_qprime_occurrence_number
      pattern: \bQP\d{10}\b
    - id: Regex_qps_incident_report_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|occurrence\s+(?:no\.?|number)|QPRIME\s+(?:no\.?|number|ref(?:erence)?)|reporting\s+officer|attending\s+officers?|informant|complainant|victim|witness|suspect|person\s+of\s+interest|offence\s+code|date\s+of\s+occurrence|incident\s+classification|location|badge(?:\s+(?:no\.?|number))?|station)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_qps_incident_report_corroborative_terms
      groups:
        - match_style: word
          terms:
            - witness statement
            - patrol group
            - badge number
            - forensic examination
            - statutory declaration
            - district office
            - police station
            - CCTV
      strength: specific
    - id: Filter_qps_incident_report_exclusion
      groups:
        - match_style: word
          terms:
            - media release
            - published
            - annual report
            - statistical review
            - charged
            - will appear in court
            - sentenced
            - convicted
            - novel
            - fiction
            - screenplay
            - training manual
            - academy
            - exercise

      strength: noise
risk_rating: 7
risk_description: >-
  The detector identifies a Queensland Police incident or QPRIME occurrence report containing an offence, location, reporting officer, victim, informant, witness, person of interest, forensic request, and operational reference. Disclosure can expose affected people, alert suspects, enable witness coordination, or reveal preliminary facts and evidence before a routine investigation is complete. Published statistics, media releases, fiction, and academy training are excluded, and the pattern expressly targets non-covert reports rather than protected methodology or source identities. Risk 7 supports SENSITIVE Legal; PROTECTED would require covert sources, protected witnesses, immediate safety danger, or compromise across a major operation.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
references:
  - title: Queensland Police Service — Court brief (QP9)
    url: https://www.police.qld.gov.au/documents-for-purchase/court-brief-qp9
  - title: Police Powers and Responsibilities Act 2000 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2000-005
