schema: testpattern/v1
name: Payroll deduction records
slug: global-top500-086-payroll-deduction-records
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects payroll deduction records for an identified employee: deduction authorisations, salary sacrifice agreements, union fee, child support, health fund, workplace giving and novated lease deductions, with the deduction amount.
operation: >-
  Primary: a payroll deduction phrase (payroll deduction record/authorisation/form/schedule, authority to deduct, salary sacrifice agreement/arrangement, voluntary deduction, child support deduction, union fees deduction, payroll/workplace giving, pre/post-tax deduction). Generic "health insurance", "net pay" and "superannuation contribution" were removed. 75 tier requires a populated person field (employee/staff name or number, payroll number, position number, payee) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated deduction line with a currency amount (deduction amount, amount per pay, salary sacrifice, union fees, child support, health fund, novated lease, HELP repayment) and an independent corroborative term (signed, written authority, authorised, approved, commencing, per pay, payroll). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:payroll\s+deductions?\s+(?:records?|authori[sz]ations?|forms?|schedules?|registers?|reports?)|deduction\s+authori[sz]ations?|authority\s+to\s+deduct|salary\s+sacrifice\s+(?:agreements?|arrangements?|elections?)|voluntary\s+(?:payroll\s+)?deductions?|child\s+support\s+deductions?|union\s+(?:fees|dues)\s+deductions?|payroll\s+giving|workplace\s+giving\s+deductions?|(?:pre|post)[\s-]tax\s+deductions?)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Taxation Administration Act 1953 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - employment
  - pii
corroborative_evidence:
  keywords:
    - signed
    - written authority
    - authorised
    - approved
    - commencing
    - per pay
    - per fortnight
    - payroll
    - cease
  proximity: 300
test_cases:
  should_match:
    - value: "Payroll deduction authorisation\nEmployee name: Avery Teston\nEmployee ID: 4471820\nDeduction type: Union fees\nAmount per pay: $18.50\nCommencing pay period ending 10/10/2026\nSigned by the employee; written authority held on file."
      description: "85: deduction authorisation with employee, amount per pay and signed written authority"
      synthetic: true
    - value: "Salary sacrifice agreement\nStaff member: Morgan Teston\nNovated lease: $412.30 per fortnight\nHealth fund: $96.20\nApproved by payroll on 02/09/2026."
      description: "85: salary sacrifice agreement with novated lease and health fund amounts"
      synthetic: true
    - value: "Child support deduction\nEmployee: Jordan Staffson\nPlease action the attached notice from the next pay run."
      description: "75: child support deduction naming the employee, no amount"
      synthetic: true
    - value: "salary sacrifice agreement"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "An employer can only deduct money from an employee's pay if the employee agrees in writing and it is principally for their benefit. This fact sheet also covers salary sacrifice arrangements."
      description: "FWO-style guidance - must stay at or below 65"
    - value: "Payroll deduction authorisation form\nEmployee name: __________\nDeduction type: __________\nAmount per pay: $______"
      description: "Blank deduction form - must stay at or below 65"
    - value: "Workplace giving deductions rose sharply last year, according to a news release from the charity sector."
      description: "News - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Deduction records that identify the employee only in free text fall to 65."
    mitigation: "Accepted precision trade-off; extend the person-field regex with the customer employee-ID format."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_086_payroll_deduction_records_primary
      matches:
        - ref: Regex_top500_086_payroll_deduction_records_person_field
        - ref: Regex_top500_086_payroll_deduction_records_deduction_detail
        - ref: Keyword_top500_086_payroll_deduction_records_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_086_payroll_deduction_records_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_086_payroll_deduction_records_primary
      matches:
        - ref: Regex_top500_086_payroll_deduction_records_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_086_payroll_deduction_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_086_payroll_deduction_records_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_086_payroll_deduction_records_primary
      pattern: >-
        (?i)\b(?:payroll\s+deductions?\s+(?:records?|authori[sz]ations?|forms?|schedules?|registers?|reports?)|deduction\s+authori[sz]ations?|authority\s+to\s+deduct|salary\s+sacrifice\s+(?:agreements?|arrangements?|elections?)|voluntary\s+(?:payroll\s+)?deductions?|child\s+support\s+deductions?|union\s+(?:fees|dues)\s+deductions?|payroll\s+giving|workplace\s+giving\s+deductions?|(?:pre|post)[\s-]tax\s+deductions?)\b
    - id: Regex_top500_086_payroll_deduction_records_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_086_payroll_deduction_records_deduction_detail
      pattern: >-
        (?i)\b(?:deduction(?:\s+amount)?|amount\s+per\s+(?:pay|fortnight|week|month)|salary\s+sacrifice|union\s+(?:fees|dues)|child\s+support|health\s+(?:fund|insurance)|workplace\s+giving|payroll\s+giving|novated\s+lease|HELP\s+repayment|(?:pre|post)[\s-]tax\s+deduction|total\s+deductions)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?
  keywords:
    - id: Keyword_top500_086_payroll_deduction_records_corroborative
      groups:
        - match_style: word
          terms:
            - signed
            - written authority
            - authorised
            - approved
            - commencing
            - per pay
            - per fortnight
            - payroll
            - cease
      strength: specific
    - id: Keyword_top500_086_payroll_deduction_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - only deduct
            - can deduct
            - can only
            - payroll software
            - book a demo
            - free trial
      strength: domain
risk_description: >-
  The classifier identifies payroll deduction records for an identified employee (75) with deduction amounts (85). Deductions can reveal union membership, child support obligations, health cover and debts. Policies, guidance and blank forms stay at 65. Risk 4 supports OFFICIAL; union membership or child support detail in bulk would warrant handling as SENSITIVE.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 aligns with OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM, OFFI, and Low because the detector does not
    establish an identified person's sensitive financial circumstances. SENSITIVE is reserved for a completed linked
    deduction record rather than the broad topic match.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low and Low handling fit a deduction-record reference with limited direct impact and frequent
      administrative uses. Generic Medium would require employee attribution and substantive private amounts or
      deduction reasons.
references:
  - title: "Fair Work Ombudsman - Deducting pay"
