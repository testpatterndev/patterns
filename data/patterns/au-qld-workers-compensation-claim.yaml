  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - anchored on WCRA 2003 (Qld) claim, Form 132M work capacity certificate, certificate of capacity and RRTW plan terms; 75 gated on one populated worker / claim or medical field, 85 on both plus insurer / claim-decision evidence. Claim number matched by label only because the format is not public (proposed identifier slot workcover-claim-number).
