schema: testpattern/v1
name: QLD Perinatal Data Collection or Termination of Pregnancy Record
slug: au-qld-perinatal-termination-of-pregnancy-record
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Populated pregnancy-outcome records about an identified person: Queensland Perinatal Data
  Collection (QPDC) and Perinatal Online birth records submitted under the Public Health Act 2005
  (Qld), and termination of pregnancy records under the Termination of Pregnancy Act 2018 (Qld) -
  medical (MS-2 Step) and surgical termination clinic notes, referrals, consent and procedure records.
  They name the patient and carry pregnancy fields such as gestation, LMP, gravida and parity, mode of
  birth, birthweight, method of termination and medicines given. Termination of pregnancy data is
  among the most sensitive health information held and can expose a person to stigma, coercion,
  family violence or legal jeopardy outside Queensland. Boundary: topic mentions of pregnancy,
  abortion and contraception without a populated record belong to global-reproductive-health-data;
  cancer notifications to au-qld-cancer-register-notification.
operation: >-
  Primary: (Queensland) Perinatal Data Collection, QPDC, Perinatal Online, perinatal (data) form /
  record / notification, (medical / surgical) termination of pregnancy, MS-2 Step, abortion record /
  procedure / referral. 65 (discovery only): primary alone, which surfaces the QPDC manual, patient
  information and statistics. 75: primary plus a populated patient field (patient or mother's name,
  DOB, URN / UR number, MRN, Medicare, IHI) plus a populated pregnancy field (gestation, gestational
  age, EDD, LMP, gravida, parity, plurality, onset of labour, mode of birth or delivery, birthweight,
  Apgar, outcome of pregnancy, baby's sex, method of termination, procedure date, indication). 85: the
  75 evidence plus independent obstetric or statutory context (antenatal, postnatal, obstetric,
  maternity, birth suite, neonatal, midwife, ultrasound dating, anti-D, consulting or second medical
  practitioner, Public Health Act). Enforce tiers exclude template
  wording and manual, guideline, patient-information, training, statistics and media framing.
pattern: >-
  (?i)\b((?:Queensland\s+)?Perinatal\s+Data\s+Collection|QPDC|Perinatal\s+Online|perinatal\s+(?:data\s+)?(?:form|record|notification)|(?:medical\s+|surgical\s+)?termination\s+of\s+pregnancy|MS-?2\s+Step|abortion\s+(?:record|procedure|referral))\b
confidence: medium
confidence_justification: >-
  Medium: QPDC, Perinatal Online and termination of pregnancy wording is specific, and enforce tiers
  need a populated patient field and a populated pregnancy field, which manuals, patient information
  and statistics lack. Maternity records that do not use these titles (antenatal cards, birth suite
  notes) are not covered unless the title appears.
jurisdictions:
  - au
  - au-qld
regulations:
  - Termination of Pregnancy Act 2018 (Qld)
  - Public Health Act 2005 (Qld)
  - Hospital and Health Boards Act 2011 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
  - QGISCF
data_categories:
  - phi
  - health
  - pii
corroborative_evidence:
  keywords:
    - gestation
    - gravida
    - parity
    - mode of birth
    - birthweight
    - LMP
    - mifepristone
  proximity: 300
test_cases:
  should_match:
    - value: "Queensland Perinatal Data Collection - birth record\nMother's name: Jordan Teston\nURN: 220431\nGravida: 3\nParity: 2\nGestation at birth: 38 weeks 2 days\nMode of birth: Emergency caesarean section\nBirthweight: 3120 g\nCompleted by midwife, Birth Suite, Teston Base Hospital"
      description: 85 tier - QPDC birth record with mother, URN, gravida, parity, gestation, mode of birth and midwife / birth suite context
      synthetic: true
    - value: "Medical termination of pregnancy - clinic record\nPatient name: Riley Teston\nDOB: 04/05/1996\nGestation: 7 weeks 3 days\nMethod: mifepristone 200 mg given 12/10/2026, misoprostol at home\nFollow-up: serum hCG in 14 days; ultrasound dating confirmed intrauterine pregnancy; anti-D given"
      description: 85 tier - medical termination record with patient, gestation, method and ultrasound dating / anti-D context
      synthetic: true
    - value: "Termination of pregnancy referral\nPatient: Morgan Teston\nLMP: 28/08/2026"
      description: 75 tier - termination of pregnancy referral with patient and LMP only
      synthetic: true
  should_not_match:
    - value: "QPDC manual 2026-27: this guide explains how to complete the gestation, parity, mode of birth and birthweight fields in Perinatal Online. Training sessions for birth suite staff are listed below."
      description: QPDC manual / Perinatal Online user guide (65 at most)
    - value: "Termination of pregnancy - patient information. A medical termination can be used up to 9 weeks of pregnancy. This fact sheet explains what to expect, possible side effects and where to get support."
      description: Patient information leaflet (65 at most)
    - value: "Perinatal data form\nMother's name: ____________________\nURN: ____________________\nGestation: ____ weeks\nMode of birth: ____________________\nBirthweight: ________ g"
      description: Blank perinatal data form (65 at most)
    - value: "Queensland perinatal statistics: the Perinatal Data Collection recorded 61,000 births in 2025, with a caesarean rate of 38 percent."
      description: Aggregate perinatal statistics (65 at most)
false_positives:
  - description: QPDC manuals, Perinatal Online user guides and midwifery training material that list the data fields.
    mitigation: No populated patient or pregnancy field, and manual, guide and training framing is excluded from enforce tiers.
  - description: Termination of pregnancy patient information, clinical guidelines and legislation commentary.
    mitigation: No populated patient field, and patient-information, fact sheet and guideline framing is excluded from enforce tiers.
  - description: Published perinatal statistics.
    mitigation: Aggregate figures carry no patient field and are excluded as statistics.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_perinatal_top_primary
      matches:
        - ref: Regex_perinatal_top_patient_field
        - ref: Regex_perinatal_top_pregnancy_field
        - ref: Keyword_perinatal_top_obstetric_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_perinatal_top_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_perinatal_top_primary
      matches:
        - ref: Regex_perinatal_top_patient_field
        - ref: Regex_perinatal_top_pregnancy_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_perinatal_top_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_perinatal_top_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_perinatal_top_primary
      pattern: >-
        (?i)\b((?:Queensland\s+)?Perinatal\s+Data\s+Collection|QPDC|Perinatal\s+Online|perinatal\s+(?:data\s+)?(?:form|record|notification)|(?:medical\s+|surgical\s+)?termination\s+of\s+pregnancy|MS-?2\s+Step|abortion\s+(?:record|procedure|referral))\b
    - id: Regex_perinatal_top_patient_field
      pattern: >-
        (?i)\b((?:patient(?:\s+name)?|mother(?:['’]s)?\s+(?:name|surname)|full\s+name|surname|given\s+names?|date\s+of\s+birth|DOB|URN|UR\s*(?:no\.?|number)|MRN|medical\s+record\s+(?:no\.?|number)|Medicare(?:\s+(?:card\s+)?(?:no\.?|number))?|IHI)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3})
    - id: Regex_perinatal_top_pregnancy_field
      pattern: >-
        (?i)\b((?:gestation(?:al\s+age)?(?:\s+at\s+(?:birth|termination|procedure))?|EDD|estimated\s+due\s+date|LMP|gravida|parity|plurality|onset\s+of\s+labour|mode\s+of\s+(?:birth|delivery)|birth\s?weight|Apgar(?:\s+score)?|outcome\s+of\s+pregnancy|pregnancy\s+outcome|baby(?:['’]s)?\s+sex|method(?:\s+of\s+termination)?|procedure\s+date|indication)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.,-]{0,30}(?:[ \t]+[A-Za-z0-9][A-Za-z0-9/'.,-]{0,30}){0,5})
    - id: Regex_perinatal_top_guidance_exclusion
      pattern: >-
        (?i)\b(this\s+(?:policy|procedure|guideline|guide|manual|page|fact\s?sheet|article|course)|(?:QPDC|data\s+collection)\s+manual|user\s+(?:guide|manual)|patient\s+information|information\s+for\s+women|training\s+sessions?|training\s+module|e-learning|perinatal\s+statistics|frequently\s+asked\s+questions|media\s+release)\b
  keywords:
    - id: Keyword_perinatal_top_obstetric_context
      groups:
        - match_style: word
          terms:
            - antenatal
            - postnatal
            - obstetric
            - maternity
            - birth suite
            - neonatal
            - midwife
            - ultrasound dating
            - anti-D
            - consulting medical practitioner
            - second medical practitioner
            - Public Health Act
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier recognises Queensland Perinatal Data Collection and termination of pregnancy records and
  enforces only when a populated patient field sits with a populated pregnancy field, with 85 also needing
  obstetric or statutory context. A genuine record reveals that a named person was pregnant and how the
  pregnancy ended: birth details including the baby, or a termination with its gestation and method.
  Termination of pregnancy information is among the most sensitive health data held: disclosure can lead
  to stigma, family or community coercion, domestic and family violence, and legal exposure where the
  person travels to or lives in a jurisdiction that criminalises abortion. Risk 9 reflects that severity
  for a single record. The SIT-QUALITY-BAR PROTECTED triggers for risk 9 (critical system, child,
  whistleblower, bulk suppressed addresses) are not met by an ordinary adult record, so the label stays
  SENSITIVE; a record about a minor or a bulk extract would justify PROTECTED.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 9 with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium, as for involuntary
    mental health records, because one perinatal or termination of pregnancy record exposes a named person's pregnancy
    outcome with severe stigma, coercion and legal risk. PROTECTED is not met: the SIT-QUALITY-BAR risk-9 triggers
    (critical system attack, exposing a child, a whistleblower, bulk suppressed addresses) do not apply to an ordinary
    adult record; a minor's record or a bulk extract would meet them. Owner review requested.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling with tightly restricted access applies to one person's pregnancy outcome record.
      High is warranted for bulk perinatal or termination data or records about minors.
references:
  - title: Termination of Pregnancy Act 2018 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2018-023
  - title: Queensland Health - Queensland Perinatal Data Collection (QPDC)
    url: https://www.health.qld.gov.au/dsb/collections/pdc
  - title: Public Health Act 2005 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2005-048
  - title: Queensland Health - Termination of pregnancy resources for health professionals
    url: https://www.health.qld.gov.au/clinical-practice/guidelines-procedures/clinical-resources/termination-of-pregnancy-resources-for-health-professionals
created: '2026-10-20'
updated: '2026-10-30'
changelog:
  - version: 1.1.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.0.0
    date: '2026-10-20'
    description: >-
      Initial release from the qghealth sector review (item 7, split): QPDC / Perinatal Online birth records
      and termination of pregnancy records. 65 phrase only; 75 needs a populated patient field and a
      populated pregnancy field; 85 adds obstetric or statutory context. Manual, patient-information,
      training and statistics framing excluded. Risk 9 SENSITIVE pending owner review of PROTECTED.
