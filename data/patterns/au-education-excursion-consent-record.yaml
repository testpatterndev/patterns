  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated student excursion consent and medical roster using record context and corroborating fields.",
  "pattern": "(?i)(?:excursion consent|camp consent|excursion medical roster|excursion participation record)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
  "regulations": [
    "Education (General Provisions) Act 2006 (Qld)",
    "Information Privacy Act 2009 (Qld)",
    "Privacy Act 1988 (Cth)"
  ],
  "frameworks": [
    "ISO 27001",
    "ISO 27701"
  ],
  "data_categories": [
    "education",
    "pii"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated student excursion consent and medical roster can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://ppr.qed.qld.gov.au/pp/school-excursions-procedure"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE Personal-Privacy"
  },
  "package_tags": {
    "primary_component": "student-child-records",
    "components": [
      "student-child-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "privacy"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          },
          {
            "ref": "Regex_4"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:excursion consent|camp consent|excursion medical roster|excursion participation record)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:excursion|camp|activity)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{3,90}"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:date|departure date|activity date)[ \\t]*:[ \\t]*(?:\\d{4}-\\d{2}-\\d{2}|\\d{1,2}/\\d{1,2}/\\d{4})"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)(?:consent status[ \\t]*:[ \\t]*(?:granted|declined|approved)|(?:medical condition|emergency contact)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{3,90})"
      },
      {
        "id": "Regex_4",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      }
    ]
  },
