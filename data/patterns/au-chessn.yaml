schema: testpattern/v1
name: Commonwealth Higher Education Student Support Number (CHESSN)
slug: au-chessn
version: 1.0.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Commonwealth Higher Education Student Support Number (CHESSN): a 10-digit number identifying a student's HELP loans and Commonwealth support. Being retired in favour of the USI since 2021 but still present on Commonwealth Assistance Notices and legacy records.
operation: >-
  Primary: Commonwealth Higher Education Student Support Number (CHESSN) anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:CHESSN|Commonwealth\s+Higher\s+Education\s+Student\s+Support\s+Number)\s*(?:no\.?|number)?\s*[:#]?\s*\d{10}\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Higher Education Support Act 2003 (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - education
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - HELP
    - HECS-HELP
    - FEE-HELP
    - USI
    - myHELPbalance
    - Commonwealth Assistance Notice
    - census date
    - Commonwealth supported place
  proximity: 300
test_cases:
  should_match:
    - value: "Commonwealth Assistance Notice\nStudent name: Avery Teston\nStudent number: 45118273\nCHESSN: 4471820331\nHECS-HELP debt incurred this census date: $4,524."
      description: Populated record 1
      synthetic: true
    - value: "Student name: Morgan Teston\nCHESSN 3051182749\nUSI: 7HGT3K9WQ2\nFEE-HELP balance transferred to myHELPbalance."
      description: Populated record 2
      synthetic: true
    - value: "Commonwealth Higher Education Student Support Number: 2208841563\nStudent ID: s4471820\nCommonwealth supported place confirmed for Semester 2."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Your CHESSN is a unique 10-digit number. Since 2021 the USI has replaced the CHESSN for most purposes.
      description: Guidance or explainer text
    - value: "CHESSN: __________\nStudent name: __________"
      description: Blank form
    - value: Student support numbers are listed in the TCSI element E488 for legacy reporting.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_chessn_primary
      matches:
        - ref: Regex_au_chessn_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_chessn_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_chessn_primary
      matches:
        - ref: Regex_au_chessn_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_chessn_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_chessn_primary
      pattern: >-
        (?i)\b(?:CHESSN|Commonwealth\s+Higher\s+Education\s+Student\s+Support\s+Number)\s*(?:no\.?|number)?\s*[:#]?\s*\d{10}\b
    - id: Regex_au_chessn_record_structure
      pattern: >-
        (?i)\b(?:student\s+name|child(?:'s)?\s+name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|principal|school|(?:student|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_chessn_corroborative
      groups:
        - match_style: word
          terms:
            - text: HELP
              case_sensitive: true
            - HECS-HELP
            - FEE-HELP
            - text: USI
              case_sensitive: true
            - myHELPbalance
            - Commonwealth Assistance Notice
            - census date
            - Commonwealth supported place
            - study assist
            - loan
      strength: specific
risk_rating: 5
risk_description: >-
  The classifier identifies a commonwealth higher education student support number (chessn) about an identified person, gated on populated record fields. Commonwealth Higher Education Student Support Number (CHESSN): a 10-digit number identifying a student's HELP loans and Commonwealth support. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 5 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Study Assist — Your USI and CHESSN (anchor confirmed from official-domain search results; page fetch blocked)
    url: https://www.studyassist.gov.au/starting-study-basics/your-usi-chessn
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
