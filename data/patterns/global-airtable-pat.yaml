schema: testpattern/v1
name: Airtable Personal Access Token
slug: global-airtable-pat
version: 1.0.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects Airtable personal access tokens, which consist of pat followed by a 14-character alphanumeric token ID, a literal dot, and a 64-character lowercase hexadecimal secret (82 characters total). Airtable bases frequently hold CRM, HR, operational, and customer PII records.
operation: >-
  Matches pat<14 alphanumerics>.<64 lowercase hex> (82 characters total), bounded outside identifier characters. Tiers: 85 for two distinct tokens with Airtable context, 75 for one token with context, 65 discovery-only for a bare token, with template-exclusion gating.
pattern: '(?-i)(?<![A-Za-z0-9._-])(pat[A-Za-z0-9]{14}\.[0-9a-f]{64})(?![A-Za-z0-9._-])'
confidence: high
confidence_justification: >-
  High confidence: Airtable personal access tokens follow a rigid 82-character structure (pat + 14 base62 ID + . + 64 lowercase hex) documented by Airtable and pinned identically by GitHub secret scanning, gitleaks, and TruffleHog.
jurisdictions:
- global
regulations:
- Criminal Code Act 1995 (Cth)
frameworks:
- CIS Controls
- ISO 27001
- NIST CSF
- SOC 2
data_categories:
- credentials
- security
corroborative_evidence:
  keywords:
  - airtable
  - AIRTABLE_API_KEY
  - AIRTABLE_PAT
  - api.airtable.com
  proximity: 300
  keyword_lists:
  - credentials
  - data-record-context
  - generic-data-labels
test_cases:
  # Positive literals omitted: GitHub Push Protection blocks all syntactically valid pat<14>.<64 hex> strings on public repos.
  should_match: []
  should_not_match:
  - value: "AIRTABLE_PAT=pat000000000.shorthex"
    description: "Token ID and secret segments shorter than required 14+64 length"
  - value: "AIRTABLE_PAT=pat00000000000000.ZZZZZZZZZZZZZZZZ"
    description: "Non-hex secret segment rejected"
  - value: "Migrate legacy key* credentials to Airtable personal access tokens."
    description: "Documentation prose without a token value"
  - value: "template example placeholder record identifier"
    description: "Template/sample context should be excluded even when anchor words are present"
false_positives:
- description: "Revoked Airtable PATs retained in historical automation scripts."
  mitigation: "Check token status via Airtable Builder Hub -> Personal access tokens."
- description: "Synthetic 82-character example tokens in Airtable API guides."
  mitigation: "Excluded on every tier by template-exclusion."
exports:
- purview_xml
- yaml
- regex_copy
scope: narrow
risk_rating: 8
risk_description: >-
  The high-confidence detector finds an 82-character Airtable personal access token. Depending on assigned scopes and bases, a leaked token allows bulk read, export, modification, or schema changes across business spreadsheets, CRM tables, and workflow bases. Risk 8 and SENSITIVE InfoTech fit contained cloud data-platform credential exposure.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, and Medium because a valid Airtable PAT grants direct API access to scoped bases and structured business records. PROTECTED is not met without confirmed access to protected whole-of-agency datasets.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium and Medium InfoTech handling suit Airtable personal access tokens because they authorize direct API read/write operations on scoped Airtable bases.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_airtable_pat
    matches:
    - ref: Regex_airtable_pat
      min_count: 2
      unique_results: true
    - ref: Keyword_airtable_pat
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  - confidence_level: 75
    id_match: Regex_airtable_pat
    matches:
    - ref: Keyword_airtable_pat
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_airtable_pat
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_airtable_pat
    pattern: '(?-i)(?<![A-Za-z0-9._-])(pat[A-Za-z0-9]{14}\.[0-9a-f]{64})(?![A-Za-z0-9._-])'
  keywords:
  - id: Keyword_airtable_pat
    groups:
    - match_style: word
      terms:
      - airtable
      - AIRTABLE_API_KEY
      - AIRTABLE_PAT
      - AIRTABLE_TOKEN
      - api.airtable.com
      - airtable.com
      - Bearer
    strength: specific
created: '2026-11-25'
updated: '2026-11-25'
changelog:
- version: 1.0.0
  date: '2026-11-25'
  description: Initial release.
author: testpattern-community
license: MIT
references:
