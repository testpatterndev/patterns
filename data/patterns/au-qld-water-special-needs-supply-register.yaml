schema: testpattern/v1
name: Queensland Water Special Needs (Medical) Supply Register Record
slug: au-qld-water-special-needs-supply-register
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Register entries and customer records kept by Queensland water service providers and councils for "special needs" customers and properties whose occupants need a continued, uninterrupted and unrestricted water supply for life support or other medical needs, most often home haemodialysis. The basis is customer-charter and code practice, not a statutory register: the Water Supply (Safety and Reliability) Act 2008 contains no special-needs or dialysis provision; the SEQ Customer Water and Wastewater Code covers "customers and tenants with special needs for an uninterrupted supply of water" (clause wording not retrieved); and the Urban Utilities Residential Customer Charter defines a special needs residential property as one where an occupant needs such supply as confirmed by a registered medical specialist, treating hospital or dialysis centre, and commits to at least four business days' notice of planned interruptions to those properties. Modelled on au-energy-life-support-register. Charters, glossaries and eligibility pages are decoys.
operation: >-
  Primary: a special-needs supply phrase (special needs customer / residential property / property / register / registration / flag / premises / occupant; uninterrupted (and unrestricted) (water) supply for life support or (special) medical needs; home haemodialysis, hemodialysis or home dialysis customer / register / registration / flag / patient; medical or dialysis priority register / customer / flag). 75 tier requires, within 300 characters, one populated structure: a premises field (service, supply, property or premises address with a street number; a property or assessment number; or a water meter number), a medical field (medical need / requirement / condition / equipment, equipment or treatment type, reason for registration or special need filled with (home) haemodialysis, dialysis, life support, oxygen, ventilator or tracheostomy; confirmed or certified by a named person; a named treating specialist, nephrologist, doctor, hospital, renal unit, dialysis centre or medical specialist; or a medical confirmation date) or a priority field (notification / contact / customer priority of high, urgent, critical or 1-3; a notice period or notice required of N (business) days; a filled alternate or emergency supply arrangement; a restriction, disconnection or shut-off exemption / hold of yes, applied or active; or a registration or review date). 85 tier requires a premises field AND a medical or priority field AND a customer field (named customer, account holder, occupant, tenant, patient or resident; or a customer, account or water account number) AND an independent water-operations term (interruption, shutdown, shut-off, water main, water meter, water account, sewerage, planned works, mains break, Urban Utilities, Unitywater). All enforce tiers AND NOT the shared template-exclusion dictionary and a charter/guidance exclusion (customer charter, Customer Water and Wastewater Code, published on our website, this policy, fact sheet, frequently asked questions, glossary, is a property where, how to register, National Energy Retail Rules). 65 is discovery-only (primary phrase alone).
pattern: >-
  (?i)\b(?:special\s+needs\s+(?:customers?|residential\s+propert(?:y|ies)|propert(?:y|ies)|register|registration|flag(?:ged)?|premises|occupants?)|uninterrupted\s+(?:and\s+unrestricted\s+)?(?:water\s+)?supply\s+for\s+(?:life\s+support|(?:special\s+)?medical)|(?:home\s+)?(?:haemo|hemo)dialysis\s+(?:customers?|register|registration|flag|patients?)|home\s+dialysis\s+(?:customers?|register|registration|flag|patients?)|(?:medical|dialysis)\s+priority\s+(?:register|customers?|flag))\b
confidence: low
confidence_justification: >-
  Low: there is no statutory water special-needs register in Queensland. The anchors come from one verified provider charter (Urban Utilities: special needs customer, special needs residential property, home haemodialysis, confirmed by a registered medical specialist, treating hospital or dialysis centre, four business days' notice) and the Code's topic as described by the Queensland Government; other providers' register names and fields are unverified. "Special needs customer" is also used outside water (transport, disability services), so enforce tiers need populated premises, medical or priority fields and 85 needs water-operations evidence. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - South-East Queensland Water (Distribution and Retail Restructuring) Act 2009 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - health
  - pii
corroborative_evidence:
  keywords:
    - special needs customer
    - special needs residential property
    - home haemodialysis
    - dialysis centre
    - uninterrupted supply
    - planned interruption
    - four business days
    - treating hospital
  proximity: 300
customisation:
  - key: utility-account-number
    kind: identifier-format
    identifier: utility-account-number
    target: purview.regexes/Regex_au_qld_water_special_needs_customer_field
    mode: extend
    affects_tiers:
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's utility customer account number format (see docs/identifiers.md#utility-account-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Special needs register - water supply\nCustomer name: Taylor Testwell\nAccount number: 6120447731\nService address: 22 Paperbark Street, Redcliffe QLD 4020\nMedical need: home haemodialysis (three sessions weekly)\nConfirmed by: Dr Sam Kidwell, Redcliffe Hospital renal unit\nNotice required: 4 business days before any planned interruption\nEmergency supply: bottled water and tanker delivery"
      description: Register entry with customer, account, address, medical need, confirmation and notice period (85 tier)
      synthetic: true
    - value: "Special needs customer flag added.\nAccount holder: Robin Teston\nProperty address: 3/41 Coral Sea Drive, Hervey Bay QLD 4655\nRestriction exemption: yes\nNotification priority: high - call before any shutdown on the water main."
      description: Account flag with holder, address, restriction exemption and notification priority (85 tier)
      synthetic: true
    - value: "Home dialysis customer - service address: 9 Tamarind Street, Cairns QLD 4870. Crew to confirm before isolating the main."
      description: Crew note with a premises address only (75 tier)
      synthetic: true
    - value: "Special needs residential property registration received. Treating hospital: Princess Alexandra Hospital. Awaiting account details."
      description: Registration with a treating hospital only (75 tier)
      synthetic: true
  should_not_match:
    - value: "Special needs customers: if someone at your property needs an uninterrupted water supply for home haemodialysis or another medical need, let us know and we will give you extra notice of planned interruptions."
      description: Customer charter wording (paraphrased; 65 only)
    - value: "Glossary. Special needs residential property is a property where an occupant requires an uninterrupted supply of water for life support or other medical needs, as confirmed by a medical specialist or dialysis centre."
      description: Charter glossary definition, suppressed by the glossary exclusion
    - value: "Special needs register - blank template\nCustomer name: __________\nService address: __________\nMedical need: <select>\nNotice required: ___ business days"
      description: Blank register form (65 only)
    - value: "Unitywater has reminded home dialysis patients to register with the utility ahead of planned works in Caboolture next week."
      description: News / community notice (65 only)
false_positives:
  - description: Water provider customer charters, glossaries, eligibility pages and the SEQ Customer Water and Wastewater Code.
    mitigation: Enforce tiers need populated premises, medical or priority fields; charter, glossary and code wording is excluded.
  - description: Non-water "special needs customer" records (transport, disability services, energy).
    mitigation: A populated address can take these to 75; 85 also needs a customer field and water-operations evidence. Energy life support records are covered by au-energy-life-support-register and energy rule text is excluded.
  - description: Council disaster vulnerable persons registers that list dialysis patients.
    mitigation: These may also reach 75 through the address and medical fields; they are equally sensitive, so the overlap is acceptable.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_water_special_needs_primary
      matches:
        - ref: Regex_au_qld_water_special_needs_premises_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_water_special_needs_medical_field
            - Regex_au_qld_water_special_needs_priority_field
        - ref: Regex_au_qld_water_special_needs_customer_field
        - ref: Keyword_au_qld_water_special_needs_water_ops
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_water_special_needs_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_water_special_needs_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_water_special_needs_premises_field
            - Regex_au_qld_water_special_needs_medical_field
            - Regex_au_qld_water_special_needs_priority_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_water_special_needs_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_water_special_needs_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_water_special_needs_primary
      pattern: >-
        (?i)\b(?:special\s+needs\s+(?:customers?|residential\s+propert(?:y|ies)|propert(?:y|ies)|register|registration|flag(?:ged)?|premises|occupants?)|uninterrupted\s+(?:and\s+unrestricted\s+)?(?:water\s+)?supply\s+for\s+(?:life\s+support|(?:special\s+)?medical)|(?:home\s+)?(?:haemo|hemo)dialysis\s+(?:customers?|register|registration|flag|patients?)|home\s+dialysis\s+(?:customers?|register|registration|flag|patients?)|(?:medical|dialysis)\s+priority\s+(?:register|customers?|flag))\b
    - id: Regex_au_qld_water_special_needs_premises_field
      pattern: >-
        (?i)\b(?:(?:service|supply|property|premises|site|connection)\s+address\s*[:#]\s*(?:(?:Unit|Lot|Apt|Flat)\s+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?\s+[A-Z][A-Za-z'-]{1,30}|(?:property|assessment)\s+(?:no\.?|number)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9/-]{3,15}\b|(?:water\s+)?meter\s+(?:no\.?|number|serial(?:\s+(?:no\.?|number))?)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z-]{0,4}\d)[A-Z0-9][A-Z0-9-]{4,15}\b)
    - id: Regex_au_qld_water_special_needs_medical_field
      pattern: >-
        (?i)\b(?:(?:medical\s+(?:needs?|requirement|condition|equipment)|equipment(?:\s+type)?|treatment(?:\s+type)?|reason\s+for\s+registration|special\s+need)\s*[:#]\s*(?:an?\s+)?(?:home\s+)?(?:(?:haemo|hemo)dialysis|(?:peritoneal\s+|kidney\s+|renal\s+)?dialysis|life\s+support|oxygen|ventilator|tracheostomy)|(?:confirmed|certified)\s+by\s*[:#]?\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|registered)\b|_{2,}|\[|<)(?:Dr\.?\s+)?[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:treating\s+(?:specialist|nephrologist|doctor|hospital|renal\s+unit)|dialysis\s+(?:centre|center|unit)|renal\s+unit|medical\s+specialist)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}|medical\s+confirmation\s+(?:received|date)\s*[:#]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}))
    - id: Regex_au_qld_water_special_needs_priority_field
      pattern: >-
        (?i)\b(?:(?:notification|contact|customer)\s+priority\s*[:#-]\s*(?:high|urgent|critical|priority|P?[1-3]\b)|(?:advance\s+)?notice\s+(?:period|required)\s*[:#-]\s*\d{1,2}\s+(?:business\s+)?days|(?:alternate|alternative|emergency)\s+(?:water\s+)?supply(?:\s+arrangement)?\s*[:#-]\s*(?!(?:n/?a|unknown|tbc|tba|see|refer|select)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9 ,.'-]{2,40}|(?:restriction|disconnection|shut-?off)\s+(?:exempt(?:ion)?|excluded|block|hold)\s*[:#-]\s*(?:yes|applied|active|in\s+place)|(?:registration|register|review)\s+date\s*[:#]\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}))
    - id: Regex_au_qld_water_special_needs_customer_field
      pattern: >-
        (?i)\b(?:(?:customer|account\s+holder|occupant|tenant|patient|resident|registered\s+person)(?:\s+(?:full\s+)?name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:water\s+)?(?:customer|account)\s+(?:no\.?|number|ID)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9-]{4,15}\b)
  keywords:
    - id: Keyword_au_qld_water_special_needs_water_ops
      groups:
        - match_style: word
          terms:
            - interruption
            - interruptions
            - shutdown
            - shut-off
            - water main
            - water meter
            - water account
            - sewerage
            - planned works
            - mains break
            - Urban Utilities
            - Unitywater
      strength: domain
    - id: Keyword_au_qld_water_special_needs_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - customer charter
            - Residential Customer Charter
            - Customer Water and Wastewater Code
            - published on our website
            - this policy
            - fact sheet
            - frequently asked questions
            - glossary
            - is a property where
            - how to register
            - National Energy Retail Rules
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a water special-needs register entry or customer flag that ties a named person and property to dependence on an uninterrupted water supply for home haemodialysis or other life support. It is health information about a person linked to the location where a vulnerable patient lives, and the register is the safeguard that stops unnotified shutdowns or restriction for non-payment; disclosure exposes health status and home location, and loss or tampering can put a patient at risk during planned or emergency works. Charters, glossaries and blank forms are excluded. Risk 9 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: Urban Utilities - Residential Customer Charter (special needs customers, home haemodialysis, special needs residential property definition, four business days' notice)
    url: https://www.urbanutilities.com.au/sfsites/c/cms/delivery/media/MCNTSA4NMUDFDS5ATI7WAZDOBCEI
  - title: Business Queensland - Customer protections (SEQ Customer Water and Wastewater Code covers customers and tenants with special needs for an uninterrupted supply of water)
    url: https://www.business.qld.gov.au/industries/mining-energy-water/water/industry-infrastructure/industry-regulation/obligations/customer-protections
  - title: Water Supply (Safety and Reliability) Act 2008 (Qld) - checked; contains no special-needs or dialysis provision
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2008-034
