    url: https://energy-rules.aemc.gov.au/storage/rules/ea1906d07927e4ba3bf5da59bf1d891308cfabda/assets/files/NERR%20-%20v37%20-%20Full.pdf
  - title: AEMC - NERR Part 7 extract
    url: https://www.aemc.gov.au/sites/default/files/2021-03/NERR%20-%20v25%20-%20Part%207.pdf
  - title: Energy Locals - Medical Confirmation Form (retailer form headings)
    url: https://public.energylocals.com.au/public/Energy-Locals-Medical-Confirmation-Form.pdf
  - title: Energex - Life support customers
    url: https://www.energex.com.au/outages/be-prepared-for-outages/life-support-customers
  - title: AEMC - Improving life support processes (rule change, commences 1 December 2027)
    url: https://www.aemc.gov.au/rule-changes/improving-life-support-processes
