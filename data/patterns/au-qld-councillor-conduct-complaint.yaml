schema: testpattern/v1
name: Queensland Councillor Conduct Complaint (OIA)
slug: au-qld-councillor-conduct-complaint
version: 1.1.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Complaints, assessments, investigations and referrals about councillor conduct handled by the Office of the Independent Assessor (OIA), councils and the Councillor Conduct Tribunal: conduct breaches, misconduct, unsuitable meeting conduct, conflicts of interest and release of confidential information.
operation: >-
  Primary: Queensland Councillor Conduct Complaint (OIA) anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:OIA\s+ref(?:erence)?|Office\s+of\s+the\s+Independent\s+Assessor|Independent\s+Assessor|Councillor\s+Conduct\s+Tribunal|unsuitable\s+meeting\s+conduct|conduct\s+breach|councillor\s+(?:misconduct|conduct\s+complaint)|breach\s+of\s+the\s+(?:councillor\s+)?code\s+of\s+conduct)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Local Government Act 2009 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - government
  - legal
  - pii
corroborative_evidence:
  keywords:
    - complainant
    - allegation
    - natural justice
    - investigation
    - conflict of interest
    - prescribed conflict of interest
    - declarable conflict of interest
    - confidential information
  proximity: 300
customisation:
  - key: oia-complaint-reference
    kind: identifier-format
    identifier: oia-complaint-reference
    target: purview.regexes/Regex_au_qld_councillor_conduct_complaint_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Office of the Independent Assessor complaint reference format (see docs/identifiers.md#oia-complaint-reference). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "OIA reference: OIA-26-00412\nSubject councillor: Cr Riley Teston\nComplainant: Jordan Staffson\nAllegation: misconduct — failed to declare a prescribed conflict of interest in the Lot 12 sale. Natural justice letter issued 02/09/2026."
      description: Populated record 1
      synthetic: true
    - value: The Independent Assessor has referred the conduct breach allegation against Cr Morgan Teston back to council to deal with. The councillor allegedly released confidential information from the closed session on 14 July.
      description: Narrative record 2 without labelled fields (reaches 65 discovery only, by design)
      synthetic: true
    - value: "Councillor Conduct Tribunal decision\nRespondent: Cr Alex Teston\nFinding: misconduct sustained; order to make a public admission and reimburse $4,500."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Anyone can make a complaint about councillor conduct to the Office of the Independent Assessor. Complaints can relate to unsuitable meeting conduct, a conduct breach or misconduct.
      description: Guidance or explainer text
    - value: "Councillor conduct complaint form\nSubject councillor: __________\nComplainant: __________\nDetails of allegation: __________"
      description: Blank form
    - value: The OIA received 1,020 complaints in 2024-25, and 61% were dismissed after preliminary assessment, its annual report says.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_councillor_conduct_complaint_primary
      matches:
        - ref: Regex_au_qld_councillor_conduct_complaint_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_councillor_conduct_complaint_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_councillor_conduct_complaint_primary
      matches:
        - ref: Regex_au_qld_councillor_conduct_complaint_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_councillor_conduct_complaint_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_councillor_conduct_complaint_primary
      pattern: >-
        (?i)\b(?:OIA\s+ref(?:erence)?|Office\s+of\s+the\s+Independent\s+Assessor|Independent\s+Assessor|Councillor\s+Conduct\s+Tribunal|unsuitable\s+meeting\s+conduct|conduct\s+breach|councillor\s+(?:misconduct|conduct\s+complaint)|breach\s+of\s+the\s+(?:councillor\s+)?code\s+of\s+conduct)\b
    - id: Regex_au_qld_councillor_conduct_complaint_record_structure
      pattern: >-
        (?i)\b(?:moved|seconded|mover|seconder|councillor|complainant|respondent|subject\s+councillor|applicant|meeting\s+date|agenda\s+item|item\s+(?:no\.?|number)|report\s+(?:no\.?|number|author)|author|prepared\s+by|file\s+(?:no\.?|number|ref)|OIA\s+ref(?:erence)?|reference\s+(?:no\.?|number)|name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_councillor_conduct_complaint_corroborative
      groups:
        - match_style: word
          terms:
            - complainant
            - allegation
            - natural justice
            - investigation
            - conflict of interest
            - prescribed conflict of interest
            - declarable conflict of interest
            - confidential information
            - disciplinary action
            - dismissed
            - referred
            - councillor
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a queensland councillor conduct complaint (oia) about an identified person, gated on populated record fields. Complaints, assessments, investigations and referrals about councillor conduct handled by the Office of the Independent Assessor (OIA), councils and the Councillor Conduct Tribunal: conduct breaches, misconduct, unsuitable meeting conduct, conflicts of interest and release of confidential information. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Legal.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 supports PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Legal and Medium because an OIA complaint,
    assessment or referral names a councillor and alleged misconduct or conflicts before any finding. PROTECTED is not
    met because the record concerns one conduct matter without the severe consequences needed for significant damage.
  generic:
    classification: Medium
    dlm: Medium Legal
    rationale: >-
      Medium Legal handling protects unresolved conduct allegations against a named councillor and the complainant's
      involvement.
references:
  - title: OIA — Misconduct complaints
    url: https://www.oia.qld.gov.au/our-work/misconduct-complaints
  - title: Councillor Conduct Tribunal
    url: https://www.dlgwv.qld.gov.au/local-government/for-councils/governance/councillor-conduct-tribunal
