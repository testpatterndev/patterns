  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated individual student health and emergency plan using record context and corroborating fields.",
  "pattern": "(?i)(?:individual (?:student )?health plan|emergency health plan|student (?:asthma|anaphylaxis|diabetes) (?:action |management )?plan)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
  "regulations": [],
  "frameworks": [],
  "data_categories": [
    "education",
    "pii"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated individual student health and emergency plan can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://ppr.qed.qld.gov.au/pp/managing-students-health-support-needs-at-school-procedure"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
