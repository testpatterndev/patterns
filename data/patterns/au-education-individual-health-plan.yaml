    "label_domains": [
      "education",
      "privacy"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:individual (?:student )?health plan|emergency health plan|student (?:asthma|anaphylaxis|diabetes) (?:action |management )?plan)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:condition|diagnosis)[ \\t]*:[ \\t]*[A-Z][A-Z .-]{2,70}"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:school support|emergency action|support procedure|action plan|management action)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{4,100}"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      }
    ]
  },
