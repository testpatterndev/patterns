changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Merge global-top500-407-lawful-intercept-transcripts into this classifier (Qld government classifier review 2026-09-24): renamed to "Lawful Interception Warrant and Intercept Product". Interception-phrase regex gains lawful interception, interception product, intercept(ed) (call) transcript, intercepted communications / calls and telephone / line intercept, and becomes a second primary family (65 phrase / 75 plus one populated intercept record field, TIA / SCW reference or IMEI / 85 plus two record fields or two independent evidence types). New Regex_..._intercept_record_fields recognises populated warrant number, target service / line / number, intercepted line, line / session / call / product number, A- / B-party, IMSI and MSISDN fields. TIA-reference 85 tier simplified (it required every evidence type at once, including both TIA and SCW references, and no test reached it) to interception keyword plus one of record fields, warrant-process terms, secrecy markers or IMEI. Corroborative terms that duplicate record fields or primary phrases (IMEI, target service, mobile number, interception product) removed from that list to avoid same-span double counting. Not imported: phone tap, wiretap, wire intercept, electronic surveillance, surveillance transcript and intercept order (US / news vocabulary, and surveillance-device material is a different regime) and the absorbed self-corroborating label/domain tiers. Added intercept transcript and line-log positives (85), a 75 cover note, and vendor-copy and procedure decoys. Risk unchanged at 10.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1476 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
