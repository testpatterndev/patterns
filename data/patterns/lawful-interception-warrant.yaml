schema: testpattern/v1
name: Lawful Interception Warrant and Intercept Product
slug: lawful-interception-warrant
version: 1.4.0
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects telecommunications interception warrants, stored communications warrants and the intercept product they produce (call transcripts, line / session logs, intercepted communications) under the Telecommunications (Interception and Access) Act 1979 (Cth). Disclosure of the existence of an interception warrant or of interception product is a criminal offence under the TIA Act and alerts targets to switch to unmonitored channels. Absorbs the former lawful-intercept-transcripts classifier.
operation: 'Two detector families within 300 characters. (1) TIA warrant reference primary: 65 alone (discovery); 75 with an interception keyword; 85 with an interception keyword plus target / intercept record fields, IMEI, warrant-process terms or secrecy markers. (2) Interception phrase primary (telecommunications / lawful interception, TIA Act, interception / stored communications / B-party warrant, interception product, intercept(ed) call transcript, intercepted communications, telephone / line intercept): 65 phrase only (discovery); 75 plus one populated intercept record field (warrant number, target service / line / number, intercepted line, line / session / call / product number, A- or B-party, IMSI, MSISDN), a TIA / SCW warrant reference or an IMEI; 85 plus two distinct record fields, or two different independent evidence types (record fields, warrant references, IMEI, warrant-process terms such as eligible judge / issuing authority / carrier). Negative keyword exclusion for parliamentary, academic and media contexts.'
pattern: (?i)\b(?:telecommunications\s+interception|TI\s+warrant|TIA\s+Act|interception\s+warrant|stored\s+communications\s+warrant|preservation\s+notice|B-party\s+warrant|lawful\s+interception|interception\s+product|intercept(?:ed)?\s+(?:call\s+)?transcripts?|intercepted\s+(?:communications?|calls?)|(?:telephone|line)\s+intercepts?)\b
confidence: medium
confidence_justification: 'Medium confidence: the combination of TIA Act-specific terminology with warrant reference numbers and target identifiers is highly distinctive. These terms rarely appear together outside genuine interception warrant documents. The s.63 secrecy provisions referenced in these documents are unique identifiers.'
jurisdictions:
  - au
regulations:
- "PPRA 2000 (Qld)"
- "TIA Act 1979 (Cth)"
frameworks:
- QGISCF
data_categories:
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - PROTECTED
    - Law-Enforcement
    - TIA Act
    - section 63
    - s.63
    - secrecy provision
    - interception agency
    - issuing authority
    - eligible judge
    - nominated AAT member
    - telephone intercept
    - stored communications
    - preservation notice
    - target service
    - IMEI
    - interception product
  proximity: 300
  keyword_lists:

    - law-enforcement

    - government-services
    - en-government-classification
test_cases:
  should_match:
    - value: 'PROTECTED Law-Enforcement. Telecommunications Interception Warrant — TIA/2025/QPS/00342. Issued by eligible Judge under TIA Act s.46. Target service: mobile number 0412 XXX 789, IMEI 35467209XXXXXX. Interception warrant period: 90 days commencing 15 February 2025. Subject: Operation FALCON.'
      description: TIA Act interception warrant with warrant reference number and target service details
    - value: 'Stored communications warrant application. Reference: SCW-2025-0156. Pursuant to Telecommunications (Interception and Access) Act 1979 (Cth) Part 3-3. Stored communications held by carrier Telstra for target email account. Secrecy obligations under s.63 apply to all recipients of this document.'
      description: Stored communications warrant application with legislative references
    - value: B-party warrant application. The subject of the interception warrant TIA/2025/QPS/00298 has been communicating with an unidentified B-party using prepaid SIM. Application for B-party warrant to identify the associate. TIA Act secrecy provisions noted — disclosure of this warrant is a criminal offence.
      description: B-party warrant application referencing existing interception warrant
    - value: "PROTECTED Law-Enforcement\nTelecommunications interception product - call transcript\nWarrant number: 2026/0417\nTarget service: +61 412 555 019\nSession number: 88213\nB-party number: 07 3555 0192\nDate/time: 12/03/2026 21:14\nMALE 1: The car's at the usual spot, bring the rest Thursday.\nMALE 2: Yeah, same as last time."
      description: Intercept call transcript with warrant number, target service, session and B-party fields (85, absorbed intercept-transcript scope)
      synthetic: true
    - value: "Lawful interception - line activity summary for week 11.\nLine ID: L4471\nIMSI: 505013456789012\nIntercepted communications: 14 SMS, 3 voice calls, 1 data session."
      description: Lawful interception line log with line ID and IMSI (85)
      synthetic: true
    - value: "Intercepted call transcript attached for the brief. Warrant number: 2026/0417. Handle in accordance with the secure product register."
      description: Intercept transcript cover note with one labelled warrant number (75)
      synthetic: true
  should_not_match:
    - value: The Parliamentary Joint Committee on Intelligence and Security tabled its annual review of the Telecommunications (Interception and Access) Act 1979. The report noted that 3,247 interception warrants were issued nationally during the reporting period.
      description: Parliamentary committee report with aggregate warrant statistics
    - value: A telecommunications law textbook chapter explaining the legal framework for interception warrants under the TIA Act. The chapter discusses the requirements for issuing an interception warrant and the secrecy provisions in s.63.
      description: Legal textbook explaining TIA Act framework
    - value: ABC News reported that federal police obtained telecommunications interception warrants as part of a drug trafficking investigation. Three men were arrested following the 18-month investigation.
      description: News article about a concluded investigation mentioning warrants
    - value: Our 5G core supports lawful interception interfaces, so carriers can deliver interception product to agencies in real time with full audit logging.
      description: Telecommunications vendor product copy about lawful interception capability (discovery only)
    - value: "Procedure: interception product must be stored in the secure repository and every access logged. Transcripts of intercepted communications may only be communicated as permitted by the TIA Act."
      description: Agency procedure about handling intercept product without any warrant or target record (discovery only)
false_positives:
  - description: Parliamentary reports and reviews discussing TIA Act warrant statistics in aggregate
    mitigation: 'Negative keyword exclusion: ''parliamentary'', ''annual review'', ''reporting period'', ''tabled'', ''committee''. Require proximity to specific target identifiers.'
  - description: Legal textbooks and academic materials explaining interception law
    mitigation: 'Negative keyword exclusion: ''textbook'', ''academic'', ''university'', ''chapter'', ''legal framework'', ''explains'''
  - description: News articles reporting on completed investigations that involved warrants
    mitigation: 'Negative keyword exclusion: ''media release'', ''news'', ''reported'', ''arrested'', ''convicted'', ''sentenced'', ''court heard'''
  - description: Carrier / vendor material describing lawful interception capability, and agency procedures for handling interception product
    mitigation: Phrase-only matches stay at the 65 discovery tier; enforce tiers need a populated intercept record field, warrant reference or IMEI.
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_lawful_interception_warrant_tia_warrant_reference
      matches:
        - ref: Evidence_lawful_interception_warrant_primary_keywords
        - type: any
          refs:
            - Regex_lawful_interception_warrant_intercept_record_fields
            - Evidence_lawful_interception_warrant_corroborative_terms
            - Evidence_lawful_interception_warrant_classification_markers
            - Pattern_lawful_interception_warrant_imei_pattern
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_lawful_interception_warrant_exclusion
    - confidence_level: 85
      id_match: Pattern_lawful_interception_warrant_interception_terms
      matches:
        - ref: Regex_lawful_interception_warrant_intercept_record_fields
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_lawful_interception_warrant_exclusion
    - confidence_level: 85
      id_match: Pattern_lawful_interception_warrant_interception_terms
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_lawful_interception_warrant_intercept_record_fields
            - Pattern_lawful_interception_warrant_tia_warrant_reference
            - Pattern_lawful_interception_warrant_scw_reference
            - Pattern_lawful_interception_warrant_imei_pattern
            - Evidence_lawful_interception_warrant_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_lawful_interception_warrant_exclusion
    - confidence_level: 75
      id_match: Pattern_lawful_interception_warrant_interception_terms
      matches:
        - type: any
          refs:
            - Regex_lawful_interception_warrant_intercept_record_fields
            - Pattern_lawful_interception_warrant_tia_warrant_reference
            - Pattern_lawful_interception_warrant_scw_reference
            - Pattern_lawful_interception_warrant_imei_pattern
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_lawful_interception_warrant_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_lawful_interception_warrant_interception_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_lawful_interception_warrant_exclusion
    - confidence_level: 75
      id_match: Pattern_lawful_interception_warrant_tia_warrant_reference
      matches:
        - ref: Evidence_lawful_interception_warrant_primary_keywords
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_lawful_interception_warrant_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_lawful_interception_warrant_tia_warrant_reference
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_lawful_interception_warrant_exclusion
  regexes:
    - id: Pattern_lawful_interception_warrant_tia_warrant_reference
      pattern: \bTIA[/\-]\d{4}[/\-][A-Z]{2,5}[/\-]\d{3,6}\b
    - id: Pattern_lawful_interception_warrant_scw_reference
      pattern: \bSCW-\d{4}-\d{3,5}\b
    - id: Pattern_lawful_interception_warrant_interception_terms
      pattern: (?i)\b(?:telecommunications\s+interception|TI\s+warrant|TIA\s+Act|interception\s+warrant|stored\s+communications\s+warrant|preservation\s+notice|B-party\s+warrant|lawful\s+interception|interception\s+product|intercept(?:ed)?\s+(?:call\s+)?transcripts?|intercepted\s+(?:communications?|calls?)|(?:telephone|line)\s+intercepts?)\b
    - id: Pattern_lawful_interception_warrant_imei_pattern
      pattern: \bIMEI\s*:?\s*\d{14,15}\b
    - id: Regex_lawful_interception_warrant_intercept_record_fields
      pattern: >-
        (?i)\b(?:warrant\s*(?:no\.?|number|ref(?:erence)?|ID)|target\s+(?:service|line|number|phone|handset|identifier|ID)|(?:intercepted|monitored)\s+(?:service|line|number)|(?:line|session|call|product)\s*(?:no\.?|number|ID|ref(?:erence)?)|[AB]-party(?:\s+(?:no\.?|number))?|IMSI|MSISDN)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9+][A-Za-z0-9/.+-]{1,30}
  keywords:
    - id: Evidence_lawful_interception_warrant_primary_keywords
      groups:
        - match_style: word
          terms:
            - telecommunications interception
            - TI warrant
            - TIA Act
            - interception warrant
            - stored communications warrant
            - preservation notice
            - B-party warrant
            - lawful interception
            - interception product
            - target service
      strength: specific
    - id: Evidence_lawful_interception_warrant_classification_markers
      groups:
        - match_style: word
          terms:
            - SECRECY PROVISION
            - s.63
      strength: specific
    - id: Evidence_lawful_interception_warrant_corroborative_terms
      groups:
        - match_style: word
          terms:
            - eligible judge
            - AAT member
            - issuing authority
            - interception agency
            - secrecy provision
            - section 63
            - carrier
            - warrant period
      strength: specific
    - id: Filter_lawful_interception_warrant_exclusion
      groups:
        - match_style: word
          terms:
            - media release
            - published
            - annual report
            - annual review
            - parliamentary
            - committee
            - textbook
            - academic
            - university
            - news article
            - reported
            - arrested
            - convicted
            - sentenced
            - tabled

      strength: noise
risk_rating: 10
risk_description: >-
  This detector recognises telecommunications interception, stored-communications, or B-party warrants together with warrant references and target services such as phone numbers, IMEI values, or email accounts. Disclosure alerts a target that communications are monitored, prompting migration to unobserved channels and compromising evidence, associates, collection methods, and an active investigation. Parliamentary statistics, textbooks, legal commentary, and news about completed matters are excluded from the normal true positive. Risk 10 requires PROTECTED Law-Enforcement because the warrant's existence and targeting data are operationally decisive and statutorily restricted; no higher QGISCF tier exists.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Law-Enforcement
