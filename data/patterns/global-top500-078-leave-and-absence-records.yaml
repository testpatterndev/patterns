schema: testpattern/v1
name: Leave and absence records
slug: global-top500-078-leave-and-absence-records
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects leave applications, leave requests and absence records for an identified employee (annual, sick/personal, carer's, compassionate, parental, long service leave, leave without pay), with leave type, dates, hours/days taken or balances.
operation: >-
  Primary: a leave phrase (leave record/application/request, absence record, annual/sick/personal/carer's/compassionate/parental/long service leave, leave without pay). 75 tier requires a populated person field (employee/staff name or number, payroll number, position number or title, work unit) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated leave detail (leave/start/end/return date, days or hours taken, leave balance, or leave type) and an independent corroborative term (medical certificate, statutory declaration, approved, manager approval, return to work). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:leave\s+(?:record|application|request|form|entitlement)|absence\s+(?:record|management)|annual\s+leave|sick\s+leave|personal\s+leave|carer'?s\s+leave|compassionate\s+leave|parental\s+leave|long\s+service\s+leave|leave\s+without\s+pay)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - medical certificate
    - statutory declaration
    - approved
    - manager approval
    - return to work
    - payroll
    - cost centre
    - rostered
  proximity: 300
test_cases:
  should_match:
    - value: "Leave application\nEmployee name: Avery Teston\nEmployee ID: 4471820\nLeave type: Sick leave\nStart date: 15/09/2026\nEnd date: 17/09/2026\nBalance: 42.5 hours\nMedical certificate attached; approved by Jordan Staffson."
      description: '85: Leave application with employee, type, dates and balance'
      synthetic: true
    - value: "Absence record\nPosition number: 30012345\nParental leave from 01/10/2026 to 31/03/2027\nDays taken: 0\nReturn to work plan to be agreed with payroll."
      description: '85: Absence record with position number and parental leave dates'
      synthetic: true
    - value: "Long service leave request\nStaff member: Morgan Teston\nWould like to discuss taking the leave after the end of the project."
      description: '75: Leave request naming the staff member, no dates'
      synthetic: true
  should_not_match:
    - value: Full-time employees get 4 weeks of annual leave and 10 days of personal leave each year. This fact sheet explains how leave requests work.
      description: Fact sheet - must stay below 75
    - value: "Leave application form\nEmployee name: __________\nLeave type: __________\nStart date: ___/___/____\nEnd date: ___/___/____"
      description: Blank form - must stay below 75
    - value: Workers took 12% more sick leave this winter, the survey found, according to a media release.
      description: News / media release - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_078_leave_and_absence_records_primary
      matches:
        - ref: Regex_top500_078_leave_and_absence_records_person_field
        - ref: Regex_top500_078_leave_and_absence_records_record_detail
        - ref: Keyword_top500_078_leave_and_absence_records_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_078_leave_and_absence_records_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_078_leave_and_absence_records_primary
      matches:
        - ref: Regex_top500_078_leave_and_absence_records_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_078_leave_and_absence_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_078_leave_and_absence_records_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_078_leave_and_absence_records_primary
      pattern: >-
        (?i)\b(?:leave\s+(?:record|application|request|form|entitlement)|absence\s+(?:record|management)|annual\s+leave|sick\s+leave|personal\s+leave|carer'?s\s+leave|compassionate\s+leave|parental\s+leave|long\s+service\s+leave|leave\s+without\s+pay)\b
    - id: Regex_top500_078_leave_and_absence_records_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_078_leave_and_absence_records_record_detail
      pattern: >-
        (?i)\b(?:(?:leave|absence)\s+(?:dates?|period|from)|(?:start|end|commencement|return|first\s+day|last\s+day)\s+(?:date|of\s+leave)|date\s+(?:from|to))\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|\b(?:days|hours)\s+(?:taken|requested|applied\s+for)\s*[:\-]?\s*\d{1,3}(?:\.\d{1,2})?|\b(?:balance|accrued|remaining)\s*(?:\([^)]{1,20}\))?\s*[:\-]\s*-?\d{1,4}(?:\.\d{1,2})?\s*(?:hours?|hrs?|days?|weeks?)\b|\bleave\s+type\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z][a-z]{2,}
  keywords:
    - id: Keyword_top500_078_leave_and_absence_records_corroborative
      groups:
        - match_style: word
          terms:
            - medical certificate
            - statutory declaration
            - approved
            - manager approval
            - return to work
            - payroll
            - cost centre
            - rostered
      strength: specific
    - id: Keyword_top500_078_leave_and_absence_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a leave application or absence record for an identified employee about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Leave records can reveal illness, caring responsibilities, pregnancy or bereavement for an identifiable employee. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: Fair Work Ombudsman - Leave
    url: https://www.fairwork.gov.au/leave
  - title: Fair Work Regulations 2009 (Cth) - regs 3.31-3.46 employee records and pay slips
    url: https://www.legislation.gov.au/F2009L02356/latest/text
  - title: Industrial Relations Act 2016 (Qld) - ss 339-340 time and wages records
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2016-063
