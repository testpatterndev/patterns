schema: testpattern/v1
name: Student disciplinary records
slug: global-top500-344-student-disciplinary-records
version: 1.3.3
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to student disciplinary records in international contexts. This information
  type is classified as personally identifiable information under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 7 keywords within 300 characters. Keyword lists: industry-education. Uses additional domain-context
  evidence and explicit exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:student\s+disciplinary|disciplinary\s+record|academic\s+integrity|plagiarism\s+case|code\s+of\s+conduct|disciplinary\s+hearing|student\s+conduct)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
  - GDPR
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
  - student disciplinary records
  - student
  - disciplinary
  - records
  - education
  - research
  - administration
  proximity: 300
  keyword_lists:
  - industry-hr
  - industry-education
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
  - value: student disciplinary
    description: Primary topic phrase match
  - value: disciplinary record
    description: Case-insensitive topic phrase match
  - value: academic integrity
    description: Alternative topic phrase match
  - value: plagiarism case
    description: Additional topic phrase match
  - value: "student disciplinary\nStudent name: Avery Teston\nStudent ID: S4471820\nYear level: 9\nParent: Jordan Teston\nNotes: student disciplinary discussed with the family on 12/08/2026."
    description: Populated student record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: student grant
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about student disciplinary are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Common words and phrases related to student disciplinary records appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: This global concept detector identifies student disciplinary, disciplinary record, and academic integrity
  language with nearby education evidence. A normal true positive is a student-specific case containing allegations, investigative
  material, findings, sanctions, and appeal information that can harm reputation and procedural fairness. Public conduct codes,
  integrity training, and empty case templates may also trigger the medium-confidence pattern without identifying any learner.
  Risk 8 SENSITIVE fits one disciplinary proceeding, while PROTECTED requires exceptional safeguarding issues, mass case exposure,
  or significant institutional damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, Personal-Privacy DLM, SENS_Pvc, and Medium classification
    for an identified disciplinary case. The next PROTECTED level is not met because a normal match does not establish
    acute safety risk, protected witnesses, bulk histories, or significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Generic Medium Personal-Privacy handling protects allegations and sanctions across jurisdictions while recognising
      common policy and academic-integrity training language.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_student_disciplinary_records
      matches:
        - ref: Regex_global_top500_344_student_disciplinary_records_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_student_disciplinary_records
      matches:
        - ref: Regex_global_top500_344_student_disciplinary_records_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_student_disciplinary_records
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_student_disciplinary_records
      pattern: (?is)\b(?:student\s+disciplinary|disciplinary\s+record|academic\s+integrity|plagiarism\s+case|code\s+of\s+conduct|disciplinary\s+hearing|student\s+conduct)\b
    - id: Regex_global_top500_344_student_disciplinary_records_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|candidate|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|(?:student|candidate|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
references:
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "OAIC - Notifiable Data Breaches scheme"
    url: https://www.oaic.gov.au/privacy/notifiable-data-breaches
frameworks:
  - ISO 27001
  - ISO 27701
