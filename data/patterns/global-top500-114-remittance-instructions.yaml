schema: testpattern/v1
name: Remittance instructions
slug: global-top500-114-remittance-instructions
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: Detects references to remittance instructions in financial and compliance documents. Commonly found in international regulatory filings, transaction records, and audit documentation.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 6 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?is)\b(?:remittance\s+instructions?|payment\s+instruction|bank\s+transfer|wire\s+transfer|correspondent\s+bank|intermediary\s+bank|payment\s+reference|remit\s+to|funds\s+transfer)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - remittance instructions
    - remittance
    - instructions
    - financial
    - accounts
    - payments
  proximity: 300
  keyword_lists:
    - corporate-finance
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: payment instruction
      description: Primary topic phrase match
    - value: 'remit to beneficiary account'
      description: Topic phrase match (remit to)
    - value: wire transfer
      description: Alternative topic phrase match
    - value: correspondent bank
      description: Additional topic phrase match
    - value: |-
        Payment instruction
        Payee: Riverbend Supplies Pty Ltd
      description: Populated payee/account with one field (75 tier)
      synthetic: true
    - value: |-
        Payment instruction
        Payee: Riverbend Supplies Pty Ltd
        BSB: 064-000
      description: Populated payee/account with 2 distinct fields (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: office supplies purchase order summary
      description: No remittance/payment topic phrases present
    - value: Remittance instructions
      description: "Bare detector name (regression guard): the IdMatch does not match it alone, but the generated name-word tier lifted it to 75 next to any IdMatch phrase; it must not reach an enforcing tier"
    - value: |-
        Payment instruction:
        Payee:
        Account name:
        Account number:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about payment instruction are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In English (as the primary international business language), standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_remittance
      matches:
        - ref: Regex_global_top500_114_remittance_instructions_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_remittance
      matches:
        - ref: Regex_global_top500_114_remittance_instructions_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_remittance
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_remittance
      pattern: (?is)\b(?:remittance\s+instructions?|payment\s+instruction|bank\s+transfer|wire\s+transfer|correspondent\s+bank|intermediary\s+bank|payment\s+reference|remit\s+to|funds\s+transfer)\b
    - id: Regex_global_top500_114_remittance_instructions_record_structure
      pattern: (?i)\b(?:payee|supplier|vendor|creditor|beneficiary|account\s+name|BSB|account\s+(?:no\.?|number)|invoice\s+(?:no\.?|number)|remittance\s+(?:no\.?|number|ref(?:erence)?)|amount\s+paid|IBAN|SWIFT(?:\s*/\s*BIC)?|BIC|sort\s+code)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
risk_description: >-
  Remittance instructions detects payment-direction language such as remit to, beneficiary account, correspondent bank, and wire transfer within financial context. A normal match may be a template, published guidance, or correspondence that discusses where payment information belongs without containing a complete approved transfer order. An attacker would still need accurate beneficiary details, authority, and a successful process compromise to redirect funds, so standalone harm is limited. Risk 4 and OFFICIAL are defensible; SENSITIVE would be warranted for a live instruction containing complete routing, beneficiary, amount, and authorization details.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 maps to OFFICIAL, OFFICIAL DLM, label OFFI, and the Low tier for this medium-confidence concept match. The
    next SENSITIVE level is not met until the detected material is an actionable, approved payment instruction rather
    than remittance terminology or an incomplete template.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic treatment suits remittance context that is not independently executable and depends on complete
      banking details plus payment authority for abuse.
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
created: '2026-02-08'
updated: '2026-10-20'
changelog:
  - version: 1.3.0
    date: '2026-10-20'
    description: 'Generated name-word tier removed: the 75 tier ANDed Pattern_*_label_context (the detector name, "Remittance instructions") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 75. The IdMatch does not match the bare name, so it scored 0 alone, but the name as a heading lifted any IdMatch phrase near it. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs a populated payee/account field (Regex_global_top500_114_remittance_instructions_record_structure); 85 needs 2 distinct fields. Curated terms that sit inside an IdMatch hit were removed. "remittance" is the detector name; "beneficiary", "SWIFT" and "IBAN" without a value are not a record, so they are now populated-field labels. The detector name is the identifying phrase but lived only in the generated label regex, so the IdMatch now accepts "remittance instructions" (65 discovery; enforcing still needs a populated field). Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
  - version: 1.2.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.2.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 2 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1673 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
