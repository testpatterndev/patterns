schema: testpattern/v1
name: NEM Settlement Statement and Billing Data (participant-confidential)
slug: au-nem-settlement-statement-data
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects a NEM market participant's own AEMO settlement and billing data: extracts of the MMS Data Model tables that
  AEMO marks Private (visible only to the participant they belong to) - SET_ENERGY_TRANSACTIONS, SET_ENERGY_GENSET_DETAIL,
  SETGENDATA, SETCPDATA, SET_FCAS_PAYMENT / SET_FCAS_RECOVERY, SET_RECOVERY_ENERGY, SETMARKETFEES, SETREALLOCATIONS and
  the BILLING_RUN equivalents (BILLING_ENERGY_TRANSACTIONS, BILLINGGENDATA, BILLINGCPDATA, BILLINGASPAYMENTS,
  BILLINGFEES, BILLINGPRIORADJUSTMENTS, ...) - and AEMO preliminary, final and revision settlement statements for a
  billing week. The data gives a participant's metered energy, settlement amounts by connection point or generating
  unit, ancillary-service payments and recoveries, market fees and reallocations. The tables AEMO publishes (DAYTRACK,
  BILLINGRUNTRK, BILLINGDAYTRK, SETCPDATAREGION, SET_ENERGY_REGION_SUMMARY, SET_ANCILLARY_SUMMARY, SETIRSURPLUS,
  SET_RUN_PARAMETER, BILLINGREGIONFIGURES) are deliberately not anchors. Companion to au-nem-bid-file (bids) and
  au-energy-hedge-position-report (contract positions).
operation: >-
  Two primaries. Table path: an AEMO Private settlement or billing table name. 75 needs, within 300 characters, two
  distinct run-key columns (CONTRACTYEAR, WEEKNO, BILLRUNNO, SETTLEMENTDATE, VERSIONNO, PERIODID, PARTICIPANTID,
  CONNECTIONPOINTID); 85 also needs a settlement amount or energy column (TOTAL_AMOUNT, ACE_AMOUNT, ASOE_AMOUNT,
  ENERGYCOST, EXCESSENERGYCOST, NETENERGY, TOTAL_MWH, ACE_MWH, CE_MWH, UFEA_MWH). Statement path: "preliminary /
  final / revision (settlement) statement", "settlement statement" or "billing week N". 75 needs an independent NEM
  settlement term (AEMO, bill run, settlement run, trading interval, ancillary services, FCAS, market fees,
  reallocation, DUID, TNI, participant ID) and a dollar amount; 85 also needs a NEM region ID (QLD1, NSW1, VIC1, SA1,
  TAS1) and a second distinct dollar amount. Every tier excludes template text and MMS Data Model documentation framing
  (Data Model Report, Primary Key Columns, Table schema, Official MMS Datatype, NEMWEB) and public reporting (media
  releases, annual reports, notes to the financial statements). 65 is discovery-only.
pattern: >-
  (?i)(\b(?:SET_ENERGY_TRANSACTIONS|SET_ENERGY_GENSET_DETAIL|SET_RECOVERY_ENERGY|SET_FCAS_PAYMENT|SET_FCAS_RECOVERY|SETGENDATA|SETCPDATA|SETMARKETFEES|SETREALLOCATIONS|BILLING_ENERGY_TRANSACTIONS|BILLING_ENERGY_GENSET_DETAIL|BILLING_DAILY_ENERGY_SUMMARY|BILLING_GST_SUMMARY|BILLINGCPDATA|BILLINGGENDATA|BILLINGASPAYMENTS|BILLINGASRECOVERY|BILLINGFEES|BILLINGFINANCIALADJUSTMENTS|BILLINGPRIORADJUSTMENTS|BILLINGREALLOC)\b|\b(?:(?:preliminary|final|revision)\s+(?:settlement\s+)?statement|settlement\s+statement|billing\s+week\s+\d{1,2})\b)
confidence: medium
confidence_justification: >-
  Medium: the Private table names are distinctive, but they also appear in AEMO's public MMS Data Model Report and in
  vendor loader documentation, which list the same column names; documentation framing is excluded within the window
  only. Visibility (Private / Public) of each anchored table was checked against the published data model. The
  statement path leans on generic statement wording and is gated on independent NEM settlement terms plus dollar
  amounts. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
regulations:
  - National Electricity Rules
  - Competition and Consumer Act 2010 (Cth)
  - Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - energy-market
  - trading
  - financial
corroborative_evidence:
  keywords:
    - AEMO
    - billing week
    - bill run
    - settlement run
    - trading interval
    - ancillary services
    - FCAS
    - market fees
    - reallocation
    - DUID
    - TNI
  proximity: 300
scope: narrow
risk_rating: 8
risk_description: >-
  Settlement and billing data shows a participant's metered generation or load and what AEMO paid or charged for it,
  by connection point or generating unit and trading interval, plus ancillary-service income, market fees and
  reallocation (hedge settlement) amounts. Competitors can infer unit output, realised prices and contract cover from
  it; AEMO treats it as confidential to the participant. Disclosure causes direct financial loss and can inform
  trading against the participant. Risk 8, matching au-nem-bid-file and au-energy-hedge-position-report.
references:
  - title: AEMO MMS Data Model Report - SETTLEMENT_DATA package (table list and descriptions)
    url: https://visualisations.aemo.com.au/aemo/nemweb/mmsdatamodelreport/electricity/mms%20data%20model%20report_files/MMS_300.htm
  - title: AEMO MMS Data Model Report - BILLING_RUN package (table list and descriptions)
    url: https://visualisations.aemo.com.au/aemo/nemweb/mmsdatamodelreport/electricity/mms%20data%20model%20report_files/MMS_39.htm
  - title: Third-party mirror of the AEMO MMS Data Model - SETTLEMENT_DATA (per-table Visibility, columns and primary keys)
    url: https://mmsdocs.global-roam.com/MMS/SETTLEMENT_DATA/
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  idcf: DSL-3
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Financial and Medium because participant
    settlement data discloses metered volumes, settlement amounts, ancillary-service income and reallocations that
    competitors could trade against. PROTECTED is not met: the harm falls on one market participant rather than causing
    significant damage to government or the market as a whole.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Medium Financial handling protects a participant's confidential settlement volumes and amounts. High is not met
      because AEMO publishes regional settlement summaries and the data does not enable an attack on a critical system.
package_tags:
  primary_component: energy-generation-market
  components:
    - energy-generation-market
  component_tier: small
  deployment_priority:
    - standard
    - expanded
  sectors:
    - critical-infrastructure
  addons:
    - energy-utility
  label_domains:
    - financial
    - business
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_nem_settlement_table
      matches:
        - ref: Regex_nem_settlement_run_key
          min_count: 2
          unique_results: true
        - ref: Regex_nem_settlement_amount_column
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_nem_settlement_doc_exclusion
    - confidence_level: 85
      id_match: Regex_nem_settlement_statement
      matches:
        - ref: Keyword_nem_settlement_context
        - ref: Regex_nem_settlement_region
        - ref: Regex_nem_settlement_dollar
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_nem_settlement_doc_exclusion
    - confidence_level: 75
      id_match: Regex_nem_settlement_table
      matches:
        - ref: Regex_nem_settlement_run_key
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_nem_settlement_doc_exclusion
    - confidence_level: 75
      id_match: Regex_nem_settlement_statement
      matches:
        - ref: Keyword_nem_settlement_context
        - ref: Regex_nem_settlement_dollar
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_nem_settlement_doc_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_nem_settlement_table
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_nem_settlement_doc_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_nem_settlement_statement
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_nem_settlement_doc_exclusion
  regexes:
    - id: Regex_nem_settlement_table
      pattern: >-
        \b(SET_ENERGY_TRANSACTIONS|SET_ENERGY_GENSET_DETAIL|SET_RECOVERY_ENERGY|SET_FCAS_PAYMENT|SET_FCAS_RECOVERY|SETGENDATA|SETCPDATA|SETMARKETFEES|SETREALLOCATIONS|BILLING_ENERGY_TRANSACTIONS|BILLING_ENERGY_GENSET_DETAIL|BILLING_DAILY_ENERGY_SUMMARY|BILLING_GST_SUMMARY|BILLINGCPDATA|BILLINGGENDATA|BILLINGASPAYMENTS|BILLINGASRECOVERY|BILLINGFEES|BILLINGFINANCIALADJUSTMENTS|BILLINGPRIORADJUSTMENTS|BILLINGREALLOC)\b
    - id: Regex_nem_settlement_statement
      pattern: >-
        (?i)\b((?:preliminary|final|revision)\s+(?:settlement\s+)?statement|settlement\s+statement|billing\s+week\s+\d{1,2})\b
    - id: Regex_nem_settlement_run_key
      pattern: >-
        \b(CONTRACTYEAR|WEEKNO|BILLRUNNO|SETTLEMENTDATE|VERSIONNO|PERIODID|PARTICIPANTID|CONNECTIONPOINTID)\b
    - id: Regex_nem_settlement_amount_column
      pattern: >-
        \b(TOTAL_AMOUNT|ACE_AMOUNT|ASOE_AMOUNT|ENERGYCOST|EXCESSENERGYCOST|NETENERGY|TOTAL_MWH|ACE_MWH|CE_MWH|UFEA_MWH)\b
    - id: Regex_nem_settlement_region
      pattern: >-
        \b(QLD1|NSW1|VIC1|SA1|TAS1)\b
    - id: Regex_nem_settlement_dollar
      pattern: >-
        ((?:-\s?)?\$\s?\d{1,3}(?:,\d{3}){0,4}(?:\.\d{2})?)\b
  keywords:
    - id: Keyword_nem_settlement_context
      groups:
        - match_style: word
          terms:
            - text: AEMO
              case_sensitive: true
            - bill run
            - settlement run
            - trading interval
            - ancillary services
            - text: FCAS
              case_sensitive: true
            - market fees
            - reallocation
            - reallocations
            - text: DUID
              case_sensitive: true
            - text: TNI
              case_sensitive: true
            - participant ID
      strength: specific
    - id: Keyword_nem_settlement_doc_exclusion
      groups:
        - match_style: word
          terms:
            - Data Model Report
            - MMS Data Model
            - Primary Key Columns
            - Table schema
            - Official MMS Datatype
            - NEMWEB
            - media release
            - annual report
            - notes to the financial statements
      strength: specific
test_cases:
  should_match:
    - value: "I,SETTLEMENTS,SET_ENERGY_TRANSACTIONS,1,SETTLEMENTDATE,VERSIONNO,PERIODID,PARTICIPANTID,CONNECTIONPOINTID,REGIONID,RRP,TLF,CE_MWH,TOTAL_MWH,TOTAL_AMOUNT\nD,SETTLEMENTS,SET_ENERGY_TRANSACTIONS,1,2026/09/14 00:00:00,2,17,EXAMPLEGEN,QABC1X,QLD1,84.12,0.9876,52.4,52.4,4407.89"
      description: Participant settlement extract with run keys and an amount column - intended 85
      synthetic: true
    - value: "Weekly reconciliation: BILLING_ENERGY_TRANSACTIONS for CONTRACTYEAR 2026 WEEKNO 38 BILLRUNNO 3 loaded into the settlement ledger."
      description: Billing table with three run-key columns, no amount column - intended 75
      synthetic: true
    - value: "AEMO Final Statement - billing week 38, contract year 2026\nEnergy (QLD1): $1,284,516.20\nAncillary services (FCAS) payments: $42,118.75\nMarket fees: -$3,904.11"
      description: AEMO final statement with region, context and several dollar amounts - intended 85
      synthetic: true
    - value: "Revision statement received from AEMO for the bill run; prior period adjustment $18,240.00 owed to the participant."
      description: Revision statement with AEMO / bill run and one amount - intended 75
      synthetic: true
  should_not_match:
    - value: "Package: SETTLEMENT_DATA. SET_ENERGY_TRANSACTIONS - Visibility: Private. Primary Key Columns: SETTLEMENTDATE, VERSIONNO, PERIODID, PARTICIPANTID, CONNECTIONPOINTID. Table schema: TOTAL_AMOUNT NUMBER(18,8)."
      description: MMS Data Model documentation page for the table (public)
    - value: "I,SETTLEMENTS,DAYTRACK,6,SETTLEMENTDATE,REGIONID,EXANTERUNSTATUS,EXPOSTRUNNO\nI,BILLING,BILLINGRUNTRK,1,CONTRACTYEAR,WEEKNO,BILLRUNNO,STATUS,POSTDATE"
      description: Public settlement tracking tables (DAYTRACK, BILLINGRUNTRK) that AEMO publishes
    - value: "Your final statement for the credit card account shows a closing balance of $2,431.18 due on 14 November."
      description: Bank final statement - no NEM settlement context
    - value: "The final settlement statement for the property purchase was issued by the conveyancer; balance payable $412,000."
      description: Conveyancing settlement statement - no NEM settlement context
    - value: "Notes to the financial statements: AEMO final statement receivables for the June billing week were $14.2m across QLD1 and NSW1 ($9,800,000 and $4,400,000)."
      description: Annual-report note quoting settlement receivables (public)
false_positives:
  - description: AEMO's public MMS Data Model Report and vendor loader documentation list the Private table and column
      names.
    mitigation: Documentation framing (Data Model Report, MMS Data Model, Primary Key Columns, Table schema, Official MMS
      Datatype, NEMWEB) is excluded within the proximity window at every tier.
  - description: AEMO publishes some settlement tables (DAYTRACK, BILLINGRUNTRK, BILLINGDAYTRK, SETCPDATAREGION,
      SET_ENERGY_REGION_SUMMARY, SET_ANCILLARY_SUMMARY, SETIRSURPLUS, SET_RUN_PARAMETER, BILLINGREGIONFIGURES).
    mitigation: Those tables are not in the primary; only tables the data model marks Private are anchors.
  - description: Bank, conveyancing and legal "final statement" / "settlement statement" wording.
    mitigation: The statement path needs an independent NEM settlement term and a dollar amount for 75, and a NEM
      region ID plus two distinct amounts for 85.
exports:
  - purview_xml
  - yaml
created: '2026-10-23'
updated: '2026-10-30'
author: testpattern-community
license: MIT
changelog:
  - version: 1.1.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.0.0
    date: '2026-10-23'
    description: >-
      Initial release from public AEMO MMS Data Model sources. Anchors only on SETTLEMENT_DATA and BILLING_RUN tables
      the data model marks Private; public settlement tables and documentation framing excluded. Table path 75 needs
      two run-key columns and 85 adds an amount column; statement path 75 needs a NEM settlement term and a dollar
      amount and 85 adds a region ID and a second amount.
