schema: testpattern/v1
name: Medication histories
slug: global-top500-324-medication-histories
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies patient medication histories - medication history, drug or prescription history, current medication lists, dispensing records and medication reconciliation - when the phrase sits with populated patient identifiers and medication lines (drug, dose and frequency). Protected health information under applicable data protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: medication-history phrases (medication history, prescription/drug/dispensing history, medication list or chart, current medications, dispensing record, medication reconciliation). 65 (discovery only): phrase alone. 75: phrase plus a populated patient identifier field (name, DOB, URN/MRN, Medicare, IHI, patient/hospital number, treating clinician). 85: patient identifier field plus a medication line (drug name, dose with unit and a frequency such as mane, nocte, BD, PRN) plus independent pharmacy/clinical evidence (pharmacist, prescriber, dispensed, repeats, allergies, adverse drug reaction). Template framing and guidance/training framing are excluded from 75/85.
pattern: (?i)\b(?:medication\s+(?:history|list|chart|profile|reconciliation)|prescription\s+history|drug\s+history|dispensing\s+(?:record|history)|current\s+medications)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated patient identifier, and 85 also needs a dose/frequency medication line plus pharmacy or clinical evidence. Formularies, clinical guidelines and medicines information can carry the phrases and dose lines, but not a patient field, so they stay at 65.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - My Health Records Act 2012 (Cth)
  - Information Privacy Act 2009 (Qld)
  - GDPR
  - HIPAA
data_categories:
- healthcare
- phi
corroborative_evidence:
  keywords:
    - pharmacist
    - prescriber
    - dispensed
    - repeats
    - allergies
    - adverse drug reaction
  proximity: 300
  keyword_lists:
    - au-healthcare-medications
test_cases:
  should_match:
    - value: "MEDICATION HISTORY - admission reconciliation\nPatient: Morgan Ellisdale\nURN: 118204\nDOB: 17/03/1968\nAllergies: penicillin (rash)\nMetformin 500 mg BD\nAtorvastatin 40 mg nocte\nSalbutamol 100 mcg 2 puffs PRN\nPharmacist: Jo Tran - dispensing history checked with community pharmacy"
      description: Populated admission medication history with patient identifiers, dose/frequency lines and pharmacist evidence (85)
      synthetic: true
    - value: "Drug history taken at pre-admission clinic\nPatient name: Casey Rourke\nMRN: 5540921\nNotes: reports only occasional over-the-counter analgesia."
      description: Drug history with labelled patient identifiers but no medication lines (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "patient biometric"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how medication history records are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Medication history form\nPatient name: ____________________\nURN: ____________________\nDate of birth: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: a national medication list service will let pharmacists see dispensing records across providers. Pharmacists said a typical starting regimen of Metformin 500 mg twice daily is often duplicated when patients change clinics."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Medical terminology in health education materials, research publications, clinical guidelines, or public health
    documents without patient-specific data.
  mitigation: Require corroborative evidence keywords confirming patient context. Look for co-occurrence with patient identifiers
    such as medical record numbers or dates of birth.
- description: General wellness and fitness content using medical vocabulary without constituting protected health information.
  mitigation: Layer with patient identifier patterns or healthcare-specific document structure detection to distinguish clinical
    records from general health content.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The detector matches medication-history, prescription-history or drug-history language and enforces only when populated patient identifier fields (with medication dose lines at 85) sit nearby; phrase-only text stays at 65 discovery. Disclosure can reveal chronic disease, psychiatric or reproductive treatment, adherence patterns, and prior therapies, allowing an employer, insurer, acquaintance, or fraudster to infer conditions about the patient. One history can span years and multiple prescribers, creating serious personal harm, although formularies, clinical guidelines, and educational material can also contain the phrases. Risk 8 and SENSITIVE fit the normal patient record; PROTECTED requires a high-consequence protected patient, bulk histories, or a safety-critical medication context.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 coherently maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, Personal-Privacy DLM, and Medium because a
    medication history supports sensitive condition and treatment inferences. PROTECTED is not met without exceptional
    safety, aggregation, or significant-damage circumstances.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy are appropriate for a patient's longitudinal medication record and its
      inferential value. High handling is reserved for exceptional scale or consequence.
purview:
  patterns_proximity: 500
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_medication_histories
      matches:
        - ref: Regex_global_top500_324_medication_histories_patient_fields
        - ref: Regex_global_top500_324_medication_histories_medication_line
        - ref: Keyword_global_top500_324_medication_histories_pharmacy_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_324_medication_histories_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_medication_histories
      matches:
        - ref: Regex_global_top500_324_medication_histories_patient_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_324_medication_histories_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_medication_histories
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_medication_histories
      pattern: (?i)\b(?:medication\s+(?:history|list|chart|profile|reconciliation)|prescription\s+history|drug\s+history|dispensing\s+(?:record|history)|current\s+medications)\b
    - id: Regex_global_top500_324_medication_histories_patient_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|patient(?:\s+name)?|URN|UR\s*(?:no\.?|number)|MRN|medical\s+record\s+(?:no\.?|number)|Medicare(?:\s+(?:card\s+)?(?:no\.?|number))?|IHI|DVA\s+(?:no\.?|number)|(?:patient|client|hospital|case|file|episode)\s*(?:no\.?|number|ID)|(?:referring|treating|requesting)\s+(?:doctor|practitioner|clinician|psychiatrist)|clinician|consultant)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_324_medication_histories_medication_line
      pattern: (?i)\b[A-Z][A-Za-z-]{3,25}(?:[ \t]+[A-Za-z-]{2,20}){0,2}[ \t]{1,3}\d{1,4}(?:\.\d{1,2})?[ \t]{0,2}(?:mg|mcg|microgram|mL|units?|IU|g)\b[^\n]{0,40}?\b(?:daily|mane|nocte|bd|tds|qid|prn|once|twice|weekly|monthly|at\s+night|in\s+the\s+morning|every\s+\d{1,2}\s+hours)\b
  keywords:
    - id: Keyword_global_top500_324_medication_histories_pharmacy_evidence
      groups:
        - match_style: word
          terms:
            - pharmacist
            - prescriber
            - dispensed
            - repeats
            - allergies
            - adverse drug reaction
            - text: PBS
              case_sensitive: true
            - Webster pack
            - dose administration aid
            - ceased
            - commenced
      strength: specific
    - id: Keyword_global_top500_324_medication_histories_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
