schema: testpattern/v1
name: ACH company and originator IDs
slug: global-top500-113-ach-company-and-originator-ids
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: Detects references to ach company and originator ids in financial and compliance documents. Commonly found in Australian regulatory filings, transaction records, and audit documentation.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters.'
pattern: (?is)\b(?:originator\s+ID|company\s+ID|direct\s+entry|clearing\s+house|batch\s+header|originating\s+institution|payment\s+file|bulk\s+payment)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - ach company and originator ids
    - ach
    - company
    - originator
    - ids
    - financial
    - accounts
    - payments
  proximity: 300
  keyword_lists:
    - corporate-finance
test_cases:
  should_match:
    - value: originator ID
      description: Primary topic phrase match
    - value: company id
      description: Case-insensitive topic phrase match
    - value: direct entry
      description: Alternative topic phrase match
    - value: clearing house
      description: Additional topic phrase match
    - value: |-
        Originator ID
        Payee: Riverbend Supplies Pty Ltd
        BSB: 064-000
        Account number: 12345678
        Payment reference: INV-20431
      description: Populated payee/account reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: bank transfer
      description: Generic word pair from old broad template should not match
    - value: |-
        Originator ID:
        Payee:
        Account name:
        Account number:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about originator id are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In Australian English, standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_ach_originator_ids
      matches:
        - ref: Regex_global_top500_113_ach_company_and_originator_ids_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_ach_originator_ids
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_ach_originator_ids
            - Regex_global_top500_113_ach_company_and_originator_ids_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_ach_originator_ids
  regexes:
    - id: Pattern_ach_originator_ids
      pattern: (?is)\b(?:originator\s+ID|company\s+ID|direct\s+entry|clearing\s+house|batch\s+header|originating\s+institution|payment\s+file|bulk\s+payment)\b
    - id: Regex_global_top500_113_ach_company_and_originator_ids_record_structure
      pattern: (?i)\b(?:payee|supplier|vendor|creditor|beneficiary|account\s+name|BSB|account\s+(?:no\.?|number)|invoice\s+(?:no\.?|number)|remittance\s+(?:no\.?|number|ref(?:erence)?)|payment\s+(?:ref(?:erence)?|date)|amount\s+paid)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_ach_originator_ids
      groups:
        - match_style: word
          terms:
            - text: ACH
              case_sensitive: true
            - BECS
            - AusPayNet
      strength: specific
risk_description: >-
  The concept regex recognises originator ID, company ID, direct entry, and clearing-house terminology with financial context rather than parsing an ACH identifier format. Company and originator IDs generally identify business participants in a payment rail, not an individual's bank account or a credential authorising transactions. Fraudulent origination still requires account instructions, authorisation, and processing access, while public scheme documents and bank guidance can match these terms. Risk 4 OFFICIAL reflects low standalone harm; SENSITIVE would require a non-public payment file, customer account linkage, or usable origination access.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 aligns with OFFICIAL, OFFICIAL DLM, label OFFI, and the Low tier because an originator identifier alone is
    not an authorization secret. SENSITIVE is not met unless the match forms part of an executable ACH file or includes
    additional access and approval data.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic handling fits a business payment-network identifier that mainly aids correlation and requires separate
      credentials or transaction controls for misuse.
references:
  - title: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)"
    url: https://www.legislation.gov.au/C2006A00169/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
