schema: testpattern/v1
name: Endpoint management policy profiles
slug: global-top500-310-endpoint-management-policy-profiles
version: 1.3.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects endpoint-management policy profiles: Intune/MDM/GPO profile wording with machine policy artefacts (OMA-URI, payload keys, policy registry paths, Graph types) and populated profile fields. Topic wording alone is discovery-only.
operation: >-
  Regex_endpoint_profile_primary (Intune/MDM/Jamf/MECM policy or profile, configuration profile, compliance policy or GPO wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a machine policy artefact (OMA-URI path, Apple payload key, com.apple domain, HKLM Policies path, Graph @odata.type) or a populated profile field (profile/policy name, assignment/groups, platform, scope tag, setting/value). 85 requires a machine policy artefact (OMA-URI path, Apple payload key, com.apple domain, HKLM Policies path, Graph @odata.type) (two distinct hits), a populated profile field (profile/policy name, assignment/groups, platform, scope tag, setting/value), and independent endpoint-control (BitLocker, Defender, firewall, USB, exclusions, ASR) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_endpoint_profile_guidance_exclusion).
pattern: >-
  (?i)\b(?:(?:Intune|MDM|Jamf|Workspace\s+ONE|MECM|SCCM)\s+(?:policy|profile|configuration\s+profile|compliance\s+policy|baseline)|configuration\s+profile|device\s+compliance\s+policy|endpoint\s+(?:management|security)\s+(?:policy|profile)|group\s+policy\s+object|GPO\s+report)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a machine policy artefact (OMA-URI path, Apple payload key, com.apple domain, HKLM Policies path, Graph @odata.type) or a populated profile field (profile/policy name, assignment/groups, platform, scope tag, setting/value)), and 85 needs two distinct structures plus independent endpoint-control (BitLocker, Defender, firewall, USB, exclusions, ASR) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
- CIS Controls
data_categories:
- security
corroborative_evidence:
  keywords:
  - BitLocker
  - Defender
  - firewall
  - USB
  - exclusion
  - allowed
  - blocked
  - password length
  - conditional access
  - ASR
  proximity: 300
test_cases:
  should_match:
  - value: The new configuration profile will be piloted with the ICT team first.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Intune configuration profile
      Profile name: WIN-Baseline-Finance
      Assigned groups: SG-Finance-Devices
    description: Medium-tier probe (75) - populated profile fields
    synthetic: true
  - value: |-
      Intune configuration profile export
      Profile name: WIN-Baseline-Finance
      Assigned groups: SG-Finance-Devices
      OMA-URI: ./Device/Vendor/MSFT/Policy/Config/Defender/AllowFullScanRemovableDriveScanning
      "@odata.type": "#microsoft.graph.windows10CustomConfiguration"
      Defender exclusion for C:\PayrollApp; USB storage blocked; BitLocker required.
    description: High-tier probe (85) - OMA-URI and Graph artefacts, profile fields, control context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: every managed laptop receives the standard configuration profile at enrolment.'
    description: Policy text
    synthetic: true
  - value: |-
      Configuration profile template
      Profile name: ________
      Assigned groups: [insert]
    description: Blank template
    synthetic: true
  - value: 'Course module 4: an Intune configuration profile can set OMA-URI ./Device/Vendor/MSFT/Policy/Config/Camera/AllowCamera.'
    description: Training framing
    synthetic: true
false_positives:
- description: Microsoft/Apple documentation quotes OMA-URI and payload examples.
  mitigation: Guidance/training framing is excluded; 85 needs two artefacts plus populated profile fields and control context.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The detector now requires endpoint-profile wording plus policy artefacts (OMA-URI, payload keys, registry policy paths) or populated profile fields before enforcing. An actual profile can expose enforced settings, exceptions, deployment groups, and security controls, helping an adversary identify weak configurations or evade endpoint governance. The normal affected scale is a managed device cohort and its users, while vendor guidance and generic policy templates remain plausible topic matches. Risk 8 SENSITIVE reflects serious contained control exposure; PROTECTED would require critical fleet coverage or a complete configuration capable of significant compromise.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because operational endpoint
    profiles reveal security posture, enforcement, and deployment scope. PROTECTED is not met without evidence of
    critical-system coverage, exploitable settings, complete administrative control, or significant damage.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic handling is Medium with Medium InfoTech controls for endpoint policy profiles and security baselines. High
      is reserved for profiles controlling critical or protected fleets where disclosure would materially enable
      significant compromise.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_endpoint_profile_primary
    matches:
    - ref: Regex_endpoint_profile_policy_artefact
      min_count: 2
      unique_results: true
    - ref: Regex_endpoint_profile_profile_field
    - ref: Keyword_endpoint_profile_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_endpoint_profile_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_endpoint_profile_primary
    matches:
    - type: any
      refs:
      - Regex_endpoint_profile_policy_artefact
      - Regex_endpoint_profile_profile_field
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_endpoint_profile_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_endpoint_profile_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_endpoint_profile_primary
    pattern: >-
      (?i)\b(?:(?:Intune|MDM|Jamf|Workspace\s+ONE|MECM|SCCM)\s+(?:policy|profile|configuration\s+profile|compliance\s+policy|baseline)|configuration\s+profile|device\s+compliance\s+policy|endpoint\s+(?:management|security)\s+(?:policy|profile)|group\s+policy\s+object|GPO\s+report)\b
  - id: Regex_endpoint_profile_policy_artefact
    pattern: >-
      (?i)\bOMA-URI\b|\./(?:Device|User)/Vendor/MSFT/[A-Za-z0-9/_.-]{3,150}|<key>Payload(?:Type|Identifier|UUID)</key>|\bcom\.apple\.[a-z]{3,40}(?:\.[a-z]{2,40}){0,3}|\bHKLM[\\/]SOFTWARE[\\/]Policies[\\/][A-Za-z0-9\\ _.-]{3,150}|\"@odata\.type\"\s*:\s*\"#microsoft\.graph\.[A-Za-z0-9]{3,80}\"
  - id: Regex_endpoint_profile_profile_field
    pattern: >-
      (?i)\b(?:profile\s+(?:name|ID)|policy\s+(?:name|ID)|assigned\s+(?:to|groups?)|assignments?|platform|scope\s+tags?|excluded\s+groups?|setting|value)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  keywords:
  - id: Keyword_endpoint_profile_context
    groups:
    - match_style: word
      terms:
      - BitLocker
      - Defender
      - firewall
      - text: USB
        case_sensitive: true
      - exclusion
      - allowed
      - blocked
      - password length
      - conditional access
      - text: ASR
        case_sensitive: true
    strength: specific
  - id: Keyword_endpoint_profile_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
