schema: testpattern/v1
name: Budget/Forecast Document
slug: global-budget-forecast-document
version: 1.5.1
type: keyword_list
pattern_class: concept
description: Detects budget proposals, financial forecasts, and expenditure planning documents.
operation: >-
  Keyword-based detection matching budget proposal, financial forecast, expenditure plan, and related terms.
  Corroborative evidence: 12 keywords within 300 characters.
confidence: medium
confidence_justification: 'Medium confidence: keyword-based detection requires corroborative evidence for accurate identification.'
jurisdictions:
  - global
regulations:
  - IPA 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
- DISP
- ISO 27001
- NIST CSF
data_categories:
  - financial
  - government
test_cases:
  should_match:
    - value: 'Budget proposal FY2026: total allocation $2.5M'
      description: Test match 1
    - value: Revenue forecast and expenditure plan for Q3
      description: Test match 2
    - value: Budget variance report showing approved budget vs actuals
      description: Test match 3
    - value: "To: Director-General\nFrom: Principal Legal Officer\nDate: 12/08/2026\nSubject: Budget proposal\nOur ref: LS2026-0412\nThis briefing sets out the Budget proposal for decision."
      description: Populated doc record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: We are on a tight budget this month
      description: Non-match 1
    - value: Weather forecast for next week
      description: Non-match 2
false_positives:
  - description: Casual use of budget in non-financial planning contexts.
    mitigation: Require financial planning keywords like allocation, forecast, or variance.
exports:
  - yaml
scope: narrow
risk_rating: 4
risk_description: >-
  This concept pattern finds budget proposals, revenue forecasts, expenditure plans, allocation material, and variance reports rather than casual budgeting or weather forecasts. Unreleased figures can reveal cost pressure, planned spending, or negotiating assumptions, but approved budgets and routine forecasts may be widely distributed or public and do not confer payment authority. The ordinary unit therefore creates low, context-dependent harm to the organisation, with timing and decision status determining exploitability. Risk 4 OFFICIAL remains suitable; SENSITIVE is not met without a consequential pre-decision fiscal measure, market-sensitive forecast, protected programme allocation, or material negotiating position.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_budget
      matches:
        - ref: Regex_global_budget_forecast_document_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_budget
      matches:
        - ref: Regex_global_budget_forecast_document_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_forecast
      matches:
        - ref: Keyword_financial_planning
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_budget
      pattern: (?i)\b(?:budget\s+(?:proposal|allocation|amendment)|financial\s+(?:forecast|plan))\b
    - id: Regex_forecast
      pattern: (?i)\b(?:(?:revenue|expenditure|financial)\s+forecast|budget\s+(?:variance|performance))\b
    - id: Regex_global_budget_forecast_document_record_structure
      pattern: >-
        (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9]
  keywords:
    - id: Keyword_financial_planning
      groups:
        - match_style: word
          terms:
            - financial planning
            - revenue forecast
            - expenditure forecast
            - budget variance
            - financial projection
      strength: specific
references:
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.5.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (SOCI Act 2018 (Cth)); added 2 verified legislation/regulator references."
  - version: 1.5.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires independent doc record structure (Regex ..._record_structure); 85 requires 3 distinct structure hits. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 523 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.2.0
    date: '2026-07-04'
    description: Replace bare generic keyword terms with domain-anchored phrases (FP reduction)
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
author: testpattern-community
license: MIT
keywords:
  - operating budget
  - budget submission
  - budget papers
  - budget proposal
  - budget allocation
  - financial forecast
  - expenditure plan
  - funding allocation
  - approved budget
  - revenue forecast
  - expenditure forecast
  - budget variance
  - financial projection
  - budget amendment
