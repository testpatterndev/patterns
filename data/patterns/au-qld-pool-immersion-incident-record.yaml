schema: testpattern/v1
name: Queensland Pool Immersion Incident Record
slug: au-qld-pool-immersion-incident-record
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Records of a pool immersion incident involving a young child (under 5) in Queensland under the Building Act 1975: the hospital notice to the chief executive (health) under s 245G (name and date of birth of the young child, day of the examination, address of the child's parents, address where the incident happened), the onward notice to QBCC, the local government and the Family and Child Commissioner under s 245I, and the council's follow-up pool inspection under s 246ADA, together with council drowning and near-drowning incident files. Pool immersion information may be disclosed only as allowed by s 257A. Public pool safety certificate and regulated pools register entries, pool fencing guidance, the statute text and drowning statistics are decoys.
operation: >-
  Primary: pool immersion incident/notice/information/notification/report, (child) immersion incident, (non-fatal) drowning incident or notification, near-drowning, or a reference to Building Act s 245G, s 245I or s 246ADA. 65 is discovery-only (primary alone). 75 requires, within 300 characters, one populated structure: a child field (young child / child / name of child / patient / person involved with a two-word name, a date of birth, or an age in years or months), a location field (address where the immersion incident happened, incident / pool / property / premises address or location, address of the child's parents, or home address, followed by a street number and name) or an incident field (dated date of incident, immersion, examination, admission or presentation; or outcome, condition, treatment, injuries, how the child accessed the pool, barrier condition or gate condition with a word value). 85 requires a child field AND a location or incident field AND an independent corroborative term (hospital, emergency department, ambulance, CPR, resuscitation, QBCC, pool fence, pool gate, pool barrier, regulated pool, pool safety inspector, coroner and similar). Blank lines, bracket placeholders, n/a/tbc and "Yes / No" prompts are rejected. Every tier excludes template/fixture text; enforce tiers also exclude statute and guidance wording (maximum penalty, penalty units, this section applies, in this section, legislation.qld.gov.au, this guide/fact sheet/policy/campaign, frequently asked questions, National Drowning Report).
pattern: >-
  (?i)\b(?:pool\s+immersion\s+(?:incidents?|notices?|information|notifications?|reports?)|(?:child\s+)?immersion\s+incidents?|(?:non[\s-]+fatal\s+)?drowning\s+(?:incidents?|notifications?)|near[\s-]+drowning|s(?:ection|\.)?\s{0,2}(?:245G|245I|246ADA)\b)
confidence: medium
confidence_justification: >-
  Medium: "pool immersion incident" and the s 245G notice fields come straight from the Building Act 1975, but the statute, QBCC and Queensland Health guidance and water-safety campaigns repeat them, so enforce tiers need populated child, location or incident fields. Pool safety certificate and form numbers are not used because their formats and form numbers are unverified. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Building Act 1975 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - children
  - health
  - pii
  - location
corroborative_evidence:
  keywords:
    - hospital
    - emergency department
    - ambulance
    - CPR
    - resuscitation
    - QBCC
    - pool fence
    - pool gate
    - pool barrier
    - regulated pool
    - pool safety inspector
    - coroner
  proximity: 300
test_cases:
  should_match:
    - value: "Pool immersion notice (Building Act 1975 s 245I)\nName of young child: Lachlan Teston\nDate of birth: 02/05/2023\nDate of examination: 14/09/2026\nAddress where the immersion incident happened: 27 Paperbark Crescent, Kirwan QLD 4817\nCondition: admitted to paediatric ICU after CPR by a parent; pool gate found propped open"
      description: Immersion notice with child name, DOB, examination date, incident address and outcome (85 tier)
      synthetic: true
    - value: "Council pool inspection following immersion incident - s 246ADA\nChild: Ava Staffson, age: 2 years\nPool address: 9 Kingfisher Street, Bundaberg QLD 4670\nBarrier condition: self-closing latch on pool gate not engaging; QBCC notified."
      description: Council s 246ADA inspection record with child, pool address and barrier defect (85 tier)
      synthetic: true
    - value: "Near-drowning at private residence. Incident address: 41 Ridgeview Drive, Toowoomba QLD 4350. Inspection booked."
      description: Near-drowning note with a populated location field only (75 tier)
      synthetic: true
    - value: "Pool immersion incident referred by Queensland Health.\nDate of incident: 06/09/2026\nOutcome: discharged the following day."
      description: Immersion referral with incident date and outcome only (75 tier)
      synthetic: true
  should_not_match:
    - value: "245G Requirement to report pool immersion incident (1) A person in charge of a hospital must notify the chief executive (health) if an examination of a young child indicates that the child has been involved in a pool immersion incident. Maximum penalty - 20 penalty units. (2) The notice must include the name and date of birth of the young child and the address where the pool immersion incident happened."
      description: Building Act statute text (statute exclusion)
    - value: "Pool safety certificate\nCertificate number: PSC0045821\nProperty address: 12 Lilly Pilly Court, Cairns QLD 4870\nPool type: in-ground, non-shared\nIssued: 03/08/2026, expires 03/08/2027"
      description: Public regulated pools register / certificate entry (no immersion primary)
    - value: "Pool immersion notice - blank template\nName of young child: ____________\nDate of birth: ____________\nAddress where the immersion incident happened: ____________\nCPR performed: Yes / No"
      description: Blank notice form
    - value: "National Drowning Report 2026: 14 children under five drowned in home swimming pools and many more were hospitalised after non-fatal drowning incidents. Check your pool fence and gate."
      description: Drowning statistics and water-safety campaign (65 only)
false_positives:
  - description: The Building Act, QBCC and Queensland Health guidance and water-safety campaigns name pool immersion incidents.
    mitigation: Enforce tiers need populated child, location or incident fields; a statute/guidance exclusion suppresses penalty wording, the legislation site and campaign reports.
  - description: Public pool safety certificate and regulated pools register entries with property addresses.
    mitigation: Those entries do not contain the immersion or drowning primary, so they do not reach any tier. Nonconformity notices and certificates are intentionally out of scope (risk 3 per the research).
  - description: Surf lifesaving and aquatic centre rescue logs that use "drowning incident".
    mitigation: A rescue log with a named person and location reaches 75; it is still sensitive health information. Deploy at 85 in aquatic centre file shares if noise is a concern.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_pool_immersion_incident_record_primary
      matches:
        - ref: Regex_au_qld_pool_immersion_incident_record_child_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_pool_immersion_incident_record_location_field
            - Regex_au_qld_pool_immersion_incident_record_incident_field
        - ref: Keyword_au_qld_pool_immersion_incident_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_pool_immersion_incident_record_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_pool_immersion_incident_record_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_pool_immersion_incident_record_child_field
            - Regex_au_qld_pool_immersion_incident_record_location_field
            - Regex_au_qld_pool_immersion_incident_record_incident_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_pool_immersion_incident_record_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_pool_immersion_incident_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_pool_immersion_incident_record_primary
      pattern: >-
        (?i)\b(?:pool\s+immersion\s+(?:incidents?|notices?|information|notifications?|reports?)|(?:child\s+)?immersion\s+incidents?|(?:non[\s-]+fatal\s+)?drowning\s+(?:incidents?|notifications?)|near[\s-]+drowning|s(?:ection|\.)?\s{0,2}(?:245G|245I|246ADA)\b)
    - id: Regex_au_qld_pool_immersion_incident_record_child_field
      pattern: >-
        (?i)\b(?:(?:(?:young\s+)?child(?:'s)?|name\s+of\s+(?:the\s+)?(?:young\s+)?child|patient|person\s+involved|injured\s+person)(?:\s+(?:full\s+)?name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:child(?:'s)?\s+)?(?:date\s+of\s+birth|DOB)\s*[:#]\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}|20\d{2}-\d{2}-\d{2})|(?:child(?:'s)?\s+)?age\s*[:#]\s*\d{1,2}\s{0,2}(?:years?|yrs?|months?|mths?)\b)
    - id: Regex_au_qld_pool_immersion_incident_record_location_field
      pattern: >-
        (?i)\b(?:address\s+where\s+(?:the\s+)?(?:pool\s+)?immersion\s+(?:incident\s+)?(?:happened|occurred)|(?:incident|pool|property|premises|site)\s+(?:address|location)|(?:location|address)\s+of\s+(?:the\s+)?(?:pool|incident)|address\s+of\s+(?:the\s+)?(?:child(?:'s)?\s+)?parents|parents'?\s+address|(?:home|residential)\s+address)\s*[:#]\s*(?:(?:Unit|Lot|Apt|Flat)\s+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?\s+[A-Z][A-Za-z'-]{1,30}
    - id: Regex_au_qld_pool_immersion_incident_record_incident_field
      pattern: >-
        (?i)\b(?:(?:date\s+(?:and\s+time\s+)?of\s+(?:the\s+)?(?:incident|immersion|examination|admission|presentation)|(?:incident|immersion|examination)\s+date)\s*[:#-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}|20\d{2}-\d{2}-\d{2})|(?:outcome|condition|clinical\s+outcome|treatment|injur(?:y|ies)|how\s+(?:the\s+)?child\s+(?:accessed|entered|gained\s+access\s+to)\s+(?:the\s+)?pool|barrier\s+(?:condition|defects?)|gate\s+(?:condition|status))\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:yes|no|y|n)\s*/)[A-Za-z][A-Za-z'-]{2,30})
    - id: Regex_au_qld_pool_immersion_incident_record_guidance_exclusion
      pattern: >-
        (?i)(?:\bmaximum\s+penalty\b|\bpenalty\s+units\b|\bthis\s+section\s+applies\b|\bin\s+this\s+section\b|\blegislation\.qld\.gov\.au\b|\bthis\s+(?:guide|guideline|fact\s?sheet|policy|procedure|campaign)\b|\bfrequently\s+asked\s+questions\b|\bNational\s+Drowning\s+Report\b)
  keywords:
    - id: Keyword_au_qld_pool_immersion_incident_record_corroborative
      groups:
        - match_style: word
          terms:
            - hospital
            - emergency department
            - ambulance
            - text: CPR
              case_sensitive: true
            - resuscitation
            - resuscitated
            - text: ICU
              case_sensitive: true
            - text: QBCC
              case_sensitive: true
            - pool fence
            - pool gate
            - pool barrier
            - regulated pool
            - pool safety inspector
            - coroner
            - Family and Child Commissioner
      strength: specific
risk_rating: 7
risk_description: >-
  The classifier identifies a pool immersion incident record that names a young child, gives the child's date of birth, the family's address and the address of the pool, and records the clinical outcome, which may be death or brain injury. It is health information about a child that the Building Act restricts (s 257A) and that can feed coronial and child-safety processes; disclosure causes serious distress to families and can prejudice investigations. Statute text, guidance, public pool register entries, blank forms and drowning statistics are excluded from enforce tiers. Risk 7 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Building Act 1975 (Qld) - ss 245G-245I (pool immersion incidents), 246ADA (local government inspection), 257A (disclosure)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1975-011
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - Building Act pool immersion incident notices and council follow-up inspections; 75 gated on a populated child, location or incident field, 85 on child + location/incident fields + corroboration; statute text, public pool register entries and statistics are decoys.
