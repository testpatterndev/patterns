schema: testpattern/v1
name: Constituent service case notes
slug: global-top500-400-constituent-service-case-notes
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to constituent service case notes in Australian contexts. This information type is classified as personally identifiable information under the Privacy Act
  1988.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(?:constituent\s+service\s+case\s+notes|case\s+notes|government\s+services|citizen\s+services|welfare\s+case|service\s+delivery|case\s+management|client\s+record|case\s+officer|service\s+request|constituent\s+file)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - constituent service case notes
    - constituent
    - service
    - case
    - notes
    - government
    - citizen
    - services
  proximity: 300
  keyword_lists:
    - government-services
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: constituent service case notes
      description: Primary topic phrase match
    - value: case notes
      description: Case-insensitive topic phrase match
    - value: government services
      description: Alternative topic phrase match
    - value: citizen services
      description: Additional topic phrase match
    - value: "constituent service case notes\nClient name: Avery Teston\nCRN: 204889137K\nCase number: HC20264471\nAddress: 14 Wattlebird Street, Stafford QLD 4053\nNotes: constituent service case notes assessed on 12/08/2026."
      description: Populated gov record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: welfare registry
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how records about constituent service case notes are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to constituent service case notes appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_constituent_service_case_notes
      matches:
        - ref: Regex_global_top500_400_constituent_service_case_notes_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_constituent_service_case_notes
      matches:
        - ref: Regex_global_top500_400_constituent_service_case_notes_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_constituent_service_case_notes
      matches:
        - ref: Evidence_constituent_service_case_notes
  regexes:
    - id: Pattern_constituent_service_case_notes
      pattern: >-
        (?is)\b(?:constituent\s+service\s+case\s+notes|case\s+notes|government\s+services|citizen\s+services|welfare\s+case|service\s+delivery|case\s+management|client\s+record|case\s+officer|service\s+request|constituent\s+file)\b
    - id: Regex_global_top500_400_constituent_service_case_notes_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_constituent_service_case_notes
      groups:
        - match_style: word
          terms:
            - constituent service case notes
            - constituent
            - case notes
            - government services
            - citizen services
            - welfare case
            - service delivery
            - case management
            - client record
            - case officer
            - service request
            - constituent file
risk_description: >-
  The detector finds constituent service case notes, case notes, government services, and citizen services language when eight administrative terms appear nearby. A normal true positive may combine a person's complaint, identity, benefits, health, housing, immigration, or agency interactions into a caseworker narrative, creating privacy and procedural harm if disclosed. General service standards, training, and case-note templates remain plausible matches because the regex does not prove a populated constituent record. Risk 8 SENSITIVE fits a contained cross-agency case; PROTECTED requires protected-source information, acute safety circumstances, mass constituent dossiers, or credible significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
