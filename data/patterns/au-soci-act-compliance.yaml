schema: testpattern/v1
name: SOCI Act / AESCSF Compliance Assessment
slug: au-soci-act-compliance
version: 1.7.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies SOCI Act, critical infrastructure resilience and AESCSF compliance or maturity assessments that record an entity's own results. Assessment titles alone are discovery-only; enforcement requires AESCSF practice IDs, maturity indicator levels or security profiles, or populated compliance status rows. CIRMP records and reports are handled by au-soci-risk-management-program-record.
operation: >-
  Regex_soci_compliance matches SOCI Act compliance assessment/audit/report/review, SOCI Act self-assessment or gap analysis, Security of Critical Infrastructure compliance/resilience assessment, and AESCSF (self-)assessment, maturity assessment, compliance report or results titles; alone it is discovery-only at 65. 75 requires one populated structure: an AESCSF practice ID (e.g. ACCESS-2b), a maturity indicator level or security profile (MIL1, SP-2), or a labelled status/result/rating row with an implementation or compliance value. 85 requires two distinct structures plus critical-asset or responsible-entity context. Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: >-
  (?i)\b(?:SOCI\s+Act\s+compliance\s+(?:assessment|audit|report|review)|SOCI\s+Act\s+(?:self[\s-]assessment|gap\s+analysis|assessment|audit)|Security\s+of\s+Critical\s+Infrastructure\s+(?:Act\s+)?(?:compliance|resilience)\s+(?:assessment|audit|review)|AESCSF\s+(?:self[\s-]assessment|assessment|maturity\s+assessment|compliance\s+report|results)|critical\s+infrastructure\s+resilience\s+assessment)\b
confidence: medium
confidence_justification: >-
  Medium confidence: assessment titles are discovery-only; enforcement needs AESCSF practice, maturity/profile or populated status structure, and 85 adds a second structure and asset/entity context.
jurisdictions:
  - au
regulations:
  - SOCI Act 2018 (Cth)
frameworks:
  - AESCSF
  - QGISCF
data_categories:
  - security
  - government
  - infrastructure
test_cases:
  should_match:
    - value: |-
        AESCSF self-assessment 2026 - NorthGrid Distribution (responsible entity), critical asset: Eastvale transmission substation
        Practice ACCESS-2b  Status: Partially implemented  Target profile: SP-2
        Practice THREAT-1c  Status: Not implemented  (MIL1 gap)
        Remediation owner: OT Security Lead Kelvin Marr, due 30/11/2026
      description: High tier (85) - AESCSF practice IDs, security profile and populated status rows with responsible-entity and critical-asset context
      synthetic: true
    - value: |-
        SOCI Act compliance assessment - Riverbend Water Corporation
        Item 4.2 personnel hazards - Status: Not met; contractor background checks incomplete for the control room.
      description: Medium tier (75) - populated compliance status row without asset context
      synthetic: true
    - value: 'AESCSF maturity assessment summary for the gas business: current state MIL1 across the RESPONSE domain.'
      description: Medium tier (75) - maturity indicator level without a second structure
      synthetic: true
    - value: The board asked for the SOCI Act compliance assessment to be tabled at the next meeting.
      description: Discovery tier (65) - assessment title in a routine sentence without results
      synthetic: true
  should_not_match:
    - value: Social media compliance report
      description: Unrelated compliance wording
    - value: The society meeting was productive
      description: Unrelated social usage
    - value: The public website summarises the SOCI Act and its obligations.
      description: Public legislative overview without an assessment record
    - value: This guidance explains how entities should prepare an AESCSF self-assessment, rating each practice such as ACCESS-2b as fully, largely or not implemented against SP-1 to SP-3.
      description: Regulator guidance naming practices and profiles must stay below 75
    - value: |-
        AESCSF self-assessment template
        Responsible entity: ________
        Practice ID: ________  Status: ________  Target profile: ________
      description: Blank template
    - value: 'Media release: more energy businesses completed an AESCSF assessment this year, with most reaching SP-1.'
      description: News framing with a profile level must not enforce
    - value: 'Training example: SOCI Act compliance assessment for critical asset CA-104 with Status: Not met and overdue remediation'
      description: Explicit training content must not enforce
false_positives:
  - description: Public legislation, CISC guidance, AESCSF framework documentation and conference material name SOCI/AESCSF assessments, practices and maturity levels without an entity's results.
    mitigation: Titles are discovery-only; enforcement needs populated practice/maturity/status structure, and guidance, policy, training and media framing are excluded.
  - description: CIRMP annual reports and risk management program records.
    mitigation: CIRMP wording was removed from this detector; those records are covered by au-soci-risk-management-program-record.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  The detector targets an entity's own SOCI/AESCSF compliance or maturity assessment results for critical infrastructure assets. Disclosure can reveal unimplemented practices, maturity gaps and remediation status that help an attacker prioritise weaknesses in an essential service. Such material is typically SOCI "protected information" handled under the Act's own disclosure rules, which is not the same as a PSPF PROTECTED security classification; the normal unit is a bounded assessment rather than a full operational blueprint. Risk 8 with OFFICIAL: Sensitive / SENSITIVE InfoTech fits; a higher marking needs asset-level exploit paths or a national-significance designation established by the content.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_soci_compliance
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_aescsf_practice_id
            - Evidence_maturity_level
            - Evidence_status_row
        - ref: Keyword_ci_asset_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_soci_compliance
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_aescsf_practice_id
            - Evidence_maturity_level
            - Evidence_status_row
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_soci_compliance
  regexes:
    - id: Regex_soci_compliance
      pattern: (?i)\b(?:SOCI\s+Act\s+compliance\s+(?:assessment|audit|report|review)|SOCI\s+Act\s+(?:self[\s-]assessment|gap\s+analysis|assessment|audit)|Security\s+of\s+Critical\s+Infrastructure\s+(?:Act\s+)?(?:compliance|resilience)\s+(?:assessment|audit|review)|AESCSF\s+(?:self[\s-]assessment|assessment|maturity\s+assessment|compliance\s+report|results)|critical\s+infrastructure\s+resilience\s+assessment)\b
    - id: Evidence_aescsf_practice_id
      pattern: \b(?:ASSET|ACCESS|THREAT|RISK|SITUATION|RESPONSE|THIRD-PARTIES|DEPENDENCIES|WORKFORCE|ARCHITECTURE|PROGRAM|PRIVACY)-[1-3][a-z]\b
    - id: Evidence_maturity_level
      pattern: (?i)\b(?:MIL\s{0,2}-?\s{0,2}[0-3]|maturity\s+indicator\s+level\s{0,3}[:=]?\s{0,3}[0-3]|security\s+profile\s{0,3}[:=]?\s{0,3}(?:SP\s{0,2}-?\s{0,2})?[1-3]|SP-[1-3])\b
    - id: Evidence_status_row
      pattern: (?i)\b(?:(?:compliance\s+|implementation\s+|practice\s+|remediation\s+)?status|result|rating)\s*[:#=|]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:fully|largely|partially|not)\s+(?:implemented|compliant|met|achieved)|non-compliant|compliant|not\s+met|partially\s+met|met|overdue|in\s+progress\b
  keywords:
    - id: Keyword_ci_asset_context
      groups:
        - match_style: word
          terms:
            - critical asset
            - critical infrastructure asset
            - responsible entity
            - reporting entity
            - operational technology
            - substation
            - water treatment plant
            - gas pipeline
            - distribution network
            - transmission network
            - control system
            - SCADA
            - Register of Critical Infrastructure Assets
      strength: domain
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.7.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): narrowed the primary to SOCI Act / Security of Critical Infrastructure compliance and resilience assessments and AESCSF assessments (removed CIRMP assessment/report/review, now covered by au-soci-risk-management-program-record); 75 now requires AESCSF practice IDs, maturity indicator level / security profile, or a populated status row, and 85 requires two distinct structures plus critical-asset/responsible-entity context (replacing topic keyword lists); guidance/policy/training/news exclusion added; populated synthetic tests and guidance/template/news decoys. Relabelled from risk 9 PROTECTED to risk 8 OFFICIAL: Sensitive / SENSITIVE InfoTech (uk OFFICIAL-SENSITIVE, nz RESTRICTED, ca Protected B): CISC treats SOCI "protected information" as a statutory disclosure category, not a PSPF PROTECTED classification, and a bounded maturity assessment matches the SENSITIVE band used by the sibling SOCI classifiers. Removed the unrelated Criminal Code 1899 (Qld) tag; added AESCSF framework and verified legislation.gov.au / CISC references.'
  - version: 1.6.0
    date: '2026-07-04'
    description: 'CI profile hardening: convert the broad keyword-list detector to a regex-backed concept; require substantive SOCI/CIRMP/AESCSF assessment results at 75 and critical-asset/entity scope plus an adverse finding at 85.'
  - version: 1.5.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 598 without changing detector or package metadata.'
  - version: 1.5.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.3.0
    date: '2026-07-04'
    description: Restore a pattern_tiers entry the bulk collapse dropped when confidence canonicalization put two distinct-evidence tiers in the same bucket and mergeDuplicateTiers kept only one; the dropped tier carried genuine domain-specific evidence, now reinstated alongside the surviving tier
  - version: 1.2.0
    date: '2026-07-04'
    description: Replace bare generic keyword terms with domain-anchored phrases (FP reduction)
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
