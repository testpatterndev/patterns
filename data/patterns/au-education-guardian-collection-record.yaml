    "ISO 27701"
  ],
  "data_categories": [
    "education",
    "pii"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated student guardian and collection permission record can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://ppr.qed.qld.gov.au/pp/enrolment-in-state-primary-secondary-and-special-schools-procedure"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE Personal-Privacy"
  },
  "classification": {
    "tier": "Medium",
    "rationale": "Populated student guardian and collection permission record maps to SENSITIVE Personal-Privacy. The classifier requires record context and corroborating fields. The mapping does not determine the risk of every matched document.",
    "generic": {
      "classification": "Medium",
      "dlm": "Medium Personal-Privacy",
      "rationale": "Medium Personal-Privacy handling applies to the populated record. Synthetic checks establish local matching behavior, not tenant detection accuracy."
    }
  },
  "package_tags": {
    "primary_component": "student-child-records",
    "components": [
      "student-child-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "privacy"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:authori[sz]ed collection|student collection permission|parental arrangements|custody restriction|collection restriction)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:parent|carer|guardian|collector|authori[sz]ed collection)[ \\t]*:[ \\t]*[A-Z][A-Z .'-]{2,70}"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:permission|consent|collection restriction|parental arrangement|release instruction)[ \\t]*:[ \\t]*(?:granted|approved|denied|not permitted|release only|do not release|permitted)\\b"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      }
    ]
  },
