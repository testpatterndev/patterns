{
  "schema": "testpattern/v1",
  "name": "Student Guardian and Collection Permission Record",
  "slug": "au-education-guardian-collection-record",
  "version": "1.0.3",
  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated student guardian and collection permission record using record context and corroborating fields.",
  "pattern": "(?i)(?:authori[sz]ed collection|student collection permission|parental arrangements|custody restriction|collection restriction)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
