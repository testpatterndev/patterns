  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - anchored on IP Act ch 3A (s 51 statement fields, s 53 notice fields, s 72 register fields, verified against the Act text); 75 gated on one populated field, 85 on two distinct fields plus independent evidence; OIC guidance, legislation, statistics, blank forms and Commonwealth NDB signals excluded from enforce tiers.
