schema: testpattern/v1
name: Queensland Mandatory Notification of Data Breach (MNDB) Statement, Notice or Register Entry
slug: au-qld-mandatory-data-breach-notification
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Completed records under the Queensland Mandatory Notification of Data Breach (MNDB) scheme in chapter 3A of the Information Privacy Act 2009 (Qld), as inserted by the Information Privacy and Other Legislation Amendment Act 2023: the s 51 statement to the Information Commissioner, the s 53 notice to affected individuals, s 52 further information, and entries in the s 72 register of eligible data breaches. The scheme has applied to Queensland government agencies since 1 July 2025 and to local government since 1 July 2026. A populated record names the agency and gives the date of the breach, the type of eligible data breach (unauthorised access, unauthorised disclosure or loss, s 47), the kinds of personal information involved, the number of individuals affected or notified, and the containment and mitigation steps. OIC guidance, the Act, published MNDB statistics and blank templates are decoys. Overlaps with au-data-breach-report, which is framed around the Commonwealth Notifiable Data Breaches scheme (Privacy Act 1988 Part IIIC); Commonwealth NDB signals are excluded from this classifier's enforce tiers.
operation: >-
  Primary: "eligible data breach", "mandatory notification of data breach(es)", "MNDB", "register of eligible data breaches", "data breach register", "Information Privacy Act 2009", a s 51/53/72 statement/notice/register reference, or "statement to the Information Commissioner". 65 is discovery-only (primary alone) and surfaces OIC guidance, the Act, policies and statistics. 75 requires one populated record field within 300 characters: agency name, a dated breach/discovery/containment/statement/notification field, a count of individuals affected or notified, a selected breach type (unauthorised access / unauthorised disclosure / loss), the kind of personal information involved, or a containment/mitigation step. Blank lines, bracket placeholders and n/a/tbc are rejected. 85 requires two distinct populated fields plus an independent corroborative term (serious harm, mitigate, OIC, privacy complaint, s 166A, phishing, misdirected, ransomware and similar). Every tier excludes template/fixture text; enforce tiers also exclude guidance/legislation signals and Commonwealth NDB signals (OAIC, Notifiable Data Breaches, Privacy Act 1988, s 26WK/26WL).
pattern: (?i)\b(?:eligible\s+data\s+breach(?:es)?|mandatory\s+notification\s+of\s+data\s+breach(?:es)?|MNDB|register\s+of\s+eligible\s+data\s+breaches|data\s+breach\s+register|Information\s+Privacy\s+Act\s+2009|(?:section|s\.?)\s?(?:51|52|53|72)\s+(?:statement|notice|notification|register)|statement\s+(?:about\s+(?:an?\s+)?eligible\s+data\s+breach\s+)?to\s+the\s+Information\s+Commissioner)\b
confidence: medium
confidence_justification: >-
  Medium: "eligible data breach" and the chapter 3A section references are specific statutory terms, but OIC guidance, agency data breach policies (s 73) and training repeat them, and the Commonwealth NDB scheme uses the same "eligible data breach" phrase. Enforce tiers therefore require populated s 51/53/72 fields and exclude Commonwealth NDB signals. There is no public MNDB reference number format. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Information Privacy Act 2009 (Qld) ch 3A ss 47, 48, 50, 51, 52, 53, 72
  - Information Privacy and Other Legislation Amendment Act 2023 (Qld)
frameworks:
  - QGISCF
data_categories:
  - privacy
  - security
  - government
corroborative_evidence:
  keywords:
    - serious harm
    - mitigate
    - Office of the Information Commissioner
    - OIC
    - privacy complaint
    - section 166A
    - unauthorised access
    - unauthorised disclosure
    - phishing
    - misdirected
    - ransomware
  proximity: 300
customisation:
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_au_qld_mandatory_data_breach_notification_record_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's case / matter reference number format (see docs/identifiers.md#case-reference-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Statement about an eligible data breach to the Information Commissioner (IP Act s 51)\nAgency: Department of Harbour Services\nDate the data breach occurred: 14/08/2026\nType of eligible data breach: unauthorised disclosure\nKinds of personal information: names, home addresses and dates of birth of licence holders\nNumber of individuals affected: 1,240\nA misdirected bulk email attached the licensing spreadsheet; recipients were asked to delete it. We assessed a likelihood of serious harm."
      description: 85 tier - s 51 statement with agency, date, breach type, information kinds and count plus serious harm / misdirected evidence
      synthetic: true
    - value: "Eligible data breach - notice to affected individuals (s 53)\nDate of breach: 3 September 2026\nWe are writing because a staff mailbox was accessed by an unknown party after a phishing email. We recommend you watch for suspicious messages."
      description: 75 tier - s 53 notice to individuals with one populated field (date of breach)
      synthetic: true
    - value: "Register of eligible data breaches - entry MNDB-2026-07\nDate statement provided: 22/07/2026\nIndividuals notified: 86\nContainment steps: shared drive permissions revoked and cached copies deleted on 20/07/2026\nActions to prevent similar breaches: quarterly access review of shared drives."
      description: 85 tier - s 72 register entry with statement date, individuals notified and containment step plus "revoked" evidence
      synthetic: true
    - value: "MNDB assessment\nAgency: Riverbend Regional Council\nA laptop holding rates hardship applications was stolen from a vehicle on 02/09/2026."
      description: 75 tier - council MNDB assessment with one populated agency field
      synthetic: true
    - value: "Eligible data breach notification to OIC\nAgency: Northgate Hospital and Health Service\nNumber of individuals notified: 312\nKinds of personal information: patient names and appointment dates\nRansomware encrypted the booking server; the agency took steps to contain and mitigate harm."
      description: 85 tier - HHS notification with agency, count and information kinds plus ransomware / mitigate evidence
      synthetic: true
  should_not_match:
    - value: "An agency must, as soon as practicable after forming the belief that an eligible data breach has occurred, prepare a statement for the Information Commissioner. The statement must include the date the data breach occurred, a description of the kind of personal information involved and the number of affected individuals. For more information see oic.qld.gov.au."
      description: OIC guidance / explainer
    - value: "Statement about an eligible data breach to the Information Commissioner\nAgency: __________\nDate the data breach occurred: __________\nType of eligible data breach: [select]\nNumber of individuals affected: ____"
      description: Blank s 51 statement form
    - value: "51 Agency must give statement about eligible data breach to information commissioner (1) The agency must, as soon as practicable after forming the belief mentioned in section 50 prepare a statement. Information Privacy Act 2009, current as at 1 July 2026, legislation.qld.gov.au"
      description: Legislation text
    - value: "Queensland agencies reported 214 eligible data breaches to the OIC in the first year of the MNDB scheme, with human error the leading cause, the Information Commissioner's report shows."
      description: Published MNDB statistics / news
    - value: "Notifiable Data Breaches statement to the Australian Information Commissioner (Privacy Act 1988, s 26WK)\nEntity: Pelican Retail Pty Ltd\nDate of breach: 12/08/2026\nNumber of individuals affected: 900"
      description: Commonwealth NDB statement (covered by au-data-breach-report)
    - value: "Data breach policy template (s 73): This policy sets out how the agency will respond to a suspected eligible data breach, including containment, assessment and notification steps."
      description: Data breach policy template
false_positives:
  - description: OIC guidance, the Information Privacy Act text, agency data breach policies (s 73) and training material use the same statutory vocabulary and field names.
    mitigation: Enforce tiers require populated fields and exclude oic.qld.gov.au / legislation.qld.gov.au, "an agency must", policy and guideline signals.
  - description: Commonwealth Notifiable Data Breaches (NDB) statements use "eligible data breach" too.
    mitigation: OAIC, Australian Information Commissioner, Notifiable Data Breaches, Privacy Act 1988 and s 26WK/26WL signals are excluded from enforce tiers; those records belong to au-data-breach-report.
  - description: Published MNDB statistics and news.
    mitigation: No populated agency/date/count fields, so these stay at 65 discovery.
  - description: A register exported as a bare table (headers in one row, values in later rows) may not place labels next to values.
    mitigation: Such exports stay at 65 unless a labelled value appears; known gap.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_mandatory_data_breach_notification_primary
      matches:
        - ref: Regex_au_qld_mandatory_data_breach_notification_party_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_mandatory_data_breach_notification_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_mandatory_data_breach_notification_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_qld_mandatory_data_breach_notification_primary
      matches:
        - ref: Regex_au_qld_mandatory_data_breach_notification_party_field
        - ref: Regex_au_qld_mandatory_data_breach_notification_record_field
        - ref: Keyword_au_qld_mandatory_data_breach_notification_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_mandatory_data_breach_notification_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_qld_mandatory_data_breach_notification_primary
      matches:
        - ref: Regex_au_qld_mandatory_data_breach_notification_record_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_mandatory_data_breach_notification_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_mandatory_data_breach_notification_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_mandatory_data_breach_notification_primary
      matches:
        - type: any
          refs:
            - Regex_au_qld_mandatory_data_breach_notification_party_field
            - Regex_au_qld_mandatory_data_breach_notification_record_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_mandatory_data_breach_notification_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_mandatory_data_breach_notification_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_mandatory_data_breach_notification_primary
      pattern: >-
        (?i)\b(?:eligible\s+data\s+breach(?:es)?|mandatory\s+notification\s+of\s+data\s+breach(?:es)?|MNDB|register\s+of\s+eligible\s+data\s+breaches|data\s+breach\s+register|Information\s+Privacy\s+Act\s+2009|(?:section|s\.?)\s?(?:51|52|53|72)\s+(?:statement|notice|notification|register)|statement\s+(?:about\s+(?:an?\s+)?eligible\s+data\s+breach\s+)?to\s+the\s+Information\s+Commissioner)\b
    - id: Regex_au_qld_mandatory_data_breach_notification_party_field
      pattern: >-
        (?i)(?:\b(?:agency|agency\s+name|name\s+of\s+(?:the\s+)?agency|reporting\s+agency|other\s+agenc(?:y|ies)\s+affected)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z&'.,()-]{1,40}(?:[ \t]+[A-Za-z&'.,()-]{1,30}){1,7}|\b(?:kinds?\s+of\s+personal\s+information(?:\s+involved)?|(?:personal\s+)?information\s+involved|description\s+of\s+(?:the\s+)?personal\s+information)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z][A-Za-z,;'/()-]{1,40}(?:[ \t]+[A-Za-z,;'/()-]{1,30}){1,10}|\b(?:containment\s+(?:steps|actions|measures)|steps\s+taken\s+to\s+contain(?:\s+the\s+(?:data\s+)?breach)?|mitigation\s+(?:steps|actions)|actions\s+(?:taken\s+)?to\s+prevent(?:\s+similar|\s+future)?(?:\s+(?:data\s+)?breaches)?)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9,;'/().-]{1,40}(?:[ \t]+[A-Za-z0-9,;'/().-]{1,30}){2,10})
    - id: Regex_au_qld_mandatory_data_breach_notification_record_field
      pattern: >-
        (?i)(?:\b(?:date\s+(?:the\s+)?(?:data\s+)?breach\s+(?:occurred|was\s+(?:discovered|identified|detected|contained))|date\s+of\s+(?:the\s+)?(?:data\s+)?breach|date\s+(?:of\s+)?(?:discovery|detection)|date\s+(?:the\s+)?statement\s+(?:was\s+)?(?:provided|given)|date\s+(?:and\s+method\s+)?of\s+notification|date\s+(?:individuals\s+)?notified|date\s+contained|containment\s+date)\s*[:#-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+[a-z]{3,9}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2})|\b(?:(?:total\s+)?number\s+of\s+(?:affected\s+)?individuals(?:\s+(?:affected|notified))?|individuals\s+(?:affected|notified)|affected\s+individuals)\s*[:#-]?\s*(?:approx(?:imately|\.)?\s+|about\s+|est(?:imated?|\.)\s+)?\d[\d,]{0,9}\b|\b(?:type\s+of\s+(?:eligible\s+)?(?:data\s+)?breach|breach\s+type)\s*[:#]\s*(?:unauthori[sz]ed\s+(?:access|disclosure)|loss)\b)
    - id: Regex_au_qld_mandatory_data_breach_notification_guidance_exclusion
      pattern: >-
        (?i)(?:\boic\.qld\.gov\.au|\blegislation\.qld\.gov\.au|\bcurrent\s+as\s+at\b|\ban\s+agency\s+must\b|\bagencies\s+must\b|\bthe\s+statement\s+must\s+include\b|\bdata\s+breach\s+policy\b|\bthis\s+(?:guideline|policy|fact\s?sheet|guidance|article|webinar|course)\b|\bgeneral\s+information\s+only\b|\bNotifiable\s+Data\s+Breach(?:es)?\b|\bOAIC\b|\bAustralian\s+Information\s+Commissioner\b|\bPrivacy\s+Act\s+1988\b|\b(?:section|s\.?)\s?26W[KL]\b)
  keywords:
    - id: Keyword_au_qld_mandatory_data_breach_notification_corroborative
      groups:
        - match_style: word
          terms:
            - serious harm
            - mitigate
            - mitigation
            - Office of the Information Commissioner
            - text: OIC
              case_sensitive: true
            - privacy complaint
            - section 166A
            - unauthorised access
            - unauthorised disclosure
            - phishing
            - misdirected
            - ransomware
            - stolen
            - compromised
            - revoked
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a completed Queensland MNDB statement, notice or register entry, gated on populated fields. Before containment, a notification is a roadmap to the exposed data and the control weakness; it also names the agency, the kinds of personal information and the affected cohort, and register entries aggregate incidents and remediation gaps across the agency. Guidance, legislation, statistics and blank templates are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Information Privacy Act 2009 (Qld) - chapter 3A (ss 47, 51, 52, 53, 72, 73)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: Office of the Information Commissioner Queensland - Mandatory Notification of Data Breach scheme
    url: https://www.oic.qld.gov.au/government/privacy/mandatory-data-breach-scheme
created: '2026-09-24'
updated: '2026-09-24'
