schema: testpattern/v1
name: Protective and Restraining Order Records (International)
slug: global-top500-419-protective-order-application-records
version: 2.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects domestic abuse protective, restraining and barring orders, police-issued protection
  notices, and applications for them, when the document names the parties. Covers the generic
  English-language order names used across jurisdictions plus United States (order of protection,
  protection from abuse, domestic violence restraining order, temporary restraining order,
  injunction for protection), United Kingdom (non-molestation order, occupation order, DVPN/DVPO,
  domestic abuse protection notice/order, non-harassment order), Ireland (barring, interim barring and
  emergency barring orders; bare "safety order" is excluded as too generic), Canada (emergency protection order, peace bond) and New Zealand
  (Police Safety Order) instruments. Australian state and territory DFV orders are covered in more
  depth by au-dfv-protection-order; the slug is retained from the earlier topic-phrase classifier.
operation: >-
  Primary: any of two regexes — a case-insensitive order/notice name list, or a case-sensitive
  acronym list (DVPN, DVPO, DAPN, DAPO, PFA, TRO, EPO, PSO). 75 tier requires a populated party field
  (petitioner, respondent, applicant, defendant, plaintiff, protected person/party, person asking
  for protection, restrained person, victim, perpetrator, aggrieved) with a non-placeholder name
  within 300 characters. 85 tier additionally requires an order condition (must not / shall not
  approach, contact, harass…; stay N feet/yards/metres away; within N of; surrender or relinquish
  firearms; no-contact order). All tiers exclude template/fixture text. 65 is discovery-only.
pattern: >-
  (?i)\b(?:(?:temporary\s+|emergency\s+|interim\s+|ex\s+parte\s+|final\s+)?(?:protective|protection|restraining)\s+orders?|orders?\s+(?:of|for)\s+protection|protection\s+from\s+abuse\s+orders?|domestic\s+violence\s+(?:restraining|protection|protective)\s+orders?|injunction\s+for\s+protection|non-molestation\s+orders?|occupation\s+orders?|domestic\s+(?:violence|abuse)\s+protection\s+(?:notices?|orders?)|non-harassment\s+orders?|(?:interim\s+|emergency\s+)?barring\s+orders?|peace\s+bonds?|police\s+safety\s+orders?)\b|\b(?:DVPN|DVPO|DAPN|DAPO)s?\b
confidence: medium
confidence_justification: >-
  Medium: order names appear widely in legal information, court guidance and statistics, and some
  (occupation order, safety order, protection order) have non-DFV meanings. Enforce tiers therefore
  require a populated party field; 85 adds an order condition independent of the order name. 85/75
  are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
  - us
  - gb
  - ie
  - ca
  - nz
  - au
regulations:
  - GDPR
  - UK GDPR
  - Data Protection Act 2018 (UK)
  - Family Law Act 1996 (UK)
  - Domestic Abuse Act 2021 (UK)
  - Violence Against Women Act (US)
  - Domestic Violence Act 2018 (Ireland)
  - Family Violence Act 2018 (NZ)
  - Privacy Act 2020 (NZ)
  - PIPEDA (Canada)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - legal
  - law-enforcement
  - pii
corroborative_evidence:
  keywords:
    - petitioner
    - respondent
    - protected person
    - stay away
    - no contact
    - surrender firearms
    - non-molestation
    - barring order
  proximity: 300
test_cases:
  should_match:
    - value: "Temporary Restraining Order\nPerson asking for protection: Avery Teston\nPerson to be restrained: Jordan Teston\nThe restrained person must not harass, contact or follow the protected person and must stay at least 100 yards away from the protected person's home."
      description: US domestic violence temporary restraining order with parties and stay-away
      synthetic: true
    - value: 'Non-Molestation Order (Family Law Act 1996, s42). Applicant: Morgan Teston. Respondent: Riley Teston. The respondent must not use or threaten violence against the applicant and must not go within 100 metres of the applicant''s home.'
      description: England and Wales non-molestation order
      synthetic: true
    - value: "DVPN issued 12/06/2026.\nVictim: Sam Teston\nPerpetrator: Casey Teston\nThe perpetrator must not contact the victim and must not enter the premises for 48 hours."
      description: UK Domestic Violence Protection Notice (acronym primary)
      synthetic: true
    - value: "Interim Barring Order - District Court\nApplicant: Jamie Teston\nRespondent: Alex Teston\nThe respondent shall not enter the family home and shall not watch or be in the vicinity of the applicant's residence."
      description: Irish interim barring order
      synthetic: true
    - value: 'Petition for Protection from Abuse Order. Plaintiff: Taylor Teston. Defendant: Drew Teston. Defendant is prohibited from contacting the plaintiff and shall relinquish all firearms.'
      description: US Protection From Abuse petition
      synthetic: true
  should_not_match:
    - value: A non-molestation order is an injunction that protects an applicant from harassment. Breaching a non-molestation order is a criminal offence punishable by up to five years in prison.
      description: Legal information explainer
    - value: "Petition for Order of Protection\nPetitioner: ____________\nRespondent: ____________\nCheck the protections requested:  [ ] Stay away  [ ] No contact"
      description: Blank petition form
    - value: Courts in England and Wales issued 32,400 non-molestation orders and 4,100 occupation orders in 2025.
      description: Aggregate statistics
    - value: 'Workplace health and safety order issued to Acme Pty Ltd. Respondent: Harbour Logistics. Occupation of the site must cease until scaffolding is certified.'
      description: Non-DFV regulatory safety notice
false_positives:
  - description: Legal information, court guides and training material describing orders.
    mitigation: Enforce tiers require a populated party field; explainers use party labels as nouns, not as filled fields.
  - description: Blank court forms and petitions.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders, and n/a/tbc values are rejected; template text is excluded.
  - description: Non-DFV uses of occupation, safety and protection orders (planning, workplace safety, child protection) that name parties.
    mitigation: Child protection and safety orders with named people are still sensitive; commercial respondents rarely co-occur with personal stay-away conditions, which the 85 tier requires.
  - description: Overlap with au-dfv-protection-order on Australian documents that use generic order names.
    mitigation: Both carry equivalent sensitivity; deploy au-dfv-protection-order for Australian tenants and keep this classifier for international coverage.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match:
        type: any
        ids:
          - Pattern_protective_order_application_records
          - Pattern_protective_order_acronym
      matches:
        - ref: Pattern_protective_order_party_field
        - ref: Pattern_protective_order_condition
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match:
        type: any
        ids:
          - Pattern_protective_order_application_records
          - Pattern_protective_order_acronym
      matches:
        - ref: Pattern_protective_order_party_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Pattern_protective_order_application_records
          - Pattern_protective_order_acronym
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
  regexes:
    - id: Pattern_protective_order_application_records
      pattern: >-
        (?i)\b(?:(?:temporary\s+|emergency\s+|interim\s+|ex\s+parte\s+|final\s+)?(?:protective|protection|restraining)\s+orders?|orders?\s+(?:of|for)\s+protection|protection\s+from\s+abuse\s+orders?|domestic\s+violence\s+(?:restraining|protection|protective)\s+orders?|injunction\s+for\s+protection|non-molestation\s+orders?|occupation\s+orders?|domestic\s+(?:violence|abuse)\s+protection\s+(?:notices?|orders?)|non-harassment\s+orders?|(?:interim\s+|emergency\s+)?barring\s+orders?|peace\s+bonds?|police\s+safety\s+orders?)\b
    - id: Pattern_protective_order_acronym
      pattern: \b(?:DVPN|DVPO|DAPN|DAPO|PFA|TRO|EPO|PSO)s?\b
    - id: Pattern_protective_order_party_field
      pattern: >-
        (?i)\b(?:petitioner|respondent|applicant|defendant|plaintiff|protected\s+(?:person|party)|person\s+(?:asking\s+for|in\s+need\s+of)\s+protection|person\s+to\s+be\s+(?:restrained|protected)|restrained\s+person|victim|perpetrator|aggrieved(?:\s+(?:person|party))?)(?:\s+(?:name|details))?\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}
    - id: Pattern_protective_order_condition
      pattern: >-
        (?i)\b(?:must\s+not|shall\s+not|is\s+not\s+to|is\s+(?:prohibited|restrained|enjoined)\s+from)\s+(?:[a-z]{1,20}\s{1,5}){0,4}?(?:approach(?:ing)?|contact(?:ing)?|locat(?:e|ing)|follow(?:ing)?|harass(?:ing)?|molest(?:ing)?|threaten(?:ing)?|assault(?:ing)?|stalk(?:ing)?|enter(?:ing)?|watch(?:ing)?|be\s+in\s+the\s+vicinity|go(?:ing)?|com(?:e|ing))\b|\bstay\s+(?:at\s+least\s+)?\d{1,4}\s*(?:feet|ft|yards|metres|meters|m)\s+away\b|\bwithin\s+\d{1,4}\s*(?:feet|ft|yards|metres|meters|m|km)\s+of\b|\b(?:relinquish|surrender)\s+(?:all\s+)?(?:firearms|weapons|guns)\b|\bno[\s-]contact\s+(?:order|condition|provision)\b
risk_rating: 8
risk_description: >-
  The detector identifies a protective, restraining or barring order, police protection notice, or
  an application for one, that names the protected person and the respondent. These documents
  disclose allegations of abuse, family and household details, addresses, exclusion zones and
  contact restrictions; unauthorised release can expose the protected person to retaliation and
  reveal untested allegations. Legal explainers, blank forms and statistics are excluded from enforce
  tiers. Risk 8 supports SENSITIVE Personal-Privacy; PROTECTED would require a concealed address,
  credible imminent threat or protected witness, which au-dfv-confidential-address covers for
  Australian records.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: GOV.UK — Get an injunction if you've been the victim of domestic abuse
    url: https://www.gov.uk/injunction-domestic-violence
  - title: Crime and Security Act 2010 — Domestic violence protection notices and orders
    url: https://www.legislation.gov.uk/ukpga/2010/17/part/3/crossheading/domestic-violence
  - title: Domestic Violence Act 2018 (Ireland)
    url: https://www.irishstatutebook.ie/eli/2018/act/6/enacted/en/html
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 2.0.0
    date: '2026-09-24'
    description: 'Rebuilt as an international protective-order record classifier. Replaced the bare topic-phrase primary and the self-corroborating 85 tier (min_count 2 of the same phrase list) with order names across US/UK/IE/CA/NZ plus a case-sensitive acronym primary; 75 now requires a populated party field and 85 an order condition. Removed Australia-only terms now covered by au-dfv-protection-order (AVO, intervention order, family violence order, personal safety order) and generic "respondent/applicant details" phrases. Removed unrelated AML/CTF and NDB regulation tags, added jurisdiction-specific instruments, renamed to match behaviour (slug unchanged), and replaced one-phrase test cases with populated records and realistic decoys.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1005 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
