schema: testpattern/v1
name: Queensland Water Customer Hardship, Payment Plan or Supply Restriction Record
slug: au-qld-water-customer-hardship-restriction-record
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Water and sewerage customer account records held by Queensland councils and water service providers about financial hardship, payment plans and restriction of supply for non-payment. Water Supply (Safety and Reliability) Act 2008 s 169 lets a service provider reduce the domestic water supply of an owner or occupier who does not pay after notice "to the minimum level necessary for the health and sanitation purposes", but not shut it off completely. In South East Queensland the Customer Water and Wastewater Code (made under the South-East Queensland Water (Distribution and Retail Restructuring) Act 2009) covers financial hardship, including Centrepay, and when supply can be restricted for non-payment; Urban Utilities' Residential Customer Charter describes payment plans and a Financial Hardship Policy. Records combine an account holder, water account or customer number, property or service address, arrears and the hardship, payment plan or flow-restriction action. Published charters, hardship policies, the Code and drought restriction notices are decoys.
operation: >-
  Primary: a water hardship or restriction phrase (water / flow / supply restriction device, valve, disc, washer or notice; restricted / restricting / restriction of the (domestic) water supply; water supply restricted / restriction / limitation / reduced; water, sewerage or water and sewerage bill / account / charges hardship, payment plan, arrangement, assistance, arrears or overdue; water or sewerage (financial) hardship; hardship program / policy / assistance / application for water or sewerage; minimum level necessary for (the) health and sanitation). 75 tier requires, within 300 characters, one populated structure: an account field (customer, account or water account number with a value containing a digit; a named account holder, customer, owner, occupier or tenant; a service, supply, property, premises, site or connection address with a street number; a property or assessment number; or a water meter number) or an action field (arrears, amount overdue, outstanding balance or debt with a dollar amount; a payment plan or instalment amount; a Centrepay deduction, reference or amount; a restriction device fitted / installed / applied / removed / lifted with a status or date; a restriction, final, reminder, overdue or disconnection warning notice issued with a date; or a hardship program / status / plan / flag / application of enrolled, active, approved, accepted, commenced or granted). 85 tier requires an account field AND an action field AND an independent water-account term (meter, meter read, sewerage, consumption, kilolitres, kL, water usage, Centrepay, Urban Utilities, Unitywater, distributor-retailer, council). All enforce tiers AND NOT the shared template-exclusion dictionary and a policy/guidance exclusion (this policy, published on our website, Customer Water and Wastewater Code, customer charter, dam levels, water conservation measures, drought, This section applies if, must not completely shut off). 65 is discovery-only (primary phrase alone) and will surface charters, policies, legislation and drought restriction news.
pattern: >-
  (?i)\b(?:(?:water|flow|supply)\s+restrict(?:ion|or)s?\s+(?:device|valve|disc|washer|notice)s?|restrict(?:ed|ing|ion\s+of)\s+(?:the\s+)?(?:domestic\s+)?water\s+supply|water\s+supply\s+(?:restricted|restrictions?|limitation|reduced)|(?:water|sewerage|water\s+and\s+sewerage)\s+(?:bill|account|charges?)\s+(?:hardship|payment\s+(?:plan|arrangement|assistance)|arrears|overdue)|(?:water|sewerage)\s+(?:financial\s+)?hardship|hardship\s+(?:program(?:me)?|policy|assistance|application)\s+(?:for\s+)?(?:water|sewerage)|minimum\s+level\s+necessary\s+for\s+(?:the\s+)?health\s+and\s+sanitation)\b
confidence: medium
confidence_justification: >-
  Medium: WSSR Act s 169 wording is verified and the hardship, Centrepay and restriction-for-non-payment topics of the SEQ Customer Water and Wastewater Code are confirmed by the Queensland Government business portal, but the Code's clause numbers and exact wording could not be retrieved (the PDF was not accessible), so no Code clause text is used as an anchor. "Water restriction" also means drought restrictions (WSSR s 41), so enforce tiers need populated account and action fields and a drought/policy exclusion. Water account and meter number formats are provider-specific and unverified, so values are loose and placeholder-guarded. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Water Supply (Safety and Reliability) Act 2008 (Qld)
  - South-East Queensland Water (Distribution and Retail Restructuring) Act 2009 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - financial
  - pii
corroborative_evidence:
  keywords:
    - water account
    - payment plan
    - Centrepay
    - financial hardship
    - flow restriction device
    - health and sanitation
    - arrears
    - meter
  proximity: 300
customisation:
  - key: utility-account-number
    kind: identifier-format
    identifier: utility-account-number
    target: purview.regexes/Regex_au_qld_water_hardship_account_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's utility customer account number format (see docs/identifiers.md#utility-account-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Water account hardship review\nAccount holder: Jamie Teston\nWater account number: 4400928175\nProperty address: 19 Lorikeet Drive, Caboolture QLD 4510\nArrears: $1,284.60\nPayment plan: $40 per fortnight via Centrepay\nFlow restriction device removed 12/09/2026 after first instalment. Meter read confirms usage back to normal."
      description: Hardship review with account holder, account number, address, arrears, payment plan and restriction removal (85 tier)
      synthetic: true
    - value: "Restriction of water supply - non-payment\nCustomer number: C00918273\nService address: 4 Cassia Close, Morayfield QLD 4506\nFinal notice issued: 01/08/2026\nRestriction device fitted: 22/08/2026 - supply reduced to the minimum level necessary for health and sanitation.\nOutstanding balance: $2,016.35. Sewerage and water usage charges unpaid since March."
      description: Restriction-for-non-payment record with customer number, address, notice date, device fitted and balance (85 tier)
      synthetic: true
    - value: "Water hardship program enrolment - hardship status: approved. Customer to be contacted monthly."
      description: Hardship status only, no account field (75 tier)
      synthetic: true
    - value: "Customer called about the water restriction device. Account number: 7719204466. Explained how to have it removed."
      description: Restriction device query with an account number only (75 tier)
      synthetic: true
  should_not_match:
    - value: "Our Financial Hardship Policy is published on our website. Customers on a water payment plan will not have a flow restriction device fitted while they keep to the plan, and Centrepay is available."
      description: Published water utility hardship policy (65 only)
    - value: "169 Restricting domestic water supply in particular circumstances. (2) The service provider may reduce the water supply to the premises to the minimum level necessary for the health and sanitation purposes of the owner or occupier. (3) However, the service provider must not completely shut off the water supply to the premises."
      description: Water Supply (Safety and Reliability) Act 2008 s 169 text (legislation, 65 only)
    - value: "Water account hardship application - blank template\nAccount holder: __________\nWater account number: __________\nPayment plan: $______ per fortnight"
      description: Blank hardship application form (65 only)
    - value: "Dam levels have dropped to 40 per cent and council has announced water supply restrictions for residents from Monday."
      description: Drought restriction news (WSSR s 41 restriction, not a customer record; 65 only)
false_positives:
  - description: Drought and demand-management water restrictions announced under WSSR s 41 and reported in the news.
    mitigation: Those carry no populated account or action fields; dam levels, drought and water conservation wording is also excluded.
  - description: Published customer charters, hardship policies and the SEQ Customer Water and Wastewater Code.
    mitigation: Policy/guidance exclusion group; enforce tiers need populated fields. A genuine customer letter that quotes the Code by name is also suppressed, which is an accepted false negative.
  - description: Energy or telco hardship records.
    mitigation: The primary requires water or sewerage wording; energy hardship is covered by au-energy-family-violence-customer-record and other energy classifiers.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_water_hardship_primary
      matches:
        - ref: Regex_au_qld_water_hardship_account_field
        - ref: Regex_au_qld_water_hardship_action_field
        - ref: Keyword_au_qld_water_hardship_account_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_water_hardship_policy_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_water_hardship_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_water_hardship_account_field
            - Regex_au_qld_water_hardship_action_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_water_hardship_policy_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_water_hardship_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_water_hardship_primary
      pattern: >-
        (?i)\b(?:(?:water|flow|supply)\s+restrict(?:ion|or)s?\s+(?:device|valve|disc|washer|notice)s?|restrict(?:ed|ing|ion\s+of)\s+(?:the\s+)?(?:domestic\s+)?water\s+supply|water\s+supply\s+(?:restricted|restrictions?|limitation|reduced)|(?:water|sewerage|water\s+and\s+sewerage)\s+(?:bill|account|charges?)\s+(?:hardship|payment\s+(?:plan|arrangement|assistance)|arrears|overdue)|(?:water|sewerage)\s+(?:financial\s+)?hardship|hardship\s+(?:program(?:me)?|policy|assistance|application)\s+(?:for\s+)?(?:water|sewerage)|minimum\s+level\s+necessary\s+for\s+(?:the\s+)?health\s+and\s+sanitation)\b
    - id: Regex_au_qld_water_hardship_account_field
      pattern: >-
        (?i)\b(?:(?:water\s+)?(?:customer|account)\s+(?:no\.?|number|ID)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9-]{4,15}\b|(?:account\s+holder|customer|owner|occupier|tenant)(?:\s+name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:service|supply|property|premises|site|connection)\s+address\s*[:#]\s*(?:(?:Unit|Lot|Apt|Flat)\s+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?\s+[A-Z][A-Za-z'-]{1,30}|(?:property|assessment)\s+(?:no\.?|number)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9/-]{3,15}\b|(?:water\s+)?meter\s+(?:no\.?|number|serial(?:\s+(?:no\.?|number))?)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z-]{0,4}\d)[A-Z0-9][A-Z0-9-]{4,15}\b)
    - id: Regex_au_qld_water_hardship_action_field
      pattern: >-
        (?i)\b(?:(?:arrears|amount\s+(?:overdue|outstanding|owing)|overdue\s+(?:amount|balance)|outstanding\s+balance|balance\s+(?:owing|outstanding|overdue)|debt)\s*[:#=-]\s*\$\s?\d|(?:payment\s+(?:plan|arrangement)|instal(?:l)?ments?)\s*[:#-]\s*\$\s?\d|Centrepay\s+(?:deduction|reference|amount|arrangement)\s*[:#-]\s*(?:\$\s?\d|active|approved|commenced|(?=[A-Z]{0,4}\d)[A-Z0-9]{4,20}\b)|(?:flow\s+|water\s+|supply\s+)?restrict(?:ion|or)\s+(?:device\s+)?(?:fitted|installed|applied|removed|scheduled|lifted|date|status)\s*[:#-]?\s*(?:yes\b|no\b|\d|on\s+\d|scheduled|pending|completed|removed|active)|(?:restriction|final|reminder|overdue|disconnection\s+warning)\s+notice\s+(?:issued|sent|date|given)\s*[:#-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|hardship\s+(?:program(?:me)?|status|plan|flag|application)\s*[:#-]\s*(?:enrolled|active|approved|yes|accepted|commenced|granted))
  keywords:
    - id: Keyword_au_qld_water_hardship_account_context
      groups:
        - match_style: word
          terms:
            - meter
            - meter read
            - sewerage
            - consumption
            - kilolitres
            - text: kL
              case_sensitive: true
            - water usage
            - Centrepay
            - Urban Utilities
            - Unitywater
            - distributor-retailer
            - council
      strength: domain
    - id: Keyword_au_qld_water_hardship_policy_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - published on our website
            - Customer Water and Wastewater Code
            - customer charter
            - Residential Customer Charter
            - dam levels
            - water conservation measures
            - drought
            - This section applies if
            - must not completely shut off
      strength: specific
risk_rating: 6
risk_description: >-
  The classifier identifies a water or sewerage customer's hardship, payment plan or restriction-for-non-payment record that links a named account holder, account number and property to arrears and to the utility's debt or restriction action. Disclosure exposes financial hardship and, where supply has been reduced to the minimum for health and sanitation, the household's living conditions. Published charters, policies, legislation and drought restriction notices are excluded. Risk 6 supports OFFICIAL: Sensitive / SENSITIVE Financial.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: Water Supply (Safety and Reliability) Act 2008 (Qld) - s 41 restricting water supply, s 169 restricting domestic water supply in particular circumstances
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2008-034
  - title: Business Queensland - Customer protections (SEQ Customer Water and Wastewater Code topics - hardship, Centrepay, restriction for non-payment, special needs)
    url: https://www.business.qld.gov.au/industries/mining-energy-water/water/industry-infrastructure/industry-regulation/obligations/customer-protections
  - title: Customer Water and Wastewater Code (SEQ) - clause text not retrieved; cited for scope only
    url: https://www.resources.qld.gov.au/__data/assets/pdf_file/0012/1239888/customer-water-wastewater-code.pdf
  - title: Urban Utilities - Residential Customer Charter (payment plans, Centrepay, Financial Hardship Policy)
    url: https://www.urbanutilities.com.au/sfsites/c/cms/delivery/media/MCNTSA4NMUDFDS5ATI7WAZDOBCEI
