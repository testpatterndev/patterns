updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - anchored on statutory plan names (TSP, maritime / ship / offshore security plans, ISSC); 75 gated on populated plan structure (named security officers, 24-hour numbers, zone and screening point rows, Declarations of Security), 85 on two distinct structures plus approval / security-level / Act evidence. US SSI (49 CFR 1520) is an exclusion, not an anchor, because Australian law mandates no SSI marking.
