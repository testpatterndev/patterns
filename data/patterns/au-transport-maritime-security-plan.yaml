schema: testpattern/v1
name: Aviation Transport Security Program or Maritime / Ship / Offshore Security Plan
slug: au-transport-maritime-security-plan
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Content of an aviation industry participant's Transport Security Program (TSP, Aviation Transport Security Act 2004 s 16; disclosing TSP content without the participant's consent is an offence under Aviation Transport Security Regulations 2005 reg 2.06) and of maritime security plans, ship security plans and offshore security plans (Maritime Transport and Offshore Facilities Security Regulations 2003 regs 3.12, 4.115 and 5A.105 require them to be protected against unauthorised access, amendment and disclosure). Enforcement needs populated plan structure: named port / company / ship / offshore security officers (PSO, CSO, SSO), 24-hour security contact numbers, restricted and cleared zone or screening point tables, and executed Declarations of Security. Australian law has no "Security Sensitive Information" marking; US TSA Sensitive Security Information (49 CFR 1520) material is an explicit exclusion.
operation: >-
  Primary: "Transport Security Program(me)", "Maritime Security Plan", "Ship Security Plan", "Offshore (Facility) Security Plan" or "International Ship Security Certificate". 65 is discovery-only (primary alone) and will surface Home Affairs guidance, airport and port web pages and articles. 75 requires one populated plan structure within 300 characters: a security officer or security manager label (PSO/CSO/SSO or port/company/ship/offshore/airport/aviation security officer, manager or contact) followed by a person's name, a 24-hour / after-hours security contact with an Australian phone number, a land-side / water-side / air-side restricted zone, cleared zone, restricted zone or screening point row with a non-placeholder identifier, or a Declaration of Security with a reference number or a signed/agreed date. 85 requires two distinct structure hits plus an independent corroborative term (unlawful interference, approved by the Secretary, maritime security level, the Aviation Transport Security Act 2004 or Maritime Transport and Offshore Facilities Security Act 2003, TSP, ISSC). Every tier excludes template/fixture text; enforce tiers also exclude US SSI (49 CFR, 33 CFR, Transportation Security Administration, "Sensitive Security Information"), homeaffairs.gov.au / legislation.gov.au guidance and training-course wording.
pattern: (?i)\b(?:Transport\s+Security\s+Program(?:me)?|Maritime\s+Security\s+Plan|Ship\s+Security\s+Plan|Offshore\s+(?:Facility\s+)?Security\s+Plan|International\s+Ship\s+Security\s+Certificate)s?\b
confidence: medium
confidence_justification: >-
  Medium: the plan names are statutory, but no marking is mandated and there is no public plan identifier, so enforcement relies on populated plan content (officer names, contact numbers, zone and screening-point tables, Declarations of Security). "Ship Security Plan" is also an international ISPS term, so non-Australian ship plans with the same structure will enforce. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Aviation Transport Security Act 2004 (Cth)
  - Aviation Transport Security Regulations 2005 (Cth)
  - Maritime Transport and Offshore Facilities Security Act 2003 (Cth)
  - Maritime Transport and Offshore Facilities Security Regulations 2003 (Cth)
frameworks:
  - PSPF
  - QGISCF
data_categories:
  - security
  - infrastructure
  - transport
corroborative_evidence:
  keywords:
    - unlawful interference
    - approved by the Secretary
    - maritime security level
    - Aviation Transport Security Act 2004
    - Maritime Transport and Offshore Facilities Security Act 2003
    - TSP
    - ISSC
  proximity: 300
test_cases:
  should_match:
    - value: "Port of Carrow Bay - Maritime Security Plan v4.2 (approved by the Secretary 2 May 2026)\nPort Security Officer: Harriet Vale, 24-hour contact: 0412 555 318\nLand-side restricted zone: LSRZ-02 Berth 3 container apron\nMaritime security level 2: close gate 5 and escort all visitors.\nSuspected unlawful interference is reported to the PSO immediately."
      description: 85 tier - maritime security plan with named PSO, 24-hour number and zone row plus approval and security level evidence
      synthetic: true
    - value: "MV Kestrel Dawn - Ship Security Plan, section 2 Ship operator, CSO and SSO\nShip Security Officer: Tomasz Reyne (Chief Officer)"
      description: 75 tier - ship security plan with one named security officer
      synthetic: true
    - value: "Carrow Regional Airport Transport Security Program (Aviation Transport Security Act 2004)\nScreening point: SP-1 Terminal departure gate\nCleared zone: CZ-A domestic sterile area\nAviation Security Manager: Lena Marsh"
      description: 85 tier - airport TSP with screening point, cleared zone and security manager plus the Act
      synthetic: true
    - value: "Offshore Security Plan - Gannet Deep FPSO\nOffshore Security Officer: Priya Castell\nMuster and access procedures follow in section 5."
      description: 75 tier - offshore security plan with a named security officer
      synthetic: true
    - value: "Ship Security Plan annex C\nDeclaration of Security ref: DOS-2026-117 agreed with the Port of Carrow Bay PSO.\nCompany Security Officer: Marta Olsen\nMaritime security level 1 applies at berth."
      description: 85 tier - executed Declaration of Security plus named CSO and security level evidence
      synthetic: true
  should_not_match:
    - value: "SENSITIVE SECURITY INFORMATION\nWARNING: This record contains Sensitive Security Information that is controlled under 49 CFR parts 15 and 1520.\nShip Security Plan (33 CFR 104)\nCompany Security Officer: Dana Whitfield"
      description: US TSA SSI-marked vessel plan (exclusion - not an Australian marking)
    - value: "Security regulated ports must have a maritime security plan approved by the Secretary. The plan sets out measures for maritime security levels 1, 2 and 3, identifies land-side restricted zones and names the port security officer. See homeaffairs.gov.au for guidance."
      description: Home Affairs guidance
    - value: "Maritime Security Plan template\nPort Security Officer: ________\n24-hour contact: ________\nLand-side restricted zone: [insert zone]"
      description: Blank template
    - value: "Airport screening officers wanted: help deliver the airport's Transport Security Program at our regional terminal. Must hold or be eligible for an ASIC."
      description: Job advertisement / news
    - value: "Ship Security Plan short course: in this course the Ship Security Officer: Role And Duties module explains how an SSO drills the crew."
      description: Training course
false_positives:
  - description: US TSA Sensitive Security Information (49 CFR 1520) and US Coast Guard vessel / facility security plans (33 CFR) carry the same officer and zone structure.
    mitigation: 49 CFR, 33 CFR, Transportation Security Administration and "Sensitive Security Information" hard-exclude the enforce tiers.
  - description: Home Affairs guidance, airport and port web pages, and training courses explain TSP and plan contents.
    mitigation: Guidance stays at 65 discovery; enforce tiers need populated officer names, numbers, zone rows or Declarations of Security, and exclude homeaffairs.gov.au / legislation.gov.au and course wording.
  - description: Blank plan templates.
    mitigation: Blank lines, bracket placeholders and n/a/tbc values are rejected; template wording is excluded by the shared template-exclusion dictionary.
  - description: International ISPS ship security plans for non-Australian ships.
    mitigation: Accepted - they carry the same security risk; jurisdiction tagging is au because the plan regime and offences referenced are Australian.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_transport_maritime_security_plan_primary
      matches:
        - ref: Regex_au_transport_maritime_security_plan_security_contact
          min_count: 2
          unique_results: true
        - ref: Keyword_au_transport_maritime_security_plan_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_transport_maritime_security_plan_exclusion
    - confidence_level: 85
      id_match: Regex_au_transport_maritime_security_plan_primary
      matches:
        - ref: Regex_au_transport_maritime_security_plan_security_contact
        - ref: Regex_au_transport_maritime_security_plan_zone_or_declaration
        - ref: Keyword_au_transport_maritime_security_plan_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_transport_maritime_security_plan_exclusion
    - confidence_level: 85
      id_match: Regex_au_transport_maritime_security_plan_primary
      matches:
        - ref: Regex_au_transport_maritime_security_plan_zone_or_declaration
          min_count: 2
          unique_results: true
        - ref: Keyword_au_transport_maritime_security_plan_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_transport_maritime_security_plan_exclusion
    - confidence_level: 75
      id_match: Regex_au_transport_maritime_security_plan_primary
      matches:
        - type: any
          refs:
            - Regex_au_transport_maritime_security_plan_security_contact
            - Regex_au_transport_maritime_security_plan_zone_or_declaration
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_transport_maritime_security_plan_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_transport_maritime_security_plan_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_transport_maritime_security_plan_primary
      pattern: >-
        (?i)\b(?:Transport\s+Security\s+Program(?:me)?|Maritime\s+Security\s+Plan|Ship\s+Security\s+Plan|Offshore\s+(?:Facility\s+)?Security\s+Plan|International\s+Ship\s+Security\s+Certificate)s?\b
    - id: Regex_au_transport_maritime_security_plan_security_contact
      pattern: >-
        (?i)(?:\b(?:(?:Port|Company|Ship|Offshore(?:\s+Facility)?|Airport|Aviation)\s+Security\s+(?:Officer|Manager|Contact)|PSO|CSO|SSO)(?:\s*\([^)]{1,20}\))?\s*[:#-]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|role|roles|means|is|are|must|should|may|will|shall|to|be)\b|_{2,}|\[|<)[A-Z][A-Za-z'.-]{1,30}(?:[ \t]+[A-Z][A-Za-z'.-]{1,30}){1,3}|\b(?:24[\s/-]?(?:hour|hr)|after[\s-]hours)\s+(?:security\s+)?(?:contact|phone|number|mobile)\s*[:#-]?\s*(?:\+?61[ \t]?|0)[2-478](?:[ \t]?\d){8}\b)
    - id: Regex_au_transport_maritime_security_plan_zone_or_declaration
      pattern: >-
        (?i)(?:\b(?:(?:land|water|air)[\s-]?side\s+(?:restricted\s+|security\s+)?zone|cleared\s+zone|restricted\s+zone|screening\s+point)\s*(?:No\.?|ID|ref(?:erence)?)?\s*[:#-]\s*(?!(?:n/?a|unknown|tbc|tba|the|a|an|any|all|each|see|refer|means|is|are|must|should|may|insert)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/.-]{0,20}(?:[ \t]+[A-Za-z0-9/.-]{1,20}){0,4}|\bDeclaration\s+of\s+Security\s*(?:No\.?|ref(?:erence)?|ID)\s*[:#]\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/.-]{1,20}|\bDeclaration\s+of\s+Security\b[^.\n]{0,80}?\b(?:signed|agreed|completed|executed)\s+(?:on\s+)?(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2}))
    - id: Regex_au_transport_maritime_security_plan_exclusion
      pattern: >-
        (?i)(?:\b49\s+CFR\b|\b33\s+CFR\b|\bTransportation\s+Security\s+Administration\b|\bSensitive\s+Security\s+Information\b|\bhomeaffairs\.gov\.au|\blegislation\.gov\.au|\bFederal\s+Register\s+of\s+Legislation|\bCivil\s+penalty\s*:|\bgeneral\s+information\s+only\b|\bthis\s+(?:article|fact\s?sheet|guidance(?:\s+note)?|webinar|course|module)\b|\b(?:short|online|training)\s+course\b|\b(?:enrol|enroll)\s+(?:now|today)\b)
  keywords:
    - id: Keyword_au_transport_maritime_security_plan_corroborative
      groups:
        - match_style: word
          terms:
            - unlawful interference
            - approved by the Secretary
            - maritime security level
            - Aviation Transport Security Act 2004
            - Maritime Transport and Offshore Facilities Security Act 2003
            - text: TSP
              case_sensitive: true
            - text: ISSC
              case_sensitive: true
            - security level 1
            - security level 2
            - security level 3
            - aviation security information
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies populated content of an aviation Transport Security Program or a maritime, ship or offshore security plan: named security officers and their 24-hour numbers, restricted and cleared zone layouts, screening points and Declarations of Security. This is the operational blueprint an attacker would need to defeat preventive security at an airport, port, ship or offshore facility. Disclosing TSP content without consent is an offence (ATSR reg 2.06) and plans must be protected against unauthorised access and disclosure (MTOFSR regs 3.12, 4.115, 5A.105). Guidance, templates, US SSI material and training are excluded from enforce tiers. Risk 9 supports SENSITIVE Government; there is no mandated Australian marking for this material.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: Aviation Transport Security Regulations 2005 (F2005L00366) - reg 2.06 Offence - disclosing TSPs without consent
    url: https://www.legislation.gov.au/F2005L00366/latest/text
  - title: Maritime Transport and Offshore Facilities Security Regulations 2003 (F2003B00383) - regs 3.12, 4.115, 5A.105
    url: https://www.legislation.gov.au/F2003B00383/latest/text
  - title: Department of Home Affairs - Aviation security overview
    url: https://www.homeaffairs.gov.au/transport-security/Pages/air-cargo-aviation/aviation-security-overview.aspx
  - title: 49 CFR 1520.13 - US Sensitive Security Information marking (exclusion reference only)
    url: https://www.ecfr.gov/current/title-49/part-1520/section-1520.13
