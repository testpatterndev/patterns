schema: testpattern/v1
name: Refugee or asylum case number
slug: global-top500-034-refugee-or-asylum-case-number
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to refugee or asylum case number in Australian contexts. This information type is classified as personally identifiable information under the Privacy Act
  1988.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 9 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?i)\b(?:refugee\s+or\s+asylum\s+case\s+numbers?|refugee\s+case\s+numbers?|asylum\s+case\s+numbers?)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - refugee or asylum case number
    - refugee
    - asylum
    - case
    - number
    - government
    - ids
    - civil
    - status
  proximity: 300
  keyword_lists:
    - government-services
    - generic-data-labels
    - data-record-context
test_cases:
  should_match:
    - value: 'Refugee or asylum case number'
      description: Topic phrase present
    - value: 'refugee or asylum case number'
      description: Topic phrase, lowercase
    - value: 'this record references the refugee or asylum case number held on file'
      description: Topic phrase within surrounding text
    - value: Refugee case number recorded by UNHCR.
      description: Natural separate phrase form authored in the source evidence
    - value: Asylum case number is held by the Department of Home Affairs.
      description: Natural separate phrase form authored in the source evidence
    - value: |-
        Refugee or asylum case number: Recorded
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated attribute field with a linked record field (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match phrase marker
    - value: generic narrative without identifier/document anchors
      description: Should not match plain mention
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
    - value: Civil court case number 88441.
      description: Case number without refugee/asylum context must not classify
    - value: Public report discusses asylum policy.
      description: Asylum topic without case-number language is insufficient
    - value: 'Template only: asylum case number ______.'
      description: Blank template field must not reach the excluded 75/85 tiers (discovery inventory only)
    - value: |-
        Refugee or asylum case number:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about refugee or asylum case number are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: |-
        Refugee or asylum case number:
        Name: Avery Teston
      description: "Record with the attribute label but no value: the label must not corroborate itself (discovery only)"
false_positives:
  - description: Common words and phrases related to refugee or asylum case number appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_global_top500_034_refugee_or_asylum_case_number_populated_label
      matches:
        - ref: Regex_global_top500_034_refugee_or_asylum_case_number_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Regex_global_top500_034_refugee_or_asylum_case_number_populated_label
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_refugee_asylum
      matches:
        - ref: Evidence_refugee_asylum
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_refugee_asylum
      description: Unexcluded phrase tier — discovery-only because the template exclusion protects only the 75/85 tiers
  regexes:
    - id: Pattern_refugee_asylum
      pattern: (?i)\b(?:refugee\s+or\s+asylum\s+case\s+numbers?|refugee\s+case\s+numbers?|asylum\s+case\s+numbers?)\b
    - id: Pattern_au_top500_034_refugee_or_asylum_case_number_label_context
      pattern: (?i)\b(?:refugee\s+or\s+asylum\s+case\s+number)\b
    - id: Regex_global_top500_034_refugee_or_asylum_case_number_populated_label
      pattern: (?i)\b(?:\b(?:refugee\s+or\s+asylum\s+case\s+numbers?|refugee\s+case\s+numbers?|asylum\s+case\s+numbers?)\b)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_global_top500_034_refugee_or_asylum_case_number_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_refugee_asylum
      groups:
        - match_style: word
          terms:
            - asylum seeker
            - protection visa
            - refugee status
            - humanitarian visa
            - Department of Home Affairs
            - UNHCR
            - refugee determination
            - safe haven enterprise visa
            - temporary protection visa
            - onshore protection
    - id: Keyword_au_top500_034_refugee_or_asylum_case_number_domain_context
      groups:
        - match_style: word
          terms:
            - refugee or asylum case number
            - refugee
            - asylum
            - case
risk_description: >-
  This concept regex matches refugee or asylum case-number wording, including a statement that such a number is held on file, rather than parsing a case-number format. It does not require a claimant, issued value, country of origin, protection claim, vulnerability, or outcome, so policy, workflow, and template text can trigger without exposing a person. A populated case identifier linked to an applicant could reveal migration status and support targeted harm, but that sensitive record is additional context rather than the detected unit. Risk 4 OFFICIAL fits the phrase cue; SENSITIVE is not met without an attributable number, claimant, or substantive asylum case information.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 4 maps to OFFICIAL and Low tiers because the detector returns refugee or asylum case-number terminology without
    a number, claimant, or protection narrative. SENSITIVE is not met unless populated person-linked case data or
    substantive vulnerability and migration information is present.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      An asylum-case-number label is generically Low with Low DLM because it signals a record category but discloses no
      claimant or case detail.
created: '2026-02-08'
updated: '2026-10-19'
changelog:
  - version: 1.5.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now uses the populated field as its primary (Regex_global_top500_034_refugee_or_asylum_case_number_populated_label: the label followed by a value), or the phrase plus one remaining corroborative term (asylum seeker, protection visa, refugee status, humanitarian visa, Department of Home Affairs, UNHCR, refugee determination, safe haven enterprise visa, temporary protection visa, onshore protection); 85 requires the populated field plus a populated person/client field (Regex_global_top500_034_refugee_or_asylum_case_number_record_structure). Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list. Removed evidence no longer referenced by any tier (Evidence_generic_data_labels). Added a populated positive and empty-form / policy-guidance decoys, plus a record with the label but no value.'
  - version: 1.4.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.4.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 3 verified legislation/regulator references."
  - version: 1.4.0
    date: '2026-07-17'
    description: 'TP-00163 approved reduced scope: add only the two separate natural phrase alternatives refugee case number and asylum case number (both already authored as evidence terms) to the primary regex (top-level and Pattern_refugee_asylum), fixing the recall gap where the primary demanded the unnatural combined phrase; per QA consistency requirement, the unexcluded 65 phrase tier is marked discovery-only since template exclusion protects only 75/85. Deferred per QA/independent review: protection visa case, UNHCR case, and humanitarian case anchors (broaden beyond the titled number concept; need corpus evidence) and any bounded-identifier grammar (no case-number format supplied). Added the two natural-phrase positives plus civil-court, asylum-policy, and blank-template negatives.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 638 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
