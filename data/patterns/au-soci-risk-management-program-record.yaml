schema: testpattern/v1
name: SOCI Act Relevant Information Record (CIRMP, Asset Register, SoNS Obligations)
slug: au-soci-risk-management-program-record
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Documents that are "relevant information" under s 5A of the Security of Critical Infrastructure Act 2018 (Cth): a critical infrastructure risk management program (CIRMP, s 30AC) and the annual CIRMP report (s 30AG: up-to-date statement for a financial year, board or governing body approval, hazards with a significant relevant impact; LIN 23/006 and LIN 26/075 terms), Register of Critical Infrastructure Assets submissions (s 6 interest and control information, s 7 operational information), and Systems of National Significance enhanced cyber security obligation documents (incident response plan s 30CD, cyber security exercise evaluation reports s 30CQ / 30CR, vulnerability assessment report s 30CZ, system information reporting notices s 30DB / 30DC). There is no statutory marking for this material, so the classifier does not anchor on "PROTECTED" or any other label.
operation: >-
  Primary: CIRMP / "critical infrastructure risk management program", "Register of Critical Infrastructure Assets", "system(s) of national significance", "enhanced cyber security obligations" or a SOCI section reference (s 30AC, 30AG, 30AQ, 30CD, 30CH, 30CQ, 30CR, 30CZ, 30DB, 30DC). 65 is discovery-only (primary alone) and will surface CISC guidance, legislation and law-firm articles. 75 requires one populated record structure within 300 characters: a labelled entity/asset/hazard/interest field with a non-placeholder value, a financial-year field, an ABN value, an s 30AG statement that the program was (not) up to date for a named financial year, a type-and-level-of-interest percentage, or a dated board/governing-body approval. 85 requires two distinct structure hits plus an independent corroborative term (significant relevant impact, LIN 26/075 defined terms, CISC, relevant Commonwealth regulator). Every tier excludes template/fixture text; enforce tiers also exclude legislation and guidance signals (cisc.gov.au, legislation.gov.au, "Civil penalty:", compilation headers, law-firm disclaimers).
pattern: (?i)\b(?:critical\s+infrastructure\s+risk\s+management\s+program(?:me)?|CIRMP|Register\s+of\s+Critical\s+Infrastructure\s+Assets|systems?\s+of\s+national\s+significance|enhanced\s+cyber\s+security\s+obligations?|(?:section|s\.?)\s?30(?:AC|AG|AQ|CD|CH|CQ|CR|CZ|DB|DC))\b
confidence: medium
confidence_justification: >-
  Medium: the primary terms are statutory and distinctive, but CISC guidance, the legislation and law-firm commentary use every one of them, and there is no statutory marking or public identifier for CIRMPs, register entries or SoNS reports. Enforce tiers therefore depend on populated record fields laid out like register submissions and annual reports. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
  - Security of Critical Infrastructure (Critical infrastructure risk management program) Rules (LIN 23/006) 2023
  - Enhanced Critical Infrastructure Risk Management Program Rules 2026 (LIN 26/075)
frameworks:
  - PSPF
  - QGISCF
data_categories:
  - security
  - infrastructure
  - government
corroborative_evidence:
  keywords:
    - significant relevant impact
    - relevant Commonwealth regulator
    - Cyber and Infrastructure Security Centre
    - enhanced CIRMP requirement
    - baseline CIRMP requirement
    - credential compromise hazard
    - lateral movement hazard
    - maximum acceptable outage
    - relevant security clearance
  proximity: 300
test_cases:
  should_match:
    - value: "Critical infrastructure risk management program - annual report (s 30AG)\nResponsible entity: Coralbay Water Services Pty Ltd\nABN: 62 000 641 439\nFinancial year: 2025-26\nThe CIRMP was up to date at the end of the 2025-26 financial year.\nApproved by the board at its meeting on 14 August 2026.\nHazards that had a significant relevant impact: credential compromise hazard at the Tarrant Creek treatment plant historian."
      description: 85 tier - completed s 30AG annual report with entity, ABN, financial year, up-to-date statement and dated board approval plus LIN 26/075 hazard term
      synthetic: true
    - value: "Register of Critical Infrastructure Assets - operational information (s 7)\nAsset location: 220 Quarry Road, Brendale QLD 4500 (gas storage facility)\nArea serviced and operator arrangements will be provided in the next submission."
      description: 75 tier - register submission with one populated operational field
      synthetic: true
    - value: "Register of Critical Infrastructure Assets - interest and control information (s 6)\nDirect interest holder: Marlin Harbour Infrastructure Holdings Ltd\nCountry of incorporation: Singapore\nType and level of interest: 45% ordinary shares with board appointment rights\nSubmitted to the Cyber and Infrastructure Security Centre on behalf of the responsible entity."
      description: 85 tier - s 6 interest and control information with holder, country and interest percentage plus CISC
      synthetic: true
    - value: "System of national significance - vulnerability assessment report under s 30CZ\nAssessment date: 18/07/2026\nAssessment scope: Northbank Energy market settlement platform and OT jump hosts\nFindings: 4 critical, 11 high; lateral movement hazard from IT to OT confirmed at two substations."
      description: 85 tier - SoNS vulnerability assessment report with dated scope and LIN 26/075 hazard term
      synthetic: true
    - value: "Incident response plan (s 30CD) - system of national significance\nPlan owner: Ingrid Salter, Head of OT Security\nThe plan covers ransomware on the gas control system and loss of the primary control room."
      description: 75 tier - SoNS incident response plan with a named plan owner
      synthetic: true
  should_not_match:
    - value: "Under s 30AG of the Security of Critical Infrastructure Act 2018 a responsible entity must give an annual report within 90 days after the end of the financial year. The report must state whether the CIRMP was up to date at the end of the financial year and be approved by the board, council or other governing body. The approved form is available at cisc.gov.au."
      description: CISC / legislation guidance quoting s 30AG
    - value: "CIRMP annual report - approved form\nResponsible entity: __________\nABN: __________\nFinancial year: ____\nBoard approval date: ____\nHazards that had a significant relevant impact: [describe]"
      description: Blank approved form
    - value: "SOCI reforms: what the 2026 CIRMP rules mean for you. LIN 26/075 introduces enhanced CIRMP requirements, credential compromise hazards and a maximum acceptable outage for each critical system. This article is general information only and does not constitute legal advice."
      description: Law-firm article
    - value: "Energy operators say the systems of national significance regime has lifted compliance costs, with more than 160 assets now declared under the SOCI Act."
      description: News reporting
    - value: "CIRMP training exercise\nResponsible entity: Harbourview Water Pty Ltd\nFinancial year: 2025-26\nThe CIRMP was up to date at the end of the 2025-26 financial year."
      description: Training exercise (template-exclusion)
false_positives:
  - description: CISC guidance, the SOCI Act and CIRMP Rules, and law-firm, vendor and university commentary repeat every section number and statutory phrase.
    mitigation: Guidance stays at 65 discovery; enforce tiers need populated record fields and exclude cisc.gov.au / legislation.gov.au URLs, "Civil penalty:" and compilation headers, and law-firm disclaimers.
  - description: Blank approved forms and internal CIRMP templates.
    mitigation: Blank lines, bracket placeholders and n/a/tbc values are rejected; template and training wording is excluded by the shared template-exclusion dictionary.
  - description: A genuine CIRMP that cites cisc.gov.au in its references section will be suppressed from enforce tiers.
    mitigation: Accepted trade-off to keep guidance out; such documents still surface at 65 discovery.
  - description: PSPF PROTECTED documents unrelated to SOCI.
    mitigation: The classifier does not use any security classification marking as an anchor; CISC notes SOCI protected information is not the PSPF PROTECTED classification.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_soci_risk_management_program_record_primary
      matches:
        - ref: Regex_au_soci_risk_management_program_record_field
          min_count: 2
          unique_results: true
        - ref: Keyword_au_soci_risk_management_program_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_soci_risk_management_program_record_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_soci_risk_management_program_record_primary
      matches:
        - ref: Regex_au_soci_risk_management_program_record_field
        - ref: Regex_au_soci_risk_management_program_record_statement
        - ref: Keyword_au_soci_risk_management_program_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_soci_risk_management_program_record_guidance_exclusion
    - confidence_level: 85
      id_match: Regex_au_soci_risk_management_program_record_primary
      matches:
        - ref: Regex_au_soci_risk_management_program_record_statement
          min_count: 2
          unique_results: true
        - ref: Keyword_au_soci_risk_management_program_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_soci_risk_management_program_record_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_soci_risk_management_program_record_primary
      matches:
        - type: any
          refs:
            - Regex_au_soci_risk_management_program_record_field
            - Regex_au_soci_risk_management_program_record_statement
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_soci_risk_management_program_record_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_soci_risk_management_program_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_soci_risk_management_program_record_primary
      pattern: >-
        (?i)\b(?:critical\s+infrastructure\s+risk\s+management\s+program(?:me)?|CIRMP|Register\s+of\s+Critical\s+Infrastructure\s+Assets|systems?\s+of\s+national\s+significance|enhanced\s+cyber\s+security\s+obligations?|(?:section|s\.?)\s?30(?:AC|AG|AQ|CD|CH|CQ|CR|CZ|DB|DC))\b
    - id: Regex_au_soci_risk_management_program_record_field
      pattern: >-
        (?i)\b(?:responsible\s+entity|reporting\s+entity|entity\s+name|asset\s+name|critical\s+infrastructure\s+asset|asset\s+class|asset\s+location|area\s+serviced|operator|direct\s+interest\s+holder|head\s+office|country\s+of\s+(?:incorporation|residence|citizenship)|chief\s+executive\s+officer|CEO|hazard(?:\s+(?:type|category|description))?|material\s+risk|critical\s+system|plan\s+owner|exercise\s+(?:date|type)|assessment\s+(?:date|scope)|board\s+(?:approval|resolution)\s+date|date\s+of\s+(?:board|governing\s+body)\s+approval)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer|describe|insert)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/&'.,-]{0,60}(?:[ \t]+[A-Za-z0-9&'.,/-]{1,30}){0,4}
    - id: Regex_au_soci_risk_management_program_record_statement
      pattern: >-
        (?i)(?:\b(?:financial|reporting)\s+year\s*[:#]?\s*(?:FY\s?)?20\d{2}\s?[-–/]\s?(?:20)?\d{2}\b|\bABN\s*[:#]?\s*\d{2}\s?\d{3}\s?\d{3}\s?\d{3}\b|\b(?:CIRMP|program(?:me)?)\s+was\s+(?:not\s+)?up\s+to\s+date\s+(?:at|as\s+at)\s+(?:the\s+end\s+of\s+)?(?:the\s+)?(?:(?:FY\s?)?20\d{2}\s?[-–/]\s?(?:20)?\d{2}\s+financial\s+year|30\s+June\s+20\d{2})|\b(?:type\s+and\s+level\s+of\s+(?:the\s+)?interest|level\s+of\s+interest|equity\s+interest|shareholding)\s*[:#-]?\s*[^\n%]{0,40}?\d{1,3}(?:\.\d{1,2})?\s?%|\b(?:approved|endorsed)\s+by\s+the\s+(?:board|council|governing\s+body)[^.\n]{0,60}?\b(?:on|dated)\s+(?:\d{1,2}[/.-]\d{1,2}[/.-](?:20)?\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\.?\s+20\d{2}|20\d{2}-\d{2}-\d{2}))
    - id: Regex_au_soci_risk_management_program_record_guidance_exclusion
      pattern: >-
        (?i)(?:\bcisc\.gov\.au|\blegislation\.gov\.au|\bFederal\s+Register\s+of\s+Legislation|\bCivil\s+penalty\s*:|\bCompilation\s+(?:No\.|date)|\b(?:does\s+not|is\s+not\s+intended\s+to)\s+constitute\s+legal\s+advice|\bgeneral\s+information\s+only\b|\bthis\s+(?:article|insight|fact\s?sheet|guidance(?:\s+note)?|webinar|explainer)\b|\bsubscribe\s+to\s+our\b|\bcontact\s+(?:our|the)\s+(?:team|authors?|partners?)\b)
  keywords:
    - id: Keyword_au_soci_risk_management_program_record_corroborative
      groups:
        - match_style: word
          terms:
            - significant relevant impact
            - relevant impact
            - relevant Commonwealth regulator
            - Cyber and Infrastructure Security Centre
            - text: CISC
              case_sensitive: true
            - enhanced CIRMP requirement
            - baseline CIRMP requirement
            - credential compromise hazard
            - lateral movement hazard
            - maximum acceptable outage
            - relevant security clearance
            - text: FOCI
              case_sensitive: true
            - protected information
            - Security of Critical Infrastructure Act 2018
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies an entity's own SOCI Act "relevant information" (s 5A): its CIRMP or annual CIRMP report, its Register of Critical Infrastructure Assets submission, or System of National Significance incident response plans, exercise evaluation reports, vulnerability assessment reports and system information reports, gated on populated record fields. This material maps hazards, weaknesses, ownership and control of critical infrastructure assets, and unauthorised use or disclosure of protected information is an offence under s 45 (2 years imprisonment or 120 penalty units). Guidance, legislation, blank forms and commentary are excluded from enforce tiers. Risk 9 supports SENSITIVE InfoTech; SOCI protected information is not automatically PSPF PROTECTED, so a PROTECTED label should be applied by the owner where the content is classified.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 9 is recorded with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech and the Medium tier because a
    CIRMP, register submission or SoNS report maps hazards, weaknesses and control of critical assets, and s 45 makes
    misuse an offence. SENSITIVE applies because SOCI protected information is not automatically PSPF PROTECTED; owners
    apply it.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling applies to SOCI relevant information, with statutory disclosure limits on top. High is
      left to the owner where content reaches national-significance scale.
references:
  - title: Security of Critical Infrastructure Act 2018 (Cth) - compilation C2026C00213 (ss 5A, 6, 7, 30AC, 30AG, Part 2C, 45)
    url: https://www.legislation.gov.au/C2018A00029/latest/text
  - title: Security of Critical Infrastructure (Critical infrastructure risk management program) Rules (LIN 23/006) 2023
    url: https://www.legislation.gov.au/F2023L00112/asmade
  - title: Enhanced Critical Infrastructure Risk Management Program Rules 2026 (LIN 26/075)
    url: https://www.legislation.gov.au/F2026L00701/asmade
  - title: CISC factsheet - Protected information (March 2025)
    url: https://www.cisc.gov.au/resources-subsite/Documents/cisc-factsheet-protected-information.pdf
created: '2026-09-24'
updated: '2026-09-25'
changelog:
  - version: 1.0.2
    date: '2026-09-25'
    description: >-
      Classification reasoning drafted 2026-09-25 for owner review (SIT-Reference had an auto-populated placeholder, no
      generic classification, no tier).
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release - anchored on SOCI Act s 5A relevant-information document types (CIRMP and s 30AG annual report, ss 6-7 register information, Part 2C SoNS documents); 75 gated on populated record structure, 85 on two distinct structures plus LIN 23/006 / LIN 26/075 or CISC evidence; guidance and legislation excluded. No marking anchor because none is mandated.
