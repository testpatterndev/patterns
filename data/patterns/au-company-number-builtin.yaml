schema: testpattern/v1
name: Australian Company Number (Microsoft built-in)
slug: au-company-number-builtin
version: 1.0.0
type: keyword_list
pattern_class: concept
description: >-
  Catalogue reference for the Microsoft Purview built-in Australia Company Number sensitive information type, which detects
  a nine-digit Australian Company Number passing the ACN checksum, corroborated by company-number keywords. Microsoft
  recommends high confidence (85) for the built-in entity. This YAML-only record lets a package recipe include the Microsoft
  entity explicitly; it does not reproduce Microsoft's built-in regular expressions, keyword dictionaries, checksums or XML.
operation: >-
  In Microsoft Purview, enable the built-in entity b1fba4f7-7b3e-4bb9-8f9a-9366df604dbb to use Microsoft's detection logic.
  This reference exports YAML only and must not be deployed as a custom XML clone. The custom SIT au-company-number (Australian
  Company Number) detects the same data with TestPattern's own tiers and stays the default; choose this built-in only through
  an explicit recipe include.
keywords:
- Australian Company Number
- Australia Company Number
confidence: medium
confidence_justification: >-
  Medium confidence for this YAML-only record: its keyword logic finds references to the built-in entity name with Microsoft
  Purview context, not populated values. Microsoft's own recommended confidence for the entity is 85. The record does not
  claim to reproduce Microsoft's proprietary detection logic.
jurisdictions:
- au
regulations:
- Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
- NDB Scheme (Cth)
- Privacy Act 1988 (Cth)
frameworks:
- ISO 27001
data_categories:
- pii
- government-id
test_cases:
  should_match:
  - value: Australian Company Number built-in SIT
    description: Microsoft built-in entity name
  - value: Australia Company Number catalogue reference
    description: Name variant used for registry discovery
  - value: |-
      DLP policy inventory - Microsoft Purview
      Rule: Builtin-au-company-number-builtin
      Condition: Australia Company Number (built-in entity b1fba4f7-7b3e-4bb9-8f9a-9366df604dbb), high confidence, instance count 1 or more
      Action: notify sender
    description: DLP rule inventory row naming the built-in entity with Microsoft Purview context
    synthetic: true
  should_not_match:
  - value: 'ACN: 004 085 616'
    description: Populated value or sibling reference without the built-in entity name
  - value: Australian Business Number register
    description: Populated value or sibling reference without the built-in entity name
  - value: Company registration extract catalogue
    description: Populated value or sibling reference without the built-in entity name
false_positives:
- description: Documentation and policy inventories can mention the Microsoft built-in entity by name.
  mitigation: Treat this YAML-only record as catalogue discovery; enable the Microsoft entity for value detection.
- description: The custom SIT au-company-number detects the same data; deploying both doubles matches on the same content.
  mitigation: Pick one per package. The custom SIT is the default; include this built-in only by an explicit recipe decision.
exports:
- yaml
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
  - confidence_level: 75
    id_match: Keyword_au_company_number_builtin_name
    matches:
    - ref: Evidence_microsoft_builtin_context
  keywords:
  - id: Keyword_au_company_number_builtin_name
    groups:
    - match_style: word
      terms:
      - Australian Company Number
      - Australia Company Number
    strength: specific
  - id: Evidence_microsoft_builtin_context
    groups:
    - match_style: word
      terms:
      - Microsoft Purview
      - built-in SIT
      - built-in entity
      - catalogue reference
      - entity definition
    strength: domain
risk_rating: 5
risk_description: >-
  The referenced Microsoft entity detects the same data as the custom SIT au-company-number, so this record carries that
  SIT's reviewed risk (5) and sensitivity labels unchanged. The built-in changes who maintains the detection logic, not what
  the matched content is worth to an attacker.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Tier Low is carried from the reviewed assessment of the custom SIT au-company-number, which detects the same data. This
    record is a YAML-only reference to the Microsoft entity.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low with Low handling is carried from au-company-number, the custom SIT for the same data.
references:
- url: https://learn.microsoft.com/en-us/purview/sit-defn-australia-company-number
  title: Australia company number entity definition - Microsoft Learn
- url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-entity-definitions
  title: Sensitive information type entity definitions - Microsoft Learn
created: '2026-10-20'
updated: '2026-10-20'
author: testpattern-community
source: microsoft
license: MIT
changelog:
- version: 1.0.0
  date: '2026-10-20'
  description: >-
    Catalogue reference for the Microsoft built-in Australia Company Number (GUID b1fba4f7-7b3e-4bb9-8f9a-9366df604dbb, from
    the Microsoft Learn entity definition), split from au-company-number when that slug went back to being a custom SIT. In
    no block: packages take it only by explicit recipe include.
