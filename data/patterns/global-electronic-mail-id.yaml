schema: testpattern/v1
name: Electronic Mail Address
slug: global-electronic-mail-id
version: 2.4.2
type: regex
pattern_class: identifier
engine: universal
description: >-
  Identifies electronic mail addresses in local-part@domain.tld form using a pragmatic RFC 5322 /
  WHATWG HTML Living Standard subset: bounded local-part (64 characters, per RFC 5321) and domain-label
  quantifiers, not the full RFC 5322 address-list grammar (no quoted-string local parts, comments, or
  domain literals). Unlike the WHATWG "valid e-mail address" definition, a dotted domain ending in an
  alphabetic (or xn-- punycode) top-level label is required, so dotless intranet values such as
  user@localhost are deliberately excluded. Retina image asset names (logo@2x.png) are rejected in the
  primary. Absorbs the former global-email-address classifier.
operation: >-
  Validation: none (email addresses have no universal checksum). Reference: RFC 5322 section 3.4.1
  (addr-spec), RFC 5321 section 4.5.3.1.1 (64-octet local-part limit), WHATWG HTML Living Standard
  "valid e-mail address". The bare address is discovery-only at 65, an explicit email or correspondence
  label enforces at 75, and a labelled address in an independent customer, contact-record, directory,
  account-holder, or communication record context reaches 85. Explicit templates and published
  public-contact context (public website, public directory, published contact, media enquiries, generic
  mailbox) are excluded from the enforcing tiers.
pattern: '\b[A-Za-z0-9][A-Za-z0-9.!#$%&''*+/=?^_{|}~-]{0,63}@(?![1-4]x\.(?:png|jpe?g|gif|webp|svg)\b)[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?){0,7}\.(?:[A-Za-z]{2,24}|xn--[A-Za-z0-9-]{1,59})\b'
confidence: high
confidence_justification: >-
  High confidence: the bounded local-part@domain.tld structure with an alphabetic top-level label is
  distinctive to email addresses, and Retina asset names (logo@2x.png) are rejected in the primary.
  Residual collisions (package@1.2.build-style version tokens) stay at the discovery-only 65 tier
  unless an email label is present.
jurisdictions:
  - global
regulations:
  - GDPR
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - CCPA/CPRA
frameworks:
- ISO 27001
- ISO 27701
- SOC 2
data_categories:
  - pii
  - contact-information
corroborative_evidence:
  keywords:
    - electronic mail
    - correspondence address
    - inbox
    - mailbox
    - e-mail address
    - send to
    - reply to
    - contact email
    - personal email
    - work email
    - mailto
  proximity: 300
  keyword_lists:

    - correspondence-address-labels
    - pii-personal
test_cases:
  should_match:
    - value: alerts@agency.gov.au
      description: Low-tier probe - valid email structure without correspondence context
    - value: 'Inbox: service.desk@agency.gov.au'
      description: Medium-tier probe - email with an explicit correspondence label
    - value: 'Customer record - email address: jane_doe+work@company.com.au'
      description: High-tier probe - labelled email in an independent customer-record context
    - value: Send to info@government.gov.au
      description: Medium-tier labelled government email address
    - value: 'Customer contact record 44871; account holder Priya Raman; contact email: priya.raman77@northwind.com.au; preferred channel: email'
      description: Exact 85 probe carried from global-email-address - labelled address in a populated contact record
    - value: Please reach j.smith+news99@sub.example.co.uk today.
      description: Plus-addressing local part with a multi-label subdomain and double TLD (bounded RFC 5322 subset)
    - value: 'Employee directory record - work email: user_name-99@my-domain123.org'
      description: Underscore/hyphen local part with a hyphenated, digit-bearing domain label in a directory record
  should_not_match:
    - value: The ratio is 3@4 per unit
      description: At symbol used in non-email context
    - value: user@localhost
      description: Local address without valid TLD
    - value: '@mention in chat'
      description: Social media mention, no local part
    - value: 'Documentation example: user@example.com'
      description: Reserved-domain example explicitly framed as documentation
    - value: 'Asset manifest for the email banner: logo@2x.png, icon@3x.png'
      description: Retina image asset filenames are rejected by the primary even beside an email label
    - value: 'Public website contact email: media@agency.gov.au'
      description: Published generic contact address is vetoed from enforcement by public-contact context
    - value: 'Media release: for media enquiries email press@agency.gov.au. The customer record system upgrade is complete.'
      description: News/media-release decoy with email label and record wording is vetoed by public-contact context
    - value: 'Sample template: customer contact record; contact email: jane.doe@northwind.com.au'
      description: Template text contains high-tier evidence but is vetoed by the shared exclusion
    - value: 'Privacy policy: staff must not forward a customer email address or account holder details to personal mailboxes.'
      description: Policy prose with email and record wording but no address value
    - value: 'Customer profile URL: https://example.org/people/jane-doe'
      description: Sibling contact locator contains no email-address primary
false_positives:
  - description: At symbols in code, formulas, or social media handles.
    mitigation: Require a dotted domain with an alphabetic top-level label after the @.
  - description: >-
      Retina-resolution image asset filenames such as logo@2x.png or icon@3x.png structurally satisfy
      local-part@domain.tld.
    mitigation: >-
      The primary rejects @1x-@4x followed by a common image extension; other asset tokens stay at the
      discovery-only 65 tier unless email evidence is present.
  - description: >-
      Source annotations, changelog entries, or CI badge URLs containing an @ followed by a dotted
      version-like token (e.g. package@1.2.build) can coincidentally satisfy the structural pattern.
    mitigation: >-
      Layer with file-type/content-type context (exclude source-code paths) and require email-label
      evidence at the 75 tier.
  - description: Published public-contact mailboxes (media enquiries, public website or directory contacts).
    mitigation: Public-contact context is a NOT-group on the 75 and 85 tiers.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
risk_rating: 5
risk_description: >-
  The high-confidence regex finds RFC-shaped electronic mail addresses with a valid multi-character top-level domain, rather than generic text containing an at sign. A genuine address can enable phishing, spam, account discovery, or unwanted contact against its mailbox owner, especially when the local part reveals a name or role. The address alone provides no mailbox content, password, token, or proof of a sensitive affiliation, and many business addresses are deliberately public. Risk 5 OFFICIAL reflects bounded direct contact risk; SENSITIVE would require authentication material, confidential correspondence, a protected identity, or a sensitive address roster.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: "CUI"
  uk_gov: "OFFICIAL"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_electronic_mail
      matches:
        - ref: Evidence_correspondence_label
        - ref: Evidence_correspondence_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
            - Evidence_public_email_context
    - confidence_level: 75
      id_match: Pattern_electronic_mail
      matches:
        - ref: Evidence_correspondence_label
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
            - Evidence_public_email_context
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_electronic_mail
  regexes:
    - id: Pattern_electronic_mail
      pattern: '\b[A-Za-z0-9][A-Za-z0-9.!#$%&''*+/=?^_{|}~-]{0,63}@(?![1-4]x\.(?:png|jpe?g|gif|webp|svg)\b)[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?){0,7}\.(?:[A-Za-z]{2,24}|xn--[A-Za-z0-9-]{1,59})\b'
  keywords:
    - id: Evidence_correspondence_label
      groups:
        - match_style: word
          terms:
            - electronic mail
            - correspondence address
            - email
            - email address
            - inbox
            - mailbox
            - e-mail address
            - send to
            - reply to
            - forward to
            - cc
            - bcc
            - e-mail
            - contact email
            - personal email
            - work email
            - send an email
            - mailto
      strength: generic
    - id: Evidence_correspondence_context
      groups:
        - match_style: word
          terms:
            - personal details
            - customer record
            - client file
            - account holder
            - subscriber
            - notification
            - communication
            - customer contact record
            - contact record
            - employee directory record
            - recipient list
            - client profile
      strength: domain
    - id: Evidence_public_email_context
      groups:
        - match_style: word
          terms:
            - public website
            - public directory
            - published contact
            - media enquiries
            - generic mailbox
      strength: exclusion
created: '2026-02-09'
updated: '2026-09-24'
references:
  - url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4.1
    title: "RFC 5322 section 3.4.1 (Addr-Spec Specification)"
  - url: https://www.rfc-editor.org/rfc/rfc5321#section-4.5.3.1.1
    title: "RFC 5321 section 4.5.3.1.1 (local-part size limit)"
  - url: https://html.spec.whatwg.org/multipage/input.html#valid-e-mail-address
    title: "WHATWG HTML Living Standard: valid e-mail address"
changelog:
  - version: 2.4.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth))."
  - version: 2.4.0
    date: '2026-09-24'
    description: 'Merge global-email-address into this classifier (Qld government classifier review 2026-09-24): adopt its bounded RFC 5322/WHATWG-subset regex as the primary (keeping this pattern''s alphabetic/punycode TLD requirement and adding an @1x-@4x image-asset lookahead), fold in its email-label terms, contact/directory record-context terms, public-contact NOT-group, logo@2x.png and version-token false-positive notes, RFC/WHATWG references, CCPA/CPRA and SOC 2 tags, and carried-over populated positives plus public/template/asset decoys.'
  - version: 2.3.0
    date: '2026-07-18'
    description: 'Profile quality: add bare-address discovery, labelled medium, and independent record-context high tiers; exclude explicit templates and add exact-tier adversarial tests.'
  - version: 2.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1227 without changing detector or package metadata.'
  - version: 2.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 2.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove the dead template-exclusion declaration (Keyword_noise_exclusion) instead of wiring it — dictionary terms appear in the pattern''s own should_match values or positive vocabulary, so a NOT-gate would suppress genuine matches (no behavior change: no tier referenced it)'
  - version: 2.1.0
    date: '2026-07-04'
    description: Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.; Collapsed 2 duplicate 65-confidence tier(s) into the strictest canonical tier.
