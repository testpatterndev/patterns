schema: testpattern/v1
name: Korea Physical Addresses (Microsoft built-in)
slug: kr-physical-addresses-builtin
version: 1.0.0
type: keyword_list
pattern_class: concept
description: >-
  Catalogue reference for the Microsoft Purview built-in Korea Physical Addresses sensitive information type, which detects
  street addresses in South Korea using Microsoft's named-entity address model. Microsoft documents this named-entity SIT
  without a recommended confidence level. This YAML-only record lets a package recipe include the Microsoft entity explicitly;
  it does not reproduce Microsoft's built-in regular expressions, keyword dictionaries, checksums or XML.
operation: >-
  In Microsoft Purview, enable the built-in entity 56967ee6-421b-412a-8076-653d97164620 to use Microsoft's detection logic.
  This reference exports YAML only and must not be deployed as a custom XML clone. The custom SIT kr-physical-addresses (Korea
  Physical Addresses) detects the same data with TestPattern's own tiers and stays the default; choose this built-in only
  through an explicit recipe include.
keywords:
- Korea Physical Addresses
confidence: medium
confidence_justification: >-
  Medium confidence for this YAML-only record: its keyword logic finds references to the built-in entity name with Microsoft
  Purview context, not populated values. The record does not claim to reproduce Microsoft's proprietary detection logic.
jurisdictions:
- kr
regulations:
- PIPA (South Korea)
frameworks:
- ISO 27001
- ISO 27701
data_categories:
- pii
- contact-information
test_cases:
  should_match:
  - value: Korea Physical Addresses built-in SIT
    description: Microsoft built-in entity name
  - value: Korea Physical Addresses catalogue reference
    description: Name variant used for registry discovery
  - value: |-
      DLP policy inventory - Microsoft Purview
      Rule: Builtin-kr-physical-addresses-builtin
      Condition: Korea Physical Addresses (built-in entity 56967ee6-421b-412a-8076-653d97164620), medium confidence, instance count 1 or more
      Action: notify sender
    description: DLP rule inventory row naming the built-in entity with Microsoft Purview context
    synthetic: true
  should_not_match:
  - value: Shipping address on file
    description: Populated value or sibling reference without the built-in entity name
  - value: Delivery address change request
    description: Populated value or sibling reference without the built-in entity name
  - value: Postal code lookup table
    description: Populated value or sibling reference without the built-in entity name
false_positives:
- description: Documentation and policy inventories can mention the Microsoft built-in entity by name.
  mitigation: Treat this YAML-only record as catalogue discovery; enable the Microsoft entity for value detection.
- description: The custom SIT kr-physical-addresses detects the same data; deploying both doubles matches on the same content.
  mitigation: Pick one per package. The custom SIT is the default; include this built-in only by an explicit recipe decision.
exports:
- yaml
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
  - confidence_level: 75
    id_match: Keyword_kr_physical_addresses_builtin_name
    matches:
    - ref: Evidence_microsoft_builtin_context
  keywords:
  - id: Keyword_kr_physical_addresses_builtin_name
    groups:
    - match_style: word
      terms:
      - Korea Physical Addresses
    strength: specific
  - id: Evidence_microsoft_builtin_context
    groups:
    - match_style: word
      terms:
      - Microsoft Purview
      - built-in SIT
      - built-in entity
      - catalogue reference
      - entity definition
    strength: domain
risk_rating: 3
risk_description: >-
  The referenced Microsoft entity detects the same data as the custom SIT kr-physical-addresses, so this record carries that
  SIT's reviewed risk (3) and sensitivity labels unchanged. The built-in changes who maintains the detection logic, not what
  the matched content is worth to an attacker.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Tier Low is carried from the reviewed assessment of the custom SIT kr-physical-addresses, which detects the same data.
    This record is a YAML-only reference to the Microsoft entity.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low with Low handling is carried from kr-physical-addresses, the custom SIT for the same data.
references:
- url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-entity-definitions
  title: Sensitive information type entity definitions - Microsoft Learn
created: '2026-10-20'
updated: '2026-10-20'
author: testpattern-community
source: microsoft
license: MIT
changelog:
- version: 1.0.0
  date: '2026-10-20'
  description: >-
    Catalogue reference for the Microsoft built-in Korea Physical Addresses (GUID 56967ee6-421b-412a-8076-653d97164620, from
    the tenant SIT inventory). In no block: packages take it only by explicit recipe include.
