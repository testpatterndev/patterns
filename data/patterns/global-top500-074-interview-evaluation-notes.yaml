schema: testpattern/v1
name: Interview evaluation notes
slug: global-top500-074-interview-evaluation-notes
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects interview evaluations, panel notes, candidate assessments and selection reports (including Queensland public sector selection reports under Recruitment and Selection Directive 07/23) for an identified candidate or applicant, with scores, recommendations or interview dates.
operation: >-
  Primary: an interview/selection phrase (interview evaluation/notes/score/feedback/outcome, candidate assessment/rating, selection report, panel notes, comparative assessment, hiring recommendation). 75 tier requires a populated person field (candidate, applicant or interviewee name or number, employee/staff name or number, position number or title) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated assessment detail (score or rating value, recommended/not recommended outcome, or interview date) and an independent corroborative term (referee, merit, best suited, conflict of interest, capability). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:interview\s+(?:evaluation|notes|scores?|scoring|feedback|outcome|summary|assessment|report)|candidate\s+(?:assessment|rating|evaluation)|selection\s+(?:report|panel\s+report)|panel\s+(?:notes|assessment)|comparative\s+assessment|hiring\s+recommendation)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Public Sector Act 2022 (Qld)
  - Fair Work Act 2009 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - referee
    - merit
    - best suited
    - conflict of interest
    - capability
    - shortlist
    - vacancy
    - panel chair
    - Directive 07/23
  proximity: 300
test_cases:
  should_match:
    - value: "Selection report\nPosition number: 30012345\nApplicant: Avery Teston\nInterview score: 41/50\nRecommendation: Recommended\nThe panel considers the applicant best suited; referee checks completed. Panel chair: Jordan Staffson."
      description: '85: Selection report with applicant, score, recommendation'
      synthetic: true
    - value: "Candidate assessment\nCandidate name: Riley Teston\nDate: 18/09/2026\nOverall: 3.5 out of 5\nConflict of interest declared by one panel member; shortlist ranking 2."
      description: '85: Candidate assessment with date and overall score'
      synthetic: true
    - value: "Interview notes\nCandidate: Morgan Teston\nStrong examples of stakeholder engagement; limited budget experience."
      description: '75: Interview notes naming the candidate, no score'
      synthetic: true
  should_not_match:
    - value: The selection panel must prepare a selection report recording why the successful applicant is best suited. This directive applies to all public sector entities.
      description: Directive text - must stay below 75
    - value: "Interview evaluation\nCandidate: __________\nScore: ___/50\nRecommendation: __________"
      description: Blank evaluation form - must stay below 75
    - value: 'Training module for panel members: how to write interview notes and avoid bias in candidate assessment.'
      description: Training material - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_074_interview_evaluation_notes_primary
      matches:
        - ref: Regex_top500_074_interview_evaluation_notes_person_field
        - ref: Regex_top500_074_interview_evaluation_notes_record_detail
        - ref: Keyword_top500_074_interview_evaluation_notes_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_074_interview_evaluation_notes_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_074_interview_evaluation_notes_primary
      matches:
        - ref: Regex_top500_074_interview_evaluation_notes_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_074_interview_evaluation_notes_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_074_interview_evaluation_notes_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_074_interview_evaluation_notes_primary
      pattern: >-
        (?i)\b(?:interview\s+(?:evaluation|notes|scores?|scoring|feedback|outcome|summary|assessment|report)|candidate\s+(?:assessment|rating|evaluation)|selection\s+(?:report|panel\s+report)|panel\s+(?:notes|assessment)|comparative\s+assessment|hiring\s+recommendation)\b
    - id: Regex_top500_074_interview_evaluation_notes_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit|candidate(?:\s+(?:name|no\.?|number|ID))?|applicant(?:\s+(?:name|no\.?|number|ID))?|interviewee|preferred\s+(?:candidate|applicant))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_074_interview_evaluation_notes_record_detail
      pattern: >-
        (?i)\b(?:score|rating|total|overall)\s*(?:\([^)]{1,20}\))?\s*[:\-]\s*\d{1,3}(?:\.\d)?\s*(?:/\s*\d{1,3}|out\s+of\s+\d{1,3}|%)?|\b(?:recommendation|outcome)\s*[:\-]\s*(?:recommended|not\s+recommended|suitable|not\s+suitable|appoint|merit\s+pool|preferred|unsuccessful)|\b(?:interview\s+)?date\s*[:\-]\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})
  keywords:
    - id: Keyword_top500_074_interview_evaluation_notes_corroborative
      groups:
        - match_style: word
          terms:
            - referee
            - merit
            - best suited
            - conflict of interest
            - capability
            - shortlist
            - vacancy
            - panel chair
            - Directive 07/23
      strength: specific
    - id: Keyword_top500_074_interview_evaluation_notes_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a recruitment interview evaluation or selection report about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Disclosure exposes panel judgements, scores and referee information about identifiable applicants. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
