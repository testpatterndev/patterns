schema: testpattern/v1
name: Procurement Tender Evaluation with Pricing
slug: procurement-tender-evaluation-with-pricing
version: 1.5.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects weighted evaluation matrices scoring tender responses, including commercial pricing from multiple bidders in government procurement processes.
operation: >-
  Primary: tender evaluation phrases (tender evaluation, evaluation report/matrix/panel report, weighted scores, value for money assessment, evaluation of tenders/offers). 65 = phrase only (discovery). 75 = phrase plus two distinct scores (n/5, n/10 ... n/100). 85 = 75 plus a dollar price plus either a labelled tender / RFx reference or a PROTECTED / confidential / commercial-in-confidence / probity marker. Templates, published notices and QTenders guidance are excluded.
pattern: "(?i)\\b(?:tender\\s+evaluation|evaluation\\s+(?:report|matrix|panel\\s+report|committee\\s+report)|weighted\\s+scores?|value\\s+for\\s+money\\s+assessment|evaluation\\s+of\\s+(?:tenders|offers|responses))\\b"
confidence: medium
confidence_justification: >-
  Medium confidence: multiple scores with prices next to evaluation phrasing are specific to evaluation reports; agency tender numbers are customer-defined, so the reference is a documented label-anchored fallback.
jurisdictions:
  - au
regulations:
  - "Financial Accountability Act 2009 (Qld)"
frameworks:
  - QGISCF
data_categories:
  - financial
  - government
corroborative_evidence:
  keywords:
    - tender
    - procurement
    - RFT
    - RFP
    - ITT
    - evaluation
    - assessment
    - scoring
    - price
    - cost
    - value for money
    - confidential
    - PROTECTED
    - probity
    - evaluation committee
  proximity: 300
  keyword_lists:

    - corporate-finance

    - government-services
customisation:
  - key: tender-reference-number
    kind: identifier-format
    identifier: tender-reference-number
    target: purview.regexes/Regex_procurement_tender_evaluation_with_pricing_tender_reference
    mode: replace
    affects_tiers: [85]
    required_for_enforcement: false
    note: Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#tender-reference-number). Earlier versions used the QLD-YYYY-NNNNN tender format, which does not appear in any published source.
test_cases:
  should_match:
    - value: 'PROTECTED — Tender Evaluation Report. RFT number 2026-04521: ICT Infrastructure Services. Evaluation committee scoring: Tenderer A — Technical: 78/100, Price: $14.2M. Tenderer B — Technical: 82/100, Price: $16.8M. Value for money assessment: Tenderer A recommended. Probity advisor: approved.'
      description: Tender evaluation with multiple bidder pricing and scores (reaches 85)
    - value: 'Commercial-in-Confidence. Procurement evaluation matrix — Road construction RFP 2026-03310. Weighted criteria: Price 40%, Methodology 30%, Experience 30%. Bidder pricing: Company X $45.6M, Company Y $52.1M, Company Z $48.3M. Recommendation to evaluation committee.'
      description: Procurement evaluation with competitive pricing comparison (65 discovery only - prose without populated record fields)
    - value: 'PROTECTED — Evaluation committee only. Tender evaluation summary for RFT 2026-08842. Probity-cleared scoring: Tenderer A 86/100 at $9.7M, Tenderer B 79/100 at $11.2M. Value for money: Tenderer A recommended.'
      description: Tender evaluation summary with reference number, scores and pricing (reaches 85)
    - value: "Tender evaluation report — RFT 2026-0417\nHarbour Networks: technical 38.5/50, experience 17/20, weighted score 78.2/100, price $418,960\nCoastline Data: technical 31/50, experience 15/20, weighted score 69.4/100, price $397,500\nEvaluation committee only — commercial-in-confidence."
      description: Populated record with price / score lines reaching 75 and 85 (reaches 85)
      synthetic: true
    - value: "Tender evaluation matrix\nHarbour Networks: technical 38/50, experience 17/20\nCoastline Data: technical 31/50, experience 15/20"
      description: Two or more distinct scores with evaluation phrasing, no price (reaches 75)
      synthetic: true
  should_not_match:
    - value: 'Request for Tender: ICT Infrastructure Services. Submissions close 30 March 2026. Published on QTenders for open public response.'
      description: Published tender notice — public procurement advertisement
    - value: Procurement Policy Framework — How to evaluate tenders. Template scoring matrix with example criteria and weightings.
      description: Procurement policy template without real evaluation data
    - value: "The evaluation panel will assess offers against the published criteria and weightings in the invitation to tender. How to evaluate tenders is explained in the procurement guide."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: "Tender evaluation matrix\nTenderer: __________\nTechnical score: ___/50\nPrice: $________\nWeighted score: ___/100"
      description: Blank evaluation matrix (must stay below 75)
    - value: "News: after the tender evaluation the contract went to the lowest bidder at $12.4 million, the minister announced on 14/08/2026."
      description: News article naming an evaluation, one price and a date (must stay below 75)
false_positives:
  - description: Published tender notices and procurement advertisements on QTenders
    mitigation: Exclude documents containing 'submissions close', 'published on QTenders', 'invitation to tender' without evaluation data
  - description: Procurement policy templates with example scoring matrices
    mitigation: Exclude documents containing 'template', 'example', 'how to evaluate', 'policy framework'
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_procurement_tender_evaluation_with_pricing_evaluation_terms
      matches:
        - ref: Pattern_procurement_tender_evaluation_with_pricing_score_format
          min_count: 2
          unique_results: true
        - ref: Pattern_procurement_tender_evaluation_with_pricing_dollar_amounts_with_optional_magnitude_s
        - type: any
          refs:
            - Regex_procurement_tender_evaluation_with_pricing_tender_reference
            - Evidence_procurement_tender_evaluation_with_pricing_markers
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_procurement_tender_evaluation_with_pricing_exclusion
    - confidence_level: 75
      id_match: Pattern_procurement_tender_evaluation_with_pricing_evaluation_terms
      matches:
        - ref: Pattern_procurement_tender_evaluation_with_pricing_score_format
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_procurement_tender_evaluation_with_pricing_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_procurement_tender_evaluation_with_pricing_evaluation_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_procurement_tender_evaluation_with_pricing_exclusion
  regexes:
    - id: Pattern_procurement_tender_evaluation_with_pricing_evaluation_terms
      pattern: >-
        (?i)\b(?:tender\s+evaluation|evaluation\s+(?:report|matrix|panel\s+report|committee\s+report)|weighted\s+scores?|value\s+for\s+money\s+assessment|evaluation\s+of\s+(?:tenders|offers|responses))\b
    - id: Pattern_procurement_tender_evaluation_with_pricing_dollar_amounts_with_optional_magnitude_s
      pattern: (?i)\$\d[\d,.]{0,15}(?:\s*(?:million|billion|bn|[MBK])\b)?
    - id: Pattern_procurement_tender_evaluation_with_pricing_score_format
      pattern: \b\d{1,3}(?:\.\d{1,2})?\s*/\s*(?:5|10|20|25|30|40|50|60|70|100)\b(?!/\d)
    - id: Regex_procurement_tender_evaluation_with_pricing_tender_reference
      pattern: >-
        (?i)\b(?:(?:tender|contract|offer|invitation|RFx)\s+(?:no\.?|number|ref(?:erence)?|ID)|(?:RFT|RFQ|RFP|RFO|ITO)(?:\s+(?:no\.?|number|ref(?:erence)?))?)\s*[:#]?\s*(?:[A-Z]{1,6}[/-]?)?\d[A-Z0-9/-]{2,20}\b
  keywords:
    - id: Evidence_procurement_tender_evaluation_with_pricing_markers
      groups:
        - match_style: word
          terms:
            - PROTECTED
            - confidential
            - commercial-in-confidence
            - probity
            - evaluation committee only
      strength: domain
    - id: Filter_procurement_tender_evaluation_with_pricing_exclusion
      groups:
        - match_style: word
          terms:
            - template
            - example
            - published
            - QTenders
            - invitation to tender
            - submissions close
            - how to evaluate

      strength: noise
risk_rating: 8
risk_description: >-
  The proximity detector targets pre-award tender evaluation matrices that combine procurement terms, bidder scoring, comparative pricing, value-for-money analysis, recommendations, and probity or confidentiality context. Disclosure can reveal each bidder's commercial position and the evaluation committee's reasoning, enabling bid manipulation, collusion, challenge strategy, or unfair negotiating advantage before award. The normal unit is a multi-bidder composite evaluation for one procurement and creates serious financial and integrity harm, while published notices and blank scoring templates are excluded where possible. Risk 8 SENSITIVE Financial is justified; PROTECTED is not met without a strategically critical procurement, protected operation, or credible significant government-wide damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Commercial-in-Confidence
classification:
  tier: Medium
  rationale: Nonpublic bidder pricing and comparative tender evaluations. Existing classification level retained.
  generic:
    classification: Medium
    dlm: Medium Commercial-in-Confidence
    rationale: >-
      Generic Medium Commercial-in-Confidence handling protects confidential bidder pricing, weighted scores, evaluation
      reasoning, and recommendations within a defined competitive procurement.
references:
  - title: Financial Accountability Act 2009 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-009
  - title: Queensland Procurement Policy 2026
    url: https://www.forgov.qld.gov.au/finance-procurement-and-travel/procurement/procurement-resources/procurement-policies-and-frameworks/queensland-procurement-policy-2026
created: '2026-02-20'
updated: '2026-09-25'
changelog:
  - version: 1.5.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): replaced the invented QLD-YYYY-NNNNN tender reference (previously a 65 alternative primary) with the new tender-reference-number labelled fallback (identifier-format slot), now one of the independent evidence options at 85; the score regex no longer matches dates (denominator must be a common scoring scale and not followed by /digit) and the dollar regex requires a digit; 85 = two distinct scores + a price + a tender reference or confidentiality/probity marker; tests converted to labelled RFT references with blank-matrix and news decoys; references added.'
  - version: 1.4.0
    date: '2026-09-24'
    description: "Primary was the unpublished QLD-YYYY-NNNNN tender reference, so no genuine evaluation report could fire. Primary is now evaluation-report phrasing; 75 requires two distinct score entries (n/N); 85 adds dollar amounts and confidentiality markers. The tender reference regex is kept only as optional discovery."
  - version: 1.3.3
    date: '2026-09-14'
    description: 'Assign QGISCF category to SENSITIVE Commercial-in-Confidence; preserve classification tier and detection logic.'
  - version: 1.3.2
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1440 without changing detector or package metadata.'
  - 'Purview-safe regex rewrite (groups of multi-match removed)'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.1.1
    date: '2026-07-09'
    description: Add a genuine QLD tender-reference id_match hit (QLD-2026-03310) to the second should_match value — the old value only contained dollar-amount evidence regex hits, so no tier could ever anchor on it (tier-harness triage class T5)
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
