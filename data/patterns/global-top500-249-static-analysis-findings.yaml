schema: testpattern/v1
name: Static analysis findings
slug: global-top500-249-static-analysis-findings
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies static application security testing (SAST) findings and exports - Semgrep, CodeQL, Checkmarx, Fortify, Veracode, SonarQube, Coverity, Bandit - with source file/line locations, rule or CWE IDs and severities.
operation: >-
  Regex_static_analysis_findings (static analysis/code analysis/scan findings/report/results/issues, SAST findings/report/scan, or a named SAST tool with findings/report/results/scan/alerts/issues) is discovery-only at 65. 75 requires one structure: a source file with line number, a CWE or labelled rule/query/checker ID, or a labelled severity. 85 requires two distinct structures plus a weakness class (SQL injection, XSS, path traversal, hard-coded credential, tainted data flow...). Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: (?i)\b(?:static\s+(?:application\s+security\s+testing|analysis|code\s+analysis|scan)\s+(?:findings?|report|results|issues)|SAST\s+(?:findings?|report|results|scan)|(?:Checkmarx|Fortify|Veracode|Semgrep|CodeQL|SonarQube|Coverity|Bandit|Snyk\s+Code)\s+(?:findings?|report|results|scan|alerts?|issues))\b
confidence: medium
confidence_justification: >-
  Medium confidence: report/tool wording is discovery-only; enforcement requires file/line, rule/CWE or severity structure, and 85 adds a second structure and a weakness class.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
  - CIS Controls
data_categories:
  - security
  - technology
corroborative_evidence:
  keywords:
    - SQL injection
    - cross-site scripting
    - path traversal
    - tainted
    - data flow
  proximity: 300
test_cases:
  should_match:
    - value: |-
        Semgrep findings - claims-portal (commit 4f2a9c1)
        src/main/java/au/gov/claims/SearchDao.java:118  Rule: java.lang.security.audit.sqli.jdbc-sqli  CWE-89  Severity: high
        Tainted request parameter 'surname' reaches Statement.executeQuery (SQL injection).
        web/static/js/profile.js:42  Rule: javascript.browser.security.insecure-innerhtml  Severity: medium
      description: High tier (85) - file/line locations, rule and CWE IDs and severities with a weakness class
      synthetic: true
    - value: 'SAST report for the rates app: src/billing/InvoiceService.cs line 204 flagged by the scanner.'
      description: Medium tier (75) - file/line location only
      synthetic: true
    - value: 'CodeQL alerts on the grants portal: query ID: js/reflected-xss raised against the search page.'
      description: Medium tier (75) - rule/query ID only
      synthetic: true
    - value: The static analysis findings will be reviewed at Thursday's security stand-up.
      description: Discovery tier (65) - report wording only
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: The code quality meeting ran over time.
      description: Generic code quality wording is no longer a primary
    - value: 'Secure coding guidance note: organisations should triage SAST findings by severity before release.'
      description: Guidance text
    - value: |-
        SAST findings template
        File: ______  Line: ____
        Rule: ______  Severity: ______
      description: Blank template
    - value: 'Training course slide: CodeQL alerts for a demo app show CWE-79 in src/app.js:12.'
      description: Training/demo framing must not enforce
false_positives:
  - description: SAST vendor documentation, rule catalogues and secure coding training quote rule IDs, CWE numbers and sample file paths.
    mitigation: Tool wording is discovery-only; enforcement needs finding structure, and guidance/training/demo/template framing is excluded.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_static_analysis_findings
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_source_location
            - Evidence_rule_id
            - Evidence_severity_field
        - ref: Keyword_code_weakness
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_static_analysis_findings
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_source_location
            - Evidence_rule_id
            - Evidence_severity_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_static_analysis_findings
  regexes:
    - id: Regex_static_analysis_findings
      pattern: (?i)\b(?:static\s+(?:application\s+security\s+testing|analysis|code\s+analysis|scan)\s+(?:findings?|report|results|issues)|SAST\s+(?:findings?|report|results|scan)|(?:Checkmarx|Fortify|Veracode|Semgrep|CodeQL|SonarQube|Coverity|Bandit|Snyk\s+Code)\s+(?:findings?|report|results|scan|alerts?|issues))\b
    - id: Evidence_source_location
      pattern: \b[\w./-]{1,160}\.(?:java|js|ts|tsx|jsx|py|cs|go|rb|php|cpp|kt|swift|scala|sql)(?::\d{1,6}\b|\s{1,3}line\s{1,3}\d{1,6}\b|#L\d{1,6}\b)
    - id: Evidence_rule_id
      pattern: (?i)\bCWE-\d{1,4}\b|\b(?:rule(?:\s+ID)?|query(?:\s+ID)?|checker|check\s+ID)\s{0,3}[:=]\s{0,3}(?!_{2,}|\[|<)[A-Za-z][\w./:-]{2,80}
    - id: Evidence_severity_field
      pattern: (?i)\b(?:severity|priority|risk)\s{0,3}[:=|]\s{0,3}(?:critical|high|medium|low|blocker|major|minor|error|warning)\b
  keywords:
    - id: Keyword_code_weakness
      groups:
        - match_style: word
          terms:
            - SQL injection
            - cross-site scripting
            - cross site scripting
            - text: XSS
              case_sensitive: true
            - path traversal
            - command injection
            - insecure deserialization
            - hard-coded credential
            - hardcoded credential
            - server-side request forgery
            - text: SSRF
              case_sensitive: true
            - text: IDOR
              case_sensitive: true
            - open redirect
            - broken access control
            - remote code execution
            - privilege escalation
            - account takeover
            - authentication bypass
            - tainted
            - source-to-sink
            - data flow
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
risk_description: >-
  The detector identifies SAST findings when file/line locations, rule or CWE IDs or severities are present; tool or report wording alone is discovery-only. A genuine finding can disclose vulnerable files, data flows, weakness classes, and remediation status that materially reduces the work needed to exploit an application. Scanner marketing, process documentation, and resolved findings can match, and a normal record is bounded to one finding or scan scope. Risk 7 SENSITIVE reflects moderate security harm from a current actionable SAST result; PROTECTED would require a critical unremediated flaw or major system consequence shown by additional content.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 aligns with OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, SENS_IT, and Medium because a valid
    static-analysis finding may expose actionable implementation weakness. The detector does not determine severity,
    exploitability, remediation state, or the significant damage necessary for PROTECTED.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic Medium and Medium InfoTech suit internal code-security findings that can assist targeted exploitation.
      Generic High depends on demonstrated criticality and consequence rather than the presence of SAST terminology.
created: '2026-02-08'
updated: '2026-09-25'
changelog:
