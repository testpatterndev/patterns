schema: testpattern/v1
name: Australian Deposit Account Reference
slug: au-deposit-account-reference
version: 2.6.1
type: regex
pattern_class: identifier
engine: boost_regex
description: Identifies references to Australian consumer deposit account numbers in financial and compliance documents. Uses structural anchors with proximity constraints.
operation: >-
  Structural-anchor regex matching account identifiers preceded by financial field labels. Two tiers: 85 needs deposit-specific keywords (BSB, direct debit, account holder and similar) within
  300 characters, outside the label; 75 is the populated label alone. Both tiers exclude sample/template/test placeholder text.
pattern: (?is)\b(?:deposit\s+account|account\s+(?:number|no\.?|#|ref(?:erence)?)|bank\s+account|savings\s+account|cheque\s+account|transaction\s+account)\b(?:\s{0,10}[:#=;])?\s{0,80}\b[A-Z0-9][A-Z0-9\-/]{4,24}\b
confidence: medium
confidence_justification: >-
  Medium confidence: structural anchors constrain context but broad field labels can match non-financial identifiers. Corroborative keywords improve precision, and explicit
  template/example exclusion reduces incidental matches.
jurisdictions:
  - au
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - deposit account
    - bank account number
    - BSB
    - account number
    - savings account
    - cheque account
    - transaction account
    - direct debit
  proximity: 300
  keyword_lists:
    - financial-deposit-terms
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: account number  A12345678
      description: Account number anchor with alphanumeric account
    - value: deposit account B062000ACC12
      description: Deposit account anchor followed by financial reference code
    - value: bank account  X1234-5678/90
      description: Bank account anchor with identifier containing hyphens and slashes
    - value: 'account number: 12345678'
      description: Colon delimiter between label and value now matches
    - value: deposit account = ACC-2244-77
      description: Equals delimiter between label and value now matches
    - value: bank account; X12345678
      description: Semicolon delimiter between label and value now matches
    - value: 'account ref # ACC998877'
      description: Hash delimiter between label and value now matches
    - value: "account number:\n12345678"
      description: Line break after a delimited label now matches
  should_not_match:
    - value: unrelated generic text
      description: No relevant context
    - value: number A12345678
      description: Bare 'number' anchor no longer matches without account context
    - value: the quick brown fox
      description: No structural anchor or identifier
    - value: reference B062000ACC12
      description: Bare 'reference' anchor no longer matches without account context
false_positives:
  - description: Financial terminology in published reports or textbooks without actual data.
    mitigation: Require corroborative keywords in proximity.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
risk_rating: 5
risk_description: >-
  The pattern finds a labelled Australian deposit-account identifier after account-number, deposit-account, or bank-account anchors, but it does not require an account holder, BSB, balance, password, or transaction authority. Disclosure may assist social engineering, payment misdirection, or attempted direct-debit fraud when combined with routing, identity, and process information. The account owner faces bounded risk from the atomic reference, and successful financial harm requires several material companion facts and access to a payment workflow. Risk 5 and OFFICIAL therefore better fit what the detector establishes, while co-occurrence with an identifiable holder, BSB, mandate, or live payment instruction would raise the context toward SENSITIVE.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to QGISCF OFFICIAL, PSPF OFFICIAL, DLM OFFICIAL, OFFI, and Low because the detected unit is one account
    reference requiring substantial additional data for misuse. SENSITIVE is not met without holder identity, routing,
    authorization, transaction context, or a composite financial record.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic handling is appropriate for a standalone deposit-account reference with bounded correlation value.
      Composite statements, mandates, and payment instructions containing the identifier require their dedicated
      SENSITIVE controls.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_deposit_account_ref
      matches:
        - ref: Evidence_deposit_account_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    # Populated label alone is 75 (self-corroboration convention); 85 needs
    # independent context outside the label.
    - confidence_level: 75
      id_match: Pattern_deposit_account_ref
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
  regexes:
    - id: Pattern_deposit_account_ref
      pattern: (?is)\b(?:deposit\s+account|account\s+(?:number|no\.?|#|ref(?:erence)?)|bank\s+account|savings\s+account|cheque\s+account|transaction\s+account)\b(?:\s{0,10}[:#=;])?\s{0,80}\b[A-Z0-9][A-Z0-9\-/]{4,24}\b
  keywords:
    - id: Evidence_deposit_account_specific
      groups:
        - match_style: word
          terms:
            - text: BSB
              case_sensitive: true
            - direct debit
            - bank details
            - financial institution
            - account holder
            - customer account
      strength: specific
references:
  - title: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)"
    url: https://www.legislation.gov.au/C2006A00169/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
created: '2026-02-08'
updated: '2026-10-20'
changelog:
  - version: 2.6.1
    date: '2026-10-20'
    description: 'Removed the 65 discovery_only tier (Pattern_deposit_account_ref + Pattern_au_deposit_account_reference_label_context + no template exclusion). Its conditions were a strict superset of the 75 tier''s (Pattern_deposit_account_ref + no template exclusion), so every 65 pass was also a 75 pass and the tier could never be the top tier. Pattern_au_deposit_account_reference_label_context was referenced only by that tier and is removed (the 2.6.0 entry said it was removed, but this tier still used it). The 85 and 75 tiers are unchanged; 75 is now the lowest tier. Updated operation and confidence_justification, which still described label-context matching.'
  - version: 2.6.0
    date: '2026-10-20'
    description: 'Self-corroboration fix (85 needs independent context, as #80 intended for populated-label IdMatches): Purview counts a supporting match that sits inside the IdMatch span when a word break separates it (dev-tenant run 2026-10-19; ":" and "_" break words, "=" does not), so a single labelled value reached 85 on its own label. Removed the generated 85 tier whose evidence was the detector name split into words (Pattern_au_deposit_account_reference_label_context, Keyword_au_deposit_account_reference_domain_context); those words sit inside the IdMatch label, and the definitions are now unreferenced and removed. Removed from Evidence_deposit_account_specific the terms that match inside the IdMatch label: deposit account, bank account number, account number, savings account, cheque account, transaction account. 85 now needs context outside the label. The existing 75 tier on Pattern_deposit_account_ref now needs no evidence: a populated label alone is 75 (the #80 convention), so the value stays enforcing. Evidence_deposit_account_broad, used only by that tier, is removed.'
  - version: 2.5.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 2.5.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (SOCI Act 2018 (Cth)); added 3 verified legislation/regulator references."
  - version: 2.5.0
    date: '2026-07-17'
    description: 'Reduced-scope alignment fix (TP-00051): allow a bounded optional label delimiter (colon, hash, equals, semicolon) plus existing whitespace/line-break gap between the account label and the value, fixing missed recall on routine ''Account number: 12345678'' fields. The wider redesign (numeric vs structured branch split, prose-word rejection, sentinel filters, per-branch length caps) is deferred - no concrete definitions were approved.'
  - version: 2.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 536 without changing detector or package metadata.'
  - version: 2.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 2.3.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Evidence_template_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 2.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 2.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Mapped non-canonical confidence 90 to 85.
