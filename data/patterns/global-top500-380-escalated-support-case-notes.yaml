schema: testpattern/v1
name: Escalated support case notes
slug: global-top500-380-escalated-support-case-notes
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects escalated support case notes: an escalated case / escalation notes / complaint escalation phrase combined with populated case structure - case or ticket numbers, labelled customer fields, priority/severity values or timestamped note entries. Phrase-only mentions (escalation procedures) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: escalated (support) case/ticket/complaint (notes), escalation notes/summary/log, case escalation (notes), complaint escalation. 65 (discovery only): primary alone. 75: primary plus one populated structure - a case/ticket/incident/complaint/reference number containing a digit, a labelled customer/account/member/caller/client field, or a priority/severity/escalation level/tier value (P1-P4, Sev 1-4, high, urgent, critical, tier 2/3). 85: primary plus two distinct structures (the three above or a timestamped note entry such as '12/09/2026 09:14 - Casey') plus escalation evidence (ombudsman, AFCA, TIO, EDR/IDR, compensation, goodwill credit, vulnerable customer, hardship, threatened legal action, media threat, bereavement). Template/sample and guidance/news framing excluded on every enforce tier.
pattern: (?i)\b(?:escalated\s+(?:support\s+)?(?:cases?|tickets?|complaints?)(?:\s+notes?)?|escalation\s+(?:notes?|summary|log)|case\s+escalation(?:\s+notes?)?|complaint\s+escalation)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated case structure beside the escalation phrase; 'case notes', 'service request' and 'call center' were removed from the primary because they matched generic support text. Escalation procedures and news stay at 65. Medium because internal QA reviews of escalations share the structure.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - ombudsman
    - AFCA
    - TIO
    - EDR
    - IDR
    - compensation
    - goodwill credit
    - vulnerable customer
    - hardship
    - threatened legal action
  proximity: 300
test_cases:
  should_match:
    - value: "Escalated support case notes\nCase ID: CS-20264471\nCustomer: Avery Teston (account 5510 2291)\nPriority: P1\n12/09/2026 09:14 - Casey: customer disclosed financial hardship and a recent bereavement; threatened to lodge with the TIO.\n12/09/2026 11:02 - Jordan: goodwill credit of $120 approved by team leader."
      description: Populated case notes - case ID, customer, priority, note entries and hardship/TIO evidence (85)
      synthetic: true
    - value: "Case escalation\nTicket #: 88120441\nAwaiting team leader review."
      description: Single ticket number (75)
      synthetic: true
  should_not_match:
    - value: "Policy guidance: escalate a case to tier 2 when the customer mentions hardship or the ombudsman, and record escalation notes within 24 hours."
      description: Escalation procedure
      synthetic: true
    - value: "ESCALATION SUMMARY\nCase ID: __________\nCustomer: __________\nPriority: ____"
      description: Blank escalation form - placeholder values
      synthetic: true
    - value: "The bank said complaint escalation times fell to 5 days after the ombudsman's review, a news report said."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Escalation procedures, complaint-handling policies and training.
    mitigation: No populated case structure, and guidance/training framing is excluded.
  - description: IT service-desk escalations about systems rather than customers.
    mitigation: They can reach 75 through ticket numbers; they are usually lower sensitivity, so review in policy.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_escalated_support_case_notes
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_380_escalated_support_case_notes_ticket
            - Regex_global_top500_380_escalated_support_case_notes_customer
            - Regex_global_top500_380_escalated_support_case_notes_priority
            - Regex_global_top500_380_escalated_support_case_notes_note_entry
        - ref: Keyword_global_top500_380_escalated_support_case_notes_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_380_escalated_support_case_notes_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_escalated_support_case_notes
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_380_escalated_support_case_notes_ticket
            - Regex_global_top500_380_escalated_support_case_notes_customer
            - Regex_global_top500_380_escalated_support_case_notes_priority
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_380_escalated_support_case_notes_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_escalated_support_case_notes
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_escalated_support_case_notes
      pattern: (?i)\b(?:escalated\s+(?:support\s+)?(?:cases?|tickets?|complaints?)(?:\s+notes?)?|escalation\s+(?:notes?|summary|log)|case\s+escalation(?:\s+notes?)?|complaint\s+escalation)\b
    - id: Regex_global_top500_380_escalated_support_case_notes_ticket
      pattern: (?i)\b(?:case|ticket|incident|complaint|reference|ref|SR|INC)\s*(?:no\.?|number|ID|#)?[ \t]{0,3}[:#][ \t]{0,3}(?=[A-Z-]{0,8}\d)[A-Z0-9][A-Z0-9-]{3,20}\b
    - id: Regex_global_top500_380_escalated_support_case_notes_customer
      pattern: (?i)\b(?:customer(?:\s+(?:name|no\.?|number|ID))?|account\s*(?:no\.?|number|ID)|member\s*(?:no\.?|number)|caller(?:\s+name)?|client(?:\s+name)?)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
    - id: Regex_global_top500_380_escalated_support_case_notes_priority
      pattern: (?i)\b(?:priority|severity|escalation\s+level|tier)[ \t]{0,3}[:#][ \t]{0,3}(?:P[1-4]\b|sev(?:erity)?[ \t]?[1-4]\b|[1-4]\b|high|urgent|critical|tier[ \t]?[23]\b|level[ \t]?[23]\b)
    - id: Regex_global_top500_380_escalated_support_case_notes_note_entry
      pattern: (?i)\b\d{1,2}/\d{1,2}/\d{2,4}[ \t]{1,3}\d{1,2}:\d{2}(?:[ \t]?[ap]m)?[ \t]{0,3}[-–][ \t]{0,3}[A-Z][a-z]{1,20}
  keywords:
    - id: Keyword_global_top500_380_escalated_support_case_notes_domain_evidence
      groups:
        - match_style: word
          terms:
            - ombudsman
            - text: AFCA
              case_sensitive: true
            - text: TIO
              case_sensitive: true
            - text: EDR
              case_sensitive: true
            - text: IDR
              case_sensitive: true
            - compensation
            - goodwill credit
            - vulnerable customer
            - hardship
            - threatened legal action
            - media threat
            - bereavement
      strength: domain
    - id: Keyword_global_top500_380_escalated_support_case_notes_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - within 24 hours
      strength: noise
risk_description: >-
  This regex recognises escalated support case notes, service requests, call-centre records, and case-note language associated with a difficult customer or technical issue. A genuine case can combine identity and contact details, complaint history, troubleshooting evidence, account activity, internal judgements, system logs, and proposed remedies, enabling impersonation or reputational and service harm. The usual scale is one customer and one escalation, although generic support procedures and blank case templates may match. Risk 8 SENSITIVE Personal-Privacy is justified for the populated file; PROTECTED is not met without live privileged credentials, critical-service compromise, bulk cases, or significant safety consequences. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and Personal-Privacy because a genuine escalation
    file consolidates identity, account, and dispute information with credible misuse potential. PROTECTED is not met
    unless the case exposes active credentials, critical vulnerabilities, or numerous customers at significant scale.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Escalated case notes warrant generic Medium and Medium Personal-Privacy controls because their consolidated
      customer context is more harmful than an ordinary ticket label alone.
