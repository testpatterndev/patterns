schema: testpattern/v1
name: "Five Eyes and National Eyes-Only Releasability Caveat Marking"
slug: fvey-releasability-caveat-marking
version: 1.0.0
type: regex
pattern_class: marking
engine: boost_regex
description: >-
  Detects uppercase Five Eyes (FVEY) coalition releasability and national eyes-only caveat markings used on defence, intelligence, and AUKUS material: REL TO USA, AUS, CAN, GBR, NZL (and REL TO FVEY), AUSTEO (Australian Eyes Only), AGAO (Australian Government Access Only), AUS/USA EYES ONLY, UK EYES ONLY, and CAN/US EYES ONLY.
operation: >-
  Matches case-sensitive ALL-CAPS releasability and eyes-only caveat banners/portion markers. Tier 85 requires a co-occurring classification or protective-marking token (PROTECTED, SECRET, TOP SECRET, OFFICIAL: Sensitive, CUI, RESTRICTED); Tier 75 enforces on unambiguous multi-token banners (REL TO USA, AUS, CAN, GBR, NZL / AUSTEO / AUS/USA EYES ONLY) with defence/security context; Tier 65 provides discovery.
pattern: '(?-i)\b(REL\s+TO\s+USA,\s*(?:AUS,\s*CAN,\s*GBR,\s*NZL|FVEY)|(?://\s*)?(?:AUSTEO|AGAO|AUS/USA\s+EYES\s+ONLY|UK\s+EYES\s+ONLY|CAN/US\s+EYES\s+ONLY|FIVE\s+EYES\s+ONLY))\b'
confidence: high
confidence_justification: >-
  High confidence: matching strictly in ALL-CAPS on canonical CAPCO / PSPF / NZISM / UK / Canadian trigraph releasability strings prevents ordinary prose from firing.
jurisdictions:
  - au
  - nz
  - uk
  - ca
  - us
regulations:
  - "Crimes Act 1914 (Cth)"
  - "Defence Act 1903 (Cth)"
  - "32 CFR 2002"
frameworks:
  - DISP
  - ISO 27001
  - NIST SP 800-171
data_categories:
  - government
  - security-classification
  - defense
corroborative_evidence:
  keywords:
    - "PROTECTED"
    - "SECRET"
    - "TOP SECRET"
    - "OFFICIAL: Sensitive"
    - "REL TO"
    - "AUSTEO"
    - "FVEY"
    - "caveat"
    - "releasability"
  proximity: 300
test_cases:
  should_match:
    - value: "SECRET//REL TO USA, AUS, CAN, GBR, NZL — coalition maritime situational awareness brief"
      description: "Canonical Five Eyes CAPCO/PSPF releasability banner with SECRET classification (85 tier)"
    - value: "PROTECTED // AUSTEO — Defence Strategic Review implementation paper"
      description: "PSPF PROTECTED banner with Australian Eyes Only (AUSTEO) national caveat (85 tier)"
    - value: "OFFICIAL: Sensitive // AUS/USA EYES ONLY — AUKUS Pillar II working group"
      description: "Bilateral AUS/USA EYES ONLY caveat with OFFICIAL: Sensitive marking"
    - value: "REL TO FVEY"
      description: "Short Five Eyes releasability token (65 discovery)"
  should_not_match:
    - value: "The news article discussed five eyes only intelligence sharing arrangements."
      description: "Lowercase prose rejected by case-sensitive ALL-CAPS marking rule"
    - value: "AGAO was mentioned in historical policy commentary without a classification marking."
      description: "Short acronym alone without classification context stays below enforce"
    - value: "Sample template: placeholder example record for training only"
      description: "Template/sample fixture suppressed by shared exclusion dictionary"
false_positives:
  - description: "Security-policy manuals and PSPF/CAPCO marking guides reproducing caveat examples."
    mitigation: "Template and training fixtures are suppressed by template-exclusion; bare AGAO/REL TO FVEY without classification context remain discovery-only."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 9
risk_description: >-
  The detector identifies Five Eyes (FVEY), bilateral (AUS/USA EYES ONLY), and sovereign (AUSTEO, AGAO, UK EYES ONLY) releasability caveats on protectively marked government and defence records. Under PSPF, CAPCO, UK GovS 007, and NZISM, nationality caveats restrict access to cleared citizens of the named nations; unauthorized cross-border, cloud, or AI prompt exposure breaches international security treaties and causes serious alliance or national-security harm. Risk 9 and PROTECTED Government reflect sovereign caveat sensitivity.
sensitivity_labels:
  pspf: "PROTECTED"
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Government
  idcf: DSL-4
  us_gov: "SECRET"
  uk_gov: "SECRET"
  nz_gov: "SECRET"
  ca_gov: "Secret"
classification:
  tier: High
  rationale: >-
    Risk 9 maps to PSPF PROTECTED, QGISCF PROTECTED, PROTECTED Government, and High because AUSTEO, AUS/USA EYES ONLY, and REL TO USA, AUS, CAN, GBR, NZL caveats govern sovereign and Five Eyes defence/intelligence material whose mishandling damages international security obligations.
  generic:
    classification: High
    dlm: High Government
    rationale: >-
      High Government handling applies to sovereign and Five Eyes releasability caveats restricting foreign-national access.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match:
        type: any
        ids:
          - Regex_fvey_caveat_full
          - Regex_fvey_caveat_short
      matches:
        - ref: Keyword_fvey_classification_banner
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_fvey_caveat_full
      matches:
        - type: any
          min_matches: 1
          refs:
            - Keyword_fvey_classification_banner
            - Keyword_fvey_defence_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Regex_fvey_caveat_full
          - Regex_fvey_caveat_short
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_fvey_caveat_full
      pattern: '(?-i)\b(REL\s+TO\s+USA,\s*AUS,\s*CAN,\s*GBR,\s*NZL|AUSTEO|AUS/USA\s+EYES\s+ONLY|UK\s+EYES\s+ONLY|CAN/US\s+EYES\s+ONLY)\b'
    - id: Regex_fvey_caveat_short
      pattern: '(?-i)\b(REL\s+TO\s+FVEY|AGAO|FIVE\s+EYES\s+ONLY)\b'
  keywords:
    - id: Keyword_fvey_classification_banner
      groups:
        - match_style: word
          terms:
            - text: "PROTECTED"
              case_sensitive: true
            - text: "SECRET"
              case_sensitive: true
            - text: "TOP SECRET"
              case_sensitive: true
            - "OFFICIAL: Sensitive"
            - "OFFICIAL-SENSITIVE"
            - text: "CUI"
              case_sensitive: true
            - text: "RESTRICTED"
              case_sensitive: true
      strength: specific
    - id: Keyword_fvey_defence_context
      groups:
        - match_style: word
          terms:
            - "AUKUS"
            - "releasable to"
            - "eyes only"
            - "dissemination control"
            - "foreign nationals"
            - "cleared personnel"
            - "PSPF"
            - "DISP"
      strength: domain
references:
  - url: https://www.protectivesecurity.gov.au/information-management/information-security-marking
    title: "Australian Government PSPF - Information Security Markings and Caveats (AUSTEO, AGAO, REL TO)"
  - url: https://www.dni.gov/files/NCSC/documents/supplychain/CAPCO-Register-and-Manual.pdf
    title: "ODNI Controlled Access Program Coordination Office (CAPCO) Register - REL TO / FVEY Markings"
created: '2026-11-25'
updated: '2026-11-25'
changelog:
  - version: 1.0.0
    date: '2026-11-25'
    description: Initial release.
