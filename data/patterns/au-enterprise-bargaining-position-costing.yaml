schema: testpattern/v1
name: Enterprise Bargaining Position, Wage Offer Costing and Claims Matrix
slug: au-enterprise-bargaining-position-costing
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Confidential employer-side enterprise bargaining material produced before an agreement is made: bargaining position papers, wage offer costings, costed claims matrices (management response to a union or employee log of claims) and negotiation strategy briefs that record the approved mandate, fallback positions and trade-offs. Bargaining is conducted under Fair Work Act 2009 (Cth) Part 2-4 (s 172 making an enterprise agreement, s 173 notice of employee representational rights, s 228 good faith bargaining requirements, s 229 bargaining orders) and, for the Queensland public sector and local government, Industrial Relations Act 2016 (Qld) chapter 4 collective bargaining (s 169 notice of intention to bargain, s 173 parties must negotiate in good faith). Published enterprise agreements, Fair Work Commission approval decisions, union newsletters and news reports are decoys; au-enterprise-agreement-document covers agreement text.
operation: >-
  Primary: a bargaining position or costing phrase (bargaining position / strategy / parameters / brief / costing / offer / proposal / objectives / claims matrix; employer, management, agency, department, council or company bargaining or negotiating position or offer; claims matrix or claims costing; union, employee or bargaining claims log; log of claims costing; EA, EBA, EBn or enterprise agreement costing / bargaining position / wage offer / offer costing; cost of the union, employee or bargaining claims; wage offer costing). 75 tier requires, within 300 characters, one populated costing structure: an offer rate (Year 1-5 with a percentage, a percentage per annum / p.a. / per year / compounding / from 1 July, or a wage, pay or salary increase, offer or rise with a percentage) or a cost impact (cost of claim / offer / proposal / clause / increase, annual / total / full-year / recurrent / cumulative / incremental / additional / net cost, $ impact, cost impact, budget impact or on-costs followed by a dollar amount; a number of FTE; or an FTE count field). 85 tier additionally requires a mandate or negotiation-strategy marker (approved, endorsed, government, Cabinet, Board or wages policy mandate; mandate ceiling / limit / approved / parameters; within or outside the mandate; fallback or walk-away position; opening offer or position; bottom line; trade-off; concessions available or to trade; negotiation or negotiating strategy; not to be disclosed, shared or tabled to the union, bargaining representatives or employees). All enforce tiers AND NOT the shared template-exclusion dictionary and a published-material exclusion (nominal expiry date, This Agreement will / shall, approved by the Fair Work Commission, FWCA, Deputy President, join your union, join the union, Authorised by, told reporters, said in a statement). 65 is discovery-only (primary phrase alone) and will surface union bargaining updates, HR explainers and news.
pattern: >-
  (?i)\b(?:(?:enterprise\s+)?bargaining\s+(?:positions?|strateg(?:y|ies)|parameters|briefs?|costings?|offers?|proposals?|objectives|claims?\s+matrix)|(?:employer|management|agency|department|council|company)(?:'s)?\s+(?:bargaining|negotiating)\s+(?:positions?|offers?)|claims?\s+(?:matrix|costings?)|(?:union|employee|bargaining)\s+claims?\s+log|log\s+of\s+claims\s+costings?|(?:EA|EBA|EB\d{1,2}|enterprise\s+agreement)\s+(?:costings?|bargaining\s+position|wage\s+offer|offer\s+costing)|cost(?:ing)?\s+of\s+(?:the\s+)?(?:union|employee|bargaining)\s+claims?|wage\s+offer\s+costings?)\b
confidence: medium
confidence_justification: >-
  Medium: "bargaining position", "claims matrix" and costing wording are the ordinary vocabulary of employer bargaining files, but union bargaining updates, FWC decisions and news reports quote the employer's position and offer percentage too, so enforce tiers need a populated costing structure and exclude published-material and news wording, and 85 needs a mandate or strategy marker that only the employer's internal papers carry. Mandate and costing layouts are organisation-defined, so the structures are generic labelled shapes. Genuine internal papers that quote an FWC decision number (FWCA) or the nominal expiry date of the current agreement within the window are suppressed, which is an accepted false negative. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Fair Work Act 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Right to Information Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - business
  - employment
  - financial
corroborative_evidence:
  keywords:
    - bargaining position
    - wage offer
    - claims matrix
    - log of claims
    - cost of claim
    - mandate
    - fallback position
    - FTE
  proximity: 300
test_cases:
  should_match:
    - value: "EB10 bargaining position - IN CONFIDENCE\nWage offer: Year 1 3.0%, Year 2 3.0%, Year 3 2.5%\nCost of offer (full-year): $4.8m across 612 FTE\nApproved mandate ceiling is 3.25% per annum; fallback position is a one-off $1,000 sign-on payment. Not to be disclosed to the union bargaining representatives."
      description: Bargaining position with yearly offer rates, costing, FTE and the approved mandate and fallback (85 tier)
      synthetic: true
    - value: "Union claims matrix - management response\nClaim 14: reduce the 38-hour week to 36 hours. Cost of claim: $2,150,000 per year (about 5.3% of base salaries).\nRecommended response: reject; trade-off available against the rostering flexibility clause."
      description: Costed claims matrix row with a recommended trade-off (85 tier)
      synthetic: true
    - value: "Bargaining costings - draft for HR Director\nOption B: 3.5% per annum over three years\nIncremental cost: $1.2m in 2026-27, $2.5m in 2027-28"
      description: Costing options with an offer rate and incremental cost, no mandate marker (75 tier)
      synthetic: true
    - value: "Council bargaining position on the union log of claims: 214.5 FTE covered by the outdoor workforce stream; allowances to be rolled into base rates."
      description: Bargaining position with an FTE count only (75 tier)
      synthetic: true
  should_not_match:
    - value: "Southbank Water Enterprise Agreement 2025\n5. Wages\n5.1 Employees will receive the following wage increases: 3.5% from the first full pay period on or after 1 July 2025.\nThis Agreement will operate seven days after approval by the Fair Work Commission. The nominal expiry date is 30 June 2028."
      description: Published enterprise agreement wage clause
    - value: "DECISION\nFair Work Act 2009\ns.185 - Enterprise agreement\n[2026] FWCA 4127\nDEPUTY PRESIDENT TESTON\nThe employer's bargaining position was explained to employees during the access period; the Agreement provides wage increases of 3% per annum and covers about 420 FTE."
      description: FWC approval decision quoting the bargaining position and increase (excluded)
    - value: "BARGAINING UPDATE\nMembers, management's bargaining position is still 2.5% per year for three years - that is a real wage cut. Our log of claims asks for 5% per annum. Come to the members' meeting on Thursday and join your union. Authorised by T. Teston, Branch Secretary."
      description: Union newsletter quoting the employer offer (excluded)
    - value: "The council's bargaining position of 3 per cent a year for three years was rejected by staff, a union spokesperson told reporters on Monday."
      description: News report of an offer (excluded)
    - value: "Bargaining position paper - blank template\nWage offer: Year 1 ___%, Year 2 ___%\nCost of offer: $________\nMandate ceiling: ______"
      description: Blank position paper (65 only)
false_positives:
  - description: Published enterprise agreements and FWC approval decisions that state wage increases and coverage.
    mitigation: Agreement text rarely carries the primary phrases; decisions and agreements are excluded on nominal expiry date, This Agreement will/shall, FWCA, Deputy President and approval-by-FWC wording. Agreement text itself is covered by au-enterprise-agreement-document.
  - description: Union bargaining updates and member newsletters that quote the employer's offer and the log of claims.
    mitigation: Excluded on join your union / join the union / Authorised by wording; these seldom carry costing tables or mandate markers.
  - description: News reports about bargaining disputes.
    mitigation: Excluded on told reporters and said in a statement; 85 also needs a mandate or strategy marker.
  - description: Internal papers about commercial negotiations (supplier price offers) with percentages and dollar costs.
    mitigation: The primary requires bargaining, claims-log or EA wording; commercial negotiation mandates are covered by settlement-authority-and-negotiation-mandate and procurement classifiers.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_eb_position_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_eb_offer_rate
            - Regex_au_eb_cost_impact
        - ref: Regex_au_eb_strategy_marker
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_eb_published_exclusion
    - confidence_level: 75
      id_match: Regex_au_eb_position_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_eb_offer_rate
            - Regex_au_eb_cost_impact
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_eb_published_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_eb_position_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_eb_position_primary
      pattern: >-
        (?i)\b(?:(?:enterprise\s+)?bargaining\s+(?:positions?|strateg(?:y|ies)|parameters|briefs?|costings?|offers?|proposals?|objectives|claims?\s+matrix)|(?:employer|management|agency|department|council|company)(?:'s)?\s+(?:bargaining|negotiating)\s+(?:positions?|offers?)|claims?\s+(?:matrix|costings?)|(?:union|employee|bargaining)\s+claims?\s+log|log\s+of\s+claims\s+costings?|(?:EA|EBA|EB\d{1,2}|enterprise\s+agreement)\s+(?:costings?|bargaining\s+position|wage\s+offer|offer\s+costing)|cost(?:ing)?\s+of\s+(?:the\s+)?(?:union|employee|bargaining)\s+claims?|wage\s+offer\s+costings?)\b
    - id: Regex_au_eb_offer_rate
      pattern: >-
        (?i)(?:\b(?:year|yr|Y)\s?[1-5]\b\s*(?:[:=(-]\s*)?\d{1,2}(?:\.\d{1,2})?\s?(?:%|per\s+cent\b)|\b\d{1,2}(?:\.\d{1,2})?\s?(?:%|per\s+cent)\s*(?:per\s+annum|p\.\s?a\.|pa\b|per\s+year|a\s+year|each\s+year|compound(?:ed|ing)?|in\s+(?:each\s+)?year|from\s+(?:1\s+)?(?:Jul|July|Jan|January|the\s+first\s+full\s+pay\s+period))|\b(?:wage|pay|salary|remuneration)\s+(?:increases?|offer|rises?|movements?)\s*[:=-]\s*\d{1,2}(?:\.\d{1,2})?\s?(?:%|per\s+cent\b))
    - id: Regex_au_eb_cost_impact
      pattern: >-
        (?i)(?:(?:\bcost\s+of\s+(?:the\s+)?(?:claims?|offer|proposal|clause|increase)|\b(?:annual|total|full[\s-]year|recurrent|ongoing|cumulative|incremental|additional|net)\s+cost|\$\s?impact|\bdollar\s+impact|\bcost\s+impact|\bbudget\s+impact|\bon-?costs?)\s*(?:\((?:full[\s-]year|annual|\$\s?m|\$\s?'?000|\$\s?k)\)\s*)?[:=-]?\s*\(?-?\$\s?\d|\b\d{1,5}(?:\.\d{1,2})?\s?FTEs?\b|\bFTEs?\s*(?:affected|covered|impacted|in\s+scope)?\s*[:=]\s*\d)
    - id: Regex_au_eb_strategy_marker
      pattern: >-
        (?i)\b(?:(?:approved|endorsed|government|cabinet|board|wages\s+policy)\s+mandate|mandate\s+(?:ceiling|limit|approved|endorsed|parameters|of\s+up\s+to)|(?:within|outside|exceeds?|beyond)\s+(?:the\s+)?(?:approved\s+)?mandate|fall-?back\s+(?:position|offer)|walk-?away\s+(?:position|point)|opening\s+(?:offer|position)|bottom\s+line|trade-?offs?|concessions?\s+(?:available|to\s+(?:offer|trade)|in\s+reserve)|negotiation\s+strategy|negotiating\s+(?:strategy|tactics)|(?:do\s+not|not\s+to\s+be)\s+(?:disclose[ds]?|shared?|tabled?|released?)\s+(?:to|with)\s+(?:the\s+)?(?:unions?|bargaining\s+representatives?|employees|staff))\b
  keywords:
    - id: Keyword_au_eb_published_exclusion
      groups:
        - match_style: word
          terms:
            - nominal expiry date
            - This Agreement will
            - This Agreement shall
            - approved by the Fair Work Commission
            - approval by the Fair Work Commission
            - text: FWCA
              case_sensitive: true
            - Deputy President
            - join your union
            - join the union
            - Authorised by
            - told reporters
            - said in a statement
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies an employer's confidential bargaining position, wage offer costing or costed claims matrix, and at 85 the approved mandate, fallback position or trade-offs behind it. Disclosure to the other bargaining parties before agreement tells them the employer's ceiling and concessions, removes bargaining leverage, can breach Cabinet or budget confidentiality for public sector mandates, and damages good faith bargaining and industrial relations. Published agreements, FWC decisions, union updates and news are excluded. Risk 8 supports OFFICIAL: Sensitive / SENSITIVE Commercial-in-Confidence.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Commercial-in-Confidence
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Fair Work Act 2009 (Cth) - Part 2-4 Enterprise agreements (s 172 making an enterprise agreement, s 173 notice of employee representational rights, s 228 good faith bargaining requirements, s 229 applications for bargaining orders)
    url: https://www.legislation.gov.au/C2009A00028/latest/text
  - title: Industrial Relations Act 2016 (Qld) - chapter 4 Collective bargaining (s 169 notice of intention to bargain, s 173 parties must negotiate in good faith)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2016-063
