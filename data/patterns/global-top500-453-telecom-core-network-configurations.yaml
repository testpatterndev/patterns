schema: testpattern/v1
name: Telecom core network configurations
slug: global-top500-453-telecom-core-network-configurations
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects telecom core network configurations: mobile/IMS/EPC/5GC configuration wording with populated PLMN, APN, Diameter realm/peer, point-code and peer-address values, 3GPP realm FQDNs and core node names. Topic wording alone is discovery-only.
operation: >-
  Regex_telco_core_primary (mobile/packet/IMS core configuration, core network configuration, EPC/5GC element configuration, peering or interconnect configuration wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated network identifier (PLMN, MCC/MNC, TAC, APN/DNN, Diameter realm/host/peer, point code, global title, S-NSSAI, peer address) or a core artefact (3GPP realm FQDN such as epc.mncXXX.mccYYY.3gppnetwork.org, core node name like amf-prd-02, IPv4). 85 requires a populated network identifier (PLMN, MCC/MNC, TAC, APN/DNN, Diameter realm/host/peer, point code, global title, S-NSSAI, peer address) (two distinct hits), a core artefact (3GPP realm FQDN such as epc.mncXXX.mccYYY.3gppnetwork.org, core node name like amf-prd-02, IPv4), and independent core-interface (N2/N3, S1-MME, S6a, Gx, SCTP, GTP-U, roaming, slicing) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_telco_core_guidance_exclusion).
pattern: >-
  (?i)\b(?:(?:mobile|telecom|packet|5G|4G|LTE|IMS|voice)\s+core\s+(?:network\s+)?(?:configuration|config|design|parameters?)|core\s+network\s+configuration|(?:EPC|5GC|HSS|UDM|MME|AMF|SMF|UPF|PGW|SGW|DRA|STP)\s+(?:configuration|config|parameters|dataset|export)|peering\s+configuration|interconnect\s+(?:configuration|parameters))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated network identifier (PLMN, MCC/MNC, TAC, APN/DNN, Diameter realm/host/peer, point code, global title, S-NSSAI, peer address) or a core artefact (3GPP realm FQDN such as epc.mncXXX.mccYYY.3gppnetwork.org, core node name like amf-prd-02, IPv4)), and 85 needs two distinct structures plus independent core-interface (N2/N3, S1-MME, S6a, Gx, SCTP, GTP-U, roaming, slicing) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
  - global
regulations:
  - Security of Critical Infrastructure Act 2018 (Cth)
  - Telecommunications Act 1997 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
data_categories:
  - security
corroborative_evidence:
  keywords:
    - N2
    - N3
    - S1-MME
    - S6a
    - Gx
    - SCTP
    - GTP-U
    - roaming partner
    - interconnect
    - network slice
  proximity: 300
  keyword_lists:
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: The mobile core configuration will be migrated to the new data centre.
      description: Discovery probe (65)
      synthetic: true
    - value: |-
        5GC configuration - production
        PLMN ID: 505-01
        DNN: enterprise.harbour
      description: Medium-tier probe (75) - populated network identifiers
      synthetic: true
    - value: |-
        Mobile core configuration - production EPC
        PLMN ID: 505-01
        APN: enterprise.harbour
        Diameter realm: epc.mnc001.mcc505.3gppnetwork.org
        Peer address: 10.44.2.8 (hss-prd-01)
        S6a over SCTP to the HSS; roaming partner interconnect via DRA dra-syd-01.
      description: High-tier probe (85) - several identifiers, realm/node/IP artefacts and interface context
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match
    - value: 'Policy statement: core network configuration changes require security review under the carrier licence.'
      description: Policy text
      synthetic: true
    - value: |-
        Core network configuration template
        PLMN ID: ________
        APN: [insert]
      description: Blank template
      synthetic: true
    - value: 'Course module 5: a 5G core uses PLMN ID: 001-01 and the realm epc.mnc001.mcc001.3gppnetwork.org.'
      description: Training framing
      synthetic: true
    - value: telecom ims
      description: Generic word pair
false_positives:
  - description: 3GPP specifications and vendor training describe identifiers and interfaces.
    mitigation: Guidance/training framing is excluded; 85 needs two populated identifiers plus a core artefact and interface context.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_telco_core_primary
      matches:
        - ref: Regex_telco_core_network_identifier
          min_count: 2
          unique_results: true
        - ref: Regex_telco_core_core_artefact
        - ref: Keyword_telco_core_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_telco_core_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_telco_core_primary
      matches:
        - type: any
          refs:
            - Regex_telco_core_network_identifier
            - Regex_telco_core_core_artefact
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_telco_core_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_telco_core_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_telco_core_primary
      pattern: >-
        (?i)\b(?:(?:mobile|telecom|packet|5G|4G|LTE|IMS|voice)\s+core\s+(?:network\s+)?(?:configuration|config|design|parameters?)|core\s+network\s+configuration|(?:EPC|5GC|HSS|UDM|MME|AMF|SMF|UPF|PGW|SGW|DRA|STP)\s+(?:configuration|config|parameters|dataset|export)|peering\s+configuration|interconnect\s+(?:configuration|parameters))\b
    - id: Regex_telco_core_network_identifier
      pattern: >-
        (?i)\b(?:PLMN(?:\s+ID)?|MCC|MNC|TAC|APN|DNN|Diameter\s+(?:realm|host|peer)|origin[\s-](?:realm|host)|point\s+code|OPC|DPC|global\s+title|S-NSSAI|realm|peer\s+address|SCTP\s+endpoint)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
    - id: Regex_telco_core_core_artefact
      pattern: >-
        (?i)\b(?:epc|ims|5gc)\.mnc\d{3}\.mcc\d{3}\.3gppnetwork\.org\b|\b(?:amf|smf|upf|mme|sgw|pgw|hss|udm|pcrf|pcf|dra)[-_][a-z0-9-]{1,30}\b|\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b
  keywords:
    - id: Keyword_telco_core_context
      groups:
        - match_style: word
          terms:
            - text: N2
              case_sensitive: true
            - text: N3
              case_sensitive: true
            - S1-MME
            - S6a
            - Gx
            - text: SCTP
              case_sensitive: true
            - text: GTP-U
              case_sensitive: true
            - roaming partner
            - interconnect
            - network slice
      strength: specific
    - id: Keyword_telco_core_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - guidance note
            - best practice guide
            - media release
            - press release
            - news report
            - course module
            - learning objectives
            - awareness course
            - webinar
            - lesson plan
            - quiz question
      strength: domain
risk_description: >-
  The detector now requires core-network configuration wording plus populated network identifiers or core artefacts (3GPP realms, node names, peer IPs) before enforcing. A genuine record can expose trust relationships, routing paths, signaling components, and concentration points that support interception, outage planning, or targeted compromise. The ordinary scope is one carrier core or network segment and its subscribers and operators, while standards, architecture papers, and vendor documentation can match the same terms. For the global catalogue analogue, the confirmed substantive record is the consequence unit. Current routing, switching, trust and subscriber-control configuration can enable intrusion, interception or national communications disruption. Significant service and security damage is inherent. Risk 10 and PROTECTED InfoTech therefore apply to the confirmed record itself. Require carrier/core identity plus live routing, switching, profile or trust configuration; architecture brochures remain excluded. This is confidence and exception handling, not a reason to reduce the consequence of a true positive.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED InfoTech
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Confidential
created: '2026-02-08'
updated: '2026-09-24'
changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): primary narrowed to core/element configuration wording (subscriber routing, backbone network, IMS platform removed); keyword self-corroboration and phrase-only paths replaced with a populated network-identifier regex and a core-artefact regex (3GPP realm FQDN, node names, IPs); 75 needs either; 85 needs two identifiers, an artefact and core-interface context; guidance exclusion; populated tests and decoys; GDPR replaced with SOCI Act and Telecommunications Act 1997 (Cth); ISO 27001/NIST CSF frameworks and Telecommunications Act/ISM references added.'
  - version: 1.3.0
    date: '2026-07-04'
    description: 'CI profile hardening: make carrier-core topics discovery-only; require routing, subscriber, peering, or service configuration at 75 and a live network or node identifier at 85; add standards and training exclusions with exact tier tests.'
  - version: 1.2.2
    date: '2026-07-15'
    description: 'v25 authoritative risk alignment from Compl8DLPDeploy workbook row 1993; detector and package metadata unchanged.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1993 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
