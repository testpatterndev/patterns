schema: testpattern/v1
name: Antitrust legal analyses
slug: global-top500-169-antitrust-legal-analyses
version: 1.3.2
type: regex
pattern_class: concept
engine: boost_regex
description: 'Identifies antitrust / competition-law legal analyses prepared as memos or advice: competition-law topic phrases inside a populated legal document header, with competition-specific analysis evidence at the high tier. These are commercially and legally sensitive analyses; the category is not personally identifiable information.'
operation: 'Primary: antitrust analysis, competition law, market dominance, price fixing, merger clearance, market concentration, restraint of trade, competition review. 65 (discovery only) = primary alone. 75 = primary plus two distinct populated document header fields (To, From, Date, Subject, Re, Our ref, File/Matter number, Prepared/Approved/Cleared by, Author, Version, Status, Classification). 85 = primary plus three distinct header fields plus competition-analysis evidence the primary does not match (cartel, anti-competitive, misuse of market power, substantial lessening of competition, market definition, market share, exclusive dealing, ACCC, merger authorisation, privileged). All tiers exclude template/fixture text.'
pattern: (?is)\b(?:antitrust\s+legal\s+analyses|antitrust\s+analysis|competition\s+law|market\s+dominance|price\s+fixing|merger\s+clearance|market\s+concentration|restraint\s+of\s+trade|competition\s+review)\b
confidence: medium
confidence_justification: 'Medium: competition-law phrases are common in training, news and published decisions, so enforcement requires a populated legal document header; 85 adds competition-analysis evidence.'
jurisdictions:
- global
regulations:
  - Competition and Consumer Act 2010 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - legal
  - business
corroborative_evidence:
  keywords:
  - antitrust legal analyses
  - antitrust
  - legal
  - analyses
  - corporate
  - governance
  proximity: 300
test_cases:
  should_match:
    - value: |-
        PRIVILEGED & CONFIDENTIAL - antitrust analysis
        To: General Counsel
        From: Competition Partner, Harbour Legal
        Date: 12/08/2026
        Re: Proposed acquisition of Coastline Freight
        Our combined share under the narrow market definition exceeds 42% and the ACCC is likely to find a substantial lessening of competition.
      description: 85 - legal memo header with competition-analysis evidence
      synthetic: true
    - value: |-
        Competition law review - distributor rebate proposal
        Prepared by: Legal Services
        Date: 03/06/2026
        The rebate proposal should be revised before launch.
      description: 75 - two populated header fields without competition-analysis evidence
      synthetic: true
    - value: Antitrust analysis notes on regional freight pricing.
      description: 65 discovery - topic phrase without a document header
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: board policy
      description: Generic word pair should not match
    - value: 'Competition law compliance training: staff must never discuss prices with competitors; price fixing is a criminal cartel offence.'
      description: Training/guidance - no populated document header (65 at most)
    - value: |-
        Antitrust analysis memo
        To: ________
        From: ________
        Date: ________
        Re: [matter name]
      description: Blank memo template - placeholder header fields are rejected
    - value: The regulator's competition review found market concentration in groceries had increased, the report released on Monday said.
      description: News item - no populated document header
false_positives:
- description: Common words and phrases related to antitrust legal analyses appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_antitrust_legal_analyses
      matches:
        - ref: Regex_global_top500_169_antitrust_legal_analyses_record_structure
          min_count: 3
          unique_results: true
        - ref: Keyword_antitrust_analysis_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_antitrust_legal_analyses
      matches:
        - ref: Regex_global_top500_169_antitrust_legal_analyses_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_antitrust_legal_analyses
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_antitrust_legal_analyses
      pattern: (?is)\b(?:antitrust\s+legal\s+analyses|antitrust\s+analysis|competition\s+law|market\s+dominance|price\s+fixing|merger\s+clearance|market\s+concentration|restraint\s+of\s+trade|competition\s+review)\b
    - id: Regex_global_top500_169_antitrust_legal_analyses_record_structure
      pattern: (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+(?:by|for)|Approved\s+by|Cleared\s+by|Author|Version|Status|Classification|Contact\s+officer|Meeting\s+date|Agenda\s+item)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<)[A-Za-z0-9$]
  keywords:
    - id: Keyword_antitrust_analysis_evidence
      groups:
        - match_style: word
          terms:
            - cartel
            - anti-competitive
            - monopoly
            - misuse of market power
            - substantial lessening of competition
            - market definition
            - market share
            - exclusive dealing
            - text: ACCC
              case_sensitive: true
            - merger authorisation
            - legal professional privilege
            - privileged
      strength: specific
risk_description: The detector flags antitrust analysis, competition law, market dominance, price fixing, merger clearance,
  concentration, restraints, and competition review rather than confirming confidential legal advice. A substantive analysis
  can reveal the organization's legal concerns, market-definition arguments, transaction vulnerabilities, and planned responses
  to a regulator or counterparty. The ordinary affected unit is one market, transaction, or investigation and its companies,
  while published decisions, academic material, and compliance training are credible false-positive contexts. Risk 8 and SENSITIVE
  Legal reflect serious contained regulatory and litigation harm; PROTECTED would require systemic market consequences, protected
  government deliberation, or other significant national damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 is consistent with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Legal, and Medium because
    confidential competition analysis can materially prejudice a transaction, defence, or regulatory strategy. PROTECTED
    is not met for a normal company or deal analysis without systemic market impact, protected policy content, or
    significant national damage.
  generic:
    classification: Medium
    dlm: Medium Legal
    rationale: >-
      Medium and Medium Legal handling fit nonpublic competition-law analysis for a bounded transaction or market. High
      is reserved for exceptional systemic or protected-government matters.
