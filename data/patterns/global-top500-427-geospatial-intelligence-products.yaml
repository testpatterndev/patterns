schema: testpattern/v1
name: Geospatial intelligence products
slug: global-top500-427-geospatial-intelligence-products
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to geospatial intelligence products in international contexts. This
  information type is classified as personally identifiable information under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 1 keywords within 240 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(geospatial\s+intelligence|imagery\s+intelligence|satellite\s+imagery|terrain\s+analysis|geospatial\s+data|mapping\s+product|overhead\s+imagery|image\s+exploitation|geodetic\s+survey|remote\s+sensing)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
  - GDPR
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
  - geospatial intelligence products
  proximity: 240
test_cases:
  should_match:
  - value: geospatial intelligence
    description: Primary topic phrase match
  - value: imagery intelligence
    description: Case-insensitive topic phrase match
  - value: satellite imagery
    description: Alternative topic phrase match
  - value: terrain analysis
    description: Additional topic phrase match
  - value: |-
      Geospatial intelligence
      To: Executive Committee
      From: Chief Risk Officer
    description: Populated document header with 2 fields (75 tier)
    synthetic: true
  - value: |-
      Geospatial intelligence
      To: Executive Committee
      From: Chief Risk Officer
      Date: 14 August 2026
    description: Populated document header with 3 distinct fields (85 tier)
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: classified contingency
    description: Generic word pair from old broad template should not match
  - value: Geospatial intelligence products
    description: "Bare detector name: it reached 85 through the generated name-word tier and must not reach an enforcing tier"
  - value: |-
      Geospatial intelligence:
      To:
      From:
      Date:
      Subject:
    description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
  - value: "Policy guidance: this procedure explains how records about geospatial intelligence are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Common words and phrases related to geospatial intelligence products appearing in policy documents, training
    materials, HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 240
  recommended_confidence: 85
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_geospatial_intelligence_products
    matches:
      - ref: Regex_global_top500_427_geospatial_intelligence_products_record_structure
        min_count: 3
        unique_results: true
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 75
    id_match: Regex_geospatial_intelligence_products
    matches:
      - ref: Regex_global_top500_427_geospatial_intelligence_products_record_structure
        min_count: 2
        unique_results: true
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_geospatial_intelligence_products
    matches:
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  regexes:
  - id: Regex_geospatial_intelligence_products
    pattern: (?is)\b(geospatial\s+intelligence|imagery\s+intelligence|satellite\s+imagery|terrain\s+analysis|geospatial\s+data|mapping\s+product|overhead\s+imagery|image\s+exploitation|geodetic\s+survey|remote\s+sensing)\b
  - id: Regex_global_top500_427_geospatial_intelligence_products_record_structure
    pattern: (?i)\b((?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item|MGRS|grid\s+ref(?:erence)?|product\s*(?:ID|no\.?|number))\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$])
risk_description: This regex recognises geospatial intelligence, imagery intelligence, satellite imagery, and terrain-analysis
  products with nearby domain context. A real product can reveal collection focus, assessed locations, terrain constraints,
  and derived observations, helping an adversary evade monitoring or understand planned government attention. Ordinary commercial
  imagery or a bounded analytical product may cause serious operational harm without necessarily disclosing unique collection
  capabilities or a protected target. Risk 8 remains SENSITIVE Government; PROTECTED would require sensitive sources and methods,
  current high-value targeting, or compromise capable of significant mission damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  idcf: DSL-3
  us_gov: Secret
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Secret
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Government because a geospatial
    intelligence product can expose official collection focus and operational assessments. PROTECTED is not met without
    sensitive capabilities, current high-value targets, or significant damage from disclosure.
  generic:
    classification: Medium
    dlm: Medium Government
    rationale: >-
      Geospatial intelligence products are generically Medium with Medium Government handling when analysis reveals
      official interest and terrain judgments but not protected collection capabilities.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-30'
changelog:
- version: 1.4.0
  date: '2026-10-30'
  description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
- version: 1.3.0
  date: '2026-10-20'
  description: 'Generated name-word tier removed: the 85 and 75 tiers ANDed Pattern_*_label_context (the detector name, "Geospatial intelligence products") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 85. Both lists sit inside the IdMatch phrase, so the bare name alone scored 85. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs 2 populated document header fields (Regex_global_top500_427_geospatial_intelligence_products_record_structure); 85 needs 3 distinct fields. Curated terms that sit inside an IdMatch hit were removed. GEOINT and IMINT are acronyms of the IdMatch phrases and are dropped. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
- version: 1.2.5
  date: '2026-09-25'
  description: >-
    Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
    reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
- version: 1.2.3
  date: '2026-09-24'
  description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1971 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical
    tier.
