schema: testpattern/v1
name: Bug bounty submissions
slug: global-top500-254-bug-bounty-submissions
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies bug bounty and vulnerability disclosure programme (VDP) submissions - HackerOne, Bugcrowd, Intigriti, YesWeHack reports and researcher submissions - with report IDs, reproduction steps, affected endpoints and triage/bounty fields. General vulnerability reports are covered by global-vulnerability-assessment-report.
operation: >-
  Regex_bug_bounty_submissions (bug bounty submission/report/triage/payout/award, HackerOne/Bugcrowd/Intigriti/YesWeHack report/submission/triage, vulnerability/responsible disclosure submission/report, VDP submission/report, security researcher submission/report, bounty submission/payout/award) is discovery-only at 65. 75 requires one structure: a report/submission/ticket number, numbered steps to reproduce, a tested endpoint, or a triage/severity/bounty-amount field. 85 requires two distinct structures plus a reported weakness class or proof of concept. Enforcing tiers reject template/fixture wording (shared template-exclusion dictionary) and guidance, policy, training and news framing.
pattern: (?i)\b(?:bug\s+bounty\s+(?:submission|report|triage|payout|award)s?|(?:HackerOne|Bugcrowd|Intigriti|YesWeHack)\s+(?:report|submission|triage)s?|(?:vulnerability|responsible)\s+disclosure\s+(?:submission|report)s?|VDP\s+(?:submission|report)s?|security\s+researcher\s+(?:submission|report)s?|bounty\s+(?:submission|payout|award)s?)\b
confidence: medium
confidence_justification: >-
  Medium confidence: programme wording is discovery-only; enforcement requires report IDs, reproduction steps, endpoints or triage fields, and 85 adds a second structure and a weakness class.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - ISO 27001
  - NIST CSF
data_categories:
  - security
  - technology
corroborative_evidence:
  keywords:
    - IDOR
    - SSRF
    - account takeover
    - proof of concept
    - SQL injection
  proximity: 300
test_cases:
  should_match:
    - value: |-
        HackerOne report #2291047 - IDOR on invoice download (Harbourside Council VDP)
        Severity: high   Triage status: triaged
        Steps to reproduce:
        1. Sign in as ratepayer account A on https://portal.example.internal/account
        2. Request GET /api/invoices/88412/pdf with account A's session
        3. Observe invoice 88412 belongs to account B
        Impact: any ratepayer can download another ratepayer's invoice.
      description: High tier (85) - report number, triage fields, reproduction steps and endpoints with an IDOR weakness
      synthetic: true
    - value: 'Bug bounty submission from an external researcher, report #55120 - closed as a duplicate of an earlier finding.'
      description: Medium tier (75) - report number only
      synthetic: true
    - value: 'Bugcrowd submission for the parking app - Bounty amount: $750 approved by the programme owner.'
      description: Medium tier (75) - bounty amount only
      synthetic: true
    - value: Finance approved the bug bounty payout budget for next financial year.
      description: Discovery tier (65) - programme wording only
      synthetic: true
  should_not_match:
    - value: The vulnerability report was sent to the vendor.
      description: General vulnerability report wording is no longer a primary
    - value: Our security researcher presented at the conference.
      description: Researcher mention without a submission
    - value: 'Vulnerability disclosure policy statement: researchers should use our VDP submission form and must not access customer data.'
      description: Policy text
    - value: |-
        Bug bounty report template
        Report #: ____
        Severity: ____
        Steps to reproduce: 1. ____
      description: Blank template
    - value: 'Media release: a researcher earned a record bug bounty award for an account takeover flaw; Severity: critical.'
      description: News framing
false_positives:
  - description: Public disclosure policies, security.txt pages and news about bug bounty awards.
    mitigation: Programme wording is discovery-only; enforcement needs submission structure, and policy/news/template framing is excluded. Publicly disclosed reports copied from a platform can still enforce.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_bug_bounty_submissions
      matches:
        - type: any
          min_matches: 2
          refs:
            - Evidence_report_id
            - Evidence_repro_steps
            - Evidence_tested_endpoint
            - Evidence_triage_field
        - ref: Keyword_reported_weakness
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_bug_bounty_submissions
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_report_id
            - Evidence_repro_steps
            - Evidence_tested_endpoint
            - Evidence_triage_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_bug_bounty_submissions
  regexes:
    - id: Regex_bug_bounty_submissions
      pattern: (?i)\b(?:bug\s+bounty\s+(?:submission|report|triage|payout|award)s?|(?:HackerOne|Bugcrowd|Intigriti|YesWeHack)\s+(?:report|submission|triage)s?|(?:vulnerability|responsible)\s+disclosure\s+(?:submission|report)s?|VDP\s+(?:submission|report)s?|security\s+researcher\s+(?:submission|report)s?|bounty\s+(?:submission|payout|award)s?)\b
    - id: Evidence_report_id
      pattern: (?i)\b(?:report|submission|ticket|case)\s{0,3}(?:ID|#|no\.?|number)\s{0,3}[:#]?\s{0,3}#?\d{3,9}\b
    - id: Evidence_repro_steps
      pattern: (?i)\bsteps\s+to\s+reproduce\b[\s\S]{0,40}?\b1[.)]\s{1,3}[A-Za-z]
    - id: Evidence_tested_endpoint
      pattern: \b(?:GET|POST|PUT|DELETE|PATCH)\s+/[\w./?=&%-]{0,200}|\bhttps?://[a-z0-9.-]{1,100}\.(?:internal|corp|local|lan|test)(?::\d{2,5})?/[\w./?=&%-]{0,200}
    - id: Evidence_triage_field
      pattern: (?i)\b(?:bounty|award|reward|payout)\s{0,3}(?:amount)?\s{0,3}[:=]\s{0,3}(?:USD|AUD|US\$|A\$|\$)\s?\d[\d,]{1,9}(?:\.\d{2})?|\b(?:severity|triage\s+status|state)\s{0,3}[:=]\s{0,3}(?:critical|high|medium|low|triaged|resolved|duplicate|informative|needs\s+more\s+info)\b
  keywords:
    - id: Keyword_reported_weakness
      groups:
        - match_style: word
          terms:
            - SQL injection
            - cross-site scripting
            - cross site scripting
            - text: XSS
              case_sensitive: true
            - path traversal
            - command injection
            - insecure deserialization
            - hard-coded credential
            - hardcoded credential
            - server-side request forgery
            - text: SSRF
              case_sensitive: true
            - text: IDOR
              case_sensitive: true
            - open redirect
            - broken access control
            - remote code execution
            - privilege escalation
            - account takeover
            - authentication bypass
            - proof of concept
            - text: PoC
              case_sensitive: true
      strength: specific
    - id: Keyword_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - this policy requires
            - guidance note
            - this guidance
            - better practice guide
            - learning objectives
            - course module
            - training module
            - training course
            - awareness training
            - media release
            - press release
            - news report
            - reported today
            - journalists
            - frequently asked questions
            - this standard requires
            - teams should
            - organisations should
            - agencies should
            - entities should
            - how to write
            - checklist for
      strength: exclusion
risk_description: >-
  The detector identifies bug bounty and VDP submissions when report numbers, reproduction steps, tested endpoints or triage fields are present; programme wording alone is discovery-only. A genuine unpublished submission can reveal reproduction steps, vulnerable endpoints, proof-of-concept code, and remediation timing that enable exploitation before a fix is deployed. Public programme terms and already disclosed advisories can match, and an individual submission may be low severity or invalid. Risk 7 SENSITIVE reflects moderate harm from a credible non-public report; PROTECTED would require a critical verified vulnerability or significant damage established by the submission details.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps consistently to OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, SENS_IT, and Medium because a
    valid pre-disclosure bounty report can materially aid exploitation. The concept match does not prove validity,
    severity, affected scope, or PROTECTED-level consequence.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic Medium and Medium InfoTech are appropriate for embargoed vulnerability submissions with potentially
      actionable technical detail. Generic High would require evidence of a critical exploitable flaw or major affected
      service, not simply responsible-disclosure terminology.
created: '2026-02-08'
updated: '2026-09-25'
changelog:
  - version: 1.3.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): narrowed the primary to bug bounty / VDP submissions and platform reports (removed proof of concept, vulnerability report, security bug and bare security researcher/vulnerability disclosure, which overlap global-vulnerability-assessment-report); 75 requires a report number, numbered steps to reproduce, a tested endpoint or triage/bounty field and 85 requires two distinct structures plus a weakness class (replaces self-corroborating topic keyword list and label-context regex); guidance/news/training exclusion added; bare-phrase tests replaced with a synthetic submission and decoys. Replaced GDPR with Criminal Code Act 1995 (Cth); added ISO 27001/NIST CSF frameworks and verified OWASP Vulnerability Disclosure / ISM references; data_categories credentials -> technology.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1813 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
