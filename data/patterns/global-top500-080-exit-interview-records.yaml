schema: testpattern/v1
name: Exit interview records
slug: global-top500-080-exit-interview-records
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects exit interview, exit survey and separation interview records for an identified departing employee, with reasons for leaving, last day or resignation date, rehire eligibility or satisfaction scores.
operation: >-
  Primary: an exit phrase (exit interview/survey/questionnaire/feedback, separation interview, departure interview, resignation feedback). 75 tier requires a populated person field (employee/staff name or number, departing employee, leaver, position number or title, work unit) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated exit detail (reason for leaving, last day/resignation date, rehire eligibility, or satisfaction score) and an independent corroborative term (workload, culture, career, new employer, flexibility). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:exit\s+(?:interview|survey|questionnaire|feedback)|separation\s+interview|departure\s+interview|resignation\s+feedback)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - workload
    - culture
    - career
    - new employer
    - flexibility
    - remuneration
    - bullying
    - wellbeing
    - confidential
  proximity: 300
test_cases:
  should_match:
    - value: "Exit interview\nDeparting employee: Avery Teston\nPosition title: Field Technician\nLast day: 26/09/2026\nPrimary reason for leaving: Workload and lack of flexibility with the roster.\nEligible for rehire: Yes. Comments on team culture recorded confidentially."
      description: '85: Exit interview with employee, last day, reason and rehire'
      synthetic: true
    - value: "Separation interview notes\nEmployee: Jordan Staffson\nResignation date: 2026-09-12\nSatisfaction: 2/10\nLeaving for a new employer offering better career progression."
      description: '85: Separation interview with resignation date and satisfaction'
      synthetic: true
    - value: "Exit survey response\nEmployee ID: 5520117\nFree text: felt unsupported after the team restructure."
      description: '75: Exit survey naming an employee ID, no dated detail'
      synthetic: true
  should_not_match:
    - value: Exit interviews help us understand why people leave. This procedure explains who conducts the exit survey and how results are reported.
      description: Procedure text - must stay below 75
    - value: "Exit interview form\nDeparting employee: __________\nLast day: ___/___/____\nReason for leaving: __________"
      description: Blank form - must stay below 75
    - value: Our annual exit survey results show 38% of leavers cited workload, according to the workforce report media release.
      description: News / aggregate statistics - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_080_exit_interview_records_primary
      matches:
        - ref: Regex_top500_080_exit_interview_records_person_field
        - ref: Regex_top500_080_exit_interview_records_record_detail
        - ref: Keyword_top500_080_exit_interview_records_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_080_exit_interview_records_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_080_exit_interview_records_primary
      matches:
        - ref: Regex_top500_080_exit_interview_records_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_080_exit_interview_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_080_exit_interview_records_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_080_exit_interview_records_primary
      pattern: >-
        (?i)\b(?:exit\s+(?:interview|survey|questionnaire|feedback)|separation\s+interview|departure\s+interview|resignation\s+feedback)\b
    - id: Regex_top500_080_exit_interview_records_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit|departing\s+employee|leaver)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_080_exit_interview_records_record_detail
      pattern: >-
        (?i)\b(?:primary\s+)?reasons?\s+for\s+(?:leaving|resignation|departure)\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z][a-z]{2,}|\b(?:last\s+day(?:\s+of\s+(?:service|employment))?|separation\s+date|resignation\s+date|termination\s+date|date\s+of\s+(?:resignation|separation|departure))\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})|\b(?:would\s+(?:you\s+)?(?:recommend|return|rejoin)[A-Za-z ]{0,40}|eligible\s+for\s+rehire|rehire)\s*[:?\-]\s*(?:yes|no|maybe|unsure)\b|\b(?:overall\s+)?satisfaction\s*[:\-]\s*\d{1,2}(?:\s*/\s*\d{1,2})?
  keywords:
    - id: Keyword_top500_080_exit_interview_records_corroborative
      groups:
        - match_style: word
          terms:
            - workload
            - culture
            - career
            - new employer
            - flexibility
            - remuneration
            - bullying
            - wellbeing
            - confidential
      strength: specific
    - id: Keyword_top500_080_exit_interview_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a exit interview or exit survey response from an identified employee about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Disclosure exposes an identifiable former employee's candid comments about managers and colleagues, and sometimes health or harassment concerns. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 8 supports SENSITIVE Personal-Privacy (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Personal-Privacy because completed exit
    feedback can combine identifiable employment facts, allegations, and candid opinions. PROTECTED is not met for a
    normal one-person record whose consequences remain within an employment relationship and do not establish
    significant or irreversible damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium with Medium Personal-Privacy handling is appropriate for completed exit feedback because disclosure can
      materially harm the worker and people discussed. High handling is reserved for exceptional cases carrying
      significantly greater personal or operational consequences.
references:
  - title: OAIC - Employee records exemption
    url: https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/organisations/employee-records-exemption
  - title: Fair Work Act 2009 (Cth) - s 535 employee records, s 536 pay slips
    url: https://www.legislation.gov.au/C2009A00028/latest/text
