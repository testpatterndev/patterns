schema: testpattern/v1
name: Australian Enterprise Agreement Document
slug: au-enterprise-agreement-document
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects Australian enterprise agreement and enterprise bargaining content
  under the Fair Work Act 2009 - agreement text and drafts (single-enterprise
  and greenfields agreements, nominal expiry, better off overall test), Fair
  Work Commission agreement codes (AE followed by six digits), and bargaining
  process artefacts (notice of employee representational rights, protected
  action ballots, logs of claims).
operation: >-
  Matches enterprise-agreement phrasing tied to Fair Work context (FWC,
  nominal expiry date, BOOT), the FWC approved-agreement code format AE######,
  agreement-type terms of art (single-enterprise / multi-enterprise /
  greenfields agreement), and bargaining artefacts whose names are statutory.
  Approved agreements are public on the FWC register, so the sensitivity
  centres on drafts, bargaining positions and annotated copies - enforcing
  tiers should corroborate with negotiation vocabulary.
pattern: >-
  \benterprise\s+(?:bargaining\s+)?agreement\b[\s\S]{0,160}\b(?:Fair\s+Work|FWC|nominal\s+expiry|better\s+off\s+overall|BOOT|bargaining)\b|\bAE\d{6}\b|\bnotice\s+of\s+employee\s+representational\s+rights\b|\bprotected\s+action\s+ballot\b|\blog\s+of\s+claims\b|\b(?:single|multi)-?enterprise\s+agreement\b|\bgreenfields\s+agreement\b|\bbetter\s+off\s+overall\s+test\b
confidence: medium
confidence_justification: >-
  Medium confidence: the statutory terms of art (NERR, protected action ballot,
  BOOT, greenfields agreement) and the AE-number code rarely occur outside
  genuine enterprise-agreement material, but approved agreements are public
  documents and HR/legal explainers use the same vocabulary. Corroboration
  distinguishes live bargaining and annotated drafts from published text.
jurisdictions:
  - au
regulations:
  - "Fair Work Act 2009 (Cth)"
frameworks:
  - ISO 27001
data_categories:
  - legal
  - business
  - pii
corroborative_evidence:
  keywords:
    - bargaining representative
    - union
    - classification structure
    - rates of pay
    - allowances
    - nominal expiry date
    - ballot
    - in-principle agreement
    - without prejudice
    - claims
  proximity: 300
test_cases:
  should_match:
    - value: 'the proposed enterprise agreement will be lodged with the Fair Work Commission after the access period'
      description: Enterprise agreement with Fair Work context
    - value: 'Coralstone Energy Corporation Limited Enterprise Agreement approved - print reference AE523847'
      description: FWC approved-agreement code
    - value: 'a notice of employee representational rights was issued to all affected employees on Monday'
      description: Statutory NERR bargaining artefact
    - value: 'the union lodged a protected action ballot application covering the operations crew'
      description: Protected industrial action artefact
    - value: 'the greenfields agreement for the new facility includes a revised classification structure'
      description: Agreement type term of art
  should_not_match:
    - value: our enterprise agreement with the cloud vendor covers premium support tiers
      description: Commercial enterprise agreement in the software-licensing sense
    - value: the team reached an agreement on the project timeline after the workshop
      description: Generic agreement prose
    - value: bargaining for a better price at the markets is expected
      description: Bargaining outside the industrial-relations sense
false_positives:
  - description: Approved enterprise agreements are public on the FWC register, and
      HR guidance, law-firm updates and union newsletters use the same statutory
      vocabulary without containing bargaining positions.
    mitigation: Corroborate with negotiation-sensitive keywords (log of claims,
      without prejudice, in-principle, rates of pay) before enforcing; treat the
      bare agreement-text arms as discovery/audit signals.
exports:
  - yaml
scope: narrow
risk_rating: 6
risk_description: >-
  Draft agreements, logs of claims and bargaining positions reveal an
  employer's negotiation strategy and employee relations posture; premature
  disclosure damages bargaining in progress and industrial relationships,
  though approved agreement text itself is public.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - "Fair Work Act 2009 (Cth) Part 2-4 - Enterprise agreements"
  - "Fair Work Commission - agreements register (AE document codes)"
created: 2026-07-25
updated: 2026-08-03
