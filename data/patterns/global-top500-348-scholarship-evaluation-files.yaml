schema: testpattern/v1
name: Scholarship evaluation files
slug: global-top500-348-scholarship-evaluation-files
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to scholarship evaluation files in international contexts. This information
  type is classified as personally identifiable information under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 7 keywords within 300 characters. Keyword lists: corporate-ip. Uses additional domain-context
  evidence and explicit exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:scholarship\s+evaluation|scholarship\s+review|merit\s+assessment|award\s+criteria|selection\s+committee|applicant\s+ranking|scholarship\s+recipient|academic\s+achievement|financial\s+need|evaluation\s+rubric|scholarship\s+panel|award\s+decision)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
  - GDPR
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
  - scholarship evaluation files
  - scholarship
  - evaluation
  - files
  - education
  - research
  - administration
  proximity: 300
  keyword_lists:
  - corporate-ip
  - data-record-context
  - generic-data-labels
test_cases:
  should_match:
  - value: scholarship evaluation
    description: Primary topic phrase match
  - value: scholarship review
    description: Case-insensitive topic phrase match
  - value: merit assessment
    description: Alternative topic phrase match
  - value: award criteria
    description: Additional topic phrase match
  - value: "scholarship evaluation\nStudent name: Avery Teston\nStudent ID: S4471820\nYear level: 9\nParent: Jordan Teston\nNotes: scholarship evaluation discussed with the family on 12/08/2026."
    description: Populated student record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: student grant
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about scholarship evaluation are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Common words and phrases related to scholarship evaluation files appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: This classifier recognises scholarship reviews, merit assessments, award criteria, and evaluation files
  with seven nearby education or decision signals. A genuine file can combine grades, financial need, personal circumstances,
  reviewer scoring, and comparative comments, allowing unfair influence over an award or embarrassing an applicant if released.
  The ordinary unit affects a bounded applicant pool and selection process, with serious but contained educational and privacy
  consequences. Risk 8 supports SENSITIVE Personal-Privacy; PROTECTED would require a large vulnerable cohort, protected attributes
  tied to safety, or compromise of a nationally consequential award process.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_scholarship_evaluation
      matches:
        - ref: Regex_global_top500_348_scholarship_evaluation_files_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_scholarship_evaluation
      matches:
        - ref: Regex_global_top500_348_scholarship_evaluation_files_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_scholarship_evaluation
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_scholarship_evaluation
      pattern: (?is)\b(?:scholarship\s+evaluation|scholarship\s+review|merit\s+assessment|award\s+criteria|selection\s+committee|applicant\s+ranking|scholarship\s+recipient|academic\s+achievement|financial\s+need|evaluation\s+rubric|scholarship\s+panel|award\s+decision)\b
    - id: Regex_global_top500_348_scholarship_evaluation_files_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|candidate|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|(?:student|candidate|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-09-24'
changelog:
- version: 1.3.1
  date: '2026-09-24'
  description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
- version: 1.3.0
  date: '2026-09-24'
  description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires independent student record structure (Regex ..._record_structure); 85 requires 2 distinct structure hits. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1894 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical
    tier.
