schema: testpattern/v1
name: Ballistics evidence records
slug: global-top500-411-ballistics-evidence-records
version: 1.4.1
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to ballistics evidence records in international contexts. This information
  type is classified as personally identifiable information under applicable data protection regulations. Coverage differentiates
  forensic ballistics records and findings from education and general firearms discussion; generic firearms-analysis language
  is discovery-only unless independent forensic case or examination-result evidence is present.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 1 keywords within 240 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:ballistics\s+evidence|ballistics\s+report|firearms\s+analysis|bullet\s+comparison|shell\s+casing|firearms\s+examiner|trajectory\s+analysis|gunshot\s+residue|weapon\s+discharge|caliber\s+analysis|forensic\s+ballistics)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
  - GDPR
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
  - ballistics evidence records
  proximity: 240
test_cases:
  should_match:
  - value: ballistics evidence
    description: Primary topic phrase match
  - value: ballistics report
    description: Case-insensitive topic phrase match
  - value: firearms analysis
    description: Contextual-branch phrase — discovers only unless independent forensic case/examination evidence is present
  - value: bullet comparison
    description: Additional topic phrase match
  - value: case H-882; exhibit E-17 shell casing 9mm; firearm SN A771; examiner K. Moss; comparison result sufficient agreement;
      NIBIN hit NH-44; report 2026-07-14.
    description: Forensic exhibit record with examiner/database-hit evidence — enforceable ballistics-record content
  - value: "ballistics evidence\nName: Avery Teston\nDate of birth: 04/02/1991\nReference number: RX22914471\nNotes: ballistics evidence recorded against the subject; handling restricted."
    description: Populated justice record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: mugshot victim
    description: Generic word pair from old broad template should not match
  - value: The university course introduces firearms analysis methods.
    description: Educational firearms-analysis prose is demoted — discovery only, must not enforce
  - value: 'Training exercise: exhibit E-00 is a fictional shell casing used for examiner practice.'
    description: Training-exercise exclusion suppresses the shell-casing anchor
  - value: firearms analysis
    description: Bare contextual phrase — discovery only, must not enforce
  - value: "Policy guidance: this procedure explains how records about ballistics evidence are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Common words and phrases related to ballistics evidence records appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 240
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_ballistics
      matches:
        - ref: Regex_global_top500_411_ballistics_evidence_records_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_ballistics
      matches:
        - ref: Regex_global_top500_411_ballistics_evidence_records_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_ballistics
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_ballistics
      pattern: (?is)\b(?:ballistics\s+evidence|ballistics\s+report|bullet\s+comparison|shell\s+casing|firearms\s+examiner|trajectory\s+analysis|gunshot\s+residue|weapon\s+discharge|caliber\s+analysis|forensic\s+ballistics)\b
    - id: Regex_global_top500_411_ballistics_evidence_records_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|defendant|accused|offender|prisoner|inmate|detainee|respondent|applicant|witness|informant|suspect|subject\s+(?:name|person)|person\s+of\s+interest|POI|victim|complainant|officer|CNI|QPRIME|(?:file|case|matter|court|reference|ref|exhibit|brief|job|incident|report|investigation|occurrence)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
risk_description: This concept regex recognises ballistics evidence, firearms analysis, bullet comparisons, and ballistics
  reports in case context. A genuine record can reveal forensic conclusions, weapon links, laboratory observations, and evidentiary
  gaps, enabling evidence tampering, witness coaching, or prejudice to unresolved proceedings. The usual report affects a
  particular investigation and has serious legal consequences, but it does not inherently expose protected forensic capabilities
  or a broad operation. Risk 8 remains SENSITIVE Law-Enforcement; PROTECTED would require sensitive methods, an active major
  operation, or compromise causing significant public-safety damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Law-Enforcement
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-09-24'
changelog:
- version: 1.4.1
  date: '2026-09-24'
  description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
- version: 1.4.0
  date: '2026-09-24'
  description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires independent justice record structure (Regex ..._record_structure); 85 requires 2 distinct structure hits. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
- version: 1.3.0
  date: '2026-07-17'
  description: 'SIT alignment wave1 (TP-01318, reduced scope): "firearms analysis" moved out of the self-corroborating primary
    (the verified educational-prose 65 FP) into the approved contextual branch (Regex_ballistics_ContextualBranch) enforcing
    at 65 only with Keyword_ballistics_IndependentContext forensic case/exhibit/examination evidence (17 terms materialized
    from the approved definition) and otherwise 65 discovery_only, both with the template-exclusion NOT gate; ballistics evidence/report,
    bullet comparison, and other forensic anchors retained unchanged; adversarial tests added. Deliberately less than the
    first-pass candidate: "shell casing"/"weapon discharge" left in the primary (no written-out branch covered them), no calibre-only
    validator, and no 75 re-tiering; the report-heading near-miss was NOT added as a negative (headings legitimately enforce
    at 65 per QA).'
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1956 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical
    tier.
