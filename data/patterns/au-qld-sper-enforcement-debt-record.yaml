changelog:
  - version: 1.1.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.0.0
    date: '2026-10-20'
    description: >-
      Initial release (qgfin sector review gap). SPER enforcement-stage records for state-agency and court fines,
      anchored on enforcement vocabulary rather than the infringement notice itself. 75 needs a debtor field or
      reference plus state context; 85 needs debtor, reference, amount and state context. Local-law context is excluded
      so council notices stay with au-qld-council-infringement-sper-record.
