schema: testpattern/v1
name: Queensland SPER Enforcement and State Fine Debt Record
slug: au-qld-sper-enforcement-debt-record
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  State Penalties Enforcement Registry (SPER) enforcement-stage records for fines issued by Queensland state agencies and courts: enforcement orders, fine collection notices, SPER debt statements and instalment or payment plans, enforcement warrants, seizure and sale orders, redirection orders, fine option orders and driver licence suspension notices. SPER, part of the Queensland Revenue Office, collects unpaid infringement notices referred by the Queensland Police Service, Transport and Main Roads, Translink, Queensland Rail and other state agencies, plus court-ordered fines. Under the State Penalties Enforcement Act 1999 the registrar may make an enforcement order for an unpaid amount and enforcement fee and take enforcement action (licence suspension, redirection of earnings or bank accounts, seizure and sale). The record names the debtor with an address, a SPER reference, the issuing agency and the amount owing. This SIT is the state and SPER-stage counterpart of au-qld-council-infringement-sper-record (council local law notices and their referral to SPER) and traffic-camera-record (camera-detected offence notices); local-law context is excluded here so council notices stay with the council SIT.
operation: >-
  Primary (enforcement-stage vocabulary): SPER debt(s) / debtor / enforcement order / enforcement action / referral / registration / instalment plan / payment plan, enforcement order, fine collection notice, enforcement warrant, seizure and sale order / warrant, fine option order, arrest and imprisonment warrant, redirection order, [driver] licence suspension notice. 65 (discovery only): primary alone. 75: primary plus a populated debtor field (debtor, alleged offender, offender, customer / client name, full name, name, residential / postal address followed by a name or street address) or a labelled SPER / client / customer / debtor reference or order / notice / warrant number, plus state context within 300 characters (State Penalties Enforcement Registry, State Penalties Enforcement Act, Queensland Revenue Office, Queensland Police Service, Transport and Main Roads, Translink, Queensland Rail, camera detected offence, Magistrates Court, issuing / referring agency, enforcement fee and other state issuers). 85: primary plus debtor field, reference and a populated amount field (amount owing / outstanding / payable / due, total debt, balance, enforcement fee, unpaid amount, fine amount, instalment amount, due date, pay by) plus state context. Field values must be on the label's line and are placeholder-guarded. Enforce tiers AND NOT the shared template-exclusion dictionary, a guidance exclusion (FAQ, fact sheet, State Penalties Enforcement Regulation, annual report, media release, if you do not pay) and a local-law exclusion (local law, Animal Management (Cats and Dogs) Act, unregistered dog, overgrown allotment, unsightly, remedial notice).
pattern: >-
  (?i)\b(SPER\s+(?:debts?|debtor|enforcement\s+(?:order|action)|referral|registration|instalment\s+plan|payment\s+plan)|enforcement\s+orders?|fine\s+collection\s+notices?|enforcement\s+warrants?|seizure\s+and\s+sale\s+(?:orders?|warrants?)|fine\s+option\s+orders?|arrest\s+and\s+imprisonment\s+warrants?|redirection\s+orders?|(?:driver\s+)?licen[cs]e\s+suspension\s+notices?)\b
confidence: medium
confidence_justification: >-
  Medium. Enforcement-order vocabulary also appears in planning and court contexts and in SPER's own public guidance, so enforce tiers need a populated debtor field or SPER reference plus state context, and guidance framing is excluded. SPER reference formats are unpublished, so the reference is label-anchored. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - State Penalties Enforcement Act 1999 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - financial
  - pii
  - government
corroborative_evidence:
  keywords:
    - State Penalties Enforcement Registry
    - Queensland Revenue Office
    - Queensland Police Service
    - Transport and Main Roads
    - issuing agency
    - enforcement fee
  proximity: 300
test_cases:
  should_match:
    - value: "SPER enforcement order\nState Penalties Enforcement Registry - Queensland Revenue Office\nSPER reference: 1100-447-2913\nDebtor: Casey Teston\nAddress: 14 Wattle Street, Toowoomba QLD 4350\nIssuing agency: Queensland Police Service (camera detected offence)\nAmount owing: $1,482.60\nEnforcement fee: $79.30"
      description: SPER enforcement order with debtor, reference, issuing agency and amount owing (85 tier)
      synthetic: true
    - value: "Fine collection notice\nReferring agency: Department of Transport and Main Roads\nClient number: SP20448810\nName: Robin Teston\nTotal debt: $2,915.40\nPay by: 14/11/2026"
      description: Fine collection notice with client number, name and total debt (85 tier)
      synthetic: true
    - value: "Licence suspension notice issued for unpaid fines referred by the Queensland Police Service.\nName: Jamie Teston"
      description: Licence suspension notice naming the debtor (75 tier)
      synthetic: true
    - value: "Seizure and sale order raised against the vehicle; order number: ESO2026004471. State Penalties Enforcement Registry action following Translink fare evasion fines."
      description: Seizure and sale order with an order number only (75 tier)
      synthetic: true
  should_not_match:
    - value: "38 Enforcement order (1) If the registrar is satisfied that a default certificate has been given, the registrar may make an enforcement order against the enforcement debtor for the unpaid amount and the enforcement fee."
      description: SPER Act text (legislation, 65 only)
    - value: "SPER instalment plan application\nSPER reference: __________\nName: __________\nAmount owing: $________\nIssuing agency: __________"
      description: Blank SPER instalment plan form (65 only)
    - value: "Frequently asked questions: if you have a SPER debt, the Queensland Revenue Office may issue an enforcement order and add an enforcement fee. Name: see your notice."
      description: SPER FAQ page (guidance exclusion)
    - value: "SPER debt registered after the local law notice was unpaid.\nCouncil: Harbourview Regional Council\nNotice number: 7004418273\nAlleged offender: Morgan Teston\nAmount outstanding: $1,238.00\nIssuing agency: council animal management (unregistered dog)"
      description: Council local law notice referred to SPER (local-law exclusion; covered by au-qld-council-infringement-sper-record)
    - value: "The Planning and Environment Court made an enforcement order requiring the owner to stop the use of the premises within 60 days."
      description: Planning court enforcement order (no debtor field or state fine context)
false_positives:
  - description: SPER Act and Regulation text, SPER and QRO web pages and FAQ, annual reports and statistics.
    mitigation: Enforce tiers need a populated debtor field or a labelled reference plus state context; a guidance exclusion suppresses FAQ, fact sheets, the Regulation, annual reports and media releases.
  - description: Council local law infringement notices and their SPER referral records.
    mitigation: A local-law exclusion keeps them at 65 here; au-qld-council-infringement-sper-record covers them.
  - description: Planning and Environment Court enforcement orders and other non-fine enforcement orders.
    mitigation: They lack a debtor or SPER reference field and state fine context, so they stay at 65.
  - description: Blank SPER forms.
    mitigation: Values must be on the label's line, and blank lines and bracket placeholders are rejected.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_sper_enforcement_primary
      matches:
        - ref: Regex_au_qld_sper_enforcement_debtor_field
        - ref: Regex_au_qld_sper_enforcement_reference
        - ref: Regex_au_qld_sper_enforcement_amount_field
        - ref: Keyword_au_qld_sper_enforcement_state_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_sper_enforcement_guidance_exclusion
            - Keyword_au_qld_sper_enforcement_local_law_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_sper_enforcement_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_sper_enforcement_debtor_field
            - Regex_au_qld_sper_enforcement_reference
        - ref: Keyword_au_qld_sper_enforcement_state_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_sper_enforcement_guidance_exclusion
            - Keyword_au_qld_sper_enforcement_local_law_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_sper_enforcement_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_sper_enforcement_primary
      pattern: >-
        (?i)\b(SPER\s+(?:debts?|debtor|enforcement\s+(?:order|action)|referral|registration|instalment\s+plan|payment\s+plan)|enforcement\s+orders?|fine\s+collection\s+notices?|enforcement\s+warrants?|seizure\s+and\s+sale\s+(?:orders?|warrants?)|fine\s+option\s+orders?|arrest\s+and\s+imprisonment\s+warrants?|redirection\s+orders?|(?:driver\s+)?licen[cs]e\s+suspension\s+notices?)\b
    - id: Regex_au_qld_sper_enforcement_debtor_field
      pattern: >-
        (?i)\b((?:enforcement\s+debtor|debtor(?:\s+name)?|alleged\s+offender|offender|customer\s+name|client\s+name|full\s+name|name|(?:residential\s+|postal\s+)?address)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not|none|nil|redacted|suppressed|the|a|an|any|all|each|see|refer|your)\b|_{2,}|\[|<)(?:(?:(?:Mr|Mrs|Ms|Miss|Dr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30}))
    - id: Regex_au_qld_sper_enforcement_reference
      pattern: >-
        (?i)\b((?:SPER\s+(?:reference|ref|client|customer|account)(?:\s+(?:no\.?|number|ID))?|(?:client|customer|debtor|reference)\s+(?:no\.?|number|ID)|(?:order|notice|warrant)\s+(?:no\.?|number))[ \t]*[:#]?[ \t]{0,5}(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{5,20})\b
    - id: Regex_au_qld_sper_enforcement_amount_field
      pattern: >-
        (?i)\b((?:amount\s+(?:owing|outstanding|payable|due)|total\s+(?:debt|owing|outstanding|amount\s+owing)|balance(?:\s+(?:owing|outstanding|due))?|enforcement\s+fee|unpaid\s+amount|fine\s+amount|original\s+fine|instalment\s+amount|due\s+date|pay\s+by)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|\$_)[A-Za-z0-9$][A-Za-z0-9$,'/-]{1,40})
  keywords:
    - id: Keyword_au_qld_sper_enforcement_state_context
      groups:
        - match_style: word
          terms:
            - State Penalties Enforcement Registry
            - State Penalties Enforcement Act
            - Queensland Revenue Office
            - Queensland Police Service
            - text: QPS
              case_sensitive: true
            - Department of Transport and Main Roads
            - Transport and Main Roads
            - text: TMR
              case_sensitive: true
            - Translink
            - Queensland Rail
            - camera detected offence
            - Magistrates Court
            - court ordered fine
            - issuing agency
            - referring agency
            - enforcement fee
            - Office of Fair Trading
            - Queensland Parks and Wildlife Service
            - Workplace Health and Safety Queensland
            - Biosecurity Queensland
            - Queensland Building and Construction Commission
      strength: specific
    - id: Keyword_au_qld_sper_enforcement_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - frequently asked questions
            - fact sheet
            - factsheet
            - State Penalties Enforcement Regulation
            - annual report
            - media release
            - if you do not pay
            - find out more
      strength: noise
    - id: Keyword_au_qld_sper_enforcement_local_law_exclusion
      groups:
        - match_style: word
          terms:
            - local law
            - local laws
            - Animal Management (Cats and Dogs) Act
            - unregistered dog
            - overgrown allotment
            - unsightly
            - remedial notice
      strength: noise
risk_rating: 6
risk_description: >-
  The classifier identifies a SPER enforcement-stage record (enforcement order, fine collection notice, debt statement, payment plan, warrant, seizure and sale or licence suspension notice) that names the debtor with an address, a SPER reference, the issuing agency and the amount owing. These records expose an identified person's fines, enforcement history, debt and the sanctions taken against them (licence suspension, earnings redirection, seizure of property). Bulk SPER debtor extracts expose many people and sit at the upper end of this band. Legislation, SPER guidance, blank forms, council local-law notices and planning enforcement orders are excluded from enforce tiers. Risk 6 supports SENSITIVE Legal, matching au-qld-council-infringement-sper-record.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  idcf: DSL-3
  idcf_marker: Legal Privilege
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 6 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Legal and Medium because a SPER enforcement
    record names the debtor and address with the fines, debt and enforcement action taken. Risk 8 or PROTECTED is not
    met for a single record, though bulk SPER debtor extracts sit at the upper end of this band.
  generic:
    classification: Medium
    dlm: Medium Legal
    rationale: >-
      Medium Legal handling fits an identified person's fine enforcement history and debt; bulk debtor extracts deserve
      stricter handling within the same level.
references:
  - title: State Penalties Enforcement Act 1999 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1999-070
  - title: Queensland Revenue Office - State Penalties Enforcement Registry (SPER)
    url: https://qro.qld.gov.au/sper/
  - title: Queensland Revenue Office - Fines and infringements
    url: https://qro.qld.gov.au/fines-and-infringements/about/
  - title: Information Privacy Act 2009 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
