schema: testpattern/v1
name: Supplier invoice records
slug: global-top500-146-supplier-invoice-records
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to supplier invoice records in international contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 6 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(?:supplier\s+invoice|invoice\s+number|invoice\s+date|payment\s+due|accounts\s+payable|invoice\s+amount|tax\s+invoice|invoice\s+approval|three[\s-]+way\s+match|invoice\s+reconciliation|credit\s+note|remittance\s+advice)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - supplier invoice records
    - supplier
    - invoice
    - records
    - procurement
    - management
  proximity: 300
test_cases:
  should_match:
    - value: supplier invoice
      description: Primary topic phrase match
    - value: invoice number
      description: Case-insensitive topic phrase match
    - value: invoice date
      description: Alternative topic phrase match
    - value: payment due
      description: Additional topic phrase match
    - value: |-
        Supplier invoice
        Payee: Riverbend Supplies Pty Ltd
      description: Populated payee/account with one field (75 tier)
      synthetic: true
    - value: |-
        Supplier invoice
        Payee: Riverbend Supplies Pty Ltd
        BSB: 064-000
      description: Populated payee/account with 2 distinct fields (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: procurement inventory
      description: Generic word pair from old broad template should not match
    - value: Supplier invoice records
      description: "Bare detector name: it reached 75 through the generated name-word tier and must not reach an enforcing tier"
    - value: |-
        Supplier invoice:
        Payee:
        Account name:
        Account number:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about supplier invoice are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to supplier invoice records appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: >-
      In English (as the primary international business language), similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute
      sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_supplier_invoice_records
      matches:
        - ref: Regex_global_top500_146_supplier_invoice_records_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_supplier_invoice_records
      matches:
        - ref: Regex_global_top500_146_supplier_invoice_records_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_supplier_invoice_records
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_supplier_invoice_records
      pattern: >-
        (?is)\b(?:supplier\s+invoice|invoice\s+number|invoice\s+date|payment\s+due|accounts\s+payable|invoice\s+amount|tax\s+invoice|invoice\s+approval|three[\s-]+way\s+match|invoice\s+reconciliation|credit\s+note|remittance\s+advice)\b
    - id: Regex_global_top500_146_supplier_invoice_records_record_structure
      pattern: (?i)\b(?:payee|supplier|vendor|creditor|beneficiary|account\s+name|BSB|account\s+(?:no\.?|number)|amount\s+paid|ABN|PO\s+(?:no\.?|number)|purchase\s+order\s+(?:no\.?|number))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
risk_description: >-
  This concept pattern finds supplier-invoice, invoice-number, invoice-date, and payment-due language indicating an accounts-payable record. A genuine invoice can expose supplier identity, amount, goods or services, and payment timing, helping an attacker craft invoice-substitution fraud when they also know bank details and the approval workflow. Invoices are routinely exchanged, and templates or accounting guidance can match without representing a payable obligation. Risk 5 OFFICIAL reflects bounded commercial and fraud harm; SENSITIVE would require payment credentials, bank-change instructions, high-value confidential purchases, system access, or a bulk accounts-payable ledger.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to PSPF OFFICIAL, QGISCF OFFICIAL, the OFFICIAL DLM, OFFI, and Low tier for one ordinary supplier
    invoice. The next SENSITIVE level is not met because no authenticated bank change, payment authority, credential,
    protected procurement, or bulk payable ledger is detected.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low and Low handling fit a routine supplier invoice whose serious fraud potential depends on banking data,
      approval authority, or system access.
references:
  - title: "Regulation (EU) 2016/679 (General Data Protection Regulation)"
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
frameworks:
  - ISO 27001
  - ISO 27701
