schema: testpattern/v1
name: Whistleblower protection case records
slug: global-top500-497-whistleblower-protection-case-records
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to whistleblower protection case records in international contexts. This information type is classified as personally identifiable information under
  applicable data protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 1 keywords within 240 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(whistleblower\s+protection\s+case\s+records|whistleblower\s+protection|protected\s+disclosure|public\s+interest\s+disclosure|complainant\s+identity|anonymous\s+report|integrity\s+commission|disclosure\s+officer|reprisal\s+protection|whistleblowing\s+scheme)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - whistleblower protection case records
  proximity: 240
test_cases:
  should_match:
    - value: whistleblower protection case records
      description: Primary topic phrase match
    - value: whistleblower protection
      description: Case-insensitive topic phrase match
    - value: protected disclosure
      description: Alternative topic phrase match
    - value: public interest disclosure
      description: Additional topic phrase match
    - value: |-
        Whistleblower protection case records
        Name: Avery Teston
        Date of birth: 14/02/1988
        Client number: C4471820
      description: Populated person/client record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: voter sovereign debt
      description: Generic word pair from old broad template should not match
    - value: |-
        Whistleblower protection case records:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about whistleblower protection case records are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to whistleblower protection case records appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: >-
      In English (as the primary international business language), similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute
      sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 240
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_whistleblower
      matches:
        - ref: Regex_global_top500_497_whistleblower_protection_case_records_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_whistleblower
      matches:
        - type: any
          min_matches: 1
          refs:
            - Keyword_whistleblower
            - Regex_global_top500_497_whistleblower_protection_case_records_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_whistleblower
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_whistleblower
      pattern: >-
        (?is)\b(whistleblower\s+protection\s+case\s+records|whistleblower\s+protection|protected\s+disclosure|public\s+interest\s+disclosure|complainant\s+identity|anonymous\s+report|integrity\s+commission|disclosure\s+officer|reprisal\s+protection|whistleblowing\s+scheme)\b
    - id: Regex_global_top500_497_whistleblower_protection_case_records_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
  keywords:
    - id: Keyword_whistleblower
      groups:
        - match_style: word
          terms:
            - retaliation
      strength: specific
risk_description: >-
  The concept pattern flags whistleblower protection cases, protected or public-interest disclosures, complainant identities, anonymous reports, integrity commissions, disclosure officers, reprisal protection, and whistleblowing schemes rather than validating a live case. A genuine record can reveal the reporter, allegations, subjects, evidence, protective arrangements, and reprisal concerns, enabling retaliation, intimidation, evidence interference, or severe reputational injury. The normal unit is one disclosure case and a small set of reporters, subjects, investigators, and support staff, while policies, training, and scheme descriptions can match. Risk 8 and SENSITIVE reflect serious contained safety and privacy harm; PROTECTED would require an acute credible threat to life, a protected operation, or significant irreversible damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Protected C
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy, and Medium because a live
    whistleblower file can expose identities, allegations, and protective measures with serious retaliation
    consequences. PROTECTED is not met for a normal bounded case without an acute life-safety threat, protected
    operation, or likely significant irreversible harm.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium with Medium Personal-Privacy handling is appropriate for a whistleblower case containing identities,
      evidence, and reprisal protections. High is reserved for severe life-safety or protected-operation cases.
frameworks:
  - ISO 27001
  - ISO 27701
