schema: testpattern/v1
name: Insider threat investigation files
slug: global-top500-300-insider-threat-investigation-files
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects insider-threat investigation files: insider-risk or employee investigation wording with populated subject details (employee, position, case number, allegation) and user-activity evidence. Topic wording alone is discovery-only.
operation: >-
  Regex_insider_threat_primary (insider-threat/insider-risk investigation, employee investigation file or user-activity monitoring report wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated subject/case field (subject employee, employee/staff ID, position, department, manager, case/referral number, investigator, allegation) or an activity artefact (timestamp, file-volume transfer, file path, IPv4). 85 requires a populated subject/case field (subject employee, employee/staff ID, position, department, manager, case/referral number, investigator, allegation) (two distinct hits), an activity artefact (timestamp, file-volume transfer, file path, IPv4), and independent insider-behaviour (exfiltration, after hours, resignation, DLP alert, removable media, disciplinary) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_insider_threat_guidance_exclusion).
pattern: >-
  (?i)\b(?:insider\s+(?:threat|risk)\s+(?:investigation|case|referral|inquiry|file|report|alert)s?|(?:employee|staff)\s+(?:misconduct\s+)?investigation\s+(?:file|report|record)|user\s+activity\s+monitoring\s+(?:report|alert|findings))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated subject/case field (subject employee, employee/staff ID, position, department, manager, case/referral number, investigator, allegation) or an activity artefact (timestamp, file-volume transfer, file path, IPv4)), and 85 needs two distinct structures plus independent insider-behaviour (exfiltration, after hours, resignation, DLP alert, removable media, disciplinary) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Privacy Act 1988 (Cth)
- Fair Work Act 2009 (Cth)
- GDPR
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
- pii
corroborative_evidence:
  keywords:
  - exfiltration
  - after hours
  - resignation
  - disciplinary
  - DLP alert
  - removable media
  - personal email
  - personal cloud
  - HR
  - privileged access
  proximity: 300
test_cases:
  should_match:
  - value: The insider threat referral was passed to People and Culture for review.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Insider threat investigation file
      Subject employee: Avery Teston
      Department: Finance
    description: Medium-tier probe (75) - populated subject fields
    synthetic: true
  - value: |-
      Insider threat investigation file - case IT-2026-017
      Subject employee: Avery Teston
      Position: Senior Payroll Officer
      Investigator: Jordan Staffson
      2026-09-03 22:41 - 1,240 files copied to removable media after hours; DLP alert on personal email upload two days after resignation notice.
    description: High-tier probe (85) - subject fields, activity artefacts and behaviour context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: insider threat investigations follow the code of conduct and procedural fairness.'
    description: Policy text
    synthetic: true
  - value: |-
      Insider threat investigation file template
      Subject employee: ________
      Allegation: [insert]
    description: Blank template
    synthetic: true
  - value: 'News report: an insider risk case at a bank saw 1,240 files copied to a USB drive after hours.'
    description: News framing
    synthetic: true
false_positives:
- description: Insider-threat programme policies and awareness material.
  mitigation: Topic wording is discovery-only; policy/training framing is excluded.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_insider_threat_primary
    matches:
    - ref: Regex_insider_threat_subject_field
      min_count: 2
      unique_results: true
    - ref: Regex_insider_threat_activity_artefact
    - ref: Keyword_insider_threat_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_insider_threat_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_insider_threat_primary
    matches:
    - type: any
      refs:
      - Regex_insider_threat_subject_field
      - Regex_insider_threat_activity_artefact
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_insider_threat_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_insider_threat_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_insider_threat_primary
    pattern: >-
      (?i)\b(?:insider\s+(?:threat|risk)\s+(?:investigation|case|referral|inquiry|file|report|alert)s?|(?:employee|staff)\s+(?:misconduct\s+)?investigation\s+(?:file|report|record)|user\s+activity\s+monitoring\s+(?:report|alert|findings))\b
  - id: Regex_insider_threat_subject_field
    pattern: >-
      (?i)\b(?:subject(?:\s+employee)?|employee\s+(?:name|ID|no\.?|number)|staff\s+(?:ID|no\.?|number)|position|department|manager|case\s+(?:no\.?|number|ID)|referral\s+(?:no\.?|date)|investigator|allegation)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  - id: Regex_insider_threat_activity_artefact
    pattern: >-
      (?i)\b20\d{2}-[01]\d-[0-3]\d[T ][0-2]\d:[0-5]\d|\b\d{1,6}\s*(?:files|MB|GB)\s+(?:copied|uploaded|downloaded|emailed|transferred)\b|\b[A-Z]:\\[A-Za-z0-9\\ _.-]{2,120}|\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b
  keywords:
  - id: Keyword_insider_threat_context
    groups:
    - match_style: word
      terms:
      - exfiltration
      - after hours
      - resignation
      - disciplinary
      - DLP alert
      - removable media
      - personal email
      - personal cloud
      - text: HR
        case_sensitive: true
      - privileged access
    strength: specific
  - id: Keyword_insider_threat_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires insider-threat investigation wording plus populated subject/case fields or user-activity artefacts before enforcing. A genuine file can expose allegations, monitored activity, evidence, identities, employment actions, and investigative methods, causing reputational, employment, privacy, and security harm if disclosed. The normal scale is one subject or a small group plus investigators and affected systems, while policy documents and generic HR or security training can trigger topic phrases. Risk 8 SENSITIVE reflects serious contained personal and operational harm; PROTECTED would require exceptional protected operations or significant irreversible consequences.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
