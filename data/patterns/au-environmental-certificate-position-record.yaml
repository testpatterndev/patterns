changelog:
  - version: 1.0.0
    date: '2026-10-23'
    description: >-
      Initial release from public Clean Energy Regulator sources (REC Registry API specification; published accredited
      power station list for the accreditation code format). LGC / STC / ACCU position, liability, inventory and
      registry transaction records; 75 needs a certificate quantity, or an accreditation code with an independent
      registry or liability term; 85 needs two quantities plus a code or independent term. Serial numbers, small-scale
      unit identifiers and ACCU identifiers are not matched because no public source confirms their format.
