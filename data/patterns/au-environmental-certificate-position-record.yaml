schema: testpattern/v1
name: Australian Environmental Certificate Position, Liability and Registry Records (LGC / STC / ACCU)
slug: au-environmental-certificate-position-record
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  An organisation's own environmental certificate records under the Renewable Energy Target and the carbon crediting
  schemes: LGC and STC position and liability reports (holdings against the surrender obligation set by the renewable
  power percentage or small-scale technology percentage), REC Registry transaction, transfer and surrender records,
  certificate inventory against forecast creation or surrender, and ACCU / Safeguard Mechanism credit holdings. Held
  by generators, retailers, gentailers and other liable entities. Public material (CER Quarterly Carbon Market
  Report, the REC Registry public register, the published list of accredited power stations, media releases and
  annual reports) is excluded.
operation: >-
  Primary: certificate vocabulary - LGC / STC / ACCU / REC / certificate followed by position, liability, inventory,
  holdings, balance, shortfall, forecast, surrender, transfer, register, ledger, obligation or portfolio; the full
  certificate names; REC Registry; ANREU; renewable power percentage; small-scale technology percentage; energy
  acquisition statement; surrender offer; STC clearing house. 75 needs, within 300 characters, a certificate quantity
  (a number followed by LGCs / STCs / ACCUs / SMCs / certificates, or a certificate type followed on the same line by
  the first comma-grouped number after it, with no other digits between), or an accreditation code together with an
  independent registry or liability term. 85
  needs two distinct quantities plus an accreditation code or an independent term (liable entity, shortfall charge,
  RPP, STP, vintage, forward purchase, counterparty, Pending surrender / transfer / audit, required surrender).
  Accreditation codes follow the CER format seen across the 3,432 codes in its published accredited power station
  list: a four-character fuel prefix (SRPV, SRPX, SRPY, SRPB, SRWD, SRTH, SPRV, WD00, HY00, HYMI, HYMC, BEBG, BEBM,
  BEBL, BEMW, WCMG), a two-letter state (NS, VC, QL, SA, WA, TA, NT, AC) and two sequence characters. Every tier
  excludes template text and public sources. 65 is discovery-only.
pattern: >-
  (?i)\b(?:(?:LGC|STC|ACCU|REC|certificate)s?\s+(?:position|liability|liabilities|inventory|holdings?|balance|shortfall|forecast|surrender|transfer|register|ledger|obligation|portfolio)|large-scale\s+generation\s+certificates?|small-scale\s+technology\s+certificates?|Australian\s+carbon\s+credit\s+units?|safeguard\s+mechanism\s+credit\s+units?|REC\s+Registry|ANREU|renewable\s+power\s+percentage|small-scale\s+technology\s+percentage|energy\s+acquisition\s+statement|(?:LGC|STC|voluntary)\s+surrender\s+offer|STC\s+clearing\s+house)\b
confidence: medium
confidence_justification: >-
  Medium. Certificate type, status and action vocabulary comes from the CER REC Registry API specification, and the
  accreditation code format was derived from the CER's published accredited power station list (3,432 codes, three
  shapes, 16 fuel prefixes, eight state codes). Accreditation codes are public register values, so they only
  corroborate. No public source confirms a format for certificate serial numbers (the API types them as bare
  integers), small-scale unit identifiers or ACCU / ANREU unit and project identifiers, so none of these is matched:
  STC and ACCU records rely on vocabulary and quantity structure only. 85/75 are heuristic evidence tiers, not
  measured accuracy.
jurisdictions:
  - au
regulations:
  - Renewable Energy (Electricity) Act 2000 (Cth)
  - Carbon Credits (Carbon Farming Initiative) Act 2011 (Cth)
  - National Greenhouse and Energy Reporting Act 2007 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - energy-market
  - trading
  - financial
corroborative_evidence:
  keywords:
    - liable entity
    - shortfall charge
    - RPP
    - STP
    - vintage
    - forward purchase
    - counterparty
    - required surrender
    - Pending surrender
    - Pending transfer
  proximity: 300
scope: narrow
risk_rating: 7
risk_description: >-
  A certificate position or liability report shows how many LGCs, STCs or ACCUs an organisation holds, owes and still
  has to buy or create, by vintage and surrender period, often with forward purchases, counterparties and prices.
  Counterparties and competitors holding it can price the remaining shortfall against the owner, and it reveals
  renewable offtake and compliance strategy. Individual REC Registry transfers are public, but the aggregated
  position, forecast and prices are not. Risk 7, matching au-forward-curve-artefact; below the hedge book because the
  certificate market is smaller and the scheme percentages are public.
references:
  - title: Clean Energy Regulator - REC Registry API specifications (certificate types, actions, statuses, attributes)
    url: https://cer.gov.au/document/rec-registry-api-specifications
  - title: Clean Energy Regulator - Historical large-scale renewable energy supply data (accredited power stations and accreditation codes)
    url: https://cer.gov.au/markets/reports-and-data/large-scale-renewable-energy-data/historical-large-scale-renewable-energy-supply-data
  - title: Renewable Energy (Electricity) Act 2000 (Cth)
    url: https://www.legislation.gov.au/C2004A00767/latest/text
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  idcf: DSL-3
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Financial and Medium because a certificate
    position or liability report reveals holdings, the outstanding surrender obligation, forward purchases and prices
    that counterparties could trade against. PROTECTED is not met: the harm is commercial and confined to one
    organisation.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Medium Financial handling protects an organisation's certificate holdings, shortfall and purchasing position.
      High is not met because registry transfers and scheme percentages are public and the damage stays commercial.
package_tags:
  primary_component: energy-generation-market
  components:
    - energy-generation-market
  component_tier: small
  deployment_priority:
    - standard
    - expanded
  sectors:
    - critical-infrastructure
  addons:
    - energy-utility
  label_domains:
    - financial
    - business
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_env_cert_primary
      matches:
        - ref: Regex_env_cert_quantity
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 1
          refs:
            - Regex_env_cert_accreditation_code
            - Keyword_env_cert_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_env_cert_public_exclusion
    - confidence_level: 75
      id_match: Regex_env_cert_primary
      matches:
        - ref: Regex_env_cert_quantity
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_env_cert_public_exclusion
    - confidence_level: 75
      id_match: Regex_env_cert_primary
      matches:
        - ref: Regex_env_cert_accreditation_code
        - ref: Keyword_env_cert_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_env_cert_public_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_env_cert_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_env_cert_public_exclusion
  regexes:
    - id: Regex_env_cert_primary
      pattern: >-
        (?i)\b(?:(?:LGC|STC|ACCU|REC|certificate)s?\s+(?:position|liability|liabilities|inventory|holdings?|balance|shortfall|forecast|surrender|transfer|register|ledger|obligation|portfolio)|large-scale\s+generation\s+certificates?|small-scale\s+technology\s+certificates?|Australian\s+carbon\s+credit\s+units?|safeguard\s+mechanism\s+credit\s+units?|REC\s+Registry|ANREU|renewable\s+power\s+percentage|small-scale\s+technology\s+percentage|energy\s+acquisition\s+statement|(?:LGC|STC|voluntary)\s+surrender\s+offer|STC\s+clearing\s+house)\b
    - id: Regex_env_cert_quantity
      pattern: >-
        (?<![\d.,])\b(?:\d{1,3}(?:,\d{3}){1,3}|\d{1,3}|\d{5,7})\s?(?:LGCs?|STCs?|ACCUs?|SMCs?|certificates)\b|\b(?:LGCs?|STCs?|ACCUs?)\b[^\r\n\d]{0,60}(?<![\d.,])\d{1,3}(?:,\d{3}){1,3}\b
    - id: Regex_env_cert_accreditation_code
      pattern: >-
        \b(?:SRP[VXYB]|SRWD|SRTH|SPRV|WD00|WDOO|HY00|HYM[IC]|BEB[GML]|BEMW|WCMG)(?:NS|VC|QL|SA|WA|TA|NT|AC)[A-Z0-9][0-9]\b
  keywords:
    - id: Keyword_env_cert_evidence
      groups:
        - match_style: word
          terms:
            - liable entity
            - liable entities
            - shortfall charge
            - text: RPP
              case_sensitive: true
            - text: STP
              case_sensitive: true
            - vintage
            - forward purchase
            - forward purchases
            - counterparty
            - required surrender
            - Pending surrender
            - Pending transfer
            - Pending audit
            - registered person
      strength: specific
    - id: Keyword_env_cert_public_exclusion
      groups:
        - match_style: word
          terms:
            - Quarterly Carbon Market Report
            - Carbon Market Report
            - public register
            - accredited power stations
            - media release
            - annual report
            - fact sheet
            - notes to the financial statements
      strength: specific
test_cases:
  should_match:
    - value: "LGC position and liability - compliance year 2026 (internal)\nOpening holdings: 412,500 LGCs\nRequired surrender (RPP 18.96%): 655,000 LGCs\nForward purchases contracted: 150,000 LGCs, counterparty Example Wind Pty Ltd\nShortfall to cover: 92,500 LGCs"
      description: Position and liability report with several quantities, RPP and forward purchases - intended 85
      synthetic: true
    - value: "STC liability forecast Q3-27: estimated 1,240,000 STCs at the published STP; clearing house exposure under review."
      description: STC liability forecast with one quantity, no identifier - intended 75
      synthetic: true
    - value: "REC Registry transfer offer: 25,000 LGCs from accreditation code SRPYAC98, vintage 2025, status Pending transfer."
      description: Registry transfer record with quantity, accreditation code and status - intended 75 (one quantity only)
      synthetic: true
    - value: "ACCU holdings register\nANREU account balance: 48,200 ACCUs (vintage 2024-25)\nSafeguard surrender planned: 30,000 ACCUs"
      description: ACCU holdings with two quantities and vintage - intended 85
      synthetic: true
    - value: "Certificate inventory vs forecast creation: WD00SA98 Q1 LGCs created 8,410; Q2 LGCs forecast 11,250; registered person to confirm."
      description: Inventory against forecast with accreditation code and two type-then-number rows - intended 85
      synthetic: true
  should_not_match:
    - value: "Quarterly Carbon Market Report - March 2026: about 9.1 million large-scale generation certificates were surrendered for the 2025 compliance year."
      description: CER Quarterly Carbon Market Report (public)
    - value: "Historical accredited power stations: SRPYAC98 Example Solar Farm - Solar - ACT - baseline 0 MWh; WD00SA98 Example Wind Farm - Wind - SA."
      description: Public accredited power station list (accreditation codes are public register values)
    - value: "LGC position template\nOpening holdings: [number] LGCs\nRequired surrender: [number]\nUse this template for the quarterly report."
      description: Blank position template
    - value: "Attach the certificate of currency to the contract register before the transfer is approved."
      description: Generic certificate / register wording without environmental certificate vocabulary
false_positives:
  - description: CER Quarterly Carbon Market Report, the REC Registry public register and its API, and the published list
      of accredited power stations quote certificate volumes and accreditation codes.
    mitigation: Public-source terms are excluded within the proximity window at every tier, and accreditation codes
      never enforce on their own.
  - description: Generic "certificate register" or "certificate transfer" wording (shares, insurance, training).
    mitigation: Enforce tiers need a certificate quantity in LGCs / STCs / ACCUs / SMCs / certificates, or an
      accreditation code with an independent registry or liability term.
  - description: Year-like numbers before a certificate type (for example "2026 LGCs" meaning vintage).
    mitigation: Four-digit bare numbers are not counted as quantities; comma-grouped, 1-3 digit and 5-7 digit numbers
      are.
exports:
  - purview_xml
  - yaml
