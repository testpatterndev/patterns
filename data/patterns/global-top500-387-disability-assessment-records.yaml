schema: testpattern/v1
name: Disability assessment records
slug: global-top500-387-disability-assessment-records
version: 1.4.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies individual disability assessment records - disability and functional capacity assessments, NDIS access requests, disability support pension impairment assessments and standardised functional assessment reports - when the phrase sits with populated person identifiers and assessment fields. Health and disability information under applicable privacy law.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: disability assessment (record/report), functional capacity (assessment), functional assessment, NDIS access request, access request form, disability support pension claim/assessment, impairment rating/tables, WHODAS, Vineland, care needs assessment. 65 (discovery only): phrase alone. 75: phrase plus a populated person identifier field (name, DOB, Medicare, CRN, NDIS number, participant ID, patient/client number). 85: identifier field plus a populated assessment field (primary disability, diagnosis, impairment rating, assessor, assessment date or tool, functional domain, support needs, score) plus independent allied-health/support evidence. Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:disability\s+assessment(?:\s+(?:records?|reports?))?|functional\s+(?:capacity(?:\s+assessment)?|assessment)|NDIS\s+access\s+request|access\s+request\s+form|disability\s+support\s+pension\s+(?:claim|assessment)|impairment\s+(?:rating|tables?)|WHODAS|care\s+needs\s+assessment)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated person identifier; 85 also needs an assessment field and allied-health or support evidence. Scheme guidance, provider brochures and policy text carry the phrases without a person record and stay at 65.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - National Disability Insurance Scheme Act 2013 (Cth)
  - Information Privacy Act 2009 (Qld)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - government-id
  - pii
corroborative_evidence:
  keywords:
    - occupational therapist
    - physiotherapist
    - speech pathologist
    - activities of daily living
    - assistive technology
    - personal care
  proximity: 300
test_cases:
  should_match:
    - value: "FUNCTIONAL CAPACITY ASSESSMENT REPORT\nParticipant name: Jordan Whitlock\nNDIS number: 430118274\nDate of birth: 09/09/1979\nPrimary disability: Acquired brain injury\nAssessor: Priya Ramanathan, occupational therapist\nAssessment date: 18/08/2026\nFindings: needs support with activities of daily living and assistive technology for mobility."
      description: Populated functional capacity assessment with person, assessment fields and allied-health evidence (85)
      synthetic: true
    - value: "NDIS access request - supporting evidence\nName: Casey Rourke\nCRN: 204889137K\nTreating GP letter to follow."
      description: Access request with labelled person identifiers only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "welfare registry"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how disability assessment records are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Functional capacity assessment\nParticipant name: ____________________\nNDIS number: ____________________\nPrimary disability: ____________________\nAssessor: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "News: a new independent functional assessment model was trialled this year, with advocates warning that WHODAS scores alone cannot capture support needs for people with psychosocial disability."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
  - description: Common words and phrases related to disability assessment records appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_disability_assessment
      matches:
        - ref: Regex_global_top500_387_disability_assessment_records_person_fields
        - ref: Regex_global_top500_387_disability_assessment_records_assessment_fields
        - ref: Keyword_global_top500_387_disability_assessment_records_support_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_387_disability_assessment_records_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_disability_assessment
      matches:
        - ref: Regex_global_top500_387_disability_assessment_records_person_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_387_disability_assessment_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_disability_assessment
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_disability_assessment
      pattern: (?i)\b(?:disability\s+assessment(?:\s+(?:records?|reports?))?|functional\s+(?:capacity(?:\s+assessment)?|assessment)|NDIS\s+access\s+request|access\s+request\s+form|disability\s+support\s+pension\s+(?:claim|assessment)|impairment\s+(?:rating|tables?)|WHODAS|care\s+needs\s+assessment)\b
    - id: Regex_global_top500_387_disability_assessment_records_person_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|patient(?:\s+name)?|URN|UR\s*(?:no\.?|number)|MRN|medical\s+record\s+(?:no\.?|number)|Medicare(?:\s+(?:card\s+)?(?:no\.?|number))?|IHI|DVA\s+(?:no\.?|number)|(?:patient|client|hospital|case|file|episode)\s*(?:no\.?|number|ID)|(?:referring|treating|requesting)\s+(?:doctor|practitioner|clinician|psychiatrist)|clinician|consultant|NDIS\s*(?:no\.?|number)|participant(?:\s+name)?|participant\s*(?:no\.?|number|ID)|CRN|customer\s+reference\s+number)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_387_disability_assessment_records_assessment_fields
      pattern: (?i)\b(?:primary\s+disability|disability|diagnosis|impairment(?:\s+rating)?|assessor|assessment\s+date|date\s+of\s+assessment|assessment\s+tool|functional\s+domain|mobility|self-care|communication|social\s+interaction|support\s+needs|score)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_387_disability_assessment_records_support_evidence
      groups:
        - match_style: word
          terms:
            - occupational therapist
            - physiotherapist
            - speech pathologist
            - psychologist
            - activities of daily living
            - assistive technology
            - reasonable and necessary
            - mobility aid
            - personal care
            - home modifications
      strength: specific
    - id: Keyword_global_top500_387_disability_assessment_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
risk_description: >-
  The detector identifies disability and functional capacity assessments, NDIS access requests and impairment assessments and enforces only when populated person identifier fields sit nearby; phrase-only text stays at 65 discovery. A genuine assessment can expose diagnoses or inferred conditions, daily limitations, clinician judgments, support eligibility, family circumstances, and requested accommodations, enabling stigma, benefit fraud, discrimination, or denial of opportunity. The normal record concerns one person rather than a disability-services register, so the impact is serious and individual but contained. Risk 8 and SENSITIVE are justified; PROTECTED would require bulk vulnerable-person assessments, coercive control, or compromise causing significant irreversible harm.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 is consistent with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and Personal-Privacy because a functional
    assessment exposes consequential health and capability information about an identifiable person. PROTECTED is not
    met by a normal single-person assessment absent bulk clinical exposure, life-safety implications, or widespread
    irreversible discrimination.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Disability assessment content is generically Medium with Medium Personal-Privacy controls because it supports
      consequential judgments about an individual's health, capacity, and access to support.
