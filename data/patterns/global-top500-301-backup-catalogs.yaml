schema: testpattern/v1
name: Backup catalogs
slug: global-top500-301-backup-catalogs
version: 1.4.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects backup catalogs and job reports: backup catalog/index wording with populated job, client, media and retention fields plus barcodes, paths, sizes or hosts. Topic wording alone is discovery-only.
operation: >-
  Regex_backup_catalog_primary (backup catalog/index/inventory/job report wording or named backup product catalog) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated job field (job name/ID, client, backup server/set, policy, media/tape ID, repository, retention, restore point) or a backup artefact (LTO barcode, UNC path, GB/TB size, internal hostname, IPv4). 85 requires a populated job field (job name/ID, client, backup server/set, policy, media/tape ID, repository, retention, restore point) (two distinct hits), a backup artefact (LTO barcode, UNC path, GB/TB size, internal hostname, IPv4), and independent backup-type (full/incremental, offsite, immutable, air-gapped, tape) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_backup_catalog_guidance_exclusion).
pattern: >-
  (?i)\b(?:backup\s+(?:catalog(?:ue)?s?|index|inventory|job\s+(?:report|history|log))|media\s+(?:catalog|inventory)|restore\s+point\s+(?:list|catalog)|(?:Veeam|Commvault|NetBackup|Rubrik|Cohesity)\s+(?:catalog|job|report))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated job field (job name/ID, client, backup server/set, policy, media/tape ID, repository, retention, restore point) or a backup artefact (LTO barcode, UNC path, GB/TB size, internal hostname, IPv4)), and 85 needs two distinct structures plus independent backup-type (full/incremental, offsite, immutable, air-gapped, tape) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Security of Critical Infrastructure Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - full backup
  - incremental
  - differential
  - offsite
  - immutable
  - air-gapped
  - deduplication
  - encryption
  - vault
  - tape
  proximity: 300
test_cases:
  should_match:
  - value: The backup catalog must be rebuilt after the media server upgrade.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      Veeam job report
      Job name: FIN-SQL-Nightly
      Repository: REPO-SYD-02
    description: Medium-tier probe (75) - populated job fields
    synthetic: true
  - value: |-
      Backup catalog export - media server bkp01.harbour.internal
      Job name: FIN-SQL-Nightly
      Client: sql-fin-01
      Tape barcode: HB0412L8
      Retention: 35 days
      Size: 412.6 GB, incremental; weekly full backup copied offsite to the immutable vault.
    description: High-tier probe (85) - several job fields, barcode/size/host artefacts, backup-type context
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: the backup catalog is reviewed monthly and retention follows the records schedule.'
    description: Policy text
    synthetic: true
  - value: |-
      Backup catalog template
      Job name: ________
      Client: [insert]
    description: Blank template
    synthetic: true
  - value: 'Course module 6: reading a NetBackup job report - Job name: TEST-01, Size: 10 GB.'
    description: Training framing
    synthetic: true
false_positives:
- description: Backup product documentation shows job fields.
  mitigation: Fields must be populated; guidance/training framing is excluded.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_backup_catalog_primary
    matches:
    - ref: Regex_backup_catalog_job_field
      min_count: 2
      unique_results: true
    - ref: Regex_backup_catalog_backup_artefact
    - ref: Keyword_backup_catalog_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_backup_catalog_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_backup_catalog_primary
    matches:
    - type: any
      refs:
      - Regex_backup_catalog_job_field
      - Regex_backup_catalog_backup_artefact
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_backup_catalog_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_backup_catalog_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_backup_catalog_primary
    pattern: >-
      (?i)\b(?:backup\s+(?:catalog(?:ue)?s?|index|inventory|job\s+(?:report|history|log))|media\s+(?:catalog|inventory)|restore\s+point\s+(?:list|catalog)|(?:Veeam|Commvault|NetBackup|Rubrik|Cohesity)\s+(?:catalog|job|report))\b
  - id: Regex_backup_catalog_job_field
    pattern: >-
      (?i)\b(?:job\s+(?:name|ID)|client|backup\s+(?:server|set|ID|type)|policy|schedule|media\s+(?:ID|label|server)|tape\s+(?:ID|barcode|label)|repository|retention|expir(?:y|es|ation)|restore\s+point|protected\s+(?:host|VM))\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  - id: Regex_backup_catalog_backup_artefact
    pattern: >-
      (?i)\b[A-Z0-9]{6}L[5-9]\b|\\\\[A-Za-z0-9._-]{2,63}\\[A-Za-z0-9$._\\ -]{2,120}|\b\d{1,5}(?:\.\d{1,2})?\s?(?:GB|TB)\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b
  keywords:
  - id: Keyword_backup_catalog_context
    groups:
    - match_style: word
      terms:
      - full backup
      - incremental
      - differential
      - offsite
      - immutable
      - air-gapped
      - deduplication
      - encryption
      - vault
      - tape
    strength: specific
  - id: Keyword_backup_catalog_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires backup-catalog wording plus populated job/media fields or backup artefacts before enforcing. A real catalog can identify protected systems, copy locations, restore coverage, retention gaps, and recovery points, helping ransomware operators target recovery capability or exposing operational architecture. The affected scope is the systems represented in one backup estate and their service owners, while product documentation and policy discussion can match without live inventory detail. Risk 8 SENSITIVE reflects serious contained resilience exposure; PROTECTED would require critical-service backups or evidence that release would enable significant organisational damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because an operational backup
    catalog reveals recovery assets and gaps that can materially assist disruption. PROTECTED is not met by the topic
    match because catalog completeness, system criticality, access paths, and significant broad consequence are
    unproven.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic handling is Medium with Medium InfoTech controls for backup catalogs, restricting system names, locations,
      retention, and restore-point data. High is reserved for critical-service or enterprise-wide recovery inventories
      whose compromise would create significant damage.
