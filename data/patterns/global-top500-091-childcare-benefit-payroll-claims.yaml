schema: testpattern/v1
name: Childcare benefit payroll claims
slug: global-top500-091-childcare-benefit-payroll-claims
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects employee childcare benefit claims processed through payroll: childcare salary packaging and reimbursement claims, employer-sponsored childcare applications and dependent care FSA reimbursements, with the child or provider details and claimed amounts.
operation: >-
  Primary: a childcare benefit phrase (childcare benefit/reimbursement/salary packaging/voucher, salary-packaged childcare, employer-provided/sponsored childcare, dependent care assistance/FSA/reimbursement, Child Care Subsidy). Generic "benefit claim", "parental benefit", "family benefit" and "salary packaging" alone were removed. 75 tier requires a populated person field (employee/staff name or number, payroll number, payee) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated claim detail (child's name or date of birth, provider/service name or approval number, or an amount claimed/fees paid) and an independent corroborative term (salary packaging, pre-tax, FBT, fringe benefits, receipt, tax invoice, enrolment, approved provider). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:child\s*care\s+benefit\s+payroll\s+claims?|child\s*care\s+(?:benefits?|reimbursements?|salary\s+packaging|vouchers?)|salary\s+packag(?:ing|ed)\s+child\s*care|employer[\s-](?:provided|sponsored|funded)\s+child\s*care|dependent\s+care\s+(?:assistance|FSA|account|reimbursement)|Child\s+Care\s+Subsidy)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - global
regulations:
  - Fringe Benefits Tax Assessment Act 1986 (Cth)
  - A New Tax System (Family Assistance) Act 1999 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - employment
  - pii
corroborative_evidence:
  keywords:
    - salary packaging
    - pre-tax
    - FBT
    - fringe benefits
    - receipt
    - tax invoice
    - enrolment
    - approved provider
  proximity: 300
test_cases:
  should_match:
    - value: "Childcare salary packaging claim\nEmployee name: Avery Teston\nEmployee ID: 4471820\nChild's name: Sam Teston\nProvider name: Little Wattle Early Learning\nAmount claimed: $1,240.00\nTax invoice from the approved provider attached; pre-tax deduction via payroll."
      description: "85: childcare salary packaging claim with employee, child's name, provider and amount"
      synthetic: true
    - value: "Dependent care FSA reimbursement request\nEmployee: Morgan Teston\nProvider name: Bright Days Center\nFees paid: $860.00\nReceipt attached."
      description: "85: dependent care FSA reimbursement with employee, fees and receipt"
      synthetic: true
    - value: "Employer-sponsored childcare benefit application\nStaff member: Jordan Staffson\nPlease advise which centres are included in the scheme."
      description: "75: employer-sponsored childcare application naming the staff member, no detail"
      synthetic: true
    - value: "childcare reimbursement"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "Child Care Subsidy helps families with the cost of approved child care. This fact sheet explains how to claim."
      description: "Government-style guidance - must stay at or below 65"
    - value: "Childcare salary packaging claim\nEmployee name: __________\nChild's name: __________\nAmount claimed: $______"
      description: "Blank claim form - must stay at or below 65"
    - value: "Offer childcare benefits to your staff through our salary packaging platform. Book a demo."
      description: "Vendor marketing - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Childcare centre invoices without an employee context."
    mitigation: "The primary requires a childcare benefit/packaging phrase and 75 requires a populated employee field."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_091_childcare_benefit_payroll_claims_primary
      matches:
        - ref: Regex_top500_091_childcare_benefit_payroll_claims_person_field
        - ref: Regex_top500_091_childcare_benefit_payroll_claims_claim_detail
        - ref: Keyword_top500_091_childcare_benefit_payroll_claims_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_091_childcare_benefit_payroll_claims_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_091_childcare_benefit_payroll_claims_primary
      matches:
        - ref: Regex_top500_091_childcare_benefit_payroll_claims_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_091_childcare_benefit_payroll_claims_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_091_childcare_benefit_payroll_claims_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_091_childcare_benefit_payroll_claims_primary
      pattern: >-
        (?i)\b(?:child\s*care\s+benefit\s+payroll\s+claims?|child\s*care\s+(?:benefits?|reimbursements?|salary\s+packaging|vouchers?)|salary\s+packag(?:ing|ed)\s+child\s*care|employer[\s-](?:provided|sponsored|funded)\s+child\s*care|dependent\s+care\s+(?:assistance|FSA|account|reimbursement)|Child\s+Care\s+Subsidy)\b
    - id: Regex_top500_091_childcare_benefit_payroll_claims_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_091_childcare_benefit_payroll_claims_claim_detail
      pattern: >-
        (?i)\b(?:child(?:'s)?\s+(?:name|full\s+name|date\s+of\s+birth|DOB)|(?:child\s*care\s+|dependent\s+care\s+)?(?:provider|service|centre|center)\s+(?:name|approval\s+number))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}|\b(?:amount\s+(?:claimed|reimbursed|packaged)|fees?\s+(?:paid|claimed)|claim\s+amount|reimbursement\s+amount|(?:weekly|daily|session)\s+fee|gap\s+fee)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?
  keywords:
    - id: Keyword_top500_091_childcare_benefit_payroll_claims_corroborative
      groups:
        - match_style: word
          terms:
            - salary packaging
            - pre-tax
            - text: FBT
              case_sensitive: true
            - fringe benefits
            - receipt
            - tax invoice
            - enrolment
            - approved provider
      strength: specific
    - id: Keyword_top500_091_childcare_benefit_payroll_claims_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - helps families
            - you may be eligible
            - how to claim
            - book a demo
            - free trial
      strength: domain
risk_description: >-
  The classifier identifies childcare benefit claims for an identified employee (75) with child, provider or amount details (85). These reveal children's names and care arrangements, family circumstances and remuneration. Guidance, blank forms and marketing stay at 65. Risk 7 supports SENSITIVE Financial (OFFICIAL: Sensitive).
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: "ATO - Fringe benefits tax"
    url: https://www.ato.gov.au/businesses-and-organisations/hiring-and-paying-your-workers/fringe-benefits-tax
  - title: "Services Australia - Child Care Subsidy"
    url: https://www.servicesaustralia.gov.au/child-care-subsidy
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
