schema: testpattern/v1
name: Graduation, Award Conferral and Completion Record
slug: au-education-graduation-completion-record
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Populated records that a named or numbered learner has completed a course or been awarded a
  qualification: graduand and graduation lists and registers, graduation eligibility and clearance
  records, conferral lists and schedules, testamur and parchment registers, replacement and reprint
  requests, the Australian Higher Education Graduation Statement (AHEGS), VET statements of
  attainment and qualification issuance records, course completion letters, and Queensland senior
  school records (QCE, QCIA and the Senior Statement). They tie a learner (often with a student
  number, date of birth, USI or LUI) to an award and usually a conferral, completion or issue date or a
  certificate number. Boundary: global-top500-343-academic-transcripts covers results histories and
  academic transcripts; this classifier covers completion and award records, which often reach
  people outside the institution (employers, verification services, ceremony contractors).
  Published ceremony programmes and graduate lists without labelled fields stay at discovery.
operation: >-
  Primary: graduation or graduating list / register / roll / candidates / eligibility / clearance /
  application / record / ceremony list, register, order, seating, booking or attendees, graduand(s)
  (list), list of graduates, conferral list / register / schedule / of awards, award conferral,
  testamur (register, reprint, replacement, request, record), parchment register / reprint /
  replacement / request, AHEGS or Australian Higher Education Graduation Statement, statement of
  attainment, qualification issued / completion / issuance, certification register or documentation,
  (course) completion letter or statement, Queensland Certificate of Education or of Individual
  Achievement, QCE, QCIA, Senior Statement, eligibility to graduate. 65 (discovery only): primary
  alone, which surfaces ceremony information pages, programmes and newsletters. 75: primary plus a
  populated learner field (student, learner, graduand, graduate, candidate or recipient name / ID /
  number, name, full name, surname, given names, date of birth, USI, LUI, EQ ID) plus a populated award
  field (award, degree awarded, qualification, course, program, certificate, major, honours, units
  completed, learning account). 85: the 75 evidence plus a populated conferral, completion or issue
  date, a certificate, statement or serial number, or award evidence (in absentia, conferred, academic
  dress, seat number, Chancellor, Registrar, AQF level, RTO code, QCAA, with distinction, honours class).
  Table path: primary plus a header with a learner column and an award column and a delimited award
  title cell (Bachelor, Master, Doctor, Diploma, Graduate Certificate, Certificate I-IV, QCE ...) reaches
  75. Enforce tiers exclude policy, procedure, information page, FAQ, ceremony order of proceedings and
  news framing.
pattern: >-
  (?i)\b(?:graduat(?:ion|ing)[ \t]+(?:lists?|registers?|roll|candidates?|eligibility|clearance|applications?|records?|ceremony[ \t]+(?:lists?|registers?|order|seating|bookings?|attendees?))|graduands?(?:[ \t]+lists?)?|lists?[ \t]+of[ \t]+graduates|conferral[ \t]+(?:lists?|registers?|schedule|of[ \t]+awards?)|award[ \t]+conferral|testamurs?(?:[ \t]+(?:register|reprint|replacement|request|record))?|parchment[ \t]+(?:register|reprint|replacement|request)|AHEGS|Australian[ \t]+Higher[ \t]+Education[ \t]+Graduation[ \t]+Statement|statements?[ \t]+of[ \t]+attainment|qualification[ \t]+(?:issued|completion|issuance)|certification[ \t]+(?:register|documentation)|(?:course[ \t]+)?completion[ \t]+(?:letter|statement)|Queensland[ \t]+Certificate[ \t]+of[ \t]+(?:Education|Individual[ \t]+Achievement)|QCE|QCIA|Senior[ \t]+Statement|eligibility[ \t]+to[ \t]+graduate)\b
confidence: medium
confidence_justification: >-
  Medium: graduation, conferral, testamur, AHEGS, statement of attainment and QCE terms are standard
  across universities, RTOs, TAFE and Queensland schools, and enforce tiers need a populated learner
  field with a populated award, or a learner and award table, which ceremony information pages,
  programmes and newsletters lack. Field labels are matched by wording only, so an unusual registry
  export may stay at 65, and printed programmes that list names under degree headings are not
  recognised. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - au-qld
regulations:
  - Higher Education Support Act 2003 (Cth)
  - National Vocational Education and Training Regulator Act 2011 (Cth)
  - Education (Queensland Curriculum and Assessment Authority) Act 2014 (Qld)
  - Student Identifiers Act 2014 (Cth)
  - Information Privacy Act 2009 (Qld)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - education
  - pii
corroborative_evidence:
  keywords:
    - conferral date
    - date conferred
    - degree awarded
    - testamur
    - in absentia
    - statement of attainment
    - USI
  proximity: 300
scope: narrow
risk_rating: 6
risk_description: >-
  The classifier recognises completion and award records and enforces only when a populated learner
  field sits with a populated award, with 85 also needing a conferral, completion or issue date, a
  certificate number or award evidence. A single record discloses that a named person holds, or has
  not yet completed, a qualification, often with a student number, date of birth, USI or LUI, and a
  testamur or statement register gives the certificate numbers used to verify qualifications, so a
  leaked register supports qualification fraud and identity misuse. Award and graduation status is
  less sensitive than results, misconduct or welfare records, and ceremony lists are often published
  with consent, so the harm is contained. Risk 6, one band below the academic transcript classifier.
references:
  - title: Australian Higher Education Graduation Statement (Department of Education)
    url: https://www.education.gov.au/higher-education-publications/australian-higher-education-graduation-statement
  - title: AQF qualifications issuance policy
    url: https://www.aqf.edu.au/framework/aqf-policies
  - title: QCAA Queensland Certificate of Education
    url: https://www.qcaa.qld.edu.au/senior/certificates-and-qualifications/qce
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
classification:
  tier: Medium
  rationale: >-
    Risk 6 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because a
    populated completion or award record ties a named learner and their identifiers to a qualification, and a
    testamur or statement register exposes the certificate numbers used to verify it. PROTECTED is not met: the
    record discloses award status, not results, health, welfare or misconduct, and does not establish bulk
    identifier exposure or significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling protects one learner's identifiers and award details and the certificate
      numbers used for verification. High is not met unless registers are extracted in bulk with dates of birth
      and student identifiers.
package_tags:
  primary_component: student-child-records
  components:
    - student-child-records
  component_tier: large
  deployment_priority:
    - expanded
  sectors:
    - education
  addons: []
  label_domains:
    - education
    - privacy
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_graduation_primary
      matches:
        - ref: Regex_graduation_learner_field
        - ref: Regex_graduation_award_field
        - type: any
          min_matches: 1
          refs:
            - Regex_graduation_conferral_field
            - Keyword_graduation_award_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_graduation_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_graduation_primary
      matches:
        - ref: Regex_graduation_learner_field
        - ref: Regex_graduation_award_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_graduation_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_graduation_primary
      matches:
        - ref: Regex_graduation_table_header
        - ref: Regex_graduation_award_cell
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Regex_graduation_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_graduation_primary
  regexes:
    - id: Regex_graduation_primary
      pattern: >-
        (?i)\b(?:graduat(?:ion|ing)[ \t]+(?:lists?|registers?|roll|candidates?|eligibility|clearance|applications?|records?|ceremony[ \t]+(?:lists?|registers?|order|seating|bookings?|attendees?))|graduands?(?:[ \t]+lists?)?|lists?[ \t]+of[ \t]+graduates|conferral[ \t]+(?:lists?|registers?|schedule|of[ \t]+awards?)|award[ \t]+conferral|testamurs?(?:[ \t]+(?:register|reprint|replacement|request|record))?|parchment[ \t]+(?:register|reprint|replacement|request)|AHEGS|Australian[ \t]+Higher[ \t]+Education[ \t]+Graduation[ \t]+Statement|statements?[ \t]+of[ \t]+attainment|qualification[ \t]+(?:issued|completion|issuance)|certification[ \t]+(?:register|documentation)|(?:course[ \t]+)?completion[ \t]+(?:letter|statement)|Queensland[ \t]+Certificate[ \t]+of[ \t]+(?:Education|Individual[ \t]+Achievement)|QCE|QCIA|Senior[ \t]+Statement|eligibility[ \t]+to[ \t]+graduate)\b
    - id: Regex_graduation_learner_field
      pattern: >-
        (?i)\b(?:(?:student|learner|graduand|graduate|candidate|recipient)(?:[ \t]+(?:full[ \t]+)?(?:name|ID|no\.?|number))?|name|full[ \t]+name|surname|family[ \t]+name|given[ \t]+names?|date[ \t]+of[ \t]+birth|DOB|USI|LUI|EQ[ \t]*ID)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:student|learner|name|id|n/?a|unknown|tbc|tba|withheld|not[ \t]+recorded|enter|insert|write|print|your|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{1,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_graduation_award_field
      pattern: >-
        (?i)\b(?:award(?:[ \t]+(?:title|code|conferred))?|degree(?:[ \t]+awarded)?|qualification(?:[ \t]+(?:code|title|awarded))?|course(?:[ \t]+(?:code|title))?|program(?:me)?(?:[ \t]+(?:code|title))?|certificate|major|honours|units?[ \t]+completed|learning[ \t]+account)[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|unknown|tbc|tba|pending|none|the|a|an|any|all|each|see|refer|enter|insert|write|your)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9&,'./-]{1,40}(?:[ \t]+[A-Za-z0-9&,'./()-]{1,30}){0,8}
    - id: Regex_graduation_conferral_field
      pattern: >-
        (?i)\b(?:(?:conferral|completion|issue|graduation|ceremony|award(?:ed)?)[ \t]+date|date[ \t]+(?:conferred|awarded|issued|of[ \t]+(?:conferral|award|completion|issue))|conferred)[ \t]*[:#][ \t]{0,3}(?:\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/(?:\d{4}|\d{2})|\d{1,2}[ \t]+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}[ \t]+\d{4}|in[ \t]+absentia)|\b(?:certificate|statement|serial)[ \t]+(?:no\.?|number)[ \t]*[:#][ \t]{0,3}[A-Z0-9][A-Z0-9/-]{3,20}\b
    - id: Regex_graduation_table_header
      pattern: >-
        (?i)\b(?:student[ \t]*(?:ID|number|no\.?|name)|graduand|surname|family[ \t]+name|given[ \t]+names?|full[ \t]+name|name|USI|LUI)\b[^\r\n]{0,200}[,\t;|][ \t]*"?(?:award(?:[ \t]+(?:title|code))?|degree|qualification|course|program(?:me)?)\b
    - id: Regex_graduation_award_cell
      pattern: >-
        (?i)[,\t;|][ \t]*"?(?:Bachelor|Master|Doctor(?:ate)?|Advanced[ \t]+Diploma|Diploma|Graduate[ \t]+(?:Certificate|Diploma)|Associate[ \t]+Degree|Certificate[ \t]+(?:I{1,3}|IV)|QCE|QCIA)\b
    - id: Regex_graduation_guidance_exclusion
      pattern: >-
        (?i)\b(?:this[ \t]+(?:policy|procedure|guideline|guide|fact[ \t]?sheet|page|handbook|newsletter)|information[ \t]+for[ \t]+(?:graduates|graduands|students|guests)|frequently[ \t]+asked[ \t]+questions|order[ \t]+of[ \t]+proceedings|how[ \t]+to[ \t]+(?:apply|order|request)|media[ \t]+release|news[ \t]+release|congratulations[ \t]+to)\b
  keywords:
    - id: Keyword_graduation_award_evidence
      groups:
        - match_style: word
          terms:
            - in absentia
            - academic dress
            - seat number
            - Chancellor
            - Registrar
            - AQF level
            - RTO code
            - QCAA
            - with distinction
            - honours class
            - university medal
      strength: specific
test_cases:
  should_match:
    - value: "Testamur replacement request\nStudent number: 10458812\nFull name: Riley Teston\nDate of birth: 04/05/1998\nDegree awarded: Bachelor of Nursing\nConferral date: 15/12/2023"
      description: 85 tier - testamur replacement with student, award and conferral date
      synthetic: true
    - value: "Australian Higher Education Graduation Statement\nGraduate: Casey Teston\nStudent ID: 20231187\nAward: Bachelor of Science (Honours)\nDate conferred: 18 July 2025\nHonours class: First Class"
      description: 85 tier - AHEGS with graduate, award and date conferred
      synthetic: true
    - value: "Statement of attainment\nLearner name: Sam Teston\nUSI: ABCD123456\nUnits completed: HLTAID011 Provide first aid\nDate issued: 03/09/2026\nRTO code: 31982"
      description: 85 tier - VET statement of attainment with learner, USI, units and issue date
      synthetic: true
    - value: "Graduand list - Ceremony 3, 12 December 2026\nStudent ID,Surname,Given names,Award,Conferral date\ns4471902,Teston,Avery,Bachelor of Education (Primary),12/12/2026\ns4471903,Teston,Jordan,Master of Teaching,12/12/2026"
      description: 75 tier - graduand export with learner and award columns and award cells
      synthetic: true
    - value: "QCE eligibility report\nStudent name: Morgan Teston\nLUI: 0123456789\nLearning account: 22 credits banked"
      description: 75 tier - QCE eligibility with student, LUI and learning account
      synthetic: true
    - value: "Graduation clearance\nStudent ID: s4471902\nName: Avery Teston\nProgram: Bachelor of Education\nOutstanding fees: none"
      description: 75 tier - graduation clearance with student and program
      synthetic: true
  should_not_match:
    - value: "Graduation ceremony information for graduands: arrive 60 minutes early, collect your academic dress and seat number at the registration desk. Frequently asked questions are answered below."
      description: Ceremony information page (65 at most)
      synthetic: true
    - value: "Conferral of awards - order of proceedings. Faculty of Education. Bachelor of Education: Avery Teston, Jordan Teston, Riley Teston."
      description: Published ceremony programme (65 at most)
      synthetic: true
    - value: "Certificate of completion\nName: Avery Teston\nCourse: Fire warden refresher\nDate: 10/09/2026"
      description: Staff training completion certificate, not an education award record
      synthetic: true
    - value: "Testamur replacement request\nStudent number: ____________\nFull name: ____________\nDegree awarded: ____________\nConferral date: __/__/____"
      description: Blank testamur replacement form (65 at most)
      synthetic: true
    - value: "Congratulations to our Year 12 students: 98% achieved a QCE this year, and 41 students received a QCIA or a VET qualification."
      description: School newsletter item (65 at most)
      synthetic: true
    - value: "Final inspection and completion certificate\nProperty: 12 Teston Street, Rivergum\nBuilding certifier: Jordan Teston"
      description: Building completion certificate
      synthetic: true
false_positives:
  - description: Graduation ceremony information pages, programmes and orders of proceedings, and school newsletters announcing QCE results.
    mitigation: They lack a populated learner field with an award value, and information, FAQ, order of proceedings and news framing is excluded from enforce tiers.
  - description: Staff training certificates of completion and building completion certificates.
    mitigation: The primary needs an education award phrase; "certificate of completion" and "completion certificate" are not primaries.
  - description: Blank testamur, parchment and graduation application forms.
    mitigation: Field values reject underscores, brackets and placeholder words.
exports:
  - yaml
  - purview
created: '2026-10-22'
updated: '2026-10-22'
author: PVX
license: MIT
changelog:
  - version: 1.0.0
    date: '2026-10-22'
    description: >-
      Initial release from the EDU coverage review: graduation and graduand lists, eligibility and clearance,
      conferral lists, testamur and parchment registers and requests, AHEGS, VET statements of attainment and
      qualification issuance, completion letters, and QCE, QCIA and Senior Statement records. 65 phrase only;
      75 needs a populated learner field and a populated award field, or a learner and award table with
      award cells; 85 adds a conferral, completion or issue date, a certificate number or award evidence.
      Boundary with global-top500-343-academic-transcripts documented.
