schema: testpattern/v1
name: Queensland Revenue Office Notice of Assessment (Transfer Duty, Land Tax, Payroll Tax)
slug: au-qld-revenue-office-notice-of-assessment
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Notices of assessment and reassessment issued by the Queensland Revenue Office (QRO, the Commissioner of State Revenue) for transfer duty and other duties, land tax and payroll tax, including annual payroll tax reconciliation assessments. A notice names the taxpayer (purchaser / transferee, land owner or employer), carries a client, assessment or transaction number and a payment reference, states the amount assessed, interest and due date, and identifies the basis: the property (Queensland lot on plan such as Lot 12 on SP298765, or a title reference) with its dutiable or taxable land value, or the employer's taxable wages. Information obtained under a tax law is confidential under the Taxation Administration Act 2001 (Qld) Part 8. Commonwealth (ATO) notices of assessment use the same title; this SIT needs Queensland revenue context, and global-top500-083-employer-payroll-tax-filings covers generic payroll tax filings.
operation: >-
  Primary: notice of [re]assessment, [re]assessment notice, land tax [re]assessment, [transfer / landholder / vehicle registration] duty [re]assessment, payroll tax [re]assessment, annual [payroll tax] reconciliation return / assessment, statement of land tax / duty assessed. Every enforce tier needs Queensland revenue context within 300 characters (Queensland Revenue Office, Office of State Revenue, Commissioner of State Revenue, QRO, OSR, QRO Online, qro.qld.gov.au, Taxation Administration Act 2001, Duties Act 2001, Land Tax Act 2010, Payroll Tax Act 1971). 65 (discovery only): primary alone. 75: primary plus context plus one of a labelled client / assessment / transaction / lodgement / employer / taxpayer number or payment / duties reference, a labelled amount (amount payable / due / assessed / owing, duty / land tax / payroll tax / tax payable, balance due, unpaid tax interest, penalty tax, amount to pay), an assessment basis (lot on plan, title reference, or taxable / land / site / unimproved / dutiable value, consideration or taxable wages with a dollar amount) or a populated taxpayer field (taxpayer, client name, [registered] owner, transferee, purchaser, employer [name], entity name). 85: primary plus context plus any two of those four. Enforce tiers AND NOT the shared template-exclusion dictionary and a guidance exclusion (frequently asked questions, fact sheet, public ruling, calculator, media release, annual report, how to, learn more, you may be eligible). Field values are placeholder-guarded.
pattern: >-
  (?i)\b(notice\s+of\s+(?:re)?assessment|(?:re)?assessment\s+notice|land\s+tax\s+(?:re)?assessment|(?:(?:transfer|landholder|vehicle\s+registration)\s+)?duty\s+(?:re)?assessment|payroll\s+tax\s+(?:re)?assessment|annual\s+(?:payroll\s+tax\s+)?reconciliation\s+(?:return|assessment)|statement\s+of\s+(?:land\s+tax|duty)\s+assessed)\b
confidence: medium
confidence_justification: >-
  Medium. Assessment titles are shared with the ATO and with QRO's own guidance, so enforce tiers need Queensland revenue context plus a populated assessment field, and guidance framing is excluded. QRO client and assessment number formats are unpublished, so references are label-anchored. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Taxation Administration Act 2001 (Qld)
  - Duties Act 2001 (Qld)
  - Land Tax Act 2010 (Qld)
  - Payroll Tax Act 1971 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - financial
  - government
  - pii
corroborative_evidence:
  keywords:
    - Queensland Revenue Office
    - Commissioner of State Revenue
    - Office of State Revenue
    - Taxation Administration Act 2001
    - Duties Act 2001
    - Land Tax Act 2010
    - Payroll Tax Act 1971
  proximity: 300
test_cases:
  should_match:
    - value: "Queensland Revenue Office\nLand tax assessment notice 2026-27\nClient ID: 40018823\nTaxpayer: Teston Holdings Pty Ltd\nLot 12 on SP298765 - taxable land value: $1,240,000\nLand tax payable: $13,975.00\nDue date: 21/11/2026"
      description: Land tax assessment notice with client ID, taxpayer, lot on plan and amount payable (85 tier)
      synthetic: true
    - value: "Notice of assessment - transfer duty (Duties Act 2001)\nTransaction number: TD-2026-0884123\nTransferee: Casey Teston\nDutiable value: $785,000\nTransfer duty payable: $25,512.50"
      description: Transfer duty notice of assessment with transaction number, transferee, dutiable value and duty payable (85 tier)
      synthetic: true
    - value: "Annual reconciliation return - payroll tax 2025-26 lodged in QRO Online\nEmployer name: Harbourview Teston Services Pty Ltd"
      description: Payroll tax annual reconciliation with employer name only (75 tier)
      synthetic: true
  should_not_match:
    - value: "Australian Taxation Office\nNotice of assessment - year ended 30 June 2026\nTaxpayer: Casey Teston\nAmount payable: $1,204.55"
      description: Commonwealth ATO notice of assessment (no Queensland revenue context, 65 only)
    - value: "Fact sheet: the Queensland Revenue Office issues a land tax assessment notice each year. Learn more about how to read your notice of assessment."
      description: QRO fact sheet (guidance exclusion)
    - value: "Queensland Revenue Office\nLand tax assessment notice\nClient ID: __________\nTaxpayer: __________\nLand tax payable: $________"
      description: Blank assessment form (65 only)
    - value: "The Queensland Revenue Office issued more than 300,000 land tax assessment notices in 2025-26."
      description: Aggregate statistic (65 only)
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
false_positives:
  - description: ATO and other Commonwealth notices of assessment.
    mitigation: Every enforce tier needs Queensland revenue context, so they stay at 65.
  - description: QRO web pages, fact sheets, public rulings and calculators that describe assessment notices.
    mitigation: A guidance exclusion suppresses enforce tiers, and they rarely carry populated assessment fields.
  - description: Conveyancing files and settlement statements that restate a transfer duty assessment.
    mitigation: They are true positives in substance; a duty assessment in a conveyancing file carries the same taxpayer information.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_qro_assessment_primary
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_au_qld_qro_assessment_reference
            - Regex_au_qld_qro_assessment_amount
            - Regex_au_qld_qro_assessment_basis
            - Regex_au_qld_qro_assessment_taxpayer
        - ref: Keyword_au_qld_qro_assessment_revenue_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_qro_assessment_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_qro_assessment_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_qro_assessment_reference
            - Regex_au_qld_qro_assessment_amount
            - Regex_au_qld_qro_assessment_basis
            - Regex_au_qld_qro_assessment_taxpayer
        - ref: Keyword_au_qld_qro_assessment_revenue_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_qro_assessment_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_qro_assessment_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_qro_assessment_primary
      pattern: >-
        (?i)\b(notice\s+of\s+(?:re)?assessment|(?:re)?assessment\s+notice|land\s+tax\s+(?:re)?assessment|(?:(?:transfer|landholder|vehicle\s+registration)\s+)?duty\s+(?:re)?assessment|payroll\s+tax\s+(?:re)?assessment|annual\s+(?:payroll\s+tax\s+)?reconciliation\s+(?:return|assessment)|statement\s+of\s+(?:land\s+tax|duty)\s+assessed)\b
    - id: Regex_au_qld_qro_assessment_reference
      pattern: >-
        (?i)\b((?:client\s+(?:ID|no\.?|number|reference)|assessment\s+(?:ID|no\.?|number)|transaction\s+(?:ID|no\.?|number)|lodgement\s+(?:ID|no\.?|number)|employer\s+(?:ID|no\.?|number)|taxpayer\s+(?:ID|no\.?|number)|payment\s+reference(?:\s+number)?|duties\s+(?:reference|ref|file)(?:\s+(?:no\.?|number))?)[ \t]*[:#]?[ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not|none|nil|the|see|refer)\b|_{2,}|\[|<)(?=[A-Z0-9/-]{0,10}\d)[A-Z0-9][A-Z0-9/-]{4,20})\b
    - id: Regex_au_qld_qro_assessment_amount
      pattern: >-
        (?i)\b((?:amount\s+(?:payable|due|assessed|owing)|total\s+(?:amount\s+)?(?:payable|assessed|due)|(?:transfer\s+)?duty\s+payable|(?:land|payroll)\s+tax\s+payable|tax\s+payable|balance\s+(?:due|owing)|unpaid\s+tax\s+interest|penalty\s+tax|amount\s+to\s+pay)[ \t]*[:#]?[ \t]{0,5}(?:\$|A\$|AUD)[ \t]?\d{1,3}(?:,\d{3}){0,4}(?:\.\d{2})?)
    - id: Regex_au_qld_qro_assessment_basis
      pattern: >-
        (?i)(\blot\s+\d{1,5}\s+on\s+(?:RP|SP|CP|BUP|GTP|SL|AP|USL|MPH|CROWN)\s?\d{2,7}\b|\btitle\s+reference[ \t]*[:#]?[ \t]{0,5}\d{8}\b|\b(?:taxable\s+(?:land\s+)?value|land\s+value|site\s+value|unimproved\s+value|dutiable\s+value|consideration|(?:total\s+|Australian\s+)?taxable\s+wages)[ \t]*[:#]?[ \t]{0,5}(?:\$|A\$|AUD)[ \t]?\d{1,3}(?:,\d{3}){1,4})
    - id: Regex_au_qld_qro_assessment_taxpayer
      pattern: >-
        (?i)\b((?:taxpayer(?:\s+name)?|client\s+name|(?:registered\s+)?owner|transferee|purchaser|employer(?:\s+name)?|entity\s+name)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not|none|nil|redacted|suppressed|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z&'-]{1,30}(?:[ \t]+[A-Z&][A-Za-z&'-]{0,30}){1,5})
  keywords:
    - id: Keyword_au_qld_qro_assessment_revenue_context
      groups:
        - match_style: word
          terms:
            - Queensland Revenue Office
            - Office of State Revenue
            - Commissioner of State Revenue
            - text: QRO
              case_sensitive: true
            - text: OSR
              case_sensitive: true
            - QRO Online
            - qro.qld.gov.au
            - Taxation Administration Act 2001
            - Duties Act 2001
            - Land Tax Act 2010
            - Payroll Tax Act 1971
      strength: specific
    - id: Keyword_au_qld_qro_assessment_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - frequently asked questions
            - fact sheet
            - public ruling
            - calculator
            - media release
            - annual report
            - how to
            - learn more
            - you may be eligible
      strength: noise
risk_rating: 7
risk_description: >-
  The classifier identifies a Queensland Revenue Office notice of assessment or reassessment for transfer duty, land tax or payroll tax that carries a client, assessment or transaction number, the taxpayer, the amount assessed or the basis (property lot on plan and value, or taxable wages). It exposes an identified person's or business's property holdings and values, purchase price, wage bill and tax debt, which is confidential taxpayer information under the Taxation Administration Act 2001 (Qld) and useful for targeting, fraud and commercial intelligence. ATO notices, QRO guidance, blank forms and statistics are excluded from enforce tiers. Risk 7 supports SENSITIVE Financial; PROTECTED is not met for a single taxpayer's notice, though bulk assessment extracts sit at the upper end of this band.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  idcf: DSL-3
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Financial and Medium because a QRO notice
    of assessment is confidential taxpayer information revealing property, price, wages and tax debt. PROTECTED is not
    met for a single notice; bulk assessment extracts sit at the upper end of this band.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      Medium Financial handling fits confidential state tax assessment information for an identified taxpayer; bulk
      extracts deserve stricter handling within the same level.
references:
