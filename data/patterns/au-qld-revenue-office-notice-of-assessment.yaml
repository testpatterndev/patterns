  - title: Land Tax Act 2010 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2010-015
  - title: Payroll Tax Act 1971 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1971-037
  - title: Queensland Revenue Office - Transfer duty
    url: https://qro.qld.gov.au/duties/transfer-duty/
  - title: Queensland Revenue Office - Land tax
    url: https://qro.qld.gov.au/land-tax/
  - title: Queensland Revenue Office - Payroll tax
    url: https://qro.qld.gov.au/payroll-tax/
