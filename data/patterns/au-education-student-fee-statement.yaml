{
  "schema": "testpattern/v1",
  "name": "Student Fee and Debt Statement",
  "slug": "au-education-student-fee-statement",
  "version": "1.0.2",
  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated student fee and debt statement using record context and corroborating fields.",
  "pattern": "(?i)(?:student fee statement|student account statement|tuition fee invoice|student debt notice)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
  "regulations": [
    "Education (General Provisions) Act 2006 (Qld)",
    "Higher Education Support Act 2003 (Cth)",
    "Information Privacy Act 2009 (Qld)",
    "Privacy Act 1988 (Cth)"
  ],
  "frameworks": [
    "ISO 27001",
    "ISO 27701"
  ],
  "data_categories": [
    "education",
    "financial"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated student fee and debt statement can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://www.dewr.gov.au/vet-student-loans"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE Financial"
  },
  "package_tags": {
    "primary_component": "student-child-records",
    "components": [
      "student-child-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "financial"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          },
          {
            "ref": "Regex_4"
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:student fee statement|student account statement|tuition fee invoice|student debt notice)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:invoice number|account number|statement number)[ \\t]*:[ \\t]*[A-Z0-9][A-Z0-9-]{3,25}"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:amount due|balance owing|tuition fees)[ \\t]*:[ \\t]*\\$[0-9][0-9,]*(?:\\.\\d{2})?"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)(?:due date|statement date|invoice date)[ \\t]*:[ \\t]*(?:\\d{4}-\\d{2}-\\d{2}|\\d{1,2}/\\d{1,2}/\\d{4})"
      },
      {
        "id": "Regex_4",
        "pattern": "(?i)\\b(?:student|learner|pupil)[ \\t]+(?:name|id|number)[ \\t]*[:#][ \\t]*(?!student\\b|learner\\b|pupil\\b|name\\b|id\\b|n/?a\\b|_{2,}|<|enter\\b|insert\\b)[A-Z0-9][A-Z0-9 .'-]{2,60}\\b"
      }
    ]
  },
  "test_cases": {
    "should_match": [
      {
        "value": "Student fee statement\nStudent name: Morgan Teston\nStatement number: ST204519\nBalance owing: $1250.00\nStatement date: 2026-09-10",
        "description": "Synthetic populated record variant 1",
        "synthetic": true
      },
      {
        "value": "Tuition fee invoice\nStudent ID: RD728491\nInvoice number: INV204519\nAmount due: $800.00\nDue date: 2026-10-01",
        "description": "Synthetic populated record variant 2",
        "synthetic": true
      },
      {
        "value": "Student fee statement\nStudent name: Morgan Teston\nStatement number: ST204519\nBalance owing: $1250.00\nStatement date: 2026-09-10\nForm template version 2.1. Retain the completed record.",
        "description": "Synthetic populated record variant 3",
        "synthetic": true
      },
      {
        "value": "Tuition fee invoice\nStudent ID: RD728491\nInvoice number: INV204519\nAmount due: $800.00\nDue date: 01/10/2026",
        "description": "Synthetic populated record variant 4",
        "synthetic": true
      }
    ],
    "should_not_match": [
      {
        "value": "Published tuition fee schedule\nCourse: Diploma of Business\nTuition fees: $4200.00\nFees are indicative and subject to change.",
        "description": "Synthetic public, blank, distant or unrelated counterexample 1",
        "synthetic": true
      },
      {
        "value": "Student fee statement\nStudent name: __________\nStatement number: __________\nBalance owing: __________\nStatement date: __________",
        "description": "Synthetic public, blank, distant or unrelated counterexample 2",
        "synthetic": true
      },
      {
        "value": "Student fee statement\nEmployee name: Jordan Staffson\nStatement number: ST204519\nBalance owing: $1250.00\nStatement date: 2026-09-10",
        "description": "Synthetic public, blank, distant or unrelated counterexample 4",
        "synthetic": true
      }
    ]
  },
  "exports": [
    "yaml",
    "purview"
  ],
