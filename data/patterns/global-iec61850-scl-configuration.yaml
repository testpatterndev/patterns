    date: '2026-09-24'
    description: Initial release - SCL namespace / ConnectedAP primaries; 75 gated on SCL element markup or populated addressing; 85 on populated IP plus 01-0C-CD MAC or APPID plus a control block; schema, library-fixture and training exclusions.
