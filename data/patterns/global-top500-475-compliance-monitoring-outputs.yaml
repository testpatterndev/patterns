schema: testpattern/v1
name: Compliance monitoring outputs
slug: global-top500-475-compliance-monitoring-outputs
version: 1.3.4
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to compliance monitoring outputs in Australian contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 6 keywords within 300 characters.'
pattern: >-
  (?is)\b(?:compliance\s+monitoring|monitoring\s+outputs|compliance\s+report|audit\s+findings|regulatory\s+compliance|privacy\s+compliance|risk\s+assessment|compliance\s+framework|monitoring\s+schedule|compliance\s+matrix|data\s+retention|impact\s+assessment)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - compliance monitoring outputs
    - compliance
    - monitoring
    - outputs
    - privacy
    - risk
  proximity: 300
test_cases:
  should_match:
    - value: compliance monitoring
      description: Primary topic phrase match
    - value: monitoring outputs
      description: Case-insensitive topic phrase match
    - value: compliance report
      description: Alternative topic phrase match
    - value: audit findings
      description: Additional topic phrase match
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: data inventory compliance
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Common words and phrases related to compliance monitoring outputs appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_compliance_monitoring_outputs
      matches:
        - ref: Evidence_compliance_monitoring_outputs
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_compliance_monitoring_outputs
      matches:
        - ref: Evidence_compliance_monitoring_outputs
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_compliance_monitoring_outputs
      matches:
        - ref: Evidence_compliance_monitoring_outputs
  regexes:
    - id: Pattern_compliance_monitoring_outputs
      pattern: >-
        (?is)\b(?:compliance\s+monitoring|monitoring\s+outputs|compliance\s+report|audit\s+findings|regulatory\s+compliance|privacy\s+compliance|risk\s+assessment|compliance\s+framework|monitoring\s+schedule|compliance\s+matrix|data\s+retention|impact\s+assessment)\b
  keywords:
    - id: Evidence_compliance_monitoring_outputs
      groups:
        - match_style: word
          terms:
            - compliance monitoring
            - monitoring outputs
            - compliance report
            - audit findings
            - regulatory compliance
            - privacy compliance
            - risk assessment
            - compliance framework
            - monitoring schedule
            - compliance matrix
            - data retention
            - impact assessment
risk_description: >-
  The au-top500 concept regex keys on compliance reports, audit findings, risk assessments, compliance frameworks, data-retention obligations, and impact assessments, requiring six nearby governance terms. Routine policies, monitoring schedules, compliance matrices, and training material can satisfy this vocabulary without containing a current organisational result. An attributed report that names a failed obligation, affected system, retention gap, or unresolved impact can create legal and reconnaissance value, but generic framework discussion causes little standalone harm. Risk 5 and OFFICIAL suit the normal report-reference branch; SENSITIVE requires current named failures, regulated breach evidence, or detailed remediation information with direct operational or legal consequence.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to OFFICIAL because ordinary monitoring outputs expose control posture at a high level but need
    technical or regulatory context to cause direct harm. SENSITIVE is not met without named systems, actionable
    failures, serious breach evidence, or detailed remediation weaknesses.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low treatment fits high-level assurance results whose standalone harm is limited and becomes material only
      with specific control, system, or breach detail.
