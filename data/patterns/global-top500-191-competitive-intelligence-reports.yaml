schema: testpattern/v1
name: Competitive intelligence reports
slug: global-top500-191-competitive-intelligence-reports
version: 1.6.1
type: regex
pattern_class: concept
engine: boost_regex
description: 'Identifies competitive intelligence reports: competitor analysis / comparison documents with populated competitor fields (competitor, product, pricing, market share, win rate, key accounts). This is commercial information, not personally identifiable information.'
operation: 'Primary (enforcing): competitor analysis, competitor comparison, competitive analysis. 65 (discovery only) = primary alone, or competitive positioning / landscape phrases. 75 = primary plus two distinct populated competitor fields (competitor, rival, product, offering, pricing, list price, discount, market share, win rate, loss reason, key accounts, headcount, revenue, launch date, source) with non-placeholder values. 85 = primary plus three distinct fields plus independent competitive-intelligence evidence (competitive advantage, benchmarking, battlecard, win/loss, pricing intelligence, MNPI / price-sensitive / inside information). All tiers exclude template/fixture text.'
pattern: (?i)\b(?:competitor\s+(?:analysis|comparison)|competitive\s+analysis)\b
confidence: medium
confidence_justification: 'Medium: competitor-analysis phrases appear in guidance, coursework and news, so enforcement requires populated competitor fields; 85 adds competitive-intelligence evidence the primary does not match.'
jurisdictions:
  - global
regulations:
  - Competition and Consumer Act 2010 (Cth)
  - Corporations Act 2001 (Cth)
frameworks:
  - ISO 27001
data_categories:
  - business
corroborative_evidence:
  keywords:
    - competitive intelligence reports
    - competitive
    - intelligence
    - reports
    - mergers
    - acquisitions
    - strategy
  proximity: 300
test_cases:
  should_match:
    - value: |-
        Competitor analysis - Q3 2026 (internal)
        Competitor: Coastline Analytics Pty Ltd
        Product: RouteIQ Enterprise
        List price: $48,000 per year
        Market share: 18% of Queensland councils
        Win rate: 31% against us in FY26
        Our competitive advantage remains integration depth; see the battlecard for objection handling.
      description: 85 - populated competitor fields plus battlecard/competitive-advantage evidence
      synthetic: true
    - value: |-
        Competitive analysis - CRM vendors
        Competitor: Brightlane Software
        Pricing: $65 per user per month
        Compiled by the sales operations team.
      description: 75 - two populated competitor fields without CI evidence
      synthetic: true
    - value: this record references the competitor analysis held on file
      description: 65 discovery - topic phrase within prose
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: Our competitive landscape is changing.
      description: Generic positioning/landscape language - discovery only
    - value: Target market research survey results
      description: Market research without a competitor-analysis anchor
    - value: A competitor analysis helps a small business understand its market; this guide explains what to include and where to find public information.
      description: Guidance - no populated competitor fields (65 at most)
    - value: |-
        Competitor analysis worksheet
        Competitor: ________
        Pricing: ________
        Market share: [enter %]
      description: Blank worksheet - placeholder fields are rejected
    - value: An analysts' competitor analysis shows the two supermarket chains hold 65 per cent of the grocery market, the newspaper reported.
      description: News item - no populated competitor fields
false_positives:
  - description: Common words and phrases related to competitive intelligence reports appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
risk_rating: 4
risk_description: >-
  The concept detector recognises competitor analysis, market monitoring, benchmarking, and competitive-intelligence language, with the normal unit being an analysis assembled largely from public or commercially obtained sources. Disclosure may reveal what an organisation monitors or its interpretation of competitors, but a routine report usually causes low and reversible strategic embarrassment and contains no direct access or privileged target data. The medium-confidence regex can also match public research and generic strategy material. Risk 4 and OFFICIAL fit ordinary intelligence administration; SENSITIVE is not met without unlawfully obtained trade secrets, confidential source identities, or non-public target information that would cause serious commercial harm.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    A topic phrase that does not prove a proprietary report fits risk 4 OFFICIAL. SENSITIVE is not met because public
    research and routine competitor discussion are ordinary true positives with no direct strategic loss.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic handling reflects a broad business topic whose sensitivity depends on proprietary sources,
      conclusions, and strategic use not detected here.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_competitor_analysis
      matches:
        - ref: Regex_global_top500_191_competitive_intelligence_reports_record_structure
          min_count: 3
          unique_results: true
        - ref: Evidence_competitive
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Pattern_competitor_analysis
      matches:
        - ref: Regex_global_top500_191_competitive_intelligence_reports_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Pattern_competitor_analysis
          - Pattern_competitive_positioning_landscape
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_competitor_analysis
      pattern: (?i)\b(?:competitor\s+(?:analysis|comparison)|competitive\s+analysis)\b
    - id: Pattern_competitive_positioning_landscape
      pattern: (?i)\b(?:competitive\s+(?:positioning|landscape))\b
    - id: Regex_global_top500_191_competitive_intelligence_reports_record_structure
      pattern: (?i)\b(?:competitor|rival|product|offering|pricing|price\s+point|list\s+price|discount(?:\s+level)?|market\s+share|win\s+rate|loss\s+reason|key\s+accounts?|headcount|revenue|launch\s+date|source)\s*[:#]\s*(?!(?:n/?a|tbc|tba|unknown)\b|_{2,}|\[|<)[A-Za-z0-9$][A-Za-z0-9$%/'.,-]{0,40}
  keywords:
    - id: Evidence_competitive
      groups:
        - match_style: word
          terms:
            - competitive advantage
            - market analysis
            - benchmarking
            - battlecard
            - battle card
            - win/loss
            - pricing intelligence
            - Scheme of Arrangement
            - text: MNPI
              case_sensitive: true
            - Material Non-Public Information
            - Price Sensitive Information
            - Inside Information
      strength: specific
created: '2026-02-08'
updated: '2026-09-25'
changelog:
  - version: 1.6.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.6.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): 75 now requires two distinct populated competitor fields (new Regex_..._record_structure) instead of a keyword group that repeated the primary; 85 requires three fields plus competitive-intelligence evidence (removed "competitor analysis" from Evidence_competitive - the primary matches it). Merged the two 65 discovery tiers; removed the dead market-analysis/SWOT regexes and unused confidential/strategy groups; MNPI is case-sensitive; template exclusion renamed to Keyword_noise_exclusion. Replaced bare-phrase positives with populated synthetic reports; added guidance, blank-worksheet and news decoys. Metadata: removed the incorrect PII claim and boilerplate privacy/health/AML/TIA regulations; data_categories pii -> business; regulations now Competition and Consumer Act 2010 and Corporations Act 2001 (Cth); frameworks ISO 27001.'
  - version: 1.5.0
    date: '2026-07-17'
    description: 'SIT alignment wave1 (TP-00317, reduced scope): hardened only the live Pattern_competitor_analysis branch — "competitive positioning" and "competitive landscape" demoted from the enforcing anchor to a new 65 discovery_only branch (Pattern_competitive_positioning_landscape with template-exclusion NOT gate); bare "competitor"/"competitive" dropped from Evidence_competitive so the anchor can no longer self-corroborate on a single word; stale operation text corrected to the actual 85/75/65 wiring (it described 95/market/SWOT tiers that never existed); dead market/SWOT regexes left inactive; adversarial tests added. Deliberately less than the first-pass candidate: NO named-competitor/comparison/source 75/85 enforcement (references undefined, deferred per QA); "competitor analysis" remains valid concept evidence per review.'
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 792 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-04'
    description: case/evidence metadata update
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
