schema: testpattern/v1
name: AI Coding Agent Credential Store (Claude Code, Codex CLI)
slug: global-ai-agent-credential-store
version: 1.1.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects the OAuth token stores that AI coding agents keep on a developer's machine: Claude Code's .credentials.json
  (a claudeAiOauth object holding accessToken and refreshToken) and the OpenAI Codex CLI's auth.json (a tokens object
  holding id_token, access_token and refresh_token beside an OPENAI_API_KEY key). These files are plaintext, and the
  tokens in them act as the signed-in user: they spend the account's subscription and reach whatever the agent is
  connected to. Infostealers and npm supply-chain worms in 2026 collected both files. The pattern detects the file
  content, not a path, so it also fires when the JSON is pasted into a ticket, chat or repository.
operation: >-
  The primaries are JSON token fields with a value of 20 or more characters: accessToken or refreshToken (Claude Code)
  and id_token, access_token or refresh_token (Codex CLI). Alone they are discovery-only at 65, because the Codex names
  are the standard OAuth 2.0 response names. For Claude Code, 75 requires the claudeAiOauth object opening nearby and
  85 also requires a refreshToken value. For Codex, 75 requires an OPENAI_API_KEY or last_refresh sibling key and 85
  also requires the tokens object opening nearby. Placeholder and variable-reference values are rejected inside the
  regex; the shared template exclusion vetoes documentation examples on every tier. Token prefixes and lengths are not
  relied on, because neither vendor documents them.
pattern: '(?i)("(?:accessToken|refreshToken)"\s*:\s*"(?![<$]|[^"]{0,40}(?:your|xxxx|\*{3}|redacted|placeholder|changeme))[^"\s]{20,}")'
confidence: medium
confidence_justification: >-
  Medium confidence. The key names come from first-party source code (Anthropic's Claude Agent SDK for claudeAiOauth,
  accessToken and refreshToken; the open-source Codex CLI for auth.json), and the container keys are specific to these
  tools. The token values are opaque strings with no documented prefix, length or checksum, so the regex cannot
  validate them or tell an expired token from a live one, and the field names alone are common in other OAuth clients.
  Enforce tiers therefore require the tool-specific container or sibling keys.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
  - Computer Fraud and Abuse Act
  - Computer Misuse Act 1990
frameworks:
  - CIS Controls
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - claudeAiOauth
    - .credentials.json
    - auth.json
    - OPENAI_API_KEY
    - last_refresh
    - Claude Code
    - Codex
  proximity: 300
test_cases:
  should_match:
    - value: '"refreshToken": "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnop"'
      description: Exact 65 probe - token field with no agent container
    - value: '{"claudeAiOauth":{"accessToken":"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"}}'
      description: Exact 75 probe - compact Claude Code store holding only an access token
    - value: |-
        {
          "claudeAiOauth": {
            "accessToken": "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789",
            "refreshToken": "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA9876543210"
          }
        }
      description: Exact 85 probe - pretty-printed Claude Code .credentials.json with access and refresh tokens
    - value: |-
        {
          "OPENAI_API_KEY": null,
          "tokens": {
            "id_token": "eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJkZXBsb3llciJ9.ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
            "access_token": "eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJkZXBsb3llciJ9.abcdefghijklmnopqrstuvwxyz0123456789",
            "refresh_token": "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnop",
            "account_id": "00000000-0000-0000-0000-000000000000"
          },
          "last_refresh": "2026-11-01T00:00:00Z"
        }
      description: Exact 85 probe - pretty-printed Codex CLI auth.json as the CLI writes it
    - value: '"refresh_token":"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnop","account_id":"00000000-0000-0000-0000-000000000000"},"last_refresh":"2026-11-01T00:00:00Z"}'
      description: Exact 75 probe - tail of a Codex auth.json, where the tokens key is far behind the refresh token
  should_not_match:
    - value: '{"claudeAiOauth": {"accessToken": "<your-access-token>", "refreshToken": "<your-refresh-token>"}}'
      description: Angle-bracket placeholders in place of tokens
    - value: '{"claudeAiOauth": {"accessToken": "", "refreshToken": ""}}'
      description: Signed-out store with empty token values
    - value: '{"OPENAI_API_KEY": null}'
      description: Codex auth.json with no cached tokens (the tokens key is omitted when empty)
    - value: '{"access_token":"eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJkZXBsb3llciJ9.ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789","token_type":"Bearer","expires_in":3600,"refresh_token":"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnop"}'
      description: Generic OAuth 2.0 token response with no Codex sibling keys (discovery only)
    - value: '{"session": {"accessToken": "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", "expiresIn": 3600}}'
      description: Another application's camelCase access token with no claudeAiOauth object (discovery only)
    - value: Claude Code keeps the accessToken and refreshToken under claudeAiOauth in .credentials.json.
      description: Prose that names the keys without a value
    - value: 'Documentation example: {"claudeAiOauth":{"accessToken":"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789","refreshToken":"zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA9876543210"}}'
      description: Complete store with both tokens, vetoed on every tier by the documentation-example framing
false_positives:
  - description: >-
      Other applications that store OAuth tokens in JSON under the same field names (accessToken, refresh_token and so
      on), and raw OAuth 2.0 token responses.
    mitigation: >-
      Those reach only the discovery tier. Enforce tiers require the claudeAiOauth object, or the Codex sibling keys
      OPENAI_API_KEY or last_refresh, within the proximity window.
  - description: Expired tokens. Access tokens are short-lived and a refresh token stops working once it is used or revoked.
    mitigation: >-
      The pattern cannot test liveness. Treat a match as a credential to revoke by signing the agent out and back in;
      the 85 tier marks files that hold a refresh token.
  - description: Third-party tools and test fixtures that reproduce the file layout with invented token values.
    mitigation: >-
      The regex rejects angle-bracket, starred, x-run and variable-reference values; the shared template exclusion
      vetoes documentation and fixture framing.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 8
risk_description: >-
  This medium-confidence detector identifies the OAuth tokens that Claude Code or the Codex CLI cache for a signed-in
  user. A live token lets the holder run the agent as that user against the vendor account: consuming the
  subscription, and reaching the services and data the account or its connected tools can reach, until the token
  expires or the session is revoked. Harm is serious but bounded by one user's account and by token lifetime; the match
  does not establish organisation-admin rights or which data the account can reach. Risk 8 and SENSITIVE InfoTech fit a
  directly usable user credential with unknown reach; PROTECTED requires confirmed access to protected systems or
  organisation-wide administration.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE InfoTech because a cached agent token is a
    directly usable credential for one user's AI account. PROTECTED is not met because the match does not establish
    administrative scope, the data the account can reach, or that the token is still valid.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling fits a user-level session credential bounded by one account and by token expiry. High
      handling requires confirmed organisation-wide or protected-system access.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Regex_claude_code_oauth_token
          - Regex_codex_oauth_token
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_claude_code_oauth_token
      matches:
        - ref: Pattern_claude_oauth_container
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_codex_oauth_token
      matches:
        - ref: Pattern_codex_auth_sibling
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 85
      id_match: Regex_claude_code_oauth_token
      matches:
        - ref: Pattern_claude_oauth_container
        - ref: Pattern_claude_refresh_token
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 85
      id_match: Regex_codex_oauth_token
      matches:
        - ref: Pattern_codex_tokens_container
        - ref: Pattern_codex_auth_sibling
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_claude_code_oauth_token
      pattern: '(?i)("(?:accessToken|refreshToken)"\s*:\s*"(?![<$]|[^"]{0,40}(?:your|xxxx|\*{3}|redacted|placeholder|changeme))[^"\s]{20,}")'
    - id: Regex_codex_oauth_token
      pattern: '(?i)("(?:id_token|access_token|refresh_token)"\s*:\s*"(?![<$]|[^"]{0,40}(?:your|xxxx|\*{3}|redacted|placeholder|changeme))[^"\s]{20,}")'
    - id: Pattern_claude_oauth_container
      pattern: '(?-i)("claudeAiOauth"\s*:\s*\{)'
    - id: Pattern_claude_refresh_token
      pattern: '(?-i)("refreshToken"\s*:\s*"[^"\s]{20,}")'
    - id: Pattern_codex_tokens_container
      pattern: '(?-i)("tokens"\s*:\s*\{)'
    - id: Pattern_codex_auth_sibling
      pattern: '(?-i)("OPENAI_API_KEY"\s*:|"last_refresh"\s*:)'
created: '2026-11-16'
updated: '2026-11-25'
changelog:
  - version: 1.1.0
    date: '2026-11-25'
    description: State explicit regex case rule ((?i) or (?-i)) and align tier/keyword semantics with Microsoft Purview evaluation.
  - version: 1.0.0
    date: '2026-11-16'
    description: Initial release.
