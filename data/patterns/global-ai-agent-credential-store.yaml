references:
  - url: https://code.claude.com/docs/en/authentication
    title: 'Claude Code docs, Authentication, Credential management (credentials are stored in ~/.claude/.credentials.json on Linux and Windows, and in the macOS Keychain with the same file as fallback)'
  - url: https://github.com/anthropics/claude-agent-sdk-python/blob/main/src/claude_agent_sdk/_internal/session_resume.py
    title: 'Anthropic claude-agent-sdk-python source (copies .credentials.json and removes claudeAiOauth.refreshToken from the copy)'
  - url: https://github.com/anthropics/claude-agent-sdk-python/blob/main/tests/test_session_resume.py
    title: 'Anthropic claude-agent-sdk-python tests (fixture {"claudeAiOauth": {"accessToken": ..., "refreshToken": ...}} establishes the accessToken key)'
  - url: https://github.com/openai/codex/blob/main/codex-rs/login/src/auth/storage.rs
    title: 'OpenAI Codex CLI source, AuthDotJson (the expected structure of $CODEX_HOME/auth.json: auth_mode, OPENAI_API_KEY, tokens, last_refresh; OPENAI_API_KEY is always written, as null when unset; pretty-printed JSON)'
  - url: https://github.com/openai/codex/blob/main/codex-rs/login/src/token_data.rs
    title: 'OpenAI Codex CLI source, TokenData (id_token, access_token, refresh_token, account_id)'
  - url: https://developers.openai.com/codex/auth
    title: 'OpenAI Codex docs, Authentication (login details are cached in plaintext at ~/.codex/auth.json or the OS credential store; treat auth.json like a password)'
  - url: https://spycloud.com/blog/infostealers-now-target-ai-tokens-and-api-keys/
    title: 'SpyCloud, 30 October 2026 (infostealers taking Claude Code OAuth access and refresh tokens and the Codex authentication file)'
  - url: https://www.stepsecurity.io/blog/chaindrop-npm-worm
    title: 'StepSecurity, ChainDrop npm worm, 4 August 2026 (lists Claude and Codex credential files among those harvested)'
