schema: testpattern/v1
name: "New Zealand National Student Number (NSN)"
slug: nz-nsn
version: 1.0.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects 9- to 10-digit New Zealand National Student Numbers (NSNs) assigned by the Ministry of Education and NZQA under the Education and Training Act 2020 (NZ) to uniquely identify school, tertiary, and vocational learners across Aotearoa New Zealand.
operation: >-
  Matches a 9- or 10-digit NSN on word boundaries, guarded by AllDigitsSameFilter and sequential exclusions. Requires explicit NSN / NZQA / Ministry of Education / ENROL student-record corroboration on every tier.
pattern: '\b(0\d{8,9}|[1-9]\d{8,9})\b'
confidence: medium
confidence_justification: >-
  Medium confidence: 9-10 digit numeric identifiers overlap phone and bank references unless gated on NZQA, ENROL, NCEA, or National Student Number terminology within 300 characters.
jurisdictions:
  - nz
regulations:
  - "Privacy Act 2020 (NZ)"
  - "Education and Training Act 2020 (NZ)"
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - education
  - government-id
corroborative_evidence:
  keywords:
    - "National Student Number"
    - "NSN"
    - "NZQA"
    - "NCEA"
    - "Ministry of Education"
    - "ENROL"
    - "learner"
  proximity: 300
test_cases:
  should_match:
    - value: "National Student Number: 0148293716"
      description: "10-digit New Zealand National Student Number with label"
    - value: "NSN 148293715 — NZQA Record of Achievement"
      description: "9-digit NSN with NZQA Record of Achievement context"
    - value: "0293847162"
      description: "10-digit zero-leading NSN"
  should_not_match:
    - value: "12345678"
      description: "Eight digits (below 9-10 digit NSN length)"
    - value: "01482937169"
      description: "Eleven digits (above 10-digit NSN maximum)"
    - value: "Students need their National Student Number to log in to the NZQA portal"
      description: "Prose instruction without an NSN value"
    - value: "Sample template: placeholder example record for training only"
      description: "Template/sample fixture suppressed by shared exclusion dictionary"
false_positives:
  - description: "New Zealand phone numbers or customer account numbers in non-education documents."
    mitigation: "Every tier requires explicit NSN, NZQA, NCEA, or ENROL education keywords within 300 characters."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 6
risk_description: >-
  The detector matches a 9- or 10-digit New Zealand National Student Number corroborated by NZQA or Ministry of Education context. Under Schedule 24 of the Education and Training Act 2020 (NZ) and the Privacy Act 2020, use and disclosure of NSNs are statutorily restricted to authorized education providers and agencies because an NSN persistently links a child or tertiary learner's lifelong academic, attendance, and special-assessment records. Risk 6 and SENSITIVE Personal-Privacy match au-unique-student-identifier.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Medium
  rationale: >-
    Risk 6 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy, and Medium because a New Zealand National Student Number is a statutorily regulated lifelong student identifier linking minor and adult learner records.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling reflects statutory restrictions on lifelong student identifiers under the Education and Training Act 2020 (NZ).
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_nz_nsn
      matches:
        - ref: Keyword_nz_nsn_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_nz_nsn
      matches:
        - ref: Keyword_nz_nsn_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_nz_nsn
      matches:
        - ref: Keyword_nz_nsn_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_nz_nsn
      pattern: '\b(\d{9,10})\b'
  keywords:
    - id: Keyword_nz_nsn_specific
      groups:
        - match_style: word
          terms:
            - "National Student Number"
            - text: "NZQA"
              case_sensitive: true
            - text: "NCEA"
              case_sensitive: true
            - "Record of Achievement"
            - "Te Tāhuhu o te Mātauranga"
            - "ENROL"
      strength: specific
    - id: Keyword_nz_nsn_broad
      groups:
        - match_style: word
          terms:
            - text: "NSN"
              case_sensitive: true
            - "Ministry of Education"
            - "student ID"
            - "learner"
            - "secondary school"
            - "tertiary provider"
      strength: domain
  filters:
    - id: Filter_nz_nsn_same_digits
      type: AllDigitsSameFilter
references:
  - url: https://www2.nzqa.govt.nz/login/national-student-number-nsn/
    title: "New Zealand Qualifications Authority (NZQA) - National Student Number (NSN)"
  - url: https://www.legislation.govt.nz/act/public/2020/0038/latest/LMS204318.html
    title: "Education and Training Act 2020 Schedule 24 (National Student Numbers)"
created: '2026-11-25'
updated: '2026-11-25'
changelog:
  - version: 1.0.0
    date: '2026-11-25'
    description: Initial release.
