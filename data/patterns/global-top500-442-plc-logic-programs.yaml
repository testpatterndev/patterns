schema: testpattern/v1
name: PLC logic programs
slug: global-top500-442-plc-logic-programs
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects printed or prose PLC logic programs and program listings: ladder or rung listings with instruction text such as XIC(...)OTE(...), structured-text logic, program/routine/controller names and controller tags. Complements global-plc-project-export, which covers native L5X/L5K/TIA Openness/XEF export files; this pattern does not use those export-file anchors. Topic wording alone is discovery-only.
operation: >-
  Regex_plc_logic_primary (PLC program/logic/ladder, rung listing, program/routine listing, MainProgram/MainRoutine or engineering-tool printout wording) is discovery-only at 65. 75 requires the primary plus one populated structure: concrete logic (Rockwell rung instructions such as XIC(tag)/OTE(tag)/TON(timer), or IEC structured-text IF ... THEN / tag := value; lines) or program structure (labelled program/routine/task/controller/processor/slot/tag/I/O address, printed Rung numbers, 1756-L / 6ES7 controller catalogue numbers). 85 requires concrete logic (Rockwell rung instructions such as XIC(tag)/OTE(tag)/TON(timer), or IEC structured-text IF ... THEN / tag := value; lines) (two distinct hits), program structure (labelled program/routine/task/controller/processor/slot/tag/I/O address, printed Rung numbers, 1756-L / 6ES7 controller catalogue numbers), and independent process-control (interlock, permissive, e-stop, motor, conveyor, pump, valve, setpoint) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_plc_logic_guidance_exclusion).
pattern: >-
  (?i)\b(?:programmable\s+logic\s+controller|PLC\s+(?:logic|program(?:me)?|code|ladder|routine)s?|ladder\s+(?:logic|diagram|program|listing)|rung\s+(?:logic|listing|comments?)|(?:program|routine)\s+listing|structured\s+text\s+(?:program|routine)|MainProgram|MainRoutine|(?:RSLogix|Studio\s+5000|TIA\s+Portal|Control\s+Expert|Unity\s+Pro|CODESYS|GX\s+Works)\s+(?:program|project|report|printout|listing))\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (concrete logic (Rockwell rung instructions such as XIC(tag)/OTE(tag)/TON(timer), or IEC structured-text IF ... THEN / tag := value; lines) or program structure (labelled program/routine/task/controller/processor/slot/tag/I/O address, printed Rung numbers, 1756-L / 6ES7 controller catalogue numbers)), and 85 needs two distinct structures plus independent process-control (interlock, permissive, e-stop, motor, conveyor, pump, valve, setpoint) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
  - global
regulations:
  - SOCI Act 2018 (Cth)
frameworks:
  - IEC 62443
  - ISO 27001
  - NIST CSF
data_categories:
  - security
corroborative_evidence:
  keywords:
    - interlock
    - permissive
    - e-stop
    - emergency stop
    - motor starter
    - conveyor
    - pump
    - valve
    - setpoint
    - seal-in
  proximity: 300
  keyword_lists:
    - industry-critical-infrastructure
test_cases:
  should_match:
    - value: The PLC program for the lift station is backed up on the engineering laptop.
      description: Discovery probe (65) - wording only
      synthetic: true
    - value: |-
        Ladder logic listing
        XIC(Start_PB)XIO(Stop_PB)OTE(P101_Run);
      description: Medium-tier probe (75) - rung instruction text without program structure
      synthetic: true
    - value: |-
        RSLogix 5000 report - Controller: WTP_North_PLC1 (1756-L83E, slot 0)
        Program: MainProgram   Routine: MainRoutine
        Rung 0003: XIC(Start_PB)XIO(EStop_OK)OTE(P101_Run);
        Rung 0004: XIC(P101_Run)TON(P101_Delay,5000,0);
        Rung 0005: XIC(LT201_HiHi)OTU(P101_Run); high-high level interlock stops pump P-101 (seal-in released).
      description: High-tier probe (85) - several rung lines, controller/program structure and interlock context
      synthetic: true
    - value: |-
        PLC program listing - dosing skid
        Routine: Dose_Control
        IF FIT301_Flow > 0.5 AND NOT EStop THEN
          P301_Run := TRUE;
        END_IF;
        DoseSetpoint := 12;
        Permissive: dosing pump runs only when the inlet valve is open.
      description: High-tier probe (85) - structured-text lines, routine field and permissive context
      synthetic: true
  should_not_match:
    - value: unrelated generic text
      description: No relevant phrase context
    - value: placeholder value 12345
      description: Random text should not match
    - value: 'Policy statement: PLC programs must be backed up after every change and stored in the OT repository.'
      description: Policy text
      synthetic: true
    - value: |-
        PLC program listing template
        Controller: ________
        Rung 0000: [insert]
      description: Blank template
      synthetic: true
    - value: 'Course module 2: ladder logic basics - XIC(Start_PB)OTE(Motor) latches a motor starter.'
      description: Training framing with rung text
      synthetic: true
    - value: The IEC 61131 standard defines several PLC programming languages.
      description: Standard discussion - discovery only at most
      synthetic: true
false_positives:
  - description: Rockwell/Siemens programming manuals and PLC courses print rung examples.
    mitigation: Training/course framing is excluded; 85 needs two distinct logic lines plus program structure and process context.
  - description: Native L5X/L5K/TIA/XEF export files.
    mitigation: Covered by global-plc-project-export; this pattern targets printed listings and prose and may also fire on an export that carries rung text.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_plc_logic_primary
      matches:
        - ref: Regex_plc_logic_rung_logic
          min_count: 2
          unique_results: true
        - ref: Regex_plc_logic_program_structure
        - ref: Keyword_plc_logic_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_plc_logic_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_plc_logic_primary
      matches:
        - type: any
          refs:
            - Regex_plc_logic_rung_logic
            - Regex_plc_logic_program_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_plc_logic_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_plc_logic_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_plc_logic_primary
      pattern: >-
        (?i)\b(?:programmable\s+logic\s+controller|PLC\s+(?:logic|program(?:me)?|code|ladder|routine)s?|ladder\s+(?:logic|diagram|program|listing)|rung\s+(?:logic|listing|comments?)|(?:program|routine)\s+listing|structured\s+text\s+(?:program|routine)|MainProgram|MainRoutine|(?:RSLogix|Studio\s+5000|TIA\s+Portal|Control\s+Expert|Unity\s+Pro|CODESYS|GX\s+Works)\s+(?:program|project|report|printout|listing))\b
    - id: Regex_plc_logic_rung_logic
      pattern: >-
        \b(?:XIC|XIO|OTE|OTL|OTU|ONS|OSR|TON|TOF|RTO|CTU|CTD|MOV|EQU|NEQ|GRT|LES|GEQ|LEQ|JSR|ADD|SUB|MUL|RES|CPT)\([A-Za-z0-9_.:\[\],]{1,60}\)|\bIF\s+[A-Za-z_][A-Za-z0-9_.]{1,60}\s+(?:AND\s+NOT\s+|AND\s+|OR\s+)?[A-Za-z_][A-Za-z0-9_.]{0,60}\s*THEN\b|\b[A-Za-z_][A-Za-z0-9_.]{1,60}\s*:=\s*(?:TRUE|FALSE|[A-Za-z_][A-Za-z0-9_.]{1,60}|-?\d{1,6}(?:\.\d{1,4})?)\s*;
    - id: Regex_plc_logic_program_structure
      pattern: >-
        (?i)\b(?:program|routine|task|controller(?:\s+name)?|processor(?:\s+type)?|chassis|slot|block|tag|alias\s+for|I/O\s+address|module)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}|\bRung\s+\d{1,4}\b|\b1756-L\d{2}[A-Z]{0,3}\b|\b6ES7\s?\d{3}-\d[A-Z0-9]{4}-\d[A-Z0-9]{3}\b
  keywords:
    - id: Keyword_plc_logic_context
      groups:
        - match_style: word
          terms:
            - interlock
            - permissive
            - e-stop
            - emergency stop
            - motor starter
            - conveyor
            - pump
            - valve
            - setpoint
            - seal-in
      strength: specific
    - id: Keyword_plc_logic_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy statement
            - guidance note
            - best practice guide
            - media release
            - press release
            - news report
            - course module
            - learning objectives
            - awareness course
            - webinar
            - lesson plan
            - quiz question
      strength: domain
risk_description: >-
  The detector now requires PLC program wording plus concrete rung or structured-text logic (or labelled program/controller structure) before enforcing, so enforced hits contain executable control logic. A genuine program exposes control sequences, interlocks, timers, and fail-state behaviour, allowing an attacker or unauthorised insider to identify manipulation points or sabotage production. The normal program presents serious operational and possible safety harm, but direct impact still requires controller access, compatible deployment, and knowledge of the physical process. Risk 8 remains SENSITIVE InfoTech; PROTECTED would require deployable logic for a critical service, bypass of safety controls, or likely significant physical and public harm.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Confidential
