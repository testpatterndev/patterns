changelog:
  - version: 1.4.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): rescoped to printed/prose PLC listings as the complement of global-plc-project-export (no L5X/L5K/TIA/XEF export anchors); primary broadened to program/rung/routine listing, MainProgram/MainRoutine and engineering-tool printout wording; keyword-only code evidence (rung/contact/timer words, punctuated Q0.0/I0.0 keyword terms) replaced with a rung-instruction/structured-text regex and a program-structure regex (labelled program/routine/controller/tag fields, printed rung numbers, 1756-L and 6ES7 catalogue numbers); 75 needs logic or structure, 85 needs two logic lines, structure and process-control context; guidance exclusion; populated listing tests (Rockwell and structured text) and decoys; irrelevant privacy/AML/health/TIA regulations replaced with SOCI Act; IEC 62443/ISO 27001/NIST CSF frameworks and NIST SP 800-82 reference added. Addresses the 2026-07-06 NOT_DETECTED tenant verdict.'
  - version: 1.3.0
    date: '2026-07-04'
    description: 'CI profile hardening: align the global PLC detector with the reviewed program-structure contract; require code structure at 75 and deployable controller, I/O, rack, slot, or production context at 85; reject standards and training examples.'
  - version: 1.2.2
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1982 without changing detector or package metadata.'
  - version: 1.2.1
    date: '2026-07-12'
    description: 'Baseline burn-down: mark the no-evidence 65 tier discovery_only — it is a broad inventory tier by shape (id_match only, no required evidence), so bare topic fragments correctly surface in discovery rather than counting as classification; aligns with corpus convention and clears the should_not_match failure + check:quality discoveryMissing informational. No compiled detection change (discovery_only is harness/quality metadata).'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
