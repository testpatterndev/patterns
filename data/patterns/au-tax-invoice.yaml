schema: testpattern/v1
name: Australian Tax Invoice
slug: au-tax-invoice
version: 1.3.4
type: keyword_list
pattern_class: concept
description: Detects Australian tax invoices containing GST, ABN, and payment details as required by ATO regulations.
operation: >-
  Regex and keyword-based detection matching tax invoice, GST invoice, or Australian tax invoice patterns. Corroborative
  evidence: 11 invoice keywords and 7 GST keywords within 300 characters.
confidence: medium
confidence_justification: 'Medium confidence: keyword-based detection requires corroborative evidence for accurate identification.'
jurisdictions:
  - au
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
- ISO 27001
- ISO 27701
- PCI-DSS
- SOC 2
data_categories:
  - financial
  - business
test_cases:
  should_match:
    - value: 'TAX INVOICE - Invoice Number: INV-2024-001'
      description: Test match 1
    - value: Australian tax invoice including GST of $45.00
      description: Test match 2
    - value: Tax invoice from ABN 12 345 678 901 with payment terms net 30
      description: Test match 3
  should_not_match:
    - value: Please send us an estimate
      description: Non-match 1
    - value: The tax return was filed on time
      description: Non-match 2
false_positives:
  - description: Documents mentioning invoice in non-tax contexts.
    mitigation: Require GST or ABN keywords alongside invoice references.
exports:
  - yaml
scope: narrow
risk_rating: 4
risk_description: >-
  This keyword classifier recognises Australian tax-invoice, GST, ABN, invoice-number, and payment-term language as a document concept rather than extracting an account number. A populated invoice may expose a supplier-customer relationship, purchase amount, and payment timing that could support invoice redirection or commercial intelligence. The normal unit is one business transaction, while blank templates and non-tax invoice discussions remain plausible matches and harmful misuse needs additional payment or contact data. Risk 4 OFFICIAL fits the bounded business impact of the topic match; SENSITIVE would require verified non-public banking details, sensitive purchases, or a material transaction set.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Low
  rationale: >-
    Risk 4 maps to PSPF OFFICIAL, QGISCF OFFICIAL, DLM OFFICIAL, and Low tier because the classifier establishes
    tax-invoice context but not confidential payment credentials or a high-impact transaction collection. SENSITIVE is
    not met by a routine single invoice topic without materially sensitive contents.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic handling is proportionate for ordinary tax-invoice material that is routinely exchanged with
      counterparties and whose fraud value depends on companion identity and payment details. Medium handling should be
      applied when a document contains private bank instructions, unusual commercial sensitivity, or aggregated invoice
      data.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_tax_invoice
      matches:
        - ref: Keyword_invoice
        - ref: Keyword_gst
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_invoice_number
      matches:
        - ref: Keyword_invoice
        - ref: Keyword_payment_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_tax_invoice
      pattern: (?i)\b(?:tax\s+invoice|australian\s+tax\s+invoice|gst\s+invoice)\b
    - id: Regex_invoice_number
      pattern: (?i)\b(?:invoice|inv)\s*[#:\-]?\s*(?:[A-Z]{0,3}\-?\d{4,10})\b
  keywords:
    - id: Keyword_invoice
      groups:
        - match_style: word
          terms:
            - invoice
            - invoicing
            - tax invoice
            - invoice number
            - invoice date
            - amount due
            - payment due
            - bill to
            - ship to
            - purchase order
            - po number
      strength: specific
    - id: Keyword_gst
      groups:
        - match_style: word
          terms:
            - text: GST
              case_sensitive: true
            - goods and services tax
            - GST included
            - GST exclusive
            - total GST
            - text: ABN
              case_sensitive: true
            - australian business number
      strength: specific
    - id: Keyword_payment_terms
      groups:
        - match_style: word
          terms:
            - payment terms
            - net 30
            - net 60
            - net 90
            - due on receipt
            - payment method
            - bank details
            - eft details
      strength: specific
references:
  - title: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)"
    url: https://www.legislation.gov.au/C2006A00169/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
