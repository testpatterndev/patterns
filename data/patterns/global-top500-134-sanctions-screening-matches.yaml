schema: testpattern/v1
name: Sanctions screening matches
slug: global-top500-134-sanctions-screening-matches
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: Detects references to sanctions screening matches in financial and compliance documents. Commonly found in Australian regulatory filings, transaction records, and audit documentation.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters.'
pattern: (?is)\b(?:sanctions\s+screening|DFAT\s+consolidated\s+list|sanctions\s+match|designated\s+person|prohibited\s+entity|screening\s+result|sanctions\s+compliance|politically\s+exposed\s+person)\b
confidence: medium
confidence_justification: identifier/document-structure anchored regex with constrained context replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - financial
corroborative_evidence:
  keywords:
    - sanctions screening matches
    - sanctions
    - screening
    - matches
    - credit
    - lending
    - insurance
  proximity: 300
  keyword_lists:
    - corporate-finance
test_cases:
  should_match:
    - value: sanctions screening
      description: Primary topic phrase match
    - value: dfat consolidated list
      description: Case-insensitive topic phrase match
    - value: sanctions match
      description: Alternative topic phrase match
    - value: designated person
      description: Additional topic phrase match
    - value: |-
        Sanctions screening
        Name: Avery Teston
        Date of birth: 14/02/1988
        Client number: C4471820
      description: Populated person/client record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: credit premium
      description: Generic word pair from old broad template should not match
    - value: |-
        Sanctions screening:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about sanctions screening are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Financial terminology appearing in published reports, accounting textbooks, regulatory guidance, or template documents without actual transaction data.
    mitigation: Require corroborative evidence keywords within the proximity window. Cross-reference with structured financial identifiers to confirm actual sensitive data.
  - description: In Australian English, standard business terminology overlapping with financial detection keywords in routine correspondence and documentation.
    mitigation: Increase confidence threshold when scanning business correspondence. Layer with transaction-specific patterns for higher precision.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_sanctions_screening
      matches:
        - ref: Regex_global_top500_134_sanctions_screening_matches_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_sanctions_screening
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_sanctions_screening
            - Regex_global_top500_134_sanctions_screening_matches_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_sanctions_screening
  regexes:
    - id: Pattern_sanctions_screening
      pattern: (?is)\b(?:sanctions\s+screening|DFAT\s+consolidated\s+list|sanctions\s+match|designated\s+person|prohibited\s+entity|screening\s+result|sanctions\s+compliance|politically\s+exposed\s+person)\b
    - id: Regex_global_top500_134_sanctions_screening_matches_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_sanctions_screening
      groups:
        - match_style: word
          terms:
            - watchlist
            - embargo
risk_description: >-
  This detector finds sanctions-screening match records, including possible designated-person or consolidated-list hits. Disclosure can alert a customer to scrutiny, expose unresolved false-positive analysis, or enable evasion before identity and ownership checks are complete. A normal match record may seriously affect the screened party and a specific compliance decision, but it is not a confirmed sanctions finding or a complete screening platform. Risk 7 and SENSITIVE reflect that harm; protected intelligence, a bulk watchlist result set, or live enforcement coordination would justify higher handling.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 7 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Financial, and Medium when the screening
    result is tied to a party and pending disposition. Public sanctions references do not create that harm, and
    PROTECTED is not met without protected intelligence or major operational consequence.
  generic:
    classification: Medium
    dlm: Medium Financial
    rationale: >-
      An unresolved sanctions match is Medium Financial because it joins a named party to a consequential but
      potentially mistaken compliance result. Sanctions lists and general screening instructions are public or
      procedural material until case attribution and review evidence are present.
created: '2026-02-08'
updated: '2026-10-19'
changelog:
  - version: 1.4.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires an independent populated person/client field (Regex_global_top500_134_sanctions_screening_matches_record_structure), or one remaining corroborative term (watchlist, embargo); 85 requires 2 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list. Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (SOCI Act 2018 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.3.1
