schema: testpattern/v1
name: Privileged account inventories
slug: global-top500-309-privileged-account-inventories
version: 1.3.3
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies privileged account inventories patterns in security and access control contexts. Detects potential
  exposure of sensitive security information in international systems.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 6 keywords within 300 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(?:privileged\s+account|privileged\s+access|service\s+account|admin\s+account|privileged\s+identity|domain\s+admin|root\s+account|break\s+glass|credential\s+vault|access\s+review)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
- GDPR
data_categories:
- credentials
- security
corroborative_evidence:
  keywords:
  - privileged account inventories
  - privileged
  - account
  - inventories
  - operations
  - resilience
  proximity: 300
test_cases:
  should_match:
  - value: privileged account
    description: Primary topic phrase match
  - value: privileged access
    description: Case-insensitive topic phrase match
  - value: service account
    description: Alternative topic phrase match
  - value: admin account
    description: Additional topic phrase match
  - value: "privileged account\nHost: fw01.corp 10.20.30.40\nRule 14: allow tcp/443 from 10.20.0.0/16\nFinding: CVE-2025-21298 unpatched on asset ID WS-004471."
    description: Populated tech record reaching the 75/85 structure gate
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: backup outage
    description: Generic word pair from old broad template should not match
  - value: "Policy guidance: this procedure explains how records about privileged account are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Authentication-related terminology in software documentation, security training materials, or system architecture
    descriptions without actual credentials.
  mitigation: Require proximity to credential-specific patterns (API keys, connection strings, tokens) rather than general
    security terminology.
- description: Code snippets and configuration examples containing credential-related keywords or placeholder values in developer
    documentation.
  mitigation: Check for common placeholder patterns (example.com, localhost, 0000) and documentation file types to reduce
    false positives from technical writing.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_privileged_accounts
      matches:
        - ref: Regex_global_top500_309_privileged_account_inventories_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_privileged_accounts
      matches:
        - ref: Regex_global_top500_309_privileged_account_inventories_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_privileged_accounts
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_privileged_accounts
      pattern: (?is)\b(?:privileged\s+account|privileged\s+access|service\s+account|admin\s+account|privileged\s+identity|domain\s+admin|root\s+account|break\s+glass|credential\s+vault|access\s+review)\b
    - id: Regex_global_top500_309_privileged_account_inventories_record_structure
      pattern: >-
        (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\bCVE-\d{4}-\d{4,7}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:tcp|udp)\s*/?\s*\d{2,5}\b|\b(?:port|dport|sport)\s*[:=]?\s*\d{2,5}\b|\b(?:hostname|host|asset\s+ID|device\s+ID|sAMAccountName|UPN|username|account\s+name)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9._\\@-]{2,63}
risk_description: This concept pattern recognizes privileged, service, admin, domain-admin, root, break-glass, vault, and
  access-review terminology associated with a privileged-account inventory. A substantive inventory can identify powerful
  account names, owners, target systems, review status, and emergency-access arrangements, helping attackers choose identities
  for phishing or credential theft even without passwords. The normal scope is the listed administrative estate and its custodians,
  while policy documents and isolated service-account references can match without an inventory. Risk 8 SENSITIVE reflects
  serious contained targeting and access-governance harm; PROTECTED would require actual credentials or a broad critical-account
  register capable of significant damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE InfoTech because an inventory of privileged
    identities materially enables targeting and exposes access-governance controls. PROTECTED is not met because the
    detector does not capture passwords, prove a complete enterprise register, or establish critical protected systems
    and significant damage.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic handling is Medium with Medium InfoTech controls for privileged-account inventories, restricting account
      names, owners, systems, and break-glass details. High is reserved for complete critical-account records paired
      with usable secrets or significant operational consequence.
frameworks:
  - ISO 27001
  - NIST CSF
references:
  - title: "Essential Eight explained | Cyber.gov.au"
    url: https://www.cyber.gov.au/business-government/asds-cyber-security-frameworks/essential-eight/essential-eight-explained
  - title: "Information security manual | Cyber.gov.au"
    url: https://www.cyber.gov.au/business-government/asds-cyber-security-frameworks/ism
