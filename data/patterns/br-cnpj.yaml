schema: testpattern/v1
name: CNPJ
slug: br-cnpj
version: 1.5.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects CNPJ patterns. This pattern is based on a Microsoft Purview built-in sensitive information type. Users already running Purview may prefer to enable the built-in SIT directly, or use this version as a starting point for customisation.
operation: >-
  Validation: Mod 11. Corroborative evidence: 3 keywords within 300 characters. Keyword lists: pii-civic-credentials.
  Checksum: inline Checksum validator Validator_br_cnpj_checksum (Weights 6,7,8,9,2,3,4,5,6,7,8,9,0,0 / Mod 11 /
  CheckDigit 13) checks the first CNPJ check digit only. The CNPJ rule is DV1 = 11 - (sum of digits 1-12 x
  5,4,3,2,9,8,7,6,5,4,3,2 mod 11), with results 10 and 11 meaning 0. Purview compares the remainder itself with the
  check digit, so the weights are the negated CNPJ weights (11 - w); a remainder of 10 is compared as 0, which is the
  CNPJ rule (Purview behaviour measured on a test tenant, see docs/checksum-validator-semantics.md). Do not change
  the weights back to 5,4,3,2,...: that checks a different rule. The second check digit (weights
  6,5,4,3,2,9,8,7,6,5,4,3,2 on digits 1-13, digit 14) is not checked: one Checksum validator holds one rule.
pattern: \b(\d{2}\.?\d{3}\.?\d{3}/?\d{4}-?\d{2})\b
confidence: medium
confidence_justification: >-
  Medium confidence: pattern has structural constraints but corroborative keywords are recommended to reduce false
  positive rates.
jurisdictions:
  - br
regulations:
- LGPD
frameworks:
- ISO 27001
- ISO 27701
data_categories:
  - pii
  - government-id
corroborative_evidence:
  keywords:
    - identifier
    - number
    - ID
  proximity: 300
  keyword_lists:

    - pii-civic-credentials
test_cases:
  should_match:
    - value: 12.345.678/0001-95
      description: Standard CNPJ format (both check digits valid)
    - value: '11222333000181'
      description: CNPJ without punctuation (both check digits valid)
    - value: 13.535.341/1738-06
      description: First check digit is 0 because the weighted sum mod 11 is 1 (Purview compares remainder 10 as 0)
  should_not_match:
    - value: '12.345.678/0001-0'
      description: Only 1 check digit instead of 2
    - value: '12.345.678/0001-012'
      description: 3 check digits instead of 2
    - value: '12.345.67/0001-01'
      description: Only 2 digits in third group instead of 3
    - value: 12.345.678/0001-05
      description: fails mod-11 first check digit (perturbation of valid value 12.345.678/0001-95)
    - value: '11222333000171'
      description: fails mod-11 first check digit (perturbation of valid value 11222333000181)
    - value: 13.535.341/1738-16
      description: fails mod-11 first check digit (perturbation of valid value 13.535.341/1738-06)
false_positives:
  - description: >-
      Common words and phrases related to cnpj appearing in policy documents, training materials, HR templates, or
      compliance guidelines without actual personal data.
    mitigation: >-
      Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than
      general discussion.
  - description: >-
      In Portuguese (Brazil), similar terminology used in formal or administrative contexts (education, professional
      documentation) that does not constitute sensitive data collection.
    mitigation: >-
      Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
      to distinguish sensitive records from general references.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_br_cnpj
      matches:
        - ref: Keyword_br_cnpj
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_br_cnpj
  regexes:
    - id: Regex_br_cnpj
      pattern: \b(\d{2}\.?\d{3}\.?\d{3}/?\d{4}-?\d{2})\b
      validators:
        - ref: Validator_br_cnpj_checksum
  keywords:
    - id: Keyword_br_cnpj
      groups:
        - match_style: word
          terms:
            - CNPJ
            - cadastro nacional
            - pessoa jurídica
            - pessoa juridica
            - corporate tax ID
            - tax registration
            - inscrição
            - inscricao
            - número do CNPJ
            - numero do CNPJ
            - razão social
            - razao social
            - empresa
      strength: specific
  validators:
    - id: Validator_br_cnpj_checksum
      type: Checksum
      params:
        weights: "6,7,8,9,2,3,4,5,6,7,8,9,0,0"
        mod: 11
        checkDigit: 13
  filters:
    - id: Filter_br_cnpj_same_digits
      type: AllDigitsSameFilter
risk_rating: 5
risk_description: >-
  The regex identifies a 14-digit Brazilian CNPJ in punctuated or compact form and applies Mod 11 validation with civic-credential context. A CNPJ identifies a legal entity or establishment and is routinely published on invoices, registries, and business websites, so it is not a personal credential or authority to transact. Misuse is mainly company impersonation, invoice fraud, or correlation with other corporate data, and those acts still require payment instructions, contact channels, or account access. Risk 5 OFFICIAL reflects bounded business-identity harm; SENSITIVE would require linkage to private banking, tax filings, or authentication material.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Low
  rationale: >-
    Risk 5 aligns with PSPF OFFICIAL, QGISCF OFFICIAL, DLM OFFICIAL, and Low tier because a validated CNPJ is a public
    business identifier whose harmful use needs substantial companion data. SENSITIVE is not met by the registration
    number alone.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic handling is appropriate for a public corporate identifier with modest impersonation and correlation
      value. Medium treatment should attach only when the CNPJ is embedded in confidential tax, banking, ownership, or
      transaction records.
references:
  - url: https://learn.microsoft.com/en-us/purview/sit-defn-brazil-legal-entity-number
    title: "Brazil legal entity number (CNPJ) entity definition - Microsoft Learn"
created: '2026-02-08'
updated: '2026-10-31'
changelog:
  - version: 1.5.0
    date: '2026-10-31'
    description: 'Checksum validator fix: the inline Checksum validator exported CheckDigit=0, which Purview rejects ("Param CheckDigit is invalid", 0x8000FFFF), so every rule package containing this pattern failed to upload. Now Weights 6,7,8,9,2,3,4,5,6,7,8,9,0,0 / Mod 11 / CheckDigit 13 (negated CNPJ weights): the first check digit exactly, including the remainder-10-means-0 case. The second check digit is not checked. The regex is unchanged. Test cases replaced with checksum-valid values plus invalid-twin should_not_match values. Test-tenant upload accepted; Test-DataClassification matched the valid values and rejected the invalid twins.'
  - version: 1.4.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.3.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1140 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
