schema: testpattern/v1
name: Counter-Terrorism Assessment File
slug: counter-terrorism-assessment-file
version: 1.5.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects documents containing terrorism threat assessments, persons of interest profiles, and counter-terrorism operational capabilities. Disclosure enables counter-surveillance by terrorist subjects and compromises national security monitoring. Includes JCTT (Joint Counter Terrorism Team) and QPS Security and Counter-Terrorism Group documents.
operation: >-
  Primary: counter-terrorism assessment phrases (counter-terrorism assessment/intelligence/briefing, CT assessment, terrorism threat assessment, radicalisation assessment, fixated threat assessment, foreign fighter profile). 65 = phrase only (discovery). 75 = phrase plus a populated document header field (To, From, Date, Subject, Our ref, File no ...) or a labelled file reference. 85 = phrase plus three distinct populated header fields plus independent CT evidence (JCTT, SCTG, ASIO, AFP, person of interest, radicalisation indicators, hostile reconnaissance ...). Public advisories, media and academic framing excluded.
pattern: (?i)\b(counter[\-\s]terrorism\s+(?:assessment|intelligence|briefing)|CT\s+assessment|terrorism\s+threat\s+assessment|national\s+threat\s+advisory|radicalisation\s+assessment|fixated\s+threat\s+(?:assessment|report)|foreign\s+fighter\s+(?:assessment|profile))\b
confidence: medium
confidence_justification: >-
  Medium confidence: enforcement requires a populated operational document; JCTT file references are unpublished, so the reference is a documented label-anchored fallback.
jurisdictions:
  - global
regulations:
  - "Criminal Code Act 1995 (Cth)"
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
corroborative_evidence:
  keywords:
    - PROTECTED
    - Law-Enforcement
    - NATIONAL SECURITY
    - JCTT
    - Joint Counter Terrorism Team
    - SCTG
    - Security and Counter-Terrorism Group
    - ASIO
    - AFP
    - National Terrorism Threat Level
    - person of interest
    - radicalisation indicators
    - attack planning
    - threat to life
    - fixated person
  proximity: 300
  keyword_lists:

    - law-enforcement
    - en-government-classification
customisation:
  - key: case-reference-number
    kind: identifier-format
    identifier: case-reference-number
    target: purview.regexes/Regex_counter_terrorism_assessment_file_case_reference
    mode: replace
    affects_tiers: [75]
    required_for_enforcement: false
    note: Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#case-reference-number). Earlier versions used the CT-YYYY-AGENCY-NNNN JCTT reference format, which does not appear in any published source.
test_cases:
  should_match:
    - value: 'PROTECTED — NATIONAL SECURITY. Counter-Terrorism Assessment. File number: JCTT-2025-0089. Subject: Ahmed Khalil FAROUK, DOB 14/07/1993. Radicalisation assessment: Subject has been consuming extremist material online and has expressed support for ISIL. National Terrorism Threat Level: PROBABLE. Recommendation: elevated monitoring and AFP referral.'
      description: JCTT counter-terrorism assessment with subject identification and radicalisation indicators (reaches 75)
    - value: 'QPS Security and Counter-Terrorism Group intelligence briefing. Fixated threat assessment for subject who has issued threats against Queensland Parliament House. CT assessment indicates subject has conducted hostile reconnaissance. Foreign fighter database check: negative. ASIO referral recommended under s.4 of ASIO Act.'
      description: QPS SCTG fixated threat assessment with ASIO referral recommendation (65 discovery only - prose without populated record fields)
    - value: Terrorism threat assessment update — Operation SENTINEL. Three persons of interest identified in South-East Queensland with links to foreign fighter networks. Counter-terrorism intelligence indicates planned travel to conflict zone. National threat advisory distributed to all JCTT partner agencies.
      description: Multi-subject terrorism threat assessment with foreign fighter network links (65 discovery only - prose without populated record fields)
    - value: "PROTECTED — NATIONAL SECURITY\nTo: Commander, Security and Counter-Terrorism Group\nFrom: JCTT Queensland\nDate: 12/09/2026\nSubject: Counter-terrorism assessment — person of interest Avery Teston\nFile number: JCTT-2026-0417\nRadicalisation indicators and hostile reconnaissance of a stadium noted; AFP and ASIO consulted."
      description: 'Populated CT assessment minute: To/From/Date/Subject headers and file number plus JCTT/ASIO evidence (reaches 85)'
      synthetic: true
    - value: "Terrorism threat assessment\nFile number: JCTT-2026-0512\nAssessment attached for the duty officer."
      description: Labelled file reference with the CT primary (reaches 75)
      synthetic: true
  should_not_match:
    - value: The Australian Government has set the National Terrorism Threat Level at PROBABLE, meaning a terrorist attack is likely. The public is advised to be vigilant and report suspicious behaviour to the National Security Hotline.
      description: Public terrorism threat level announcement
    - value: Researchers at the Australian National University published a study on radicalisation pathways among Australian foreign fighters who travelled to Syria. The study used publicly available court records and media reports.
      description: Academic research on radicalisation using public sources
    - value: The ABC Four Corners program investigated Australia's counter-terrorism framework, interviewing former ASIO officers about the challenges of monitoring persons of interest within the community.
      description: Television journalism about counter-terrorism with former officials
    - value: "Policy guidance: this procedure explains how records about Counter-Terrorism Assessment are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: "Counter-terrorism assessment — minute\nTo: __________\nFrom: __________\nDate: __________\nSubject: __________\nFile number: __________"
      description: Blank form / template with unfilled fields (must stay below 75)
    - value: "News: a documentary on counter-terrorism intelligence featured former officers describing how a terrorism threat assessment is prepared."
      description: News or training text naming the topic (must stay below 75)
false_positives:
  - description: Public national terrorism threat level announcements and advisories
    mitigation: 'Negative keyword exclusion: ''public advisory'', ''public announcement'', ''media release'', ''public is advised''. Require proximity to specific subject identifiers.'
  - description: Academic research on terrorism and radicalisation
    mitigation: 'Negative keyword exclusion: ''academic'', ''university'', ''researcher'', ''study'', ''published'', ''journal'', ''court records'''
  - description: Media reporting and documentaries on counter-terrorism
    mitigation: 'Negative keyword exclusion: ''news'', ''media'', ''Four Corners'', ''documentary'', ''former officer'', ''interview'', ''television'''
  - description: Government policy documents on counter-terrorism strategy
    mitigation: 'Negative keyword exclusion: ''strategy document'', ''white paper'', ''policy framework'', ''national strategy'', ''public consultation'''
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_counter_terrorism_assessment_file_ct_assessment_terms
      matches:
        - ref: Regex_counter_terrorism_assessment_file_record_structure
          min_count: 3
          unique_results: true
        - ref: Evidence_counter_terrorism_assessment_file_corroborative_terms
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_counter_terrorism_assessment_file_exclusion
    - confidence_level: 75
      id_match: Pattern_counter_terrorism_assessment_file_ct_assessment_terms
      matches:
        - type: any
          refs:
            - Regex_counter_terrorism_assessment_file_record_structure
            - Regex_counter_terrorism_assessment_file_case_reference
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_counter_terrorism_assessment_file_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_counter_terrorism_assessment_file_ct_assessment_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_counter_terrorism_assessment_file_exclusion
  regexes:
    - id: Pattern_counter_terrorism_assessment_file_ct_assessment_terms
      pattern: (?i)\b(counter[\-\s]terrorism\s+assessment|CT\s+assessment|terrorism\s+threat\s+assessment|radicalisation\s+assessment|fixated\s+threat)\b
    - id: Regex_counter_terrorism_assessment_file_record_structure
      pattern: >-
        (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!_{2,}|\[|<)[A-Za-z0-9]
    - id: Regex_counter_terrorism_assessment_file_case_reference
      pattern: >-
        (?i)\b(?:case|file|matter|reference)\s+(?:no\.?|number|ID|#)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{3,20}\b
  keywords:
    - id: Evidence_counter_terrorism_assessment_file_corroborative_terms
      groups:
        - match_style: word
          terms:
            - JCTT
            - Joint Counter Terrorism Team
            - SCTG
            - Security and Counter-Terrorism Group
            - ASIO
            - text: AFP
              case_sensitive: true
            - National Terrorism Threat Level
            - person of interest
            - radicalisation indicators
            - attack planning
            - hostile reconnaissance
            - foreign fighter
      strength: specific
    - id: Filter_counter_terrorism_assessment_file_exclusion
      groups:
        - match_style: word
          terms:
            - media release
            - published
            - annual report
            - public advisory
            - academic
            - university
            - research
            - news article
            - television
            - documentary
            - public consultation
            - white paper
            - former officer
            - interview

      strength: noise
risk_rating: 10
risk_description: >-
  This detector finds a counter-terrorism assessment containing threat analysis, radicalisation indicators, persons of interest, foreign-fighter links, or fixated-threat recommendations. A genuine file can reveal monitoring focus and analytic judgments, allowing a subject to alter behaviour, conceal associations, or avoid referral and surveillance. Disclosure can reveal subjects, sources, threat judgements, intelligence gaps and planned action, enabling evasion or an attack and endangering people. Significant national-interest and life-safety harm is inherent. Once corroborated as an actual Counter-Terrorism Assessment File record, risk 10 and PROTECTED Law-Enforcement are proportionate to the significant damage disclosure can cause.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Law-Enforcement
classification:
  tier: High
  rationale: >-
    The QLD custom classifier is assessed on its confirmed substantive record rather than an uncorroborated topic hit.
    Disclosure can reveal subjects, sources, threat judgements, intelligence gaps and planned action, enabling evasion
    or an attack and endangering people. Significant national-interest and life-safety harm is inherent. The major
    consequence supports risk 10 and a consistent PROTECTED crosswalk using PROTECTED Law-Enforcement, PROT_Law and High
    handling.
  generic:
    classification: High
    dlm: High Law-Enforcement
    rationale: >-
      Counter-terrorism assessments are High Law-Enforcement information because subjects, sources, intelligence gaps
      and planned actions can affect national security and life safety. The QLD custom classifier carries High
      Law-Enforcement handling when its substantive match is confirmed.
references:
  - title: Criminal Code Act 1995 (Cth)
    url: https://www.legislation.gov.au/C2004A04868/latest/text
created: '2026-02-20'
updated: '2026-09-25'
changelog:
  - version: 1.5.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): rebuilt tiers - 75 needs a populated document header field or a labelled file reference, 85 needs three distinct header fields plus independent CT evidence (JCTT, ASIO, AFP, radicalisation indicators ...); removed the invented CT-YYYY-AGENCY-NNNN regex in favour of the case-reference-number labelled fallback (identifier-format slot); dropped the single-term NATIONAL SECURITY marker group; tests converted with 85/75 positives and blank-form/news decoys; references added.'
  - version: 1.4.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires either independent doc record structure (Regex ..._record_structure) or one of the hand-authored corroborative terms (none of which the primary matches); 85 requires 3 distinct structure hits plus the existing hand-authored evidence. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.3.2
    date: '2026-07-15'
    description: 'v25 authoritative risk alignment from Compl8DLPDeploy workbook row 1478; detector and package metadata unchanged.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1478 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
