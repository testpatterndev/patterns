schema: testpattern/v1
name: Patent Prosecution Strategy Pre-Filing
slug: patent-prosecution-strategy-pre-filing
version: 1.6.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: 'Detects legal strategy for patent prosecution before filing, including prior art assessments, claim drafting strategy, and freedom-to-operate opinions. Disclosure destroys patent novelty or reveals prosecution strategy to competitors. Note: trainable classifier recommended for production deployment.'
operation: 'Primary: patent prosecution/application/strategy/filing/assessment, pre-filing patent/strategy/assessment, patentability assessment/opinion, freedom-to-operate opinion/analysis. 65 (discovery only) = primary alone. 75 = primary plus two distinct populated invention/matter fields (Invention (title), Inventor(s), Applicant, Client, Matter, Our/File ref, Priority date, Filing deadline/date/target, Prior art (assessment/search/references), Draft claim(s), Claim N, Jurisdictions, Prepared by/for, Subject, Date, To, From). 85 = primary plus three distinct fields plus independent patent-strategy evidence (prior art, novelty, inventive step, design-around, blocking patent, provisional application, claim drafting). Granted-patent, PCT-publication, textbook and template exclusions and the patent-number filters apply to every tier.'
pattern: (?i)\b(?:patent\s+(?:prosecution|application|strategy|filing|assessment)|pre[\s-]filing\s+(?:patent|strategy|assessment)|patentability\s+(?:assessment|opinion)|freedom[\s-]to[\s-]operate\s+(?:opinion|analysis))\b
confidence: medium
confidence_justification: 'Medium: patent strategy vocabulary also appears in published patents, textbooks and IP Australia guidance, so enforcement requires populated invention/matter fields; 85 adds substantive strategy evidence. A trainable classifier is still recommended for prose-heavy strategy memos.'
jurisdictions:
  - global
regulations:
- "Patents Act 1990 (Cth)"
frameworks:
  - QGISCF
  - ISO 27001
data_categories:
  - legal
corroborative_evidence:
  keywords:
    - pre-filing
    - draft claims
    - prior art
    - freedom to operate
    - FTO
    - novelty
    - privilege
    - PROTECTED
    - CONFIDENTIAL
    - claim drafting
    - patentability
    - inventive step
    - provisional application
  proximity: 300
  keyword_lists:

    - corporate-legal
test_cases:
  should_match:
    - value: |-
        CONFIDENTIAL - LEGAL PROFESSIONAL PRIVILEGE
        Patent Prosecution Strategy - Pre-Filing

        Invention: Novel water purification membrane (UQ Research Collaboration)
        Prior Art Assessment: Three potentially invalidating references identified

        Draft claims strategy: Narrow independent claim 1 to avoid Smith et al. (2023) prior art.
      description: 85 - populated invention, prior-art and draft-claims fields plus prior-art evidence
    - value: |-
        PROTECTED
        Pre-Filing Patent Assessment
        Client: Queensland Health Innovation Unit
        Subject: Novel rapid diagnostic test - COVID variant detection

        Patentability assessment: Novelty confirmed subject to prior art search. Draft claims attached for review before provisional application lodgement.
      description: 75 - two populated fields (Client, Subject); strategy evidence present but only two fields
    - value: |-
        Patent filing strategy - privileged
        Invention title: Low-power soil moisture sensor
        Inventors: A. Teston, J. Staffson
        Priority date: 01/10/2026
        Novelty and inventive step look strong; a design-around of the Harbour patent is not needed.
      description: 85 - populated invention record with novelty/inventive-step evidence
      synthetic: true
    - value: |-
        Patent application strategy
        Matter: IP-2026-118
        Filing deadline: 30/10/2026
        Team to confirm the lodgement plan next week.
      description: 75 - two populated matter fields without strategy evidence
      synthetic: true
    - value: Patent strategy discussion agenda.
      description: 65 discovery - topic without populated fields
    - value: Patent application strategy for a pre-filing meeting before lodgement.
      description: 65 discovery - pre-filing mention without populated fields
    - value: 'PRIVILEGED Patent Pre-Filing Strategy: draft claim 1 avoids Jones prior art; novelty confirmed before provisional application.'
      description: 65 discovery - one-line strategy without populated fields
    - value: This privileged patent strategy addresses the freedom to operate analysis for the new diagnostic device. The FTO opinion identifies two blocking patents requiring design-around strategy before patent application filing.
      description: 65 discovery - prose FTO opinion without populated fields
  should_not_match:
    - value: Australian Patent No. 2024123456 was granted on 15 March 2025. The published patent specification describes a water purification membrane with improved flux characteristics.
      description: Published granted patent
    - value: PCT Publication WO/2025/012345 discloses a method for rapid diagnostic testing. The published international application is available through WIPO PatentScope.
      description: Published PCT patent application
    - value: This textbook chapter provides an overview of patent prosecution strategy in Australia. Students should understand the requirements for novelty, inventive step, and utility under the Patents Act 1990.
      description: Academic textbook (training) on patent law
    - value: The product team patented a new packaging colour last year.
      description: Past-tense patenting mention
    - value: 'Textbook exercise: draft claims after reviewing sample prior art.'
      description: Instructional material without a patent primary anchor
    - value: |-
        Invention disclosure and pre-filing assessment form
        Invention title: ________
        Inventors: ________
        Priority date: [DD/MM/YYYY]
        Prior art search: ________
      description: Blank invention disclosure form - placeholder fields are rejected
    - value: File a provisional patent application before any public disclosure so that novelty is protected, IP Australia advises.
      description: Public guidance - no populated fields (65 at most)
false_positives:
  - description: Published granted patents and patent specifications
    mitigation: Negative match on 'granted', 'Patent No.', 'published specification'
  - description: Published PCT or international patent applications
    mitigation: Negative match on 'PCT Publication', 'WO/', 'published application', 'PatentScope'
  - description: Academic materials on patent prosecution
    mitigation: Require co-occurrence with specific invention details and privilege/PROTECTED markers
  - description: Patent office examination reports (public documents)
    mitigation: Negative match on 'examination report', 'office action', 'examiner's report'
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_patent_prosecution_strategy_primary
      matches:
        - ref: Regex_patent_prosecution_strategy_record_structure
          min_count: 3
          unique_results: true
        - ref: Evidence_patent_strategy_analysis
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - exclusion
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_patent_prosecution_strategy_primary
      matches:
        - ref: Regex_patent_prosecution_strategy_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - exclusion
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_patent_prosecution_strategy_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - exclusion
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_patent_prosecution_strategy_primary
      pattern: (?i)\b(?:patent\s+(?:prosecution|application|strategy|filing|assessment)|pre[\s-]filing\s+(?:patent|strategy|assessment)|patentability\s+(?:assessment|opinion)|freedom[\s-]to[\s-]operate\s+(?:opinion|analysis))\b
    - id: Regex_patent_prosecution_strategy_record_structure
      pattern: (?i)\b(?:Invention(?:\s+title)?|Inventors?|Applicant|Client|Matter(?:\s+(?:no\.?|number))?|Our\s+ref|File\s+ref|Priority\s+date|Filing\s+(?:deadline|date|target)|Target\s+filing\s+date|Prior\s+art(?:\s+(?:assessment|search|references?))?|Draft\s+claims?(?:\s+strategy)?|Claim\s+\d{1,2}|Jurisdictions?|Prepared\s+(?:by|for)|Subject|Date|To|From)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<)[A-Za-z0-9$]
  keywords:
    - id: Evidence_patent_strategy_analysis
      groups:
        - match_style: word
          terms:
            - prior art
            - novelty
            - inventive step
            - design-around
            - blocking patent
            - blocking patents
            - provisional application
            - claim drafting
            - independent claim
      strength: domain
    - id: exclusion
      groups:
        - match_style: word
          terms:
            - granted
            - Patent No.
            - published specification
            - PCT Publication
            - text: WO/
              case_sensitive: true
            - PatentScope
            - textbook
            - examination report
      strength: domain
  filters:
    - type: exclude_pattern
      pattern: (?i)\b(?:Patent\s+No\.?|AU\s*)\d{4,}
      description: Exclude granted patent number references
    - type: exclude_pattern
      pattern: (?i)WO/\d{4}/\d+
      description: Exclude PCT publication numbers
risk_rating: 7
risk_description: >-
  The detector targets pre-filing patent legal strategy, including draft claims, novelty and prior-art analysis, freedom-to-operate conclusions, and prosecution choices. Disclosure before filing can destroy novelty, expose blocking patents or design-around plans, and let a competitor anticipate or undermine the applicant's claims. Published patents, granted specifications, public PCT applications, examination reports, and academic guidance are excluded, although the remaining concept classifier is low confidence. Risk 7 warrants SENSITIVE Legal; PROTECTED would require a uniquely valuable invention portfolio or disclosure causing significant, irreversible strategic damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
classification:
  tier: Medium
  rationale: >-
    Risk 7 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Legal, and Medium because pre-filing
    strategy can materially prejudice patent rights and competitive position. PROTECTED is not met for one prosecution
    assessment without exceptional portfolio value or significant enterprise damage.
  generic:
    classification: Medium
    dlm: Medium Legal
    rationale: >-
      Medium with Medium Legal DLM protects unpublished claim and freedom-to-operate strategy while keeping public
      patent materials outside elevated handling.
references:
  - title: Patents Act 1990 (Cth)
    url: https://www.legislation.gov.au/C2004A04014/latest/text
  - title: IP Australia - Patents
    url: https://www.ipaustralia.gov.au/patents
created: '2026-02-20'
updated: '2026-09-25'
changelog:
  - version: 1.6.1
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.6.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): Replaced the legacy keyword primary (which included bare "patent") with an id-bearing regex primary for prosecution/application/strategy/filing, pre-filing, patentability and FTO opinions. 75 now requires two distinct populated invention/matter fields (new Regex_..._record_structure) instead of pre-filing keywords; 85 requires three fields plus strategy evidence (freedom to operate / FTO / patentability removed from that group because the primary matches them). Wired the shared template-exclusion dictionary into every tier with the existing exclusion group and filters; dropped the pre-filing-state and privilege-marking groups; recommended_confidence 85 -> 75; confidence low -> medium to match the gated design. Added populated 85/75 positives, a blank disclosure-form and a public-guidance decoy; one-line/prose positives re-described as 65. Added ISO 27001, Patents Act and IP Australia references.'
  - version: 1.5.0
    date: '2026-07-19'
    description: 'Targeted blocker remediation: complete the deferred evidence split into canonical pre-filing-state, substantive-strategy, and privilege/marking references; make FTO and WO/ case-sensitive; add distinct 65/75/85 tiers and exact probes while retaining granted, PCT, public, and textbook exclusions.'
  - version: 1.4.0
    date: '2026-07-17'
    description: 'TP-01537 approved reduced scope: add a policy-capable 75 tier wiring the existing primary keyword group to the existing corroborative group, NOT-gated by the existing exclusion group; the existing granted-patent-number and PCT-publication exclude_pattern filters continue to apply (all references pre-existing; no new detection structure). The 65 tier remains discovery-only. Deferred per QA/independent review: the proposed 85 tier, pending a split of the flat corroborative group into separate pre-filing-state, strategy-analysis, and privilege/marking references. The trainable-classifier recommendation for prose-heavy cases stands. Added a privileged pre-filing positive and patented-mention/textbook negatives.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1470 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-12'
    description: 'Baseline burn-down B: the sole pattern_tier had id_match: '''' (empty string) — idMatchIds() treats an empty id_match string as [], so scripts/verify-pattern-testcases.mjs tierEvaluable() filtered the tier out entirely (0 evaluable tiers), which routed should_not_match evaluation through the hard-fail no-tiers-to-gate-it path instead of the discovery_only warn path the tier was designed for. Wired id_match to the existing purview.keywords group id primary (already registered under the group: primary key), making the tier evaluable again; the tier remains discovery_only so top-level hits on published-patent and textbook prose now surface only as discovery-inventory warnings, not should_not_match failures. Verified: 0 FAILs, all 3 should_not_match negatives (granted patent, published PCT application, academic textbook) clear; all 3 should_match positives still pass via top-level pattern.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove the dead template-exclusion declaration (Keyword_noise_exclusion) — no tier referenced it and the legacy tier shape carries no evidence lists to wire it into (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Downgraded weak high-confidence tier to 65 because independent specific/domain evidence was insufficient.; Downgraded weak medium-confidence tier to low because evidence was generic, structural, or absent.
author: qld-gov-dlp
