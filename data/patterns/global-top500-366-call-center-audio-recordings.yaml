schema: testpattern/v1
name: Call center audio recordings
slug: global-top500-366-call-center-audio-recordings
version: 1.5.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects call centre audio recordings and transcripts: a call recording / call transcript phrase combined with populated call structure - audio file names, call metadata (call ID, interaction ID, ANI/CLI, agent), timestamped transcript turns or labelled customer fields. Phrase-only mentions (recording notices, policies) stay discovery-only.
operation: >-
  Pattern type: regex (boost_regex). Primary: call centre/center (audio) recording(s), call recording(s), recorded call(s), voice recording(s), call transcript(s), audio recording of the call, interaction recording(s). 65 (discovery only): primary alone. 75: primary plus one populated structure - an audio file name (.wav/.mp3/.m4a/.ogg/.opus/.gsm/.wma/.flac), call metadata (call ID/reference, interaction ID, recording ID, ANI/CLI, caller ID/number, agent ID/name, call date/time) with a value, a timestamped transcript turn ([00:12] Agent:), or a labelled customer/account/member field. 85: primary plus two distinct structures plus call-content evidence (consent to record, this call may be recorded, verification questions, date of birth, complaint, hardship, payment arrangement, card number, sentiment, quality score). Template/sample and guidance/news framing excluded on every enforce tier.
pattern: >-
  (?i)\b(?:call\s+cent(?:er|re)\s+(?:audio\s+)?recordings?|call\s+recordings?|recorded\s+calls?|voice\s+recordings?|call\s+transcripts?|audio\s+recordings?\s+of\s+(?:the\s+)?calls?|interaction\s+recordings?)\b
confidence: medium
confidence_justification: >-
  Enforce tiers require populated call structure beside the recording phrase; the previous tiers fired on generic phrases such as 'call center' and 'quality assurance' (removed from the primary). Recording notices and retention policies stay at 65. Medium because QA scorecards reference recordings with the same metadata. Tenant verdict NOT_DETECTED (2026-07-06) predates this change - re-run classification.
jurisdictions:
  - global
regulations:
  - Privacy Act 1988 (Cth)
  - Telecommunications (Interception and Access) Act 1979 (Cth)
  - Invasion of Privacy Act 1971 (Qld)
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - consent to record
    - this call may be recorded
    - verification questions
    - date of birth
    - complaint
    - hardship
    - payment arrangement
    - card number
    - sentiment
    - quality score
  proximity: 300
test_cases:
  should_match:
    - value: "Call recording export - Customer Care queue\nCall ID: 7741-20260912-0831\nAgent name: Casey Rourke\nCustomer: Avery Teston\nFile: CC_7741_20260912_0831.wav (duration 14:32)\n[00:12] Agent: Thanks for calling, this call may be recorded. Can I confirm your date of birth?\n[00:18] Customer: It's the fourth of February 1991."
      description: Recording export - metadata, customer, audio file and transcript turns (85)
      synthetic: true
    - value: "Call transcript\nInteraction ID: 99812-4471\nEscalated to team leader."
      description: Transcript note with call metadata only (75)
      synthetic: true
  should_not_match:
    - value: "Policy guidance: call recordings are retained for 7 years. Agents must tell callers that the call may be recorded and stop recording when card details are read out."
      description: Recording policy
      synthetic: true
    - value: "CALL RECORDING REQUEST\nCall ID: __________\nAgent name: __________\nCustomer: __________"
      description: Blank request form - placeholder values
      synthetic: true
    - value: "The telco was fined after call centre recordings of customers were left on an unsecured server, a news report said."
      description: News item
      synthetic: true
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
    - value: "customer invoice"
      description: Generic word pair
false_positives:
  - description: Recording notices ('this call may be recorded'), retention schedules and call-centre policies.
    mitigation: No populated call structure, and guidance framing is excluded.
  - description: Quality-assurance scorecards referencing recordings.
    mitigation: They can reach 75 through call metadata; they still reference identifiable calls.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_call_center_audio
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_top500_366_call_center_audio_recordings_audio_file
            - Regex_global_top500_366_call_center_audio_recordings_call_metadata
            - Regex_global_top500_366_call_center_audio_recordings_transcript_turn
            - Regex_global_top500_366_call_center_audio_recordings_customer
        - ref: Keyword_global_top500_366_call_center_audio_recordings_domain_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_366_call_center_audio_recordings_guidance_exclusion
    - confidence_level: 75
      id_match: Pattern_call_center_audio
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_top500_366_call_center_audio_recordings_audio_file
            - Regex_global_top500_366_call_center_audio_recordings_call_metadata
            - Regex_global_top500_366_call_center_audio_recordings_transcript_turn
            - Regex_global_top500_366_call_center_audio_recordings_customer
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_366_call_center_audio_recordings_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_call_center_audio
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Pattern_call_center_audio
      pattern: (?i)\b(?:call\s+cent(?:er|re)\s+(?:audio\s+)?recordings?|call\s+recordings?|recorded\s+calls?|voice\s+recordings?|call\s+transcripts?|audio\s+recordings?\s+of\s+(?:the\s+)?calls?|interaction\s+recordings?)\b
    - id: Regex_global_top500_366_call_center_audio_recordings_audio_file
      pattern: (?i)\b[A-Z0-9][A-Z0-9_-]{2,80}\.(?:wav|mp3|m4a|ogg|opus|gsm|wma|flac)\b
    - id: Regex_global_top500_366_call_center_audio_recordings_call_metadata
      pattern: (?i)\b(?:call\s*(?:ID|ref(?:erence)?|no\.?|number)|interaction\s+ID|recording\s+ID|ANI|CLI|caller\s+(?:ID|number)|agent\s+(?:ID|name)|call\s+(?:date|start|time))[ \t]{0,3}[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9+(][A-Za-z0-9 +()/:.-]{2,40}
    - id: Regex_global_top500_366_call_center_audio_recordings_transcript_turn
      pattern: '(?i)(?:\[\d{1,2}:\d{2}(?::\d{2})?\][ \t]{0,3}(?:agent|caller|customer|CSR|rep|speaker[ \t]?\d)|\b(?:agent|caller|customer|speaker[ \t]?\d)[ \t]{0,3}\(\d{1,2}:\d{2}(?::\d{2})?\))[ \t]{0,3}:'
    - id: Regex_global_top500_366_call_center_audio_recordings_customer
      pattern: (?i)\b(?:customer(?:\s+(?:name|no\.?|number|ID))?|account\s*(?:no\.?|number)|caller\s+name|member\s*(?:no\.?|number))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)[A-Z0-9$][A-Za-z0-9/&'.,$%-]{0,40}(?:[ \t]{1,3}[A-Za-z0-9&$][A-Za-z0-9/&'.,$%-]{0,30}){0,5}
  keywords:
    - id: Keyword_global_top500_366_call_center_audio_recordings_domain_evidence
      groups:
        - match_style: word
          terms:
            - consent to record
            - this call may be recorded
            - verification questions
            - date of birth
            - complaint
            - hardship
            - payment arrangement
            - card number
            - sentiment
            - quality score
      strength: domain
    - id: Keyword_global_top500_366_call_center_audio_recordings_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - retained for 7 years
            - unsecured server
      strength: noise
risk_description: >-
  The concept detector recognises call-centre audio, recorded calls, agent interactions, and recording language, with the normal true positive being an audio file or recording record rather than a notice that calls may be recorded. A genuine recording can contain a customer's voice, identity checks, contact details, account information, complaints, health or financial circumstances, and an agent's internal statements, enabling impersonation, fraud, embarrassment, or legal prejudice. The medium-confidence regex can also match scripts, consent notices, and recording policies without audio content. Risk 8 and SENSITIVE Personal-Privacy reflect serious direct and evidentiary harm; PROTECTED would require highly sensitive protected persons, usable credentials, or a corpus whose disclosure could cause significant damage. Quality pass 2026-09-24: enforce tiers (75/85) now require populated records - rows keyed by an identifier, labelled values or identifiers - so topic mentions in guidance, marketing and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 corresponds to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, the Personal-Privacy DLM, and Medium for a
    recorded customer interaction. PROTECTED is not met because a normal call lacks archive scale, privileged system
    control, and a demonstrated path to significant broad damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium classification and Medium Personal-Privacy DLM protect voice, identity, and transactional conversation
      combined within a normal customer call recording.
