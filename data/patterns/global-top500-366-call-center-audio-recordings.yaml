    date: '2026-09-25'
    description: >-
      References completed: every reference has a title and a verified URL (updated APP guidelines URL (old path
      redirects); GDPR EUR-Lex URL unverified (EUR-Lex serves a bot challenge to automated fetches; official ELI link)).
  - version: 1.5.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.5.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were corroborated only by the primary's own phrase list (same-span self-corroboration) so they fired on the bare topic phrase; 75 now needs an audio file name, populated call metadata, a timestamped transcript turn or a labelled customer field and 85 needs two distinct structures plus call-content evidence. Removed the self-corroborating evidence group and generic primaries (call center, audio recording, call monitoring, quality assurance, call log, agent interaction). Replaced bare-phrase test values with populated synthetic records and added guidance, blank-extract and news decoys. Dropped AML/CTF Act, HRIPA and My Health Records Act; kept TIA Act and added the Invasion of Privacy Act 1971 (Qld) with a verified reference. Tenant verdict (NOT_DETECTED, 2026-07-06) predates this change and needs a re-run.
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 953 without changing detector or package metadata.'
  - version: 1.4.0
