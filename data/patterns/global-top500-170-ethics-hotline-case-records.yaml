schema: testpattern/v1
name: Ethics hotline case records
slug: global-top500-170-ethics-hotline-case-records
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to ethics hotline case records in Australian contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters.'
pattern: >-
  (?is)\b(?:ethics\s+hotline\s+case\s+records|ethics\s+hotline|whistleblower\s+hotline|anonymous\s+report|case\s+record|complaint\s+intake|ethics\s+violation|code\s+of\s+conduct|misconduct\s+report|confidential\s+disclosure|speak\s+up|integrity\s+line)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - ethics hotline case records
    - ethics
    - hotline
    - case
    - records
    - corporate
    - legal
    - governance
  proximity: 300
test_cases:
  should_match:
    - value: ethics hotline case records
      description: Primary topic phrase match
    - value: ethics hotline
      description: Case-insensitive topic phrase match
    - value: whistleblower hotline
      description: Alternative topic phrase match
    - value: anonymous report
      description: Additional topic phrase match
    - value: |-
        Ethics hotline case records
        Name: Avery Teston
        Date of birth: 14/02/1988
        Client number: C4471820
      description: Populated person/client record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: board policy
      description: Generic word pair from old broad template should not match
    - value: |-
        Ethics hotline case records:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about ethics hotline case records are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to ethics hotline case records appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_ethics_hotline
      matches:
        - ref: Regex_global_top500_170_ethics_hotline_case_records_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_ethics_hotline
      matches:
        - ref: Regex_global_top500_170_ethics_hotline_case_records_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_ethics_hotline
  regexes:
    - id: Pattern_ethics_hotline
      pattern: >-
        (?is)\b(?:ethics\s+hotline\s+case\s+records|ethics\s+hotline|whistleblower\s+hotline|anonymous\s+report|case\s+record|complaint\s+intake|ethics\s+violation|code\s+of\s+conduct|misconduct\s+report|confidential\s+disclosure|speak\s+up|integrity\s+line)\b
    - id: Regex_global_top500_170_ethics_hotline_case_records_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
risk_description: >-
  The classifier recognises ethics-hotline cases, whistleblower hotlines, anonymous reports, and related records with eight contextual terms. A genuine case can contain the reporter's identity or clues, allegations, accused employees, interview notes, triage decisions, and retaliation concerns, enabling intimidation or procedural unfairness if leaked. The normal case presents serious personal harm within one organisation but does not automatically expose a protected government source or life-threatening situation. Risk 8 supports SENSITIVE Personal-Privacy; PROTECTED would require an identified source facing acute danger, a major protected investigation, or broad compromise of hotline records.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Personal-Privacy because a live hotline
    case can expose reporters, accused people, witnesses, and untested allegations. PROTECTED is not met for a normal
    organizational complaint without severe retaliation risk, protected operations, or significant irreversible harm.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium with Medium Personal-Privacy handling is appropriate for one ethics case containing identities and
      allegations. High is reserved for exceptional cases involving severe safety or protected-operation consequences.
references:
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "OAIC - Notifiable Data Breaches scheme"
    url: https://www.oaic.gov.au/privacy/notifiable-data-breaches
