schema: testpattern/v1
name: Microsoft Entra User Credentials
slug: azure-entra-user-credentials
version: 1.5.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects Microsoft Entra (formerly Azure AD) user credential patterns including username/password combinations targeting Microsoft login endpoints. This pattern is based on a Microsoft Purview
  built-in sensitive information type. Users already running Purview may prefer to enable the built-in SIT directly, or use this version as a starting point for customisation.
operation: >-
  Matches user credential patterns that include Microsoft Entra usernames (typically email format with onmicrosoft.com or custom domain) combined with password values in code, configuration, or
  documents. Corroborative evidence: 8 keywords within 300 characters. Keyword lists: credentials. Uses additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?i)((?:username|user[._-]?id|upn)\s*[:=]\s*"?[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(?:onmicrosoft\.com|com|org|net)"?\s*[;,\n]\s*(?:password|pwd)\s*[:=]\s*"?[^\s"';,]{6,}"?)
confidence: high
confidence_justification: >-
  High confidence: email-format username combined with password assignment and Microsoft domain context provides strong structural constraint. Added context gating and exclusion rules improve
  precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
frameworks:
  - CIS Controls
  - ISO 27001
  - NIST CSF
  - PCI-DSS
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - Entra
    - Azure AD
    - onmicrosoft.com
    - login.microsoftonline.com
    - user credentials
    - username
    - password
    - Microsoft 365
  proximity: 300
  keyword_lists:
    - credentials
    - data-record-context
    - generic-data-labels
test_cases:
  should_match:
    - value: username=admin@contoso.onmicrosoft.com;password=P@ssw0rd123
      description: Entra user credentials with onmicrosoft.com domain
    - value: |-
        user_id="user@example.com"
        password="TestS3cret"
      description: User credentials in config format
    - value: upn=test@contoso.com,pwd=000000000000
      description: UPN with password placeholder
  should_not_match:
    - value: username=admin@contoso.onmicrosoft.com
      description: Username without password
    - value: The user must enter their password to log in
      description: Documentation text, not actual credentials
    - value: template example placeholder record identifier
      description: Template/sample context should be excluded even when anchor words are present
false_positives:
  - description: Microsoft identity documentation with example user credentials.
    mitigation: Check for common example domains (contoso.com, example.com) and placeholder passwords.
  - description: Automated test scripts with test account credentials.
    mitigation: Flag for review since test credentials may still provide access to test environments.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: specific
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_azure_entra_user_credentials
      matches:
        - ref: Keyword_azure_entra_user_creds
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    # Populated label alone is 75 (self-corroboration convention); 85 needs
    # independent context outside the label.
    - confidence_level: 75
      id_match: Regex_azure_entra_user_credentials
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_azure_entra_user_credentials
      pattern: (?i)((?:username|user[._-]?id|upn)\s*[:=]\s*"?[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(?:onmicrosoft\.com|com|org|net)"?\s*[;,\n]\s*(?:password|pwd)\s*[:=]\s*"?[^\s"';,]{6,}"?)
  keywords:
    - id: Keyword_azure_entra_user_creds
      groups:
        - match_style: word
          terms:
            - Entra
            - Azure AD
            - login.microsoftonline.com
            - user credentials
            - Microsoft 365
            - sign-in
            - user principal name
            - tenant
            - authentication
      strength: domain
risk_rating: 8
risk_description: >-
  The pattern finds a Microsoft Entra user principal name or email paired with a password value in code, configuration, or documents. An attacker can attempt direct sign-in, reuse the password against related services, or conduct convincing account-recovery and phishing activity against the named person. The immediate affected party is one user and the resources allowed to that identity, with MFA, conditional access, account status, and role membership limiting actual reach. Risk 8 SENSITIVE reflects serious contained account-takeover potential; evidence of privileged administration, MFA bypass, or broad tenant control would be needed for PROTECTED.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, SENS_IT, and Medium because the
    matched unit is one directly usable username-password pair. PROTECTED is not met because the detector does not show
    that the user is privileged, that controls can be bypassed, or that compromise extends beyond the account's
    permissions.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic Medium and Medium InfoTech handling is consistent for one user's credential pair, which creates material
      account risk without automatically representing a privileged or tenant-wide identity.
references:
  - url: https://learn.microsoft.com/en-us/purview/sit-defn-azure-ad-user-credentials
    title: Microsoft Entra user credentials entity definition - Microsoft Learn
created: '2026-02-09'
updated: '2026-10-30'
changelog:
  - version: 1.5.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.4.0
    date: '2026-10-20'
    description: 'Self-corroboration fix (85 needs independent context, as #80 intended for populated-label IdMatches): Purview counts a supporting match that sits inside the IdMatch span when a word break separates it (dev-tenant run 2026-10-19; ":" and "_" break words, "=" does not), so a single labelled value reached 85 on its own label. Removed the generated 85 tier whose evidence was the detector name split into words (Pattern_azure_entra_user_credentials_label_context, Keyword_azure_entra_user_credentials_domain_context); those words sit inside the IdMatch label, and the definitions are now unreferenced and removed. Removed from Keyword_azure_entra_user_creds the terms that match inside the IdMatch label: onmicrosoft.com, username, password. 85 now needs context outside the label. Added a 75 tier on Regex_azure_entra_user_credentials alone: a populated label alone is 75 (the #80 convention), so the value stays enforcing.'
  - version: 1.3.2
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1107 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.2.0
    date: '2026-07-04'
    description: 'Restore the pattern_tiers entry for the previously-orphaned domain-specific keyword group: a same-bucket tier collapse (Task 5) kept only the weak, self-referential label/domain-context evidence and discarded the substantive keyword evidence at the same confidence level'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 90 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
