schema: testpattern/v1
name: AWS Bedrock API Key
slug: global-aws-bedrock-api-key
version: 1.0.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects Amazon Bedrock API keys, which start with the case-sensitive prefix ABSK followed by 100 to 260 Base64/URL-safe characters. Leaked Bedrock bearer tokens allow unauthorized model invocation and billed inference against enabled foundation models in the target AWS account.
operation: >-
  Fixed prefix ABSK followed by 100-260 Base64/URL-safe characters bounded outside identifier characters. Tiers: 85 for two distinct keys with Bedrock/API-key context within 300 characters, 75 for one key with context, 65 discovery-only for a bare key, with template-exclusion gating on every tier.
pattern: '(?-i)(?<![A-Za-z0-9+/_-])(ABSK[A-Za-z0-9+/=_-]{100,260})(?![A-Za-z0-9+/=_-])'
confidence: high
confidence_justification: >-
  High confidence: Amazon Bedrock long-term and short-term API keys carry the distinctive uppercase ABSK prefix and a long encoded payload (104-264 characters total), making accidental collisions in ordinary text negligible.
jurisdictions:
- global
regulations:
- Criminal Code Act 1995 (Cth)
frameworks:
- CIS Controls
- ISO 27001
- NIST CSF
- SOC 2
data_categories:
- credentials
- security
corroborative_evidence:
  keywords:
  - bedrock
  - AWS_BEARER_TOKEN_BEDROCK
  - bedrock-runtime
  - amazonaws.com
  - api key
  proximity: 300
  keyword_lists:
  - credentials
  - data-record-context
  - generic-data-labels
test_cases:
  # Positive literals omitted: GitHub Push Protection blocks syntactically valid ABSK bearer tokens on public repos.
  should_match: []
  should_not_match:
  - value: "AWS_BEARER_TOKEN_BEDROCK=ABSKshortpayload0123456789abcdef"
    description: "Payload far shorter than minimum 100 characters after ABSK"
  - value: "absk_lowercase_short_prefix"
    description: "Lowercase absk prefix rejected by case-sensitive rule"
  - value: "Configure AWS_BEARER_TOKEN_BEDROCK for bedrock-runtime inference calls."
    description: "Prose documentation mentioning the variable with no token value"
  - value: "template example placeholder record identifier"
    description: "Template/sample context should be excluded even when anchor words are present"
false_positives:
- description: "Revoked or expired short-term Bedrock bearer tokens in historical logs."
  mitigation: "Verify token status in IAM / Amazon Bedrock console before escalating."
- description: "Synthetic ABSK strings in SDK unit tests and documentation."
  mitigation: "Suppressed on every tier by the shared template-exclusion dictionary."
exports:
- purview_xml
- yaml
- regex_copy
scope: narrow
risk_rating: 8
risk_description: >-
  The high-confidence detector finds an Amazon Bedrock API key through its ABSK prefix and long encoded bearer body. A valid key permits direct InvokeModel calls, billed foundation-model usage, and access to custom or provisioned Bedrock deployments scoped to the key. Exposure normally affects one AWS account identity, bounded by IAM permissions and key expiration. Risk 8 and SENSITIVE InfoTech fit contained cloud AI credential exposure.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, and Medium because a valid Bedrock API key directly authorizes billed foundation-model calls within the key scope. PROTECTED is not met without broader AWS administrative control or confirmed access to protected datasets.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium and Medium InfoTech handling suit Amazon Bedrock API keys because they grant direct cloud AI service access bounded by IAM policy and key revocation.
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_aws_bedrock_api_key
    matches:
    - ref: Regex_aws_bedrock_api_key
      min_count: 2
      unique_results: true
    - ref: Keyword_aws_bedrock_api_key
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  - confidence_level: 75
    id_match: Regex_aws_bedrock_api_key
    matches:
    - ref: Keyword_aws_bedrock_api_key
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_aws_bedrock_api_key
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_aws_bedrock_api_key
    pattern: '(?-i)(?<![A-Za-z0-9+/_-])(ABSK[A-Za-z0-9+/=_-]{100,260})(?![A-Za-z0-9+/=_-])'
  keywords:
  - id: Keyword_aws_bedrock_api_key
    groups:
    - match_style: word
      terms:
      - bedrock
      - AWS_BEARER_TOKEN_BEDROCK
      - bedrock-runtime
      - amazonaws.com
      - amazon bedrock
      - api key
      - Bearer
    strength: specific
created: '2026-11-25'
updated: '2026-11-25'
changelog:
