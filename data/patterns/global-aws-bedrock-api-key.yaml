  title: "Amazon Bedrock API keys documentation (ABSK bearer token format and AWS_BEARER_TOKEN_BEDROCK)"
- url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
  title: "Supported secret scanning patterns - GitHub Docs (Amazon Bedrock API Key)"
