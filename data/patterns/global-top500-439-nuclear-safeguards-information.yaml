changelog:
- version: 1.4.0
  date: '2026-10-30'
  description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
- version: 1.3.0
  date: '2026-10-20'
  description: 'Generated name-word tier removed: the 85 and 75 tiers ANDed Pattern_*_label_context (the detector name, "Nuclear safeguards information") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 85. Both lists sit inside the IdMatch phrase, so the bare name alone scored 85. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs 2 populated document header fields (Regex_global_top500_439_nuclear_safeguards_information_record_structure) or the kept independent term plutonium plus one field; 85 needs 3 distinct fields. Curated terms that sit inside an IdMatch hit were removed. IAEA and "nonproliferation" appear in any safeguards policy and are dropped. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
- version: 1.2.6
  date: '2026-09-25'
  description: >-
    Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
    reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
- version: 1.2.4
  date: '2026-09-24'
  description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
- version: 1.2.2
  date: '2026-07-15'
  description: v25 authoritative risk alignment from Compl8DLPDeploy workbook row 1980; detector and package metadata unchanged.
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1980 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
