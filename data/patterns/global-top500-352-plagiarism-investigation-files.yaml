schema: testpattern/v1
name: Plagiarism investigation files
slug: global-top500-352-plagiarism-investigation-files
version: 1.3.3
type: regex
pattern_class: concept
engine: boost_regex
description: 'Identifies academic misconduct / plagiarism investigation files about an identified student or researcher: investigation vocabulary together with populated student and case fields (name, student ID, unit, assessment, similarity score, allegation, outcome).'
operation: 'Primary: plagiarism investigation/finding/detection, academic misconduct/integrity/dishonesty, similarity report, originality check, disciplinary hearing, misconduct panel, integrity violation. 65 (discovery only) = primary alone. 75 = primary plus one populated student/case field (name, date of birth, student name/number/ID, candidate, unit or subject code, assessment item, similarity score/index, allegation, case or file number, investigator, hearing date, outcome, penalty) with a non-placeholder value. 85 = primary plus two distinct populated fields plus independent investigation evidence (Turnitin, collusion, contract cheating, show cause, student response, integrity officer, academic penalty, unit coordinator). All tiers exclude template/fixture text.'
pattern: (?is)\b(?:plagiarism\s+investigation|academic\s+misconduct|academic\s+integrity|similarity\s+report|originality\s+check|disciplinary\s+hearing|academic\s+dishonesty|plagiarism\s+finding|misconduct\s+panel|integrity\s+violation|plagiarism\s+detection)\b
confidence: medium
confidence_justification: 'Medium: academic-integrity vocabulary dominates policy pages, guidance and news, so enforcement requires populated student/case fields; 85 adds investigation evidence the primary does not match.'
jurisdictions:
- global
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - Tertiary Education Quality and Standards Agency Act 2011 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - education
corroborative_evidence:
  keywords:
  - plagiarism investigation files
  - plagiarism
  - investigation
  - files
  - education
  - research
  - administration
  proximity: 300
test_cases:
  should_match:
    - value: |-
        Academic misconduct investigation - confidential
        Student name: Avery Teston
        Student ID: S4471820
        Unit code: LAW2203
        Similarity index: 64%
        Allegation: contract cheating on Assessment 2
        The Turnitin report and the student response were considered by the integrity officer on 12/08/2026.
      description: 85 - populated student case with Turnitin/contract-cheating evidence
      synthetic: true
    - value: |-
        Plagiarism finding - notice to student
        Student ID: S5521907
        The panel found that sections 2 and 3 were copied without acknowledgement.
      description: 75 - one populated student field without investigation evidence
      synthetic: true
    - value: Academic integrity case notes to be filed after the hearing.
      description: 65 discovery - topic phrase without populated fields
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: student grant
      description: Generic word pair should not match
    - value: Our academic integrity policy explains what plagiarism is and how a plagiarism investigation is conducted and appealed.
      description: Policy guidance - no populated fields (65 at most)
    - value: |-
        Academic misconduct allegation form
        Student name: ________
        Student ID: ________
        Unit code: [enter]
        Allegation: [describe]
      description: Blank allegation form - placeholder fields are rejected
    - value: The university said 300 students faced academic misconduct proceedings last year after a contract cheating website was exposed.
      description: News item - no populated fields
false_positives:
- description: Common words and phrases related to plagiarism investigation files appearing in policy documents, training
    materials, HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: This concept detector finds plagiarism investigations, academic-misconduct matters, integrity cases, and
  similarity reports with seven corroborative terms. An actual file can expose allegations, source comparisons, student explanations,
  investigator notes, and an unresolved outcome, allowing reputational damage or interference with procedural fairness. The
  normal case has serious consequences for one student or researcher but remains bounded to an institutional investigation
  rather than a protected legal operation. Risk 8 supports SENSITIVE Personal-Privacy; PROTECTED would require extensive protected-source
  material, severe safety consequences, or systemic compromise of high-stakes adjudications.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and Personal-Privacy because unresolved misconduct
    allegations and evidence can materially affect a named student's standing and due process. PROTECTED is not met for
    an ordinary institutional case without protected sources, severe consequences beyond the subject, or broad
    adjudication compromise.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Academic-misconduct files are generically Medium with Medium Personal-Privacy handling because allegations and
      investigative evidence can cause serious educational and reputational harm before resolution.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_plagiarism_investigation
      matches:
        - ref: Regex_global_top500_352_plagiarism_investigation_files_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_plagiarism_case_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_plagiarism_investigation
      matches:
        - ref: Regex_global_top500_352_plagiarism_investigation_files_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_plagiarism_investigation
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_plagiarism_investigation
      pattern: (?is)\b(?:plagiarism\s+investigation|academic\s+misconduct|academic\s+integrity|similarity\s+report|originality\s+check|disciplinary\s+hearing|academic\s+dishonesty|plagiarism\s+finding|misconduct\s+panel|integrity\s+violation|plagiarism\s+detection)\b
    - id: Regex_global_top500_352_plagiarism_investigation_files_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student(?:\s+name)?|student\s+(?:no\.?|number|ID)|candidate(?:\s+(?:no\.?|number))?|unit(?:\s+code)?|subject\s+code|course\s+code|assessment(?:\s+item)?|similarity\s+(?:score|index)|allegation|(?:case|file)\s+(?:no\.?|number|ID)|investigator|hearing\s+date|outcome|penalty)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_plagiarism_case_evidence
      groups:
        - match_style: word
          terms:
            - Turnitin
            - collusion
            - contract cheating
            - show cause
            - student response
            - integrity officer
            - academic penalty
            - unit coordinator
            - copied without acknowledgement
      strength: specific
