schema: testpattern/v1
name: Queensland Development Application Submission Submitter Details (Redaction Aid)
slug: au-qld-da-submission-submitter-details
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Submitter names and contact details in submissions about Queensland development applications, submission summaries in assessment reports, and decision notices that list principal submitters. Under the Planning Act 2016 sch 2, a properly made submission must state the name and residential or business address of all submission-makers and one postal or electronic address for service. Section 63(2)(h) requires the decision notice to state the name, residential or business address and electronic address of each principal submitter. Planning Regulation 2017 sch 22 s 5(1)(d) requires the assessment manager to keep any properly made submission available for inspection and purchase. These documents are public by law. Many councils redact submitters' contact details before publishing online, but that is council practice, not a verified statutory requirement. This is a discovery-only redaction aid. It surfaces documents that carry submitter details so they can be reviewed before publication. It is not a blocking classifier.
operation: >-
  Discovery only (65). Primary: properly made submission(s), submitter(s) / principal submitter(s), submission-maker(s), submission(s) about / on / regarding / in relation to / objecting to / in support of / against / for the (proposed) development (application), application or DA, objection(s) to the (proposed) development (application), application or DA, and development application submission(s). The 65 tier requires, within 300 characters, a populated submitter field and planning context. The submitter field is a submitter / principal submitter / submission-maker / objector [name / address / details / email / phone / mobile / contact] label, name of (the) (principal) submitter, submission (made) by, your (full) name, or an unqualified name, full name, residential / postal / business / home / electronic address, address (for service), email, phone, mobile or telephone label (the unqualified labels must not follow another word, so Applicant name and Owner address do not count). The value must be a name of two or more capitalised words, a street address, an Australian phone number or an email address, on the same line as the label. Placeholder values are rejected (withheld, not, none, nil, redacted, suppressed, blank lines, brackets). Planning context is development application, Planning Act 2016, Planning Regulation 2017, assessment manager, public notification, material change of use, reconfiguring a lot, planning scheme, decision notice or council. The tier ANDs NOT the shared template-exclusion dictionary and a guidance exclusion (how to make / making a submission, fact sheet, frequently asked questions). There are no 75 or 85 tiers, because the documents are public.
pattern: >-
  (?i)\b(?:properly\s+made\s+submissions?|(?:principal\s+)?submitters?|submission-makers?|submissions?\s+(?:about|on|regarding|in\s+relation\s+to|objecting\s+to|in\s+support\s+of|against|for)\s+(?:the\s+|this\s+)?(?:proposed\s+)?(?:development(?:\s+application)?|application|DA)|objections?\s+to\s+(?:the\s+|this\s+)?(?:proposed\s+)?(?:development(?:\s+application)?|application|DA)|development\s+application\s+submissions?)\b
confidence: medium
confidence_justification: >-
  Medium. Submission and submitter wording plus a populated name or contact field and planning context is a reliable signal for submitter details. However, the documents are public by law, so the classifier only flags them for redaction review at 65. The recommended confidence is 65 and there are no enforce tiers. 65 is a heuristic evidence tier, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Planning Act 2016 (Qld) s 53, s 63(2)(h), sch 2 (properly made submission)
  - Planning Regulation 2017 (Qld) sch 22 s 5
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - contact-information
  - government
corroborative_evidence:
  keywords:
    - development application
    - Planning Act 2016
    - assessment manager
    - public notification
    - material change of use
    - planning scheme
    - decision notice
  proximity: 300
test_cases:
  should_match:
    - value: "Submission about the development application MCU/2026/0412\nSubmitter name: Robin Teston\nResidential address: 31 Ridge Street, Nambour QLD 4560\nEmail: robin.teston@inbox-mail.net\nGrounds: the proposed six-storey building exceeds the planning scheme height limit."
      description: Submission with submitter name, address and email (65 tier)
      synthetic: true
    - value: "Summary of properly made submissions - development application DA/2026/118 (public notification period closed 14/08/2026)\nSubmitter 1: Casey Teston, 5 Lagoon Road, Yeppoon\nSubmitter 2: Jamie Staffson, 7 Lagoon Road, Yeppoon"
      description: Assessment report submission summary listing submitters (65 tier)
      synthetic: true
    - value: "Decision notice - Planning Act 2016 s 63\nPrincipal submitter: Morgan Teston\nAddress: 12 Fig Tree Lane, Maleny QLD 4552\nThe development application for a material change of use is approved subject to conditions."
      description: Decision notice naming the principal submitter (65 tier)
      synthetic: true
    - value: "Objection to the development application at 40 Beach Parade.\nName: Taylor Teston\nPhone: 0412 555 318\nI object because of traffic and loss of privacy under the planning scheme."
      description: Emailed objection with name and phone (65 tier)
      synthetic: true
  should_not_match:
    - value: "properly made submission, for a development application, means a submission that is signed by each person who made the submission; is received on or before the last day for making the submission; states the name and residential or business address of all submission-makers; and states its grounds."
      description: Planning Act 2016 sch 2 definition (legislation)
    - value: "Notice of development application (Planning Act 2016 s 53)\nApplicant: Coral Coast Developments Pty Ltd\nApplicant name: Coral Coast Developments\nProposal: material change of use - multiple dwelling\nAny person may make a properly made submission about the application to the assessment manager by 30/10/2026."
      description: Public notification notice naming only the applicant
    - value: "Development application submission form - blank template\nSubmitter name: ____________\nResidential address: ____________\nEmail: ____________"
      description: Blank submission form
    - value: "How to make a submission: your submission must state your name and residential or business address, be signed by each submitter, and state the grounds. Submissions about a development application are public documents."
      description: Council guidance page (guidance exclusion)
    - value: "Council received 412 submissions about the development application for the marina, with most submitters objecting to the building height."
      description: News and statistics (no submitter details)
false_positives:
  - description: Legislation, public notification notices, council guidance on making a submission, and news about submission counts.
    mitigation: The 65 tier needs a populated submitter name or contact field. Applicant and owner fields do not count, and a guidance exclusion suppresses how-to pages.
  - description: Published submissions and decision notices are public documents under Planning Regulation 2017 sch 22 s 5 and Planning Act s 63.
    mitigation: This is by design. The classifier is a discovery-only redaction aid and never enforces. Use it to review submitter contact details before publishing online, not to block sharing.
  - description: Non-planning uses of submitter (software change requests, journal submissions).
    mitigation: Planning context (development application, Planning Act, assessment manager, planning scheme and similar) is required within 300 characters.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 65
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_da_submission_primary
      matches:
        - ref: Regex_au_qld_da_submission_submitter_field
        - ref: Keyword_au_qld_da_submission_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_da_submission_guidance_exclusion
  regexes:
    - id: Regex_au_qld_da_submission_primary
      pattern: >-
        (?i)\b(?:properly\s+made\s+submissions?|(?:principal\s+)?submitters?|submission-makers?|submissions?\s+(?:about|on|regarding|in\s+relation\s+to|objecting\s+to|in\s+support\s+of|against|for)\s+(?:the\s+|this\s+)?(?:proposed\s+)?(?:development(?:\s+application)?|application|DA)|objections?\s+to\s+(?:the\s+|this\s+)?(?:proposed\s+)?(?:development(?:\s+application)?|application|DA)|development\s+application\s+submissions?)\b
    - id: Regex_au_qld_da_submission_submitter_field
      pattern: >-
        (?i)(?:\b(?:principal\s+)?(?:submitter|submission-maker|objector)(?:'?s)?(?:[ \t]+\d{1,3})?(?:[ \t]+(?:full\s+)?(?:name|address|details|e-?mail|phone|mobile|contact))?|\bname\s+of\s+(?:the\s+)?(?:principal\s+)?submitter|\bsubmission\s+(?:made\s+)?by|\byour\s+(?:full\s+)?name|(?<![A-Za-z][ \t])\b(?:full\s+name|name|(?:residential|postal|business|home|electronic)\s+address|address(?:\s+for\s+service)?|e-?mail(?:\s+address)?|phone|mobile|telephone))[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not|none|nil|redacted|suppressed|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?:(?:(?:Mr|Mrs|Ms|Miss|Dr)\.?[ \t]+)?[A-Z][A-Za-z'-]{1,30}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}|(?:(?:Unit|Lot|Apt|Flat)[ \t]+)?\d{1,5}[A-Za-z]?(?:/\d{1,5}[A-Za-z]?)?[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:\+?61[ \t]?|0)[2-478](?:[ \t-]?\d){8}|[A-Z0-9._%+-]{1,40}@[A-Z0-9-]{1,40}\.[A-Z.]{2,20})
  keywords:
    - id: Keyword_au_qld_da_submission_context
      groups:
        - match_style: word
          terms:
            - development application
            - Planning Act 2016
            - Planning Regulation 2017
            - assessment manager
            - public notification
            - material change of use
            - reconfiguring a lot
            - planning scheme
            - decision notice
            - council
      strength: specific
    - id: Keyword_au_qld_da_submission_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - how to make a submission
            - making a submission
            - fact sheet
            - factsheet
            - frequently asked questions
      strength: specific
risk_rating: 3
risk_description: >-
  The classifier flags development application submissions, submission summaries and decision notices that carry submitters' names, home addresses, email addresses or phone numbers. These documents are public by law (Planning Regulation 2017 sch 22 s 5; Planning Act s 63(2)(h)), so the risk is limited to the extra exposure of contact details when councils publish documents online, which can lead to neighbour conflict or unwanted contact from applicants. It is a 65 discovery-only redaction aid. Risk 3 supports OFFICIAL.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: Planning Act 2016 (Qld) - s 53 public notification, s 63 decision notice, sch 2 properly made submission
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2016-025
  - title: Planning Regulation 2017 (Qld) - sch 22 s 5 documents available for inspection and purchase
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2017-0078
