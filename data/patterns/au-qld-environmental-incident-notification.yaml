schema: testpattern/v1
name: Queensland Environmental Harm Notification or Environmental Authority Incident Report
slug: au-qld-environmental-incident-notification
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Populated environmental incident records under the Environmental Protection Act 1994 (Qld): duty-to-notify reports of serious or material environmental harm (s 320B employee to employer and s 320D employer written notice to the administering authority, each within 24 hours; s 320DA owner, occupier or auditor), transitional environmental program (TEP) documents (ss 330-344E), environmental authority (EA) non-compliance and incident reports, and incidents at regulated structures such as ash dams and tailings or process-water dams (assessed by consequence category). The target is an internal incident notification, investigation or compliance report with a filled incident date, location, contaminant, release quantity or EA field. Lodged EA conditions, the EA public register and published monitoring results (s 540 public register) are public and are decoys.
operation: >-
  Primary: notice or notification of (serious or material) environmental harm, serious or material environmental harm, section 320B/320C/320D/320DA, transitional environmental program, regulated structure, consequence category, environmental incident notification or report, or EA non-compliance / incident notification or report. 65 is discovery-only (primary alone) and surfaces the Act, EA conditions, guidance and the public register. 75 requires, within 300 characters, a populated incident field (date or date/time of incident, release, discharge, event, spill or exceedance; incident date, time or location; location of release; release or discharge point; receiving environment or waters; contaminant; substance released; quantity or volume released; EA number or reference; environmental authority; condition breached; notified by; reported by; duration) whose value is not blank, bracketed or a placeholder. 85 requires two distinct populated incident fields, a release or exceedance measurement (a release, discharge, spill, overflow, seepage, exceedance, limit, concentration or volume term followed within 40 characters by a value in kL, ML, m3, litres, tonnes, mg/L, ug/L, mg/m3 or NTU) and independent evidence: notification-duty vocabulary (administering authority, 24 hours, Pollution Hotline, containment, clean-up, root cause, corrective action, ash dam, seepage) or a public-format EA number (EPPR, EPSX, EPSL, EPVX, EPVL or EPPG plus 8 digits, P-EA- plus 9 digits, EA plus 7 digits), used only as supporting evidence. All tiers exclude template/fixture text and legislation, public-register and media text (maximum penalty, penalty units, public register, permit holder, media release, fact sheet).
pattern: (?i)\b(?:(?:notice|notification)\s+of\s+(?:serious\s+or\s+material\s+)?environmental\s+harm|serious\s+or\s+material\s+environmental\s+harm|(?:section|s\.?)\s*320(?:DA|[BCD])|transitional\s+environmental\s+program(?:me)?|regulated\s+structure|consequence\s+category|environmental\s+incident\s+(?:notification|report)|(?:environmental\s+authority|EA)\s+(?:non-?compliance|incident)\s+(?:notification|report))\b
confidence: medium
confidence_justification: >-
  Medium: the duty-to-notify, TEP and regulated-structure terms are statutory and appear in the Act, EA conditions and guidance, so they are discovery-only alone. Enforcement needs populated incident fields (and at 85 a release or exceedance measurement), which legislation, EA conditions and the public register lack. EA numbers are public formats and never drive a tier on their own. Published monitoring reports lodged under EA conditions can carry filled fields and measurements; "public register" wording is excluded, but a lodged report copied without that wording can still match. "Design storage allowance", "mandatory reporting level" and "register of regulated structures" are unverified and not used. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Environmental Protection Act 1994 (Qld)
  - Environmental Protection Regulation 2019 (Qld)
frameworks:
  - QGISCF
data_categories:
  - environmental
  - legal
  - infrastructure
corroborative_evidence:
  keywords:
    - administering authority
    - 24 hours
    - Pollution Hotline
    - containment
    - clean-up
    - root cause
    - corrective action
    - ash dam
    - seepage
  proximity: 300
customisation:
  - key: environmental-incident-reference
    kind: identifier-format
    identifier: environmental-incident-reference
    target: purview.regexes/Regex_au_qld_env_incident_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's environmental incident / notification reference format (see docs/identifiers.md#environmental-incident-reference). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Notification of serious or material environmental harm (s 320D)\nEA number: EPPR00000001\nDate/time of incident: 03/09/2026 06:40\nLocation of release: Ash dam 2 spillway, Teston Power Station\nContaminant: Ash-laden process water\nThe overflow released an estimated 120 kL to Teston Creek. Written notice given to the administering authority within 24 hours; containment booms deployed."
      description: s 320D notice with EA number, incident fields and release volume (intended 85)
      synthetic: true
    - value: "Environmental incident report - regulated structure (consequence category: significant)\nIncident date: 17/08/2026\nReceiving environment: Teston River tributary\nSeepage at the toe drain measured sulfate concentration 850 mg/L against a limit of 250 mg/L. Root cause investigation opened; corrective action due 30/09/2026."
      description: Regulated structure seepage incident with fields, exceedance measurement and root cause (intended 85)
      synthetic: true
    - value: "Section 320B notification - employee to employer\nReported by: Jordan Teston, shift operator\nDate of incident: 21/09/2026\nOil sheen observed on the cooling water outlet channel after the transformer bund drain was left open."
      description: s 320B employee notification with reporter and incident date (intended 75)
      synthetic: true
    - value: "EA non-compliance report - Teston Power Station\nCondition breached: W3 (release point turbidity)\nDuration: approximately 6 hours"
      description: EA non-compliance report with populated condition and duration (intended 75)
      synthetic: true
  should_not_match:
    - value: "320D Duty of employer to notify. (2) The employer must, as soon as practicable but no later than 24 hours after becoming aware of the event, give written notice of the serious or material environmental harm to the administering authority. Maximum penalty-500 penalty units."
      description: Act text (legislation decoy, excluded)
    - value: "Permit Reference EPPR00000002 Permit Type Environmental Authority Permit Holder(s) Teston Energy Pty Ltd Effective Date 01/07/2015 Status Effective Condition Type Site specific Industry Electricity Activities Electricity generation Locations Teston - regulated structure conditions apply"
      description: Public EA register row (decoy)
    - value: "Published monitoring data (public register) - regulated structure RS2 quarterly results\nRelease point: W1\nTurbidity 12 NTU; EC 1200 uS/cm; discharge volume 35 ML for the quarter."
      description: Monitoring data published under s 540 (decoy, excluded)
    - value: "Notification of environmental harm form\nDate/time of incident: __________\nLocation of release: [describe location]\nContaminant: __________\nEstimated quantity released: __________"
      description: Blank notification form
    - value: "Media release: the department has approved a transitional environmental program for the Teston ash dam after consultation on the consequence category assessment."
      description: News / media release
    - value: "The environmental authority conditions require the holder to assess each dam to determine whether it is a regulated structure and its consequence category using the manual, and to notify the administering authority within 24 hours of any release."
      description: EA condition / guidance text (no populated fields, stays at 65)
false_positives:
  - description: The EP Act, EP Regulation, EA conditions, DETSI guidance and the regulated-structures manual.
    mitigation: No populated incident fields; legislation markers are excluded, so these stay at 65 discovery or below.
  - description: The EA public register (Permit Reference, Permit Holder(s), Condition Type columns) and monitoring data published under s 540.
    mitigation: EA numbers are supporting evidence only at 85; register column wording ("permit holder", "public register") is excluded. Lodged monitoring reports copied without register wording can still reach 75 on filled fields.
  - description: Workplace injury or WHS incident reports that mention an environmental authority.
    mitigation: Primary requires environmental-harm, TEP, regulated-structure or EA incident wording rather than generic incident terms.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_env_incident_primary
      matches:
        - ref: Regex_au_qld_env_incident_field
          min_count: 2
          unique_results: true
        - ref: Regex_au_qld_env_incident_release_measure
        - type: any
          refs:
            - Keyword_au_qld_env_incident_corroborative
            - Regex_au_qld_env_incident_ea_number
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_env_incident_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_env_incident_primary
      matches:
        - ref: Regex_au_qld_env_incident_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_env_incident_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_env_incident_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_env_incident_exclusion
  regexes:
    - id: Regex_au_qld_env_incident_primary
      pattern: >-
        (?i)\b(?:(?:notice|notification)\s+of\s+(?:serious\s+or\s+material\s+)?environmental\s+harm|serious\s+or\s+material\s+environmental\s+harm|(?:section|s\.?)\s*320(?:DA|[BCD])|transitional\s+environmental\s+program(?:me)?|regulated\s+structure|consequence\s+category|environmental\s+incident\s+(?:notification|report)|(?:environmental\s+authority|EA)\s+(?:non-?compliance|incident)\s+(?:notification|report))\b
    - id: Regex_au_qld_env_incident_field
      pattern: >-
        (?i)\b(?:date(?:\s*(?:/|and)\s*time)?\s+of\s+(?:incident|release|discharge|event|spill|exceedance)|incident\s+(?:date|time|location)|time\s+of\s+(?:incident|release|discharge)|location\s+of\s+(?:release|incident|discharge)|release\s+point|discharge\s+point|receiving\s+(?:environment|waters)|contaminants?|substance(?:\s+released)?|(?:estimated\s+)?(?:quantity|volume)(?:\s+released)?|EA\s+(?:no\.?|number|reference)|environmental\s+authority\s+(?:no\.?|number)|condition(?:\s+(?:no\.?|number|breached))|notified\s+by|reported\s+by|duration)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'.,()-]{0,40}(?:[ \t]+[A-Za-z0-9][A-Za-z0-9/'.,()-]{0,30}){0,4}
    - id: Regex_au_qld_env_incident_release_measure
      pattern: >-
        (?i)\b(?:releas\w{0,4}|discharg\w{0,4}|spill\w{0,3}|overflow\w{0,3}|seep\w{0,4}|exceed\w{0,4}|limit|concentration|volume|quantity)\b[^\n]{0,40}?\b\d{1,7}(?:\.\d{1,4})?\s*(?:kL|ML|m3|m³|litres|L|tonnes|mg/L|ug/L|µg/L|mg/m3|NTU)(?![A-Za-z0-9])
    - id: Regex_au_qld_env_incident_ea_number
      pattern: >-
        \b(?:EP(?:PR|SX|SL|VX|VL|PG)\d{8}|P-EA-\d{9}|EA\d{7})\b
  keywords:
    - id: Keyword_au_qld_env_incident_corroborative
      groups:
        - match_style: word
          terms:
            - administering authority
            - 24 hours
            - Pollution Hotline
            - containment
            - clean-up
            - root cause
            - corrective action
            - ash dam
            - tailings dam
            - seepage
            - bund
            - Environmental Protection Act 1994
            - DETSI
      strength: specific
    - id: Keyword_au_qld_env_incident_exclusion
      groups:
        - match_style: word
          terms:
            - maximum penalty
            - penalty units
            - public register
            - permit holder
            - media release
            - fact sheet
      strength: specific
risk_rating: 7
risk_description: >-
  Internal environmental harm notifications, EA non-compliance and incident investigations, and regulated-structure (ash dam, process-water dam) incident records describe releases of contaminants from an identified site - what, where, when, how much and against which licence condition - before or beyond what is lodged on the public register. Disclosure creates environmental liability and prosecution exposure (s 320D carries up to 500 penalty units), can prejudice regulatory investigations and legal privilege over root-cause reports, and causes reputational harm. Lodged EA conditions and s 540 register material are public and are not the target. Risk 7 supports OFFICIAL: Sensitive / SENSITIVE.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: Environmental Protection Act 1994 (Qld) - ss 320A-320DA duty to notify, ss 330-344E transitional environmental programs, s 540 public register
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1994-062
  - title: Environmental Protection Regulation 2019 (Qld) - Schedule 2 item 14 electricity generation; dictionary (regulated structure)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2019-0155
  - title: Queensland Open Data - Environmental authorities register (public EA number formats)
    url: https://www.data.qld.gov.au/dataset/environmental-authorities
created: '2026-09-24'
updated: '2026-09-24'
changelog:
