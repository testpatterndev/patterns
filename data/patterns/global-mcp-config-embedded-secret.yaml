schema: testpattern/v1
name: MCP Server Configuration with Embedded Secret
slug: global-mcp-config-embedded-secret
version: 1.0.0
type: regex
pattern_class: identifier
engine: boost_regex
description: >-
  Detects Model Context Protocol (MCP) server configuration files that hold a secret in plain text: an API key, token
  or password in a server's env block, or a bearer token or API key in its headers. These files (claude_desktop_config.json,
  .mcp.json, ~/.claude.json, .cursor/mcp.json, .vscode/mcp.json and similar) tell an AI client which tool servers to
  start and how to authenticate to them, are often committed or shared, and were collected by infostealers and npm
  supply-chain worms in 2026. A config that references a variable (${VAR}, ${env:NAME}, ${input:id}) or carries no
  secret does not match. This pattern finds stored secrets; ai-mcp-connector-risk covers over-broad scope wording.
operation: >-
  The primaries are (1) a JSON member whose name ends in API_KEY, ACCESS_KEY, SECRET_KEY, PRIVATE_KEY, AUTH_KEY, TOKEN,
  SECRET, PASSWORD or PASSWD with a literal value of 12 or more characters, and (2) an Authorization header carrying
  Bearer, Basic or Token plus a literal value, or an X-API-Key header with a literal value, written as a JSON member
  or as a single "Name: value" string. Alone they are discovery-only at 65. The 75 tier also requires an mcpServers
  object or an MCP server marker (an @modelcontextprotocol/ or mcp-server package name, an /mcp endpoint, an mcp.json
  or claude_desktop_config file name) within the proximity window. The 85 tier requires the mcpServers object and a
  server entry field (command, url or type) together. The proximity window is 3000 characters, not the usual 300,
  because the mcpServers key opens the file and a secret in the third or later server entry sits well over 300
  characters after it. Values that begin with $, <, /, ~ or a dot, or that contain a
  placeholder word, are rejected inside the regex, so variable references and file paths never match.
pattern: '(?i)("[A-Za-z0-9_]{0,60}(?:API_?KEY|ACCESS_KEY|SECRET_KEY|PRIVATE_KEY|AUTH_KEY|TOKEN|SECRET|PASSWORD|PASSWD)"\s*:\s*"(?![<$/~.]|[^"]{0,40}(?:your|xxxx|\*{3}|redacted|placeholder|changeme))[^"\s$<>{}]{12,}")'
confidence: medium
confidence_justification: >-
  Medium confidence. The mcpServers schema (command, args and env for local servers; type, url and headers for remote
  ones) is documented by the Model Context Protocol project, Claude Code, Cursor and VS Code, and a literal value under
  a secret-named key inside that structure is almost always a real credential. The value itself is an opaque string
  with no fixed format, so the regex cannot validate it, and the same member names appear in other JSON configuration.
  Enforce tiers therefore require MCP context as well as the secret-shaped member.
jurisdictions:
  - global
regulations:
  - Criminal Code Act 1995 (Cth)
  - Computer Fraud and Abuse Act
  - Computer Misuse Act 1990
frameworks:
  - CIS Controls
  - ISO 27001
  - NIST CSF
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - mcpServers
    - mcp.json
    - claude_desktop_config.json
    - '@modelcontextprotocol/'
    - env
    - headers
    - Authorization
  proximity: 3000
test_cases:
  should_match:
    - value: '"BRAVE_API_KEY": "ABCDEFGHIJKLMNOPQRSTUVWXYZ012345"'
      description: Exact 65 probe - secret-named JSON member with no MCP context
    - value: |-
        {
          "mcpServers": {
            "brave-search": {
              "command": "npx",
              "args": ["-y", "@modelcontextprotocol/server-brave-search"],
              "env": {
                "BRAVE_API_KEY": "ABCDEFGHIJKLMNOPQRSTUVWXYZ012345"
              }
            }
          }
        }
      description: Exact 85 probe - pretty-printed local (stdio) server with an API key in env
    - value: |-
        {
          "mcpServers": {
            "tracker": {
              "type": "http",
              "url": "https://tracker.internal.corp/mcp",
              "headers": {
                "Authorization": "Bearer ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0123456789"
              }
            }
          }
        }
      description: Exact 85 probe - pretty-printed remote server with a bearer token in headers
    - value: '{"mcpServers":{"search":{"type":"sse","url":"https://search.internal.corp/sse","headers":{"X-API-Key":"0123456789ABCDEFGHIJKLMNOPQRSTUV"}}}}'
      description: Exact 85 probe - compact JSON with an X-API-Key header
    - value: '{"servers": {"issues": {"type": "http", "url": "https://issues.internal.corp/mcp", "headers": {"Authorization": "Bearer ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0123456789"}}}}'
      description: Exact 75 probe - VS Code mcp.json, which uses a servers key; the /mcp endpoint supplies the context
    - value: '"github": {"command": "npx", "args": ["-y", "@modelcontextprotocol/server-github"], "env": {"GITHUB_PERSONAL_ACCESS_TOKEN": "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0123456789"}}'
      description: Exact 75 probe - a later server entry, out of range of the mcpServers key, with a package marker
    - value: '{"mcpServers": {"wiki": {"command": "wiki-bridge", "args": ["--header", "Authorization: Bearer ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0123456789"]}}}'
      description: Exact 85 probe - header passed to the server as a command argument
  should_not_match:
    - value: '{"mcpServers": {"filesystem": {"command": "npx", "args": ["-y", "@modelcontextprotocol/server-filesystem", "/Users/username/Desktop"]}}}'
      description: MCP configuration with no secret values
    - value: '{"mcpServers": {"api-server": {"type": "http", "url": "https://api.internal.corp/mcp", "headers": {"Authorization": "Bearer ${API_KEY}"}}}}'
      description: Claude Code variable expansion in a header, not a stored secret
    - value: '{"mcpServers": {"local-tools": {"command": "python", "args": ["server.py"], "env": {"API_KEY": "${env:MY_API_KEY}"}}}}'
      description: Cursor ${env:NAME} interpolation in env
    - value: '{"servers": {"tools": {"type": "stdio", "command": "npx", "args": ["-y", "mcp-server-tools"], "env": {"API_KEY": "${input:api-key}"}}}}'
      description: VS Code ${input:id} reference in env
    - value: '{"mcpServers": {"brave-search": {"command": "npx", "env": {"BRAVE_API_KEY": "YOUR_API_KEY_HERE"}}}}'
      description: Upper-case placeholder left in a copied configuration
    - value: '{"mcpServers": {"events": {"type": "ws", "url": "wss://events.internal.corp/mcp", "headers": {"Authorization": "Bearer YOUR_TOKEN"}}}}'
      description: Placeholder bearer value as printed in client documentation
    - value: '{"mcpServers": {"db": {"command": "uvx", "args": ["mcp-server-sqlite"], "env": {"DB_PATH": "/var/lib/app/data.sqlite", "LOG_LEVEL": "debug", "API_TOKEN_FILE": "/run/secrets/api-token", "VAULT_TOKEN": "/run/secrets/vault-token"}}}}'
      description: Env values that are file paths, including one under a secret-named key
    - value: '{"service": {"API_KEY": "ABCDEFGHIJKLMNOPQRSTUVWXYZ012345"}}'
      description: Secret-named member in JSON with no MCP context (discovery only)
    - value: 'Tutorial: {"mcpServers": {"brave-search": {"command": "npx", "env": {"BRAVE_API_KEY": "ABCDEFGHIJKLMNOPQRSTUVWXYZ012345"}}}}'
      description: Complete configuration with a literal key, vetoed on every tier by the tutorial framing
false_positives:
  - description: >-
      Documentation and README snippets that show an MCP configuration with an invented key that is not one of the
      recognised placeholder forms.
    mitigation: >-
      The regex rejects values containing your, xxxx, starred runs, redacted, placeholder or changeme, and values that
      start with $ or <; the shared template exclusion vetoes tutorial and documentation framing. Review remaining hits
      against the named service.
  - description: Secret-named members whose value is not a secret, such as a long non-path identifier under a key ending in TOKEN.
    mitigation: >-
      Values that start with /, ~ or a dot (file paths) are rejected and the value must be at least 12 characters.
      Confirm remaining hits with the server's owner.
  - description: Other JSON configuration that pairs a secret-named member with a nearby /mcp path or mcp-server string.
    mitigation: >-
      That text still stores a secret in configuration. The 85 tier requires the mcpServers object and a server entry
      field, which separates genuine MCP client files from incidental matches.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 8
risk_description: >-
  This medium-confidence detector identifies a literal API key, token or password stored in an MCP server
  configuration. A valid secret lets the holder call the connected service directly, with whatever rights the key
  carries: reading and changing source repositories, tickets, databases, search or cloud resources that the AI client
  was wired to. Harm is serious but bounded by the scope of each key and the service behind it; the match does not
  establish administrative rights or which data the service holds. Risk 8 and SENSITIVE InfoTech fit a directly usable
  service credential with unknown scope; PROTECTED requires confirmed access to protected systems or broad
  administrative authority.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  idcf: DSL-3
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE and SENSITIVE InfoTech because a secret embedded in an
    MCP configuration is a directly usable credential for the connected service. PROTECTED is not met because the match
    does not establish the key's scope, the sensitivity of the service's data, or that the key is still valid.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Medium InfoTech handling fits a service credential bounded by the scope of one key. High handling requires
      confirmed administrative or protected-system access.
purview:
  patterns_proximity: 3000
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 65
      discovery_only: true
      id_match: &mcp_primaries
        type: any
        ids:
          - Regex_mcp_env_secret
          - Regex_mcp_header_secret
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: *mcp_primaries
      matches:
        - type: any
          min_matches: 1
          refs:
            - Pattern_mcp_servers_object
            - Keyword_mcp_server_marker
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 85
      id_match: *mcp_primaries
      matches:
        - ref: Pattern_mcp_servers_object
        - ref: Pattern_mcp_server_entry
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_mcp_env_secret
      pattern: '(?i)("[A-Za-z0-9_]{0,60}(?:API_?KEY|ACCESS_KEY|SECRET_KEY|PRIVATE_KEY|AUTH_KEY|TOKEN|SECRET|PASSWORD|PASSWD)"\s*:\s*"(?![<$/~.]|[^"]{0,40}(?:your|xxxx|\*{3}|redacted|placeholder|changeme))[^"\s$<>{}]{12,}")'
    - id: Regex_mcp_header_secret
      pattern: '(?i)(?<![A-Za-z0-9_-])(Authorization"?\s*:\s*"?(?:Bearer|Basic|Token)\s+(?![<$/~.]|[^"]{0,40}(?:your|xxxx|\*{3}|redacted|placeholder|changeme))[^"\s$<>{}]{12,}|X-API-Key"?\s*:\s*"?(?![<$/~.]|[^"]{0,40}(?:your|xxxx|\*{3}|redacted|placeholder|changeme))[^"\s$<>{}]{12,})'
    - id: Pattern_mcp_servers_object
      pattern: '("mcpServers"\s*:\s*\{)'
    - id: Pattern_mcp_server_entry
      pattern: '("command"\s*:\s*"|"url"\s*:\s*"(?:https?|wss?)://|"type"\s*:\s*"(?:stdio|http|sse|streamable-http|ws)")'
  keywords:
    - id: Keyword_mcp_server_marker
      groups:
        - match_style: string
          terms:
            - '@modelcontextprotocol/'
            - mcp-server
            - /mcp
            - mcp.json
            - claude_desktop_config
      strength: specific
