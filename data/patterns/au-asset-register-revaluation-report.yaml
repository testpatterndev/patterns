schema: testpattern/v1
name: Non-Current Asset Register or Asset Revaluation Report
slug: au-asset-register-revaluation-report
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Financial (non-current) asset registers and asset revaluation reports: fixed asset, property, land and buildings, infrastructure and plant and equipment registers, comprehensive, desktop and indexation revaluation reports and valuation schedules prepared under AASB 116 Property, Plant and Equipment and AASB 13 Fair Value Measurement (in the Queensland public sector, under Queensland Treasury's Non-Current Asset Policies). Records carry asset IDs, asset class, fair value or current replacement cost, accumulated depreciation, written down value, useful life and revaluation increments or decrements. Before financial statements are certified and published, these figures reveal unannounced valuations, impairments and the commercial position of assets that may be sold, leased or contested. global-top500-307-asset-inventory-records covers IT asset inventories (hostnames, serial numbers, MAC and IP addresses); this SIT anchors on financial asset register and revaluation wording and needs valuation context.
operation: >-
  Primary: fixed / non-current / infrastructure / property / land and building(s) / plant and equipment / road / building asset register / listing / schedule, asset revaluation / valuation report / schedule / register / summary / worksheet, comprehensive / desktop / interim / independent / full / index[ation] revaluation [report], revaluation report / schedule / summary / worksheet / results. A bare "asset register" is not a primary. Every enforce tier needs valuation context within 300 characters (AASB 13, AASB 116, fair value hierarchy, current / gross replacement cost, accumulated depreciation, [asset] revaluation surplus, revaluation increment / decrement, [remaining] useful life, written down value, impairment, [registered] valuer, Non-Current Asset Policies, level 3 inputs, indexation factor, componentisation). 65 (discovery only): primary alone. 75: primary plus context plus one of a labelled asset / property / parcel / component ID, a labelled value (fair value, carrying amount, written down value, WDV, gross replacement cost / carrying amount / value, current replacement cost, replacement cost, accumulated depreciation, revalued amount, market / book value, revaluation increment / decrement / adjustment / movement) of at least $1,000, or an asset row (an asset code followed on the same line by two thousand-separated amounts). 85: primary plus context plus any two of asset ID, value, asset row and a populated class / method field (asset class / category, class of asset, [remaining] useful life, depreciation method / rate, valuation method / basis / technique / approach, fair value hierarchy, level 1-3 inputs). Enforce tiers AND NOT the shared template-exclusion dictionary and a publication / guidance exclusion (annual report, audited financial statements, accounting policy, policy guidance, guidance note, fact sheet, frequently asked questions, this guideline, this policy, practice guide, media release).
pattern: >-
  (?i)\b(?:(?:fixed|non-current|infrastructure|property|land\s+and\s+buildings?|plant\s+and\s+equipment|road|building)\s+asset\s+(?:register|listing|schedule)|asset\s+(?:revaluation|valuation)\s+(?:report|schedule|register|summary|worksheet)|(?:comprehensive|desktop|interim|independent|full|index(?:ation)?)\s+revaluation(?:\s+report)?|revaluation\s+(?:report|schedule|summary|worksheet|results))s?\b
confidence: medium
confidence_justification: >-
  Medium. Revaluation and asset register wording is also used in published financial statements, Treasury policy and valuation methodology documents, so enforce tiers need valuation context plus populated asset fields, and publication and guidance framing is excluded. Asset ID formats vary by entity, so IDs are label-anchored. 85/75 are heuristic evidence tiers, not measured accuracy. Test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Financial Accountability Act 2009 (Qld)
  - Financial and Performance Management Standard 2019 (Qld)
frameworks:
  - QGISCF
  - AASB 116 Property, Plant and Equipment
  - AASB 13 Fair Value Measurement
  - Queensland Treasury Non-Current Asset Policies
data_categories:
  - financial
  - business
  - government
corroborative_evidence:
  keywords:
    - AASB 13
    - AASB 116
    - fair value hierarchy
    - current replacement cost
    - accumulated depreciation
    - revaluation increment
    - useful life
    - written down value
  proximity: 300
test_cases:
  should_match:
    - value: "Comprehensive revaluation report - land and buildings, 30 June 2026 (draft, not yet certified)\nAsset ID: BLD-004417\nAsset class: Buildings - specialised\nCurrent replacement cost: $18,450,000\nAccumulated depreciation: $6,120,300\nFair value: $12,329,700\nRevaluation increment: $2,184,500\nValuation method: current replacement cost (level 3 inputs)"
      description: Draft comprehensive revaluation with asset ID, class, values and method (85 tier)
      synthetic: true
    - value: "Infrastructure asset register extract - road network\nRD-10442 | Teston Road seal | 4,812,000 | 1,604,000 | 3,208,000\nRD-10443 | Teston Creek bridge | 9,250,000 | 2,775,000 | 6,475,000\nRemaining useful life: 38 years; indexation factor 6.2% applied."
      description: Infrastructure asset register rows with useful life and indexation context (85 tier)
      synthetic: true
    - value: "Desktop revaluation for the depot site - fair value: $3,640,000 per the registered valuer, pending sign-off."
      description: Desktop revaluation with a single labelled fair value (75 tier)
      synthetic: true
  should_not_match:
    - value: "Note 14 Property, plant and equipment (audited financial statements). The department undertakes a comprehensive revaluation every five years in accordance with AASB 13; fair value: $412,000,000 across all classes."
      description: Published financial statement note (publication exclusion)
    - value: "IT asset register export\nhostname,serial,mac_address,owner\nLAPTOP-0042,SN88341,00:1A:2B:3C:4D:5E,Casey Teston"
      description: IT asset inventory (no financial asset register primary or valuation context; covered by global-top500-307)
    - value: "Asset revaluation report\nAsset ID: __________\nFair value: $__________\nAccumulated depreciation: $__________"
      description: Blank revaluation template (65 only)
    - value: "This guideline explains when an entity should commission a comprehensive revaluation and how to apply the fair value hierarchy."
      description: Treasury policy guidance (guidance exclusion)
    - value: "unrelated generic text without domain phrases"
      description: Unrelated
false_positives:
  - description: Published annual reports and audited financial statements with property, plant and equipment notes.
    mitigation: A publication exclusion suppresses every enforce tier; draft statements without that framing are a true positive while values are unannounced.
  - description: Treasury Non-Current Asset Policies, accounting policies and valuation methodology guidance.
    mitigation: A guidance exclusion suppresses every enforce tier, and they rarely carry populated asset IDs or values.
  - description: IT asset inventories.
    mitigation: A bare "asset register" is not a primary and valuation context is required; global-top500-307-asset-inventory-records covers IT inventories.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_asset_revaluation_primary
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_au_asset_revaluation_asset_id
            - Regex_au_asset_revaluation_value
            - Regex_au_asset_revaluation_asset_row
            - Regex_au_asset_revaluation_class_method
        - ref: Keyword_au_asset_revaluation_valuation_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_asset_revaluation_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_asset_revaluation_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_asset_revaluation_asset_id
            - Regex_au_asset_revaluation_value
            - Regex_au_asset_revaluation_asset_row
        - ref: Keyword_au_asset_revaluation_valuation_context
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_asset_revaluation_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_asset_revaluation_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_asset_revaluation_primary
      pattern: >-
        (?i)\b(?:(?:fixed|non-current|infrastructure|property|land\s+and\s+buildings?|plant\s+and\s+equipment|road|building)\s+asset\s+(?:register|listing|schedule)|asset\s+(?:revaluation|valuation)\s+(?:report|schedule|register|summary|worksheet)|(?:comprehensive|desktop|interim|independent|full|index(?:ation)?)\s+revaluation(?:\s+report)?|revaluation\s+(?:report|schedule|summary|worksheet|results))s?\b
    - id: Regex_au_asset_revaluation_asset_id
      pattern: >-
        (?i)\b(?:asset\s+(?:ID|no\.?|number|code|tag)|asset\s?#|property\s+(?:ID|no\.?|number)|parcel\s+(?:ID|no\.?)|component\s+(?:ID|no\.?))[ \t]*[:#]?[ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|withheld|not|none|nil|the|see|refer)\b|_{2,}|\[|<)(?=[A-Z0-9/-]{0,10}\d)[A-Z0-9][A-Z0-9/-]{2,20}\b
    - id: Regex_au_asset_revaluation_value
      pattern: >-
        (?i)\b(?:fair\s+value|carrying\s+amount|written\s+down\s+value|WDV|gross\s+(?:replacement\s+cost|carrying\s+amount|value)|current\s+replacement\s+cost|replacement\s+cost|accumulated\s+depreciation|revalued\s+amount|market\s+value|book\s+value|revaluation\s+(?:increment|decrement|adjustment|movement))[ \t]{0,3}(?:\(\$\))?[ \t]{0,3}[:#]?[ \t]{0,5}\(?-?(?:\$|A\$|AUD)?[ \t]?\d{1,3}(?:,\d{3}){1,4}(?:\.\d{2})?
    - id: Regex_au_asset_revaluation_asset_row
      pattern: >-
        \b[A-Z]{1,5}[-_]?\d{3,10}\b[^\n]{1,120}\$?\d{1,3}(?:,\d{3}){1,4}(?:\.\d{2})?[^\n\d]{1,40}\$?\d{1,3}(?:,\d{3}){1,4}
    - id: Regex_au_asset_revaluation_class_method
      pattern: >-
        (?i)\b(?:asset\s+(?:class|category)|class\s+of\s+asset|(?:remaining\s+)?useful\s+life|depreciation\s+(?:method|rate)|valuation\s+(?:method|basis|technique|approach)|fair\s+value\s+hierarchy|level\s+[123]\s+inputs?)[ \t]*[:#][ \t]{0,5}(?!(?:n/?a|unknown|tbc|tba|the|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9]
  keywords:
    - id: Keyword_au_asset_revaluation_valuation_context
      groups:
        - match_style: word
          terms:
            - AASB 13
            - AASB 116
            - fair value hierarchy
            - current replacement cost
            - gross replacement cost
            - accumulated depreciation
            - revaluation surplus
            - asset revaluation surplus
            - revaluation increment
            - revaluation decrement
            - useful life
            - remaining useful life
            - written down value
            - impairment
            - valuer
            - registered valuer
            - Non-Current Asset Policies
            - level 3 inputs
            - indexation factor
            - componentisation
      strength: domain
    - id: Keyword_au_asset_revaluation_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - annual report
            - audited financial statements
            - accounting policy
            - policy guidance
            - guidance note
            - fact sheet
            - frequently asked questions
            - this guideline
            - this policy
            - practice guide
            - media release
      strength: noise
risk_rating: 6
risk_description: >-
  The classifier identifies a financial asset register or asset revaluation report with valuation context and populated asset fields: asset IDs, class, fair value or replacement cost, accumulated depreciation, written down value, useful life and revaluation movements. Before financial statements are certified and published, these figures reveal unannounced valuations, impairments and the value the entity places on assets it may sell, lease, insure or defend in a compensation claim, which buyers, tenants and claimants can exploit. Published statements, policy guidance, blank templates and IT inventories are excluded from enforce tiers. Risk 6 supports SENSITIVE Commercial-in-Confidence; once values are published in audited statements the same figures are OFFICIAL.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Commercial-in-Confidence
  idcf: DSL-3
  idcf_marker: Confidential
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 6 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Commercial-in-Confidence and Medium because
    an unpublished asset register or revaluation reveals valuations and impairments that affect sale, lease and claim
    negotiations. Risk 8 or PROTECTED is not met: the harm is commercial and bounded, and ends when audited values are
    published.
  generic:
    classification: Medium
    dlm: Medium Commercial-in-Confidence
    rationale: >-
      Medium Commercial-in-Confidence handling fits unpublished asset valuations; published audited values need only
      baseline handling.
references:
  - title: Queensland Treasury - Non-Current Asset Policies for the Queensland Public Sector
    url: https://www.treasury.qld.gov.au/budget/financial-reporting-and-policies/non-current-asset-policies-for-the-queensland-public-sector/
  - title: AASB 116 Property, Plant and Equipment (compiled)
    url: https://www.aasb.gov.au/admin/file/content105/c9/AASB116_08-15.pdf
  - title: IFRS Foundation - IAS 16 Property, Plant and Equipment
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment/
  - title: Financial and Performance Management Standard 2019 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/sl-2019-0182
  - title: Financial Accountability Act 2009 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-009
created: '2026-10-20'
updated: '2026-10-20'
changelog:
  - version: 1.0.0
    date: '2026-10-20'
    description: >-
      Initial release (qgfin sector review gap). Financial asset registers and revaluation reports. Every enforce tier
      needs valuation context; 75 needs an asset ID, a labelled value or an asset row, 85 two of asset ID, value, asset
      row and class / method. Publication / guidance and template framing are excluded on enforce tiers.
