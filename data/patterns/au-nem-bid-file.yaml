schema: testpattern/v1
name: NEM Energy/FCAS Bid Submission
slug: au-nem-bid-file
version: 1.0.3
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects AEMO NEM dispatch bid/offer submission artefacts - the MMS bidding table
  vocabulary (BIDDAYOFFER, BIDOFFERPERIOD, BIDOFFERFILETRK, MNSP day-offer tables),
  the Dispatch Bid/Offer Submissions JSON payload fields (energyBids, fcasBids,
  mnspBids, rebidExplanation), and the participant FTP bid filename convention
  (<PARTICIPANTID>_<x>BID<x>_<timestamp>.zip/.json). Pre-dispatch bids, price bands
  and rebid reasoning are commercially critical trading data for market participants.
operation: >-
  Matches distinctive AEMO bidding tokens: MMS data-model bidding table names, the
  NEM Dispatch Bidding API JSON member names, or a bid submission filename. These
  strings rarely occur outside genuine bid files, participant bidding-system output,
  or Data Interchange loader content. Corroborative keywords tighten to trading
  context.
pattern: >-
  \b(?:BIDDAYOFFER|BIDOFFERPERIOD|BIDPEROFFER|BIDOFFERFILETRK|MNSP_DAYOFFER|MNSP_BIDOFFERPERIOD|DISPATCHOFFERTRK|PREDISPATCHOFFERTRK)\b|\b(?:energyBids|fcasBids|mnspBids|rebidExplanation)\b|(?<![A-Za-z0-9])[A-Z0-9]{3,15}_[A-Za-z0-9]*BID[A-Za-z0-9]*_[0-9]{8,14}\.(?:zip|json|tmp)(?![A-Za-z0-9])
confidence: medium
confidence_justification: >-
  Medium confidence: the table and JSON member names are highly distinctive, but the
  same vocabulary appears in AEMO's public MMS data-model documentation and in
  next-day public bid archives republished from NEMWEB. Corroborative rebid/trading
  keywords and absence of documentation framing raise precision; enforcement should
  target pre-publication submissions, not the public archive.
jurisdictions:
  - au
regulations:
  - "National Electricity Rules cl 3.8 (bidding and dispatch)"
  - "Competition and Consumer Act 2010 (Cth)"
frameworks:
  - ISO 27001
  - SOCI Act 2018 (Cth)
data_categories:
  - energy-market
  - trading
  - business
corroborative_evidence:
  keywords:
    - rebid
    - trading day
    - price band
    - dispatch
    - DUID
    - AEMO
    - participant file server
    - self-forecast
  proximity: 300
  keyword_lists:
    - au-nem-duids
customisation:
  - key: participant-duids
    kind: dictionary-subset
    target: corroborative_evidence.keyword_lists/au-nem-duids
    note: >-
      For participant-specific precision, replace the full-market DUID
      dictionary with the subset registered to your organisation (deployment
      overlay). Without the overlay the bid-structure arms still detect; the
      DUID corroboration is market-wide rather than organisation-specific.
    required_for_enforcement: false
test_cases:
  should_match:
    - value: 'INSERT INTO BIDDAYOFFER (DUID, SETTLEMENTDATE, OFFERDATE) VALUES ...'
      description: MMS bidding table loader statement
    - value: '{"energyBids":[{"tradingDay":"2026-08-01","dailyEnergyConstraint":11000}],"rebidExplanation":{"reason":"plant availability change"}}'
      description: Dispatch Bid/Offer Submissions JSON payload with rebid explanation
    - value: 'uploaded STANW1_FCASBIDFTP_20260801123045.zip to the Export\Bids folder'
      description: Participant FTP bid filename convention
    - value: BIDOFFERPERIOD extract joined to PREDISPATCHOFFERTRK for the audit
      description: 5MS bidding table names in an analysis note
  should_not_match:
    - value: the team submitted a competitive bid for the construction tender
      description: Prose procurement bidding, no AEMO bidding vocabulary
    - value: 'BIDDAY_REPORT_2026.xlsx attached for the sales meeting'
      description: Near-miss token that is not an AEMO bidding table or filename
    - value: place your bids before the auction closes on Friday
      description: Generic auction prose
false_positives:
  - description: AEMO's public MMS data-model documentation, training material, and
      next-day public bid archives (NEMWEB) legitimately contain the same table names.
    mitigation: Require corroborative trading keywords, and exclude documentation or
      tutorial framing from enforcing tiers; treat published next-day archives as
      public by policy scoping.
  - description: Data Interchange schema files and pdrLoader configuration mention
      bidding tables without containing bid values.
    mitigation: Keep confidence at medium; combine with volume/count thresholds in
      DLP rules so schema-only mentions do not enforce.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  Pre-dispatch energy and FCAS bids, price bands, and rebid reasoning reveal a
  participant's trading strategy. Disclosure before market publication enables
  gaming of dispatch outcomes and breaches market conduct obligations.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Financial
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: "Competition and Consumer Act 2010 (Cth)"
    url: https://www.legislation.gov.au/C2004A00109/latest/text
created: 2026-07-24
updated: '2026-09-24'
changelog:
  - version: 1.0.3
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references."
  - version: 1.0.2
    date: 2026-08-03
    note: Label-taxonomy fix - replace the list-shaped sensitivity_labels (bare SENSITIVE) with the canonical jurisdiction map; qgiscf_dlm SENSITIVE Financial (pre-dispatch bids, price bands and rebid reasoning are trading strategy).
  - version: 1.0.1
    date: 2026-07-25
    note: Declare participant-duids dictionary-subset customisation (deployment overlays supply a participant-filtered DUID subset).
  - version: 1.0.0
    date: 2026-07-24
    note: Initial draft from public AEMO FTP bidding guide and MMS data-model research.
