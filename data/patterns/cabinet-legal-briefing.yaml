schema: testpattern/v1
name: Cabinet Legal Briefing
slug: cabinet-legal-briefing
version: 1.5.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: 'Detects legal annexures to Cabinet submissions containing privileged legal analysis supporting Cabinet decision-making. These documents carry dual protection: Cabinet confidentiality (Westminster convention) and legal professional privilege. Disclosure breaches both simultaneously with no remediation possible.'
operation: 'Primary (any): CABINET-IN-CONFIDENCE marker, Cabinet (Legal) Annexure/Briefing/Submission document type, or "legal advice prepared for Cabinet". 65 (discovery only) = primary alone. 75 = primary plus two distinct populated document header fields (To, From, Date, Subject, Re, Our ref, File/Matter number, Prepared/Approved/Cleared by, Author, Version, Status, Classification) plus independent legal evidence (legal risk, privilege, LPP, PROTECTED, legal professional privilege, legal opinion, Crown Law, Crown Solicitor, constitutional risk, litigation risk). 85 = primary plus three distinct header fields plus the legal evidence. Public handbook/announcement, furniture and template/fixture exclusions are NOT-gated on every tier.'
pattern: (?i)\bCabinet\b
confidence: medium
confidence_justification: 'Medium: Cabinet document types and markers are distinctive but also appear in handbooks, news and training; enforcement needs a populated document header and legal evidence that the primary does not itself match. Tiers are heuristic evidence gates, not measured accuracy.'
jurisdictions:
  - au
regulations:
- Crime and Corruption Act 2001 (Qld)
- Criminal Code 1899 (Qld)
- Evidence Act 1977 (Qld)
- Right to Information Act 2009 (Qld)
frameworks:
- QGISCF
data_categories:
  - legal
  - government
corroborative_evidence:
  keywords:
    - legal advice
    - legal briefing
    - legal risk
    - legal annexure
    - privilege
    - LPP
    - PROTECTED
    - CABINET-IN-CONFIDENCE
    - legal professional privilege
    - legal opinion
    - legal analysis
  proximity: 300
  keyword_lists:

    - corporate-legal

    - government-services
test_cases:
  should_match:
    - value: |-
        CABINET-IN-CONFIDENCE - LEGAL PROFESSIONAL PRIVILEGE
        Cabinet Legal Annexure
        To: Cabinet Budget Review Committee
        From: Crown Solicitor
        Date: 14/03/2026
        Subject: Coal Royalties Amendment Bill 2026 - constitutional risk
        Our ref: CL2026-0412
        Crown Law advises that the retrospective provisions carry a high litigation risk.
      description: 85 - Cabinet legal annexure with populated header (To/From/Date/Subject/Our ref) and privilege/legal-risk evidence
      synthetic: true
    - value: |-
        PROTECTED - Legal-Privilege
        Cabinet Legal Briefing
        Prepared by: Crown Law
        For: Cabinet Budget Review Committee
        Subject: Legal risks associated with proposed coal royalty increases
      description: 75 - Cabinet legal briefing with two populated header fields and Crown Law/PROTECTED evidence
    - value: |-
        CABINET-IN-CONFIDENCE - LEGAL PROFESSIONAL PRIVILEGE
        Legal Annexure to Cabinet Submission No. 2025-0412

        Legal Risk Assessment
        Subject: Water Infrastructure (Cost Recovery) Amendment Bill 2025

        This legal briefing is provided for the information of Cabinet.
      description: 65 discovery - marked annexure with a single header field (Subject)
    - value: The legal advice prepared for Cabinet identifies significant risks of constitutional challenge to the proposed amendments. This privileged legal briefing should be read in conjunction with the main Cabinet submission.
      description: 65 discovery - prose reference to Cabinet legal advice without a document header
    - value: 'Cabinet Legal Briefing prepared by Crown Law: constitutional risk; LPP; PROTECTED.'
      description: 65 discovery - one-line reference without populated header fields
  should_not_match:
    - value: The Cabinet decision was announced by the Premier at a media conference on Tuesday. The government confirmed it will proceed with the legislation following Cabinet approval.
      description: News article about Cabinet decision announcement
    - value: The Cabinet Handbook sets out the procedures for the preparation and submission of Cabinet submissions. All agencies should refer to the Department of Premier and Cabinet guidelines.
      description: Public Cabinet procedures handbook
    - value: The new cabinet was installed in the conference room last week. The oak cabinet matches the existing furniture in the executive suite.
      description: Furniture reference using word cabinet
    - value: CABINET-IN-CONFIDENCE agenda for next meeting.
      description: Marker alone is not legal advice — discovery only, no enforcement
    - value: Training example Cabinet Legal Briefing marked LPP.
      description: Training/example context is suppressed by the noise exclusion
    - value: CABINET-IN-CONFIDENCE Cabinet submission.
      description: Marker plus generic Cabinet term cannot self-prove legal content
    - value: Cabinet announced the bill after its regular meeting.
      description: Public Cabinet announcement with no legal briefing, privilege, or confidential marker
    - value: |-
        Cabinet Submission cover sheet
        To: ________
        From: ________
        Date: ________
        Subject: [insert]
        Legal risk: [summarise]
      description: Blank Cabinet submission template - placeholder header fields are rejected
false_positives:
  - description: News articles about Cabinet decisions and announcements
    mitigation: Require co-occurrence with legal privilege terms (LPP, privilege, legal annexure) within proximity window
  - description: Public Cabinet procedure documents and handbooks
    mitigation: Negative match on 'handbook', 'guidelines', 'procedures manual', 'public version'
  - description: Furniture or physical cabinet references
    mitigation: Require legal context keywords within 150 characters of 'Cabinet'
  - description: Historical Cabinet documents released under 30-year rule
    mitigation: Negative match on 'released', 'declassified', 'National Archives', '30-year'
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match:
        type: any
        ids:
          - Pattern_cabinet_legal_briefing_cabinet_in_confidence_document_marker
          - Pattern_cabinet_legal_briefing_cabinet_legal_document_type
          - Pattern_cabinet_legal_briefing_legal_advice_for_cabinet
      matches:
        - ref: Regex_cabinet_legal_briefing_record_structure
          min_count: 3
          unique_results: true
        - ref: Evidence_cabinet_legal_briefing_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_cabinet_legal_briefing_exclusion
            - Keyword_noise_exclusion
            - Filter_cabinet_legal_briefing_exclusion
    - confidence_level: 75
      id_match:
        type: any
        ids:
          - Pattern_cabinet_legal_briefing_cabinet_in_confidence_document_marker
          - Pattern_cabinet_legal_briefing_cabinet_legal_document_type
          - Pattern_cabinet_legal_briefing_legal_advice_for_cabinet
      matches:
        - ref: Regex_cabinet_legal_briefing_record_structure
          min_count: 2
          unique_results: true
        - ref: Evidence_cabinet_legal_briefing_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_cabinet_legal_briefing_exclusion
            - Keyword_noise_exclusion
            - Filter_cabinet_legal_briefing_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Pattern_cabinet_legal_briefing_cabinet_in_confidence_document_marker
          - Pattern_cabinet_legal_briefing_cabinet_legal_document_type
          - Pattern_cabinet_legal_briefing_legal_advice_for_cabinet
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_cabinet_legal_briefing_exclusion
  regexes:
    - id: Pattern_cabinet_legal_briefing_cabinet_in_confidence_document_marker
      pattern: (?i)CABINET[\s-]+IN[\s-]+CONFIDENCE
    - id: Pattern_cabinet_legal_briefing_cabinet_legal_document_type
      pattern: (?i)\bCabinet\s+(?:Legal\s+)?(?:Annexure|Briefing|Submission)\b
    - id: Pattern_cabinet_legal_briefing_legal_advice_for_cabinet
      pattern: (?i)\blegal\s+advice\s+prepared\s+for\s+(?:the\s+)?Cabinet\b
    - id: Regex_cabinet_legal_briefing_record_structure
      pattern: (?i)\b(?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+(?:by|for)|Approved\s+by|Cleared\s+by|Author|Version|Status|Classification|Contact\s+officer|Meeting\s+date|Agenda\s+item)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<)[A-Za-z0-9$]
  keywords:
    - id: Evidence_cabinet_legal_briefing_corroborative
      groups:
        - match_style: word
          terms:
            - legal risk
            - litigation risk
            - constitutional risk
            - privilege
            - text: LPP
              case_sensitive: true
            - text: PROTECTED
              case_sensitive: true
            - legal professional privilege
            - legal opinion
            - Crown Law
            - Crown Solicitor
      strength: specific
    - id: Evidence_cabinet_legal_briefing_exclusion
      groups:
        - match_style: word
          terms:
            - media conference
            - announced
            - handbook
            - guidelines
            - tabled
            - released
            - declassified
            - public version
      strength: noise
    - id: Filter_cabinet_legal_briefing_exclusion
      groups:
        - match_style: word
          terms:
            - furniture
            - oak cabinet
            - filing cabinet
            - cabinet maker
      strength: noise
risk_rating: 10
risk_description: >-
  The proximity classifier identifies Cabinet legal advice by placing Cabinet terms near legal briefing, legal risk, annexure, privilege, LPP, or Cabinet-in-Confidence evidence, aiming at a privileged government record rather than generic legal news. A true briefing can expose Crown legal advice, constitutional or litigation vulnerabilities, recommended options, and Cabinet's response, risking waiver of privilege and materially prejudicing legislation, proceedings, negotiations, or collective decision-making across government. Public Cabinet handbooks, announced decisions, furniture references, and released historical records are identified exclusion contexts, although the current detector remains medium-confidence. Risk 10 and PROTECTED Legal are justified for the intended privileged Cabinet briefing because its compromise can cause broad legal and governmental significant damage, and PROTECTED is the highest accepted classification tier.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Cabinet-in-Confidence
references:
  - title: Right to Information Act 2009 (Qld) - Schedule 3 s 2 (Cabinet information)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-013
  - title: Crime and Corruption Act 2001 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2001-069
created: '2026-02-20'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): 75 now requires two distinct populated document header fields (new Regex_..._record_structure) plus legal evidence; 85 requires three header fields plus legal evidence (the old 85 needed only marker + document type + a keyword and could fire on phrases alone). Removed "legal advice", "legal briefing" and "legal annexure" from the corroborative group because the primaries match them (same-span self-corroboration); PROTECTED and LPP are now case-sensitive; the marker regex uses \s+/- separators; recommended_confidence 85 -> 75. Added a populated 85 annexure and a blank cover-sheet decoy; one-line/prose positives re-described as 65 discovery. Added RTI Act and Crime and Corruption Act references.'
  - version: 1.4.1
    date: '2026-09-14'
    description: Assign QGISCF category to PROTECTED Cabinet-in-Confidence; preserve classification tier and detection logic.
  - version: 1.4.0
    date: '2026-07-16'
    description: 'sit-alignment-validation-2026-07-16 wave1 (TP-00686): any-of primary across the CABINET-IN-CONFIDENCE marker, the Cabinet Legal Annexure/Briefing/Submission document-type regex, and a new legal-advice-prepared-for-Cabinet literal regex (previously all tiers required the exact marker, making two authored positives unreachable). Every enforcing branch now requires the legal corroborative group (75 previously enforced on marker plus generic Cabinet wording with zero legal evidence); 85 keys on the marker plus legal document type and the corroborative group. Public handbook/announcement exclusion group now NOT-gated at 75 as well as 85; furniture and noise exclusions retained on all tiers. Adversarial test cases added.'
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1458 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Convert the Evidence_*_exclusion noise list on the 85 tier from a required positive ref (wiring bug: the tier could only fire when publication/template noise was PRESENT, and the exclusion never vetoed anything) to a max_matches:0 NOT-group per sibling convention (tier-harness triage class T2 sub-case "exclusion lists wired as required refs")'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
