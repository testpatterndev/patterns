schema: testpattern/v1
name: Controlled Operation Authorisation
slug: controlled-operation-authorisation
version: 1.6.1
type: keyword_proximity
pattern_class: concept
engine: universal
description: Detects controlled operation authorisations under PPRA 2000 (Qld) Part 5. Controlled operations involve officers in criminal activity under legal authority. Disclosure reveals officers and operational scope.
operation: >-
  Primary: controlled operation / assumed identity authority phrases. 65 = phrase only (discovery). 75 = phrase plus a populated authority record field (participant, authorising officer, applicant, target, operation, period, authorised conduct, name, reference number). 85 = phrase plus two distinct populated fields plus a labelled authorisation/warrant number plus independent evidence (PPRA, Part 5, section 228, authorising officer, scope of authority ...). Legislative summaries, annual reports and academic framing excluded.
pattern: (?i)\b(controlled\s+operation\s+(?:authoris(?:ation|ed)|authority)|assumed\s+identity\s+(?:authoris(?:ation|ed)|authority)|authorised\s+(?:civilian\s+)?conduct\s+(?:authority|authorisation)|PPRA\s+controlled\s+operation|undercover\s+operation\s+authorisation)\b
confidence: medium
confidence_justification: >-
  Medium confidence: enforcement requires a populated authority record; authority numbers are unpublished, so the reference is a documented label-anchored fallback and only counts at 85 together with other record fields.
jurisdictions:
  - au
regulations:
  - Crime and Corruption Act 2001 (Qld)
  - Police Powers and Responsibilities Act 2000 (Qld)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - government
corroborative_evidence:
  keywords:
    - PROTECTED
    - Law-Enforcement
    - PPRA
    - Police Powers and Responsibilities Act
    - Part 5
    - section 228
    - s.228
    - authorising officer
    - controlled conduct
    - participant
    - authorisation period
    - scope of authority
    - Commissioner's approval
  proximity: 300
  keyword_lists:

    - law-enforcement

    - government-services
    - en-government-classification
customisation:
  - key: surveillance-warrant-reference
    kind: identifier-format
    identifier: surveillance-warrant-reference
    target: purview.regexes/Regex_controlled_operation_authorisation_authority_reference
    mode: replace
    affects_tiers: [85]
    required_for_enforcement: false
    note: Replace the documented labelled-reference fallback with the customer's real format (see docs/identifiers.md#surveillance-warrant-reference). Earlier versions used the COA-YYYY-AGENCY-NNNN authority format, which does not appear in any published source.
test_cases:
  should_match:
    - value: 'PROTECTED Law-Enforcement. Controlled Operation Authorisation. PPRA Part 5 — Authorisation number: 2025/0047. Authorising officer: A/C J. BURKE. Infiltrate drug distribution network. Authorised conduct: purchase controlled substances. Participant: Det. Const. S. TAYLOR (assumed identity). Period: 90 days.'
      description: Formal controlled operation authorisation (reaches 85)
    - value: 'RESTRICTED. Application for Controlled Operation Authority under PPRA s.228. Operation VANGUARD. Authorised conduct: meetings with OC figures, handling proceeds. Assumed identity authority for two officers. Scope and risk assessment attached.'
      description: Application for controlled operation authority (reaches 75)
    - value: "Controlled operation authorisation renewal. Authorisation number: 2024/0089. Extension of authorised conduct for 60 days. Undercover operation yielded significant intelligence. PPRA Part 5 compliance audit completed. Commissioner's approval recommended."
      description: Controlled operation renewal (reaches 75)
    - value: "PROTECTED Law-Enforcement\nControlled operation authority — PPRA Part 5\nAuthorisation number: 2026/0417\nAuthorising officer: Assistant Commissioner Jordan Staffson\nParticipant: Detective Senior Constable Avery Teston\nPeriod: 90 days from 01/10/2026\nScope of authority: purchase of controlled substances from the target syndicate."
      description: 'Populated authority: authorisation number, authorising officer, participant and period plus PPRA Part 5 evidence (reaches 85)'
      synthetic: true
    - value: "Controlled operation authority - variation\nParticipant: Detective Constable Morgan Teston\nThe authorised conduct is extended for a further 30 days."
      description: One populated participant field with the controlled-operation primary (reaches 75)
      synthetic: true
  should_not_match:
    - value: PPRA Part 5 provides the framework for controlled operations. Section 228 sets out requirements. Legislation publicly available.
      description: Legislative summary
    - value: The CCC annual report noted 15 controlled operation authorities granted during the period.
      description: Published CCC annual report
    - value: A law review examined controlled operations across Australian jurisdictions, comparing PPRA Part 5 with Commonwealth legislation.
      description: Academic law review
    - value: "Policy guidance: this procedure explains how records about Controlled Operation Authorisation are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
    - value: "Application for controlled operation authority\nApplicant: __________\nParticipant: __________\nAuthorisation number: __________\nPeriod: __________"
      description: Blank form / template with unfilled fields (must stay below 75)
    - value: "Training: recruits studied how a controlled operation authority is applied for under the PPRA and why authorised conduct must be narrowly scoped."
      description: News or training text naming the topic (must stay below 75)
false_positives:
  - description: Legislative commentary
    mitigation: 'Negative keyword exclusion: ''legislative framework'', ''publicly available''. Require authorisation numbers.'
  - description: Published CCC annual reports
    mitigation: 'Negative keyword exclusion: ''annual report'', ''published'', ''oversight role'''
  - description: Academic law review articles
    mitigation: 'Negative keyword exclusion: ''academic'', ''law review'', ''university'''
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_controlled_operation_authorisation_controlled_operation_terms
      matches:
        - ref: Regex_controlled_operation_authorisation_record_structure
          min_count: 2
          unique_results: true
        - ref: Evidence_controlled_operation_authorisation_corroborative_terms
        - ref: Regex_controlled_operation_authorisation_authority_reference
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_controlled_operation_authorisation_exclusion
    - confidence_level: 75
      id_match: Pattern_controlled_operation_authorisation_controlled_operation_terms
      matches:
        - ref: Regex_controlled_operation_authorisation_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_controlled_operation_authorisation_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_controlled_operation_authorisation_controlled_operation_terms
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Filter_controlled_operation_authorisation_exclusion
  regexes:
    - id: Pattern_controlled_operation_authorisation_controlled_operation_terms
      pattern: (?i)\b(controlled\s+operation\s+(?:authoris(?:ation|ed)|authority)|assumed\s+identity\s+(?:authoris(?:ation|ed)|authority)|authorised\s+conduct|PPRA\s+controlled\s+operation)\b
    - id: Regex_controlled_operation_authorisation_record_structure
      pattern: >-
        (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|participant|authorising\s+officer|applicant|covert\s+operative|target|suspect|operation(?:\s+name)?|period|authori[sz]ed\s+conduct|(?:file|case|reference|ref|authority|authorisation)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_controlled_operation_authorisation_authority_reference
      pattern: >-
        (?i)\b(?:surveillance\s+device\s+warrant|warrant|authorisation)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*[A-Z0-9][A-Z0-9/-]{3,20}\b
  keywords:
    - id: Evidence_controlled_operation_authorisation_corroborative_terms
      groups:
        - match_style: word
          terms:
            - PPRA
            - Police Powers and Responsibilities Act
            - Part 5
            - section 228
            - authorising officer
            - authorisation period
            - scope of authority
            - Commissioner's approval
      strength: specific
    - id: Filter_controlled_operation_authorisation_exclusion
      groups:
        - match_style: word
          terms:
            - media release
            - published
            - annual report
            - legislative framework
            - publicly available
            - academic
            - university
            - law review
            - oversight role

      strength: noise
risk_rating: 10
risk_description: >-
  The detector finds an authorisation, application, or renewal for a controlled operation under the PPRA, including authorised criminal conduct, assumed identities, officers, duration, objectives, and operational scope. Disclosure can identify covert participants, reveal legally authorised tactics, alert targets, and expose officers to retaliation while invalidating evidence or the operation itself. Legislative commentary, published oversight reporting, and academic discussion are excluded, so the normal match is the operative authority rather than a public legal reference. Risk 10 requires PROTECTED Law-Enforcement because the record combines covert identity, legal authority, and live operational detail; no higher QGISCF classification exists.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Law-Enforcement
references:
  - title: Police Powers and Responsibilities Act 2000 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2000-005
  - title: Crime and Corruption Act 2001 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2001-069
created: '2026-02-20'
updated: '2026-09-24'
changelog:
  - version: 1.6.0
    date: '2026-09-24'
    description: 'Quality pass (2026-09-24): rebuilt tiers - 75 needs a populated authority record field (participant, authorising officer, period, reference ...), 85 needs two distinct record fields plus a labelled authorisation number plus PPRA Part 5 / authorising-officer evidence; removed the invented COA-YYYY-AGENCY-NNNN regex in favour of the surveillance-warrant-reference labelled fallback (identifier-format slot, 85 only because that fallback is loose) and dropped the duplicate PPRA-section regex and generic COVERT marker; tests converted to labelled references with 85/75 positives and blank-form/training decoys; references added.'
  - version: 1.5.0
    date: '2026-09-24'
    description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires either independent justice record structure (Regex ..._record_structure) or one of the hand-authored corroborative terms (none of which the primary matches); 85 requires 2 distinct structure hits plus the existing hand-authored evidence. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1488 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'Codex batch-3 review: repair two dead branches in the tier id regex Pattern_controlled_operation_authorisation_controlled_operation_terms — "controlled operation authoris\b" and "assumed identity authorit\b" could never match the real words (word boundary landed mid-word), so documents anchored only by "controlled operation authorisation" or "assumed identity authority" reached no tier; branches now mirror the top-level detector forms authoris(?:ation|ed)|authority'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary; remove dead shared_keywords import(s) en-government-classification as Evidence_classification_markers — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.2
    date: '2026-07-09'
    description: 'Review fix: the 1.1.1 rewrite did NOT give the value a genuine tier id_match hit — the tier regex branch controlled\s+operation\s+authoris\b has a trailing \b that can never match "authorisation"/"authorised", so the value only passed via the top-level universal-engine pattern. Added "authorised conduct" (and "PPRA Part 5"), which the tier id regex Pattern_controlled_operation_authorisation_controlled_operation_terms genuinely matches. The defective trailing-\b branch of the tier regex itself is flagged as a follow-up (regex changes out of this ticket''s scope).'
  - version: 1.1.1
    date: '2026-07-09'
    description: Rewrite third should_match value to contain a genuine id_match hit ("Controlled operation authorisation renewal") — the old value only contained the COA reference number and PPRA terms, which are evidence-only regexes, so no tier could ever anchor on it (tier-harness triage class T5)
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
author: qld-gov-dlp
