schema: testpattern/v1
name: Feature flag configurations
slug: global-top500-258-feature-flag-configurations
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies feature flag configurations patterns in security and access control contexts. Detects potential exposure of sensitive security information in Australian systems.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 7 keywords within 300 characters.'
pattern: (?is)\b(?:feature\s+flag|feature\s+toggle|feature\s+configuration|flag\s+management|feature\s+rollout|canary\s+release|dark\s+launch|feature\s+gate|toggle\s+configuration|release\s+flag)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - NDB Scheme (Cth)
  - Security of Critical Infrastructure Act 2018 (Cth)
  - Telecommunications (Interception and Access) Act 1979 (Cth)
  - GDPR
frameworks:
  - CIS Controls
  - DISP
  - ISO 27001
  - NIST CSF
  - PCI-DSS
  - SOC 2
data_categories:
  - credentials
  - security
corroborative_evidence:
  keywords:
    - feature flag configurations
    - feature
    - flag
    - configurations
    - software
    - engineering
    - architecture
  proximity: 300
test_cases:
  should_match:
    - value: feature flag
      description: Primary topic phrase match
    - value: feature toggle
      description: Case-insensitive topic phrase match
    - value: feature configuration
      description: Alternative topic phrase match
    - value: flag management
      description: Additional topic phrase match
    - value: |-
        Feature flag
        Hostname: app-prd-01.corp.local
        username: svc_deploy
        Source 10.20.30.40 tcp/443
      description: Populated technical artefact reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: source code config
      description: Generic word pair from old broad template should not match
    - value: |-
        Feature flag:
        Hostname:
        username:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about feature flag are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Authentication-related terminology in software documentation, security training materials, or system architecture descriptions without actual credentials.
    mitigation: Require proximity to credential-specific patterns (API keys, connection strings, tokens) rather than general security terminology.
  - description: Code snippets and configuration examples containing credential-related keywords or placeholder values in developer documentation.
    mitigation: Check for common placeholder patterns (example.com, localhost, 0000) and documentation file types to reduce false positives from technical writing.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_feature_flag_configs
      matches:
        - ref: Regex_global_top500_258_feature_flag_configurations_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_feature_flag_configs
      matches:
        - ref: Regex_global_top500_258_feature_flag_configurations_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_feature_flag_configs
  regexes:
    - id: Pattern_feature_flag_configs
      pattern: (?is)\b(?:feature\s+flag|feature\s+toggle|feature\s+configuration|flag\s+management|feature\s+rollout|canary\s+release|dark\s+launch|feature\s+gate|toggle\s+configuration|release\s+flag)\b
    - id: Regex_global_top500_258_feature_flag_configurations_record_structure
      pattern: (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?\b|\bCVE-\d{4}-\d{4,7}\b|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b|\b(?:tcp|udp)\s*/?\s*\d{2,5}\b|\b(?:port|dport|sport)\s*[:=]?\s*\d{2,5}\b|\b(?:hostname|host|asset\s+ID|device\s+ID|sAMAccountName|UPN|username|account\s+name)\s*:\s*(?!_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9][A-Za-z0-9._\\@-]{2,63}
risk_description: >-
  The detector identifies feature-flag, feature-toggle, feature-configuration, and flag-management artifacts rather than a user credential. Disclosure can reveal unreleased functionality, rollout cohorts, kill switches, operational dependencies, and hidden security controls that assist targeted abuse or market-sensitive inference. The product owner and selected users may face serious operational or commercial harm, but an attacker normally still needs access to the flag-management system to change behavior. Risk 8 and SENSITIVE fit a detailed production flag configuration, while critical safety controls, broad administrative access, or embedded credentials would raise the context toward PROTECTED.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE InfoTech, SENS_IT, and Medium because authentic
    feature-flag configuration may expose or alter sensitive release and control behaviour. The detector does not prove
    administrative access, critical control coverage, or a consequence level sufficient for PROTECTED.
  generic:
    classification: Medium
    dlm: Medium InfoTech
    rationale: >-
      Generic Medium and Medium InfoTech suit internal runtime-control configuration whose misuse can cause material but
      bounded product impact. Generic High requires evidence that the flags govern critical or broadly consequential
      functions, not merely the presence of feature-control terminology.
created: '2026-02-08'
updated: '2026-10-19'
