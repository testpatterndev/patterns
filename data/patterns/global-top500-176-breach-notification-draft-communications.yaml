schema: testpattern/v1
name: Breach notification draft communications
slug: global-top500-176-breach-notification-draft-communications
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to breach notification draft communications in international contexts. Sensitive pre-release breach communications may contain personal-impact data —
  incident scope, affected individuals and groups, regulator engagement, and unverified legal conclusions; the matched phrases are not themselves personally identifiable information.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: >-
  (?is)\b(breach\s+notification\s+draft\s+communications|breach\s+notification|data\s+breach|notifiable\s+data\s+breach|affected\s+individuals|notification\s+letter|breach\s+assessment|incident\s+response|privacy\s+commissioner|mandatory\s+reporting|eligible\s+data\s+breach|remediation\s+steps)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - breach notification draft communications
    - breach
    - notification
    - draft
    - communications
    - corporate
    - legal
    - governance
  proximity: 300
test_cases:
  should_match:
    - value: breach notification draft communications
      description: Primary topic phrase match
    - value: breach notification
      description: Case-insensitive topic phrase match
    - value: data breach
      description: Alternative topic phrase match
    - value: notifiable data breach
      description: Additional topic phrase match
    - value: |-
        Breach notification draft communications
        To: Executive Committee
        From: Chief Financial Officer
        Date: 14 August 2026
        Subject: Breach notification draft communications - FY27 review
      description: Populated document header reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: board policy
      description: Generic word pair from old broad template should not match
    - value: |-
        Breach notification draft communications:
        To:
        From:
        Date:
        Subject:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about breach notification draft communications are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: >-
      Common words and phrases related to breach notification draft communications appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal
      data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: >-
      In English (as the primary international business language), similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute
      sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_breach_notification_drafts
      matches:
        - ref: Regex_global_top500_176_breach_notification_draft_communications_record_structure
          min_count: 3
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_breach_notification_drafts
      matches:
        - ref: Regex_global_top500_176_breach_notification_draft_communications_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_breach_notification_drafts
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_breach_notification_drafts
      pattern: >-
        (?is)\b(breach\s+notification\s+draft\s+communications|breach\s+notification|data\s+breach|notifiable\s+data\s+breach|affected\s+individuals|notification\s+letter|breach\s+assessment|incident\s+response|privacy\s+commissioner|mandatory\s+reporting|eligible\s+data\s+breach|remediation\s+steps)\b
    - id: Regex_global_top500_176_breach_notification_draft_communications_record_structure
      pattern: (?i)\b((?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item)\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$])
risk_description: >-
  This concept detector recognizes breach notifications, notifiable data breaches, affected individuals, notification letters, privacy commissioners, assessments, reporting, and remediation steps rather than proving that a draft or actual incident exists. A real draft can prematurely expose incident scope, affected groups, legal conclusions, response gaps, and unverified wording, causing alarm, regulatory prejudice, phishing opportunities, or inconsistent public messaging. The ordinary unit is one breach and its affected people and organization, while statutory guidance, response plans, and model letters are frequent benign contexts. Risk 8 and SENSITIVE reflect serious contained incident and privacy harm; PROTECTED would require a critical service, protected operation, life safety, or significant damage.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, and SENSITIVE Personal-Privacy because an unreleased
    notification can expose affected populations, incident facts, legal assessment, and response posture. PROTECTED is
    not met for a normal bounded breach without critical-service impact, protected operations, severe life-safety
    consequences, or significant damage.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy handling are appropriate for draft notifications containing incident facts and
      affected-person information. High is reserved for breaches with exceptional protected, critical, or severe
      consequences.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.4.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.3.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires 2 distinct independent populated document header fields (Regex_global_top500_176_breach_notification_draft_communications_record_structure); 85 requires 3 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list. Removed evidence no longer referenced by any tier (Keyword_breach_notification_drafts, Keyword_global_top500_176_breach_notification_draft_communications_domain_context, Pattern_global_top500_176_breach_notification_draft_communications_label_context). Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.2.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.2.3
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
  - version: 1.2.2
    date: '2026-07-17'
    description: 'TP-01097 approved reduced scope: description correction only — describe sensitive pre-release breach communications that may contain personal-impact data instead of the blanket-PII claim. The proposed tier_rebalance (draft/review/not-for-release state gating, incident/audience/regulator record anchors, lifecycle demotion) is deliberately NOT implemented: it declares no reference definitions, so it is not executable without inventing detection structure; deferred per QA/independent review pending concrete record-anchor regex/keyword definitions and a training/course negative-evidence dictionary. No detector or tier behaviour changed.'
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1735 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
