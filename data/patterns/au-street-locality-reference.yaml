schema: testpattern/v1
name: Australian Street Locality Reference
slug: au-street-locality-reference
version: 2.8.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Identifies Australian physical addresses using structural street-number + street-name regex combined
  with state/territory, postcode, metro-locality and person corroborative evidence. Covers the implemented road-type
  endings: the standard abbreviated set plus the declared extended endings (Rise, View, Gardens, Loop,
  Trail, Track, Pass, Heights) — not the full GNAF classification list.
operation: >-
  Structural regex matching street number (1-5 digits with optional unit suffix) followed by street name
  text. Corroborative evidence: 3 tiers with road-type + state + postcode (high), road-type + metro/postcode
  (medium), and bare address structure for discovery only (low) within 500 characters.
pattern: \b(\d{1,5}[A-Za-z]?\s+[A-Za-z][A-Za-z\s'\-]{2,50}\s+(?:Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Place|Pl|Court|Ct|Crescent|Cres|Close|Cl|Lane|La|Way|Parade|Pde|Boulevard|Blvd|Terrace|Tce|Circuit|Cct|Highway|Hwy|Grove|Gv|Square|Sq|Esplanade|Esp|Rise|View|Gardens|Loop|Trail|Track|Pass|Heights))\b
confidence: low
confidence_justification: >-
  Low confidence standalone: street number + name is too broad without road-type and geographic context.
  Multi-evidence tiers with postcode validation improve precision.
jurisdictions:
  - au
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
- ISO 27001
- ISO 27701
data_categories:
  - pii
  - contact-information
corroborative_evidence:
  keywords:
    - street
    - road
    - avenue
    - drive
    - crescent
    - place
    - court
    - highway
    - parade
    - terrace
    - close
    - circuit
    - lane
    - way
  proximity: 500
  keyword_lists:

    - au-road-classification-extended
test_cases:
  should_match:
    - value: '42 Wallaby Way Sydney NSW 2000'
      description: Full address with street number, name, city, state, postcode
    - value: '7B George Street'
      description: Low-tier probe - street structure without locality evidence
    - value: '7B George Street Sydney'
      description: Medium-tier probe - street structure with a recognised metro locality
    - value: '123 Queen Street Melbourne VIC 3000'
      description: Melbourne address with state and postcode
    - value: 'Unit 4, 12 Ocean Rise, Redcliffe QLD 4020'
      description: Extended road-type ending (Rise) with full geography; the primary begins matching at the street number
    - value: 'Level 2, 7B George Street, Sydney NSW 2000'
      description: Level-prefixed address; the existing primary matches from the 7B street number without prefix grammar
    - value: 'Residential address: 15 Banksia Court, Riverbend QLD 4000'
      description: Complete address with residential context outside the street line (85 tier)
    - value: "Elector: Morgan Teston\nEnrolled address: 8 Sandpiper Court, Mackay QLD 4740"
      description: Complete address with a labelled person (85 tier)
  should_not_match:
    - value: quarterly financial report for fiscal year 2024
      description: Business text with no address elements
    - value: the meeting is scheduled for next Tuesday morning
      description: Scheduling text with no address terminology
    - value: Road to success in 2024
      description: Road used metaphorically
    - value: Ocean levels rise by 12 centimetres.
      description: Prose containing rise without number-name-roadtype address structure
false_positives:
  - description: >-
      An organisation's own office address in a letterhead or email signature is a complete Australian address with
      state and postcode, and used to reach 85 with no person present (2026-10-16 boilerplate run).
    mitigation: >-
      A complete street line now tops out at 75; 85 needs a person within the window: a labelled name field (Name:,
      Elector:, Owner:, Account holder: and similar), a date of birth, or residential/occupant wording (home or
      residential address, resident, tenant, occupant, property address). The organisation's own address at 75 is
      what the per-tenant local noise filter is for. A person named without a label (a signature block) does not count.
  - description: Street names in business names or landmarks.
    mitigation: Require structural patterns with road-type and geographic corroboration.
  - description: Navigation references mentioning road types without actual addresses.
    mitigation: Use proximity-based evidence to ensure numeric components appear alongside keywords.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
risk_rating: 3
risk_description: >-
  An Australian Street Locality Reference match is a street-address structure containing locality elements such as street type, suburb, state, or postcode. It can expose a place and may reveal a person's residence when the surrounding document supplies a name or household relationship. The atomic address does not establish who occupies the location, and many detected places are businesses, public venues, or correspondence destinations. Risk 3 and OFFICIAL reflect limited standalone location harm while recognising that protected-person or case-linked addresses need contextual escalation.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: "CUI"
  uk_gov: "OFFICIAL"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
classification:
  tier: Low
  rationale: >-
    Risk 3 maps to OFFICIAL and Low tiers because the detector returns a locality reference without assured resident
    identity or protected-location context. SENSITIVE is not met unless the address is reliably linked to a vulnerable
    person, confidential facility, or substantive private record.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      A standalone Australian street locality is generically Low with Low DLM because it names a place but ordinarily
      does not identify its occupants.
purview:
  patterns_proximity: 500
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    # The road type is always inside the IdMatch span, so it is not evidence.
    # 75 = a complete street line (state + postcode, or a metro locality);
    # 85 adds a person outside the address itself (a labelled name, date of
    # birth, or residential/occupant wording), so a bare organisation
    # letterhead address stays at 75.
    - confidence_level: 85
      local_noise_filter: true
      id_match: Pattern_street_structure
      matches:
        - ref: Evidence_state_territory
        - ref: Pattern_au_postcode
        - type: any
          min_matches: 1
          refs:
            - Evidence_person_context
            - Pattern_labelled_person
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match: Pattern_street_structure
      matches:
        - ref: Evidence_state_territory
        - ref: Pattern_au_postcode
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match: Pattern_street_structure
      matches:
        - ref: Evidence_metro_areas
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_street_structure
  regexes:
    - id: Pattern_street_structure
      pattern: \b(\d{1,5}[A-Za-z]?\s+[A-Za-z][A-Za-z\s'\-]{2,50}\s+(?:Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Place|Pl|Court|Ct|Crescent|Cres|Close|Cl|Lane|La|Way|Parade|Pde|Boulevard|Blvd|Terrace|Tce|Circuit|Cct|Highway|Hwy|Grove|Gv|Square|Sq|Esplanade|Esp|Rise|View|Gardens|Loop|Trail|Track|Pass|Heights))\b
    - id: Pattern_au_postcode
      pattern: \b(0[289]\d{2}|[1-9]\d{3})\b
    - id: Pattern_labelled_person
      pattern: >-
        (?i)\b((?:name|resident|tenant|occupant|applicant|customer|account\s+holder|elector|owner|principal|mortgagor|offender|licensee|submitter|young\s+person|child)\s*[:#-]\s*(?!(?:full|given|first|last|customer|resident|tenant|occupant|account\s+holder)\s+name\b)(?!firstname\s+lastname\b)(?!(?:john|jane)\s+doe\b)[A-Z][A-Za-z'-]{1,30}(?:\s+[A-Z][A-Za-z'-]{1,30}){1,3})\b
      description: A person-name field (label, colon, two to four name words); label set extends au-person-linked-residential-address's labelled-person regex
  keywords:
    - id: Evidence_person_context
      groups:
        - match_style: word
          terms:
            - date of birth
            - text: DOB
              case_sensitive: true
            - home address
            - residential address
            - place of residence
            - principal place of residence
            - permanent address
            - usual residential address
            - property address
            - resides at
            - residing at
            - lives at
            - resident
            - tenant
            - occupant
      strength: specific
    - id: Evidence_state_territory
      groups:
        - match_style: word
          terms:
            - text: NSW
              case_sensitive: true
            - text: VIC
              case_sensitive: true
            - text: QLD
              case_sensitive: true
            - text: SA
              case_sensitive: true
            - text: WA
              case_sensitive: true
            - text: TAS
              case_sensitive: true
            - text: NT
              case_sensitive: true
            - text: ACT
              case_sensitive: true
            - New South Wales
            - Victoria
            - Queensland
            - South Australia
            - Western Australia
            - Tasmania
            - Northern Territory
            - Australian Capital Territory
      strength: domain
    - id: Evidence_metro_areas
      groups:
        - match_style: word
          terms:
            - Sydney
            - Melbourne
            - Brisbane
            - Perth
            - Adelaide
            - Hobart
            - Darwin
            - Canberra
            - Gold Coast
            - Newcastle
            - Wollongong
            - Geelong
            - Townsville
            - Cairns
            - Toowoomba
            - Ballarat
            - Bendigo
            - Albury
            - Wodonga
            - Launceston
            - Mackay
            - Rockhampton
            - Sunshine Coast
            - Central Coast
            - Parramatta
            - Ipswich
            - Mandurah
            - Bunbury
      strength: domain
created: '2026-02-09'
updated: '2026-10-30'
changelog:
  - version: 2.8.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 2.7.0
    date: '2026-10-20'
    description: "Bare letterhead address (2026-10-16 boilerplate run): \"Riverbend Regional Council / Level 4, 120 Wattle Street, Brisbane QLD 4000\" reached 85 with no person present. Both enforcing tiers relied on Evidence_road_types, which always matches inside the IdMatch span (the street line ends in a road type) and Purview counts it, so it was never independent evidence; it is removed. 75 = street line + state + postcode (new) or street line + metro locality; 85 = street line + state + postcode + a person: new Pattern_labelled_person (a labelled name field) or new Evidence_person_context (date of birth, DOB, home/residential address, resident, tenant, occupant, property address). recommended_confidence stays 85, so a bare complete address now reports at 75 instead of 85. Added residential-context and labelled-elector should_match cases."
  - version: 2.6.0
    date: '2026-10-19'
    description: "Local noise filter: every tier above 65 opts in to the per-tenant Local Noise Exclusion dictionary (local_noise_filter: true). When the export enables it, each of those tiers gets a pattern-level TextMatchFilter (EndsWith, Exclude) reading that dictionary, so the organisation's own published values (its office street line) stop reaching 75/85 while the 65 tier still reports them. Detection logic and entity filters are unchanged, and the filter is inert until the customer adds entries."
  - version: 2.5.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 2.5.1
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth))."
  - version: 2.5.0
    date: '2026-07-18'
    description: 'Profile quality: make bare address structure discovery-only, add an exact metro-locality medium probe, and recommend the state-plus-postcode high tier.'
  - version: 2.4.0
    date: '2026-07-17'
    description: 'TP-00126 approved reduced scope: append only the eight road-type endings already declared in Evidence_road_types (Rise, View, Gardens, Loop, Trail, Track, Pass, Heights) to the terminal alternation of the primary street-structure regex (top-level and Pattern_street_structure kept in sync). Deferred per QA/independent review: full-GNAF road-type expansion (no canonical list supplied) and unit/level/shop/suite prefix grammar (unnecessary — the primary begins matching at the street number inside prefixed forms). Corrected the description to claim only the implemented road types. Added Rise/Level positives and a non-address rise prose negative.'
  - version: 2.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 601 without changing detector or package metadata.'
  - version: 2.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 2.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 2.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
