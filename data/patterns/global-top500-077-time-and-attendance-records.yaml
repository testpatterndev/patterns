schema: testpattern/v1
name: Time and attendance records
slug: global-top500-077-time-and-attendance-records
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects timesheets, time and attendance records and Queensland time and wages records for an identified employee, with shift start/finish times, ordinary or overtime hours, or pay period dates.
operation: >-
  Primary: a time-recording phrase (time and attendance, timesheet, clock in/out, attendance record/log, time and wages record, overtime record, hours worked, rostered hours, shift roster). 75 tier requires a populated person field (employee/staff name or number, payroll number, position number or title, work unit) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated time detail (a start-finish time range, ordinary/overtime/total hours value, start/finish time, or pay period / week ending date) and an independent corroborative term (penalty rate, meal break, allowance, approved by, award). All tiers exclude template/fixture text (template-exclusion); enforce tiers also exclude guidance, policy, training and media-release framing. 65 is discovery-only (primary alone) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:time\s+and\s+attendance|time\s*sheets?|clock(?:ed)?[\s-]+(?:in|on|out|off)|attendance\s+(?:record|log|register)|time\s+and\s+wages\s+record|overtime\s+record|hours\s+worked|rostered\s+hours|shift\s+roster)\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated person field and 85 adds a record-specific populated detail plus independent corroboration. Person values are customer-defined (employee IDs, position numbers), so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
  - employment
corroborative_evidence:
  keywords:
    - penalty rate
    - meal break
    - allowance
    - approved by
    - award
    - payroll
    - cost centre
    - higher duties
    - supervisor
  proximity: 300
test_cases:
  should_match:
    - value: "Timesheet - fortnight ending 20/09/2026\nEmployee name: Avery Teston\nEmployee ID: 4471820\nMon 07:00-15:30, Tue 07:00-17:45\nOrdinary hours: 76\nOvertime hours: 4.25 at penalty rate; approved by supervisor."
      description: '85: Timesheet with employee, times, hours and period'
      synthetic: true
    - value: "Time and wages record (IR Act 2016 s 339)\nEmployee: Jordan Staffson\nDesignation: Stores Officer\nWeek ending 12/09/2026\nStart time: 06:30 Finish time: 15:00\nAllowance: tool allowance paid."
      description: '85: Qld time and wages record with week ending and start/finish'
      synthetic: true
    - value: "Clock-in exceptions\nStaff number: P0048213\nMissed swipe reported for Thursday; awaiting confirmation."
      description: '75: Clock-in exception naming staff number, no times'
      synthetic: true
  should_not_match:
    - value: Employers must keep time and wages records for six years. This fact sheet explains what hours worked and overtime details must be recorded.
      description: Fact sheet - must stay below 75
    - value: "Timesheet\nEmployee name: __________\nWeek ending: ___/___/____\nStart time: __:__ Finish time: __:__"
      description: Blank timesheet - must stay below 75
    - value: Nurses logged 1.2 million hours worked in overtime last year, the union said in a media release.
      description: News / media release - must stay below 75
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: employee interview
      description: Generic word pair from old broad template should not match
false_positives:
  - description: Policies, directives, fact sheets, guidance and training material that name the record type.
    mitigation: Enforce tiers require a populated person field; guidance text has labels without values and guidance/training/media-release framing is excluded.
  - description: Blank forms, templates and HR system configuration.
    mitigation: Blank lines, square- and angle-bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person field, so these stay at 65 discovery.
  - description: Records that identify the person only in free text (no field label) fall to 65.
    mitigation: Accepted precision trade-off; extend the person-field regex with the customer employee-id format to recover recall.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_077_time_and_attendance_records_primary
      matches:
        - ref: Regex_top500_077_time_and_attendance_records_person_field
        - ref: Regex_top500_077_time_and_attendance_records_record_detail
        - ref: Keyword_top500_077_time_and_attendance_records_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_077_time_and_attendance_records_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_077_time_and_attendance_records_primary
      matches:
        - ref: Regex_top500_077_time_and_attendance_records_person_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_077_time_and_attendance_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_077_time_and_attendance_records_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_077_time_and_attendance_records_primary
      pattern: >-
        (?i)\b(?:time\s+and\s+attendance|time\s*sheets?|clock(?:ed)?[\s-]+(?:in|on|out|off)|attendance\s+(?:record|log|register)|time\s+and\s+wages\s+record|overtime\s+record|hours\s+worked|rostered\s+hours|shift\s+roster)\b
    - id: Regex_top500_077_time_and_attendance_records_person_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number|title)|work\s+unit|business\s+unit)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_077_time_and_attendance_records_record_detail
      pattern: >-
        (?i)\b(?:[01]?\d|2[0-3])[:.][0-5]\d\s*(?:am|pm)?\s*(?:-|to)\s*(?:[01]?\d|2[0-3])[:.][0-5]\d\b|\b(?:ordinary|overtime|total|actual|paid)\s+hours\s*[:\-]?\s*\d{1,3}(?:\.\d{1,2})?\b|\b(?:start|finish|in|out|on|off)\s+time\s*[:\-]\s*(?:[01]?\d|2[0-3])[:.][0-5]\d|\b(?:pay\s+period|period\s+(?:ending|end|from)|week\s+ending|fortnight\s+ending)\s*[:\-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})
  keywords:
    - id: Keyword_top500_077_time_and_attendance_records_corroborative
      groups:
        - match_style: word
          terms:
            - penalty rate
            - meal break
            - allowance
            - approved by
            - award
            - payroll
            - cost centre
            - higher duties
            - supervisor
      strength: specific
    - id: Keyword_top500_077_time_and_attendance_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
      strength: domain
risk_description: >-
  The classifier identifies a timesheet, time and wages or attendance record for an identified employee about an identified person, gated on a populated person field (75) plus a record-specific populated detail (85). Disclosure exposes an identifiable employee's working patterns and whereabouts; bulk extracts support payroll fraud or stalking. Policies, guidance, blank forms, training and news stay at 65 discovery. Risk 5 supports OFFICIAL.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: Industrial Relations Act 2016 (Qld) - ss 339-340 time and wages records
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2016-063
  - title: Fair Work Regulations 2009 (Cth) - regs 3.31-3.46 employee records and pay slips
    url: https://www.legislation.gov.au/F2009L02356/latest/text
  - title: Fair Work Ombudsman - Hours of work, breaks and rosters
    url: https://www.fairwork.gov.au/employment-conditions/hours-of-work-breaks-and-rosters
