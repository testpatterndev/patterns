references:
- url: https://help.salesforce.com/s/articleView?id=xcloud.remoteaccess_oauth_web_server_flow.htm&type=5
  title: OAuth 2.0 Web Server Flow - Salesforce Help (example token response; access_token is a 15-character 00D org ID, !, then a 96-character body)
- url: https://help.salesforce.com/s/articleView?id=xcloud.remoteaccess_oauth_refresh_token_flow.htm&type=5
  title: OAuth 2.0 Refresh Token Flow - Salesforce Help (example access_token whose prefix equals the org ID in the identity URL; the rotation example shows a refresh token that does not begin 5Aep861)
- url: https://help.salesforce.com/s/articleView?id=xcloud.remoteaccess_oauth_user_agent_flow.htm&type=5
  title: OAuth 2.0 User-Agent Flow - Salesforce Help (redirect URL example with the ! URL-encoded as %21 and a refresh_token beginning 5Aep861)
- url: https://help.salesforce.com/s/articleView?id=xcloud.remoteaccess_access_tokens.htm&type=5
  title: Access Tokens - Salesforce Help (opaque tokens are the default; JWT-based access tokens must be enabled per app)
- url: https://developer.salesforce.com/docs/atlas.en-us.222.0.api_rest.meta/api/intro_understanding_refresh_token_oauth.htm
  title: REST API Developer Guide, OAuth refresh token - Salesforce Developers (the access token acts as a session ID)
- url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/salesforce/salesforce.go
  title: TruffleHog production Salesforce access-token detector (00 + 13 alphanumerics, !, 96 characters of letters, digits, underscore and dot)
- url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/salesforcerefreshtoken/salesforcerefreshtoken.go
  title: TruffleHog production Salesforce refresh-token detector (5AEP861 followed by 80 or more characters of letters, digits, dot, underscore and =)
