schema: testpattern/v1
name: QTAC Educational Access Scheme (EAS) Application
slug: au-qtac-educational-access-scheme
version: 1.1.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  QTAC Educational Access Scheme applications and personal statements for a named applicant: disadvantage categories (personal illness or disability, English language difficulty, home environment and responsibilities, school environment, financial hardship) with supporting evidence.
operation: >-
  Primary: QTAC Educational Access Scheme (EAS) Application anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:Educational\s+Access\s+Scheme|EAS\s+(?:application|form|category|statement)|QTAC\s+application)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - education
  - health
  - pii
corroborative_evidence:
  keywords:
    - personal statement
    - school statement
    - financial hardship
    - home environment
    - responsibilities
    - personal illness or disability
    - English language difficulty
    - Centrelink
  proximity: 300
customisation:
  - key: qtac-application-number
    kind: identifier-format
    identifier: qtac-application-number
    target: purview.regexes/Regex_au_qtac_educational_access_scheme_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's QTAC application number format (see docs/identifiers.md#qtac-application-number). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Educational Access Scheme (EAS) Form — Home Environment & Responsibilities\nApplicant name: Morgan Teston\nQTAC application number: 2641187\nDate of birth: 14/03/2008\nStatement: I care for my younger siblings full-time while my mother receives treatment for breast cancer."
      description: Populated record 1
      synthetic: true
    - value: "EAS application — financial hardship\nApplicant: Jamie Teston\nQTAC application number: 2649921\nEvidence: Centrelink Youth Allowance (independent) since 2025; homeless for 3 months."
      description: Populated record 2
      synthetic: true
    - value: "Educational Access Scheme (EAS) Form Personal Illness or Disability — personal statement\nApplicant name: Riley Teston\nDate of birth: 02/02/2008\nDiagnosis: chronic kidney disease; missed 40% of Year 12 for dialysis."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: The Educational Access Scheme (EAS) helps applicants whose studies were affected by disadvantage. Apply through QTAC with a personal statement and supporting documents.
      description: Guidance or explainer text
    - value: "EAS form\nApplicant name: __________\nQTAC application number: __________\nCategory: __________"
      description: Blank form
    - value: QTAC received 18,900 EAS applications for 2026 entry, up 6% on the previous year.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qtac_educational_access_scheme_primary
      matches:
        - ref: Regex_au_qtac_educational_access_scheme_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qtac_educational_access_scheme_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qtac_educational_access_scheme_primary
      matches:
        - ref: Regex_au_qtac_educational_access_scheme_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qtac_educational_access_scheme_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qtac_educational_access_scheme_primary
      pattern: >-
        (?i)\b(?:Educational\s+Access\s+Scheme|EAS\s+(?:application|form|category|statement)|QTAC\s+application)\b
    - id: Regex_au_qtac_educational_access_scheme_record_structure
      pattern: >-
        (?i)\b(?:applicant(?:\s+name)?|QTAC\s+application\s+(?:no\.?|number)|application\s+(?:no\.?|number)|student\s+name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|school|year\s+of\s+completion|LUI)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qtac_educational_access_scheme_corroborative
      groups:
        - match_style: word
          terms:
            - personal statement
            - school statement
            - financial hardship
            - home environment
            - responsibilities
            - personal illness or disability
            - English language difficulty
            - Centrelink
            - carer
            - text: ATAR
              case_sensitive: true
            - adjustment factors
            - text: QTAC
              case_sensitive: true
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a qtac educational access scheme (eas) application about an identified person, gated on populated record fields. QTAC Educational Access Scheme applications and personal statements for a named applicant: disadvantage categories (personal illness or disability, English language difficulty, home environment and responsibilities, school environment, financial hardship) with supporting evidence. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: QTAC — Educational Access Scheme (anchor confirmed from official-domain search results; page fetch blocked)
    url: https://www.qtac.edu.au/eas/
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.1.0
    date: '2026-09-24'
    description: Declare identifier-format customisation slots (qtac-application-number) replacing the interim identifier_dependencies metadata; definitions and replacement steps live in data/identifiers/ and docs/identifiers.md.
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
