schema: testpattern/v1
name: Domestic and Family Violence Criminal Offence Record
slug: au-dfv-criminal-offence-record
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects charge sheets, court briefs, court lists, criminal histories and corrections records for
  domestic and family violence offences against an identified person: Queensland coercive control
  (Criminal Code s334C, from 26 May 2025) and engaging in domestic violence to aid a respondent
  (s179A); NSW abusive behaviour towards current or former intimate partners (Crimes Act s54D, from
  1 July 2024); Tasmanian persistent family violence (Criminal Code s170A), economic abuse and
  emotional abuse or intimidation (Family Violence Act 2004 ss8-9); SA coercive control (Criminal Law
  Consolidation Act s20C, not yet proclaimed); contraventions of protection, intervention and
  restraining orders in every jurisdiction; and "domestic violence offence" notations (Qld Criminal
  Code s1 and Penalties and Sentences Act s12A; NSW Crimes (Domestic and Personal Violence) Act s12).
operation: >-
  Primary: any of two regexes — a DFV offence title or notation (abusive behaviour towards intimate
  partner, persistent family violence, emotional abuse or intimidation, engaging in domestic violence
  to aid a respondent, domestic violence offence / relevant domestic violence offence / recorded as a
  domestic violence offence, contravention or breach of a DV order, notice, direction, intervention
  or restraining order), or a section-anchored coercive control reference (coercive control with
  s334C or s20C; s54D with Crimes Act; s170A with Criminal Code; economic abuse with Family Violence
  Act). Bare "coercive control" is never a primary. 75 tier requires a populated accused/defendant/
  offender/respondent name field within 300 characters. 85 tier additionally requires a populated
  charge-record field (charge, offence, count, plea, court date, date of offence, outcome, sentence,
  QPRIME QP + 10 digits, NSW H number, QP9 or Court Attendance Notice reference). All tiers exclude
  template/fixture text. 65 is discovery-only.
pattern: >-
  (?i)\b(?:abusive\s+behaviour\s+towards\s+(?:(?:a\s+)?current\s+or\s+former\s+)?intimate\s+partners?|persistent\s+family\s+violence|emotional\s+abuse\s+or\s+intimidation|engag(?:e|ed|ing)\s+in\s+domestic\s+violence\s+to\s+aid\s+(?:a\s+)?respondent|(?:relevant\s+)?domestic\s+violence\s+offences?|recorded\s+as\s+a\s+domestic\s+violence\s+offence|contraven(?:e|ed|ing|tion\s+of)\s+(?:a\s+|an\s+)?(?:domestic\s+violence\s+order|(?:provisional\s+)?apprehended\s+(?:domestic\s+)?violence\s+order|(?:temporary\s+)?protection\s+order|police\s+protection\s+(?:notice|direction)|(?:family\s+violence\s+)?intervention\s+order|family\s+violence\s+(?:restraining\s+order|safety\s+notice|order)|police\s+family\s+violence\s+order)|breach(?:ed)?\s+(?:of\s+)?(?:a\s+|an\s+)?(?:family\s+violence\s+)?intervention\s+order)\b|\bcoercive\s+control[^\n]{0,40}\b(?:s\.?\s{0,2}|section\s+)(?:334C|20C)\b|\b(?:s\.?\s{0,2}|section\s+)(?:334C|20C)\b[^\n]{0,40}coercive\s+control\b
confidence: medium
confidence_justification: >-
  Medium: offence titles and DV notations are distinctive but also appear in legislation, sentencing
  guides, police annual reports and media. Enforce tiers require a populated accused/defendant name;
  85 adds a populated charge-record field. Section numbers are only used when paired with the offence
  name or Act, because 54D, 170A and 20C collide with other statutes. 85/75 are heuristic evidence
  tiers, not measured accuracy.
jurisdictions:
  - au
regulations:
  - Criminal Code Act 1899 (Qld)
  - Penalties and Sentences Act 1992 (Qld)
  - DFV Protection Act 2012 (Qld)
  - Crimes Act 1900 (NSW)
  - Crimes (Domestic and Personal Violence) Act 2007 (NSW)
  - Criminal Code Act 1924 (Tas)
  - Family Violence Act 2004 (Tas)
  - Criminal Law Consolidation Act 1935 (SA)
  - Family Violence Protection Act 2008 (Vic)
  - Privacy Act 1988 (Cth)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - legal
  - pii
corroborative_evidence:
  keywords:
    - charge
    - offence
    - defendant
    - accused
    - plea
    - court date
    - criminal history
    - QP9
    - Court Attendance Notice
  proximity: 300
  keyword_lists:
    - au-dfv-terminology
test_cases:
  should_match:
    - value: "QP9 Court Brief\nQPRIME: QP2600517734\nDefendant: Jordan Teston\nCharge: Coercive control - Criminal Code s334C\nDate of offence: between 01/06/2025 and 14/03/2026\nCourt date: 02/10/2026 Brisbane Magistrates Court"
      description: Queensland court brief for a coercive control charge
      synthetic: true
    - value: "Court Attendance Notice H76187560\nAccused: Riley Teston\nOffence: Abusive behaviour towards current or former intimate partners (Crimes Act 1900 s54D)\nPlea: Not guilty"
      description: NSW court attendance notice for s54D
      synthetic: true
    - value: "Criminal history - Offender: Casey Teston\nOffence: Contravention of domestic violence order (aggravated) - relevant domestic violence offence\nOutcome: Convicted, 12 months probation"
      description: Criminal history entry with DV notation
      synthetic: true
    - value: "Defendant: Alex Teston\nCharge: Persistent family violence, Criminal Code s170A (Tas)\nCount 2: Emotional abuse or intimidation, Family Violence Act 2004 s9"
      description: Tasmanian persistent family violence charges
      synthetic: true
  should_not_match:
    - value: Queensland's coercive control offence, section 334C of the Criminal Code, commenced on 26 May 2025 and carries a maximum penalty of 14 years imprisonment.
      description: Legislation commentary
    - value: Police recorded 41,200 contraventions of domestic violence orders in 2025, and courts finalised 2,300 charges of abusive behaviour towards intimate partners.
      description: Aggregate statistics
    - value: "Charge sheet\nDefendant: __________\nOffence: __________\nIs this a domestic violence offence?  [ ] Yes  [ ] No"
      description: Blank charge sheet
    - value: Coercive control is a pattern of behaviour that isolates and controls a partner. If you need support, call 1800RESPECT.
      description: Awareness text with bare coercive control
false_positives:
  - description: Legislation, bench books, sentencing guides and commentary describing the offences.
    mitigation: Enforce tiers require a populated accused/defendant/offender name field.
  - description: Media reports naming a charged person.
    mitigation: Names in running prose are not labelled fields, so reports fall to discovery; court lists with labelled fields are genuine records.
  - description: Section numbers shared with other statutes (54D, 170A, 20C).
    mitigation: Section numbers only match when paired with the offence name or Act.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match:
        type: any
        ids:
          - Regex_dfv_offence_title
          - Regex_dfv_offence_section
      matches:
        - ref: Regex_dfv_accused_field
        - ref: Regex_dfv_charge_record_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match:
        type: any
        ids:
          - Regex_dfv_offence_title
          - Regex_dfv_offence_section
      matches:
        - ref: Regex_dfv_accused_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match:
        type: any
        ids:
          - Regex_dfv_offence_title
          - Regex_dfv_offence_section
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_dfv_offence_title
      pattern: >-
        (?i)\b(?:abusive\s+behaviour\s+towards\s+(?:(?:a\s+)?current\s+or\s+former\s+)?intimate\s+partners?|persistent\s+family\s+violence|emotional\s+abuse\s+or\s+intimidation|engag(?:e|ed|ing)\s+in\s+domestic\s+violence\s+to\s+aid\s+(?:a\s+)?respondent|(?:relevant\s+)?domestic\s+violence\s+offences?|recorded\s+as\s+a\s+domestic\s+violence\s+offence|contraven(?:e|ed|ing|tion\s+of)\s+(?:a\s+|an\s+)?(?:domestic\s+violence\s+order|(?:provisional\s+)?apprehended\s+(?:domestic\s+)?violence\s+order|(?:temporary\s+)?protection\s+order|police\s+protection\s+(?:notice|direction)|(?:family\s+violence\s+)?intervention\s+order|family\s+violence\s+(?:restraining\s+order|safety\s+notice|order)|police\s+family\s+violence\s+order)|breach(?:ed)?\s+(?:of\s+)?(?:a\s+|an\s+)?(?:family\s+violence\s+)?intervention\s+order)\b
    - id: Regex_dfv_offence_section
      pattern: >-
        (?i)\bcoercive\s+control[^\n]{0,40}\b(?:s\.?\s{0,2}|section\s+)(?:334C|20C)\b|\b(?:s\.?\s{0,2}|section\s+)(?:334C|20C)\b[^\n]{0,40}coercive\s+control\b|\b(?:s\.?\s{0,2}|section\s+)54D\b[^\n]{0,20}Crimes\s+Act|\bCrimes\s+Act[^\n]{0,20}\b(?:s\.?\s{0,2}|section\s+)54D\b|\b(?:s\.?\s{0,2}|section\s+)170A\b[^\n]{0,20}Criminal\s+Code|\beconomic\s+abuse[^\n]{0,40}Family\s+Violence\s+Act
    - id: Regex_dfv_accused_field
      pattern: >-
        (?i)\b(?:defendant|accused|offender|respondent|person\s+charged|charged\s+person|person\s+of\s+interest|subject)(?:\s+(?:name|details))?\s*:\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){1,3}
    - id: Regex_dfv_charge_record_field
      pattern: >-
        (?i)\bQP\d{10}\b|\bH\d{7,9}\b|\bQP9\b|\bCourt\s+Attendance\s+Notice\b|\b(?:charge|offence|count\s+\d{1,2}|plea|court\s+date|date\s+of\s+offence|outcome|sentence|result)\s*(?:no\.?|number|details|description)?\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<)[A-Za-z0-9]
risk_rating: 8
risk_description: >-
  The detector identifies a charge, court or criminal-history record that ties a named person to a
  domestic and family violence offence, contravention of a protection order, or a domestic violence
  offence notation. These records identify both the accused and, by implication, the victim-survivor,
  and disclose untested allegations before trial; criminal-history DV notations follow a person into
  employment and licensing checks. Unauthorised disclosure can prejudice proceedings and expose the
  victim-survivor. Legislation commentary, statistics, awareness text and blank forms are excluded from
  enforce tiers. Risk 8 supports SENSITIVE Law-Enforcement.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Law-Enforcement
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: Criminal Law (Coercive Control and Affirmative Consent) and Other Legislation Amendment Act 2024 (Qld)
    url: https://www.legislation.qld.gov.au/view/whole/html/asmade/act-2024-005
  - title: NSW Criminal Trial Courts Bench Book — Abusive behaviour towards intimate partners
    url: https://www.judcom.nsw.gov.au/publications/benchbks/criminal/abusive_behaviour_towards_intimate_partners.html
  - title: Family Violence Act 2004 (Tas)
    url: https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-2004-067
  - title: Queensland Police Service — Court brief (QP9)
    url: https://www.police.qld.gov.au/documents-for-purchase/court-brief-qp9
