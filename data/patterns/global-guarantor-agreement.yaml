schema: testpattern/v1
name: Guarantor Agreement
slug: global-guarantor-agreement
version: 1.5.0
type: keyword_proximity
pattern_class: concept
description: >-
  Detects populated guarantee and indemnity instruments (personal/corporate/continuing guarantees, deeds of guarantee, guarantor agreements) that name the guarantor or borrower, state a guaranteed amount or limit, or carry an ABN/ACN. Phrase-only mentions stay discovery-only.
operation: >-
  Pattern type: keyword proximity evaluated through purview tiers. Primary: personal/corporate/unlimited/limited/continuing guarantee, guarantee agreement/deed, deed of guarantee, guarantor agreement/undertaking. 65 (discovery only): primary alone. 75: primary plus one populated field - named guarantor/borrower/debtor/lender/creditor, guaranteed amount/guarantee limit/limit of liability/loan amount with a dollar value (ranges excluded), or an ABN/ACN. 85: primary plus two distinct field types (the three above or a labelled deed/execution date) plus guarantee-obligation evidence (indemnity, joint and several, secured obligations, payment on demand, continuing security, independent legal advice, principal debtor). Template/sample and guidance/marketing framing excluded on every enforce tier.
confidence: medium
confidence_justification: >-
  Enforce tiers require populated party, amount or company-number fields beside the guarantee phrase; product guarantees, marketing and consumer guidance stay at 65. Medium because credit-application correspondence can carry the same fields.
jurisdictions:
  - global
regulations:
  - National Consumer Credit Protection Act 2009 (Cth)
  - AML/CTF Act (Cth)
  - IPA 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
frameworks:
  - ISO 27001
  - ISO 27701
  - PCI-DSS
  - SOC 2
data_categories:
  - legal
  - financial
  - pii
test_cases:
  should_match:
    - value: "DEED OF GUARANTEE AND INDEMNITY\nGuarantor: Morgan Teston\nBorrower: Teston Holdings Pty Ltd ACN 612 004 471\nLender: Harbourside Credit Union Ltd\nGuarantee limit: $250,000.00\nThe guarantor is liable as principal debtor; liability is joint and several and independent legal advice was obtained."
      description: Populated deed - parties, ACN, limit and obligation terms (85)
      synthetic: true
    - value: "Personal guarantee\nGuarantor: Jordan Whitlock\nSigned at Brisbane on 12/08/2026."
      description: Guarantee with a single populated guarantor field (75)
      synthetic: true
  should_not_match:
    - value: "Fact sheet: before you sign a personal guarantee, understand that the guarantor may have to repay the loan amount and interest if the borrower defaults. Get independent legal advice."
      description: Consumer fact sheet naming terms without values
      synthetic: true
    - value: "DEED OF GUARANTEE\nGuarantor: __________\nBorrower: __________\nGuarantee limit: $__________"
      description: Blank deed - placeholder values
      synthetic: true
    - value: "Directors of the collapsed builder had signed a personal guarantee over $12 million of debt, the liquidator told the court on Monday."
      description: News item without populated fields
      synthetic: true
    - value: "Money-back guarantee on all products"
      description: Product guarantee
      synthetic: true
    - value: "We guarantee quality service"
      description: Marketing guarantee
      synthetic: true
    - value: "Corporate guarantee marketing brochure"
      description: Marketing brochure
      synthetic: true
false_positives:
  - description: Product guarantees, warranties and marketing promises.
    mitigation: The primary requires guarantee-instrument phrasing and marketing framing is excluded.
  - description: Consumer guidance about the risks of acting as guarantor.
    mitigation: No populated party, amount or company number, so it stays at 65.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  This concept classifier identifies guarantor agreements and deeds containing a named guarantor, personal guarantee, indemnity, joint liability, secured obligation, and continuing or unlimited exposure. Disclosure can reveal an individual's contingent debts, assets at risk, relationships, and negotiation pressure points, enabling fraud, coercion, or targeted financial exploitation. The guarantor, borrower, lender, and related household may face serious personal, legal, and financial harm within one facility, while enforcement still requires a valid underlying obligation and legal process. Risk 8 and SENSITIVE Legal fit that composite commitment, while a broad portfolio of guarantees or privileged lending-system access would be needed for PROTECTED. Quality pass 2026-09-24: enforce tiers (75/85) now require populated record structure (labelled fields with real values, identifiers or data rows); phrase-only mentions in guidance, marketing, blank forms and news stay at 65 discovery.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Legal
  us_gov: "CUI"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_guarantee
      matches:
        - type: any
          min_matches: 2
          refs:
            - Regex_global_guarantor_agreement_party
            - Regex_global_guarantor_agreement_amount
            - Regex_global_guarantor_agreement_company_number
            - Regex_global_guarantor_agreement_date
        - ref: Keyword_guarantee_obligations
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_guarantor_agreement_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_guarantee
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_global_guarantor_agreement_party
            - Regex_global_guarantor_agreement_amount
            - Regex_global_guarantor_agreement_company_number
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_guarantor_agreement_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_guarantee
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_guarantee
      pattern: (?i)\b(?:(?:personal|corporate|unlimited|limited|continuing)\s+guarantee|guarantee\s+(?:agreement|deed)|deed\s+of\s+guarantee|guarantor\s+(?:agreement|undertaking))\b
    - id: Regex_global_guarantor_agreement_party
      pattern: (?i)\b(?:guarantors?(?:\s+\d)?|borrowers?|debtors?|principal\s+debtor|lenders?|creditors?|beneficiary|obligor)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#][ \t]{0,5}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:means|refers?|includes?|is|are|was|has|have|must|should|will|may|can|to|of|for|and|or|if|in|on|as|by|this|that|your|our|their|his|her|its)\b)(?:(?:Mr|Mrs|Ms|Mx|Dr|Prof)\.?[ \t]{1,3})?[A-Z][A-Za-z'.-]{1,30}(?:[ \t]{1,3}[A-Z&][A-Za-z'.&-]{0,30}){0,5}
    - id: Regex_global_guarantor_agreement_amount
      pattern: (?i)\b(?:guaranteed\s+amount|guarantee\s+limit|limit\s+of\s+liability|maximum\s+(?:liability|amount)|loan\s+amount|facility\s+limit|principal(?:\s+amount)?)[ \t]{0,3}[:#][ \t]{0,3}(?:AUD|USD|NZD|GBP|EUR|A\$|US\$|NZ\$|\$|£|€)[ \t]?(?:\d{1,3}(?:,\d{3}){1,4}|\d{1,12})(?:\.\d{2})?(?![\d,]\d)(?!\.\d)(?![ \t]{0,3}(?:-|–|to)[ \t]{0,3}(?:A?\$|\d))
    - id: Regex_global_guarantor_agreement_company_number
      pattern: (?i)\b(?:ABN|ACN)[ \t]{0,3}[:#]?[ \t]{0,3}\d{2,3}[ \t]?\d{3}[ \t]?\d{3}(?:[ \t]?\d{3})?\b
    - id: Regex_global_guarantor_agreement_date
      pattern: (?i)\b(?:date\s+of\s+(?:this\s+)?(?:deed|guarantee|agreement)|execution\s+date|facility\s+agreement\s+dated|dated)[ \t]{0,3}[:#]?[ \t]{0,3}(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}[ \t]{1,3}(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}[ \t]{1,3}\d{4})
  keywords:
    - id: Keyword_guarantee_obligations
      groups:
        - match_style: word
          terms:
            - indemnity
            - joint and several
            - guarantor liability
            - secured obligations
            - payment on demand
            - continuing security
            - independent legal advice
            - guaranteed money
            - release of guarantor
            - principal debtor
      strength: domain
    - id: Keyword_global_guarantor_agreement_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - policy guidance
            - guidance note
            - this guideline
            - this procedure
            - fact sheet
            - training module
            - e-learning
            - course notes
            - media release
            - press release
            - news report
            - frequently asked questions
            - best practice guide
            - white paper
            - whitepaper
            - webinar
            - how-to guide
            - user guide
            - help centre article
            - help center article
            - money-back guarantee
            - satisfaction guarantee
            - we guarantee
            - marketing brochure
            - product warranty
      strength: noise
created: '2026-02-09'
updated: '2026-09-24'
changelog:
  - version: 1.5.0
    date: '2026-09-24'
    description: >-
      Quality pass (2026-09-24): 75 and 85 were phrase-only keyword tiers; 75 now needs a populated guarantor/borrower/lender, guaranteed amount or ABN/ACN field and 85 needs two distinct field types plus guarantee-obligation evidence; replaced the bare-phrase positives; added fact-sheet, blank-form and news decoys; dropped SOCI Act, added NCCP Act 2009 (Cth) with a verified reference.
  - version: 1.4.2
    date: '2026-07-19'
    description: 'Targeted finance/health blocker remediation: align the evidence-gated detector to keyword_proximity, make guarantee-instrument phrases 65 discovery, require substantive indemnity/liability terms at 75 and underlying loan terms at 85, broaden deed/continuing-guarantee coverage, and add exact-tier plus brochure probes.'
  - version: 1.4.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 545 without changing detector or package metadata.'
  - version: 1.4.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.2.0
    date: '2026-07-04'
    description: Replace bare generic keyword terms with domain-anchored phrases (FP reduction)
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 95 to 85.; Collapsed 2 duplicate 85-confidence tier(s) into the strictest canonical tier.
