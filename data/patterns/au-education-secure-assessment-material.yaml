{
  "schema": "testpattern/v1",
  "name": "Unreleased Education Assessment and Marking Material",
  "slug": "au-education-secure-assessment-material",
  "version": "1.0.0",
  "type": "regex",
  "pattern_class": "concept",
  "description": "Detects populated unreleased education assessment and marking material using record context and corroborating fields.",
  "pattern": "(?i)(?:examination paper|assessment paper|marking guide|marking scheme|assessment moderation|secure assessment)",
  "operation": "Record context plus populated fields within 1000 characters. No discovery-only tier.",
  "confidence": "medium",
  "confidence_justification": "85 is a heuristic evidence tier, not measured accuracy. Synthetic example checks do not establish tenant detection accuracy.",
  "jurisdictions": [
    "au"
  ],
  "regulations": [],
  "frameworks": [],
  "data_categories": [
    "education",
    "pii"
  ],
  "scope": "narrow",
  "risk_rating": 7,
  "risk_description": "A populated unreleased education assessment and marking material can expose confidential education information. Classification is a package mapping, not a determination of every document's risk.",
  "references": [
    {
      "title": "Record context; synthetic examples are not captured official forms",
      "url": "https://www.qcaa.qld.edu.au/senior/certificates-and-qualifications/qce-qcia-handbook/8-school-assessment-policies/8.3-developing-school-assessment-policy"
    }
  ],
  "sensitivity_labels": {
    "pspf": "OFFICIAL: Sensitive",
    "qgiscf": "SENSITIVE",
    "qgiscf_dlm": "SENSITIVE"
  },
  "package_tags": {
    "primary_component": "student-child-records",
    "components": [
      "student-child-records"
    ],
    "component_tier": "large",
    "deployment_priority": [
      "expanded"
    ],
    "sectors": [
      "education"
    ],
    "addons": [],
    "label_domains": [
      "education",
      "business"
    ]
  },
  "purview": {
    "patterns_proximity": 1000,
    "recommended_confidence": 85,
    "pattern_tiers": [
      {
        "confidence_level": 85,
        "id_match": "Regex_0",
        "matches": [
          {
            "ref": "Regex_1"
          },
          {
            "ref": "Regex_2"
          },
          {
            "ref": "Regex_3"
          },
          {
            "type": "any",
            "min_matches": 0,
            "max_matches": 0,
            "refs": [
              "Regex_released"
            ]
          }
        ]
      }
    ],
    "regexes": [
      {
        "id": "Regex_0",
        "pattern": "(?i)(?:examination paper|assessment paper|marking guide|marking scheme|assessment moderation|secure assessment)"
      },
      {
        "id": "Regex_1",
        "pattern": "(?i)(?:not for student distribution|unreleased assessment|secure assessment|confidential examination|staff only[^\\r\\n]{0,30}assessment)"
      },
      {
        "id": "Regex_2",
        "pattern": "(?i)(?:question[ \\t]+[1-9]\\d*[ \\t]*[:.)][ \\t]*[A-Z0-9][^\\r\\n]{8,160}|marking allocation[ \\t]*:[ \\t]*[1-9]\\d*[ \\t]+marks?)"
      },
      {
        "id": "Regex_3",
        "pattern": "(?i)(?:subject|course|year level|assessment date)[ \\t]*:[ \\t]*[A-Z0-9][A-Z0-9 /.-]{2,80}"
      },
      {
        "id": "Regex_released",
        "pattern": "(?i)\\b(?:published past paper|publicly released assessment|practice paper|specimen paper)\\b"
      }
    ]
  },
  "test_cases": {
    "should_match": [
      {
        "value": "Examination paper\nSubject: Year 10 Mathematics\nNot for student distribution\nAssessment date: 2026-10-12\nQuestion 1: Solve 3x + 5 = 20\nMarking allocation: 2 marks",
        "description": "Synthetic populated record variant 1",
        "synthetic": true
      },
      {
        "value": "Assessment moderation marking guide\nUnreleased assessment\nCourse: Senior Chemistry\nQuestion 2: Explain the reaction shown in the diagram\nMarking allocation: 4 marks",
        "description": "Synthetic populated record variant 2",
        "synthetic": true
      },
      {
        "value": "Examination paper\nSubject: Year 10 Mathematics\nNot for student distribution\nAssessment date: 2026-10-12\nQuestion 1: Solve 3x + 5 = 20\nMarking allocation: 2 marks\nForm template version 2.1. Retain the completed record.",
        "description": "Synthetic populated record variant 3",
        "synthetic": true
      },
      {
        "value": "Assessment moderation marking guide\nUnreleased assessment\nCourse: Senior Chemistry\nQuestion 2: Explain the reaction shown in the diagram\nMarking allocation: 4 marks",
        "description": "Synthetic populated record variant 4",
        "synthetic": true
      }
    ],
    "should_not_match": [
      {
        "value": "Published past paper\nExamination paper\nSubject: Year 10 Mathematics\nQuestion 1: Solve 3x + 5 = 20\nMarking allocation: 2 marks",
        "description": "Synthetic public, blank, distant or unrelated counterexample 1",
        "synthetic": true
      },
      {
        "value": "Examination paper\nSubject: __________\nNot for student distribution\nAssessment date: __________\nQuestion 1: __________\nMarking allocation: __________",
        "description": "Synthetic public, blank, distant or unrelated counterexample 2",
        "synthetic": true
      },
      {
        "value": "Published past paper\nExamination paper\nSubject: Year 10 Mathematics\nNot for student distribution\nAssessment date: 2026-10-12\nQuestion 1: Solve 3x + 5 = 20\nMarking allocation: 2 marks",
        "description": "Synthetic public, blank, distant or unrelated counterexample 4",
        "synthetic": true
      }
    ]
  },
  "exports": [
    "yaml",
    "purview"
  ],
