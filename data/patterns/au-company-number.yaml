schema: testpattern/v1
name: Australian Company Number
slug: au-company-number
version: 1.5.0
type: regex
pattern_class: identifier
engine: universal
description: >-
  Detects nine-digit Australian Company Numbers (ACNs), issued by ASIC to every registered company and printed on
  company documents, contracts, invoices and ASIC extracts. Grouped (3-3-3) and continuous forms are matched, and
  company-number context lifts a match to 75 or 85. TestPattern's own detection logic: the Microsoft Purview built-in
  Australian Company Number is catalogued separately as au-company-number-builtin.
operation: >-
  Checksum: Modified Mod 10 with weights [8,7,6,5,4,3,2,1] (not enforced in the exported SIT — Purview has no usable ACN validator function; structural detection only). Reference:
  https://asic.gov.au/for-business/registering-a-company/steps-to-register-a-company/australian-company-numbers/australian-company-number-digit-check/,
  https://clearwater.com.au/code/acn/
  Corroborative evidence: 4 keywords within 300 characters. Keyword lists: au-identity-acn.
pattern: \b\d{3}\s?\d{3}\s?\d{3}\b
confidence: medium
confidence_justification: >-
  Medium confidence: validated with Modified Mod 10 with weights [8,7,6,5,4,3,2,1] and supported by corroborative keyword
  evidence.
jurisdictions:
  - au
regulations:
- Anti-Money Laundering and Counter-Terrorism Financing Act 2006 (Cth)
- NDB Scheme (Cth)
- Privacy Act 1988 (Cth)
frameworks:
- ISO 27001
data_categories:
  - pii
  - government-id
corroborative_evidence:
  keywords:
    - ACN
    - australian company number
    - company number
    - ASIC
  proximity: 300
  keyword_lists:

    - au-identity-acn
test_cases:
  should_match:
    - value: 123 456 789
      description: Standard spaced format (3-3-3)
    - value: '123456789'
      description: Continuous digits
    - value: 004 085 616
      description: Real ACN format
    - value: 'Supplier details - ACN: 004 085 616'
      description: Labelled ACN on a supplier record (specific keyword, 85 tier)
    - value: 'Company extract for the registered entity, number 004 085 616'
      description: Company-registration context without the ACN label (broad keywords, 75 tier)
  should_not_match:
    - value: '12345678'
      description: Only 8 digits
    - value: '1234567890'
      description: 10 digits, exceeds ACN length
false_positives:
  - description: >-
      Common words and phrases related to australian company number appearing in policy documents, training materials,
      HR templates, or compliance guidelines without actual personal data.
    mitigation: >-
      Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than
      general discussion.
  - description: >-
      In Australian English, similar terminology used in formal or administrative contexts (education, professional
      documentation) that does not constitute sensitive data collection.
    mitigation: >-
      Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
      to distinguish sensitive records from general references.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      local_noise_filter: true
      id_match: Regex_au_acn
      matches:
        - ref: Keyword_au_acn_specific
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      local_noise_filter: true
      id_match: Regex_au_acn
      matches:
        - ref: Keyword_au_acn_broad
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_acn
  regexes:
    - id: Regex_au_acn
      pattern: \b\d{3}\s?\d{3}\s?\d{3}\b
  keywords:
    - id: Keyword_au_acn_specific
      groups:
        - match_style: word
          terms:
            - text: ACN
              case_sensitive: true
            - A.C.N.
            - australian company number
            - company number
            - ASIC
            - Australian Securities and Investments Commission
            - company registration number
            - registered company
      strength: specific
    - id: Keyword_au_acn_broad
      groups:
        - match_style: word
          terms:
            - company registration
            - business entity
            - corporation number
            - registered entity
            - corporate identifier
            - company details
            - ABN/ACN
            - company extract
            - ASIC search
      strength: specific
  filters:
    - id: Filter_au_acn_same_digits
      type: AllDigitsSameFilter
risk_rating: 5
risk_description: >-
  The detector finds a nine-digit Australian Company Number in grouped or continuous form with company-number context. An ACN is a public corporate identifier displayed on ASIC records and company documents, not a secret, filing credential, or authority to act for the company. False filings or corporate impersonation require identity evidence, account access, and other controls, so the company faces bounded harm from the atomic number alone. Risk 5 and OFFICIAL fit that correlation value, while combination with private director, banking, or authentication data would raise the context toward SENSITIVE.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: "CUI"
  uk_gov: "OFFICIAL"
  nz_gov: "IN-CONFIDENCE"
  ca_gov: "Protected A"
classification:
  tier: Low
  rationale: >-
    Risk 5 aligns with QGISCF OFFICIAL, PSPF OFFICIAL, DLM OFFICIAL, OFFI, and Low because the ACN is public and
    materially harmful use requires additional identity and access evidence. SENSITIVE is not met by the company number
    alone.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low generic handling is appropriate for a public corporate identifier with modest correlation and impersonation
      value. The inherited High generic fields contradicted the accepted OFFICIAL and Low assessment and are normalised.
references:
  - url: https://asic.gov.au/for-business/registering-a-company/steps-to-register-a-company/australian-company-numbers/australian-company-number-digit-check/
    title: "Australian Company Number digit check - ASIC"
created: '2026-02-08'
updated: '2026-10-20'
changelog:
  - version: 1.5.0
    date: '2026-10-20'
    description: >-
      Custom SIT again, as the owner originally decided: source changes from microsoft to testpattern-community, so
      packages emit these tiers, noise filters and local noise filter as custom XML instead of referencing the Microsoft
      built-in by GUID (which meant this logic never ran). The Microsoft entity is catalogued separately as
      au-company-number-builtin. The description no longer calls this a copy of the built-in, and the reference now
      points at ASIC rather than the Microsoft ABN page. Detection logic is unchanged; two labelled should_match
      cases now exercise the 85 and 75 tiers.
  - version: 1.4.0
    date: '2026-10-19'
    description: "Local noise filter: every tier above 65 opts in to the per-tenant Local Noise Exclusion dictionary (local_noise_filter: true). When the export enables it, each of those tiers gets a pattern-level TextMatchFilter (EndsWith, Exclude) reading that dictionary, so the organisation's own published values (its own ABN, ACN, VAT or registration number as printed on letterhead and invoices) stop reaching 75/85 while the 65 tier still reports them. Detection logic and entity filters are unchanged, and the filter is inert until the customer adds entries."
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-07-18'
    description: >-
      Quality bar: confidence high->medium for digit/identifier shapes where structural FP risk makes 'high' dishonest without checksum/strong label evidence.
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 531 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: identifier — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'Noise-gate sweep: wire the declared template-exclusion noise dictionary (Keyword_noise_exclusion) into the NOT-group of every evidence-bearing tier — the dictionary was declared in shared_keywords but no tier referenced it (dead noise gate); dictionary terms verified collision-free against this pattern''s should_match values and specific/domain vocabulary'
  - version: 1.1.0
    date: '2026-07-04'
    description: case/evidence metadata update
