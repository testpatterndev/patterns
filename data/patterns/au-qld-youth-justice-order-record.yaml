schema: testpattern/v1
name: Queensland Youth Justice Order or Detention Record
slug: au-qld-youth-justice-order-record
version: 1.1.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Youth justice orders and detention records for a named young person under the Youth Justice Act 1992: detention and conditional release orders, restorative justice orders and agreements, and youth detention centre records (Brisbane Youth Detention Centre, Cleveland Youth Detention Centre, Wacol Youth Remand Facility).
operation: >-
  Primary: Queensland Youth Justice Order or Detention Record anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:Youth\s+Justice\s+Act\s+1992|conditional\s+release\s+order|restorative\s+justice\s+(?:order|agreement|conference)|detention\s+order|(?:Brisbane|Cleveland)\s+Youth\s+Detention\s+Centre|Wacol\s+Youth\s+Remand\s+Facility|youth\s+detention\s+centre)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Youth Justice Act 1992 (Qld)
frameworks:
  - QGISCF
data_categories:
  - law-enforcement
  - pii
corroborative_evidence:
  keywords:
    - young person
    - child
    - youth justice
    - Childrens Court
    - bail
    - supervised release
    - caseworker
    - program
  proximity: 300
customisation:
  - key: youth-justice-reference
    kind: identifier-format
    identifier: youth-justice-reference
    target: purview.regexes/Regex_au_qld_youth_justice_order_record_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Queensland youth justice client / case reference format (see docs/identifiers.md#youth-justice-reference). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Conditional release order\nYoung person: Riley Teston\nDate of birth: 02/02/2011\nChildrens Court of Queensland, Townsville\nThe young person must attend the intensive program 5 days a week for 3 months (s220 Youth Justice Act 1992)."
      description: Populated record 1
      synthetic: true
    - value: "Admission — Cleveland Youth Detention Centre\nYoung person: Morgan Teston\nDate of birth: 17/06/2010\nRemanded in custody on robbery charges; parent notified; caseworker allocated."
      description: Populated record 2
      synthetic: true
    - value: "Restorative justice agreement\nChild: Jamie Teston (14)\nThe child agrees to apologise to the victim and complete 20 hours of community work."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: The Youth Justice Act 1992 sets out sentence orders for children, including conditional release orders and detention orders.
      description: Guidance or explainer text
    - value: "Conditional release order\nYoung person: __________\nDate of birth: __________\nProgram requirements: __________"
      description: Blank form
    - value: An average of 290 young people were held in Queensland youth detention centres each night in 2024-25, the department reported.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_youth_justice_order_record_primary
      matches:
        - ref: Regex_au_qld_youth_justice_order_record_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qld_youth_justice_order_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_youth_justice_order_record_primary
      matches:
        - ref: Regex_au_qld_youth_justice_order_record_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_youth_justice_order_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_youth_justice_order_record_primary
      pattern: >-
        (?i)\b(?:Youth\s+Justice\s+Act\s+1992|conditional\s+release\s+order|restorative\s+justice\s+(?:order|agreement|conference)|detention\s+order|(?:Brisbane|Cleveland)\s+Youth\s+Detention\s+Centre|Wacol\s+Youth\s+Remand\s+Facility|youth\s+detention\s+centre)\b
    - id: Regex_au_qld_youth_justice_order_record_record_structure
      pattern: >-
        (?i)\b(?:prisoner|offender|parolee|IOMS(?:\s+(?:no\.?|number))?|correctional\s+centre|security\s+classification|parole\s+eligibility\s+date|release\s+date|eligible\s+person|registered\s+victim|nominee|young\s+person|child|detainee|date\s+of\s+birth|DOB)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qld_youth_justice_order_record_corroborative
      groups:
        - match_style: word
          terms:
            - young person
            - child
            - youth justice
            - Childrens Court
            - bail
            - supervised release
            - caseworker
            - program
            - remand
            - offence
            - parent
      strength: specific
risk_rating: 9
risk_description: >-
  The classifier identifies a queensland youth justice order or detention record about an identified person, gated on populated record fields. Youth justice orders and detention records for a named young person under the Youth Justice Act 1992: detention and conditional release orders, restorative justice orders and agreements, and youth detention centre records (Brisbane Youth Detention Centre, Cleveland Youth Detention Centre, Wacol Youth Remand Facility). Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 9 supports SENSITIVE Law-Enforcement.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Law-Enforcement
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 9 with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Law-Enforcement and the Medium tier reflects
    detention and conditional release orders about a named young person, where offending history and custody detail can
    cause lasting harm. SENSITIVE rather than PROTECTED applies to a single record, but Medium handling should be strict
    given the subject's age.
  generic:
    classification: Medium
    dlm: Medium Law-Enforcement
    rationale: >-
      Medium Law-Enforcement handling is the floor for a named child's youth justice order or detention record, applied
      strictly given the age of the subject. High is not applied to a single record.
references:
  - title: Youth Justice Act 1992
    url: https://www.legislation.qld.gov.au/view/whole/html/current/act-1992-044
created: '2026-09-24'
updated: '2026-09-25'
