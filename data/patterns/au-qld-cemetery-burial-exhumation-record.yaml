schema: testpattern/v1
name: Queensland Cemetery Burial, Cremation and Exhumation Record
slug: au-qld-cemetery-burial-exhumation-record
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Council cemetery and crematorium records about a deceased person and the people arranging the disposal of the remains: burial and interment applications and bookings, rights (grants) of burial or interment, ashes and niche placements, exhumation applications and approvals, and cremation records. Cremation records follow the Cremations Act 2003 (Qld): an application for a permission to cremate by a close relative, personal representative or their agent (s 6), accompanied by a cause of death certificate and a cremation risk certificate, and the crematorium's record of particulars and permissions kept for 15 years (s 14). A populated record names the deceased (name, date of death, age, cause or place of death), the applicant, next of kin, right holder or funeral director and their relationship to the deceased, and the plot, niche or right number and burial, cremation or exhumation date. Published burial search and grave locator listings, fee schedules, cemetery policies and the statute text are decoys. The statutory basis for burial and exhumation records is council local law and is not asserted here.
operation: >-
  Primary: (application for a) permission to cremate; cremation risk certificate / application / permit / register / record; right or grant of burial or interment; interment right / application / record / register / order / authority; burial register / record / application / permit / booking / authority; exhumation application / permit / licence / order / approval / record / request; application to or for exhume / exhumation; or ashes / niche / columbarium placement or interment application or record. 65 is discovery-only (primary alone). 75 requires, within 300 characters, one populated structure: a deceased field (deceased / name of deceased / deceased person's full name with a two-word name, a date of death, an age at death, or a cause or place of death with a word value), a kin field (applicant, next of kin, close relative, personal representative, executor, holder of the right or grant, right holder, grantee, funeral director or contact person with a two-word name, or relationship to the deceased with a word value) or a plot field (plot, grave, allotment, niche, row, section, site or wall reference containing a digit; a dated burial, interment, cremation, exhumation, funeral or reinterment date; or a right / grant / licence number containing a digit). 85 requires a kin field AND a deceased or plot field AND an independent corroborative term (cemetery, crematorium, funeral director, headstone, memorial, Cremations Act 2003, independent doctor, coroner, reinterment, cause of death certificate and similar). Blank lines, bracket placeholders, n/a/tbc and "Yes / No" prompts are rejected. Every tier excludes template/fixture text; enforce tiers also exclude public listing and guidance wording (burial / grave / cemetery / deceased search, locator or finder, search results, family history, genealogy, maximum penalty, penalty units, in this section, fees and charges, this guide/fact sheet/policy/procedure, frequently asked questions, legislation.qld.gov.au).
pattern: >-
  (?i)\b(?:(?:application\s+for\s+(?:a\s+)?)?permission\s+to\s+cremate|cremation\s+(?:risk\s+certificates?|applications?|permits?|registers?|records?)|(?:right|grant)\s+of\s+(?:burial|interment)|interment\s+(?:rights?|applications?|records?|registers?|orders?|authority)|burial\s+(?:registers?|records?|applications?|permits?|bookings?|authority)|exhumation\s+(?:applications?|permits?|licences?|orders?|approvals?|records?|requests?)|application\s+(?:to|for)\s+(?:exhume|exhumation)|(?:ashes|niche|columbarium)\s+(?:placement|interment)\s+(?:applications?|records?))\b
confidence: medium
confidence_justification: >-
  Medium: permission to cremate and cremation risk certificate are Cremations Act 2003 terms and the burial and exhumation anchors are distinctive, but the same words fill council cemetery pages, fee schedules, local laws and public burial search tools, so enforce tiers need populated deceased, kin or plot fields and exclude listing and guidance wording. Right-of-interment, plot and approved-form numbers are council-specific and unverified, so values are loose and digit-gated. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
  - au-qld
regulations:
  - Cremations Act 2003 (Qld)
  - Information Privacy Act 2009 (Qld)
  - Public Records Act 2023 (Qld)
frameworks:
  - QGISCF
data_categories:
  - pii
  - health
  - government
corroborative_evidence:
  keywords:
    - cemetery
    - crematorium
    - funeral director
    - headstone
    - memorial
    - Cremations Act 2003
    - independent doctor
    - coroner
    - reinterment
    - cause of death certificate
  proximity: 300
customisation:
  - key: cemetery-interment-right-number
    kind: identifier-format
    identifier: cemetery-interment-right-number
    target: purview.regexes/Regex_au_qld_cemetery_burial_exhumation_record_plot_field
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's cemetery interment right / plot reference format (see docs/identifiers.md#cemetery-interment-right-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Exhumation application - Lawn Cemetery\nDeceased: Harold Teston\nDate of death: 03/06/1987\nSection: B, Row 7, Plot 112\nApplicant: Margaret Staffson\nRelationship to deceased: daughter\nFuneral director: Riverbend Funerals\nReason: reinterment in the family grave at Charters Towers"
      description: Exhumation application with deceased, date of death, plot, applicant, relationship and funeral director (85 tier)
      synthetic: true
    - value: "Application for permission to cremate\nFull name of deceased: Doreen Teston\nAge at death: 84\nCause of death: metastatic breast cancer\nApplicant: Keith Teston, close relative (son)\nCause of death certificate and cremation risk certificate attached; independent doctor to review."
      description: Cremations Act s 6 application with deceased, cause of death and applicant (85 tier)
      synthetic: true
    - value: "Right of interment granted. Right no: RI-20417. Holder to be confirmed."
      description: Right of interment with a populated right number only (75 tier)
      synthetic: true
    - value: "Burial booking confirmed for Tuesday.\nDate of burial: 29/09/2026\nNext of kin: Colin Staffson"
      description: Burial booking with burial date and next of kin (75 tier)
      synthetic: true
  should_not_match:
    - value: "Burial search results - Toowong Cemetery. Name: Harold Teston, Date of death: 03/06/1987, Section 12, Row 4, Plot 9. Print map. Use the grave locator to find other burial records."
      description: Public burial search / grave locator listing (listing exclusion)
    - value: "5 Permission required for cremation. A person must not cremate human remains unless the person has a permission to cremate the remains, in the approved form. Maximum penalty - 140 penalty units."
      description: Cremations Act statute text (statute exclusion)
    - value: "Exhumation application form - blank template\nDeceased: ____________\nDate of death: ____________\nApplicant: ____________\nRelationship to deceased: ____________\nPlot number: ____________"
      description: Blank exhumation form
    - value: "Cemetery fees and charges 2026-27: right of burial (lawn) $2,450; interment fee $1,380; exhumation application fee $3,100; niche placement $620."
      description: Council fee schedule (fees exclusion)
    - value: "Council's cemetery team processed 312 burial applications and 41 exhumation requests last year, the annual report shows."
      description: Aggregate statistics (65 only)
false_positives:
  - description: Public burial search, grave locator and family history pages list the deceased, date of death and plot.
    mitigation: A listing exclusion (burial/grave/cemetery/deceased search, locator, finder, search results, family history, genealogy) suppresses them at every enforce tier. Burial locations are published in practice; the sensitive parts are applicants, next of kin, cause of death and exhumation reasons.
  - description: Cemetery fee schedules, local laws, policies and the Cremations Act text.
    mitigation: A guidance/statute exclusion suppresses fee schedules, penalty wording, the legislation site and policy wording; these also lack populated fields.
  - description: Funeral director invoices and death notices.
    mitigation: A death notice with no record primary stays below 65; a funeral director's cremation application file is in scope.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_cemetery_burial_exhumation_record_primary
      matches:
        - ref: Regex_au_qld_cemetery_burial_exhumation_record_kin_field
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_cemetery_burial_exhumation_record_deceased_field
            - Regex_au_qld_cemetery_burial_exhumation_record_plot_field
        - ref: Keyword_au_qld_cemetery_burial_exhumation_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_cemetery_burial_exhumation_record_listing_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_cemetery_burial_exhumation_record_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_cemetery_burial_exhumation_record_deceased_field
            - Regex_au_qld_cemetery_burial_exhumation_record_kin_field
            - Regex_au_qld_cemetery_burial_exhumation_record_plot_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Regex_au_qld_cemetery_burial_exhumation_record_listing_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_cemetery_burial_exhumation_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_cemetery_burial_exhumation_record_primary
      pattern: >-
        (?i)\b(?:(?:application\s+for\s+(?:a\s+)?)?permission\s+to\s+cremate|cremation\s+(?:risk\s+certificates?|applications?|permits?|registers?|records?)|(?:right|grant)\s+of\s+(?:burial|interment)|interment\s+(?:rights?|applications?|records?|registers?|orders?|authority)|burial\s+(?:registers?|records?|applications?|permits?|bookings?|authority)|exhumation\s+(?:applications?|permits?|licences?|orders?|approvals?|records?|requests?)|application\s+(?:to|for)\s+(?:exhume|exhumation)|(?:ashes|niche|columbarium)\s+(?:placement|interment)\s+(?:applications?|records?))\b
    - id: Regex_au_qld_cemetery_burial_exhumation_record_deceased_field
      pattern: >-
        (?i)\b(?:(?:(?:(?:full\s+)?name\s+of\s+(?:the\s+)?)?deceased(?:\s+person)?(?:'s)?(?:\s+(?:full\s+)?name)?)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|(?:date\s+of\s+death|DOD)\s*[:#]\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}|(?:19|20)\d{2}-\d{2}-\d{2})|age\s+at\s+death\s*[:#]\s*\d{1,3}\b|(?:cause|place)\s+of\s+death\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:yes|no|y|n)\s*/)[A-Za-z][A-Za-z'-]{2,30})
    - id: Regex_au_qld_cemetery_burial_exhumation_record_kin_field
      pattern: >-
        (?i)\b(?:(?:applicant|next\s+of\s+kin|NOK|close\s+relative|personal\s+representative|executor|holder\s+of\s+(?:the\s+)?(?:right|grant)|right\s+holder|grantee|funeral\s+director|contact\s+person)(?:\s+(?:full\s+)?name)?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z][A-Za-z'-]{1,30}[ \t]+[A-Z][A-Za-z'-]{1,30}|relationship\s+to\s+(?:the\s+)?deceased\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)(?!(?:yes|no|y|n)\s*/)[A-Za-z][A-Za-z'-]{2,30})
    - id: Regex_au_qld_cemetery_burial_exhumation_record_plot_field
      pattern: >-
        (?i)\b(?:(?:plot|grave|allotment|niche|row|section|site|wall)\s*(?:no\.?|number|ref(?:erence)?)?\s*[:#]\s*(?=[A-Z]{0,4}[-/ ]?\d)[A-Z0-9][A-Z0-9/-]{0,10}\b|(?:date\s+of\s+(?:burial|interment|cremation|exhumation|funeral|reinterment)|(?:burial|interment|cremation|exhumation|funeral)\s+date)\s*[:#-]?\s*(?:\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4}|20\d{2}-\d{2}-\d{2})|(?:right|grant|licence)(?:\s+of\s+(?:burial|interment))?\s+(?:no\.?|number)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba)\b|_{2,}|\[|<)(?=[A-Z-]{0,5}\d)[A-Z0-9][A-Z0-9-]{2,15}\b)
    - id: Regex_au_qld_cemetery_burial_exhumation_record_listing_exclusion
      pattern: >-
        (?i)(?:\b(?:burial|grave|cemetery|deceased)\s+(?:search|locator|finder)\b|\bsearch\s+results\b|\bfamily\s+history\b|\bgenealog|\bmaximum\s+penalty\b|\bpenalty\s+units\b|\bin\s+this\s+section\b|\bfees\s+and\s+charges\b|\bfrequently\s+asked\s+questions\b|\bthis\s+(?:guide|guideline|fact\s?sheet|policy|procedure)\b|\blegislation\.qld\.gov\.au\b)
  keywords:
    - id: Keyword_au_qld_cemetery_burial_exhumation_record_corroborative
      groups:
        - match_style: word
          terms:
            - cemetery
            - crematorium
            - funeral director
            - funerals
            - headstone
            - memorial
            - Cremations Act 2003
            - independent doctor
            - coroner
            - reinterment
            - cause of death certificate
            - cremation risk certificate
            - sexton
            - family grave
      strength: specific
risk_rating: 6
risk_description: >-
  The classifier identifies a cemetery, crematorium or exhumation record that links a deceased person to the family members, executors and funeral directors arranging the burial, cremation or exhumation, often with cause of death, relationship details and reasons for exhumation. Disclosure can inflame next-of-kin disputes, expose health information about the deceased, breach cultural protocols for First Nations remains and reveal contact details of bereaved families. Burial locations themselves are often published, so public search listings, fee schedules, policies and the statute text are excluded from enforce tiers. Risk 6 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 6 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy and Medium because the
    record links a deceased person's cause of death to next of kin, executors and exhumation reasons, and can breach
    First Nations cultural protocols. Higher risk is not met because burial locations are often published.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling covers cause of death and bereaved families' contact details. It is not High
      because the record concerns one interment and much burial data is public.
references:
  - title: Cremations Act 2003 (Qld) - ss 5 (permission required), 6 (getting permission), 11 (ashes), 14 (crematorium record keeping)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2003-014
  - title: Public Records Act 2023 (Qld)
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2023-033
