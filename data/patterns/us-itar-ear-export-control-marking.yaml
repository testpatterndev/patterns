schema: testpattern/v1
name: "U.S. ITAR and EAR Export-Control Technical Data Marking"
slug: us-itar-ear-export-control-marking
version: 1.0.0
type: regex
pattern_class: marking
engine: boost_regex
description: >-
  Detects U.S. export-controlled technical data markings and classification identifiers across Five Eyes defence supply chains: ITAR warning blocks (22 CFR 120-130, USML Categories I-XXI), EAR technology control notices (15 CFR 730-774, ECCN codes such as 3A001, 5D002, 9E003), and CUI//SP-EXPT banners.
operation: >-
  Matches CUI//SP-EXPT banners, explicit ECCN or USML Category codes, or ITAR/EAR statutory warning statements. Tier 85 requires export-restriction / U.S.-person / DDTC / BIS corroboration; Tier 75 enforces on structured ECCN/USML/CUI-EXPT/CFR control blocks; Tier 65 provides discovery.
pattern: '(?-i)\b((?i:International\s+Traffic\s+in\s+Arms\s+Regulations|22\s+C\.?F\.?R\.?\s*(?:Parts?\s*)?120(?:\s*[-–]\s*130)?|ITAR\s+(?:controlled|technical\s+data|warning|restricted)|Export\s+Administration\s+Regulations|15\s+C\.?F\.?R\.?\s*(?:Parts?\s*)?730(?:\s*[-–]\s*774)?)|CUI//(?:SP-)?EXPT|ECCN[\s:#-]{1,6}[0-9][A-E][0-9]{3}(?:\.[a-z0-9]+)?|USML\s+Category\s+(?:[IVX]{1,5}|[1-9]|1[0-9]|2[01]))\b'
confidence: high
confidence_justification: >-
  High confidence: 22 CFR 120-130, 15 CFR 730-774, CUI//SP-EXPT, USML Category numerals, and ECCN [0-9][A-E][0-9]{3} codes are canonical statutory export-control markers.
jurisdictions:
  - us
  - au
  - uk
  - ca
regulations:
  - "22 CFR 120-130 (ITAR)"
  - "15 CFR 730-774 (EAR)"
  - "32 CFR 2002"
frameworks:
  - NIST SP 800-171
  - DISP
  - ISO 27001
data_categories:
  - defense
  - intellectual-property
  - security-classification
corroborative_evidence:
  keywords:
    - "ITAR"
    - "EAR"
    - "ECCN"
    - "USML"
    - "22 CFR 120-130"
    - "15 CFR 730-774"
    - "DDTC"
    - "Bureau of Industry and Security"
    - "CUI//SP-EXPT"
  proximity: 300
test_cases:
  should_match:
    - value: "WARNING - This document contains technical data whose export is restricted by the Arms Export Control Act and ITAR (22 CFR Parts 120-130). Violations are subject to severe criminal penalties."
      description: "Canonical ITAR destination-control warning block (85 tier)"
    - value: "Export Classification: ECCN 9E003.a — subject to the Export Administration Regulations (15 CFR 730-774), BIS license required."
      description: "EAR ECCN aerospace technology code with 15 CFR / BIS corroboration (85 tier)"
    - value: "CUI//SP-EXPT — USML Category XI Military Electronics"
      description: "NARA CUI Export Controlled banner with USML Category XI (75/85 tier)"
  should_not_match:
    - value: "EAR99 commercial off-the-shelf office stationery item"
      description: "EAR99 non-controlled commercial designation does not match ECCN [0-9][A-E][0-9]{3}"
    - value: "The investor call mentioned international traffic in commercial aviation."
      description: "Ordinary prose without Arms Regulations, CFR citations, ECCN, or USML markers"
    - value: "Sample template: placeholder example record for training only"
      description: "Template/sample fixture suppressed by shared exclusion dictionary"
false_positives:
  - description: "Vendor product export-classification matrices publishing public ECCN codes for commercial electronics."
    mitigation: "Public catalog matrices without ITAR/technical-data restriction warnings stop at 65/75; 85 requires explicit restriction, DDTC, USML, or foreign-person prohibition language."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: narrow
risk_rating: 8
risk_description: >-
  The detector matches U.S. ITAR (22 CFR 120-130) and EAR (15 CFR 730-774) export-control markings, USML categories, ECCN classifications, and CUI//SP-EXPT banners. Across Australian, UK, Canadian, and U.S. defence contractors (including AUKUS §126.7 and Canadian §126.5 exemptions), inadvertent cloud sync, offshore tenant routing, or LLM prompt submission of ITAR/EAR technical data constitutes an unauthorized "deemed export" carrying multi-million-dollar DDTC/BIS penalties. Risk 8 and SENSITIVE Government fit unclassified export-controlled technical data.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Government
  idcf: DSL-3
  us_gov: "CUI Specified"
  uk_gov: "OFFICIAL-SENSITIVE"
  nz_gov: "RESTRICTED"
  ca_gov: "Protected B"
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Government, and Medium because unclassified ITAR and EAR technical data is legally restricted CUI Specified (SP-EXPT) subject to strict nationality, cloud-sovereignty, and re-transfer controls across Five Eyes defence industry estates.
  generic:
    classification: Medium
    dlm: Medium Government
    rationale: >-
      Medium Government handling enforces export-control residency and foreign-person access restrictions on ITAR and EAR technical data.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_us_itar_ear
      matches:
        - ref: Keyword_us_itar_restriction
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_us_itar_ear
      matches:
        - ref: Keyword_us_itar_domain
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_us_itar_ear
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_us_itar_ear
      pattern: '(?-i)\b((?i:International\s+Traffic\s+in\s+Arms\s+Regulations|22\s+C\.?F\.?R\.?\s*(?:Parts?\s*)?120(?:\s*[-–]\s*130)?|ITAR\s+(?:controlled|technical\s+data|warning|restricted)|Export\s+Administration\s+Regulations|15\s+C\.?F\.?R\.?\s*(?:Parts?\s*)?730(?:\s*[-–]\s*774)?)|CUI//(?:SP-)?EXPT|ECCN[\s:#-]{1,6}[0-9][A-E][0-9]{3}(?:\.[a-z0-9]+)?|USML\s+Category\s+(?:[IVX]{1,5}|[1-9]|1[0-9]|2[01]))\b'
  keywords:
    - id: Keyword_us_itar_restriction
      groups:
        - match_style: word
          terms:
            - "Arms Export Control Act"
            - "foreign person"
            - "deemed export"
            - "DDTC"
            - "Directorate of Defense Trade Controls"
            - "Bureau of Industry and Security"
            - "United States Munitions List"
            - "export license"
            - "technical data"
      strength: specific
    - id: Keyword_us_itar_domain
      groups:
        - match_style: word
          terms:
            - text: "ITAR"
              case_sensitive: true
            - text: "ECCN"
              case_sensitive: true
            - text: "USML"
              case_sensitive: true
            - "export controlled"
            - "126.7"
            - "AUKUS"
            - "Controlled Goods Program"
      strength: domain
references:
  - url: https://www.ecfr.gov/current/title-22/chapter-I/subchapter-M
    title: "22 CFR Subchapter M - International Traffic in Arms Regulations (ITAR)"
  - url: https://www.ecfr.gov/current/title-15/subtitle-B/chapter-VII/subchapter-C
    title: "15 CFR Subchapter C - Export Administration Regulations (EAR) and Commerce Control List (ECCN)"
  - url: https://www.archives.gov/cui/registry/category-detail/export-controlled.html
    title: "NARA CUI Registry - Export Controlled (EXPT) Category"
created: '2026-11-25'
updated: '2026-11-25'
