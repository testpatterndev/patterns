schema: testpattern/v1
name: SOC analyst case notes
slug: global-top500-295-soc-analyst-case-notes
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects SOC analyst case notes: SOC case or analyst-notes wording with populated case fields (IDs, severity, affected host/user, disposition) and technical artefacts. Topic wording alone is discovery-only.
operation: >-
  Regex_soc_case_primary (SOC case/ticket/investigation or analyst-notes wording) is discovery-only at 65. 75 requires the primary plus one populated structure: a populated case field (case/ticket/alert/incident ID, severity, analyst, affected host/user, source IP, disposition) or a technical artefact (IPv4, ISO timestamp, internal hostname). 85 requires a populated case field (case/ticket/alert/incident ID, severity, analyst, affected host/user, source IP, disposition) (two distinct hits), a technical artefact (IPv4, ISO timestamp, internal hostname), and independent triage-outcome (true/false positive, escalation, containment, SIEM/EDR) evidence that does not repeat the primary. Every enforce tier rejects template/noise wording (template-exclusion) and guidance, policy, training and news framing (Keyword_soc_case_guidance_exclusion).
pattern: >-
  (?i)\b(?:SOC\s+(?:case|ticket|investigation|incident)(?:\s+notes?)?|analyst\s+(?:case\s+)?notes|security\s+incident\s+ticket|alert\s+triage\s+notes|(?:tier|L)\s?[123]\s+analyst\s+notes)\b
confidence: medium
confidence_justification: >-
  Medium confidence: the topic phrase alone is discovery-only; enforcement needs populated structure (a populated case field (case/ticket/alert/incident ID, severity, analyst, affected host/user, source IP, disposition) or a technical artefact (IPv4, ISO timestamp, internal hostname)), and 85 needs two distinct structures plus independent triage-outcome (true/false positive, escalation, containment, SIEM/EDR) evidence, so policies, blank forms and training text stay below 75.
jurisdictions:
- global
regulations:
- Privacy Act 1988 (Cth)
- NDB Scheme (Cth)
- SOCI Act 2018 (Cth)
frameworks:
- ISO 27001
- NIST CSF
data_categories:
- security
corroborative_evidence:
  keywords:
  - true positive
  - false positive
  - escalated
  - containment
  - EDR
  - SIEM
  - Sentinel
  - Splunk
  - isolated
  - password reset
  proximity: 300
test_cases:
  should_match:
  - value: Please attach the SOC case notes to the monthly security report.
    description: Discovery probe (65)
    synthetic: true
  - value: |-
      SOC case notes
      Case ID: SOC-26-04471
      Severity: High
    description: Medium-tier probe (75) - populated case fields
    synthetic: true
  - value: |-
      SOC case notes - L2 analyst
      Case ID: SOC-26-04471
      Affected host: ws-fin-114.harbour.internal
      Username: ateston
      Source IP: 10.20.4.17
      2026-09-18 02:14 - EDR flagged encoded PowerShell; escalated to IR, host isolated, true positive; password reset requested.
    description: High-tier probe (85) - several case fields, IP/timestamp artefacts and triage outcome
    synthetic: true
  should_not_match:
  - value: unrelated generic text
    description: No relevant phrase context
  - value: placeholder value 12345
    description: Random text should not match
  - value: 'Policy statement: SOC case notes must record the disposition and be retained for seven years.'
    description: Policy text
    synthetic: true
  - value: |-
      SOC case notes template
      Case ID: ________
      Severity: [insert]
      Affected host: ________
    description: Blank template
    synthetic: true
  - value: 'Course module 3: writing analyst notes - Case ID: SOC-00001, Source IP: 10.0.0.1, true positive.'
    description: Training framing
    synthetic: true
false_positives:
- description: SOC runbooks describe case fields.
  mitigation: Fields must be populated; blank templates and guidance/training framing are excluded.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_soc_case_primary
    matches:
    - ref: Regex_soc_case_case_field
      min_count: 2
      unique_results: true
    - ref: Regex_soc_case_case_artefact
    - ref: Keyword_soc_case_context
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_soc_case_guidance_exclusion
  - confidence_level: 75
    id_match: Regex_soc_case_primary
    matches:
    - type: any
      refs:
      - Regex_soc_case_case_field
      - Regex_soc_case_case_artefact
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
      - Keyword_soc_case_guidance_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_soc_case_primary
    matches:
    - type: any
      min_matches: 0
      max_matches: 0
      refs:
      - Keyword_noise_exclusion
  regexes:
  - id: Regex_soc_case_primary
    pattern: >-
      (?i)\b(?:SOC\s+(?:case|ticket|investigation|incident)(?:\s+notes?)?|analyst\s+(?:case\s+)?notes|security\s+incident\s+ticket|alert\s+triage\s+notes|(?:tier|L)\s?[123]\s+analyst\s+notes)\b
  - id: Regex_soc_case_case_field
    pattern: >-
      (?i)\b(?:case\s+(?:ID|no\.?|number)|ticket\s+(?:ID|no\.?|number)|alert\s+(?:ID|name)|incident\s+(?:ID|no\.?|number)|severity|assigned\s+to|analyst|affected\s+(?:host|user|asset)|source\s+IP|hostname|username|disposition)\s*[:=#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Za-z0-9][A-Za-z0-9/'._:@#+-]{1,60}
  - id: Regex_soc_case_case_artefact
    pattern: >-
      (?i)\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b|\b20\d{2}-[01]\d-[0-3]\d[T ][0-2]\d:[0-5]\d|\b[a-z0-9-]{1,63}\.(?:local|internal|corp|lan|intranet)\b
  keywords:
  - id: Keyword_soc_case_context
    groups:
    - match_style: word
      terms:
      - true positive
      - false positive
      - escalated
      - containment
      - text: EDR
        case_sensitive: true
      - text: SIEM
        case_sensitive: true
      - Sentinel
      - Splunk
      - isolated
      - password reset
    strength: specific
  - id: Keyword_soc_case_guidance_exclusion
    groups:
    - match_style: word
      terms:
      - policy statement
      - guidance note
      - best practice guide
      - media release
      - press release
      - news report
      - course module
      - learning objectives
      - awareness course
      - webinar
      - lesson plan
      - quiz question
    strength: domain
risk_description: >-
  The detector now requires SOC case wording plus populated case fields or technical artefacts (IPs, timestamps, internal hosts) before enforcing. Genuine notes can contain affected users and assets, hypotheses, evidence, containment actions, false-positive reasoning, and unresolved investigative leads. The impacted parties are the incident subjects, system owners, and security team, usually within one case, while templates and process guidance can trigger the same short phrases. Risk 8 SENSITIVE reflects serious contained investigative and personal exposure; PROTECTED would require a major critical incident or evidence of significant broad damage.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE InfoTech
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
