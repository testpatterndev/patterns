schema: testpattern/v1
name: NCCD Student Disability Adjustment Record
slug: au-education-nccd-adjustment-record
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Nationally Consistent Collection of Data on School Students with Disability (NCCD) records for a named student: disability category, level of adjustment and the evidence of adjustments provided.
operation: >-
  Primary: NCCD Student Disability Adjustment Record anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:NCCD|Nationally\s+Consistent\s+Collection\s+of\s+Data|level\s+of\s+adjustment|quality\s+differentiated\s+teaching\s+practice|QDTP|(?:supplementary|substantial|extensive)\s+adjustments?)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Disability Standards for Education 2005 (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - education
  - health
  - pii
corroborative_evidence:
  keywords:
    - disability
    - Physical
    - Cognitive
    - Sensory
    - Social-emotional
    - Social/Emotional
    - imputed disability
    - diagnosis
  proximity: 300
customisation:
  - key: qld-eq-id
    kind: identifier-format
    identifier: qld-eq-id
    target: purview.regexes/Regex_au_education_nccd_adjustment_record_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Education Queensland student ID (EQ ID) format (see docs/identifiers.md#qld-eq-id). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "NCCD record 2026\nStudent name: Avery Teston\nEQ ID: 0071932845L\nYear level: 4\nCategory of disability: Cognitive\nLevel of adjustment: Substantial\nEvidence: individual learning plan, weekly teacher aide support, modified assessment."
      description: Populated record 1
      synthetic: true
    - value: "Student: Casey Teston\nDate of birth: 09/11/2015\nNCCD — Social/Emotional; supplementary adjustments recorded for Terms 1-3 (anxiety diagnosis, paediatrician letter on file)."
      description: Populated record 2
      synthetic: true
    - value: "Level of adjustment: Extensive\nStudent: Jordan Teston\nStudent ID: S0071932\nCategory: Physical — full-time support for mobility and personal care."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: 'The NCCD recognises four levels of adjustment: support within quality differentiated teaching practice, supplementary, substantial and extensive. Schools count students every year in August.'
      description: Guidance or explainer text
    - value: "NCCD evidence checklist\nStudent name: __________\nCategory of disability: [ ] Physical [ ] Cognitive [ ] Sensory [ ] Social/Emotional\nLevel of adjustment: __________"
      description: Blank form
    - value: National NCCD data for 2025 show 24.1% of school students received an adjustment due to disability, up from 22.5% in 2024.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_education_nccd_adjustment_record_primary
      matches:
        - ref: Regex_au_education_nccd_adjustment_record_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_education_nccd_adjustment_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_education_nccd_adjustment_record_primary
      matches:
        - ref: Regex_au_education_nccd_adjustment_record_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_education_nccd_adjustment_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_education_nccd_adjustment_record_primary
      pattern: >-
        (?i)\b(?:NCCD|Nationally\s+Consistent\s+Collection\s+of\s+Data|level\s+of\s+adjustment|quality\s+differentiated\s+teaching\s+practice|QDTP|(?:supplementary|substantial|extensive)\s+adjustments?)\b
    - id: Regex_au_education_nccd_adjustment_record_record_structure
      pattern: >-
        (?i)\b(?:student\s+name|child(?:'s)?\s+name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|principal|school|(?:student|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_education_nccd_adjustment_record_corroborative
      groups:
        - match_style: word
          terms:
            - disability
            - Physical
            - Cognitive
            - Sensory
            - Social-emotional
            - Social/Emotional
            - imputed disability
            - diagnosis
            - reasonable adjustment
            - evidence of adjustment
            - personalised learning plan
            - teacher aide
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a nccd student disability adjustment record about an identified person, gated on populated record fields. Nationally Consistent Collection of Data on School Students with Disability (NCCD) records for a named student: disability category, level of adjustment and the evidence of adjustments provided. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: NCCD — Level of adjustment
    url: https://www.nccd.edu.au/wider-support-materials/step-2-what-level-adjustment
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.1.0
    date: '2026-09-24'
    description: Declare identifier-format customisation slots (qld-eq-id) replacing the interim identifier_dependencies metadata; definitions and replacement steps live in data/identifiers/ and docs/identifiers.md.
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
