schema: testpattern/v1
name: Data subject access request files
slug: global-top500-471-data-subject-access-request-files
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to data subject access request files in Australian contexts. This information type is classified as personally identifiable information under applicable
  data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 9 keywords within 300 characters.'
pattern: (?is)\b(?:data\s+subject\s+access\s+request\s+files|access\s+request|subject\s+access|APP\s+12|personal\s+information\s+request|identity\s+verification|response\s+deadline|data\s+subject)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - data subject access request files
    - data
    - subject
    - access
    - request
    - files
    - privacy
    - compliance
    - risk
  proximity: 300
test_cases:
  should_match:
    - value: data subject access request files
      description: Primary topic phrase match
    - value: access request
      description: Case-insensitive topic phrase match
    - value: subject access
      description: Alternative topic phrase match
    - value: APP 12
      description: Additional topic phrase match
    - value: |-
        Data subject access request files
        Name: Avery Teston
        Date of birth: 14/02/1988
        Client number: C4471820
      description: Populated person/client record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: data inventory compliance
      description: Generic word pair from old broad template should not match
    - value: |-
        Data subject access request files:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about data subject access request files are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to data subject access request files appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_dsar
      matches:
        - ref: Regex_global_top500_471_data_subject_access_request_files_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_dsar
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_dsar
            - Regex_global_top500_471_data_subject_access_request_files_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_dsar
  regexes:
    - id: Pattern_dsar
      pattern: (?is)\b(?:data\s+subject\s+access\s+request\s+files|access\s+request|subject\s+access|APP\s+12|personal\s+information\s+request|identity\s+verification|response\s+deadline|data\s+subject)\b
    - id: Regex_global_top500_471_data_subject_access_request_files_record_structure
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Evidence_dsar
      groups:
        - match_style: word
          terms:
            - DSAR
risk_description: >-
  The detector recognises data-subject access request files, access requests, subject access, APP 12, and related privacy-rights case language. A completed file can contain identity verification, request scope, correspondence, search locations, third-party information, exemptions, and copies of responsive personal records, exposing both the requester and other people. The normal unit is a composite case file rather than a request label and can aggregate data across several systems, while public guidance may still match. Risk 8 SENSITIVE Personal-Privacy reflects serious contained disclosure harm; PROTECTED is not met without protected persons, bulk case repositories, life-safety implications, or significant organisational compromise.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 8 aligns with SENSITIVE because a completed access-request file can aggregate identity verification,
    correspondence, and diverse personal records for one individual. PROTECTED is not met without exceptional
    sensitivity, bulk requester data, credentials, or a likely significant and irreversible consequence.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium Personal-Privacy handling is appropriate for a compiled access-request case because aggregation makes the
      file materially more revealing than an isolated identifier.
created: '2026-02-08'
updated: '2026-10-19'
changelog:
  - version: 1.4.0
    date: '2026-10-19'
    description: 'Self-corroboration fix: Purview counts a supporting match whose span equals the IdMatch (dev-tenant gating test 2026-10-16), so the topic phrase corroborated itself and a bare heading reached the 75 enforcement tier. 75 now requires an independent populated person/client field (Regex_global_top500_471_data_subject_access_request_files_record_structure), or one remaining corroborative term (DSAR); 85 requires 2 distinct fields. Phrase-only matches stay at 65 discovery. Removed the IdMatch''s own phrases from the evidence list and generic terms (disclosure, privacy, compliance). Added a populated positive and empty-form / policy-guidance decoys.'
  - version: 1.3.4
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.3.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth), HRIPA (Cth), My Health Records Act 2012 (Cth), TIA Act 1979 (Cth)); added 3 verified legislation/regulator references."
  - version: 1.3.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1057 without changing detector or package metadata.'
  - version: 1.3.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.2.0
    date: '2026-03-14'
    description: Standardise to 3-tier 65/75/85 gating with progressive evidence
  - version: 1.1.0
    date: '2026-03-06'
    description: Embed topic-specific phrase regex, wire domain keyword lists
  - version: 1.0.0
    date: '2026-02-08'
    description: Initial release
