    date: '2026-09-24'
    description: Declare identifier-format customisation slots (qld-eq-id) replacing the interim identifier_dependencies metadata; definitions and replacement steps live in data/identifiers/ and docs/identifiers.md.
  - version: 1.0.0
    date: '2026-09-24'
    description: Initial release — anchored on published Queensland forms and statutes; 75 gated on populated record structure; customer identifier slots recorded in identifier_dependencies.
