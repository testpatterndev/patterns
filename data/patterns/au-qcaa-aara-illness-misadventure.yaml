schema: testpattern/v1
name: QCAA Access Arrangements and Reasonable Adjustments (AARA) Application
slug: au-qcaa-aara-illness-misadventure
version: 1.1.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Queensland senior secondary applications for access arrangements and reasonable adjustments (AARA), including illness and misadventure, for a named student: diagnosis, medical practitioner report, functional impact and the arrangement sought for internal or external assessment.
operation: >-
  Primary: QCAA Access Arrangements and Reasonable Adjustments (AARA) Application anchors taken from published forms, statutes and procedures. 75 tier requires a populated record field (person, identifier or reference label with a non-placeholder value) within 300 characters. 85 tier requires two distinct populated record fields plus an independent corroborative term. All tiers exclude template/fixture text. 65 is discovery-only (primary alone) and will surface guidance, blank forms and statistics.
pattern: (?i)\b(?:access\s+arrangements\s+and\s+reasonable\s+adjustments|AARA(?:\s+application)?|illness\s+and\s+misadventure(?:\s+application)?|Information\s+for\s+medical\s+practitioners)\b
confidence: medium
confidence_justification: >-
  Medium: primary anchors are distinctive form titles and statutory terms, but they also appear in guidance, blank forms and statistics, so enforce tiers require populated record structure. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic records laid out like the published forms.
jurisdictions:
  - au
regulations:
  - Education (Queensland Curriculum and Assessment Authority) Act 2014 (Qld)
  - IPA 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - education
  - health
  - pii
corroborative_evidence:
  keywords:
    - medical report
    - diagnosis
    - external assessment
    - internal assessment
    - QCAA
    - reasonable adjustment
    - extra time
    - rest breaks
  proximity: 300
customisation:
  - key: qld-eq-id
    kind: identifier-format
    identifier: qld-eq-id
    target: purview.regexes/Regex_au_qcaa_aara_illness_misadventure_record_structure
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the record-structure evidence with the customer's Education Queensland student ID (EQ ID) format (see docs/identifiers.md#qld-eq-id). The public fallback is the documented labelled-field regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "AARA application\nStudent name: Riley Teston\nLUI: 0448213771\nSchool: Wattle Creek State High School\nSubject: General Mathematics — external assessment\nArrangement sought: extra time 10 minutes per hour, rest breaks\nMedical report: type 1 diabetes (Dr Casey Staffson)."
      description: Populated record 1
      synthetic: true
    - value: "Illness and misadventure application\nStudent name: Morgan Teston\nDate of birth: 03/04/2008\nMissed the Chemistry external assessment on 04/11/2026 because of a hospital admission (appendicitis). Medical certificate attached."
      description: Populated record 2
      synthetic: true
    - value: "Information for medical practitioners (AARA)\nStudent name: Jamie Teston\nDiagnosis: generalised anxiety disorder and ADHD\nFunctional impact on assessment: cannot sustain attention beyond 40 minutes."
      description: Populated record 3
      synthetic: true
  should_not_match:
    - value: Schools can apply for access arrangements and reasonable adjustments (AARA), including illness and misadventure, for students with a disability, impairment or medical condition.
      description: Guidance or explainer text
    - value: "AARA application\nStudent name: __________\nLUI: __________\nArrangement sought: __________"
      description: Blank form
    - value: QCAA approved 21,400 AARA applications for the 2025 external assessment period, its annual report shows.
      description: Aggregate statistics or news
false_positives:
  - description: Guidance pages, fact sheets, policy and training text that name the record type.
    mitigation: Enforce tiers require populated record fields; guidance uses the labels without values.
  - description: Blank forms and form kits.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected.
  - description: Aggregate statistics and news reporting.
    mitigation: No populated person or reference fields, so these stay at 65 discovery.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qcaa_aara_illness_misadventure_primary
      matches:
        - ref: Regex_au_qcaa_aara_illness_misadventure_record_structure
          min_count: 2
          unique_results: true
        - ref: Keyword_au_qcaa_aara_illness_misadventure_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_au_qcaa_aara_illness_misadventure_primary
      matches:
        - ref: Regex_au_qcaa_aara_illness_misadventure_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qcaa_aara_illness_misadventure_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qcaa_aara_illness_misadventure_primary
      pattern: >-
        (?i)\b(?:access\s+arrangements\s+and\s+reasonable\s+adjustments|AARA(?:\s+application)?|illness\s+and\s+misadventure(?:\s+application)?|Information\s+for\s+medical\s+practitioners)\b
    - id: Regex_au_qcaa_aara_illness_misadventure_record_structure
      pattern: >-
        (?i)\b(?:student\s+name|child(?:'s)?\s+name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|student|child|young\s+person|pupil|EQ\s*ID|LUI|USI|year\s+level|parent|guardian|carer|principal|school|(?:student|case|enrolment|file)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_au_qcaa_aara_illness_misadventure_corroborative
      groups:
        - match_style: word
          terms:
            - medical report
            - diagnosis
            - external assessment
            - internal assessment
            - text: QCAA
              case_sensitive: true
            - reasonable adjustment
            - extra time
            - rest breaks
            - reader
            - scribe
            - medical certificate
            - functional impact
      strength: specific
risk_rating: 8
risk_description: >-
  The classifier identifies a qcaa access arrangements and reasonable adjustments (aara) application about an identified person, gated on populated record fields. Queensland senior secondary applications for access arrangements and reasonable adjustments (AARA), including illness and misadventure, for a named student: diagnosis, medical practitioner report, functional impact and the arrangement sought for internal or external assessment. Unauthorised disclosure exposes highly personal circumstances and can cause harm, discrimination or retaliation. Guidance, blank forms and statistics are excluded from enforce tiers. Risk 8 supports SENSITIVE Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected B
references:
  - title: 'QCAA — QCE and QCIA handbook section 6: AARA (anchor confirmed from official-domain search results; page fetch blocked)'
    url: https://www.qcaa.qld.edu.au/senior/certificates-and-qualifications/qce-qcia-handbook/6-aara
created: '2026-09-24'
updated: '2026-09-24'
