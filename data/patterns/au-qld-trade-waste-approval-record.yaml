schema: testpattern/v1
name: Queensland Trade Waste Approval and Compliance Record
slug: au-qld-trade-waste-approval-record
version: 1.0.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Trade waste and seepage water approvals issued by a Queensland sewerage service provider (council or water utility) under Water Supply (Safety and Reliability) Act 2008 (Qld) ch 2 pt 6 (s 180 approvals, s 181 conditions such as maximum daily quantity and limits for suspended solids and biochemical oxygen demand, ss 182-184 suspension and cancellation, s 185 amendment), and the compliance records that follow them: sampling results against discharge limits, grease arrestor and pre-treatment inspections, and breach or non-compliance notices. The records carry the approval holder's business, premises, approval number, process chemistry and non-compliance history. Published trade waste guidance, acceptance criteria tables, fact sheets and blank application forms are decoys.
operation: >-
  Primary: a trade waste record phrase (trade waste approval/permit/licence/agreement/application/category/generator/discharge/plan/customer/inspection, seepage water approval). 75 tier requires, within 300 characters, one populated record field: an approval/permit/licence/agreement number label with a digit-bearing value, or an approval holder/permit holder/business/trading name/generator/occupier/premises/site address field with a non-placeholder value. 85 tier requires one of those fields AND a discharge limit or sampling result structure (a trade waste parameter such as BOD, COD, suspended solids, FOG, oil and grease, total nitrogen/phosphorus, ammonia, sulphate, metals, or daily discharge volume/flow followed within 25 characters by a number with a mg/L, g/m3, kL/day, kL, L/s, L/day or m3/day unit) AND an independent corroborative term (sampling, exceedance, breach, non-compliance, grease arrestor, pre-treatment, suspension, cancellation, show cause, conditions of approval, sewerage, sewer). All enforce tiers AND NOT the shared template-exclusion dictionary and a guidance exclusion (fact sheet, information sheet, frequently asked questions, how to apply, application guide, acceptance criteria, media release). 65 is discovery-only (primary phrase alone) and will surface guidance, blank forms and policy text.
pattern: >-
  (?i)\b(?:trade\s+waste\s+(?:approvals?|permits?|licen[cs]es?|agreements?|applications?|category|categories|generators?|discharges?|plans?|customers?|inspections?)|seepage\s+water\s+approvals?)\b
confidence: medium
confidence_justification: >-
  Medium: "trade waste approval" and "seepage water approval" are statutory terms (WSSR Act s 180) and uncommon outside the record type, but they fill council trade waste policies, fact sheets and application forms, so enforce tiers require populated approval or premises fields. Approval numbers are council-defined with no published format, so values are label-anchored, digit-bearing and placeholder-guarded. 85/75 are heuristic evidence tiers, not measured accuracy; test values are synthetic.
jurisdictions:
  - au
regulations:
  - Water Supply (Safety and Reliability) Act 2008 (Qld)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - QGISCF
data_categories:
  - business
  - environmental
  - infrastructure
corroborative_evidence:
  keywords:
    - sampling
    - exceedance
    - breach
    - non-compliance
    - grease arrestor
    - pre-treatment
    - suspension
    - cancellation
    - conditions of approval
    - sewerage
  proximity: 300
customisation:
  - key: trade-waste-approval-number
    kind: identifier-format
    identifier: trade-waste-approval-number
    target: purview.regexes/Regex_au_qld_trade_waste_approval_record_approval_ref
    mode: extend
    affects_tiers:
      - 75
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's trade waste approval number format (see docs/identifiers.md#trade-waste-approval-number). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "Trade waste approval - compliance sampling report\nApproval number: TW-2026-0418\nApproval holder: Harbourline Food Processing Pty Ltd\nPremises: 22 Tallowwood Drive, Carrow Industrial Estate\nResults for composite collected 11/09/2026:\nBOD 2,850 mg/L (limit 1,000 mg/L)\nSuspended solids 640 mg/L (limit 500 mg/L)\nDaily discharge volume 38 kL/day (maximum 30 kL/day)\nExceedance of conditions of approval - grease arrestor pump-out overdue. Non-compliance notice to issue."
      description: High tier (85) - approval number and holder, measured results against limits, breach wording
      synthetic: true
    - value: "Trade waste permit TWP 5512 amendment under section 185\nPermit holder: Testvale Metal Finishing\nSite address: 7 Anvil Street, Lakeside\nConditions: zinc limit 5 mg/L; maximum daily quantity 12 kL/day; pre-treatment by pH correction and settling tank before discharge to sewer."
      description: High tier (85) - holder and site fields, discharge limits with units, pre-treatment and sewer terms
      synthetic: true
    - value: "Trade waste application received for a new cafe.\nBusiness name: Wattle & Crumb Cafe\nPremises address: Shop 4, 18 Main Street, Mount Carrow\nTrade waste category: food premises, grease arrestor to be sized by plumber."
      description: Medium tier (75) - populated business and premises fields, no measured results
      synthetic: true
    - value: "Seepage water approval SWA/2026/0077 issued to the basement car park at 40 Quay Road."
      description: Medium tier (75) - approval number only
      synthetic: true
    - value: Please check the trade waste agreement renewals list before the Thursday meeting.
      description: Discovery tier (65) - primary phrase only
      synthetic: true
  should_not_match:
    - value: "180 Approvals for discharge of trade waste and seepage water (1) A sewerage service provider may give a person 1 or both of the following approvals: (a) an approval (a trade waste approval) to discharge trade waste into the sewerage infrastructure; (b) an approval (a seepage water approval) to discharge seepage water into the sewerage infrastructure."
      description: Legislation text (65 only)
    - value: "Trade waste fact sheet. Typical acceptance criteria for a trade waste approval: BOD 1,000 mg/L, suspended solids 500 mg/L, oil and grease 200 mg/L. Approval holder: the business that generates the waste. Contact council's trade waste officer to discuss sampling."
      description: Council guidance with a limits table (guidance exclusion)
    - value: "Trade waste permit application - blank template\nBusiness name: ______________\nPremises address: ______________\nApproval number: [office use]\nMaximum daily discharge (kL/day): ______"
      description: Blank application form
    - value: "Media release: council fines a food manufacturer after repeated trade waste discharges blocked the Carrow sewer main; the business has since installed a larger grease arrestor."
      description: News framing (65 only)
    - value: "Trade waste training exercise - approval number TW-9999-0001, approval holder Acme Widgets, BOD 900 mg/L."
      description: Training exercise (noise exclusion)
false_positives:
  - description: Council trade waste policies, acceptance criteria tables, fact sheets and application guides name the approval type and list discharge limits with units.
    mitigation: Enforce tiers need a populated approval number or holder/premises field; a guidance exclusion suppresses fact sheet, acceptance criteria, how to apply and application guide wording, and limits alone never reach 75.
  - description: Blank application and approval forms.
    mitigation: Blank lines, square-bracket and angle-bracket placeholders and n/a/tbc values are rejected; approval numbers must contain a digit.
  - description: Liquid waste transport dockets and environmental authority records that mention trade waste in passing.
    mitigation: These reach 75 only with a populated approval or premises field next to the trade waste phrase; deploy at 85 where waste-industry documents are common.
exports:
  - purview_xml
  - yaml
scope: narrow
purview:
  patterns_proximity: 300
  recommended_confidence: 85
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_au_qld_trade_waste_approval_record_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_trade_waste_approval_record_approval_ref
            - Regex_au_qld_trade_waste_approval_record_holder_field
        - ref: Regex_au_qld_trade_waste_approval_record_discharge_result
        - ref: Keyword_au_qld_trade_waste_approval_record_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_trade_waste_approval_record_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_au_qld_trade_waste_approval_record_primary
      matches:
        - type: any
          min_matches: 1
          refs:
            - Regex_au_qld_trade_waste_approval_record_approval_ref
            - Regex_au_qld_trade_waste_approval_record_holder_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_au_qld_trade_waste_approval_record_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_au_qld_trade_waste_approval_record_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_au_qld_trade_waste_approval_record_primary
      pattern: >-
        (?i)\b(?:trade\s+waste\s+(?:approvals?|permits?|licen[cs]es?|agreements?|applications?|category|categories|generators?|discharges?|plans?|customers?|inspections?)|seepage\s+water\s+approvals?)\b
    - id: Regex_au_qld_trade_waste_approval_record_approval_ref
      pattern: >-
        (?i)\b(?:(?:(?:trade\s+waste|seepage\s+water)\s+)?(?:approval|permit|licen[cs]e|agreement)(?:\s+(?:no\.?|number|ref(?:erence)?|ID))?\s*[:#]?\s*(?:[A-Z]{1,5}[\s/-]?)?\d[A-Z0-9/-]{3,20}|(?:trade\s+waste|seepage\s+water)\s+(?:approval|permit|licen[cs]e|agreement)\s+(?:[A-Z]{1,5}[\s/-]?)?\d[A-Z0-9/-]{3,20})\b
    - id: Regex_au_qld_trade_waste_approval_record_holder_field
      pattern: >-
        (?i)\b(?:approval\s+holder|permit\s+holder|licen[cs]e\s+holder|business\s+name|trading\s+name|company\s+name|(?:trade\s+waste\s+)?generator|occupier|premises(?:\s+address)?|site\s+address|discharge\s+location)(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9&'./,-]{1,40}(?:[ \t]+[A-Za-z0-9&'./,-]{1,30}){0,6}
    - id: Regex_au_qld_trade_waste_approval_record_discharge_result
      pattern: >-
        (?i)\b(?:BOD5?|COD|biochemical\s+oxygen\s+demand|chemical\s+oxygen\s+demand|(?:total\s+)?suspended\s+solids|TSS|FOG|fats?,?\s+oils?\s+(?:and|&)\s+grease|oil\s+(?:and|&)\s+grease|total\s+(?:nitrogen|phosphorus|dissolved\s+solids)|TKN|TDS|ammonia(?:\s+as\s+N)?|sulph?ate|sulfate|zinc|copper|nickel|chromium|(?:max(?:imum)?\s+)?daily\s+(?:discharge\s+)?(?:volume|quantity|flow|discharge)|(?:discharge|flow)\s+(?:volume|rate)|volume\s+discharged)[^\n\d]{0,25}\d{1,3}(?:,\d{3})?(?:\.\d{1,3})?\s{0,2}(?:mg/L|g/m3|kL/day|kL/d|kL|L/s|L/day|L/d|m3/day)\b
  keywords:
    - id: Keyword_au_qld_trade_waste_approval_record_corroborative
      groups:
        - match_style: word
          terms:
            - sampling
            - composite sample
            - grab sample
            - exceedance
            - exceeded
            - breach
            - non-compliance
            - noncompliance
            - grease arrestor
            - grease arrester
            - grease trap
            - pre-treatment
            - pretreatment
            - suspension
            - cancellation
            - show cause
            - conditions of approval
            - sewerage
            - sewer
      strength: specific
    - id: Keyword_au_qld_trade_waste_approval_record_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - fact sheet
            - factsheet
            - information sheet
            - frequently asked questions
            - how to apply
            - application guide
            - acceptance criteria
            - media release
      strength: specific
risk_rating: 5
risk_description: >-
  The classifier identifies a trade waste or seepage water approval, amendment or compliance record that ties a named business and premises to its approval number, discharge conditions, process chemistry, sampling results and breach history. Disclosure exposes commercially sensitive process and volume information and an operator's non-compliance record before any enforcement outcome, and gives insight into sewerage treatment loadings; it rarely identifies private individuals beyond business contacts. Guidance, acceptance criteria tables, legislation and blank forms are excluded from enforce tiers. Risk 5 supports OFFICIAL: Sensitive / SENSITIVE Commercial-in-Confidence.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Commercial-in-Confidence
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 5 is paired with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Commercial-in-Confidence and a Medium
    tier because, despite moderate risk, the record ties a named business to discharge limits, process chemistry,
    sampling and breach history. PROTECTED is not met: harm is commercial and reputational to one operator.
  generic:
    classification: Medium
    dlm: Medium Commercial-in-Confidence
    rationale: >-
      Medium Commercial-in-Confidence handling protects a business's process and non-compliance detail before any
      enforcement outcome. High is not met for one operator's approval.
references:
  - title: Water Supply (Safety and Reliability) Act 2008 (Qld) ch 2 pt 6 - s 180 approvals for discharge of trade waste and seepage water
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2008-034#sec.180
  - title: Water Supply (Safety and Reliability) Act 2008 (Qld) s 181 - approval may be conditional
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2008-034#sec.181
  - title: Water Supply (Safety and Reliability) Act 2008 (Qld) ss 182-185 - suspension, cancellation and amendment
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2008-034#sec.182
