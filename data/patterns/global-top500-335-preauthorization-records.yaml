schema: testpattern/v1
name: Preauthorization records
slug: global-top500-335-preauthorization-records
version: 1.3.2
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies patient prior-authorisation / pre-approval records - authorisation requests, coverage determinations and utilisation or medical-necessity reviews for a named patient - when the phrase sits with populated patient identifiers and authorisation fields. Health and insurance information under applicable data protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: prior authorisation / pre-authorisation / pre-approval request, insurance authorisation, coverage determination, medical necessity review, utilisation review, authorisation request. 65 (discovery only): phrase alone. 75: phrase plus a populated patient identifier field. 85: patient field plus a populated authorisation field (member/policy number, authorisation or claim number, CPT/HCPCS/MBS item, ICD-10 or diagnosis code, requested service, insurer, determination) plus independent decision evidence (approved, denied, pended, appeal, peer-to-peer, units requested, length of stay, step therapy). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:prior\s+authori[sz]ation|pre-?authori[sz]ation|pre-?approval\s+request|insurance\s+authori[sz]ation|coverage\s+determination|medical\s+necessity\s+review|utili[sz]ation\s+review|authori[sz]ation\s+request)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated patient identifier; 85 also needs an authorisation field and decision evidence. Payer policy pages and provider manuals carry the phrases without a patient record and stay at 65.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - Information Privacy Act 2009 (Qld)
  - GDPR
  - HIPAA
data_categories:
- healthcare
- phi
corroborative_evidence:
  keywords:
    - approved
    - denied
    - pended
    - appeal
    - peer-to-peer
    - units requested
  proximity: 300
test_cases:
  should_match:
    - value: "PRIOR AUTHORIZATION REQUEST\nPatient name: Avery Teston\nDOB: 04/02/1991\nMember ID: HFX44718202\nRequested service: MRI lumbar spine\nCPT code: 72148\nDiagnosis code: M54.16\nDetermination: pended for peer-to-peer review; clinical notes attached"
      description: Populated prior authorisation request with patient, authorisation fields and decision evidence (85)
      synthetic: true
    - value: "Utilization review note\nPatient: Casey Rourke\nMRN: 5540921\nReviewer to contact the treating team tomorrow."
      description: Utilisation review note with labelled patient identifiers only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "patient biometric"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how prior authorization requests are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Prior authorization request form\nPatient name: ____________________\nDate of birth: ____________________\nMember ID: ____________________\nRequested service: ____________________\nDiagnosis code: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "Training: this session explains when a prior authorization is required, how coverage determination timelines work and how providers lodge an appeal if a request is denied."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Medical terminology in health education materials, research publications, clinical guidelines, or public health
    documents without patient-specific data.
  mitigation: Require corroborative evidence keywords confirming patient context. Look for co-occurrence with patient identifiers
    such as medical record numbers or dates of birth.
- description: General wellness and fitness content using medical vocabulary without constituting protected health information.
  mitigation: Layer with patient identifier patterns or healthcare-specific document structure detection to distinguish clinical
    records from general health content.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  This regex finds prior-authorisation, coverage-determination and utilisation-review phrases and enforces only when populated patient identifier fields (with authorisation fields at 85) sit nearby; phrase-only text stays at 65 discovery. A true record can reveal the patient's identity, requested procedure or medicine, provider, insurer, and approval or denial, allowing condition inference and possible interference with access to care. The administrative record has credible privacy and financial consequences but usually less diagnostic depth than treatment notes, and policy guidance or blank forms can still match. Risk 6 and SENSITIVE are proportionate; risk 8 or PROTECTED requires detailed clinical justification, high-cost or stigmatized care, bulk payer records, or a safety-critical delay.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI Specified
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: CONFIDENTIAL
  ca_gov: Protected B
classification:
  tier: Medium
  rationale: >-
    Risk 6 aligns with PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, Personal-Privacy DLM, and Medium because an
    identified coverage decision reveals requested care and payer action. Risk 8 and PROTECTED are not met by an
    ordinary administrative authorization without detailed sensitive evidence, scale, or safety impact.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy suit a patient-linked authorization decision with limited clinical and
      financial disclosure. More detailed, aggregated, or urgent cases require stronger contextual handling.
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_preauthorization_records
      matches:
        - ref: Regex_global_top500_335_preauthorization_records_patient_fields
        - ref: Regex_global_top500_335_preauthorization_records_authorization_fields
        - ref: Keyword_global_top500_335_preauthorization_records_decision_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_335_preauthorization_records_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_preauthorization_records
      matches:
        - ref: Regex_global_top500_335_preauthorization_records_patient_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_335_preauthorization_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_preauthorization_records
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_preauthorization_records
      pattern: (?i)\b(?:prior\s+authori[sz]ation|pre-?authori[sz]ation|pre-?approval\s+request|insurance\s+authori[sz]ation|coverage\s+determination|medical\s+necessity\s+review|utili[sz]ation\s+review|authori[sz]ation\s+request)\b
    - id: Regex_global_top500_335_preauthorization_records_patient_fields
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|patient(?:\s+name)?|URN|UR\s*(?:no\.?|number)|MRN|medical\s+record\s+(?:no\.?|number)|Medicare(?:\s+(?:card\s+)?(?:no\.?|number))?|IHI|DVA\s+(?:no\.?|number)|(?:patient|client|hospital|case|file|episode)\s*(?:no\.?|number|ID)|(?:referring|treating|requesting)\s+(?:doctor|practitioner|clinician|psychiatrist)|clinician|consultant)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_335_preauthorization_records_authorization_fields
      pattern: (?i)\b(?:member\s*(?:no\.?|number|ID)|policy\s*(?:no\.?|number)|(?:authori[sz]ation|auth|approval|request|claim)\s*(?:no\.?|number|ID|ref(?:erence)?)|(?:CPT|HCPCS|MBS\s+item|item)\s*(?:code|no\.?|number)?|ICD-?10(?:-AM)?(?:\s+code)?|diagnosis(?:\s+code)?|requested\s+(?:service|procedure|medication)|health\s+fund|insurer|payer|determination|decision)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
  keywords:
    - id: Keyword_global_top500_335_preauthorization_records_decision_evidence
      groups:
        - match_style: word
          terms:
            - approved
            - denied
            - pended
            - appeal
            - peer-to-peer
            - units requested
            - length of stay
            - step therapy
            - formulary exception
            - clinical notes attached
      strength: specific
    - id: Keyword_global_top500_335_preauthorization_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
