schema: testpattern/v1
name: Australian Mining Geotechnical and Reserves Data
slug: au-mining-geotechnical-data
version: 1.0.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects Australian mining technical records - JORC Code resource and reserve
  estimates (Measured/Indicated/Inferred resources, Proved/Probable reserves,
  Competent Person statements), drill-and-blast design parameters (blast
  patterns, powder factor, maximum instantaneous charge, stemming), pit
  geotechnical stability assessments, and spelled-out mining tenement grants.
operation: >-
  Matches JORC Code documentation anchors and resource/reserve classification
  phrases, blast-engineering parameter vocabulary that only appears in drill
  and blast designs, geotechnical stability phrasing tied to pit/highwall/spoil
  context, and tenement-grant phrasing (mining lease / exploration permit /
  mineral development licence followed by a number). Abbreviated tenement codes
  (ML/EPC/MDL) are deliberately excluded - bare "ML 123" collides with
  millilitre notation.
pattern: >-
  \bJORC\s+(?:Code|Table\s?1|compliant|classification)\b|\bCompetent\s+Person\b[\s\S]{0,160}\b(?:resource|reserve)s?\b|\b(?:measured|indicated|inferred)\s+(?:mineral|coal)\s+resources?\b|\b(?:proved|probable)\s+(?:ore|coal|marketable)\s+reserves?\b|\bblast\s+(?:design|pattern|plan)\b|\bpowder\s+factor\b|\bmaximum\s+instantaneous\s+charge\b|\bstemming\s+(?:length|column|height)\b|\bburden\s+and\s+spacing\b|\bgeotechnical\b[\s\S]{0,80}\b(?:pit\s+wall|highwall|low\s?wall|slope\s+stability|factor\s+of\s+safety|spoil)\b|\b(?:mining\s+lease|exploration\s+permit(?:\s+for\s+coal)?|mineral\s+development\s+licence)\s+(?:no\.?\s?|number\s?)?\d{2,5}\b
confidence: medium
confidence_justification: >-
  Medium confidence: blast-design parameters and geotechnical stability phrasing
  are near-exclusive to operational mining engineering documents, which is the
  security-sensitive core of this pattern. The JORC arms are equally distinctive
  but JORC-compliant statements are routinely published in ASX announcements and
  annual reports, so enforcing tiers need corroboration and public-release
  framing rejection.
jurisdictions:
  - au
regulations:
  - "Security of Critical Infrastructure Act 2018 (Cth)"
  - "Mineral Resources Act 1989 (Qld)"
  - "Explosives Act 1999 (Qld)"
frameworks:
  - ISO 27001
data_categories:
  - infrastructure
  - business
  - intellectual-property
corroborative_evidence:
  keywords:
    - bench
    - overburden
    - detonator
    - initiation sequence
    - drillhole
    - drill and blast
    - tenement
    - resource model
    - strip ratio
    - pit design
  proximity: 300
test_cases:
  should_match:
    - value: 'the coal resource estimate was prepared by a Competent Person in accordance with the JORC Code 2012 reporting of Indicated resources'
      description: JORC Competent Person resource statement
    - value: 'Probable coal reserves of 42 Mt at the Wandoola Creek pit are supported by the current resource model'
      description: Reserve classification phrasing
    - value: 'blast design for bench 7 - powder factor 0.65 kg/m3, stemming length 3.2 m'
      description: Drill and blast parameters
    - value: 'geotechnical review flagged the highwall factor of safety below 1.3 after the wet season'
      description: Pit geotechnical stability assessment
    - value: 'operations are authorised under mining lease no. 1775 and the adjacent exploration permit for coal 830'
      description: Spelled-out tenement grants with numbers
  should_not_match:
    - value: administer 250 mL of saline; ML 5 syringe stocked in the first aid room
      description: Millilitre notation that abbreviated tenement codes would false-match
    - value: the geology club visited an open pit mine and saw the machinery
      description: General mining prose without technical parameters
    - value: measured customer resources were reallocated across the support team
      description: Resource wording outside the mineral classification sense
false_positives:
  - description: JORC-compliant resource and reserve statements are published in ASX
      releases, annual reports and investor presentations - the same wording as
      internal estimates.
    mitigation: Corroborate with operational keywords (bench, drillhole, pit design,
      resource model) and reject ASX-release framing from enforcing tiers; blast
      and geotechnical arms carry the security weight.
exports:
  - yaml
scope: narrow
risk_rating: 8
risk_description: >-
  Blast designs disclose explosive quantities, timing and placement at critical
  infrastructure sites; unpublished reserve estimates and pit stability
  assessments are market- and safety-sensitive. SOCI-relevant for mine-owning
  generators.
sensitivity_labels:
  - SENSITIVE
references:
  - "JORC Code 2012 - Australasian Code for Reporting of Exploration Results, Mineral Resources and Ore Reserves"
  - "AS 2187.2 Explosives - Storage and use - Use of explosives"
created: 2026-07-25
updated: 2026-07-25
changelog:
  - version: 1.0.0
    date: 2026-07-25
    note: Initial draft - AU mining-sector coverage gap (blast designs, reserves, geotech).
author: Compl8 (draft)
