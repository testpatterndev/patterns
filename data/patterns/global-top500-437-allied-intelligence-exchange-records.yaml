changelog:
- version: 1.4.0
  date: '2026-10-30'
  description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
- version: 1.3.0
  date: '2026-10-20'
  description: 'Generated name-word tier removed: the 85 and 75 tiers ANDed Pattern_*_label_context (the detector name, "Allied intelligence exchange records") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 85. Both lists sit inside the IdMatch phrase, so the bare name alone scored 85. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs 2 populated document header fields (Regex_global_top500_437_allied_intelligence_exchange_records_record_structure) or the kept independent term NOFORN plus one field; 85 needs 3 distinct fields. Curated terms that sit inside an IdMatch hit were removed. FVEY is the acronym of "Five Eyes" and is dropped; NOFORN (a dissemination marking) is kept. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
- version: 1.2.6
  date: '2026-09-25'
  description: >-
    Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
    reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
- version: 1.2.4
  date: '2026-09-24'
  description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
- version: 1.2.2
  date: '2026-07-15'
  description: v25 authoritative risk alignment from Compl8DLPDeploy workbook row 1978; detector and package metadata unchanged.
- version: 1.2.1
