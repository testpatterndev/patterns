schema: testpattern/v1
name: Allied intelligence exchange records
slug: global-top500-437-allied-intelligence-exchange-records
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: Identifies documents containing references to allied intelligence exchange records in international contexts.
  This information type is classified as personally identifiable information under applicable data protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific
  content. Corroborative evidence: 1 keywords within 240 characters. Uses additional domain-context evidence and explicit
  exclusion logic for template/sample/test text.'
pattern: (?is)\b(allied\s+intelligence|intelligence\s+sharing|Five\s+Eyes|intelligence\s+exchange|bilateral\s+agreement|liaison\s+report|coalition\s+intelligence|partner\s+nation|foreign\s+disclosure|releasable\s+to)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
  Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
- global
regulations:
  - GDPR
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
- pii
corroborative_evidence:
  keywords:
  - allied intelligence exchange records
  proximity: 240
test_cases:
  should_match:
  - value: allied intelligence
    description: Primary topic phrase match
  - value: intelligence sharing
    description: Case-insensitive topic phrase match
  - value: Five Eyes
    description: Alternative topic phrase match
  - value: intelligence exchange
    description: Additional topic phrase match
  - value: |-
      Allied intelligence
      To: Executive Committee
      From: Chief Risk Officer
    description: Populated document header with 2 fields (75 tier)
    synthetic: true
  - value: |-
      Allied intelligence
      To: Executive Committee
      From: Chief Risk Officer
      Date: 14 August 2026
    description: Populated document header with 3 distinct fields (85 tier)
    synthetic: true
  - value: |-
      Allied intelligence - NOFORN
      To: Executive Committee
    description: Kept independent term "NOFORN" with the phrase and one header field (75 tier)
    synthetic: true
  should_not_match:
  - value: unrelated generic text without domain phrases
    description: No relevant topic phrases present
  - value: placeholder value 12345
    description: Random text should not match topic-specific regex
  - value: classified contingency
    description: Generic word pair from old broad template should not match
  - value: Allied intelligence exchange records
    description: "Bare detector name: it reached 85 through the generated name-word tier and must not reach an enforcing tier"
  - value: |-
      Allied intelligence:
      To:
      From:
      Date:
      Subject:
    description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
  - value: "Policy guidance: this procedure explains how records about allied intelligence are handled, who may access them and how long they are kept. It contains no records about any person or system."
    description: Policy guidance naming the topic without any record (discovery only)
false_positives:
- description: Common words and phrases related to allied intelligence exchange records appearing in policy documents, training
    materials, HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 240
  recommended_confidence: 85
  shared_keywords:
  - dict: template-exclusion
    as: Keyword_noise_exclusion
    match_style: word
  pattern_tiers:
  - confidence_level: 85
    id_match: Regex_allied_intelligence_exchange
    matches:
      - ref: Regex_global_top500_437_allied_intelligence_exchange_records_record_structure
        min_count: 3
        unique_results: true
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 75
    id_match: Regex_allied_intelligence_exchange
    matches:
      - ref: Regex_global_top500_437_allied_intelligence_exchange_records_record_structure
        min_count: 2
        unique_results: true
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 75
    id_match: Regex_allied_intelligence_exchange
    matches:
      - ref: Keyword_allied_intelligence_exchange
      - ref: Regex_global_top500_437_allied_intelligence_exchange_records_record_structure
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  - confidence_level: 65
    discovery_only: true
    id_match: Regex_allied_intelligence_exchange
    matches:
      - type: any
        min_matches: 0
        max_matches: 0
        refs:
          - Keyword_noise_exclusion
  regexes:
  - id: Regex_allied_intelligence_exchange
    pattern: (?is)\b(allied\s+intelligence|intelligence\s+sharing|Five\s+Eyes|intelligence\s+exchange|bilateral\s+agreement|liaison\s+report|coalition\s+intelligence|partner\s+nation|foreign\s+disclosure|releasable\s+to)\b
  - id: Regex_global_top500_437_allied_intelligence_exchange_records_record_structure
    pattern: (?i)\b((?:To|From|Date|Subject|Re|Our\s+ref|Your\s+ref|File\s+(?:ref|no\.?|number)|Matter\s+(?:no\.?|number)|Prepared\s+by|Approved\s+by|Author|Version|Classification|Meeting\s+date|Agenda\s+item|originator|serial|DTG|report\s+(?:no\.?|number))\s*:\s*(?!(?:n/?a|tbc|tba)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}:)[A-Za-z0-9$])
  keywords:
  - id: Keyword_allied_intelligence_exchange
    groups:
    - match_style: word
      terms:
      - NOFORN
    strength: specific
risk_description: This concept detector recognises allied intelligence, intelligence sharing, Five Eyes, and intelligence-exchange
  records with nearby government context. A genuine exchange can reveal partner-provided assessments, dissemination relationships,
  caveats, and collection interests, causing diplomatic friction or reduced future sharing if disclosed. The ordinary bounded
  record creates serious government and trust harm, while the broad phrases do not prove protected sources, methods, or strategically
  significant content. For the global catalogue analogue, the confirmed substantive record is the consequence unit. Genuine
  partner intelligence may reveal originator information, caveats, sources, collection and dissemination decisions. Loss can
  expose capabilities and cause significant alliance and national-security damage. Risk 10 and PROTECTED Government therefore
  apply to the confirmed record itself. Require partner/originator markings, caveats, intelligence content or dissemination
  fields; public alliance discussion remains audit-only. This is confidence and exception handling, not a reason to reduce
  the consequence of a true positive.
sensitivity_labels:
  pspf: PROTECTED
  qgiscf: PROTECTED
  qgiscf_dlm: PROTECTED Government
  idcf: DSL-4
  us_gov: Secret
  uk_gov: SECRET
  nz_gov: SECRET
  ca_gov: Secret
classification:
  tier: High
  rationale: >-
    Risk 10 is warranted because genuine partner intelligence may reveal originator information, caveats, sources,
    collection and dissemination decisions. PSPF PROTECTED, QGISCF PROTECTED, PROTECTED Government, PROT_Gov, High and
    High Government align with that credible significant-damage case. The global expression carries the same consequence
    once its record structure and operational context are established. Require partner/originator markings, caveats,
    intelligence content or dissemination fields; public alliance discussion remains audit-only. Those controls govern
    match disposition while the confirmed record remains PROTECTED.
  generic:
    classification: High
    dlm: High Government
    rationale: >-
      High Government handling is appropriate because genuine partner intelligence may reveal originator information,
      caveats, sources, collection and dissemination decisions. Access should be restricted to personnel authorised for
      the relevant defence, intelligence, executive or statutory function. Global policy, historical and training
      references remain lower-confidence exceptions rather than lower-classified records.
frameworks:
  - ISO 27001
  - ISO 27701
