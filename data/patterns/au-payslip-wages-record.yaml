schema: testpattern/v1
name: Pay Slip or Time and Wages Record
slug: au-payslip-wages-record
version: 1.0.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Populated employee pay slips and payroll wage records: the Fair Work pay slip (employer name and ABN,
  employee name, pay period, date of payment, gross and net amounts, deductions, superannuation
  contributions, hourly rate or annual salary, loadings and allowances - Fair Work Regulations 2009
  regs 3.45-3.46) and the Queensland time and wages record kept by state and local government and
  other state-system employers (Industrial Relations Act 2016 (Qld) ss 339-340).
operation: >-
  Primary: a pay slip or payroll record phrase (pay slip / payslip, pay advice, earnings statement,
  salary or wage slip, payroll statement / advice / record / register, wages record / book / sheet,
  time and wages record). 65 is discovery-only (phrase alone) and surfaces guidance, award pay guides,
  marketing and blank forms. 75 requires the phrase plus a gross/net/total amount field with a dollar
  value, plus either a pay period / pay date / week-ending field with a date or an earnings line with a
  dollar value. 85 requires the phrase, the gross/net amount, an earnings line (ordinary hours, hourly
  rate, overtime, allowance, leave loading, base pay, annual salary with a dollar value), a deduction or
  superannuation line with a dollar value (PAYG / tax withheld, salary sacrifice, union fees, super
  guarantee), and a populated employee identity field (employee name, employee / staff / payroll number,
  TFN). Every enforce tier excludes template/fixture text and pay-slip guidance, pay guide and payroll
  software marketing wording.
pattern: (?i)\b(?:pay\s*slips?|pay\s+advices?|earnings\s+statements?|(?:salary|wages?)\s+(?:slips?|advices?)|payroll\s+(?:statements?|advices?|records?|registers?)|wages?\s+(?:records?|books?|sheets?)|time\s+and\s+wages\s+records?)\b
confidence: medium
confidence_justification: >-
  Medium: a pay slip is a dense labelled form, and the enforce tiers need dollar values against
  gross/net, earnings and deduction labels, which guidance, pay guides and blank forms do not carry.
  Payroll journals, costing spreadsheets and bank remittance advices can carry the same labels and
  amounts and may reach 75 when a pay slip phrase is nearby. 85/75 are heuristic evidence tiers, not
  measured accuracy; tests are synthetic records laid out like FW and Qld wage records.
jurisdictions:
  - au
regulations:
  - Fair Work Act 2009 (Cth)
  - Fair Work Regulations 2009 (Cth)
  - Industrial Relations Act 2016 (Qld)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
  - QGISCF
data_categories:
  - pii
  - financial
corroborative_evidence:
  keywords:
    - gross pay
    - net pay
    - pay period
    - PAYG
    - superannuation
    - ordinary hours
    - hourly rate
    - year to date
  proximity: 300
customisation:
  - key: employee-id
    kind: identifier-format
    identifier: employee-id
    target: purview.regexes/Regex_payslip_employee_identity
    mode: extend
    affects_tiers:
      - 85
    required_for_enforcement: false
    note: >-
      Extend the labelled-field evidence with the customer's employee / staff id format (see docs/identifiers.md#employee-id). The public fallback is the documented label-anchored regex, so the classifier works without customisation at lower precision.
test_cases:
  should_match:
    - value: "PAY SLIP\nEmployer: Riverbend Water Services Pty Ltd  ABN: 62 419 800 317\nEmployee: Casey Testperson  Employee ID: E204118\nPay period: 29/09/2026 to 12/10/2026  Pay date: 15/10/2026\nOrdinary hours 76.00 @ $38.42  $2,919.92\nShift allowance  $146.00\nGross pay: $3,065.92\nPAYG tax withheld: $612.00\nSalary sacrifice: $150.00\nNet pay: $2,303.92\nSuperannuation guarantee (12%): $350.39 to fund member no. 800123456"
      description: 85 - FW pay slip with employee identity, earnings lines, deductions and super, gross and net amounts
      synthetic: true
    - value: "Time and wages record - Northbank Regional Council\nEmployee name: Jordan Examplar  Employee no: 44810  Date of birth: 03/04/1991\nDesignation: Plant Operator Level 4\nWeek ending 11/10/2026: ordinary time 38 hrs, hourly rate $36.10 = $1,371.80\nOvertime 1.5x 4 hrs $216.60\nGross wages: $1,588.40\nIncome tax: $301.00  Union fees: $12.40\nSuper contribution: $190.61\nSick leave credited: 7.6 hrs"
      description: 85 - Qld IR Act time and wages record with employee identity, earnings, deductions and super
      synthetic: true
    - value: "Payroll statement for pay period ending 10/10/2026 - Net pay: $1,842.17 deposited to account ending 4410."
      description: 75 - payroll statement with pay period date and net amount, no identity or deduction lines
      synthetic: true
    - value: "Your payslip for 01/10/2026 - 14/10/2026 is attached. Gross pay $4,210.00, Net pay $3,118.40. Pay date: 16/10/2026."
      description: 75 - payslip notification with gross/net amounts and pay date
      synthetic: true
  should_not_match:
    - value: "Pay slips must include the employer's name and ABN, the employee's name, the pay period, the date of payment, the gross and net amounts paid, any deductions, the hourly rate or annual salary, and any superannuation contributions (Fair Work Regulations 2009 reg 3.46)."
      description: Fair Work pay slip content guidance (65 discovery at most)
    - value: "Schedule A - Pay rates from the first full pay period on or after 01/07/2026. Level 1 hourly rate $26.73; Level 2 hourly rate $27.85; Level 5 annual salary $68,450. Casual loading 25%. New rates will show on your payslip."
      description: Enterprise agreement / award pay-rate table
    - value: "Generate compliant payslips in seconds. Our payroll software calculates gross pay, net pay, PAYG and super automatically and emails every pay slip to staff. Start a free trial today."
      description: Payroll software marketing
    - value: "PAY SLIP\nEmployer: ____________ ABN: ____________\nEmployee: ____________\nPay period: __/__/____ to __/__/____\nGross pay: $________\nPAYG tax withheld: $________\nNet pay: $________\nSuperannuation: $________"
      description: Blank pay slip form
    - value: "Staff at the cafe chain were given pay slips showing net pay of $412.50 for a 38-hour week, the regulator said in its wage underpayment case."
      description: News report quoting a pay slip amount
false_positives:
  - description: Fair Work Ombudsman and OIR guidance on pay slip and time and wages record content.
    mitigation: Guidance lists the field names without dollar values; enforce tiers need populated amounts. Pay-slip guidance wording is also excluded.
  - description: Award and enterprise agreement pay-rate tables and pay guides.
    mitigation: Rate tables have hourly rates but no gross/net amount field, so they stay below 75; pay guide wording is excluded.
  - description: Payroll software marketing and blank pay slip forms.
    mitigation: No dollar values against gross/net labels; marketing and template wording is excluded.
  - description: Payroll journals, cost-centre reports and remittance advices that repeat gross/net labels with amounts near the word payroll record or pay advice.
    mitigation: These are usually still personal pay data; 85 additionally requires an employee identity field plus separate earnings and deduction lines.
exports:
  - purview_xml
  - yaml
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_payslip_primary
      matches:
        - ref: Regex_payslip_amount_field
        - ref: Regex_payslip_earnings_line
        - ref: Regex_payslip_deduction_super
        - ref: Regex_payslip_employee_identity
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_payslip_exclusion
    - confidence_level: 75
      id_match: Regex_payslip_primary
      matches:
        - ref: Regex_payslip_amount_field
        - type: any
          min_matches: 1
          refs:
            - Regex_payslip_period_field
            - Regex_payslip_earnings_line
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_payslip_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_payslip_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_payslip_primary
      pattern: >-
        (?i)\b(?:pay\s*slips?|pay\s+advices?|earnings\s+statements?|(?:salary|wages?)\s+(?:slips?|advices?)|payroll\s+(?:statements?|advices?|records?|registers?)|wages?\s+(?:records?|books?|sheets?)|time\s+and\s+wages\s+records?)\b
    - id: Regex_payslip_amount_field
      pattern: >-
        (?i)\b(?:gross|net|total)\s+(?:pay|earnings|wages?|salary|payment|amount\s+paid)(?:\s+(?:this\s+(?:period|pay)|YTD))?[ \t]{0,3}[:=]?[ \t]{0,3}\$[ \t]?\d{1,3}(?:,\d{3}){0,3}(?:\.\d{2})?
    - id: Regex_payslip_period_field
      pattern: >-
        (?i)\b(?:pay\s+period(?:\s+(?:ending|from|start(?:ing)?|end(?:ing)?))?|period\s+(?:ending|from)|pay\s+date|date\s+(?:of\s+)?payment|payment\s+date|paid\s+on|week\s+ending|fortnight\s+ending)[ \t]{0,3}[:\-]?[ \t]{0,3}(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]{0,6}\s+\d{4})
    - id: Regex_payslip_earnings_line
      pattern: >-
        (?i)\b(?:ordinary\s+(?:hours|time|pay)|overtime|annual\s+leave(?:\s+loading)?|leave\s+loading|personal\s+leave|sick\s+leave|public\s+holiday|shift\s+(?:allowance|penalty|loading)|[a-z]{2,20}\s+allowance|penalty\s+rates?|base\s+(?:pay|salary)|hourly\s+rate|annual\s+salary|casual\s+loading)\b[^\n$]{0,40}\$[ \t]?\d{1,3}(?:,\d{3}){0,3}(?:\.\d{2})?
    - id: Regex_payslip_deduction_super
      pattern: >-
        (?i)\b(?:PAYG(?:\s+(?:tax|withholding))?|tax\s+withheld|income\s+tax|deductions?|salary\s+sacrifice|union\s+(?:fees|dues)|child\s+support|HELP\s+repayment|super(?:annuation)?(?:\s+(?:guarantee|contributions?|SG))?|SGC|employer\s+super)(?:[ \t]{0,2}\(\d{1,2}(?:\.\d{1,2})?%\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}\$[ \t]?\d{1,3}(?:,\d{3}){0,3}(?:\.\d{2})?
    - id: Regex_payslip_employee_identity
      pattern: >-
        (?i)\b(?:(?:employee|staff|worker|payee|payroll)(?:\s+(?:name|no\.?|number|ID|#))?|tax\s+file\s+number|TFN)\s*[:#]\s*(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]+(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
  keywords:
    - id: Keyword_payslip_exclusion
      groups:
        - match_style: word
          terms:
            - pay slips must
            - pay slip must
            - payslips must
            - must include
            - pay guide
            - pay guides
            - minimum rates
            - free trial
            - book a demo
            - payroll software
            - record-keeping and pay slips
            - fact sheet
      strength: specific
risk_rating: 6
risk_description: >-
  A populated pay slip or time and wages record ties a named employee to their income, hourly rate or
  salary, tax withheld, salary sacrifice, union fees, child support deductions and super fund, and
  often to leave types that reveal health or family circumstances. Disclosure enables identity and
  payroll fraud (bank change scams, false income evidence), exposes union membership and garnishee
  orders, and breaches the employer's record-keeping obligations. It is one person's data per slip;
  bulk payroll files with TFNs and bank details are covered at higher risk by
  payroll-master-file-with-tax-file-numbers. Risk 6 supports OFFICIAL: Sensitive / SENSITIVE
  Personal-Privacy.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
references:
  - title: Fair Work Regulations 2009 (Cth) - regs 3.31-3.46 (employee records, pay slips)
    url: https://www.legislation.gov.au/F2009L02356/latest/text
  - title: Fair Work Act 2009 (Cth) s 536 - employer obligations in relation to pay slips (AustLII)
    url: https://classic.austlii.edu.au/au/legis/cth/consol_act/fwa2009114/s536.html
  - title: Fair Work Ombudsman - Record-keeping and pay slips fact sheet
    url: https://www.fairwork.gov.au/tools-and-resources/fact-sheets/rights-and-obligations/record-keeping-pay-slips
  - title: Industrial Relations Act 2016 (Qld) s 339 - time and wages record (AustLII)
    url: https://classic.austlii.edu.au/au/legis/qld/consol_act/ira2016242/s339.html
created: '2026-09-24'
updated: '2026-09-24'
changelog:
  - version: 1.0.0
    date: '2026-09-24'
    description: >-
      Initial release - pay slip / time and wages record gated on populated dollar amounts; 85 needs
      earnings and deduction/super lines plus an employee identity field.
