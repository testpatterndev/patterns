changelog:
- version: 1.4.1
  date: '2026-09-24'
  description: "Metadata quality pass (2026-09-24): removed regulation tags that do not apply (AML/CTF Act (Cth)); added 3 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
- version: 1.4.0
  date: '2026-09-24'
  description: 'Merge global-top500-403-mugshot-image-repositories into this classifier (Qld government classifier review
    2026-09-24): rebuilt as police identifying-particulars records inside criminal history. Primary gains identifying particulars,
    mugshot, booking / arrest / custody / inmate / detainee / prisoner photograph phrases; record-structure regex gains generic
    labelled fields for photograph / photo index / image numbers, fingerprint form numbers, CNI / QPRIME / person / offender
    numbers and "fingerprints / photographs / identifying particulars taken". No person-number formats were invented (labelled
    fields only). Not imported: facial image, image repository, biometric image, photo lineup and identification photo (generic
    photo / biometrics vocabulary), and the absorbed self-corroborating label/domain keyword tiers. Replaced the bare-phrase
    positives with populated records (3 at 85, 1 at 75) and added news, blank consent form and training decoys; dropped the
    legacy "mugshot victim" negative (mugshot is now a legitimate discovery phrase). Risk unchanged at 8.'
- version: 1.3.0
  date: '2026-09-24'
  description: "75-tier gating fix: the 75 tier was corroborated only by the primary's own phrase list, so it enforced on topic mentions in policy, news and training text. 75 now requires independent justice record structure (Regex ..._record_structure); 85 requires 2 distinct structure hits. Phrase-only matches stay at 65 discovery. Removed evidence no longer referenced by any tier. Added a populated positive and a guidance decoy."
- version: 1.2.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1946 without changing
    detector or package metadata.'
- version: 1.2.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.1.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical
    tier.
