schema: testpattern/v1
name: Contractor tax forms
slug: global-top500-085-contractor-tax-forms
version: 1.3.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects completed contractor tax forms and reports: ATO taxable payments annual report (TPAR) rows, PAYG withholding voluntary agreements, statements by a supplier (no-ABN withholding), US Form 1099-NEC/W-9 and contractor payment statements, with a named payee plus payment amounts or ABN.
operation: >-
  Primary: a contractor tax form phrase (taxable payments annual report / TPAR, PAYG withholding voluntary agreement, statement by a supplier, no-ABN withholding, Form 1099-NEC/MISC, Form W-9, contractor payment declaration/statement). Generic "tax invoice", "independent contractor" and "contractor agreement" were removed. 75 tier requires a populated payee field (contractor/supplier/subcontractor/recipient/payee name or employee-style ID) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated payment detail (gross amount paid, GST, tax withheld, nonemployee compensation) or a labelled payee ABN and an independent corroborative term (payer, ATO, IRS, lodged, lodgment, withholding rate, financial/tax year). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:contractor\s+tax\s+forms?|taxable\s+payments\s+annual\s+report|TPAR|(?:PAYG\s+withholding\s+)?voluntary\s+agreement|statement\s+by\s+a\s+supplier|no[\s-]ABN\s+withholding|Form\s+1099-(?:NEC|MISC)|Form\s+W-9|request\s+for\s+taxpayer\s+identification\s+number|contractor\s+(?:payment\s+)?(?:declaration|statement|summary)|subcontractor\s+payment\s+(?:statement|summary|schedule))\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - au
  - global
regulations:
  - Taxation Administration Act 1953 (Cth)
  - Privacy Act 1988 (Cth)
  - IPA 2009 (Qld)
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - pii
corroborative_evidence:
  keywords:
    - payer
    - ATO
    - IRS
    - lodged
    - lodgment
    - withholding rate
    - financial year
    - tax year
    - building and construction
  proximity: 300
test_cases:
  should_match:
    - value: "Taxable payments annual report 2025-26\nPayee name: Riley Teston\nPayee ABN: 12 345 678 901\nGross amount paid: $48,250.00\nGST: $4,825.00\nTax withheld: $0.00\nLodged by the payer through ATO online services."
      description: "85: TPAR row with payee, ABN, gross paid, GST and payer lodgment"
      synthetic: true
    - value: "Form 1099-NEC 2025\nRecipient's name: Jordan Staffson\nNonemployee compensation: $18,400.00\nPayer: Harbour Analytics LLC, tax year 2025"
      description: "85: Form 1099-NEC with recipient, compensation and payer"
      synthetic: true
    - value: "PAYG withholding voluntary agreement\nContractor name: Casey Teston\nThe contractor has asked us to withhold tax from their payments; signed copy on file."
      description: "75: voluntary agreement naming the contractor, no amounts"
      synthetic: true
    - value: "taxable payments annual report"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "Businesses that pay contractors for building and construction services must lodge a taxable payments annual report by 28 August. This fact sheet explains what to report."
      description: "ATO-style guidance - must stay at or below 65"
    - value: "Statement by a supplier\nSupplier name: __________\nABN: __________\nReason for not quoting an ABN: __________"
      description: "Blank statement by a supplier - must stay at or below 65"
    - value: "Our accounting software prepares your TPAR automatically. Book a demo today."
      description: "Software marketing - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Supplier onboarding forms that list company (not individual) payees."
    mitigation: "Accepted: sole-trader and company payees look the same; the pattern stays risk 4 and 85 needs amounts plus corroboration."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_085_contractor_tax_forms_primary
      matches:
        - ref: Regex_top500_085_contractor_tax_forms_payee_field
        - ref: Regex_top500_085_contractor_tax_forms_payment_detail
        - ref: Keyword_top500_085_contractor_tax_forms_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_085_contractor_tax_forms_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_085_contractor_tax_forms_primary
      matches:
        - ref: Regex_top500_085_contractor_tax_forms_payee_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_085_contractor_tax_forms_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_085_contractor_tax_forms_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_085_contractor_tax_forms_primary
      pattern: >-
        (?i)\b(?:contractor\s+tax\s+forms?|taxable\s+payments\s+annual\s+report|TPAR|(?:PAYG\s+withholding\s+)?voluntary\s+agreement|statement\s+by\s+a\s+supplier|no[\s-]ABN\s+withholding|Form\s+1099-(?:NEC|MISC)|Form\s+W-9|request\s+for\s+taxpayer\s+identification\s+number|contractor\s+(?:payment\s+)?(?:declaration|statement|summary)|subcontractor\s+payment\s+(?:statement|summary|schedule))\b
    - id: Regex_top500_085_contractor_tax_forms_payee_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?|(?:contractor|supplier|subcontractor|recipient'?s?|worker|business)\s+(?:name|legal\s+name)|contractor|supplier|subcontractor|recipient'?s?\s+name|payee\s+(?:ABN|TIN))(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_085_contractor_tax_forms_payment_detail
      pattern: >-
        (?i)\b(?:gross\s+(?:amount\s+)?paid|total\s+(?:gross\s+)?(?:payments?|paid)|amount\s+paid|nonemployee\s+compensation|GST|(?:total\s+)?tax\s+withheld|amount\s+withheld|payments?\s+made|invoice\s+total)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?|\b(?:payee|contractor|supplier|subcontractor)\s+ABN[ \t]{0,3}[:#]?[ \t]{0,3}\d{2}[ ]?\d{3}[ ]?\d{3}[ ]?\d{3}\b
  keywords:
    - id: Keyword_top500_085_contractor_tax_forms_corroborative
      groups:
        - match_style: word
          terms:
            - payer
            - text: ATO
              case_sensitive: true
            - text: IRS
              case_sensitive: true
            - lodged
            - lodgment
            - withholding rate
            - financial year
            - tax year
            - building and construction
      strength: specific
    - id: Keyword_top500_085_contractor_tax_forms_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - you must lodge
            - you need to lodge
            - who needs to lodge
            - payroll software
            - accounting software
            - book a demo
            - free trial
      strength: domain
risk_description: >-
  The classifier identifies completed contractor tax forms or TPAR rows naming a payee (75) with payment amounts or ABN (85). For sole traders these reveal income and tax identifiers of an individual; for companies they are commercial data. Guidance, blank forms and marketing stay at 65. Risk 4 supports OFFICIAL.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: "Taxation Administration Act 1953 (Cth)"
    url: https://www.legislation.gov.au/C1953A00001/latest/text
  - title: "ATO - Taxable payments annual report"
    url: https://www.ato.gov.au/businesses-and-organisations/preparing-lodging-and-paying/reports-and-returns/taxable-payments-annual-report
  - title: "ATO - PAYG withholding voluntary agreement"
    url: https://www.ato.gov.au/forms-and-instructions/payg-withholding-voluntary-agreement
  - title: "ATO - PAYG withholding"
    url: https://www.ato.gov.au/businesses-and-organisations/hiring-and-paying-your-workers/payg-withholding
  - title: "Fair Work Ombudsman - Independent contractors"
    url: https://www.fairwork.gov.au/find-help-for/independent-contractors
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
