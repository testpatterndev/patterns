schema: testpattern/v1
name: Consent audit trail records
slug: global-top500-470-consent-audit-trail-records
version: 1.5.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to consent audit trail records in Australian contexts. This information type is classified as personally identifiable information under applicable data
  protection regulations.
operation: 'Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 8 keywords within 300 characters.'
pattern: (?is)\b(consent\s+audit\s+trail\s+records|consent\s+audit|consent\s+record|consent\s+withdrawal|consent\s+timestamp|consent\s+management|data\s+subject|privacy\s+notice)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection.
jurisdictions:
  - global
regulations:
  - Information Privacy Act 2009 (Qld)
  - NDB Scheme (Cth)
  - Privacy Act 1988 (Cth)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - consent audit trail records
    - consent
    - audit
    - trail
    - records
    - privacy
    - compliance
    - risk
  proximity: 300
test_cases:
  should_match:
    - value: consent audit trail records
      description: Primary topic phrase match
    - value: consent audit
      description: Case-insensitive topic phrase match
    - value: consent record
      description: Alternative topic phrase match
    - value: consent withdrawal
      description: Additional topic phrase match
    - value: |-
        Consent audit trail records
        Name: Avery Teston
        Date of birth: 14/02/1988
        Client number: C4471820
      description: Populated person/client record reaching the 75/85 structure gate
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: data inventory compliance
      description: Generic word pair from old broad template should not match
    - value: |-
        Consent audit trail records:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about consent audit trail records are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to consent audit trail records appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: In Australian English, similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Evidence_template_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Pattern_consent_audit
      matches:
        - ref: Regex_global_top500_470_consent_audit_trail_records_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 75
      id_match: Pattern_consent_audit
      matches:
        - type: any
          min_matches: 1
          refs:
            - Evidence_consent_audit
            - Regex_global_top500_470_consent_audit_trail_records_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Evidence_template_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Pattern_consent_audit
  regexes:
    - id: Pattern_consent_audit
      pattern: (?is)\b(consent\s+audit\s+trail\s+records|consent\s+audit|consent\s+record|consent\s+withdrawal|consent\s+timestamp|consent\s+management|data\s+subject|privacy\s+notice)\b
    - id: Regex_global_top500_470_consent_audit_trail_records_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
  keywords:
    - id: Evidence_consent_audit
      groups:
        - match_style: word
          terms:
            - opt-in
            - opt-out
risk_description: >-
  The regex finds consent audit trails, consent records, withdrawals, opt-in or opt-out events, timestamps, lawful basis, and preference-management language without requiring a complete identified history. One genuine event can reveal a person's limited processing or communication choice and may support nuisance contact or minor compliance misuse, but consequential harm needs identity and service context. The ordinary unit is a bounded event or governance record, with policies and blank consent logs generating similar phrases. Risk 5 OFFICIAL is suitable; SENSITIVE is not met without a large identified log, sensitive-service choices, or linked behavioural and account data.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  idcf: DSL-2
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 5 maps to OFFICIAL because an ordinary consent event discloses a limited preference or lawful-basis record and
    requires identity or service context for material misuse. SENSITIVE is not met without aggregation, identified
    sensitive choices, or linked behavioural and account information.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Generic Low handling fits a single consent status or timestamp whose practical privacy impact is bounded unless it
      is joined to identities and sensitive services.
references:
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "OAIC - Notifiable Data Breaches scheme"
    url: https://www.oaic.gov.au/privacy/notifiable-data-breaches
