schema: testpattern/v1
name: Recommendation letters
slug: global-top500-351-recommendation-letters
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies recommendation and reference letters about a named person - letters of recommendation or reference, referee reports and academic, character, professional or supervisor references - when the phrase sits with a named candidate and letter structure.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: recommendation letter(s), letter of recommendation or reference, referee report, academic/character/professional/supervisor reference, faculty recommendation. 65 (discovery only): phrase alone. 75: phrase plus a named candidate - a populated candidate/applicant/student/position field or an 'I have known <Name> for/since' statement. 85: candidate evidence plus letter structure (addressed to a selection/admissions/hiring committee or panel, 'To whom it may concern', or a 'Yours sincerely/faithfully' close) plus independent evaluative language (strongly/highly recommend, without reservation, in the top ..., work ethic, research potential, intellectual curiosity). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:recommendation\s+letters?|letters?\s+of\s+(?:recommendation|reference)|referee\s+report|(?:academic|character|professional|supervisor)\s+reference|faculty\s+recommendation)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a named candidate; 85 also needs letter structure and evaluative language. Referee guidance, reference-check policies and job ads stay at 65; unframed fictional letters can still reach enforce tiers.
jurisdictions:
- global
frameworks:
  - ISO 27001
  - ISO 27701
regulations:
  - Privacy Act 1988 (Cth)
  - NDB Scheme (Cth)
  - GDPR
  - FERPA
data_categories:
- pii
corroborative_evidence:
  keywords:
    - strongly recommend
    - highly recommend
    - without reservation
    - work ethic
    - research potential
    - intellectual curiosity
  proximity: 300
test_cases:
  should_match:
    - value: "Letter of recommendation\nDear Admissions Committee,\nI have known Avery Teston since 2023, when she joined my honours seminar. She ranks in the top 2 percent of students I have supervised and shows real research potential. I recommend her without reservation.\nYours sincerely,\nDr Jordan Staffson"
      description: Populated recommendation letter with a named candidate, letter structure and evaluative language (85)
      synthetic: true
    - value: "Referee report\nCandidate: Casey Rourke\nPosition applied for: Research Officer"
      description: Referee report header with a named candidate only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "student grant"
      description: Generic word pair from old broad template should not match
    - value: "reference check results"
      description: Generic vendor/HR term removed from the regex (2026-07 FP fix) after proving overbroad — matched in unrelated vendor due-diligence decoy documents
    - value: "personal statement"
      description: Generic term removed from the regex (2026-07 FP fix) — not specific to the recommendation-letters domain
    - value: "Policy guidance: this procedure explains how recommendation letters and referee reports are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Referee report\nCandidate name: ____________________\nPosition applied for: ____________________\nReferee name: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "Training: this careers workshop explains how to ask for a letter of recommendation, what makes a strong academic reference and why you should thank your referees."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Common words and phrases related to recommendation letters appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
risk_description: >-
  The regex identifies recommendation letters, referee reports and academic or character references and enforces only when a named candidate is present; guidance on requesting references stays at 65 discovery. A real letter contains candid judgments about a named person's performance, character, weaknesses, and suitability, so disclosure can damage trust with the referee or unfairly affect admission and employment decisions. Harm is serious for the subject and author but normally confined to one application and can be addressed through process safeguards. Risk 8 and SENSITIVE Personal-Privacy are appropriate; PROTECTED would require protected-source information, acute safety consequences, or bulk compromise of confidential references.
sensitivity_labels:
  pspf: 'OFFICIAL: Sensitive'
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_recommendation_letters
      matches:
        - ref: Regex_global_top500_351_recommendation_letters_candidate
        - ref: Regex_global_top500_351_recommendation_letters_letter_structure
        - ref: Keyword_global_top500_351_recommendation_letters_evaluative_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_351_recommendation_letters_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_recommendation_letters
      matches:
        - ref: Regex_global_top500_351_recommendation_letters_candidate
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_351_recommendation_letters_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_recommendation_letters
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_recommendation_letters
      pattern: (?i)\b(?:recommendation\s+letters?|letters?\s+of\s+(?:recommendation|reference)|referee\s+report|(?:academic|character|professional|supervisor)\s+reference|faculty\s+recommendation)\b
    - id: Regex_global_top500_351_recommendation_letters_candidate
      pattern: (?i)\b(?:name|full\s+name|surname|family\s+name|given\s+names?|preferred\s+name|date\s+of\s+birth|DOB|candidate(?:\s+name)?|applicant(?:\s+name)?|student(?:\s+name)?|position(?:\s+applied\s+for)?|program(?:me)?\s+applied\s+for)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}|\bI\s+have\s+known\s+(?:Mr\.?\s+|Ms\.?\s+|Mrs\.?\s+|Dr\.?\s+)?[A-Z][a-z]{1,20}(?:\s+[A-Z][a-z]{1,20})?\s+(?:for|since)\b
    - id: Regex_global_top500_351_recommendation_letters_letter_structure
      pattern: (?i)\b(?:Dear\s+(?:Selection|Admissions|Hiring|Scholarship|Recruitment)\s+(?:Committee|Panel|Manager)|To\s+whom\s+it\s+may\s+concern|Yours\s+(?:sincerely|faithfully))\b
  keywords:
    - id: Keyword_global_top500_351_recommendation_letters_evaluative_evidence
      groups:
        - match_style: word
          terms:
            - strongly recommend
            - highly recommend
            - without reservation
            - in the top
            - work ethic
            - research potential
            - intellectual curiosity
            - best student
      strength: specific
    - id: Keyword_global_top500_351_recommendation_letters_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
created: '2026-02-08'
updated: '2026-09-24'
changelog:
- version: 1.4.0
  date: '2026-09-24'
  description: "Quality pass (2026-09-24): rebuilt tiers - the old 75/85 fired on the primary phrase alone. 75 now needs a named candidate (populated candidate field or an 'I have known <Name>' statement) and 85 needs candidate evidence plus letter structure plus evaluative language. Bare-phrase tests replaced with a populated letter and referee report plus policy, blank-form and training decoys. Regulations: removed AML/CTF Act, HRIPA, My Health Records Act, IPA and TIA Act; added FERPA; frameworks added; expired HESF 2015 reference replaced."
- version: 1.3.1
  date: '2026-07-14'
  description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 1897 without changing
    detector or package metadata.'
- version: 1.3.0
  date: '2026-07-09'
  description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are
    scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived
    by scripts/derive-pattern-class.mjs + spot review'
- version: 1.2.1
  date: '2026-07-09'
  description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context,
    generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead
    weight to compiled purview.keywords (no behavior change)'
- version: 1.2.0
  date: '2026-07-04'
  description: 'Narrow overbroad phrases (FALSE_POSITIVE verdict: ps=ph=0, decoy false-fire) and align regex with positive
    test values: add plural recommendation\s+letters? (docs use plural exclusively), remove overbroad reference\s+check (88
    hits in unrelated vendor decoy) and personal\s+statement'
- version: 1.1.0
  date: '2026-07-04'
  description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical
    tier.
