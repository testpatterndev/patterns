schema: testpattern/v1
name: Laboratory protocol records
slug: global-top500-359-laboratory-protocol-records
version: 1.3.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies internal laboratory protocol records - laboratory protocols, lab notebooks, experiment logs, reagent preparation records and lab records - when the phrase sits with populated protocol/experiment record fields and experimental quantities. Research know-how rather than personal information.
operation: >-
  Pattern type: regex (boost_regex engine). Primary: laboratory protocol, lab(oratory) notebook, experiment(al) log, reagent preparation, lab record, lab procedure, standard operating procedure. 65 (discovery only): phrase alone - published SOPs, safety guidance and training stay here. 75: phrase plus a populated record field (protocol/SOP/experiment/notebook/project/batch/lot/sample/run number, protocol version, performed/recorded/approved/reviewed by, researcher, analyst, operator, date performed). 85: record field plus an experimental quantity (volume, mass, concentration, rpm or g-force with units) plus independent bench evidence (centrifuge, incubate, aliquot, buffer, PCR, pipette, vortex, supernatant, autoclave). Template and guidance/training framing excluded from 75/85.
pattern: (?i)\b(?:laboratory\s+protocol|lab(?:oratory)?\s+notebook|experiment(?:al)?\s+log|reagent\s+preparation|lab\s+record|lab\s+procedure|standard\s+operating\s+procedure)\b
confidence: medium
confidence_justification: >-
  Medium: enforce tiers need a populated record field; 85 also needs an experimental quantity and bench evidence. Published protocols in journals and training material can still reach 75 when they carry version/approval fields, so this remains a low-risk business classifier.
jurisdictions:
- global
frameworks:
  - ISO 27001
regulations:
  - Patents Act 1990 (Cth)
  - Privacy Act 1988 (Cth)
data_categories:
  - intellectual-property
  - business
corroborative_evidence:
  keywords:
    - centrifuge
    - incubate
    - aliquot
    - buffer
    - PCR
    - supernatant
  proximity: 300
test_cases:
  should_match:
    - value: "Lab notebook entry\nExperiment ID: EXP-2026-0917\nPerformed by: Casey Rourke\nDate performed: 16/09/2026\nLyse cells in 500 uL buffer, centrifuge at 12000 x g for 10 min, aliquot the supernatant and store at -80 C."
      description: Populated notebook entry with record fields, quantities and bench evidence (85)
      synthetic: true
    - value: "Laboratory protocol LP-14\nProtocol version: 3.2\nApproved by: Dr Priya Ramanathan"
      description: Protocol header with version and approval fields only (75)
      synthetic: true
  should_not_match:
    - value: "unrelated generic text without domain phrases"
      description: No relevant topic phrases present
    - value: "placeholder value 12345"
      description: Random text should not match topic-specific regex
    - value: "student grant"
      description: Generic word pair from old broad template should not match
    - value: "Policy guidance: this procedure explains how laboratory protocol and lab notebook records are collected, stored and shared, who may access them and how long they are kept. Staff should read the privacy section before completing any form. It contains no details about any individual."
      description: Policy/guidance text naming the topic without any populated record (65 discovery at most)
    - value: "Lab notebook page\nExperiment ID: ____________________\nPerformed by: ____________________\nDate performed: ____________________\nSignature: ____________  Date: __/__/____"
      description: Blank form with unpopulated labelled fields (placeholder guard keeps it below 75)
    - value: "Training: this lab safety induction explains why every standard operating procedure must be read before using the centrifuge or autoclave."
      description: News/training prose about the topic without a populated record (65 discovery at most)
false_positives:
- description: Common words and phrases related to laboratory protocol records appearing in policy documents, training materials,
    HR templates, or compliance guidelines without actual personal data.
  mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather
    than general discussion.
- description: In English (as the primary international business language), similar terminology used in formal or administrative
    contexts (education, professional documentation) that does not constitute sensitive data collection.
  mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers
    to distinguish sensitive records from general references.
- description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is
    significantly higher than specific identifier patterns.
  mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary
    validation.
exports:
- purview_xml
- yaml
- regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_laboratory_protocol
      matches:
        - ref: Regex_global_top500_359_laboratory_protocol_records_record_fields
        - ref: Regex_global_top500_359_laboratory_protocol_records_quantities
        - ref: Keyword_global_top500_359_laboratory_protocol_records_bench_evidence
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_359_laboratory_protocol_records_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_laboratory_protocol
      matches:
        - ref: Regex_global_top500_359_laboratory_protocol_records_record_fields
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_global_top500_359_laboratory_protocol_records_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_laboratory_protocol
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_laboratory_protocol
      pattern: (?i)\b(?:laboratory\s+protocol|lab(?:oratory)?\s+notebook|experiment(?:al)?\s+log|reagent\s+preparation|lab\s+record|lab\s+procedure|standard\s+operating\s+procedure)\b
    - id: Regex_global_top500_359_laboratory_protocol_records_record_fields
      pattern: (?i)\b(?:(?:protocol|SOP|experiment|notebook|project|batch|lot|sample|run)\s*(?:no\.?|number|ID|ref)|protocol\s+version|version|(?:performed|recorded|approved|reviewed)\s+by|researcher|analyst|operator|date\s+performed)(?:[ \t]*\([^)\n]{1,20}\))?[ \t]*[:#][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<)[A-Z0-9][A-Za-z0-9/'.-]{0,30}(?:[ \t]+[A-Z0-9][A-Za-z0-9'-]{0,30}){0,3}
    - id: Regex_global_top500_359_laboratory_protocol_records_quantities
      pattern: (?i)\b\d{1,4}(?:\.\d{1,3})?[ \t]?(?:uL|mL|mg|ug|ng|mM|uM|nM|rpm|x[ \t]?g)\b
  keywords:
    - id: Keyword_global_top500_359_laboratory_protocol_records_bench_evidence
      groups:
        - match_style: word
          terms:
            - centrifuge
            - incubate
            - aliquot
            - buffer
            - text: PCR
              case_sensitive: true
            - pipette
            - vortex
            - supernatant
            - autoclave
      strength: specific
    - id: Keyword_global_top500_359_laboratory_protocol_records_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - these guidelines
            - frequently asked questions
            - media release
            - news release
            - training module
            - e-learning module
            - course outline
      strength: exclusion
risk_description: >-
  This concept regex flags laboratory protocol, lab notebook, experiment log and reagent preparation records and enforces only when populated protocol or experiment record fields sit nearby (with experimental quantities at 85). A match can signal an area of active research and may aid competitive reconnaissance, while replication or hazardous misuse still needs materials, quantities, conditions, controls, and results. The normal phrase therefore has bounded standalone value and does not itself expose a trade secret or dangerous method. Risk 5 and OFFICIAL are appropriate; a complete unpublished proprietary protocol, controlled biological method, or actionable hazardous procedure would raise the content to SENSITIVE.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Low
  rationale: >-
    Risk 5 corresponds to PSPF OFFICIAL, QGISCF OFFICIAL, DLM OFFICIAL, and Low for a broad laboratory-method reference.
    SENSITIVE is not met because the detector does not require reproducible steps, controlled materials, proprietary
    results, or a consequential research record.
  generic:
    classification: Low
    dlm: Low
    rationale: >-
      Low classification and Low DLM fit laboratory terminology whose material scientific, commercial, or safety impact
      depends on detailed protocol content.
