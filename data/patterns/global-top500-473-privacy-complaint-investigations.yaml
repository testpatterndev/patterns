schema: testpattern/v1
name: Privacy complaint investigations
slug: global-top500-473-privacy-complaint-investigations
version: 1.4.0
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Identifies documents containing references to privacy complaint investigations in international contexts. This information type is classified as personally identifiable information under applicable
  data protection regulations.
operation: >-
  Pattern type: regex (boost_regex engine). Regex uses structural anchors with proximity constraints to match domain-specific content. Corroborative evidence: 6 keywords within 300 characters. Uses
  additional domain-context evidence and explicit exclusion logic for template/sample/test text.
pattern: (?is)\b(privacy\s+complaint|complaint\s+investigation|investigation\s+findings|privacy\s+breach|regulatory\s+complaint|privacy\s+compliance|corrective\s+action|complaint\s+resolution)\b
confidence: medium
confidence_justification: category-aware structural regex with anchor and context constraints replaces phrase-only detection. Added context gating and exclusion rules improve precision and reduce incidental matches.
jurisdictions:
  - global
regulations:
  - GDPR
data_categories:
  - pii
corroborative_evidence:
  keywords:
    - privacy complaint investigations
    - privacy
    - complaint
    - investigations
    - compliance
    - risk
  proximity: 300
test_cases:
  should_match:
    - value: privacy complaint
      description: Primary topic phrase match
    - value: complaint investigation
      description: Case-insensitive topic phrase match
    - value: investigation findings
      description: Alternative topic phrase match
    - value: privacy breach
      description: Additional topic phrase match
    - value: |-
        Privacy complaint
        Name: Avery Teston
      description: Populated person/client record with one field (75 tier)
      synthetic: true
    - value: |-
        Privacy complaint
        Name: Avery Teston
        Date of birth: 14/02/1988
      description: Populated person/client record with 2 distinct fields (85 tier)
      synthetic: true
  should_not_match:
    - value: unrelated generic text without domain phrases
      description: No relevant topic phrases present
    - value: placeholder value 12345
      description: Random text should not match topic-specific regex
    - value: data inventory compliance
      description: Generic word pair from old broad template should not match
    - value: Privacy complaint investigations
      description: "Bare detector name: it reached 75 through the generated name-word tier and must not reach an enforcing tier"
    - value: |-
        Privacy complaint:
        Name:
        Date of birth:
      description: "Empty form: the heading and field labels without values must not corroborate themselves (discovery only)"
    - value: "Policy guidance: this procedure explains how records about privacy complaint are handled, who may access them and how long they are kept. It contains no records about any person or system."
      description: Policy guidance naming the topic without any record (discovery only)
false_positives:
  - description: Common words and phrases related to privacy complaint investigations appearing in policy documents, training materials, HR templates, or compliance guidelines without actual personal data.
    mitigation: Require corroborative evidence keywords within the proximity window to confirm sensitive data context rather than general discussion.
  - description: >-
      In English (as the primary international business language), similar terminology used in formal or administrative contexts (education, professional documentation) that does not constitute
      sensitive data collection.
    mitigation: Layer with additional contextual signals such as structured identifiers, form fields, or database column headers to distinguish sensitive records from general references.
  - description: High-frequency pattern matches in large document corpora due to broad regex anchors. Expected match rate is significantly higher than specific identifier patterns.
    mitigation: Tune confidence thresholds for bulk scanning. Consider using this pattern primarily as a pre-filter with secondary validation.
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_privacy_complaint
      matches:
        - ref: Regex_global_top500_473_privacy_complaint_investigations_record_structure
          min_count: 2
          unique_results: true
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 75
      id_match: Regex_privacy_complaint
      matches:
        - ref: Regex_global_top500_473_privacy_complaint_investigations_record_structure
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_privacy_complaint
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_privacy_complaint
      pattern: (?is)\b(privacy\s+complaint|complaint\s+investigation|investigation\s+findings|privacy\s+breach|regulatory\s+complaint|privacy\s+compliance|corrective\s+action|complaint\s+resolution)\b
    - id: Regex_global_top500_473_privacy_complaint_investigations_record_structure
      pattern: (?i)\b((?:name|full\s+name|surname|family\s+name|given\s+names?|date\s+of\s+birth|DOB|client|customer|applicant|claimant|tenant|household|resident|constituent|licensee|business\s+name|premises|CRN|ABN|(?:case|file|client|customer|application|reference|ref|claim|request|licence|permit|inspection|notice)\s*(?:no\.?|number|ID|#)|complainant|respondent|complaint\s*(?:ID|no\.?|number|#))(?:\s*\([^)]{1,20}\))?\s*[:#]\s*(?!(?:n/?a|name|full\s+name|given\s+names?|surname|first\s+name|last\s+name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|[A-Za-z][A-Za-z .'/-]{0,30}[:#])[A-Z0-9][A-Za-z0-9/'.@+-]*(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3})
risk_description: >-
  This regex recognizes privacy complaints, complaint investigations, findings, breaches, regulatory complaints, corrective action, compliance, and resolution rather than validating a live case file. A genuine investigation can contain a complainant's identity, disputed personal data, witness accounts, findings, and remedial decisions, exposing the person to further privacy harm or prejudicing the inquiry. The normal true-positive unit is one complaint and a small group of subjects, investigators, and respondents, while OAIC guidance, policies, and blank forms can match. Risk 8 and SENSITIVE reflect serious contained case harm; PROTECTED would require exceptional safety risks, bulk highly sensitive records, or significant irreversible consequences.
sensitivity_labels:
  pspf: "OFFICIAL: Sensitive"
  qgiscf: SENSITIVE
  qgiscf_dlm: SENSITIVE Personal-Privacy
  idcf: DSL-3
  idcf_marker: Personal Privacy
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: IN-CONFIDENCE
  ca_gov: Protected A
classification:
  tier: Medium
  rationale: >-
    Risk 8 maps to PSPF OFFICIAL: Sensitive, QGISCF SENSITIVE, SENSITIVE Personal-Privacy, and Medium because a
    completed investigation combines identities, disputed data, evidence, and findings. PROTECTED is not met for a
    normal one-complaint case without exceptional sensitivity, severe safety implications, or significant irreversible
    harm.
  generic:
    classification: Medium
    dlm: Medium Personal-Privacy
    rationale: >-
      Medium and Medium Personal-Privacy handling suit a privacy complaint file containing identifiable evidence and
      investigative outcomes. High is reserved for exceptional cases with severe or irreversible consequences.
frameworks:
  - ISO 27001
  - ISO 27701
created: '2026-02-08'
updated: '2026-10-30'
changelog:
  - version: 1.4.0
    date: '2026-10-30'
    description: 'Regex shape only: each regex now has one capturing group around the match it reports (our \b and lookaround boundaries stay outside it). Matching is unchanged; the aim is best-effort Copilot prompt blocking.'
  - version: 1.3.0
    date: '2026-10-20'
    description: 'Generated name-word tier removed: the 75 tier ANDed Pattern_*_label_context (the detector name, "Privacy complaint investigations") with Keyword_*_domain_context (its words), so the detector name next to any IdMatch phrase was enough for 75. Both lists sit inside the IdMatch phrase, so the bare name alone scored 75. Re-tiered in the #69 shape: 65 is the phrase alone (discovery only); 75 needs a populated person/client record field (Regex_global_top500_473_privacy_complaint_investigations_record_structure); 85 needs 2 distinct fields. Curated terms that sit inside an IdMatch hit were removed. "determination" and "remediation" are generic, and "complainant" / "respondent" without a value are not a record; those two are now populated-field labels. Added the bare name, an empty form and a policy-guidance text as should_not_match, and populated records reaching 75 and 85.'
  - version: 1.2.3
    date: '2026-09-25'
    description: >-
      Add the classification block (tier, rationale, generic classification/DLM/rationale). Text copied verbatim from the
      reviewed SIT-Reference master, which until now held it only in PurviewDeploy.
  - version: 1.2.2
    date: '2026-09-24'
    description: "Metadata quality pass (2026-09-24): added 1 verified legislation/regulator references; filled empty frameworks (ISO 27001, ISO 27701)."
  - version: 1.2.1
    date: '2026-07-14'
    description: 'v23 reviewed risk assessment: apply the individually reviewed workbook outcome from row 2013 without changing detector or package metadata.'
  - version: 1.2.0
    date: '2026-07-09'
    description: 'C1 verdict-model: add pattern_class: concept — classification-harness verdict class (concept patterns are scored as topic classifiers with decoy hits expected, not failed detectors; identifier/marking scoring unchanged); derived by scripts/derive-pattern-class.mjs + spot review'
  - version: 1.1.1
    date: '2026-07-09'
    description: 'Noise-gate sweep: remove dead shared_keywords import(s) data-record-context as Evidence_data_record_context, generic-data-labels as Evidence_generic_data_labels — declared but referenced by no tier, so the import only added dead weight to compiled purview.keywords (no behavior change)'
  - version: 1.1.0
    date: '2026-07-04'
    description: Mapped non-canonical confidence 80 to 75.; Collapsed 2 duplicate 75-confidence tier(s) into the strictest canonical tier.
