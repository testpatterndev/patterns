schema: testpattern/v1
name: Expense reimbursement claims
slug: global-top500-092-expense-reimbursement-claims
version: 1.5.1
type: regex
pattern_class: concept
engine: boost_regex
description: >-
  Detects employee expense reimbursement claims: expense claim forms, travel claims and acquittals, mileage and per diem claims and corporate card acquittals for an identified claimant, with itemised or total amounts.
operation: >-
  Primary: an expense claim phrase (expense reimbursement/claim form/report, reimbursement request, travel claim/acquittal, mileage claim, per diem claim, corporate card acquittal). Generic "fringe benefit", "corporate card", "travel allowance" and "per diem" alone were removed. 75 tier requires a populated claimant field (claimant, traveller, cardholder, employee/staff name or number) with a non-placeholder value within 300 characters. 85 tier additionally requires a populated expense line with a currency amount (total claimed, amount payable, airfare, accommodation, meals, taxi, parking, mileage, fuel, registration) and an independent corroborative term (receipt(s), tax invoice, cost centre, approved/approver, GST, business purpose). Enforce tiers exclude template/fixture text (template-exclusion) and policy, guidance, training and media-release framing; 65 is discovery-only (primary alone, template-excluded) and will surface policies, guidance, blank forms and statistics.
pattern: >-
  (?i)\b(?:expense\s+(?:reimbursement|claim)s?(?:\s+(?:forms?|reports?))?|reimbursement\s+(?:requests?|claims?)|travel\s+(?:expense\s+)?(?:claims?|acquittals?)|mileage\s+claims?|per\s+diem\s+claims?|expense\s+reports?|travel\s+allowance\s+claims?|corporate\s+card\s+(?:acquittals?|reconciliations?))\b
confidence: medium
confidence_justification: >-
  Medium: the primary phrases also appear in policies, guidance, blank forms and news, so enforce tiers require a populated field with a non-placeholder value and 85 adds a record-specific populated detail plus independent corroboration. Person and record values are customer-defined, so the field regexes use labelled loose values with a placeholder guard. 85/75 are heuristic evidence tiers, not measured accuracy.
jurisdictions:
  - global
regulations:
  - Fringe Benefits Tax Assessment Act 1986 (Cth)
  - Privacy Act 1988 (Cth)
  - Information Privacy Act 2009 (Qld)
  - GDPR
frameworks:
  - ISO 27001
  - ISO 27701
data_categories:
  - financial
  - employment
  - pii
corroborative_evidence:
  keywords:
    - receipt
    - receipts
    - tax invoice
    - cost centre
    - approved
    - approver
    - GST
    - business purpose
  proximity: 300
test_cases:
  should_match:
    - value: "Expense claim form\nClaimant: Avery Teston\nEmployee ID: 4471820\nCost centre: 4120\nAccommodation: $412.00\nTaxi: $58.40\nTotal claimed: $470.40\nReceipts attached; approved by Jordan Staffson."
      description: "85: expense claim with claimant, itemised amounts, receipts and approval"
      synthetic: true
    - value: "Travel acquittal - Brisbane to Cairns\nTraveller: Morgan Teston\nFlights: $389.00\nMeals: $96.50\nBusiness purpose: regional site inspection. GST included."
      description: "85: travel acquittal with traveller, flights and meals, business purpose"
      synthetic: true
    - value: "Reimbursement request from staff member: Casey Teston for the conference; details to follow."
      description: "75: reimbursement request naming the staff member, no amounts"
      synthetic: true
    - value: "expense claim"
      description: "65: bare phrase only - discovery tier"
      synthetic: true
  should_not_match:
    - value: "This policy sets out how staff submit an expense claim. Claims must include tax invoices and be approved by a delegate."
      description: "Expense policy - must stay at or below 65"
    - value: "Expense claim form\nClaimant: __________\nAccommodation: $______\nTotal claimed: $______"
      description: "Blank claim form - must stay at or below 65"
    - value: "Automate every expense report with our mobile app. Start a free trial today."
      description: "Software marketing - must stay at or below 65"
    - value: "unrelated generic text without domain phrases"
      description: "No relevant topic phrases present"
false_positives:
  - description: "Policies, procedures, regulator guidance, fact sheets and training material that name the record type."
    mitigation: "Enforce tiers require populated fields; guidance has labels without values, and policy/guidance/training/media-release framing is excluded by the NOT-group."
  - description: "Blank forms, templates and system configuration screens."
    mitigation: "Blank lines, bracket placeholders, XXX and n/a/tbc values are rejected by the placeholder guard; template/fixture words are excluded by template-exclusion."
  - description: "News, statistics and vendor marketing."
    mitigation: "No populated person or record fields, so these stay at 65 discovery."
  - description: "Supplier invoices and purchase orders that mention reimbursement."
    mitigation: "A named claimant field is required for 75; 85 needs itemised amounts plus corroboration."
exports:
  - purview_xml
  - yaml
  - regex_copy
scope: wide
purview:
  patterns_proximity: 300
  recommended_confidence: 75
  shared_keywords:
    - dict: template-exclusion
      as: Keyword_noise_exclusion
      match_style: word
  pattern_tiers:
    - confidence_level: 85
      id_match: Regex_top500_092_expense_reimbursement_claims_primary
      matches:
        - ref: Regex_top500_092_expense_reimbursement_claims_claimant_field
        - ref: Regex_top500_092_expense_reimbursement_claims_expense_line
        - ref: Keyword_top500_092_expense_reimbursement_claims_corroborative
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_092_expense_reimbursement_claims_guidance_exclusion
    - confidence_level: 75
      id_match: Regex_top500_092_expense_reimbursement_claims_primary
      matches:
        - ref: Regex_top500_092_expense_reimbursement_claims_claimant_field
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
            - Keyword_top500_092_expense_reimbursement_claims_guidance_exclusion
    - confidence_level: 65
      discovery_only: true
      id_match: Regex_top500_092_expense_reimbursement_claims_primary
      matches:
        - type: any
          min_matches: 0
          max_matches: 0
          refs:
            - Keyword_noise_exclusion
  regexes:
    - id: Regex_top500_092_expense_reimbursement_claims_primary
      pattern: >-
        (?i)\b(?:expense\s+(?:reimbursement|claim)s?(?:\s+(?:forms?|reports?))?|reimbursement\s+(?:requests?|claims?)|travel\s+(?:expense\s+)?(?:claims?|acquittals?)|mileage\s+claims?|per\s+diem\s+claims?|expense\s+reports?|travel\s+allowance\s+claims?|corporate\s+card\s+(?:acquittals?|reconciliations?))\b
    - id: Regex_top500_092_expense_reimbursement_claims_claimant_field
      pattern: >-
        (?i)\b(?:employee(?:\s+(?:full\s+)?(?:name|no\.?|number|ID|#))?|staff\s+(?:member|name|no\.?|number|ID)|payroll\s+(?:no\.?|number|ID)|position\s+(?:no\.?|number)|payee(?:\s+name)?|claimant(?:\s+name)?|traveller(?:\s+name)?|traveler(?:\s+name)?|cardholder(?:\s+name)?)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:#=][ \t]{0,3}(?!(?:n/?a|name|unknown|tbc|tba|withheld|not\s+recorded|the|a|an|any|all|each|see|refer)\b|_{2,}|\[|<|x{3,})[A-Z0-9][A-Za-z0-9/'.-]{1,40}(?:[ \t]+[A-Z][A-Za-z'-]{1,30}){0,3}
    - id: Regex_top500_092_expense_reimbursement_claims_expense_line
      pattern: >-
        (?i)\b(?:total\s+(?:claim(?:ed)?|amount|reimbursement|expenses?)|amount\s+(?:claimed|payable|to\s+be\s+reimbursed)|reimbursement\s+amount|airfares?|flights?|accommodation|meals?|taxi|parking|mileage|fuel|conference\s+(?:fee|registration)|registration\s+fee|car\s+hire)(?:[ \t]{0,3}\([^)\n]{1,20}\))?[ \t]{0,3}[:=\-]?[ \t]{0,3}-?(?:AUD|A\$|US\$|NZ\$|\$|£|€)[ \t]?\d{1,3}(?:,?\d{3}){0,3}(?:\.\d{2})?
  keywords:
    - id: Keyword_top500_092_expense_reimbursement_claims_corroborative
      groups:
        - match_style: word
          terms:
            - receipt
            - receipts
            - tax invoice
            - cost centre
            - approved
            - approver
            - text: GST
              case_sensitive: true
            - business purpose
      strength: specific
    - id: Keyword_top500_092_expense_reimbursement_claims_guidance_exclusion
      groups:
        - match_style: word
          terms:
            - this policy
            - this procedure
            - this guideline
            - this directive
            - fact sheet
            - training module
            - e-learning
            - learning module
            - frequently asked questions
            - media release
            - news release
            - policy statement
            - claims must
            - staff must
            - expense software
            - book a demo
            - free trial
      strength: domain
risk_description: >-
  The classifier identifies expense reimbursement claims for an identified claimant (75) with itemised or total amounts (85). Claims reveal travel movements, spending and occasionally medical or personal circumstances; misuse risk is modest. Policies, blank forms and marketing stay at 65. Risk 4 supports OFFICIAL.
sensitivity_labels:
  pspf: OFFICIAL
  qgiscf: OFFICIAL
  qgiscf_dlm: OFFICIAL
  us_gov: CUI
  uk_gov: OFFICIAL-SENSITIVE
  nz_gov: RESTRICTED
  ca_gov: Protected B
references:
  - title: "ATO - Fringe benefits tax"
    url: https://www.ato.gov.au/businesses-and-organisations/hiring-and-paying-your-workers/fringe-benefits-tax
  - title: "ATO - Record keeping for FBT"
    url: https://www.ato.gov.au/businesses-and-organisations/hiring-and-paying-your-workers/fringe-benefits-tax/fbt-registration-lodgment-payment-and-reporting/record-keeping-for-fbt
  - title: "Privacy Act 1988 (Cth)"
    url: https://www.legislation.gov.au/C2004A03712/latest/text
  - title: "Information Privacy Act 2009 (Qld)"
    url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-2009-014
