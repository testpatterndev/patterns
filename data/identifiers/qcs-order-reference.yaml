schema: testpattern/identifier-v1
key: qcs-order-reference
name: Queensland corrections order / parole reference
issuer: Queensland Corrective Services and Parole Board Queensland
description: >-
  Reference numbers on community corrections orders, parole orders and Parole Board Queensland decisions (amendment, suspension, cancellation).
appears_in:
  - Community corrections orders
  - Court ordered and board ordered parole orders
  - Parole Board Queensland decisions
labels:
  - Order number
  - Parole order number
  - PBQ reference
  - Reference
public_format:
  status: unpublished
  notes: >-
    No public format. The previous catalogue used an invented CCO-/PB-YYYY- format, which real documents do not contain.
fallback:
  pattern: (?i)\b(?:parole\s+order|community\s+(?:corrections|service)\s+order|PBQ|order)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*[A-Z0-9][A-Z0-9/-]{3,20}\b
  precision: low
  rationale: >-
    Anchored on the order-number labels used on corrections documents; the value shape is kept loose because no format is published.
  samples:
    - 'Parole order number: 2026-004471'
    - 'PBQ reference: PB26/0412'
replacement:
  customer_supplies:
    - A description of the order / parole reference format as issued by the customer's system (length, prefixes, separators, check digit if any).
    - The label text used on documents and exports (for example the exact field heading).
    - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
    - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
    - Collect the customer inputs listed above during the engagement discovery session.
    - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
    - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
    - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
    - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
    - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
    - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
    - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
    - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\b(?:PBQ|parole\s+order)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*\d{4}-\d{6}\b
    samples:
      - 'PBQ reference: 2026-004471'
      - Parole order number 2025-118273
      - PBQ ref 2026-000412
sensitivity: >-
  Links a named person to a custodial or community supervision decision.
