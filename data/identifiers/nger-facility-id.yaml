schema: testpattern/identifier-v1
key: nger-facility-id
name: NGER facility identification number
issuer: Clean Energy Regulator
description: Facility identification numbers used in NGER reports and Safeguard Mechanism records.
appears_in:
- NGER reports
- Safeguard baseline applications
labels:
- Facility ID
- Facility identification number
public_format:
  status: unpublished
  notes: The CER facility ID format is not published.
fallback:
  pattern: (?i)\b(?:facility\s+(?:ID|identification\s+number|no\.?|number))\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)[A-Z0-9][A-Z0-9/.-]{2,24}\b
  precision: low
  rationale: Facility labels are generic; NGER quantities and fields supply the precision.
  samples:
  - 'Facility ID: F20471'
  - 'Facility identification number: 104471'
replacement:
  customer_supplies:
  - A description of the facility ID format as issued by the customer's system (length, prefixes, separators, check digit if any).
  - The label text used on documents and exports (for example the exact field heading).
  - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
  - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
  - Collect the customer inputs listed above during the engagement discovery session.
  - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
  - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
  - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
  - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
  - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
  - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
  - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
  - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\bfacility\s+(?:ID|identification\s+number)\s*[:#]?\s*F\d{5}\b
    samples:
    - 'Facility ID: F20471'
    - facility identification number F00719
    - Facility ID F44718
sensitivity: Links emissions and energy data to a named facility before publication.
