schema: testpattern/identifier-v1
key: infringement-notice-number
name: Infringement notice number
issuer: Queensland Revenue Office / Department of Transport and Main Roads (camera-detected offences); issuing authorities for other penalty infringement notices
description: >-
  The number printed on a penalty infringement notice or camera-detected offence notice, used to look up, pay, transfer or dispute the notice and to register it with SPER.
appears_in:
  - Camera-detected offence notices
  - Penalty infringement notices
  - SPER enforcement orders and reminder notices
labels:
  - Infringement notice number
  - Notice number
  - Penalty infringement notice number
  - Camera detected offence notice number
public_format:
  status: unpublished
  notes: >-
    Queensland Revenue Office online services ask for the infringement notice number but do not publish its length or structure. The earlier catalogue used invented TIN-YYYY-XXX-NNNNNN and PIN-YYYY-NNNNNNN formats.
fallback:
  pattern: (?i)\b(?:(?:penalty\s+)?infringement\s+notice|camera[\s-]+detected\s+offence\s+notice|offence\s+notice|notice)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{5,20}\b
  precision: medium
  rationale: >-
    The notice-number label next to a value of at least seven characters containing a digit is a reasonable signal inside a traffic-camera record; the real format supplied by the issuing agency raises precision further.
  samples:
    - 'Infringement notice number: 2026084291'
    - Notice no. 7004418273
    - Penalty infringement notice ref 260057823
replacement:
  customer_supplies:
    - A description of the infringement notice number format as issued by the customer's system (length, prefixes, separators, check digit if any).
    - The label text used on documents and exports (for example the exact field heading).
    - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
    - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
    - Collect the customer inputs listed above during the engagement discovery session.
    - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
    - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
    - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
    - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
    - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
    - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
    - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
    - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\b(?:infringement\s+)?notice\s+(?:no\.?|number)\s*[:#]?\s*\d{10}\b
    samples:
      - 'Infringement notice number: 2026084291'
      - Notice no. 7004418273
      - notice number 1200004471
sensitivity: >-
  Links a vehicle and its registered operator or driver to an alleged offence, location and time.
