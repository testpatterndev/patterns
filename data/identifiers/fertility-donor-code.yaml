schema: testpattern/identifier-v1
key: fertility-donor-code
name: Fertility clinic donor code
issuer: Assisted reproductive technology (ART) providers
description: >-
  Codes that ART clinics assign to sperm, egg and embryo donors so that treatment records, offspring and donor-register entries can be linked without printing the donor's name.
appears_in:
  - Donor conception and treatment records
  - Donor matching reports
  - Donor conception information register applications
labels:
  - Donor code
  - Donor ID
  - Donor number
  - Egg / sperm donor code
public_format:
  status: customer-defined
  notes: >-
    Each ART provider uses its own donor coding; the Queensland donor conception information register does not publish a code format. The earlier catalogue used invented SD-/ED-NNNN and ART-YYYY-NNNNN formats.
fallback:
  pattern: (?i)\b(?:(?:sperm|egg|embryo|gamete)\s+)?donor\s+(?:code|ID|no\.?|number|ref(?:erence)?)\s*[:#]?\s*(?:[A-Z]{1,6}[/-]?)?\d[A-Z0-9/-]{1,20}\b
  precision: medium
  rationale: >-
    A donor-code label next to a digit-bearing value is rare outside donor conception records; the clinic's real code format removes the remaining ambiguity.
  samples:
    - 'Donor code: D4782'
    - Egg donor ID QFG-2917
    - Donor number 55104
replacement:
  customer_supplies:
    - A description of the donor code format as issued by the customer's system (length, prefixes, separators, check digit if any).
    - The label text used on documents and exports (for example the exact field heading).
    - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
    - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
    - Collect the customer inputs listed above during the engagement discovery session.
    - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
    - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
    - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
    - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
    - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
    - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
    - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
    - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\bdonor\s+code\s*[:#]?\s*[SE]D\d{4}\b
    samples:
      - 'Donor code: SD4782'
      - Donor code ED2917
      - 'donor code: ED5104'
sensitivity: >-
  Links a donor to recipients and donor-conceived people; the Assisted Reproductive Technology Act 2024 (Qld) restricts who may access donor identity information.
