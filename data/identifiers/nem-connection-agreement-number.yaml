schema: testpattern/identifier-v1
key: nem-connection-agreement-number
name: NEM connection agreement number
issuer: The network service provider (e.g. Powerlink, Energex, Ergon Energy) and connecting generator
description: Reference numbers for generator and large-load connection agreements between a network service provider and a connecting party in the National Electricity Market, printed on performance standards, data sheets and connection correspondence.
appears_in:
- Generator performance standards
- Power system design and setting data sheets
- Connection agreements and correspondence
labels:
- Connection agreement number
- Connection agreement no.
- Connection agreement reference
public_format:
  status: customer-defined
  notes: Set by each network service provider; no public format.
fallback:
  pattern: (?i)\bconnection\s+agreement\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)[A-Z0-9][A-Z0-9/-]{3,24}\b
  precision: medium
  rationale: The label is specific to NEM connections; plant fields and model parameters supply further precision.
  samples:
  - 'Connection agreement number: CA-2019-0448'
  - 'Connection agreement ref: PL/GEN/2047'
replacement:
  customer_supplies:
  - A description of the connection agreement number format as issued by the customer's system (length, prefixes, separators, check digit if any).
  - The label text used on documents and exports (for example the exact field heading).
  - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
  - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
  - Collect the customer inputs listed above during the engagement discovery session.
  - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
  - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
  - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
  - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
  - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
  - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
  - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
  - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\bconnection\s+agreement\s+(?:no\.?|number)\s*[:#]?\s*PL-GEN-\d{4}\b
    samples:
    - 'Connection agreement number: PL-GEN-0448'
    - connection agreement no. PL-GEN-2047
    - Connection Agreement Number PL-GEN-0071
sensitivity: Identifies a generating system connection and its confidential technical and commercial terms.
