schema: testpattern/identifier-v1
key: council-development-application-number
name: Council development / building application number
issuer: Queensland local governments (assessment managers) and private building certifiers
description: >-
  Application and approval numbers for development applications, building approvals, plumbing approvals and decision notices, issued by the assessment manager's planning system.
appears_in:
  - Decision notices and approval packages
  - Development and building application forms
  - Certifier approval records and inspection certificates
labels:
  - Application number
  - DA number
  - Development application number
  - Approval number
  - Decision notice number
public_format:
  status: customer-defined
  notes: >-
    Each council and certifier uses its own numbering (for example alphanumeric application IDs or type/year/sequence references); no state-wide format is published. The earlier catalogue used invented BA######## and DA/YYYY/NNNN formats.
fallback:
  pattern: (?i)\b(?:(?:development|building|planning|plumbing)\s+application|DA|BA|application|approval|permit|decision\s+notice)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*(?:[A-Z]{1,5}[/-]?)?\d[A-Z0-9/-]{3,20}\b
  precision: low
  rationale: >-
    Application and approval labels are generic, so the fallback only supports approval-record structure; a digit-bearing value is required so that guidance and blank forms do not match.
  samples:
    - 'Application number: A006123456'
    - DA number MCU/2026/0412
    - 'Approval number: 2026/1180'
replacement:
  customer_supplies:
    - A description of the development / building application number format as issued by the customer's system (length, prefixes, separators, check digit if any).
    - The label text used on documents and exports (for example the exact field heading).
    - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
    - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
    - Collect the customer inputs listed above during the engagement discovery session.
    - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
    - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
    - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
    - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
    - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
    - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
    - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
    - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\b(?:application|DA)\s+(?:no\.?|number)\s*[:#]?\s*A00\d{7}\b
    samples:
      - 'Application number: A006123456'
      - DA number A005998812
      - application no. A006000417
sensitivity: >-
  Links an approval record to a property and its owner or applicant; building approvals for sensitive facilities can reveal security layouts.
