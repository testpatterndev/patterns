schema: testpattern/identifier-v1
key: qcs-ioms-number
name: Queensland Corrective Services IOMS number
issuer: Queensland Corrective Services (Integrated Offender Management System)
description: >-
  Identifier for a prisoner or offender in QCS's Integrated Offender Management System (IOMS), used on custodial orders, parole, community corrections and Victims Register records. The public "Contact a prisoner" and prisoner search pages ask for the IOMS number.
appears_in:
  - QCS statutory orders (safety, maximum security, separate confinement, transfer)
  - Parole Board Queensland decisions and parole orders
  - Victims Register records
  - Prisoner correspondence and visits
labels:
  - IOMS number
  - IOMS No.
  - IOMS
public_format:
  status: unpublished
  notes: >-
    QCS publishes the label "IOMS number" but not the value format. The older Correctional Information System (CIS) number may appear in legacy records.
fallback:
  pattern: (?i)\bIOMS\s*(?:no\.?|number|#)?\s*[:#]?\s*[A-Z0-9][A-Z0-9-]{3,15}\b
  precision: medium
  rationale: >-
    The "IOMS" label is specific to Queensland corrections, so a labelled value is a strong record signal even without the value format; unlabelled IOMS numbers are not detected until the customer format is supplied.
  samples:
    - 'IOMS number: 4471820'
    - IOMS No. 5520117
replacement:
  customer_supplies:
    - A description of the IOMS number format as issued by the customer's system (length, prefixes, separators, check digit if any).
    - The label text used on documents and exports (for example the exact field heading).
    - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
    - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
    - Collect the customer inputs listed above during the engagement discovery session.
    - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
    - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
    - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
    - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
    - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
    - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
    - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
    - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\bIOMS\s*(?:no\.?|number)?\s*[:#]?\s*\d{7}\b
    samples:
      - 'IOMS number: 4471820'
      - IOMS 5520117
      - IOMS No. 0071932
sensitivity: >-
  Identifies a person as a prisoner or offender; combined with a victim record it links victim and offender.
