schema: testpattern/identifier-v1
key: cabinet-submission-number
name: Cabinet / CBRC submission number
issuer: Queensland Cabinet Secretariat (Department of the Premier and Cabinet)
description: >-
  Numbers assigned to Cabinet and Cabinet Budget Review Committee submissions and decisions on the submission cover sheet and decision record.
appears_in:
  - Cabinet and CBRC submissions
  - Cabinet decision records
  - Agency Cabinet liaison registers
labels:
  - Submission No.
  - CBRC Submission No.
  - Decision No.
public_format:
  status: unpublished
  notes: >-
    The Cabinet Handbook describes the CBRC lodgement process but not the numbering scheme. The earlier catalogue used an invented CBRC-NNNN format.
fallback:
  pattern: (?i)\b(?:(?:CBRC|Cabinet)\s+)?(?:submission|decision)\s+(?:no\.?|number)\s*[:#]?\s*\d[\d/-]{1,12}\b
  precision: low
  rationale: >-
    Parliamentary committees and public consultations also number submissions, so the fallback only corroborates a CBRC heading plus a Cabinet marking; it never enforces on its own.
  samples:
    - CBRC Submission No. 2026-0047
    - Cabinet decision number 4471
    - 'Submission No: 0089'
replacement:
  customer_supplies:
    - A description of the Cabinet submission number format as issued by the customer's system (length, prefixes, separators, check digit if any).
    - The label text used on documents and exports (for example the exact field heading).
    - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
    - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
    - Collect the customer inputs listed above during the engagement discovery session.
    - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
    - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
    - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
    - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
    - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
    - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
    - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
    - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\b(?:CBRC\s+)?submission\s+no\.?\s*[:#]?\s*\d{4}\b
    samples:
      - CBRC Submission No. 0047
      - 'Submission No: 0089'
      - submission no. 1180
sensitivity: >-
  Identifies a Cabinet-in-Confidence document; exposure can breach Cabinet confidentiality and pre-empt budget decisions.
