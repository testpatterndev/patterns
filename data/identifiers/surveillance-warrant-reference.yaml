schema: testpattern/identifier-v1
key: surveillance-warrant-reference
name: Surveillance device / warrant reference
issuer: Queensland law enforcement agencies and issuing courts
description: >-
  Reference numbers for surveillance device warrants, telecommunications interception and stored communications warrants, controlled operation authorities and related covert-powers authorisations referenced in operational documents.
appears_in:
  - Surveillance operation plans
  - Surveillance device warrant applications and reports
  - Telecommunications interception and stored communications warrants
  - Controlled operation and assumed identity authorities
labels:
  - Warrant number
  - Warrant reference
  - Surveillance device warrant
  - Authorisation number
public_format:
  status: unpublished
  notes: >-
    No public format. The previous catalogue used invented TSD-/LD-YYYY-, TIA/YYYY/AGENCY/NNNNN, SCW-YYYY- and COA-YYYY-AGENCY- formats.
fallback:
  pattern: (?i)\b(?:surveillance\s+device\s+warrant|warrant|authorisation)\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*[A-Z0-9][A-Z0-9/-]{3,20}\b
  precision: medium
  rationale: >-
    Warrant-number labels inside an operation plan are a strong signal; value formats vary by issuing court and agency.
  samples:
    - 'Warrant number: SDW-2026-0412'
    - Surveillance device warrant reference 26/4471
replacement:
  customer_supplies:
    - A description of the warrant reference format as issued by the customer's system (length, prefixes, separators, check digit if any).
    - The label text used on documents and exports (for example the exact field heading).
    - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
    - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
    - Collect the customer inputs listed above during the engagement discovery session.
    - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
    - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
    - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
    - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
    - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
    - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
    - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
    - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\bwarrant\s+(?:no\.?|number|ref(?:erence)?)\s*[:#]?\s*SDW\d{7}\b
    samples:
      - 'Warrant number: SDW2604471'
      - Warrant ref SDW2511827
      - Warrant no. SDW2600412
sensitivity: >-
  Reveals covert investigative activity; disclosure can endanger operations and people.
