schema: testpattern/identifier-v1
key: payment-authorisation-reference
name: Payment authorisation / release reference
issuer: The customer's finance system or banking platform (payment approval workflow, ABA batch release)
description: >-
  Tokens, codes and reference numbers that record the authorisation or release of a payment batch or single payment by a financial delegate.
appears_in:
  - Payment authorisation and release records
  - ABA / BECS batch approval files
  - Dual-authorisation audit logs
labels:
  - Payment token
  - Authorisation number
  - Approval reference
  - Release code
public_format:
  status: customer-defined
  notes: >-
    Authorisation references are generated by each finance system or bank platform; there is no public format. The earlier catalogue used an invented AUTH-YYYY-NNNNN format.
fallback:
  pattern: (?i)\b(?:payment\s+(?:token|authori[sz]ation\s+(?:code|no\.?|number|ref(?:erence)?))|(?:authori[sz]ation|approval|release)\s+(?:token|code|no\.?|number|ref(?:erence)?|ID))\s*[:#]?\s*(?:[A-Z]{1,6}[/-]?)?\d[A-Z0-9/-]{3,20}\b
  precision: low
  rationale: >-
    Authorisation labels also appear on unrelated approvals, so the fallback only counts next to bank account structure; the value must contain a digit.
  samples:
    - 'Payment token: PT88205531'
    - Approval reference 2026-0451-77
    - 'Release code: R7730192'
replacement:
  customer_supplies:
    - A description of the payment authorisation reference format as issued by the customer's system (length, prefixes, separators, check digit if any).
    - The label text used on documents and exports (for example the exact field heading).
    - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
    - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
    - Collect the customer inputs listed above during the engagement discovery session.
    - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
    - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
    - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
    - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
    - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
    - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
    - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
    - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\b(?:payment\s+token|release\s+code)\s*[:#]?\s*[A-Z]{2}\d{8}\b
    samples:
      - 'Payment token: PT88205531'
      - Release code RC20260451
      - 'payment token: PT00417712'
sensitivity: >-
  Together with account details, an authorisation reference can help an attacker replay or impersonate a payment release.
