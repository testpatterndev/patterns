schema: testpattern/identifier-v1
key: elector-identifying-number
name: Elector identifying number
issuer: Electoral Commission of Queensland / Australian Electoral Commission (joint roll)
description: The identifying number held for each elector on the Queensland electoral roll (Electoral Act 1992 (Qld) s 58(3)), which appears in restricted roll extracts, enrolment records and elector participation data.
appears_in:
- Electoral roll extracts provided to candidates, parties, MPs and councils
- Enrolment records
- Elector participation (s 133A) data
labels:
- Elector ID
- Elector number
- Elector identifying number
- Roll number
public_format:
  status: unpublished
  notes: Electoral Act 1992 (Qld) s 58(3) requires an identifying number on the roll, but its format was not verified from a primary source.
fallback:
  pattern: (?i)\b(?:elector\s+(?:ID|no\.?|number|identifying\s+number)|roll\s+(?:no\.?|number))\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)[A-Z0-9]*\d[A-Z0-9/.-]{1,24}\b
  precision: low
  rationale: Elector ID labels are specific to electoral records but the value format is unverified; name, address and restricted roll fields supply the precision.
  samples:
  - 'Elector ID: 20471820'
  - 'Roll number: 4471820'
replacement:
  customer_supplies:
  - A description of the elector identifying number format as issued by the customer's system (length, prefixes, separators, check digit if any).
  - The label text used on documents and exports (for example the exact field heading).
  - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
  - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
  - Collect the customer inputs listed above during the engagement discovery session.
  - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
  - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
  - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
  - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
  - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
  - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
  - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
  - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\belector\s+ID\s*[:#]?\s*E\d{8}\b
    samples:
    - 'Elector ID: E20471820'
    - Elector ID E00719320
    - elector id E44718201
sensitivity: Links an identifiable elector to their restricted roll details (DOB, sex, occupation, enrolment date).
