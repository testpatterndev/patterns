schema: testpattern/identifier-v1
key: asic-msic-card-number
name: ASIC / MSIC card number
issuer: The aviation or maritime security identification card issuing body
description: The unique number recorded for an Aviation Security Identification Card (ASIC) or Maritime Security Identification Card (MSIC) on the issuing body register and card records.
appears_in:
- Register of ASICs (ATSR reg 6.23)
- Register of MSICs (MTOFSR reg 6.08T)
- Card holder applications and cancellation records
labels:
- ASIC number
- MSIC number
- Card number
- Card unique number
public_format:
  status: unpublished
  notes: The regulations require a "unique number" but the card layout is approved privately per issuing body and its details may be protected from disclosure; no public format.
fallback:
  pattern: (?i)\b(?:ASIC|MSIC|card)\s+(?:unique\s+)?(?:number|no\.?|serial)\s*[:#]\s*(?!(?:n/?a|unknown|tbc|tba|withheld|not\s+recorded)\b|_{2,}|\[|<)[A-Z0-9][A-Z0-9-]{3,19}\b
  precision: medium
  rationale: The fallback anchors on the card label; the register structure (holder, card colour, dates, AusCheck outcome) supplies the precision.
  samples:
  - 'ASIC number: RA0448213'
  - 'MSIC number: M-2047181'
replacement:
  customer_supplies:
  - A description of the card number format as issued by the customer's system (length, prefixes, separators, check digit if any).
  - The label text used on documents and exports (for example the exact field heading).
  - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
  - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
  - Collect the customer inputs listed above during the engagement discovery session.
  - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
  - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
  - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
  - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
  - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
  - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
  - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
  - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\b(?:ASIC|MSIC)\s+(?:number|no\.?)\s*[:#]?\s*[A-Z]{2}\d{7}\b
    samples:
    - 'ASIC number: RA0448213'
    - MSIC number BW0071932
    - ASIC no. GR0552011
sensitivity: Identifies a security-cleared aviation or maritime worker and their access entitlements.
