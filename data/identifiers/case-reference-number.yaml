schema: testpattern/identifier-v1
key: case-reference-number
name: Agency case / file / matter number
issuer: The customer agency's case management or records system
description: >-
  Internal case, file or matter numbers from the customer's case management system, used across complaint, integrity and service records.
appears_in:
  - Integrity and complaint files
  - Human services case records
  - Incident and investigation records
  - Adoption, surrogacy and donor-conception case files
  - Law enforcement and intelligence investigation files
  - Crown Law / legal matter files
labels:
  - Case number
  - File number
  - Matter number
  - Reference number
public_format:
  status: customer-defined
  notes: >-
    Entirely customer-specific; no public format exists. Earlier catalogue versions of several classifiers used invented agency prefixes (ADO-, ARGOS-, CS-, CT-, CYBER-, ESC-, SUR-, ASA-, WP-, OCS/) that do not appear in any published source.
fallback:
  pattern: (?i)\b(?:case|file|matter|reference)\s+(?:no\.?|number|ID|#)\s*[:#]?\s*(?:[A-Z]{1,4}[/-]?)?\d[A-Z0-9/-]{3,20}\b
  precision: low
  rationale: >-
    Generic case labels are common, so the fallback only supports other evidence; the value must start with an optional short prefix followed by a digit, so label-only prose ("case number must be recorded") and blank forms do not match. The customer format raises precision substantially.
  samples:
    - 'Case number: HC20264471'
    - File number 2026/004471
    - Matter no. PL-2025-0847
replacement:
  customer_supplies:
    - A description of the case / file number format as issued by the customer's system (length, prefixes, separators, check digit if any).
    - The label text used on documents and exports (for example the exact field heading).
    - 5-10 masked or fictional sample values in the real format (never live values in the engagement record).
    - Whether the value always appears next to its label, or can also appear on its own (e.g. in spreadsheets).
  steps:
    - Collect the customer inputs listed above during the engagement discovery session.
    - Write a Boost-compatible regex for the value, anchored with \b and bounded quantifiers only (no nested or unbounded group quantifiers).
    - If the identifier is only reliable next to its label, keep the documented label prefix in the regex.
    - Record the regex and samples in the deployment overlay under this identifier key; the package builder applies it to every classifier slot that references this identifier (extend adds an alternative, replace swaps the regex).
    - Re-run the classifier test cases with the overlay applied and check at least one real (redacted) document before enabling enforcement.
  validation:
    - Every supplied sample matches the overlay regex; none of the classifier's should_not_match values do.
    - The regex passes the Purview-banned construct checks (scripts/lib/purview-banned.mjs) and compiles in Boost and JavaScript.
    - The regex does not match all-same-digit or obviously placeholder values (000000, 123456, XXXXXX).
    - Overlay values never appear in build logs or readiness output (counts and keys only).
  example_overlay:
    pattern: (?i)\b(?:case|file)\s+(?:no\.?|number)\s*[:#]?\s*[A-Z]{2}\d{8}\b
    samples:
      - 'Case number: HC20264471'
      - File no. PI20251827
      - Case number CR20260412
sensitivity: >-
  Links a person to the customer's case records; sensitivity follows the case type.
