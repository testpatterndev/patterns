schema: testpattern/v1
name: AI Threat Classifiers
slug: ai-threat-classifiers
description: >-
  Classifiers for attacks on and misuse of AI assistants and agents: prompt injection and goal hijacking,
  indirect injection hidden in documents, jailbreak personas, system prompt disclosure, RAG source and memory
  poisoning, risky MCP connectors, agent action misuse, data exfiltration markers, and sensitive data or secrets
  placed in prompts or returned in output. Each maps to the OWASP Top 10 for LLM Applications, the NIST AI RMF
  Generative AI Profile and MITRE ATLAS. The collection also includes the OpenAI, AWS access key and GCP API key
  detectors, because several AI classifiers rely on them to find credentials inside AI context.
jurisdictions: [global]
regulations: ['OWASP LLM Top 10 2025', 'NIST AI RMF GenAI Profile']
