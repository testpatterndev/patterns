schema: testpattern/v1
name: Australian Domestic and Family Violence Records
slug: au-domestic-family-violence
description: >-
  Classifiers for records that identify people affected by domestic and family violence, across
  all Australian jurisdictions and sectors: refuge and confidential addresses, protection orders
  and police directions, police incidents and referrals, criminal offence records, sexual assault counselling records, risk assessments and safety plans,
  case-record disclosures, and family and domestic violence leave. Every classifier requires a
  populated person, case or reference field before it enforces, so policy, guidance, statistics
  and blank forms stay at discovery level.
jurisdictions:
  - au
regulations:
  - DFV Protection Act 2012 (Qld)
  - Privacy Act 1988 (Cth)
  - Fair Work Act 2009 (Cth)
patterns:
  - au-dfv-confidential-address
  - au-dfv-risk-assessment
  - au-dfv-protection-order
