schema: testpattern/v1
name: Australian Public Sector Tuned Identifiers
slug: au-public-sector-tuned-identifiers
description: >-
  Australian public-sector identifier and payment classifiers tuned for precision: checksum-validated TFN,
  Medicare and IHI numbers, ABN, BSB and account references, Centrelink CRN, USI and driver licence numbers, and
  bulk payroll and superannuation files. Controls for phone-number overmatch and common test or sentinel values
  keep false positives down in government document stores.
