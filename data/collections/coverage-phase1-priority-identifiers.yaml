schema: testpattern/v1
name: Coverage Phase 1 Priority Identifiers
slug: coverage-phase1-priority-identifiers
description: >-
  High-value national, tax and financial identifiers for the UK, Canada, India, Singapore, China, Mexico,
  Indonesia, Brazil, Saudi Arabia, the Philippines and Vietnam, plus the global National Drug Code (NDC). Each
  classifier uses a Purview-safe regex with specific corroborative keywords, and carries a risk rating and
  sensitivity labels for Australian (PSPF / QGISCF), US, UK, NZ and Canadian schemes.
